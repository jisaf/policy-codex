id: CO-1007
name: "LEAP: is eligible"
identifier: leap_is_eligible
kind: derived
type: yes/no
scope: person-month
program: LEAP
role: outcome
meaning: Whether this person's LEAP household is eligible for a Heating Fuel Assistance Program payment for the month under 9 CCR 2503-7 3.752.2 - the month is within the November-April eligibility period, Colorado resident, at least one lawfully present household member, at or below the income limit, vulnerable to heating cost, and having a primary heating source.
precision: "Final pass F-12: the 3.754.1 factors for denial are read as follows - excess income (A, leap_income_within_limit), not vulnerable (B), no citizen or qualified alien member (C, leap_has_countable_household_member), a duplicate household or a member approved in another household (D, through leap_household_members, CO-1000, and leap_is_in_another_approved_household, CO-2100), benefits received from another county (F, leap_received_benefit_in_another_county, CO-3930), not a Colorado resident (H), an application outside the application period (J, leap_month_in_eligibility_period), a refused weatherization or CIP inspection (L, T, leap_has_denial_hold, CO-3928), a non-traditional dwelling or no primary heating source (P, R, has_primary_heating_source and the vulnerability test), the applicant's fraud conviction (U, leap_applicant_is_serving_fraud_penalty, CO-3929) and homelessness (W, the vulnerability test); each finding is read as false when not stated. The procedural factors (E withdrawn, G and V incomplete application or verification, I unsigned, K applicant not located, M to O identification and affidavit, Q not living at the address applied for, S a refused bulk delivery) are the county's case actions, reported by leap_verification_status (CO-1462) where they concern verification. Reads is_colorado_resident (CO-505, Medicaid's chapter) rather than a separate leap_meets_residency item: 3.753.21's Colorado-residency-with-intent-to-remain test and 10 CCR 2505-10 8.100.3.B's test derive identically (state_of_residence = colorado_state_code), and governance's dup.compact check flags an identical derivation as an error, not merely a warning, so this batch reuses the existing item and accepts the cross-program read rather than duplicating it (see the batch report). 3.751.1's Point in Time (S776) is applied: the residency, household, income, vulnerability and heating-source tests are evaluated in the month of leap_application_date (CO-2122), and the month evaluated must be in the eligibility period, in the same program year as the application and not before it, so a change after the application date does not change the result (OQ-137, resolved)."
open: []
derived: [all, leap_month_in_eligibility_period, [">=", [month], [month_of, leap_application_date]], ["=", leap_program_year_start_month, [at, leap_program_year_start_month, [month_of, leap_application_date]]], [at, [all, is_colorado_resident, leap_has_countable_household_member, leap_income_within_limit, leap_is_vulnerable_to_heating_cost, has_primary_heating_source], [month_of, leap_application_date]], [not, [otherwise, leap_has_denial_hold, false]], [not, [otherwise, leap_applicant_is_serving_fraud_penalty, false]], [not, [otherwise, leap_received_benefit_in_another_county, false]]]
sources: [S491, S495, S510, S776, S2715, S2716, S2717, S2718]
implemented: engine
tags: [household, income, immigration]
rationale: No existing item combines the LEAP eligibility checks into one outcome; this is the program's central eligibility outcome (declared under LEAP's outcomes in the report back).
tests:
  - {id: CO-1007-T1, as_of: "2026-12-01", month: "2026-12", given: {leap_application_date: "2026-12-01", state_of_residence: "CO", leap_has_countable_household_member: true, leap_income_within_limit: true, leap_is_vulnerable_to_heating_cost: true, has_primary_heating_source: true}, expect: true}
  - {id: CO-1007-T2, as_of: "2026-12-01", month: "2026-12", given: {leap_application_date: "2026-12-01", state_of_residence: "CO", leap_has_countable_household_member: true, leap_income_within_limit: false, leap_is_vulnerable_to_heating_cost: true, has_primary_heating_source: true}, expect: false}
  - {id: CO-1007-T3, as_of: "2026-12-01", month: "2026-12", given: {leap_application_date: "2026-12-01", state_of_residence: "CO", leap_has_countable_household_member: false, leap_income_within_limit: true, leap_is_vulnerable_to_heating_cost: true, has_primary_heating_source: true}, expect: false}
  - {id: CO-1007-T4, as_of: "2026-12-01", month: "2026-12", given: {leap_application_date: "2026-12-01", state_of_residence: "WY", leap_has_countable_household_member: true, leap_income_within_limit: true, leap_is_vulnerable_to_heating_cost: true, has_primary_heating_source: true}, expect: false}
  - {id: CO-1007-T5, as_of: "2026-10-01", month: "2026-10", given: {leap_application_date: "2026-10-01", state_of_residence: "CO", leap_has_countable_household_member: true, leap_income_within_limit: true, leap_is_vulnerable_to_heating_cost: true, has_primary_heating_source: true}, expect: false}
  # 3.751.1 Point in Time: a month of the season before the application was made.
  - {id: CO-1007-T6, as_of: "2026-12-01", month: "2026-11", given: {leap_application_date: "2026-12-05", state_of_residence: "CO", leap_has_countable_household_member: true, leap_income_within_limit: true, leap_is_vulnerable_to_heating_cost: true, has_primary_heating_source: true}, expect: false}
  # An application from the previous season does not carry into this one.
  - {id: CO-1007-T7, as_of: "2026-12-01", month: "2026-12", given: {leap_application_date: "2026-02-10", state_of_residence: "CO", leap_has_countable_household_member: true, leap_income_within_limit: true, leap_is_vulnerable_to_heating_cost: true, has_primary_heating_source: true}, expect: false}
  # A later month of the same season keeps the application-date determination, although income in March exceeds the limit.
  - {id: CO-1007-T8, as_of: "2027-03-01", month: "2027-03", given: {leap_application_date: "2026-11-20", state_of_residence: "CO", leap_has_countable_household_member: true, leap_income_within_limit: {"2026-11": true, "2027-03": false}, leap_is_vulnerable_to_heating_cost: true, has_primary_heating_source: true}, expect: true}
  # Final pass F-12 (3.754.1.F, L, T, U): each finding denies a household that meets every other test.
  - {id: CO-1007-T9, title: "A denial hold for a refused weatherization (3.752.26.B.1)", as_of: "2026-12-01", month: "2026-12", given: {leap_application_date: "2026-12-01", state_of_residence: "CO", leap_has_countable_household_member: true, leap_income_within_limit: true, leap_is_vulnerable_to_heating_cost: true, has_primary_heating_source: true, leap_has_denial_hold: true}, expect: false}
  - {id: CO-1007-T10, title: "The applicant is serving a fraud penalty (3.751.563)", as_of: "2026-12-01", month: "2026-12", given: {leap_application_date: "2026-12-01", state_of_residence: "CO", leap_has_countable_household_member: true, leap_income_within_limit: true, leap_is_vulnerable_to_heating_cost: true, has_primary_heating_source: true, leap_applicant_is_serving_fraud_penalty: true}, expect: false}
  - {id: CO-1007-T11, title: "Approved this program year in another county (3.756.17)", as_of: "2026-12-01", month: "2026-12", given: {leap_application_date: "2026-12-01", state_of_residence: "CO", leap_has_countable_household_member: true, leap_income_within_limit: true, leap_is_vulnerable_to_heating_cost: true, has_primary_heating_source: true, leap_received_benefit_in_another_county: true}, expect: false}
