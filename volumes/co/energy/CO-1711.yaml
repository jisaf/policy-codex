id: CO-1711
name: "LEAP: self-employment allowable costs"
identifier: leap_self_employment_allowable_costs
kind: derived
type: money
scope: person-month
program: LEAP
meaning: "The person's business-related expenses for the month supported by receipts that 9 CCR 2503-7 3.755.21.I allows as deductions from declared gross self-employment income: the cost records (earnings, CO-5100) whose kind LEAP's counting table deducts (leap_earnings_treatment_table, CO-5102: operating costs, interest and business mileage), paid in the month; nothing when receipts for the expenses have not been received (I.2: \"Receipts for business-related expenses are required in order to be considered as deductions\")."
precision: "Earned-income records, step E1 (LEAP): the costs are records of a cost kind, each deducted or not by its row (D4: no deduction by silence), replacing the cost facts CO-3370 to CO-3375 each read as 0 when not stated. Verification pass V-1: the costs are deducted only when receipts for them have been received (self_employment_cost_receipts_received, CO-3927, read as false when not stated, the reading I.2-3 gives: credit card and bank statements are not receipts); otherwise nothing is deducted and the records are not read. Coverage review 2 N-9: 3.755.21.I.2.D (S3596) limits a rental property's allowable expenses to \"the costs of maintenance of the property\"; for self-employment from rental property a case stated its maintenance costs as business_cost_operating and no interest or vehicle costs (a statement rule, withdrawn by KL-CE-1 below). KL-CE-1 (coverage pass 7, R7-3; docs/reviews/known-limits.md, 2026-11-24): the item reads I.2.D itself. A cost record says which business it is of by its job, the job its business's receipts record states (earnings, CO-5100), and whether it is the property's maintenance by property_maintenance; a cost of a business whose receipts record states rental_property true is deducted only when it is maintenance (and its kind's row deducts it), a cost of any other business as before. The records are read in this order: whether any of the person's business receipts records is rental property (rental_property, required there: decision 4), then the cost's business (its job), then property_maintenance, so a person with no rental property states neither a cost's job nor property_maintenance, and a non-maintenance cost of rental property needs only its business named. Before, LEAP did not read rental_property and deducted every cost record of a deducted kind, so a rental business whose mortgage interest was stated as a cost record had it deducted (probe LRB1: $3,300, eligible, where I.2.D gives $3,900, ineligible), and the statement rule conflicted with CCCAP's, which asked for the costs as rental_property_expenses_paid (probe LRB3). One rental property is now stated once for both programs; what LEAP reads as maintenance is OQ-1516. Capital principal, depreciation, home space and the cost of providing a boarder's room or meals are not deducted (rows for the owner's signature, docs/reviews/earnings-e0.md, section 7). Coverage pass 5, L5-1 (docs/reviews/coverage5-care-energy.md): a business's stream (a record with neither a month nor a date) is read only in a month its job dates cover, from the month of job_start_date through the month of job_end_date, so a business that began after the full month prior to the application, or ended before it, has no income in it (3.755.21.I.1 as amended effective November 1, 2026, S2719: \"total gross income received in the full month prior to the application date\")."
derived: ["case", [["otherwise", "self_employment_cost_receipts_received", false], ["sum_receipts", "earnings", ["all", ["=", ["lookup", "leap_earnings_treatment_table", ["receipt", "kind"]], "deducted"], ["all", ["received_in", ["month"]], ["any", ["not", ["unknown", ["receipt", "month"]]], ["all", ["any", ["unknown", ["receipt", "job_start_date"]], ["<=", ["month_of", ["receipt", "job_start_date"]], ["month"]]], ["any", ["unknown", ["receipt", "job_end_date"]], [">=", ["month_of", ["receipt", "job_end_date"]], ["month"]]]]]], ["any", ["not", ["all", [">", ["sum_receipts", ["of", ["owner"], "earnings"], ["all", ["=", ["receipt", "kind"], "self_employment_receipts"], ["receipt", "rental_property"]], 1], 0], ["case", [["=", ["receipt", "job"], "job_1"], [">", ["sum_receipts", ["of", ["owner"], "earnings"], ["all", ["=", ["receipt", "kind"], "self_employment_receipts"], ["=", ["receipt", "job"], "job_1"], ["receipt", "rental_property"]], 1], 0]], [["=", ["receipt", "job"], "job_2"], [">", ["sum_receipts", ["of", ["owner"], "earnings"], ["all", ["=", ["receipt", "kind"], "self_employment_receipts"], ["=", ["receipt", "job"], "job_2"], ["receipt", "rental_property"]], 1], 0]], [["=", ["receipt", "job"], "job_3"], [">", ["sum_receipts", ["of", ["owner"], "earnings"], ["all", ["=", ["receipt", "kind"], "self_employment_receipts"], ["=", ["receipt", "job"], "job_3"], ["receipt", "rental_property"]], 1], 0]], [["=", ["receipt", "job"], "job_4"], [">", ["sum_receipts", ["of", ["owner"], "earnings"], ["all", ["=", ["receipt", "kind"], "self_employment_receipts"], ["=", ["receipt", "job"], "job_4"], ["receipt", "rental_property"]], 1], 0]], [["=", ["receipt", "job"], "job_5"], [">", ["sum_receipts", ["of", ["owner"], "earnings"], ["all", ["=", ["receipt", "kind"], "self_employment_receipts"], ["=", ["receipt", "job"], "job_5"], ["receipt", "rental_property"]], 1], 0]], [["=", ["receipt", "job"], "job_6"], [">", ["sum_receipts", ["of", ["owner"], "earnings"], ["all", ["=", ["receipt", "kind"], "self_employment_receipts"], ["=", ["receipt", "job"], "job_6"], ["receipt", "rental_property"]], 1], 0]]]]], ["receipt", "property_maintenance"]]], ["receipt", "amount"]]], ["else", 0]]
sources: [S1084, S2719, S3596, S5351]
implemented: engine
tags: [income]
open: [OQ-614, OQ-1365, OQ-1516]
rationale: "Same-word audit SW-28, dual-entry audit 3.24 and 3.25: each program's excluded income and allowable business costs were program-prefixed supplied amounts, so one receipt or one set of business costs was entered once per program. The neutral fact describes the receipt or the cost; each program's exclusion or allowable cost is its own derived item citing its list (product-owner decision, convention rule 13). The ID and identifier are kept; the amount is now derived. Earned-income records, E1 (LEAP): the costs are earnings records of a cost kind, deducted by LEAP's counting table row."
tests:
  # Operating $400, interest $20 and vehicle $30 are deducted; capital principal $100 and home space $50 are not (CO-5102): $400 + $20 + $30 = $450.
  - {id: CO-1711-T1, month: "2026-10", as_of: "2026-10-01", given: {self_employment_cost_receipts_received: true, earnings: [{kind: self_employment_receipts, amount: 2000, rental_property: false}, {kind: business_cost_operating, amount: 400}, {kind: business_cost_interest, amount: 20}, {kind: business_cost_capital_principal, amount: 100}, {kind: business_cost_home_space, amount: 50}, {kind: business_cost_vehicle, amount: 30}]}, expect: 450}
  - {id: CO-1711-T2, title: "V-1: the same costs, claimed with only a bank statement: nothing is deducted (3.755.21.I.2-3)", month: "2026-10", as_of: "2026-10-01", given: {self_employment_cost_receipts_received: false, earnings: [{kind: self_employment_receipts, amount: 2000}, {kind: business_cost_operating, amount: 400}, {kind: business_cost_interest, amount: 20}, {kind: business_cost_vehicle, amount: 30}]}, expect: 0}
  - {id: CO-1711-T3, title: "V-1: receipts not stated: read as none", month: "2026-10", as_of: "2026-10-01", given: {earnings: [{kind: self_employment_receipts, amount: 2000}, {kind: business_cost_operating, amount: 400}]}, expect: 0}
  - {id: CO-1711-T4, title: "Costs paid in September are not October's", month: "2026-10", as_of: "2026-10-01", given: {self_employment_cost_receipts_received: true, earnings: [{kind: business_cost_operating, amount: 400, month: "2026-09"}, {kind: business_cost_vehicle, amount: 60, month: "2026-10"}]}, expect: 60}
  - {id: CO-1711-T5, title: "Receipts received, earnings not stated: cannot determine", month: "2026-10", as_of: "2026-10-01", given: {self_employment_cost_receipts_received: true}, expect: unknown}
  # Coverage pass 5 (docs/reviews/coverage5-care-energy.md), L5-1: the full month prior to an application of 2026-11-10 is October 2026 (3.755.21.I.1, OQ-681 (3)).
  - {"id": "CO-1711-T6", "title": "L5-1: $200 of receipted operating costs a month of a business that ended 2026-09-30, read for October: 0", "month": "2026-10", "as_of": "2026-11-10", "given": {"self_employment_cost_receipts_received": true, "earnings": [{"kind": "business_cost_operating", "amount": 200, "job_end_date": "2026-09-30"}]}, "expect": 0}
  # KL-CE-1 (2026-11-24): T1 states that the business is not rental property (rental_property false), which this item now reads before
  # a cost's business (decision 4); its value is unchanged. 9 CCR 2503-7 3.755.21.I.2.D (S3596): "Rental property allowable expenses
  # shall be limited to the costs of maintenance of the property". Probe LRB1 (docs/reviews/coverage7-care-energy.md, R7-3): a rental
  # business (job_1) with mortgage interest $600 (not maintenance) and repairs $100 (maintenance), receipted: only the $100 is deducted
  # (before KL-CE-1: 600 + 100 = 700, both kinds deducted by the table).
  - {id: CO-1711-T7, title: "KL-CE-1 (LRB1): a rental's interest $600 is not maintenance and is not deducted; its repairs $100 are: 100", month: "2026-10", as_of: "2026-11-10", given: {self_employment_cost_receipts_received: true, earnings: [{kind: self_employment_receipts, amount: 1500, hours: 40, rental_property: true, job: job_1}, {kind: business_cost_interest, amount: 600, job: job_1, property_maintenance: false}, {kind: business_cost_operating, amount: 100, job: job_1, property_maintenance: true}]}, expect: 100}
  # Maintenance of a rental of any deducted kind is deducted (mileage to make a repair, vehicle, $30); a maintenance payment of a kind the
  # table does not deduct is not (capital principal $200; CO-5102): 30.
  - {id: CO-1711-T8, title: "KL-CE-1: a rental's maintenance is deducted by its kind's row: vehicle $30 yes, capital principal $200 no: 30", month: "2026-10", as_of: "2026-11-10", given: {self_employment_cost_receipts_received: true, earnings: [{kind: self_employment_receipts, amount: 1500, hours: 40, rental_property: true, job: job_1}, {kind: business_cost_vehicle, amount: 30, job: job_1, property_maintenance: true}, {kind: business_cost_capital_principal, amount: 200, job: job_1, property_maintenance: true}]}, expect: 30}
  # A cleaning business (job_2, not rental) beside the rental (job_1): the cleaning business's interest $50 and operating $100 are
  # deducted as before, with no maintenance stated (not read for a business that is not rental property); the rental's interest $600 is
  # not maintenance: 50 + 100 = 150.
  - {id: CO-1711-T9, title: "KL-CE-1: a cleaning business's costs are deducted as before; the rental's interest is not: 150", month: "2026-10", as_of: "2026-11-10", given: {self_employment_cost_receipts_received: true, earnings: [{kind: self_employment_receipts, amount: 2000, hours: 100, rental_property: false, job: job_2}, {kind: business_cost_interest, amount: 50, job: job_2}, {kind: business_cost_operating, amount: 100, job: job_2}, {kind: self_employment_receipts, amount: 1500, hours: 40, rental_property: true, job: job_1}, {kind: business_cost_interest, amount: 600, job: job_1, property_maintenance: false}]}, expect: 150}
  # Decision 4: a cost of a rental property that does not say whether it is maintenance: cannot determine.
  - {id: CO-1711-T10, title: "KL-CE-1, decision 4: a rental's cost with property_maintenance not stated: cannot determine", month: "2026-10", as_of: "2026-11-10", given: {self_employment_cost_receipts_received: true, earnings: [{kind: self_employment_receipts, amount: 1500, hours: 40, rental_property: true, job: job_1}, {kind: business_cost_operating, amount: 100, job: job_1}]}, expect: unknown}
  # Decision 4: a person with rental property and a cost that is not maintenance and does not name its business: whether it is the
  # rental's (not deducted) or another business's (deducted) is not known: cannot determine.
  - {id: CO-1711-T11, title: "KL-CE-1, decision 4: rental property and a non-maintenance cost record with no job: cannot determine", month: "2026-10", as_of: "2026-11-10", given: {self_employment_cost_receipts_received: true, earnings: [{kind: self_employment_receipts, amount: 1500, hours: 40, rental_property: true, job: job_1}, {kind: business_cost_operating, amount: 100, property_maintenance: false}]}, expect: unknown}
  # An operating cost stated as maintenance is deducted whichever business it is of (the rental's maintenance under I.2.D, or another
  # business's cost by its row, CO-5102), so its business need not be known: 100.
  - {id: CO-1711-T13, title: "KL-CE-1: a maintenance cost with no job is deducted whichever business it is of: 100", month: "2026-10", as_of: "2026-11-10", given: {self_employment_cost_receipts_received: true, earnings: [{kind: self_employment_receipts, amount: 1500, hours: 40, rental_property: true, job: job_1}, {kind: business_cost_operating, amount: 100, property_maintenance: true}]}, expect: 100}
  # Decision 4: a business that does not say whether it is rental property, with a receipted cost: cannot determine (I.2.D may apply).
  - {id: CO-1711-T12, title: "KL-CE-1, decision 4: a business with rental_property not stated and a receipted cost: cannot determine", month: "2026-10", as_of: "2026-11-10", given: {self_employment_cost_receipts_received: true, earnings: [{kind: self_employment_receipts, amount: 1500}, {kind: business_cost_operating, amount: 100}]}, expect: unknown}
