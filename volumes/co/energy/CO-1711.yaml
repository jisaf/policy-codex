id: CO-1711
name: "LEAP: self-employment allowable costs"
identifier: leap_self_employment_allowable_costs
kind: derived
type: money
scope: person-month
program: LEAP
meaning: "The person's business-related expenses for the month supported by receipts that 9 CCR 2503-7 3.755.21.I allows as deductions from declared gross self-employment income: the cost records (earnings, CO-5100) whose kind LEAP's counting table deducts (leap_earnings_treatment_table, CO-5102: operating costs, interest and business mileage), paid in the month; nothing when receipts for the expenses have not been received (I.2: \"Receipts for business-related expenses are required in order to be considered as deductions\")."
precision: "Earned-income records, step E1 (LEAP): the costs are records of a cost kind, each deducted or not by its row (D4: no deduction by silence), replacing the cost facts CO-3370 to CO-3375 each read as 0 when not stated. Verification pass V-1: the costs are deducted only when receipts for them have been received (self_employment_cost_receipts_received, CO-3927, read as false when not stated, the reading I.2-3 gives: credit card and bank statements are not receipts); otherwise nothing is deducted and the records are not read. Coverage review 2 N-9: 3.755.21.I.2.D (S3596) limits a rental property's allowable expenses to \"the costs of maintenance of the property\"; for self-employment from rental property a case states its maintenance costs as business_cost_operating and no interest or vehicle costs. Capital principal, depreciation, home space and the cost of providing a boarder's room or meals are not deducted (rows for the owner's signature, docs/reviews/earnings-e0.md, section 7)."
derived: [case, [[otherwise, self_employment_cost_receipts_received, false], [sum_receipts, earnings, [all, ["=", [lookup, leap_earnings_treatment_table, [receipt, kind]], deducted], [received_in, [month]]], [receipt, amount]]], [else, 0]]
sources: [S1084, S2719, S3596]
implemented: engine
tags: [income]
open: [OQ-614]
rationale: "Same-word audit SW-28, dual-entry audit 3.24 and 3.25: each program's excluded income and allowable business costs were program-prefixed supplied amounts, so one receipt or one set of business costs was entered once per program. The neutral fact describes the receipt or the cost; each program's exclusion or allowable cost is its own derived item citing its list (product-owner decision, convention rule 13). The ID and identifier are kept; the amount is now derived. Earned-income records, E1 (LEAP): the costs are earnings records of a cost kind, deducted by LEAP's counting table row."
tests:
  # Operating $400, interest $20 and vehicle $30 are deducted; capital principal $100 and home space $50 are not (CO-5102): $400 + $20 + $30 = $450.
  - {id: CO-1711-T1, month: "2026-10", as_of: "2026-10-01", given: {self_employment_cost_receipts_received: true, earnings: [{kind: self_employment_receipts, amount: 2000}, {kind: business_cost_operating, amount: 400}, {kind: business_cost_interest, amount: 20}, {kind: business_cost_capital_principal, amount: 100}, {kind: business_cost_home_space, amount: 50}, {kind: business_cost_vehicle, amount: 30}]}, expect: 450}
  - {id: CO-1711-T2, title: "V-1: the same costs, claimed with only a bank statement: nothing is deducted (3.755.21.I.2-3)", month: "2026-10", as_of: "2026-10-01", given: {self_employment_cost_receipts_received: false, earnings: [{kind: self_employment_receipts, amount: 2000}, {kind: business_cost_operating, amount: 400}, {kind: business_cost_interest, amount: 20}, {kind: business_cost_vehicle, amount: 30}]}, expect: 0}
  - {id: CO-1711-T3, title: "V-1: receipts not stated: read as none", month: "2026-10", as_of: "2026-10-01", given: {earnings: [{kind: self_employment_receipts, amount: 2000}, {kind: business_cost_operating, amount: 400}]}, expect: 0}
  - {id: CO-1711-T4, title: "Costs paid in September are not October's", month: "2026-10", as_of: "2026-10-01", given: {self_employment_cost_receipts_received: true, earnings: [{kind: business_cost_operating, amount: 400, month: "2026-09"}, {kind: business_cost_vehicle, amount: 60, month: "2026-10"}]}, expect: 60}
  - {id: CO-1711-T5, title: "Receipts received, earnings not stated: cannot determine", month: "2026-10", as_of: "2026-10-01", given: {self_employment_cost_receipts_received: true}, expect: unknown}
