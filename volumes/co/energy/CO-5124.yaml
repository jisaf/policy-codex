rationale: "Earned-income records, E1 (LEAP): a boarder's payment is one kind of earnings record whatever it pays for, so LEAP counts room and board as it already counted room only and board only (3.752.21's payments from any other source), once."
tests:
  - {id: CO-5124-T1, title: "$600 a month for room and board from a lodger", as_of: "2026-11-10", month: "2026-11", given: {earnings: [{kind: boarder_payments, amount: 600, provides: room_and_board}]}, expect: 600}
  # $300 for meals only and $200 for a room only: $300 + $200 = $500.
  - {id: CO-5124-T2, title: "Board only and room only: both counted", as_of: "2026-11-10", month: "2026-11", given: {earnings: [{kind: boarder_payments, amount: 300, provides: board_only}, {kind: boarder_payments, amount: 200, provides: room_only}]}, expect: 500}
  - {id: CO-5124-T3, title: "No boarders: none", as_of: "2026-11-10", month: "2026-11", given: {earnings: [{kind: wages, amount: 2000}]}, expect: 0}
  # Application November 10 (period October 10 to November 10): a payment of $400 received once on October 20: $400.
  - {id: CO-5124-T4, title: "A boarder's one-time payment received in the income verification period", as_of: "2026-11-10", month: "2026-11", given: {leap_application_date: "2026-11-10", earnings: [{kind: boarder_payments, amount: 400, frequency: once, date: "2026-10-20", provides: room_only}]}, expect: 400}
  - {id: CO-5124-T5, title: "Earnings not stated: cannot determine", as_of: "2026-11-10", month: "2026-11", given: {}, expect: unknown}
  # Coverage pass 4 L4-3: a lodger pays $450 a month for a room, dated October 25 (in the period, after October 10 through November 10) and
  # November 25 (after the application date): $450.
  - {id: CO-5124-T6, title: "A boarder's dated monthly payments read in the income verification period", as_of: "2026-11-10", month: "2026-11", given: {leap_application_date: "2026-11-10", earnings: [{kind: boarder_payments, amount: 450, frequency: monthly, date: "2026-10-25", provides: room_only, boarders: 1}, {kind: boarder_payments, amount: 450, frequency: monthly, date: "2026-11-25", provides: room_only, boarders: 1}]}, expect: 450}
  # Coverage pass 5 (docs/reviews/coverage5-care-energy.md), L5-1: application 2026-11-10, so the income verification period runs after 2026-10-10 through 2026-11-10 (CO-5002, OQ-681 (4)).
  - {"id": "CO-5124-T7", "title": "L5-1: a boarder's $600 a month as a stream whose job_end_date is 2026-09-30: 0", "month": "2026-11", "as_of": "2026-11-10", "given": {"leap_application_date": "2026-11-10", "earnings": [{"kind": "boarder_payments", "amount": 600, "provides": "room_and_board", "boarders": 1, "job_end_date": "2026-09-30"}]}, "expect": 0}
  - {"id": "CO-5124-T8", "title": "Field sweep: a boarder's $600 a month, $100 of it set aside under an approved PASS (DD): 600 - 100 = 500", "month": "2026-11", "as_of": "2026-11-10", "given": {"earnings": [{"kind": "boarder_payments", "amount": 600, "provides": "room_and_board", "boarders": 1, "pass_set_aside": 100}]}, "expect": 500}
