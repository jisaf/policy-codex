id: CO-5124
name: "LEAP: a person's payments from boarders"
identifier: leap_boarder_payments
kind: derived
type: money
scope: person-month
program: LEAP
meaning: "The payments the person receives from persons who pay to live, or to take regular meals, in the person's home (earnings records, CO-5100, of kind boarder_payments, room and board, room only or board only), which LEAP counts as unearned income: 9 CCR 2503-7 3.752.21 (S4100) counts \"payments from any other source, which is considered to be a gain or benefit to the applicant or recipient\", and no paragraph of 3.752.23 excludes them. Like LEAP's other unearned income (3.752.22.A), a recurring payment is counted at its amount in the month determined, and a payment received once when it is received in the income verification period."
precision: "Earned-income records, step E1 (LEAP; docs/reviews/records-earnings-care-energy.md, finding E1-L2). Before the records LEAP counted a boarder's payment for a room only or for meals only (the board_only_payment and room_only_payment receipts, leap_receipt_treatment_table, CO-5001, counted because no rule excludes them) and did not read a payment for room and board (room_and_board_payments_received, CO-4161), which 3.752.21 counts the same way; the earnings records state all three as boarder_payments, and the receipt rows read none (counted_in_earnings). The gross payment is counted: no LEAP text deducts the cost of providing the room or meals (business_cost_boarder_provision is not deducted, a row for the owner's signature). A payment received once is placed by its date in the period from leap_income_verification_period_start (CO-5002) through the application date; without its date it cannot be placed. Coverage pass 4 L4-3 (docs/reviews/coverage4-care-energy.md): a recurring receipt stated with its date is read by its date in the income verification period (9 CCR 2503-7 3.752.22.A: \"received in the income verification period, not to exceed one month's income\"; C.3.a, C.3.c), after the period's first day (leap_income_verification_period_start, CO-5002) through the application date (leap_application_date), not by the calendar month: the period is then one month long, so a monthly source paid on the application date's day of the month is counted once (the cap of A; OQ-681); a receipt stated without a date is read in the month, as before."
derived: ["sum_receipts", "earnings", ["all", ["=", ["lookup", "leap_earnings_treatment_table", ["receipt", "kind"]], "counted_as_unearned_income"], ["case", [["=", ["receipt", "frequency"], "once"], ["all", [">=", ["receipt", "date"], "leap_income_verification_period_start"], ["<=", ["receipt", "date"], "leap_application_date"]]], ["else", ["case", [["unknown", ["receipt", "date"]], ["received_in", ["month"]]], ["else", ["all", [">", ["receipt", "date"], "leap_income_verification_period_start"], ["<=", ["receipt", "date"], "leap_application_date"]]]]]]], ["receipt", "amount"]]
sources: [S4100, S2712, S2713]
implemented: engine
tags: [income]
open: [OQ-1162, OQ-681]
rationale: "Earned-income records, E1 (LEAP): a boarder's payment is one kind of earnings record whatever it pays for, so LEAP counts room and board as it already counted room only and board only (3.752.21's payments from any other source), once."
tests:
  - {id: CO-5124-T1, title: "$600 a month for room and board from a lodger", as_of: "2026-11-10", month: "2026-11", given: {earnings: [{kind: boarder_payments, amount: 600, provides: room_and_board}]}, expect: 600}
  # $300 for meals only and $200 for a room only: $300 + $200 = $500.
  - {id: CO-5124-T2, title: "Board only and room only: both counted", as_of: "2026-11-10", month: "2026-11", given: {earnings: [{kind: boarder_payments, amount: 300, provides: board_only}, {kind: boarder_payments, amount: 200, provides: room_only}]}, expect: 500}
  - {id: CO-5124-T3, title: "No boarders: none", as_of: "2026-11-10", month: "2026-11", given: {earnings: [{kind: wages, amount: 2000}]}, expect: 0}
  # Application November 10 (period October 10 to November 10): a payment of $400 received once on October 20: $400.
  - {id: CO-5124-T4, title: "A boarder's one-time payment received in the income verification period", as_of: "2026-11-10", month: "2026-11", given: {leap_application_date: "2026-11-10", earnings: [{kind: boarder_payments, amount: 400, frequency: once, date: "2026-10-20", provides: room_only}]}, expect: 400}
  - {id: CO-5124-T5, title: "Earnings not stated: cannot determine", as_of: "2026-11-10", month: "2026-11", given: {}, expect: unknown}
  # Coverage pass 4 L4-3: a lodger pays $450 a month for a room, dated October 25 (in the period, after October 10 through November 10) and
  # November 25 (after the application date): $450.
  - {id: CO-5124-T6, title: "A boarder's dated monthly payments read in the income verification period", as_of: "2026-11-10", month: "2026-11", given: {leap_application_date: "2026-11-10", earnings: [{kind: boarder_payments, amount: 450, frequency: monthly, date: "2026-10-25", provides: room_only, boarders: 1}, {kind: boarder_payments, amount: 450, frequency: monthly, date: "2026-11-25", provides: room_only, boarders: 1}]}, expect: 450}
