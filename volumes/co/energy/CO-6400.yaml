id: CO-6400
name: "LEAP: age on the application date"
identifier: leap_age_on_application_date
kind: derived
type: whole number
scope: person
program: LEAP
meaning: "The person's whole number of completed years of age on the LEAP application date (leap_application_date): 9 CCR 2503-7 3.752.2 (S4600) considers household composition and income \"as of the date of application\", and 3.751.1 defines the point in time as \"the circumstances of the household on the date of the application, regardless of any changes thereafter\". Every LEAP test of an age (a child under eighteen in the household, 3.751.2.D.2; a child's earnings, 3.752.23.Q; the Senior Community Service Employment Program age, 3.752.23.CC; an adult's zero income and the verification counts) reads this age, not the age on the date the county determines eligibility."
precision: "Whole years from date_of_birth to leap_application_date; a birthday on the application date counts as reached, as for age (CO-300). Coverage pass 4 L4-4 (docs/reviews/coverage4-care-energy.md): age (CO-300) is the age on the determination date (time contract month-v1), so a child who turned eighteen between the application and the determination left the household or had his earnings counted (household A1, stored as CO-714). An application date not stated is cannot determine."
derived: [years_between, date_of_birth, leap_application_date]
sources: [S4600, S2712]
implemented: engine
tags: [age, household]
rationale: "Coverage pass 4 L4-4: LEAP fixes the household's circumstances on the application date (3.752.2, 3.751.1 \"Point in Time\"); an age taken on the determination date makes the answer turn on when the county acts. A program's own age item, as Medicaid reads an age in a month (docs/operators.md, Ages in a month)."
tests:
  # Born 2008-11-15: seventeen on the application date 2026-11-10 (the birthday five days later), though eighteen on the determination date 2026-11-20.
  - {id: CO-6400-T1, title: "Seventeen on the application date, eighteen when determined: 17", as_of: "2026-11-20", given: {date_of_birth: "2008-11-15", leap_application_date: "2026-11-10"}, expect: 17}
  # Born 2008-11-10: the eighteenth birthday is the application date itself, which counts as reached: 18.
  - {id: CO-6400-T2, title: "A birthday on the application date counts: 18", as_of: "2026-11-20", given: {date_of_birth: "2008-11-10", leap_application_date: "2026-11-10"}, expect: 18}
  - {id: CO-6400-T3, title: "Application date not stated: cannot determine", as_of: "2026-11-20", given: {date_of_birth: "2008-11-15"}, expect: unknown}
