id: CO-1694
name: "LEAP: member excluded for verification"
identifier: leap_member_is_excluded_for_verification
kind: derived
type: yes/no
scope: person
program: LEAP
role: outcome
meaning: Whether a person who meets LEAP's citizenship requirement as declared is nevertheless left out of the household (with the person's income still counted) because no SSN or proof of application has been provided, or the declared immigration status has not been verified through SAVE.
precision: "leap_household_members (CO-1000) leaves such a member out, so leap_household_size and the benefit count the household without the member while leap_household_income (CO-1002) still counts the member's income (OQ-370, resolved). 3.753.17.A (S1401) lists \"An alien with no status verification\" among those not eligible, which is the status arm."
derived: [all, leap_meets_citizenship_requirement, [any, [not, ssn_is_verified], [all, claims_lawful_immigration_status, [not, immigration_status_verified_by_electronic_data_source]]]]
sources: [S893, S494, S896, S1401]
implemented: engine
tags: [verification, household]
rationale: "Review C-1 and OQ-318: 3.751.1 B excludes a member with no SSN (and 3.753.17 a member who does not show the status requirement) rather than counting a missing document against the household; this outcome names the excluded member."
tests:
  - {id: CO-1694-T1, as_of: "2026-10-01", given: {immigration_status: us_citizen, ssn_verified_by_electronic_data_source: false, ssn_furnished_or_application_shown: false}, expect: true}
  - {id: CO-1694-T2, as_of: "2026-10-01", given: {immigration_status: lawful_permanent_resident, ssn_verified_by_electronic_data_source: true, immigration_status_verified_by_electronic_data_source: false}, expect: true}
  - {id: CO-1694-T3, as_of: "2026-10-01", given: {immigration_status: us_citizen, ssn_verified_by_electronic_data_source: true}, expect: false}
  - {id: CO-1694-T4, as_of: "2026-10-01", given: {immigration_status: undocumented}, expect: false}
