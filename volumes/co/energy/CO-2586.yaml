id: CO-2586
name: "LEAP: verification applies to this person"
identifier: leap_verification_is_applicable
kind: derived
type: yes/no
scope: person-month
program: LEAP
meaning: "LEAP verification applies to this person: the person's LEAP household has a member who meets the citizenship requirement, has a primary heating source, and is not homeless or living in a non-traditional dwelling, the two conditions on which LEAP denies the household whatever its documents show. For anyone else LEAP's verification status is not_applicable and no LEAP element is pending."
precision: "The test that leap_verification_status (CO-1462) used for its not_applicable branch, made its own item so that every LEAP pending element and count reads it: an element is pending only where verification applies (county case worker review B2). Final verification review V-17 (P3, fixed in the second-pass round): a household with no primary heating source (has_primary_heating_source, read as true when not stated) or that is homeless or in a non-traditional dwelling (leap_is_homeless_or_in_non_traditional_dwelling, CO-2815, read as false when not stated; 3.752.25.B.6) is not vulnerable and is denied (leap_is_eligible, CO-1007), so nothing is asked of it, as review C-4 gated the other programs."
derived: [all, [exists, leap_household_members_for_income, [of, [P], leap_meets_citizenship_requirement]], [otherwise, has_primary_heating_source, true], [not, [otherwise, leap_is_homeless_or_in_non_traditional_dwelling, false]]]
sources: [S893, S899, S494, S489, S774]
implemented: engine
tags: [verification]
rationale: "County case worker review B2: LEAP pending flags and counts were non-zero for people whose LEAP verification status is not_applicable, so a checklist built from the flags asked for documents a program cannot use."
nearest: [CO-1462]
tests:
  - {id: CO-2586-T1, title: "A household whose only member is undocumented", as_of: "2026-10-01", month: "2026-10", given: {leap_household_members_for_income: [p1], leap_meets_citizenship_requirement: false}, expect: false}
  - {id: CO-2586-T2, as_of: "2026-10-01", month: "2026-10", given: {leap_household_members_for_income: [p1], leap_meets_citizenship_requirement: true, has_primary_heating_source: true, nighttime_residence_type: fixed_regular_adequate}, expect: true}
  - {id: CO-2586-T3, title: "V-17: a homeless household with no primary heating source", as_of: "2026-10-01", month: "2026-10", given: {leap_household_members_for_income: [p1], leap_meets_citizenship_requirement: true, has_primary_heating_source: false, nighttime_residence_type: emergency_or_transitional_shelter}, expect: false}
