id: CO-4518
name: "LEAP: a public assistance household"
identifier: leap_is_public_assistance_household
kind: derived
type: yes/no
scope: person-month
program: LEAP
meaning: "Whether this person's LEAP household is a public assistance household whose application 9 CCR 2503-7 3.752.1 accepts before November 1 (\"public assistance households (such as Colorado Works, Old Age Pension (OAP), Aid to the Needy Disabled (AND), Aid to the Blind (AB), and Supplemental Social Security Disability Benefits.)\"): a member of the household receives Colorado Works basic cash assistance, an Adult Financial grant (Old Age Pension or Aid to the Needy Disabled), Supplemental Security Income, or Social Security disability insurance benefits on the member's own record."
precision: "Reads the members of leap_household_members_for_income (CO-1009, the economic unit, a member excluded for status included, since the list names the household's receipt) and their receipt records: receives_tanf_cash (CO-013), an Adult Financial grant received in the month (a receipt of kind adult_financial_cash, other than a retroactive lump sum; receipts, CO-5000), receives_ssi (CO-012) and title_ii_benefit_type own_disability (CO-2821). The Adult Financial grant is read from the member's receipts with no default: 3.752.1 names the households and gives no reading for a grant not reported (decision 4 of 2026-11-23 (docs/plan-colorado.md): missing information is cannot determine unless the rule says otherwise; the phase-1 default of 0 is removed), so a member whose receipts are not stated and who meets none of the other tests leaves the household cannot determine; a stated empty list is no grant. leap_is_eligible (CO-1007) reads it in the month of the application date. OQ-800: \"Supplemental Social Security Disability Benefits\" is read as both SSI and SSDI; Aid to the Blind has no receipt fact of its own in this volume (adult_financial_cash_income names OAP and AND), and Non-Categorical Refugee Assistance, which 3.751.1's \"Public Assistance Income\" lists but 3.752.1 does not, has none either. Coverage pass 4 X4-1 (docs/reviews/coverage4-care-energy.md): receives_tanf_cash, receives_ssi and title_ii_benefit_type are no longer read as not received when not stated: 3.752.1 names the public assistance households and gives no reading for a receipt not reported, so a member who meets none of the tests stated and leaves one of them unstated makes the household cannot determine (decision 4 of 2026-11-23), as the Adult Financial grant already did; a member shown to receive any of them still decides it. Coverage pass 5, L5-1 (docs/reviews/coverage5-care-energy.md): a stream of grant payments (a receipt with neither a month nor a date) is read only in a month its start_date and end_date cover, so a grant that ended before the application month is not received in it."
derived: ["exists", "leap_household_members_for_income", ["any", ["of", ["P"], "receives_tanf_cash"], [">", ["sum_receipts", ["of", ["P"], "receipts"], ["all", ["=", ["receipt", "kind"], "adult_financial_cash"], ["not", ["receipt", "retroactive"]], ["all", ["received_in", ["month"]], ["any", ["not", ["unknown", ["receipt", "month"]]], ["all", ["any", ["unknown", ["receipt", "start_date"]], ["<=", ["month_of", ["receipt", "start_date"]], ["month"]]], ["any", ["unknown", ["receipt", "end_date"]], [">=", ["month_of", ["receipt", "end_date"]], ["month"]]]]]]], ["receipt", "amount"]], 0], ["of", ["P"], "receives_ssi"], ["=", ["of", ["P"], "title_ii_benefit_type"], "own_disability"]]]
sources: [S3308, S3309]
implemented: engine
tags: [household]
open: [OQ-800]
rationale: "Coverage review C-3 (P1): 3.752.1 (S3308) accepts a public assistance household's application received before November 1, effective November 1; no item named the households it covers. The household's receipt of the listed programs is read from the receipt facts (convention rule 11), not from this volume's own determinations."
tests:
  - {id: CO-4518-T1, month: "2026-10", as_of: "2026-10-20", given: {leap_household_members_for_income: [p1], receives_tanf_cash: true}, title: "A Colorado Works recipient", expect: true}
  - {id: CO-4518-T2, month: "2026-10", as_of: "2026-10-20", given: {leap_household_members_for_income: [p1, p2], receives_tanf_cash: false, receives_ssi: false, title_ii_benefit_type: none}, title: "A member receives SSDI on his own record", others: {p2: {receives_tanf_cash: false, receives_ssi: false, title_ii_benefit_type: own_disability, receipts: []}}, expect: true}
  - {id: CO-4518-T3, month: "2026-10", as_of: "2026-10-20", given: {leap_household_members_for_income: [p1], receives_tanf_cash: false, receives_ssi: false, title_ii_benefit_type: retirement_or_survivor, receipts: []}, title: "A wage earner with no public assistance", expect: false}
  - {id: CO-4518-T4, month: "2026-10", as_of: "2026-10-20", given: {leap_household_members_for_income: [p1], receipts: [{kind: adult_financial_cash, amount: 300}]}, title: "An Old Age Pension grant of $300", expect: true}
  # Decision 4 of 2026-11-23: a member whose receipts are not stated may have an Adult Financial grant.
  - {id: CO-4518-T5, month: "2026-10", as_of: "2026-10-20", given: {leap_household_members_for_income: [p1], receives_tanf_cash: false, receives_ssi: false, title_ii_benefit_type: none}, title: "No Colorado Works, SSI or SSDI, receipts not stated: cannot determine", expect: unknown}
  - {id: CO-4518-T6, month: "2026-10", as_of: "2026-10-20", given: {leap_household_members_for_income: [p1], receives_tanf_cash: false, receives_ssi: true}, title: "An SSI recipient whose receipts are not stated: a public assistance household all the same", expect: true}
  - {id: CO-4518-T7, month: "2026-10", as_of: "2026-10-20", given: {leap_household_members_for_income: [p1], receives_tanf_cash: false, receives_ssi: false, title_ii_benefit_type: none, receipts: []}, title: "Receipts stated empty and nothing else received: not a public assistance household", expect: false}
  # Coverage pass 5 (docs/reviews/coverage5-care-energy.md), L5-1: a grant stream is read only in the months its dates cover.
  - {"id": "CO-4518-T8", "title": "L5-1: an Adult Financial grant stated as a stream whose end_date is 2026-08-31, nothing else received: not a public assistance household in October", "month": "2026-10", "as_of": "2026-10-20", "given": {"leap_household_members_for_income": ["p1"], "receives_tanf_cash": false, "receives_ssi": false, "title_ii_benefit_type": "none", "receipts": [{"kind": "adult_financial_cash", "amount": 700, "end_date": "2026-08-31"}]}, "expect": false}
  - {"id": "CO-4518-T9", "title": "L5-1: the same grant stream with no end date: a public assistance household", "month": "2026-10", "as_of": "2026-10-20", "given": {"leap_household_members_for_income": ["p1"], "receives_tanf_cash": false, "receives_ssi": false, "title_ii_benefit_type": "none", "receipts": [{"kind": "adult_financial_cash", "amount": 700}]}, "expect": true}
