id: CO-4518
name: "LEAP: a public assistance household"
identifier: leap_is_public_assistance_household
kind: derived
type: yes/no
scope: person-month
program: LEAP
meaning: "Whether this person's LEAP household is a public assistance household whose application 9 CCR 2503-7 3.752.1 accepts before November 1 (\"public assistance households (such as Colorado Works, Old Age Pension (OAP), Aid to the Needy Disabled (AND), Aid to the Blind (AB), and Supplemental Social Security Disability Benefits.)\"): a member of the household receives Colorado Works basic cash assistance, an Adult Financial grant (Old Age Pension or Aid to the Needy Disabled), Supplemental Security Income, or Social Security disability insurance benefits on the member's own record."
precision: "Reads the members of leap_household_members_for_income (CO-1009, the economic unit, a member excluded for status included, since the list names the household's receipt) and their receipt records: receives_tanf_cash (CO-013), adult_financial_cash_income above 0 for the month (CO-1713), receives_ssi (CO-012) and title_ii_benefit_type own_disability (CO-2821). Each is read as not received when not stated. leap_is_eligible (CO-1007) reads it in the month of the application date. OQ-800: \"Supplemental Social Security Disability Benefits\" is read as both SSI and SSDI; Aid to the Blind has no receipt fact of its own in this volume (adult_financial_cash_income names OAP and AND), and Non-Categorical Refugee Assistance, which 3.751.1's \"Public Assistance Income\" lists but 3.752.1 does not, has none either."
derived: [exists, leap_household_members_for_income, [any, [otherwise, [of, [P], receives_tanf_cash], false], [">", [otherwise, [of, [P], adult_financial_cash_income], 0], 0], [otherwise, [of, [P], receives_ssi], false], ["=", [otherwise, [of, [P], title_ii_benefit_type], none], own_disability]]]
sources: [S3308, S3309]
implemented: engine
tags: [household]
open: [OQ-800]
rationale: "Coverage review C-3 (P1): 3.752.1 (S3308) accepts a public assistance household's application received before November 1, effective November 1; no item named the households it covers. The household's receipt of the listed programs is read from the receipt facts (convention rule 11), not from this volume's own determinations."
tests:
  - {id: CO-4518-T1, title: "A Colorado Works recipient", as_of: "2026-10-20", month: "2026-10", given: {leap_household_members_for_income: [p1], receives_tanf_cash: true}, expect: true}
  - {id: CO-4518-T2, title: "A member receives SSDI on his own record", as_of: "2026-10-20", month: "2026-10", given: {leap_household_members_for_income: [p1, p2], receives_tanf_cash: false, adult_financial_cash_income: 0, receives_ssi: false, title_ii_benefit_type: none}, others: {p2: {receives_tanf_cash: false, adult_financial_cash_income: 0, receives_ssi: false, title_ii_benefit_type: own_disability}}, expect: true}
  - {id: CO-4518-T3, title: "A wage earner with no public assistance", as_of: "2026-10-20", month: "2026-10", given: {leap_household_members_for_income: [p1], receives_tanf_cash: false, adult_financial_cash_income: 0, receives_ssi: false, title_ii_benefit_type: retirement_or_survivor}, expect: false}
  - {id: CO-4518-T4, title: "An Old Age Pension grant of $300", as_of: "2026-10-20", month: "2026-10", given: {leap_household_members_for_income: [p1], adult_financial_cash_income: 300}, expect: true}
