id: CO-1712
name: "LEAP: self-employment income"
identifier: leap_self_employment_income
kind: derived
type: money
scope: person-month
program: LEAP
meaning: "The person's self-employment income for the month for LEAP: the declared monthly gross income (leap_self_employment_gross_receipts, CO-5126) less the receipted business expenses 9 CCR 2503-7 3.755.21.I allows (leap_self_employment_allowable_costs, CO-1711) and less the part of the receipts set aside under a Plan for Achieving Self-Support (3.752.23.DD), not below zero."
precision: "Owners of an LLC or S corporation are employees for LEAP (3.755.21.J) and state wages instead. A person with no gross receipts has none, whatever the cost records say. Earned-income records, step E1 (LEAP): the set-aside is the pass_set_aside of the receipt records counted in the month (earnings, CO-5100), replacing pass_set_aside_earned_income (CO-4618), which leap_household_income (CO-1002) took off the wages and self-employment together; each pay's set-aside is now taken off that pay, so it is subtracted once. leap_household_income reads this item for the month before the application month (3.755.21.I.1 as amended effective November 1, 2026; OQ-681). Coverage pass 5, L5-1 (docs/reviews/coverage5-care-energy.md): a business's stream (a record with neither a month nor a date) is read only in a month its job dates cover, from the month of job_start_date through the month of job_end_date, so a business that began after the full month prior to the application, or ended before it, has no income in it (3.755.21.I.1 as amended effective November 1, 2026, S2719: \"total gross income received in the full month prior to the application date\")."
derived: ["case", [["<=", "leap_self_employment_gross_receipts", 0], 0], ["else", ["max", 0, ["-", "leap_self_employment_gross_receipts", ["+", "leap_self_employment_allowable_costs", ["sum_receipts", "earnings", ["all", ["=", ["lookup", "leap_earnings_treatment_table", ["receipt", "kind"]], "counted_self_employment"], ["all", ["received_in", ["month"]], ["any", ["not", ["unknown", ["receipt", "month"]]], ["all", ["any", ["unknown", ["receipt", "job_start_date"]], ["<=", ["month_of", ["receipt", "job_start_date"]], ["month"]]], ["any", ["unknown", ["receipt", "job_end_date"]], [">=", ["month_of", ["receipt", "job_end_date"]], ["month"]]]]]]], ["receipt", "pass_set_aside"]]]]]]]
sources: [S1084, S2719, S3300]
implemented: engine
tags: [income]
open: [OQ-681]
rationale: "Vocabulary fix round (docs/reviews/vocabulary-reuse.md, R-1): gives self-employment this program's own reading; before, the program read one shared net figure, or none. Earned-income records, E1 (LEAP): the receipts, costs and set-aside are read from the records."
tests:
  - {id: CO-1712-T1, as_of: "2026-10-01", month: "2026-10", given: {leap_self_employment_allowable_costs: 400, earnings: [{kind: self_employment_receipts, amount: 1500}]}, expect: 1100}
  - {id: CO-1712-T2, as_of: "2026-10-01", month: "2026-10", title: "No self-employment - costs not read", given: {earnings: [{kind: wages, amount: 1000}]}, expect: 0}
  - {id: CO-1712-T3, as_of: "2026-10-01", month: "2026-10", title: "Costs above receipts", given: {leap_self_employment_allowable_costs: 450, earnings: [{kind: self_employment_receipts, amount: 300}]}, expect: 0}
  # $1,500 of receipts, $300 of receipted operating costs, $200 set aside under an approved PASS (3.752.23.DD): $1,500 - $300 - $200 = $1,000.
  # KL-CE-1 (2026-11-24): the business states that it is not rental property (rental_property false), which leap_self_employment_allowable_costs
  # (CO-1711) now reads before deducting a receipted cost (decision 4); the value is unchanged.
  - {id: CO-1712-T4, as_of: "2026-10-01", month: "2026-10", title: "A PASS set-aside from the business", given: {self_employment_cost_receipts_received: true, earnings: [{kind: self_employment_receipts, amount: 1500, pass_set_aside: 200, rental_property: false}, {kind: business_cost_operating, amount: 300}]}, expect: 1000}
  - {id: CO-1712-T5, as_of: "2026-10-01", month: "2026-10", title: "Earnings not stated: cannot determine", given: {}, expect: unknown}
  # Coverage pass 5 (docs/reviews/coverage5-care-energy.md), L5-1: the full month prior to an application of 2026-11-10 is October 2026 (3.755.21.I.1, OQ-681 (3)).
  - {"id": "CO-1712-T6", "title": "L5-1 (LE1): a business that began 2026-11-01 has no self-employment income in October: 0", "month": "2026-10", "as_of": "2026-11-10", "given": {"self_employment_cost_receipts_received": false, "earnings": [{"kind": "self_employment_receipts", "amount": 2000, "hours": 80, "pass_set_aside": 100, "job_start_date": "2026-11-01"}]}, "expect": 0}
  # KL-CE-1, probe LRB1 (docs/reviews/coverage7-care-energy.md, R7-3): October rents of $1,500 from a rental business; its mortgage interest
  # $600 is not maintenance and its repairs $100 are (9 CCR 2503-7 3.755.21.I.2.D, S3596): 1,500 - 100 = 1,400 (before KL-CE-1:
  # 1,500 - 700 = 800).
  - {id: CO-1712-T7, title: "KL-CE-1 (LRB1): rents $1,500 less the maintenance $100 only: 1,400", month: "2026-10", as_of: "2026-11-10", given: {self_employment_cost_receipts_received: true, earnings: [{kind: self_employment_receipts, amount: 1500, hours: 40, rental_property: true, job: job_1}, {kind: business_cost_interest, amount: 600, job: job_1, property_maintenance: false}, {kind: business_cost_operating, amount: 100, job: job_1, property_maintenance: true}]}, expect: 1400}
