id: CO-1281
name: "LEAP: Heating Fuel Assistance benefit amount"
identifier: leap_benefit_amount
kind: derived
type: money
scope: person-month
program: LEAP
role: outcome
meaning: The heating-season Heating Fuel Assistance benefit for an eligible household - one amount for the whole November-April season, reported on each month of the season in which the household is eligible, not a monthly payment to be multiplied by the months - the adjusted estimated home heating costs less the statewide adjustment and the household income contribution (each a share of those costs), less the subsidized-housing heating allowance where it applies, kept within the Department's minimum and maximum for the program year - or zero when the household is not eligible, per 9 CCR 2503-7 3.758.47 Steps B, D, F and G.
precision: "Step G subtracts the Step B-F adjustments from the estimated costs; this item reads Steps B and D as shares of the costs after Steps C and E and subtracts them together, then deducts the $180 seasonal subsidized-housing allowance (Step F), and floors the result at zero before the minimum and maximum apply. The rule does not say whether Step D applies before or after Step B; the additive reading is recorded in OQ-253. Point in Time (3.751.1, S776): the household income contribution is taken in the month of leap_application_date (OQ-137)."
derived: [case, [leap_is_eligible, [max, leap_benefit_minimum, [min, leap_benefit_maximum, [max, 0, ["-", ["*", leap_adjusted_heating_costs, ["-", 1, [+, leap_statewide_adjustment_rate, [at, leap_income_contribution_rate, [month_of, leap_application_date]]]]], [case, [lives_in_subsidized_housing, leap_subsidized_housing_heating_allowance], [else, 0]]]]]]], [else, 0]]
sources: [S770, S771, S772]
open: [OQ-253, OQ-532]
implemented: engine
tags: [income, household]
rationale: OQ-123 recorded that leap_benefit_amount was not created because the formula's inputs had no facts; this batch adds them (CO-1271-CO-1277) and the formula from the current rule (D-86). Declared as an outcome.
tests:
  - {id: CO-1281-T1, as_of: "2026-11-01", month: "2026-11", parameters: {leap_statewide_adjustment_rate: 0.2, leap_benefit_minimum: 100, leap_benefit_maximum: 1000}, given: {leap_application_date: "2026-11-01", leap_is_eligible: true, leap_adjusted_heating_costs: 1000, leap_income_contribution_rate: 0.1, lives_in_subsidized_housing: false}, expect: 700}
  - {id: CO-1281-T2, title: "Subsidized housing allowance deducted; result below the minimum is raised to it", as_of: "2026-11-01", month: "2026-11", parameters: {leap_statewide_adjustment_rate: 0.2, leap_benefit_minimum: 100, leap_benefit_maximum: 1000}, given: {leap_application_date: "2026-11-01", leap_is_eligible: true, leap_adjusted_heating_costs: 300, leap_income_contribution_rate: 0.3, lives_in_subsidized_housing: true}, expect: 100}
  - {id: CO-1281-T3, title: "Capped at the maximum", as_of: "2026-11-01", month: "2026-11", parameters: {leap_statewide_adjustment_rate: 0, leap_benefit_minimum: 100, leap_benefit_maximum: 1000}, given: {leap_application_date: "2026-11-01", leap_is_eligible: true, leap_adjusted_heating_costs: 3000, leap_income_contribution_rate: 0, lives_in_subsidized_housing: false}, expect: 1000}
  - {id: CO-1281-T4, as_of: "2026-11-01", month: "2026-11", given: {leap_application_date: "2026-11-01", leap_is_eligible: false}, expect: 0}
  - {id: CO-1281-T5, title: "C-6: with the program-year figures not stated, an eligible household's benefit is unknown", as_of: "2026-11-01", month: "2026-11", given: {leap_application_date: "2026-11-01", leap_is_eligible: true, leap_adjusted_heating_costs: 1000, leap_income_contribution_rate: 0.1, lives_in_subsidized_housing: false}, expect: unknown}
