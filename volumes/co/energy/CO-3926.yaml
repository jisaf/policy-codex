id: CO-3926
name: "LEAP: a person's countable unearned income"
identifier: leap_person_unearned_income
kind: derived
type: money
scope: person-month
program: LEAP
meaning: "This person's countable unearned income for LEAP (9 CCR 2503-7 3.752.21-23): the recurring unearned income received in the income verification period (3.752.22.A), plus the month's Social Security and SSI, each without its cents (3.752.211.H, 3.752.21.I), plus the month's Colorado Works and Adult Financial cash assistance (3.752.21.L), plus prizes and nonrecurring lump sums received (3.752.21.A, C, D), except a retroactive lump-sum Social Security, SSI or public assistance payment (3.752.23.EE). The recurring income includes family and medical leave insurance (FAMLI) benefits (3.752.211.J, as amended effective November 1, 2026) and a military allotment received for a member, counted in the month received (3.752.212), and leaves out what 3.752.23 and 3.752.211.D exclude."
precision: "Coverage review C-1: the recurring part is unearned_income_prior_thirty_days (CO-3913) less leap_excluded_unearned_income (CO-4511: crime victim compensation, foster care and kinship payments, reverse mortgages, housing utility allowances, G.I. Bill housing and food allowances, PASS income and the expense part of a workers' compensation award, less the part paid as a lump sum, which leap_person_one_time_income subtracts), not below zero. Coverage review 3 F3-1: the month's Social Security, without its cents, is added to the recurring figure before CO-4511 is subtracted, because income set aside under a PASS (3.752.23.DD) is most often Social Security disability income, which CO-3913 does not hold (pass_set_aside_income, CO-3825, is part of \"the fact that names the source\"). CO-3913 itself leaves out what 3.752.23 excludes and has its own fact: financial aid (P), reimbursements (R, S), bona fide loans (BB), lump-sum tax refunds and credits (EE), payments federal law excludes (F, H, I, K-N), and home energy assistance (LEAP's own benefit, which a program does not count against itself, and assistance paid to the energy supplier on the household's behalf, T). SSI is counted \"in the month received\" (3.752.21.I) and Social Security and cash assistance are read for the month of the application, the month leap_household_income (CO-1002) is read for (OQ-681). Second-pass review N-8: prizes and lump sums are those received in the income verification period (leap_person_one_time_income, CO-4069; 3.752.22.A), not the calendar month. The cents are dropped by rounding down. 3.752.22.A's cap of one month's income is met by the recurring figure being one month's receipts; a case whose thirty days hold two monthly payments of one source states one."
derived: [+, [max, 0, ["-", [+, unearned_income_prior_thirty_days, ["-", 0, [ceil, ["-", 0, social_security_income]]]], leap_excluded_unearned_income]], ["-", 0, [ceil, ["-", 0, ssi_income]]], tanf_cash_income, adult_financial_cash_income, leap_person_one_time_income]
sources: [S2712, S2713, S2714, S2208, S1624, S3300, S3304, S3306, S3307]
implemented: engine
tags: [income]
open: [OQ-681]
rationale: "Final pass F-09, F-10, F-11 and F-19: leap_household_income (CO-1002) left out SSI, which 3.752.21.I counts; did not read lottery winnings, which 3.752.21.A counts as prizes; counted a retroactive benefit lump sum that 3.752.23.EE excludes; kept the cents 3.752.21.I and 3.752.211.H drop; and read the calendar month rather than the income verification period."
