id: CO-3926
name: "LEAP: a person's countable unearned income"
identifier: leap_person_unearned_income
kind: derived
type: money
scope: person-month
program: LEAP
meaning: "This person's countable unearned income for LEAP (9 CCR 2503-7 3.752.21-23): the counted recurring receipts of the month, one month's income (3.752.22.A; leap_counted_recurring_receipts) with the AmeriCorps payments at or above the minimum wage (3.752.23.F; leap_counted_service_payments), and Social Security without its cents (3.752.211.H), less the parts set aside under a PASS or paid for a workers' compensation claim's expenses (3.752.23.DD, 3.752.211.D), not below zero; plus SSI without its cents (3.752.21.I); plus Colorado Works and Adult Financial cash assistance (3.752.21.L); plus the counted one-time receipts of the income verification period (3.752.21.A, C, D, 3.752.22.A). What LEAP counts or excludes, kind by kind, is its counting table (leap_receipt_treatment_table)."
precision: "Receipt records, migration phase 1 (docs/reviews/receipts-migration-1.md): read from the receipts (CO-5000), replacing unearned_income_prior_thirty_days (CO-3913, which CCCAP still reads), leap_excluded_unearned_income (CO-4511), leap_person_one_time_income (CO-4069), leap_excluded_source_receipts (CO-4961) and leap_excluded_receipts_in_lump_sum (CO-4962), and the facts they read. Coverage review 3 F3-1: the set-aside parts are subtracted from the recurring receipts and Social Security together, because income set aside under a PASS is most often Social Security disability income. SSI is counted \"in the month received\" (3.752.21.I) and the recurring receipts are read for the month of the application, the month leap_household_income (CO-1002) is read for (OQ-681). The recurring income includes family and medical leave insurance (FAMLI) benefits (3.752.211.J, as amended effective November 1, 2026) and a military allotment received for a member (3.752.212), stated as receipts of the kind that names their source. The cents are dropped by rounding down."
derived: ["+", [max, 0, ["-", ["+", leap_counted_recurring_receipts, leap_counted_service_payments, leap_social_security_whole_dollars], leap_receipts_set_aside]], leap_ssi_whole_dollars, leap_cash_assistance_receipts, leap_one_time_receipts_in_period]
sources: [S2712, S2713, S2714, S2208, S1624, S3300, S3304, S3306, S3307, S3595]
implemented: engine
tags: [income]
open: [OQ-681]
rationale: "Final pass F-09, F-10, F-11 and F-19: leap_household_income (CO-1002) left out SSI, which 3.752.21.I counts; did not read lottery winnings, which 3.752.21.A counts as prizes; counted a retroactive benefit lump sum that 3.752.23.EE excludes; kept the cents 3.752.21.I and 3.752.211.H drop; and read the calendar month rather than the income verification period."
tests:
  - {id: CO-3926-T1, month: "2026-12", as_of: "2026-11-10", given: {leap_application_date: "2026-11-10", receipts: [{kind: ssi, amount: 967.5}]}, title: "SSI of $967.50 counts as $967 (3.752.21.I)", expect: 967}
  - {id: CO-3926-T2, month: "2026-12", as_of: "2026-11-10", given: {leap_application_date: "2026-11-10", receipts: [{kind: social_security, amount: 1204.9}, {kind: child_support, amount: 300}]}, title: "Social Security of $1,204.90 counts as $1,204, with $300 of child support", expect: 1504}
  - {id: CO-3926-T3, month: "2026-11", as_of: "2026-11-10", given: {leap_application_date: "2026-11-10", receipts: [{kind: gambling_winnings, amount: 2000, frequency: once, month: "2026-11", date: "2026-11-01"}]}, title: "A $2,000 lottery prize in the income verification period (3.752.21.A)", expect: 2000}
  - {id: CO-3926-T4, month: "2026-11", as_of: "2026-11-10", given: {leap_application_date: "2026-11-10", receipts: [{kind: social_security, amount: 900, pass_set_aside: 1000}, {kind: ssi, amount: 200}]}, title: "A PASS set-aside larger than the Social Security it comes out of: not below zero before SSI is added", expect: 200}
  - {id: CO-3926-T5, month: "2026-11", as_of: "2026-11-10", given: {leap_application_date: "2026-11-10", receipts: [{kind: child_support, amount: 900}, {kind: crime_victim_compensation, amount: 3000, frequency: once, month: "2026-11", date: "2026-11-03"}]}, title: "Receipt spike family F1: $900 child support counted, a one-time $3,000 crime victim payment excluded (G)", expect: 900}
  - {id: CO-3926-T6, month: "2026-11", as_of: "2026-11-10", given: {leap_application_date: "2026-11-10", receipts: [{kind: colorado_works_cash, amount: 488}, {kind: pension, amount: 610}, {kind: educational_assistance, amount: 1000}]}, title: "Colorado Works cash and a pension counted; financial aid excluded (P)", expect: 1098}
  - {id: CO-3926-T7, month: "2026-11", as_of: "2026-11-10", given: {leap_application_date: "2026-11-10"}, title: "Receipts not stated: cannot determine", expect: unknown}
  - {id: CO-3926-T8, month: "2026-11", as_of: "2026-11-10", given: {leap_application_date: "2026-11-10", receipts: []}, title: "No receipts: none", expect: 0}
