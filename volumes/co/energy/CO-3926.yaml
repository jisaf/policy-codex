  - {id: CO-3926-T1, title: "SSI of $967.50 counts as $967 (3.752.21.I)", as_of: "2026-12-01", month: "2026-12", given: {unearned_income_received_prior_thirty_days: 0, social_security_income: 0, ssi_income: 967.5, tanf_cash_income: 0, adult_financial_cash_income: 0}, expect: 967}
  - {id: CO-3926-T2, title: "Social Security of $1,204.90 counts as $1,204, with $300 of child support in the period", as_of: "2026-12-01", month: "2026-12", given: {unearned_income_received_prior_thirty_days: 300, social_security_income: 1204.9, ssi_income: 0, tanf_cash_income: 0, adult_financial_cash_income: 0}, expect: 1504}
  - {id: CO-3926-T3, title: "A $2,000 lottery prize counts (3.752.21.A)", as_of: "2026-12-01", month: "2026-12", given: {unearned_income_received_prior_thirty_days: 0, social_security_income: 0, ssi_income: 0, tanf_cash_income: 0, adult_financial_cash_income: 0, lottery_gambling_winnings_received: 2000}, expect: 2000}
  - {id: CO-3926-T4, title: "A $3,000 retroactive Social Security lump sum is excluded; a $500 inheritance in the same month counts (3.752.23.EE)", as_of: "2026-12-01", month: "2026-12", given: {unearned_income_received_prior_thirty_days: 0, social_security_income: 0, ssi_income: 0, tanf_cash_income: 0, adult_financial_cash_income: 0, lump_sum_received: 3500, retroactive_social_security_lump_sum_received: 3000}, expect: 500}
  - {id: CO-3926-T5, title: "Colorado Works cash of $400", as_of: "2026-12-01", month: "2026-12", given: {unearned_income_received_prior_thirty_days: 0, social_security_income: 0, ssi_income: 0, tanf_cash_income: 400, adult_financial_cash_income: 0}, expect: 400}
