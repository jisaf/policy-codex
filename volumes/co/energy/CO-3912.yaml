id: CO-3912
name: "LEAP: gross wages in the income verification period"
identifier: leap_wages_in_income_verification_period
kind: derived
type: money
scope: person-month
program: LEAP
meaning: "The gross wages, other than work-study earnings (9 CCR 2503-7 3.752.23.P: \"All financial aid monies ... including work study\"), the person received in LEAP's income verification period, \"from the date of application to the same date of the prior month (approximately thirty (30) calendar days from the date of application)\" (3.751.1, S2712), which 3.752.22.C.3 reads for a job that began or ended in that period: wages_gross_received_prior_thirty_days (CO-3910) when the case states it; when the case states only calendar-month receipts, the month's wages_gross (CO-023) less work_study_earnings (CO-3361), the person's pay being taken to be the same in every month."
precision: "The period is read as the thirty days before the application date that the neutral receipt states (OQ-681); the receipts' own LEAP period starts on the same date of the prior month (leap_income_verification_period_start, CO-5002; OQ-886). The month read when the thirty-day figure is not stated is the month being determined. work_study_earnings is part of wages_gross and read as 0 when not stated. Read by leap_person_wages (CO-3925). Receipt records, migration phase 3 (docs/reviews/receipts-migration-3.md; docs/reviews/cross-program-audit.md): this was the shared wages_gross_prior_thirty_days, read by CCCAP and LEAP; the two rules do not define the same window (LEAP's period runs to the same date of the prior month and is read for a job that began or ended; CCCAP's \"prior thirty (30) day period\", 8 CCR 1403-1 3.111.H.5.a.1, runs back from the application or redetermination date and is read for ongoing employment), so it is LEAP's own item and CCCAP states its thirty days in cccap_person_earned_income (CO-3915)."
derived: [otherwise, wages_gross_received_prior_thirty_days, ["-", wages_gross, [otherwise, work_study_earnings, 0]]]
sources: [S2712, S2713, S2208]
implemented: engine
tags: [income]
open: [OQ-681]
rationale: "Final pass F-09 (SW-35): LEAP reads the wages of the income verification period for a job that began or ended, not the calendar month. Receipt records, migration phase 3: split from the cross-program wages_gross_prior_thirty_days (allowlisted as a shared program calculation) into LEAP's own item, keeping its id; CCCAP's reader states its own thirty days."
tests:
  - {id: CO-3912-T1, title: "Five weekly pay dates of $500 in the thirty days", as_of: "2026-12-01", month: "2026-12", given: {wages_gross_received_prior_thirty_days: 2500, wages_gross: 2000, earnings: [{kind: wages, amount: 2000}, {kind: self_employment_receipts}]}, expect: 2500}
  - {id: CO-3912-T2, title: "Only the month is stated: the month's wages less work-study", as_of: "2026-12-01", month: "2026-12", given: {wages_gross: 1200, work_study_earnings: 200, earnings: [{kind: wages, amount: 1000}, {kind: work_study, amount: 200}, {kind: self_employment_receipts}]}, expect: 1000}
  - {id: CO-3912-T3, title: "Only the month is stated, no work-study", as_of: "2026-12-01", month: "2026-12", given: {wages_gross: 2600, earnings: [{kind: wages, amount: 2600}, {kind: self_employment_receipts}]}, expect: 2600}
