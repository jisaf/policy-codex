id: CO-3912
name: "LEAP: gross wages in the income verification period"
identifier: leap_wages_in_income_verification_period
kind: derived
type: money
scope: person-month
program: LEAP
meaning: "The gross pay the person actually received in LEAP's income verification period, \"from the date of application to the same date of the prior month\" (9 CCR 2503-7 3.751.1, S2712), from a job whose income \"is terminated as of the application date\" or that is \"a new source of earned income as of the application date\" (3.752.22.C.3.a-b, S2713: \"use actual income received in the income verification period\"): each earnings record (earnings, CO-5100) of a kind LEAP's counting table counts as pay (leap_earnings_treatment_table, CO-5102: wages, in-kind pay at its value and the other pay no paragraph of 3.752.23 excludes; not work-study, 3.752.23.P, or an employer's health insurance subsidy, HH), whose job began on or after the first day of the period or ended on or before the application date, and whose date falls in the period, less the part set aside under a Plan for Achieving Self-Support (3.752.23.DD)."
precision: "Earned-income records, step E1 (LEAP; docs/reviews/records-earnings-care-energy.md): read from the earnings records by their dates, replacing wages_gross_received_prior_thirty_days (CO-3910), employment_began_or_ended_prior_thirty_days (CO-3923, read as false when not stated) and the month's wages_gross less work_study_earnings. The period runs from leap_income_verification_period_start (CO-5002) through leap_application_date, both days included, as LEAP's one-time receipts are placed (leap_one_time_receipts_in_period, CO-5009; OQ-886). A job \"began\" in the period when its record's job_start_date is on or after the period's first day, and \"ended\" when its job_end_date is on or before the application date (the job dates' when_absent: a record that states neither is ongoing pay, read by leap_ongoing_wage_streams and leap_ongoing_dated_wages, CO-5120 and CO-5121). A job that ended before the period has no pay in it and counts nothing: its income is terminated as of the application date. A record of such a job that states no date cannot be placed in the period, so the figure cannot be determined and the record's date is named as missing (decision 4 of 2026-11-23). Senior Community Service Employment Program pay is read by leap_scsep_wages (CO-5122), which applies the age test of 3.752.23.CC outside the sum. The set-aside part is no more than the pay it is part of."
derived: ["sum_receipts", "earnings", ["all", ["any", ["in", ["lookup", "leap_earnings_treatment_table", ["receipt", "kind"]], ["counted", "counted_no_rule_excludes", "counted_at_value"]], ["all", ["=", ["lookup", "leap_earnings_treatment_table", ["receipt", "kind"]], "counted_unless_foster_care"], ["not", ["receipt", "foster_care"]]]], ["any", ["case", [["unknown", ["receipt", "job_start_date"]], false], ["else", [">=", ["receipt", "job_start_date"], "leap_income_verification_period_start"]]], ["case", [["unknown", ["receipt", "job_end_date"]], false], ["else", ["<=", ["receipt", "job_end_date"], "leap_application_date"]]]], ["all", [">=", ["receipt", "date"], "leap_income_verification_period_start"], ["<=", ["receipt", "date"], "leap_application_date"]]], ["-", ["receipt", "amount"], ["min", ["receipt", "pass_set_aside"], ["receipt", "amount"]]]]
sources: [S2712, S2713, S2208, S3300, S3301]
implemented: engine
tags: [income]
open: [OQ-681, OQ-886]
rationale: "Final pass F-09 (SW-35): LEAP reads the wages of the income verification period for a job that began or ended, not the calendar month. Receipt records, migration phase 3: split from the cross-program wages_gross_prior_thirty_days into LEAP's own item, keeping its id. Earned-income records, E1 (LEAP): the thirty-day total and the began-or-ended flag could not say which job began or ended or when its pays came (docs/reviews/earnings-e0.md, section 5); the pays are dated records now, and the window is computed from the application date."
tests:
  # Application November 10, 2026: the income verification period is October 10 to November 10 (CO-5002-T1).
  # A weekly job that ended October 25: pays of $500 on October 2, 9, 16 and 23; October 16 and 23 are in the period: $500 + $500 = $1,000.
  - {id: CO-3912-T1, title: "A job that ended October 25: the pays received in the period (3.752.22.C.3.a)", as_of: "2026-11-10", month: "2026-11", given: {leap_application_date: "2026-11-10", earnings: [{kind: wages, amount: 500, frequency: weekly, date: "2026-10-02", job_end_date: "2026-10-25"}, {kind: wages, amount: 500, frequency: weekly, date: "2026-10-09", job_end_date: "2026-10-25"}, {kind: wages, amount: 500, frequency: weekly, date: "2026-10-16", job_end_date: "2026-10-25"}, {kind: wages, amount: 500, frequency: weekly, date: "2026-10-23", job_end_date: "2026-10-25"}]}, expect: 1000}
  # A job that began October 20 paying $400 on October 23, October 30 and November 6, all in the period: 3 x $400 = $1,200.
  - {id: CO-3912-T2, title: "A job that began October 20: the pays received in the period (3.752.22.C.3.b)", as_of: "2026-11-10", month: "2026-11", given: {leap_application_date: "2026-11-10", earnings: [{kind: wages, amount: 400, frequency: weekly, date: "2026-10-23", job_start_date: "2026-10-20"}, {kind: wages, amount: 400, frequency: weekly, date: "2026-10-30", job_start_date: "2026-10-20"}, {kind: wages, amount: 400, frequency: weekly, date: "2026-11-06", job_start_date: "2026-10-20"}]}, expect: 1200}
  - {id: CO-3912-T3, title: "A job that began October 20 stated as a weekly stream with no dates: the pays cannot be placed in the period", as_of: "2026-11-10", month: "2026-11", given: {leap_application_date: "2026-11-10", earnings: [{kind: wages, frequency: weekly, per_payment: 400, job_start_date: "2026-10-20"}]}, expect: unknown}
  - {id: CO-3912-T4, title: "Ongoing pay (no job dates) is not read here", as_of: "2026-11-10", month: "2026-11", given: {leap_application_date: "2026-11-10", earnings: [{kind: wages, amount: 500, frequency: weekly, date: "2026-10-30"}, {kind: wages, amount: 2000}]}, expect: 0}
  - {id: CO-3912-T5, title: "Work-study pay of a job that began in the period is excluded (3.752.23.P)", as_of: "2026-11-10", month: "2026-11", given: {leap_application_date: "2026-11-10", earnings: [{kind: work_study, amount: 300, frequency: biweekly, date: "2026-10-23", job_start_date: "2026-10-12"}]}, expect: 0}
  - {id: CO-3912-T6, title: "A job that ended September 15, before the period: its income is terminated and nothing came in the period", as_of: "2026-11-10", month: "2026-11", given: {leap_application_date: "2026-11-10", earnings: [{kind: wages, amount: 900, date: "2026-09-15", job_end_date: "2026-09-15"}]}, expect: 0}
  # $800 on November 6 from a job that began October 20, $200 of it set aside under an approved PASS (3.752.23.DD): $800 - $200 = $600.
  - {id: CO-3912-T7, title: "A PASS set-aside is taken off the pay it is part of", as_of: "2026-11-10", month: "2026-11", given: {leap_application_date: "2026-11-10", earnings: [{kind: wages, amount: 800, frequency: biweekly, date: "2026-11-06", job_start_date: "2026-10-20", pass_set_aside: 200}]}, expect: 600}
  # The period's boundaries (OQ-886): a job that ended on the application date, November 10; its pays of October 9 ($50, the day before the period), October 10 ($100, its first day) and November 10 ($200, its last day): $100 + $200 = $300.
  - {id: CO-3912-T8, title: "Pays on the first and last days of the period count; the day before does not", as_of: "2026-11-10", month: "2026-11", given: {leap_application_date: "2026-11-10", earnings: [{kind: wages, amount: 50, date: "2026-10-09", job_end_date: "2026-11-10"}, {kind: wages, amount: 100, date: "2026-10-10", job_end_date: "2026-11-10"}, {kind: wages, amount: 200, date: "2026-11-10", job_end_date: "2026-11-10"}]}, expect: 300}
