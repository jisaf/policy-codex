id: CO-2345
name: "LEAP: excluded income"
identifier: leap_excluded_income
kind: derived
type: money
scope: person-month
program: LEAP
meaning: "The part of this person's gross earned and unearned income for the month that 9 CCR 2503-7 3.752.23 excludes, other than the wages of a child under eighteen, which leap_household_income already leaves out (Q): payments federal law excludes (F, H, I, K-N), all financial aid including work-study (P), reimbursements (R, S), a bona fide loan (BB), and lump-sum tax refunds and credits (EE)."
precision: "The sum of the neutral receipt facts the program's list names (each part of the gross income facts, so the program's countable income subtracts it); an unstated receipt is 0."
derived: [+, [+, [+, [+, [+, [otherwise, educational_assistance_received, 0], [otherwise, work_study_earnings, 0]], [otherwise, loan_proceeds_received, 0]], [otherwise, expense_reimbursements_received, 0]], [otherwise, tax_refunds_and_credits_received, 0]], [otherwise, federally_excluded_payments_received, 0]]
sources: [S1624, S2208]
implemented: engine
tags: [income]
rationale: "Same-word audit SW-28, dual-entry audit 3.24 and 3.25: each program's excluded income and allowable business costs were program-prefixed supplied amounts, so one receipt or one set of business costs was entered once per program. The neutral fact describes the receipt or the cost; each program's exclusion or allowable cost is its own derived item citing its list (product-owner decision, convention rule 13). The ID and identifier are kept; the amount is now derived."
