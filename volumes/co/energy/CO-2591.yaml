id: CO-2591
name: "LEAP: unearned income verification is pending"
identifier: leap_unearned_income_verification_is_pending
kind: derived
type: yes/no
scope: person-month
program: LEAP
role: outcome
meaning: "Whether LEAP still needs verification of this person's unearned income: the shared unearned_income_verification_is_pending (CO-1650), where LEAP verification applies to the person."
precision: "Due by: leap_verification_due_date (CO-1461)."
derived: [all, leap_verification_is_applicable, [all, leap_has_countable_unearned_income, [not, unearned_income_is_verified]]]
