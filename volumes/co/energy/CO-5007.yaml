id: CO-5007
name: "LEAP: a person's cash assistance receipts"
identifier: leap_cash_assistance_receipts
kind: derived
type: money
scope: person-month
program: LEAP
meaning: The person's Colorado Works and Adult Financial cash assistance received in the month (9 CCR 2503-7 3.752.21.L), other than a retroactive lump sum, which 3.752.23.EE excludes.
precision: "Coverage pass 4 L4-3 (docs/reviews/coverage4-care-energy.md): a recurring receipt stated with its date is read by its date in the income verification period (9 CCR 2503-7 3.752.22.A: \"received in the income verification period, not to exceed one month's income\"; C.3.a, C.3.c), after the period's first day (leap_income_verification_period_start, CO-5002) through the application date (leap_application_date), not by the calendar month: the period is then one month long, so a monthly source paid on the application date's day of the month is counted once (the cap of A; OQ-681); a receipt stated without a date is read in the month, as before."
derived: ["sum_receipts", "receipts", ["all", ["not", ["=", ["receipt", "frequency"], "once"]], ["case", [["unknown", ["receipt", "date"]], ["received_in", ["month"]]], ["else", ["all", [">", ["receipt", "date"], "leap_income_verification_period_start"], ["<=", ["receipt", "date"], "leap_application_date"]]]], ["in", ["receipt", "kind"], ["colorado_works_cash", "adult_financial_cash"]]], ["receipt", "amount"]]
sources: [S2714, S2208]
implemented: engine
tags: [income]
open: [OQ-681]
rationale: "Receipt records, migration phase 1: the cash assistance term of leap_person_unearned_income (CO-3926), read from the receipts."
tests:
  - {id: CO-5007-T1, month: "2026-11", as_of: "2026-11-10", given: {leap_application_date: "2026-11-10", receipts: [{kind: colorado_works_cash, amount: 488}, {kind: adult_financial_cash, amount: 120}]}, title: "Colorado Works and Adult Financial grants of the month", expect: 608}
