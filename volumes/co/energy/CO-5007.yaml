  # Coverage pass 5 (docs/reviews/coverage5-care-energy.md), L5-1: application 2026-11-10, so the income verification period runs after 2026-10-10 through 2026-11-10 (CO-5002, OQ-681 (4)).
  - {"id": "CO-5007-T2", "title": "L5-1: a Colorado Works grant of $500 as a stream whose end_date is 2026-09-30: 0", "month": "2026-11", "as_of": "2026-11-10", "given": {"leap_application_date": "2026-11-10", "receipts": [{"kind": "colorado_works_cash", "amount": 500, "end_date": "2026-09-30"}]}, "expect": 0}
