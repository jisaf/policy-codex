id: CO-5007
name: "LEAP: a person's cash assistance receipts"
identifier: leap_cash_assistance_receipts
kind: derived
type: money
scope: person-month
program: LEAP
meaning: The person's Colorado Works and Adult Financial cash assistance received in the month (9 CCR 2503-7 3.752.21.L), other than a retroactive lump sum, which 3.752.23.EE excludes.
precision: "Coverage pass 4 L4-3 (docs/reviews/coverage4-care-energy.md): a recurring receipt stated with its date is read by its date in the income verification period (9 CCR 2503-7 3.752.22.A: \"received in the income verification period, not to exceed one month's income\"; C.3.a, C.3.c), after the period's first day (leap_income_verification_period_start, CO-5002) through the application date (leap_application_date), not by the calendar month: the period is then one month long, so a monthly source paid on the application date's day of the month is counted once (the cap of A; OQ-681); a receipt stated without a date is read in the month, as before. Coverage pass 5, L5-1 (docs/reviews/coverage5-care-energy.md): a recurring receipt stated with neither a month nor a date (a stream) is read in the month of the application only when its source ran through the whole income verification period (its start_date before the period's first day or not stated, its end_date after the application date or not stated); it is not counted when its end_date is before the period's first day (3.752.22.C.3.a: \"use actual income received in the income verification period\", none) or its start_date is after the application date (C.3.c: \"If a household member has not received his/her first check from this source of income as of the income verification period, do not count any income from this source\", S2713); and a source that began or ended in the period is read from its dated receipts (C.3.a, C.3.c), so a stream without them cannot determine and the record's date is named as missing, as leap_wages_in_income_verification_period (CO-3912) reads a job that began or ended (OQ-681 (4))."
derived: ["sum_receipts", "receipts", ["all", ["not", ["=", ["receipt", "frequency"], "once"]], ["case", [["not", ["unknown", ["receipt", "month"]]], ["case", [["unknown", ["receipt", "date"]], ["received_in", ["month"]]], ["else", ["all", [">", ["receipt", "date"], "leap_income_verification_period_start"], ["<=", ["receipt", "date"], "leap_application_date"]]]]], [["any", ["all", ["not", ["unknown", ["receipt", "end_date"]]], ["<", ["receipt", "end_date"], "leap_income_verification_period_start"]], ["all", ["not", ["unknown", ["receipt", "start_date"]]], [">", ["receipt", "start_date"], "leap_application_date"]]], false], [["all", ["any", ["unknown", ["receipt", "start_date"]], ["<", ["receipt", "start_date"], "leap_income_verification_period_start"]], ["any", ["unknown", ["receipt", "end_date"]], [">", ["receipt", "end_date"], "leap_application_date"]]], ["case", [["unknown", ["receipt", "date"]], ["received_in", ["month"]]], ["else", ["all", [">", ["receipt", "date"], "leap_income_verification_period_start"], ["<=", ["receipt", "date"], "leap_application_date"]]]]], ["else", ["all", [">", ["receipt", "date"], "leap_income_verification_period_start"], ["<=", ["receipt", "date"], "leap_application_date"]]]], ["in", ["receipt", "kind"], ["colorado_works_cash", "adult_financial_cash"]]], ["receipt", "amount"]]
sources: [S2714, S2208, S2713]
implemented: engine
tags: [income]
open: [OQ-681]
rationale: "Receipt records, migration phase 1: the cash assistance term of leap_person_unearned_income (CO-3926), read from the receipts."
