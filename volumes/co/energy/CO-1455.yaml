id: CO-1455
name: "LEAP: requires verification of earned income"
identifier: leap_requires_verification_of_earned_income
kind: derived
type: yes/no
scope: person-month
program: LEAP
meaning: "Whether the person's wages must be verified for LEAP by pay stubs or employer statements: the wages of a household member who is not a child. Self-employment income is verified by the member's written or verbal declaration, which needs no document."
derived: [all, [">", wages_gross, 0], [">=", age, leap_household_child_age_limit]]
sources: [S897, S898, S1084]
implemented: engine
tags: [verification, income]
rationale: No existing item states this LEAP verification requirement; the phase-9 chapter needs it to count the household's pending verifications.
tests:
  - {id: CO-1455-T1, month: "2026-10", as_of: "2026-10-01", given: {wages_gross: 1500, self_employment_gross_receipts: 0, date_of_birth: "1985-01-22"}, expect: true}
  - {id: CO-1455-T2, month: "2026-10", as_of: "2026-10-01", given: {wages_gross: 1500, self_employment_gross_receipts: 0, date_of_birth: "2015-01-22"}, expect: false}
  - {id: CO-1455-T3, month: "2026-10", as_of: "2026-10-01", given: {wages_gross: 0, self_employment_gross_receipts: 0}, expect: false}
