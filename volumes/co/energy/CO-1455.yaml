id: CO-1455
name: "LEAP: requires verification of earned income"
identifier: leap_requires_verification_of_earned_income
kind: derived
type: yes/no
scope: person-month
program: LEAP
meaning: "Whether the person's earned income must be verified for LEAP: earnings of a household member who is not a child, by pay stubs or employer statements."
derived: [all, has_earned_income, [">=", age, leap_household_child_age_limit]]
sources: [S897, S898]
implemented: engine
tags: [verification, income]
rationale: No existing item states this LEAP verification requirement; the phase-9 chapter needs it to count the household's pending verifications.
tests:
  - {id: CO-1455-T1, month: "2026-10", as_of: "2026-10-01", given: {has_earned_income: true, date_of_birth: "1985-01-22"}, expect: true}
  - {id: CO-1455-T2, month: "2026-10", as_of: "2026-10-01", given: {has_earned_income: true, date_of_birth: "2015-01-22"}, expect: false}
  - {id: CO-1455-T3, month: "2026-10", as_of: "2026-10-01", given: {has_earned_income: false}, expect: false}
