id: CO-1003
name: "LEAP: income within limit"
identifier: leap_income_within_limit
kind: derived
type: yes/no
scope: person-month
program: LEAP
meaning: Whether the LEAP household's countable income (leap_household_income, CO-1002) is at or below sixty percent of the state median income level for the household's size, under 9 CCR 2503-7 3.752.22.D.
precision: Reads the supplied leap_income_limit_monthly (CO-877) fact, the already-computed 60% SMI dollar ceiling for this person's household size (see OQ-122).
derived: ["<=", leap_household_income, leap_income_limit_monthly]
sources: [S491]
open: [OQ-122]
implemented: engine
tags: [income]
rationale: No existing item states the LEAP income test; leap_is_eligible (CO-1007) needs it.
tests:
  - {id: CO-1003-T1, as_of: "2026-10-01", month: "2026-10", given: {leap_household_income: 1180, leap_income_limit_monthly: 3200}, expect: true}
  - {id: CO-1003-T2, as_of: "2026-10-01", month: "2026-10", given: {leap_household_income: 5000, leap_income_limit_monthly: 3200}, expect: false}
