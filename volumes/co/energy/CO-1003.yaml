id: CO-1003
name: "LEAP: income within limit"
identifier: leap_income_within_limit
kind: derived
type: yes/no
scope: person-month
program: LEAP
meaning: Whether the LEAP household's countable income (leap_household_income, CO-1002) is at or below sixty percent of the state median income level for the household's size, under 9 CCR 2503-7 3.752.22.D.
precision: "Reads leap_income_limit_monthly (CO-875), the Department's season table keyed by household size 1 through 15 (S1406), by this person's leap_household_size (CO-1001); 3.751.2.C caps a household at fifteen members (S1407), so a larger size has no figure and is unknown. The table is read as of the determination date, not in the month whose income is tested: the limit is the heating season's (3.752.22.D, the Department's table for each season), and CO-875 keeps a season's table in force until the next season begins, so the determination of an application for the season reads it even when the income month falls before November 1 (a public assistance household's October application, 3.752.1; time audit T-3, docs/operators.md, Resolution). Coverage pass 5, L5-5 (docs/reviews/coverage5-care-energy.md): the season's table is read as of the first day of the program year the application is for (leap_application_program_year_start_month, CO-4517), not the determination date: a LEAP case is now determined as of its application date (leap_determination_is_as_of_application_date, CO-7000), and a public assistance household's application received before November 1 is for the season that begins then (3.752.1, S3308: \"eligibility shall not be effective until November 1st\"; 3.752.22.D, S491: income \"for the eligibility period\"), whose table is in force from that day. For an application received in the season the two readings are the same table."
derived: ["<=", "leap_household_income", ["lookup", ["as_of", "leap_income_limit_monthly", ["first_day", "leap_application_program_year_start_month"]], "leap_household_size"]]
sources: [S491, S1406, S1407, S3308]
implemented: engine
tags: [income]
rationale: "No existing item states the LEAP income test. Keyed to leap_household_size per the review (docs/reviews/cccap-leap-phase-6.md, C-13, should-fix): the ceiling is a function of household size but the prior per-person supplied fact was never tied to leap_household_size (CO-1001), so two members of the same household could be given different ceilings and a fix to the household closure could silently strand every case's supplied figure."
tests:
  # 2026-2027 season table (S1406): $4,936 for two.
  - {id: CO-1003-T1, as_of: "2026-11-01", month: "2026-11", given: {leap_application_date: "2026-11-01", leap_household_income: 4936, leap_household_size: 2}, expect: true}
  - {id: CO-1003-T2, as_of: "2026-11-01", month: "2026-11", given: {leap_application_date: "2026-11-01", leap_household_income: 4937, leap_household_size: 2}, expect: false}
  # Size 15, the largest household 3.751.2.C allows: $11,541.
  - {id: CO-1003-T3, as_of: "2027-02-01", month: "2027-02", given: {leap_application_date: "2027-02-01", leap_household_income: 11541, leap_household_size: 15}, expect: true}
  - {id: CO-1003-T4, as_of: "2027-02-01", month: "2027-02", given: {leap_application_date: "2027-02-01", leap_household_income: 11600, leap_household_size: 15}, expect: false}
  # Time audit T-9: each comparison tested at its limit, with the two sides equal (the strict/inclusive flip of the comparison fails it).
  - {"id": "CO-1003-T5", "month": "2026-11", "as_of": "2026-11-01", "title": "T-9: leap_household_income equal to [\"lookup\",[\"as_of\",\"leap_income_limit_monthly\",[\"det_date\"]],\"leap_household_size\"] (leap_household_income at or under [\"lookup\",[\"as_of\",\"leap_income_limit_monthly\",[\"det_date\"]],\"leap_household_size\"])", "given": {"leap_application_date": "2026-11-01", "leap_household_income": 4936, "leap_household_size": 2}, "expect": true}
  # Coverage pass 5, L5-5: the earlier tests state the application date (the as_of date); the table is the season's.
  - {"id": "CO-1003-T6", "title": "L5-5: a public assistance household's application of 2026-10-20, determined as of that date: the 2026-2027 season's table (from 2026-11-01) for two, $4,936: 4,936 within", "month": "2026-10", "as_of": "2026-10-20", "given": {"leap_application_date": "2026-10-20", "leap_household_income": 4936, "leap_household_size": 2}, "expect": true}
