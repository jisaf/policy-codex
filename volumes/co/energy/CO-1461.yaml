id: CO-1461
name: "LEAP: verification due date"
identifier: leap_verification_due_date
kind: derived
type: calendar date
scope: person
program: LEAP
role: outcome
meaning: "The date by which requested LEAP information or verification is due: two calendar weeks from the county's notice."
derived: [days_after, [+, leap_verification_response_days, [case, [[otherwise, leap_verification_extension_granted, false], leap_verification_extension_days], [else, 0]]], [otherwise, leap_verification_request_date, verification_request_date]]
sources: [S899]
implemented: engine
tags: [verification]
rationale: No existing item states when requested LEAP verification is due.
nearest: [CO-1392, CO-1414, CO-1426, CO-1437, CO-1450, CO-1656]
tests:
  - {id: CO-1461-T1, as_of: "2026-10-01", given: {verification_request_date: "2026-11-02"}, expect: "2026-11-16"}
  # OQ-300: the program's own request date, when stated, replaces the shared checklist date.
  - {id: CO-1461-T2, as_of: "2026-10-01", given: {leap_verification_request_date: "2026-10-20", verification_request_date: "2026-10-01"}, expect: "2026-11-03"}
  # 3.756.12.D: a good-cause extension adds up to two more weeks.
  - {id: CO-1461-T3, as_of: "2026-10-01", given: {verification_request_date: "2026-11-02", leap_verification_extension_granted: true}, expect: "2026-11-30"}
