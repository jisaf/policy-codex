id: CO-5009
name: "LEAP: a person's one-time receipts in the income verification period"
identifier: leap_one_time_receipts_in_period
kind: derived
type: money
scope: person
program: LEAP
meaning: "The person's receipts paid once that LEAP's counting table counts (inheritances, gifts, prizes and lottery winnings, insurance and injury proceeds: 9 CCR 2503-7 3.752.21.A, C, D) received in the income verification period, from the same date of the month before the application date through the application date (3.751.1, 3.752.22.A), other than a retroactive lump-sum benefit (3.752.23.EE); less the part of insurance or injury proceeds spent or to be spent on the costs they cover (3.752.21.C-D) and the claim expenses a one-time workers' compensation award includes (3.752.211.D)."
precision: "A receipt is placed by its month first: one received in a month before the month the period starts in, or after the application month, is outside; one received in the month before or the month of the application needs its date, and without it the result is unknown (the record's date is named as missing). A one-time receipt of a kind the table excludes is never asked for its date (before receipt records LEAP could not determine its income when such a payment was stated without the thirty-day facts). Replaces leap_person_one_time_income (CO-4069) with its thirty-day facts and the placement items CO-4961 and CO-4962."
derived: [sum_receipts, receipts, [all, ["=", [receipt, frequency], once], [not, [receipt, retroactive]], [in, [lookup, leap_receipt_treatment_table, [receipt, kind]], [counted, counted_no_rule_excludes]], [case, [[any, ["<", [receipt, month], [month_of, leap_income_verification_period_start]], [">", [receipt, month], [month_of, leap_application_date]]], false], [else, [all, [">=", [receipt, date], leap_income_verification_period_start], ["<=", [receipt, date], leap_application_date]]]]], ["-", [receipt, amount], ["+", [receipt, spent_on_covered_costs], [receipt, claim_expense]]]]
sources: [S2712, S2713, S2714, S3303, S3304, S2208, S3302]
implemented: engine
tags: [income]
open: [OQ-886]
rationale: "Receipt records, migration phase 1: the period's one-time receipts, each placed by its own date, replacing the thirty-day facts (CO-4065 to CO-4068, CO-4507 to CO-4509), the named-source part (CO-4960) and the inference of where a receipt sits (CO-4961, CO-4962)."
tests:
  - {id: CO-5009-T1, as_of: "2026-11-10", given: {leap_application_date: "2026-11-10", receipts: [{kind: other_nontaxable, amount: 2000, frequency: once, month: "2026-10", date: "2026-10-25"}]}, title: "An inheritance on October 25, inside the period (October 10 to November 10)", expect: 2000}
  - {id: CO-5009-T2, as_of: "2026-11-10", given: {leap_application_date: "2026-11-10", receipts: [{kind: other_nontaxable, amount: 2000, frequency: once, month: "2026-10", date: "2026-10-05"}]}, title: "An inheritance on October 5, before the period", expect: 0}
  - {id: CO-5009-T3, as_of: "2026-11-10", given: {leap_application_date: "2026-11-10", receipts: [{kind: other_nontaxable, amount: 2000, frequency: once, month: "2026-10"}]}, title: "October, no date: cannot be placed (its date is missing)", expect: unknown}
  - {id: CO-5009-T4, as_of: "2026-11-10", given: {leap_application_date: "2026-11-10", receipts: [{kind: other_nontaxable, amount: 2000, frequency: once, month: "2026-08"}]}, title: "August: before the period, no date needed", expect: 0}
  - {id: CO-5009-T5, as_of: "2026-11-10", given: {leap_application_date: "2026-11-10", receipts: [{kind: crime_victim_compensation, amount: 3000, frequency: once, month: "2026-11"}]}, title: "Crime victim compensation is excluded (G): its date is never asked", expect: 0}
  - {id: CO-5009-T6, as_of: "2026-11-10", given: {leap_application_date: "2026-11-10", receipts: [{kind: social_security, amount: 3000, frequency: once, retroactive: true, month: "2026-11", date: "2026-11-02"}, {kind: other_nontaxable, amount: 500, frequency: once, month: "2026-11", date: "2026-11-02"}]}, title: "A retroactive Social Security lump sum is excluded (EE); the $500 rest is counted", expect: 500}
  - {id: CO-5009-T7, as_of: "2026-11-10", given: {leap_application_date: "2026-11-10", receipts: [{kind: child_support_arrears, amount: 2000, frequency: once, month: "2026-10", date: "2026-10-25"}]}, title: "One-time child support arrears in the period are counted (receipt spike family F2)", expect: 2000}
  - {id: CO-5009-T8, as_of: "2026-11-10", given: {leap_application_date: "2026-11-10", receipts: [{kind: other_nontaxable, amount: 4000, frequency: once, month: "2026-11", date: "2026-11-01", spent_on_covered_costs: 1500}, {kind: resource_liquidation, amount: 2500, frequency: once, month: "2026-11", date: "2026-11-01"}]}, title: "Insurance proceeds less what they pay for (C-D); money from liquidating a resource excluded (GG)", expect: 2500}
  - {id: CO-5009-T9, as_of: "2026-11-10", given: {leap_application_date: "2026-11-10", receipts: [{kind: gambling_winnings, amount: 5000, frequency: once, month: "2026-11", date: "2026-11-04"}]}, title: "A $5,000 lottery prize in the period (3.752.21.A)", expect: 5000}
