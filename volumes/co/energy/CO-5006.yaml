id: CO-5006
name: "LEAP: a person's SSI without its cents"
identifier: leap_ssi_whole_dollars
kind: derived
type: money
scope: person-month
program: LEAP
meaning: The person's recurring SSI receipts of the month, counted in the month received and without their cents (9 CCR 2503-7 3.752.21.I).
