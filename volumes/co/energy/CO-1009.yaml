id: CO-1009
name: "LEAP: household members for income"
identifier: leap_household_members_for_income
kind: derived
type: group of persons
scope: person
program: LEAP
meaning: "The individuals living together as one economic unit for whom primary heating fuel is customarily purchased in common, or who make undesignated payments for heat in the form of rent, under 9 CCR 2503-7 3.751.1's \"Household\" definition - the same economic unit leap_household_members (CO-1000) computes, without CO-1000's citizenship and verification exclusions, since 3.753.18 and 3.751.1 \"Completed Application\" B count an excluded individual's income even though the individual is not a household member. A person who does not live at the dwelling (institutional group care) or who was already counted in another household approved for the same eligibility period (3.751.2.A) is not part of the unit."
precision: "As with leap_household_members (CO-1000), a stated spouse or parent/child relationship edge is read as living together for LEAP purposes, extended beyond 3.751.2.D's unconditional age-based joins by a stated shares_heat_with relationship (the role that replaced the retired shares_heating_fuel_with fact when OQ-132 was resolved) between any two persons, related or not (OQ-132, resolved), and an edge is not crossed to or from a person whose leap_living_arrangement is institutional_group_care (OQ-358); if leap_living_arrangement is not stated, LEAP reads it as an ordinary dwelling. Coverage review C-8 (final pass F-18): a civil union partner (the civil_union_partner role) is joined as a spouse is (3.751.2.D.3, S3312). 3.751.2.E is modeled: when a parent living with an ex-spouse after divorce or legal separation elects a separate household (leap_is_listed_separately_from_ex_spouse, CO-4519, read as false when not stated), the spouse or civil union edge to that parent is not crossed, and a child under eighteen of the electing parent (leap_is_child_of_parent_listed_separately, CO-4520) is not joined to the other parent; a shares_heat_with edge stated between the two still joins them. 3.751.21 and 3.751.22 need nothing further: a divorced couple has no spouse edge, and a legally separated couple who do not elect E stay joined, as the presumption of marriage reads. Coverage review C-7 (OQ-801): 3.752.23.U says \"foster care/kinship individuals are not considered LEAP Household members\", so a person whose child_welfare_payment_type is foster care (IV-E, State-funded, or IV-B services in foster care) or kinship guardianship (IV-E or State) is left out, the reading that the specific exclusion governs D.2's general join of a child with a guardian; adopted children are members. Same-word audit SW-4: a child under 18 joins a parent's or legal guardian's household (3.751.2.D, \"parent or guardian\"); the legal_guardian role is crossed as the parent role is. Same-word audit SW-7 (convention rule 17): an edge joins persons who live together (lives_with, CO-1925, from dwelling_id); where a case states no dwelling_id the edge is read as living together, as before. LEAP's household is individuals living together at a dwelling (3.751.1, 3.751.2.B, S1400). Coverage pass 4 L4-4: a child's age is read on the application date (leap_age_on_application_date, CO-6400; 3.752.2, \"household composition\" considered \"as of the date of application\"), so a child who turns eighteen between the application and the determination is still a child of the household. Three-pattern sweep T-8 (docs/reviews/pattern-sweep-snap-ce.md): a person of the case who died before leap_application_date (date_of_death, CO-2868) is not a member: the household is the persons living at the dwelling, as they stand on the date of the application (9 CCR 2503-7 3.751.1 \"Household\" and \"Point in Time\"). A person whose date of death is not stated is living. Before, a stated death changed nothing (probe CO-947). Three-pattern sweep D-1 (docs/reviews/pattern-sweep-snap-ce.md): lives_with (CO-1925) is read as stated, required where read: no text on file says that persons related on the application live together unless it says otherwise (9 CCR 2503-7 3.751.1 \"Household\": the persons living at the dwelling, S489), so a stated relationship is no longer read as living together where no dwelling_id is stated (decision 4; docs/conventions.md rule 17, as MAGI's readers since coverage pass 6, C6-10); a case with persons related across the edge states dwelling_id for each of them."
derived: ["filter", ["reachable", ["spouse", "civil_union_partner", "parent", "child", "legal_guardian", "ward", "shares_heat_with"], ["all", ["in_group", ["P"], "lives_with"], ["not", ["in", ["otherwise", "leap_living_arrangement", "traditional_dwelling"], ["institutional_group_care"]]], ["not", ["in", ["otherwise", ["of", ["P"], "leap_living_arrangement"], "traditional_dwelling"], ["institutional_group_care"]]], ["any", ["rel", ["spouse", "civil_union_partner", "shares_heat_with"], ["P"]], ["all", ["rel", ["parent", "legal_guardian"], ["P"]], ["any", ["<", ["of", ["P"], "leap_age_on_application_date"], "leap_household_child_age_limit"]], ["not", ["otherwise", ["of", ["P"], "is_emancipated_minor"], false]]], ["all", ["rel", ["child", "ward"], ["P"]], ["any", ["<", "leap_age_on_application_date", "leap_household_child_age_limit"]], ["not", ["otherwise", "is_emancipated_minor", false]]]], ["not", ["any", ["all", ["rel", ["spouse", "civil_union_partner"], ["P"]], ["any", ["otherwise", "leap_is_listed_separately_from_ex_spouse", false], ["otherwise", ["of", ["P"], "leap_is_listed_separately_from_ex_spouse"], false]]], ["all", ["rel", ["parent", "legal_guardian"], ["P"]], ["not", ["otherwise", "leap_is_listed_separately_from_ex_spouse", false]], ["of", ["P"], "leap_is_child_of_parent_listed_separately"]], ["all", ["rel", ["child", "ward"], ["P"]], ["not", ["otherwise", ["of", ["P"], "leap_is_listed_separately_from_ex_spouse"], false]], "leap_is_child_of_parent_listed_separately"]]]]], ["all", ["not", ["of", ["P"], "leap_is_in_another_approved_household"]], ["not", ["otherwise", ["<", ["of", ["P"], "date_of_death"], "leap_application_date"], false]], ["not", ["in", ["otherwise", ["of", ["P"], "child_welfare_payment_type"], "none"], ["title_iv_e_foster_care", "state_funded_foster_care", "title_iv_b_services_only", "title_iv_e_kinship_guardianship", "state_kinship_guardianship"]]]]]
sources: [S489, S490, S494, S1400, S1401, S893, S3300, S3312, S776]
open: [OQ-801]
implemented: engine
tags: [household]
rationale: "No existing item builds the LEAP economic unit unfiltered by citizenship; the review (docs/reviews/cccap-leap-phase-6.md, C-2, blocking) found 3.753.17's income-still-counted clause was only accidentally honoured because the citizenship exclusion was never implemented, and would silently break once leap_household_members (CO-1000) was filtered to fix that. leap_household_income (CO-1002) sums over it. Dual-entry audit 3.5: buying heat in common is stated once, by the shares_heat_with edge; the yes/no shares_heating_fuel_with (CO-895, retired) said no more and did not say with whom. Same-word SW-7: living together is read from lives_with."
tests:
  - {id: CO-1009-T1, as_of: "2026-10-01", given: {dwelling_id: h1, date_of_birth: "1985-01-22", leap_is_in_another_approved_household: false}, others: {p2: {dwelling_id: h1, date_of_birth: "1981-03-01", leap_is_in_another_approved_household: false, immigration_status: undocumented}}, relationships: [[spouse, p1, p2]], expect: [p1, p2]}
  - {id: CO-1009-T2, as_of: "2026-10-01", given: {dwelling_id: h1, date_of_birth: "1947-05-10", leap_is_in_another_approved_household: false}, others: {p2: {dwelling_id: h1, date_of_birth: "1945-08-30", leap_is_in_another_approved_household: false}, p3: {dwelling_id: h1, date_of_birth: "1984-06-15", leap_is_in_another_approved_household: false}}, relationships: [[spouse, p1, p2], [shares_heat_with, p1, p3], [parent, p1, p3], [parent, p2, p3]], expect: [p1, p2, p3]}
  - {id: CO-1009-T3, as_of: "2026-10-01", given: {dwelling_id: h1, leap_application_date: "2026-10-01", date_of_birth: "1947-05-10", leap_is_in_another_approved_household: false}, others: {p2: {dwelling_id: h1, date_of_birth: "1945-08-30", leap_is_in_another_approved_household: false}, p3: {dwelling_id: h1, date_of_birth: "1984-06-15", leap_is_in_another_approved_household: false}}, relationships: [[spouse, p1, p2], [parent, p1, p3], [parent, p2, p3]], expect: [p1, p2]}
  # 3.751.1 "Household": a spouse in a nursing facility (institutional group care) is not living together with the household, so her income is not counted with it either.
  - {id: CO-1009-T4, as_of: "2026-11-01", given: {date_of_birth: "1945-08-30", leap_is_in_another_approved_household: false}, others: {p2: {date_of_birth: "1947-05-10", leap_is_in_another_approved_household: false, leap_living_arrangement: institutional_group_care}}, relationships: [[spouse, p1, p2]], expect: [p1]}
  # 3.751.2.A: a member already counted in another approved household is not part of this economic unit, so the income is not counted twice.
  - {id: CO-1009-T5, as_of: "2026-11-01", given: {dwelling_id: h1, date_of_birth: "1985-01-22", leap_is_in_another_approved_household: false}, others: {p2: {dwelling_id: h1, date_of_birth: "1981-03-01", leap_is_in_another_approved_household: true}}, relationships: [[spouse, p1, p2]], expect: [p1]}
  # OQ-132: an undocumented roommate who shares heat is in the economic unit, so the income counts.
  - {id: CO-1009-T6, as_of: "2026-11-01", given: {dwelling_id: h1, date_of_birth: "1985-01-22", leap_is_in_another_approved_household: false}, others: {p2: {dwelling_id: h1, date_of_birth: "1990-07-01", leap_is_in_another_approved_household: false, immigration_status: undocumented}}, relationships: [[shares_heat_with, p2, p1]], expect: [p1, p2]}
  - {id: CO-1009-T7, title: "Coverage review C-8 (3.751.2.E): the ex-husband's own household for income, after the mother elects a separate household with their child", as_of: "2026-11-01", given: {leap_application_date: "2026-11-01", date_of_birth: "1983-07-01", leap_is_in_another_approved_household: false}, others: {p2: {date_of_birth: "1985-01-22", leap_is_listed_separately_from_ex_spouse: true, leap_is_in_another_approved_household: false}, p3: {date_of_birth: "2017-05-01", leap_is_in_another_approved_household: false}}, relationships: [[parent, p1, p3], [parent, p2, p3]], expect: [p1]}
  - {id: CO-1009-T20, title: "Three-pattern sweep T-8 (CO-947): a spouse who died before the application date is not counted for income", as_of: "2026-10-01", given: {dwelling_id: h1, leap_application_date: "2026-10-01", date_of_birth: "1985-01-22", leap_is_in_another_approved_household: false}, others: {p2: {dwelling_id: h1, date_of_birth: "1981-03-01", date_of_death: "2026-09-15", leap_is_in_another_approved_household: false, immigration_status: undocumented}}, relationships: [[spouse, p1, p2]], expect: [p1]}
