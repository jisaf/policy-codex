id: CO-1009
name: "LEAP: household members for income"
identifier: leap_household_members_for_income
kind: derived
type: group of persons
scope: person
program: LEAP
meaning: "The individuals living together as one economic unit for whom primary heating fuel is customarily purchased in common, or who make undesignated payments for heat in the form of rent, under 9 CCR 2503-7 3.751.1's \"Household\" definition - the same economic unit leap_household_members (CO-1000) computes, without CO-1000's citizenship and verification exclusions, since 3.753.18 and 3.751.1 \"Completed Application\" B count an excluded individual's income even though the individual is not a household member. A person who does not live at the dwelling (institutional group care) or who was already counted in another household approved for the same eligibility period (3.751.2.A) is not part of the unit."
precision: "As with leap_household_members (CO-1000), a stated spouse or parent/child relationship edge is read as living together for LEAP purposes, extended beyond 3.751.2.D's unconditional age-based joins by the supplied shares_heating_fuel_with (CO-895, see OQ-132), and an edge is not crossed to or from a person whose leap_living_arrangement is institutional_group_care (OQ-358); if leap_living_arrangement is not stated, LEAP reads it as an ordinary dwelling. This volume does not separately model 3.751.2.E's separate-household election or 3.751.21's permanent-separation test."
derived: [filter, [reachable, [spouse, parent, child], [all, [not, [in, [otherwise, leap_living_arrangement, traditional_dwelling], [institutional_group_care]]], [not, [in, [otherwise, [of, [P], leap_living_arrangement], traditional_dwelling], [institutional_group_care]]], [any, [rel, [spouse], [P]], [all, [rel, [parent], [P]], [any, ["<", [of, [P], age], leap_household_child_age_limit], [otherwise, [of, [P], shares_heating_fuel_with], false]], [not, [otherwise, [of, [P], is_emancipated_minor], false]]], [all, [rel, [child], [P]], [any, ["<", age, leap_household_child_age_limit], [otherwise, shares_heating_fuel_with, false]], [not, [otherwise, is_emancipated_minor, false]]]]]], [not, [of, [P], leap_is_in_another_approved_household]]]
sources: [S489, S490, S494, S1400, S1401, S893]
implemented: engine
tags: [household]
rationale: "No existing item builds the LEAP economic unit unfiltered by citizenship; the review (docs/reviews/cccap-leap-phase-6.md, C-2, blocking) found 3.753.17's income-still-counted clause was only accidentally honoured because the citizenship exclusion was never implemented, and would silently break once leap_household_members (CO-1000) was filtered to fix that. leap_household_income (CO-1002) sums over it."
tests:
  - {id: CO-1009-T1, as_of: "2026-10-01", given: {date_of_birth: "1985-01-22", leap_is_in_another_approved_household: false}, others: {p2: {date_of_birth: "1981-03-01", leap_is_in_another_approved_household: false, citizenship_status: undocumented}}, relationships: [[spouse, p1, p2]], expect: [p1, p2]}
  - {id: CO-1009-T2, as_of: "2026-10-01", given: {date_of_birth: "1947-05-10", leap_is_in_another_approved_household: false}, others: {p2: {date_of_birth: "1945-08-30", leap_is_in_another_approved_household: false}, p3: {date_of_birth: "1984-06-15", leap_is_in_another_approved_household: false, shares_heating_fuel_with: true}}, relationships: [[spouse, p1, p2], [parent, p1, p3], [parent, p2, p3]], expect: [p1, p2, p3]}
  - {id: CO-1009-T3, as_of: "2026-10-01", given: {date_of_birth: "1947-05-10", leap_is_in_another_approved_household: false}, others: {p2: {date_of_birth: "1945-08-30", leap_is_in_another_approved_household: false}, p3: {date_of_birth: "1984-06-15", leap_is_in_another_approved_household: false, shares_heating_fuel_with: false}}, relationships: [[spouse, p1, p2], [parent, p1, p3], [parent, p2, p3]], expect: [p1, p2]}
  # 3.751.1 "Household": a spouse in a nursing facility (institutional group care) is not living together with the household, so her income is not counted with it either.
  - {id: CO-1009-T4, as_of: "2026-11-01", given: {date_of_birth: "1945-08-30", leap_is_in_another_approved_household: false}, others: {p2: {date_of_birth: "1947-05-10", leap_is_in_another_approved_household: false, leap_living_arrangement: institutional_group_care}}, relationships: [[spouse, p1, p2]], expect: [p1]}
  # 3.751.2.A: a member already counted in another approved household is not part of this economic unit, so the income is not counted twice.
  - {id: CO-1009-T5, as_of: "2026-11-01", given: {date_of_birth: "1985-01-22", leap_is_in_another_approved_household: false}, others: {p2: {date_of_birth: "1981-03-01", leap_is_in_another_approved_household: true}}, relationships: [[spouse, p1, p2]], expect: [p1]}
