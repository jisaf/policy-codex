id: CO-4961
name: "LEAP: a person's excluded receipts that can be paid as one sum"
identifier: leap_excluded_source_receipts
kind: derived
type: money
scope: person-month
program: LEAP
meaning: "The month's receipts of the sources 9 CCR 2503-7 3.752.23 and 3.752.211.D exclude that a payer can pay either each month or as one sum: Colorado crime victim compensation (G), foster care and kinship payments (U), State and county diversion payments (W), reverse mortgage payments (X), subsidized housing utility allowances (Y), G.I. Bill housing and food allowances (Z), refugee resettlement payments (AA), Colorado Works supportive services (FF), and the amounts a workers' compensation award includes for the claim's medical, legal or related expenses (3.752.211.D)."
precision: "The sum of crime_victim_compensation_received (CO-3813), foster_care_provider_payments_received (CO-3821), kinship_care_payments_received (CO-4503), tanf_diversion_payment_received (CO-4850), reverse_mortgage_payments_received (CO-3820), housing_utility_allowance_received (CO-4500), gi_bill_housing_and_food_allowances_received (CO-4501), refugee_resettlement_payments_received (CO-4367), tanf_supportive_service_payments_received (CO-4452) and workers_compensation_claim_expense_amounts_received (CO-4502), each read as 0 when not stated. Each is part of the gross unearned income facts, and a one-time payment of any of them is also part of lump_sum_received (CO-3367). Where the money sits is decided once, by leap_excluded_receipts_in_lump_sum (CO-4962): leap_excluded_unearned_income (CO-4511) subtracts the rest from the recurring figure and leap_person_one_time_income (CO-4069) subtracts that part from the lump sum. Income set aside under a PASS (DD) and AmeriCorps payments (F) are recurring and are CO-4511's own terms."
derived: ["+", [otherwise, crime_victim_compensation_received, 0], [otherwise, foster_care_provider_payments_received, 0], [otherwise, kinship_care_payments_received, 0], [otherwise, tanf_diversion_payment_received, 0], [otherwise, reverse_mortgage_payments_received, 0], [otherwise, housing_utility_allowance_received, 0], [otherwise, gi_bill_housing_and_food_allowances_received, 0], [otherwise, refugee_resettlement_payments_received, 0], [otherwise, tanf_supportive_service_payments_received, 0], [otherwise, workers_compensation_claim_expense_amounts_received, 0]]
sources: [S1624, S3300, S3304, S3595, S3302]
implemented: engine
tags: [income]
rationale: "Coverage review 3 F3-2 (P1): the excluded receipts that can be paid as one sum were subtracted from the recurring figure even when the same money was a lump sum, which the recurring figure had already left out (probe PR3-L3: $2,500 of wages, $900 of child support and a $3,000 one-time compensation payment gave $5,500; the child support was consumed by the second subtraction and the compensation counted). They are summed once here so the decision of where they sit (CO-4962) and both subtractions read the same amount."
nearest: [CO-4511]
