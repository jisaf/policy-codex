id: CO-5120
name: "LEAP: ongoing pay stated as streams, converted to a month"
identifier: leap_ongoing_wage_streams
kind: derived
type: money
scope: person-month
program: LEAP
meaning: "The person's earned ongoing income (9 CCR 2503-7 3.752.22.B, S2713) from the earnings records (earnings, CO-5100) that state a job's pay as a stream (no pay date) and whose kind LEAP's counting table counts as pay (leap_earnings_treatment_table, CO-5102: wages and the other pay no paragraph of 3.752.23 excludes, and in-kind pay at its declared value, 3.752.22.C.4), converted to a month as 3.752.22.C does for a household member \"paid less than monthly\": four gross weekly amounts (C.1.a), two bi-weekly amounts (C.1.b) or two semi-monthly amounts (C.2), the amount of one pay being the record's per_payment; for pay made monthly, or less often, the amount the record states for the month; less the part set aside under a Plan for Achieving Self-Support (3.752.23.DD). A job that began in the income verification period or ended on or before the application date is read by its pays in the period instead (leap_wages_in_income_verification_period, CO-3912)."
precision: "Earned-income records, step E1 (LEAP): replaces the person's one pay schedule (wages_pay_frequency, CO-3921, and wages_gross_per_pay_period, CO-3922), so each job is converted by its own schedule and two jobs are statable. The number of pays is leap_pay_periods_per_month (CO-3924). A stream recurs in every month (its month's when_absent) unless it states a month, and is read in the month determined (leap_household_income, CO-1002, reads the month of the application). A monthly stream's month is its amount; when it states only the amount of one pay (per_payment), that pay is the month's (one monthly pay is the month's income). A weekly, bi-weekly or semi-monthly stream with no per_payment cannot be converted, and the per_payment is named as missing. A stream of a frequency 3.752.22.C does not convert (once, every other month, quarterly, twice a year, annually) is counted at the amount it states for the month (OQ-1160). The set-aside of a converted stream is the month's and is taken off the converted pay, not below zero. Senior Community Service Employment Program pay is leap_scsep_wages (CO-5122)."
derived: ["sum_receipts", "earnings", ["all", ["any", ["in", ["lookup", "leap_earnings_treatment_table", ["receipt", "kind"]], ["counted", "counted_no_rule_excludes", "counted_at_value"]], ["all", ["=", ["lookup", "leap_earnings_treatment_table", ["receipt", "kind"]], "counted_unless_foster_care"], ["not", ["receipt", "foster_care"]]]], ["not", ["any", ["case", [["unknown", ["receipt", "job_start_date"]], false], ["else", [">=", ["receipt", "job_start_date"], "leap_income_verification_period_start"]]], ["case", [["unknown", ["receipt", "job_end_date"]], false], ["else", ["<=", ["receipt", "job_end_date"], "leap_application_date"]]]]], ["unknown", ["receipt", "date"]], ["received_in", ["month"]]], ["case", [["in", ["receipt", "frequency"], ["weekly", "biweekly", "semimonthly"]], ["-", ["*", ["receipt", "per_payment"], ["lookup", "leap_pay_periods_per_month", ["receipt", "frequency"]]], ["min", ["receipt", "pass_set_aside"], ["*", ["receipt", "per_payment"], ["lookup", "leap_pay_periods_per_month", ["receipt", "frequency"]]]]]], [["=", ["receipt", "frequency"], "monthly"], ["case", [["unknown", ["receipt", "amount"]], ["-", ["receipt", "per_payment"], ["min", ["receipt", "pass_set_aside"], ["receipt", "per_payment"]]]], ["else", ["-", ["receipt", "amount"], ["min", ["receipt", "pass_set_aside"], ["receipt", "amount"]]]]]], ["else", ["-", ["receipt", "amount"], ["min", ["receipt", "pass_set_aside"], ["receipt", "amount"]]]]]]
sources: [S2713, S3305, S3300, S3301, S2208]
implemented: engine
tags: [income]
open: [OQ-681, OQ-1160]
rationale: "Earned-income records, E1 (LEAP): leap_person_wages (CO-3925) converted one pay schedule per person; with dated records the pay of each job is converted by its own schedule (design 2.5: \"dated pays in the eight weeks before application, averaged and multiplied by pays per month\"; a stream states that pay directly)."
tests:
  # 3.752.22.C.1.a: $500 a week, four weekly amounts: 4 x $500 = $2,000 (the record's month holds five Fridays, $2,500, which C does not use).
  - {id: CO-5120-T1, title: "Paid $500 a week: four weekly amounts, $2,000", as_of: "2026-12-01", month: "2026-12", given: {earnings: [{kind: wages, amount: 2500, frequency: weekly, per_payment: 500}]}, expect: 2000}
  # C.1.b: 2 x $1,100 = $2,200.
  - {id: CO-5120-T2, title: "Paid $1,100 every two weeks: two amounts, $2,200", as_of: "2026-12-01", month: "2026-12", given: {earnings: [{kind: wages, frequency: biweekly, per_payment: 1100}]}, expect: 2200}
  # C.2: 2 x $1,300 = $2,600.
  - {id: CO-5120-T3, title: "Paid $1,300 twice a month: two amounts, $2,600", as_of: "2026-12-01", month: "2026-12", given: {earnings: [{kind: wages, frequency: semimonthly, per_payment: 1300}]}, expect: 2600}
  - {id: CO-5120-T4, title: "Paid monthly (no schedule stated: monthly): the month's $2,600", as_of: "2026-12-01", month: "2026-12", given: {earnings: [{kind: wages, amount: 2600}]}, expect: 2600}
  - {id: CO-5120-T5, title: "Paid $2,000 monthly, stated as one pay: $2,000", as_of: "2026-12-01", month: "2026-12", given: {earnings: [{kind: wages, frequency: monthly, per_payment: 2000}]}, expect: 2000}
  # $500 a week, $300 a month set aside under an approved PASS (3.752.23.DD): 4 x $500 - $300 = $1,700.
  - {id: CO-5120-T6, title: "A PASS set-aside of $300 a month off weekly pay of $500", as_of: "2026-12-01", month: "2026-12", given: {earnings: [{kind: wages, frequency: weekly, per_payment: 500, pass_set_aside: 300}]}, expect: 1700}
  - {id: CO-5120-T7, title: "A job that began in the period is read by its dated pays (CO-3912), not here", as_of: "2026-12-01", month: "2026-12", given: {leap_application_date: "2026-12-01", earnings: [{kind: wages, frequency: weekly, per_payment: 500, job_start_date: "2026-11-20"}]}, expect: 0}
  - {id: CO-5120-T8, title: "Pay stated for September only is not the December pay", as_of: "2026-12-01", month: "2026-12", given: {earnings: [{kind: wages, amount: 900, month: "2026-09"}]}, expect: 0}
  # 3.752.22.C.4: rent-free housing declared at $700 for managing the building, and $1,850 of monthly wages: $700 + $1,850 = $2,550.
  - {id: CO-5120-T9, title: "In-kind pay at its declared value with monthly wages (3.752.22.C.4)", as_of: "2026-11-10", month: "2026-11", given: {earnings: [{kind: wages, amount: 1850}, {kind: in_kind_pay, amount: 700}]}, expect: 2550}
  - {id: CO-5120-T10, title: "An employer's health insurance subsidy (3.752.23.HH) and work-study (P) are excluded; SCSEP pay is read apart", as_of: "2026-11-10", month: "2026-11", given: {earnings: [{kind: employer_health_insurance_subsidy, amount: 150}, {kind: work_study, amount: 400}, {kind: scsep_employment, amount: 600}]}, expect: 0}
  - {id: CO-5120-T11, title: "Weekly pay with the amount of a pay not stated: cannot be converted", as_of: "2026-12-01", month: "2026-12", given: {earnings: [{kind: wages, amount: 2000, frequency: weekly}]}, expect: unknown}
  - {id: CO-5120-T12, title: "Earnings not stated: cannot determine", as_of: "2026-12-01", month: "2026-12", given: {}, expect: unknown}
  - {id: CO-5120-T13, title: "Earnings stated empty: none", as_of: "2026-12-01", month: "2026-12", given: {earnings: []}, expect: 0}
  # Two jobs: $500 a week and $1,100 every two weeks: 4 x $500 + 2 x $1,100 = $2,000 + $2,200 = $4,200.
  - {id: CO-5120-T14, title: "Two jobs on different schedules, each converted by its own", as_of: "2026-12-01", month: "2026-12", given: {earnings: [{kind: wages, frequency: weekly, per_payment: 500}, {kind: wages, frequency: biweekly, per_payment: 1100}]}, expect: 4200}
  # Coverage pass 4 X4-2: a $900 difficulty of care payment for a foster child placed in the home: 3.752.23.U excludes "Payment received as foster
  # care/kinship income": $0. The same payment under an HCBS waiver: no paragraph of 3.752.23 excludes it, $900 a month.
  - {id: CO-5120-T15, title: "A difficulty of care payment for a foster child is excluded (3.752.23.U)", as_of: "2026-12-01", month: "2026-12", given: {earnings: [{kind: difficulty_of_care_payment, amount: 900, foster_care: true}]}, expect: 0}
  - {id: CO-5120-T16, title: "A difficulty of care payment under an HCBS waiver is counted", as_of: "2026-12-01", month: "2026-12", given: {earnings: [{kind: difficulty_of_care_payment, amount: 900}]}, expect: 900}
