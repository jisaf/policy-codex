  - {"id": "CO-5003-T12", "title": "L5-1: a stream from 2026-09-01 through 2026-12-31, running through the whole period: 1,200", "month": "2026-11", "as_of": "2026-11-10", "given": {"leap_application_date": "2026-11-10", "receipts": [{"kind": "unemployment_compensation", "amount": 1200, "start_date": "2026-09-01", "end_date": "2026-12-31"}]}, "expect": 1200}
