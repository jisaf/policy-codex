id: CO-5003
name: "LEAP: a person's counted recurring receipts"
identifier: leap_counted_recurring_receipts
kind: derived
type: money
scope: person-month
program: LEAP
meaning: "The person's recurring receipts of the month that LEAP's counting table counts (leap_receipt_treatment_table: counted, or counted because no rule excludes it), at the amount received in the month, or, for a receipt stated with its date, received in the income verification period after its first day through the application date: one month's income (9 CCR 2503-7 3.752.22.A), other than Social Security and SSI (each counted without its cents) and Colorado Works and Adult Financial cash assistance (leap_cash_assistance_receipts). Each is less the part received for a person who does not live with the person (3.752.212, S3306: a military allotment is income \"for those individuals included in the budget unit\"; 3.752.211.E, S4043: the part of a VA pension paid for a dependent is \"countable unearned income to the dependent rather than the veteran\") and the part of insurance or injury proceeds spent or to be spent on the costs they cover (3.752.21.C-D); income from jointly owned property at the larger of the owner's share of the property's income and the amount received (3.752.21.F, S4850)."
precision: "A receipt is recurring when it is not paid once; it is received in the month when it states the month, or states none (it recurs in every month). Read for the month of the application (leap_household_income, CO-1002). Replaces unearned_income_prior_thirty_days (CO-3913) for LEAP: the thirty-day figure the case could state is not restated, since 3.752.22.A caps the period's unearned income at one month's income. Coverage pass 4 L4-3 (docs/reviews/coverage4-care-energy.md): a recurring receipt stated with its date is read by its date in the income verification period (9 CCR 2503-7 3.752.22.A: \"received in the income verification period, not to exceed one month's income\"; C.3.a, C.3.c), after the period's first day (leap_income_verification_period_start, CO-5002) through the application date (leap_application_date), not by the calendar month: the period is then one month long, so a monthly source paid on the application date's day of the month is counted once (the cap of A; OQ-681); a receipt stated without a date is read in the month, as before. Coverage pass 5, L5-1 (docs/reviews/coverage5-care-energy.md): a recurring receipt stated with neither a month nor a date (a stream) is read in the month of the application only when its source ran through the whole income verification period (its start_date before the period's first day or not stated, its end_date after the application date or not stated); it is not counted when its end_date is before the period's first day (3.752.22.C.3.a: \"use actual income received in the income verification period\", none) or its start_date is after the application date (C.3.c: \"If a household member has not received his/her first check from this source of income as of the income verification period, do not count any income from this source\", S2713); and a source that began or ended in the period is read from its dated receipts (C.3.a, C.3.c), so a stream without them cannot determine and the record's date is named as missing, as leap_wages_in_income_verification_period (CO-3912) reads a job that began or ended (OQ-681 (4)). Coverage pass 5 (docs/reviews/coverage5-care-energy.md): L5-2, the record's for_person_living_elsewhere is taken off: the part of an allotment or a VA award paid for a child living with a former spouse is not the household's (review households LM1 and LM2, CO-801 and CO-802). A VA dependent living with the veteran is a member of the veteran's household (3.751.1 \"Household\", S1400: \"living together as one economic unit\"; 3.751.2.D, a spouse and a child under eighteen cannot be a separate household), so the dependent's part (for_dependent) is the household's income either way and is not read; a dependent living elsewhere is the part for_person_living_elsewhere states. X5-1: a record stating ownership_share and property_income counts the larger of the share of the property's income and the amount received (OQ-1316). Field sweep (docs/reviews/field-sweep-care-energy.md): proceeds paid as a recurring receipt are counted less spent_on_covered_costs (3.752.21.C-D, S3303), as a one-time payment is. None below zero."
