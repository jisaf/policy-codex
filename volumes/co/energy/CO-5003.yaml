rationale: "Receipt records, migration phase 1: LEAP's recurring unearned income, read from the receipts through its counting table."
tests:
  - {id: CO-5003-T1, month: "2026-11", as_of: "2026-11-10", given: {leap_application_date: "2026-11-10", receipts: [{kind: pension, amount: 610}, {kind: child_support, amount: 300}, {kind: crime_victim_compensation, amount: 900}, {kind: social_security, amount: 1000}]}, title: "Pension and child support counted; crime victim compensation excluded (G); Social Security read on its own", expect: 910}
  - {id: CO-5003-T2, month: "2026-11", as_of: "2026-11-10", given: {leap_application_date: "2026-11-10", receipts: [{kind: pension, amount: 610, month: "2026-10"}, {kind: gift, amount: 50, month: "2026-11"}]}, title: "Only the month's receipts: October's pension is not November's", expect: 50}
  - {id: CO-5003-T3, month: "2026-11", as_of: "2026-11-10", given: {leap_application_date: "2026-11-10", receipts: [{kind: other_nontaxable, amount: 2000, frequency: once, month: "2026-11", date: "2026-11-03"}]}, title: "A one-time receipt is not recurring income (leap_one_time_receipts_in_period reads it)", expect: 0}
  - {id: CO-5003-T4, month: "2026-11", as_of: "2026-11-10", given: {leap_application_date: "2026-11-10", receipts: []}, title: "No receipts: none", expect: 0}
  - {id: CO-5003-T5, month: "2026-11", as_of: "2026-11-10", given: {leap_application_date: "2026-11-10"}, title: "Receipts not stated: cannot determine", expect: unknown}
  # Coverage pass 4 L4-3 (household U1, stored as CO-712): application November 10, 2026; the income verification period runs after October 10
  # through November 10 (CO-5002). Unemployment of $300 a week first paid November 13, then 20 and 27: no check by the period (3.752.22.C.3.c,
  # "has not received his/her first check ... do not count any income from this source"): $0. (Before the fix: the November receipts, $900.)
  - {id: CO-5003-T6, month: "2026-11", as_of: "2026-11-10", given: {leap_application_date: "2026-11-10", receipts: [{kind: unemployment_compensation, amount: 300, frequency: weekly, date: "2026-11-13"}, {kind: unemployment_compensation, amount: 300, frequency: weekly, date: "2026-11-20"}, {kind: unemployment_compensation, amount: 300, frequency: weekly, date: "2026-11-27"}]}, title: "Unemployment first paid after the application date: not counted (C.3.c)", expect: 0}
  # Household U2 (CO-713): unemployment of $300 paid October 16, 23 and 30, then exhausted: all three are in the period (3.752.22.A, C.3.a,
  # "use actual income received in the income verification period"): 3 x $300 = $900. (Before the fix: no November receipt, $0.)
  - {id: CO-5003-T7, month: "2026-11", as_of: "2026-11-10", given: {leap_application_date: "2026-11-10", receipts: [{kind: unemployment_compensation, amount: 300, frequency: weekly, date: "2026-10-16"}, {kind: unemployment_compensation, amount: 300, frequency: weekly, date: "2026-10-23"}, {kind: unemployment_compensation, amount: 300, frequency: weekly, date: "2026-10-30"}]}, title: "Unemployment that ended before the application, paid in the period: $900 (A, C.3.a)", expect: 900}
  # A monthly pension of $610 paid on the 10th: October 10 is the period's first day, November 10 the application date. "Not to exceed one month's
  # income" (A): the period is read as one month, after its first day through the application date, so one payment counts: $610.
  - {id: CO-5003-T8, month: "2026-11", as_of: "2026-11-10", given: {leap_application_date: "2026-11-10", receipts: [{kind: pension, amount: 610, frequency: monthly, date: "2026-10-10"}, {kind: pension, amount: 610, frequency: monthly, date: "2026-11-10"}]}, title: "A monthly payment on the application date's day of the month is counted once", expect: 610}
  # Review U3: weekly child support of $200 paid on the Fridays January 1, 8, 15, 22 and 29, 2027; application January 29, 2027. The period runs
  # after December 29, 2026 (January 29 less the 31 days of December) through January 29: all five pays, 5 x $200 = $1,000, as received (OQ-681:
  # the period itself is the one month; the alternative, four weekly amounts as C.1.a adds them, gives $800).
  - {id: CO-5003-T9, month: "2027-01", as_of: "2027-01-29", given: {leap_application_date: "2027-01-29", receipts: [{kind: child_support, amount: 200, frequency: weekly, date: "2027-01-01"}, {kind: child_support, amount: 200, frequency: weekly, date: "2027-01-08"}, {kind: child_support, amount: 200, frequency: weekly, date: "2027-01-15"}, {kind: child_support, amount: 200, frequency: weekly, date: "2027-01-22"}, {kind: child_support, amount: 200, frequency: weekly, date: "2027-01-29"}]}, title: "Five weekly receipts in the period: counted as received (OQ-681)", expect: 1000}
  # Coverage pass 5 (docs/reviews/coverage5-care-energy.md), L5-1: application 2026-11-10, so the income verification period runs after 2026-10-10 through 2026-11-10 (CO-5002, OQ-681 (4)).
