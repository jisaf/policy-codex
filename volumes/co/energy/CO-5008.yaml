id: CO-5008
name: "LEAP: a person's income set aside"
identifier: leap_receipts_set_aside
kind: derived
type: money
scope: person-month
program: LEAP
meaning: The parts of the person's counted recurring receipts of the month set aside under a Plan for Achieving Self-Support (9 CCR 2503-7 3.752.23.DD) or paid in a workers' compensation award for the claim's medical, legal or related expenses (3.752.211.D).
precision: "Read from the receipt the part comes out of (pass_set_aside, claim_expense). leap_person_unearned_income (CO-3926) subtracts it from the recurring receipts and Social Security together, not below zero (coverage review 3 F3-1: a PASS set-aside is most often Social Security disability income). Coverage pass 4 L4-3 (docs/reviews/coverage4-care-energy.md): a recurring receipt stated with its date is read by its date in the income verification period (9 CCR 2503-7 3.752.22.A: \"received in the income verification period, not to exceed one month's income\"; C.3.a, C.3.c), after the period's first day (leap_income_verification_period_start, CO-5002) through the application date (leap_application_date), not by the calendar month: the period is then one month long, so a monthly source paid on the application date's day of the month is counted once (the cap of A; OQ-681); a receipt stated without a date is read in the month, as before. Coverage pass 5, L5-1 (docs/reviews/coverage5-care-energy.md): a recurring receipt stated with neither a month nor a date (a stream) is read in the month of the application only when its source ran through the whole income verification period (its start_date before the period's first day or not stated, its end_date after the application date or not stated); it is not counted when its end_date is before the period's first day (3.752.22.C.3.a: \"use actual income received in the income verification period\", none) or its start_date is after the application date (C.3.c: \"If a household member has not received his/her first check from this source of income as of the income verification period, do not count any income from this source\", S2713); and a source that began or ended in the period is read from its dated receipts (C.3.a, C.3.c), so a stream without them cannot determine and the record's date is named as missing, as leap_wages_in_income_verification_period (CO-3912) reads a job that began or ended (OQ-681 (4))."
