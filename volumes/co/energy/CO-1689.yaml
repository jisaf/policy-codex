id: CO-1689
name: "LEAP: earned income verification is pending"
identifier: leap_earned_income_verification_is_pending
kind: derived
type: yes/no
scope: person-month
program: LEAP
role: outcome
meaning: Whether LEAP requires pay stubs or an employer statement for the person's wages and they have not been provided.
derived: [all, leap_requires_verification_of_earned_income, [not, earned_income_verification_document_received]]
sources: [S897, S898]
implemented: engine
tags: [verification, income]
rationale: "Review U-1: the count items held this test as an anonymous arm, so no outcome told a worker which document was outstanding and for whom; the count now sums this item."
tests:
  - {id: CO-1689-T1, month: "2026-10", as_of: "2026-10-01", given: {leap_requires_verification_of_earned_income: true, earned_income_verification_document_received: false}, expect: true}
  - {id: CO-1689-T2, month: "2026-10", as_of: "2026-10-01", given: {leap_requires_verification_of_earned_income: false}, expect: false}
