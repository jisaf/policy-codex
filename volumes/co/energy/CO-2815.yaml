  - {id: CO-2815-T3, title: "OQ-561: living in a tent, a non-traditional dwelling (3.751.1)", as_of: "2026-11-01", given: {nighttime_residence_type: place_not_designed_for_sleeping}, expect: true}
  - {id: CO-2815-T4, title: "Coverage review C-2: an eviction notice (imminently losing the home) is not homelessness; the 3.751.1 emergency applicant", as_of: "2026-11-01", given: {nighttime_residence_type: imminently_losing_residence}, expect: false}
  - {id: CO-2815-T5, title: "Coverage review 2 N-4: in a hotel for lack of an alternative since September 1, heat in the rent, applying November 10: B.8 is met, not homeless", as_of: "2026-11-10", given: {nighttime_residence_type: motel_or_hotel_for_lack_of_alternative, residence_setting_type: hotel, institution_entry_date: "2026-09-01", leap_application_date: "2026-11-10", home_heating_cost_arrangement: included_in_rent}, expect: false}
  - {id: CO-2815-T6, title: "N-4: the same household, in the hotel since November 1 (nine days): homeless", as_of: "2026-11-10", given: {nighttime_residence_type: motel_or_hotel_for_lack_of_alternative, residence_setting_type: hotel, institution_entry_date: "2026-11-01", leap_application_date: "2026-11-10", home_heating_cost_arrangement: included_in_rent}, expect: true}
