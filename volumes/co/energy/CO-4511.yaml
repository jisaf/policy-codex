id: CO-4511
name: "LEAP: a person's excluded unearned income"
identifier: leap_excluded_unearned_income
kind: derived
type: money
scope: person-month
program: LEAP
meaning: "The part of this person's recurring unearned income for the month that 9 CCR 2503-7 3.752.23 and 3.752.211.D exclude and that the thirty-day unearned income figure (unearned_income_prior_thirty_days, CO-3913) does not already leave out and that is not part of a lump sum: AmeriCorps payments below the minimum wage for the hours served (F), Colorado crime victim compensation (G), foster care and kinship payments (U), State and county diversion payments (W), reverse mortgage payments (X), subsidized housing utility allowances (Y), G.I. Bill housing and food allowances (Z), the one-time refugee resettlement grant when stated as a month's receipt (AA), income set aside under a Plan for Achieving Self-Support (DD), Colorado Works supportive services (FF), and the amounts a workers' compensation award includes for the claim's medical, legal or related expenses (3.752.211.D)."
precision: "Coverage review 3 F3-2: the receipts a payer can pay either each month or as one sum are leap_excluded_source_receipts (CO-4961); the part of them that is a lump sum is decided once, by leap_excluded_receipts_in_lump_sum (CO-4962), and is subtracted from the lump sum by leap_person_one_time_income (CO-4069). This item subtracts the rest: the receipts less the part CO-4962 places in the lump sum, as far as the month's lump sum (lump_sum_received, CO-3367), which CO-3913 already leaves out of the recurring figure, reaches. It adds pass_set_aside_income (CO-3825) and the AmeriCorps payments below; each is part of the gross unearned income facts or of the fact that names the source; an unstated receipt is 0. Each is read for the month being determined (the month of the application, as leap_household_income CO-1002 reads it) and taken as the receipt of that source in the thirty days before the application, as CO-3913 takes the month's receipts when the thirty-day figure is not stated; this is right when the payment is the same each month. leap_person_unearned_income (CO-3926) subtracts it from the thirty-day figure and the month's Social Security together, not below zero (F3-1: a PASS set-aside is often Social Security disability income). The receipts the thirty-day figure already leaves out (financial aid, loans, reimbursements, energy assistance, tax refunds, federally excluded payments; S2208) are not repeated here. 3.752.23.V's home care allowance \"paid to a non-household member\" is not a member's receipt and needs no fact. Coverage review 2 N-1: W (diversion) and FF (supportive services) are not part of tanf_cash_income (CO-029), but a case states them in the unearned income facts CO-3913 sums, so they are subtracted here. N-5: AmeriCorps payments are subtracted when americorps_service_hours (CO-4853) is stated and the payments divided by the hours are below colorado_minimum_wage (CO-4730), the statewide wage every Colorado employer must pay (S3508; OQ-781, resolved, read the Adult Financial rule's \"minimum wage standard\" so); with the hours not stated they are counted. Foster grandparent, senior companion, VISTA and the other Domestic Volunteer Service Act payments are federally_excluded_payments_received, which CO-3913 already leaves out. N-6 and F3-2: the one-time resettlement grant (AA) is subtracted once whichever facts state it: refugee_resettlement_payments_received (reception and placement money and the Interim Cash Payment, OQ-863) is one of CO-4961's receipts, and the part in the lump sum (refugee_resettlement_grant_received_prior_thirty_days, CO-4508, or the month's lump sum when CO-4508 is not stated) is CO-4962's. Kinship payments are stated only in kinship_care_payments_received; adoption_subsidy_received (CO-4451) is adoption assistance, which 3.752.21.M counts. One-time receipts are excluded in leap_person_one_time_income (CO-4069)."
derived: [+, ["-", leap_excluded_source_receipts, [min, leap_excluded_source_receipts, [min, [otherwise, lump_sum_received, 0], leap_excluded_receipts_in_lump_sum]]], [otherwise, pass_set_aside_income, 0], [case, [["<=", [otherwise, americorps_payments_received, 0], 0], 0], [["<=", [otherwise, americorps_service_hours, 0], 0], 0], [["<", ["/", americorps_payments_received, americorps_service_hours], colorado_minimum_wage], americorps_payments_received], [else, 0]]]
sources: [S1624, S3300, S3304, S3595, S3302, S3508, S2713]
implemented: engine
tags: [income]
open: [OQ-681, OQ-863]
rationale: "Coverage review C-1 (P1): when leap_excluded_income (CO-2345) was retired in the final pass, LEAP lost every 3.752.23 exclusion the thirty-day figure does not subtract, so crime victim compensation, reverse mortgage payments and PASS income were counted although the volume states each receipt (probe RV-L1: $1,000 of wages and $3,000 of crime victim compensation gave $4,000 and an ineligible household). LEAP's own exclusion item sums the neutral receipt facts its list names, as cw_excluded_unearned_income (CO-2341) does for Colorado Works; the shared thirty-day figure (CO-3913), which CCCAP also reads, is unchanged. Coverage review 2 N-1 (P1), N-5 and N-6: supportive services, diversion payments, AmeriCorps payments and the resettlement grant stated as a month's receipt were counted (probe RV2-L2: $3,500 of wages and $400 of supportive services gave $3,900 and an ineligible household). Coverage review 3 F3-2 (P1): an excluded payment that was also a lump sum was subtracted here from income the recurring figure still held (probe PR3-L3: $900 of child support consumed) and counted in the lump sum, so only the part not in the lump sum (CO-4962) is subtracted here."
