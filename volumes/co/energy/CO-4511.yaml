id: CO-4511
name: "LEAP: a person's excluded unearned income"
identifier: leap_excluded_unearned_income
kind: derived
type: money
scope: person-month
program: LEAP
meaning: "The part of this person's recurring unearned income for the month that 9 CCR 2503-7 3.752.23 and 3.752.211.D exclude and that the thirty-day unearned income figure (unearned_income_prior_thirty_days, CO-3913) does not already leave out: AmeriCorps payments below the minimum wage for the hours served (F), Colorado crime victim compensation (G), foster care and kinship payments (U), State and county diversion payments (W), reverse mortgage payments (X), subsidized housing utility allowances (Y), G.I. Bill housing and food allowances (Z), the one-time refugee resettlement grant when stated as a month's receipt (AA), income set aside under a Plan for Achieving Self-Support (DD), Colorado Works supportive services (FF), and the amounts a workers' compensation award includes for the claim's medical, legal or related expenses (3.752.211.D)."
precision: "The sum of the neutral receipt facts the list names (crime_victim_compensation_received CO-3813, foster_care_provider_payments_received CO-3821, kinship_care_payments_received CO-4503, reverse_mortgage_payments_received CO-3820, housing_utility_allowance_received CO-4500, gi_bill_housing_and_food_allowances_received CO-4501, pass_set_aside_income CO-3825, workers_compensation_claim_expense_amounts_received CO-4502, tanf_diversion_payment_received CO-4850, tanf_supportive_service_payments_received CO-4452, refugee_resettlement_payments_received CO-4367, americorps_payments_received CO-4016), each part of the gross unearned income facts; an unstated receipt is 0. Each is read for the month being determined (the month of the application, as leap_household_income CO-1002 reads it) and taken as the receipt of that source in the thirty days before the application, as CO-3913 takes the month's receipts when the thirty-day figure is not stated; this is right when the payment is the same each month. leap_person_unearned_income (CO-3926) subtracts it from the thirty-day figure, not below zero. The receipts the thirty-day figure already leaves out (financial aid, loans, reimbursements, energy assistance, tax refunds, federally excluded payments; S2208) are not repeated here. 3.752.23.V's home care allowance \"paid to a non-household member\" is not a member's receipt and needs no fact. Coverage review 2 N-1: W (diversion) and FF (supportive services) are not part of tanf_cash_income (CO-029), but a case states them in the unearned income facts CO-3913 sums, so they are subtracted here. N-5: AmeriCorps payments are subtracted when americorps_service_hours (CO-4853) is stated and the payments divided by the hours are below colorado_minimum_wage (CO-4730), the statewide wage every Colorado employer must pay (S3508; OQ-781, resolved, read the Adult Financial rule's \"minimum wage standard\" so); with the hours not stated they are counted. Foster grandparent, senior companion, VISTA and the other Domestic Volunteer Service Act payments are federally_excluded_payments_received, which CO-3913 already leaves out. N-6: the one-time resettlement grant (AA) is subtracted whichever fact states it: refugee_resettlement_payments_received (reception and placement money and the Interim Cash Payment, OQ-863) here, less the part also stated as refugee_resettlement_grant_received_prior_thirty_days (CO-4508), which leap_person_one_time_income (CO-4069) subtracts from the lump sum, so a grant stated in both is subtracted once. Kinship payments are stated only in kinship_care_payments_received; adoption_subsidy_received (CO-4451) is adoption assistance, which 3.752.21.M counts. One-time receipts are excluded in leap_person_one_time_income (CO-4069)."
derived: [+, [otherwise, crime_victim_compensation_received, 0], [otherwise, foster_care_provider_payments_received, 0], [otherwise, kinship_care_payments_received, 0], [otherwise, reverse_mortgage_payments_received, 0], [otherwise, housing_utility_allowance_received, 0], [otherwise, gi_bill_housing_and_food_allowances_received, 0], [otherwise, pass_set_aside_income, 0], [otherwise, workers_compensation_claim_expense_amounts_received, 0], [otherwise, tanf_diversion_payment_received, 0], [otherwise, tanf_supportive_service_payments_received, 0], [max, 0, ["-", [otherwise, refugee_resettlement_payments_received, 0], [otherwise, refugee_resettlement_grant_received_prior_thirty_days, 0]]], [case, [["<=", [otherwise, americorps_payments_received, 0], 0], 0], [["<=", [otherwise, americorps_service_hours, 0], 0], 0], [["<", ["/", americorps_payments_received, americorps_service_hours], colorado_minimum_wage], americorps_payments_received], [else, 0]]]
sources: [S1624, S3300, S3304, S3595, S3302, S3508]
implemented: engine
tags: [income]
open: [OQ-681, OQ-863]
rationale: "Coverage review C-1 (P1): when leap_excluded_income (CO-2345) was retired in the final pass, LEAP lost every 3.752.23 exclusion the thirty-day figure does not subtract, so crime victim compensation, reverse mortgage payments and PASS income were counted although the volume states each receipt (probe RV-L1: $1,000 of wages and $3,000 of crime victim compensation gave $4,000 and an ineligible household). LEAP's own exclusion item sums the neutral receipt facts its list names, as cw_excluded_unearned_income (CO-2341) does for Colorado Works; the shared thirty-day figure (CO-3913), which CCCAP also reads, is unchanged. Coverage review 2 N-1 (P1), N-5 and N-6: supportive services, diversion payments, AmeriCorps payments and the resettlement grant stated as a month's receipt were counted (probe RV2-L2: $3,500 of wages and $400 of supportive services gave $3,900 and an ineligible household)."
tests:
  - {id: CO-4511-T1, title: "Nothing stated: nothing excluded", as_of: "2026-11-10", month: "2026-11", given: {}, expect: 0}
  - {id: CO-4511-T2, title: "$3,000 of crime victim compensation (G)", as_of: "2026-11-10", month: "2026-11", given: {crime_victim_compensation_received: 3000}, expect: 3000}
  - {id: CO-4511-T3, title: "A $400 kinship payment, a $60 housing utility allowance and a $1,200 G.I. Bill housing allowance (U, Y, Z)", as_of: "2026-11-10", month: "2026-11", given: {kinship_care_payments_received: 400, housing_utility_allowance_received: 60, gi_bill_housing_and_food_allowances_received: 1200}, expect: 1660}
  - {id: CO-4511-T4, title: "$500 of reverse mortgage payments, $200 set aside under a PASS, $300 of a workers' compensation payment for medical bills (X, DD, 3.752.211.D)", as_of: "2026-11-10", month: "2026-11", given: {reverse_mortgage_payments_received: 500, pass_set_aside_income: 200, workers_compensation_claim_expense_amounts_received: 300}, expect: 1000}
  - {id: CO-4511-T5, title: "Coverage review 2 N-1: $400 of Colorado Works supportive services (FF) and a $600 diversion payment (W)", as_of: "2026-11-10", month: "2026-11", given: {tanf_supportive_service_payments_received: 400, tanf_diversion_payment_received: 600}, expect: 1000}
  - {id: CO-4511-T6, title: "N-5: $1,600 of AmeriCorps living allowance for 160 hours served ($10 an hour, below the $15.16 Colorado minimum wage): excluded (F)", as_of: "2026-11-10", month: "2026-11", given: {americorps_payments_received: 1600, americorps_service_hours: 160}, expect: 1600}
  - {id: CO-4511-T7, title: "N-5: $2,600 for 160 hours ($16.25 an hour, above the minimum wage): counted", as_of: "2026-11-10", month: "2026-11", given: {americorps_payments_received: 2600, americorps_service_hours: 160}, expect: 0}
  - {id: CO-4511-T8, title: "N-5: AmeriCorps payments with the hours served not stated: counted", as_of: "2026-11-10", month: "2026-11", given: {americorps_payments_received: 1600}, expect: 0}
  - {id: CO-4511-T9, title: "N-6: $900 of reception and placement money stated as the month's receipt (AA)", as_of: "2026-11-10", month: "2026-11", given: {refugee_resettlement_payments_received: 900}, expect: 900}
  - {id: CO-4511-T10, title: "N-6: the same $900 grant also stated as the thirty days' lump-sum part: subtracted once, by CO-4069", as_of: "2026-11-10", month: "2026-11", given: {refugee_resettlement_payments_received: 900, refugee_resettlement_grant_received_prior_thirty_days: 900}, expect: 0}
