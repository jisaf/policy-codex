id: CO-1458
name: "LEAP: person's required verification count"
identifier: leap_person_required_verification_count
kind: derived
type: whole number
scope: person-month
program: LEAP
meaning: "The number of LEAP verification elements required for this person: an SSN (or proof of application) for every member, earned income of a non-child, unearned income, heating costs for the responsible member, questionable citizenship, and a declared immigration status."
derived: ["+", 1, [case, [leap_requires_verification_of_earned_income, 1], [else, 0]], [case, [has_unearned_income, 1], [else, 0]], [case, [leap_requires_verification_of_heating_costs, 1], [else, 0]], [case, [leap_requires_verification_of_citizenship, 1], [else, 0]], [case, [claims_lawful_immigration_status, 1], [else, 0]]]
sources: [S893, S896, S897]
implemented: engine
tags: [verification]
open: [OQ-318]
rationale: leap_verification_status needs to know whether the household has any verification requirement.
tests:
  - {id: CO-1458-T1, month: "2026-10", as_of: "2026-10-01", given: {leap_requires_verification_of_earned_income: false, has_unearned_income: true, leap_requires_verification_of_heating_costs: true, leap_requires_verification_of_citizenship: false, citizenship_status: citizen}, expect: 3}
