id: CO-1000
name: "LEAP: household members"
identifier: leap_household_members
kind: derived
type: group of persons
scope: person
program: LEAP
meaning: "The individuals living together as one economic unit for whom primary heating fuel is customarily purchased in common, or who make undesignated payments for heat in the form of rent, under 9 CCR 2503-7 3.751.1's \"Household\" definition - a spouse, or a child under eighteen living in the same dwelling as the parent or guardian (unless emancipated), per 3.751.2.D, or anyone the case states shares heating fuel in common under 3.751.1's general economic-unit test, reciprocally closed - leaving out a person who does not live at the dwelling (institutional group care), a member already counted in another household approved for the same eligibility period (3.751.2.A), a member who does not meet the citizenship requirement (3.753.18), and a member who meets it as declared but has provided no SSN or proof of application for one (3.751.1 \"Completed Application\" B) or whose declared immigration status SAVE has not verified (3.753.15, 3.753.17.A). The income of a member left out for status or verification is still counted (leap_household_members_for_income, CO-1009)."
precision: "As with snap_household_members (CO-305), a stated spouse or parent/child relationship edge is read as living together for LEAP purposes, extended beyond 3.751.2.D's unconditional age-based joins by a stated shares_heat_with relationship (the role that replaced the retired shares_heating_fuel_with fact when OQ-132 was resolved), which joins any two persons who buy heating fuel in common, related or not (OQ-132, resolved), except that an edge is not crossed to or from a person whose own leap_living_arrangement is institutional_group_care: 3.751.1 joins individuals \"living together\" and 3.751.2.B counts \"each person living at a dwelling\", so a spouse who has entered a nursing facility is not in the household at home (OQ-358, resolved). If leap_living_arrangement is not stated, LEAP reads it as an ordinary dwelling. The SSN test reads ssn_is_verified (a number furnished, an application shown, or SSA's confirmation); 3.751.1 B states no exception for a person who cannot obtain a number. Coverage review C-8 (final pass F-18): a civil union partner (the civil_union_partner role) is joined as a spouse is (3.751.2.D.3, S3312). 3.751.2.E is modeled: when a parent living with an ex-spouse after divorce or legal separation elects a separate household (leap_is_listed_separately_from_ex_spouse, CO-4519, read as false when not stated), the spouse or civil union edge to that parent is not crossed, and a child under eighteen of the electing parent (leap_is_child_of_parent_listed_separately, CO-4520) is not joined to the other parent; a shares_heat_with edge stated between the two still joins them. 3.751.21 and 3.751.22 need nothing further: a divorced couple has no spouse edge, and a legally separated couple who do not elect E stay joined, as the presumption of marriage reads. Coverage review C-7 (OQ-801): 3.752.23.U says \"foster care/kinship individuals are not considered LEAP Household members\", so a person whose child_welfare_payment_type is foster care (IV-E, State-funded, or IV-B services in foster care) or kinship guardianship (IV-E or State) is left out, the reading that the specific exclusion governs D.2's general join of a child with a guardian; adopted children are members. Same-word audit SW-4: a child under 18 joins a parent's or legal guardian's household (3.751.2.D, \"parent or guardian\"); the legal_guardian role is crossed as the parent role is. Same-word audit SW-7 (convention rule 17): an edge joins persons who live together (lives_with, CO-1925, from dwelling_id); where a case states no dwelling_id the edge is read as living together, as before. LEAP's household is individuals living together at a dwelling (3.751.1, 3.751.2.B, S1400). Coverage pass 4 L4-4: a child's age is read on the application date (leap_age_on_application_date, CO-6400; 3.752.2, \"household composition\" considered \"as of the date of application\"), so a child who turns eighteen between the application and the determination is still a child of the household. Three-pattern sweep T-8 (docs/reviews/pattern-sweep-snap-ce.md): a person of the case who died before leap_application_date (date_of_death, CO-2868) is not a member: the household is the persons living at the dwelling, as they stand on the date of the application (9 CCR 2503-7 3.751.1 \"Household\" and \"Point in Time\"). A person whose date of death is not stated is living. Before, a stated death changed nothing (probe CO-947). Three-pattern sweep D-1 (docs/reviews/pattern-sweep-snap-ce.md): lives_with (CO-1925) is read as stated, required where read: no text on file says that persons related on the application live together unless it says otherwise (9 CCR 2503-7 3.751.1 \"Household\": the persons living at the dwelling, S489), so a stated relationship is no longer read as living together where no dwelling_id is stated (decision 4; docs/conventions.md rule 17, as MAGI's readers since coverage pass 6, C6-10); a case with persons related across the edge states dwelling_id for each of them."
derived: ["filter", ["reachable", ["spouse", "civil_union_partner", "parent", "child", "legal_guardian", "ward", "shares_heat_with"], ["all", ["in_group", ["P"], "lives_with"], ["not", ["in", ["otherwise", "leap_living_arrangement", "traditional_dwelling"], ["institutional_group_care"]]], ["not", ["in", ["otherwise", ["of", ["P"], "leap_living_arrangement"], "traditional_dwelling"], ["institutional_group_care"]]], ["any", ["rel", ["spouse", "civil_union_partner", "shares_heat_with"], ["P"]], ["all", ["rel", ["parent", "legal_guardian"], ["P"]], ["any", ["<", ["of", ["P"], "leap_age_on_application_date"], "leap_household_child_age_limit"]], ["not", ["otherwise", ["of", ["P"], "is_emancipated_minor"], false]]], ["all", ["rel", ["child", "ward"], ["P"]], ["any", ["<", "leap_age_on_application_date", "leap_household_child_age_limit"]], ["not", ["otherwise", "is_emancipated_minor", false]]]], ["not", ["any", ["all", ["rel", ["spouse", "civil_union_partner"], ["P"]], ["any", ["otherwise", "leap_is_listed_separately_from_ex_spouse", false], ["otherwise", ["of", ["P"], "leap_is_listed_separately_from_ex_spouse"], false]]], ["all", ["rel", ["parent", "legal_guardian"], ["P"]], ["not", ["otherwise", "leap_is_listed_separately_from_ex_spouse", false]], ["of", ["P"], "leap_is_child_of_parent_listed_separately"]], ["all", ["rel", ["child", "ward"], ["P"]], ["not", ["otherwise", ["of", ["P"], "leap_is_listed_separately_from_ex_spouse"], false]], "leap_is_child_of_parent_listed_separately"]]]]], ["all", ["not", ["of", ["P"], "leap_is_in_another_approved_household"]], ["not", ["otherwise", ["<", ["of", ["P"], "date_of_death"], "leap_application_date"], false]], ["of", ["P"], "leap_meets_citizenship_requirement"], ["not", ["of", ["P"], "leap_member_is_excluded_for_verification"]], ["not", ["in", ["otherwise", ["of", ["P"], "child_welfare_payment_type"], "none"], ["title_iv_e_foster_care", "state_funded_foster_care", "title_iv_b_services_only", "title_iv_e_kinship_guardianship", "state_kinship_guardianship"]]]]]
sources: [S489, S490, S494, S1400, S1401, S893, S896, S3300, S3312, S776]
open: [OQ-801]
implemented: engine
tags: [household]
rationale: "No existing item in this volume built the LEAP household closure from 3.751.1's own household definition; the prior version was built from 3.751.2.D's floor on splitting instead (review docs/reviews/cccap-leap-phase-6.md, C-1, blocking) and counted a 3.753.17-excluded individual as a member (C-2, blocking). leap_household_size (CO-1001) and leap_household_income (CO-1002, via leap_household_members_for_income, CO-1009) both need this fixed closure. Phase-10 open-question sweep: the filter now also leaves out a member excluded for a missing SSN or an unverified status (OQ-370, review C-1 of the verification round), a member of another approved household (OQ-163 K-8), and the closure does not cross to a person in institutional group care (OQ-358). Dual-entry audit 3.5: buying heat in common is stated once, by the shares_heat_with edge; the yes/no shares_heating_fuel_with (CO-895, retired) said no more and did not say with whom. Same-word SW-7: living together is read from lives_with."
tests:
  - {id: CO-1000-T1, as_of: "2026-10-01", given: {dwelling_id: h1, leap_application_date: "2026-10-01", date_of_birth: "1985-01-22", leap_is_in_another_approved_household: false, immigration_status: us_citizen, ssn_furnished_or_application_shown: true}, others: {p2: {dwelling_id: h1, date_of_birth: "1981-03-01", leap_is_in_another_approved_household: false, immigration_status: us_citizen, ssn_furnished_or_application_shown: true}, p4: {dwelling_id: h1, date_of_birth: "2009-04-08", leap_is_in_another_approved_household: false, immigration_status: us_citizen, ssn_furnished_or_application_shown: true}}, relationships: [[spouse, p1, p2], [parent, p1, p4]], expect: [p1, p2, p4]}
  - {id: CO-1000-T2, as_of: "2026-10-01", given: {date_of_birth: "1990-01-01", leap_is_in_another_approved_household: false, immigration_status: us_citizen, ssn_furnished_or_application_shown: true}, relationships: [], expect: [p1]}
  # From the child's own perspective the edge to the parent is crossed because the child is under eighteen.
  - {id: CO-1000-T3, as_of: "2026-10-01", given: {dwelling_id: h1, leap_application_date: "2026-10-01", date_of_birth: "2009-04-08", leap_is_in_another_approved_household: false, immigration_status: us_citizen, ssn_furnished_or_application_shown: true}, others: {p3: {dwelling_id: h1, date_of_birth: "1985-01-22", leap_is_in_another_approved_household: false, immigration_status: us_citizen, ssn_furnished_or_application_shown: true}, p5: {dwelling_id: h1, date_of_birth: "2026-02-03", leap_is_in_another_approved_household: false, immigration_status: us_citizen, ssn_furnished_or_application_shown: true}}, relationships: [[parent, p3, p1], [parent, p1, p5]], expect: [p1, p3, p5]}
  # An adult child living with her parents may be a separate LEAP household unless the case states she shares heating fuel with them (3.751.2.D.2 joins only children under eighteen unconditionally).
  - {id: CO-1000-T4, as_of: "2026-10-01", given: {dwelling_id: h1, leap_application_date: "2026-10-01", date_of_birth: "1947-05-10", leap_is_in_another_approved_household: false, immigration_status: us_citizen, ssn_furnished_or_application_shown: true}, others: {p2: {dwelling_id: h1, date_of_birth: "1945-08-30", leap_is_in_another_approved_household: false, immigration_status: us_citizen, ssn_furnished_or_application_shown: true}, p3: {dwelling_id: h1, date_of_birth: "1984-06-15", leap_is_in_another_approved_household: false, immigration_status: us_citizen, ssn_furnished_or_application_shown: true}}, relationships: [[spouse, p1, p2], [parent, p1, p3], [parent, p2, p3]], expect: [p1, p2]}
  # Same facts, but the adult daughter's household states she shares heating fuel with her parents.
  - {id: CO-1000-T5, as_of: "2026-10-01", given: {dwelling_id: h1, date_of_birth: "1947-05-10", leap_is_in_another_approved_household: false, immigration_status: us_citizen, ssn_furnished_or_application_shown: true}, others: {p2: {dwelling_id: h1, date_of_birth: "1945-08-30", leap_is_in_another_approved_household: false, immigration_status: us_citizen, ssn_furnished_or_application_shown: true}, p3: {dwelling_id: h1, date_of_birth: "1984-06-15", leap_is_in_another_approved_household: false, immigration_status: us_citizen, ssn_furnished_or_application_shown: true}}, relationships: [[spouse, p1, p2], [shares_heat_with, p1, p3], [parent, p1, p3], [parent, p2, p3]], expect: [p1, p2, p3]}
  # 3.753.17: an undocumented spouse is excluded from household membership although the economic unit reaches him.
  - {id: CO-1000-T6, as_of: "2026-10-01", given: {dwelling_id: h1, date_of_birth: "1985-01-22", leap_is_in_another_approved_household: false, immigration_status: us_citizen, ssn_furnished_or_application_shown: true}, others: {p2: {dwelling_id: h1, date_of_birth: "1981-03-01", leap_is_in_another_approved_household: false, immigration_status: undocumented}}, relationships: [[spouse, p1, p2]], expect: [p1]}
  # 3.751.1 Completed Application B: a spouse who has furnished no SSN and shown no application for one is left out of the household (her income still counts, CO-1009).
  - {id: CO-1000-T7, as_of: "2026-10-01", given: {dwelling_id: h1, date_of_birth: "1985-01-22", leap_is_in_another_approved_household: false, immigration_status: us_citizen, ssn_furnished_or_application_shown: true}, others: {p2: {dwelling_id: h1, date_of_birth: "1981-03-01", leap_is_in_another_approved_household: false, immigration_status: us_citizen, ssn_furnished_or_application_shown: false, ssn_verified_by_electronic_data_source: false}}, relationships: [[spouse, p1, p2]], expect: [p1]}
  # 3.753.15 and 3.753.17: a lawful permanent resident spouse whose status SAVE has not verified is left out of the household.
  - {id: CO-1000-T8, as_of: "2026-10-01", given: {dwelling_id: h1, date_of_birth: "1985-01-22", leap_is_in_another_approved_household: false, immigration_status: us_citizen, ssn_furnished_or_application_shown: true}, others: {p2: {dwelling_id: h1, date_of_birth: "1981-03-01", leap_is_in_another_approved_household: false, immigration_status: lawful_permanent_resident, ssn_furnished_or_application_shown: true, immigration_status_verified_by_electronic_data_source: false}}, relationships: [[spouse, p1, p2]], expect: [p1]}
  # Same, once SAVE has verified the status: the spouse is a member.
  - {id: CO-1000-T9, as_of: "2026-10-01", given: {dwelling_id: h1, date_of_birth: "1985-01-22", leap_is_in_another_approved_household: false, immigration_status: us_citizen, ssn_furnished_or_application_shown: true}, others: {p2: {dwelling_id: h1, date_of_birth: "1981-03-01", leap_is_in_another_approved_household: false, immigration_status: lawful_permanent_resident, ssn_furnished_or_application_shown: true, immigration_status_verified_by_electronic_data_source: true}}, relationships: [[spouse, p1, p2]], expect: [p1, p2]}
  # 3.751.1 "Household" and 3.751.2.D.1 ("Husband and wife living together"): a spouse who lives in a nursing facility (institutional group care) does not live at the dwelling, so the spouse edge is not crossed.
  - {id: CO-1000-T10, as_of: "2026-11-01", given: {date_of_birth: "1945-08-30", leap_is_in_another_approved_household: false, immigration_status: us_citizen, ssn_furnished_or_application_shown: true}, others: {p2: {date_of_birth: "1947-05-10", leap_is_in_another_approved_household: false, immigration_status: us_citizen, ssn_furnished_or_application_shown: true, leap_living_arrangement: institutional_group_care}}, relationships: [[spouse, p1, p2]], expect: [p1]}
  # The institutionalised spouse's own LEAP household is herself alone.
  - {id: CO-1000-T11, as_of: "2026-11-01", given: {date_of_birth: "1947-05-10", leap_is_in_another_approved_household: false, immigration_status: us_citizen, ssn_furnished_or_application_shown: true, leap_living_arrangement: institutional_group_care}, others: {p2: {date_of_birth: "1945-08-30", leap_is_in_another_approved_household: false, immigration_status: us_citizen, ssn_furnished_or_application_shown: true}}, relationships: [[spouse, p1, p2]], expect: [p1]}
  # 3.751.2.A: a spouse already counted in another household approved for this eligibility period is not counted again.
  - {id: CO-1000-T12, as_of: "2026-11-01", given: {dwelling_id: h1, date_of_birth: "1985-01-22", leap_is_in_another_approved_household: false, immigration_status: us_citizen, ssn_furnished_or_application_shown: true}, others: {p2: {dwelling_id: h1, date_of_birth: "1981-03-01", leap_is_in_another_approved_household: true, immigration_status: us_citizen, ssn_furnished_or_application_shown: true}}, relationships: [[spouse, p1, p2]], expect: [p1]}
  # OQ-132: an unrelated roommate who buys heating fuel in common is one economic unit with the applicant (3.751.1 "Household").
  - {id: CO-1000-T13, as_of: "2026-11-01", given: {dwelling_id: h1, date_of_birth: "1985-01-22", leap_is_in_another_approved_household: false, immigration_status: us_citizen, ssn_furnished_or_application_shown: true}, others: {p2: {dwelling_id: h1, date_of_birth: "1990-07-01", leap_is_in_another_approved_household: false, immigration_status: us_citizen, ssn_furnished_or_application_shown: true}}, relationships: [[shares_heat_with, p1, p2]], expect: [p1, p2]}
  # Without the edge the roommate is a separate household (3.751.2.B).
  - {id: CO-1000-T14, as_of: "2026-11-01", given: {date_of_birth: "1985-01-22", leap_is_in_another_approved_household: false, immigration_status: us_citizen, ssn_furnished_or_application_shown: true}, others: {p2: {date_of_birth: "1990-07-01", leap_is_in_another_approved_household: false, immigration_status: us_citizen, ssn_furnished_or_application_shown: true}}, relationships: [], expect: [p1]}
  - {id: CO-1000-T15, title: "Coverage review C-8 (3.751.2.D.3): partners in a civil union are one household without a shares_heat_with edge", as_of: "2026-11-01", given: {dwelling_id: h1, date_of_birth: "1985-01-22", leap_is_in_another_approved_household: false, immigration_status: us_citizen, ssn_furnished_or_application_shown: true}, others: {p2: {dwelling_id: h1, date_of_birth: "1987-07-01", leap_is_in_another_approved_household: false, immigration_status: us_citizen, ssn_furnished_or_application_shown: true}}, relationships: [[civil_union_partner, p1, p2]], expect: [p1, p2]}
  - {id: CO-1000-T16, title: "Coverage review C-8 (3.751.2.E): a divorced mother living with her ex-husband elects a separate household with their 9-year-old; her household", as_of: "2026-11-01", given: {dwelling_id: h1, leap_application_date: "2026-11-01", date_of_birth: "1985-01-22", leap_is_listed_separately_from_ex_spouse: true, leap_is_in_another_approved_household: false, immigration_status: us_citizen, ssn_furnished_or_application_shown: true}, others: {p2: {dwelling_id: h1, date_of_birth: "1983-07-01", leap_is_in_another_approved_household: false, immigration_status: us_citizen, ssn_furnished_or_application_shown: true}, p3: {dwelling_id: h1, date_of_birth: "2017-05-01", leap_is_in_another_approved_household: false, immigration_status: us_citizen, ssn_furnished_or_application_shown: true}}, relationships: [[parent, p1, p3], [parent, p2, p3]], expect: [p1, p3]}
  - {id: CO-1000-T17, title: "Coverage review C-8: without the election the shared child joins both parents in one household (3.751.2.D.2)", as_of: "2026-11-01", given: {dwelling_id: h1, leap_application_date: "2026-11-01", date_of_birth: "1985-01-22", leap_is_in_another_approved_household: false, immigration_status: us_citizen, ssn_furnished_or_application_shown: true}, others: {p2: {dwelling_id: h1, date_of_birth: "1983-07-01", leap_is_in_another_approved_household: false, immigration_status: us_citizen, ssn_furnished_or_application_shown: true}, p3: {dwelling_id: h1, date_of_birth: "2017-05-01", leap_is_in_another_approved_household: false, immigration_status: us_citizen, ssn_furnished_or_application_shown: true}}, relationships: [[parent, p1, p3], [parent, p2, p3]], expect: [p1, p2, p3]}
  - {id: CO-1000-T18, title: "Coverage review C-7 (3.752.23.U, OQ-801): a grandchild in State kinship guardianship is not a household member", as_of: "2026-11-01", given: {dwelling_id: h1, leap_application_date: "2026-11-01", date_of_birth: "1960-01-22", leap_is_in_another_approved_household: false, immigration_status: us_citizen, ssn_furnished_or_application_shown: true}, others: {p2: {dwelling_id: h1, date_of_birth: "2015-07-01", child_welfare_payment_type: state_kinship_guardianship, leap_is_in_another_approved_household: false, immigration_status: us_citizen, ssn_furnished_or_application_shown: true}}, relationships: [[legal_guardian, p1, p2], [grandparent, p1, p2]], expect: [p1]}
  - {id: CO-1000-T20, title: "Three-pattern sweep T-8 (CO-947): the spouse died on 2026-09-15, before the 2026-10-01 application: not a member", as_of: "2026-10-01", given: {dwelling_id: h1, leap_application_date: "2026-10-01", date_of_birth: "1985-01-22", leap_is_in_another_approved_household: false, immigration_status: us_citizen, ssn_furnished_or_application_shown: true}, others: {p2: {dwelling_id: h1, date_of_birth: "1981-03-01", date_of_death: "2026-09-15", leap_is_in_another_approved_household: false, immigration_status: us_citizen, ssn_furnished_or_application_shown: true}, p4: {dwelling_id: h1, date_of_birth: "2009-04-08", leap_is_in_another_approved_household: false, immigration_status: us_citizen, ssn_furnished_or_application_shown: true}}, relationships: [[spouse, p1, p2], [parent, p1, p4]], expect: [p1, p4]}
