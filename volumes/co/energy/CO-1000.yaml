id: CO-1000
name: "LEAP: household members"
identifier: leap_household_members
kind: derived
type: group of persons
scope: person
program: LEAP
meaning: "The individuals living together as one economic unit for whom primary heating fuel is customarily purchased in common, or who make undesignated payments for heat in the form of rent, under 9 CCR 2503-7 3.751.1's \"Household\" definition - a spouse, or a child under eighteen living in the same dwelling as the parent or guardian (unless emancipated), per 3.751.2.D, or anyone the case states shares heating fuel in common under 3.751.1's general economic-unit test, reciprocally closed - leaving out a person who does not live at the dwelling (institutional group care), a member already counted in another household approved for the same eligibility period (3.751.2.A), a member who does not meet the citizenship requirement (3.753.18), and a member who meets it as declared but has provided no SSN or proof of application for one (3.751.1 \"Completed Application\" B) or whose declared immigration status SAVE has not verified (3.753.15, 3.753.17.A). The income of a member left out for status or verification is still counted (leap_household_members_for_income, CO-1009)."
precision: "As with snap_household_members (CO-305), a stated spouse or parent/child relationship edge is read as living together for LEAP purposes, extended beyond 3.751.2.D's unconditional age-based joins by the supplied shares_heating_fuel_with (CO-895), and by a stated shares_heat_with relationship, which joins any two persons who buy heating fuel in common, related or not (OQ-132, resolved), except that an edge is not crossed to or from a person whose own leap_living_arrangement is institutional_group_care: 3.751.1 joins individuals \"living together\" and 3.751.2.B counts \"each person living at a dwelling\", so a spouse who has entered a nursing facility is not in the household at home (OQ-358, resolved). If leap_living_arrangement is not stated, LEAP reads it as an ordinary dwelling. The SSN test reads ssn_is_verified (a number furnished, an application shown, or SSA's confirmation); 3.751.1 B states no exception for a person who cannot obtain a number. This volume does not separately model 3.751.2.E's separate-household election for a parent living with an ex-spouse after divorce or legal separation, or 3.751.21's permanent-separation test."
derived: [filter, [reachable, [spouse, parent, child, shares_heat_with], [all, [not, [in, [otherwise, leap_living_arrangement, traditional_dwelling], [institutional_group_care]]], [not, [in, [otherwise, [of, [P], leap_living_arrangement], traditional_dwelling], [institutional_group_care]]], [any, [rel, [spouse, shares_heat_with], [P]], [all, [rel, [parent], [P]], [any, ["<", [of, [P], age], leap_household_child_age_limit], [otherwise, [of, [P], shares_heating_fuel_with], false]], [not, [otherwise, [of, [P], is_emancipated_minor], false]]], [all, [rel, [child], [P]], [any, ["<", age, leap_household_child_age_limit], [otherwise, shares_heating_fuel_with, false]], [not, [otherwise, is_emancipated_minor, false]]]]]], [all, [not, [of, [P], leap_is_in_another_approved_household]], [of, [P], leap_meets_citizenship_requirement], [not, [of, [P], leap_member_is_excluded_for_verification]]]]
sources: [S489, S490, S494, S1400, S1401, S893, S896]
open: []
implemented: engine
tags: [household]
rationale: "No existing item in this volume built the LEAP household closure from 3.751.1's own household definition; the prior version was built from 3.751.2.D's floor on splitting instead (review docs/reviews/cccap-leap-phase-6.md, C-1, blocking) and counted a 3.753.17-excluded individual as a member (C-2, blocking). leap_household_size (CO-1001) and leap_household_income (CO-1002, via leap_household_members_for_income, CO-1009) both need this fixed closure. Phase-10 open-question sweep: the filter now also leaves out a member excluded for a missing SSN or an unverified status (OQ-370, review C-1 of the verification round), a member of another approved household (OQ-163 K-8), and the closure does not cross to a person in institutional group care (OQ-358)."
tests:
  - {id: CO-1000-T1, as_of: "2026-10-01", given: {date_of_birth: "1985-01-22", leap_is_in_another_approved_household: false, citizenship_status: citizen, ssn_furnished_or_application_shown: true}, others: {p2: {date_of_birth: "1981-03-01", leap_is_in_another_approved_household: false, citizenship_status: citizen, ssn_furnished_or_application_shown: true}, p4: {date_of_birth: "2009-04-08", leap_is_in_another_approved_household: false, citizenship_status: citizen, ssn_furnished_or_application_shown: true}}, relationships: [[spouse, p1, p2], [parent, p1, p4]], expect: [p1, p2, p4]}
  - {id: CO-1000-T2, as_of: "2026-10-01", given: {date_of_birth: "1990-01-01", leap_is_in_another_approved_household: false, citizenship_status: citizen, ssn_furnished_or_application_shown: true}, relationships: [], expect: [p1]}
  # From the child's own perspective the edge to the parent is crossed because the child is under eighteen.
  - {id: CO-1000-T3, as_of: "2026-10-01", given: {date_of_birth: "2009-04-08", leap_is_in_another_approved_household: false, citizenship_status: citizen, ssn_furnished_or_application_shown: true}, others: {p3: {date_of_birth: "1985-01-22", leap_is_in_another_approved_household: false, citizenship_status: citizen, ssn_furnished_or_application_shown: true}, p5: {date_of_birth: "2026-02-03", leap_is_in_another_approved_household: false, citizenship_status: citizen, ssn_furnished_or_application_shown: true}}, relationships: [[parent, p3, p1], [parent, p1, p5]], expect: [p1, p3, p5]}
  # An adult child living with her parents may be a separate LEAP household unless the case states she shares heating fuel with them (3.751.2.D.2 joins only children under eighteen unconditionally).
  - {id: CO-1000-T4, as_of: "2026-10-01", given: {date_of_birth: "1947-05-10", leap_is_in_another_approved_household: false, citizenship_status: citizen, ssn_furnished_or_application_shown: true}, others: {p2: {date_of_birth: "1945-08-30", leap_is_in_another_approved_household: false, citizenship_status: citizen, ssn_furnished_or_application_shown: true}, p3: {date_of_birth: "1984-06-15", leap_is_in_another_approved_household: false, citizenship_status: citizen, ssn_furnished_or_application_shown: true, shares_heating_fuel_with: false}}, relationships: [[spouse, p1, p2], [parent, p1, p3], [parent, p2, p3]], expect: [p1, p2]}
  # Same facts, but the adult daughter's household states she shares heating fuel with her parents.
  - {id: CO-1000-T5, as_of: "2026-10-01", given: {date_of_birth: "1947-05-10", leap_is_in_another_approved_household: false, citizenship_status: citizen, ssn_furnished_or_application_shown: true}, others: {p2: {date_of_birth: "1945-08-30", leap_is_in_another_approved_household: false, citizenship_status: citizen, ssn_furnished_or_application_shown: true}, p3: {date_of_birth: "1984-06-15", leap_is_in_another_approved_household: false, citizenship_status: citizen, ssn_furnished_or_application_shown: true, shares_heating_fuel_with: true}}, relationships: [[spouse, p1, p2], [parent, p1, p3], [parent, p2, p3]], expect: [p1, p2, p3]}
  # 3.753.17: an undocumented spouse is excluded from household membership although the economic unit reaches him.
  - {id: CO-1000-T6, as_of: "2026-10-01", given: {date_of_birth: "1985-01-22", leap_is_in_another_approved_household: false, citizenship_status: citizen, ssn_furnished_or_application_shown: true}, others: {p2: {date_of_birth: "1981-03-01", leap_is_in_another_approved_household: false, citizenship_status: undocumented}}, relationships: [[spouse, p1, p2]], expect: [p1]}
  # 3.751.1 Completed Application B: a spouse who has furnished no SSN and shown no application for one is left out of the household (her income still counts, CO-1009).
  - {id: CO-1000-T7, as_of: "2026-10-01", given: {date_of_birth: "1985-01-22", leap_is_in_another_approved_household: false, citizenship_status: citizen, ssn_furnished_or_application_shown: true}, others: {p2: {date_of_birth: "1981-03-01", leap_is_in_another_approved_household: false, citizenship_status: citizen, ssn_furnished_or_application_shown: false, ssn_verified_by_electronic_data_source: false}}, relationships: [[spouse, p1, p2]], expect: [p1]}
  # 3.753.15 and 3.753.17: a lawful permanent resident spouse whose status SAVE has not verified is left out of the household.
  - {id: CO-1000-T8, as_of: "2026-10-01", given: {date_of_birth: "1985-01-22", leap_is_in_another_approved_household: false, citizenship_status: citizen, ssn_furnished_or_application_shown: true}, others: {p2: {date_of_birth: "1981-03-01", leap_is_in_another_approved_household: false, citizenship_status: lawful_permanent_resident, ssn_furnished_or_application_shown: true, immigration_status_verified_by_electronic_data_source: false}}, relationships: [[spouse, p1, p2]], expect: [p1]}
  # Same, once SAVE has verified the status: the spouse is a member.
  - {id: CO-1000-T9, as_of: "2026-10-01", given: {date_of_birth: "1985-01-22", leap_is_in_another_approved_household: false, citizenship_status: citizen, ssn_furnished_or_application_shown: true}, others: {p2: {date_of_birth: "1981-03-01", leap_is_in_another_approved_household: false, citizenship_status: lawful_permanent_resident, ssn_furnished_or_application_shown: true, immigration_status_verified_by_electronic_data_source: true}}, relationships: [[spouse, p1, p2]], expect: [p1, p2]}
  # 3.751.1 "Household" and 3.751.2.D.1 ("Husband and wife living together"): a spouse who lives in a nursing facility (institutional group care) does not live at the dwelling, so the spouse edge is not crossed.
  - {id: CO-1000-T10, as_of: "2026-11-01", given: {date_of_birth: "1945-08-30", leap_is_in_another_approved_household: false, citizenship_status: citizen, ssn_furnished_or_application_shown: true}, others: {p2: {date_of_birth: "1947-05-10", leap_is_in_another_approved_household: false, citizenship_status: citizen, ssn_furnished_or_application_shown: true, leap_living_arrangement: institutional_group_care}}, relationships: [[spouse, p1, p2]], expect: [p1]}
  # The institutionalised spouse's own LEAP household is herself alone.
  - {id: CO-1000-T11, as_of: "2026-11-01", given: {date_of_birth: "1947-05-10", leap_is_in_another_approved_household: false, citizenship_status: citizen, ssn_furnished_or_application_shown: true, leap_living_arrangement: institutional_group_care}, others: {p2: {date_of_birth: "1945-08-30", leap_is_in_another_approved_household: false, citizenship_status: citizen, ssn_furnished_or_application_shown: true}}, relationships: [[spouse, p1, p2]], expect: [p1]}
  # 3.751.2.A: a spouse already counted in another household approved for this eligibility period is not counted again.
  - {id: CO-1000-T12, as_of: "2026-11-01", given: {date_of_birth: "1985-01-22", leap_is_in_another_approved_household: false, citizenship_status: citizen, ssn_furnished_or_application_shown: true}, others: {p2: {date_of_birth: "1981-03-01", leap_is_in_another_approved_household: true, citizenship_status: citizen, ssn_furnished_or_application_shown: true}}, relationships: [[spouse, p1, p2]], expect: [p1]}
  # OQ-132: an unrelated roommate who buys heating fuel in common is one economic unit with the applicant (3.751.1 "Household").
  - {id: CO-1000-T13, as_of: "2026-11-01", given: {date_of_birth: "1985-01-22", leap_is_in_another_approved_household: false, citizenship_status: citizen, ssn_furnished_or_application_shown: true}, others: {p2: {date_of_birth: "1990-07-01", leap_is_in_another_approved_household: false, citizenship_status: citizen, ssn_furnished_or_application_shown: true}}, relationships: [[shares_heat_with, p1, p2]], expect: [p1, p2]}
  # Without the edge the roommate is a separate household (3.751.2.B).
  - {id: CO-1000-T14, as_of: "2026-11-01", given: {date_of_birth: "1985-01-22", leap_is_in_another_approved_household: false, citizenship_status: citizen, ssn_furnished_or_application_shown: true}, others: {p2: {date_of_birth: "1990-07-01", leap_is_in_another_approved_household: false, citizenship_status: citizen, ssn_furnished_or_application_shown: true}}, relationships: [], expect: [p1]}
