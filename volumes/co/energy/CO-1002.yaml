id: CO-1002
name: "LEAP: household income"
identifier: leap_household_income
kind: derived
type: money
scope: person-month
program: LEAP
meaning: "The LEAP household's countable gross monthly income under 9 CCR 2503-7 3.752.21-23 - the sum over each member of the economic unit (a 3.753.17-excluded member included) of the member's wages converted to a month by the pay schedule (3.752.22.B-C, leap_person_wages, CO-3925), except a child under eighteen living with a parent or guardian, whose earnings 3.752.23.Q excludes; the member's self-employment income for the full month prior to the application date (3.755.21.I.1 as amended effective November 1, 2026); and the member's countable unearned income (3.752.21-22.A, leap_person_unearned_income, CO-3926). The figure is monthly; leap_household_income_pct_fpl (CO-1278) annualizes it."
precision: "Sums over leap_household_members_for_income (CO-1009, the unfiltered economic unit, not leap_household_members, CO-1000, which 3.753.17 excludes a non-citizen from although his income still counts). LEAP determines income at the application (3.751.1 \"Point in Time\"), so this item is read for the month of leap_application_date (leap_is_eligible, CO-1007; leap_benefit_amount, CO-1281); self-employment (leap_self_employment_income, CO-1712) is read for the month before it, the \"full month prior to the application date\" (OQ-681). A child's self-employment is still counted, since 3.752.23.Q excludes only the earned income of a child as wages are stated. What 3.752.23 excludes is left out of the figures read (CO-3913, CO-3926); leap_excluded_income (CO-2345) is retired."
open: [OQ-681]
derived: [sum, leap_household_members_for_income, [+, [case, [["<", [of, [P], age], leap_household_child_age_limit], 0], [else, [of, [P], leap_person_wages]]], [at, [of, [P], leap_self_employment_income], [month_before, [month]]], [of, [P], leap_person_unearned_income]]]
sources: [S1624, S491, S494, S2712, S2713, S2714, S2719]
implemented: engine
tags: [income, household]
rationale: "No existing item computes LEAP household income; leap_income_within_limit (CO-1003) needs it. Changed to sum over leap_household_members_for_income (CO-1009) rather than leap_household_members (CO-1000) per the review (docs/reviews/cccap-leap-phase-6.md, C-2, blocking): once CO-1000 is filtered by citizenship, summing over it would silently drop a 3.753.17-excluded member's income, which the text keeps counted. Case worker review S11: the authoring note \"vocabulary fix round C-3\" moved out of the meaning, which states only what the fact is. Final pass F-09 to F-11 and F-19 (SW-35): the item read the calendar month containing the application (an assumption CDHS review N-2 accepted), which the rule does not: wages are now four weeks of pay converted by the schedule (3.752.22.B-C), unearned income is that of the income verification period (3.752.22.A), self-employment that of the full month before the application (3.755.21.I.1), SSI is counted and Social Security and SSI lose their cents, prizes count and retroactive benefit lump sums do not."
