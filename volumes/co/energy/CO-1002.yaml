id: CO-1002
name: "LEAP: household income"
identifier: leap_household_income
kind: derived
type: money
scope: person-month
program: LEAP
meaning: The LEAP household's countable gross income for the income verification period under 9 CCR 2503-7 3.752.21-22 - the sum of each household member's countable earned and unearned income, excluding a child's earned income when the child is under eighteen and living with a parent or guardian (3.752.23.Q), and including a 3.753.17-excluded member's own countable income.
precision: "Sums wages_gross, leap_self_employment_income, social_security_income, pension_income, unemployment_income, child_support_received, tanf_cash_income, adult_financial_cash_income, other_unearned_income_taxable, other_unearned_income_nontaxable and tax_exempt_interest over leap_household_members_for_income (CO-1009, the unfiltered economic unit, not leap_household_members, CO-1000, which 3.753.17 excludes a non-citizen from although his income still counts), excluding wages for a member under leap_household_child_age_limit (18). Vocabulary fix round (R-1): self-employment is LEAP's own net (CO-1712); a child's self-employment is still counted, since 3.752.23.Q excludes only the earned income of a child as wages are stated."
derived: [sum, leap_household_members_for_income, [+, [case, [["<", [of, [P], age], leap_household_child_age_limit], 0], [else, [of, [P], wages_gross]]], [of, [P], leap_self_employment_income], [of, [P], social_security_income], [of, [P], pension_income], [of, [P], unemployment_income], [of, [P], child_support_received], [of, [P], tanf_cash_income], [of, [P], adult_financial_cash_income], [of, [P], other_unearned_income_taxable], [of, [P], other_unearned_income_nontaxable], [of, [P], tax_exempt_interest]]]
sources: [S491, S494]
open: [OQ-390]
implemented: engine
tags: [income, household]
rationale: "No existing item computes LEAP household income; leap_income_within_limit (CO-1003) needs it. Changed to sum over leap_household_members_for_income (CO-1009) rather than leap_household_members (CO-1000) per the review (docs/reviews/cccap-leap-phase-6.md, C-2, blocking): once CO-1000 is filtered by citizenship, summing over it would silently drop a 3.753.17-excluded member's income, which the text keeps counted."
tests:
  - {id: CO-1002-T1, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "1981-03-01", wages_gross: 0, self_employment_gross_receipts: 0, self_employment_net_earnings_for_tax: 0, social_security_income: 1180, pension_income: 0, unemployment_income: 0, child_support_received: 0, tanf_cash_income: 0, adult_financial_cash_income: 0, ssi_income: 0, other_unearned_income_nontaxable: 0, other_unearned_income_taxable: 0, tax_exempt_interest: 0}, others: {p4: {date_of_birth: "2009-04-08", wages_gross: 0, self_employment_gross_receipts: 0, self_employment_net_earnings_for_tax: 0, social_security_income: 0, pension_income: 0, unemployment_income: 0, child_support_received: 0, tanf_cash_income: 0, adult_financial_cash_income: 0, ssi_income: 0, other_unearned_income_nontaxable: 0, other_unearned_income_taxable: 0, tax_exempt_interest: 0}, p5: {date_of_birth: "2026-02-03", wages_gross: 0, self_employment_gross_receipts: 0, self_employment_net_earnings_for_tax: 0, social_security_income: 0, pension_income: 0, unemployment_income: 0, child_support_received: 0, tanf_cash_income: 0, adult_financial_cash_income: 0, ssi_income: 0, other_unearned_income_nontaxable: 0, other_unearned_income_taxable: 0, tax_exempt_interest: 0}}, relationships: [[parent, p2, p4], [parent, p4, p5]], expect: 1180}
  - {id: CO-1002-T2, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "1990-01-01", wages_gross: 500, self_employment_gross_receipts: 0, self_employment_net_earnings_for_tax: 0, social_security_income: 0, pension_income: 0, unemployment_income: 0, child_support_received: 0, tanf_cash_income: 0, adult_financial_cash_income: 0, ssi_income: 0, other_unearned_income_nontaxable: 0, other_unearned_income_taxable: 0, tax_exempt_interest: 0}, relationships: [], expect: 500}
