id: CO-1002
name: "LEAP: household income"
identifier: leap_household_income
kind: derived
type: money
scope: person-month
program: LEAP
meaning: The LEAP household's countable gross income for the income verification period under 9 CCR 2503-7 3.752.21-22 - the sum of each household member's countable earned and unearned income, excluding a child's earned income when the child is under eighteen and living with a parent or guardian (3.752.23.Q).
precision: Sums earned_income, self_employment_net_income, social_security_income, pension_income, unemployment_income, child_support_received, cash_assistance_income, and other_unearned_income over leap_household_members, excluding earned_income for a member under leap_household_child_age_limit (18).
derived: [sum, leap_household_members, [+, [case, [["<", [of, [P], age], leap_household_child_age_limit], 0], [else, [of, [P], earned_income]]], [of, [P], self_employment_net_income], [of, [P], social_security_income], [of, [P], pension_income], [of, [P], unemployment_income], [of, [P], child_support_received], [of, [P], cash_assistance_income], [of, [P], other_unearned_income]]]
sources: [S491]
implemented: engine
tags: [income, household]
rationale: No existing item computes LEAP household income; leap_income_within_limit (CO-1003) needs it.
tests:
  - {id: CO-1002-T1, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "1981-03-01", earned_income: 0, self_employment_net_income: 0, social_security_income: 1180, pension_income: 0, unemployment_income: 0, child_support_received: 0, cash_assistance_income: 0, other_unearned_income: 0}, others: {p4: {date_of_birth: "2009-04-08", earned_income: 0, self_employment_net_income: 0, social_security_income: 0, pension_income: 0, unemployment_income: 0, child_support_received: 0, cash_assistance_income: 0, other_unearned_income: 0}, p5: {date_of_birth: "2026-02-03", earned_income: 0, self_employment_net_income: 0, social_security_income: 0, pension_income: 0, unemployment_income: 0, child_support_received: 0, cash_assistance_income: 0, other_unearned_income: 0}}, relationships: [[parent, p2, p4], [parent, p4, p5]], expect: 1180}
  - {id: CO-1002-T2, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "1990-01-01", earned_income: 500, self_employment_net_income: 0, social_security_income: 0, pension_income: 0, unemployment_income: 0, child_support_received: 0, cash_assistance_income: 0, other_unearned_income: 0}, relationships: [], expect: 500}
