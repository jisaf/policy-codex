id: CO-7253
name: "LEAP: the part of another person's veterans benefit paid for this person"
identifier: leap_dependent_part_of_awards_to_others
kind: derived
type: money
scope: person-month
program: LEAP
meaning: "The part of a veterans benefit paid to a person of the case who is not in this person's LEAP household (leap_household_members_for_income, CO-1009) because of this person as a dependent (the receipt's for_dependent, its for_person naming this person), placed in the income verification period as leap_counted_recurring_receipts (CO-5003) places a recurring receipt: 9 CCR 2503-7 3.752.211.E, \"Any portion of a VA pension that is paid to a veteran for support of a dependent shall be considered countable unearned income to the dependent rather than the veteran\". It is this person's unearned income (leap_person_unearned_income, CO-3926)."
precision: "Coverage pass 6 for LEAP, R6-6 (docs/reviews/coverage6-care-energy.md): LEAP households are drawn by heat bought in common (3.751.2), so an adult dependent living with the veteran (a disabled adult child, a dependent parent) may be a household of its own; 3.751.2.D bars only spouses, civil union partners and children under eighteen from being one. The award's part for this person is read from every person's list, comparing the record's for_person with this person (the persons joined to this person by no edge, docs/operators.md), when this person is not in the household of the person the award is paid to (the record's owner's leap_household_members_for_income; LEAP households are drawn alike from either side): a veteran in this person's household counts it in the household's income already (CO-5003). Unknown when such a person's receipts are unstated (decision 4)."
