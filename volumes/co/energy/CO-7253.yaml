sources: [S2713, S2714, S1624, S3307, S3306, S4043, S1400, S3303, S4850]
implemented: engine
tags: [income]
rationale: "Coverage pass 6 for LEAP, R6-6: leap_counted_recurring_receipts (CO-5003) took off only the part for a person living elsewhere (L5-2, 3.752.212), on the premise that a dependent living with the veteran is in the veteran's household; a dependent in a separate LEAP household had the part counted to the veteran's household although it is the dependent's income."
nearest: [CO-5003]
tests:
  - {id: CO-7253-T1, month: "2026-11", as_of: "2026-11-10", title: "Coverage pass 6 R6-6: the son (p1) in his own LEAP household; his father's (p2) $1,000 VA pension includes $400 for him: $400 is his unearned income (3.752.211.E)", given: {leap_application_date: "2026-11-10", leap_household_members_for_income: [p1], receipts: []}, others: {p2: {leap_household_members_for_income: [p2], receipts: [{kind: other_nontaxable, amount: 1000, for_dependent: 400, for_person: p1}]}}, relationships: [[parent, p2, p1]], expect: 400}
  - {id: CO-7253-T2, month: "2026-11", as_of: "2026-11-10", title: "Coverage pass 6 R6-6: the son in his father's LEAP household: counted there on the father's list, 0 here", given: {leap_application_date: "2026-11-10", leap_household_members_for_income: [p1, p2], receipts: []}, others: {p2: {leap_household_members_for_income: [p1, p2], receipts: [{kind: other_nontaxable, amount: 1000, for_dependent: 400, for_person: p1}]}}, relationships: [[parent, p2, p1]], expect: 0}
