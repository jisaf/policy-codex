id: CO-1001
name: "LEAP: household size"
identifier: leap_household_size
kind: derived
type: whole number
scope: person
program: LEAP
meaning: The number of persons in this person's LEAP household (leap_household_members, CO-1000).
derived: [count, leap_household_members]
sources: [S489]
implemented: engine
tags: [household]
rationale: No existing item counts the LEAP household; leap_income_within_limit (CO-1003) uses it to select a supplied income limit by household size.
