implemented: engine
tags: [income]
open: [OQ-681, OQ-1160]
rationale: "Earned-income records, E1 (LEAP; coverage review C-23): 3.752.23.CC excludes the SCSEP funds of a person fifty-five or older; the records state SCSEP pay as its own kind, so it is counted or excluded whole instead of being subtracted from a total it was part of."
tests:
  # $600 every two weeks: 2 x $600 = $1,200 (C.1.b).
  - {id: CO-5122-T1, title: "SCSEP pay of $600 every two weeks: $1,200", as_of: "2026-11-10", month: "2026-11", given: {earnings: [{kind: scsep_employment, frequency: biweekly, per_payment: 600}]}, expect: 1200}
  # Application November 1: bi-weekly SCSEP pays of $600 on October 9 and 23, in the eight weeks: average $600 x 2 = $1,200.
