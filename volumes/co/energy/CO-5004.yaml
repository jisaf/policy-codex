id: CO-5004
name: "LEAP: a person's counted service payments"
identifier: leap_counted_service_payments
kind: derived
type: money
scope: person-month
program: LEAP
meaning: "The person's recurring AmeriCorps payments of the month that LEAP counts: those whose amount for the hours served is at or above the minimum wage (colorado_minimum_wage); payments below it are excluded (9 CCR 2503-7 3.752.23.F)."
precision: "The hours served are a field of the receipt (hours_served), with no default: payments whose hours are not stated cannot be placed above or below the wage, so the result is unknown (decision 4 of 2026-11-23; before receipt records the payments were counted when the hours were not stated). OQ-781 (resolved) reads the minimum wage as the statewide wage. Coverage pass 4 L4-3 (docs/reviews/coverage4-care-energy.md): a recurring receipt stated with its date is read by its date in the income verification period (9 CCR 2503-7 3.752.22.A: \"received in the income verification period, not to exceed one month's income\"; C.3.a, C.3.c), after the period's first day (leap_income_verification_period_start, CO-5002) through the application date (leap_application_date), not by the calendar month: the period is then one month long, so a monthly source paid on the application date's day of the month is counted once (the cap of A; OQ-681); a receipt stated without a date is read in the month, as before."
derived: ["sum_receipts", "receipts", ["all", ["not", ["=", ["receipt", "frequency"], "once"]], ["case", [["unknown", ["receipt", "date"]], ["received_in", ["month"]]], ["else", ["all", [">", ["receipt", "date"], "leap_income_verification_period_start"], ["<=", ["receipt", "date"], "leap_application_date"]]]], ["=", ["lookup", "leap_receipt_treatment_table", ["receipt", "kind"]], "counted_at_or_above_minimum_wage"]], ["case", [[">=", ["/", ["receipt", "amount"], ["receipt", "hours_served"]], "colorado_minimum_wage"], ["receipt", "amount"]], ["else", 0]]]
sources: [S3595, S3508]
implemented: engine
tags: [income]
open: [OQ-681]
rationale: "Receipt records, migration phase 1: 3.752.23.F's wage test, per receipt, replacing the AmeriCorps term of leap_excluded_unearned_income (CO-4511)."
tests:
  - {id: CO-5004-T1, month: "2026-11", as_of: "2026-11-10", given: {leap_application_date: "2026-11-10", receipts: [{kind: americorps, amount: 700, hours_served: 40}]}, title: "$700 for 40 hours ($17.50 an hour) is at or above the minimum wage: counted", expect: 700}
  - {id: CO-5004-T2, month: "2026-11", as_of: "2026-11-10", given: {leap_application_date: "2026-11-10", receipts: [{kind: americorps, amount: 300, hours_served: 40}]}, title: "$300 for 40 hours ($7.50 an hour) is below the minimum wage: excluded (F)", expect: 0}
  - {id: CO-5004-T3, month: "2026-11", as_of: "2026-11-10", given: {leap_application_date: "2026-11-10", receipts: [{kind: americorps, amount: 300}]}, title: "Hours not stated: cannot determine (decision 4)", expect: unknown}
