id: CO-1283
name: LEAP living arrangement
identifier: leap_living_arrangement
kind: derived
type: one of
options: [traditional_dwelling, institutional_group_care, room_and_board, correctional_facility, dormitory, subsidized_without_heat_meter, commercial_property, hotel_without_thirty_days]
scope: person
program: LEAP
meaning: "The living arrangement of the person for the LEAP vulnerability test of 9 CCR 2503-7 3.752.25.B - an ordinary dwelling, or one of the arrangements that is not vulnerable: institutional group care, public or private, where the provider is liable for shelter and heating, such as a nursing home, group home or substance abuse treatment center (B.1); room and board or bed and breakfast (B.2); a correctional facility (B.3); a dormitory, fraternity or sorority house (B.4); subsidized housing without an individual heat meter or evidence of responsibility for heating surcharges (B.5); a commercial property that is also the dwelling (B.7); or a hotel without thirty days' continuous residence at the time of application with heat included in rent (B.8). Homelessness or a non-traditional dwelling (B.6) is leap_is_homeless_or_in_non_traditional_dwelling."
precision: "Read from residence_setting_type (CO-3330), the entry date (CO-008) and the home facts (CO-1275, CO-3300). B.8's 'has lived or will live' is read from the days lived by the application date (OQ-610). A person in institutional group care does not live at the household's dwelling, so leap_household_members (CO-1000) does not join that person. Unstated setting: LEAP's readers take an ordinary dwelling (OQ-158)."
derived: [case, [[in, residence_setting_type, [hospital, nursing_facility, icf_iid, psychiatric_hospital, tuberculosis_hospital, assisted_living_residence, group_home, host_home, other_long_term_care_facility, substance_use_treatment_facility, child_care_institution, other_institution]], institutional_group_care], [["=", residence_setting_type, room_and_board], room_and_board], [["=", residence_setting_type, correctional_facility], correctional_facility], [["=", residence_setting_type, educational_or_vocational_institution], dormitory], [["=", residence_setting_type, commercial_property], commercial_property], [["=", residence_setting_type, hotel], [case, [[all, [">=", [days_between, institution_entry_date, leap_application_date], leap_hotel_min_continuous_residence_days], ["=", home_heating_cost_arrangement, included_in_rent]], traditional_dwelling], [else, hotel_without_thirty_days]]], [[all, lives_in_subsidized_housing, [not, [in, home_heating_cost_arrangement, [pays_vendor_directly, billed_by_landlord_on_usage, separate_charge_from_landlord]]]], subsidized_without_heat_meter], [else, traditional_dwelling]]
sources: [S774, S775, S513]
implemented: engine
open: [OQ-610]
tags: [household]
rationale: "Same-word audit SW-20 and SW-21, dual-entry audit 2.10 and 3.20: where a person lives was stated by thirteen facts, each one program's classification (SNAP's meals institution, Medicaid's medical institution and IMD, the OAP Health Care exclusion, Adult Financial's three facility lists, LEAP's living arrangements, the inmate fact), which could contradict one another. One neutral description of the setting, in the terms of 42 CFR 435.1010 (S2201, S2202), is stated once; each program's test is a derived item. LEAP's arrangement was a supplied per-person classification; it is now LEAP's derived reading of the setting and the home facts."
tests:
  - {id: CO-1283-T1, as_of: "2026-10-01", given: {residence_setting_type: nursing_facility}, expect: institutional_group_care}
  - {id: CO-1283-T2, as_of: "2026-10-01", given: {residence_setting_type: educational_or_vocational_institution}, expect: dormitory}
  - {id: CO-1283-T3, title: "Hotel for 45 days, heat in the rent", as_of: "2026-12-01", given: {residence_setting_type: hotel, institution_entry_date: "2026-10-15", leap_application_date: "2026-11-29", home_heating_cost_arrangement: included_in_rent}, expect: traditional_dwelling}
  - {id: CO-1283-T4, title: "Hotel for 10 days", as_of: "2026-12-01", given: {residence_setting_type: hotel, institution_entry_date: "2026-11-19", leap_application_date: "2026-11-29", home_heating_cost_arrangement: included_in_rent}, expect: hotel_without_thirty_days}
  - {id: CO-1283-T5, title: "B.5: subsidized, heat in the rent", as_of: "2026-10-01", given: {residence_setting_type: private_dwelling, lives_in_subsidized_housing: true, home_heating_cost_arrangement: included_in_rent}, expect: subsidized_without_heat_meter}
  - {id: CO-1283-T6, as_of: "2026-10-01", given: {residence_setting_type: private_dwelling, lives_in_subsidized_housing: false, home_heating_cost_arrangement: pays_vendor_directly}, expect: traditional_dwelling}
