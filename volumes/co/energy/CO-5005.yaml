open: [OQ-681]
rationale: "Receipt records, migration phase 1: the Social Security term of leap_person_unearned_income (CO-3926), read from the receipts."
nearest: [CO-5006]
tests:
  - {id: CO-5005-T1, month: "2026-11", as_of: "2026-11-10", given: {leap_application_date: "2026-11-10", receipts: [{kind: social_security, amount: 1204.9}]}, title: "$1,204.90 counts as $1,204", expect: 1204}
  - {id: CO-5005-T2, month: "2026-11", as_of: "2026-11-10", given: {leap_application_date: "2026-11-10", receipts: [{kind: social_security, amount: 3000, frequency: once, retroactive: true, month: "2026-11", date: "2026-11-02"}]}, title: "A retroactive lump sum is not the month's benefit", expect: 0}
  # Coverage pass 4 L4-3: Social Security of $1,234.56 dated October 3 and November 3, 2026; application November 10: the period runs after
  # October 10 through November 10, so only November 3 is in it: $1,234 (the cents dropped, 3.752.211.H).
  - {id: CO-5005-T3, month: "2026-11", as_of: "2026-11-10", given: {leap_application_date: "2026-11-10", receipts: [{kind: social_security, amount: 1234.56, frequency: monthly, date: "2026-10-03"}, {kind: social_security, amount: 1234.56, frequency: monthly, date: "2026-11-03"}]}, title: "Dated Social Security read in the income verification period", expect: 1234}
  # Coverage pass 5 (docs/reviews/coverage5-care-energy.md), L5-1: application 2026-11-10, so the income verification period runs after 2026-10-10 through 2026-11-10 (CO-5002, OQ-681 (4)).
  - {"id": "CO-5005-T4", "title": "L5-1 (review household LS2): a Social Security stream of $1,200 whose start_date is 2026-11-25, after the application date (C.3.c): 0 (was 1,200)", "month": "2026-11", "as_of": "2026-11-10", "given": {"leap_application_date": "2026-11-10", "receipts": [{"kind": "social_security", "amount": 1200, "start_date": "2026-11-25"}]}, "expect": 0}
  - {"id": "CO-5005-T5", "title": "L5-1: a Social Security stream of $1,234.56 since 2026-01-03: 1,234 without its cents", "month": "2026-11", "as_of": "2026-11-10", "given": {"leap_application_date": "2026-11-10", "receipts": [{"kind": "social_security", "amount": 1234.56, "start_date": "2026-01-03"}]}, "expect": 1234}
  - {id: CO-5005-T6, month: "2026-11", as_of: "2026-11-10", given: {leap_application_date: "2026-11-10", receipts: [{kind: social_security, amount: 500.6}, {kind: social_security, amount: 300.7}]}, title: "Coverage pass 6 R6-7: two Social Security amounts of $500.60 and $300.70: the cents of each dropped, 500 + 300 = 800 (3.752.211.H; before, 801.30 rounded down to 801)", expect: 800}
