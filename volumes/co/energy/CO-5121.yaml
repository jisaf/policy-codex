sources: [S2712, S2713, S3300, S3301, S2208]
implemented: engine
tags: [income]
open: [OQ-681, OQ-1160, OQ-1181]
rationale: "Earned-income records, E1 (LEAP; design 2.5: \"dated pays in the eight weeks before application, averaged and multiplied by pays per month\"). The thirty-day households (docs/reviews/earnings-e0.md, section 5) state their pays with dates, so one statement serves LEAP's eight weeks and CCCAP's thirty days."
tests:
  # Application November 1, 2026: the eight weeks are September 6 to October 31. Weekly pays of $500 on the Fridays
  # September 11, 18, 25 and October 2, 9, 16, 23, 30: eight pays, average $500, x 4 = $2,000 (C.1.a).
  - {id: CO-5121-T1, title: "Weekly pays of $500 in the eight weeks: $2,000", as_of: "2026-11-01", month: "2026-11", given: {leap_application_date: "2026-11-01", earnings: [{kind: wages, amount: 500, frequency: weekly, date: "2026-09-11"}, {kind: wages, amount: 500, frequency: weekly, date: "2026-09-18"}, {kind: wages, amount: 500, frequency: weekly, date: "2026-09-25"}, {kind: wages, amount: 500, frequency: weekly, date: "2026-10-02"}, {kind: wages, amount: 500, frequency: weekly, date: "2026-10-09"}, {kind: wages, amount: 500, frequency: weekly, date: "2026-10-16"}, {kind: wages, amount: 500, frequency: weekly, date: "2026-10-23"}, {kind: wages, amount: 500, frequency: weekly, date: "2026-10-30"}]}, expect: 2000}
  # Four weeks of stubs (3.755.21.D): $460 + $540 + $500 + $620 = $2,120; average $530; x 4 = $2,120.
  - {id: CO-5121-T2, title: "Four weekly pay stubs that vary: their average times four", as_of: "2026-11-01", month: "2026-11", given: {leap_application_date: "2026-11-01", earnings: [{kind: wages, amount: 460, frequency: weekly, date: "2026-10-09"}, {kind: wages, amount: 540, frequency: weekly, date: "2026-10-16"}, {kind: wages, amount: 500, frequency: weekly, date: "2026-10-23"}, {kind: wages, amount: 620, frequency: weekly, date: "2026-10-30"}]}, expect: 2120}
  # Bi-weekly $1,100 on September 18, October 2, 16 and 30: average $1,100 x 2 = $2,200 (C.1.b).
  - {id: CO-5121-T3, title: "Bi-weekly pays of $1,100: $2,200", as_of: "2026-11-01", month: "2026-11", given: {leap_application_date: "2026-11-01", earnings: [{kind: wages, amount: 1100, frequency: biweekly, date: "2026-09-18"}, {kind: wages, amount: 1100, frequency: biweekly, date: "2026-10-02"}, {kind: wages, amount: 1100, frequency: biweekly, date: "2026-10-16"}, {kind: wages, amount: 1100, frequency: biweekly, date: "2026-10-30"}]}, expect: 2200}
  # Monthly $3,000 on September 30 and $3,200 on October 30: average $3,100 x 1 = $3,100.
  - {id: CO-5121-T4, title: "Monthly pays of $3,000 and $3,200: their average", as_of: "2026-11-01", month: "2026-11", given: {leap_application_date: "2026-11-01", earnings: [{kind: wages, amount: 3000, frequency: monthly, date: "2026-09-30"}, {kind: wages, amount: 3200, frequency: monthly, date: "2026-10-30"}]}, expect: 3100}
  # September 4 is before the eight weeks (they start September 6): only the $500 of September 11 is read: $500 x 4 = $2,000.
  - {id: CO-5121-T5, title: "A pay before the eight weeks is not read", as_of: "2026-11-01", month: "2026-11", given: {leap_application_date: "2026-11-01", earnings: [{kind: wages, amount: 900, frequency: weekly, date: "2026-09-04"}, {kind: wages, amount: 500, frequency: weekly, date: "2026-09-11"}]}, expect: 2000}
  # Semi-monthly $1,250 on October 15 and 30 and $1,350 on September 30: average ($1,250 + $1,250 + $1,350) / 3 = $1,283.333...; x 2 = $2,566.67 (to the cent, 2566.6666...).
  - {id: CO-5121-T6, title: "Semi-monthly pays averaged, times two", as_of: "2026-11-01", month: "2026-11", given: {leap_application_date: "2026-11-01", earnings: [{kind: wages, amount: 1350, frequency: semimonthly, date: "2026-09-30"}, {kind: wages, amount: 1250, frequency: semimonthly, date: "2026-10-15"}, {kind: wages, amount: 1250, frequency: semimonthly, date: "2026-10-30"}]}, expect: 2566.6666666666665}
  # A $300 bonus paid once on October 20 (in the income verification period, October 1 to November 1) counts at its amount;
  # one paid once on September 20 (in the eight weeks, before the period) does not (OQ-1160): $300.
  - {id: CO-5121-T7, title: "Pay received once counts when received in the income verification period", as_of: "2026-11-01", month: "2026-11", given: {leap_application_date: "2026-11-01", earnings: [{kind: wages, amount: 300, frequency: once, date: "2026-10-20"}, {kind: wages, amount: 250, frequency: once, date: "2026-09-20"}]}, expect: 300}
  # Two schedules: weekly $500 on October 9, 16, 23 and 30 (average $500 x 4 = $2,000) and a monthly $1,000 on October 15 ($1,000 x 1): $3,000.
  - {id: CO-5121-T8, title: "A weekly job and a monthly job, each schedule averaged and converted", as_of: "2026-11-01", month: "2026-11", given: {leap_application_date: "2026-11-01", earnings: [{kind: wages, amount: 500, frequency: weekly, date: "2026-10-09"}, {kind: wages, amount: 500, frequency: weekly, date: "2026-10-16"}, {kind: wages, amount: 500, frequency: weekly, date: "2026-10-23"}, {kind: wages, amount: 500, frequency: weekly, date: "2026-10-30"}, {kind: wages, amount: 1000, frequency: monthly, date: "2026-10-15"}]}, expect: 3000}
  - {id: CO-5121-T9, title: "Pays of a job that ended October 25 are read in the period (CO-3912), not here", as_of: "2026-11-01", month: "2026-11", given: {leap_application_date: "2026-11-01", earnings: [{kind: wages, amount: 500, frequency: weekly, date: "2026-10-23", job_end_date: "2026-10-25"}]}, expect: 0}
  # A pay on the application date is not "prior to" it: only the $400 of October 30 is read: $400 x 4 = $1,600.
  - {id: CO-5121-T10, title: "A pay dated on the application date is not in the eight weeks before it", as_of: "2026-11-06", month: "2026-11", given: {leap_application_date: "2026-11-06", earnings: [{kind: wages, amount: 400, frequency: weekly, date: "2026-10-30"}, {kind: wages, amount: 700, frequency: weekly, date: "2026-11-06"}]}, expect: 1600}
  # $600 a week with $100 of each pay set aside under an approved PASS (3.752.23.DD): ($600 - $100) x 4 = $2,000.
  - {id: CO-5121-T11, title: "A PASS set-aside off each dated pay", as_of: "2026-11-01", month: "2026-11", given: {leap_application_date: "2026-11-01", earnings: [{kind: wages, amount: 600, frequency: weekly, date: "2026-10-23", pass_set_aside: 100}, {kind: wages, amount: 600, frequency: weekly, date: "2026-10-30", pass_set_aside: 100}]}, expect: 2000}
  - {id: CO-5121-T12, title: "Dated pays, application date not stated: cannot determine", as_of: "2026-11-01", month: "2026-11", given: {earnings: [{kind: wages, amount: 500, frequency: weekly, date: "2026-10-30"}]}, expect: unknown}
