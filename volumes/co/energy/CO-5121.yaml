sources: [S2712, S2713, S3300, S3301, S2208]
implemented: engine
tags: [income]
open: [OQ-681, OQ-1160]
rationale: "Earned-income records, E1 (LEAP; design 2.5: \"dated pays in the eight weeks before application, averaged and multiplied by pays per month\"). The thirty-day households (docs/reviews/earnings-e0.md, section 5) state their pays with dates, so one statement serves LEAP's eight weeks and CCCAP's thirty days."
tests:
  # Application November 1, 2026: the eight weeks are September 6 to October 31. Weekly pays of $500 on the Fridays
  # September 11, 18, 25 and October 2, 9, 16, 23, 30: eight pays, average $500, x 4 = $2,000 (C.1.a).
  - {id: CO-5121-T1, title: "Weekly pays of $500 in the eight weeks: $2,000", as_of: "2026-11-01", month: "2026-11", given: {leap_application_date: "2026-11-01", earnings: [{kind: wages, amount: 500, frequency: weekly, date: "2026-09-11", job: job_1}, {kind: wages, amount: 500, frequency: weekly, date: "2026-09-18", job: job_1}, {kind: wages, amount: 500, frequency: weekly, date: "2026-09-25", job: job_1}, {kind: wages, amount: 500, frequency: weekly, date: "2026-10-02", job: job_1}, {kind: wages, amount: 500, frequency: weekly, date: "2026-10-09", job: job_1}, {kind: wages, amount: 500, frequency: weekly, date: "2026-10-16", job: job_1}, {kind: wages, amount: 500, frequency: weekly, date: "2026-10-23", job: job_1}, {kind: wages, amount: 500, frequency: weekly, date: "2026-10-30", job: job_1}]}, expect: 2000}
  # Four weeks of stubs (3.755.21.D): $460 + $540 + $500 + $620 = $2,120; average $530; x 4 = $2,120.
  - {id: CO-5121-T2, title: "Four weekly pay stubs that vary: their average times four", as_of: "2026-11-01", month: "2026-11", given: {leap_application_date: "2026-11-01", earnings: [{kind: wages, amount: 460, frequency: weekly, date: "2026-10-09", job: job_1}, {kind: wages, amount: 540, frequency: weekly, date: "2026-10-16", job: job_1}, {kind: wages, amount: 500, frequency: weekly, date: "2026-10-23", job: job_1}, {kind: wages, amount: 620, frequency: weekly, date: "2026-10-30", job: job_1}]}, expect: 2120}
  # Bi-weekly $1,100 on September 18, October 2, 16 and 30: average $1,100 x 2 = $2,200 (C.1.b).
  - {id: CO-5121-T3, title: "Bi-weekly pays of $1,100: $2,200", as_of: "2026-11-01", month: "2026-11", given: {leap_application_date: "2026-11-01", earnings: [{kind: wages, amount: 1100, frequency: biweekly, date: "2026-09-18", job: job_1}, {kind: wages, amount: 1100, frequency: biweekly, date: "2026-10-02", job: job_1}, {kind: wages, amount: 1100, frequency: biweekly, date: "2026-10-16", job: job_1}, {kind: wages, amount: 1100, frequency: biweekly, date: "2026-10-30", job: job_1}]}, expect: 2200}
  # Monthly $3,000 on September 30 and $3,200 on October 30: average $3,100 x 1 = $3,100.
