id: CO-5121
name: "LEAP: ongoing pay stated as dated pays, averaged and converted to a month"
identifier: leap_ongoing_dated_wages
kind: derived
type: money
scope: person-month
program: LEAP
meaning: "The person's earned ongoing income (9 CCR 2503-7 3.752.22.B, S2713: \"the countable gross income in any four (4) weeks of the eight (8) weeks prior to the application date\") from the earnings records (earnings, CO-5100) that state a pay with its date, of a kind LEAP's counting table counts as pay (leap_earnings_treatment_table, CO-5102), from a job that neither began in the income verification period nor ended on or before the application date: for each pay schedule 3.752.22.C converts, the average of the pays dated in the eight weeks before the application date, times the number of pays C adds (four weekly, two bi-weekly, two semi-monthly, one monthly), less the part of each pay set aside under a Plan for Achieving Self-Support (3.752.23.DD); and the pays of a frequency C does not convert received in the income verification period."
precision: "Earned-income records, step E1 (LEAP). The eight weeks are the leap_earned_ongoing_income_weeks (CO-5125) times seven days before leap_application_date (CO-2122), the application date itself not included (\"prior to the application date\"). \"Any four (4) weeks of the eight (8)\" is read, as before the records, as the average pay of the pays stated in the eight weeks times the number of pays C adds (OQ-681), which equals any four weeks when the pay is regular and lets a case state four weeks of pay stubs (3.755.21.D) or all eight. The average is taken over the pays of one schedule (the record's frequency, whose default is monthly: a dated pay that states no frequency is read as a monthly pay); two jobs on the same schedule stated as dated pays are averaged together, which counts one job's pay, so a case states the second as a stream (leap_ongoing_wage_streams, CO-5120) until a record can name its job (a field the integration owner adds to every table at once, design 4.3 rule 2; request R-2 in docs/reviews/records-earnings-care-energy.md). A pay dated before the eight weeks, or on or after the application date, is not read. A pay of another frequency (once, every other month, quarterly, twice a year, annually) is counted at its amount when received in the income verification period (leap_income_verification_period_start, CO-5002, through the application date), as LEAP counts income received once (3.752.22.A; OQ-1160). Pay of a job that began or ended is leap_wages_in_income_verification_period (CO-3912); Senior Community Service Employment Program pay is leap_scsep_wages (CO-5122)."
