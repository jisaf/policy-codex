id: CO-1460
name: "LEAP: pending verification count"
identifier: leap_pending_verification_count
kind: derived
type: whole number
scope: person-month
program: LEAP
role: outcome
meaning: The number of verification elements still pending across every member of this person's LEAP economic unit, including members whose income counts though they are excluded for citizenship.
derived: [sum, leap_household_members_for_income, [of, [P], leap_person_pending_verification_count]]
sources: [S893, S897]
implemented: engine
tags: [verification]
rationale: No existing item counts a LEAP household's outstanding verifications.
tests:
  - {id: CO-1460-T1, month: "2026-10", as_of: "2026-10-01", given: {leap_household_members_for_income: [p1, p2], leap_person_pending_verification_count: 1}, others: {p2: {leap_person_pending_verification_count: 0}}, expect: 1}
