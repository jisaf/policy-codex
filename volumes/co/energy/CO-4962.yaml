id: CO-4962
name: "LEAP: a person's excluded receipts within the lump sums of the income verification period"
identifier: leap_excluded_receipts_in_lump_sum
kind: derived
type: money
scope: person-month
program: LEAP
meaning: "The part of the lump sums the person received in the thirty days before the application date (lump_sum_received_prior_thirty_days, CO-4066) that is a receipt 9 CCR 2503-7 3.752.23 or 3.752.211.D excludes and that has its own source fact (leap_excluded_source_receipts, CO-4961): the one place LEAP decides whether an excluded receipt sits in the lump sum or in the recurring income."
precision: "The stated parts: refugee_resettlement_grant_received_prior_thirty_days (CO-4508, AA) and named_source_receipts_in_lump_sum_prior_thirty_days (CO-4960, the other sources). A part not stated is taken from the month's facts: the month's receipts of its sources, as far as the month's lump sum (lump_sum_received, CO-3367) reaches after the parts already placed; a receipt of a month with no lump sum is recurring. Both facts are part of the same gross unearned income, so when the receipts and the lump sum together exceed it the overlap is forced, and a case whose receipts were paid each month alongside an unrelated lump sum states CO-4960 as 0. The result is at most the thirty-day lump sum less its other excluded parts (CO-4067, CO-4068, CO-4507, CO-4509), not below zero; with the thirty-day lump sum not stated it is 0 (CO-4069 then reads the months). leap_person_one_time_income (CO-4069) subtracts this amount from the lump sum; leap_excluded_unearned_income (CO-4511) subtracts the receipts less the part of this amount that lies in the month's lump sum, which the recurring figure (CO-3913) already leaves out. Each excluded dollar is so subtracted once, from the side that holds it."
derived: [min, [max, 0, ["-", [otherwise, lump_sum_received_prior_thirty_days, 0], ["+", [otherwise, retroactive_social_security_lump_sum_received_prior_thirty_days, 0], [otherwise, retroactive_ssi_or_public_assistance_lump_sum_received_prior_thirty_days, 0], [otherwise, resource_liquidation_proceeds_received_prior_thirty_days, 0], [otherwise, insurance_proceeds_spent_on_covered_costs_prior_thirty_days, 0]]]], ["+", [otherwise, refugee_resettlement_grant_received_prior_thirty_days, [min, [otherwise, refugee_resettlement_payments_received, 0], [otherwise, lump_sum_received, 0]]], [otherwise, named_source_receipts_in_lump_sum_prior_thirty_days, [min, [max, 0, ["-", leap_excluded_source_receipts, [otherwise, refugee_resettlement_payments_received, 0]]], [max, 0, ["-", [otherwise, lump_sum_received, 0], [otherwise, refugee_resettlement_grant_received_prior_thirty_days, [min, [otherwise, refugee_resettlement_payments_received, 0], [otherwise, lump_sum_received, 0]]]]]]]]]
sources: [S1624, S3300, S3304, S3595, S3302, S2712, S2713, S2714]
implemented: engine
tags: [income]
open: [OQ-863]
rationale: "Coverage review 3 F3-2 (P1): an excluded one-time payment stated both as its source fact and as a lump sum was subtracted from the recurring figure (CO-4511), which had already left the lump sum out, and counted in the thirty-day lump sum (CO-4069), which had a part fact only for the resettlement grant (probes PR3-L2 to PR3-L4: $6,000, $5,500 and $3,900 where the rule gives $3,000, $3,400 and $3,000). One item now decides how much of the excluded receipts lies in the lump sum, and both subtractions read it."
nearest: [CO-4511, CO-4069]
