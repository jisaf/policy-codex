id: CO-2874
name: leap has countable unearned income
identifier: leap_has_countable_unearned_income
kind: derived
type: yes/no
scope: person-month
program: LEAP
meaning: "Whether the person has unearned income that LEAP counts and so must verify: the person's countable unearned income (leap_person_unearned_income, CO-3926: the recurring unearned income of the income verification period, Social Security and SSI without cents, Colorado Works and Adult Financial cash assistance, and the prizes and lump sums of the period, less what 9 CCR 2503-7 3.752.23 excludes) is more than zero."
precision: "Second-pass review P2 (verification triggers): the item summed the calendar month's unearned income facts, so it asked for income LEAP does not count (what 3.752.23 excludes) and missed what it does (prizes, lump sums, a receipt stated only for the thirty days). It now reads the countable figure."
derived: [">", leap_person_unearned_income, 0]
sources: [S776, S897]
implemented: engine
tags: [income, verification]
rationale: "Same-word audit SW-27: the shared has_unearned_income (CO-1357, retired) summed every unearned source, each program's own grant included, and five programs read it as the unearned income they count, so a CCCAP household whose only unearned income is its Colorado Works grant had an element to verify. Each program reads its own sources."
nearest: [CO-2870, CO-2871, CO-2872, CO-2873]
tests:
  - {id: CO-2874-T1, month: "2026-11", as_of: "2026-11-01", given: {ma_is_aged_blind_or_disabled: false, receipts: [{kind: colorado_works_cash, amount: 488}]}, title: "Only the Colorado Works grant", expect: true}
  - {id: CO-2874-T2, month: "2026-11", as_of: "2026-11-01", given: {ma_is_aged_blind_or_disabled: false, receipts: [{kind: child_support, amount: 200}]}, title: "Child support received", expect: true}
  - {id: CO-2874-T3, month: "2026-11", as_of: "2026-11-01", given: {receipts: [{kind: ssi, amount: 994}]}, title: "F-10: SSI only", expect: true}
