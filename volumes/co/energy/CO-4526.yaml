sources: [S897, S898, S3313, S2712, S2713]
implemented: engine
tags: [verification, income]
open: [OQ-681]
rationale: "Coverage review C-9: leap_unearned_income_verification_is_pending (CO-2591) required documents for all countable unearned income (unearned_income_is_verified: an electronic source or documents), so a declared gift and the child support of a domestic violence victim with court or ACP evidence stayed pending, although 3.755.21.K and B.4 (S3313) make the declaration sufficient."
tests:
  - {id: CO-4526-T1, month: "2026-11", as_of: "2026-11-10", given: {leap_person_unearned_income: 1200, receipts: [{kind: social_security, amount: 1200}]}, title: "$1,200 of Social Security: verified by documents", expect: true}
  - {id: CO-4526-T2, month: "2026-11", as_of: "2026-11-10", given: {leap_person_unearned_income: 200, receipts: [{kind: gift, amount: 200}]}, title: "Only $200 of gifts: the declaration verifies it (3.755.21.K)", expect: false}
  - {id: CO-4526-T3, month: "2026-11", as_of: "2026-11-10", given: {leap_person_unearned_income: 400, has_domestic_violence_court_evidence_or_acp_participation: true, receipts: [{kind: child_support, amount: 400}]}, title: "Child support with court evidence of domestic violence: declared (3.755.21.B.4)", expect: false}
  - {id: CO-4526-T4, month: "2026-11", as_of: "2026-11-10", given: {leap_person_unearned_income: 400, receipts: [{kind: child_support, amount: 400}]}, title: "Child support without that evidence: verified", expect: true}
  # Coverage pass 5 (docs/reviews/coverage5-care-energy.md), L5-6: application 2026-11-10, period 2026-10-10 to 2026-11-10; the declared gifts are those leap_person_unearned_income counts.
  - {"id": "CO-4526-T5", "title": "L5-6 (review household LG1): a $500 gift paid once on 2026-11-01, the only unearned income: declared (3.755.21.K), no document required (was required)", "month": "2026-11", "as_of": "2026-11-10", "given": {"leap_application_date": "2026-11-10", "earnings": [], "receipts": [{"kind": "gift", "amount": 500, "frequency": "once", "date": "2026-11-01"}]}, "expect": false}
  - {"id": "CO-4526-T6", "title": "L5-6 (review household LG2): four weekly $100 gifts dated 2026-10-16 to 2026-11-06: declared, not required (was required)", "month": "2026-11", "as_of": "2026-11-10", "given": {"leap_application_date": "2026-11-10", "earnings": [], "receipts": [{"kind": "gift", "amount": 100, "frequency": "weekly", "date": "2026-10-16"}, {"kind": "gift", "amount": 100, "frequency": "weekly", "date": "2026-10-23"}, {"kind": "gift", "amount": 100, "frequency": "weekly", "date": "2026-10-30"}, {"kind": "gift", "amount": 100, "frequency": "weekly", "date": "2026-11-06"}]}, "expect": false}
  - {"id": "CO-4526-T7", "title": "L5-6: the same one-time gift beside a $300 pension stream: the pension must be verified, required", "month": "2026-11", "as_of": "2026-11-10", "given": {"leap_application_date": "2026-11-10", "earnings": [], "receipts": [{"kind": "gift", "amount": 500, "frequency": "once", "date": "2026-11-01"}, {"kind": "pension", "amount": 300}]}, "expect": true}
