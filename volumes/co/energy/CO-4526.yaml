id: CO-4526
name: "LEAP: requires verification of unearned income"
identifier: leap_requires_verification_of_unearned_income
kind: derived
type: yes/no
scope: person-month
program: LEAP
meaning: "Whether the person's unearned income must be verified for LEAP by documents or an electronic source (9 CCR 2503-7 3.755.11, 3.755.21.A-C): the person has countable unearned income beyond what the applicant's declaration verifies, which is gift income (3.755.21.K) and, when the applicant has provided court evidence of domestic violence or takes part in the Address Confidentiality Program, child support (3.755.21.B.4)."
precision: leap_person_unearned_income (CO-3926) less gifts_received (CO-4524) and, where has_domestic_violence_court_evidence_or_acp_participation (CO-4525) is true for the person, child_support_received (CO-028), is more than zero; each is read as 0 or false when not stated. The declared parts are the month's receipts, taken as those of the income verification period as CO-3926's recurring part is (OQ-681).
derived: [">", ["-", leap_person_unearned_income, ["+", [otherwise, gifts_received, 0], [case, [[otherwise, has_domestic_violence_court_evidence_or_acp_participation, false], [otherwise, child_support_received, 0]], [else, 0]]]], 0]
sources: [S897, S898, S3313]
implemented: engine
tags: [verification, income]
open: [OQ-681]
rationale: "Coverage review C-9: leap_unearned_income_verification_is_pending (CO-2591) required documents for all countable unearned income (unearned_income_is_verified: an electronic source or documents), so a declared gift and the child support of a domestic violence victim with court or ACP evidence stayed pending, although 3.755.21.K and B.4 (S3313) make the declaration sufficient."
tests:
  - {id: CO-4526-T1, month: "2026-11", as_of: "2026-11-10", given: {leap_person_unearned_income: 1200}, title: "$1,200 of Social Security: verified by documents", expect: true}
  - {id: CO-4526-T2, month: "2026-11", as_of: "2026-11-10", given: {leap_person_unearned_income: 200, gifts_received: 200, receipts: [{kind: social_security}, {kind: ssi}, {kind: pension}, {kind: unemployment_compensation}, {kind: child_support}, {kind: colorado_works_cash}, {kind: adult_financial_cash}, {kind: tax_exempt_interest}, {kind: gift, amount: 200}, {kind: other_taxable}, {kind: other_nontaxable}]}, title: "Only a $200 gift from a relative: the declaration suffices (3.755.21.K)", expect: false}
  - {id: CO-4526-T3, month: "2026-11", as_of: "2026-11-10", given: {leap_person_unearned_income: 400, child_support_received: 400, has_domestic_violence_court_evidence_or_acp_participation: true, receipts: [{kind: social_security}, {kind: ssi}, {kind: pension}, {kind: unemployment_compensation}, {kind: child_support, amount: 400}, {kind: colorado_works_cash}, {kind: adult_financial_cash}, {kind: tax_exempt_interest}, {kind: other_taxable}, {kind: other_nontaxable}]}, title: "Only $400 of child support, applicant in the Address Confidentiality Program (3.755.21.B.4)", expect: false}
  - {id: CO-4526-T4, month: "2026-11", as_of: "2026-11-10", given: {leap_person_unearned_income: 400, child_support_received: 400, receipts: [{kind: social_security}, {kind: ssi}, {kind: pension}, {kind: unemployment_compensation}, {kind: child_support, amount: 400}, {kind: colorado_works_cash}, {kind: adult_financial_cash}, {kind: tax_exempt_interest}, {kind: other_taxable}, {kind: other_nontaxable}]}, title: "$400 of child support without that evidence", expect: true}
