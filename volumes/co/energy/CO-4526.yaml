id: CO-4526
name: "LEAP: requires verification of unearned income"
identifier: leap_requires_verification_of_unearned_income
kind: derived
type: yes/no
scope: person-month
program: LEAP
meaning: "Whether the person's unearned income must be verified for LEAP by documents or an electronic source (9 CCR 2503-7 3.755.11, 3.755.21.A-C): the person has countable unearned income beyond what the applicant's declaration verifies, which is gift income (3.755.21.K) and, when the applicant has provided court evidence of domestic violence or takes part in the Address Confidentiality Program, child support (3.755.21.B.4)."
precision: "leap_person_unearned_income (CO-3926) less the gift receipts and, where has_domestic_violence_court_evidence_or_acp_participation (CO-4525) is true for the person (read as false when not stated), the child support receipts it counts, is more than zero (receipts, CO-5000; migration phase 1). Coverage pass 5, L5-6 (docs/reviews/coverage5-care-energy.md): the declared parts are taken exactly as CO-3926 counts them: recurring receipts by leap_counted_recurring_receipts' placement and value (CO-5003: by date in the income verification period, a stream by its source's dates) and receipts paid once by leap_one_time_receipts_in_period's (CO-5009), so a one-time gift or weekly gifts dated in the period are verified by the applicant's declaration (3.755.21.K, S3313: \"Gift income shall be considered verified with applicant declaration\"; B.4) as the month's recurring gifts were (review households LG1 and LG2: before, verification required; now not). Before, only the month's recurring receipts were taken off (OQ-681)."
