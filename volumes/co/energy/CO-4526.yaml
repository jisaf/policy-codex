id: CO-4526
name: "LEAP: requires verification of unearned income"
identifier: leap_requires_verification_of_unearned_income
kind: derived
type: yes/no
scope: person-month
program: LEAP
meaning: "Whether the person's unearned income must be verified for LEAP by documents or an electronic source (9 CCR 2503-7 3.755.11, 3.755.21.A-C): the person has countable unearned income beyond what the applicant's declaration verifies, which is gift income (3.755.21.K) and, when the applicant has provided court evidence of domestic violence or takes part in the Address Confidentiality Program, child support (3.755.21.B.4)."
precision: leap_person_unearned_income (CO-3926) less the month's recurring gift receipts and, where has_domestic_violence_court_evidence_or_acp_participation (CO-4525) is true for the person (read as false when not stated), the month's recurring child support receipts, is more than zero (receipts, CO-5000; migration phase 1). The declared parts are the month's receipts, taken as those of the income verification period as CO-3926's recurring part is (OQ-681).
derived: [">", ["-", leap_person_unearned_income, ["+", [sum_receipts, receipts, [all, [not, ["=", [receipt, frequency], once]], [received_in, [month]], ["=", [receipt, kind], gift]], [receipt, amount]], [case, [[otherwise, has_domestic_violence_court_evidence_or_acp_participation, false], [sum_receipts, receipts, [all, [not, ["=", [receipt, frequency], once]], [received_in, [month]], [in, [receipt, kind], [child_support, child_support_arrears]]], [receipt, amount]]], [else, 0]]]], 0]
sources: [S897, S898, S3313]
implemented: engine
tags: [verification, income]
open: [OQ-681]
rationale: "Coverage review C-9: leap_unearned_income_verification_is_pending (CO-2591) required documents for all countable unearned income (unearned_income_is_verified: an electronic source or documents), so a declared gift and the child support of a domestic violence victim with court or ACP evidence stayed pending, although 3.755.21.K and B.4 (S3313) make the declaration sufficient."
tests:
  - {id: CO-4526-T1, month: "2026-11", as_of: "2026-11-10", given: {leap_person_unearned_income: 1200, receipts: [{kind: social_security, amount: 1200}]}, title: "$1,200 of Social Security: verified by documents", expect: true}
  - {id: CO-4526-T2, month: "2026-11", as_of: "2026-11-10", given: {leap_person_unearned_income: 200, receipts: [{kind: gift, amount: 200}]}, title: "Only $200 of gifts: the declaration verifies it (3.755.21.K)", expect: false}
  - {id: CO-4526-T3, month: "2026-11", as_of: "2026-11-10", given: {leap_person_unearned_income: 400, has_domestic_violence_court_evidence_or_acp_participation: true, receipts: [{kind: child_support, amount: 400}]}, title: "Child support with court evidence of domestic violence: declared (3.755.21.B.4)", expect: false}
  - {id: CO-4526-T4, month: "2026-11", as_of: "2026-11-10", given: {leap_person_unearned_income: 400, receipts: [{kind: child_support, amount: 400}]}, title: "Child support without that evidence: verified", expect: true}
