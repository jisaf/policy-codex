id: CO-3925
name: "LEAP: a person's monthly wages"
identifier: leap_person_wages
kind: derived
type: money
scope: person-month
program: LEAP
meaning: "This person's gross monthly earned income other than self-employment for LEAP (9 CCR 2503-7 3.752.22.B-C): for each job that began in the income verification period or ended on or before the application date, the pay actually received in the period (C.3.a-b; leap_wages_in_income_verification_period, CO-3912); for every other job, its earned ongoing income from the eight weeks before the application date, one pay converted by the job's pay schedule (four weekly, two bi-weekly, two semi-monthly, one monthly amount; leap_ongoing_wage_streams, CO-5120, for a pay stated as a stream; leap_ongoing_dated_wages, CO-5121, the average of the pays dated in the eight weeks); with the declared value of in-kind pay (C.4); without the pay 3.752.23 excludes (work-study, P; an employer's health insurance subsidy paid to the person, HH; payments an employer makes to others, T), and without the Senior Community Service Employment Program pay of a person fifty-five or older (CC; leap_scsep_wages, CO-5122); each pay less its part set aside under a Plan for Achieving Self-Support (DD)."
precision: "Earned-income records, step E1 (LEAP; docs/reviews/records-earnings-care-energy.md): read from the earnings records (earnings, CO-5100) through leap_earnings_treatment_table (CO-5102), replacing wages_pay_frequency and wages_gross_per_pay_period (CO-3921, CO-3922: one schedule per person), employment_began_or_ended_prior_thirty_days (CO-3923, read as false when not stated), scsep_wages (CO-4504), employer_health_insurance_subsidy_received (CO-4505) and in_kind_compensation_value (CO-4506), each read as 0 when not stated, and pass_set_aside_earned_income (CO-4618), which leap_household_income (CO-1002) subtracted. Each record is one pay or one stream of a job's pay, disjoint from the others, so nothing is subtracted from a total it was part of. Whether a job began or ended is read from the record's job dates (job_start_date on or after leap_income_verification_period_start, CO-5002; job_end_date on or before leap_application_date); a record that states neither is ongoing pay. The SCSEP age is the person's age on the determination date, compared with leap_scsep_exclusion_min_age (CO-4510), and read only when the person has SCSEP pay. leap_household_income (CO-1002) excludes the earned income of a child under eighteen residing with a parent or guardian (3.752.23.Q, leap_earnings_are_excluded_as_child, CO-5123). The readings of the period and of \"any four weeks of the eight\" are OQ-681's; the frequencies 3.752.22.C does not convert, OQ-1160; two jobs on one schedule stated as dated pays are averaged together until a record can name its job (CO-5121; request R-2 in docs/reviews/records-earnings-care-energy.md)."
derived: ["+", leap_wages_in_income_verification_period, leap_ongoing_wage_streams, leap_ongoing_dated_wages, [case, [["=", leap_scsep_wages, 0], 0], [["<", age, leap_scsep_exclusion_min_age], leap_scsep_wages], [else, 0]]]
sources: [S2712, S2713, S3301, S3305, S2208, S3300, S4105]
implemented: engine
tags: [income]
open: [OQ-681, OQ-1160]
rationale: "Final pass F-09 (SW-35): LEAP's earned ongoing income is four weeks of the eight before the application, converted by the pay schedule (weekly x 4, bi-weekly x 2, semi-monthly x 2), and new or terminated income is the actual income of the income verification period (3.752.22.B-C, S2713). leap_household_income (CO-1002) read the calendar month's wages_gross, which for a weekly earner in a five-Friday month is five weeks of pay, not four. Earned-income records, E1 (LEAP): each job's pay is a record with its own schedule and dates, so the period, the eight weeks and a job's beginning or end are computed from dates, two jobs on different schedules are each converted, and the SCSEP, subsidy, in-kind and PASS amounts are rows and fields of the records rather than parts subtracted from one total."
tests:
  # 3.752.22.C.1.a: $500 a week: 4 x $500 = $2,000, though the calendar month holds five Fridays ($2,500).
  - {id: CO-3925-T1, title: "A weekly earner paid $500 a week: $2,000 (C.1.a), though the calendar month holds five Fridays", as_of: "2026-12-01", month: "2026-12", given: {earnings: [{kind: wages, amount: 2500, frequency: weekly, per_payment: 500}]}, expect: 2000}
  - {id: CO-3925-T2, title: "Paid $1,100 every two weeks: 2 x $1,100 = $2,200 (C.1.b)", as_of: "2026-12-01", month: "2026-12", given: {earnings: [{kind: wages, frequency: biweekly, per_payment: 1100}]}, expect: 2200}
  - {id: CO-3925-T3, title: "Paid $1,300 twice a month: 2 x $1,300 = $2,600 (C.2)", as_of: "2026-12-01", month: "2026-12", given: {earnings: [{kind: wages, frequency: semimonthly, per_payment: 1300}]}, expect: 2600}
  # Restated with dated pays (docs/reviews/earnings-e0.md, section 5: the thirty-day total and the flag are not records). Application December 1,
  # 2026: the income verification period is November 1 to December 1 (CO-5002). A weekly job that ended November 21 paid $500 on November 6,
  # 13 and 20 (and $500 on October 30, before the period): the actual income received in the period, 3 x $500 = $1,500 (C.3.a).
  - {id: CO-3925-T4, title: "A job that ended three weeks ago: the $1,500 actually received in the period (C.3.a)", as_of: "2026-12-01", month: "2026-12", given: {leap_application_date: "2026-12-01", earnings: [{kind: wages, amount: 500, frequency: weekly, date: "2026-10-30", job_end_date: "2026-11-21", job: job_1}, {kind: wages, amount: 500, frequency: weekly, date: "2026-11-06", job_end_date: "2026-11-21", job: job_1}, {kind: wages, amount: 500, frequency: weekly, date: "2026-11-13", job_end_date: "2026-11-21", job: job_1}, {kind: wages, amount: 500, frequency: weekly, date: "2026-11-20", job_end_date: "2026-11-21", job: job_1}]}, expect: 1500}
  - {id: CO-3925-T5, title: "No pay schedule stated (monthly): the month's $2,600", as_of: "2026-12-01", month: "2026-12", given: {earnings: [{kind: wages, amount: 2600}]}, expect: 2600}
  # Born 1964-03-01: 62 on 2026-11-10, at least leap_scsep_exclusion_min_age (55). SCSEP pay of $600 every two weeks is excluded (3.752.23.CC): $0.
  - {id: CO-3925-T6, title: "Coverage review C-23: a 62-year-old paid $600 every two weeks by SCSEP: excluded (3.752.23.CC)", as_of: "2026-11-10", month: "2026-11", given: {date_of_birth: "1964-03-01", earnings: [{kind: scsep_employment, frequency: biweekly, per_payment: 600}]}, expect: 0}
  # $2,000 a month of which $150 is an employer health insurance subsidy paid to the person: wages $1,850 (counted) and the subsidy $150
  # (excluded, 3.752.23.HH), stated apart; rent-free housing declared at $700 (C.4): $1,850 + $700 = $2,550.
  - {id: CO-3925-T7, title: "Coverage review C-1 and C-12: $2,000 of monthly pay including a $150 employer health insurance subsidy, and rent-free housing declared at $700 for managing the building (3.752.23.HH, 3.752.22.C.4)", as_of: "2026-11-10", month: "2026-11", given: {date_of_birth: "1980-01-01", earnings: [{kind: wages, amount: 1850}, {kind: employer_health_insurance_subsidy, amount: 150}, {kind: in_kind_pay, amount: 700}]}, expect: 2550}
  # Born 1976-03-01: 50 on 2026-11-10, under 55: SCSEP pay of $600 every two weeks counts, 2 x $600 = $1,200.
  - {id: CO-3925-T8, title: "A 50-year-old's SCSEP pay is counted (3.752.23.CC reaches fifty-five and older only)", as_of: "2026-11-10", month: "2026-11", given: {date_of_birth: "1976-03-01", earnings: [{kind: scsep_employment, frequency: biweekly, per_payment: 600}]}, expect: 1200}
  # Application November 1: a job that began October 19 paid $400 on October 23 and 30 (in the period, October 1 to November 1): $800;
  # an ongoing weekly job paid $300 on October 16, 23 and 30: average $300 x 4 = $1,200. Total $800 + $1,200 = $2,000.
  - {id: CO-3925-T9, title: "A new job's pays in the period and an ongoing job's converted pay", as_of: "2026-11-01", month: "2026-11", given: {leap_application_date: "2026-11-01", earnings: [{kind: wages, amount: 400, frequency: weekly, date: "2026-10-23", job_start_date: "2026-10-19", job: job_2}, {kind: wages, amount: 400, frequency: weekly, date: "2026-10-30", job_start_date: "2026-10-19", job: job_2}, {kind: wages, amount: 300, frequency: weekly, date: "2026-10-16", job: job_1}, {kind: wages, amount: 300, frequency: weekly, date: "2026-10-23", job: job_1}, {kind: wages, amount: 300, frequency: weekly, date: "2026-10-30", job: job_1}]}, expect: 2000}
  - {id: CO-3925-T10, title: "Earnings not stated: cannot determine", as_of: "2026-11-10", month: "2026-11", given: {date_of_birth: "1980-01-01"}, expect: unknown}
  - {id: CO-3925-T11, title: "No SCSEP pay: the age is not read", as_of: "2026-11-10", month: "2026-11", given: {earnings: [{kind: wages, amount: 1200}]}, expect: 1200}
