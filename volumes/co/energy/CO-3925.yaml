id: CO-3925
name: "LEAP: a person's monthly wages"
identifier: leap_person_wages
kind: derived
type: money
scope: person-month
program: LEAP
meaning: "This person's gross monthly wages for LEAP (9 CCR 2503-7 3.752.22.B-C): for ongoing pay, the gross amount of one pay times the number of pays 3.752.22.C adds for the person's pay schedule (four weekly, two bi-weekly, two semi-monthly, one monthly), the pays being those of four of the eight weeks before the application date; for a job that began or ended in the income verification period, the wages actually received in that period (C.3.a-b); less the funds a person of fifty-five or older receives under the Senior Community Service Employment Program (3.752.23.CC) and the health insurance subsidies an employer pays directly to the person (3.752.23.HH); plus the declared value of in-kind income received in exchange for employment (3.752.22.C.4)."
precision: "Ongoing pay is wages_gross_per_pay_period (CO-3922) times leap_pay_periods_per_month (CO-3924) for wages_pay_frequency (CO-3921); \"any four (4) weeks of the eight (8)\" is read as the average pay of the eight weeks (OQ-681). A job that began or ended (employment_began_or_ended_prior_thirty_days, CO-3923, read as false when not stated) is read from leap_wages_in_income_verification_period (CO-3912), the income verification period being read as the thirty days before the application date (OQ-681). When the pay schedule is not stated, the person's wages are read as those received in that period too. leap_household_income (CO-1002) zeroes the wages of a child under eighteen (3.752.23.Q). Coverage review C-12 and C-23: scsep_wages (CO-4504, for a person at least leap_scsep_exclusion_min_age, CO-4510) and employer_health_insurance_subsidy_received (CO-4505), each part of the wages and read as 0 when not stated, are subtracted, not below zero; in_kind_compensation_value (CO-4506, read as 0) is added. They are read for the month being determined and taken as the month's part of the converted or thirty-day wages."
derived: [+, [max, 0, ["-", [case, [[otherwise, employment_began_or_ended_prior_thirty_days, false], leap_wages_in_income_verification_period], [[unknown, wages_pay_frequency], leap_wages_in_income_verification_period], [else, ["*", wages_gross_per_pay_period, [lookup, leap_pay_periods_per_month, wages_pay_frequency]]]], [+, [case, [["=", [otherwise, scsep_wages, 0], 0], 0], [[">=", age, leap_scsep_exclusion_min_age], scsep_wages], [else, 0]], [otherwise, employer_health_insurance_subsidy_received, 0]]]], [otherwise, in_kind_compensation_value, 0]]
sources: [S2712, S2713, S3301, S3305]
implemented: engine
tags: [income]
open: [OQ-681]
rationale: "Final pass F-09 (SW-35): LEAP's earned ongoing income is four weeks of the eight before the application, converted by the pay schedule (weekly x 4, bi-weekly x 2, semi-monthly x 2), and new or terminated income is the actual income of the income verification period (3.752.22.B-C, S2713). leap_household_income (CO-1002) read the calendar month's wages_gross, which for a weekly earner in a five-Friday month is five weeks of pay, not four."
tests:
  - {id: CO-3925-T1, title: "A weekly earner paid $500 a week: $2,000 (C.1.a), though the calendar month holds five Fridays", as_of: "2026-12-01", month: "2026-12", given: {wages_pay_frequency: weekly, wages_gross_per_pay_period: 500, wages_gross: 2500, earnings: [{kind: wages, amount: 2500, frequency: weekly, per_payment: 500}, {kind: self_employment_receipts}]}, expect: 2000}
  - {id: CO-3925-T2, title: "Paid $1,100 every two weeks: $2,200 (C.1.b)", as_of: "2026-12-01", month: "2026-12", given: {wages_pay_frequency: biweekly, wages_gross_per_pay_period: 1100, earnings: [{kind: wages, frequency: biweekly, per_payment: 1100}, {kind: self_employment_receipts}]}, expect: 2200}
  - {id: CO-3925-T3, title: "Paid $1,300 twice a month: $2,600 (C.2)", as_of: "2026-12-01", month: "2026-12", given: {wages_pay_frequency: semimonthly, wages_gross_per_pay_period: 1300, earnings: [{kind: wages, frequency: semimonthly, per_payment: 1300}, {kind: self_employment_receipts}]}, expect: 2600}
  - {id: CO-3925-T4, title: "A job that ended three weeks ago: the $1,500 actually received in the period (C.3.a)", as_of: "2026-12-01", month: "2026-12", given: {employment_began_or_ended_prior_thirty_days: true, wages_gross_received_prior_thirty_days: 1500, wages_pay_frequency: weekly, wages_gross_per_pay_period: 500, earnings: [{kind: wages, frequency: weekly, per_payment: 500}, {kind: self_employment_receipts}]}, expect: 1500}
  - {id: CO-3925-T5, title: "No pay schedule stated: the month's wages", as_of: "2026-12-01", month: "2026-12", given: {wages_gross: 2600, earnings: [{kind: wages, amount: 2600}, {kind: self_employment_receipts}]}, expect: 2600}
  - {id: CO-3925-T6, title: "Coverage review C-23: a 62-year-old paid $600 every two weeks by SCSEP: excluded (3.752.23.CC)", as_of: "2026-11-10", month: "2026-11", given: {date_of_birth: "1964-03-01", wages_pay_frequency: biweekly, wages_gross_per_pay_period: 600, scsep_wages: 1200, earnings: [{kind: wages, frequency: biweekly, per_payment: 600}, {kind: scsep_employment, amount: 1200}, {kind: self_employment_receipts}]}, expect: 0}
  - {id: CO-3925-T7, title: "Coverage review C-1 and C-12: $2,000 of monthly pay including a $150 employer health insurance subsidy, and rent-free housing declared at $700 for managing the building (3.752.23.HH, 3.752.22.C.4)", as_of: "2026-11-10", month: "2026-11", given: {date_of_birth: "1980-01-01", wages_pay_frequency: monthly, wages_gross_per_pay_period: 2000, employer_health_insurance_subsidy_received: 150, in_kind_compensation_value: 700, earnings: [{kind: wages, frequency: monthly, per_payment: 2000}, {kind: employer_health_insurance_subsidy, amount: 150}, {kind: in_kind_pay, amount: 700}, {kind: self_employment_receipts}]}, expect: 2550}
