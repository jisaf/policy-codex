# Earned-income records, Medicaid and CHP+ track E1 (docs/reviews/records-earnings-medicaid.md): Medicaid MAGI and the
# SSI method (deeming, the spousal allowances, long-term care, the buy-ins) and CHP+ through its MAGI link read earned
# income from the earnings records (CO-5100) through Medicaid's two earnings counting tables (CO-5106, CO-5107); OQ-1023
# and OQ-1024 (MAGI) settled where the fetched text settles them; the duplicate-path P1s D-M1 to D-M4; the T-9 hand
# check's Medicaid and CHP+ rows. One entry per change-impact flag.
date: 2026-11-23
summary: Earned-income records E1 for Medicaid and CHP+ - earned income read from the earnings records through the MAGI and SSI-method counting tables, OQ-1023 and OQ-1024 settled where the text settles them, the four duplicate-path P1s, and the T-9 hand check's Medicaid rows.
