# Earned-income records, step E1, SNAP (2026-11-23; docs/reviews/records-earnings-snap.md). SNAP reads earned income
# from the earnings records (CO-5100) through snap_earnings_treatment_table (CO-5101): each pay converted by its own
# frequency (CO-4324; CO-4682 retired), the counted pay summed record by record (CO-5113), the business, the farm and
# boarders from their own records (CO-5114 to CO-5118, CO-1701, CO-1702, CO-3722, CO-4165, CO-4329, CO-4349), the
# work tests' pay as received (CO-5119); wages an employer diverts to a third party counted (4.405.H.4, OQ-1021);
# the quarter test shared (CO-5110, D-S4); reader defaults removed (decision 4); the prorated initial month capped for
# disqualified members (CO-6000 to CO-6002, D-S3); unpaid work hours verified (CO-6003, D-S6). Harness classes in
# scripts/records/allowed/e1-snap.yaml.
date: 2026-11-23
summary: "SNAP reads earned income from the earnings records; employer-diverted wages counted; the prorated initial month capped; unpaid work hours verified; unstated receipts in the quarter sums and the winnings flag are cannot determine."
impact:
  - {changed: CO-4930, fingerprint: fp1-8e182adfcd38fc71ebdd, flagged: CO-330, applies: "CO-330 (snap_person_earned_income) adds CO-4930, CO-1702 and CO-4165, each of which now reads the earnings records; it reads no earned fact of its own and needs no change. Its rule tests were restated in earnings records with hand values (CO-330-T2, T3, T7)."}
  - {changed: CO-2308, fingerprint: fp1-2b1c2273beae3be10cec, flagged: CO-385, applies: "CO-385 (snap_allotment) reads CO-2308 for the initial month and CO-2307 for every other; both now read the shared pieces (CO-6000 to CO-6002), so the initial month is capped as the full month is (7 CFR 273.11(c)(1)(ii); D-S3). CO-385 itself needs no change; CO-385-T1 states the members' earnings and receipts (decision 4)."}
  - {changed: CO-407, fingerprint: fp1-c0cb4062a3d4b49567b2, flagged: CO-409, not_applicable: "CO-409 (snap_is_single_parent_full_time_student_exemption) shares the excerpt S2507 with CO-407 but tests full-time enrollment and the age of the children in the household; it reads no earnings. CO-407 changed only where it reads the student's wages and business receipts (the earnings records in place of wages_gross and self_employment_gross_receipts)."}
  - {changed: CO-613, fingerprint: fp1-0d13a47952e30bab47e7, flagged: CO-617, not_applicable: "Re-keyed (E1 SNAP: SNAP items CO-613 reads through others now read the earnings records, so its fingerprint moved; no Medicaid derivation changed); the earlier reason stands: ma_msp_category only orders the QMB, SLMB, QI-1 and QDWI results; the resource change sits in CO-613 to CO-616, which it reads."}
  - {changed: CO-616, fingerprint: fp1-59d467ed2d55e4ba50ad, flagged: CO-617, not_applicable: "Re-keyed (E1 SNAP: SNAP items CO-616 reads through others now read the earnings records, so its fingerprint moved; no Medicaid derivation changed); the earlier reason stands: as for CO-613, CO-617 orders the tier results and reads CO-616, where the beneficiary-deed change sits."}
  - {changed: CO-654, fingerprint: fp1-687230368f3e8a4a184e, flagged: CO-652, not_applicable: "Re-keyed (E1 SNAP: SNAP items CO-654 reads through others now read the earnings records, so its fingerprint moved; no Medicaid derivation changed); the earlier reason stands: CO-652 (ma_ltc_eligibility_status) shares the excerpt S661 with PACE but tests no age; the change to CO-654 is only the day its 55 is measured on (T-1, OQ-950)."}
  - {changed: CO-654, fingerprint: fp1-687230368f3e8a4a184e, flagged: CO-653, not_applicable: "Re-keyed (E1 SNAP: SNAP items CO-654 reads through others now read the earnings records, so its fingerprint moved; no Medicaid derivation changed); the earlier reason stands: CO-653 (ma_hcbs_waiver_eligible) reads its ages through ma_hcbs_waiver_age_criteria_met (CO-1164), a per-person waiver placement made at the assessment and read on the determination date; it has no age test of its own to measure in a month."}
