  - {changed: CO-616, fingerprint: fp1-92038d319fca7d9163c9, flagged: CO-617, not_applicable: "Re-keyed (E1 SNAP: SNAP items CO-616 reads through others now read the earnings records, so its fingerprint moved; no Medicaid derivation changed); the earlier reason stands: as for CO-613, CO-617 orders the tier results and reads CO-616, where the beneficiary-deed change sits."}
  - {changed: CO-654, fingerprint: fp1-531edca22721dfbd31d6, flagged: CO-652, not_applicable: "Re-keyed (E1 SNAP: SNAP items CO-654 reads through others now read the earnings records, so its fingerprint moved; no Medicaid derivation changed); the earlier reason stands: CO-652 (ma_ltc_eligibility_status) shares the excerpt S661 with PACE but tests no age; the change to CO-654 is only the day its 55 is measured on (T-1, OQ-950)."}
