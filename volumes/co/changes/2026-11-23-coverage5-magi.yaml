# change-impact flag the round raises: three are the round's own MAGI and CHP+ changes (CO-565, CO-706, CO-707), each with its
# reason; the rest are flags an earlier record dispositioned, re-keyed because the receipts and earnings record schemas changed
# upstream (CO-5000 taxable_amount, CO-5100 seasonal_or_commission), with the earlier disposition carried.
date: 2026-11-23
