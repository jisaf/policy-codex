date: 2026-11-23
summary: >-
  Non-MAGI coverage pass 3 fix round (docs/reviews/coverage3-medicaid-nonmagi.md, "Disposition (fix round,
  2026-11-23)"): the SSI-method couple through the admission month and the institutionalized spouse (C3-1), the
  non-cooperation and onset gates on SSI-related eligibility and SISC B (C3-2), the 416.1112(c) exclusions in the DAC,
  Pickle and Working Adults income (C3-3, C3-6, C3-7), the adoption subsidy (C3-4), the beneficiary-deed home (C3-5,
  OQ-900), the Children's Buy-In infrequent and Census exclusions (C3-8), 1619(b) before the denial (C3-9), and loans
  and tax refunds in the 300% test (C3-10).
impact:
  - {changed: CO-608, fingerprint: fp1-3173fa21f18a9ae49f04, flagged: CO-647, not_applicable: "CO-647 is the 42 U.S.C. 1396r-5(c)(2) figure CO-608 now reads for an institutionalized spouse in the institution; its own derivation (both spouses' resources less the CSRA) is what the fix needs and does not change."}
  - {changed: CO-608, fingerprint: fp1-3173fa21f18a9ae49f04, flagged: CO-657, not_applicable: "The family allowance is a post-eligibility deduction (1396r-5(d)(1)(C)) from the institutionalized spouse's income; it reads no resources and is not affected by which resources an institutionalized spouse is tested on."}
  - {changed: CO-613, fingerprint: fp1-10f5da4df09491f3a91f, flagged: CO-617, not_applicable: "ma_msp_category only orders the QMB, SLMB, QI-1 and QDWI results; the resource change sits in CO-613 to CO-616, which it reads."}
  - {changed: CO-616, fingerprint: fp1-e25cfb77a1a65f9b15e9, flagged: CO-617, not_applicable: "As for CO-613: CO-617 orders the tier results and reads CO-616, where the beneficiary-deed change sits."}
  - {changed: CO-663, fingerprint: fp1-b287f170fb73dbff6805, flagged: CO-657, not_applicable: "CO-663's change is the SSI-method couple (C3-1). The family allowance sums each dependent family member's own gross income under 1396r-5(d)(1)(C); no couple grouping and no SSI exclusion applies to it."}
  - {changed: CO-1715, fingerprint: fp1-bc38a938ad76169b604c, flagged: CO-657, not_applicable: "CO-1715's change applies 416.1112(c) exclusions to a Buy-In applicant's earnings (C3-6, C3-7). The family allowance is post-eligibility and counts a family member's gross income, which 1396r-5(d)(1)(C) compares with the MMMNA without SSI exclusions."}
  - {changed: CO-2277, fingerprint: fp1-36e5f2d6d780aa968624, flagged: CO-657, not_applicable: "The SSI-method couple (C3-1) does not reach the post-eligibility family allowance, which reads each family member's own income."}
  - {changed: CO-2278, fingerprint: fp1-d7646b4d347cb2c45cb0, flagged: CO-657, not_applicable: "As for CO-2277: the SSI-method couple does not reach the family allowance."}
  - {changed: CO-4200, fingerprint: fp1-389ba896551358035332, flagged: CO-603, not_applicable: "CO-603 is the undated aged, blind or disabled test; CO-4200's change (C3-8) is which earned-income exclusions apply to which household member, not who is disabled."}
  - {changed: CO-4628, fingerprint: fp1-9015be8246be3be94e99, flagged: CO-603, not_applicable: "CO-4628's change is the group it sums over (C3-1); its own disability and age test for (c)(6) is unchanged, and CO-603's category test is a different question."}
  - {changed: CO-4628, fingerprint: fp1-9015be8246be3be94e99, flagged: CO-612, not_applicable: "CO-612 reads SSI-related eligibility (CO-611), where the C3-2 gates now sit, and its own disability and onset arm is unchanged; the IRWE couple change does not apply to it."}
  - {changed: CO-4629, fingerprint: fp1-9690c1a64050888005e9, flagged: CO-603, not_applicable: "As for CO-4628: the change is the couple group (C3-1), not the category test."}
  - {changed: CO-4634, fingerprint: fp1-c03313463a557c4ba2ee, flagged: CO-657, not_applicable: "F.6.t exempts the adopted child's subsidy in determining eligibility; the post-eligibility family allowance compares a family member's own gross income with the MMMNA under 1396r-5(d)(1)(C), which has no such exemption."}
