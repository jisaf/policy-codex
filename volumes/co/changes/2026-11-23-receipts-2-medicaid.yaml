# Receipt records, migration phase 2 (docs/reviews/receipts-migration-2-medicaid.md): Medicaid (MAGI and
# the SSI method, deeming, long-term care, the buy-ins, the Medicare Savings Programs) and CHP+ read the
# receipts (CO-5000) through two counting tables, MAGI (CO-5500) and the SSI method. One entry per
# change-impact flag the migration raises, appended as each area moves. An entry that re-keys an
# earlier disposition (the flagged item reads, through others, an item this migration changed, so the
# changed item's fingerprint moved) keeps the earlier reason.
date: 2026-11-23
summary: Medicaid and CHP+ read unearned income from receipt records through a MAGI and an SSI-method counting table.
impact:
  - {changed: CO-616, fingerprint: fp1-c9ae0e633cca7fbc04c5, flagged: CO-617, not_applicable: "Re-keyed: the changed item's fingerprint moved because it reads, through others, an item this migration rewrote; the earlier reason stands: as for CO-613, CO-617 orders the tier results and reads CO-616, where the beneficiary-deed change sits."}
  - {changed: CO-2419, fingerprint: fp1-38e75ef4b80e7f7b8bc8, flagged: CO-509, not_applicable: "Re-keyed (CO-2419 reads, through others, the MAGI income the migration rewrote): CO-509 (ma_meets_citizenship_requirement) is per person, a finding at the determination: it reads age on the determination date and the 19th-birthday test through CO-1173 at the determination month. CO-2419 is per month, so its ages are now taken in the month (T-1)."}
  - {changed: CO-613, fingerprint: fp1-f073e086e4ebe69535dc, flagged: CO-617, not_applicable: "Re-keyed: the changed item's fingerprint moved because it reads, through others, an item this migration rewrote; the earlier reason stands: ma_msp_category only orders the QMB, SLMB, QI-1 and QDWI results; the resource change sits in CO-613 to CO-616, which it reads."}
  - {changed: CO-654, fingerprint: fp1-802b0b44db2b701f64ad, flagged: CO-652, not_applicable: "Re-keyed: the changed item's fingerprint moved because it reads, through others, an item this migration rewrote; the earlier reason stands: CO-652 (ma_ltc_eligibility_status) shares the excerpt S661 with PACE but tests no age; the change to CO-654 is only the day its 55 is measured on (T-1, OQ-950)."}
  - {changed: CO-2467, fingerprint: fp1-239a4f6c936b5b64df9a, flagged: CO-644, not_applicable: "CO-644 (ma_is_institutionalized_spouse) shares the excerpt S1754 with CO-2467 but decides who the institutionalized spouse is and reads no income; the change to CO-2467 is where the community spouse's unearned income is read from (the receipts, through the SSI method's table)."}
