# Receipt records, migration phase 2 (docs/reviews/receipts-migration-2-medicaid.md): Medicaid (MAGI and
# the SSI method, deeming, long-term care, the buy-ins, the Medicare Savings Programs) and CHP+ read the
# receipts (CO-5000) through two counting tables, MAGI (CO-5500) and the SSI method. One entry per
# change-impact flag the migration raises, appended as each area moves. An entry that re-keys an
# earlier disposition (the flagged item reads, through others, an item this migration changed, so the
# changed item's fingerprint moved) keeps the earlier reason.
date: 2026-11-23
summary: Medicaid and CHP+ read unearned income from receipt records through a MAGI and an SSI-method counting table.
impact:
  - {changed: CO-616, fingerprint: fp1-2e35337e011be5a1b601, flagged: CO-617, not_applicable: "Re-keyed: the changed item's fingerprint moved because it reads, through others, an item this migration rewrote; the earlier reason stands: as for CO-613, CO-617 orders the tier results and reads CO-616, where the beneficiary-deed change sits."}
  - {changed: CO-2419, fingerprint: fp1-24d352573a0f3e5ebf77, flagged: CO-509, not_applicable: "Re-keyed (CO-2419 reads, through others, the MAGI income the migration rewrote): CO-509 (ma_meets_citizenship_requirement) is per person, a finding at the determination: it reads age on the determination date and the 19th-birthday test through CO-1173 at the determination month. CO-2419 is per month, so its ages are now taken in the month (T-1)."}
  - {changed: CO-613, fingerprint: fp1-43575ca35bf68108fa70, flagged: CO-617, not_applicable: "Re-keyed: the changed item's fingerprint moved because it reads, through others, an item this migration rewrote; the earlier reason stands: ma_msp_category only orders the QMB, SLMB, QI-1 and QDWI results; the resource change sits in CO-613 to CO-616, which it reads."}
  - {changed: CO-654, fingerprint: fp1-0157ec97de12e646fc7b, flagged: CO-652, not_applicable: "Re-keyed: the changed item's fingerprint moved because it reads, through others, an item this migration rewrote; the earlier reason stands: CO-652 (ma_ltc_eligibility_status) shares the excerpt S661 with PACE but tests no age; the change to CO-654 is only the day its 55 is measured on (T-1, OQ-950)."}
  - {changed: CO-654, fingerprint: fp1-0157ec97de12e646fc7b, flagged: CO-653, not_applicable: "Re-keyed: the changed item's fingerprint moved because it reads, through others, an item this migration rewrote; the earlier reason stands: CO-653 (ma_hcbs_waiver_eligible) reads its ages through ma_hcbs_waiver_age_criteria_met (CO-1164), a per-person waiver placement made at the assessment and read on the determination date; it has no age test of its own to measure in a month. No stored household crosses a waiver age band."}
  - {changed: CO-608, fingerprint: fp1-c23c3b8cfd4bbd622222, flagged: CO-647, not_applicable: "Re-keyed: the changed item's fingerprint moved because it reads, through others, an item this migration rewrote; the earlier reason stands: CO-647 is the 42 U.S.C. 1396r-5(c)(2) figure CO-608 reads for an institutionalized spouse in the institution; its own derivation (both spouses' resources less the CSRA) does not change."}
  - {changed: CO-2467, fingerprint: fp1-f80fbd2a9b89be823e6b, flagged: CO-644, not_applicable: "CO-644 (ma_is_institutionalized_spouse) shares the excerpt S1754 with CO-2467 but decides who the institutionalized spouse is and reads no income; the change to CO-2467 is where the community spouse's unearned income is read from (the receipts, through the SSI method's table)."}
