date: 2026-11-23
summary: "Time audit fix round (docs/reviews/time-audit.md, step 7): parameters and ages read in the month evaluated (T-3, T-1), the Adult Financial maximum ISM by its formula (T-2), the lottery bands to the cent (T-4), and the P2 findings T-5 to T-9."
impact:
  - {changed: CO-1513, fingerprint: fp1-a32765b1c28c1b0c7e3b, flagged: CO-952, not_applicable: "CO-952 (af_and_grant) cites S707 for 3.546.E's AND-CS payment floor ($13), not for the ISM maximum; it reaches the ISM only through af_countable_income, which reads af_ism_maximum by identifier and so takes the formula's figure with no change."}
  - {changed: CO-603, fingerprint: fp1-88ea20a3c1e1d1184548, flagged: CO-612, not_applicable: "CO-612 (ma_ssi_related_category) is per month and reads ma_is_aged (CO-600) directly, which is now measured in the month it evaluates (T-1); only CO-603's per-person readers keep the determination month, stated with [at]."}
  - {changed: CO-654, fingerprint: fp1-e41a1c8078709a74cd75, flagged: CO-652, not_applicable: "CO-652 (ma_ltc_eligibility_status) shares the excerpt S661 with PACE but tests no age; the change to CO-654 is only the day its 55 is measured on (T-1, OQ-950)."}
  - {changed: CO-654, fingerprint: fp1-e41a1c8078709a74cd75, flagged: CO-653, not_applicable: "CO-653 (ma_hcbs_waiver_eligible) reads its ages through ma_hcbs_waiver_age_criteria_met (CO-1164), a per-person waiver placement made at the assessment and read on the determination date; it has no age test of its own to measure in a month. No stored household crosses a waiver age band."}
  - {changed: CO-2419, fingerprint: fp1-c758e11764d0d6abcd99, flagged: CO-509, not_applicable: "CO-509 (ma_meets_citizenship_requirement) is per person, a finding at the determination: it reads age on the determination date and the 19th-birthday test through CO-1173 at the determination month. CO-2419 is per month, so its ages are now taken in the month (T-1)."}
  - {changed: CO-2439, fingerprint: fp1-c2db280d2349ce29be7c, flagged: CO-559, applies: "CO-559 (ma_is_presumptively_eligible_child) is per month and reads ma_is_under_child_age_or_turns_nineteen_this_month (CO-564), which this pull request makes per month (T-1), so it measures the age in the month it evaluates with no change to its own rule; CO-2439 is per person and reads CO-564 [at] the determination month."}
  - {changed: CO-3155, fingerprint: fp1-f734ea12baf706786442, flagged: CO-558, not_applicable: "CO-558 (ma_is_presumptively_eligible_pregnant) tests no age; CO-3155 changed only in reading its per-month age tests [at] the determination month (T-1)."}
  - {changed: CO-3155, fingerprint: fp1-f734ea12baf706786442, flagged: CO-559, applies: "As for CO-2439: CO-559 is per month and reads CO-564, made per month in this pull request (T-1)."}
  - {changed: CO-133, fingerprint: fp1-264b9ebc8aca454ddd79, flagged: CO-138, not_applicable: "CO-138 (snap_shelter_share_rate) is the statutory 50% of income above which shelter costs are deducted, not a figure re-published each fiscal year, so it keeps an open version with no review_by (time audit T-5's rule for a fixed figure); CO-133's change only closes the FY2027 cap at September 30, 2027."}
  - {changed: CO-1985, fingerprint: fp1-7ae38b3b931fd0828fc7, flagged: CO-642, applies: "CO-642 (ma_meets_special_income_group) is per month and reads ma_income_trust_gross_income_limit (CO-1985), made per month in this pull request (T-3, part 2), so it compares each month's income with that month's income trust limit with no change to its own rule."}
  - {changed: CO-4791, fingerprint: fp1-24384fbcd812a14c9d5b, flagged: CO-544, not_applicable: "CO-544 (ma_is_dependent_child) is the per-person test that the non-MAGI items CO-1986 and CO-4103 read on the determination date, as its precision states; 8.100.4.G.1's whole month, which CO-4791 now reads in each month (T-1), is a MAGI rule."}
