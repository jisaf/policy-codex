# Coverage pass 6 fix round for MAGI Medicaid and CHP+ (docs/reviews/coverage6-medicaid-magi-chp.md, section 7). One entry per
# change-impact flag the round raises. Two are the round's own edits (CO-2419, C6-05(b); CO-2606, C6-10); the others are items the
# round did not edit whose fingerprints moved because they read an item it changed (ma_meets_residency CO-2250, C6-05(a); the
# pregnancy end CO-7400 through CO-560 and CO-1173, C6-03; the MAGI household CO-500, C6-04 and C6-10; the poverty guideline
# table CO-181 and CO-182, given a 2024 version for C6-09), each with the reason nothing carries over to the flagged item.
date: 2026-11-24
summary: "Coverage pass 6 (MAGI Medicaid, CHP+): C6-01 to C6-11 fixed (the pregnancy coverage period in any month of the application she received Medical Assistance while pregnant, 42 U.S.C. 1396a(e)(5); the later month she becomes eligible, Medicaid and CHP+; a birth ends the pregnancy; decision 4 on the outside claim, residence, the needy-person basis, the application date, an indigent sponsor's support and living together; a stated pregnancy start; C.4.a annualizes only its named income; a child's continuous eligibility from the first qualifying month; C.5 for a previous-year month; OQ-592 restated), with rule tests by hand and the review's probes CO-920 to CO-933."
impact:
