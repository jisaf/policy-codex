  - {"changed": "CO-621", "fingerprint": "fp1-979e30d9dceecb06e36f", "flagged": "CO-619", "not_applicable": "Coverage verification 7, V7-4: CO-621 (ma_cbwd_premium) counts, in its older-child arm and its same-day divisor, only the children whose own premium is due in the month (ma_cbwd_premium_is_due_in_month, CO-7861), since 10 CCR 2505-10 8.100.6.Q.1.g.ii (S1728) waives a child's premium through its determination month and iii fixes one premium for the household ('the total premium shall be the amount due for one eligible child'). ma_wawd_premium (CO-619), which shares the facts ma_buy_in_determination_month and pregnancy_end_date, is the Working Adults Buy-In premium, which 8.100.6.P.1.f (S1727) charges each individual on the individual's own income, with no household rule like Q.1.g.iii; its own determination-month and postpartum waivers already apply to its own premium. Nothing carries over."}
