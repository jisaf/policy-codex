# Records E2/H2 leftovers (docs/reviews/records-e2-h2.md, section 5), the two leftovers the product owner asked to fix.
# 1. Medicaid's verifications of sale efforts (CO-2246) and joint ownership (CO-2248) read the real property holdings
#    records; the person facts CO-2242 and CO-2244 are retired. The holdings fields declare when_absent; CO-4620 and
#    CO-5323 read them with otherwise false (no answer there moves).
# 2. Adult Financial's test of countable unearned income (CO-2872) leaves out the receipt kinds that are earnings; the
#    receipt copies of CO-206, CO-362 and CO-5110-T4 are removed; then the three receipt kinds that are earnings leave
#    receipts (CO-5000) with their rows in the eight receipt tables.
# Moved answers (all intermediate; no household expectation and no rule-test value moved except as listed):
# - CO-2246 ma_requires_verification_of_sale_efforts: CO-532, CO-533, CO-910 p1, true -> false (13 person-months): the
#   person fact stated the finding beside holdings with no real property; M.2.b.v verifies the efforts to sell
#   excess property, and there is none.
# - CO-2246, CO-2248 and their pending items (CO-2247, CO-2249): 221 persons of 159 households, unknown -> false
#   (1,103 person-months each): aged, blind or disabled persons whose holdings state no real property, who stated no
#   person fact; no excess property (M.2.b) and no allegation about real property (M.3.h).
# - CO-2872 af_has_countable_unearned_income: CO-206, CO-362 p1, true -> false (July to November 2026); and
#   CO-3883 af_unearned_income_is_unverified unknown -> false: the room-only payment is earned income (9 CCR 2503-5
#   3.520.783.C.2.c) and her only receipt.
# Rule tests: CO-2246-T1 and CO-2248-T1 restated (a real property record states the finding; before, a person fact
# beside a bank account), new CO-2246-T4 to T9, CO-2248-T4 to T6, CO-2872-T4; CO-4361-T11 removed (it pinned that the
# receipt copies were not read; such a receipt can no longer be stated); CO-4369-T7, T8, CO-5651-T9, CO-5110-T4
# restated without the receipts, same values.
# The entries below are re-keys: the fingerprints of nine earlier dispositions moved through CO-5000 and the receipt
# tables, with no decision changed.
date: 2026-11-24
summary: "Records E2/H2 leftovers: Medicaid's verifications of sale efforts and joint ownership read the real property holdings (an unstated finding on a record is cannot determine; no real property is false), and ma_excess_real_property_is_for_sale (CO-2242) and ma_claims_co_owner_hardship_for_real_property (CO-2244) are retired; Adult Financial's test of countable unearned income (CO-2872) no longer reads the receipt copies of earnings, the copies are removed (CO-206, CO-362, CO-5110-T4), and the three receipt kinds that are earnings leave receipts with their table rows. Moved: the sale-efforts verification of CO-532, CO-533 and CO-910 p1 true to false, the two verifications of 221 persons in 159 households unknown to false, and CO-2872 on CO-206 and CO-362 true to false (af_unearned_income_is_unverified unknown to false); no expectation moved."
