# KL-CE-1 and KL-CASH-1 (docs/reviews/known-limits.md, both closed): one rental property stated once for CCCAP and LEAP; the
# in-kind support and maintenance fair share divided by the number of people living in the home.
# One entry per change-impact flag the change leaves open: the new CCCAP item's neighbours, and re-keys of earlier dispositions
# whose changed item moved only through the earnings record's schema (CO-5100).
date: 2026-11-24
summary: "KL-CE-1: a business's receipts record and its cost records name the business (job, CO-5100) and a cost of rental property says whether it is the property's maintenance (property_maintenance, new); CCCAP takes a rental managed under twenty hours a week net of its own cost records (cccap_rental_property_costs CO-7910, through cccap_excluded_unearned_receipts CO-4463) and leaves them out of the self-employment costs (CO-1709); rental_property_expenses_paid (CO-4458) is taken against rent receipts only; LEAP reads rental_property and deducts only the maintenance of rental property (leap_self_employment_allowable_costs CO-1711; 9 CCR 2503-7 3.755.21.I.2.D); both programs' statement rules withdrawn; the earnings translator keeps job and property_maintenance. Stored households CO-1082, CO-1083 restated for both programs; CO-870, CO-1080, CO-1081 restated (answers unchanged); CO-1190 (CR2), CO-1191 (LRB1), CO-1192 (LRB3). KL-CASH-1: the ISM fair share divides by persons_living_in_home_count (CO-7911, new case fact, required where read) in af_in_kind_support_and_maintenance (CO-1512); stored household CO-1193. OQ-1515, OQ-1516; sources S5350, S5351."
