# KL-SNAP-3, KL-SNAP-4 and KL-SNAP-5 (docs/reviews/known-limits.md, closed): the start of the five-year waiting period for a qualified
# non-citizen whose status held now is the first (CO-7890, CO-7820, CO-7550, CO-3713); the VA dependent's part for a dependent in the home
# who is not a SNAP household member (CO-7892, CO-5011; OQ-1510); a pair who never lived together (CO-7891, CO-7672, CO-7505).
# One entry per change-impact flag the round leaves open; each is a re-key of an earlier disposition whose changed item moved only through
# the items above.
date: 2026-11-24
summary: "KL-SNAP-3: has_held_earlier_qualified_status (CO-7890) false gives qualified_status_date as the start of the five years (CO-7820), a stated first_qualified_status_date is read before the permanent-resident shortcut, Medicaid's CO-7550 reads CO-7820, and CO-3713 reads status_before_lpr_adjustment for a permanent resident only; stored households CO-1180 (SNAP) and CO-1181 (Colorado Works). KL-SNAP-4: snap_household_members_before_elderly_disabled_separation (CO-7892, CO-305 without the 165 percent test) is read by CO-5011's 4.405.B exclusion, so the part for a dependent in the home who buys and prepares apart is taken off ($320, stored household CO-1183); OQ-1510. KL-SNAP-5: persons_lived_apart_from_throughout_months_evaluated (CO-7891), read by CO-7672 and CO-7505 as either of the two naming the other (October $217, stored household CO-1182)."
