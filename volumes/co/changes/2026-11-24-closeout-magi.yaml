# MAGI close-out of 2026-11-24 (docs/reviews/known-limits.md, "MAGI Medicaid and CHP+"): KL-MAGI-3, KL-MAGI-2 and MAGI-SW-1 closed
# with the fix patterns earlier rounds established (C7-01's before-coverage reading, C7-02's per-pregnancy reading of the recorded
# pregnancy ends, non-MAGI F7-2's per-month figures). One entry per change-impact flag the round leaves open.
date: 2026-11-24
summary: "MAGI close-out: family planning answers ineligible_before_coverage_period for a month the application cannot cover (CO-1154, KL-MAGI-3); a month on or before a recorded pregnancy end is read from the ended pregnancy, not from the stated start of the current one (CO-3601, CO-7051; new CO-7840 previous_pregnancy_start_date and CO-7841 pregnancy_ended_in_month, KL-MAGI-2); the MAGI Children and Pregnant Women standards and the declared household income percentage are per month (CO-540, CO-543, CO-3151; their determination-day readers CO-2439, CO-3155, CO-708 read them in the determination month, MAGI-SW-1)."
impact:
  - {changed: CO-621, fingerprint: fp1-f11ebc51bb18f34c8f01, flagged: CO-619, not_applicable: "CO-621 (the Children's Buy-In premium) is not edited: its fingerprint moved through items upstream of it that this round changed (ma_magi_household_size CO-501 reads ma_is_pregnant_in_month CO-3601, KL-MAGI-2; ma_is_child_category CO-545 reads the per-month standards CO-540 and CO-543, MAGI-SW-1), not its own decision. CO-619 (the Working Adults Buy-In premium) shares only ma_buy_in_determination_month and pregnancy_end_date with it; it reads neither the MAGI pregnancy months nor a MAGI standard, so neither fix carries over to it."}
  - {changed: CO-659, fingerprint: fp1-0ecde70f76de683dcf4c, flagged: CO-660, not_applicable: "CO-659 (transfer penalty days) is not edited: its fingerprint moved because it reads, through the spouse test (CO-2235, CO-2232, CO-3310) and ma_meets_citizenship_requirement_in_month (CO-7551), ma_is_pregnant_in_month (CO-3601), which KL-MAGI-2 changed for months on or before a recorded pregnancy end. ma_transfer_penalty_applies (CO-660) reads ma_transfer_penalty_months (CO-649), the period start and the shared excerpt S1758, which the round did not change."}
  - {changed: CO-2439, fingerprint: fp1-3f6da449834491e4852e, flagged: CO-559, applies: "MAGI-SW-1 reaches CO-559 in this pull request through what it reads: ma_is_presumptively_eligible_child (CO-559) is month-scoped and reads declared_household_income_pct_fpl (CO-3151) and ma_magi_income_standard_child (CO-540), both now per month, so it reads them in its own month with no edit; CO-2439, a person-scope determination of a day, was the one that needed `at` the determination month to keep reading the determination date's figures."}
  - {changed: CO-3155, fingerprint: fp1-c05c779a0afc86b12fd6, flagged: CO-558, applies: "MAGI-SW-1 reaches CO-558 in this pull request through what it reads: ma_is_presumptively_eligible_pregnant (CO-558) is month-scoped and reads declared_household_income_pct_fpl (CO-3151) and ma_magi_income_standard_pregnant (CO-543), both now per month, so it reads them in its own month with no edit; CO-3155, a person-scope determination of a day, was the one that needed `at` the determination month."}
  - {changed: CO-3155, fingerprint: fp1-c05c779a0afc86b12fd6, flagged: CO-559, applies: "MAGI-SW-1 reaches CO-559 in this pull request through what it reads: ma_is_presumptively_eligible_child (CO-559) is month-scoped and reads declared_household_income_pct_fpl (CO-3151) and ma_magi_income_standard_child (CO-540), both now per month, so it reads them in its own month with no edit; CO-3155, a person-scope determination of a day, was the one that needed `at` the determination month."}
