date: 2026-11-23
summary: "Medicaid applies 20 CFR 416.1165(e)(3) to parental deeming: no eligible child is deemed more parental income than reduces its SSI benefit to zero, and the rest goes to the other eligible children (CO-4626 through CO-5900 to CO-5904; CO-2281 split; CO-5516 reads the (e)(3) test first). The registered siblings were reviewed in this pull request: CO-605 (its copy CO-5901 is new) and CO-5222, the Pickle copy of CO-4626, which keeps the equal division (its precision records why, and the review and handoff list it as a known limit)."
impact:
