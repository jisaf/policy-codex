# NM-KL-1 to NM-KL-3 (docs/reviews/known-limits.md, closed): the non-MAGI Medicaid known limits of coverage pass 7 (F7-9, F7-10) and the
# one found while fixing F7-6. One entry per change-impact flag the round leaves open.
date: 2026-11-24
summary: "NM-KL-3: Title IV and Bureau of Indian Education student aid and the payments of the 29 U.S.C. 3174 programs are their own receipt kinds (title_iv_or_bie_student_aid, wioa_adult_or_dislocated_worker_payment), excluded from the long-term care gross income by 20 U.S.C. 1087uu (CO-7720, CO-641; S5243, S5363, S5364), each with a row in every counting table (OQ-1520 for Adult Financial). NM-KL-2: Social Security receipts state their benefit type where read (title_ii_benefit_type), and the disabled widow(er) group disregards only the benefits under 42 U.S.C. 402 (1383c(d), S3416, S5361, S5362; CO-7940 to CO-7943; CO-1162, CO-5516). NM-KL-1: the community spouse's monthly income allowance is its own receipt kind (allowance_from_institutionalized_spouse), income to her for the SSI method (8.100.5.I.4, S5360) and left out of the income it is figured from (R.2, CO-5531), with a row in every counting table (OQ-1521). Stored households CO-1200 to CO-1204."
