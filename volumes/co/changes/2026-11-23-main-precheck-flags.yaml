date: 2026-11-23
summary: >-
  Written dispositions for the 8 change-impact flags the branch raises against origin/main, measured when the check was
  introduced (docs/governance.md, "Change impact", "Starting point"; docs/plan-colorado.md, step 4). They are hidden by
  impact-baseline.yaml while main predates it, so they are keyed here to the fingerprints measured against main without
  the baseline. Two were fixed in this round by changing the flagged item (CO-118, CO-303), so those entries no longer
  settle a live flag and the check reports them as stale; they are kept as the written record.
impact:
  - {changed: CO-119, fingerprint: fp1-bebc00dca3546bff75b7, flagged: CO-118, applies: "Fixed in this round: CO-118 gets a version from 2026-10-01 citing the FY2027 FNS asset-limit table (S732, D-83), which keeps the limit for households without an elderly or disabled member at $3,000; CO-119 had moved to $4,750 on the same table. No answer changes."}
  - {changed: CO-133, fingerprint: fp1-585b0608f6f641b06c4e, flagged: CO-138, not_applicable: "CO-133 is the indexed excess shelter cap, which FNS sets each fiscal year ($769 for FY2027, S732). CO-138 is the 50 percent share of income the shelter costs must exceed, fixed by statute and rule (7 U.S.C. 2014(e)(6)(A), S88; 7 CFR 273.9(d)(6)(ii), S93; 10 CCR 2506-1 4.407.3.A-B, S96), with no yearly figure."}
  - {changed: CO-301, fingerprint: fp1-b9e7afb48c2d2edccac0, flagged: CO-303, applies: "Fixed in this round: CO-301's meaning now names the parameter snap_elderly_age instead of the figure 60; CO-303's meaning repeated the figure and now names snap_is_elderly (CO-301). The derivations were already the same reading and are unchanged."}
  - {changed: CO-301, fingerprint: fp1-b9e7afb48c2d2edccac0, flagged: CO-314, not_applicable: "CO-301's change is a meaning edit naming snap_elderly_age; its derivation (age at least snap_elderly_age) did not change. CO-314's meaning names no age figure and reads CO-303."}
  - {changed: CO-334, fingerprint: fp1-cb9199e19d44b33f38fa, flagged: CO-335, not_applicable: "CO-334 (household gross income) added the farm-loss offset against other self-employment income (7 CFR 273.11(a)(2)(ii)(A), S2511) and the child support exclusion from total countable gross income (10 CCR 2506-1 4.407.5.A, S99). CO-335 is the eligible members' earned income: the earned income deduction's base, CO-372, already subtracts the same farm-loss offset (F-8), and 4.407.5.A takes the child support exclusion from total gross income, not from earned income."}
  - {changed: CO-334, fingerprint: fp1-cb9199e19d44b33f38fa, flagged: CO-381, not_applicable: "CO-381 (net income) reads CO-334's total through snap_adjusted_income_before_shelter (CO-378), so the offset and the exclusion reach it without a change; its own rounding of each income calculation (7 CFR 273.10(e)(1)(ii)(A), S102) is not what CO-334 changed."}
  - {changed: CO-378, fingerprint: fp1-ae0d3349036a8632b1c7, flagged: CO-381, not_applicable: "CO-378 now subtracts the farm loss left after the self-employment offset, after the earned income deduction (7 CFR 273.11(a)(2)(ii)(B), S2511); CO-381 subtracts the shelter deduction from CO-378's figure, as 7 CFR 273.10(e)(1)(i)(H)-(I) (S101) orders, so it carries the change as it reads it."}
  - {changed: CO-384, fingerprint: fp1-cae02e6a7fb45cea4cda, flagged: CO-381, not_applicable: "CO-384 follows Colorado's allotment formula (10 CCR 2506-1 4.207.3.A, S737): 30% of net income unrounded, the allotment rounded down after the subtraction, which is 7 CFR 273.10(e)(2)(ii)(A)'s option (2) for the allotment step. 4.207.3.A says nothing of rounding net income, so CO-381 keeps 273.10(e)(1)(ii)(A)'s rounding of each income calculation (S102)."}
