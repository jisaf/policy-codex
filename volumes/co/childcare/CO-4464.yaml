implemented: engine
tags: [income]
open: [OQ-680, OQ-713]
rationale: "Coverage round (docs/reviews/coverage-cccap.md, F-08, F-09): boarder receipts (room_and_board_payments_received, read only by SNAP) were dropped, in-kind compensation and employer vendor payments had no fact, and a GI Bill housing allowance stated in educational_assistance_received was excluded as educational aid (probes RV-F and RV-G: $2,000 of wages and $1,500 of board, or of GI Bill housing allowance, counted as $2,000, eligible, where 3.111.I counts $3,500). Earned-income records, E1 (CCCAP): the three are earnings records, read through CCCAP's earnings table; a boarder's payment is one kind whatever it pays for, so it is read once (E0-F1)."
nearest: [CO-4463]
tests:
  - {id: CO-4464-T1, month: "2026-11", as_of: "2026-11-01", given: {cccap_is_household_child: false, earnings: [{kind: boarder_payments, amount: 1500, provides: room_and_board}]}, title: "F-08: $1,500 a month from a boarder (I.18)", expect: 1500}
  - {id: CO-4464-T2, month: "2026-11", as_of: "2026-11-01", given: {cccap_is_household_child: false, earnings: [], receipts: [{kind: gi_bill_housing_food_allowance, amount: 1500}]}, title: "C3-5: a $1,500 GI Bill housing allowance (I.7.c) is in the unearned income CCCAP reads, so nothing is added here", expect: 0}
  # I.4, I.5: $400 of employer housing and a $250 car payment the employer makes: $400 + $250 = $650.
  - {id: CO-4464-T3, month: "2026-11", as_of: "2026-11-01", given: {cccap_is_household_child: false, earnings: [{kind: wages, amount: 2000}, {kind: in_kind_pay, amount: 400}, {kind: employer_vendor_payment, amount: 250}]}, title: "I.4, I.5: $400 of employer housing and a $250 car payment the employer makes", expect: 650}
  - {id: CO-4464-T4, month: "2026-11", as_of: "2026-11-01", given: {cccap_is_household_child: false, earnings: []}, title: "Nothing stated in a stated list: none", expect: 0}
  - {id: CO-4464-T5, month: "2026-11", as_of: "2026-11-01", given: {cccap_is_household_child: false, }, title: "Decision 4: earnings not stated: cannot determine", expect: unknown}
  # A lodger's $300 for meals only and $200 for a room only (I.18): $300 + $200 = $500, each once.
  - {id: CO-4464-T6, month: "2026-11", as_of: "2026-11-01", given: {cccap_is_household_child: false, earnings: [{kind: boarder_payments, amount: 300, provides: board_only}, {kind: boarder_payments, amount: 200, provides: room_only}]}, title: "Board only and room only (I.18)", expect: 500}
  # Coverage pass 4 C4-1: application October 15 (thirty days September 15 to October 14). In-kind pay of $80 for a one-off job, marked irregular,
  # dated September 20, with an odd-job pay of $50 on August 10: July-September holds $80 + $50 = $130 of irregular income, not less than $90, so the
  # $80 counts (I.4, J.28): $80.
  - {id: CO-4464-T7, title: "Irregular in-kind pay tested against the quarter of its date", month: "2026-10", as_of: "2026-10-15", given: {cccap_is_household_child: false, cccap_application_or_redetermination_date: "2026-10-15", receipts: [], earnings: [{kind: in_kind_pay, amount: 80, frequency: once, date: "2026-09-20", irregular: true}, {kind: wages, amount: 50, frequency: once, date: "2026-08-10", irregular: true}]}, expect: 80}
  # Coverage pass 5 (docs/reviews/coverage5-care-energy.md), C5-1: application 2026-11-15, so the thirty days run 2026-10-16 to 2026-11-14 (H.4-5, OQ-680).
  - {"id": "CO-4464-T8", "title": "C5-1: $300 of in-kind pay a month from a job that ended 2026-09-30, as a stream: 0", "month": "2026-11", "as_of": "2026-11-15", "given": {"cccap_application_or_redetermination_date": "2026-11-15", "cccap_is_household_child": false, "earnings": [{"kind": "in_kind_pay", "amount": 300, "job_end_date": "2026-09-30"}]}, "expect": 0}
  - {"id": "CO-4464-T9", "title": "C5-3: $300 of in-kind pay of a household child who is not a teen parent: excluded (J.1), 0", "month": "2026-11", "as_of": "2026-11-15", "given": {"cccap_is_household_child": true, "cccap_is_teen_parent": false, "earnings": [{"kind": "in_kind_pay", "amount": 300}]}, "expect": 0}
  - {"id": "CO-4464-T10", "title": "C5-3: the same pay of a teen parent: counted, 300", "month": "2026-11", "as_of": "2026-11-15", "given": {"cccap_is_household_child": true, "cccap_is_teen_parent": true, "earnings": [{"kind": "in_kind_pay", "amount": 300}]}, "expect": 300}
  - {"id": "CO-4464-T11", "title": "C5-3: a child with no such records: 0, the child's status not needed", "month": "2026-11", "as_of": "2026-11-15", "given": {"earnings": [{"kind": "wages", "amount": 300}]}, "expect": 0}
