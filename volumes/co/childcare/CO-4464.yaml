id: CO-4464
name: "CCCAP: other countable receipts"
identifier: cccap_other_countable_receipts
kind: derived
type: money
scope: person-month
program: CCCAP
meaning: "Receipts 8 CCR 1403-1 3.111.I counts that are not in the wages, self-employment or recurring unearned income CCCAP otherwise reads: in-kind compensation for employment at its cost or fair market value (I.4, \"counted as other income\"); vendor payments that are part of the compensation for employment (I.5); and receipts from boarders or lodgers (I.18): the earnings records (earnings, CO-5100) of those kinds (cccap_earnings_treatment_table, CO-5105: counted_at_value, counted_other_income) received in the prior thirty days, without the irregular ones J.28 excludes when the quarter's irregular income is under ninety dollars. GI Bill subsistence allowances (I.7.c) are already in the unearned income CCCAP reads and are not added here."
precision: "Earned-income records, step E1 (CCCAP): read from the earnings records, replacing in_kind_compensation_value (CO-4506), employer_vendor_payments_received (CO-4455) and room_and_board_payments_received (CO-4161), each read as 0 when not stated: an unstated earnings list is cannot determine and a stated empty list is none (decision 4 of 2026-11-23). Boarders' payments for a room only or meals only, which the receipts held (board_only_payment, room_only_payment; cccap_receipt_treatment_table, CO-5720, counted them under I.18), are boarder_payments records here, and their receipt rows read counted_in_earnings, so a payment the transition states in both lists is counted once. The places and the thirty days are those of cccap_person_earned_income (CO-3915): a record with a date in the cccap_prior_income_period_days (CO-5151) days before cccap_application_or_redetermination_date (CO-5150), else the record's month (OQ-680); J.28 as there (finding E1-C3). I.4 says an in-kind benefit is \"counted as other income\", so these are not earned income for the Colorado Works Child Care fee (3.116.C, CO-2578) or the minimum-wage test. cccap_person_unearned_income (CO-3916) adds this item. The gross receipts from boarders are counted: I.18 names \"Receipts from boarders or lodgers\" and no paragraph deducts the cost of the room or meals (business_cost_boarder_provision is not deducted, a row for the owner's signature). Coverage pass 3 C3-4 and C3-5: in-kind pay is one statement (CO-4506 retired CO-4454 into it), and the GI Bill living allowance is a receipt of kind gi_bill_housing_food_allowance, counted under I.7.c by cccap_receipt_treatment_table, so this item does not add it. Coverage pass 4 C4-1: an irregular record is tested under J.28 against the calendar quarter of its own date, or of the month determined when it states none, as cccap_person_earned_income (CO-3915) tests irregular pay (CO-6401 to CO-6403; OQ-713). Coverage pass 5, C5-1 (docs/reviews/coverage5-care-energy.md): a record stated with neither a month nor a date (a stream) is the pay or payment of the days its source ran (docs/conventions.md, \"A record's time\"; job_start_date and job_end_date for pay, start_date and end_date for a receipt). It stands for the thirty days only when its source ran through all of them (none of its dates after their first day or before their last); it is not read when its source ended before their first day or began on or after cccap_application_or_redetermination_date; and a source that began or ended inside the thirty days is placed by its dated records, so a stream without them cannot determine and the record's date is named as missing (8 CCR 1403-1 3.111.H.4, H.5.a.1, H.5.b, S2704, S891: the income \"received during the prior thirty (30) day period\"; OQ-680 (2)). A record stated with its month or its date is placed as before. Coverage pass 5, C5-3 (docs/reviews/coverage5-care-energy.md): a household child who is not a teen parent has none: J.1 (S486) excludes \"Earnings of a child in the household when not a teen parent\", and these records are earnings (in-kind pay and an employer's vendor payment are compensation for employment, I.4-5, which name the adult caretaker or teen parent; a boarder's payments are self-employment income in the records, earnings, CO-5100), read as cccap_person_earned_income (CO-3915) reads the child's pay."
