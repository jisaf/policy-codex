id: CO-4464
name: "CCCAP: other countable receipts"
identifier: cccap_other_countable_receipts
kind: derived
type: money
scope: person-month
program: CCCAP
meaning: "Receipts 8 CCR 1403-1 3.111.I counts that are not in the wages, self-employment or recurring unearned income CCCAP otherwise reads: in-kind compensation for employment at its cost or fair market value (I.4); vendor payments that are part of the compensation for employment (I.5); and receipts from boarders or lodgers (I.18). GI Bill subsistence allowances (I.7.c) are already in the unearned income CCCAP reads and are not added here."
precision: "Each part is a neutral fact read as 0 when not stated: in_kind_compensation_value (CO-4506), employer_vendor_payments_received (CO-4455) and room_and_board_payments_received (CO-4161). I.4 says an in-kind benefit is \"counted as other income\", so these are unearned income: they are not earned income for the Colorado Works Child Care fee (3.116.C, CO-2578) or the minimum-wage test. Each is the month's receipt (OQ-680). cccap_person_unearned_income (CO-3916) adds this item. Coverage pass 3 C3-4 and C3-5 (dual-entry): in-kind pay is the one neutral fact in_kind_compensation_value (CO-4506; in_kind_employment_compensation_value, CO-4454, retired into it), and the GI Bill living allowance is the one fact gi_bill_housing_and_food_allowances_received (CO-4501; gi_bill_subsistence_allowance_received, CO-4456, retired into it), which is part of other unearned income and not of educational_assistance_received (CO-3360), so unearned_income_prior_thirty_days (CO-3913) already counts it and this item no longer adds it. Before the fix in-kind pay stated as CO-4506 was not counted (probe Y-3) and an allowance stated in both GI Bill facts was counted twice (probe Y-4)."
derived: [+, [otherwise, in_kind_compensation_value, 0], [otherwise, employer_vendor_payments_received, 0], [otherwise, room_and_board_payments_received, 0]]
sources: [S3255, S3256]
open: [OQ-680]
nearest: [CO-4463]
implemented: engine
tags: [income]
rationale: "Coverage round (docs/reviews/coverage-cccap.md, F-08, F-09): boarder receipts (room_and_board_payments_received, read only by SNAP) were dropped, in-kind compensation and employer vendor payments had no fact, and a GI Bill housing allowance stated in educational_assistance_received was excluded as educational aid (probes RV-F and RV-G: $2,000 of wages and $1,500 of board, or of GI Bill housing allowance, counted as $2,000, eligible, where 3.111.I counts $3,500)."
