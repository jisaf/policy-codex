implemented: engine
tags: [income]
open: [OQ-680, OQ-713]
rationale: "Coverage round (docs/reviews/coverage-cccap.md, F-08, F-09): boarder receipts (room_and_board_payments_received, read only by SNAP) were dropped, in-kind compensation and employer vendor payments had no fact, and a GI Bill housing allowance stated in educational_assistance_received was excluded as educational aid (probes RV-F and RV-G: $2,000 of wages and $1,500 of board, or of GI Bill housing allowance, counted as $2,000, eligible, where 3.111.I counts $3,500). Earned-income records, E1 (CCCAP): the three are earnings records, read through CCCAP's earnings table; a boarder's payment is one kind whatever it pays for, so it is read once (E0-F1)."
nearest: [CO-4463]
