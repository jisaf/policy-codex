id: CO-4464
name: "CCCAP: other countable receipts"
identifier: cccap_other_countable_receipts
kind: derived
type: money
scope: person-month
program: CCCAP
meaning: "Receipts 8 CCR 1403-1 3.111.I counts that are not in the wages, self-employment or recurring unearned income CCCAP otherwise reads: in-kind compensation for employment at its cost or fair market value (I.4); vendor payments that are part of the compensation for employment (I.5); GI Bill subsistence allowances for education and on-the-job training (I.7.c), which the educational aid CCCAP takes out of unearned income includes; and receipts from boarders or lodgers (I.18)."
precision: "Each part is a neutral fact read as 0 when not stated: in_kind_employment_compensation_value (CO-4454), employer_vendor_payments_received (CO-4455), gi_bill_subsistence_allowance_received (CO-4456, part of educational_assistance_received, CO-3360, which unearned_income_prior_thirty_days, CO-3913, takes out) and room_and_board_payments_received (CO-4161). I.4 says an in-kind benefit is \"counted as other income\", so these are unearned income: they are not earned income for the Colorado Works Child Care fee (3.116.C, CO-2578) or the minimum-wage test. Each is the month's receipt (OQ-680). cccap_person_unearned_income (CO-3916) adds this item."
derived: [+, [otherwise, in_kind_employment_compensation_value, 0], [otherwise, employer_vendor_payments_received, 0], [otherwise, gi_bill_subsistence_allowance_received, 0], [otherwise, room_and_board_payments_received, 0]]
sources: [S3255, S3256]
open: [OQ-680]
nearest: [CO-4463]
implemented: engine
tags: [income]
rationale: "Coverage round (docs/reviews/coverage-cccap.md, F-08, F-09): boarder receipts (room_and_board_payments_received, read only by SNAP) were dropped, in-kind compensation and employer vendor payments had no fact, and a GI Bill housing allowance stated in educational_assistance_received was excluded as educational aid (probes RV-F and RV-G: $2,000 of wages and $1,500 of board, or of GI Bill housing allowance, counted as $2,000, eligible, where 3.111.I counts $3,500)."
tests:
  - {id: CO-4464-T1, title: "F-08: $1,500 a month from a boarder (I.18)", as_of: "2026-11-01", month: "2026-11", given: {room_and_board_payments_received: 1500}, expect: 1500}
  - {id: CO-4464-T2, title: "F-09: a $1,500 GI Bill housing allowance (I.7.c)", as_of: "2026-11-01", month: "2026-11", given: {gi_bill_subsistence_allowance_received: 1500, educational_assistance_received: 1500}, expect: 1500}
  - {id: CO-4464-T3, title: "I.4, I.5: $400 of employer housing and a $250 car payment the employer makes", as_of: "2026-11-01", month: "2026-11", given: {in_kind_employment_compensation_value: 400, employer_vendor_payments_received: 250}, expect: 650}
  - {id: CO-4464-T4, title: "Nothing stated", as_of: "2026-11-01", month: "2026-11", given: {}, expect: 0}
