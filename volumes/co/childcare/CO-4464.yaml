  - {id: CO-4464-T1, month: "2026-11", as_of: "2026-11-01", given: {earnings: [{kind: boarder_payments, amount: 1500, provides: room_and_board}]}, title: "F-08: $1,500 a month from a boarder (I.18)", expect: 1500}
  - {id: CO-4464-T2, month: "2026-11", as_of: "2026-11-01", given: {earnings: [], receipts: [{kind: gi_bill_housing_food_allowance, amount: 1500}]}, title: "C3-5: a $1,500 GI Bill housing allowance (I.7.c) is in the unearned income CCCAP reads, so nothing is added here", expect: 0}
  # I.4, I.5: $400 of employer housing and a $250 car payment the employer makes: $400 + $250 = $650.
  - {id: CO-4464-T3, month: "2026-11", as_of: "2026-11-01", given: {earnings: [{kind: wages, amount: 2000}, {kind: in_kind_pay, amount: 400}, {kind: employer_vendor_payment, amount: 250}]}, title: "I.4, I.5: $400 of employer housing and a $250 car payment the employer makes", expect: 650}
  - {id: CO-4464-T4, month: "2026-11", as_of: "2026-11-01", given: {earnings: []}, title: "Nothing stated in a stated list: none", expect: 0}
  - {id: CO-4464-T5, month: "2026-11", as_of: "2026-11-01", given: {}, title: "Decision 4: earnings not stated: cannot determine", expect: unknown}
  # A lodger's $300 for meals only and $200 for a room only (I.18): $300 + $200 = $500, each once.
  - {id: CO-4464-T6, month: "2026-11", as_of: "2026-11-01", given: {earnings: [{kind: boarder_payments, amount: 300, provides: board_only}, {kind: boarder_payments, amount: 200, provides: room_only}]}, title: "Board only and room only (I.18)", expect: 500}
