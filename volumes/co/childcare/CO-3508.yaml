id: CO-3508
name: "CCCAP: parent fee as assessed by the formula"
identifier: cccap_parent_fee_assessed
kind: derived
type: money
scope: person-month
program: CCCAP
meaning: "The parent fee as the formula assesses it (cccap_parent_fee_formula_amount, CO-1289), reduced by cccap_quality_rating_fee_reduction_rate (CO-3002) when a top-three quality-rated provider is used and assessed at cccap_part_time_care_fee_rate (CO-3003) of it when all children are in part-time care, in whole dollars with the cents dropped (8 CCR 1403-1 3.124.A, H, P and U): the fee before any waiver or hardship reduction."
precision: "The reductions are applied to the formula amount with its cents and the cents are dropped once at the end (OQ-254, phase-8 note N-2). cccap_parent_fee (CO-1290) pays it unless a waiver or exception applies, and no more than the hardship amount under a county hardship reduction (3.124.S)."
derived: ["-", 0, [ceil, ["-", 0, ["*", cccap_parent_fee_formula_amount, ["*", [case, [uses_top_quality_rated_provider, ["-", 1, cccap_quality_rating_fee_reduction_rate]], [else, 1]], [case, [cccap_all_children_in_part_time_care, cccap_part_time_care_fee_rate], [else, 1]]]]]]]
sources: [S782, S783, S785, S787]
nearest: [CO-1290]
implemented: engine
tags: [income]
rationale: "OQ-254: the $5 hardship reduction of 3.124.S (S2302) reduces the fee \"as assessed by the parent fee formula\"; cccap_parent_fee (CO-1290) needs that figure by itself to cap it, so the assessment that was its last arm is an item of its own."
tests:
  - {id: CO-3508-T1, as_of: "2026-10-01", month: "2026-10", given: {cccap_parent_fee_formula_amount: 192.5, uses_top_quality_rated_provider: false, cccap_all_children_in_part_time_care: false}, expect: 192}
  - {id: CO-3508-T2, title: "Quality-rated provider (x0.8) and part-time care (x0.55): 192.50 x 0.44 = 84.70, cents dropped", as_of: "2026-10-01", month: "2026-10", given: {cccap_parent_fee_formula_amount: 192.5, uses_top_quality_rated_provider: true, cccap_all_children_in_part_time_care: true}, expect: 84}
