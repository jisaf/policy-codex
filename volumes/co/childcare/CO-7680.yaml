id: CO-7680
name: "CCCAP: hours managing rental property that is not self-employment"
identifier: cccap_rental_property_unearned_hours
kind: derived
type: hours
scope: person-month
program: CCCAP
meaning: "The hours the person spent in the month managing rental property whose income CCCAP counts as unearned, because the person does not actively manage the property an average of at least cccap_rental_property_self_employment_min_hours_per_week (CO-7252, twenty) hours a week (8 CCR 1403-1 3.111.H.4.e, S2704: \"Income from rental property will be considered as unearned income if the adult caretaker(s) or teen parent(s) are not actively managing the property an average of at least twenty (20) hours per week\"): cccap_rental_property_management_hours (CO-7254) when they average under the line, else none. They are not hours of an eligible activity: the employment minimum-wage test of 3.111.G.1.b (\"gross income divided by the number of hours worked\") takes them out of hours_worked (cccap_caretaker_in_eligible_activity, CO-984)."
precision: "Coverage pass 7, R7-2 (docs/reviews/coverage7-care-energy.md). hours_worked (CO-022) states the hours the person worked for pay in the month, including hours of self-employment, and a rental property stated as a business states its management hours as the business's hours (earnings: hours, rental_property); since 3.111.H.4.e makes such rent unearned income under the line, its hours are not hours worked for the wage test, as cccap_self_employment_hours (CO-6404) already leaves them out of the self-employment hours. The average is the hours divided by the month's days over seven (OQ-1366), as CO-7251 reads it. Coverage verification 7, V7-7: summed over the records CO-7251 counts as unearned rent (each under the line on its own hours, rental property, and the rental records' hours together under it), the same figure as cccap_rental_property_management_hours where that is under the line, so a business of twenty hours a week or more is not asked for its rental_property here (C1-F)."
derived: ["sum_receipts", "earnings", ["all", ["=", ["lookup", "cccap_earnings_treatment_table", ["receipt", "kind"]], "counted_self_employment"], ["=", ["receipt", "kind"], "self_employment_receipts"], ["case", [["not", ["unknown", ["receipt", "month"]]], ["received_in", ["month"]]], [["any", ["all", ["not", ["unknown", ["receipt", "job_end_date"]]], ["<", ["receipt", "job_end_date"], ["days_after", ["-", 0, "cccap_prior_income_period_days"], "cccap_application_or_redetermination_date"]]], ["all", ["not", ["unknown", ["receipt", "job_start_date"]]], [">=", ["receipt", "job_start_date"], "cccap_application_or_redetermination_date"]]], false], [["all", ["any", ["unknown", ["receipt", "job_start_date"]], ["<=", ["receipt", "job_start_date"], ["days_after", ["-", 0, "cccap_prior_income_period_days"], "cccap_application_or_redetermination_date"]]], ["any", ["unknown", ["receipt", "job_end_date"]], [">=", ["receipt", "job_end_date"], ["days_after", -1, "cccap_application_or_redetermination_date"]]]], ["received_in", ["month"]]], ["else", ["all", [">=", ["receipt", "date"], ["days_after", ["-", 0, "cccap_prior_income_period_days"], "cccap_application_or_redetermination_date"]], ["<", ["receipt", "date"], "cccap_application_or_redetermination_date"]]]], ["<", ["/", ["receipt", "hours"], ["/", ["days_between", ["first_day", ["month"]], ["first_day", ["month_after", ["month"]]]], 7]], "cccap_rental_property_self_employment_min_hours_per_week"], ["receipt", "rental_property"], ["<", ["/", ["of", ["owner"], "cccap_rental_property_management_hours"], ["/", ["days_between", ["first_day", ["month"]], ["first_day", ["month_after", ["month"]]]], 7]], "cccap_rental_property_self_employment_min_hours_per_week"]], ["receipt", "hours"]]
sources: [S2704, S4602]
implemented: engine
tags: [income]
open: [OQ-1366]
rationale: "Coverage pass 7, R7-2: CO-984 divided the wages by hours_worked, which by its meaning holds a small rental's management hours, so they diluted the wage (probe CR4: $800 for 87 hours of work and 43 hours managing a rental, $6.15 an hour, ineligible_activity, where the rule gives $9.20 and eligible_low_income)."
nearest: [CO-7254, CO-6404]
tests:
  # CR4 (docs/reviews/coverage7-care-energy.md): a rental managed 43 hours in November (30 days, 4.2857 weeks: 10.03 a week, under 20): its 43 hours.
  - {id: CO-7680-T1, month: "2026-11", as_of: "2026-11-15", title: "R7-2 (CR4): a rental managed 43 hours in November (10.03 a week): 43 hours not worked", given: {earnings: [{kind: wages, amount: 800}, {kind: self_employment_receipts, amount: 1800, hours: 43, rental_property: true}]}, expect: 43}
  # A rental managed 90 hours in November (90 / (30/7) = 21 a week): self-employment, none here.
  - {id: CO-7680-T2, month: "2026-11", as_of: "2026-11-15", title: "R7-2: a rental managed 90 hours in November (21 a week) is self-employment: 0", given: {earnings: [{kind: self_employment_receipts, amount: 1800, hours: 90, rental_property: true}]}, expect: 0}
  # No business at all: 0.
  - {id: CO-7680-T3, month: "2026-11", as_of: "2026-11-15", title: "R7-2: wages only: 0", given: {earnings: [{kind: wages, amount: 800}]}, expect: 0}
  # Coverage verification 7, V7-7 (C1-F): one business of 120 hours in November, 120 / (30 / 7) = 28 hours a week, at or over twenty: self-employment
  # whether or not it is rental property (3.111.H.4.e makes rent unearned only under twenty hours a week), so its rental_property is not read.
  - {id: CO-7680-T4, month: "2026-11", as_of: "2026-11-15", title: "V7-7: one business of 120 hours (28 a week), rental_property not stated: no rental hours out of hours_worked, 0 (was cannot determine)", given: {earnings: [{kind: self_employment_receipts, amount: 1800, hours: 120}]}, expect: 0}
