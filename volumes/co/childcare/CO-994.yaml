id: CO-994
name: "CCCAP: protective services household income"
identifier: cccap_protective_services_income
kind: derived
type: money
scope: person-month
program: CCCAP
meaning: For a Protective Services household, the only countable income under 8 CCR 1403-1 3.119.A - the income received by the child(ren) placed in kinship or foster care, excluding child support (which is intercepted by the county child welfare department and not counted) - one figure for the household, the same for every member.
precision: "A Protective Services household is a household of one for income purposes (3.119.A), and its income is the placed children's: the sum over the household's eligible children (cccap_household_members, CO-982, filtered by cccap_is_eligible_child, CO-980; the children the referral is for, the reading cccap_parent_fee_income, CO-2578, already uses, OQ-536) of each child's income as CCCAP counts any person's - the earned part (cccap_person_earned_income, CO-3915), which 3.111.J.1 makes nothing for a child in the household who is not a teen parent, and the unearned part (cccap_person_unearned_income, CO-3916), which leaves out what 3.111.J excludes - less the child's child support received (child_support_received, read as 0 when not stated), which 3.119.A does not count. The caretakers' income is not read (second-pass review N-2: the item read the evaluated person's own income, so a kin caretaker and the placed child in one household had different statuses and fees). Coverage pass 3 C3-9: 3.119.A counts the income of the children \"that have been placed in kinship or foster care\"; the volume has no fact for which household children are placed, so the sum runs over every eligible child of the household. A caretaker's own child who is not placed adds income only through unearned income such as a child's Social Security benefit (a household child's earnings are excluded, J.1); a case with such a child and such income overstates the household's income."
derived: [sum, [filter, cccap_household_members, [of, [P], cccap_is_eligible_child]], ["+", [of, [P], cccap_person_earned_income], [max, 0, ["-", [of, [P], cccap_person_unearned_income], [otherwise, [of, [P], child_support_received], 0]]]]]
sources: [S488, S486, S1623, S2852]
implemented: engine
tags: [income, household]
rationale: No existing item states 3.119.A's protective-services income test; the review (docs/reviews/cccap-leap-phase-6.md, C-9, should-fix) found cccap_eligibility_status (CO-989) granted eligible_protective_services on the supplied flag alone, with no income test at all, although 3.119.A only redefines the income test (household of one, placed child's income only, no child support) rather than waiving it - 3.119.D waives only the activity test and 3.119.E only residency verification. Modeled on cccap_household_income (CO-985), the nearest same-shape item, but summing the person directly rather than a household and dropping child_support_received per 3.119.A's own text rather than J.1's earnings-only exclusion. cccap_protective_services_income_within_limit (CO-995) reads it.
tests:
  - {id: CO-994-T1, month: "2026-10", as_of: "2026-10-01", given: {cccap_household_members: [p1, p2], cccap_is_eligible_child: false, cccap_person_earned_income: 3000, cccap_person_unearned_income: 0}, title: "N-2: a kin caretaker's $3,000 of wages are not counted; the placed child's $800 of Social Security is, and her $500 of child support is not (3.119.A)", others: {p2: {cccap_is_eligible_child: true, cccap_person_earned_income: 0, cccap_person_unearned_income: 1300, child_support_received: 500, receipts: [{kind: social_security}, {kind: ssi}, {kind: pension}, {kind: unemployment_compensation}, {kind: child_support, amount: 500}, {kind: colorado_works_cash}, {kind: adult_financial_cash}, {kind: tax_exempt_interest}, {kind: other_taxable}, {kind: other_nontaxable}]}}, expect: 800}
  - {id: CO-994-T2, month: "2026-10", as_of: "2026-10-01", given: {cccap_household_members: [p1], date_of_birth: "2011-05-01", cccap_is_eligible_child: true, cccap_is_teen_parent: false, wages_gross: 300, self_employment_gross_receipts: 0, self_employment_net_earnings_for_tax: 0, social_security_income: 0, pension_income: 0, unemployment_income: 0, child_support_received: 0, other_unearned_income_nontaxable: 0, other_unearned_income_taxable: 0, tax_exempt_interest: 0, receipts: [{kind: ssi}, {kind: colorado_works_cash}, {kind: adult_financial_cash}]}, title: "F-15: a placed 15-year-old's $300 of wages are excluded (3.111.J.1)", expect: 0}
  - {id: CO-994-T3, month: "2026-10", as_of: "2026-10-01", given: {cccap_household_members: [p1, p2], cccap_is_eligible_child: true, cccap_person_earned_income: 0, cccap_person_unearned_income: 1300, child_support_received: 500, receipts: [{kind: social_security}, {kind: ssi}, {kind: pension}, {kind: unemployment_compensation}, {kind: child_support, amount: 500}, {kind: colorado_works_cash}, {kind: adult_financial_cash}, {kind: tax_exempt_interest}, {kind: other_taxable}, {kind: other_nontaxable}]}, title: "N-2: the same figure read for the placed child", others: {p2: {cccap_is_eligible_child: false, cccap_person_earned_income: 3000, cccap_person_unearned_income: 0}}, expect: 800}
