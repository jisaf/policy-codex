id: CO-4076
name: "CCCAP: excluded irregular income"
identifier: cccap_excluded_irregular_income
kind: derived
type: money
scope: person-month
program: CCCAP
meaning: "The person's irregular recurring receipts that CCCAP counts (those cccap_counted_recurring_receipts, CO-5721, holds, marked irregular: \"received too infrequently or irregularly to be reasonably anticipated\") that 8 CCR 1403-1 3.111.J.28 (S2858) excludes, each because the calendar quarter of its own date (or of the month determined, for a receipt stated without a date) holds less than cccap_irregular_income_quarterly_limit (CO-4075) of irregular income, earned and unearned (\"Irregular income in the certification period that totals less than ninety dollars ($90) in any calendar quarter\"); otherwise 0."
precision: "The quarter's total is cccap_irregular_receipts_in_quarter (CO-5724) with the irregular earnings of the quarter (cccap_irregular_earnings_in_quarter, CO-6151; earned-income records, step E1, finding E1-C3: J.28 totals \"Irregular income\", earned and unearned, and before the records CCCAP's wages could not say which pay was irregular); the earnings are read only when the month has irregular receipts to take out. The month read is the month determined, whose receipts stand for the prior thirty days, so a receipt in the thirty days but in the month before is not taken out (OQ-713). J.28's \"slight fluctuations in regular monthly income\" are left to the stated amounts: a figure that already averages the fluctuation (CO-3914) carries none. Receipt records, migration phase 2 (2026-11-23): read from the receipts marked irregular, through CCCAP's counting table, replacing infrequent_or_irregular_income_received (CO-3822) and the shared quarter total (infrequent_or_irregular_income_in_quarter, CO-4077, which no rule reads now). Coverage pass 4 C4-1 and C4-2 (docs/reviews/coverage4-care-energy.md): rewritten to take out exactly the irregular recurring receipts cccap_counted_recurring_receipts (CO-5721) counts, each by the calendar quarter of its own date: a receipt dated in the thirty days is tested against the quarter the thirty days begin in (cccap_irregular_income_in_first_quarter_of_period, CO-6402) when its month is on or before cccap_prior_income_period_first_quarter_end (CO-6401), else against the quarter they end in (CO-6403); a receipt stated without a date against the quarter of the month determined. It no longer reads cccap_irregular_receipts (CO-5723), which places receipts by month for the quarter totals. Coverage pass 5, C5-1 (docs/reviews/coverage5-care-energy.md): a record stated with neither a month nor a date (a stream) is the pay or payment of the days its source ran (docs/conventions.md, \"A record's time\"; job_start_date and job_end_date for pay, start_date and end_date for a receipt). It stands for the thirty days only when its source ran through all of them (none of its dates after their first day or before their last); it is not read when its source ended before their first day or began on or after cccap_application_or_redetermination_date; and a source that began or ended inside the thirty days is placed by its dated records, so a stream without them cannot determine and the record's date is named as missing (8 CCR 1403-1 3.111.H.4, H.5.a.1, H.5.b, S2704, S891: the income \"received during the prior thirty (30) day period\"; OQ-680 (2)). A record stated with its month or its date is placed as before. Coverage pass 5: each irregular receipt is taken out at the value cccap_counted_recurring_receipts (CO-5721) counts it at, the early-payout penalty (C5-2), the share of jointly owned property's income (X5-1) and the proceeds spent on the costs they cover taken into account."
