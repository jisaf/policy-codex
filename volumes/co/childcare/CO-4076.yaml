id: CO-4076
name: "CCCAP: excluded irregular income"
identifier: cccap_excluded_irregular_income
kind: derived
type: money
scope: person-month
program: CCCAP
meaning: The person's irregular receipts that CCCAP counts for the month (cccap_irregular_receipts, CO-5723) when the irregular receipts of the calendar quarter containing the month total less than cccap_irregular_income_quarterly_limit (CO-4075), which 8 CCR 1403-1 3.111.J.28 excludes; otherwise 0.
precision: "The quarter's total is cccap_irregular_receipts_in_quarter (CO-5724). The month read is the month determined, whose receipts stand for the prior thirty days, so a receipt in the thirty days but in the month before is not taken out (OQ-713). J.28's \"slight fluctuations in regular monthly income\" are left to the stated amounts: a figure that already averages the fluctuation (CO-3914) carries none. Receipt records, migration phase 2 (2026-11-23): read from the receipts marked irregular, through CCCAP's counting table, replacing infrequent_or_irregular_income_received (CO-3822) and the shared quarter total (infrequent_or_irregular_income_in_quarter, CO-4077, which no rule reads now)."
derived: [case, [["<", cccap_irregular_receipts_in_quarter, cccap_irregular_income_quarterly_limit], cccap_irregular_receipts], [else, 0]]
sources: [S2858]
implemented: engine
tags: [income]
open: [OQ-713]
rationale: "Second-pass review P2 (J.28): the irregular-income exclusion was not modeled (cccap_household_income's precision sent it to OQ-162, a county-plan question, though J.28 is the state rule's). This is CCCAP's exclusion, with CCCAP's $90."
nearest: [CO-3827]
tests:
  - {id: CO-4076-T1, month: "2026-11", as_of: "2026-11-01", given: {receipts: [{kind: other_nontaxable, amount: 40, irregular: true, month: "2026-11"}]}, title: "A $40 gift in November, nothing else in the quarter: excluded", expect: 40}
  - {id: CO-4076-T2, month: "2026-11", as_of: "2026-11-01", given: {receipts: [{kind: other_nontaxable, amount: 60, irregular: true, month: "2026-10"}, {kind: other_nontaxable, amount: 40, irregular: true, month: "2026-11"}]}, title: "$60 in October and $40 in November: $100 in the quarter, counted", expect: 0}
