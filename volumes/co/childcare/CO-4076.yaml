rationale: "Second-pass review P2 (J.28): the irregular-income exclusion was not modeled (cccap_household_income's precision sent it to OQ-162, a county-plan question, though J.28 is the state rule's). This is CCCAP's exclusion, with CCCAP's $90."
nearest: [CO-3827]
tests:
  - {id: CO-4076-T1, month: "2026-11", as_of: "2026-11-01", given: {earnings: [], receipts: [{kind: other_nontaxable, amount: 40, irregular: true, month: "2026-11"}]}, title: "A $40 gift in November, nothing else in the quarter: excluded", expect: 40}
  - {id: CO-4076-T2, month: "2026-11", as_of: "2026-11-01", given: {earnings: [], receipts: [{kind: other_nontaxable, amount: 60, irregular: true, month: "2026-10"}, {kind: other_nontaxable, amount: 40, irregular: true, month: "2026-11"}]}, title: "$60 in October and $40 in November: $100 in the quarter, counted", expect: 0}
  # Finding E1-C3 (J.28 pools irregular income, earned and unearned): a $40 irregular gift in November and a $60 odd job in October: $100 in the quarter, not under $90: the gift is counted.
  - {id: CO-4076-T3, month: "2026-11", as_of: "2026-11-01", given: {receipts: [{kind: other_nontaxable, amount: 40, irregular: true, month: "2026-11"}], earnings: [{kind: wages, amount: 60, irregular: true, month: "2026-10"}]}, title: "E1-C3: an irregular gift and an odd job together reach $90", expect: 0}
  - {id: CO-4076-T4, month: "2026-11", as_of: "2026-11-01", given: {receipts: [{kind: other_nontaxable, amount: 40, irregular: true, month: "2026-11"}]}, title: "Decision 4: an irregular gift with the earnings not stated: the quarter's total cannot be determined", expect: unknown}
  - {id: CO-4076-T5, month: "2026-11", as_of: "2026-11-01", given: {receipts: [{kind: pension, amount: 900}]}, title: "No irregular receipts: nothing to take out, the earnings are not read", expect: 0}
  # Coverage pass 4 C4-1 and C4-2: application October 15, 2026 (the thirty days September 15 to October 14). A $60 gift marked irregular dated
  # September 20 is in the thirty days and in July-September, whose irregular income is $60 < $90 (J.28): excluded, $60.
  - {id: CO-4076-T6, title: "An irregular receipt in the thirty days, under $90 in its own quarter: excluded", month: "2026-10", as_of: "2026-10-15", given: {cccap_application_or_redetermination_date: "2026-10-15", earnings: [], receipts: [{kind: other_nontaxable, amount: 60, frequency: monthly, irregular: true, date: "2026-09-20"}]}, expect: 60}
  # The same gift with an odd-job pay of $50 on August 10: July-September holds $60 + $50 = $110, not less than $90: nothing is excluded.
  - {id: CO-4076-T7, title: "The same receipt in a quarter whose irregular income reaches $90: not excluded", month: "2026-10", as_of: "2026-10-15", given: {cccap_application_or_redetermination_date: "2026-10-15", earnings: [{kind: wages, amount: 50, frequency: once, date: "2026-08-10", irregular: true}], receipts: [{kind: other_nontaxable, amount: 60, frequency: monthly, irregular: true, date: "2026-09-20"}]}, expect: 0}
