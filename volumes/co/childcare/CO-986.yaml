id: CO-986
name: "CCCAP: income within the county entry limit"
identifier: cccap_income_within_entry_limit
kind: derived
type: yes/no
scope: person-month
program: CCCAP
meaning: Whether the CCCAP household's countable income (cccap_household_income, CO-985) is at or below the lesser of the county's entry income eligibility limit for the household's size and eighty-five percent of the state median income, under 8 CCR 1403-1 3.111.H.1 and H.1.a.
precision: "The county entry limit is the county percentage (cccap_entry_income_limit_pct_fpl, CO-870) of the monthly 100% FPG for the household (cccap_poverty_guideline_monthly, CO-3007); that figure is capped at the 85% SMI table for cccap_household_size (cccap_smi_income_limit_table, CO-1804, read beyond its last row with cccap_smi_income_limit_each_additional, CO-1805), per 3.111.H.1's opening sentence (\"gross income must not exceed eighty-five percent (85%) of the state median income\"). Does not distinguish this entry-limit test from the separate 3.111.H.1.b exit limit a continuing household is held to instead (see cccap_income_within_exit_limit, CO-993, and OQ-133). The 85% SMI table is read as of the determination date in every month evaluated: the entry limit is the test at the initial application or redetermination (3.111.H.1.a), whose figures hold for the twelve-month eligibility period (time audit T-3, docs/operators.md, Resolution)."
derived: ["<=", cccap_household_income, [min, ["*", cccap_entry_income_limit_pct_fpl, cccap_poverty_guideline_monthly], [lookup_extended, [as_of, cccap_smi_income_limit_table, [det_date]], cccap_household_size, [as_of, cccap_smi_income_limit_each_additional, [det_date]]]]]
sources: [S485]
open: [OQ-121]
implemented: engine
tags: [income]
rationale: "No existing item computes the CCCAP entry income test; cccap_low_income_child_care_eligible (CO-987) and cccap_eligibility_status (CO-989) both need it. The 85% SMI cap was added per the review (docs/reviews/cccap-leap-phase-6.md, C-5, should-fix): 3.111.H.1's cap ('gross income must not exceed 85% of the state median income') was stated in the fetched text (S485) but applied nowhere, so a county percentage above the cap was honoured without limit."
tests:
  - {id: CO-986-T1, as_of: "2026-10-01", month: "2026-10", given: {cccap_household_income: 2380, cccap_household_size: 3, cccap_entry_income_limit_pct_fpl: 1.85}, expect: true}
  - {id: CO-986-T2, as_of: "2026-10-01", month: "2026-10", given: {cccap_household_income: 10000, cccap_household_size: 3, cccap_entry_income_limit_pct_fpl: 1.85}, expect: false}
  # A county percentage set above the 85% SMI cap (H.1's opening sentence) does not raise the limit past the cap.
  - {id: CO-986-T3, as_of: "2026-10-01", month: "2026-10", given: {cccap_household_income: 6000, cccap_household_size: 2, cccap_entry_income_limit_pct_fpl: 5.0}, expect: true}
  - {id: CO-986-T4, as_of: "2026-10-01", month: "2026-10", given: {cccap_household_income: 7000, cccap_household_size: 2, cccap_entry_income_limit_pct_fpl: 5.0}, expect: false}
  # Household size above 8 exercises the HHS each-additional step and cccap_smi_income_limit_each_additional together.
  - {id: CO-986-T5, as_of: "2026-10-01", month: "2026-10", given: {cccap_household_income: 9786, cccap_household_size: 10, cccap_entry_income_limit_pct_fpl: 1.85}, expect: true}
  # Hard-coded numbers audit D-1: the FY2025 figures (S485) came from the 2024 HHS guideline, which the federal table does not hold, so the
  # test moves to the figures through September 30, 2026 (S780, the 2025 guideline): size 10, (54,150 + 2 x 5,500) / 12 = 5,429.17,
  # x 1.85 = 10,043.96; 85% SMI 13,563.79 + 2 x 294.87 = 14,153.53; $10,100 is above the lesser. Before: as_of 2025-09-30, $9,800, false.
  - {id: CO-986-T6, title: "Figures through September 30, 2026 (S780)", as_of: "2026-09-30", month: "2026-09", given: {cccap_household_income: 10100, cccap_household_size: 10, cccap_entry_income_limit_pct_fpl: 1.85}, expect: false}
