open: [OQ-680, OQ-1221]
rationale: "Earned-income records, E1 (CCCAP): the minimum-wage test and the fee test read gross wages; with the wages stated as records they read this figure, from the same thirty days as the income."
tests:
  # Redetermination November 1, 2026: the thirty days are October 2 to October 31. Weekly $500 on the five Fridays October 2, 9, 16, 23 and 30: $2,500.
  - {id: CO-5152-T1, title: "Five weekly pays of $500 in the thirty days: $2,500", as_of: "2026-11-01", month: "2026-11", given: {cccap_application_or_redetermination_date: "2026-11-01", earnings: [{kind: wages, amount: 500, frequency: weekly, date: "2026-09-25"}, {kind: wages, amount: 500, frequency: weekly, date: "2026-10-02"}, {kind: wages, amount: 500, frequency: weekly, date: "2026-10-09"}, {kind: wages, amount: 500, frequency: weekly, date: "2026-10-16"}, {kind: wages, amount: 500, frequency: weekly, date: "2026-10-23"}, {kind: wages, amount: 500, frequency: weekly, date: "2026-10-30"}]}, expect: 2500}
  # Work-study $300 and wages $1,000 in the month: $1,300 (the gross wage of the employment, J.16 notwithstanding); in-kind pay, a vendor payment and self-employment are not wages.
  - {id: CO-5152-T2, title: "Work-study is a gross wage here; in-kind pay, vendor payments and self-employment are not", as_of: "2026-11-01", month: "2026-11", given: {earnings: [{kind: wages, amount: 1000}, {kind: work_study, amount: 300}, {kind: in_kind_pay, amount: 400}, {kind: employer_vendor_payment, amount: 250}, {kind: self_employment_receipts, amount: 900}]}, expect: 1300}
  - {id: CO-5152-T3, title: "A dated pay, the application date not stated: cannot be placed", as_of: "2026-11-01", month: "2026-11", given: {earnings: [{kind: wages, amount: 500, date: "2026-10-30"}]}, expect: unknown}
  - {id: CO-5152-T4, title: "Earnings stated empty: none", as_of: "2026-11-01", month: "2026-11", given: {earnings: []}, expect: 0}
  # Application November 10: the thirty days are October 11 to November 9. A pay on October 10 is the day before them; one on November 10 is the application date: neither is read. October 11 ($200) and November 9 ($300): $500.
  - {id: CO-5152-T5, title: "The thirty days' first and last days count; the day before and the application date do not", as_of: "2026-11-10", month: "2026-11", given: {cccap_application_or_redetermination_date: "2026-11-10", earnings: [{kind: wages, amount: 100, date: "2026-10-10"}, {kind: wages, amount: 200, date: "2026-10-11"}, {kind: wages, amount: 300, date: "2026-11-09"}, {kind: wages, amount: 400, date: "2026-11-10"}]}, expect: 500}
  # Coverage pass 4 C4-4: $4,500 a month under an annual contract of $40,500 (H.4.b, prorated over the contract's term): $40,500 / 12 = $3,375, and a
  # $200 stipend for coaching outside the contract at its amount: $3,575.
  - {id: CO-5152-T6, title: "Contract pay prorated over twelve months, other pay as received (H.4.b)", as_of: "2026-11-15", month: "2026-11", given: {cccap_application_or_redetermination_date: "2026-11-15", earnings: [{kind: wages, amount: 4500, annual_contract_pay: 40500}, {kind: wages, amount: 200}]}, expect: 3575}
  # Coverage pass 5 (docs/reviews/coverage5-care-energy.md), C5-1: application 2026-11-15, so the thirty days run 2026-10-16 to 2026-11-14 (H.4-5, OQ-680).
  - {"id": "CO-5152-T7", "title": "C5-1 (CJ1): an old job's $2,000 stream that ended 2026-09-30 and a new job's $2,000 stream from 2026-10-01: gross wages 2,000", "month": "2026-11", "as_of": "2026-11-15", "given": {"cccap_application_or_redetermination_date": "2026-11-15", "earnings": [{"kind": "wages", "amount": 2000, "job_end_date": "2026-09-30"}, {"kind": "wages", "amount": 2000, "job_start_date": "2026-10-01"}]}, "expect": 2000}
