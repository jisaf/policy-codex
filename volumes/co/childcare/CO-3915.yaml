id: CO-3915
name: "CCCAP: a person's countable earned income"
identifier: cccap_person_earned_income
kind: derived
type: money
scope: person-month
program: CCCAP
meaning: "This person's earned income that CCCAP counts (8 CCR 1403-1 3.111.I.1-3, J): the gross wages received in the prior thirty days (3.111.H.4-5: \"income received during the prior thirty (30) day period shall be used in determining eligibility\"), each earnings record (earnings, CO-5100) whose kind CCCAP's counting table counts as wages (cccap_earnings_treatment_table, CO-5105: wages, armed forces pay, WIOA wages, I.1 and I.31, and the other pay no paragraph of J excludes; not work-study, J.16), without the irregular pay J.28 excludes when the quarter's irregular income is under ninety dollars; plus CCCAP's self-employment income (taxable gross income less verified business expenses, prorated to a month, H.4.c, I.2-3; cccap_self_employment_net_earnings, CO-1710); or nothing for a child in the household who is not a teen parent, whose earnings 3.111.J.1 excludes."
precision: "Earned-income records, step E1 (CCCAP; docs/reviews/records-earnings-care-energy.md): read from the earnings records, replacing wages_gross_received_prior_thirty_days (CO-3910) and the month's wages_gross less work_study_earnings (each read as 0 when not stated). A pay stated with its date is read when its date is in the cccap_prior_income_period_days (CO-5151) days before cccap_application_or_redetermination_date (CO-5150): the thirty days end the day before that date (OQ-680), so a weekly earner paid on five Fridays in them has five pays counted. A pay stated by its month, or a stream with no date, is read for the month determined, standing for the thirty days as CCCAP's receipts do (cccap_counted_recurring_receipts, CO-5721; OQ-680). J.28 (finding E1-C3): a pay marked irregular is left out when the irregular income of the calendar quarter, receipts (cccap_irregular_receipts_in_quarter, CO-5724) and earnings (cccap_irregular_earnings_in_quarter, CO-6151) together, is under cccap_irregular_income_quarterly_limit (CO-4075); the quarter is read only when the person has an irregular pay in the thirty days. In-kind pay, an employer's vendor payments and boarders are \"other income\" (I.4, I.5, I.18; cccap_other_countable_receipts, CO-4464), not earned income. The J.1 exclusion is keyed to the 3.103.LLL household-child term (cccap_is_household_child, CO-990), not the narrower 3.111.F eligible-child term. Read by cccap_person_countable_income (CO-3917) and, for a Colorado Works Child Care household, by cccap_parent_fee_income (CO-2578), which counts earned income only (3.116.C). Coverage round F-27: owners of a limited liability corporation or S corporation \"are considered employees of the corporation\" (3.111.G.1.c, D-87), so the pay they draw is wages; VISTA payments are receipts (CO-5000), counted as CCCAP's receipt table reads them (3.111.I.32). Coverage pass 4 (docs/reviews/coverage4-care-energy.md): C4-1, an irregular pay is tested under J.28 against the calendar quarter of its own date (a pay dated in the thirty days, against the quarter the thirty days begin in, cccap_irregular_income_in_first_quarter_of_period CO-6402, when its month is on or before cccap_prior_income_period_first_quarter_end CO-6401, else the quarter they end in, CO-6403), or of the month determined for a pay stated without a date; it is counted when that quarter's irregular income, earned and unearned, is not less than ninety dollars (OQ-713). C4-4, a pay that states annual_contract_pay is counted at one twelfth of the contract (cccap_annual_contract_months, CO-6406) in each month, in place of its amount, as H.4.b (S2704) prorates contract employment \"over the term of the contract\" (OQ-1221); the earnings record states the contract on one record of the job for each month (CO-5100). C4-5, a VISTA payment at or above the minimum wage (receipts of kind dvsa_title_i_payment_at_or_above_minimum_wage, cccap_receipt_treatment_table row counted_as_earned_unless_receiving_cccap_when_joined) is earned income unless the client was receiving CCCAP when joining VISTA (I.32, S4601; received_cccap_when_joined_vista, CO-6407, with no default, read only when there is such a payment); placed as the other receipts are, in the thirty days when dated. A person whose receipts are not stated has earned income that cannot be determined, since a VISTA payment may be among them (decision 4 of 2026-11-23)."
