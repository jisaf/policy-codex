id: CO-3915
name: "CCCAP: a person's countable earned income"
identifier: cccap_person_earned_income
kind: derived
type: money
scope: person-month
program: CCCAP
meaning: "This person's earned income that CCCAP counts (8 CCR 1403-1 3.111.I.1-2): the gross wages received in the prior thirty days (3.111.H.5.a.1) plus CCCAP's self-employment income (taxable gross income less verified business expenses, prorated to a month, H.4.c, I.2) - or nothing for a child in the household who is not a teen parent, whose earnings 3.111.J.1 excludes."
precision: "Wages are the gross wages received in the prior thirty days (H.5.a.1), wages_gross_received_prior_thirty_days (CO-3910), the thirty days before the application or redetermination date, when the case states them, else the month's wages_gross less work_study_earnings (college work-study, J.16, read as 0 when not stated; OQ-680). Receipt records, migration phase 3: CCCAP states its own thirty days here; the shared wages_gross_prior_thirty_days it read with LEAP is LEAP's own item now (leap_wages_in_income_verification_period, CO-3912), since LEAP's income verification period is not CCCAP's window (docs/reviews/cross-program-audit.md). Self-employment is cccap_self_employment_net_earnings (CO-1710) for the month, the prorated monthly figure H.4.c and I.2.c call for. The J.1 exclusion is keyed to the 3.103.LLL household-child term (cccap_is_household_child, CO-990), not the narrower 3.111.F eligible-child term. Read by cccap_person_countable_income (CO-3917) and, for a Colorado Works Child Care household, by cccap_parent_fee_income (CO-2578), which counts earned income only (3.116.C). Coverage round F-27, how a case states two kinds of pay: owners of a limited liability corporation or S corporation \"are considered employees of the corporation\" (3.111.G.1.c, D-87), so the pay they draw is stated as wages_gross; VISTA payments are earned income \"If the client was not receiving CCCAP when they joined vista\" and excluded if the client was (3.111.I.32, D-87), so a case states counted VISTA payments in wages_gross and excluded ones in federally_excluded_payments_received (CO-3366)."
derived: [case, [[all, cccap_is_household_child, [not, cccap_is_teen_parent]], 0], [else, [+, [otherwise, wages_gross_received_prior_thirty_days, ["-", wages_gross, [otherwise, work_study_earnings, 0]]], cccap_self_employment_net_earnings]]]
sources: [S486, S891, S2704, S496, S2207]
implemented: engine
tags: [income]
open: [OQ-680]
rationale: "Final pass F-09 and F-08: CCCAP's earned income is taken from the prior thirty days (3.111.H.5.a.1), and a Colorado Works Child Care fee is based on earned income alone (3.116.C, 3.124.E). cccap_household_income (CO-985) wrote the earned part inline over the calendar month; it is now its own item so the fee can read it."
tests:
