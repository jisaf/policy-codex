implemented: engine
tags: [income]
open: [OQ-680, OQ-713, OQ-1221, OQ-1222]
rationale: "Final pass F-09 and F-08: CCCAP's earned income is taken from the prior thirty days (3.111.H.5.a.1), and a Colorado Works Child Care fee is based on earned income alone (3.116.C, 3.124.E). cccap_household_income (CO-985) wrote the earned part inline over the calendar month; it is now its own item so the fee can read it. Earned-income records, E1 (CCCAP): the thirty days are computed from the pays' dates and the application or redetermination date; the thirty-day total (CO-3910) could not say which pays were in them."
tests:
  # Restated with dated pays (docs/reviews/earnings-e0.md, section 5). Redetermination December 1, 2026: the thirty days are November 1 to
  # November 30. Weekly $500 on the Fridays November 6, 13, 20, 27 and $500 on October 30 (before the thirty days): 4 x $500 = $2,000; and
  # a $500 bonus on November 30: $2,500 in the thirty days.
  - {id: CO-3915-T1, title: "A caretaker with $2,500 of wages in the thirty days", as_of: "2026-12-01", month: "2026-12", given: {receipts: [], cccap_is_household_child: false, cccap_self_employment_net_earnings: 0, cccap_application_or_redetermination_date: "2026-12-01", earnings: [{kind: wages, amount: 500, frequency: weekly, date: "2026-10-30"}, {kind: wages, amount: 500, frequency: weekly, date: "2026-11-06"}, {kind: wages, amount: 500, frequency: weekly, date: "2026-11-13"}, {kind: wages, amount: 500, frequency: weekly, date: "2026-11-20"}, {kind: wages, amount: 500, frequency: weekly, date: "2026-11-27"}, {kind: wages, amount: 500, frequency: once, date: "2026-11-30"}]}, expect: 2500}
  - {id: CO-3915-T2, title: "A 16-year-old household child who is not a teen parent: earnings excluded (J.1)", as_of: "2026-12-01", month: "2026-12", given: {cccap_is_household_child: true, cccap_is_teen_parent: false, cccap_application_or_redetermination_date: "2026-12-01", earnings: [{kind: wages, amount: 400, date: "2026-11-20"}]}, expect: 0}
  - {id: CO-3915-T3, title: "A teen parent's earnings count", as_of: "2026-12-01", month: "2026-12", given: {receipts: [], cccap_is_household_child: true, cccap_is_teen_parent: true, cccap_self_employment_net_earnings: 0, cccap_application_or_redetermination_date: "2026-12-01", earnings: [{kind: wages, amount: 300, frequency: biweekly, date: "2026-11-06"}, {kind: wages, amount: 300, frequency: biweekly, date: "2026-11-20"}]}, expect: 600}
  - {id: CO-3915-T4, title: "Monthly wages only, plus $300 of self-employment income", as_of: "2026-12-01", month: "2026-12", given: {receipts: [], cccap_is_household_child: false, cccap_self_employment_net_earnings: 300, earnings: [{kind: wages, amount: 1000}]}, expect: 1300}
  # $1,200 of wages and $200 of work-study (J.16, excluded) in the month: $1,200.
  - {id: CO-3915-T5, title: "Work-study is excluded (J.16)", as_of: "2026-12-01", month: "2026-12", given: {receipts: [], cccap_is_household_child: false, cccap_self_employment_net_earnings: 0, earnings: [{kind: wages, amount: 1200}, {kind: work_study, amount: 200}]}, expect: 1200}
  # 3.111.I.31: WIOA on-the-job training wages of $800 count: $800.
  - {id: CO-3915-T6, title: "WIOA on-the-job training wages count (I.31)", as_of: "2026-12-01", month: "2026-12", given: {receipts: [], cccap_is_household_child: false, cccap_self_employment_net_earnings: 0, earnings: [{kind: wioa_on_the_job_training, amount: 800}]}, expect: 800}
  # Finding E1-C3 (J.28): a $40 odd job in November and no other irregular income in the October-December quarter: $40 < $90, so it is left out of the $2,000 of wages: $2,000.
  - {id: CO-3915-T7, title: "J.28: a $40 odd job, the quarter's only irregular income, is excluded", as_of: "2026-11-01", month: "2026-11", given: {cccap_is_household_child: false, cccap_self_employment_net_earnings: 0, receipts: [], earnings: [{kind: wages, amount: 2000}, {kind: wages, amount: 40, irregular: true, month: "2026-11"}]}, expect: 2000}
  # The same odd job with a $60 irregular gift in October (a receipt): $40 + $60 = $100, not under $90, so it counts: $2,040.
  - {id: CO-3915-T8, title: "J.28: irregular earnings and receipts together reach $90: the odd job counts", as_of: "2026-11-01", month: "2026-11", given: {cccap_is_household_child: false, cccap_self_employment_net_earnings: 0, receipts: [{kind: gift, amount: 60, irregular: true, month: "2026-10"}], earnings: [{kind: wages, amount: 2000}, {kind: wages, amount: 40, irregular: true, month: "2026-11"}]}, expect: 2040}
  - {id: CO-3915-T9, title: "Earnings not stated: cannot determine", as_of: "2026-12-01", month: "2026-12", given: {cccap_is_household_child: false, cccap_self_employment_net_earnings: 0}, expect: unknown}
  - {id: CO-3915-T10, title: "Dated pays, the application or redetermination date not stated: cannot be placed", as_of: "2026-12-01", month: "2026-12", given: {cccap_is_household_child: false, cccap_self_employment_net_earnings: 0, earnings: [{kind: wages, amount: 500, date: "2026-11-20"}]}, expect: unknown}
  # Coverage pass 4 C4-1 (household C1, stored as CO-715): application October 15, 2026, so the thirty days are September 15 to October 14 (H.4-5).
  # $3,300 of monthly wages; odd-job pays (irregular) of $80 on September 20 (in the thirty days) and $50 on August 10 (before them). The $80 is
  # tested against its own quarter, July-September, whose irregular income is $80 + $50 = $130, not less than $90 (J.28): counted.
  # $3,300 + $80 = $3,380. (Before the fix the quarter of October was read, $0 of irregular income, and the $80 was excluded: $3,300.)
  - {id: CO-3915-T11, title: "An irregular pay in the thirty days is tested against the quarter of its own date (J.28)", as_of: "2026-10-15", month: "2026-10", given: {cccap_is_household_child: false, cccap_self_employment_net_earnings: 0, cccap_application_or_redetermination_date: "2026-10-15", receipts: [], earnings: [{kind: wages, amount: 3300}, {kind: wages, amount: 80, frequency: once, date: "2026-09-20", irregular: true}, {kind: wages, amount: 50, frequency: once, date: "2026-08-10", irregular: true}]}, expect: 3380}
  # The same application with odd jobs of $80 on September 20 (July-September holds only it: $80 < $90, excluded) and $40 on October 2
  # (October-December holds only it: $40 < $90, excluded): $3,300.
  - {id: CO-3915-T12, title: "Irregular pays in two quarters, each under $90 in its quarter: both excluded", as_of: "2026-10-15", month: "2026-10", given: {cccap_is_household_child: false, cccap_self_employment_net_earnings: 0, cccap_application_or_redetermination_date: "2026-10-15", receipts: [], earnings: [{kind: wages, amount: 3300}, {kind: wages, amount: 80, frequency: once, date: "2026-09-20", irregular: true}, {kind: wages, amount: 40, frequency: once, date: "2026-10-02", irregular: true}]}, expect: 3300}
  # Coverage pass 4 C4-4 (household CK1, stored as CO-719): a school employee paid $4,500 a month September to May under a contract of $40,500 a
  # year. H.4.b: "the income shall be prorated over the term of the contract": $40,500 / 12 (cccap_annual_contract_months) = $3,375, in place of the
  # $4,500 of the month. (Before the fix: $4,500.)
  - {id: CO-3915-T13, title: "Pay under an annual contract prorated over the contract's term (H.4.b)", as_of: "2026-11-15", month: "2026-11", given: {cccap_is_household_child: false, cccap_self_employment_net_earnings: 0, cccap_application_or_redetermination_date: "2026-11-15", receipts: [], earnings: [{kind: wages, amount: 4500, annual_contract_pay: 40500}]}, expect: 3375}
  # Coverage pass 4 C4-5: $2,000 of wages and a VISTA living allowance of $1,800 (at or above the minimum wage). I.32: "Vista payments are excluded if
  # the client was receiving CCCAP when they joined vista": $2,000; "If the client was not receiving CCCAP when they joined vista, the vista payments
  # shall count as earned income": $2,000 + $1,800 = $3,800; not stated: cannot determine.
  - {id: CO-3915-T14, title: "VISTA pay of a client receiving CCCAP when joining VISTA: excluded (I.32)", as_of: "2026-11-15", month: "2026-11", given: {cccap_is_household_child: false, cccap_self_employment_net_earnings: 0, received_cccap_when_joined_vista: true, earnings: [{kind: wages, amount: 2000}], receipts: [{kind: dvsa_title_i_payment_at_or_above_minimum_wage, amount: 1800}]}, expect: 2000}
  - {id: CO-3915-T15, title: "VISTA pay of a client not receiving CCCAP when joining VISTA: earned income (I.32)", as_of: "2026-11-15", month: "2026-11", given: {cccap_is_household_child: false, cccap_self_employment_net_earnings: 0, received_cccap_when_joined_vista: false, earnings: [{kind: wages, amount: 2000}], receipts: [{kind: dvsa_title_i_payment_at_or_above_minimum_wage, amount: 1800}]}, expect: 3800}
  - {id: CO-3915-T16, title: "VISTA pay, whether the client was receiving CCCAP when joining not stated: cannot determine", as_of: "2026-11-15", month: "2026-11", given: {cccap_is_household_child: false, cccap_self_employment_net_earnings: 0, earnings: [{kind: wages, amount: 2000}], receipts: [{kind: dvsa_title_i_payment_at_or_above_minimum_wage, amount: 1800}]}, expect: unknown}
  # Coverage pass 4 X4-2: $2,000 of wages and a $900 difficulty of care payment for a foster child placed in the home: J.10 excludes "Payments received
  # from the county or state for providing foster care": $2,000. The same payment for a person on an HCBS waiver: no paragraph excludes it, $2,900.
  - {id: CO-3915-T17, title: "A difficulty of care payment for a foster child is excluded (J.10)", as_of: "2026-11-15", month: "2026-11", given: {cccap_is_household_child: false, cccap_self_employment_net_earnings: 0, receipts: [], earnings: [{kind: wages, amount: 2000}, {kind: difficulty_of_care_payment, amount: 900, foster_care: true}]}, expect: 2000}
  - {id: CO-3915-T18, title: "A difficulty of care payment under an HCBS waiver is counted", as_of: "2026-11-15", month: "2026-11", given: {cccap_is_household_child: false, cccap_self_employment_net_earnings: 0, receipts: [], earnings: [{kind: wages, amount: 2000}, {kind: difficulty_of_care_payment, amount: 900}]}, expect: 2900}
