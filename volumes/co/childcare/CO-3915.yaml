id: CO-3915
name: "CCCAP: a person's countable earned income"
identifier: cccap_person_earned_income
kind: derived
type: money
scope: person-month
program: CCCAP
meaning: "This person's earned income that CCCAP counts (8 CCR 1403-1 3.111.I.1-3, J): the gross wages received in the prior thirty days (3.111.H.4-5: \"income received during the prior thirty (30) day period shall be used in determining eligibility\"), each earnings record (earnings, CO-5100) whose kind CCCAP's counting table counts as wages (cccap_earnings_treatment_table, CO-5105: wages, armed forces pay, WIOA wages, I.1 and I.31, and the other pay no paragraph of J excludes; not work-study, J.16), without the irregular pay J.28 excludes when the quarter's irregular income is under ninety dollars; plus CCCAP's self-employment income (taxable gross income less verified business expenses, prorated to a month, H.4.c, I.2-3; cccap_self_employment_net_earnings, CO-1710); or nothing for a child in the household who is not a teen parent, whose earnings 3.111.J.1 excludes."
precision: "Earned-income records, step E1 (CCCAP; docs/reviews/records-earnings-care-energy.md): read from the earnings records, replacing wages_gross_received_prior_thirty_days (CO-3910) and the month's wages_gross less work_study_earnings (each read as 0 when not stated). A pay stated with its date is read when its date is in the cccap_prior_income_period_days (CO-5151) days before cccap_application_or_redetermination_date (CO-5150): the thirty days end the day before that date (OQ-680), so a weekly earner paid on five Fridays in them has five pays counted. A pay stated by its month, or a stream with no date, is read for the month determined, standing for the thirty days as CCCAP's receipts do (cccap_counted_recurring_receipts, CO-5721; OQ-680). J.28 (finding E1-C3): a pay marked irregular is left out when the irregular income of the calendar quarter, receipts (cccap_irregular_receipts_in_quarter, CO-5724) and earnings (cccap_irregular_earnings_in_quarter, CO-6151) together, is under cccap_irregular_income_quarterly_limit (CO-4075); the quarter is read only when the person has an irregular pay in the thirty days. In-kind pay, an employer's vendor payments and boarders are \"other income\" (I.4, I.5, I.18; cccap_other_countable_receipts, CO-4464), not earned income. The J.1 exclusion is keyed to the 3.103.LLL household-child term (cccap_is_household_child, CO-990), not the narrower 3.111.F eligible-child term. Read by cccap_person_countable_income (CO-3917) and, for a Colorado Works Child Care household, by cccap_parent_fee_income (CO-2578), which counts earned income only (3.116.C). Coverage round F-27: owners of a limited liability corporation or S corporation \"are considered employees of the corporation\" (3.111.G.1.c, D-87), so the pay they draw is wages; VISTA payments are receipts (CO-5000), counted as CCCAP's receipt table reads them (3.111.I.32)."
derived: [case, [[all, cccap_is_household_child, [not, cccap_is_teen_parent]], 0], [else, ["+", [case, [["=", [sum_receipts, earnings, [all, [in, [lookup, cccap_earnings_treatment_table, [receipt, kind]], [counted, counted_no_rule_excludes]], [case, [[unknown, [receipt, date]], [received_in, [month]]], [else, [all, [">=", [receipt, date], [days_after, ["-", 0, cccap_prior_income_period_days], cccap_application_or_redetermination_date]], ["<", [receipt, date], cccap_application_or_redetermination_date]]]], [not, [receipt, irregular]]], [receipt, amount]], [sum_receipts, earnings, [all, [in, [lookup, cccap_earnings_treatment_table, [receipt, kind]], [counted, counted_no_rule_excludes]], [case, [[unknown, [receipt, date]], [received_in, [month]]], [else, [all, [">=", [receipt, date], [days_after, ["-", 0, cccap_prior_income_period_days], cccap_application_or_redetermination_date]], ["<", [receipt, date], cccap_application_or_redetermination_date]]]]], [receipt, amount]]], [sum_receipts, earnings, [all, [in, [lookup, cccap_earnings_treatment_table, [receipt, kind]], [counted, counted_no_rule_excludes]], [case, [[unknown, [receipt, date]], [received_in, [month]]], [else, [all, [">=", [receipt, date], [days_after, ["-", 0, cccap_prior_income_period_days], cccap_application_or_redetermination_date]], ["<", [receipt, date], cccap_application_or_redetermination_date]]]]], [receipt, amount]]], [["<", ["+", cccap_irregular_receipts_in_quarter, cccap_irregular_earnings_in_quarter], cccap_irregular_income_quarterly_limit], [sum_receipts, earnings, [all, [in, [lookup, cccap_earnings_treatment_table, [receipt, kind]], [counted, counted_no_rule_excludes]], [case, [[unknown, [receipt, date]], [received_in, [month]]], [else, [all, [">=", [receipt, date], [days_after, ["-", 0, cccap_prior_income_period_days], cccap_application_or_redetermination_date]], ["<", [receipt, date], cccap_application_or_redetermination_date]]]], [not, [receipt, irregular]]], [receipt, amount]]], [else, [sum_receipts, earnings, [all, [in, [lookup, cccap_earnings_treatment_table, [receipt, kind]], [counted, counted_no_rule_excludes]], [case, [[unknown, [receipt, date]], [received_in, [month]]], [else, [all, [">=", [receipt, date], [days_after, ["-", 0, cccap_prior_income_period_days], cccap_application_or_redetermination_date]], ["<", [receipt, date], cccap_application_or_redetermination_date]]]]], [receipt, amount]]]], cccap_self_employment_net_earnings]]]
sources: [S486, S891, S2704, S496, S2207, S4020, S2858]
implemented: engine
tags: [income]
open: [OQ-680, OQ-713]
rationale: "Final pass F-09 and F-08: CCCAP's earned income is taken from the prior thirty days (3.111.H.5.a.1), and a Colorado Works Child Care fee is based on earned income alone (3.116.C, 3.124.E). cccap_household_income (CO-985) wrote the earned part inline over the calendar month; it is now its own item so the fee can read it. Earned-income records, E1 (CCCAP): the thirty days are computed from the pays' dates and the application or redetermination date; the thirty-day total (CO-3910) could not say which pays were in them."
tests:
  # Restated with dated pays (docs/reviews/earnings-e0.md, section 5). Redetermination December 1, 2026: the thirty days are November 1 to
  # November 30. Weekly $500 on the Fridays November 6, 13, 20, 27 and $500 on October 30 (before the thirty days): 4 x $500 = $2,000; and
  # a $500 bonus on November 30: $2,500 in the thirty days.
  - {id: CO-3915-T1, title: "A caretaker with $2,500 of wages in the thirty days", as_of: "2026-12-01", month: "2026-12", given: {cccap_is_household_child: false, cccap_self_employment_net_earnings: 0, cccap_application_or_redetermination_date: "2026-12-01", earnings: [{kind: wages, amount: 500, frequency: weekly, date: "2026-10-30"}, {kind: wages, amount: 500, frequency: weekly, date: "2026-11-06"}, {kind: wages, amount: 500, frequency: weekly, date: "2026-11-13"}, {kind: wages, amount: 500, frequency: weekly, date: "2026-11-20"}, {kind: wages, amount: 500, frequency: weekly, date: "2026-11-27"}, {kind: wages, amount: 500, frequency: once, date: "2026-11-30"}]}, expect: 2500}
  - {id: CO-3915-T2, title: "A 16-year-old household child who is not a teen parent: earnings excluded (J.1)", as_of: "2026-12-01", month: "2026-12", given: {cccap_is_household_child: true, cccap_is_teen_parent: false, cccap_application_or_redetermination_date: "2026-12-01", earnings: [{kind: wages, amount: 400, date: "2026-11-20"}]}, expect: 0}
  - {id: CO-3915-T3, title: "A teen parent's earnings count", as_of: "2026-12-01", month: "2026-12", given: {cccap_is_household_child: true, cccap_is_teen_parent: true, cccap_self_employment_net_earnings: 0, cccap_application_or_redetermination_date: "2026-12-01", earnings: [{kind: wages, amount: 300, frequency: biweekly, date: "2026-11-06"}, {kind: wages, amount: 300, frequency: biweekly, date: "2026-11-20"}]}, expect: 600}
  - {id: CO-3915-T4, title: "Monthly wages only, plus $300 of self-employment income", as_of: "2026-12-01", month: "2026-12", given: {cccap_is_household_child: false, cccap_self_employment_net_earnings: 300, earnings: [{kind: wages, amount: 1000}]}, expect: 1300}
  # $1,200 of wages and $200 of work-study (J.16, excluded) in the month: $1,200.
  - {id: CO-3915-T5, title: "Work-study is excluded (J.16)", as_of: "2026-12-01", month: "2026-12", given: {cccap_is_household_child: false, cccap_self_employment_net_earnings: 0, earnings: [{kind: wages, amount: 1200}, {kind: work_study, amount: 200}]}, expect: 1200}
  # 3.111.I.31: WIOA on-the-job training wages of $800 count: $800.
  - {id: CO-3915-T6, title: "WIOA on-the-job training wages count (I.31)", as_of: "2026-12-01", month: "2026-12", given: {cccap_is_household_child: false, cccap_self_employment_net_earnings: 0, earnings: [{kind: wioa_on_the_job_training, amount: 800}]}, expect: 800}
  # Finding E1-C3 (J.28): a $40 odd job in November and no other irregular income in the October-December quarter: $40 < $90, so it is left out of the $2,000 of wages: $2,000.
  - {id: CO-3915-T7, title: "J.28: a $40 odd job, the quarter's only irregular income, is excluded", as_of: "2026-11-01", month: "2026-11", given: {cccap_is_household_child: false, cccap_self_employment_net_earnings: 0, receipts: [], earnings: [{kind: wages, amount: 2000}, {kind: wages, amount: 40, irregular: true, month: "2026-11"}]}, expect: 2000}
  # The same odd job with a $60 irregular gift in October (a receipt): $40 + $60 = $100, not under $90, so it counts: $2,040.
  - {id: CO-3915-T8, title: "J.28: irregular earnings and receipts together reach $90: the odd job counts", as_of: "2026-11-01", month: "2026-11", given: {cccap_is_household_child: false, cccap_self_employment_net_earnings: 0, receipts: [{kind: gift, amount: 60, irregular: true, month: "2026-10"}], earnings: [{kind: wages, amount: 2000}, {kind: wages, amount: 40, irregular: true, month: "2026-11"}]}, expect: 2040}
  - {id: CO-3915-T9, title: "Earnings not stated: cannot determine", as_of: "2026-12-01", month: "2026-12", given: {cccap_is_household_child: false, cccap_self_employment_net_earnings: 0}, expect: unknown}
  - {id: CO-3915-T10, title: "Dated pays, the application or redetermination date not stated: cannot be placed", as_of: "2026-12-01", month: "2026-12", given: {cccap_is_household_child: false, cccap_self_employment_net_earnings: 0, earnings: [{kind: wages, amount: 500, date: "2026-11-20"}]}, expect: unknown}
