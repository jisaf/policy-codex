id: CO-3915
name: "CCCAP: a person's countable earned income"
identifier: cccap_person_earned_income
kind: derived
type: money
scope: person-month
program: CCCAP
meaning: "This person's earned income that CCCAP counts (8 CCR 1403-1 3.111.I.1-2): the gross wages received in the prior thirty days (3.111.H.5.a.1) plus CCCAP's self-employment income (taxable gross income less verified business expenses, prorated to a month, H.4.c, I.2) - or nothing for a child in the household who is not a teen parent, whose earnings 3.111.J.1 excludes."
precision: "Wages are wages_gross_prior_thirty_days (CO-3912): the thirty days before the application date when the case states them, else the month's wages (OQ-680). Self-employment is cccap_self_employment_net_earnings (CO-1710) for the month, the prorated monthly figure H.4.c and I.2.c call for. The J.1 exclusion is keyed to the 3.103.LLL household-child term (cccap_is_household_child, CO-990), not the narrower 3.111.F eligible-child term. Read by cccap_person_countable_income (CO-3917) and, for a Colorado Works Child Care household, by cccap_parent_fee_income (CO-2578), which counts earned income only (3.116.C)."
derived: [case, [[all, cccap_is_household_child, [not, cccap_is_teen_parent]], 0], [else, [+, wages_gross_prior_thirty_days, cccap_self_employment_net_earnings]]]
sources: [S486, S891, S2704, S496]
implemented: engine
tags: [income]
open: [OQ-680]
rationale: "Final pass F-09 and F-08: CCCAP's earned income is taken from the prior thirty days (3.111.H.5.a.1), and a Colorado Works Child Care fee is based on earned income alone (3.116.C, 3.124.E). cccap_household_income (CO-985) wrote the earned part inline over the calendar month; it is now its own item so the fee can read it."
tests:
  - {id: CO-3915-T1, title: "A caretaker with $2,500 of wages in the thirty days", as_of: "2026-12-01", month: "2026-12", given: {cccap_is_household_child: false, wages_gross_received_prior_thirty_days: 2500, cccap_self_employment_net_earnings: 0}, expect: 2500}
  - {id: CO-3915-T2, title: "A 16-year-old household child who is not a teen parent: earnings excluded (J.1)", as_of: "2026-12-01", month: "2026-12", given: {cccap_is_household_child: true, cccap_is_teen_parent: false, wages_gross_received_prior_thirty_days: 400}, expect: 0}
  - {id: CO-3915-T3, title: "A teen parent's earnings count", as_of: "2026-12-01", month: "2026-12", given: {cccap_is_household_child: true, cccap_is_teen_parent: true, wages_gross_received_prior_thirty_days: 600, cccap_self_employment_net_earnings: 0}, expect: 600}
  - {id: CO-3915-T4, title: "Monthly wages only, plus $300 of self-employment income", as_of: "2026-12-01", month: "2026-12", given: {cccap_is_household_child: false, wages_gross: 1000, cccap_self_employment_net_earnings: 300}, expect: 1300}
