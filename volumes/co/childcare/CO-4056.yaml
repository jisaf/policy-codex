  - {id: CO-4056-T2, title: "A fifteen-year-old without additional care needs", as_of: "2026-10-01", given: {date_of_birth: "2011-05-01", cccap_child_has_additional_care_needs: false, cccap_child_needs_care_for_part_of_day: true}, expect: false}
  - {id: CO-4056-T3, title: "A fifteen-year-old with verified additional care needs", as_of: "2026-10-01", given: {date_of_birth: "2011-05-01", cccap_child_has_additional_care_needs: true, cccap_child_needs_care_for_part_of_day: true}, expect: true}
