  - {id: CO-4056-T6, title: "F-06: a thirteen-year-old added to the household during the period (3.125.FF)", as_of: "2026-11-15", given: {date_of_birth: "2013-11-10", cccap_child_has_additional_care_needs: false, cccap_child_needs_care_for_part_of_day: true, cccap_child_was_authorized_at_last_determination: false, cccap_determination_type: change_during_eligibility_period}, expect: false}
