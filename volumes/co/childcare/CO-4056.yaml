  - {id: CO-4056-T4, title: "F-06: a thirteen-year-old authorized at the last determination, at a change during the period", as_of: "2026-11-15", given: {date_of_birth: "2013-11-10", cccap_child_has_additional_care_needs: false, cccap_child_needs_care_for_part_of_day: true, cccap_child_was_authorized_at_last_determination: true, cccap_determination_type: change_during_eligibility_period}, expect: true}
