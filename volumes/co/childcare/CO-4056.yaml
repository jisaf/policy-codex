id: CO-4056
name: "CCCAP: a child of eligible age who needs care for part of the day"
identifier: cccap_is_child_of_eligible_age_needing_care
kind: derived
type: yes/no
scope: person
program: CCCAP
meaning: "The person is a child from birth to age thirteen, or a child with verified additional care needs under age nineteen who is physically or mentally incapable of self-care or under court supervision, who needs child care during a portion of the day but less than twenty-four hours: the age and need parts of the \"eligible child\" definition (8 CCR 1403-1 3.103.UU, 3.111.F), without its citizenship part, which 3.103.UU applies to \"Any child served through the Colorado Works program or the Low-Income Child Care program\"."
precision: "cccap_is_eligible_child (CO-980) adds the citizenship part. Read by itself for Child Welfare Child Care (cccap_eligibility_status, CO-989), which is not funded through the Child Care Development Fund (3.120.F) and which 3.103.UU's citizenship sentence does not name (OQ-710). Residing with the caretaker is read from the household (cccap_household_members, CO-982), as for CO-980. Coverage round F-06: a child who exceeds the age limits during the eligibility period stays an eligible child until the redetermination: 3.114.B.1 ends care for an \"Eligible child [who] exceeds age limits\" \"at re-determination only\" (S3251), and 3.125.Q's closed list of reasons to discontinue care before the redetermination does not name age (S3252). At a change reported during the period (cccap_determination_type, CO-3307), a child authorized at the last determination (cccap_child_was_authorized_at_last_determination, CO-4462, read as false when not stated) is not tested on age; a child added during the period is (3.125.FF). Before the fix a child who turned thirteen during the period made the household ineligible_child at a change (probe RV-D)."
derived: [all, [any, ["<", age, cccap_eligible_child_age_limit], [all, ["<", age, cccap_disabled_child_age_limit], cccap_child_has_additional_care_needs], [all, [otherwise, cccap_child_was_authorized_at_last_determination, false], ["=", cccap_determination_type, change_during_eligibility_period]]], cccap_child_needs_care_for_part_of_day]
sources: [S2853, S482, S1082, S1408, S3251, S3252]
open: [OQ-710]
nearest: [CO-980]
implemented: engine
tags: [age, disability]
rationale: "Second-pass review N-3: the Child Welfare Child Care row of cccap_eligibility_status (CO-989) preceded the eligible-child test, so a household with no child of eligible age was eligible. Child Welfare Child Care needs the age and need parts of the definition but, outside the Child Care Development Fund, not its citizenship part; the two parts are split so CO-989 can read this one alone."
