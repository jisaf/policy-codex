id: CO-981
name: "CCCAP: is a teen parent"
identifier: cccap_is_teen_parent
kind: derived
type: yes/no
scope: person
program: CCCAP
meaning: The person is a "teen parent" under 8 CCR 1403-1 3.103.ZZZZ - a parent under twenty-one years of age who has physical custody, for the period care is requested, of a child of theirs who is themselves a CCCAP eligible child.
precision: Physical custody is read from a stated parent/child or caretaker/dependent relationship to a CCCAP-eligible child, the same convention cw_has_dependent_child (CO-902) uses for Colorado Works; the eligible-activity prong of the 3.103.ZZZZ definition is checked separately by cccap_caretaker_in_eligible_activity (CO-984), not here.
derived: [all, ["<", age, cccap_teen_parent_age_limit], [exists_related, [parent, caretaker], [of, [P], cccap_is_eligible_child]]]
sources: [S481]
implemented: engine
tags: [age, household]
rationale: No existing item states the CCCAP teen-parent test; cccap_caretaker_in_eligible_activity (CO-984) reads it to let a teen parent's own school attendance count as an eligible activity.
tests:
  - {id: CO-981-T1, as_of: "2026-10-01", given: {date_of_birth: "2009-04-08"}, others: {p5: {date_of_birth: "2026-02-03", has_additional_care_needs: false}}, relationships: [[parent, p1, p5]], expect: true}
