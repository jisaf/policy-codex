  - {id: CO-981-T2, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "1990-01-01", is_enrolled_in_school: true, hours_worked: 0, is_in_job_search_activity: false}, others: {p5: {date_of_birth: "2026-02-03", has_additional_care_needs: false}}, relationships: [[parent, p1, p5]], expect: false}
  - {id: CO-981-T3, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "2009-04-08", is_enrolled_in_school: true, hours_worked: 0, is_in_job_search_activity: false}, relationships: [], expect: false}
