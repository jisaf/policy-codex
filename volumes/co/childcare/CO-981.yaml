  - {id: CO-981-T4, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "2009-04-08", is_enrolled_in_school: false, hours_worked: 0, is_in_job_search_activity: false}, others: {p5: {date_of_birth: "2026-02-03", has_additional_care_needs: false}}, relationships: [[parent, p1, p5]], expect: false}
  # 3.103.EEEEE's financial-contribution prong: an under-21 parent with custody and an activity, but not financially contributing to the child's welfare, is not a teen parent.
  - {id: CO-981-T5, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "2009-04-08", is_enrolled_in_school: true, hours_worked: 0, is_in_job_search_activity: false, is_financially_contributing_to_child: false}, others: {p5: {date_of_birth: "2026-02-03", has_additional_care_needs: false}}, relationships: [[parent, p1, p5]], expect: false}
  # 3.103.EEEEE's reclassification clause: a person who would otherwise be a teen parent, but is in workforce training or post-secondary education, is an adult caretaker instead.
  - {id: CO-981-T6, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "2009-04-08", is_enrolled_in_school: true, hours_worked: 0, is_in_job_search_activity: false, is_in_post_secondary_education_or_workforce_training: true}, others: {p5: {date_of_birth: "2026-02-03", has_additional_care_needs: false}}, relationships: [[parent, p1, p5]], expect: false}
