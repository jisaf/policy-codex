id: CO-981
name: "CCCAP: is a teen parent"
identifier: cccap_is_teen_parent
kind: derived
type: yes/no
scope: person-month
program: CCCAP
meaning: The person is a "teen parent" under 8 CCR 1403-1 3.103.EEEEE - a person under twenty-one years of age who is financially contributing to the welfare of the child, has custody, for the period care is requested, of a child of theirs, is in an eligible activity such as basic education, employment, self-employment, or job search, and is not reclassified as an adult caretaker by being in workforce training or post-secondary education.
precision: "Custody is read from a stated parent/child or caretaker/dependent relationship to a CCCAP-eligible child, the same convention cw_has_dependent_child (CO-902) uses for Colorado Works. Requires the custodial child to be a cccap_is_eligible_child, which 3.103.EEEEE's own text ('the child(ren)') does not state; this narrows the term slightly, but costs nothing in practice, since a teen parent with no eligible child also has no eligible child in the household under 3.103's household definition. The financial-contribution prong is read from is_financially_contributing_to_child (CO-897, the same supplied fact cccap_is_adult_caretaker/CO-992 reads for the parallel prong of 3.103.C) with [otherwise, ..., true], the same default CO-992 uses. The eligible-activity conjunct is read with [otherwise, ..., false] (defaults to not-in-an-activity when the case does not state hours_worked/is_in_job_search_activity/is_enrolled_in_school for this person), for the same case-coverage reason as OQ-134/OQ-135/OQ-136 - most existing cases in this chapter's own item tests do not state activity facts for a custodial minor whose teen-parent status was previously age-and-custody-only - see OQ-157. The reclassification conjunct (a teen parent in workforce training or post-secondary education is an adult caretaker, not a teen parent) is read from the new is_in_post_secondary_education_or_workforce_training (CO-1015) with [otherwise, ..., false], defaulting to not-reclassified absent a stated value - see OQ-180."
derived: [all, ["<", age, cccap_teen_parent_age_limit], [exists_related, [parent, caretaker], [of, [P], cccap_is_eligible_child]], [otherwise, is_financially_contributing_to_child, true], [otherwise, cccap_caretaker_in_eligible_activity, false], [not, [otherwise, is_in_post_secondary_education_or_workforce_training, false]]]
sources: [S583]
open: [OQ-157, OQ-180]
implemented: engine
tags: [age, household]
rationale: "Re-sourced from S481 (D-64/Cornell, 8 CCR 1403-1-3.103.ZZZZ: 'a parent under twenty-one (21) years of age who has physical custody of his/her child(ren) for the period that care is requested and is in an eligible activity such as attending junior high/middle school, high school, GED program, vocational/technical training activity, employment, self-employment, or job search') to S583 (D-76, the Colorado SOS current edition's 3.103.EEEEE), per OQ-178(c): the current text adds a financial-contribution prong the adult-caretaker definition (3.103.C) already required but ZZZZ did not, narrows the eligible-activity list to 'basic education, employment, self-employment, or job search' (dropping the old text's explicit school/GED/vocational-training enumeration, though OQ-157's is_enrolled_in_school reading is unaffected since it already stands in for schooling generally rather than testing the enumeration's wording), and adds the workforce-training/post-secondary-education reclassification clause with no counterpart in S481 at all. The financial-contribution prong reuses is_financially_contributing_to_child (CO-897, the nearest existing item, already read by cccap_is_adult_caretaker/CO-992 for the identical prong of the adult-caretaker definition) rather than adding a second supplied fact for the same concept. The reclassification clause is modeled with a new supplied fact, is_in_post_secondary_education_or_workforce_training (CO-1015), because no existing fact distinguishes workforce training or post-secondary education from basic education or other schooling (see OQ-124, on CO-984's single is_enrolled_in_school flag) and the clause changes cccap_is_teen_parent's own outcome directly rather than merely gating an activity test. Moved from scope: person to scope: person-month and the eligible-activity prong of the definition was added as a conjunct, reading cccap_caretaker_in_eligible_activity (CO-984, itself person-month, so there is no cycle - it reads no household fact), per the earlier review (docs/reviews/cccap-leap-phase-6.md, C-8, should-fix): the prior item implemented only age plus custody and deferred the activity prong to CO-984's own test, but CO-985 and CO-991 both used the truncated term as a live classifier, so a nineteen-year-old parent in no activity was still called a caretaker (denying the whole household on her inactivity) and her earnings were still excluded (they should not be, since she is not a teen parent under the full definition)."
