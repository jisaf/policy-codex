id: CO-5153
name: "CCCAP: the person has earned income"
identifier: cccap_has_earned_income
kind: derived
type: yes/no
scope: person-month
program: CCCAP
meaning: "Whether the person has wages or self-employment income for CCCAP: gross wages in the prior thirty days (cccap_person_gross_wages, CO-5152) or gross receipts from self-employment in the month (cccap_self_employment_gross_receipts, CO-5156). Read by the verification of earned income (cccap_requires_verification_of_earned_income, CO-1445; 8 CCR 1403-1 3.111.H.5.a) and of the hours worked (cccap_requires_verification_of_work_hours, CO-1684; 3.111.G.1.b)."
precision: "Earned-income records, step E1 (CCCAP): CCCAP's own reading of earned income from the earnings records (earnings, CO-5100), replacing its two readers' use of has_earned_income (CO-1356), a figure of program All over the scalar wages and business receipts (design 2.5: the shared item is dissolved into each program's own). Work-study counts here as the gross wage it is, as it did in has_earned_income; whether it must be verified is CO-1445's."
derived: [any, [">", cccap_person_gross_wages, 0], [">", cccap_self_employment_gross_receipts, 0]]
sources: [S486, S891, S1410]
implemented: engine
tags: [income, verification]
open: [OQ-680]
rationale: "Earned-income records, E1 (CCCAP): has_earned_income (CO-1356, program All) read wages_gross and self_employment_gross_receipts; CCCAP reads its earnings records, and its two verification items read this item instead."
tests:
  - {id: CO-5153-T1, title: "Wages in the month", as_of: "2026-11-01", month: "2026-11", given: {earnings: [{kind: wages, amount: 1200}]}, expect: true}
  - {id: CO-5153-T2, title: "Self-employment receipts only", as_of: "2026-11-01", month: "2026-11", given: {earnings: [{kind: self_employment_receipts, amount: 600, rental_property: false}]}, expect: true}
  - {id: CO-5153-T3, title: "No earnings", as_of: "2026-11-01", month: "2026-11", given: {earnings: []}, expect: false}
  - {id: CO-5153-T4, title: "Earnings not stated: cannot determine", as_of: "2026-11-01", month: "2026-11", given: {}, expect: unknown}
