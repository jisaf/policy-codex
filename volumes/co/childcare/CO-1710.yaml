id: CO-1710
name: "CCCAP: countable self-employment income"
identifier: cccap_self_employment_net_earnings
kind: derived
type: money
scope: person-month
program: CCCAP
meaning: "The person's countable self-employment income for the month under 8 CCR 1403-1 3.111.I.2: 'declared gross income minus verified business expenses' from self-employment, not below zero; or, while the self-employment is in its launch period, the projected income of 3.111.G.2.e, the federal minimum wage times the declared hours of self-employment."
precision: "A person with no gross receipts has none, whatever the cost fact says, unless in the launch period. Coverage round F-11: G.2.e: \"Projected income for the launch period shall be determined based upon the federal minimum wage times the number of declared hours worked\"; in the launch period (cccap_self_employment_in_launch_period, CO-2113, read as false when not stated) the income is federal_minimum_wage (CO-160) times self_employment_hours_worked (CO-4461; all of hours_worked when not stated), not the receipts (probe RV-H: $300 of receipts and 120 hours counted $300, fee $3; projected $870, fee $8). Coverage round F-20: farm self-employment (3.111.I.3, S3263) is read from the same neutral facts, the receipts stated without the farm products the family used (I.3.c); its operating expenses include the interest on farm debts (cccap_self_employment_business_expenses, CO-1709, with self_employment_is_farm_operation, CO-4465)."
derived: [case, [[otherwise, cccap_self_employment_in_launch_period, false], ["*", federal_minimum_wage, [otherwise, self_employment_hours_worked, hours_worked]]], [["<=", self_employment_gross_receipts, 0], 0], [else, [max, 0, ["-", self_employment_gross_receipts, cccap_self_employment_business_expenses]]]]
sources: [S1157, S1410, S3263]
implemented: engine
tags: [income]
rationale: "Vocabulary fix round (docs/reviews/vocabulary-reuse.md, R-1): gives self-employment this program's own reading; before, the program read one shared net figure, or none."
tests:
  - {id: CO-1710-T1, as_of: "2026-10-01", month: "2026-10", given: {self_employment_gross_receipts: 1500, cccap_self_employment_business_expenses: 400, earnings: [{kind: wages}, {kind: self_employment_receipts, amount: 1500}]}, expect: 1100}
  - {id: CO-1710-T2, as_of: "2026-10-01", month: "2026-10", title: "No self-employment - costs not read", given: {self_employment_gross_receipts: 0, earnings: [{kind: wages}]}, expect: 0}
  - {id: CO-1710-T3, as_of: "2026-10-01", month: "2026-10", title: "Costs above receipts", given: {self_employment_gross_receipts: 300, cccap_self_employment_business_expenses: 450, earnings: [{kind: wages}, {kind: self_employment_receipts, amount: 300}]}, expect: 0}
  # Coverage round F-11 (probe RV-H): a business under twelve months old in its launch period, $300 of receipts, 120 declared hours: $7.25 x 120 = $870 (G.2.e).
  - {id: CO-1710-T4, title: "F-11: launch period income is the federal minimum wage times the declared hours", as_of: "2026-11-01", month: "2026-11", given: {self_employment_gross_receipts: 300, hours_worked: 120, cccap_self_employment_in_launch_period: true, earnings: [{kind: wages}, {kind: self_employment_receipts, amount: 300}]}, expect: 870}
  # A caretaker with a wage job and a new business states the self-employment hours: $7.25 x 40 = $290.
  - {id: CO-1710-T5, title: "F-11: with a wage job, only the self-employment hours are projected", as_of: "2026-11-01", month: "2026-11", given: {self_employment_gross_receipts: 0, hours_worked: 160, self_employment_hours_worked: 40, cccap_self_employment_in_launch_period: true, earnings: [{kind: wages}, {kind: self_employment_receipts, amount: 0, hours: 40}]}, expect: 290}
