id: CO-1710
name: "CCCAP: countable self-employment income"
identifier: cccap_self_employment_net_earnings
kind: derived
type: money
scope: person-month
program: CCCAP
meaning: "The person's countable self-employment income for the month under 8 CCR 1403-1 3.111.I.2: 'declared gross income minus verified business expenses' from self-employment, not below zero; or, while the self-employment is in its launch period, the projected income of 3.111.G.2.e, the federal minimum wage times the declared hours of self-employment."
precision: "Earned-income records, step E1 (CCCAP; docs/reviews/records-earnings-care-energy.md): the gross receipts are cccap_self_employment_gross_receipts (CO-5156), and the declared hours of the launch period are the hours each self-employment record of the month states (hours, required where read), replacing self_employment_gross_receipts (CO-1700) and self_employment_hours_worked (CO-4461), which read all of hours_worked (CO-022) when not stated: G.2.e projects \"the number of declared hours worked\" in the business, and hours_worked holds a wage job's hours too, so the default could project a wage job's hours as self-employment (decision 4 of 2026-11-23: an unstated required field is cannot determine). A person with no gross receipts has none, whatever the cost records say, unless in the launch period. Coverage round F-11: G.2.e: \"Projected income for the launch period shall be determined based upon the federal minimum wage times the number of declared hours worked\"; in the launch period (cccap_self_employment_in_launch_period, CO-2113, read as false when not stated) the income is federal_minimum_wage (CO-160) times self_employment_hours_worked (CO-4461; all of hours_worked when not stated), not the receipts (probe RV-H: $300 of receipts and 120 hours counted $300, fee $3; projected $870, fee $8). Coverage round F-20: farm self-employment (3.111.I.3, S3263) is read from the same neutral facts, the receipts stated without the farm products the family used (I.3.c); its operating expenses include the interest on farm debts (cccap_self_employment_business_expenses, CO-1709, with self_employment_is_farm_operation, CO-4465). Coverage pass 4 C4-3: the declared hours are cccap_self_employment_hours (CO-6404), the item cccap_caretaker_in_eligible_activity (CO-984) also reads, instead of the same sum written here. Coverage pass 5, C5-5 (docs/reviews/coverage5-care-energy.md): a business in its launch period that has no receipts yet states a self-employment record of amount 0 with the month's declared hours (hours), since the hours are read from the month's self-employment records (cccap_self_employment_hours, CO-6404) and a caretaker with no such record has no business for G.2.e to project (S1410)."
derived: ["case", [["otherwise", "cccap_self_employment_in_launch_period", false], ["*", "federal_minimum_wage", "cccap_self_employment_hours"]], [["<=", "cccap_self_employment_gross_receipts", 0], 0], ["else", ["max", 0, ["-", "cccap_self_employment_gross_receipts", "cccap_self_employment_business_expenses"]]]]
sources: [S1157, S1410, S3263]
implemented: engine
tags: [income]
open: [OQ-680]
rationale: "Vocabulary fix round (docs/reviews/vocabulary-reuse.md, R-1): gives self-employment this program's own reading; before, the program read one shared net figure, or none."
tests:
  - {id: CO-1710-T1, as_of: "2026-10-01", month: "2026-10", given: {cccap_self_employment_business_expenses: 400, earnings: [{kind: self_employment_receipts, amount: 1500, rental_property: false}]}, expect: 1100}
  - {id: CO-1710-T2, as_of: "2026-10-01", month: "2026-10", title: "No self-employment - costs not read", given: {earnings: [{kind: wages, amount: 1000}]}, expect: 0}
  - {id: CO-1710-T3, as_of: "2026-10-01", month: "2026-10", title: "Costs above receipts", given: {cccap_self_employment_business_expenses: 450, earnings: [{kind: self_employment_receipts, amount: 300, rental_property: false}]}, expect: 0}
  # Coverage round F-11 (probe RV-H): a business under twelve months old in its launch period, $300 of receipts, 120 declared hours: $7.25 x 120 = $870 (G.2.e).
  - {id: CO-1710-T4, title: "F-11: launch period income is the federal minimum wage times the declared hours", as_of: "2026-11-01", month: "2026-11", given: {cccap_self_employment_in_launch_period: true, earnings: [{kind: self_employment_receipts, amount: 300, hours: 120}]}, expect: 870}
  # A caretaker with a wage job and a new business states the self-employment hours: $7.25 x 40 = $290.
  - {id: CO-1710-T5, title: "F-11: with a wage job, only the self-employment hours are projected", as_of: "2026-11-01", month: "2026-11", given: {hours_worked: 160, cccap_self_employment_in_launch_period: true, earnings: [{kind: wages, amount: 1600}, {kind: self_employment_receipts, amount: 0, hours: 40, rental_property: false}]}, expect: 290}
  - {id: CO-1710-T6, title: "Decision 4: in the launch period with the business's hours not stated: cannot determine (hours_worked is not read)", as_of: "2026-11-01", month: "2026-11", given: {hours_worked: 160, cccap_self_employment_in_launch_period: true, earnings: [{kind: wages, amount: 1600}, {kind: self_employment_receipts, amount: 300}]}, expect: unknown}
