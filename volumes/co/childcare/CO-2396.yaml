id: CO-2396
name: "CCCAP: unrelated caretaker verification outstanding"
identifier: cccap_unrelated_caretaker_verification_is_outstanding
kind: derived
type: yes/no
scope: person
program: CCCAP
meaning: "This person is an individual unrelated to an eligible child who acts as the child's primary adult caretaker, and has not yet provided the verification from the child's biological or adoptive parent, legal guardian, or a court order identifying the person as the child's adult caretaker (8 CCR 1403-1 3.111.D.5)."
precision: "If not stated, CCCAP reads this as false (the person is related to the child, or the verification is in hand)."
derived: [all, [exists, [filter, [persons], [rel, [has_primary_responsibility_for], [P]]], [not, [in_group, [P], is_related_to]]], [not, [otherwise, cccap_unrelated_caretaker_verification_received, false]]]
sources: [S1637]
implemented: engine
tags: [verification]
rationale: "OQ-378: 3.111.C.2 and the paragraphs it points to (S1637) require this verification; no fact stated it, so the worker carried it outside the volume. Whether a caretaker is unrelated turns on kinship the relationship roles do not carry, so the requirement and its receipt are stated together. Same-word audit SW-5: derived from the primary-responsibility role, the neutral is_related_to (CO-2845) and the verification record (CO-2846)."
tests:
  - {id: CO-2396-T1, title: "A family friend caring for the child, no verification yet", as_of: "2026-11-01", given: {}, others: {p2: {}}, relationships: [[has_primary_responsibility_for, p1, p2]], expect: true}
  - {id: CO-2396-T2, title: "The child's aunt", as_of: "2026-11-01", given: {}, others: {p2: {}}, relationships: [[has_primary_responsibility_for, p1, p2], [other_relative, p1, p2]], expect: false}
  - {id: CO-2396-T3, title: "Verification received", as_of: "2026-11-01", given: {cccap_unrelated_caretaker_verification_received: true}, others: {p2: {}}, relationships: [[has_primary_responsibility_for, p1, p2]], expect: false}
