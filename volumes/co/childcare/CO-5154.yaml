id: CO-5154
name: "CCCAP: requires verification of the activity schedule"
identifier: cccap_requires_verification_of_activity_schedule
kind: derived
type: yes/no
scope: person-month
program: CCCAP
meaning: "Whether CCCAP requires this person's work or low-income activity schedule: non-traditional care hours are requested (8 CCR 1403-1 3.111.C.2.e, S1637), or the person is an adult caretaker or teen parent with self-employment income, who submits the expected weekly employment schedule with approximate hours and the documentation of income and work-related expenses (3.111.G.2.a-b)."
precision: "cccap_non_traditional_hours_are_requested (CO-2397) is read as false when not stated, as the count items read it. The self-employment income is the month's gross receipts (cccap_self_employment_gross_receipts, CO-5156; earned-income records, step E1). One item for the condition the required and pending counts both wrote (duplicate-paths audit D-K2, docs/reviews/duplicate-paths-audit.md): cccap_person_required_verification_count (CO-1447) counts it and cccap_activity_schedule_verification_is_pending (CO-5155) reads it, as each other element has its requirement and its pending flag."
derived: [any, [otherwise, cccap_non_traditional_hours_are_requested, false], [all, [any, cccap_is_adult_caretaker, cccap_is_teen_parent], [">", cccap_self_employment_gross_receipts, 0]]]
sources: [S1637, S891]
implemented: engine
tags: [verification]
rationale: "Duplicate-paths audit D-K2 (step 5): the activity-schedule condition was written in both count items; it is one requirement now, with its pending flag."
tests:
  - {id: CO-5154-T1, title: "A self-employed adult caretaker", as_of: "2026-10-01", month: "2026-10", given: {cccap_is_adult_caretaker: true, cccap_is_teen_parent: false, cccap_non_traditional_hours_are_requested: false, earnings: [{kind: self_employment_receipts, amount: 900}]}, expect: true}
  - {id: CO-5154-T2, title: "Non-traditional hours requested by a wage earner", as_of: "2026-10-01", month: "2026-10", given: {cccap_is_adult_caretaker: true, cccap_non_traditional_hours_are_requested: true, earnings: [{kind: wages, amount: 1500}]}, expect: true}
  - {id: CO-5154-T3, title: "A wage earner, traditional hours", as_of: "2026-10-01", month: "2026-10", given: {cccap_is_adult_caretaker: true, cccap_is_teen_parent: false, cccap_non_traditional_hours_are_requested: false, earnings: [{kind: wages, amount: 1500}]}, expect: false}
  - {id: CO-5154-T4, title: "A child with no requested hours", as_of: "2026-10-01", month: "2026-10", given: {cccap_is_adult_caretaker: false, cccap_is_teen_parent: false}, expect: false}
