id: CO-1440
name: "CCCAP: requires verification of residency"
identifier: cccap_requires_verification_of_residency
kind: derived
type: yes/no
scope: person-month
program: CCCAP
meaning: "Whether the person's residence must be verified for CCCAP: every adult caretaker and teen parent must be a verified resident of the county (3.111.A), except in a family experiencing homelessness during its stabilization period, which self-declares residency (3.121.B.4), a Protective Services or Child Welfare Child Care household, for which the county with the open child welfare case is the county of residence (3.119.E, 3.120.E), and a caretaker referred for Colorado Works Child Care, whose residency the Colorado Works program verifies (3.116.E)."
precision: "Final pass F-02 and F-17. The stabilization period is cccap_is_in_homelessness_stabilization (CO-3907); Child Welfare Child Care (CO-2576) is read as false when not stated; the protective services case and the Colorado Works referral are stated for the case and every caretaker (CO-873, CO-896). Coverage pass 3 C3-3: the referral is read over the household (as cccap_household_unearned_income, CO-2873, reads it), so a second caretaker in the Colorado Works unit who is not stated as referred is not asked for CCCAP documents either; before the fix he was (probe Y-2)."
derived: [all, [any, cccap_is_adult_caretaker, cccap_is_teen_parent], [not, cccap_is_in_homelessness_stabilization], [not, [otherwise, cccap_is_child_welfare_child_care_household, false]], [not, is_protective_services_child_care_case], [not, [exists, cccap_household_members, [otherwise, [of, [P], is_referred_for_colorado_works_child_care], false]]]]
sources: [S890, S488, S2709, S2710, S2707]
implemented: engine
tags: [verification, household]
rationale: No existing item states this CCCAP verification requirement; the phase-9 chapter needs it to count the household's pending verifications.
tests:
  - {id: CO-1440-T1, month: "2026-10", as_of: "2026-10-01", given: {cccap_household_members: [p1], cccap_is_adult_caretaker: true, is_protective_services_child_care_case: false, is_referred_for_colorado_works_child_care: false}, expect: true}
  - {id: CO-1440-T2, month: "2026-10", as_of: "2026-10-01", given: {cccap_household_members: [p1], cccap_is_adult_caretaker: false, cccap_is_teen_parent: true, is_protective_services_child_care_case: false, is_referred_for_colorado_works_child_care: false}, expect: true}
  - {id: CO-1440-T3, month: "2026-10", as_of: "2026-10-01", given: {cccap_is_adult_caretaker: false, cccap_is_teen_parent: false}, expect: false}
  - {id: CO-1440-T4, title: "F-02: a family in a shelter during its stabilization period self-declares residency (3.121.B.4)", month: "2026-10", as_of: "2026-10-01", given: {cccap_is_adult_caretaker: true, cccap_is_in_homelessness_stabilization: true}, expect: false}
  - {id: CO-1440-T5, title: "F-17: a protective services household (3.119.E)", month: "2026-10", as_of: "2026-10-01", given: {cccap_is_adult_caretaker: true, is_protective_services_child_care_case: true}, expect: false}
