id: CO-1440
name: "CCCAP: requires verification of residency"
identifier: cccap_requires_verification_of_residency
kind: derived
type: yes/no
scope: person-month
program: CCCAP
meaning: "Whether the person's residence must be verified for CCCAP: every adult caretaker and teen parent must be a verified resident of the county (3.111.A), except in a family experiencing homelessness during its stabilization period, which self-declares residency (3.121.B.4), a Protective Services or Child Welfare Child Care household, for which the county with the open child welfare case is the county of residence (3.119.E, 3.120.E), and a caretaker referred for Colorado Works Child Care, whose residency the Colorado Works program verifies (3.116.E)."
precision: "Final pass F-02 and F-17. The stabilization period is cccap_is_in_homelessness_stabilization (CO-3907); Child Welfare Child Care (CO-2576) is read as false when not stated; the protective services case and the Colorado Works referral are stated for the case and every caretaker (CO-873, CO-896). Coverage pass 3 C3-3: the referral is read over the household (as cccap_household_unearned_income, CO-2873, reads it), so a second caretaker in the Colorado Works unit who is not stated as referred is not asked for CCCAP documents either; before the fix he was (probe Y-2). Coverage pass 5, X5-3 (docs/reviews/coverage5-care-energy.md; OQ-134): a Colorado Works Child Care household is read as the eligibility reader reads it, cccap_colorado_works_child_care_eligible (CO-988), which reads the county Colorado Works worker's referral (is_referred_for_colorado_works_child_care, CO-896) with no default, for a caretaker who receives Colorado Works and is work-eligible or a diversion household (8 CCR 1403-1 3.116.A, H; 3.116.C-F, S3637: the county Colorado Works program verifies county residency and the children's citizenship, age and identity, and reports the earned income). Before, these readers read the referral of any member as not referred when not stated, so an unstated referral asked a Colorado Works Child Care household for the verifications Colorado Works supplies."
derived: ["all", ["any", "cccap_is_adult_caretaker", "cccap_is_teen_parent"], ["not", "cccap_is_in_homelessness_stabilization"], ["not", ["otherwise", "cccap_is_child_welfare_child_care_household", false]], ["not", "is_protective_services_child_care_case"], ["not", "cccap_colorado_works_child_care_eligible"]]
sources: [S890, S488, S2709, S2710, S2707, S3637]
open: [OQ-134]
implemented: engine
tags: [verification, household]
rationale: No existing item states this CCCAP verification requirement; the phase-9 chapter needs it to count the household's pending verifications.
tests:
  # Coverage pass 5, X5-3: the tests state the Colorado Works Child Care household (cccap_colorado_works_child_care_eligible, CO-988) in place of a member's referral, which these items no longer read; no expectation changed.
