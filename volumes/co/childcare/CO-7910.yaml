open: [OQ-1515, OQ-1366]
rationale: "KL-CE-1 (coverage pass 7, R7-3): one rental property managed under twenty hours a week could not be stated so that both CCCAP and LEAP read its costs right; CCCAP now reads the rental business's own cost records against its rents, so the costs are stated once, neutrally, for both programs."
nearest: [CO-7251, CO-1709, CO-4463]
tests:
  # KL-CE-1. November 2026 has 30 days: 30 / 7 = 4.2857 weeks. Every record is a stream (no month, no date), read in the month.
  # CR2's rental (docs/reviews/coverage7-care-energy.md, R7-3): 43 hours, 43 / 4.2857 = 10.03 a week, under twenty, so its rents are
  # unearned (3.111.H.4.e) and its mortgage interest $200 and repairs $100 are taken against them: 200 + 100 = 300.
  - {id: CO-7910-T1, title: "KL-CE-1: a rental managed 43 hours in November (10.03 a week): its interest $200 and repairs $100 are its costs: 300", month: "2026-11", as_of: "2026-11-15", given: {earnings: [{kind: self_employment_receipts, amount: 1800, hours: 43, rental_property: true, job: job_1}, {kind: business_cost_interest, amount: 200, job: job_1, property_maintenance: false}, {kind: business_cost_operating, amount: 100, job: job_1, property_maintenance: true}]}, expect: 300}
  # 90 hours: 90 / 4.2857 = 21 a week, at least twenty: self-employment (3.111.H.4.e); its costs are CO-1709's: 0 here.
  - {id: CO-7910-T2, title: "KL-CE-1: the same rental managed 90 hours (21 a week) is self-employment: 0 here", month: "2026-11", as_of: "2026-11-15", given: {earnings: [{kind: self_employment_receipts, amount: 1800, hours: 90, rental_property: true, job: job_1}, {kind: business_cost_interest, amount: 200, job: job_1, property_maintenance: false}, {kind: business_cost_operating, amount: 100, job: job_1, property_maintenance: true}]}, expect: 0}
  # A cleaning business (job_2, 100 hours, not rental) beside the rental (job_1, 43 hours): the line is the rental's 43 hours
  # (CO-7254, 10.03 a week); only the rental's own cost, $100, is taken against its rents; the cleaning business's $150 is CO-1709's.
  - {id: CO-7910-T3, title: "KL-CE-1: a rental (job_1) and a cleaning business (job_2): only the rental's $100 is taken against its rents", month: "2026-11", as_of: "2026-11-15", given: {earnings: [{kind: self_employment_receipts, amount: 2000, hours: 100, rental_property: false, job: job_2}, {kind: business_cost_operating, amount: 150, job: job_2}, {kind: self_employment_receipts, amount: 1800, hours: 43, rental_property: true, job: job_1}, {kind: business_cost_operating, amount: 100, job: job_1}]}, expect: 100}
  # Principal $400 and depreciation $50 are not taken (CO-4458; OQ-1515); the interest $200 is: 200.
  - {id: CO-7910-T4, title: "KL-CE-1: payments on the principal and depreciation are not taken; the interest is: 200", month: "2026-11", as_of: "2026-11-15", given: {earnings: [{kind: self_employment_receipts, amount: 1800, hours: 43, rental_property: true, job: job_1}, {kind: business_cost_capital_principal, amount: 400, job: job_1}, {kind: business_cost_depreciation, amount: 50, job: job_1}, {kind: business_cost_interest, amount: 200, job: job_1}]}, expect: 200}
  # No business is rental property: no cost is a rental's, and no record's job is read: 0.
  - {id: CO-7910-T5, title: "KL-CE-1: no rental property: 0, the cost's job not read", month: "2026-11", as_of: "2026-11-15", given: {earnings: [{kind: self_employment_receipts, amount: 1800, hours: 43, rental_property: false}, {kind: business_cost_operating, amount: 100}]}, expect: 0}
  # Decision 4: a rental under the line and a cost that does not name its business: cannot determine.
  - {id: CO-7910-T6, title: "KL-CE-1, decision 4: a rental under the line and a cost record with no job: cannot determine", month: "2026-11", as_of: "2026-11-15", given: {earnings: [{kind: self_employment_receipts, amount: 1800, hours: 43, rental_property: true, job: job_1}, {kind: business_cost_operating, amount: 100}]}, expect: unknown}
