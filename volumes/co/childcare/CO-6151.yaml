id: CO-6151
name: "CCCAP: a person's irregular earnings in the calendar quarter"
identifier: cccap_irregular_earnings_in_quarter
kind: derived
type: money
scope: person-month
program: CCCAP
meaning: "The person's irregular earnings that CCCAP counts (cccap_irregular_earnings, CO-6150) over the calendar quarter (January-March, April-June, July-September, October-December) that contains the month, each month's added: with the irregular receipts of the quarter (cccap_irregular_receipts_in_quarter, CO-5724), the total 8 CCR 1403-1 3.111.J.28 compares with ninety dollars (\"Irregular income in the certification period that totals less than ninety dollars ($90) in any calendar quarter\")."
precision: "Earned-income records, step E1 (CCCAP; finding E1-C3). The quarter is found from the month's calendar number exactly as cccap_irregular_receipts_in_quarter (CO-5724) finds it, and each month's earnings are summed in that month. Read by cccap_person_earned_income (CO-3915), cccap_other_countable_receipts (CO-4464) and cccap_excluded_irregular_income (CO-4076)."
derived: [sum_months, [months_from_to, [months_before, ["-", ["-", [month_of_year, [month]], 1], ["*", 3, ["-", 0, [ceil, ["-", 0, ["/", ["-", [month_of_year, [month]], 1], 3]]]]]], [month]], [months_after, ["-", 2, ["-", ["-", [month_of_year, [month]], 1], ["*", 3, ["-", 0, [ceil, ["-", 0, ["/", ["-", [month_of_year, [month]], 1], 3]]]]]]], [month]]], [at, cccap_irregular_earnings, [that_month]]]
sources: [S2858]
implemented: engine
tags: [income]
open: [OQ-713]
rationale: "Earned-income records, E1 (CCCAP): J.28's quarterly total pools irregular income, earned and unearned."
tests:
  # Odd jobs of $30 in October and $40 in November 2026, evaluated in December (the October-December quarter): $30 + $40 = $70.
  - {id: CO-6151-T1, title: "Two odd jobs in the quarter", as_of: "2026-12-01", month: "2026-12", given: {earnings: [{kind: wages, amount: 30, irregular: true, month: "2026-10"}, {kind: wages, amount: 40, irregular: true, month: "2026-11"}]}, expect: 70}
  # The September odd job ($50) is in the July-September quarter, not October-December's: $40.
  - {id: CO-6151-T2, title: "An odd job in the quarter before is not added", as_of: "2026-11-01", month: "2026-11", given: {earnings: [{kind: wages, amount: 50, irregular: true, month: "2026-09"}, {kind: wages, amount: 40, irregular: true, month: "2026-11"}]}, expect: 40}
