id: CO-1290
name: "CCCAP: parent fee"
identifier: cccap_parent_fee
kind: derived
type: money
scope: person-month
program: CCCAP
role: outcome
meaning: The monthly parent fee (co-payment) an eligible CCCAP household pays its child care provider - the formula amount, reduced by cccap_quality_rating_fee_reduction_rate (CO-3002) when a top-three quality-rated provider is used and assessed at cccap_part_time_care_fee_rate (CO-3003) of it when all children are in part-time care, in whole dollars with the cents dropped - or nothing for a household that is not eligible, a Child Welfare Child Care household, a family experiencing homelessness during its stabilization period, a teen-parent household whose fee the county waived for hardship, a household with no income (a protective services household whose children have no countable income included), or a Colorado Works household whose caretakers have no paid employment, per 8 CCR 1403-1 3.124.A, H, I, P and U.
precision: "CDHS review C-7: 3.124.I.1 (teen-parent hardship waiver, cccap_teen_parent_fee_waiver_granted, CO-2575), I.4 (Child Welfare Child Care, CO-2576) and I.5 (homelessness stabilization period, CO-2577) are applied, each read as false when not stated; a protective services household pays the formula fee on its children's countable income when they have any (I.6, cccap_parent_fee_income, CO-2578), and nothing otherwise. The county-discretion waivers of dual Head Start enrollment, disaster and the $5 hardship reduction (3.124.G, I.8, S, X) are not modeled. A Colorado Works household is read as having no paid employment when no household member has earned or self-employment income."
derived: [case, [[not, [in, cccap_eligibility_status, [eligible_low_income, eligible_colorado_works, eligible_protective_services]]], 0], [[otherwise, cccap_is_child_welfare_child_care_household, false], 0], [[otherwise, cccap_is_in_homelessness_stabilization_period, false], 0], [[otherwise, cccap_teen_parent_fee_waiver_granted, false], 0], [["<=", cccap_parent_fee_income, 0], 0], [[all, ["=", cccap_eligibility_status, eligible_colorado_works], ["=", [sum, cccap_household_members, ["+", [of, [P], wages_gross], [of, [P], cccap_self_employment_net_earnings]]], 0]], 0], [else, ["-", 0, [ceil, ["-", 0, ["*", cccap_parent_fee_formula_amount, ["*", [case, [uses_top_quality_rated_provider, ["-", 1, cccap_quality_rating_fee_reduction_rate]], [else, 1]], [case, [all_children_in_part_time_care, cccap_part_time_care_fee_rate], [else, 1]]]]]]]]]
sources: [S782, S783, S784, S785, S787, S1823]
open: [OQ-254, OQ-536]
implemented: engine
tags: [income]
rationale: "No existing item computes what a CCCAP household pays; the parent fee is the program's cost-sharing outcome (the brief's cccap_parent_fee). Same case-with-exceptions shape as the other program outcomes. Hard-coded numbers audit H-4: the 3.124.H reduction and the 3.124.U share were literals (0.8, 0.55); they are cccap_quality_rating_fee_reduction_rate (CO-3002) and cccap_part_time_care_fee_rate (CO-3003)."
tests:
  - {id: CO-1290-T1, as_of: "2026-10-01", month: "2026-10", given: {cccap_eligibility_status: eligible_low_income, cccap_parent_fee_income: 3750, cccap_parent_fee_formula_amount: 192.5, uses_top_quality_rated_provider: false, all_children_in_part_time_care: false}, expect: 192}
  - {id: CO-1290-T2, title: "Quality-rated provider (x0.8) and part-time care (x0.55)", as_of: "2026-10-01", month: "2026-10", given: {cccap_eligibility_status: eligible_low_income, cccap_parent_fee_income: 3750, cccap_parent_fee_formula_amount: 192.5, uses_top_quality_rated_provider: true, all_children_in_part_time_care: true}, expect: 84}
  - {id: CO-1290-T3, title: "No income, no fee", as_of: "2026-10-01", month: "2026-10", given: {cccap_eligibility_status: eligible_low_income, cccap_parent_fee_income: 0}, expect: 0}
  - {id: CO-1290-T4, title: "Protective services household whose children have no countable income (3.124.I.6)", as_of: "2026-10-01", month: "2026-10", given: {cccap_eligibility_status: eligible_protective_services, cccap_parent_fee_income: 0}, expect: 0}
  - {id: CO-1290-T5, title: "Colorado Works household in a non-paid work activity", as_of: "2026-10-01", month: "2026-10", given: {cccap_eligibility_status: eligible_colorado_works, cccap_parent_fee_income: 300, cccap_household_members: [p1], wages_gross: 0, self_employment_gross_receipts: 0, self_employment_net_earnings_for_tax: 0}, expect: 0}
  - {id: CO-1290-T6, title: "Not eligible", as_of: "2026-10-01", month: "2026-10", given: {cccap_eligibility_status: ineligible_income}, expect: 0}
  - {id: CO-1290-T7, title: "C-7: a protective services household whose foster child has $300 of countable income pays the formula fee (3.124.I.6)", as_of: "2026-10-01", month: "2026-10", given: {cccap_eligibility_status: eligible_protective_services, cccap_parent_fee_income: 300, cccap_parent_fee_formula_amount: 3, uses_top_quality_rated_provider: false, all_children_in_part_time_care: false}, expect: 3}
  - {id: CO-1290-T8, title: "C-7: Child Welfare Child Care (I.4)", as_of: "2026-10-01", month: "2026-10", given: {cccap_eligibility_status: eligible_low_income, cccap_is_child_welfare_child_care_household: true}, expect: 0}
  - {id: CO-1290-T9, title: "C-7: homelessness stabilization period (I.5)", as_of: "2026-10-01", month: "2026-10", given: {cccap_eligibility_status: eligible_low_income, cccap_is_in_homelessness_stabilization_period: true}, expect: 0}
  - {id: CO-1290-T10, title: "C-7: teen-parent hardship waiver (I.1)", as_of: "2026-10-01", month: "2026-10", given: {cccap_eligibility_status: eligible_low_income, cccap_teen_parent_fee_waiver_granted: true}, expect: 0}
