id: CO-1290
name: "CCCAP: parent fee"
identifier: cccap_parent_fee
kind: derived
type: money
scope: person-month
program: CCCAP
role: outcome
meaning: The monthly parent fee (co-payment) an eligible CCCAP household pays its child care provider - the formula amount, reduced by cccap_quality_rating_fee_reduction_rate (CO-3002) when a top-three quality-rated provider is used and assessed at cccap_part_time_care_fee_rate (CO-3003) of it when all children are in part-time care, in whole dollars with the cents dropped, and no more than $5 while a county hardship reduction is in force (3.124.S) - or nothing for a household that is not eligible, a Child Welfare Child Care household, a family experiencing homelessness during its stabilization period, a teen-parent household whose fee the county waived for hardship, a household whose fee the county waived for dual Head Start enrollment, a declared disaster or teen-parent hardship (3.124.G, I.8, X), a household with no income (a protective services household whose children have no countable income included), or a Colorado Works household whose caretakers have no paid employment, per 8 CCR 1403-1 3.124.A, G, H, I, P, S, U and X.
precision: "CDHS review C-7: 3.124.I.1 (teen-parent hardship waiver, cccap_teen_parent_fee_waiver_granted, CO-2575), I.4 (Child Welfare Child Care, CO-2576) and I.5 (homelessness stabilization period, CO-2577) are applied, each read as false when not stated; a protective services household pays the formula fee on its children's countable income when they have any (I.6, cccap_parent_fee_income, CO-2578), and nothing otherwise. The county-discretion waivers of dual Head Start enrollment, a declared disaster and teen-parent hardship (3.124.G, I.8, X; cccap_parent_fee_waived_by_county, CO-3505) and the $5 hardship reduction (3.124.S; cccap_parent_fee_hardship_reduction_approved, CO-3506, and cccap_parent_fee_hardship_reduced_amount, CO-3507) are applied, each read as false when not stated (OQ-254). The formula fee after the quality and part-time reductions is cccap_parent_fee_assessed (CO-3508). A Colorado Works household is read as having no paid employment when no household member has earned or self-employment income (earned-income records, step E1: gross wages are cccap_person_gross_wages, CO-5152, from the earnings records, replacing wages_gross). Final pass F-02 and F-03: a Child Welfare Child Care household and a family experiencing homelessness in its stabilization period now have their own eligibility statuses (eligible_child_welfare, eligible_homelessness_stabilization), so the I.4 and I.5 rows are reached; the stabilization test is cccap_is_in_homelessness_stabilization (CO-3907). Second-pass review N-1: at a change during the eligibility period or a transition from Colorado Works the assessed fee is capped at the fee last determined (cccap_parent_fee_within_period_cap, CO-4052; 3.124.B-C, 3.117.F)."
derived: [case, [[not, [in, cccap_eligibility_status, [eligible_low_income, eligible_colorado_works, eligible_protective_services, eligible_child_welfare, eligible_homelessness_stabilization]]], 0], [[otherwise, cccap_is_child_welfare_child_care_household, false], 0], [cccap_is_in_homelessness_stabilization, 0], [[otherwise, cccap_teen_parent_fee_waiver_granted, false], 0], [[otherwise, cccap_parent_fee_waived_by_county, false], 0], [["<=", cccap_parent_fee_income, 0], 0], [[all, ["=", cccap_eligibility_status, eligible_colorado_works], ["=", [sum, cccap_household_members, ["+", [of, [P], cccap_person_gross_wages], [of, [P], cccap_self_employment_net_earnings]]], 0]], 0], [else, [case, [[otherwise, cccap_parent_fee_hardship_reduction_approved, false], [min, cccap_parent_fee_hardship_reduced_amount, cccap_parent_fee_within_period_cap]], [else, cccap_parent_fee_within_period_cap]]]]
sources: [S782, S783, S784, S785, S787, S1823, S2302, S2850, S2851]
open: [OQ-254, OQ-536, OQ-712]
implemented: engine
tags: [income]
rationale: "No existing item computes what a CCCAP household pays; the parent fee is the program's cost-sharing outcome (the brief's cccap_parent_fee). Same case-with-exceptions shape as the other program outcomes. Hard-coded numbers audit H-4: the 3.124.H reduction and the 3.124.U share were literals (0.8, 0.55); they are cccap_quality_rating_fee_reduction_rate (CO-3002) and cccap_part_time_care_fee_rate (CO-3003)."
