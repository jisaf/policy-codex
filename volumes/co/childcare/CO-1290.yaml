id: CO-1290
name: "CCCAP: parent fee"
identifier: cccap_parent_fee
kind: derived
type: money
scope: person-month
program: CCCAP
role: outcome
meaning: The monthly parent fee (co-payment) an eligible CCCAP household pays its child care provider - the formula amount, reduced by 20% when a top-three quality-rated provider is used and to 55% when all children are in part-time care, in whole dollars with the cents dropped - or nothing for a household with no income, a protective services household, a Colorado Works household whose caretakers have no paid employment, or a household that is not eligible, per 8 CCR 1403-1 3.124.A, H, I, P and U.
precision: "The county-discretion waivers (dual Head Start enrollment, teen-parent hardship, disaster, the $5 hardship reduction; 3.124.G, I.1, I.8, S, X) and the homelessness stabilization period (I.5) are not modeled; a protective services household's fee where a child has countable income (I.6) is read as zero because the volume does not separate child income for that program (OQ-254). A Colorado Works household is read as having no paid employment when no household member has earned or self-employment income."
derived: [case, [[not, [in, cccap_eligibility_status, [eligible_low_income, eligible_colorado_works, eligible_protective_services]]], 0], [[<=, cccap_household_income, 0], 0], [[=, cccap_eligibility_status, eligible_protective_services], 0], [[all, [=, cccap_eligibility_status, eligible_colorado_works], [=, [sum, cccap_household_members, [+, [of, [P], wages_gross], [of, [P], cccap_self_employment_net_earnings]]], 0]], 0], [else, ["-", 0, [ceil, ["-", 0, ["*", cccap_parent_fee_formula_amount, ["*", [case, [uses_top_quality_rated_provider, 0.8], [else, 1]], [case, [all_children_in_part_time_care, 0.55], [else, 1]]]]]]]]]
sources: [S782, S783, S784, S785, S787]
open: [OQ-254]
implemented: engine
tags: [income]
rationale: No existing item computes what a CCCAP household pays; the parent fee is the program's cost-sharing outcome (the brief's cccap_parent_fee). Same case-with-exceptions shape as the other program outcomes.
tests:
  - {id: CO-1290-T1, as_of: "2026-10-01", month: "2026-10", given: {cccap_eligibility_status: eligible_low_income, cccap_household_income: 3750, cccap_parent_fee_formula_amount: 192.5, uses_top_quality_rated_provider: false, all_children_in_part_time_care: false}, expect: 192}
  - {id: CO-1290-T2, title: "Quality-rated provider (x0.8) and part-time care (x0.55)", as_of: "2026-10-01", month: "2026-10", given: {cccap_eligibility_status: eligible_low_income, cccap_household_income: 3750, cccap_parent_fee_formula_amount: 192.5, uses_top_quality_rated_provider: true, all_children_in_part_time_care: true}, expect: 84}
  - {id: CO-1290-T3, title: "No income, no fee", as_of: "2026-10-01", month: "2026-10", given: {cccap_eligibility_status: eligible_low_income, cccap_household_income: 0}, expect: 0}
  - {id: CO-1290-T4, title: "Protective services household", as_of: "2026-10-01", month: "2026-10", given: {cccap_eligibility_status: eligible_protective_services, cccap_household_income: 1500}, expect: 0}
  - {id: CO-1290-T5, title: "Colorado Works household in a non-paid work activity", as_of: "2026-10-01", month: "2026-10", given: {cccap_eligibility_status: eligible_colorado_works, cccap_household_income: 300, cccap_household_members: [p1], wages_gross: 0, self_employment_gross_receipts: 0, self_employment_net_earnings_for_tax: 0}, expect: 0}
  - {id: CO-1290-T6, title: "Not eligible", as_of: "2026-10-01", month: "2026-10", given: {cccap_eligibility_status: ineligible_income}, expect: 0}
