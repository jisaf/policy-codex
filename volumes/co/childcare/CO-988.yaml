id: CO-988
name: "CCCAP: Colorado Works child care eligible"
identifier: cccap_colorado_works_child_care_eligible
kind: derived
type: yes/no
scope: person-month
program: CCCAP
meaning: This adult caretaker or teen parent is eligible for Colorado Works Child Care under 8 CCR 1403-1 3.115.A, 3.116.A - determined work eligible per Colorado Works and receiving Colorado Works basic cash assistance.
precision: Reads Colorado Works' own eligibility outcome and grant amount for this same person (cross-program), rather than re-deriving Colorado Works work-eligibility here.
derived: [any, ["=", cw_eligibility_status, eligible], [">", cw_grant_amount, 0]]
sources: [S487]
implemented: engine
tags: [household]
rationale: No existing item cross-reads Colorado Works into CCCAP; cccap_eligibility_status (CO-989) reads it to route a Colorado Works household to Colorado Works Child Care ahead of the Low-Income determination, per 3.111.D.6.
tests:
  - {id: CO-988-T1, as_of: "2026-10-01", month: "2026-10", given: {cw_eligibility_status: eligible, cw_grant_amount: 488}, expect: true}
  - {id: CO-988-T2, as_of: "2026-10-01", month: "2026-10", given: {cw_eligibility_status: ineligible_income, cw_grant_amount: 0}, expect: false}
