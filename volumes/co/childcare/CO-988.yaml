id: CO-988
name: "CCCAP: Colorado Works child care eligible"
identifier: cccap_colorado_works_child_care_eligible
kind: derived
type: yes/no
scope: person-month
program: CCCAP
meaning: This adult caretaker or teen parent is eligible for Colorado Works Child Care under 8 CCR 1403-1 3.115.A, 3.116.A - determined work eligible per Colorado Works, receiving Colorado Works basic cash assistance, and referred for child care by the county Colorado Works worker.
precision: "\"Approved for Colorado Works and ... determined work eligible per Colorado Works rule\" (3.115.A) and \"referred for child care by the county Colorado Works worker\" (3.116.A) are decisions in the Colorado Works case, read from its records: receives_tanf_cash (CO-013, the unit receives or is authorized to receive basic cash assistance), is_work_eligible_individual_in_tanf_case (CO-2709) and is_referred_for_colorado_works_child_care (CO-896). This volume's own Colorado Works determination is not re-run for CCCAP (convention rule 11). Per 3.111.D.6, a caretaker or teen parent caring for a child receiving Colorado Works cash assistance who is not determined work eligible falls through to the Low-Income Child Care determination instead of this branch, rather than being denied outright. Phase-10 sweep: the referral, financially-contributing and activity facts are read without a default; a case states them (OQ-134, OQ-135, OQ-157, OQ-395)."
derived: [all, receives_tanf_cash, is_work_eligible_individual_in_tanf_case, is_referred_for_colorado_works_child_care]
sources: [S487, S511]
implemented: engine
tags: [household]
rationale: "No existing item cross-reads Colorado Works into CCCAP; cccap_eligibility_status (CO-989) reads it to route a Colorado Works household to Colorado Works Child Care ahead of the Low-Income determination, per 3.111.D.6. The work-eligibility conjunct was added per the review (docs/reviews/cccap-leap-phase-6.md, C-6, should-fix): a household with a Colorado Works grant was routed to this branch with no work-eligibility test at all, though 3.111.D.6 (S511) states the negative case expressly and cw_is_work_eligible_individual (CO-919) already exists for it. Vocabulary fix round (governance read.cross_program): accepts_from lists the other programs' items this rule reads on purpose. Colorado Works Child Care is defined by the person's Colorado Works eligibility and grant (8 CCR 1403-1 3.112). Heavier-definitions audit H-2 (audit fix round): reads the Colorado Works case record (receives_tanf_cash, is_work_eligible_individual_in_tanf_case, CO-2709) in place of Colorado Works' computed eligibility, grant and work-eligibility outcomes."
tests:
  - {id: CO-988-T1, as_of: "2026-10-01", month: "2026-10", given: {receives_tanf_cash: true, is_work_eligible_individual_in_tanf_case: true, is_referred_for_colorado_works_child_care: true}, expect: true}
  - {id: CO-988-T2, as_of: "2026-10-01", month: "2026-10", given: {receives_tanf_cash: false, is_referred_for_colorado_works_child_care: true}, expect: false}
  # 3.111.D.6: a grant alone, without a work-eligible determination, falls through rather than routing here.
  - {id: CO-988-T3, as_of: "2026-10-01", month: "2026-10", given: {receives_tanf_cash: true, is_work_eligible_individual_in_tanf_case: false, is_referred_for_colorado_works_child_care: true}, expect: false}
  - {id: CO-988-T4, as_of: "2026-10-01", month: "2026-10", title: "Receiving and work eligible but not referred", given: {receives_tanf_cash: true, is_work_eligible_individual_in_tanf_case: true, is_referred_for_colorado_works_child_care: false}, expect: false}
