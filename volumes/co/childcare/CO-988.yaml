id: CO-988
name: "CCCAP: Colorado Works child care eligible"
identifier: cccap_colorado_works_child_care_eligible
kind: derived
type: yes/no
scope: person-month
program: CCCAP
meaning: "This person's CCCAP household is eligible for Colorado Works Child Care under 8 CCR 1403-1 3.115.A, 3.116.A: an adult caretaker or teen parent of the household is determined work eligible per Colorado Works, receiving Colorado Works basic cash assistance, and referred for child care by the county Colorado Works worker; or, in a county that provides Colorado Works Child Care for households approved for a Colorado Works diversion, approved for a diversion and referred for child care (3.116.H)."
precision: "\"Approved for Colorado Works and ... determined work eligible per Colorado Works rule\" (3.115.A) and \"referred for child care by the county Colorado Works worker\" (3.116.A) are decisions in the Colorado Works case, read from its records: receives_tanf_cash (CO-013, the unit receives or is authorized to receive basic cash assistance), is_work_eligible_individual_in_tanf_case (CO-2709) and is_referred_for_colorado_works_child_care (CO-896). This volume's own Colorado Works determination is not re-run for CCCAP (convention rule 11). Per 3.111.D.6, a caretaker or teen parent caring for a child receiving Colorado Works cash assistance who is not determined work eligible falls through to the Low-Income Child Care determination instead of this branch, rather than being denied outright. Phase-10 sweep: the referral, financially-contributing and activity facts are read without a default; a case states them (OQ-134, OQ-135, OQ-157, OQ-395). Final pass F-16: the county-elected diversion route reads receives_tanf_diversion_payment (CO-3931, false when not stated) and the county's choice, cccap_county_provides_cw_child_care_for_diversion_table (CO-3932), which has no version until the counties' choices are published (OQ-682). Coverage round F-01: the conditions are tested on the household's adult caretakers and teen parents (cccap_household_members, CO-982), not on the person evaluated, so a child reads its caretaker's Colorado Works case and referral and every member gets the same value (3.116.A: caretakers \"that have been determined eligible for Colorado Works ... and have been referred for child care by the county Colorado Works worker ... must receive Colorado Works Child Care\")."
open: [OQ-682]
derived: [any, [exists, cccap_household_members, [all, [any, [of, [P], cccap_is_adult_caretaker], [of, [P], cccap_is_teen_parent]], [of, [P], receives_tanf_cash], [of, [P], is_work_eligible_individual_in_tanf_case], [of, [P], is_referred_for_colorado_works_child_care]]], [all, [exists, cccap_household_members, [all, [any, [of, [P], cccap_is_adult_caretaker], [of, [P], cccap_is_teen_parent]], [otherwise, [of, [P], receives_tanf_diversion_payment], false], [of, [P], is_referred_for_colorado_works_child_care]]], ["=", [lookup, cccap_county_provides_cw_child_care_for_diversion_table, cccap_application_county], 1]]]
sources: [S487, S511, S2708]
implemented: engine
tags: [household]
rationale: "No existing item cross-reads Colorado Works into CCCAP; cccap_eligibility_status (CO-989) reads it to route a Colorado Works household to Colorado Works Child Care ahead of the Low-Income determination, per 3.111.D.6. The work-eligibility conjunct was added per the review (docs/reviews/cccap-leap-phase-6.md, C-6, should-fix): a household with a Colorado Works grant was routed to this branch with no work-eligibility test at all, though 3.111.D.6 (S511) states the negative case expressly and cw_is_work_eligible_individual (CO-919) already exists for it. Vocabulary fix round (governance read.cross_program): accepts_from lists the other programs' items this rule reads on purpose. Colorado Works Child Care is defined by the person's Colorado Works eligibility and grant (8 CCR 1403-1 3.112). Heavier-definitions audit H-2 (audit fix round): reads the Colorado Works case record (receives_tanf_cash, is_work_eligible_individual_in_tanf_case, CO-2709) in place of Colorado Works' computed eligibility, grant and work-eligibility outcomes."
