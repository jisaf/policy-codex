id: CO-7251
name: "CCCAP: rental property receipts that are unearned income"
identifier: cccap_rental_property_receipts_as_unearned
kind: derived
type: money
scope: person-month
program: CCCAP
meaning: "The receipts, in the month, of the person's rental property stated as a business (earnings, CO-5100: a self_employment_receipts record whose rental_property is true) that the person does not actively manage an average of at least cccap_rental_property_self_employment_min_hours_per_week (CO-7252, twenty) hours a week: 8 CCR 1403-1 3.111.H.4.e (S2704), \"Income from rental property will be considered as unearned income if the adult caretaker(s) or teen parent(s) are not actively managing the property an average of at least twenty (20) hours per week\". CCCAP counts it as unearned rent (cccap_person_unearned_income, CO-3916), net of the landlord's expenses (I.12 and I.17, \"Net rental income\"; cccap_excluded_unearned_receipts, CO-4463), not as self-employment (cccap_self_employment_gross_receipts CO-5156, cccap_self_employment_hours CO-6404)."
precision: "Coverage pass 6 for CCCAP, R6-4 (docs/reviews/coverage6-care-energy.md). The average is the caretaker's hours in the month in the businesses stated as receipts records (cccap_business_receipts_hours, CO-7254) divided by the month's days over seven, the weeks in the month (OQ-1366): the hours are read together, so the same business stated in one record or in two gives one answer. The record is placed in the month as cccap_self_employment_gross_receipts (CO-5156) places a business's receipts (the thirty days before the application or redetermination date, or the month). The property's costs are stated as rental_property_expenses_paid (CO-4458), which CO-4463 takes against the rents, this figure included; a business cost record is a cost of a business CCCAP counts as self-employment. The record's rental_property is read only when the hours are under the line (decision 4: required there); at twenty hours a week or more the business is self-employment whether or not it is rental property."
derived: ["sum_receipts", "earnings", ["all", ["=", ["lookup", "cccap_earnings_treatment_table", ["receipt", "kind"]], "counted_self_employment"], ["=", ["receipt", "kind"], "self_employment_receipts"], ["case", [["not", ["unknown", ["receipt", "month"]]], ["received_in", ["month"]]], [["any", ["all", ["not", ["unknown", ["receipt", "job_end_date"]]], ["<", ["receipt", "job_end_date"], ["days_after", ["-", 0, "cccap_prior_income_period_days"], "cccap_application_or_redetermination_date"]]], ["all", ["not", ["unknown", ["receipt", "job_start_date"]]], [">=", ["receipt", "job_start_date"], "cccap_application_or_redetermination_date"]]], false], [["all", ["any", ["unknown", ["receipt", "job_start_date"]], ["<=", ["receipt", "job_start_date"], ["days_after", ["-", 0, "cccap_prior_income_period_days"], "cccap_application_or_redetermination_date"]]], ["any", ["unknown", ["receipt", "job_end_date"]], [">=", ["receipt", "job_end_date"], ["days_after", -1, "cccap_application_or_redetermination_date"]]]], ["received_in", ["month"]]], ["else", ["all", [">=", ["receipt", "date"], ["days_after", ["-", 0, "cccap_prior_income_period_days"], "cccap_application_or_redetermination_date"]], ["<", ["receipt", "date"], "cccap_application_or_redetermination_date"]]]], ["<", ["/", ["of", ["owner"], "cccap_business_receipts_hours"], ["/", ["days_between", ["first_day", ["month"]], ["first_day", ["month_after", ["month"]]]], 7]], "cccap_rental_property_self_employment_min_hours_per_week"], ["receipt", "rental_property"]], ["receipt", "amount"]]
sources: [S2704, S3256]
implemented: engine
tags: [income]
open: [OQ-1366]
rationale: "Coverage pass 6 for CCCAP, R6-4: no item read 3.111.H.4.e's twenty hours, and no field said that a business is rental property, so a landlord managing her units ten hours a week and stated as self-employed passed the eligible-activity test the rule denies her (probe CR1)."
nearest: [CO-5156, CO-4463]
tests:
  - {id: CO-7251-T1, title: "Coverage pass 6 R6-4 (CR1): two rental units managed 43 hours in November, 43 / (30 / 7) = 10.03 hours a week, under twenty: the $1,800 of rents are unearned (3.111.H.4.e)", month: "2026-11", as_of: "2026-11-15", given: {earnings: [{kind: self_employment_receipts, amount: 1800, hours: 43, rental_property: true}]}, expect: 1800}
  - {id: CO-7251-T2, title: "Coverage pass 6 R6-4: the same property managed 90 hours in November, 90 / (30 / 7) = 21 hours a week: self-employment, 0 here", month: "2026-11", as_of: "2026-11-15", given: {earnings: [{kind: self_employment_receipts, amount: 1800, hours: 90, rental_property: true}]}, expect: 0}
  - {id: CO-7251-T3, title: "Coverage pass 6 R6-4: a business of 43 hours in November that is not rental property: 0 here", month: "2026-11", as_of: "2026-11-15", given: {earnings: [{kind: self_employment_receipts, amount: 1800, hours: 43, rental_property: false}]}, expect: 0}
  - {id: CO-7251-T4, title: "Coverage pass 6 R6-4, decision 4: a business of 43 hours in November that does not say whether it is rental property: cannot determine", month: "2026-11", as_of: "2026-11-15", given: {earnings: [{kind: self_employment_receipts, amount: 1800, hours: 43}]}, expect: unknown}
  - {id: CO-7251-T5, title: "Coverage pass 6 R6-4: February 2027 has 28 days, four weeks: 80 hours is 80 / 4 = 20 a week, at the line: self-employment, 0 here", month: "2027-02", as_of: "2027-02-15", given: {earnings: [{kind: self_employment_receipts, amount: 1800, hours: 80, rental_property: true}]}, expect: 0}
