id: CO-982
name: "CCCAP: household members"
identifier: cccap_household_members
kind: derived
type: group of persons
scope: person
program: CCCAP
meaning: The persons who make up this person's CCCAP household under 8 CCR 1403-1 3.103.GGG and 3.111.B.3, D - the adult caretaker(s) or teen parent(s) and the children in the home who are under eighteen, or under nineteen and still in high school - reciprocally closed over the spouse relationship and over the parent/child and caretaker/dependent relationships where the child side is such a child. An adult child living with their parents is not joined to them, so a grandparent household and their adult child's own household stay separate.
precision: "As with snap_household_members (CO-305) and cw_assistance_unit_members (CO-900), a stated parent/child, caretaker/dependent, or spouse relationship edge is read as physical custody/co-residence; this volume does not separately model the involuntarily-absent, voluntarily-absent, or incapacitated second-caretaker shapes of 3.111.D.1.b-c, or the unrelated-caretaker verification of 3.111.D.5 (see OQ-125). Each member's value of this item is the same set (their own household)."
open: [OQ-125]
derived: [reachable, [parent, child, caretaker, dependent, spouse], [any, [rel, [spouse], [P]], [all, [rel, [parent, caretaker], [P]], [of, [P], cccap_is_household_child]], [all, [rel, [child, dependent], [P]], cccap_is_household_child]]]
sources: [S496, S481, S484]
implemented: engine
tags: [household]
rationale: No existing item builds the CCCAP household closure; cccap_household_size (CO-983) and cccap_household_income (CO-985) both need it, and cccap_low_income_child_care_eligible (CO-987) needs it to find an eligible child in the household.
tests:
  - {id: CO-982-T1, as_of: "2026-10-01", given: {date_of_birth: "1985-01-22"}, others: {p4: {date_of_birth: "2009-04-08"}, p5: {date_of_birth: "2026-02-03"}}, relationships: [[parent, p1, p4], [parent, p4, p5]], expect: [p1, p4, p5]}
  - {id: CO-982-T2, as_of: "2026-10-01", given: {date_of_birth: "1990-01-01"}, relationships: [], expect: [p1]}
  # From the minor parent's own perspective the closure reaches her parent (she is under 18) and her infant.
  - {id: CO-982-T3, as_of: "2026-10-01", given: {date_of_birth: "2009-04-08", is_enrolled_in_school: true}, others: {p3: {date_of_birth: "1985-01-22"}, p5: {date_of_birth: "2026-02-03"}}, relationships: [[parent, p3, p1], [parent, p1, p5]], expect: [p1, p3, p5]}
  # An adult child (42) living with her parents is not part of their household; the grandparents' household is the couple alone.
  - {id: CO-982-T4, as_of: "2026-10-01", given: {date_of_birth: "1947-05-10"}, others: {p2: {date_of_birth: "1945-08-30"}, p3: {date_of_birth: "1984-06-15", is_enrolled_in_school: false}}, relationships: [[spouse, p1, p2], [parent, p1, p3], [parent, p2, p3]], expect: [p1, p2]}
