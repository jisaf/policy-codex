id: CO-982
name: "CCCAP: household members"
identifier: cccap_household_members
kind: derived
type: group of persons
scope: person
program: CCCAP
meaning: The persons who make up this person's CCCAP household under 8 CCR 1403-1 3.103.GGG and 3.111.B.3, D - the adult caretaker(s) or teen parent(s) and the children in the home who are under eighteen, or under nineteen and still in high school - reciprocally closed over the spouse relationship and over the parent/child and caretaker/dependent relationships where the child side is such a child. An adult child living with their parents is not joined to them, so a grandparent household and their adult child's own household stay separate.
precision: "As with snap_household_members (CO-305) and cw_assistance_unit_members (CO-900), a stated parent/child, caretaker/dependent, or spouse relationship edge is read as physical custody/co-residence; the voluntarily-absent and incapacitated second-caretaker shapes of 3.111.D.1.a and c stay members (the activity test, CO-991, reads them), and the unrelated-caretaker verification of 3.111.D.5 is OQ-125. Coverage pass 3 C3-2: a caretaker who is involuntarily out of the home (cccap_caretaker_is_involuntarily_absent, CO-898, read as false when not stated) is not joined, and joins no one: 3.111.D.1.b (S1409) makes such a household \"a household with one adult caretaker or teen parent\", D.1.a keeps only a caretaker voluntarily out of the home \"part of the household\", and 3.103.LLL (S3636) counts the children \"in the home\". So the absent caretaker's county residency, asset declaration, documents and income are not read and he is not counted in the household size (OQ-872); before the fix a father in jail in another county made the household ineligible (probe Y-8b) and, stated in the county, raised the size to 3 and asked for his residency document (probe Y-8c). Each member's value of this item is the same set (their own household). Same-word audit SW-1/SW-3/SW-4 (OQ-396): the adult caretaker relation is cccap_adult_caretaker_of (CO-2607): parent, stepparent, legal guardian, or a person with primary responsibility for the child (in loco parentis, OQ-540). Same-word audit SW-7 (convention rule 17): an edge joins persons who live together (lives_with, CO-1925, from dwelling_id); where a case states no dwelling_id the edge is read as living together, as before. CCCAP's household is the persons in the home (3.103, S481). Second-pass review N-7 (was F-14): a spouse is joined only when both spouses are adult caretakers, and a stepparent only when an adult caretaker (a teen parent is joined through her own child, by the parent edge), since 3.103.LLL's household is the children and \"the adult caretaker(s) or teen parent(s)\" and 3.103.C makes a stepparent an adult caretaker only when \"financially contributing to the welfare of the child\"; a legal parent, guardian or person with primary responsibility is still joined through the child, and the teen parent's own parent through her. A separated caretaker's temporary order (3.111.D.10) leaves membership alone and takes the other spouse's or parent's income out of the sums (cccap_household_income_members, CO-4064). cccap_is_adult_caretaker (CO-992) reads no household item, so the condition makes no cycle. Coverage round F-15: an adult or teen parent in the home who contributes financially to the welfare of a household child (contributes_financially_to, 3.111.D.2) is joined through the child, as a parent is."
open: [OQ-163, OQ-872, OQ-1315]
derived: [reachable, [parent, child, stepparent, stepchild, legal_guardian, ward, has_primary_responsibility_for, in_primary_care_of, contributes_financially_to, receives_financial_contribution_from, spouse], [all, [otherwise, [in_group, [P], lives_with], true], [not, [otherwise, cccap_caretaker_is_involuntarily_absent, false]], [not, [otherwise, [of, [P], cccap_caretaker_is_involuntarily_absent], false]], [any, [all, [rel, [spouse], [P]], cccap_is_adult_caretaker, [of, [P], cccap_is_adult_caretaker]], [all, [rel, [parent, legal_guardian, has_primary_responsibility_for, contributes_financially_to], [P]], [of, [P], cccap_is_household_child]], [all, [rel, [stepparent], [P]], [of, [P], cccap_is_household_child], cccap_is_adult_caretaker], [all, [rel, [child, ward, in_primary_care_of, receives_financial_contribution_from], [P]], cccap_is_household_child], [all, [rel, [stepchild], [P]], cccap_is_household_child, [of, [P], cccap_is_adult_caretaker]]]]]
sources: [S496, S481, S497, S2856, S3254, S1409, S3636]
implemented: engine
tags: [household]
rationale: "No existing item builds the CCCAP household closure; cccap_household_size (CO-983) and cccap_household_income (CO-985) both need it, and cccap_low_income_child_care_eligible (CO-987) needs it to find an eligible child in the household. Same-word SW-7: living in the home is read from lives_with."
tests:
  - {id: CO-982-T1, as_of: "2026-10-01", given: {date_of_birth: "1985-01-22"}, others: {p4: {date_of_birth: "2009-04-08"}, p5: {date_of_birth: "2026-02-03"}}, relationships: [[parent, p1, p4], [parent, p4, p5]], expect: [p1, p4, p5]}
  - {id: CO-982-T2, as_of: "2026-10-01", given: {date_of_birth: "1990-01-01"}, relationships: [], expect: [p1]}
  # From the minor parent's own perspective the closure reaches her parent (she is under 18) and her infant.
  - {id: CO-982-T3, as_of: "2026-10-01", given: {date_of_birth: "2009-04-08", cccap_is_attending_high_school: true, cccap_is_in_education_or_training_activity: true}, others: {p3: {date_of_birth: "1985-01-22"}, p5: {date_of_birth: "2026-02-03"}}, relationships: [[parent, p3, p1], [parent, p1, p5]], expect: [p1, p3, p5]}
  # An adult child (42) living with her parents is not part of their household. Second-pass N-7: neither grandparent is an adult caretaker (no eligible child), so the spouse is not joined either (was [p1, p2]).
  - {id: CO-982-T4, as_of: "2026-10-01", given: {date_of_birth: "1947-05-10"}, others: {p2: {date_of_birth: "1945-08-30"}, p3: {date_of_birth: "1984-06-15", cccap_is_attending_high_school: false, cccap_is_in_education_or_training_activity: false}}, relationships: [[spouse, p1, p2], [parent, p1, p3], [parent, p2, p3]], expect: [p1]}
  # Second-pass N-7 (3.103.C, LLL): the mother's husband, the child's stepfather, does not contribute financially to the child, so he is not an adult caretaker and is not joined, by the spouse edge or the stepparent edge.
  - {id: CO-982-T5, title: "Second-pass N-7: a stepfather who is not an adult caretaker is not in the household", as_of: "2026-10-01", given: {date_of_birth: "1990-03-01", immigration_status: us_citizen, cccap_is_financially_contributing_to_child: true, cccap_is_attending_high_school: false, cccap_is_in_education_or_training_activity: false}, others: {p2: {date_of_birth: "1988-01-01", immigration_status: us_citizen, cccap_is_financially_contributing_to_child: false, cccap_is_attending_high_school: false, cccap_is_in_education_or_training_activity: false}, p3: {date_of_birth: "2021-01-01", immigration_status: us_citizen, cccap_child_has_additional_care_needs: false, cccap_child_needs_care_for_part_of_day: true, cccap_is_attending_high_school: false}}, relationships: [[spouse, p1, p2], [parent, p1, p3], [stepparent, p2, p3]], expect: [p1, p3]}
  - {id: CO-982-T6, title: "F-15: the mother's partner who contributes financially to her son is in the household (3.111.D.2)", as_of: "2026-10-01", given: {date_of_birth: "1988-04-02"}, others: {p2: {date_of_birth: "1986-01-01"}, p3: {date_of_birth: "2020-03-10"}}, relationships: [[parent, p1, p3], [contributes_financially_to, p2, p3]], expect: [p1, p2, p3]}
  # Coverage pass 3 C3-2 (probes Y-8b, Y-8c): mother, father in jail, son.
  - {id: CO-982-T8, title: "C3-2: a father involuntarily out of the home (in jail) is not in the household (3.111.D.1.b)", as_of: "2026-10-01", given: {date_of_birth: "1990-03-01", immigration_status: us_citizen, cccap_is_financially_contributing_to_child: true, cccap_is_attending_high_school: false, cccap_is_in_education_or_training_activity: false}, others: {p2: {date_of_birth: "1988-01-01", immigration_status: us_citizen, cccap_is_financially_contributing_to_child: true, cccap_caretaker_is_involuntarily_absent: true, cccap_is_attending_high_school: false, cccap_is_in_education_or_training_activity: false}, p3: {date_of_birth: "2021-01-01", immigration_status: us_citizen, cccap_child_has_additional_care_needs: false, cccap_child_needs_care_for_part_of_day: true, cccap_is_attending_high_school: false}}, relationships: [[spouse, p1, p2], [parent, p1, p3], [parent, p2, p3]], expect: [p1, p3]}
  - {id: CO-982-T9, title: "C3-2: evaluated on the absent father, who joins no one", as_of: "2026-10-01", given: {date_of_birth: "1990-03-01", cccap_caretaker_is_involuntarily_absent: true, immigration_status: us_citizen, cccap_is_financially_contributing_to_child: true, cccap_is_attending_high_school: false, cccap_is_in_education_or_training_activity: false}, others: {p2: {date_of_birth: "1988-01-01", immigration_status: us_citizen, cccap_is_financially_contributing_to_child: true, cccap_caretaker_is_involuntarily_absent: true, cccap_is_attending_high_school: false, cccap_is_in_education_or_training_activity: false}, p3: {date_of_birth: "2021-01-01", immigration_status: us_citizen, cccap_child_has_additional_care_needs: false, cccap_child_needs_care_for_part_of_day: true, cccap_is_attending_high_school: false}}, relationships: [[spouse, p1, p2], [parent, p1, p3], [parent, p2, p3]], expect: [p1]}
