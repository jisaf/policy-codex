id: CO-2104
name: "CCCAP: meets the income eligibility guidelines"
identifier: cccap_meets_income_guidelines
kind: derived
type: yes/no
scope: person-month
program: CCCAP
meaning: "Whether the household's income meets the Low-Income Child Care guidelines of 8 CCR 1403-1 3.111.H.1: for a household already receiving assistance, the exit eligibility of 85% of state median income (H.1.b); for an applicant, the entry eligibility the Department sets (H.1.a), capped at 85% of state median income."
derived: [case, [cccap_is_receiving_assistance, cccap_income_within_exit_limit], [else, cccap_income_within_entry_limit]]
sources: [S1413, S485]
open: [OQ-121]
implemented: engine
tags: [income]
rationale: "OQ-133: cccap_eligibility_status (CO-989) and cccap_low_income_child_care_eligible (CO-987) read the entry limit for every household; H.1.b sets a different, higher limit for a household already in the program. This item chooses between the two existing limit tests."
tests:
  - {id: CO-2104-T1, title: "Applicant: the entry limit", as_of: "2026-10-01", month: "2026-10", given: {cccap_is_receiving_assistance: false, cccap_income_within_entry_limit: false, cccap_income_within_exit_limit: true}, expect: false}
  - {id: CO-2104-T2, title: "Continuing household above the entry limit but within 85% SMI keeps eligibility", as_of: "2026-10-01", month: "2026-10", given: {cccap_is_receiving_assistance: true, cccap_income_within_entry_limit: false, cccap_income_within_exit_limit: true}, expect: true}
  - {id: CO-2104-T3, title: "Continuing household above 85% SMI", as_of: "2026-10-01", month: "2026-10", given: {cccap_is_receiving_assistance: true, cccap_income_within_entry_limit: false, cccap_income_within_exit_limit: false}, expect: false}
