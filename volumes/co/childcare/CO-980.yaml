id: CO-980
name: "CCCAP: is an eligible child"
identifier: cccap_is_eligible_child
kind: derived
type: yes/no
scope: person
program: CCCAP
meaning: The person is an "eligible child" under 8 CCR 1403-1 3.111.F - a child from birth to age thirteen who needs child care during part of the day, or a child with verified additional care needs under age nineteen who is physically or mentally incapable of self-care or under court supervision.
precision: This volume does not separately model "physically residing with the eligible adult caretaker(s) or teen parent(s)"; that is read from the case's stated caretaker/dependent or parent/child relationships in cccap_household_members (CO-982), which this item does not itself check.
derived: [any, ["<", age, cccap_eligible_child_age_limit], [all, ["<", age, cccap_disabled_child_age_limit], has_additional_care_needs]]
sources: [S482]
implemented: engine
tags: [age, disability]
rationale: No existing item in this volume states the CCCAP eligible-child age/disability test; cccap_household_income (CO-985) excludes an eligible child's own earnings, and cccap_low_income_child_care_eligible (CO-987) and cccap_eligibility_status (CO-989) both need at least one eligible child in the household.
tests:
  - {id: CO-980-T1, as_of: "2026-10-01", given: {date_of_birth: "2026-02-03", has_additional_care_needs: false}, expect: true}
  - {id: CO-980-T2, as_of: "2026-10-01", given: {date_of_birth: "2012-01-01", has_additional_care_needs: false}, expect: false}
  - {id: CO-980-T3, as_of: "2026-10-01", given: {date_of_birth: "2012-01-01", has_additional_care_needs: true}, expect: true}
  - {id: CO-980-T4, as_of: "2026-10-01", given: {date_of_birth: "2005-01-01", has_additional_care_needs: true}, expect: false}
