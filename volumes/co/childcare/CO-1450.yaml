id: CO-1450
name: "CCCAP: verification due date"
identifier: cccap_verification_due_date
kind: derived
type: calendar date
scope: person
program: CCCAP
meaning: The end of the CCCAP fifteen-day noticing period from the county's request, after which an application with unreturned verification is denied.
derived: [days_after, cccap_verification_response_days, [otherwise, cccap_verification_request_date, verification_request_date]]
sources: [S891]
implemented: engine
tags: [verification]
rationale: No existing item states when requested CCCAP verification is due.
nearest: [CO-1392, CO-1414, CO-1426, CO-1437, CO-1461, CO-1656]
tests:
  - {id: CO-1450-T1, as_of: "2026-10-01", given: {verification_request_date: "2026-10-01"}, expect: "2026-10-16"}
  # OQ-300: the program's own request date, when stated, replaces the shared checklist date.
  - {id: CO-1450-T2, as_of: "2026-10-01", given: {cccap_verification_request_date: "2026-10-20", verification_request_date: "2026-10-01"}, expect: "2026-11-04"}
