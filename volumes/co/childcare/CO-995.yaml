id: CO-995
name: "CCCAP: protective services income within the size-1 limit"
identifier: cccap_protective_services_income_within_limit
kind: derived
type: yes/no
scope: person-month
program: CCCAP
meaning: Whether the Protective Services household's countable income (cccap_protective_services_income, CO-994) is at or below the county entry income limit for a household of cccap_protective_services_household_size (CO-3008), since 3.119.A makes every Protective Services household a household of one for income eligibility.
precision: "Reads the same entry-limit computation as cccap_income_within_entry_limit (CO-986) - the county percentage of the 100% FPG figure, capped at the 85% SMI figure - fixed at the protective services household size rather than cccap_household_size (CO-983), per 3.119.A. The 100% guideline is computed as cccap_poverty_guideline_monthly (CO-3007) computes it, for the protective services household size instead of the household's own size: the HHS guideline in force on the most recent October 1, divided by twelve and rounded to the cent. Hard-coded numbers audit H-21: the size was a literal 1. Second-pass review N-10: the test is met when the Child Welfare worker waived the income requirement under an approved county plan (cccap_protective_services_income_requirement_waived, CO-4053, read as false when not stated; 3.119.C). N-2: the income tested is the placed children's, one figure for the household (CO-994). The 85% SMI table is read as of the determination date in every month evaluated: the entry limit is the test at the initial application or redetermination (3.111.H.1.a), whose figures hold for the twelve-month eligibility period (time audit T-3, docs/operators.md, Resolution). T-9 hand check A-12: the protective services household is tested against the entry income eligibility level, which 3.103.YY (S4421) defines as the level \"above which\" a caretaker is not eligible at original application: income equal to it is within the limit (CO-995-T4)."
derived: [any, [otherwise, cccap_protective_services_income_requirement_waived, false], ["<=", cccap_protective_services_income, [min, ["*", cccap_entry_income_limit_pct_fpl, ["/", [round, ["/", ["*", [lookup_extended, [as_of, federal_poverty_guideline_annual_table, [first_day, [latest_month_of_year, cccap_poverty_guideline_start_month, [det_month]]]], cccap_protective_services_household_size, [as_of, federal_poverty_guideline_annual_each_additional, [first_day, [latest_month_of_year, cccap_poverty_guideline_start_month, [det_month]]]]], 100], 12]], 100]], [lookup_extended, [as_of, cccap_smi_income_limit_table, [det_date]], cccap_protective_services_household_size, [as_of, cccap_smi_income_limit_each_additional, [det_date]]]]]]
sources: [S488, S485, S2852, S4421]
implemented: engine
tags: [income]
rationale: "No existing item states 3.119.A's household-of-one income test; the review (docs/reviews/cccap-leap-phase-6.md, C-9) found the Protective Services branch of cccap_eligibility_status (CO-989) short-circuited the income test entirely, which 3.119.A does not waive (only 3.119.D's activity test and 3.119.E's residency verification are waived). Modeled on cccap_income_within_entry_limit (CO-986), the nearest same-shape item, fixed to size 1 instead of reading cccap_household_size. cccap_eligibility_status (CO-989) reads it as a conjunct of the protective-services branch, with a fall-through to the ordinary rows when it fails."
tests:
  - {id: CO-995-T1, as_of: "2026-10-01", month: "2026-10", given: {cccap_protective_services_income: 800, cccap_entry_income_limit_pct_fpl: 1.85}, expect: true}
  - {id: CO-995-T2, as_of: "2026-10-01", month: "2026-10", given: {cccap_protective_services_income: 3000, cccap_entry_income_limit_pct_fpl: 1.85}, expect: false}
  - {id: CO-995-T3, title: "N-10: income over the limit, the income requirement waived (3.119.C)", as_of: "2026-10-01", month: "2026-10", given: {cccap_protective_services_income_requirement_waived: true, cccap_protective_services_income: 3000, cccap_entry_income_limit_pct_fpl: 1.85}, expect: true}
  # Time audit T-9: each comparison tested at its limit, with the two sides equal (the strict/inclusive flip of the comparison fails it).
  - {"id": "CO-995-T4", "month": "2026-10", "as_of": "2026-10-01", "title": "T-9: cccap_protective_services_income equal to [\"min\",[\"*\",\"cccap_entry_income_limit_pct_fpl\",[\"/\",[\"round\",[\"/\",[\"*\",[\"lookup_extended\",[\"as_of\",\"federal_poverty_guideline_annual_table\",[\"first_day\",[\"latest_month_of_year\",\"cccap_poverty_guideline_start_month\",[\"det_month\"]]]],\"cccap_protective_services_household_size\",[\"as_of\",\"federal_poverty_guideline_annual_each_additional\",[\"first_day\",[\"latest_month_of_year\",\"cccap_poverty_guideline_start_month\",[\"det_month\"]]]]],100],12]],100]],[\"lookup_extended\",[\"as_of\",\"cccap_smi_income_limit_table\",[\"det_date\"]],\"cccap_protective_services_household_size\",[\"as_of\",\"cccap_smi_income_limit_each_additional\",[\"det_date\"]]]] (cccap_protective_services_income at or under [\"min\",[\"*\",\"cccap_entry_income_limit_pct_fpl\",[\"/\",[\"round\",[\"/\",[\"*\",[\"lookup_extended\",[\"as_of\",\"federal_poverty_guideline_annual_table\",[\"first_day\",[\"latest_month_of_year\",\"cccap_poverty_guideline_start_month\",[\"det_month\"]]]],\"cccap_protective_services_household_size\",[\"as_of\",\"federal_poverty_guideline_annual_each_additional\",[\"first_day\",[\"latest_month_of_year\",\"cccap_poverty_guideline_start_month\",[\"det_month\"]]]]],100],12]],100]],[\"lookup_extended\",[\"as_of\",\"cccap_smi_income_limit_table\",[\"det_date\"]],\"cccap_protective_services_household_size\",[\"as_of\",\"cccap_smi_income_limit_each_additional\",[\"det_date\"]]]])", "given": {"cccap_protective_services_income": 2460.5, "cccap_entry_income_limit_pct_fpl": 1.85}, "expect": true}
