id: CO-1289
name: "CCCAP: parent fee by formula"
identifier: cccap_parent_fee_formula_amount
kind: derived
type: money
scope: person-month
program: CCCAP
meaning: The monthly CCCAP parent fee the formula assesses before reductions and exceptions - one percent of gross countable household income at or below 100% of the federal poverty guideline; above it, one percent of income plus fourteen percent of every dollar above the guideline plus $15 for each child in care after the first - per 8 CCR 1403-1 3.124.A and P.
precision: "Through July 2028 (3.124.P, S785): 1% of income at or below the monthly 100% FPG, and above it 1% of income plus 14% of each dollar above the FPG plus $15 for each child in care after the first. The children in care are the household's eligible children: cccap_is_eligible_child requires that care be requested because the child needs care for part of the day (cccap_child_needs_care_for_part_of_day, 3.111.F), so a child not in care is not counted (OQ-254 part 1, resolved). From August 2028 (3.124.Q, S786): marginal rates of 1% up to 100% of the FPG, 3% from 100% to 130%, 5% from 130% to 160% and 7% above 160%, with no per-child amount; Q's bands are written \"101%-130\", \"131%-160%\" and \"161% and above\", read here as continuous at 100%, 130% and 160% so no dollar falls between bands (the band-edge reading stays open, OQ-254). The guideline is the monthly 100% FPG of 3.111.H.2-3 (cccap_poverty_guideline_monthly_table) in force on the month's date. CDHS review C-7/C-8: the formula is applied to cccap_parent_fee_income (CO-2578: the household income, or a protective services household's children's income), and the $15 counts the eligible children for whom care is requested (cccap_care_is_requested_for_child, CO-2579; read as requested when not stated), not every eligible child."
derived: [case, [["<", [month], "2028-08"], [case, [[<=, cccap_parent_fee_income, [+, [lookup, cccap_poverty_guideline_monthly_table, [min, cccap_household_size, 8]], ["*", cccap_poverty_guideline_monthly_each_additional, [max, 0, ["-", cccap_household_size, 8]]]]], ["*", cccap_parent_fee_base_rate, cccap_parent_fee_income]], [else, [+, ["*", cccap_parent_fee_base_rate, cccap_parent_fee_income], ["*", cccap_parent_fee_marginal_rate, ["-", cccap_parent_fee_income, [+, [lookup, cccap_poverty_guideline_monthly_table, [min, cccap_household_size, 8]], ["*", cccap_poverty_guideline_monthly_each_additional, [max, 0, ["-", cccap_household_size, 8]]]]]], ["*", cccap_parent_fee_additional_child_amount, [max, 0, ["-", [count, [filter, cccap_household_members, [all, [of, [P], cccap_is_eligible_child], [otherwise, [of, [P], cccap_care_is_requested_for_child], true]]]], 1]]]]]]], [else, [+, ["*", cccap_parent_fee_base_rate, [min, cccap_parent_fee_income, [+, [lookup, cccap_poverty_guideline_monthly_table, [min, cccap_household_size, 8]], ["*", cccap_poverty_guideline_monthly_each_additional, [max, 0, ["-", cccap_household_size, 8]]]]]], ["*", cccap_parent_fee_second_band_rate, [max, 0, ["-", [min, cccap_parent_fee_income, ["*", cccap_parent_fee_second_band_limit_pct_fpl, [+, [lookup, cccap_poverty_guideline_monthly_table, [min, cccap_household_size, 8]], ["*", cccap_poverty_guideline_monthly_each_additional, [max, 0, ["-", cccap_household_size, 8]]]]]], [+, [lookup, cccap_poverty_guideline_monthly_table, [min, cccap_household_size, 8]], ["*", cccap_poverty_guideline_monthly_each_additional, [max, 0, ["-", cccap_household_size, 8]]]]]]], ["*", cccap_parent_fee_third_band_rate, [max, 0, ["-", [min, cccap_parent_fee_income, ["*", cccap_parent_fee_third_band_limit_pct_fpl, [+, [lookup, cccap_poverty_guideline_monthly_table, [min, cccap_household_size, 8]], ["*", cccap_poverty_guideline_monthly_each_additional, [max, 0, ["-", cccap_household_size, 8]]]]]], ["*", cccap_parent_fee_second_band_limit_pct_fpl, [+, [lookup, cccap_poverty_guideline_monthly_table, [min, cccap_household_size, 8]], ["*", cccap_poverty_guideline_monthly_each_additional, [max, 0, ["-", cccap_household_size, 8]]]]]]]], ["*", cccap_parent_fee_top_band_rate, [max, 0, ["-", cccap_parent_fee_income, ["*", cccap_parent_fee_third_band_limit_pct_fpl, [+, [lookup, cccap_poverty_guideline_monthly_table, [min, cccap_household_size, 8]], ["*", cccap_poverty_guideline_monthly_each_additional, [max, 0, ["-", cccap_household_size, 8]]]]]]]]]]]
sources: [S781, S782, S785, S786, S784]
open: [OQ-254]
implemented: engine
tags: [income, household]
rationale: No existing item computes the CCCAP parent fee; cccap_parent_fee (CO-1290) applies the reductions and exceptions to this figure.
tests:
  - {id: CO-1289-T1, title: "At the guideline - 1% of income", as_of: "2026-10-01", month: "2026-10", given: {cccap_parent_fee_income: 2000, cccap_household_size: 3, cccap_household_members: []}, expect: 20}
  - {id: CO-1289-T2, title: "Household of 4 at $3,750 - $1,000 over the $2,750 guideline, two children in care - 37.50 + 140 + 15", as_of: "2026-10-01", month: "2026-10", given: {cccap_parent_fee_income: 3750, cccap_household_size: 4, cccap_household_members: [p1, p2, p3], cccap_is_eligible_child: false}, others: {p2: {cccap_is_eligible_child: true}, p3: {cccap_is_eligible_child: true}}, expect: 192.5}
  # 3.124.Q from August 2028: household of 3 (FPG 2,276.67 from October 2026) at $3,000 = 131.8% FPL.
  # 1% x 2,276.67 + 3% x (2,959.671 - 2,276.67) + 5% x (3,000 - 2,959.671) = 22.7667 + 20.49003 + 2.01645 = 45.27318
  - {id: CO-1289-T5, title: "3.124.Q marginal rates in September 2028", as_of: "2028-09-01", month: "2028-09", given: {cccap_parent_fee_income: 3000, cccap_household_size: 3, cccap_household_members: []}, expect: 45.27318}
  # 3.124.Q: at or below 100% FPL only the 1% applies.
  - {id: CO-1289-T6, title: "3.124.Q below the guideline", as_of: "2028-09-01", month: "2028-09", given: {cccap_parent_fee_income: 2000, cccap_household_size: 3, cccap_household_members: []}, expect: 20}
  - {id: CO-1289-T6, title: "C-8: two eligible children, care requested for one - no $15", as_of: "2026-10-01", month: "2026-10", given: {cccap_parent_fee_income: 3750, cccap_household_size: 4, cccap_household_members: [p1, p2, p3], cccap_is_eligible_child: false}, others: {p2: {cccap_is_eligible_child: true, cccap_care_is_requested_for_child: true}, p3: {cccap_is_eligible_child: true, cccap_care_is_requested_for_child: false}}, expect: 177.5}
