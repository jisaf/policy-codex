id: CO-1289
name: "CCCAP: parent fee by formula"
identifier: cccap_parent_fee_formula_amount
kind: derived
type: money
scope: person-month
program: CCCAP
meaning: "The monthly CCCAP parent fee the formula assesses before reductions and exceptions, per 8 CCR 1403-1 3.124.A, P and Q: cccap_parent_fee_base_rate of income up to the monthly 100% federal poverty guideline for the household (cccap_poverty_guideline_monthly, CO-3007), cccap_parent_fee_second_band_rate, _third_band_rate and _top_band_rate of the dollars in the bands above it (cccap_parent_fee_second_band_limit_pct_fpl and _third_band_limit_pct_fpl), and, when income is above the guideline, cccap_parent_fee_additional_child_amount for each child in care after the first. 3.124.P (through July 31, 2028) and 3.124.Q (from August 1, 2028) differ only in the versions of those parameters."
precision: "One marginal formula with dated parameters (engineering follow-up 3, Corticon S-9). Through July 2028 (3.124.P, S785) the three band rates (CO-2115 to CO-2117) are P's base rate plus its marginal increase on each dollar above the guideline and the per-child amount (CO-1286) is P's, which is P's formula: the base rate of income at or below the guideline, and above it the base rate of income plus the increase on each dollar above it plus the per-child amount for each child in care after the first. From August 2028 (3.124.Q, S786) the band rates are Q's and there is no per-child amount; Q's bands are written \"101%-130\", \"131%-160%\" and \"161% and above\", read here as continuous at the band limits so no dollar falls between bands (the band-edge reading stays open, OQ-254). The band rates and the per-child amount are read as of the determination date, not the month evaluated: the county \"must assess\" the fee at the referral, application or redetermination, and during the twelve-month eligibility period it \"cannot be assessed higher than the parent fee determined at the most recent\" one (3.124.C, S2850), so a determination made from August 1, 2028 applies Q to every month it evaluates, and one made before applies P (time audit T-3: every other parameter is read in the month evaluated, docs/operators.md, Resolution). The children in care are the household's eligible children: cccap_is_eligible_child requires that care be requested because the child needs care for part of the day (cccap_child_needs_care_for_part_of_day, 3.111.F), so a child not in care is not counted (OQ-254 part 1, resolved). CDHS review C-7/C-8: the formula is applied to cccap_parent_fee_income (CO-2578: the household income, or a protective services household's children's income), and the per-child amount counts the eligible children for whom care is requested (cccap_care_is_requested_for_child, CO-2579; read as requested when not stated), not every eligible child; when the per-child amount is 0 the children are not counted. The amount is not rounded here: 3.124.A (S782) has the parent fee calculated in whole dollars by dropping the cents, which cccap_parent_fee (CO-1290) applies after the reductions (engineering follow-up 4)."
derived: [+, ["*", cccap_parent_fee_base_rate, [min, cccap_parent_fee_income, cccap_poverty_guideline_monthly]], ["*", [as_of, cccap_parent_fee_second_band_rate, [det_date]], [max, 0, ["-", [min, cccap_parent_fee_income, ["*", cccap_parent_fee_second_band_limit_pct_fpl, cccap_poverty_guideline_monthly]], cccap_poverty_guideline_monthly]]], ["*", [as_of, cccap_parent_fee_third_band_rate, [det_date]], [max, 0, ["-", [min, cccap_parent_fee_income, ["*", cccap_parent_fee_third_band_limit_pct_fpl, cccap_poverty_guideline_monthly]], ["*", cccap_parent_fee_second_band_limit_pct_fpl, cccap_poverty_guideline_monthly]]]], ["*", [as_of, cccap_parent_fee_top_band_rate, [det_date]], [max, 0, ["-", cccap_parent_fee_income, ["*", cccap_parent_fee_third_band_limit_pct_fpl, cccap_poverty_guideline_monthly]]]], [case, [["=", [as_of, cccap_parent_fee_additional_child_amount, [det_date]], 0], 0], [["<=", cccap_parent_fee_income, cccap_poverty_guideline_monthly], 0], [else, ["*", [as_of, cccap_parent_fee_additional_child_amount, [det_date]], [max, 0, ["-", [count, [filter, cccap_household_members, [all, [of, [P], cccap_is_eligible_child], [otherwise, [of, [P], cccap_care_is_requested_for_child], true]]]], 1]]]]]]
sources: [S781, S782, S785, S786, S784]
open: [OQ-254]
implemented: engine
tags: [income, household]
rationale: "No existing item computes the CCCAP parent fee; cccap_parent_fee (CO-1290) applies the reductions and exceptions to this figure. Hard-coded numbers audit H-1 (engineering follow-up 3), S-1 and D-1: the monthly guideline the formula repeated eight times as a household-size lookup with a literal last row is cccap_poverty_guideline_monthly (CO-3007), read once by name; the meaning names the parameters instead of restating their rates (R-2)."
tests:
  - {id: CO-1289-T1, title: "At the guideline - 1% of income", as_of: "2026-10-01", month: "2026-10", given: {cccap_parent_fee_income: 2000, cccap_household_size: 3, cccap_household_members: []}, expect: 20}
  - {id: CO-1289-T2, title: "Household of 4 at $3,750 - $1,000 over the $2,750 guideline, two children in care - 37.50 + 140 + 15", as_of: "2026-10-01", month: "2026-10", given: {cccap_parent_fee_income: 3750, cccap_household_size: 4, cccap_household_members: [p1, p2, p3], cccap_is_eligible_child: false}, others: {p2: {cccap_is_eligible_child: true}, p3: {cccap_is_eligible_child: true}}, expect: 192.5}
  # 3.124.Q from August 2028: household of 3 (FPG 2,276.67, the 2026 guideline adopted October 2026, which the federal table carries forward) at $3,000 = 131.8% FPL.
  # 1% x 2,276.67 + 3% x (2,959.671 - 2,276.67) + 5% x (3,000 - 2,959.671) = 22.7667 + 20.49003 + 2.01645 = 45.27318
  - {id: CO-1289-T5, title: "3.124.Q marginal rates in September 2028", as_of: "2028-09-01", month: "2028-09", given: {cccap_parent_fee_income: 3000, cccap_household_size: 3, cccap_household_members: []}, expect: 45.27318}
  # Engineering follow-up 3: the formula follows the determination date, so a determination in September 2028 applies 3.124.Q to July 2028 as well.
  - {id: CO-1289-T8, title: "A September 2028 determination applies 3.124.Q to July 2028", as_of: "2028-09-01", month: "2028-07", given: {cccap_parent_fee_income: 3000, cccap_household_size: 3, cccap_household_members: []}, expect: 45.27318}
  # 3.124.Q: at or below 100% FPL only the 1% applies.
  - {id: CO-1289-T6, title: "3.124.Q below the guideline", as_of: "2028-09-01", month: "2028-09", given: {cccap_parent_fee_income: 2000, cccap_household_size: 3, cccap_household_members: []}, expect: 20}
  - {id: CO-1289-T7, title: "C-8: two eligible children, care requested for one - no $15", as_of: "2026-10-01", month: "2026-10", given: {cccap_parent_fee_income: 3750, cccap_household_size: 4, cccap_household_members: [p1, p2, p3], cccap_is_eligible_child: false}, others: {p2: {cccap_is_eligible_child: true, cccap_care_is_requested_for_child: true}, p3: {cccap_is_eligible_child: true, cccap_care_is_requested_for_child: false}}, expect: 177.5}
