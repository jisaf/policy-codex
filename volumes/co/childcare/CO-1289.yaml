id: CO-1289
name: "CCCAP: parent fee by formula"
identifier: cccap_parent_fee_formula_amount
kind: derived
type: money
scope: person-month
program: CCCAP
meaning: The monthly CCCAP parent fee the formula assesses before reductions and exceptions - one percent of gross countable household income at or below 100% of the federal poverty guideline; above it, one percent of income plus fourteen percent of every dollar above the guideline plus $15 for each child in care after the first - per 8 CCR 1403-1 3.124.A and P.
precision: "The children in care are read as the household's eligible children (cccap_is_eligible_child); the rule counts the children for whom care is requested, which a case where some eligible children are not in care would overstate (OQ-254). The guideline is the monthly 100% FPG of 3.111.H.2-3 for the household's size (cccap_poverty_guideline_table, CO-323). The formula is in force July 1, 2021 through July 31, 2028 (the item's effective range); the bracketed formula of 3.124.Q from August 1, 2028 is not modeled (OQ-254)."
effective: { from: "2021-07-01", to: "2028-08-01" }
derived: [case, [[<=, cccap_household_income, [+, [lookup, cccap_poverty_guideline_table, [min, cccap_household_size, 8]], ["*", cccap_poverty_guideline_each_additional, [max, 0, ["-", cccap_household_size, 8]]]]], ["*", cccap_parent_fee_base_rate, cccap_household_income]], [else, [+, ["*", cccap_parent_fee_base_rate, cccap_household_income], ["*", cccap_parent_fee_marginal_rate, ["-", cccap_household_income, [+, [lookup, cccap_poverty_guideline_table, [min, cccap_household_size, 8]], ["*", cccap_poverty_guideline_each_additional, [max, 0, ["-", cccap_household_size, 8]]]]]], ["*", cccap_parent_fee_additional_child_amount, [max, 0, ["-", [count, [filter, cccap_household_members, [of, [P], cccap_is_eligible_child]]], 1]]]]]]
sources: [S781, S782, S785]
open: [OQ-254]
implemented: engine
tags: [income, household]
rationale: No existing item computes the CCCAP parent fee; cccap_parent_fee (CO-1290) applies the reductions and exceptions to this figure.
tests:
  - {id: CO-1289-T1, title: "At the guideline - 1% of income", as_of: "2026-10-01", month: "2026-10", given: {cccap_household_income: 2000, cccap_household_size: 3, cccap_household_members: []}, expect: 20}
  - {id: CO-1289-T2, title: "Household of 4 at $3,750 - $1,000 over the $2,750 guideline, two children in care - 37.50 + 140 + 15", as_of: "2026-10-01", month: "2026-10", given: {cccap_household_income: 3750, cccap_household_size: 4, cccap_household_members: [p1, p2, p3], cccap_is_eligible_child: false}, others: {p2: {cccap_is_eligible_child: true}, p3: {cccap_is_eligible_child: true}}, expect: 192.5}
