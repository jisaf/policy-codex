id: CO-4060
name: "CCCAP: immunization verification is pending"
identifier: cccap_immunization_verification_is_pending
kind: derived
type: yes/no
scope: person-month
program: CCCAP
meaning: "Whether CCCAP still needs this child's immunization record (or a religious or medical exemption): an eligible child who is not attending school and is in care outside the home from an unrelated qualified exempt provider (8 CCR 1403-1 3.111.F.2), outside a homeless family's stabilization period (3.121.B.6), whose record has not been received, where CCCAP verification applies to the person."
precision: "The element cccap_person_pending_verification_count (CO-1448) counted inline, made its own item so the protective services due date (cccap_protective_services_verification_due_date, CO-4061) can tell it from the others. Due by: cccap_verification_due_date (CO-1450); sixty days for a protective services household (3.119.G). Coverage round F-06: the record is asked for at an application, a redetermination (3.113.A.3; a missing record ends care \"at re-determination only\", 3.114.B.7, S3251) and for a child added during the period, not again at a change for a child already authorized (cccap_child_was_authorized_at_last_determination, CO-4462, read as false when not stated): 3.125.Q (S3252) does not let a missing record discontinue care before the redetermination."
derived: [all, cccap_verification_is_applicable, cccap_is_eligible_child, [not, [all, ["=", cccap_determination_type, change_during_eligibility_period], [otherwise, cccap_child_was_authorized_at_last_determination, false]]], [otherwise, cccap_care_is_from_unrelated_exempt_provider_outside_home, false], [not, cccap_is_attending_school], [not, cccap_is_in_homelessness_stabilization], [not, cccap_immunization_record_received]]
sources: [S1637, S2710, S2852, S3251, S3252]
nearest: [CO-1448]
implemented: engine
tags: [verification]
rationale: "Second-pass review N-6: a protective services household has sixty days for the immunization record (3.119.G) and for the children's income (3.119.B), six months for citizenship, age and identity (3.119.F), and the usual fifteen days for anything else; the due date must tell the pending elements apart, and the immunization element had no item."
tests:
  - {id: CO-4060-T1, title: "A three-year-old in an unrelated exempt provider's home, no record received", as_of: "2026-10-01", month: "2026-10", given: {cccap_verification_is_applicable: true, cccap_is_eligible_child: true, cccap_care_is_from_unrelated_exempt_provider_outside_home: true, cccap_is_attending_school: false, cccap_is_in_homelessness_stabilization: false, cccap_immunization_record_received: false}, expect: true}
  - {id: CO-4060-T2, title: "The same child in a licensed center", as_of: "2026-10-01", month: "2026-10", given: {cccap_verification_is_applicable: true, cccap_is_eligible_child: true, cccap_care_is_from_unrelated_exempt_provider_outside_home: false}, expect: false}
