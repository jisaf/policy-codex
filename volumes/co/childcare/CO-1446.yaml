id: CO-1446
name: "CCCAP: requires verification of child support paid"
identifier: cccap_requires_verification_of_child_support_paid
kind: derived
type: yes/no
scope: person-month
program: CCCAP
meaning: "Whether a caretaker's court-ordered child support payments must be verified for CCCAP: the payments are deducted only when verified as ordered and paid."
derived: [all, [any, cccap_is_adult_caretaker, cccap_is_teen_parent], [">", child_support_paid_legally_obligated, 0]]
