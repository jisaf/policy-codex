id: CO-1448
name: "CCCAP: person's pending verification count"
identifier: cccap_person_pending_verification_count
kind: derived
type: whole number
scope: person-month
program: CCCAP
role: outcome
meaning: "The number of CCCAP eligibility verification elements required for this person and not yet verified: residency, eligible activity, a child's citizenship, age and identity, earned and unearned income, hours worked and a child's additional care needs. Child support paid, which affects only a deduction, is counted separately."
derived: ["+", [case, [cccap_residency_verification_is_pending, 1], [else, 0]], [case, [cccap_eligible_activity_verification_is_pending, 1], [else, 0]], [case, [cccap_citizenship_verification_is_pending, 1], [else, 0]], [case, [cccap_age_verification_is_pending, 1], [else, 0]], [case, [cccap_identity_verification_is_pending, 1], [else, 0]], [case, [cccap_earned_income_verification_is_pending, 1], [else, 0]], [case, [unearned_income_verification_is_pending, 1], [else, 0]], [case, [cccap_work_hours_verification_is_pending, 1], [else, 0]], [case, [cccap_additional_care_needs_verification_is_pending, 1], [else, 0]]]
sources: [S890, S891, S892, S1081, S1082]
implemented: engine
tags: [verification]
rationale: "Fix round (review U-1, C-12, K-4): the count sums the named per-element items and leaves the child support deduction to cccap_pending_deduction_verification_count."
tests:
  - {id: CO-1448-T1, month: "2026-10", as_of: "2026-10-01", given: {cccap_residency_verification_is_pending: true, cccap_eligible_activity_verification_is_pending: false, cccap_citizenship_verification_is_pending: false, cccap_age_verification_is_pending: false, cccap_identity_verification_is_pending: false, cccap_earned_income_verification_is_pending: false, cccap_work_hours_verification_is_pending: true, cccap_additional_care_needs_verification_is_pending: false, unearned_income_verification_is_pending: false}, expect: 2}
  - {id: CO-1448-T2, month: "2026-10", as_of: "2026-10-01", given: {cccap_residency_verification_is_pending: false, cccap_eligible_activity_verification_is_pending: false, cccap_citizenship_verification_is_pending: false, cccap_age_verification_is_pending: false, cccap_identity_verification_is_pending: false, cccap_earned_income_verification_is_pending: false, cccap_work_hours_verification_is_pending: false, cccap_additional_care_needs_verification_is_pending: false, unearned_income_verification_is_pending: false}, expect: 0}
