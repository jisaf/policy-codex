id: CO-1448
name: "CCCAP: person's pending verification count"
identifier: cccap_person_pending_verification_count
kind: derived
type: whole number
scope: person-month
program: CCCAP
meaning: The number of CCCAP verification elements required for this person and not yet verified.
derived: ["+", [case, [[all, cccap_requires_verification_of_residency, [not, residency_verification_document_received]], 1], [else, 0]], [case, [[all, cccap_requires_verification_of_eligible_activity, [not, eligible_activity_verification_document_received]], 1], [else, 0]], [case, [[all, cccap_requires_verification_of_citizenship, [not, [any, citizenship_verified_by_electronic_data_source, citizenship_verification_document_received]]], 1], [else, 0]], [case, [[all, cccap_requires_verification_of_age, [not, age_is_verified]], 1], [else, 0]], [case, [[all, cccap_requires_verification_of_identity, [not, [any, identity_verified_by_electronic_data_source, identity_verification_document_received]]], 1], [else, 0]], [case, [[all, cccap_requires_verification_of_earned_income, [not, earned_income_verification_document_received]], 1], [else, 0]], [case, [[all, has_unearned_income, [not, unearned_income_is_verified]], 1], [else, 0]], [case, [[all, cccap_requires_verification_of_child_support_paid, [not, child_support_paid_is_verified]], 1], [else, 0]]]
sources: [S890, S891, S892]
implemented: engine
tags: [verification]
rationale: No existing item counts a CCCAP household member's outstanding verifications; unearned income counts on the shared presence fact because 3.111.H.5.b (S891) verifies any unearned income received.
tests:
  - {id: CO-1448-T1, month: "2026-10", as_of: "2026-10-01", given: {cccap_requires_verification_of_residency: false, cccap_requires_verification_of_eligible_activity: true, cccap_requires_verification_of_citizenship: false, cccap_requires_verification_of_age: false, cccap_requires_verification_of_identity: false, cccap_requires_verification_of_earned_income: false, has_unearned_income: false, cccap_requires_verification_of_child_support_paid: false, eligible_activity_verification_document_received: false}, expect: 1}
  - {id: CO-1448-T2, month: "2026-10", as_of: "2026-10-01", given: {cccap_requires_verification_of_residency: false, cccap_requires_verification_of_eligible_activity: false, cccap_requires_verification_of_citizenship: false, cccap_requires_verification_of_age: false, cccap_requires_verification_of_identity: false, cccap_requires_verification_of_earned_income: false, has_unearned_income: false, cccap_requires_verification_of_child_support_paid: false}, expect: 0}
