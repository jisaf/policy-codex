id: CO-1448
name: "CCCAP: person's pending verification count"
identifier: cccap_person_pending_verification_count
kind: derived
type: whole number
scope: person-month
program: CCCAP
role: outcome
meaning: "The number of CCCAP eligibility verification elements required for this person and not yet verified: residency, eligible activity, a child's citizenship, age and identity, earned and unearned income, hours worked and a child's additional care needs. Child support paid, which affects only a deduction, is counted separately; and a child's immunization record when the child is not school-aged and in care outside the home from an unrelated exempt provider (3.111.F.2), the activity schedule when non-traditional hours are requested or the caretaker is self-employed (C.2.e, G.2), an unrelated caretaker's verification (D.5) and a custody or parenting schedule that applies (C.2.h)."
precision: "Zero where CCCAP verification does not apply to the person (cccap_verification_is_applicable, CO-2585; case worker review B2). Final pass F-02: no immunization record is required during a homeless family's stabilization period (3.121.B.6, cccap_is_in_homelessness_stabilization, CO-3907). Second-pass review N-6: the immunization element is its own item (cccap_immunization_verification_is_pending, CO-4060)."
derived: [case, [cccap_verification_is_applicable, ["+", [case, [cccap_residency_verification_is_pending, 1], [else, 0]], [case, [cccap_eligible_activity_verification_is_pending, 1], [else, 0]], [case, [cccap_citizenship_verification_is_pending, 1], [else, 0]], [case, [cccap_age_verification_is_pending, 1], [else, 0]], [case, [cccap_identity_verification_is_pending, 1], [else, 0]], [case, [cccap_earned_income_verification_is_pending, 1], [else, 0]], [case, [cccap_unearned_income_verification_is_pending, 1], [else, 0]], [case, [cccap_work_hours_verification_is_pending, 1], [else, 0]], [case, [cccap_additional_care_needs_verification_is_pending, 1], [else, 0]], [case, [cccap_immunization_verification_is_pending, 1], [else, 0]], [case, [[all, [any, [otherwise, cccap_non_traditional_hours_are_requested, false], [all, [any, cccap_is_adult_caretaker, cccap_is_teen_parent], [">", self_employment_gross_receipts, 0]]], [not, cccap_activity_schedule_received]], 1], [else, 0]], [case, [[otherwise, cccap_unrelated_caretaker_verification_is_outstanding, false], 1], [else, 0]], [case, [[otherwise, cccap_custody_schedule_is_outstanding, false], 1], [else, 0]]]], [else, 0]]
sources: [S890, S891, S892, S1081, S1082, S1637]
implemented: engine
tags: [verification]
rationale: "Fix round (review U-1, C-12, K-4): the count sums the named per-element items and leaves the child support deduction to cccap_pending_deduction_verification_count. Case worker review S11: the authoring note \"phase-10 sweep (OQ-378)\" moved out of the meaning, which states only what the fact is. Same-word audit SW-27: counts the program's own unearned-income element (cccap_unearned_income_verification_is_pending). Same-word audit SW-13: the immunization record is read against CCCAP's own attending-school item (CO-2884), not SUN Bucks's school age."
tests:
  - {id: CO-1448-T1, month: "2026-10", as_of: "2026-10-01", given: {cccap_verification_is_applicable: true, cccap_is_teen_parent: false, cccap_is_adult_caretaker: false, cccap_is_eligible_child: false, cccap_residency_verification_is_pending: true, cccap_eligible_activity_verification_is_pending: false, cccap_citizenship_verification_is_pending: false, cccap_age_verification_is_pending: false, cccap_identity_verification_is_pending: false, cccap_earned_income_verification_is_pending: false, cccap_work_hours_verification_is_pending: true, cccap_additional_care_needs_verification_is_pending: false, cccap_unearned_income_verification_is_pending: false}, expect: 2}
  - {id: CO-1448-T2, month: "2026-10", as_of: "2026-10-01", given: {cccap_verification_is_applicable: true, cccap_is_teen_parent: false, cccap_is_adult_caretaker: false, cccap_is_eligible_child: false, cccap_residency_verification_is_pending: false, cccap_eligible_activity_verification_is_pending: false, cccap_citizenship_verification_is_pending: false, cccap_age_verification_is_pending: false, cccap_identity_verification_is_pending: false, cccap_earned_income_verification_is_pending: false, cccap_work_hours_verification_is_pending: false, cccap_additional_care_needs_verification_is_pending: false, cccap_unearned_income_verification_is_pending: false}, expect: 0}
