id: CO-3907
name: "CCCAP: family experiencing homelessness in its stabilization period"
identifier: cccap_is_in_homelessness_stabilization
kind: derived
type: yes/no
scope: person-month
program: CCCAP
meaning: "Whether this person's family is a family experiencing homelessness (8 CCR 1403-1 3.103.CCC, cccap_is_family_experiencing_homelessness, CO-2814) and the month is within its stabilization period, the at least sixty consecutive days within twelve months during which 3.121.B requires a child care authorization, the caretakers need not be in an eligible activity (B.3.a), residency and the children's citizenship, age and identity are self-declared (B.4-5), no immunization record is required (B.6), and there is no parent fee (3.124.I.5)."
precision: "The stabilization period is the county's authorization, cccap_is_in_homelessness_stabilization_period (CO-2577), read as false when not stated. Coverage pass 2 C2-5: the household is a family experiencing homelessness when an eligible child of the household (cccap_household_members, CO-982) lives in one of 3.103.CCC's settings (\"Children who are ...\", S1954), read on the child's own nighttime_residence_type and as not when not stated, so every member gets the same value; before the fix each member's own residence was read, and a father involuntarily absent in jail was ineligible_activity while his wife and son were eligible_homelessness_stabilization (probe Z-4)."
derived: [all, [otherwise, cccap_is_in_homelessness_stabilization_period, false], [exists, cccap_household_members, [all, [of, [P], cccap_is_eligible_child], [otherwise, [of, [P], cccap_is_family_experiencing_homelessness], false]]]]
sources: [S1823, S2710]
implemented: engine
tags: [household]
rationale: "Final pass F-02: the stabilization period changes eligibility (an authorization without an eligible activity, cccap_eligibility_status, CO-989), verification (CO-1440, CO-1442 to CO-1444, the immunization element of CO-1447 and CO-1448, and the due date read by CO-1451) and the fee (CO-1290). The fee wrote the test inline; one item now states it for every reader."
tests:
  - {id: CO-3907-T1, title: "A family living in a shelter, in its stabilization period", as_of: "2026-10-01", month: "2026-10", given: {nighttime_residence_type: emergency_or_transitional_shelter, cccap_is_in_homelessness_stabilization_period: true, immigration_status: us_citizen, date_of_birth: "1985-01-22", cccap_is_financially_contributing_to_child: true}, others: {p5: {nighttime_residence_type: emergency_or_transitional_shelter, immigration_status: us_citizen, date_of_birth: "2026-02-03", cccap_child_has_additional_care_needs: false, cccap_child_needs_care_for_part_of_day: true}}, relationships: [[parent, p1, p5]], expect: true}
  - {id: CO-3907-T2, title: "The period has not been authorized (not stated)", as_of: "2026-10-01", month: "2026-10", given: {nighttime_residence_type: emergency_or_transitional_shelter}, expect: false}
  - {id: CO-3907-T3, title: "A family with a fixed, regular and adequate residence", as_of: "2026-10-01", month: "2026-10", given: {nighttime_residence_type: fixed_regular_adequate, cccap_is_in_homelessness_stabilization_period: true, immigration_status: us_citizen, date_of_birth: "1985-01-22", cccap_is_financially_contributing_to_child: true}, others: {p5: {nighttime_residence_type: fixed_regular_adequate, immigration_status: us_citizen, date_of_birth: "2026-02-03", cccap_child_has_additional_care_needs: false, cccap_child_needs_care_for_part_of_day: true}}, relationships: [[parent, p1, p5]], expect: false}
  - {id: CO-3907-T4, title: "C2-5 (probe Z-4): the father, involuntarily absent in jail, of a mother and son in a shelter", as_of: "2026-10-01", month: "2026-10", given: {nighttime_residence_type: institution, cccap_caretaker_is_involuntarily_absent: true, cccap_is_in_homelessness_stabilization_period: true, immigration_status: us_citizen, date_of_birth: "1986-01-01", cccap_is_financially_contributing_to_child: true}, others: {p2: {nighttime_residence_type: emergency_or_transitional_shelter, immigration_status: us_citizen, date_of_birth: "1985-01-22", cccap_is_financially_contributing_to_child: true}, p5: {nighttime_residence_type: emergency_or_transitional_shelter, immigration_status: us_citizen, date_of_birth: "2020-03-10", cccap_child_has_additional_care_needs: false, cccap_child_needs_care_for_part_of_day: true}}, relationships: [[parent, p1, p5], [parent, p2, p5], [spouse, p1, p2]], expect: true}
