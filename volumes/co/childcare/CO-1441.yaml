id: CO-1441
name: "CCCAP: requires verification of eligible activity"
identifier: cccap_requires_verification_of_eligible_activity
kind: derived
type: yes/no
scope: person-month
program: CCCAP
meaning: "Whether the person's low-income eligible activity must be verified for CCCAP: every adult caretaker and teen parent, except in a protective services case or a Colorado Works child care referral, where the activity requirement comes from that program, and in a Child Welfare Child Care household, whose eligibility the Child Welfare division determines."
precision: "Second-pass review P2: not for an adult caretaker in the substance use disorder treatment activity (cccap_is_in_sud_treatment_activity, CO-4074, read as false when it cannot be decided), whose enrollment is verified through self-attestation (3.111.G.4.d, 3.125.CC). Coverage round F-14: not for a Child Welfare Child Care household (cccap_is_child_welfare_child_care_household, CO-2576, read as false when not stated): 3.120.D (S2709) makes its eligibility the Child Welfare division's case-by-case finding under 12 CCR 2509-4 7.302 (S3259), which has no CCCAP activity or income test; before the fix such a household was asked for activity and income documents and reported past_due (probe RV-J). cccap_requires_verification_of_work_hours (CO-1684) follows this item. Coverage pass 3 C3-3: the referral is read over the household (as cccap_household_unearned_income, CO-2873, reads it), so a second caretaker in the Colorado Works unit who is not stated as referred is not asked for CCCAP documents either; before the fix he was (probe Y-2). Coverage pass 5, X5-3 (docs/reviews/coverage5-care-energy.md; OQ-134): a Colorado Works Child Care household is read as the eligibility reader reads it, cccap_colorado_works_child_care_eligible (CO-988), which reads the county Colorado Works worker's referral (is_referred_for_colorado_works_child_care, CO-896) with no default, for a caretaker who receives Colorado Works and is work-eligible or a diversion household (8 CCR 1403-1 3.116.A, H; 3.116.C-F, S3637: the county Colorado Works program verifies county residency and the children's citizenship, age and identity, and reports the earned income). Before, these readers read the referral of any member as not referred when not stated, so an unstated referral asked a Colorado Works Child Care household for the verifications Colorado Works supplies."
derived: ["all", ["any", "cccap_is_adult_caretaker", "cccap_is_teen_parent"], ["not", "is_protective_services_child_care_case"], ["not", "cccap_colorado_works_child_care_eligible"], ["not", ["otherwise", "cccap_is_child_welfare_child_care_household", false]], ["not", ["otherwise", "cccap_is_in_sud_treatment_activity", false]]]
sources: [S890, S2857, S2709, S3259, S3637]
open: [OQ-134]
implemented: engine
tags: [verification, household]
rationale: No existing item states this CCCAP verification requirement; the phase-9 chapter needs it to count the household's pending verifications.
tests:
  # Coverage pass 5, X5-3: the tests state the Colorado Works Child Care household (cccap_colorado_works_child_care_eligible, CO-988) in place of a member's referral, which these items no longer read; no expectation changed.
  - {id: CO-1441-T1, month: "2026-10", as_of: "2026-10-01", given: {cccap_household_members: [p1], cccap_is_adult_caretaker: true, is_protective_services_child_care_case: false, cccap_colorado_works_child_care_eligible: false}, expect: true}
  - {id: CO-1441-T2, month: "2026-10", as_of: "2026-10-01", given: {cccap_colorado_works_child_care_eligible: false, cccap_is_adult_caretaker: true, is_protective_services_child_care_case: true}, expect: false}
  - {id: CO-1441-T3, month: "2026-10", as_of: "2026-10-01", given: {cccap_colorado_works_child_care_eligible: false, cccap_is_adult_caretaker: false, cccap_is_teen_parent: false}, expect: false}
  - {id: CO-1441-T4, title: "Second-pass P2: a mother in intensive outpatient treatment attests her enrollment; no document is asked (3.111.G.4.d)", month: "2026-10", as_of: "2026-10-01", given: {cccap_is_adult_caretaker: true, is_protective_services_child_care_case: false, cccap_colorado_works_child_care_eligible: false, cccap_is_in_sud_treatment_activity: true}, expect: false}
  - {id: CO-1441-T5, title: "F-14: a Child Welfare Child Care household's working caretaker is not asked to verify the activity (3.120.D)", month: "2026-10", as_of: "2026-10-01", given: {cccap_is_adult_caretaker: true, is_protective_services_child_care_case: false, cccap_colorado_works_child_care_eligible: false, cccap_is_child_welfare_child_care_household: true}, expect: false}
  - {"id": "CO-1441-T6", "title": "X5-3: CO-1441-T1's household, a Colorado Works Child Care household (cccap_colorado_works_child_care_eligible): Colorado Works supplies it (3.116.C-F), false", "month": "2026-10", "as_of": "2026-10-01", "given": {"cccap_household_members": ["p1"], "cccap_is_adult_caretaker": true, "is_protective_services_child_care_case": false, "cccap_colorado_works_child_care_eligible": true}, "expect": false}
