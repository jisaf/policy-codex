  - {"id": "CO-5725-T3", "title": "C5-1: child support of $300 a month as a stream whose end_date is 2026-09-30: 0", "month": "2026-11", "as_of": "2026-11-15", "given": {"cccap_application_or_redetermination_date": "2026-11-15", "receipts": [{"kind": "child_support", "amount": 300, "end_date": "2026-09-30"}]}, "expect": 0}
