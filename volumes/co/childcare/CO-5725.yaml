id: CO-5725
name: "CCCAP: a person's counted child support"
identifier: cccap_counted_child_support
kind: derived
type: money
scope: person-month
program: CCCAP
meaning: "The child support the person's countable unearned income holds for the month (8 CCR 1403-1 3.111.I.29), as it is counted there: current support and arrears received in the month at their amount, a lump-sum child support payment received in the month at one twelfth (H.4.i). The amount a protective services household does not count (3.119.A: \"Child support income shall not be included as income\")."
precision: "Reads the receipts of the kinds the counting table treats as child support (counted_child_support: child_support and child_support_arrears). Replaces child_support_received (CO-028, which held arrears as a part) for cccap_protective_services_income (CO-994) and cccap_has_countable_unearned_income (CO-2873). Coverage pass 4 C4-2: a recurring child support receipt stated with its date is placed in the thirty days, as cccap_counted_recurring_receipts (CO-5721) places it, so this figure is the child support the unearned income holds; a lump sum paid once stays in the month received (H.4.i). Coverage pass 5, C5-1 (docs/reviews/coverage5-care-energy.md): a record stated with neither a month nor a date (a stream) is the pay or payment of the days its source ran (docs/conventions.md, \"A record's time\"; job_start_date and job_end_date for pay, start_date and end_date for a receipt). It stands for the thirty days only when its source ran through all of them (none of its dates after their first day or before their last); it is not read when its source ended before their first day or began on or after cccap_application_or_redetermination_date; and a source that began or ended inside the thirty days is placed by its dated records, so a stream without them cannot determine and the record's date is named as missing (8 CCR 1403-1 3.111.H.4, H.5.a.1, H.5.b, S2704, S891: the income \"received during the prior thirty (30) day period\"; OQ-680 (2)). A record stated with its month or its date is placed as before."
derived: ["sum_receipts", "receipts", ["all", ["=", ["lookup", "cccap_receipt_treatment_table", ["receipt", "kind"]], "counted_child_support"], ["case", [["=", ["receipt", "frequency"], "once"], ["received_in", ["month"]]], ["else", ["case", [["not", ["unknown", ["receipt", "month"]]], ["case", [["unknown", ["receipt", "date"]], ["received_in", ["month"]]], ["else", ["all", [">=", ["receipt", "date"], ["days_after", ["-", 0, "cccap_prior_income_period_days"], "cccap_application_or_redetermination_date"]], ["<", ["receipt", "date"], "cccap_application_or_redetermination_date"]]]]], [["any", ["all", ["not", ["unknown", ["receipt", "end_date"]]], ["<", ["receipt", "end_date"], ["days_after", ["-", 0, "cccap_prior_income_period_days"], "cccap_application_or_redetermination_date"]]], ["all", ["not", ["unknown", ["receipt", "start_date"]]], [">=", ["receipt", "start_date"], "cccap_application_or_redetermination_date"]]], false], [["all", ["any", ["unknown", ["receipt", "start_date"]], ["<=", ["receipt", "start_date"], ["days_after", ["-", 0, "cccap_prior_income_period_days"], "cccap_application_or_redetermination_date"]]], ["any", ["unknown", ["receipt", "end_date"]], [">=", ["receipt", "end_date"], ["days_after", -1, "cccap_application_or_redetermination_date"]]]], ["case", [["unknown", ["receipt", "date"]], ["received_in", ["month"]]], ["else", ["all", [">=", ["receipt", "date"], ["days_after", ["-", 0, "cccap_prior_income_period_days"], "cccap_application_or_redetermination_date"]], ["<", ["receipt", "date"], "cccap_application_or_redetermination_date"]]]]], ["else", ["all", [">=", ["receipt", "date"], ["days_after", ["-", 0, "cccap_prior_income_period_days"], "cccap_application_or_redetermination_date"]], ["<", ["receipt", "date"], "cccap_application_or_redetermination_date"]]]]]]], ["case", [["=", ["receipt", "frequency"], "once"], ["/", ["receipt", "amount"], "cccap_lump_sum_averaging_months"]], ["else", ["receipt", "amount"]]]]
sources: [S488, S4020, S2704, S891]
implemented: engine
tags: [income]
open: [OQ-680]
rationale: "Receipt records, migration phase 2: the child support 3.119.A leaves out of a protective services household's income, read from the receipts as the countable income counts it."
tests:
  - {id: CO-5725-T1, month: "2026-11", as_of: "2026-11-15", given: {receipts: [{kind: child_support, amount: 250}, {kind: child_support_arrears, amount: 50}, {kind: social_security, amount: 400}]}, title: "Current support and arrears; Social Security is not child support", expect: 300}
  - {id: CO-5725-T2, month: "2026-11", as_of: "2026-11-15", given: {receipts: [{kind: child_support_arrears, amount: 1200, frequency: once, month: "2026-11"}]}, title: "A lump-sum child support payment, at the twelfth it is counted at (H.4.i)", expect: 100}
