id: CO-4463
name: "CCCAP: unearned receipts excluded from countable income"
identifier: cccap_excluded_unearned_receipts
kind: derived
type: money
scope: person-month
program: CCCAP
meaning: "The part of the person's unearned income for the month that 8 CCR 1403-1 3.111.I-J does not count and that CCCAP's counting table (cccap_receipt_treatment_table) still counts: a landlord's expenses up to the rents (I.12 and I.17 count net rental income); a penalty deducted from an early retirement payout (I.8); and a state Colorado Works diversion paid over four or more consecutive months, which 3.103.S makes cash assistance and J.26 excludes."
precision: "Receipt records, migration phase 2 (docs/reviews/receipts-migration-2-cccap-sunbucks.md): foster care and kinship care payments (J.10), Social Security set aside under a PASS (J.13), WIA and WIOA training allowances and youth project payments (J.17, J.18), Colorado Works supportive services (J.23) and the Home Care Allowance (J.24) are now rows of the counting table, and are no longer taken out here. Receipt records, migration phase 3: adoption subsidy payments (J.10) and early childhood research study payments (J.29) are receipt kinds of their own, which the counting table excludes, so they are no longer taken out here (they were adoption_subsidy_received, CO-4451, and early_childhood_research_study_payments_received, CO-4453, parts of the other unearned income, both retired). rental_property_expenses_paid (CO-4458) is taken against the month's recurring receipts of rent (rental_income) and the other taxable unearned income (other_taxable) together, no more than they are, since the expenses' meaning covers rents \"stated in the person's other unearned income facts\" (coverage pass 2 C2-4, probe Z-5). retirement_early_withdrawal_penalty (CO-4459) is no more than the month's recurring pension receipts. A diversion is a cash assistance when tanf_state_diversion_payment_months (CO-4911, read as 0 when not stated) is at least cccap_state_diversion_cash_assistance_months (CO-4912, four), and is then taken out at what it was counted at (a one-time diversion at one twelfth, H.4.i). A shorter state diversion and a county diversion are not cash assistance; 3.111.I neither names nor excludes them, and they are counted (OQ-873). Before the fix every diversion was counted (probe Y-7). cccap_person_unearned_income (CO-3916) subtracts this item. Coverage pass 4 C4-2: the recurring receipts these deductions are taken against are placed as cccap_counted_recurring_receipts (CO-5721) places them, by date in the thirty days when dated, so a deduction is never taken against a receipt that is not counted; a diversion paid once stays in the month received (H.4.i). Coverage pass 4 X4-1: tanf_state_diversion_payment_months is read only for a person whose receipts hold a diversion, and with no default: 3.103.S gives no reading for a diversion whose kind (state or county) or length is not stated (decision 4 of 2026-11-23; before it, read as 0, not cash assistance). rental_property_expenses_paid and retirement_early_withdrawal_penalty keep their reading as 0 when not stated: each is a deduction the client claims, and I.8, I.12 and I.17 count the income less an expense shown, as G.2.a does not consider business expenses that are not verified."
