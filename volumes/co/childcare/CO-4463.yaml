id: CO-4463
name: "CCCAP: unearned receipts excluded from countable income"
identifier: cccap_excluded_unearned_receipts
kind: derived
type: money
scope: person-month
program: CCCAP
meaning: "The part of the person's unearned income for the month that 8 CCR 1403-1 3.111.I-J does not count and that unearned_income_prior_thirty_days (CO-3913) and social_security_income still hold: foster care, kinship care and adoption subsidy payments (J.10); Social Security set aside under a plan for self-support (J.13); WIA and WIOA training allowances and youth employment project payments (J.17, J.18); Colorado Works supportive service payments (J.23); the Home Care Allowance (J.24); early childhood research study payments (J.29); a state Colorado Works diversion paid over four or more consecutive months, which 3.103.S makes cash assistance and J.26 excludes; a landlord's expenses up to the rents (I.12 and I.17 count net rental income); and a penalty deducted from an early retirement payout (I.8)."
precision: "Each part is a neutral receipt fact read as 0 when not stated: foster_care_provider_payments_received (CO-3821), adoption_subsidy_received (CO-4451), kinship_care_payments_received (CO-4503; coverage review 2 N-6 split kinship payments out of CO-4451), pass_set_aside_income (CO-3825, no more than the month's Social Security, since J.13 excludes Social Security under the plan), workforce_program_payments_received (CO-3815; J.17 names WIA, the Workforce Innovation and Opportunity Act's predecessor), tanf_supportive_service_payments_received (CO-4452), in_home_care_allowance_received (CO-3824), early_childhood_research_study_payments_received (CO-4453), rental_property_expenses_paid (CO-4458, no more than rental_income_received, CO-4457, or, when a case does not state that fact and states the rents only in other_unearned_income_taxable, CO-1714, no more than that amount; coverage pass 2 C2-4, probe Z-5) and retirement_early_withdrawal_penalty (CO-4459, no more than pension_income). Each is a calendar-month receipt; where a case states the prior thirty days' unearned income instead (CO-3911), the month determined is read, the convention Social Security already follows (OQ-680). cccap_person_unearned_income (CO-3916) subtracts this item. Coverage pass 3 C3-6: a Colorado Works diversion (tanf_diversion_payment_received, CO-4850) is excluded when it is a state diversion paid over at least cccap_state_diversion_cash_assistance_months (CO-4912, four) consecutive months (tanf_state_diversion_payment_months, CO-4911, read as 0 when not stated), since 3.103.S (S3638) makes it cash assistance and 3.111.J.26 (S2706) excludes \"Public cash assistance grants including ... (TANF)/Colorado Works\". A shorter state diversion and a county diversion are not cash assistance; 3.111.I neither names nor excludes them, and they are counted with the unearned income they are part of (OQ-873). Before the fix every diversion was counted (probe Y-7)."
derived: ["+", [otherwise, foster_care_provider_payments_received, 0], [otherwise, adoption_subsidy_received, 0], [otherwise, kinship_care_payments_received, 0], [case, [[">", [otherwise, pass_set_aside_income, 0], 0], [min, pass_set_aside_income, social_security_income]], [else, 0]], [otherwise, workforce_program_payments_received, 0], [otherwise, tanf_supportive_service_payments_received, 0], [otherwise, in_home_care_allowance_received, 0], [otherwise, early_childhood_research_study_payments_received, 0], [case, [[">", [otherwise, rental_property_expenses_paid, 0], 0], [min, rental_property_expenses_paid, [otherwise, rental_income_received, [otherwise, other_unearned_income_taxable, 0]]]], [else, 0]], [case, [[">", [otherwise, retirement_early_withdrawal_penalty, 0], 0], [min, retirement_early_withdrawal_penalty, pension_income]], [else, 0]], [case, [[">=", [otherwise, tanf_state_diversion_payment_months, 0], cccap_state_diversion_cash_assistance_months], [otherwise, tanf_diversion_payment_received, 0]], [else, 0]]]
sources: [S3256, S3257, S3638, S2706]
implemented: engine
tags: [income]
open: [OQ-680, OQ-873]
rationale: "Coverage round (docs/reviews/coverage-cccap.md, F-07, F-10, F-25): the volume's neutral facts for these receipts each say the amount is part of the person's gross unearned income and every program reads it as 0 when not stated, but CCCAP subtracted only educational aid, loans, reimbursements, energy aid, tax refunds, federally excluded payments and lump sums (CO-3913), so it counted foster care payments, a PASS set-aside, WIOA training allowances and the Home Care Allowance that 3.111.J excludes, and rents and pensions gross where 3.111.I counts them net (probe RV-E: $2,000 of wages and a $1,500 foster care payment counted as $3,500, ineligible_income). unearned_income_prior_thirty_days is shared with LEAP, whose exclusions differ, so CCCAP's own exclusions are this item."
nearest: [CO-4076, CO-3913]
