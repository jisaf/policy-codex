rationale: "Coverage round (docs/reviews/coverage-cccap.md, F-07, F-10, F-25): CCCAP counted foster care payments, a PASS set-aside, WIOA training allowances and the Home Care Allowance that 3.111.J excludes, and rents and pensions gross where 3.111.I counts them net (probe RV-E: $2,000 of wages and a $1,500 foster care payment counted as $3,500, ineligible_income). Receipt records, migration phase 2: the exclusions a kind of receipt carries are the counting table's; this item keeps the receipts no kind names and the deductions that are not receipts."
nearest: [CO-4076]
