id: CO-1676
name: "CCCAP: residency verification is pending"
identifier: cccap_residency_verification_is_pending
kind: derived
type: yes/no
scope: person-month
program: CCCAP
role: outcome
meaning: Whether CCCAP requires verification of the person's county residence and it has not been provided.
precision: "False where CCCAP verification does not apply to the person (cccap_verification_is_applicable, CO-2585; case worker review B2). Due by: cccap_verification_due_date (CO-1450)."
derived: [all, cccap_verification_is_applicable, [all, cccap_requires_verification_of_residency, [not, residency_verification_document_received]]]
sources: [S890]
implemented: engine
tags: [verification]
rationale: "Review U-1: the count items held this test as an anonymous arm, so no outcome told a worker which document was outstanding and for whom; the count now sums this item."
tests:
  - {id: CO-1676-T1, month: "2026-10", as_of: "2026-10-01", given: {cccap_verification_is_applicable: true, cccap_requires_verification_of_residency: true, residency_verification_document_received: false}, expect: true}
  - {id: CO-1676-T2, month: "2026-10", as_of: "2026-10-01", given: {cccap_verification_is_applicable: true, cccap_requires_verification_of_residency: true, residency_verification_document_received: true}, expect: false}
  - {id: CO-1676-TNA, title: "B2: not pending where CCCAP verification does not apply", as_of: "2026-10-01", month: "2026-10", given: {cccap_verification_is_applicable: false}, expect: false}
