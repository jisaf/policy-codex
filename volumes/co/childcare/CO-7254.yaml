id: CO-7254
name: "CCCAP: hours in the month in businesses stated as receipts"
identifier: cccap_business_receipts_hours
kind: derived
type: hours
scope: person-month
program: CCCAP
meaning: "The hours the person worked in the month in the businesses whose receipts the earnings records state (earnings, CO-5100: self_employment_receipts records, their hours), placed in the month as cccap_self_employment_gross_receipts (CO-5156) places the receipts: the hours 8 CCR 1403-1 3.111.H.4.e's twenty-hour average of active management of rental property is taken over (cccap_rental_property_receipts_as_unearned, CO-7251)."
precision: "Coverage pass 6 for CCCAP, R6-4 (docs/reviews/coverage6-care-energy.md). The hours of every business stated as receipts are read together, so the same business stated in one record or split over two gives one answer (the records harness's split relation); a caretaker whose rental property and another business together reach the line is read as actively managing (OQ-1366 records the other reading, property by property). Unknown when a record's hours are unstated (decision 4)."
derived: ["sum_receipts", "earnings", ["all", ["=", ["lookup", "cccap_earnings_treatment_table", ["receipt", "kind"]], "counted_self_employment"], ["case", [["not", ["unknown", ["receipt", "month"]]], ["received_in", ["month"]]], [["any", ["all", ["not", ["unknown", ["receipt", "job_end_date"]]], ["<", ["receipt", "job_end_date"], ["days_after", ["-", 0, "cccap_prior_income_period_days"], "cccap_application_or_redetermination_date"]]], ["all", ["not", ["unknown", ["receipt", "job_start_date"]]], [">=", ["receipt", "job_start_date"], "cccap_application_or_redetermination_date"]]], false], [["all", ["any", ["unknown", ["receipt", "job_start_date"]], ["<=", ["receipt", "job_start_date"], ["days_after", ["-", 0, "cccap_prior_income_period_days"], "cccap_application_or_redetermination_date"]]], ["any", ["unknown", ["receipt", "job_end_date"]], [">=", ["receipt", "job_end_date"], ["days_after", -1, "cccap_application_or_redetermination_date"]]]], ["received_in", ["month"]]], ["else", ["all", [">=", ["receipt", "date"], ["days_after", ["-", 0, "cccap_prior_income_period_days"], "cccap_application_or_redetermination_date"]], ["<", ["receipt", "date"], "cccap_application_or_redetermination_date"]]]], ["=", ["receipt", "kind"], "self_employment_receipts"]], ["receipt", "hours"]]
sources: [S2704, S4602]
implemented: engine
tags: [income]
open: [OQ-1366]
rationale: "Coverage pass 6 for CCCAP, R6-4: the twenty hours of 3.111.H.4.e are tested over the caretaker's hours, read outside any one record."
