id: CO-7254
name: "CCCAP: hours in the month managing rental property stated as a business"
identifier: cccap_rental_property_management_hours
kind: derived
type: hours
scope: person-month
program: CCCAP
meaning: "The hours the person spent in the month managing the rental property the person rents out as a business (earnings, CO-5100: self_employment_receipts records whose rental_property is true, their hours), placed in the month as cccap_self_employment_gross_receipts (CO-5156) places the receipts: the hours 8 CCR 1403-1 3.111.H.4.e's twenty-hour average of active management of rental property is taken over (cccap_rental_property_receipts_as_unearned, CO-7251)."
precision: "Coverage pass 6 for CCCAP, R6-4, and coverage pass 7, R7-1 (docs/reviews/coverage6-care-energy.md, coverage7-care-energy.md). Only the records of rental property are read (rental_property true, required on every business receipts record: decision 4): 3.111.H.4.e (S2704) asks whether the caretaker actively manages \"the property\" twenty hours a week, so another business's hours are not management of it. The hours of every rental record are read together, so the same property stated in one record or split over two gives one answer (the records harness's split relation); two rental properties are read together (OQ-1366 records the other reading, property by property). Unknown when a rental record's hours are unstated (decision 4). Before pass 7 the hours of every business stated as receipts were summed (the identifier was cccap_business_receipts_hours), so a cleaning business's hours made a small rental self-employment (probe CR3)."
derived: ["sum_receipts", "earnings", ["all", ["=", ["lookup", "cccap_earnings_treatment_table", ["receipt", "kind"]], "counted_self_employment"], ["case", [["not", ["unknown", ["receipt", "month"]]], ["received_in", ["month"]]], [["any", ["all", ["not", ["unknown", ["receipt", "job_end_date"]]], ["<", ["receipt", "job_end_date"], ["days_after", ["-", 0, "cccap_prior_income_period_days"], "cccap_application_or_redetermination_date"]]], ["all", ["not", ["unknown", ["receipt", "job_start_date"]]], [">=", ["receipt", "job_start_date"], "cccap_application_or_redetermination_date"]]], false], [["all", ["any", ["unknown", ["receipt", "job_start_date"]], ["<=", ["receipt", "job_start_date"], ["days_after", ["-", 0, "cccap_prior_income_period_days"], "cccap_application_or_redetermination_date"]]], ["any", ["unknown", ["receipt", "job_end_date"]], [">=", ["receipt", "job_end_date"], ["days_after", -1, "cccap_application_or_redetermination_date"]]]], ["received_in", ["month"]]], ["else", ["all", [">=", ["receipt", "date"], ["days_after", ["-", 0, "cccap_prior_income_period_days"], "cccap_application_or_redetermination_date"]], ["<", ["receipt", "date"], "cccap_application_or_redetermination_date"]]]], ["=", ["receipt", "kind"], "self_employment_receipts"], ["receipt", "rental_property"]], ["receipt", "hours"]]
sources: [S2704, S4602]
implemented: engine
tags: [income]
open: [OQ-1366]
rationale: "Coverage pass 6 for CCCAP, R6-4: the twenty hours of 3.111.H.4.e are tested over the caretaker's hours, read outside any one record."
nearest: [CO-6404, CO-7251]
tests:
  - {id: CO-7254-T1, month: "2026-11", as_of: "2026-11-15", title: "Coverage pass 6 R6-4: one rental property stated in two records of 43 and 47 hours: 90", given: {earnings: [{kind: self_employment_receipts, amount: 900, hours: 43, rental_property: true}, {kind: self_employment_receipts, amount: 900, hours: 47, rental_property: true}, {kind: business_cost_operating, amount: 100}]}, expect: 90}
  - {id: CO-7254-T2, month: "2026-11", as_of: "2026-11-15", title: "Coverage pass 6 R6-4, decision 4: a rental record with no hours: cannot determine", given: {earnings: [{kind: self_employment_receipts, amount: 900, rental_property: true}]}, expect: unknown}
  # Coverage pass 7 R7-1 (CR3): a rental house managed 20 hours in November and a cleaning business of 120 hours: the rental's 20 hours only.
  - {id: CO-7254-T3, month: "2026-11", as_of: "2026-11-15", title: "R7-1 (CR3): a cleaning business's hours are not hours managing the rental property: 20", given: {earnings: [{kind: self_employment_receipts, amount: 3000, hours: 120, rental_property: false}, {kind: business_cost_operating, amount: 500}, {kind: self_employment_receipts, amount: 1000, hours: 20, rental_property: true}]}, expect: 20}
  # A business record whose rental_property is not stated: cannot determine (decision 4).
  - {id: CO-7254-T4, month: "2026-11", as_of: "2026-11-15", title: "R7-1, decision 4: a business record that does not say whether it is rental property: cannot determine", given: {earnings: [{kind: self_employment_receipts, amount: 3000, hours: 120}]}, expect: unknown}
