id: CO-5156
name: "CCCAP: a person's self-employment gross receipts in a month"
identifier: cccap_self_employment_gross_receipts
kind: derived
type: money
scope: person-month
program: CCCAP
meaning: "The gross receipts of the person's self-employment in the month: the earnings records (earnings, CO-5100) of a business's or a farm's gross receipts, which CCCAP counts as self-employment (cccap_earnings_treatment_table, CO-5105: counted_self_employment; 8 CCR 1403-1 3.111.I.2 \"declared gross income\", I.3 \"gross receipts\" of a farm), received in the month."
precision: "Earned-income records, step E1 (CCCAP): replaces self_employment_gross_receipts (CO-1700) for CCCAP. The month is the month determined, the prorated monthly figure H.4.c reads as received in the prior thirty days; the receipts are not placed by date. The value of farm products the family used is not a receipt (I.3.c). Read by cccap_self_employment_net_earnings (CO-1710), cccap_has_earned_income (CO-5153) and the self-employed caretaker's activity schedule (cccap_requires_verification_of_activity_schedule, CO-5154). Coverage pass 5, C5-1 (docs/reviews/coverage5-care-energy.md): a record stated with neither a month nor a date (a stream) is the pay or payment of the days its source ran (docs/conventions.md, \"A record's time\"; job_start_date and job_end_date for pay, start_date and end_date for a receipt). It stands for the thirty days only when its source ran through all of them (none of its dates after their first day or before their last); it is not read when its source ended before their first day or began on or after cccap_application_or_redetermination_date; and a source that began or ended inside the thirty days is placed by its dated records, so a stream without them cannot determine and the record's date is named as missing (8 CCR 1403-1 3.111.H.4, H.5.a.1, H.5.b, S2704, S891: the income \"received during the prior thirty (30) day period\"; OQ-680 (2)). A record stated with its month or its date is placed as before. Coverage pass 6 for CCCAP, R6-4 (docs/reviews/coverage6-care-energy.md): a business's receipts record (self_employment_receipts) that is rental property (the record's rental_property) when the caretaker's business hours in the month (cccap_rental_property_management_hours, CO-7254) average under cccap_rental_property_self_employment_min_hours_per_week (CO-7252, twenty) a week (the hours divided by the month's days over seven; OQ-1366) is not self-employment: 3.111.H.4.e (S2704), \"Income from rental property will be considered as unearned income if the adult caretaker(s) or teen parent(s) are not actively managing the property an average of at least twenty (20) hours per week\"; its receipts are unearned rent (cccap_rental_property_receipts_as_unearned, CO-7251) and its hours are not hours of an eligible activity. The record's rental_property is read only when those hours are under the line (required there: decision 4). Coverage pass 7, R7-1 (docs/reviews/coverage7-care-energy.md): the twenty hours are the hours the caretaker manages the rental property (cccap_rental_property_management_hours, CO-7254, the hours of the records whose rental_property is true), not the hours of every business: 3.111.H.4.e (S2704) asks whether the caretaker actively manages \"the property\" twenty hours a week, and no reading makes another business's hours management of it. Before, a landlord who managed her rental five hours a week and ran a cleaning business thirty was read as actively managing the property (probe CR3: ineligible_income where the rule gives eligible_low_income). Coverage verification 7, V7-7 (docs/reviews/verify-coverage7-fixes.md): the record's own hours are tested first: a business receipts record whose hours average twenty a week or more is self-employment whatever its rental_property, since the rental records' hours together are then at least twenty; its rental_property is read only where another record of the month, under the line on its own hours, is rental property and the rental records' sum decides (cccap_rental_property_management_hours, CO-7254). Before, the flag was read on every business record first, so a lone business of 120 hours with the flag not stated was cannot determine (C1-F: 120 / (30/7) = 28 hours a week, self-employment either way; $870, fee 8, eligible_low_income)."
