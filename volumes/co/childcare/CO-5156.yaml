id: CO-5156
name: "CCCAP: a person's self-employment gross receipts in a month"
identifier: cccap_self_employment_gross_receipts
kind: derived
type: money
scope: person-month
program: CCCAP
meaning: "The gross receipts of the person's self-employment in the month: the earnings records (earnings, CO-5100) of a business's or a farm's gross receipts, which CCCAP counts as self-employment (cccap_earnings_treatment_table, CO-5105: counted_self_employment; 8 CCR 1403-1 3.111.I.2 \"declared gross income\", I.3 \"gross receipts\" of a farm), received in the month."
precision: "Earned-income records, step E1 (CCCAP): replaces self_employment_gross_receipts (CO-1700) for CCCAP. The month is the month determined, the prorated monthly figure H.4.c reads as received in the prior thirty days; the receipts are not placed by date. The value of farm products the family used is not a receipt (I.3.c). Read by cccap_self_employment_net_earnings (CO-1710), cccap_has_earned_income (CO-5153) and the self-employed caretaker's activity schedule (cccap_requires_verification_of_activity_schedule, CO-5154). Coverage pass 5, C5-1 (docs/reviews/coverage5-care-energy.md): a record stated with neither a month nor a date (a stream) is the pay or payment of the days its source ran (docs/conventions.md, \"A record's time\"; job_start_date and job_end_date for pay, start_date and end_date for a receipt). It stands for the thirty days only when its source ran through all of them (none of its dates after their first day or before their last); it is not read when its source ended before their first day or began on or after cccap_application_or_redetermination_date; and a source that began or ended inside the thirty days is placed by its dated records, so a stream without them cannot determine and the record's date is named as missing (8 CCR 1403-1 3.111.H.4, H.5.a.1, H.5.b, S2704, S891: the income \"received during the prior thirty (30) day period\"; OQ-680 (2)). A record stated with its month or its date is placed as before."
derived: ["sum_receipts", "earnings", ["all", ["=", ["lookup", "cccap_earnings_treatment_table", ["receipt", "kind"]], "counted_self_employment"], ["case", [["not", ["unknown", ["receipt", "month"]]], ["received_in", ["month"]]], [["any", ["all", ["not", ["unknown", ["receipt", "job_end_date"]]], ["<", ["receipt", "job_end_date"], ["days_after", ["-", 0, "cccap_prior_income_period_days"], "cccap_application_or_redetermination_date"]]], ["all", ["not", ["unknown", ["receipt", "job_start_date"]]], [">=", ["receipt", "job_start_date"], "cccap_application_or_redetermination_date"]]], false], [["all", ["any", ["unknown", ["receipt", "job_start_date"]], ["<=", ["receipt", "job_start_date"], ["days_after", ["-", 0, "cccap_prior_income_period_days"], "cccap_application_or_redetermination_date"]]], ["any", ["unknown", ["receipt", "job_end_date"]], [">=", ["receipt", "job_end_date"], ["days_after", -1, "cccap_application_or_redetermination_date"]]]], ["received_in", ["month"]]], ["else", ["all", [">=", ["receipt", "date"], ["days_after", ["-", 0, "cccap_prior_income_period_days"], "cccap_application_or_redetermination_date"]], ["<", ["receipt", "date"], "cccap_application_or_redetermination_date"]]]]], ["receipt", "amount"]]
sources: [S1157, S3263, S2704, S891]
implemented: engine
tags: [income]
open: [OQ-680]
rationale: "Earned-income records, E1 (CCCAP): one figure for the business's receipts, read by every CCCAP item that read self_employment_gross_receipts. leap_self_employment_gross_receipts (CO-5126) has the same shape over LEAP's table; it is not read here because each program builds its own income from the neutral records (product-owner decision of 2026-11-23: complex program calculations are never shared) and the two tables decide the rows apart."
nearest: [CO-5126, CO-6404]
tests:
  - {id: CO-5156-T1, title: "$1,500 of receipts in October", as_of: "2026-10-01", month: "2026-10", given: {earnings: [{kind: self_employment_receipts, amount: 1500}]}, expect: 1500}
  # A farm's $700 and another business's $800: $1,500; the operating cost is not a receipt.
  - {id: CO-5156-T2, title: "A farm and a business; a cost is not a receipt", as_of: "2026-10-01", month: "2026-10", given: {earnings: [{kind: farm_self_employment_receipts, amount: 700}, {kind: self_employment_receipts, amount: 800}, {kind: business_cost_operating, amount: 200}]}, expect: 1500}
  - {id: CO-5156-T3, title: "Wages are not self-employment", as_of: "2026-10-01", month: "2026-10", given: {earnings: [{kind: wages, amount: 1500}]}, expect: 0}
  - {id: CO-5156-T4, title: "Receipts stated for November only", as_of: "2026-10-01", month: "2026-10", given: {earnings: [{kind: self_employment_receipts, amount: 1500, month: "2026-11"}]}, expect: 0}
  # Coverage pass 5 (docs/reviews/coverage5-care-energy.md), C5-1: application 2026-11-15, so the thirty days run 2026-10-16 to 2026-11-14 (H.4-5, OQ-680).
  - {"id": "CO-5156-T5", "title": "C5-1 (review household CE1): a business stream of $1,500 whose business closed 2026-08-31: 0 (was 1,500)", "month": "2026-11", "as_of": "2026-11-15", "given": {"cccap_application_or_redetermination_date": "2026-11-15", "earnings": [{"kind": "self_employment_receipts", "amount": 1500, "hours": 40, "job_end_date": "2026-08-31"}]}, "expect": 0}
  - {"id": "CO-5156-T6", "title": "C5-1: a business stream that began 2026-11-01, inside the thirty days, with no record of its month: cannot determine", "month": "2026-11", "as_of": "2026-11-15", "given": {"cccap_application_or_redetermination_date": "2026-11-15", "earnings": [{"kind": "self_employment_receipts", "amount": 1500, "hours": 40, "job_start_date": "2026-11-01"}]}, "expect": "unknown"}
  - {"id": "CO-5156-T7", "title": "C5-1: the same business stating its November receipts as a record of the month: 1,500", "month": "2026-11", "as_of": "2026-11-15", "given": {"cccap_application_or_redetermination_date": "2026-11-15", "earnings": [{"kind": "self_employment_receipts", "amount": 1500, "hours": 40, "month": "2026-11", "job_start_date": "2026-11-01"}]}, "expect": 1500}
