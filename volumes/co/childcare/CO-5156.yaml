rationale: "Earned-income records, E1 (CCCAP): one figure for the business's receipts, read by every CCCAP item that read self_employment_gross_receipts. leap_self_employment_gross_receipts (CO-5126) has the same shape over LEAP's table; it is not read here because each program builds its own income from the neutral records (product-owner decision of 2026-11-23: complex program calculations are never shared) and the two tables decide the rows apart."
nearest: [CO-5126, CO-6404]
tests:
  - {id: CO-5156-T1, title: "$1,500 of receipts in October", as_of: "2026-10-01", month: "2026-10", given: {earnings: [{kind: self_employment_receipts, amount: 1500, rental_property: false}]}, expect: 1500}
  # A farm's $700 and another business's $800: $1,500; the operating cost is not a receipt.
  - {id: CO-5156-T2, title: "A farm and a business; a cost is not a receipt", as_of: "2026-10-01", month: "2026-10", given: {earnings: [{kind: farm_self_employment_receipts, amount: 700}, {kind: self_employment_receipts, amount: 800, rental_property: false}, {kind: business_cost_operating, amount: 200}]}, expect: 1500}
  - {id: CO-5156-T3, title: "Wages are not self-employment", as_of: "2026-10-01", month: "2026-10", given: {earnings: [{kind: wages, amount: 1500}]}, expect: 0}
  - {id: CO-5156-T4, title: "Receipts stated for November only", as_of: "2026-10-01", month: "2026-10", given: {earnings: [{kind: self_employment_receipts, amount: 1500, month: "2026-11"}]}, expect: 0}
  # Coverage pass 5 (docs/reviews/coverage5-care-energy.md), C5-1: application 2026-11-15, so the thirty days run 2026-10-16 to 2026-11-14 (H.4-5, OQ-680).
  - {"id": "CO-5156-T5", "title": "C5-1 (review household CE1): a business stream of $1,500 whose business closed 2026-08-31: 0 (was 1,500)", "month": "2026-11", "as_of": "2026-11-15", "given": {"cccap_application_or_redetermination_date": "2026-11-15", "earnings": [{"kind": "self_employment_receipts", "amount": 1500, "hours": 40, "job_end_date": "2026-08-31"}]}, "expect": 0}
  - {"id": "CO-5156-T6", "title": "C5-1: a business stream that began 2026-11-01, inside the thirty days, with no record of its month: cannot determine", "month": "2026-11", "as_of": "2026-11-15", "given": {"cccap_application_or_redetermination_date": "2026-11-15", "earnings": [{"kind": "self_employment_receipts", "amount": 1500, "hours": 40, "job_start_date": "2026-11-01"}]}, "expect": "unknown"}
  - {"id": "CO-5156-T7", "title": "C5-1: the same business stating its November receipts as a record of the month: 1,500", "month": "2026-11", "as_of": "2026-11-15", "given": {"cccap_application_or_redetermination_date": "2026-11-15", "earnings": [{"kind": "self_employment_receipts", "amount": 1500, "hours": 40, "month": "2026-11", "job_start_date": "2026-11-01", "rental_property": false}]}, "expect": 1500}
  - {id: CO-5156-T8, title: "Coverage pass 6 R6-4 (CR1): rental property managed 43 hours in November (10.03 a week) is not self-employment: 0", as_of: "2026-11-15", month: "2026-11", given: {earnings: [{kind: self_employment_receipts, amount: 1800, hours: 43, rental_property: true}]}, expect: 0}
  - {id: CO-5156-T9, title: "Coverage pass 6 R6-4: rental property managed 90 hours in November (21 a week) is self-employment: 1,800", as_of: "2026-11-15", month: "2026-11", given: {earnings: [{kind: self_employment_receipts, amount: 1800, hours: 90, rental_property: true}]}, expect: 1800}
  # Coverage verification 7, V7-7 (C1-F): one business of 120 hours in November, 120 / (30 / 7) = 28 hours a week, at or over twenty: self-employment
  # whether or not it is rental property (3.111.H.4.e makes rent unearned only under twenty hours a week), so its rental_property is not read.
  - {id: CO-5156-T10, title: "V7-7: one business of 120 hours (28 a week), rental_property not stated: self-employment, 1,800 (was cannot determine)", as_of: "2026-11-15", month: "2026-11", given: {earnings: [{kind: self_employment_receipts, amount: 1800, hours: 120}]}, expect: 1800}
  # (C1-D) The same 120-hour business, its flag not stated, beside a rental of 20 hours (20 / (30/7) = 4.67 a week, rental_property true): whether
  # the rental is self-employment turns on whether the 120 hours are rental too (20 or 140 hours together): cannot determine.
  - {id: CO-5156-T11, title: "V7-7: beside a 20-hour rental, the 120-hour business's flag decides the rental records' sum: cannot determine", as_of: "2026-11-15", month: "2026-11", given: {earnings: [{kind: self_employment_receipts, amount: 1800, hours: 120}, {kind: self_employment_receipts, amount: 1000, hours: 20, rental_property: true}]}, expect: unknown}
