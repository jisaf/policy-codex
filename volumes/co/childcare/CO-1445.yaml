id: CO-1445
name: "CCCAP: requires verification of earned income"
identifier: cccap_requires_verification_of_earned_income
kind: derived
type: yes/no
scope: person-month
program: CCCAP
meaning: "Whether the person's earned income must be verified for CCCAP: the wages or self-employment income of any household member whose earnings count toward household income, that is, anyone but a household child who is not a teen parent."
precision: "Earned-income records, step E1 (CCCAP): whether the person has earned income is CCCAP's own figure from its earnings records (cccap_has_earned_income, CO-5153), replacing has_earned_income (CO-1356, program All). Follows cccap_household_income (CO-985), which counts every member's earnings except a household child's who is not a teen parent. Second-pass review N-6: not for a protective services case (is_protective_services_child_care_case, CO-873, read as false when not stated), whose only countable income is the placed children's (3.119.A; a placed child's earnings are excluded by 3.111.J.1). Coverage round F-14 and F-23: not for a Child Welfare Child Care household (CO-2576, read as false when not stated), whose eligibility the Child Welfare division determines (3.120.D, S2709; 12 CCR 2509-4 7.302, S3259), and not for a person referred for Colorado Works Child Care (is_referred_for_colorado_works_child_care, CO-896, stated for every caretaker of a referred household, read as false when not stated), since 3.116.C (S2707) counts \"only earned income that is reported and verified by the county Colorado Works worker\", as residency and the activity already are (CO-1440, CO-1441). Coverage pass 3 C3-3: the referral is read over the household (as cccap_household_unearned_income, CO-2873, reads it), so a second caretaker in the Colorado Works unit who is not stated as referred is not asked for CCCAP documents either; before the fix he was (probe Y-2)."
derived: [all, cccap_has_earned_income, [any, [not, cccap_is_household_child], cccap_is_teen_parent], [not, [otherwise, is_protective_services_child_care_case, false]], [not, [otherwise, cccap_is_child_welfare_child_care_household, false]], [not, [exists, cccap_household_members, [otherwise, [of, [P], is_referred_for_colorado_works_child_care], false]]]]
sources: [S891, S2707, S2709, S3259]
implemented: engine
tags: [verification, income]
rationale: No existing item states this CCCAP verification requirement; the phase-9 chapter needs it to count the household's pending verifications.
tests:
  - {id: CO-1445-T1, month: "2026-10", as_of: "2026-10-01", given: {cccap_household_members: [p1], is_protective_services_child_care_case: false, cccap_has_earned_income: true, cccap_is_household_child: false}, expect: true}
  - {id: CO-1445-T2, month: "2026-10", as_of: "2026-10-01", given: {cccap_has_earned_income: true, cccap_is_household_child: true, cccap_is_teen_parent: false}, expect: false}
  - {id: CO-1445-T3, month: "2026-10", as_of: "2026-10-01", given: {cccap_household_members: [p1], is_protective_services_child_care_case: false, cccap_has_earned_income: true, cccap_is_household_child: true, cccap_is_teen_parent: true}, expect: true}
  - {id: CO-1445-T4, month: "2026-10", as_of: "2026-10-01", given: {cccap_has_earned_income: false}, expect: false}
  - {id: CO-1445-T5, title: "Second-pass N-6: a kinship caretaker's wages in a protective services case are not asked for (3.119.A)", month: "2026-10", as_of: "2026-10-01", given: {is_protective_services_child_care_case: true, cccap_has_earned_income: true, cccap_is_household_child: false}, expect: false}
  - {id: CO-1445-T6, title: "F-14: a Child Welfare Child Care caretaker's wages are not asked for (3.120.D)", month: "2026-10", as_of: "2026-10-01", given: {cccap_has_earned_income: true, cccap_is_household_child: false, is_protective_services_child_care_case: false, cccap_is_child_welfare_child_care_household: true}, expect: false}
  - {id: CO-1445-T7, title: "F-23: a Colorado Works Child Care caretaker's wages are verified by the Colorado Works worker (3.116.C)", month: "2026-10", as_of: "2026-10-01", given: {cccap_household_members: [p1], cccap_has_earned_income: true, cccap_is_household_child: false, is_protective_services_child_care_case: false, is_referred_for_colorado_works_child_care: true}, expect: false}
