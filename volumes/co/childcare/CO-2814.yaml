id: CO-2814
name: "CCCAP: family experiencing homelessness"
identifier: cccap_is_family_experiencing_homelessness
kind: derived
type: yes/no
scope: person
program: CCCAP
meaning: "Whether the person's family is a family experiencing homelessness under 8 CCR 1403-1 3.103.CCC (S1954): it lacks a fixed, regular and adequate nighttime residence and its children are sharing the housing of others because of loss of housing, economic hardship or a similar reason, living in a motel, hotel or camping ground for lack of alternative accommodations, living in an emergency or transitional shelter, living in a place not designed for sleeping, or living in a car, park, public space, abandoned building, substandard housing or a bus or train station."
precision: "Read on the person's own nighttime_residence_type (CO-2810); the family shares one residence. CCCAP's list does not name trailer parks or abandonment in a hospital, which McKinney-Vento does. 3.121.A (S1823) cites the definition as \"rule section 3.103(YY)\", the lettering of an earlier version; in the version effective 2026-08-14 it is 3.103.CCC."
derived: [in, nighttime_residence_type, [shared_housing_due_to_loss_or_hardship, motel_or_hotel_for_lack_of_alternative, emergency_or_transitional_shelter, place_not_designed_for_sleeping, substandard_housing]]
sources: [S1954, S1823]
implemented: engine
tags: [household]
rationale: "Same-word audit SW-11: CCCAP's stabilization period (3.121, CO-2577) is for families that meet 3.103.CCC, and no item stated the definition. cccap_parent_fee (CO-1290) now reads the stabilization period only for such a family."
nearest: [CO-037, CO-2010, CO-2813, CO-2815]
tests:
  - {id: CO-2814-T1, title: "Family in a transitional shelter", as_of: "2026-11-01", given: {nighttime_residence_type: emergency_or_transitional_shelter}, expect: true}
  - {id: CO-2814-T2, title: "Trailer park is not on CCCAP's list", as_of: "2026-11-01", given: {nighttime_residence_type: trailer_park_or_campground_for_lack_of_alternative}, expect: false}
  - {id: CO-2814-T3, title: "Own home", as_of: "2026-11-01", given: {nighttime_residence_type: fixed_regular_adequate}, expect: false}
