id: CO-993
name: "CCCAP: income within the exit limit"
identifier: cccap_income_within_exit_limit
kind: derived
type: yes/no
scope: person-month
program: CCCAP
meaning: "Whether the CCCAP household's countable income (cccap_household_income, CO-985) is at or below eighty-five percent of the state median income for the household's size, under 8 CCR 1403-1 3.111.H.1.b's exit income eligibility standard, the 85% SMI table in force on the determination date, as the entry limit reads it (cccap_income_within_entry_limit, CO-986)."
precision: "Read by cccap_meets_income_guidelines (CO-2104) for a household already receiving assistance (cccap_is_receiving_assistance, CO-2103; OQ-133, resolved). Coverage pass 5, C5-6 (docs/reviews/coverage5-care-energy.md): the table (H.2 \"Through September 30, 2026\", H.3 \"Effective October 1, 2026\", S485) is read as of the determination date, as CO-986 reads it, not in the month evaluated: the determination applies the table in force when it is made, and a September application determined in October compares entry and exit income with the same year's table."
derived: ["<=", "cccap_household_income", ["lookup_extended", ["as_of", "cccap_smi_income_limit_table", ["det_date"]], "cccap_household_size", ["as_of", "cccap_smi_income_limit_each_additional", ["det_date"]]]]
sources: [S485]
implemented: engine
tags: [income]
rationale: "No existing item states 3.111.H.1.b's exit income test; the review (docs/reviews/cccap-leap-phase-6.md, C-5) found the 85% SMI figures were stated in the fetched text (S485) but neither the cap nor the exit limit was represented anywhere in the ledger. Modeled on cccap_income_within_entry_limit (CO-986), the nearest same-shape item, reading the new cccap_smi_income_limit_table (CO-1804) instead of the poverty guideline. Hard-coded numbers audit S-1: the table's last row is read by lookup_extended (P51), not restated as 8."
tests:
  - {id: CO-993-T1, as_of: "2026-10-01", month: "2026-10", given: {cccap_household_income: 6000, cccap_household_size: 3}, expect: true}
  - {id: CO-993-T2, title: "Figures effective October 1, 2024 (S485)", as_of: "2025-09-30", month: "2025-09", given: {cccap_household_income: 8000, cccap_household_size: 3}, expect: false}
  # Time audit T-9: each comparison tested at its limit, with the two sides equal (the strict/inclusive flip of the comparison fails it).
  - {"id": "CO-993-T3", "month": "2026-10", "as_of": "2026-10-01", "title": "T-9: cccap_household_income equal to [\"lookup_extended\",\"cccap_smi_income_limit_table\",\"cccap_household_size\",\"cccap_smi_income_limit_each_additional\"] (cccap_household_income at or under [\"lookup_extended\",\"cccap_smi_income_limit_table\",\"cccap_household_size\",\"cccap_smi_income_limit_each_additional\"])", "given": {"cccap_household_income": 8638.03, "cccap_household_size": 3}, "expect": true}
  # Coverage pass 5 (docs/reviews/coverage5-care-energy.md), C5-6: the 85% SMI table is read as of the determination date: for two, $6,683.61 through 2026-09-30 and $6,992.69 from 2026-10-01 (H.2-3).
  - {"id": "CO-993-T4", "title": "C5-6: determined 2026-10-05, income $6,800 for two, read for September: 6,800 <= 6,992.69 (October's table), within (was the September table's 6,683.61: not within)", "month": "2026-09", "as_of": "2026-10-05", "given": {"cccap_household_income": 6800, "cccap_household_size": 2}, "expect": true}
