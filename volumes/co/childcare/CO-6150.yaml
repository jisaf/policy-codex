id: CO-6150
name: "CCCAP: a person's irregular earnings in a month"
identifier: cccap_irregular_earnings
kind: derived
type: money
scope: person-month
program: CCCAP
meaning: "The person's pay received in the month that CCCAP counts (cccap_earnings_treatment_table, CO-5105: wages and the other pay it counts, in-kind pay, vendor payments and boarders) and that was received infrequently or irregularly (an earnings record, earnings CO-5100, marked irregular: \"received too infrequently or irregularly to be reasonably anticipated\", 8 CCR 1403-1 3.111.J.28, S2858): the earned part of the irregular income J.28 totals over the calendar quarter."
precision: "Earned-income records, step E1 (CCCAP; finding E1-C3). A record is in the month by its month or its date's month (P57); a stream marked irregular recurs. Self-employment receipts are not read: their irregularity is the business's, and H.4.c and I.2.c average them. The quarter's total is cccap_irregular_earnings_in_quarter (CO-6151). Coverage pass 5, C5-1 (docs/reviews/coverage5-care-energy.md): a stream (a record with neither a month nor a date) is placed only in the months its source ran, from the month of its job_start_date (start_date for a receipt) through the month of its job_end_date (end_date), as SNAP (CO-5011) and the cash programs place one (docs/conventions.md, \"A record's time\")."
derived: ["sum_receipts", "earnings", ["all", ["any", ["in", ["lookup", "cccap_earnings_treatment_table", ["receipt", "kind"]], ["counted", "counted_no_rule_excludes", "counted_at_value", "counted_other_income"]], ["all", ["=", ["lookup", "cccap_earnings_treatment_table", ["receipt", "kind"]], "counted_unless_foster_care"], ["not", ["receipt", "foster_care"]]]], ["receipt", "irregular"], ["all", ["received_in", ["month"]], ["any", ["not", ["unknown", ["receipt", "month"]]], ["all", ["any", ["unknown", ["receipt", "job_start_date"]], ["<=", ["month_of", ["receipt", "job_start_date"]], ["month"]]], ["any", ["unknown", ["receipt", "job_end_date"]], [">=", ["month_of", ["receipt", "job_end_date"]], ["month"]]]]]]], ["receipt", "amount"]]
sources: [S2858]
implemented: engine
tags: [income]
open: [OQ-713]
rationale: "Earned-income records, E1 (CCCAP): J.28 excludes \"Irregular income\" under ninety dollars a quarter, earned or unearned; CCCAP pooled only the irregular receipts, because the scalar wages could not say which pay was irregular (CO-4010 was part of wages_gross, which CCCAP counted whole)."
tests:
  - {id: CO-6150-T1, title: "A $40 odd job in November", as_of: "2026-11-01", month: "2026-11", given: {earnings: [{kind: wages, amount: 2000}, {kind: wages, amount: 40, irregular: true, month: "2026-11"}]}, expect: 40}
  - {id: CO-6150-T2, title: "Regular wages only", as_of: "2026-11-01", month: "2026-11", given: {earnings: [{kind: wages, amount: 2000}]}, expect: 0}
  - {id: CO-6150-T3, title: "An odd job in another month", as_of: "2026-11-01", month: "2026-11", given: {earnings: [{kind: wages, amount: 40, irregular: true, month: "2026-10"}]}, expect: 0}
  - {id: CO-6150-T4, title: "Irregular work-study pay is excluded whole (J.16), not counted here", as_of: "2026-11-01", month: "2026-11", given: {earnings: [{kind: work_study, amount: 60, irregular: true}]}, expect: 0}
  # Coverage pass 5 (docs/reviews/coverage5-care-energy.md), C5-1: a stream is placed in the months its job ran (the quarter totals of J.28).
  - {"id": "CO-6150-T5", "title": "C5-1: an irregular $40 a month stream of a job that ended 2026-09-30, read for November: 0", "month": "2026-11", "as_of": "2026-11-01", "given": {"earnings": [{"kind": "wages", "amount": 40, "irregular": true, "job_end_date": "2026-09-30"}]}, "expect": 0}
  - {"id": "CO-6150-T6", "title": "C5-1: the same stream read for September, the month the job ended: 40", "month": "2026-09", "as_of": "2026-11-01", "given": {"earnings": [{"kind": "wages", "amount": 40, "irregular": true, "job_end_date": "2026-09-30"}]}, "expect": 40}
