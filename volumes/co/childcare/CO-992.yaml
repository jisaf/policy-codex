id: CO-992
name: "CCCAP: is an adult caretaker"
identifier: cccap_is_adult_caretaker
kind: derived
type: yes/no
scope: person
program: CCCAP
meaning: The person is an "adult caretaker" under 8 CCR 1403-1 3.103.C - a person in the home who is financially contributing to the welfare of an eligible child in the household and is the parent, adoptive parent, step-parent, legal guardian, or a person acting in loco parentis with physical custody of the child, and who is not themselves a household child - or, under twenty-one, participates in workforce training or post-secondary education, which 3.103.EEEEE makes an adult caretaker rather than a teen parent.
precision: "Phase-8 fix round (K-7) - a household child under twenty-one in workforce training or post-secondary education (cccap_is_in_workforce_training_or_post_secondary_education, CO-1518) is an adult caretaker (3.103.EEEEE, S1016); the fact is read only for a household child. Physical custody is read from a stated parent/child or caretaker/dependent relationship to a CCCAP eligible child, the same convention cccap_is_teen_parent (CO-981) uses; \"financially contributing to the welfare of the child\" is read from the supplied cccap_is_financially_contributing_to_child (CO-897, defaulted to true absent a stated value, see OQ-135). Phase-10 sweep: the referral, financially-contributing and activity facts are read without a default; a case states them (OQ-134, OQ-135, OQ-157, OQ-395). Same-word audit SW-1/SW-3/SW-4 (OQ-396): the adult caretaker relation is cccap_adult_caretaker_of (CO-2607): parent, stepparent, legal guardian, or a person with primary responsibility for the child (in loco parentis, OQ-540)."
derived: [all, [any, [not, cccap_is_household_child], [all, ["<", age, cccap_teen_parent_age_limit], cccap_is_in_workforce_training_or_post_secondary_education]], [exists, cccap_adult_caretaker_of, [of, [P], cccap_is_eligible_child]], cccap_is_financially_contributing_to_child]
sources: [S481, S1016]
implemented: engine
tags: [household]
rationale: "No existing item states the CCCAP adult-caretaker test on its own terms; cccap_household_caretakers_in_eligible_activity (CO-991) previously used 'not a household child' as a stand-in for this term (review docs/reviews/cccap-leap-phase-6.md, C-7), which wrongly counted an unrelated adult in the home as a caretaker. cccap_household_caretakers_in_eligible_activity (CO-991) reads it."
tests:
