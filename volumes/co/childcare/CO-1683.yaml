id: CO-1683
name: "CCCAP: child support paid verification is pending"
identifier: cccap_child_support_paid_verification_is_pending
kind: derived
type: yes/no
scope: person-month
program: CCCAP
role: outcome
meaning: Whether CCCAP requires verification of the person's court-ordered child support paid (deducted only when verified) and it has not been provided.
precision: Unverified child support is left out of the deduction rather than denying the application (3.111.K.1, review C-12), so cccap_pending_deduction_verification_count counts it, not cccap_person_pending_verification_count.
derived: [all, cccap_requires_verification_of_child_support_paid, [not, child_support_paid_is_verified]]
sources: [S892]
implemented: engine
tags: [verification]
rationale: "Review U-1: the count items held this test as an anonymous arm, so no outcome told a worker which document was outstanding and for whom; the count now sums this item."
tests:
  - {id: CO-1683-T1, month: "2026-10", as_of: "2026-10-01", given: {cccap_requires_verification_of_child_support_paid: true, child_support_paid_verified_by_electronic_data_source: false, child_support_paid_verification_document_received: false}, expect: true}
  - {id: CO-1683-T2, month: "2026-10", as_of: "2026-10-01", given: {cccap_requires_verification_of_child_support_paid: true, child_support_paid_verified_by_electronic_data_source: false, child_support_paid_verification_document_received: true}, expect: false}
