id: CO-3916
name: "CCCAP: a person's countable unearned income"
identifier: cccap_person_unearned_income
kind: derived
type: money
scope: person-month
program: CCCAP
meaning: "This person's unearned income that CCCAP counts (8 CCR 1403-1 3.111.I.6-33, J): the recurring unearned income received in the prior thirty days (pensions, unemployment, child support, interest and the other unearned income, 3.111.H.5.b), plus the month's Social Security (I.25), plus one twelfth of a nonrecurring lump sum or a prize received in the month (I.20; H.4.i: counted in the month received or averaged over twelve months, \"whichever is most beneficial\"), not counting a retroactive SSI or public assistance lump sum, which J.2 and J.26 exclude; plus the receipts 3.111.I counts that the other income facts do not hold (in-kind compensation, employer vendor payments, GI Bill subsistence allowances, boarders), less the receipts 3.111.J excludes and the deductions 3.111.I allows that those facts still hold."
precision: "The recurring part is unearned_income_prior_thirty_days (CO-3913), which leaves out what 3.111.J excludes and has its own fact (educational aid, J.16, J.19-20; loans, J.25; reimbursements, J.27; LEAP and other home energy assistance, J.12; tax refunds and credits including the EIC, J.14; federally excluded payments, J.3, J.5-9, J.11, J.15, J.21). SSI (J.2) and Colorado Works, OAP and AND grants (J.26) are not read. Social Security is a monthly payment and is read for the month. The lump sum is lump_sum_received (CO-3367) and the prize lottery_gambling_winnings_received (CO-1181), each read as 0 when not stated, less retroactive_ssi_or_public_assistance_lump_sum_received (CO-3920); one twelfth (cccap_lump_sum_averaging_months, CO-3918) is always the more beneficial count for the month received, and a lump sum received in an earlier month is not counted (counting it in its own month is then the more beneficial), OQ-680. Work-study earnings are excluded (J.16; wages_gross_prior_thirty_days, CO-3912, leaves them out of the wages) and a household child's earnings are earned income (CO-3915). Second-pass review P2: irregular income under $90 in the calendar quarter is taken out (J.28, cccap_excluded_irregular_income, CO-4076), not below zero. Coverage round F-07 to F-10, F-25: cccap_other_countable_receipts (CO-4464: I.4, I.5, I.7.c, I.18) is added and cccap_excluded_unearned_receipts (CO-4463: J.10, J.13, J.17-18, J.23-24, J.29, and the net rental and early-payout penalty deductions of I.8, I.12, I.17) is taken out; the part of life insurance, health insurance or personal injury proceeds spent on last illness and burial or medical care (insurance_proceeds_spent_on_medical_or_burial, CO-4460, I.21-22) is taken off the lump sum before it is averaged."
derived: [max, 0, ["-", ["+", unearned_income_prior_thirty_days, social_security_income, ["/", [max, 0, ["-", ["+", [otherwise, lump_sum_received, 0], [otherwise, lottery_gambling_winnings_received, 0]], ["+", [otherwise, retroactive_ssi_or_public_assistance_lump_sum_received, 0], [otherwise, insurance_proceeds_spent_on_medical_or_burial, 0]]]], cccap_lump_sum_averaging_months], cccap_other_countable_receipts], ["+", cccap_excluded_irregular_income, cccap_excluded_unearned_receipts]]]
sources: [S891, S2704, S2705, S2706, S2207, S2858, S3255, S3256, S3257]
implemented: engine
tags: [income]
open: [OQ-680, OQ-713]
rationale: "Final pass F-09 and F-11: CCCAP counts unearned income received in the prior thirty days (H.5.b), counts prizes (I.20), and counts a nonrecurring lump sum in the month received or averaged over twelve months, whichever is more beneficial (H.4.i). The volume read the calendar month, did not read lottery winnings at all, and counted a lump sum in full."
