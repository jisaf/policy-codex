id: CO-3916
name: "CCCAP: a person's countable unearned income"
identifier: cccap_person_unearned_income
kind: derived
type: money
scope: person-month
program: CCCAP
meaning: "This person's unearned income that CCCAP counts (8 CCR 1403-1 3.111.I.6-33, J): the recurring receipts of the month that CCCAP's counting table counts, standing for the unearned income received in the prior thirty days (3.111.H.5.b; cccap_counted_recurring_receipts: pensions, unemployment, child support, interest, Social Security (I.25) and the other unearned income, less Social Security set aside under a plan for self-support, J.13), plus one twelfth of each counted receipt paid once in the month (H.4.i: a non-recurring lump sum is counted in the month received or averaged over twelve months, \"whichever is most beneficial\"; cccap_one_time_receipts_averaged: an inheritance, a gift or a prize, I.20, a lump-sum child support payment, and any other one-time payment), plus the receipts 3.111.I counts that are not money received as unearned income (in-kind compensation, employer vendor payments, boarders), less the irregular receipts J.28 excludes and the receipts and deductions 3.111.I-J take out that the counting table does not (cccap_excluded_unearned_receipts). What CCCAP counts or excludes, kind by kind, is its counting table (cccap_receipt_treatment_table)."
precision: "Receipt records, migration phase 2 (docs/reviews/receipts-migration-2-cccap-sunbucks.md): read from the receipts (CO-5000), replacing unearned_income_prior_thirty_days (CO-3913, removed), social_security_income, lump_sum_received, lottery_gambling_winnings_received, retroactive_ssi_or_public_assistance_lump_sum_received and insurance_proceeds_spent_on_medical_or_burial. SSI (J.2) and Colorado Works, OAP and AND grants (J.26) are excluded by their kinds, a retroactive lump sum of them included. The month's receipts stand for the prior thirty days, and one-time receipts are read by the month received (OQ-680). A receipt paid once is averaged whatever its kind (OQ-873). Work-study earnings are excluded (J.16; cccap_person_earned_income, CO-3915, leaves them out of the wages) and a household child's earnings are earned income (CO-3915). Second-pass review P2: irregular income under $90 in the calendar quarter is taken out (J.28, cccap_excluded_irregular_income, CO-4076), not below zero. Coverage round F-07 to F-10, F-25: cccap_other_countable_receipts (CO-4464: I.4, I.5, I.18) is added and cccap_excluded_unearned_receipts (CO-4463: the adoption subsidy and research study payments that have no kind of their own, the net rental and early-payout penalty deductions of I.8, I.12, I.17, and a diversion that is cash assistance) is taken out; the part of life insurance, health insurance or personal injury proceeds spent on last illness and burial or medical care is the receipt's spent_on_covered_costs, taken off before it is averaged (I.21-22)."
derived: [max, 0, ["-", ["+", cccap_counted_recurring_receipts, cccap_one_time_receipts_averaged, cccap_other_countable_receipts], ["+", cccap_excluded_irregular_income, cccap_excluded_unearned_receipts]]]
sources: [S891, S2704, S2705, S2706, S2207, S2858, S3255, S3256, S3257, S4020]
implemented: engine
tags: [income]
open: [OQ-680, OQ-713, OQ-873]
rationale: "Final pass F-09 and F-11: CCCAP counts unearned income received in the prior thirty days (H.5.b), counts prizes (I.20), and counts a nonrecurring lump sum in the month received or averaged over twelve months, whichever is more beneficial (H.4.i). Receipt records, migration phase 2: the figure is read from the receipts through CCCAP's counting table (cccap_receipt_treatment_table, CO-5720), so the exclusions are one table rather than a list split between a figure shared with LEAP (CO-3913) and CCCAP's own (CO-4463)."
