id: CO-5722
name: "CCCAP: a person's one-time receipts, averaged"
identifier: cccap_one_time_receipts_averaged
kind: derived
type: money
scope: person-month
program: CCCAP
meaning: "One twelfth (cccap_lump_sum_averaging_months) of the person's receipts paid once in the month that CCCAP's counting table counts, whatever their kind: a non-recurring lump sum is \"included as income in the month received or averaged over a twelve (12) month period, whichever is most beneficial for the recipient\" (8 CCR 1403-1 3.111.H.4.i, \"including lump sum child support payments\"); an inheritance, a gift or a prize (I.20) among them. Each is less the part of life insurance, health insurance or personal injury proceeds spent or to be spent on the last illness and burial or on medical care (I.21-22) and, for Social Security, the part set aside under a plan for self-support (J.13)."
precision: "Receipt records, migration phase 2: a receipt paid once is one whose frequency is once, so 3.111.H.4.i reaches every non-recurring payment, however the case would have named it (OQ-873's second question: before receipt records only a payment stated as lump_sum_received, CO-3367, or as lottery winnings was averaged, and a one-time payment stated in another unearned income fact was counted in full in its month). One twelfth is always the more beneficial count in the month received, and a receipt paid once in an earlier month is not counted (counting it in its own month is then the more beneficial), OQ-680. A retroactive Social Security lump sum is counted here (I.25); a retroactive SSI or Colorado Works or Adult Financial lump sum is excluded by its kind (J.2, J.26). A receipt of a kind the table excludes is never asked for its month."
derived: ["/", [sum_receipts, receipts, [all, [in, [lookup, cccap_receipt_treatment_table, [receipt, kind]], [counted, counted_no_rule_excludes, counted_less_pass_set_aside, counted_child_support, counted_unless_cash_assistance]], ["=", [receipt, frequency], once], [received_in, [month]]], [max, 0, ["-", [receipt, amount], ["+", [receipt, spent_on_covered_costs], [case, [["=", [lookup, cccap_receipt_treatment_table, [receipt, kind]], counted_less_pass_set_aside], [receipt, pass_set_aside]], [else, 0]]]]]], cccap_lump_sum_averaging_months]
sources: [S2704, S2705, S3256, S4020, S3257]
implemented: engine
tags: [income]
open: [OQ-680, OQ-873]
rationale: "Receipt records, migration phase 2: 3.111.H.4.i's averaging of a non-recurring lump sum, read from the receipts, replacing the twelfth of lump_sum_received and lottery_gambling_winnings_received less retroactive_ssi_or_public_assistance_lump_sum_received and insurance_proceeds_spent_on_medical_or_burial in cccap_person_unearned_income (CO-3916). Probe hand-check CO-345 (OQ-873): a one-time payment stated other than as a lump sum was not averaged; with receipts it is."
tests:
  - {id: CO-5722-T1, month: "2026-12", as_of: "2026-12-01", given: {receipts: [{kind: other_nontaxable, amount: 6000, frequency: once, month: "2026-12"}]}, title: "A $6,000 inheritance received this month counts as $500 (H.4.i, I.20)", expect: 500}
  - {id: CO-5722-T2, month: "2026-12", as_of: "2026-12-01", given: {receipts: [{kind: gambling_winnings, amount: 1200, frequency: once, month: "2026-12"}]}, title: "A $1,200 lottery win this month counts as $100 (I.20, H.4.i)", expect: 100}
  - {id: CO-5722-T3, month: "2026-12", as_of: "2026-12-01", given: {receipts: [{kind: ssi, amount: 2400, frequency: once, retroactive: true, month: "2026-12"}]}, title: "A retroactive SSI lump sum is excluded (J.2)", expect: 0}
  - {id: CO-5722-T4, month: "2026-12", as_of: "2026-12-01", given: {receipts: [{kind: other_nontaxable, amount: 12000, frequency: once, month: "2026-12", spent_on_covered_costs: 6000}]}, title: "Life insurance proceeds less the last-illness and burial costs they pay, averaged (I.21)", expect: 500}
  - {id: CO-5722-T5, month: "2026-11", as_of: "2026-11-15", given: {receipts: [{kind: colorado_works_diversion, amount: 1500, frequency: once, month: "2026-11"}]}, title: "OQ-873: a one-time county diversion payment, stated as a diversion and not as a lump sum, is averaged (H.4.i)", expect: 125}
  - {id: CO-5722-T6, month: "2026-11", as_of: "2026-11-15", given: {receipts: [{kind: child_support_arrears, amount: 2400, frequency: once, month: "2026-11"}]}, title: "A lump sum child support payment is averaged (H.4.i: \"including lump sum child support payments\")", expect: 200}
  - {id: CO-5722-T7, month: "2026-12", as_of: "2026-12-01", given: {receipts: [{kind: gift, amount: 6000, frequency: once, month: "2026-11"}]}, title: "A gift received in an earlier month is not counted (OQ-680)", expect: 0}
  - {id: CO-5722-T8, month: "2026-12", as_of: "2026-12-01", given: {receipts: [{kind: crime_victim_compensation, amount: 1200, frequency: once}]}, title: "Paid once with no month: cannot be placed (its month is missing)", expect: unknown}
  - {id: CO-5722-T9, month: "2026-12", as_of: "2026-12-01", given: {receipts: [{kind: loan, amount: 1200, frequency: once}]}, title: "A loan is excluded (J.25): its month is never asked", expect: 0}
