  - {"id": "CO-5722-T11", "title": "X5-1: interest of $2,400 paid once on a jointly held bond, half owned, all of it kept by the co-owner: 0.5 x 2,400 / 12 = 100", "month": "2026-11", "as_of": "2026-11-15", "given": {"receipts": [{"kind": "interest_and_dividends", "amount": 0, "frequency": "once", "month": "2026-11", "ownership_share": 0.5, "property_income": 2400}]}, "expect": 100}
