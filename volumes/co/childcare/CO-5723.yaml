id: CO-5723
name: "CCCAP: a person's irregular receipts"
identifier: cccap_irregular_receipts
kind: derived
type: money
scope: person-month
program: CCCAP
meaning: "The person's receipts of the month that CCCAP's counting table counts and that were received infrequently or irregularly (\"received too infrequently or irregularly to be reasonably anticipated\", 8 CCR 1403-1 3.111.J.28), at the amount counted in the month: the receipts J.28's exclusion reads."
precision: "A receipt is irregular when its record says so (irregular). A receipt paid once is a non-recurring lump sum, counted at one twelfth under 3.111.H.4.i (cccap_one_time_receipts_averaged), and is not read here; the recurring receipts are counted at their amount (cccap_counted_recurring_receipts), and this is the irregular part of them. Replaces infrequent_or_irregular_income_received (CO-3822) for CCCAP. Coverage pass 4 C4-1 and C4-2: this item now holds the month's irregular receipts by the month of each record only, the figure cccap_irregular_receipts_in_quarter (CO-5724) adds over a calendar quarter; which irregular receipts of the thirty days J.28 excludes is cccap_excluded_irregular_income (CO-4076)."
derived: [sum_receipts, receipts, [all, [in, [lookup, cccap_receipt_treatment_table, [receipt, kind]], [counted, counted_no_rule_excludes, counted_less_pass_set_aside, counted_child_support, counted_unless_cash_assistance]], [receipt, irregular], [not, ["=", [receipt, frequency], once]], [received_in, [month]]], [case, [["=", [lookup, cccap_receipt_treatment_table, [receipt, kind]], counted_less_pass_set_aside], ["-", [receipt, amount], [min, [receipt, pass_set_aside], [receipt, amount]]]], [else, [receipt, amount]]]]
sources: [S2858]
implemented: engine
tags: [income]
open: [OQ-713]
rationale: "Receipt records, migration phase 2: the irregular receipts J.28 reads, from the receipts through CCCAP's counting table."
tests:
  - {id: CO-5723-T1, month: "2026-11", as_of: "2026-11-01", given: {receipts: [{kind: other_nontaxable, amount: 40, irregular: true, month: "2026-11"}, {kind: pension, amount: 600}]}, title: "A $40 irregular receipt in November; the pension is not irregular", expect: 40}
  - {id: CO-5723-T2, month: "2026-11", as_of: "2026-11-01", given: {receipts: [{kind: loan, amount: 40, irregular: true, month: "2026-11"}]}, title: "An irregular loan is excluded by its kind (J.25)", expect: 0}
