id: CO-5723
name: "CCCAP: a person's irregular receipts"
identifier: cccap_irregular_receipts
kind: derived
type: money
scope: person-month
program: CCCAP
meaning: "The person's receipts of the month that CCCAP's counting table counts and that were received infrequently or irregularly (\"received too infrequently or irregularly to be reasonably anticipated\", 8 CCR 1403-1 3.111.J.28), at the amount counted in the month: the receipts J.28's exclusion reads."
precision: "A receipt is irregular when its record says so (irregular). A receipt paid once is a non-recurring lump sum, counted at one twelfth under 3.111.H.4.i (cccap_one_time_receipts_averaged), and is not read here; the recurring receipts are counted at their amount (cccap_counted_recurring_receipts), and this is the irregular part of them. Replaces infrequent_or_irregular_income_received (CO-3822) for CCCAP. Coverage pass 4 C4-1 and C4-2: this item now holds the month's irregular receipts by the month of each record only, the figure cccap_irregular_receipts_in_quarter (CO-5724) adds over a calendar quarter; which irregular receipts of the thirty days J.28 excludes is cccap_excluded_irregular_income (CO-4076). Coverage pass 5, C5-1 (docs/reviews/coverage5-care-energy.md): a stream (a record with neither a month nor a date) is placed only in the months its source ran, from the month of its job_start_date (start_date for a receipt) through the month of its job_end_date (end_date), as SNAP (CO-5011) and the cash programs place one (docs/conventions.md, \"A record's time\"). Coverage pass 5: each receipt at the value cccap_counted_recurring_receipts (CO-5721) counts it at (C5-2, X5-1). Coverage pass 6 for CCCAP, R6-2 (docs/reviews/coverage6-care-energy.md): the share test of 3.111.H.4.e is applied once per property in the household: a record of jointly owned property whose co-owner is another member of the household (the receipt's co_owner, in cccap_household_members, CO-982) counts what the person received, since what the property paid the co-owner is counted on the co-owner's own list and the household's income from the property is what its members received; the share is the floor only against owners outside the household (OQ-1316). Before, each co-owner took the larger of the share and the amount on the own list, so a co-owner who received nothing still added a share the other had received."
derived: ["sum_receipts", "receipts", ["all", ["in", ["lookup", "cccap_receipt_treatment_table", ["receipt", "kind"]], ["counted", "counted_no_rule_excludes", "counted_less_pass_set_aside", "counted_child_support", "counted_unless_cash_assistance"]], ["receipt", "irregular"], ["not", ["=", ["receipt", "frequency"], "once"]], ["all", ["received_in", ["month"]], ["any", ["not", ["unknown", ["receipt", "month"]]], ["all", ["any", ["unknown", ["receipt", "start_date"]], ["<=", ["month_of", ["receipt", "start_date"]], ["month"]]], ["any", ["unknown", ["receipt", "end_date"]], [">=", ["month_of", ["receipt", "end_date"]], ["month"]]]]]]], ["case", [["=", ["lookup", "cccap_receipt_treatment_table", ["receipt", "kind"]], "counted_less_pass_set_aside"], ["-", ["receipt", "amount"], ["min", ["receipt", "pass_set_aside"], ["receipt", "amount"]]]], ["else", ["max", 0, ["-", ["case", [["unknown", ["receipt", "ownership_share"]], ["receipt", "amount"]], [["all", ["not", ["unknown", ["receipt", "co_owner"]]], ["in_group", ["receipt", "co_owner"], ["of", ["owner"], "cccap_household_members"]]], ["receipt", "amount"]], ["else", ["max", ["receipt", "amount"], ["*", ["receipt", "ownership_share"], ["receipt", "property_income"]]]]], ["+", ["receipt", "spent_on_covered_costs"], ["receipt", "early_withdrawal_penalty"]]]]]]]
sources: [S2858, S3256, S2704]
implemented: engine
tags: [income]
open: [OQ-713, OQ-1316]
rationale: "Receipt records, migration phase 2: the irregular receipts J.28 reads, from the receipts through CCCAP's counting table."
tests:
  - {id: CO-5723-T1, month: "2026-11", as_of: "2026-11-01", given: {receipts: [{kind: other_nontaxable, amount: 40, irregular: true, month: "2026-11"}, {kind: pension, amount: 600}]}, title: "A $40 irregular receipt in November; the pension is not irregular", expect: 40}
  - {id: CO-5723-T2, month: "2026-11", as_of: "2026-11-01", given: {receipts: [{kind: loan, amount: 40, irregular: true, month: "2026-11"}]}, title: "An irregular loan is excluded by its kind (J.25)", expect: 0}
  # Coverage pass 5 (docs/reviews/coverage5-care-energy.md), C5-1: a stream is placed in the months its source ran (the quarter totals of J.28).
  - {"id": "CO-5723-T3", "title": "C5-1: an irregular $60 a month stream whose start_date is 2026-12-05, read for November: 0", "month": "2026-11", "as_of": "2026-11-01", "given": {"receipts": [{"kind": "other_nontaxable", "amount": 60, "irregular": true, "start_date": "2026-12-05"}]}, "expect": 0}
  - {"id": "CO-5723-T4", "title": "C5-2: an irregular pension payment of $80 with a $20 early-payout penalty: 80 - 20 = 60", "month": "2026-11", "as_of": "2026-11-01", "given": {"receipts": [{"kind": "pension", "amount": 80, "irregular": true, "early_withdrawal_penalty": 20}]}, "expect": 60}
