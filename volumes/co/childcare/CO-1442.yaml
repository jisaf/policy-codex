id: CO-1442
name: "CCCAP: requires verification of citizenship"
identifier: cccap_requires_verification_of_citizenship
kind: derived
type: yes/no
scope: person-month
program: CCCAP
meaning: "Whether the citizenship of a child for whom care is requested must be verified for CCCAP: the signed application's attestation suffices unless the county finds it inconsistent."
derived: [all, cccap_is_eligible_child, citizenship_attestation_is_questionable]
sources: [S890]
implemented: engine
tags: [verification, immigration, age]
rationale: No existing item states this CCCAP verification requirement; the phase-9 chapter needs it to count the household's pending verifications.
tests:
