  - {id: CO-1442-T2, month: "2026-10", as_of: "2026-10-01", given: {cccap_is_eligible_child: true, citizenship_attestation_is_questionable: false}, expect: false}
  - {id: CO-1442-T3, month: "2026-10", as_of: "2026-10-01", given: {cccap_is_eligible_child: false}, expect: false}
