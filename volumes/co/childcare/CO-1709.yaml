id: CO-1709
name: "CCCAP: self-employment business expenses"
identifier: cccap_self_employment_business_expenses
kind: derived
type: money
scope: person-month
program: CCCAP
meaning: "The person's verified business expenses for the month that 8 CCR 1403-1 3.111.I.2.a allows (rent of business premises, wholesale cost of merchandise, utilities, taxes, business mileage, labor, upkeep of necessary equipment): the operating costs and business vehicle costs; not depreciation, payments on the principal of loans for capital goods, or personal expenses (3.111.I.2.b)."
precision: "Earned-income records, step E1 (CCCAP): the costs are earnings records (earnings, CO-5100) of a cost kind, each deducted or not by its row in cccap_earnings_treatment_table (CO-5105; D4: no deduction by silence), paid in the month, replacing the cost facts CO-3370 to CO-3375, each read as 0 when not stated; a cost of the farm kind deducted_for_farm (interest) is deducted when the record is a farm's cost (farm). Second-pass review N-5 (was F-17): the costs are deducted only when verified (3.111.G.2.a: \"The county shall obtain verification of all expenses ... or they will not be considered\"; I.2: \"minus verified business expenses\"): receipts (self_employment_cost_receipts_received, CO-3927) or other documents (self_employment_costs_verified_by_other_documents, CO-4062), each read as false when not stated; otherwise nothing is deducted. Coverage round F-20: for a farm (self_employment_is_farm_operation, CO-4465, read as false when not stated) the interest on its debts (self_employment_interest_costs, CO-3371) is deducted too, since 3.111.I.3.b lists \"Interest on farm mortgages\" among a farm's operating expenses (S3263); I.2.a lists no interest for other self-employment. Coverage pass 5, C5-1 (docs/reviews/coverage5-care-energy.md): a record stated with neither a month nor a date (a stream) is the pay or payment of the days its source ran (docs/conventions.md, \"A record's time\"; job_start_date and job_end_date for pay, start_date and end_date for a receipt). It stands for the thirty days only when its source ran through all of them (none of its dates after their first day or before their last); it is not read when its source ended before their first day or began on or after cccap_application_or_redetermination_date; and a source that began or ended inside the thirty days is placed by its dated records, so a stream without them cannot determine and the record's date is named as missing (8 CCR 1403-1 3.111.H.4, H.5.a.1, H.5.b, S2704, S891: the income \"received during the prior thirty (30) day period\"; OQ-680 (2)). A record stated with its month or its date is placed as before. KL-CE-1 (coverage pass 7, R7-3; docs/reviews/known-limits.md, 2026-11-24): a cost of rental property whose rents are unearned income, because the person manages it under an average of cccap_rental_property_self_employment_min_hours_per_week (CO-7252, twenty) hours a week (8 CCR 1403-1 3.111.H.4.e, S2704; the line as cccap_rental_property_receipts_as_unearned, CO-7251, tests it), is not a cost of self-employment: it is taken against the property's rents (cccap_rental_property_costs, CO-7910; I.12, I.17 \"Net rental income\"). A cost record says which business it is of by its job, the job its business's receipts record states (earnings, CO-5100); the records are read in this order: whether any of the person's business receipts records is rental property (rental_property), then the line, then the cost's business, so the job is read only for a person with rental property. Before, every cost record of the person was a cost of self-employment, so the costs of a rental under the line were taken against no self-employment receipts and lost (probe CR2)."
derived: ["case", [["any", ["otherwise", "self_employment_cost_receipts_received", false], ["otherwise", "self_employment_costs_verified_by_other_documents", false]], ["sum_receipts", "earnings", ["all", ["case", [["=", ["lookup", "cccap_earnings_treatment_table", ["receipt", "kind"]], "deducted"], true], [["=", ["lookup", "cccap_earnings_treatment_table", ["receipt", "kind"]], "deducted_for_farm"], ["receipt", "farm"]], ["else", false]], ["case", [["not", ["unknown", ["receipt", "month"]]], ["received_in", ["month"]]], [["any", ["all", ["not", ["unknown", ["receipt", "job_end_date"]]], ["<", ["receipt", "job_end_date"], ["days_after", ["-", 0, "cccap_prior_income_period_days"], "cccap_application_or_redetermination_date"]]], ["all", ["not", ["unknown", ["receipt", "job_start_date"]]], [">=", ["receipt", "job_start_date"], "cccap_application_or_redetermination_date"]]], false], [["all", ["any", ["unknown", ["receipt", "job_start_date"]], ["<=", ["receipt", "job_start_date"], ["days_after", ["-", 0, "cccap_prior_income_period_days"], "cccap_application_or_redetermination_date"]]], ["any", ["unknown", ["receipt", "job_end_date"]], [">=", ["receipt", "job_end_date"], ["days_after", -1, "cccap_application_or_redetermination_date"]]]], ["received_in", ["month"]]], ["else", ["all", [">=", ["receipt", "date"], ["days_after", ["-", 0, "cccap_prior_income_period_days"], "cccap_application_or_redetermination_date"]], ["<", ["receipt", "date"], "cccap_application_or_redetermination_date"]]]], ["not", ["all", [">", ["sum_receipts", ["of", ["owner"], "earnings"], ["all", ["=", ["receipt", "kind"], "self_employment_receipts"], ["receipt", "rental_property"]], 1], 0], ["<", ["/", ["of", ["owner"], "cccap_rental_property_management_hours"], ["/", ["days_between", ["first_day", ["month"]], ["first_day", ["month_after", ["month"]]]], 7]], "cccap_rental_property_self_employment_min_hours_per_week"], ["case", [["=", ["receipt", "job"], "job_1"], [">", ["sum_receipts", ["of", ["owner"], "earnings"], ["all", ["=", ["receipt", "kind"], "self_employment_receipts"], ["=", ["receipt", "job"], "job_1"], ["receipt", "rental_property"]], 1], 0]], [["=", ["receipt", "job"], "job_2"], [">", ["sum_receipts", ["of", ["owner"], "earnings"], ["all", ["=", ["receipt", "kind"], "self_employment_receipts"], ["=", ["receipt", "job"], "job_2"], ["receipt", "rental_property"]], 1], 0]], [["=", ["receipt", "job"], "job_3"], [">", ["sum_receipts", ["of", ["owner"], "earnings"], ["all", ["=", ["receipt", "kind"], "self_employment_receipts"], ["=", ["receipt", "job"], "job_3"], ["receipt", "rental_property"]], 1], 0]], [["=", ["receipt", "job"], "job_4"], [">", ["sum_receipts", ["of", ["owner"], "earnings"], ["all", ["=", ["receipt", "kind"], "self_employment_receipts"], ["=", ["receipt", "job"], "job_4"], ["receipt", "rental_property"]], 1], 0]], [["=", ["receipt", "job"], "job_5"], [">", ["sum_receipts", ["of", ["owner"], "earnings"], ["all", ["=", ["receipt", "kind"], "self_employment_receipts"], ["=", ["receipt", "job"], "job_5"], ["receipt", "rental_property"]], 1], 0]], [["=", ["receipt", "job"], "job_6"], [">", ["sum_receipts", ["of", ["owner"], "earnings"], ["all", ["=", ["receipt", "kind"], "self_employment_receipts"], ["=", ["receipt", "job"], "job_6"], ["receipt", "rental_property"]], 1], 0]]]]]], ["receipt", "amount"]]], ["else", 0]]
sources: [S1157, S1637, S3263, S2704, S891]
implemented: engine
tags: [income]
open: [OQ-680, OQ-1366]
rationale: "Same-word audit SW-28, dual-entry audit 3.24 and 3.25: each program's excluded income and allowable business costs were program-prefixed supplied amounts, so one receipt or one set of business costs was entered once per program. The neutral fact describes the receipt or the cost; each program's exclusion or allowable cost is its own derived item citing its list (product-owner decision, convention rule 13). The ID and identifier are kept; the amount is now derived."
tests:
  # Operating $400 and vehicle $30 are deducted; interest $20 (not a farm's), capital principal $100 and home space $50 are not: $400 + $30 = $430.
  - {id: CO-1709-T1, month: "2026-10", as_of: "2026-10-01", given: {self_employment_cost_receipts_received: true, earnings: [{kind: self_employment_receipts, amount: 2000, rental_property: false}, {kind: business_cost_operating, amount: 400}, {kind: business_cost_interest, amount: 20}, {kind: business_cost_capital_principal, amount: 100}, {kind: business_cost_home_space, amount: 50}, {kind: business_cost_vehicle, amount: 30}]}, expect: 430}
  - {id: CO-1709-T2, title: "N-5: the same costs verified by bank statements, which CCCAP accepts", month: "2026-10", as_of: "2026-10-01", given: {self_employment_costs_verified_by_other_documents: true, earnings: [{kind: self_employment_receipts, amount: 2000, rental_property: false}, {kind: business_cost_operating, amount: 400}, {kind: business_cost_vehicle, amount: 30}]}, expect: 430}
  - {id: CO-1709-T3, title: "N-5: costs claimed with no verification are not considered (3.111.G.2.a)", month: "2026-10", as_of: "2026-10-01", given: {earnings: [{kind: self_employment_receipts, amount: 4000}, {kind: business_cost_operating, amount: 3000}]}, expect: 0}
  # Coverage round F-20: a farm deducts $200 of farm mortgage interest besides $1,000 of operating costs (3.111.I.3.b): $1,200.
  - {id: CO-1709-T4, title: "F-20: a farm's mortgage interest is an operating expense", as_of: "2026-11-01", month: "2026-11", given: {self_employment_cost_receipts_received: true, earnings: [{kind: farm_self_employment_receipts, amount: 3000}, {kind: business_cost_operating, amount: 1000, farm: true}, {kind: business_cost_interest, amount: 200, farm: true}]}, expect: 1200}
  - {id: CO-1709-T5, title: "F-20: the same interest is not deducted for non-farm self-employment", as_of: "2026-11-01", month: "2026-11", given: {self_employment_cost_receipts_received: true, earnings: [{kind: self_employment_receipts, amount: 3000, rental_property: false}, {kind: business_cost_operating, amount: 1000}, {kind: business_cost_interest, amount: 200}]}, expect: 1000}
  - {id: CO-1709-T6, title: "Costs paid in another month are not this month's", as_of: "2026-11-01", month: "2026-11", given: {self_employment_cost_receipts_received: true, earnings: [{kind: business_cost_operating, amount: 1000, month: "2026-10"}, {kind: business_cost_vehicle, amount: 80, month: "2026-11"}]}, expect: 80}
  - {id: CO-1709-T7, title: "Verified, earnings not stated: cannot determine", as_of: "2026-11-01", month: "2026-11", given: {self_employment_cost_receipts_received: true}, expect: unknown}
  # Coverage pass 5 (docs/reviews/coverage5-care-energy.md), C5-1: application 2026-11-15, so the thirty days run 2026-10-16 to 2026-11-14 (H.4-5, OQ-680).
  - {"id": "CO-1709-T8", "title": "C5-1 (CE1): the operating costs of a business that closed 2026-08-31, stated as a stream: 0", "month": "2026-11", "as_of": "2026-11-15", "given": {"cccap_application_or_redetermination_date": "2026-11-15", "self_employment_cost_receipts_received": true, "earnings": [{"kind": "business_cost_operating", "amount": 200, "job_end_date": "2026-08-31"}]}, "expect": 0}
  # KL-CE-1 (2026-11-24): T1, T2 and T5 state that the business is not rental property (rental_property false), which this item now
  # reads before a cost's business (required on every business receipts record CCCAP reads, coverage pass 7 R7-1); values unchanged.
  # November 2026: 30 days, 30 / 7 = 4.2857 weeks. A rental managed 43 hours is 43 / 4.2857 = 10.03 hours a week, under twenty, so
  # its rents are unearned (8 CCR 1403-1 3.111.H.4.e) and its costs are taken against them (cccap_rental_property_costs, CO-7910),
  # not here: probe CR2's $300 cost record is not a self-employment cost: 0 (before KL-CE-1: 300, against no self-employment receipts).
  - {id: CO-1709-T9, title: "KL-CE-1 (CR2): a rental managed 43 hours (10.03 a week); its $300 cost record is not a self-employment cost: 0", month: "2026-11", as_of: "2026-11-15", given: {self_employment_cost_receipts_received: true, earnings: [{kind: self_employment_receipts, amount: 1800, hours: 43, rental_property: true, job: job_1}, {kind: business_cost_operating, amount: 300, job: job_1, property_maintenance: true}]}, expect: 0}
  # 90 hours: 90 / 4.2857 = 21 a week, at least twenty: the rental is self-employment and its operating cost is deducted: 300.
  - {id: CO-1709-T10, title: "KL-CE-1: a rental managed 90 hours (21 a week) is self-employment: its $300 operating cost is deducted", month: "2026-11", as_of: "2026-11-15", given: {self_employment_cost_receipts_received: true, earnings: [{kind: self_employment_receipts, amount: 1800, hours: 90, rental_property: true, job: job_1}, {kind: business_cost_operating, amount: 300, job: job_1, property_maintenance: true}]}, expect: 300}
  # A cleaning business (job_2, not rental, 100 hours) and a rental (job_1, 43 hours, 10.03 a week): the cleaning business's $150 is
  # deducted; the rental's $100 is taken against its rents (CO-7910): 150.
  - {id: CO-1709-T11, title: "KL-CE-1: a cleaning business's $150 is deducted; the small rental's $100 is not (its rents', CO-7910): 150", month: "2026-11", as_of: "2026-11-15", given: {self_employment_cost_receipts_received: true, earnings: [{kind: self_employment_receipts, amount: 2000, hours: 100, rental_property: false, job: job_2}, {kind: business_cost_operating, amount: 150, job: job_2}, {kind: self_employment_receipts, amount: 1800, hours: 43, rental_property: true, job: job_1}, {kind: business_cost_operating, amount: 100, job: job_1}]}, expect: 150}
  # Decision 4: a rental under the line beside a cost that does not name its business: whose cost it is is not known: cannot determine.
  - {id: CO-1709-T12, title: "KL-CE-1, decision 4: a small rental and a cost record with no job: cannot determine", month: "2026-11", as_of: "2026-11-15", given: {self_employment_cost_receipts_received: true, earnings: [{kind: self_employment_receipts, amount: 1800, hours: 43, rental_property: true, job: job_1}, {kind: business_cost_operating, amount: 150}]}, expect: unknown}
