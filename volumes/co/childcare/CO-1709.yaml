id: CO-1709
name: "CCCAP: self-employment business expenses"
identifier: cccap_self_employment_business_expenses
kind: derived
type: money
scope: person-month
program: CCCAP
meaning: "The person's verified business expenses for the month that 8 CCR 1403-1 3.111.I.2.a allows (rent of business premises, wholesale cost of merchandise, utilities, taxes, business mileage, labor, upkeep of necessary equipment): the operating costs and business vehicle costs; not depreciation, payments on the principal of loans for capital goods, or personal expenses (3.111.I.2.b)."
precision: "Earned-income records, step E1 (CCCAP): the costs are earnings records (earnings, CO-5100) of a cost kind, each deducted or not by its row in cccap_earnings_treatment_table (CO-5105; D4: no deduction by silence), paid in the month, replacing the cost facts CO-3370 to CO-3375, each read as 0 when not stated; a cost of the farm kind deducted_for_farm (interest) is deducted when the record is a farm's cost (farm). Second-pass review N-5 (was F-17): the costs are deducted only when verified (3.111.G.2.a: \"The county shall obtain verification of all expenses ... or they will not be considered\"; I.2: \"minus verified business expenses\"): receipts (self_employment_cost_receipts_received, CO-3927) or other documents (self_employment_costs_verified_by_other_documents, CO-4062), each read as false when not stated; otherwise nothing is deducted. Coverage round F-20: for a farm (self_employment_is_farm_operation, CO-4465, read as false when not stated) the interest on its debts (self_employment_interest_costs, CO-3371) is deducted too, since 3.111.I.3.b lists \"Interest on farm mortgages\" among a farm's operating expenses (S3263); I.2.a lists no interest for other self-employment."
derived: [case, [[any, [otherwise, self_employment_cost_receipts_received, false], [otherwise, self_employment_costs_verified_by_other_documents, false]], [sum_receipts, earnings, [all, [case, [["=", [lookup, cccap_earnings_treatment_table, [receipt, kind]], deducted], true], [["=", [lookup, cccap_earnings_treatment_table, [receipt, kind]], deducted_for_farm], [receipt, farm]], [else, false]], [received_in, [month]]], [receipt, amount]]], [else, 0]]
sources: [S1157, S1637, S3263]
implemented: engine
tags: [income]
open: [OQ-680]
rationale: "Same-word audit SW-28, dual-entry audit 3.24 and 3.25: each program's excluded income and allowable business costs were program-prefixed supplied amounts, so one receipt or one set of business costs was entered once per program. The neutral fact describes the receipt or the cost; each program's exclusion or allowable cost is its own derived item citing its list (product-owner decision, convention rule 13). The ID and identifier are kept; the amount is now derived."
tests:
  # Operating $400 and vehicle $30 are deducted; interest $20 (not a farm's), capital principal $100 and home space $50 are not: $400 + $30 = $430.
  - {id: CO-1709-T1, month: "2026-10", as_of: "2026-10-01", given: {self_employment_cost_receipts_received: true, earnings: [{kind: self_employment_receipts, amount: 2000}, {kind: business_cost_operating, amount: 400}, {kind: business_cost_interest, amount: 20}, {kind: business_cost_capital_principal, amount: 100}, {kind: business_cost_home_space, amount: 50}, {kind: business_cost_vehicle, amount: 30}]}, expect: 430}
  - {id: CO-1709-T2, title: "N-5: the same costs verified by bank statements, which CCCAP accepts", month: "2026-10", as_of: "2026-10-01", given: {self_employment_costs_verified_by_other_documents: true, earnings: [{kind: self_employment_receipts, amount: 2000}, {kind: business_cost_operating, amount: 400}, {kind: business_cost_vehicle, amount: 30}]}, expect: 430}
  - {id: CO-1709-T3, title: "N-5: costs claimed with no verification are not considered (3.111.G.2.a)", month: "2026-10", as_of: "2026-10-01", given: {earnings: [{kind: self_employment_receipts, amount: 4000}, {kind: business_cost_operating, amount: 3000}]}, expect: 0}
  # Coverage round F-20: a farm deducts $200 of farm mortgage interest besides $1,000 of operating costs (3.111.I.3.b): $1,200.
  - {id: CO-1709-T4, title: "F-20: a farm's mortgage interest is an operating expense", as_of: "2026-11-01", month: "2026-11", given: {self_employment_cost_receipts_received: true, earnings: [{kind: farm_self_employment_receipts, amount: 3000}, {kind: business_cost_operating, amount: 1000, farm: true}, {kind: business_cost_interest, amount: 200, farm: true}]}, expect: 1200}
  - {id: CO-1709-T5, title: "F-20: the same interest is not deducted for non-farm self-employment", as_of: "2026-11-01", month: "2026-11", given: {self_employment_cost_receipts_received: true, earnings: [{kind: self_employment_receipts, amount: 3000}, {kind: business_cost_operating, amount: 1000}, {kind: business_cost_interest, amount: 200}]}, expect: 1000}
  - {id: CO-1709-T6, title: "Costs paid in another month are not this month's", as_of: "2026-11-01", month: "2026-11", given: {self_employment_cost_receipts_received: true, earnings: [{kind: business_cost_operating, amount: 1000, month: "2026-10"}, {kind: business_cost_vehicle, amount: 80, month: "2026-11"}]}, expect: 80}
  - {id: CO-1709-T7, title: "Verified, earnings not stated: cannot determine", as_of: "2026-11-01", month: "2026-11", given: {self_employment_cost_receipts_received: true}, expect: unknown}
