meaning: "Whether the child is attending school, which excuses a child in unrelated exempt care from the immunization record 8 CCR 1403-1 requires of a child \"not attending school as defined by the Colorado Department of Education\" (S1637 F.2): enrolled in kindergarten through grade 12, a secondary career and technical program, or a recognized home-school program."
precision: "The Colorado Department of Education's definition was not fetched (OQ-562): this reading counts kindergarten and a district-recognized home-school program as attending school, and preschool as not."
