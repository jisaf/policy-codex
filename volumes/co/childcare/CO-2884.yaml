rationale: "Same-word audit SW-13: CCCAP's immunization verification read sebt_is_school_aged, SUN Bucks's compulsory attendance age, so a five-year-old in kindergarten was asked for a record the rule does not require and a home-schooled eight-year-old was not asked for one it does."
