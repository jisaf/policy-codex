id: CO-2107
name: "CCCAP: resident of the county applied to"
identifier: cccap_meets_county_residency
kind: derived
type: yes/no
scope: person
program: CCCAP
meaning: "Whether this adult caretaker or teen parent meets the residency test of 8 CCR 1403-1 3.111.A: at an application or a redetermination, a Colorado resident whose county of residence is the county from which Low-Income Child Care assistance is sought or received; at a change reported during the eligibility period or a transition from Colorado Works, a Colorado resident, since a caretaker who moves to another county \"shall remain eligible for the duration of the eligibility period\" (3.111.A, 3.125.GG)."
precision: "Coverage round F-05: 3.111.A's second sentence and 3.125.GG let a household that moves out of the county during the eligibility period stay eligible until its redetermination, the originating county keeping the case; only a move out of the state ends eligibility during the period (3.114.A.2, 3.125.Q.3), and a county move is acted on at the redetermination (3.114.B.8). At a change during the eligibility period (cccap_determination_type, CO-3307) the test is therefore Colorado residency alone; cccap_application_county is the originating county. GG's other two conditions, income below 85% of state median income and an eligible activity, are tested by cccap_eligibility_status (CO-989) at every determination. Coverage pass 2 C2-8: a transition from Colorado Works is read the same way: 3.116.L (S3531) keeps Colorado Works Child Care for a caretaker who moves county during the twelve months, 3.117.B (S3531) requires \"No additional verification ... until the household's twelve (12) month re-determination\", and 3.117.A lists the only conditions that stop a transition (S2851); before the fix a Colorado Works family that had moved county was ineligible at its transition. Before the fix a stated county move failed the test at a change (probe RV-C)."
derived: [all, is_colorado_resident, [any, ["=", county_of_residence, cccap_application_county], [in, cccap_determination_type, [change_during_eligibility_period, transition_from_colorado_works]]]]
sources: [S1408, S484, S3250, S3531]
implemented: engine
tags: [household]
rationale: "OQ-159: cccap_low_income_child_care_eligible (CO-987) read only state residency (is_colorado_resident, CO-505). The county test differs from Medicaid's state test, so it is its own item; CO-987 reads it."
tests:
  - {id: CO-2107-T1, as_of: "2026-10-01", given: {is_colorado_resident: true, county_of_residence: denver, cccap_application_county: denver}, expect: true}
  # 3.111.A: assistance is sought from a county the caretaker does not live in.
  - {id: CO-2107-T2, as_of: "2026-10-01", given: {is_colorado_resident: true, county_of_residence: adams, cccap_application_county: denver, cccap_determination_type: application}, expect: false}
  - {id: CO-2107-T3, as_of: "2026-10-01", given: {is_colorado_resident: false, cccap_application_county: denver}, expect: false}
  # Coverage round F-05 (probe RV-C): a change reported during the period; the family moved from Denver to Arapahoe (3.111.A, 3.125.GG).
  - {id: CO-2107-T4, title: "F-05: a county move reported during the eligibility period", as_of: "2026-10-01", given: {is_colorado_resident: true, county_of_residence: arapahoe, cccap_application_county: denver, cccap_determination_type: change_during_eligibility_period}, expect: true}
  # The same move at the redetermination fails (3.114.B.8).
  - {id: CO-2107-T5, title: "F-05: the same move at the redetermination", as_of: "2026-10-01", given: {is_colorado_resident: true, county_of_residence: arapahoe, cccap_application_county: denver, cccap_determination_type: redetermination}, expect: false}
  # A move out of the state during the period ends eligibility (3.114.A.2).
  - {id: CO-2107-T6, title: "F-05: a move out of the state during the period", as_of: "2026-10-01", given: {is_colorado_resident: false, cccap_application_county: denver, cccap_determination_type: change_during_eligibility_period}, expect: false}
  - {id: CO-2107-T7, title: "C2-8: a Colorado Works family that moved county, at its transition (3.116.L, 3.117.A-B)", as_of: "2026-10-01", given: {is_colorado_resident: true, county_of_residence: arapahoe, cccap_application_county: denver, cccap_determination_type: transition_from_colorado_works}, expect: true}
