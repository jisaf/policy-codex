id: CO-991
name: "CCCAP: household caretakers in eligible activity"
identifier: cccap_household_caretakers_in_eligible_activity
kind: derived
type: yes/no
scope: person-month
program: CCCAP
meaning: "At least one adult caretaker or teen parent in this person's CCCAP household who is in the home (not involuntarily out of it) is engaged in a low-income eligible activity this month, and every other adult caretaker or teen parent is either in an activity too or excused from one, under 8 CCR 1403-1 3.111.D.1 and E: a one-caretaker household whose caretaker is in an activity (D.1.a); a two-caretaker household where both are (D.1.c.1), one being voluntarily absent included (D.1.c.2); one in an activity and the other incapacitated under a physician's or other medical verification (D.1.c.3); or one in an activity in the home and the other involuntarily out of the home, a one-caretaker household (D.1.b)."
precision: "The caretakers are cccap_is_adult_caretaker (CO-992) household members plus any cccap_is_teen_parent (CO-981). Coverage round F-03: a caretaker who is not in an eligible activity is excused when cccap_caretaker_is_incapacitated (CO-1744; 3.111.D.1.c.3) or cccap_caretaker_is_involuntarily_absent (CO-898, 3.111.D.1.b; a voluntary absence under c.2 excuses no one) holds for them, but only if another caretaker in the home is in an activity: two incapacitated caretakers, or one incapacitated and one involuntarily absent (a one-caretaker household under D.1.b whose caretaker is incapacitated), fail, per 3.111.E's rule that \"Incapacitated single adult caretakers ... who are not in a low-income eligible activity are not eligible\"; before the fix any second caretaker, active or not, excused the first (probes RV-A1, RV-A2). A household whose only caretaker is involuntarily out of the home has no caretaker in the home in an activity and fails (see OQ-136 on the involuntary/voluntary distinction this does not carry, and OQ-125 on unrelated-caretaker verification). Evaluated for any household member, child included, so a child's CCCAP status reads the caretakers' activity rather than the child's own. Vocabulary fix round (docs/reviews/vocabulary-reuse.md, R-12, C-4): incapacity reads cccap_caretaker_is_incapacitated (CO-1744), not SNAP's unfitness statement; an unstated incapacity or absence reads as false, as the facts' meanings now say."
derived: [all, [exists, cccap_household_members, [all, [any, [of, [P], cccap_is_adult_caretaker], [of, [P], cccap_is_teen_parent]], [of, [P], cccap_caretaker_in_eligible_activity], [not, [otherwise, [of, [P], cccap_caretaker_is_involuntarily_absent], false]]]], [not, [exists, cccap_household_members, [all, [any, [of, [P], cccap_is_adult_caretaker], [of, [P], cccap_is_teen_parent]], [not, [of, [P], cccap_caretaker_in_eligible_activity]], [not, [any, [otherwise, [of, [P], cccap_caretaker_is_incapacitated], false], [otherwise, [of, [P], cccap_caretaker_is_involuntarily_absent], false]]]]]]]
sources: [S497, S484, S1409]
implemented: engine
tags: [household, state_election]
rationale: "cccap_caretaker_in_eligible_activity (CO-984) is the per-person activity test; read directly by the status rule it made an infant's status turn on the infant's own hours. This item lifts it to the household as 3.111.D.1 frames it, so cccap_low_income_child_care_eligible (CO-987) and cccap_eligibility_status (CO-989) give every member the household's answer. The caretaker predicate and absence/incapacity exemption were corrected per the review (docs/reviews/cccap-leap-phase-6.md, C-7, should-fix): the prior predicate ('not a household child') counted every unrelated adult in the home as a caretaker, and no absence or incapacity shape of 3.111.D.1.b, c.2, c.3 was exempted from the activity requirement at all."
tests:
  # Single working caretaker with an infant: true from the caretaker's and the infant's perspective.
  - {id: CO-991-T1, as_of: "2026-10-01", month: "2026-10", given: {immigration_status: us_citizen, date_of_birth: "1985-01-22", hours_worked: 138, cccap_is_in_education_or_training_activity: false, cccap_is_receiving_assistance: false, county_of_residence: denver, cccap_application_county: denver, wages_gross: 2380, cccap_self_employment_net_earnings: 0, cccap_is_financially_contributing_to_child: true, cccap_is_attending_high_school: false, cccap_is_in_job_search_activity: false}, others: {p5: {immigration_status: us_citizen, date_of_birth: "2026-02-03", hours_worked: 0, cccap_is_in_education_or_training_activity: false, cccap_is_receiving_assistance: false, county_of_residence: denver, cccap_application_county: denver, cccap_child_needs_care_for_part_of_day: true, cccap_is_financially_contributing_to_child: true, cccap_is_attending_high_school: false, cccap_is_in_job_search_activity: false}}, relationships: [[parent, p1, p5]], expect: true}
  - {id: CO-991-T2, as_of: "2026-10-01", month: "2026-10", given: {immigration_status: us_citizen, date_of_birth: "2026-02-03", hours_worked: 0, cccap_is_in_education_or_training_activity: false, cccap_is_receiving_assistance: false, county_of_residence: denver, cccap_application_county: denver, cccap_child_needs_care_for_part_of_day: true, cccap_is_financially_contributing_to_child: true, cccap_is_attending_high_school: false, cccap_is_in_job_search_activity: false}, others: {p3: {immigration_status: us_citizen, date_of_birth: "1985-01-22", hours_worked: 138, cccap_is_in_education_or_training_activity: false, cccap_is_receiving_assistance: false, county_of_residence: denver, cccap_application_county: denver, wages_gross: 2380, cccap_self_employment_net_earnings: 0, cccap_is_financially_contributing_to_child: true, cccap_is_attending_high_school: false, cccap_is_in_job_search_activity: false}}, relationships: [[parent, p3, p1]], expect: true}
  # Two caretakers, one idle: false (3.111.D.1.c.1 needs both in an activity).
  - {id: CO-991-T3, as_of: "2026-10-01", month: "2026-10", given: {immigration_status: us_citizen, date_of_birth: "1985-01-22", hours_worked: 138, cccap_is_in_education_or_training_activity: false, cccap_is_receiving_assistance: false, county_of_residence: denver, cccap_application_county: denver, wages_gross: 2380, cccap_self_employment_net_earnings: 0, cccap_is_financially_contributing_to_child: true, cccap_is_attending_high_school: false, cccap_is_in_job_search_activity: false}, others: {p2: {immigration_status: us_citizen, date_of_birth: "1983-05-05", hours_worked: 0, cccap_is_in_education_or_training_activity: false, is_in_sud_treatment_iop_or_higher: false, cccap_is_receiving_assistance: false, county_of_residence: denver, cccap_application_county: denver, cccap_is_financially_contributing_to_child: true, cccap_is_attending_high_school: false, cccap_is_in_job_search_activity: false}, p5: {immigration_status: us_citizen, date_of_birth: "2026-02-03", hours_worked: 0, cccap_is_in_education_or_training_activity: false, cccap_is_receiving_assistance: false, county_of_residence: denver, cccap_application_county: denver, cccap_child_needs_care_for_part_of_day: true, cccap_is_financially_contributing_to_child: true, cccap_is_attending_high_school: false, cccap_is_in_job_search_activity: false}}, relationships: [[spouse, p1, p2], [parent, p1, p5], [parent, p2, p5]], expect: false}
  # Two caretakers both in an activity (one in job search): true.
