  - {id: CO-991-T6, as_of: "2026-10-01", month: "2026-10", given: {immigration_status: us_citizen, date_of_birth: "1985-01-22", hours_worked: 0, cccap_is_in_education_or_training_activity: false, is_in_sud_treatment_iop_or_higher: false, has_medical_statement_of_unfitness: true, cccap_caretaker_is_incapacitated: true, cccap_is_receiving_assistance: false, county_of_residence: denver, cccap_application_county: denver, cccap_is_financially_contributing_to_child: true, cccap_is_attending_high_school: false, cccap_is_in_job_search_activity: false}, others: {p5: {immigration_status: us_citizen, date_of_birth: "2026-02-03", hours_worked: 0, cccap_is_in_education_or_training_activity: false, cccap_is_receiving_assistance: false, county_of_residence: denver, cccap_application_county: denver, cccap_child_needs_care_for_part_of_day: true, cccap_is_financially_contributing_to_child: true, cccap_is_attending_high_school: false, cccap_is_in_job_search_activity: false}}, relationships: [[parent, p1, p5]], expect: false}
