id: CO-991
name: "CCCAP: household caretakers in eligible activity"
identifier: cccap_household_caretakers_in_eligible_activity
kind: derived
type: yes/no
scope: person-month
program: CCCAP
meaning: Every adult caretaker or teen parent in this person's CCCAP household is engaged in a low-income eligible activity this month, and there is at least one, under 8 CCR 1403-1 3.111.D.1 (a one-caretaker household where the caretaker is in an activity; a two-caretaker household where both are, unless one is involuntarily absent, voluntarily absent, or incapacitated under a physician's or other medical verification).
precision: "The caretakers are cccap_is_adult_caretaker (CO-992) household members plus any cccap_is_teen_parent (CO-981). A caretaker who is not in an eligible activity is exempt from this test when has_medical_statement_of_unfitness (3.111.D.1.c.3) or is_absent_from_home (CO-898, 3.111.D.1.b/c.2) holds for them AND at least one other caretaker is present in the household - not when they are the household's only caretaker, per 3.111.E's rule that a single incapacitated caretaker not in an activity is ineligible (see OQ-136 on the involuntary/voluntary distinction this does not carry, and OQ-125 on unrelated-caretaker verification). Evaluated for any household member, child included, so a child's CCCAP status reads the caretakers' activity rather than the child's own."
open: [OQ-125, OQ-135, OQ-136]
derived: [all, [exists, cccap_household_members, [any, [of, [P], cccap_is_adult_caretaker], [of, [P], cccap_is_teen_parent]]], [not, [exists, cccap_household_members, [all, [any, [of, [P], cccap_is_adult_caretaker], [of, [P], cccap_is_teen_parent]], [not, [of, [P], cccap_caretaker_in_eligible_activity]], [not, [all, [any, [otherwise, [of, [P], has_medical_statement_of_unfitness], false], [otherwise, [of, [P], is_absent_from_home], false]], [">", [count, [filter, cccap_household_members, [any, [of, [P], cccap_is_adult_caretaker], [of, [P], cccap_is_teen_parent]]]], 1]]]]]]]
sources: [S497, S484]
implemented: engine
tags: [household, state_election]
rationale: "cccap_caretaker_in_eligible_activity (CO-984) is the per-person activity test; read directly by the status rule it made an infant's status turn on the infant's own hours. This item lifts it to the household as 3.111.D.1 frames it, so cccap_low_income_child_care_eligible (CO-987) and cccap_eligibility_status (CO-989) give every member the household's answer. The caretaker predicate and absence/incapacity exemption were corrected per the review (docs/reviews/cccap-leap-phase-6.md, C-7, should-fix): the prior predicate ('not a household child') counted every unrelated adult in the home as a caretaker, and no absence or incapacity shape of 3.111.D.1.b, c.2, c.3 was exempted from the activity requirement at all."
tests:
  # Single working caretaker with an infant: true from the caretaker's and the infant's perspective.
  - {id: CO-991-T1, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "1985-01-22", hours_worked: 138, is_in_job_search_activity: false, is_enrolled_in_school: false}, others: {p5: {date_of_birth: "2026-02-03", hours_worked: 0, is_in_job_search_activity: false, is_enrolled_in_school: false}}, relationships: [[parent, p1, p5]], expect: true}
  - {id: CO-991-T2, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "2026-02-03", hours_worked: 0, is_in_job_search_activity: false, is_enrolled_in_school: false}, others: {p3: {date_of_birth: "1985-01-22", hours_worked: 138, is_in_job_search_activity: false, is_enrolled_in_school: false}}, relationships: [[parent, p3, p1]], expect: true}
  # Two caretakers, one idle: false (3.111.D.1.c.1 needs both in an activity).
  - {id: CO-991-T3, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "1985-01-22", hours_worked: 138, is_in_job_search_activity: false, is_enrolled_in_school: false}, others: {p2: {date_of_birth: "1983-05-05", hours_worked: 0, is_in_job_search_activity: false, is_enrolled_in_school: false}, p5: {date_of_birth: "2026-02-03", hours_worked: 0, is_in_job_search_activity: false, is_enrolled_in_school: false}}, relationships: [[spouse, p1, p2], [parent, p1, p5], [parent, p2, p5]], expect: false}
  # Two caretakers both in an activity (one in job search): true.
  - {id: CO-991-T4, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "1985-01-22", hours_worked: 138, is_in_job_search_activity: false, is_enrolled_in_school: false}, others: {p2: {date_of_birth: "1983-05-05", hours_worked: 0, is_in_job_search_activity: true, is_enrolled_in_school: false}, p5: {date_of_birth: "2026-02-03", hours_worked: 0, is_in_job_search_activity: false, is_enrolled_in_school: false}}, relationships: [[spouse, p1, p2], [parent, p1, p5], [parent, p2, p5]], expect: true}
  # Two caretakers, one idle but medically unfit (3.111.D.1.c.3): exempt because a second caretaker is present and active.
  - {id: CO-991-T5, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "1985-01-22", hours_worked: 138, is_in_job_search_activity: false, is_enrolled_in_school: false}, others: {p2: {date_of_birth: "1983-05-05", hours_worked: 0, is_in_job_search_activity: false, is_enrolled_in_school: false, has_medical_statement_of_unfitness: true}, p5: {date_of_birth: "2026-02-03", hours_worked: 0, is_in_job_search_activity: false, is_enrolled_in_school: false}}, relationships: [[spouse, p1, p2], [parent, p1, p5], [parent, p2, p5]], expect: true}
  # A single incapacitated caretaker not in an activity is ineligible (3.111.E): no exemption without a second caretaker.
  - {id: CO-991-T6, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "1985-01-22", hours_worked: 0, is_in_job_search_activity: false, is_enrolled_in_school: false, has_medical_statement_of_unfitness: true}, others: {p5: {date_of_birth: "2026-02-03", hours_worked: 0, is_in_job_search_activity: false, is_enrolled_in_school: false}}, relationships: [[parent, p1, p5]], expect: false}
  # An unrelated adult in the home who is not an adult caretaker (not financially contributing, not a parent/caretaker of the eligible child) does not sink the household.
  - {id: CO-991-T7, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "1985-01-22", hours_worked: 138, is_in_job_search_activity: false, is_enrolled_in_school: false}, others: {p2: {date_of_birth: "1983-05-05", hours_worked: 0, is_in_job_search_activity: false, is_enrolled_in_school: false, is_financially_contributing_to_child: false}, p5: {date_of_birth: "2026-02-03", hours_worked: 0, is_in_job_search_activity: false, is_enrolled_in_school: false}}, relationships: [[spouse, p1, p2], [parent, p1, p5]], expect: true}
