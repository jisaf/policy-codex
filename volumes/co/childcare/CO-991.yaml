  # Two caretakers, one idle but medically unfit (3.111.D.1.c.3): exempt because a second caretaker is present and active.
  - {id: CO-991-T5, as_of: "2026-10-01", month: "2026-10", given: {immigration_status: us_citizen, date_of_birth: "1985-01-22", hours_worked: 138, cccap_is_in_education_or_training_activity: false, cccap_is_receiving_assistance: false, county_of_residence: denver, cccap_application_county: denver, wages_gross: 2380, cccap_self_employment_net_earnings: 0, cccap_is_financially_contributing_to_child: true, cccap_is_attending_high_school: false, cccap_is_in_job_search_activity: false}, others: {p2: {immigration_status: us_citizen, date_of_birth: "1983-05-05", hours_worked: 0, cccap_is_in_education_or_training_activity: false, has_medical_statement_of_unfitness: true, cccap_caretaker_is_incapacitated: true, cccap_is_receiving_assistance: false, county_of_residence: denver, cccap_application_county: denver, cccap_is_financially_contributing_to_child: true, cccap_is_attending_high_school: false, cccap_is_in_job_search_activity: false}, p5: {immigration_status: us_citizen, date_of_birth: "2026-02-03", hours_worked: 0, cccap_is_in_education_or_training_activity: false, cccap_is_receiving_assistance: false, county_of_residence: denver, cccap_application_county: denver, cccap_child_needs_care_for_part_of_day: true, cccap_is_financially_contributing_to_child: true, cccap_is_attending_high_school: false, cccap_is_in_job_search_activity: false}}, relationships: [[spouse, p1, p2], [parent, p1, p5], [parent, p2, p5]], expect: true}
