id: CO-6404
name: "CCCAP: hours of self-employment in the month"
identifier: cccap_self_employment_hours
kind: derived
type: hours
scope: person-month
program: CCCAP
meaning: "The hours the person worked in self-employment in the month, as each self-employment record of the month states them (earnings, CO-5100, the field hours, of the kinds cccap_earnings_treatment_table counts as self-employment): the \"number of hours worked\" of 8 CCR 1403-1 3.111.G.2.d and the \"number of declared hours worked\" of G.2.e (S4602)."
precision: "A business record of the month that states no hours is cannot determine, naming the record's hours (decision 4 of 2026-11-23). A person with no self-employment record has none. Read by cccap_self_employment_net_earnings (CO-1710), which projects the launch period's income from them, and by cccap_caretaker_in_eligible_activity (CO-984), which tests employment and self-employment each over its own hours (coverage pass 4 C4-3). Coverage pass 5, C5-1 (docs/reviews/coverage5-care-energy.md): a record stated with neither a month nor a date (a stream) is the pay or payment of the days its source ran (docs/conventions.md, \"A record's time\"; job_start_date and job_end_date for pay, start_date and end_date for a receipt). It stands for the thirty days only when its source ran through all of them (none of its dates after their first day or before their last); it is not read when its source ended before their first day or began on or after cccap_application_or_redetermination_date; and a source that began or ended inside the thirty days is placed by its dated records, so a stream without them cannot determine and the record's date is named as missing (8 CCR 1403-1 3.111.H.4, H.5.a.1, H.5.b, S2704, S891: the income \"received during the prior thirty (30) day period\"; OQ-680 (2)). A record stated with its month or its date is placed as before."
derived: ["sum_receipts", "earnings", ["all", ["=", ["lookup", "cccap_earnings_treatment_table", ["receipt", "kind"]], "counted_self_employment"], ["case", [["not", ["unknown", ["receipt", "month"]]], ["received_in", ["month"]]], [["any", ["all", ["not", ["unknown", ["receipt", "job_end_date"]]], ["<", ["receipt", "job_end_date"], ["days_after", ["-", 0, "cccap_prior_income_period_days"], "cccap_application_or_redetermination_date"]]], ["all", ["not", ["unknown", ["receipt", "job_start_date"]]], [">=", ["receipt", "job_start_date"], "cccap_application_or_redetermination_date"]]], false], [["all", ["any", ["unknown", ["receipt", "job_start_date"]], ["<=", ["receipt", "job_start_date"], ["days_after", ["-", 0, "cccap_prior_income_period_days"], "cccap_application_or_redetermination_date"]]], ["any", ["unknown", ["receipt", "job_end_date"]], [">=", ["receipt", "job_end_date"], ["days_after", -1, "cccap_application_or_redetermination_date"]]]], ["received_in", ["month"]]], ["else", ["all", [">=", ["receipt", "date"], ["days_after", ["-", 0, "cccap_prior_income_period_days"], "cccap_application_or_redetermination_date"]], ["<", ["receipt", "date"], "cccap_application_or_redetermination_date"]]]]], ["receipt", "hours"]]
sources: [S4602, S1410, S2704, S891]
implemented: engine
tags: [income]
open: [OQ-680]
rationale: "Coverage pass 4 C4-3: G's activities are tested one by one (\"at least one of\"), so the hours of the business are taken out of the hours worked before the wage job's minimum-wage test; one item for the hours CO-1710 and CO-984 both read. cccap_self_employment_gross_receipts (CO-5156) and leap_self_employment_gross_receipts (CO-5126) sum the same records' amounts, not their hours."
nearest: [CO-5156, CO-5126]
tests:
  - {id: CO-6404-T1, title: "A business record of 60 hours and a wage job: 60", month: "2026-11", as_of: "2026-11-15", given: {earnings: [{kind: wages, amount: 1000}, {kind: self_employment_receipts, amount: 300, hours: 60}, {kind: business_cost_operating, amount: 300}]}, expect: 60}
  - {id: CO-6404-T2, title: "No business: none", month: "2026-11", as_of: "2026-11-15", given: {earnings: [{kind: wages, amount: 1000}]}, expect: 0}
  - {id: CO-6404-T3, title: "A business record that states no hours: cannot determine", month: "2026-11", as_of: "2026-11-15", given: {earnings: [{kind: self_employment_receipts, amount: 300}]}, expect: unknown}
  # Coverage pass 5 (docs/reviews/coverage5-care-energy.md), C5-1: application 2026-11-15, so the thirty days run 2026-10-16 to 2026-11-14 (H.4-5, OQ-680).
  - {"id": "CO-6404-T4", "title": "C5-1 (CE1): 40 hours a month in a business that closed 2026-08-31: 0", "month": "2026-11", "as_of": "2026-11-15", "given": {"cccap_application_or_redetermination_date": "2026-11-15", "earnings": [{"kind": "self_employment_receipts", "amount": 1500, "hours": 40, "job_end_date": "2026-08-31"}]}, "expect": 0}
