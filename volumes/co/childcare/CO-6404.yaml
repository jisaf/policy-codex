id: CO-6404
name: "CCCAP: hours of self-employment in the month"
identifier: cccap_self_employment_hours
kind: derived
type: hours
scope: person-month
program: CCCAP
meaning: "The hours the person worked in self-employment in the month, as each self-employment record of the month states them (earnings, CO-5100, the field hours, of the kinds cccap_earnings_treatment_table counts as self-employment): the \"number of hours worked\" of 8 CCR 1403-1 3.111.G.2.d and the \"number of declared hours worked\" of G.2.e (S4602)."
precision: "A business record of the month that states no hours is cannot determine, naming the record's hours (decision 4 of 2026-11-23). A person with no self-employment record has none. Read by cccap_self_employment_net_earnings (CO-1710), which projects the launch period's income from them, and by cccap_caretaker_in_eligible_activity (CO-984), which tests employment and self-employment each over its own hours (coverage pass 4 C4-3)."
derived: ["sum_receipts", "earnings", ["all", ["=", ["lookup", "cccap_earnings_treatment_table", ["receipt", "kind"]], "counted_self_employment"], ["received_in", ["month"]]], ["receipt", "hours"]]
sources: [S4602, S1410]
implemented: engine
tags: [income, activity]
open: [OQ-680]
rationale: "Coverage pass 4 C4-3: G's activities are tested one by one (\"at least one of\"), so the hours of the business are taken out of the hours worked before the wage job's minimum-wage test; one item for the hours CO-1710 and CO-984 both read. cccap_self_employment_gross_receipts (CO-5156) and leap_self_employment_gross_receipts (CO-5126) sum the same records' amounts, not their hours."
nearest: [CO-5156, CO-5126]
tests:
  - {id: CO-6404-T1, title: "A business record of 60 hours and a wage job: 60", month: "2026-11", as_of: "2026-11-15", given: {earnings: [{kind: wages, amount: 1000}, {kind: self_employment_receipts, amount: 300, hours: 60}, {kind: business_cost_operating, amount: 300}]}, expect: 60}
  - {id: CO-6404-T2, title: "No business: none", month: "2026-11", as_of: "2026-11-15", given: {earnings: [{kind: wages, amount: 1000}]}, expect: 0}
  - {id: CO-6404-T3, title: "A business record that states no hours: cannot determine", month: "2026-11", as_of: "2026-11-15", given: {earnings: [{kind: self_employment_receipts, amount: 300}]}, expect: unknown}
