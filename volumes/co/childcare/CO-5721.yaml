  - {"id": "CO-5721-T16", "title": "X5-1: a share stated without the property's income: cannot determine", "month": "2026-11", "as_of": "2026-11-15", "given": {"receipts": [{"kind": "rental_income", "amount": 0, "ownership_share": 0.5}]}, "expect": "unknown"}
