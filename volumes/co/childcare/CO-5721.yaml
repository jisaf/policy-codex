id: CO-5721
name: "CCCAP: a person's counted recurring receipts"
identifier: cccap_counted_recurring_receipts
kind: derived
type: money
scope: person-month
program: CCCAP
meaning: "The person's recurring receipts of the month that CCCAP's counting table counts (cccap_receipt_treatment_table), at the amount received in the month: the unearned income received in the prior thirty days (8 CCR 1403-1 3.111.H.4, H.5.b), Social Security included (I.25) less the part set aside under a plan for self-support (J.13)."
precision: "A receipt is recurring when it is not paid once; it is received in the month when it states the month, or states none (it recurs in every month). The month's receipts stand for the prior thirty days, as the volume reads a case that states calendar-month receipts (OQ-680). A Colorado Works diversion is counted here and taken out again by cccap_excluded_unearned_receipts when it is cash assistance (3.103.S, J.26). An irregular receipt is counted here and taken out by cccap_excluded_irregular_income when J.28's quarterly limit is not reached. The set-aside part is no more than the receipt it is part of. Replaces unearned_income_prior_thirty_days (CO-3913, with the thirty-day figure unearned_income_received_prior_thirty_days, CO-3911, which the receipts do not restate) and the month's social_security_income for CCCAP. Coverage pass 4 C4-2: a recurring receipt stated with its date is read when its date is in the cccap_prior_income_period_days (CO-5151) days before cccap_application_or_redetermination_date (CO-5150), as a dated pay is (cccap_person_earned_income, CO-3915), not by its month: H.5.b counts \"Unearned income received during the prior thirty (30) day period\" (S2704; OQ-680), so a receipt first paid after the date is not counted and one paid in the thirty days but the month before is. A receipt stated without a date (a stream, or a month) stands for the thirty days as before. Coverage pass 5, C5-1 (docs/reviews/coverage5-care-energy.md): a record stated with neither a month nor a date (a stream) is the pay or payment of the days its source ran (docs/conventions.md, \"A record's time\"; job_start_date and job_end_date for pay, start_date and end_date for a receipt). It stands for the thirty days only when its source ran through all of them (none of its dates after their first day or before their last); it is not read when its source ended before their first day or began on or after cccap_application_or_redetermination_date; and a source that began or ended inside the thirty days is placed by its dated records, so a stream without them cannot determine and the record's date is named as missing (8 CCR 1403-1 3.111.H.4, H.5.a.1, H.5.b, S2704, S891: the income \"received during the prior thirty (30) day period\"; OQ-680 (2)). A record stated with its month or its date is placed as before. Coverage pass 5 (docs/reviews/coverage5-care-energy.md; docs/reviews/field-sweep-care-energy.md): C5-2, a payment from a pension, an annuity or a retirement account is counted less the amount deducted for penalties for an early payout, the record's early_withdrawal_penalty (receipts, CO-5000), whatever its kind (pension or savings_account_distribution) and whether recurring or paid once (8 CCR 1403-1 3.111.I.8, S3256: \"minus the amount deducted for penalties, if early payouts are received from these accounts\"); it replaces retirement_early_withdrawal_penalty (CO-4459), a person-month figure that could not say which payment it belonged to and was taken only from recurring pension receipts. X5-1, income from property the person owns jointly with others (a record stating ownership_share and property_income) is counted at the larger of the owner's share of the property's income and the amount received (H.4.e, S2704: \"as a percentage at least equal to the percentage of ownership or, if receiving more than percentage of ownership, the actual amount received\"; OQ-1316). Field sweep: insurance or injury proceeds paid as a recurring receipt are counted less the part spent or to be spent on the costs they cover (spent_on_covered_costs; I.21-22, S3256), as a one-time payment already was. None below zero. cccap_excluded_irregular_income (CO-4076) and cccap_irregular_receipts (CO-5723) read the same value. C5-3: AmeriCorps income is earned (I.32) and is read by cccap_person_earned_income (CO-3915), not here. Coverage pass 6 for CCCAP, R6-2 (docs/reviews/coverage6-care-energy.md): the share test of 3.111.H.4.e is applied once per property in the household: a record of jointly owned property whose co-owner is another member of the household (the receipt's co_owner, in cccap_household_members, CO-982) counts what the person received, since what the property paid the co-owner is counted on the co-owner's own list and the household's income from the property is what its members received; the share is the floor only against owners outside the household (OQ-1316). Before, each co-owner took the larger of the share and the amount on the own list, so a co-owner who received nothing still added a share the other had received."
derived: ["sum_receipts", "receipts", ["all", ["in", ["lookup", "cccap_receipt_treatment_table", ["receipt", "kind"]], ["counted", "counted_no_rule_excludes", "counted_less_pass_set_aside", "counted_child_support", "counted_unless_cash_assistance"]], ["not", ["=", ["receipt", "frequency"], "once"]], ["case", [["not", ["unknown", ["receipt", "month"]]], ["case", [["unknown", ["receipt", "date"]], ["received_in", ["month"]]], ["else", ["all", [">=", ["receipt", "date"], ["days_after", ["-", 0, "cccap_prior_income_period_days"], "cccap_application_or_redetermination_date"]], ["<", ["receipt", "date"], "cccap_application_or_redetermination_date"]]]]], [["any", ["all", ["not", ["unknown", ["receipt", "end_date"]]], ["<", ["receipt", "end_date"], ["days_after", ["-", 0, "cccap_prior_income_period_days"], "cccap_application_or_redetermination_date"]]], ["all", ["not", ["unknown", ["receipt", "start_date"]]], [">=", ["receipt", "start_date"], "cccap_application_or_redetermination_date"]]], false], [["all", ["any", ["unknown", ["receipt", "start_date"]], ["<=", ["receipt", "start_date"], ["days_after", ["-", 0, "cccap_prior_income_period_days"], "cccap_application_or_redetermination_date"]]], ["any", ["unknown", ["receipt", "end_date"]], [">=", ["receipt", "end_date"], ["days_after", -1, "cccap_application_or_redetermination_date"]]]], ["case", [["unknown", ["receipt", "date"]], ["received_in", ["month"]]], ["else", ["all", [">=", ["receipt", "date"], ["days_after", ["-", 0, "cccap_prior_income_period_days"], "cccap_application_or_redetermination_date"]], ["<", ["receipt", "date"], "cccap_application_or_redetermination_date"]]]]], ["else", ["all", [">=", ["receipt", "date"], ["days_after", ["-", 0, "cccap_prior_income_period_days"], "cccap_application_or_redetermination_date"]], ["<", ["receipt", "date"], "cccap_application_or_redetermination_date"]]]]], ["case", [["=", ["lookup", "cccap_receipt_treatment_table", ["receipt", "kind"]], "counted_less_pass_set_aside"], ["-", ["receipt", "amount"], ["min", ["receipt", "pass_set_aside"], ["receipt", "amount"]]]], ["else", ["max", 0, ["-", ["case", [["unknown", ["receipt", "ownership_share"]], ["receipt", "amount"]], [["all", ["not", ["unknown", ["receipt", "co_owner"]]], ["in_group", ["receipt", "co_owner"], ["of", ["owner"], "cccap_household_members"]]], ["receipt", "amount"]], ["else", ["max", ["receipt", "amount"], ["*", ["receipt", "ownership_share"], ["receipt", "property_income"]]]]], ["+", ["receipt", "spent_on_covered_costs"], ["receipt", "early_withdrawal_penalty"]]]]]]]
sources: [S891, S2704, S1623, S4020, S3257, S3256]
implemented: engine
tags: [income]
open: [OQ-680, OQ-713, OQ-1316, OQ-1318, OQ-1321]
rationale: "Receipt records, migration phase 2: CCCAP's recurring unearned income, read from the receipts through its counting table."
tests:
  - {id: CO-5721-T1, month: "2026-11", as_of: "2026-11-15", given: {receipts: [{kind: pension, amount: 610}, {kind: child_support, amount: 300}, {kind: ssi, amount: 900}, {kind: foster_care_payment, amount: 1500}]}, title: "A pension and child support counted (I.8, I.29); SSI (J.2) and a foster care payment (J.10) excluded", expect: 910}
  - {id: CO-5721-T2, month: "2026-11", as_of: "2026-11-15", given: {receipts: [{kind: social_security, amount: 900, pass_set_aside: 200}, {kind: colorado_works_cash, amount: 488}]}, title: "Social Security less the part set aside under a PASS (I.25, J.13); Colorado Works cash excluded (J.26)", expect: 700}
  - {id: CO-5721-T3, month: "2026-11", as_of: "2026-11-15", given: {receipts: [{kind: pension, amount: 610, month: "2026-10"}, {kind: other_nontaxable, amount: 2000, frequency: once, month: "2026-11"}]}, title: "October's pension is not November's; a one-time receipt is not recurring (cccap_one_time_receipts_averaged reads it)", expect: 0}
  - {id: CO-5721-T4, month: "2026-11", as_of: "2026-11-15", given: {receipts: [{kind: in_home_care_allowance, amount: 400}, {kind: home_care_allowance, amount: 400}]}, title: "Another program's home care allowance counted because no rule excludes it; the Adult Financial Home Care Allowance excluded (J.24)", expect: 400}
  - {id: CO-5721-T5, month: "2026-11", as_of: "2026-11-15", given: {receipts: []}, title: "No receipts: none", expect: 0}
  - {id: CO-5721-T6, month: "2026-11", as_of: "2026-11-15", given: {}, title: "Receipts not stated: cannot determine", expect: unknown}
  # Coverage pass 4 C4-2 (household CU1, stored as CO-717): application November 15, 2026; the thirty days are October 16 to November 14 (H.5.b:
  # "Unearned income received during the prior thirty (30) day period"; OQ-680). Unemployment of $300 dated November 20 and 27, after the date: $0.
  # (Before the fix: the November receipts, $600.)
  - {id: CO-5721-T7, title: "Unemployment first paid after the application date: not in the thirty days", month: "2026-11", as_of: "2026-11-15", given: {cccap_application_or_redetermination_date: "2026-11-15", receipts: [{kind: unemployment_compensation, amount: 300, frequency: weekly, date: "2026-11-20"}, {kind: unemployment_compensation, amount: 300, frequency: weekly, date: "2026-11-27"}]}, expect: 0}
  # Household CU2 (CO-718): unemployment of $300 dated October 23 and 30, then ended: both in the thirty days, $600. (Before the fix: no November
  # receipt, $0.)
  - {id: CO-5721-T8, title: "Unemployment paid in the thirty days, in the month before: $600", month: "2026-11", as_of: "2026-11-15", given: {cccap_application_or_redetermination_date: "2026-11-15", receipts: [{kind: unemployment_compensation, amount: 300, frequency: weekly, date: "2026-10-23"}, {kind: unemployment_compensation, amount: 300, frequency: weekly, date: "2026-10-30"}]}, expect: 600}
  # Coverage pass 5 (docs/reviews/coverage5-care-energy.md), C5-1: application 2026-11-15, so the thirty days run 2026-10-16 to 2026-11-14 (H.4-5, OQ-680).
  - {"id": "CO-5721-T9", "title": "C5-1 (review household CJ2): an unemployment stream of $1,500 whose end_date is 2026-09-30: nothing received in the thirty days, 0 (was 1,500)", "month": "2026-11", "as_of": "2026-11-15", "given": {"cccap_application_or_redetermination_date": "2026-11-15", "receipts": [{"kind": "unemployment_compensation", "amount": 1500, "end_date": "2026-09-30"}]}, "expect": 0}
  - {"id": "CO-5721-T10", "title": "C5-2: a recurring pension of $2,000 with $200 deducted as an early-payout penalty (I.8): 2,000 - 200 = 1,800", "month": "2026-11", "as_of": "2026-11-15", "given": {"receipts": [{"kind": "pension", "amount": 2000, "early_withdrawal_penalty": 200}]}, "expect": 1800}
  - {"id": "CO-5721-T11", "title": "C5-2 (review household CP2): early IRA withdrawals of $500 a month, $50 penalty each (I.8.c): 500 - 50 = 450 (was 500)", "month": "2026-11", "as_of": "2026-11-15", "given": {"receipts": [{"kind": "savings_account_distribution", "amount": 500, "early_withdrawal_penalty": 50}]}, "expect": 450}
