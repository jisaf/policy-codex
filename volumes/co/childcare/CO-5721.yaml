  - {"id": "CO-5721-T13", "title": "C5-1: a stream whose first payment came on 2026-10-16, the first of the thirty days, and continues: 1,500", "month": "2026-11", "as_of": "2026-11-15", "given": {"cccap_application_or_redetermination_date": "2026-11-15", "receipts": [{"kind": "unemployment_compensation", "amount": 1500, "start_date": "2026-10-16"}]}, "expect": 1500}
  - {"id": "CO-5721-T14", "title": "X5-1: half of a rental house whose $2,000 rent the co-owner keeps: the larger of 0.5 x 2,000 = 1,000 and the $0 received, 1,000 (H.4.e)", "month": "2026-11", "as_of": "2026-11-15", "given": {"receipts": [{"kind": "rental_income", "amount": 0, "ownership_share": 0.5, "property_income": 2000}]}, "expect": 1000}
