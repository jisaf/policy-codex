  - {id: CO-5721-T21, title: "Coverage pass 6 R6-2: the co-owner is a person of the case outside this person's CCCAP household: the share is the floor, the larger of 0.5 x 600 = 300 and the $0 received, 300", month: "2026-11", as_of: "2026-11-15", given: {cccap_household_members: [p1], receipts: [{kind: rental_income, amount: 0, ownership_share: 0.5, property_income: 600, co_owner: p2}]}, expect: 300}
