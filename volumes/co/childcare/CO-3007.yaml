id: CO-3007
name: "CCCAP: monthly 100% federal poverty guideline for the household"
identifier: cccap_poverty_guideline_monthly
kind: derived
type: money
scope: person
program: CCCAP
meaning: "The monthly 100% federal poverty guideline for the size of this person's CCCAP household (cccap_household_size, CO-983), the base of the entry income limit (3.111.H.1.a) and of the parent fee formula (3.124.P-Q): the annual HHS guideline in force on the most recent October 1 on or before the determination date (cccap_poverty_guideline_start_month, CO-3006), for the household's size up to the table's last row (eight persons), divided by twelve and rounded to the cent, plus, for each member beyond that row, the HHS step for each additional person divided by twelve and rounded to the cent, as 8 CCR 1403-1 3.111.H.2-3 state the figures in their table (sizes 1 to 8 and an 'Each Additional person' amount)."
precision: "Read from federal_poverty_guideline_annual_table and its each-additional step (CO-181, CO-182) as of that October 1 (P25), so a correction to the HHS figures is made once. For sizes 1 to 8 the result equals the rule's table to the cent (2026: size 2, 21,640 / 12 = 1,803.33; size 3, 2,276.67). Above 8 it adds the rule's own rounded per-member step (473.33 for October 2026) to the rounded 8-person figure, as the table does (a household of 9: 4,643.33 + 473.33 = 5,116.66), rather than rounding the whole once (5,116.67); OQ-580, resolved from the table's 'Each Additional person' row (S780, S781). The count beyond the last row is the difference between the extended and the plain lookup divided by the step, so the item does not restate the last row. A determination before January 2025 (whose October 1 guideline, 2024, the federal table does not hold) is unknown."
derived: ["+", ["/", [round, ["/", ["*", [lookup_extended, [as_of, federal_poverty_guideline_annual_table, [first_day, [latest_month_of_year, cccap_poverty_guideline_start_month, [det_month]]]], cccap_household_size], 100], 12]], 100], ["*", ["/", ["-", [lookup_extended, [as_of, federal_poverty_guideline_annual_table, [first_day, [latest_month_of_year, cccap_poverty_guideline_start_month, [det_month]]]], cccap_household_size, [as_of, federal_poverty_guideline_annual_each_additional, [first_day, [latest_month_of_year, cccap_poverty_guideline_start_month, [det_month]]]]], [lookup_extended, [as_of, federal_poverty_guideline_annual_table, [first_day, [latest_month_of_year, cccap_poverty_guideline_start_month, [det_month]]]], cccap_household_size]], [as_of, federal_poverty_guideline_annual_each_additional, [first_day, [latest_month_of_year, cccap_poverty_guideline_start_month, [det_month]]]]], ["/", [round, ["/", ["*", [as_of, federal_poverty_guideline_annual_each_additional, [first_day, [latest_month_of_year, cccap_poverty_guideline_start_month, [det_month]]]], 100], 12]], 100]]]
sources: [S780, S781, S55, S1710]
implemented: engine
tags: [income, household]
rationale: "Hard-coded numbers audit D-1 and S-1: cccap_poverty_guideline_monthly_table and _each_additional (CO-323, CO-324) restated the HHS guideline divided by twelve, and cccap_income_within_entry_limit (CO-986) and cccap_parent_fee_formula_amount (CO-1289, eight times) repeated the household-size lookup with a literal last row. One derived figure reads the federal table; CO-323 and CO-324 are retired."
tests:
  - {id: CO-3007-T1, title: "October 2026: the 2026 guideline, 21,640 / 12", as_of: "2026-10-01", given: {cccap_household_size: 2}, expect: 1803.33}
  - {id: CO-3007-T2, title: "September 2026: the 2025 guideline, 26,650 / 12 = 2,220.833 to the cent", as_of: "2026-09-30", given: {cccap_household_size: 3}, expect: 2220.83}
  - {id: CO-3007-T3, title: "January 2027 keeps the guideline adopted October 1, 2026", as_of: "2027-01-15", given: {cccap_household_size: 1}, expect: 1330}
  - {id: CO-3007-T4, title: "Size 10: 55,720 / 12 = 4,643.33, plus 2 x (5,680 / 12 = 473.33) = 5,589.99, as the rule's table adds its rounded step (OQ-580)", as_of: "2026-10-01", given: {cccap_household_size: 10}, expect: 5589.99}
  - {id: CO-3007-T6, title: "Size 9: 4,643.33 + 473.33 = 5,116.66 (OQ-580)", as_of: "2026-10-01", given: {cccap_household_size: 9}, expect: 5116.66}
  - {id: CO-3007-T7, title: "Size 8, the table's last row: 55,720 / 12 = 4,643.33", as_of: "2026-10-01", given: {cccap_household_size: 8}, expect: 4643.33}
  - {id: CO-3007-T5, title: "Before the federal table's first version (2024 since coverage pass 6, C6-09): unknown", as_of: "2023-11-01", given: {cccap_household_size: 2}, expect: unknown}
