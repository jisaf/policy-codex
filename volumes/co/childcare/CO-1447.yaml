id: CO-1447
name: "CCCAP: person's required verification count"
identifier: cccap_person_required_verification_count
kind: derived
type: whole number
scope: person-month
program: CCCAP
meaning: The number of CCCAP verification elements required for this person (residency, eligible activity, a child's citizenship, age and identity when inconsistent, earned income, unearned income, child support paid, hours worked, a child's additional care needs); and a child's immunization record when the child is not school-aged and in care outside the home from an unrelated exempt provider (3.111.F.2), the activity schedule when non-traditional hours are requested or the caretaker is self-employed (C.2.e, G.2), an unrelated caretaker's verification (D.5) and a custody or parenting schedule that applies (C.2.h).
derived: ["+", [case, [cccap_requires_verification_of_residency, 1], [else, 0]], [case, [cccap_requires_verification_of_eligible_activity, 1], [else, 0]], [case, [cccap_requires_verification_of_citizenship, 1], [else, 0]], [case, [cccap_requires_verification_of_age, 1], [else, 0]], [case, [cccap_requires_verification_of_identity, 1], [else, 0]], [case, [cccap_requires_verification_of_earned_income, 1], [else, 0]], [case, [has_unearned_income, 1], [else, 0]], [case, [cccap_requires_verification_of_child_support_paid, 1], [else, 0]], [case, [cccap_requires_verification_of_work_hours, 1], [else, 0]], [case, [cccap_requires_verification_of_additional_care_needs, 1], [else, 0]], [case, [[all, cccap_is_eligible_child, [otherwise, cccap_care_is_from_unrelated_exempt_provider_outside_home, false], [not, is_school_aged]], 1], [else, 0]], [case, [[any, [otherwise, cccap_non_traditional_hours_are_requested, false], [all, [any, cccap_is_adult_caretaker, cccap_is_teen_parent], [">", self_employment_gross_receipts, 0]]], 1], [else, 0]], [case, [[otherwise, cccap_unrelated_caretaker_verification_is_outstanding, false], 1], [else, 0]], [case, [[otherwise, cccap_custody_schedule_is_outstanding, false], 1], [else, 0]]]
sources: [S890, S891, S1081, S1082, S1637]
implemented: engine
tags: [verification]
rationale: "cccap_verification_status needs to know whether the household has any verification requirement. Case worker review S11: the authoring note \"phase-10 sweep (OQ-378)\" moved out of the meaning, which states only what the fact is."
tests:
  - {id: CO-1447-T1, month: "2026-10", as_of: "2026-10-01", given: {cccap_is_teen_parent: false, cccap_is_adult_caretaker: false, cccap_is_eligible_child: false, cccap_requires_verification_of_residency: true, cccap_requires_verification_of_eligible_activity: false, cccap_requires_verification_of_citizenship: false, cccap_requires_verification_of_age: false, cccap_requires_verification_of_identity: false, cccap_requires_verification_of_earned_income: false, has_unearned_income: true, cccap_requires_verification_of_child_support_paid: false, cccap_requires_verification_of_work_hours: false, cccap_requires_verification_of_additional_care_needs: false}, expect: 2}
  - {id: CO-1447-T2, month: "2026-10", as_of: "2026-10-01", given: {cccap_is_teen_parent: false, cccap_is_adult_caretaker: false, cccap_is_eligible_child: false, cccap_requires_verification_of_residency: false, cccap_requires_verification_of_eligible_activity: false, cccap_requires_verification_of_citizenship: false, cccap_requires_verification_of_age: false, cccap_requires_verification_of_identity: false, cccap_requires_verification_of_earned_income: false, has_unearned_income: false, cccap_requires_verification_of_child_support_paid: false, cccap_requires_verification_of_work_hours: false, cccap_requires_verification_of_additional_care_needs: false}, expect: 0}
