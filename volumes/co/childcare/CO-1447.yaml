id: CO-1447
name: "CCCAP: person's required verification count"
identifier: cccap_person_required_verification_count
kind: derived
type: whole number
scope: person-month
program: CCCAP
meaning: The number of CCCAP verification elements required for this person (residency, eligible activity, a child's citizenship, age and identity when inconsistent, earned income, unearned income, child support paid, hours worked, a child's additional care needs).
derived: ["+", [case, [cccap_requires_verification_of_residency, 1], [else, 0]], [case, [cccap_requires_verification_of_eligible_activity, 1], [else, 0]], [case, [cccap_requires_verification_of_citizenship, 1], [else, 0]], [case, [cccap_requires_verification_of_age, 1], [else, 0]], [case, [cccap_requires_verification_of_identity, 1], [else, 0]], [case, [cccap_requires_verification_of_earned_income, 1], [else, 0]], [case, [has_unearned_income, 1], [else, 0]], [case, [cccap_requires_verification_of_child_support_paid, 1], [else, 0]], [case, [cccap_requires_verification_of_work_hours, 1], [else, 0]], [case, [cccap_requires_verification_of_additional_care_needs, 1], [else, 0]]]
sources: [S890, S891, S1081, S1082]
implemented: engine
tags: [verification]
rationale: cccap_verification_status needs to know whether the household has any verification requirement.
tests:
  - {id: CO-1447-T1, month: "2026-10", as_of: "2026-10-01", given: {cccap_requires_verification_of_residency: true, cccap_requires_verification_of_eligible_activity: false, cccap_requires_verification_of_citizenship: false, cccap_requires_verification_of_age: false, cccap_requires_verification_of_identity: false, cccap_requires_verification_of_earned_income: false, has_unearned_income: true, cccap_requires_verification_of_child_support_paid: false, cccap_requires_verification_of_work_hours: false, cccap_requires_verification_of_additional_care_needs: false}, expect: 2}
  - {id: CO-1447-T2, month: "2026-10", as_of: "2026-10-01", given: {cccap_requires_verification_of_residency: false, cccap_requires_verification_of_eligible_activity: false, cccap_requires_verification_of_citizenship: false, cccap_requires_verification_of_age: false, cccap_requires_verification_of_identity: false, cccap_requires_verification_of_earned_income: false, has_unearned_income: false, cccap_requires_verification_of_child_support_paid: false, cccap_requires_verification_of_work_hours: false, cccap_requires_verification_of_additional_care_needs: false}, expect: 0}
