id: CO-1451
name: "CCCAP: verification status"
identifier: cccap_verification_status
kind: derived
type: one of
options: [not_applicable, not_required, complete, pending, deduction_disallowed, past_due, case_closed]
scope: person-month
program: CCCAP
role: outcome
meaning: "Where this person's CCCAP household stands on verification: not applicable (no eligible child in the household); none required; complete; pending within the noticing period; past it with only child support paid unverified (the deduction is not allowed); or past due with an eligibility element unverified: the application is denied, or at a redetermination the case is closed (3.111.H.5.e.2)."
precision: Assets are self-declared (3.111.H.5.c, S891) and need no verification.
derived: [case, [[not, cccap_verification_is_applicable], not_applicable], [["=", [sum, cccap_household_members, [of, [P], cccap_person_required_verification_count]], 0], not_required], [[all, ["=", cccap_pending_verification_count, 0], ["=", cccap_pending_deduction_verification_count, 0]], complete], [["<=", [det_date], cccap_verification_due_date], pending], [["=", cccap_pending_verification_count, 0], deduction_disallowed], [["=", cccap_determination_type, redetermination], case_closed], [else, past_due]]
sources: [S891, S892, S1631]
implemented: engine
tags: [verification]
rationale: "No existing item reported a CCCAP household's verification standing. Fix round: not_applicable on categorical reach (review C-4) and the child support deduction apart from eligibility (C-12). Dual-entry audit 3.22: a redetermination is read from cccap_determination_type (CO-3307), not from a redetermination date being stated."
tests:
  - {id: CO-1451-T1, month: "2026-10", as_of: "2026-10-01", given: {cccap_household_members: [p1], cccap_is_eligible_child: false}, expect: not_applicable}
  - {id: CO-1451-T2, month: "2026-10", as_of: "2026-10-01", given: {cccap_household_members: [p1], cccap_is_eligible_child: true, cccap_person_required_verification_count: 0}, expect: not_required}
  - {id: CO-1451-T3, month: "2026-10", as_of: "2026-10-01", given: {cccap_household_members: [p1], cccap_is_eligible_child: true, cccap_person_required_verification_count: 2, cccap_pending_verification_count: 0, cccap_pending_deduction_verification_count: 0}, expect: complete}
  - {id: CO-1451-T4, month: "2026-10", as_of: "2026-10-01", given: {determination_date: "2026-10-10", cccap_household_members: [p1], cccap_is_eligible_child: true, cccap_person_required_verification_count: 2, cccap_pending_verification_count: 1, cccap_pending_deduction_verification_count: 0, cccap_verification_due_date: "2026-10-16"}, expect: pending}
  - {id: CO-1451-T5, month: "2026-10", as_of: "2026-10-01", given: {determination_date: "2026-10-20", cccap_household_members: [p1], cccap_is_eligible_child: true, cccap_person_required_verification_count: 2, cccap_pending_verification_count: 0, cccap_pending_deduction_verification_count: 1, cccap_verification_due_date: "2026-10-16"}, expect: deduction_disallowed}
  - {id: CO-1451-T6, month: "2026-10", as_of: "2026-10-01", given: {determination_date: "2026-10-20", cccap_household_members: [p1], cccap_is_eligible_child: true, cccap_person_required_verification_count: 2, cccap_pending_verification_count: 1, cccap_pending_deduction_verification_count: 1, cccap_verification_due_date: "2026-10-16", cccap_determination_type: application}, expect: past_due}
  # Phase-10 sweep (OQ-373): at a redetermination unreturned verification closes the case (3.111.H.5.e.2).
  - {id: CO-1451-T7, month: "2026-10", as_of: "2026-10-01", given: {determination_date: "2026-10-20", cccap_household_members: [p1], cccap_is_eligible_child: true, cccap_person_required_verification_count: 2, cccap_pending_verification_count: 1, cccap_pending_deduction_verification_count: 1, cccap_verification_due_date: "2026-10-16", cccap_determination_type: redetermination}, expect: case_closed}
