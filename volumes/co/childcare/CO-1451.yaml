id: CO-1451
name: "CCCAP: verification status"
identifier: cccap_verification_status
kind: derived
type: one of
options: [not_required, complete, pending, past_due]
scope: person-month
program: CCCAP
role: outcome
meaning: "Where this person's CCCAP household stands on verification: none required, complete, pending within the noticing period, or past due (the application is denied)."
precision: Assets are self-declared (3.111.H.5.c, S891) and need no verification.
derived: [case, [["=", [sum, cccap_household_members, [of, [P], cccap_person_required_verification_count]], 0], not_required], [["=", cccap_pending_verification_count, 0], complete], [["<=", [det_date], cccap_verification_due_date], pending], [else, past_due]]
sources: [S891]
implemented: engine
tags: [verification]
rationale: No existing item reports CCCAP verification standing.
tests:
  - {id: CO-1451-T1, month: "2026-10", as_of: "2026-10-01", given: {cccap_household_members: [p1], cccap_person_required_verification_count: 0}, expect: not_required}
  - {id: CO-1451-T2, month: "2026-10", as_of: "2026-10-01", given: {cccap_household_members: [p1], cccap_person_required_verification_count: 2, cccap_pending_verification_count: 0}, expect: complete}
  - {id: CO-1451-T3, month: "2026-10", as_of: "2026-10-01", given: {determination_date: "2026-10-10", cccap_household_members: [p1], cccap_person_required_verification_count: 2, cccap_pending_verification_count: 1, cccap_verification_due_date: "2026-10-16"}, expect: pending}
  - {id: CO-1451-T4, month: "2026-10", as_of: "2026-10-01", given: {determination_date: "2026-10-20", cccap_household_members: [p1], cccap_person_required_verification_count: 2, cccap_pending_verification_count: 1, cccap_verification_due_date: "2026-10-16"}, expect: past_due}
