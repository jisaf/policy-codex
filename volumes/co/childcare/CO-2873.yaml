id: CO-2873
name: cccap has countable unearned income
identifier: cccap_has_countable_unearned_income
kind: derived
type: yes/no
scope: person-month
program: CCCAP
meaning: "Whether the person has unearned income in the month that CCCAP counts and so must verify: the person's countable unearned income (cccap_person_unearned_income, CO-3916: the recurring unearned income of the prior thirty days, the month's Social Security, and a twelfth of a lump sum or prize, less what 8 CCR 1403-1 3.111.J excludes) is more than zero; for a protective services household, only a placed child's, less child support (3.119.A); and none for a Colorado Works Child Care household, which counts only earned income (3.116.C)."
precision: "Second-pass review N-6 and P2 (verification triggers): the item summed the calendar month's unearned income facts, so it asked for verification of income CCCAP does not count (a Colorado Works household's, a protective services caretaker's, or what J excludes) and missed what it does (prizes, lump sums, a receipt stated only for the thirty days). A child counted in a protective services household is an eligible child (the reading of cccap_protective_services_income, CO-994). The routes are read from the case's referrals - a Colorado Works Child Care referral for a household member (is_referred_for_colorado_works_child_care, CO-896; 3.116.C: \"Upon receipt of a referral\") and the protective services referral (is_protective_services_child_care_case, CO-873), each read as false when not stated - not from cccap_eligibility_status, so that verification does not wait on the eligibility determination. Coverage round F-14: none for a Child Welfare Child Care household (cccap_is_child_welfare_child_care_household, CO-2576, read as false when not stated), whose eligibility the Child Welfare division determines with no CCCAP income test (3.120.D, S2709; 12 CCR 2509-4 7.302, S3259). Receipt records, migration phase 2 (2026-11-23): a placed child's child support is cccap_counted_child_support (CO-5725, from the receipts), not child_support_received with its 0 when not stated."
derived: [all, [not, [exists, cccap_household_members, [otherwise, [of, [P], is_referred_for_colorado_works_child_care], false]]], [not, [otherwise, cccap_is_child_welfare_child_care_household, false]], [case, [[otherwise, is_protective_services_child_care_case, false], [all, cccap_is_eligible_child, [">", ["-", cccap_person_unearned_income, cccap_counted_child_support], 0]]], [else, [">", cccap_person_unearned_income, 0]]]]
sources: [S891, S898, S2707, S2852, S2709, S3259]
implemented: engine
tags: [income, verification]
rationale: "Same-word audit SW-27: the shared has_unearned_income (CO-1357, retired) summed every unearned source, each program's own grant included, and five programs read it as the unearned income they count, so a CCCAP household whose only unearned income is its Colorado Works grant had an element to verify. Each program reads its own sources."
nearest: [CO-2870, CO-2871, CO-2872, CO-2874]
tests:
