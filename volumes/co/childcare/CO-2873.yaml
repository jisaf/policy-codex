  - {id: CO-2873-T2, month: "2026-11", as_of: "2026-11-01", given: {cccap_household_members: [p1], is_referred_for_colorado_works_child_care: false, is_protective_services_child_care_case: false, cccap_person_unearned_income: 300}, title: "Child support received", expect: true}
  - {id: CO-2873-T3, month: "2026-11", as_of: "2026-11-01", given: {cccap_household_members: [p1], is_referred_for_colorado_works_child_care: true, cccap_person_unearned_income: 300}, title: "Second-pass N-6: a Colorado Works Child Care household's child support is not counted, so not asked for (3.116.C)", expect: false}
  - {id: CO-2873-T4, month: "2026-11", as_of: "2026-11-01", given: {cccap_household_members: [p1], is_referred_for_colorado_works_child_care: false, is_protective_services_child_care_case: true, cccap_is_eligible_child: false, cccap_person_unearned_income: 900}, title: "Second-pass N-6: a protective services caretaker's pension is not counted (3.119.A)", expect: false}
  - {id: CO-2873-T5, month: "2026-11", as_of: "2026-11-01", given: {cccap_household_members: [p1], is_referred_for_colorado_works_child_care: false, is_protective_services_child_care_case: true, cccap_is_eligible_child: true, cccap_person_unearned_income: 800, cccap_counted_child_support: 500}, title: "Second-pass N-6: a placed child's Social Security is counted, her child support is not (3.119.A)", expect: true}
  - {id: CO-2873-T6, month: "2026-11", as_of: "2026-11-01", given: {cccap_household_members: [p1], is_referred_for_colorado_works_child_care: false, is_protective_services_child_care_case: false, receipts: [{kind: gambling_winnings, amount: 2400, frequency: once, month: "2026-11"}]}, title: "Second-pass P2: a $2,400 lottery prize in the month counts as $200 (3.111.I.20) and is asked for", expect: true}
  - {id: CO-2873-T7, month: "2026-11", as_of: "2026-11-01", given: {cccap_household_members: [p1], is_referred_for_colorado_works_child_care: false, is_protective_services_child_care_case: false, cccap_is_child_welfare_child_care_household: true, cccap_person_unearned_income: 800}, title: "F-14: a Child Welfare Child Care caretaker's Social Security is not asked for (3.120.D)", expect: false}
