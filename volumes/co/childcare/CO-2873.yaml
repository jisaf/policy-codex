id: CO-2873
name: cccap has countable unearned income
identifier: cccap_has_countable_unearned_income
kind: derived
type: yes/no
scope: person-month
program: CCCAP
meaning: "Whether the person has unearned income in the month that CCCAP counts and so must verify: the person's countable unearned income (cccap_person_unearned_income, CO-3916: the recurring unearned income of the prior thirty days, the month's Social Security, and a twelfth of a lump sum or prize, less what 8 CCR 1403-1 3.111.J excludes) is more than zero; for a protective services household, only a placed child's, less child support (3.119.A); and none for a Colorado Works Child Care household, which counts only earned income (3.116.C)."
precision: "Second-pass review N-6 and P2 (verification triggers): the item summed the calendar month's unearned income facts, so it asked for verification of income CCCAP does not count (a Colorado Works household's, a protective services caretaker's, or what J excludes) and missed what it does (prizes, lump sums, a receipt stated only for the thirty days). A child counted in a protective services household is an eligible child (the reading of cccap_protective_services_income, CO-994). The routes are read from the case's referrals - a Colorado Works Child Care referral for a household member (is_referred_for_colorado_works_child_care, CO-896; 3.116.C: \"Upon receipt of a referral\") and the protective services referral (is_protective_services_child_care_case, CO-873), each read as false when not stated - not from cccap_eligibility_status, so that verification does not wait on the eligibility determination. Coverage round F-14: none for a Child Welfare Child Care household (cccap_is_child_welfare_child_care_household, CO-2576, read as false when not stated), whose eligibility the Child Welfare division determines with no CCCAP income test (3.120.D, S2709; 12 CCR 2509-4 7.302, S3259). Receipt records, migration phase 2 (2026-11-23): a placed child's child support is cccap_counted_child_support (CO-5725, from the receipts), not child_support_received with its 0 when not stated. Coverage pass 5, X5-3 (docs/reviews/coverage5-care-energy.md; OQ-134): a Colorado Works Child Care household is read as the eligibility reader reads it, cccap_colorado_works_child_care_eligible (CO-988), which reads the county Colorado Works worker's referral (is_referred_for_colorado_works_child_care, CO-896) with no default, for a caretaker who receives Colorado Works and is work-eligible or a diversion household (8 CCR 1403-1 3.116.A, H; 3.116.C-F, S3637: the county Colorado Works program verifies county residency and the children's citizenship, age and identity, and reports the earned income). Before, these readers read the referral of any member as not referred when not stated, so an unstated referral asked a Colorado Works Child Care household for the verifications Colorado Works supplies."
derived: ["all", ["not", "cccap_colorado_works_child_care_eligible"], ["not", ["otherwise", "cccap_is_child_welfare_child_care_household", false]], ["case", [["otherwise", "is_protective_services_child_care_case", false], ["all", "cccap_is_eligible_child", [">", ["-", "cccap_person_unearned_income", "cccap_counted_child_support"], 0]]], ["else", [">", "cccap_person_unearned_income", 0]]]]
sources: [S891, S898, S2707, S2852, S2709, S3259, S3637]
open: [OQ-134]
implemented: engine
tags: [income, verification]
rationale: "Same-word audit SW-27: the shared has_unearned_income (CO-1357, retired) summed every unearned source, each program's own grant included, and five programs read it as the unearned income they count, so a CCCAP household whose only unearned income is its Colorado Works grant had an element to verify. Each program reads its own sources."
nearest: [CO-2870, CO-2871, CO-2872, CO-2874]
tests:
  # Coverage pass 5, X5-3: the tests state the Colorado Works Child Care household (cccap_colorado_works_child_care_eligible, CO-988) in place of a member's referral, which these items no longer read; no expectation changed.
  - {id: CO-2873-T1, month: "2026-11", as_of: "2026-11-01", given: {cccap_household_members: [p1], cccap_colorado_works_child_care_eligible: false, is_protective_services_child_care_case: false, cccap_person_unearned_income: 0}, title: "Only the Colorado Works grant, which CCCAP does not count (3.111.J.26)", expect: false}
  - {id: CO-2873-T2, month: "2026-11", as_of: "2026-11-01", given: {cccap_household_members: [p1], cccap_colorado_works_child_care_eligible: false, is_protective_services_child_care_case: false, cccap_person_unearned_income: 300}, title: "Child support received", expect: true}
  - {id: CO-2873-T3, month: "2026-11", as_of: "2026-11-01", given: {cccap_household_members: [p1], cccap_colorado_works_child_care_eligible: true, cccap_person_unearned_income: 300}, title: "Second-pass N-6: a Colorado Works Child Care household's child support is not counted, so not asked for (3.116.C)", expect: false}
  - {id: CO-2873-T4, month: "2026-11", as_of: "2026-11-01", given: {cccap_household_members: [p1], cccap_colorado_works_child_care_eligible: false, is_protective_services_child_care_case: true, cccap_is_eligible_child: false, cccap_person_unearned_income: 900}, title: "Second-pass N-6: a protective services caretaker's pension is not counted (3.119.A)", expect: false}
  - {id: CO-2873-T5, month: "2026-11", as_of: "2026-11-01", given: {cccap_household_members: [p1], cccap_colorado_works_child_care_eligible: false, is_protective_services_child_care_case: true, cccap_is_eligible_child: true, cccap_person_unearned_income: 800, cccap_counted_child_support: 500}, title: "Second-pass N-6: a placed child's Social Security is counted, her child support is not (3.119.A)", expect: true}
  - {id: CO-2873-T6, month: "2026-11", as_of: "2026-11-01", given: {earnings: [], cccap_household_members: [p1], cccap_colorado_works_child_care_eligible: false, is_protective_services_child_care_case: false, receipts: [{kind: gambling_winnings, amount: 2400, frequency: once, month: "2026-11"}]}, title: "Second-pass P2: a $2,400 lottery prize in the month counts as $200 (3.111.I.20) and is asked for", expect: true}
  - {id: CO-2873-T7, month: "2026-11", as_of: "2026-11-01", given: {cccap_household_members: [p1], cccap_colorado_works_child_care_eligible: false, is_protective_services_child_care_case: false, cccap_is_child_welfare_child_care_household: true, cccap_person_unearned_income: 800}, title: "F-14: a Child Welfare Child Care caretaker's Social Security is not asked for (3.120.D)", expect: false}
  - {"id": "CO-2873-T8", "title": "X5-3: CO-2873-T2's household, a Colorado Works Child Care household (cccap_colorado_works_child_care_eligible): Colorado Works supplies it (3.116.C-F), false", "month": "2026-11", "as_of": "2026-11-01", "given": {"cccap_household_members": ["p1"], "cccap_colorado_works_child_care_eligible": true, "is_protective_services_child_care_case": false, "cccap_person_unearned_income": 300}, "expect": false}
