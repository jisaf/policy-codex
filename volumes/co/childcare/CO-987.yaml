id: CO-987
name: "CCCAP: low-income child care eligible"
identifier: cccap_low_income_child_care_eligible
kind: derived
type: yes/no
scope: person-month
program: CCCAP
meaning: "This adult caretaker or teen parent meets the Low-Income Child Care eligibility criteria of 8 CCR 1403-1 3.111 - a verified resident of the county applied to, within the self-declared asset limit, actively in an eligible activity, within the income guidelines (entry or, for a household already receiving assistance, exit), and having physical custody of at least one eligible child in the household."
precision: "Residency reads cccap_meets_county_residency (CO-2107, 3.111.A's county test, OQ-159 resolved); income reads cccap_meets_income_guidelines (CO-2104, 3.111.H.1.a-b, OQ-133 resolved)."
derived: [all, cccap_meets_county_residency, cccap_meets_asset_limit, cccap_household_caretakers_in_eligible_activity, cccap_meets_income_guidelines, [exists, cccap_household_members, [of, [P], cccap_is_eligible_child]]]
sources: [S483, S484, S515, S1408, S1413]
implemented: engine
tags: [household, income]
rationale: "No existing item combines the CCCAP Low-Income Child Care criteria; cccap_eligibility_status (CO-989) reads it - as of this batch, as the item that assembles all of 3.111's criteria into one place, per the review (docs/reviews/cccap-leap-phase-6.md, C-10, should-fix): CO-989 previously re-derived the Low-Income conditions inline rather than reading this item, so it was dead code no outcome consumed. The residency (3.111.A, C-11) and asset (cccap_meets_asset_limit, CO-996, K-3) conjuncts were added per the review's findings, which this item's own prior sources (S484) already cited without ever testing. Residency reads is_colorado_resident (CO-505) directly rather than a new cccap_meets_residency item, since governance's dup.compact check rejects an identical derivation under a new id (see this item's precision)."
