id: CO-987
name: "CCCAP: low-income child care eligible"
identifier: cccap_low_income_child_care_eligible
kind: derived
type: yes/no
scope: person-month
program: CCCAP
meaning: "This person's CCCAP household meets the Low-Income Child Care eligibility criteria of 8 CCR 1403-1 3.111 - every adult caretaker and teen parent a verified resident of the county applied to, and within the self-declared asset limit, the caretakers actively in an eligible activity, within the income guidelines (entry or, for a household already receiving assistance, exit), and having physical custody of at least one eligible child in the household."
precision: "Residency reads cccap_meets_county_residency (CO-2107, 3.111.A's county test, OQ-159 resolved); income reads cccap_meets_income_guidelines (CO-2104, 3.111.H.1.a-b, OQ-133 resolved). Coverage round F-02: residency and the asset declaration are tested on every adult caretaker and teen parent of the household (cccap_household_members, CO-982), not on the person evaluated, so every member gets the same value and a child's own residency and asset facts are not read (3.111.A: \"The adult caretaker(s) and teen parent(s) shall be verified residents\"; H.5.c: \"If assets exceed one million dollars the household is ineligible for CCCAP\"). Coverage pass 2 C2-7: the asset declaration is made \"At application and re-determination\" (3.113.A.1.d, S3532) and assets are not among 3.125.Q's reasons to discontinue care before the redetermination (S3252), so at a change reported during the eligibility period (cccap_determination_type, CO-3307) the declaration is not tested; a transition from Colorado Works still tests it."
derived: [all, [not, [exists, cccap_household_members, [all, [any, [of, [P], cccap_is_adult_caretaker], [of, [P], cccap_is_teen_parent]], [not, [all, [of, [P], cccap_meets_county_residency], [any, ["=", cccap_determination_type, change_during_eligibility_period], [of, [P], cccap_declares_assets_within_limit]]]]]]], cccap_household_caretakers_in_eligible_activity, cccap_meets_income_guidelines, [exists, cccap_household_members, [of, [P], cccap_is_eligible_child]]]
sources: [S483, S484, S515, S1408, S1413, S3252, S3532]
implemented: engine
tags: [household, income]
rationale: "No existing item combines the CCCAP Low-Income Child Care criteria; cccap_eligibility_status (CO-989) reads it - as of this batch, as the item that assembles all of 3.111's criteria into one place, per the review (docs/reviews/cccap-leap-phase-6.md, C-10, should-fix): CO-989 previously re-derived the Low-Income conditions inline rather than reading this item, so it was dead code no outcome consumed. The residency (3.111.A, C-11) and asset (cccap_declares_assets_within_limit, CO-996, K-3) conjuncts were added per the review's findings, which this item's own prior sources (S484) already cited without ever testing. Residency reads is_colorado_resident (CO-505) directly rather than a new cccap_meets_residency item, since governance's dup.compact check rejects an identical derivation under a new id (see this item's precision)."
