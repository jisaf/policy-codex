id: CO-987
name: "CCCAP: low-income child care eligible"
identifier: cccap_low_income_child_care_eligible
kind: derived
type: yes/no
scope: person-month
program: CCCAP
meaning: This adult caretaker or teen parent meets the Low-Income Child Care eligibility criteria of 8 CCR 1403-1 3.111 - actively in an eligible activity, at or below the county entry income limit, and having physical custody of at least one eligible child in the household.
derived: [all, cccap_household_caretakers_in_eligible_activity, cccap_income_within_entry_limit, [exists, cccap_household_members, [of, [P], cccap_is_eligible_child]]]
sources: [S483, S484]
implemented: engine
tags: [household, income]
rationale: No existing item combines the CCCAP Low-Income Child Care criteria; cccap_eligibility_status (CO-989) reads it.
