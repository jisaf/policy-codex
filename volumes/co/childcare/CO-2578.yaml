id: CO-2578
name: "CCCAP: income the parent fee is computed on"
identifier: cccap_parent_fee_income
kind: derived
type: money
scope: person-month
program: CCCAP
meaning: "The monthly income the CCCAP parent-fee formula is applied to: for a protective services household, the countable income of the household's eligible children (8 CCR 1403-1 3.119.A, cccap_protective_services_income), since such a household has no fee unless the children have countable income (3.124.I.6); for any other household, the household's countable gross income (cccap_household_income, CO-985)."
precision: The rule does not state the base of a protective services household's formula fee; the children's countable income is read as the base because it is the only income 3.119.A counts for such a household (OQ-536).
derived: [case, [["=", cccap_eligibility_status, eligible_protective_services], [sum, [filter, cccap_household_members, [of, [P], cccap_is_eligible_child]], [of, [P], cccap_protective_services_income]]], [else, cccap_household_income]]
sources: [S784]
implemented: engine
tags: [income]
open: [OQ-536]
rationale: "CDHS review C-7: cccap_parent_fee (CO-1290) set every protective services fee to zero, but 3.124.I.6 charges one when the children have countable income; the formula (CO-1289) needs the income it is applied to."
nearest: [CO-985, CO-994]
tests:
  - {id: CO-2578-T1, month: "2026-10", as_of: "2026-10-01", given: {cccap_eligibility_status: eligible_protective_services, cccap_household_members: [p1, p2], cccap_is_eligible_child: false}, title: "A foster child receiving $300 of Social Security", others: {p2: {cccap_is_eligible_child: true, cccap_protective_services_income: 300}}, expect: 300}
  - {id: CO-2578-T2, month: "2026-10", as_of: "2026-10-01", given: {cccap_eligibility_status: eligible_low_income, cccap_household_income: 2380}, expect: 2380}
