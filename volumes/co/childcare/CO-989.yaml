id: CO-989
name: "CCCAP: eligibility status"
identifier: cccap_eligibility_status
kind: derived
type: one of
options: [eligible_low_income, eligible_colorado_works, eligible_protective_services, eligible_child_welfare, eligible_homelessness_stabilization, ineligible_disqualified, ineligible_income, ineligible_activity, ineligible_child, ineligible]
scope: person-month
program: CCCAP
role: outcome
meaning: "This CCCAP household's eligibility determination for the month, reported on every household member (including a child, who reads the household's caretakers' and other members' facts rather than their own) - checked in order - a disqualification of an adult caretaker or teen parent for an intentional program violation (3.114.A.6, 3.139.D), a Protective Services referral within its own household-of-one income test, Child Welfare Child Care (3.120), Colorado Works Child Care eligibility, having an eligible child in the household, a family experiencing homelessness in its stabilization period (3.121.B, no activity required), being in an eligible activity, the county entry income limit, and, last, the remaining Low-Income criteria (residency, the asset self-declaration) bundled in cccap_low_income_child_care_eligible - eligible for Low-Income Child Care only if every one of those checks passes."
precision: "Colorado Works Child Care households are not subject to the low-income eligible-activity or entry-income tests (3.111.D.6), so that route is checked first and short-circuits the rest. Protective Services households are not subject to the low-income eligible-activity or residency-verification requirements (3.119.D, E), but 3.119.A does not waive the income test - it only redefines it (household of one, placed child's income only, no child support) - so the Protective Services branch now carries its own income conjunct (cccap_protective_services_income_within_limit, CO-995) and falls through to the ordinary rows, rather than granting eligible_protective_services on the referral flag alone. A residency or asset-limit failure that survives to the final row (the only two 3.111 criteria this item does not give their own reason code) reports the generic ineligible rather than a more specific option, since the outcome's option list has no ineligible_residency or ineligible_assets entry. Final pass F-02, F-03 and F-07: a household with an adult caretaker or teen parent serving a CCCAP IPV disqualification (cccap_is_serving_ipv_disqualification, CO-3906, read as false when not stated) is ineligible_disqualified, whatever its category, since 3.139.D makes the penalty affect any household the person is a member of; a Child Welfare Child Care household (cccap_is_child_welfare_child_care_household, CO-2576, read as false when not stated) is eligible_child_welfare, its eligibility being the Child Welfare division's case-by-case finding under 12 CCR 2509-4 7.302 (3.120.D), not the Low-Income tests; a family experiencing homelessness during its stabilization period (cccap_is_in_homelessness_stabilization, CO-3907) with an eligible child is eligible_homelessness_stabilization, since 3.121.B requires an authorization for the period and B.3.a waives the activity requirement; its income and residency are verified for ongoing eligibility by the end of the period (B.1)."
derived: [case, [[exists, cccap_household_members, [all, [otherwise, [of, [P], cccap_is_serving_ipv_disqualification], false], [any, [of, [P], cccap_is_adult_caretaker], [of, [P], cccap_is_teen_parent]]]], ineligible_disqualified], [[all, is_protective_services_child_care_case, cccap_protective_services_income_within_limit], eligible_protective_services], [[otherwise, cccap_is_child_welfare_child_care_household, false], eligible_child_welfare], [cccap_colorado_works_child_care_eligible, eligible_colorado_works], [[not, [exists, cccap_household_members, [of, [P], cccap_is_eligible_child]]], ineligible_child], [cccap_is_in_homelessness_stabilization, eligible_homelessness_stabilization], [[not, cccap_household_caretakers_in_eligible_activity], ineligible_activity], [[not, cccap_meets_income_guidelines], ineligible_income], [[not, cccap_low_income_child_care_eligible], ineligible], [else, eligible_low_income]]
sources: [S483, S487, S488, S1413, S784, S1823, S2709, S2710, S2711]
implemented: engine
tags: [household, income]
rationale: "No existing item combines the CCCAP eligibility checks into one outcome; this is the program's central eligibility outcome (declared under CCCAP's outcomes in the report back), parallel in shape to cw_eligibility_status (CO-921) and ma_magi_eligibility_status. The Protective Services income conjunct was added per the review (docs/reviews/cccap-leap-phase-6.md, C-9, should-fix). The final row now reads cccap_low_income_child_care_eligible (CO-987) rather than leaving it unread, per C-10: CO-989 previously re-derived the Low-Income conditions inline, so CO-987 was dead code, and the fix keeps the specific ineligible_child/ineligible_activity/ineligible_income reason codes for the conditions already checked above while reading CO-987 - which now also carries C-11's residency conjunct and K-3's asset conjunct - as the catch-all for the remaining criteria, rather than duplicating them inline a second time. meaning restated per C-17: it previously described a per-caretaker determination although every household member, infants included, receives the same value. Heavier-definitions audit H-2 (audit fix round): the tests state the Colorado Works case record (receives_tanf_cash, is_work_eligible_individual_in_tanf_case) that cccap_colorado_works_child_care_eligible (CO-988) now reads. Final pass F-02, F-03 and F-07: three pathways and one bar the rule states had no row - families experiencing homelessness in their stabilization period (3.121), Child Welfare Child Care (3.120), and the IPV disqualification (3.114.A.6, 3.139)."
