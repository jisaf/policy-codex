implemented: engine
tags: [household, income]
rationale: "No existing item combines the CCCAP eligibility checks into one outcome; this is the program's central eligibility outcome (declared under CCCAP's outcomes in the report back), parallel in shape to cw_eligibility_status (CO-921) and ma_magi_eligibility_status. The Protective Services income conjunct was added per the review (docs/reviews/cccap-leap-phase-6.md, C-9, should-fix). The final row now reads cccap_low_income_child_care_eligible (CO-987) rather than leaving it unread, per C-10: CO-989 previously re-derived the Low-Income conditions inline, so CO-987 was dead code, and the fix keeps the specific ineligible_child/ineligible_activity/ineligible_income reason codes for the conditions already checked above while reading CO-987 - which now also carries C-11's residency conjunct and K-3's asset conjunct - as the catch-all for the remaining criteria, rather than duplicating them inline a second time. meaning restated per C-17: it previously described a per-caretaker determination although every household member, infants included, receives the same value. Heavier-definitions audit H-2 (audit fix round): the tests state the Colorado Works case record (receives_tanf_cash, is_work_eligible_individual_in_tanf_case) that cccap_colorado_works_child_care_eligible (CO-988) now reads. Final pass F-02, F-03 and F-07: three pathways and one bar the rule states had no row - families experiencing homelessness in their stabilization period (3.121), Child Welfare Child Care (3.120), and the IPV disqualification (3.114.A.6, 3.139)."
