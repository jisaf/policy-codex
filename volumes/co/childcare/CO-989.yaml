id: CO-989
name: "CCCAP: eligibility status"
identifier: cccap_eligibility_status
kind: derived
type: one of
options: [eligible_low_income, eligible_colorado_works, eligible_protective_services, ineligible_income, ineligible_activity, ineligible_child, ineligible]
scope: person-month
program: CCCAP
role: outcome
meaning: This adult caretaker's or teen parent's CCCAP eligibility determination for the month, checked in order - an open Protective Services referral, Colorado Works Child Care eligibility, having an eligible child in the household, being in an eligible activity, and the county entry income limit - eligible for Low-Income Child Care only if every Low-Income check passes.
precision: Protective services and Colorado Works Child Care households are not subject to the low-income eligible-activity or entry-income tests (3.111.D.6, 3.119.D), so those two routes are checked first and short-circuit the rest.
derived: [case, [is_protective_services_child_care_case, eligible_protective_services], [cccap_colorado_works_child_care_eligible, eligible_colorado_works], [[not, [exists, cccap_household_members, [of, [P], cccap_is_eligible_child]]], ineligible_child], [[not, cccap_household_caretakers_in_eligible_activity], ineligible_activity], [[not, cccap_income_within_entry_limit], ineligible_income], [else, eligible_low_income]]
sources: [S483, S487, S488]
implemented: engine
tags: [household, income]
rationale: No existing item combines the CCCAP eligibility checks into one outcome; this is the program's central eligibility outcome (declared under CCCAP's outcomes in the report back), parallel in shape to cw_eligibility_status (CO-921) and ma_magi_eligibility_status.
tests:
  - {id: CO-989-T1, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "1985-01-22", is_protective_services_child_care_case: false, cw_eligibility_status: ineligible_income, cw_grant_amount: 0, hours_worked: 138, is_in_job_search_activity: false, is_enrolled_in_school: false, cccap_income_within_entry_limit: true}, others: {p5: {date_of_birth: "2026-02-03", has_additional_care_needs: false}}, relationships: [[parent, p1, p5]], expect: eligible_low_income}
  - {id: CO-989-T2, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "1985-01-22", is_protective_services_child_care_case: false, cw_eligibility_status: eligible, cw_grant_amount: 488, hours_worked: 0, is_in_job_search_activity: false, is_enrolled_in_school: false, cccap_income_within_entry_limit: true}, others: {p5: {date_of_birth: "2026-02-03", has_additional_care_needs: false}}, relationships: [[parent, p1, p5]], expect: eligible_colorado_works}
  - {id: CO-989-T3, as_of: "2026-10-01", month: "2026-10", given: {is_protective_services_child_care_case: true, cw_eligibility_status: ineligible_income, cw_grant_amount: 0, hours_worked: 0, is_in_job_search_activity: false, is_enrolled_in_school: false, cccap_income_within_entry_limit: false}, relationships: [], expect: eligible_protective_services}
  - {id: CO-989-T4, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "1990-01-01", has_additional_care_needs: false, is_protective_services_child_care_case: false, cw_eligibility_status: ineligible_income, cw_grant_amount: 0, hours_worked: 138, is_in_job_search_activity: false, is_enrolled_in_school: false, cccap_income_within_entry_limit: true}, relationships: [], expect: ineligible_child}
  - {id: CO-989-T5, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "1985-01-22", is_protective_services_child_care_case: false, cw_eligibility_status: ineligible_income, cw_grant_amount: 0, hours_worked: 0, is_in_job_search_activity: false, is_enrolled_in_school: false, cccap_income_within_entry_limit: true}, others: {p5: {date_of_birth: "2026-02-03", has_additional_care_needs: false}}, relationships: [[parent, p1, p5]], expect: ineligible_activity}
  - {id: CO-989-T6, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "1985-01-22", is_protective_services_child_care_case: false, cw_eligibility_status: ineligible_income, cw_grant_amount: 0, hours_worked: 138, is_in_job_search_activity: false, is_enrolled_in_school: false, cccap_income_within_entry_limit: false}, others: {p5: {date_of_birth: "2026-02-03", has_additional_care_needs: false}}, relationships: [[parent, p1, p5]], expect: ineligible_income}
