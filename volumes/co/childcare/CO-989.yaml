  - {id: CO-989-T2, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "1985-01-22", is_protective_services_child_care_case: false, cw_eligibility_status: eligible, cw_grant_amount: 488, cw_is_work_eligible_individual: true, is_referred_for_colorado_works_child_care: true, hours_worked: 0, is_in_job_search_activity: false, is_enrolled_in_school: false, cccap_income_within_entry_limit: true}, others: {p5: {date_of_birth: "2026-02-03", has_additional_care_needs: false}}, relationships: [[parent, p1, p5]], expect: eligible_colorado_works}
  - {id: CO-989-T3, as_of: "2026-10-01", month: "2026-10", given: {is_protective_services_child_care_case: true, cw_eligibility_status: ineligible_income, cw_grant_amount: 0, hours_worked: 0, is_in_job_search_activity: false, is_enrolled_in_school: false, cccap_income_within_entry_limit: false, earned_income: 0, self_employment_net_income: 0, social_security_income: 0, pension_income: 0, unemployment_income: 0, child_support_received: 0, other_unearned_income: 0, cccap_entry_income_limit_pct_fpl: 1.85}, relationships: [], expect: eligible_protective_services}
