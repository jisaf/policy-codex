id: CO-4061
name: "CCCAP: verification due date for a protective services household"
identifier: cccap_protective_services_verification_due_date
kind: derived
type: calendar date
scope: person-month
program: CCCAP
meaning: "The date by which a protective services household must provide the verification still pending (8 CCR 1403-1 3.119.B, F, G): fifteen days after the county's request (cccap_verification_due_date, CO-1450) when any element other than the children's income, the immunization record and a child's citizenship, age or identity is pending; otherwise sixty days for the children's income (cccap_protective_services_income_verification_days, CO-4057) and for the immunization record (cccap_protective_services_immunization_verification_days, CO-4058), the earlier where both are pending; and, when only a child's citizenship, age or identity is pending, six months (cccap_protective_services_child_identity_verification_months, CO-4059)."
precision: "Counted over the household (cccap_household_members, CO-982): the pending elements in all (cccap_pending_verification_count, CO-1449) less the income (CO-2590, CO-1681), immunization (CO-4060) and citizenship, age and identity (CO-1678 to CO-1680) elements. The six months are counted from the county's request, the same day as the referral when the Child Welfare worker cannot attest at the referral (3.119.F, F.3: \"within six (6) months of the referral\"), as the same day of the month six months later (a request on the 31st of a month whose sixth month is shorter runs into the following month); the sixty days from the request (OQ-716). The request date is the program's own, else the shared checklist date (OQ-300). Read by cccap_verification_status (CO-1451) for a protective services case."
derived: [case, [[">", ["-", cccap_pending_verification_count, [sum, cccap_household_members, [+, [case, [[of, [P], cccap_unearned_income_verification_is_pending], 1], [else, 0]], [case, [[of, [P], cccap_earned_income_verification_is_pending], 1], [else, 0]], [case, [[of, [P], cccap_immunization_verification_is_pending], 1], [else, 0]], [case, [[of, [P], cccap_citizenship_verification_is_pending], 1], [else, 0]], [case, [[of, [P], cccap_age_verification_is_pending], 1], [else, 0]], [case, [[of, [P], cccap_identity_verification_is_pending], 1], [else, 0]]]]], 0], cccap_verification_due_date], [[all, [exists, cccap_household_members, [any, [of, [P], cccap_unearned_income_verification_is_pending], [of, [P], cccap_earned_income_verification_is_pending]]], [exists, cccap_household_members, [of, [P], cccap_immunization_verification_is_pending]]], [days_after, [min, cccap_protective_services_income_verification_days, cccap_protective_services_immunization_verification_days], [otherwise, cccap_verification_request_date, verification_request_date]]], [[exists, cccap_household_members, [any, [of, [P], cccap_unearned_income_verification_is_pending], [of, [P], cccap_earned_income_verification_is_pending]]], [days_after, cccap_protective_services_income_verification_days, [otherwise, cccap_verification_request_date, verification_request_date]]], [[exists, cccap_household_members, [of, [P], cccap_immunization_verification_is_pending]], [days_after, cccap_protective_services_immunization_verification_days, [otherwise, cccap_verification_request_date, verification_request_date]]], [else, [days_after, [days_between, [first_day, [month_of, [otherwise, cccap_verification_request_date, verification_request_date]]], [otherwise, cccap_verification_request_date, verification_request_date]], [first_day, [months_after, cccap_protective_services_child_identity_verification_months, [month_of, [otherwise, cccap_verification_request_date, verification_request_date]]]]]]]
sources: [S2852, S891]
open: [OQ-716]
nearest: [CO-3909, CO-1450]
implemented: engine
tags: [verification]
rationale: "Second-pass review N-6: a protective services child's unverified Social Security was past due on day 31 (RV-S1), where 3.119.B allows sixty days; 3.119.F allows six months for citizenship, age and identity and 3.119.G sixty days for immunization. The shape follows cccap_homelessness_verification_due_date (CO-3909)."
tests:
  - {id: CO-4061-T1, title: "Only the placed child's income is pending: sixty days from October 1 (3.119.B)", as_of: "2026-11-01", month: "2026-11", given: {verification_request_date: "2026-10-01", cccap_pending_verification_count: 1, cccap_household_members: [p1], cccap_unearned_income_verification_is_pending: true, cccap_earned_income_verification_is_pending: false, cccap_immunization_verification_is_pending: false, cccap_citizenship_verification_is_pending: false, cccap_age_verification_is_pending: false, cccap_identity_verification_is_pending: false}, expect: "2026-11-30"}
  - {id: CO-4061-T2, title: "Only the child's citizenship is pending: six months from October 1 (3.119.F)", as_of: "2026-11-01", month: "2026-11", given: {verification_request_date: "2026-10-01", cccap_pending_verification_count: 1, cccap_household_members: [p1], cccap_unearned_income_verification_is_pending: false, cccap_earned_income_verification_is_pending: false, cccap_immunization_verification_is_pending: false, cccap_citizenship_verification_is_pending: true, cccap_age_verification_is_pending: false, cccap_identity_verification_is_pending: false}, expect: "2027-04-01"}
  - {id: CO-4061-T3, title: "The custody schedule is also pending: fifteen days (3.111.C.2.h)", as_of: "2026-11-01", month: "2026-11", given: {verification_request_date: "2026-10-01", cccap_pending_verification_count: 2, cccap_household_members: [p1], cccap_unearned_income_verification_is_pending: true, cccap_earned_income_verification_is_pending: false, cccap_immunization_verification_is_pending: false, cccap_citizenship_verification_is_pending: false, cccap_age_verification_is_pending: false, cccap_identity_verification_is_pending: false}, expect: "2026-10-16"}
  - {id: CO-4061-T4, title: "A request on October 20, only the child's identity pending: April 20", as_of: "2026-11-01", month: "2026-11", given: {verification_request_date: "2026-10-20", cccap_pending_verification_count: 1, cccap_household_members: [p1], cccap_unearned_income_verification_is_pending: false, cccap_earned_income_verification_is_pending: false, cccap_immunization_verification_is_pending: false, cccap_citizenship_verification_is_pending: false, cccap_age_verification_is_pending: false, cccap_identity_verification_is_pending: true}, expect: "2027-04-20"}
