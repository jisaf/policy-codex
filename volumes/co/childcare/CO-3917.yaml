id: CO-3917
name: "CCCAP: a person's countable income"
identifier: cccap_person_countable_income
kind: derived
type: money
scope: person-month
program: CCCAP
meaning: "This person's monthly countable income for CCCAP (8 CCR 1403-1 3.111.H.4-5, I, J): generally the income received in the prior thirty days, earned (CO-3915) and unearned (CO-3916); or, where the county found case by case that those thirty days do not give an accurate indication of anticipated income and used another period, the monthly income the county so determined (cccap_county_determined_monthly_income, CO-3914)."
precision: "The county's figure, when stated, replaces the thirty-day figure for the person; it is not added to it. cccap_household_income (CO-985) sums this item over the household and subtracts the 3.111.K child support deduction."
derived: [otherwise, cccap_county_determined_monthly_income, [+, cccap_person_earned_income, cccap_person_unearned_income]]
sources: [S891, S2704]
implemented: engine
tags: [income]
open: [OQ-680]
rationale: "Final pass F-09: 3.111.H.4 bases the expected monthly income on the prior thirty days \"Generally\", and H.5.a.1 and H.5.b use those days \"unless, on a case-by-case basis\" the county finds them unrepresentative. No item modeled the period or the county's alternative."
tests:
  - {id: CO-3917-T1, title: "The prior thirty days", as_of: "2026-12-01", month: "2026-12", given: {cccap_person_earned_income: 2500, cccap_person_unearned_income: 200}, expect: 2700}
  - {id: CO-3917-T2, title: "The county averaged twelve months of fluctuating earnings to $2,100", as_of: "2026-12-01", month: "2026-12", given: {cccap_county_determined_monthly_income: 2100, cccap_person_earned_income: 2500, cccap_person_unearned_income: 200}, expect: 2100}
