id: CO-1449
name: "CCCAP: pending verification count"
identifier: cccap_pending_verification_count
kind: derived
type: whole number
scope: person-month
program: CCCAP
role: outcome
meaning: The number of eligibility verification elements still pending across every member of this person's CCCAP household (a child support deduction is counted in cccap_pending_deduction_verification_count).
precision: Zero where CCCAP verification does not apply to the person (cccap_verification_is_applicable, CO-2585; case worker review B2).
derived: [case, [cccap_verification_is_applicable, [sum, cccap_household_members, [of, [P], cccap_person_pending_verification_count]]], [else, 0]]
sources: [S891]
implemented: engine
tags: [verification]
rationale: No existing item counts a CCCAP household's outstanding verifications.
tests:
  - {id: CO-1449-T1, month: "2026-10", as_of: "2026-10-01", given: {cccap_verification_is_applicable: true, cccap_household_members: [p1, p2], cccap_person_pending_verification_count: 0}, others: {p2: {cccap_verification_is_applicable: true, cccap_person_pending_verification_count: 2}}, expect: 2}
