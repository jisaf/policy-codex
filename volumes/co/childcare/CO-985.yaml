id: CO-985
name: "CCCAP: household income"
identifier: cccap_household_income
kind: derived
type: money
scope: person-month
program: CCCAP
meaning: The CCCAP household's total countable gross income for the month under 8 CCR 1403-1 3.111.I - the sum of each adult caretaker's and teen parent's (but not a non-teen-parent eligible child's) gross earned and unearned income, since 3.111.J.1 excludes a child's earnings when the child is not a teen parent.
precision: "Sums earned_income, self_employment_net_income, social_security_income, pension_income, unemployment_income, child_support_received, and other_unearned_income over cccap_household_members who are not a CCCAP eligible child (or who are a teen parent, since 3.111.J.1's exclusion is only for a child who is not a teen parent). Does not apply the child-support-paid adjustment of 3.111.K (out of scope this batch)."
derived: [sum, [filter, cccap_household_members, [any, [not, [of, [P], cccap_is_eligible_child]], [of, [P], cccap_is_teen_parent]]], [+, [of, [P], earned_income], [of, [P], self_employment_net_income], [of, [P], social_security_income], [of, [P], pension_income], [of, [P], unemployment_income], [of, [P], child_support_received], [of, [P], other_unearned_income]]]
sources: [S486]
implemented: engine
tags: [income, household]
rationale: No existing item computes CCCAP household income; cccap_income_within_entry_limit (CO-986) needs it.
tests:
  - {id: CO-985-T1, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "1985-01-22", has_additional_care_needs: false, earned_income: 2380, self_employment_net_income: 0, social_security_income: 0, pension_income: 0, unemployment_income: 0, child_support_received: 0, other_unearned_income: 0}, others: {p4: {date_of_birth: "2009-04-08", has_additional_care_needs: false, earned_income: 0, self_employment_net_income: 0, social_security_income: 0, pension_income: 0, unemployment_income: 0, child_support_received: 0, other_unearned_income: 0}, p5: {date_of_birth: "2026-02-03", has_additional_care_needs: false, earned_income: 0, self_employment_net_income: 0, social_security_income: 0, pension_income: 0, unemployment_income: 0, child_support_received: 0, other_unearned_income: 0}}, relationships: [[parent, p1, p4], [parent, p4, p5]], expect: 2380}
  - {id: CO-985-T2, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "1990-01-01", has_additional_care_needs: false, earned_income: 500, self_employment_net_income: 0, social_security_income: 0, pension_income: 0, unemployment_income: 0, child_support_received: 0, other_unearned_income: 0}, relationships: [], expect: 500}
