id: CO-985
name: "CCCAP: household income"
identifier: cccap_household_income
kind: derived
type: money
scope: person-month
program: CCCAP
meaning: "The CCCAP household's monthly countable gross income under 8 CCR 1403-1 3.111.H-K: the sum over every household member of the person's countable income (cccap_person_countable_income, CO-3917: generally the income received in the prior thirty days, H.4-5, or the figure the county determined from another period), less the verified court-ordered current child support the household's adult caretakers and teen parents pay for children not living in the household (3.111.K.1, cccap_child_support_paid_deduction, CO-3902), not below zero. The same figure is compared with the entry and exit income limits and used for the parent fee (K.1: \"prior to applying the monthly gross income to the maximum gross monthly income guidelines and when calculating parent fees\")."
precision: "Each member's countable income is earned (CO-3915: wages and CCCAP self-employment income, nothing for a household child who is not a teen parent, 3.111.J.1) plus unearned (CO-3916: the recurring unearned income of the prior thirty days, the month's Social Security, and one twelfth of a lump sum or prize received in the month). What 3.111.J excludes is left out where it has its own fact (CO-3911, CO-3913); the J.28 irregular-income exclusion (under $90 a quarter) is applied there too (cccap_excluded_irregular_income, CO-4076; second-pass review, OQ-713). J.26 (public cash assistance) and J.2 (SSI) are correct by construction: tanf_cash_income, adult_financial_cash_income and ssi_income are not read. Final pass F-01 and F-09: the 3.111.K deduction is applied, and the income period is the prior thirty days rather than the calendar month. Second-pass review N-7: the sums run over cccap_household_income_members (CO-4064), which leaves out the spouse or other parent of a separated caretaker holding a temporary order (3.111.D.10)."
open: [OQ-680, OQ-713]
derived: [max, 0, ["-", [sum, cccap_household_income_members, [of, [P], cccap_person_countable_income]], [sum, cccap_household_income_members, [of, [P], cccap_child_support_paid_deduction]]]]
sources: [S1623, S486, S496, S891, S892, S2704]
implemented: engine
tags: [income, household]
rationale: "No existing item computes CCCAP household income; cccap_income_within_entry_limit (CO-986) needs it. The filter and summand were corrected per the review (docs/reviews/cccap-leap-phase-6.md, C-4, blocking): the prior derivation filtered on cccap_is_eligible_child (the 3.111.F term) instead of cccap_is_household_child (the 3.103.GGG term J.1 actually uses) and zeroed a filtered-out member's entire income rather than only earnings, dropping an eligible child's countable unearned income and counting a 14-17-year-old household child's wages that J.1 excludes. This is also the shape leap_household_income (CO-1002) already uses for its own child-earnings exclusion. Final pass F-01 and F-09 (SW-35): the per-person income moved to cccap_person_countable_income (CO-3917), which reads the prior thirty days (3.111.H.5) instead of the calendar month, and the household total now subtracts the 3.111.K child support deduction (CO-3902), which no item applied. cccap_excluded_income (CO-2344) is retired: the receipts it subtracted are now facts of their own that the thirty-day figure leaves out."
tests:
  - {id: CO-985-T1, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "1985-01-22", cccap_child_has_additional_care_needs: false, wages_gross: 2380, self_employment_gross_receipts: 0, self_employment_net_earnings_for_tax: 0, social_security_income: 0, pension_income: 0, unemployment_income: 0, child_support_received: 0, other_unearned_income_nontaxable: 0, other_unearned_income_taxable: 0, tax_exempt_interest: 0, child_support_paid_legally_obligated: 0, cccap_child_needs_care_for_part_of_day: true, cccap_is_financially_contributing_to_child: true}, others: {p4: {date_of_birth: "2009-04-08", cccap_child_has_additional_care_needs: false, wages_gross: 0, self_employment_gross_receipts: 0, self_employment_net_earnings_for_tax: 0, social_security_income: 0, pension_income: 0, unemployment_income: 0, child_support_received: 0, other_unearned_income_nontaxable: 0, other_unearned_income_taxable: 0, tax_exempt_interest: 0, child_support_paid_legally_obligated: 0, cccap_child_needs_care_for_part_of_day: true, cccap_is_financially_contributing_to_child: false}, p5: {date_of_birth: "2026-02-03", cccap_child_has_additional_care_needs: false, wages_gross: 0, self_employment_gross_receipts: 0, self_employment_net_earnings_for_tax: 0, social_security_income: 0, pension_income: 0, unemployment_income: 0, child_support_received: 0, other_unearned_income_nontaxable: 0, other_unearned_income_taxable: 0, tax_exempt_interest: 0, child_support_paid_legally_obligated: 0, cccap_child_needs_care_for_part_of_day: true}}, relationships: [[parent, p1, p4], [parent, p4, p5]], expect: 2380}
  - {id: CO-985-T2, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "1990-01-01", cccap_child_has_additional_care_needs: false, wages_gross: 500, self_employment_gross_receipts: 0, self_employment_net_earnings_for_tax: 0, social_security_income: 0, pension_income: 0, unemployment_income: 0, child_support_received: 0, other_unearned_income_nontaxable: 0, other_unearned_income_taxable: 0, tax_exempt_interest: 0, child_support_paid_legally_obligated: 0}, relationships: [], expect: 500}
  # An eligible child's unearned income (survivor's Social Security, 3.111.I.25) is countable; only earnings are excluded.
  - {id: CO-985-T3, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "1985-01-22", cccap_child_has_additional_care_needs: false, wages_gross: 1000, self_employment_gross_receipts: 0, self_employment_net_earnings_for_tax: 0, social_security_income: 0, pension_income: 0, unemployment_income: 0, child_support_received: 0, other_unearned_income_nontaxable: 0, other_unearned_income_taxable: 0, tax_exempt_interest: 0, child_support_paid_legally_obligated: 0}, others: {p5: {immigration_status: us_citizen, date_of_birth: "2023-06-01", cccap_child_has_additional_care_needs: false, wages_gross: 0, self_employment_gross_receipts: 0, self_employment_net_earnings_for_tax: 0, social_security_income: 300, pension_income: 0, unemployment_income: 0, child_support_received: 0, other_unearned_income_nontaxable: 0, other_unearned_income_taxable: 0, tax_exempt_interest: 0, child_support_paid_legally_obligated: 0}}, relationships: [[parent, p1, p5]], expect: 1300}
  # A 15-year-old household child (not an eligible child under 3.111.F, not a teen parent) has her earnings excluded under 3.111.J.1 even though she is not a cccap_is_eligible_child.
  - {id: CO-985-T4, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "1985-01-22", cccap_child_has_additional_care_needs: false, wages_gross: 1000, self_employment_gross_receipts: 0, self_employment_net_earnings_for_tax: 0, social_security_income: 0, pension_income: 0, unemployment_income: 0, child_support_received: 0, other_unearned_income_nontaxable: 0, other_unearned_income_taxable: 0, tax_exempt_interest: 0, child_support_paid_legally_obligated: 0}, others: {p4: {date_of_birth: "2011-06-01", cccap_child_has_additional_care_needs: false, wages_gross: 400, self_employment_gross_receipts: 0, self_employment_net_earnings_for_tax: 0, social_security_income: 0, pension_income: 0, unemployment_income: 0, child_support_received: 0, other_unearned_income_nontaxable: 0, other_unearned_income_taxable: 0, tax_exempt_interest: 0, child_support_paid_legally_obligated: 0}}, relationships: [[parent, p1, p4]], expect: 1000}
  # Final pass F-09: $380 of the mother's other unearned income is a tax refund, which has its own fact and 3.111.J.14 excludes (was OQ-390's cccap_excluded_income, now retired).
  - {id: CO-985-T5, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "1985-01-22", cccap_child_has_additional_care_needs: false, self_employment_gross_receipts: 0, self_employment_net_earnings_for_tax: 0, social_security_income: 0, pension_income: 0, unemployment_income: 0, child_support_received: 0, other_unearned_income_taxable: 0, tax_exempt_interest: 0, cccap_child_needs_care_for_part_of_day: true, cccap_is_financially_contributing_to_child: true, wages_gross: 2000, other_unearned_income_nontaxable: 380, tax_refunds_and_credits_received: 380, child_support_paid_legally_obligated: 0}, others: {p5: {immigration_status: us_citizen, date_of_birth: "2023-06-01", cccap_child_has_additional_care_needs: false, wages_gross: 0, self_employment_gross_receipts: 0, self_employment_net_earnings_for_tax: 0, social_security_income: 0, pension_income: 0, unemployment_income: 0, child_support_received: 0, other_unearned_income_nontaxable: 0, other_unearned_income_taxable: 0, tax_exempt_interest: 0, cccap_child_needs_care_for_part_of_day: true, child_support_paid_legally_obligated: 0}}, relationships: [[parent, p1, p5]], expect: 2000}
  # Final pass F-01 (3.111.K): the mother pays $400 of verified, current, court-ordered support for a child who lives elsewhere; $2,380 - $400 = $1,980.
  - {id: CO-985-T6, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "1985-01-22", cccap_child_has_additional_care_needs: false, self_employment_gross_receipts: 0, self_employment_net_earnings_for_tax: 0, social_security_income: 0, pension_income: 0, unemployment_income: 0, child_support_received: 0, other_unearned_income_taxable: 0, tax_exempt_interest: 0, cccap_child_needs_care_for_part_of_day: true, cccap_is_financially_contributing_to_child: true, wages_gross: 2380, other_unearned_income_nontaxable: 0, child_support_paid_legally_obligated: 400, child_support_paid_order_type: court_order, child_support_paid_verified_by_electronic_data_source: true}, others: {p5: {immigration_status: us_citizen, date_of_birth: "2023-06-01", cccap_child_has_additional_care_needs: false, wages_gross: 0, self_employment_gross_receipts: 0, self_employment_net_earnings_for_tax: 0, social_security_income: 0, pension_income: 0, unemployment_income: 0, child_support_received: 0, other_unearned_income_nontaxable: 0, other_unearned_income_taxable: 0, tax_exempt_interest: 0, cccap_child_needs_care_for_part_of_day: true, child_support_paid_legally_obligated: 0}}, relationships: [[parent, p1, p5]], expect: 1980}
  # Final pass F-09 (3.111.H.5.a.1): a weekly earner paid $500 on five Fridays in the thirty days before the application has $2,500 for CCCAP, although the calendar month's wages are $2,000.
  - {id: CO-985-T7, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "1985-01-22", cccap_child_has_additional_care_needs: false, self_employment_gross_receipts: 0, self_employment_net_earnings_for_tax: 0, social_security_income: 0, pension_income: 0, unemployment_income: 0, child_support_received: 0, other_unearned_income_taxable: 0, tax_exempt_interest: 0, cccap_child_needs_care_for_part_of_day: true, cccap_is_financially_contributing_to_child: true, wages_gross: 2000, wages_gross_received_prior_thirty_days: 2500, other_unearned_income_nontaxable: 0, child_support_paid_legally_obligated: 0}, others: {p5: {immigration_status: us_citizen, date_of_birth: "2023-06-01", cccap_child_has_additional_care_needs: false, wages_gross: 0, self_employment_gross_receipts: 0, self_employment_net_earnings_for_tax: 0, social_security_income: 0, pension_income: 0, unemployment_income: 0, child_support_received: 0, other_unearned_income_nontaxable: 0, other_unearned_income_taxable: 0, tax_exempt_interest: 0, cccap_child_needs_care_for_part_of_day: true, child_support_paid_legally_obligated: 0}}, relationships: [[parent, p1, p5]], expect: 2500}
