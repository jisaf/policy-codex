id: CO-985
name: "CCCAP: household income"
identifier: cccap_household_income
kind: derived
type: money
scope: person-month
program: CCCAP
meaning: The CCCAP household's total countable gross income for the month under 8 CCR 1403-1 3.111.I - every member's unearned income, plus every member's earned income except that of a household child (3.103.GGG) who is not a teen parent, since 3.111.J.1 excludes only "earnings of a child in the household when not a teen parent," not a household child's unearned income or a non-household-child's earnings.
precision: "Sums social_security_income, pension_income, unemployment_income, child_support_received, and other_unearned_income over every cccap_household_member, and adds earned_income plus self_employment_net_income for each member except a cccap_is_household_child (CO-990) who is not a cccap_is_teen_parent (CO-981); 3.111.J.1's exclusion is keyed to the 3.103.GGG household-child term, not the narrower 3.111.F eligible-child term, so an eligible child (under 3.111.F) who is not also a household child keeps no special treatment here, and a household child's own unearned income (for example survivor's Social Security under 3.111.I.25) is counted. Does not apply the child-support-paid adjustment of 3.111.K (out of scope this batch; see OQ-162's sibling gap and 3.111.K's own precision note below). Per the review (docs/reviews/cccap-leap-phase-6.md, C-12), the supplied income facts summed here (social_security_income, pension_income, unemployment_income, other_unearned_income, cash_assistance_income where read elsewhere, earned_income, self_employment_net_income) are treated as the countable, post-exclusion amounts under 3.111.J - the same convention the SNAP chapter states in docs/colorado-notes.md phase 2, 'Income exclusions.' This pushes 3.111.J.2 (SSI), J.4 (SNAP/WIC/school meals), J.10 (foster/kinship/adoption subsidy payments), J.12 (LEAP benefits), J.14 (Earned Income Credit), J.16/J.19 (student grants and loans), and J.28 (irregular income under $90/quarter) onto the fact-assembly layer rather than this item; J.26 (public cash assistance, OAP/AND/TANF/Colorado Works) is correct by construction since this item does not read cash_assistance_income at all. See OQ-162."
open: [OQ-162]
derived: [sum, cccap_household_members, [+, [case, [[all, [of, [P], cccap_is_household_child], [not, [of, [P], cccap_is_teen_parent]]], 0], [else, [+, [of, [P], earned_income], [of, [P], self_employment_net_income]]]], [of, [P], social_security_income], [of, [P], pension_income], [of, [P], unemployment_income], [of, [P], child_support_received], [of, [P], other_unearned_income]]]
sources: [S486, S496]
implemented: engine
tags: [income, household]
rationale: "No existing item computes CCCAP household income; cccap_income_within_entry_limit (CO-986) needs it. The filter and summand were corrected per the review (docs/reviews/cccap-leap-phase-6.md, C-4, blocking): the prior derivation filtered on cccap_is_eligible_child (the 3.111.F term) instead of cccap_is_household_child (the 3.103.GGG term J.1 actually uses) and zeroed a filtered-out member's entire income rather than only earnings, dropping an eligible child's countable unearned income and counting a 14-17-year-old household child's wages that J.1 excludes. This is also the shape leap_household_income (CO-1002) already uses for its own child-earnings exclusion."
tests:
  - {id: CO-985-T1, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "1985-01-22", has_additional_care_needs: false, earned_income: 2380, self_employment_net_income: 0, social_security_income: 0, pension_income: 0, unemployment_income: 0, child_support_received: 0, other_unearned_income: 0}, others: {p4: {date_of_birth: "2009-04-08", has_additional_care_needs: false, earned_income: 0, self_employment_net_income: 0, social_security_income: 0, pension_income: 0, unemployment_income: 0, child_support_received: 0, other_unearned_income: 0}, p5: {date_of_birth: "2026-02-03", has_additional_care_needs: false, earned_income: 0, self_employment_net_income: 0, social_security_income: 0, pension_income: 0, unemployment_income: 0, child_support_received: 0, other_unearned_income: 0}}, relationships: [[parent, p1, p4], [parent, p4, p5]], expect: 2380}
  - {id: CO-985-T2, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "1990-01-01", has_additional_care_needs: false, earned_income: 500, self_employment_net_income: 0, social_security_income: 0, pension_income: 0, unemployment_income: 0, child_support_received: 0, other_unearned_income: 0}, relationships: [], expect: 500}
  # An eligible child's unearned income (survivor's Social Security, 3.111.I.25) is countable; only earnings are excluded.
  - {id: CO-985-T3, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "1985-01-22", has_additional_care_needs: false, earned_income: 1000, self_employment_net_income: 0, social_security_income: 0, pension_income: 0, unemployment_income: 0, child_support_received: 0, other_unearned_income: 0}, others: {p5: {date_of_birth: "2023-06-01", has_additional_care_needs: false, earned_income: 0, self_employment_net_income: 0, social_security_income: 300, pension_income: 0, unemployment_income: 0, child_support_received: 0, other_unearned_income: 0}}, relationships: [[parent, p1, p5]], expect: 1300}
  # A 15-year-old household child (not an eligible child under 3.111.F, not a teen parent) has her earnings excluded under 3.111.J.1 even though she is not a cccap_is_eligible_child.
  - {id: CO-985-T4, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "1985-01-22", has_additional_care_needs: false, earned_income: 1000, self_employment_net_income: 0, social_security_income: 0, pension_income: 0, unemployment_income: 0, child_support_received: 0, other_unearned_income: 0}, others: {p4: {date_of_birth: "2011-06-01", has_additional_care_needs: false, earned_income: 400, self_employment_net_income: 0, social_security_income: 0, pension_income: 0, unemployment_income: 0, child_support_received: 0, other_unearned_income: 0}}, relationships: [[parent, p1, p4]], expect: 1000}
