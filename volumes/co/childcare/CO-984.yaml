id: CO-984
name: "CCCAP: caretaker or teen parent is in an eligible activity"
identifier: cccap_caretaker_in_eligible_activity
kind: derived
type: yes/no
scope: person-month
program: CCCAP
meaning: This adult caretaker or teen parent is actively participating in a low-income eligible activity under 8 CCR 1403-1 3.111.B.1, G - employment or self-employment (hours worked), job search, or training/education (for a teen parent, attending school itself qualifies per 3.103.EEEEE); and, from July 1, 2026, for an adult caretaker, enrollment in a licensed substance use disorder treatment program at an intensive outpatient level of care or higher (3.111.G.4.a.3).
precision: "Employment and self-employment count when the caretaker works and the month's gross wages plus CCCAP self-employment income divided by the hours worked is at least the federal minimum wage (3.111.G.1.b, G.2.d; federal_minimum_wage, CO-160), or the self-employment is in its launch period (G.2.e); the two sources are combined into one ratio. Job search counts while the weeks used in the instance are fewer than cccap_job_search_weeks (13; a county plan may allow more, not modeled). Education or training counts until its time limit is reached (cccap_education_activity_time_limit_reached). The substance use disorder treatment route is read only for an adult caretaker, from the month containing cccap_sud_treatment_activity_start_date for twelve months (3.111.G.4.a.3)."
open: []
derived: [any, [all, [">", hours_worked, 0], [any, [">=", ["/", [+, wages_gross, cccap_self_employment_net_earnings], hours_worked], federal_minimum_wage], cccap_self_employment_in_launch_period]], [all, is_in_job_search_activity, ["<", cccap_job_search_weeks_used, cccap_job_search_weeks]], [all, cccap_is_in_education_or_training_activity, [not, cccap_education_activity_time_limit_reached]], [all, ["<=", cccap_sud_treatment_activity_start_date, [first_day, [month]]], ["<", [month], [months_after, cccap_sud_treatment_activity_max_months, [month_of, cccap_sud_treatment_activity_start_date]]], cccap_is_adult_caretaker, is_in_sud_treatment_iop_or_higher]]
sources: [S482, S1015, S1410, S1411, S1412]
implemented: engine
tags: [household]
rationale: Phase-8 fix round (K-7) adds the substance use disorder treatment activity effective July 1, 2026 (S1015). No existing item states the CCCAP eligible-activity test; cccap_low_income_child_care_eligible (CO-987) and cccap_eligibility_status (CO-989) both need it.
tests:
  - {id: CO-984-T1, as_of: "2026-10-01", month: "2026-10", given: {hours_worked: 138, is_in_job_search_activity: false, is_attending_high_school: false, cccap_is_in_education_or_training_activity: false, is_financially_contributing_to_child: true, cccap_is_receiving_assistance: false, county_of_residence: denver, cccap_application_county: denver, wages_gross: 2380, cccap_self_employment_net_earnings: 0}, expect: true}
  - {id: CO-984-T2, as_of: "2026-10-01", month: "2026-10", given: {hours_worked: 0, is_in_job_search_activity: false, is_attending_high_school: true, cccap_is_in_education_or_training_activity: true, is_financially_contributing_to_child: true, cccap_is_receiving_assistance: false, county_of_residence: denver, cccap_application_county: denver, cccap_education_activity_time_limit_reached: false}, expect: true}
  - {id: CO-984-T3, as_of: "2026-10-01", month: "2026-10", given: {hours_worked: 0, is_in_job_search_activity: false, is_attending_high_school: false, cccap_is_in_education_or_training_activity: false, cccap_is_adult_caretaker: false}, expect: false}
  # Job search alone, isolated from employment/school (§1.4 gap - is_in_job_search_activity was false in every prior test here).
  - {id: CO-984-T4, as_of: "2026-10-01", month: "2026-10", given: {hours_worked: 0, is_in_job_search_activity: true, is_attending_high_school: false, cccap_is_in_education_or_training_activity: false, is_financially_contributing_to_child: true, cccap_is_receiving_assistance: false, county_of_residence: denver, cccap_application_county: denver, cccap_job_search_weeks_used: 2}, expect: true}
  - {id: CO-984-T5, title: "K-7 - adult caretaker in intensive outpatient SUD treatment, October 2026", as_of: "2026-10-01", month: "2026-10", given: {hours_worked: 0, is_in_job_search_activity: false, is_attending_high_school: false, cccap_is_in_education_or_training_activity: false, cccap_is_adult_caretaker: true, is_in_sud_treatment_iop_or_higher: true}, expect: true}
  - {id: CO-984-T6, title: "K-7 - the same treatment in June 2026, before the activity took effect", as_of: "2026-10-01", month: "2026-06", given: {hours_worked: 0, is_in_job_search_activity: false, is_attending_high_school: false, cccap_is_in_education_or_training_activity: false, cccap_is_adult_caretaker: true, is_in_sud_treatment_iop_or_higher: true}, expect: false}
  - {id: CO-984-T7, title: "K-7 - no activity and not in treatment", as_of: "2026-10-01", month: "2026-10", given: {hours_worked: 0, is_in_job_search_activity: false, is_attending_high_school: false, cccap_is_in_education_or_training_activity: false, cccap_is_adult_caretaker: true, is_in_sud_treatment_iop_or_higher: false}, expect: false}
  - {id: CO-984-T8, title: "Vocabulary fix round (R-2): a caretaker in college (post-secondary education, 3.103.OO) is in an eligible activity", as_of: "2026-10-01", month: "2026-10", given: {hours_worked: 0, is_in_job_search_activity: false, cccap_is_in_education_or_training_activity: true, is_financially_contributing_to_child: true, cccap_is_receiving_assistance: false, county_of_residence: denver, cccap_application_county: denver, cccap_education_activity_time_limit_reached: false}, expect: true}
  # 3.111.G.1.b (K-6): $900 for 138 hours is $6.52 an hour, below the $7.25 federal minimum wage.
  - {id: CO-984-T9, as_of: "2026-10-01", month: "2026-10", given: {hours_worked: 138, wages_gross: 900, cccap_self_employment_net_earnings: 0, cccap_self_employment_in_launch_period: false, is_in_job_search_activity: false, is_attending_high_school: false, cccap_is_in_education_or_training_activity: false, is_in_sud_treatment_iop_or_higher: false}, expect: false}
  # 3.111.G.2.e: the same earnings from self-employment in its launch period count.
  - {id: CO-984-T10, as_of: "2026-10-01", month: "2026-10", given: {hours_worked: 138, wages_gross: 0, cccap_self_employment_net_earnings: 900, cccap_self_employment_in_launch_period: true, is_in_job_search_activity: false, is_attending_high_school: false, cccap_is_in_education_or_training_activity: false}, expect: true}
  # 3.111.G.3.a, g (K-5): thirteen weeks of job search used, no other activity.
  - {id: CO-984-T11, as_of: "2026-10-01", month: "2026-10", given: {hours_worked: 0, is_in_job_search_activity: true, cccap_job_search_weeks_used: 13, is_attending_high_school: false, cccap_is_in_education_or_training_activity: false, is_in_sud_treatment_iop_or_higher: false}, expect: false}
  # 3.111.G.4 (K-5): an education activity whose time limit is reached.
  - {id: CO-984-T12, as_of: "2026-10-01", month: "2026-10", given: {hours_worked: 0, is_in_job_search_activity: false, cccap_is_in_education_or_training_activity: true, cccap_education_activity_time_limit_reached: true, is_in_sud_treatment_iop_or_higher: false}, expect: false}
  # 3.111.G.4.a.3: SUD treatment begun in July 2026 counts through June 2027 and not in July 2027.
  - {id: CO-984-T13, as_of: "2027-06-01", month: "2027-06", parameters: {cccap_sud_treatment_activity_start_date: "2026-07-01"}, given: {hours_worked: 0, is_in_job_search_activity: false, is_attending_high_school: false, cccap_is_in_education_or_training_activity: false, cccap_is_adult_caretaker: true, is_in_sud_treatment_iop_or_higher: true}, expect: true}
  - {id: CO-984-T14, as_of: "2027-07-01", month: "2027-07", parameters: {cccap_sud_treatment_activity_start_date: "2026-07-01"}, given: {hours_worked: 0, is_in_job_search_activity: false, is_attending_high_school: false, cccap_is_in_education_or_training_activity: false, cccap_is_adult_caretaker: true, is_in_sud_treatment_iop_or_higher: true}, expect: false}
