id: CO-984
name: "CCCAP: caretaker or teen parent is in an eligible activity"
identifier: cccap_caretaker_in_eligible_activity
kind: derived
type: yes/no
scope: person-month
program: CCCAP
meaning: "This adult caretaker or teen parent is actively participating in a low-income eligible activity under 8 CCR 1403-1 3.111.B.1, G - employment or self-employment (hours worked), job search while enrolled in Low-Income Child Care or on transition from Colorado Works, or training/education (for a teen parent, attending school itself qualifies per 3.103.EEEEE); from July 1, 2026, for an adult caretaker, enrollment in a licensed substance use disorder treatment program at an intensive outpatient level of care or higher, for a year from the start of each instance (3.111.G.4.a.3); or is on a temporary break in such an activity that the rule keeps as participation: verified maternity or paternity leave (3.111.D.8), and, while the household already receives Low-Income Child Care, verified medical leave that leaves the caretaker unable to care for the children (D.9) or a seasonal interruption, temporary layoff or scheduled education break (3.112.C)."
precision: "Employment and self-employment count when the caretaker works and the month's gross wages plus CCCAP self-employment income divided by the hours worked is at least the federal minimum wage (3.111.G.1.b, G.2.d; federal_minimum_wage, CO-160), or the self-employment is in its launch period (G.2.e); the two sources are combined into one ratio. Job search counts only for a caretaker who \"met the eligibility criteria on the most recent eligibility determination\" (G.3.a) and ended an activity \"while enrolled in the Low-Income program\" (G.3.f), or who transitions from Colorado Works (3.117.D) - read from cccap_is_receiving_assistance (CO-2103), true at a redetermination, a change during the eligibility period or a transition (cccap_determination_type, CO-3307); at an initial application job search is not an activity (final pass F-05) - and while the weeks used in the instance are fewer than cccap_job_search_weeks (a county plan may allow more, OQ-162). Education or training counts until its time limit is reached (cccap_education_activity_time_limit_reached); coverage round F-06: at a change reported during the eligibility period (cccap_determination_type, CO-3307) the limit is not applied, since 3.114.B.3 ends care for exceeding a time limit \"at re-determination only\" and 3.125.Q does not list it (S3251, S3252); whether 3.132.B.3's shorter authorization for a time-limited activity ends the care earlier is OQ-790. The substance use disorder treatment route is read only for an adult caretaker, from the month containing cccap_sud_treatment_instance_start_date (CO-3905: the later of the instance's start, sud_treatment_start_date, and July 1, 2026) for cccap_sud_treatment_activity_max_months months (final pass F-06); the arm is cccap_is_in_sud_treatment_activity (CO-4074). A temporary break is temporary_activity_break_reason (CO-3903, read as none when not stated; final pass F-04): maternity or paternity leave counts at an application too (D.8 names it among eligible households); medical leave needs an open case and the caretaker's inability to care for the children (D.9, cccap_caretaker_is_incapacitated, CO-1744, read as false when not stated); the other breaks of 3.112.C are breaks in an activity the household is already authorized for. The leave is verified as the eligible activity is (cccap_requires_verification_of_eligible_activity, CO-1441). Coverage pass 2 C2-2: at a change reported during the eligibility period medical leave counts without D.9's inability to care for the children, since 3.112.C.2 (S2701) makes \"extended verified medical leave\" a temporary break and 3.125.Q.2 (S3252) discontinues care before the redetermination only for reasons \"that do not constitute a temporary break\"; medical leave includes leave to care for a family member (3.103.WWW, S3530). At a redetermination D.9's conjunct is kept (OQ-850). Before the fix a mother on medical leave who could still care for her child was ineligible_activity at a change (probe Z-2)."
open: [OQ-790, OQ-850]
derived: [any, [all, [">", hours_worked, 0], [any, [">=", ["/", [+, wages_gross, cccap_self_employment_net_earnings], hours_worked], federal_minimum_wage], cccap_self_employment_in_launch_period]], [all, cccap_is_in_job_search_activity, cccap_is_receiving_assistance, ["<", cccap_job_search_weeks_used, cccap_job_search_weeks]], [all, cccap_is_in_education_or_training_activity, [any, [not, cccap_education_activity_time_limit_reached], ["=", cccap_determination_type, change_during_eligibility_period]]], cccap_is_in_sud_treatment_activity, [case, [["=", [otherwise, temporary_activity_break_reason, none], maternity_paternity_leave], true], [["=", [otherwise, temporary_activity_break_reason, none], medical_leave], [all, cccap_is_receiving_assistance, [any, ["=", cccap_determination_type, change_during_eligibility_period], [otherwise, cccap_caretaker_is_incapacitated, false]]]], [[in, [otherwise, temporary_activity_break_reason, none], [seasonal_interruption, temporary_layoff, scheduled_education_break]], cccap_is_receiving_assistance], [else, false]]]
sources: [S482, S1015, S1410, S1411, S1412, S2700, S2701, S2702, S2703, S3251, S3252, S3260, S3530]
implemented: engine
tags: [household]
rationale: "Phase-8 fix round (K-7) adds the substance use disorder treatment activity effective July 1, 2026 (S1015). No existing item states the CCCAP eligible-activity test; cccap_low_income_child_care_eligible (CO-987) and cccap_eligibility_status (CO-989) both need it. Final pass F-04 (leave and temporary breaks, 3.111.D.8-9, 3.112.C), F-05 (job search only while enrolled or on transition, G.3.a, G.3.f, 3.117.D) and F-06 (a year per instance of treatment, G.4.a.3)."
tests:
  - {id: CO-984-T1, as_of: "2026-10-01", month: "2026-10", given: {hours_worked: 138, cccap_is_in_job_search_activity: false, cccap_is_attending_high_school: false, cccap_is_in_education_or_training_activity: false, cccap_is_financially_contributing_to_child: true, cccap_is_receiving_assistance: false, county_of_residence: denver, cccap_application_county: denver, wages_gross: 2380, cccap_self_employment_net_earnings: 0}, expect: true}
  - {id: CO-984-T2, as_of: "2026-10-01", month: "2026-10", given: {hours_worked: 0, cccap_is_in_job_search_activity: false, cccap_is_attending_high_school: true, cccap_is_in_education_or_training_activity: true, cccap_is_financially_contributing_to_child: true, cccap_is_receiving_assistance: false, county_of_residence: denver, cccap_application_county: denver, cccap_education_activity_time_limit_reached: false}, expect: true}
  - {id: CO-984-T3, as_of: "2026-10-01", month: "2026-10", given: {hours_worked: 0, cccap_is_in_job_search_activity: false, cccap_is_attending_high_school: false, cccap_is_in_education_or_training_activity: false, cccap_is_adult_caretaker: false}, expect: false}
  # Job search alone, isolated from employment/school (§1.4 gap - cccap_is_in_job_search_activity was false in every prior test here).
  - {id: CO-984-T4, title: "F-05: an enrolled caretaker who lost a job, two of thirteen weeks of job search used", as_of: "2026-10-01", month: "2026-10", given: {hours_worked: 0, cccap_is_in_job_search_activity: true, cccap_is_attending_high_school: false, cccap_is_in_education_or_training_activity: false, cccap_is_financially_contributing_to_child: true, cccap_is_receiving_assistance: true, county_of_residence: denver, cccap_application_county: denver, cccap_job_search_weeks_used: 2}, expect: true}
  - {id: CO-984-T4b, title: "F-05: the same job search at an initial application is not an activity (G.3.a, f)", as_of: "2026-10-01", month: "2026-10", given: {hours_worked: 0, cccap_is_in_job_search_activity: true, cccap_is_receiving_assistance: false, cccap_job_search_weeks_used: 2, cccap_is_in_education_or_training_activity: false, cccap_is_adult_caretaker: false}, expect: false}
  - {id: CO-984-T5, title: "K-7 - adult caretaker in intensive outpatient SUD treatment, October 2026", as_of: "2026-10-01", month: "2026-10", given: {hours_worked: 0, cccap_is_in_job_search_activity: false, cccap_is_attending_high_school: false, cccap_is_in_education_or_training_activity: false, cccap_is_adult_caretaker: true, is_in_sud_treatment_iop_or_higher: true, sud_treatment_start_date: "2026-07-01"}, expect: true}
  - {id: CO-984-T6, title: "K-7 - the same treatment in June 2026, before the activity took effect", as_of: "2026-10-01", month: "2026-06", given: {hours_worked: 0, cccap_is_in_job_search_activity: false, cccap_is_attending_high_school: false, cccap_is_in_education_or_training_activity: false, cccap_is_adult_caretaker: true, is_in_sud_treatment_iop_or_higher: true, sud_treatment_start_date: "2026-03-02"}, expect: false}
  - {id: CO-984-T7, title: "K-7 - no activity and not in treatment", as_of: "2026-10-01", month: "2026-10", given: {hours_worked: 0, cccap_is_in_job_search_activity: false, cccap_is_attending_high_school: false, cccap_is_in_education_or_training_activity: false, cccap_is_adult_caretaker: true, is_in_sud_treatment_iop_or_higher: false}, expect: false}
  - {id: CO-984-T8, title: "Vocabulary fix round (R-2): a caretaker in college (post-secondary education, 3.103.OO) is in an eligible activity", as_of: "2026-10-01", month: "2026-10", given: {hours_worked: 0, cccap_is_in_job_search_activity: false, cccap_is_in_education_or_training_activity: true, cccap_is_financially_contributing_to_child: true, cccap_is_receiving_assistance: false, county_of_residence: denver, cccap_application_county: denver, cccap_education_activity_time_limit_reached: false}, expect: true}
  # 3.111.G.1.b (K-6): $900 for 138 hours is $6.52 an hour, below the $7.25 federal minimum wage.
  - {id: CO-984-T9, as_of: "2026-10-01", month: "2026-10", given: {hours_worked: 138, wages_gross: 900, cccap_self_employment_net_earnings: 0, cccap_self_employment_in_launch_period: false, cccap_is_in_job_search_activity: false, cccap_is_attending_high_school: false, cccap_is_in_education_or_training_activity: false, is_in_sud_treatment_iop_or_higher: false}, expect: false}
  # 3.111.G.2.e: the same earnings from self-employment in its launch period count.
  - {id: CO-984-T10, as_of: "2026-10-01", month: "2026-10", given: {hours_worked: 138, wages_gross: 0, cccap_self_employment_net_earnings: 900, cccap_self_employment_in_launch_period: true, cccap_is_in_job_search_activity: false, cccap_is_attending_high_school: false, cccap_is_in_education_or_training_activity: false}, expect: true}
  # 3.111.G.3.a, g (K-5): thirteen weeks of job search used, no other activity.
  - {id: CO-984-T11, as_of: "2026-10-01", month: "2026-10", given: {hours_worked: 0, cccap_is_in_job_search_activity: true, cccap_job_search_weeks_used: 13, cccap_is_attending_high_school: false, cccap_is_in_education_or_training_activity: false, is_in_sud_treatment_iop_or_higher: false}, expect: false}
  # 3.111.G.4 (K-5): an education activity whose time limit is reached.
  - {id: CO-984-T12, as_of: "2026-10-01", month: "2026-10", given: {hours_worked: 0, cccap_is_in_job_search_activity: false, cccap_is_in_education_or_training_activity: true, cccap_education_activity_time_limit_reached: true, is_in_sud_treatment_iop_or_higher: false, cccap_determination_type: application}, expect: false}
  # 3.111.G.4.a.3: SUD treatment begun in July 2026 counts through June 2027 and not in July 2027 (final pass F-06: the instance began on July 1, 2026).
  - {id: CO-984-T13, as_of: "2027-06-01", month: "2027-06", given: {hours_worked: 0, cccap_is_in_job_search_activity: false, cccap_is_attending_high_school: false, cccap_is_in_education_or_training_activity: false, cccap_is_adult_caretaker: true, is_in_sud_treatment_iop_or_higher: true, sud_treatment_start_date: "2026-07-01"}, expect: true}
  - {id: CO-984-T14, as_of: "2027-07-01", month: "2027-07", given: {hours_worked: 0, cccap_is_in_job_search_activity: false, cccap_is_attending_high_school: false, cccap_is_in_education_or_training_activity: false, cccap_is_adult_caretaker: true, is_in_sud_treatment_iop_or_higher: true, sud_treatment_start_date: "2026-07-01"}, expect: false}
  # Final pass F-06: an instance begun in May 2027 counts for its own year, through April 2028.
  - {id: CO-984-T15, title: "F-06: treatment begun May 10, 2027 still counts in July 2027", as_of: "2027-07-01", month: "2027-07", given: {hours_worked: 0, cccap_is_in_job_search_activity: false, cccap_is_attending_high_school: false, cccap_is_in_education_or_training_activity: false, cccap_is_adult_caretaker: true, is_in_sud_treatment_iop_or_higher: true, sud_treatment_start_date: "2027-05-10"}, expect: true}
  - {id: CO-984-T16, title: "F-06: and not in May 2028, a year after it began", as_of: "2028-05-01", month: "2028-05", given: {hours_worked: 0, cccap_is_in_job_search_activity: false, cccap_is_attending_high_school: false, cccap_is_in_education_or_training_activity: false, cccap_is_adult_caretaker: true, is_in_sud_treatment_iop_or_higher: true, sud_treatment_start_date: "2027-05-10"}, expect: false}
  # Final pass F-04 (3.111.D.8-9, 3.112.C): leave and temporary breaks.
  - {id: CO-984-T17, title: "F-04: a caretaker on verified maternity leave from her job, at an application (D.8)", as_of: "2026-10-01", month: "2026-10", given: {hours_worked: 0, cccap_is_in_job_search_activity: false, cccap_is_in_education_or_training_activity: false, cccap_is_adult_caretaker: true, is_in_sud_treatment_iop_or_higher: false, temporary_activity_break_reason: maternity_paternity_leave}, expect: true}
  - {id: CO-984-T18, title: "F-04: medical leave with an open case, unable to care for the children (D.9)", as_of: "2026-10-01", month: "2026-10", given: {hours_worked: 0, cccap_is_in_job_search_activity: false, cccap_is_in_education_or_training_activity: false, cccap_is_adult_caretaker: true, is_in_sud_treatment_iop_or_higher: false, temporary_activity_break_reason: medical_leave, cccap_is_receiving_assistance: true, cccap_caretaker_is_incapacitated: true}, expect: true}
  - {id: CO-984-T19, title: "F-04: medical leave at an initial application is not an activity (D.9 needs an open case)", as_of: "2026-10-01", month: "2026-10", given: {hours_worked: 0, cccap_is_in_job_search_activity: false, cccap_is_in_education_or_training_activity: false, cccap_is_adult_caretaker: true, is_in_sud_treatment_iop_or_higher: false, temporary_activity_break_reason: medical_leave, cccap_is_receiving_assistance: false}, expect: false}
  - {id: CO-984-T20, title: "F-04: a seasonal worker between seasons, already enrolled (3.112.C.1)", as_of: "2026-10-01", month: "2026-10", given: {hours_worked: 0, cccap_is_in_job_search_activity: false, cccap_is_in_education_or_training_activity: false, cccap_is_adult_caretaker: true, is_in_sud_treatment_iop_or_higher: false, temporary_activity_break_reason: seasonal_interruption, cccap_is_receiving_assistance: true}, expect: true}
  # Coverage round F-06: the caretaker reached the 104-week limit during the period; at a change she stays in her activity until the redetermination (3.114.B.3, 3.125.Q).
  - {id: CO-984-T21, title: "F-06: an education time limit reached during the period, at a change", as_of: "2026-11-01", month: "2026-11", given: {hours_worked: 0, wages_gross: 0, cccap_self_employment_net_earnings: 0, cccap_is_in_job_search_activity: false, cccap_is_in_education_or_training_activity: true, cccap_education_activity_time_limit_reached: true, cccap_determination_type: change_during_eligibility_period}, expect: true}
  - {id: CO-984-T22, title: "F-06: the same caretaker at the redetermination", as_of: "2026-11-01", month: "2026-11", given: {hours_worked: 0, wages_gross: 0, cccap_self_employment_net_earnings: 0, cccap_is_in_job_search_activity: false, cccap_is_receiving_assistance: true, cccap_is_in_education_or_training_activity: true, cccap_education_activity_time_limit_reached: true, cccap_determination_type: redetermination, cccap_is_in_sud_treatment_activity: false, temporary_activity_break_reason: none}, expect: false}
  # Coverage pass 2 C2-2: medical leave at a change keeps the activity (3.112.C.2, 3.125.Q.2); at a redetermination D.9 governs (OQ-850).
  - {id: CO-984-T23, title: "C2-2: medical leave at a change, able to care for the children", as_of: "2026-11-01", month: "2026-11", given: {hours_worked: 0, wages_gross: 0, cccap_self_employment_net_earnings: 0, cccap_is_in_job_search_activity: false, cccap_is_in_education_or_training_activity: false, cccap_is_in_sud_treatment_activity: false, temporary_activity_break_reason: medical_leave, cccap_is_receiving_assistance: true, cccap_caretaker_is_incapacitated: false, cccap_determination_type: change_during_eligibility_period}, expect: true}
  - {id: CO-984-T24, title: "C2-2: the same caretaker at the redetermination", as_of: "2026-11-01", month: "2026-11", given: {hours_worked: 0, wages_gross: 0, cccap_self_employment_net_earnings: 0, cccap_is_in_job_search_activity: false, cccap_is_in_education_or_training_activity: false, cccap_is_in_sud_treatment_activity: false, temporary_activity_break_reason: medical_leave, cccap_is_receiving_assistance: true, cccap_caretaker_is_incapacitated: false, cccap_determination_type: redetermination}, expect: false}
