id: CO-984
name: "CCCAP: caretaker or teen parent is in an eligible activity"
identifier: cccap_caretaker_in_eligible_activity
kind: derived
type: yes/no
scope: person-month
program: CCCAP
meaning: This adult caretaker or teen parent is actively participating in a low-income eligible activity under 8 CCR 1403-1 3.111.B.1, G - employment or self-employment (hours worked), job search, or training/education (for a teen parent, attending school itself qualifies per 3.103.EEEEE); and, from July 1, 2026, for an adult caretaker, enrollment in a licensed substance use disorder treatment program at an intensive outpatient level of care or higher (3.111.G.4.a.3).
precision: "Phase-8 fix round (K-7): the substance use disorder treatment route is read only for a month starting on or after cccap_sud_treatment_activity_start_date (CO-1517) and only for an adult caretaker (cccap_is_adult_caretaker, CO-992), as 3.111.G.4.a.3 states; its one-year-per-instance limit is not modeled (OQ-162). Does not verify the federal-minimum-wage-per-hour test of 3.111.G.1.b/2.d (no minimum wage parameter or per-hour income check is modeled); is_enrolled_in_school stands in for training, basic education, and post-secondary education generally, since this volume has no separate flag for those (see OQ-124)."
open: [OQ-124]
derived: [any, [">", hours_worked, 0], is_in_job_search_activity, is_enrolled_in_school, [all, ["<=", cccap_sud_treatment_activity_start_date, [first_day, [month]]], cccap_is_adult_caretaker, is_in_sud_treatment_iop_or_higher]]
sources: [S482, S1015]
implemented: engine
tags: [household]
rationale: Phase-8 fix round (K-7) adds the substance use disorder treatment activity effective July 1, 2026 (S1015). No existing item states the CCCAP eligible-activity test; cccap_low_income_child_care_eligible (CO-987) and cccap_eligibility_status (CO-989) both need it.
tests:
  - {id: CO-984-T1, as_of: "2026-10-01", month: "2026-10", given: {hours_worked: 138, is_in_job_search_activity: false, is_enrolled_in_school: false}, expect: true}
  - {id: CO-984-T2, as_of: "2026-10-01", month: "2026-10", given: {hours_worked: 0, is_in_job_search_activity: false, is_enrolled_in_school: true}, expect: true}
  - {id: CO-984-T3, as_of: "2026-10-01", month: "2026-10", given: {hours_worked: 0, is_in_job_search_activity: false, is_enrolled_in_school: false, cccap_is_adult_caretaker: false}, expect: false}
  # Job search alone, isolated from employment/school (§1.4 gap - is_in_job_search_activity was false in every prior test here).
  - {id: CO-984-T4, as_of: "2026-10-01", month: "2026-10", given: {hours_worked: 0, is_in_job_search_activity: true, is_enrolled_in_school: false}, expect: true}
  - {id: CO-984-T5, title: "K-7 - adult caretaker in intensive outpatient SUD treatment, October 2026", as_of: "2026-10-01", month: "2026-10", given: {hours_worked: 0, is_in_job_search_activity: false, is_enrolled_in_school: false, cccap_is_adult_caretaker: true, is_in_sud_treatment_iop_or_higher: true}, expect: true}
  - {id: CO-984-T6, title: "K-7 - the same treatment in June 2026, before the activity took effect", as_of: "2026-10-01", month: "2026-06", given: {hours_worked: 0, is_in_job_search_activity: false, is_enrolled_in_school: false, cccap_is_adult_caretaker: true, is_in_sud_treatment_iop_or_higher: true}, expect: false}
  - {id: CO-984-T7, title: "K-7 - no activity and not in treatment", as_of: "2026-10-01", month: "2026-10", given: {hours_worked: 0, is_in_job_search_activity: false, is_enrolled_in_school: false, cccap_is_adult_caretaker: true, is_in_sud_treatment_iop_or_higher: false}, expect: false}
