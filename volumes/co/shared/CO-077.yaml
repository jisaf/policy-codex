id: CO-077
name: Files jointly with spouse
identifier: files_jointly_with_spouse
kind: derived
type: yes/no
scope: person
program: All
meaning: "Whether the person expects to file a joint federal tax return with their spouse for the taxable year in which the Medicaid eligibility determination or renewal is being made: the person holds the symmetric files_jointly_with relationship (volume.yaml) to their spouse, stated once for the couple."
precision: "Meaningful only when the person is married; unknown when the person's relationships are unstated. One edge states it for both spouses, so the spouses cannot disagree."
derived: [exists_related, [files_jointly_with], true]
sources: [S161, S162, S163]
implemented: engine
tags: [ma, magi, household]
rationale: "No existing item carries this fact. 42 CFR 435.603(f)(2)(ii) and 10 CCR 2505-10 8.100.4.E.1.c.ii route a child under 19 to the non-filer household rules when the child is claimed by one parent, lives with both parents, but the parents do not expect to file jointly; this is the fact that test needs. Not yet wired into ma_magi_household_members (CO-500) in this batch - see OQ-42 - but is created now so the identifier is fixed for whoever completes that exception. Dual-entry audit 3.3 (audit fix round): joint filing was stated on each spouse separately, so the spouses could disagree; it is now the symmetric files_jointly_with relationship, stated once, and this item is derived from it."
tests:
  - {id: CO-077-T1, as_of: "2026-10-01", given: {}, others: {p2: {}}, relationships: [[files_jointly_with, p1, p2]], expect: true}
  - {id: CO-077-T2, as_of: "2026-10-01", given: {}, others: {p2: {}}, relationships: [[spouse, p1, p2]], expect: false}
