id: CO-2713
name: Sponsors
identifier: sponsors
kind: derived
type: group of persons
scope: person
program: All
meaning: "The persons who signed this non-citizen's affidavit of support as sponsor or joint sponsor, as the sponsor / sponsored_by relationship states (the sponsor and, where the sponsor's spouse also signed, the co-sponsor spouse)."
precision: "A sponsor is declared as a person of the case whether or not the sponsor lives in the home; a sponsor that is an organization has no person and is sponsor_is_organization. Empty for a person with no sponsor edge; unknown when this person's relationships are unstated."
