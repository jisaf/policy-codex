id: CO-021
name: Is enrolled at least half-time in higher education
identifier: is_enrolled_higher_education_half_time
kind: derived
type: yes/no
scope: person
program: All
meaning: "The person is enrolled at least half time, as the institution defines it, in an institution of higher education (a college or university, or vocational or technical training after high school)."
derived: [all, [in, education_program_type, [postsecondary_career_and_technical, higher_education]], [in, education_enrollment_intensity, [full_time, half_time]]]
sources: [S133, S134, S135]
implemented: engine
tags: [student]
rationale: "A fact the case must supply; no existing item in the Colorado volume carries it (the volume began empty in phase 1, and the mwr volume's facts are not shared across volumes). It is reserved for the SNAP income, deduction, work registration and ABAWD rules of later batches, which read it by this identifier. Same-word audit SW-12 and dual-entry audit 3.18: one real fact (where the person is enrolled and how much) was entered as up to nine program-defined facts that could disagree; each program's definition is now derived from education_program_type, education_enrollment_intensity and expected_program_completion_date (CO-2880 to CO-2882)."
tests:
  - {id: CO-021-T1, title: "College half time", as_of: "2026-11-01", given: {education_program_type: higher_education, education_enrollment_intensity: half_time}, expect: true}
  - {id: CO-021-T2, title: "Not enrolled", as_of: "2026-11-01", given: {education_program_type: none}, expect: false}
