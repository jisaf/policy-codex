id: CO-1720
name: "Is a full-time secondary student expected to finish before age 19"
identifier: is_full_time_secondary_student_finishing_before_nineteen
kind: derived
type: yes/no
scope: person
program: All
meaning: "The person is a full-time student in a secondary school or in the equivalent level of vocational or technical training (including a program leading to high school equivalency), and can reasonably be expected to complete it before turning 19."
precision: "Full time as the school defines it. The fact is the same whichever program reads it: the federal Medicaid dependent-child definition (42 CFR 435.4) and the Colorado Works definition (C.R.S. 26-2-703(9), 9 CCR 2503-6 3.601) state the same test. If not stated, a reader that needs it is unknown."
derived: [all, [in, education_program_type, [secondary, secondary_career_and_technical, high_school_equivalency]], [=, education_enrollment_intensity, full_time], [<, [years_between, date_of_birth, expected_program_completion_date], secondary_student_completion_age_limit]]
sources: [S206, S401, S406]
implemented: engine
tags: [household, age]
link_class: primitive
link_basis: "Full-time secondary or equivalent enrollment expected to end before 19, from stated enrollment facts; Medicaid and Colorado Works state the same test and no program defines it differently."
rationale: "Vocabulary fix round (docs/reviews/vocabulary-reuse.md, R-2): ma_is_dependent_child (CO-544) and cw_is_dependent_child (CO-901) read the shared is_enrolled_in_school, which meant half-time enrollment in any secondary program, so a half-time 18-year-old counted as a dependent child. Both rules state the same full-time test with the expected-completion condition, so one shared fact serves both. Same-word audit SW-12 and dual-entry audit 3.18: one real fact (where the person is enrolled and how much) was entered as up to nine program-defined facts that could disagree; each program's definition is now derived from education_program_type, education_enrollment_intensity and expected_program_completion_date (CO-2880 to CO-2882). Medicaid and Colorado Works state the same test (S206, S406), so it stays unprefixed, as a derived item."
tests:
  - {id: CO-1720-T1, title: "Senior finishing at 18", as_of: "2026-11-01", given: {date_of_birth: "2008-09-01", education_program_type: secondary, education_enrollment_intensity: full_time, expected_program_completion_date: "2027-05-28"}, expect: true}
  - {id: CO-1720-T2, title: "Expected to finish after 19", as_of: "2026-11-01", given: {date_of_birth: "2008-01-01", education_program_type: secondary, education_enrollment_intensity: full_time, expected_program_completion_date: "2027-06-01"}, expect: false}
  - {id: CO-1720-T3, title: "Part-time", as_of: "2026-11-01", given: {date_of_birth: "2009-01-01", education_program_type: secondary, education_enrollment_intensity: half_time, expected_program_completion_date: "2027-05-28"}, expect: false}
