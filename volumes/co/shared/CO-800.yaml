id: CO-800
name: "SSI method: countable resources of the individual"
identifier: ssi_countable_resources_individual
kind: derived
type: money
scope: person
program: All
meaning: "This person's own countable resources by the SSI method (20 CFR 416.1201, 416.1210; 10 CCR 2505-10 8.100.5.M.2), as an individual, not combined with a spouse's, on the determination date: the SSI method's holdings counted in the determination month (ma_ssi_holdings_countable_in_month, CO-5320), each kind of holding as the SSI method's holdings counting table (ma_ssi_holding_treatment_table, CO-5303) treats it: cash, accounts and securities, retirement accounts, real property other than the home, vehicles other than the one automobile used for transportation (416.1218(b)(1)), the cash surrender value of life insurance unless the face value is $1,500 or less (416.1230(a)), and revocable burial funds above the burial fund exclusion (§ 8.100.5.M.2.j); the unspent part of a retroactive SSI or Social Security payment is left out for the nine months following the month of receipt (§ 8.100.5.F.6.c), and the kinds the table excludes are not counted."
precision: "Resource records, Medicaid track H1 (docs/reviews/records-holdings-medicaid.md): read from the holdings records (CO-5300) by the SSI method's one counting table, Medicaid's (decision D6), which Adult Financial burial assistance adopts by its cited link through this item. The home (416.1212) is not counted here; Medicaid's home rules are ma_home_is_countable_resource (CO-4622). Medicaid's own findings (real property for sale or a co-owner's home, CO-4620; income-producing property above its exclusion, CO-4621; the value found available from a trust, an annuity or a life estate) are added by ma_ssi_countable_resources_individual (CO-4623), not here. Irrevocable burial funds (M.2.i), burial spaces (M.2.h), ABLE accounts (M.2.k) and household goods and personal effects (M.2.d-e) are not counted. The burial fund exclusion is the person's own, so each spouse has one (M.2.j). The determination month is stated as [det_month], in every month a determination evaluates: this item is per person, the SSI-method resources held on the determination date, and its readers (CO-801, CO-1405, CO-1225) are per person too; ma_ssi_holdings_countable_in_month reads the holdings valued in any month (OQ-952 asks which month a retroactive month's resources are valued in). A couple excludes one automobile (416.1218(b): \"an individual (and spouse, if any)\"): ssi_countable_resources_couple (CO-801) adds back the smaller spouse's."
derived: [at, ma_ssi_holdings_countable_in_month, [det_month]]
sources: [S2215, S2213, S3400, S3404, S4660]
open: [OQ-952]
implemented: engine
tags: [non_magi, resources]
link_class: adopted_method
link_basis: "The SSI resource methodology (20 CFR 416.1201-416.1266) as SSI-related Medicaid adopts it (10 CCR 2505-10 8.100.5.M) and Adult Financial burial assistance names it (9 CCR 2503-5 3.570.43.D.3.b)."
adopted_by:
  - {program: Medicaid, source: S301}
  - {program: AdultFinancial, source: S721}
accepts_from:
  - {from: ma_ssi_holdings_countable_in_month, class: adopted_method, source: S301}
rationale: "Same-word audit SW-31: every program's countable resources were a supplied, already-counted figure, so each program's resource rules lived outside the ledger, and Adult Financial fell back silently to the SSI figure when its own was unstated (OQ-392). The person's holdings are stated once by asset type; each program derives its countable resources by its own exclusions. The ID and identifier are kept; the amount is now derived. Coverage review NM-1: revocable burial funds had been left out whatever their size; Adult Financial, which reads this figure for burial assistance and sponsors as the SSI method, follows the same 20 CFR 416.1231 rule. Resource records, step H1 (Medicaid; design 3.3, decision D6): read from the holdings records through Medicaid's SSI-method holdings counting table (CO-5303), so a kind of holding is counted or excluded by its row, never by which scalar fact happened to state it."
tests:
  - {id: CO-800-T1, as_of: "2026-10-01", given: {liquid_resources_value: 1200, vehicles_equity_value: 9000, transportation_vehicle_equity_value: 6000, life_insurance_face_value: 1000, life_insurance_cash_surrender_value: 400, holdings: [{kind: bank_account, value: 1200}, {kind: vehicle, value: 6000, amount_owed: 0, used_for_transportation: true}, {kind: vehicle, value: 3000, amount_owed: 0, used_for_transportation: false}, {kind: life_insurance, value: 400, face_value: 1000}]}, expect: 4200}
  - {id: CO-800-T2, as_of: "2026-10-01", given: {liquid_resources_value: 500, life_insurance_face_value: 5000, life_insurance_cash_surrender_value: 900, holdings: [{kind: bank_account, value: 500}, {kind: life_insurance, value: 900, face_value: 5000}]}, expect: 1400}
  - {id: CO-800-T3, as_of: "2026-10-12", title: "NM-1 (X-BURIAL): 1,000 savings and a 10,000 revocable burial trust: 1,000 + 8,500", given: {liquid_resources_value: 1000, revocable_burial_trust_value: 10000, holdings: [{kind: bank_account, value: 1000}, {kind: burial_fund, value: 10000, irrevocable: false}]}, expect: 9500}
  - {id: CO-800-T4, as_of: "2026-10-12", title: "burial trust within the exclusion", given: {liquid_resources_value: 1000, revocable_burial_trust_value: 1400, holdings: [{kind: bank_account, value: 1000}, {kind: burial_fund, value: 1400, irrevocable: false}]}, expect: 1000}
  - {id: CO-800-T5, as_of: "2026-10-12", title: "exclusion reduced by 500 irrevocable funds and a 1,000 policy whose cash value is excluded; 100 of interest left out", given: {liquid_resources_value: 0, revocable_burial_trust_value: 1100, burial_funds_accrued_interest: 100, irrevocable_burial_funds_value: 500, life_insurance_face_value: 1000, life_insurance_cash_surrender_value: 300, holdings: [{kind: life_insurance, value: 300, face_value: 1000}, {kind: burial_fund, value: 500, irrevocable: true}, {kind: burial_fund, value: 1100, irrevocable: false, accrued_interest: 100}]}, expect: 1000}
  - {id: CO-800-T6, as_of: "2026-10-12", title: "a retroactive Social Security payment received in June, 3,000 unspent: left out through March 2027", given: {liquid_resources_value: 4000, retroactive_benefit_payment_unspent_value: 3000, retroactive_benefit_payment_received_date: "2026-06-15", holdings: [{kind: bank_account, value: 1000}, {kind: held_retroactive_ssa_benefit, source_date: "2026-06-15", value: 3000}]}, expect: 1000}
  - {id: CO-800-T7, as_of: "2026-10-12", title: "received ten months before: counted", given: {liquid_resources_value: 4000, retroactive_benefit_payment_unspent_value: 3000, retroactive_benefit_payment_received_date: "2025-12-15", holdings: [{kind: bank_account, value: 1000}, {kind: held_retroactive_ssa_benefit, source_date: "2025-12-15", value: 3000}]}, expect: 4000}
