id: CO-800
name: "SSI method: countable resources of the individual"
identifier: ssi_countable_resources_individual
kind: derived
type: money
scope: person
program: All
meaning: "This person's own countable resources by the SSI method (20 CFR 416.1201, 416.1210; 10 CCR 2505-10 8.100.5.M.2), as an individual, not combined with a spouse's: liquid resources, retirement accounts, real property other than the home, vehicles other than the one used for transportation (416.1218(b)(1)), the cash surrender value of life insurance unless the face value is $1,500 or less (416.1230(a)), and revocable burial funds above the burial fund exclusion (§ 8.100.5.M.2.j): the revocable burial trusts and prepaid burial contracts, less the interest left to accumulate in them, over ssi_burial_funds_exclusion reduced by the irrevocable burial funds and by the face value of life insurance whose cash surrender value is excluded. The unspent part of a retroactive SSI or Social Security payment is left out for the nine months following the month of receipt (§ 8.100.5.F.6.c)."
precision: "The home (416.1212) is not counted here; the Medicaid home equity limit reads home_equity (CO-826), and Medicaid's own home rules are ma_home_is_countable_resource (CO-4622). Irrevocable burial funds (M.2.i) and burial spaces (M.2.h) are not counted. The burial fund exclusion is the person's own, so each spouse has one (M.2.j). Life insurance reduces the exclusion when its face value is within ssi_life_insurance_face_value_exclusion_limit and it has a cash surrender value (term and burial insurance have none, M.2.g). The other 416.1210 exclusions not stated by the holdings facts are not counted. The nine months (ssi_retroactive_benefit_exclusion_months, CO-5403) are the months after the month of receipt (retroactive_benefit_payment_received_date), through the ninth. They are counted to the determination month, stated as [det_month], in every month a determination evaluates: this item is per person, the SSI-method resources held on the determination date, read from per-person holdings (liquid_resources_value, retroactive_benefit_payment_unspent_value) that state one value for the case, and its readers (CO-801, CO-4623, CO-1225) are per person too. Time audit T-8: the window and the holdings it applies to are the same date; a retroactive month whose holdings differ from the determination date's would need the holdings stated by month, which no resource fact carries (OQ-952)."
derived: ["-", [+, [+, [+, liquid_resources_value, [otherwise, retirement_accounts_value, 0]], [+, [otherwise, real_property_other_than_home_equity, 0], [max, 0, ["-", [otherwise, vehicles_equity_value, 0], [otherwise, transportation_vehicle_equity_value, 0]]]]], [case, [[">", [otherwise, life_insurance_face_value, 0], ssi_life_insurance_face_value_exclusion_limit], [otherwise, life_insurance_cash_surrender_value, 0]], [else, 0]], [max, 0, ["-", [max, 0, ["-", [+, [otherwise, revocable_burial_trust_value, 0], [otherwise, revocable_prepaid_burial_contract_value, 0]], [otherwise, burial_funds_accrued_interest, 0]]], [max, 0, ["-", ["-", ssi_burial_funds_exclusion, [otherwise, irrevocable_burial_funds_value, 0]], [case, [[all, ["<=", [otherwise, life_insurance_face_value, 0], ssi_life_insurance_face_value_exclusion_limit], [">", [otherwise, life_insurance_cash_surrender_value, 0], 0]], [otherwise, life_insurance_face_value, 0]], [else, 0]]]]]]], [case, [[all, [">", [otherwise, retroactive_benefit_payment_unspent_value, 0], 0], ["<=", [det_month], [months_after, ssi_retroactive_benefit_exclusion_months, [month_of, [otherwise, retroactive_benefit_payment_received_date, "1900-01-01"]]]]], [min, liquid_resources_value, retroactive_benefit_payment_unspent_value]], [else, 0]]]
sources: [S2215, S2213, S3400, S3404]
open: [OQ-952]
implemented: engine
tags: [non_magi, resources]
link_class: adopted_method
link_basis: "The SSI resource methodology (20 CFR 416.1201-416.1266) as SSI-related Medicaid adopts it (10 CCR 2505-10 8.100.5.M) and Adult Financial burial assistance names it (9 CCR 2503-5 3.570.43.D.3.b)."
adopted_by:
  - {program: Medicaid, source: S301}
  - {program: AdultFinancial, source: S721}
rationale: "Same-word audit SW-31: every program's countable resources were a supplied, already-counted figure, so each program's resource rules lived outside the ledger, and Adult Financial fell back silently to the SSI figure when its own was unstated (OQ-392). The person's holdings are stated once by asset type; each program derives its countable resources by its own exclusions. The ID and identifier are kept; the amount is now derived. Coverage review NM-1: revocable burial funds had been left out whatever their size; Adult Financial, which reads this figure for burial assistance and sponsors as the SSI method, follows the same 20 CFR 416.1231 rule."
