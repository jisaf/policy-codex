id: CO-1357
name: Has unearned income
identifier: has_unearned_income
kind: derived
type: yes/no
scope: person-month
program: All
meaning: "Whether the person receives Social Security, pension, unemployment, child support, Colorado Works or Adult Financial cash assistance, or other unearned income (taxable, non-taxable or tax-exempt interest) in the month."
derived: [">", ["+", social_security_income, pension_income, unemployment_income, child_support_received, tanf_cash_income, adult_financial_cash_income, other_unearned_income_taxable, other_unearned_income_nontaxable, tax_exempt_interest], 0]
sources: [S866, S898, S872]
implemented: engine
tags: [verification, income]
rationale: Adult Financial, Colorado Works, CCCAP and LEAP verify unearned income whenever it is received (S872, S898), and the Medical Assistance ABD rule does the same (S866); no existing item states the presence test program-neutrally (cw_countable_unearned_income, CO-908, and snap_person_unearned_income, CO-331, are program-owned sums).
tests:
  - {id: CO-1357-T1, month: "2026-10", as_of: "2026-10-01", given: {social_security_income: 1420, pension_income: 0, unemployment_income: 0, child_support_received: 0, tanf_cash_income: 0, adult_financial_cash_income: 0, ssi_income: 0, other_unearned_income_nontaxable: 0, other_unearned_income_taxable: 0, tax_exempt_interest: 0}, expect: true}
  - {id: CO-1357-T2, month: "2026-10", as_of: "2026-10-01", given: {social_security_income: 0, pension_income: 0, unemployment_income: 0, child_support_received: 0, tanf_cash_income: 0, adult_financial_cash_income: 0, ssi_income: 0, other_unearned_income_nontaxable: 0, other_unearned_income_taxable: 0, tax_exempt_interest: 0}, expect: false}
