id: CO-1657
name: Citizenship document is on Revenue Rule 5 Appendix A
identifier: citizenship_document_is_on_revenue_appendix_a
kind: derived
type: yes/no
scope: person
program: All
meaning: "Whether the citizenship document the person provided is one 1 CCR 204-30 Rule 5, Appendix A accepts as proof of U.S. citizenship or nationality, the list Colorado Works and LEAP incorporate: the six documents both cash programs name, or Appendix A's other primary evidence (a consular report of birth abroad, a Northern Mariana identification card, an American Indian card), its secondary evidence (a religious record, civil service employment before June 1, 1976, an early school record, a census record, adoption papers, or another document establishing a U.S. place of birth), or a third party's written declaration under penalty of perjury."
precision: Appendix A.C.2 (the applicant's own declaration, "to be used with caution") and D-G (collective naturalization, derivative citizenship) are not separate document types; a case states them as other_document, which reads as not acceptable. Rule 5 was repealed in the current 1 CCR 204-30 (effective 10/15/2026, S1098); the cash and LEAP rules incorporate the earlier edition by date (OQ-376).
derived: [any, citizenship_document_is_primary_evidence, [in, citizenship_verification_document_type, [us_public_birth_certificate, consular_report_of_birth_abroad, northern_mariana_id_card, american_indian_card, religious_record_of_birth, civil_service_employment_before_june_1976, early_school_record, census_record, adoption_decree_showing_us_birth, hospital_record_of_birth, insurance_record_showing_us_birth, medical_record_showing_us_birth, military_record_showing_us_birth, other_us_birth_record, third_party_citizenship_statement]]]
sources: [S1066, S1069, S1070, S895]
implemented: engine
tags: [verification, immigration]
open: [OQ-376]
rationale: "OQ-315 and OQ-319: 3.604.3.I.1 and 3.753.11 incorporate 1 CCR 204-30 Rule 5, Appendix A, now fetched (D-119); citizenship_document_is_primary_evidence (CO-1368) holds only the six documents the cash rules name."
