  - {id: CO-1657-T2, as_of: "2026-10-01", given: {citizenship_verification_document_type: us_passport}, expect: true}
  - {id: CO-1657-T3, as_of: "2026-10-01", given: {citizenship_verification_document_type: citizenship_affidavit}, expect: false}
