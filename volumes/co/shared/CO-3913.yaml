id: CO-3913
name: Unearned income in the thirty days before the application
identifier: unearned_income_prior_thirty_days
kind: derived
type: money
scope: person-month
program: All
meaning: "The gross unearned income the person received in the thirty days before the application date from pensions, unemployment compensation, child support, interest and dividends and the other recurring unearned income, as unearned_income_received_prior_thirty_days (CO-3911) states it: that fact when the case states it; when the case states only calendar-month receipts, the month's pension_income, unemployment_income, child_support_received, other_unearned_income_taxable, other_unearned_income_nontaxable and tax_exempt_interest, less the receipts within them that have their own facts (educational assistance, loan proceeds, expense reimbursements, home energy assistance, tax refunds and credits, federally excluded payments and nonrecurring lump sums), not below zero."
precision: The month read when the thirty-day figure is not stated is the month being determined; each part fact is read as 0 when not stated, as its own precision says. Social Security, SSI, cash assistance and lottery winnings are not part of this figure (CO-3911). Read by CCCAP (cccap_person_unearned_income, CO-3916) and LEAP (leap_person_unearned_income, CO-3926).
derived: [otherwise, unearned_income_received_prior_thirty_days, [max, 0, ["-", ["+", pension_income, unemployment_income, child_support_received, other_unearned_income_taxable, other_unearned_income_nontaxable, tax_exempt_interest], ["+", [otherwise, educational_assistance_received, 0], [otherwise, loan_proceeds_received, 0], [otherwise, expense_reimbursements_received, 0], [otherwise, energy_assistance_received, 0], [otherwise, tax_refunds_and_credits_received, 0], [otherwise, federally_excluded_payments_received, 0], [otherwise, lump_sum_received, 0]]]]]
sources: [S891, S2713]
implemented: engine
tags: [income]
link_class: program_calculation
link_basis: Thirty-day unearned income, less receipts with their own facts, read by CCCAP and LEAP with no rule requiring a shared figure; to split into each program's own item (allowlisted).
rationale: "Final pass F-09 (SW-35): CCCAP (3.111.H.5.b) and LEAP (3.752.22.A) count unearned income received in the thirty days before the application. One item reads the thirty-day receipt for both, and falls back to the month's receipts, less the parts each has its own fact for, when the case states only monthly figures."
tests:
  - {id: CO-3913-T1, month: "2026-12", as_of: "2026-12-01", given: {unearned_income_received_prior_thirty_days: 900, pension_income: 0, unemployment_income: 600, child_support_received: 0, other_unearned_income_taxable: 0, other_unearned_income_nontaxable: 0, tax_exempt_interest: 0, receipts: [{kind: social_security}, {kind: ssi}, {kind: unemployment_compensation, amount: 600}, {kind: colorado_works_cash}, {kind: adult_financial_cash}]}, title: "Unemployment paid every two weeks: three payments of $300 in the thirty days", expect: 900}
  - {id: CO-3913-T2, month: "2026-12", as_of: "2026-12-01", given: {pension_income: 0, unemployment_income: 0, child_support_received: 250, other_unearned_income_taxable: 0, other_unearned_income_nontaxable: 150, tax_exempt_interest: 0, tax_refunds_and_credits_received: 100, receipts: [{kind: social_security}, {kind: ssi}, {kind: child_support, amount: 250}, {kind: colorado_works_cash}, {kind: adult_financial_cash}, {kind: income_tax_refund, amount: 100}, {kind: other_nontaxable, amount: 50}]}, title: "Only the month is stated: $250 of child support and $150 of other income, of which $100 is a tax refund", expect: 300}
  - {id: CO-3913-T3, month: "2026-12", as_of: "2026-12-01", given: {pension_income: 500, unemployment_income: 0, child_support_received: 0, other_unearned_income_taxable: 0, other_unearned_income_nontaxable: 1000, tax_exempt_interest: 0, lump_sum_received: 1000, receipts: [{kind: social_security}, {kind: ssi}, {kind: pension, amount: 500}, {kind: colorado_works_cash}, {kind: adult_financial_cash}, {kind: other_nontaxable, amount: 1000, frequency: once, month: "2025-10"}, {kind: other_nontaxable, amount: 1000, frequency: once, month: "2025-11"}, {kind: other_nontaxable, amount: 1000, frequency: once, month: "2025-12"}, {kind: other_nontaxable, amount: 1000, frequency: once, month: "2026-01"}, {kind: other_nontaxable, amount: 1000, frequency: once, month: "2026-02"}, {kind: other_nontaxable, amount: 1000, frequency: once, month: "2026-03"}, {kind: other_nontaxable, amount: 1000, frequency: once, month: "2026-04"}, {kind: other_nontaxable, amount: 1000, frequency: once, month: "2026-05"}, {kind: other_nontaxable, amount: 1000, frequency: once, month: "2026-06"}, {kind: other_nontaxable, amount: 1000, frequency: once, month: "2026-07"}, {kind: other_nontaxable, amount: 1000, frequency: once, month: "2026-08"}, {kind: other_nontaxable, amount: 1000, frequency: once, month: "2026-09"}, {kind: other_nontaxable, amount: 1000, frequency: once, month: "2026-10"}, {kind: other_nontaxable, amount: 1000, frequency: once, month: "2026-11"}, {kind: other_nontaxable, amount: 1000, frequency: once, month: "2026-12"}, {kind: other_nontaxable, amount: 1000, frequency: once, month: "2027-01"}, {kind: other_nontaxable, amount: 1000, frequency: once, month: "2027-02"}, {kind: other_nontaxable, amount: 1000, frequency: once, month: "2027-03"}]}, title: "Only the month is stated: a $1,000 lump sum is its own fact", expect: 500}
