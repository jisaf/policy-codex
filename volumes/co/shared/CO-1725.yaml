id: CO-1725
name: "Is exempt from the five-year bar (8 U.S.C. 1613(b))"
identifier: is_exempt_from_five_year_bar
kind: derived
type: yes/no
scope: person
program: All
meaning: "Whether the person is in one of the 8 U.S.C. 1613(b) categories to which the five-year limitation on federal means-tested benefits does not apply: a refugee, asylee, person whose deportation is withheld, or Cuban and Haitian entrant, including one who has since adjusted to lawful permanent residence, or a lawful permanent resident admitted as an Amerasian immigrant (b)(1); a veteran or person on active duty, or the spouse or unmarried dependent child of one (b)(2); or a citizen of a freely associated state (b)(3)."
precision: "Does not test that the person is a qualified non-citizen; each program's status rule reads it only for one. The status held before adjustment is status_before_lpr_adjustment (CO-2700), read as none when not stated. Programs that write their own exemption list (Medicaid's 10 CCR 2505-10 8.100.3.G.1.g.iv, ma_is_five_year_bar_exempt, CO-1172; SNAP's 7 U.S.C. 2015(f) exceptions, snap_is_exempt_from_immigrant_waiting_period, CO-306) keep their own items."
derived: [any, [in, immigration_status, [refugee, asylee, deportation_withheld, cuban_haitian_entrant, compact_of_free_association_migrant]], [all, ["=", immigration_status, lawful_permanent_resident], [in, [otherwise, status_before_lpr_adjustment, none], [refugee, asylee, deportation_withheld, cuban_haitian_entrant, amerasian_immigrant]]], has_military_connection]
sources: [S1150, S1151, S402]
implemented: engine
tags: [immigration]
rationale: "Vocabulary fix round (docs/reviews/vocabulary-reuse.md, R-4): the federal exemption list Colorado Works (C.R.S. 26-2-706(1.5)(b)) and Aid to the Needy Disabled (C.R.S. 26-2-111.8(2)(b)) both adopt by reference. It replaces Colorado Works' read of SNAP's own exemption (snap_is_exempt_from_immigrant_waiting_period, CO-306), whose under-18 and pre-1931 prongs are not 1613(b) categories.  OQ-44 fix (product-owner decision of 2026-11-21; docs/reviews/audit-dual-entry.md 3.1; same-word audit SW-18): reads the one immigration_status fact (CO-002), which replaced citizenship_status, lawful_presence_status (CO-084), federal_five_year_bar_exempt_category (CO-1724) and ma_five_year_bar_exempt_category (CO-1170)."
tests:
  - {id: CO-1725-T1, as_of: "2026-10-01", title: "Refugee", given: {immigration_status: refugee}, expect: true}
  - {id: CO-1725-T2, as_of: "2026-10-01", title: "LPR child inside five years: under 18 is not a 1613(b) category", given: {immigration_status: lawful_permanent_resident, has_military_connection: false}, expect: false}
  - {id: CO-1725-T3, as_of: "2026-10-01", title: "LPR admitted as a refugee", given: {immigration_status: lawful_permanent_resident, status_before_lpr_adjustment: refugee}, expect: true}
  - {id: CO-1725-T4, as_of: "2026-10-01", title: "LPR spouse of an active-duty member", given: {immigration_status: lawful_permanent_resident, has_military_connection: true}, expect: true}
  - {id: CO-1725-T5, as_of: "2026-10-01", title: "Deportation withheld", given: {immigration_status: deportation_withheld}, expect: true}
  - {id: CO-1725-T6, as_of: "2026-10-01", title: "LPR admitted as an Amerasian immigrant (1613(b)(1)(E))", given: {immigration_status: lawful_permanent_resident, status_before_lpr_adjustment: amerasian_immigrant, has_military_connection: false}, expect: true}
  - {id: CO-1725-T7, as_of: "2026-10-01", title: "Parolee for a year: qualified, but not a 1613(b) category", given: {immigration_status: parolee_one_year_or_more, has_military_connection: false}, expect: false}
