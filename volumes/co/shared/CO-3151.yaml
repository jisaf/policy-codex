id: CO-3151
name: Declared household income as a percentage of the poverty guideline
identifier: declared_household_income_pct_fpl
kind: derived
type: rate
scope: person
program: All
meaning: "The declared household income (declared_household_income_monthly, CO-092) as a decimal fraction of the monthly federal poverty guideline for the declared household size (declared_household_size, CO-3150): the figure presumptive eligibility (10 CCR 2505-10 § 8.100.4.F.2, § 8.100.3.R.2; 10 CCR 2505-3 § 170.1) and Express Lane (§ 8.100.4.J.1.a.v, J.2.a.v) compare with their standards."
precision: "The annual guideline in force on the determination date for the declared size, divided by 12, as ma_magi_household_income_pct_fpl (CO-504) reads it; the table is read beyond its last row with federal_poverty_guideline_annual_each_additional (P51). Not rounded."
derived: ["/", declared_household_income_monthly, ["/", [lookup_extended, federal_poverty_guideline_annual_table, declared_household_size, federal_poverty_guideline_annual_each_additional], 12]]
sources: [S1501, S1722, S1723, S1745, S55]
implemented: engine
tags: [magi, chp, income]
rationale: "Heavier-definitions audit H-9 (audit fix round 4): the ratio was a supplied fact (attested_household_income_pct_fpl) the site computed; it is derived from the declared amount and size, so the limited family planning size (CO-3152) and the household figure come from one declaration. Program All: Medicaid presumptive eligibility and Express Lane and CHP+ presumptive eligibility read it."
tests:
  - {id: CO-3151-T1, as_of: "2026-11-01", title: "A household of one declaring $1,596 a month: 1,596 / (15,960 / 12) = 1.2", given: {declared_household_income_monthly: 1596, declared_household_size: 1}, expect: 1.2}
  - {id: CO-3151-T2, as_of: "2026-11-01", title: "A household of four declaring $2,750 a month: 2,750 / (33,000 / 12) = 1", given: {declared_household_income_monthly: 2750, declared_household_size: 4}, expect: 1}
