id: CO-3151
name: Declared household income as a percentage of the poverty guideline
identifier: declared_household_income_pct_fpl
kind: derived
type: rate
scope: person-month
program: All
meaning: "The declared household income (declared_household_income_monthly, CO-092) as a decimal fraction of the monthly federal poverty guideline in force in the month for the declared household size (declared_household_size, CO-3150): the figure presumptive eligibility (10 CCR 2505-10 § 8.100.4.F.2, § 8.100.3.R.2; 10 CCR 2505-3 § 170.1) and Express Lane (§ 8.100.4.J.1.a.v, J.2.a.v) compare with their standards."
precision: "The annual guideline in force in the month for the declared size (on the month's first day, or on the determination date in the determination month), divided by 12, as ma_magi_monthly_household_income_pct_fpl (CO-6452) reads it; the table is read beyond its last row with federal_poverty_guideline_annual_each_additional (P51). Not rounded. MAGI close-out, MAGI-SW-1 (2026-11-24; docs/reviews/known-limits.md): per month. A person-scope item is one value per case, so the parameter was read on the determination date in every month that read it (docs/operators.md, Resolution step 2), and a retroactive or application month in another version period of the guideline (federal_poverty_guideline_annual_table, CO-181, and its each-additional figure, CO-182: a version from each January 1) took the determination date's figure. Eligibility in a month is judged on that month (10 CCR 2505-10 § 8.100.4.G.1, S3351: 'any person who is determined to be eligible for Medical Assistance based on MAGI at any time during a calendar month shall be eligible for benefits during the entire month'), and a retroactive month is one in which the person 'met all applicable eligibility requirements' (§ 8.100.3.E.1, S1503), so the figure of a month is the one in force in it: the version in force on the month's first day, or on the determination date in the determination month, as non-MAGI F7-2 made the personal needs allowance (CO-1987). Rules about the determination itself (presumptive eligibility, CO-2439, CO-3155, CO-708) read it in the determination month. Its month-scoped readers are the Express Lane tests (CO-3156, CO-4792) and the qualified-entity presumptive tests (CO-558, CO-559)."
derived: ["/", declared_household_income_monthly, ["/", [lookup_extended, federal_poverty_guideline_annual_table, declared_household_size, federal_poverty_guideline_annual_each_additional], 12]]
sources: [S1501, S1722, S1723, S1745, S55, S1710, S3351, S1503]
implemented: engine
tags: [magi, chp, income]
link_class: primitive
link_basis: "Attested household income over the published monthly poverty guideline for the attested size; arithmetic on attested figures, with no program's counting rules."
rationale: "Heavier-definitions audit H-9 (audit fix round 4): the ratio was a supplied fact (attested_household_income_pct_fpl) the site computed; it is derived from the declared amount and size, so the limited family planning size (CO-3152) and the household figure come from one declaration. Program All: Medicaid presumptive eligibility and Express Lane and CHP+ presumptive eligibility read it."
tests:
  - {id: CO-3151-T1, as_of: "2026-11-01", month: "2026-11", title: "A household of one declaring $1,596 a month: 1,596 / (15,960 / 12) = 1.2", given: {declared_household_income_monthly: 1596, declared_household_size: 1}, expect: 1.2}
  - {id: CO-3151-T2, as_of: "2026-11-01", month: "2026-11", title: "A household of four declaring $2,750 a month: 2,750 / (33,000 / 12) = 1", given: {declared_household_income_monthly: 2750, declared_household_size: 4}, expect: 1}
  # MAGI-SW-1: determined 2026-01-12 with a retroactive December 2025; a household of one declaring $1,596 a month. December 2025 reads the 2025 guideline (CO-181, in force 2025-01-01 to 2026-01-01, S1710): 15,650 for one, 15,650 / 12 = 1,304.1666...; 1,596 / 1,304.1666... = 19,152 / 15,650 = 1.2237699680511... January 2026, the determination month, reads the 2026 guideline (S55): 15,960 / 12 = 1,330; 1,596 / 1,330 = 1.2.
  - {id: CO-3151-T3, as_of: "2026-01-12", month: "2025-12", title: "MAGI-SW-1 (was 1.2): a retroactive December 2025 of a January 2026 determination reads the 2025 guideline: 1,596 / (15,650 / 12) = 1.22377", given: {declared_household_income_monthly: 1596, declared_household_size: 1}, expect: 1.223769968051118}
  - {id: CO-3151-T4, as_of: "2026-01-12", month: "2026-01", title: "MAGI-SW-1: the determination month reads the 2026 guideline: 1,596 / (15,960 / 12) = 1.2", given: {declared_household_income_monthly: 1596, declared_household_size: 1}, expect: 1.2}
