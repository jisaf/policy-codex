id: CO-508
name: "Has held qualified status for the five-year waiting period"
identifier: has_held_qualified_status_five_years
kind: derived
type: yes/no
scope: person
program: All
meaning: "Whether the person has held qualified non-citizen status for at least the waiting period of 8 U.S.C. 1613(a) (qualified_non_citizen_waiting_period_years, five) by the determination date, counted from the date the person first obtained a qualified status or entered the United States in one (qualified_non_citizen_waiting_period_start_date, CO-7820). Met also where the status held now (qualified_status_date, CO-003) has itself been held for the period, which no earlier status can shorten."
precision: "Vocabulary fix round (U-2): renamed from ma_meets_five_year_bar and made program All; snap_meets_immigrant_additional_condition (CO-307), ma_meets_citizenship_requirement (CO-509), meets_public_assistance_citizenship_requirement (CO-905) and meets_public_assistance_citizenship_requirement (CO-905) read it instead of restating the comparison. Coverage pass 7, C7-04 (2026-11-24): Medicaid no longer reads this item; it counts the five years from the first qualified status (ma_has_held_qualified_status_five_years_in_month, CO-7550, from first_qualified_status_date, CO-7770), as 8 U.S.C. 1613(a) (S176) and 10 CCR 2506-1 4.305.B.3.a (S12) run them. This item then still counted from qualified_status_date, the status held now, for its Colorado Works and Adult Financial readers (SNAP writes its own count for the month, CO-307), so a person who held an earlier qualified status restarted the five years at a later adjustment there (KL-CASH-2, docs/reviews/known-limits.md). KL-CASH-2 closed (2026-11-24): the five years are counted from the start of the waiting period (qualified_non_citizen_waiting_period_start_date, CO-7820: the first qualified status, or the status held now where the case shows it is the first), as 1613(a) runs them for Colorado Works, a federal means-tested benefit, as C.R.S. 26-2-706(1.5)(b) (S402: 'has been in a qualified alien status for a period of five years') and 9 CCR 2503-6 3.604.1.B.3 (S407) state them, and as C.R.S. 26-2-111.8(2)(b) (S1151: 'for a period of five years after the date of entry into the United States') states them for the Old Age Pension, Aid to the Needy Disabled and Aid to the Blind, after which (2)(c) (S5300) makes the qualified alien eligible. LPR-EX-PAROLEE (paroled 2019-05-01, lawful permanent resident 2023-03-01; stored households CO-1141 and CO-1142): held from 2024-05-01; before, from 2028-03-01. The first date is required where read, as Medicaid reads it (CO-7550): not needed where the person entered the United States in the status held now or is a lawful permanent resident admitted directly. 9 CCR 2503-5 3.520.68.A (S452) dates the AND bar from 'the qualified non-citizen's date of admission into the United States for legal permanent residence': OQ-1485 records the reading for the cash owner."
derived: [any, ["<=", qualified_non_citizen_waiting_period_years, [years_between, qualified_status_date, [det_date]]], ["<=", qualified_non_citizen_waiting_period_years, [years_between, qualified_non_citizen_waiting_period_start_date, [det_date]]]]
sources: [S173, S176, S12, S402, S407, S1151, S5300]
implemented: engine
tags: [immigration]
open: [OQ-1485]
link_class: primitive
link_basis: "Five years in qualified status, a date difference against the 8 U.S.C. 1613(a) period counted from its start; no program defines it differently."
rationale: "No existing Medicaid item states the five-year bar test; ma_meets_citizenship_requirement (CO-509) needs it for a qualified non-citizen who is not otherwise exempted. nearest: [CO-104] acknowledges the cross-program parameter reuse the phase-3 brief directs (create a Medicaid parameter only if the value or citation differs; 8 U.S.C. 1613's five years does not differ from SNAP's read of the same statute)."
nearest: [CO-104]
tests:
  - {id: CO-508-T1, as_of: "2026-10-01", given: {qualified_status_date: "2015-01-01"}, expect: true}
  - {id: CO-508-T2, as_of: "2026-10-01", title: "KL-CASH-2: entered the United States in the status held now (us_entry_date stated, the first status): 2024-01-01 to 2026-10-01, 2 years: not held", given: {qualified_status_date: "2024-01-01", us_entry_date: "2024-01-01"}, expect: false}
  # KL-CASH-2 (LPR-EX-PAROLEE): paroled into the United States 2019-05-01 (a qualified alien from that day, 8 U.S.C. 1641(b)(4), S1900), lawful permanent resident 2023-03-01 (status_before_lpr_adjustment other).
  - {id: CO-508-T3, as_of: "2026-11-10", title: "KL-CASH-2 (was false): from 2019-05-01 (the first qualified status) to 2026-11-10: 7 whole years >= 5: held; from the LPR date 2023-03-01 only 3", given: {immigration_status: lawful_permanent_resident, qualified_status_date: "2023-03-01", us_entry_date: "2019-05-01", status_before_lpr_adjustment: other, first_qualified_status_date: "2019-05-01"}, expect: true}
  - {id: CO-508-T4, as_of: "2026-11-10", title: "KL-CASH-2: the same without the first date stated: the LPR status, 3 years (2023-03-01 to 2026-11-10), does not settle it: cannot determine (was false)", given: {immigration_status: lawful_permanent_resident, qualified_status_date: "2023-03-01", us_entry_date: "2019-05-01", status_before_lpr_adjustment: other}, expect: unknown}
  - {id: CO-508-T5, as_of: "2024-04-30", title: "KL-CASH-2: determined 2024-04-30: 2019-05-01 to 2024-04-30 is 4 whole years (the fifth anniversary is 2024-05-01): not held", given: {immigration_status: lawful_permanent_resident, qualified_status_date: "2023-03-01", us_entry_date: "2019-05-01", status_before_lpr_adjustment: other, first_qualified_status_date: "2019-05-01"}, expect: false}
  - {id: CO-508-T6, as_of: "2024-05-01", title: "KL-CASH-2: determined 2024-05-01, the fifth anniversary: 5 years: held (was false: 2023-03-01 to 2024-05-01 is 1 year)", given: {immigration_status: lawful_permanent_resident, qualified_status_date: "2023-03-01", us_entry_date: "2019-05-01", status_before_lpr_adjustment: other, first_qualified_status_date: "2019-05-01"}, expect: true}
  - {id: CO-508-T7, as_of: "2026-11-10", title: "KL-CASH-2: a lawful permanent resident admitted directly on 2023-03-01 (status_before_lpr_adjustment none), entry date not stated: the first status is the LPR status, 3 years: not held, no first date needed", given: {immigration_status: lawful_permanent_resident, qualified_status_date: "2023-03-01", status_before_lpr_adjustment: none}, expect: false}
  - {id: CO-508-T8, as_of: "2026-11-10", title: "KL-CASH-2: an LPR since 2020-01-15 whose earlier status is not stated: the LPR status alone, 2020-01-15 to 2026-11-10, 6 years: held, whatever the earlier status", given: {immigration_status: lawful_permanent_resident, qualified_status_date: "2020-01-15"}, expect: true}
  # Coverage verification 7 follow-up (V7-8): CO-7820 reads non_qualified_status (a student visa before the permanent residence: not a qualified alien, 8 U.S.C. 1641(b), S1900) as none.
  - {id: CO-508-T9, as_of: "2026-11-10", title: "V7-8: an LPR since 2023-03-01 who entered 2019-05-01 on a student visa (non_qualified_status), no first date: from 2023-03-01 to 2026-11-10, 3 years: not held (was cannot determine)", given: {immigration_status: lawful_permanent_resident, qualified_status_date: "2023-03-01", us_entry_date: "2019-05-01", status_before_lpr_adjustment: non_qualified_status}, expect: false}
  - {id: CO-508-T10, as_of: "2026-11-10", title: "V7-8: the same LPR since 2021-11-10: 2021-11-10 to 2026-11-10, 5 years: held (the status held now, the first arm)", given: {immigration_status: lawful_permanent_resident, qualified_status_date: "2021-11-10", us_entry_date: "2019-05-01", status_before_lpr_adjustment: non_qualified_status}, expect: true}
