id: CO-4077
name: Infrequent or irregular income in the calendar quarter
identifier: infrequent_or_irregular_income_in_quarter
kind: derived
type: money
scope: person-month
program: All
meaning: The person's infrequent or irregular income (infrequent_or_irregular_income_received, CO-3822) over the calendar quarter (January-March, April-June, July-September, October-December) that contains the month, each month's receipt added, a month not stated being 0.
precision: "The quarter is found from the month's calendar number, as af_excluded_infrequent_income (CO-3827) finds it: its place in the quarter is that number less one, less three times the whole quarters before it. Each program compares the total with its own limit."
derived: [sum_months, [months_from_to, [months_before, ["-", ["-", [month_of_year, [month]], 1], ["*", 3, ["-", 0, [ceil, ["-", 0, ["/", ["-", [month_of_year, [month]], 1], 3]]]]]], [month]], [months_after, ["-", 2, ["-", ["-", [month_of_year, [month]], 1], ["*", 3, ["-", 0, [ceil, ["-", 0, ["/", ["-", [month_of_year, [month]], 1], 3]]]]]]], [month]]], [at, [otherwise, infrequent_or_irregular_income_received, 0], [that_month]]]
sources: [S2858, S2608]
implemented: engine
tags: [income]
link_class: primitive
link_basis: The calendar-quarter sum of one supplied receipt; arithmetic over dates, each program applying its own exclusion limit to it.
rationale: "Second-pass review P2 (J.28): CCCAP's irregular-income exclusion (cccap_excluded_irregular_income, CO-4076) needs the quarter's total, which Adult Financial computes inline (CO-3827); the total is a neutral figure of its own so the next program reads it rather than a third copy."
nearest: [CO-3827]
tests:
  - {id: CO-4077-T1, month: "2026-12", as_of: "2026-12-01", given: {}, title: "$60 in October and $40 in November, read in December", persons: {p1: {months: {"2026-10": {infrequent_or_irregular_income_received: 60}, "2026-11": {infrequent_or_irregular_income_received: 40}}, facts: {receipts: [{kind: social_security}, {kind: ssi}, {kind: pension}, {kind: unemployment_compensation}, {kind: child_support}, {kind: colorado_works_cash}, {kind: adult_financial_cash}, {kind: tax_exempt_interest}, {kind: other_taxable}, {kind: other_nontaxable}, {kind: other_nontaxable, amount: 60, irregular: true, month: "2026-10"}, {kind: other_nontaxable, amount: 40, irregular: true, month: "2026-11"}]}}}, expect: 100}
  - {id: CO-4077-T2, month: "2026-10", as_of: "2026-10-01", given: {}, title: "$60 in September is in the previous quarter", persons: {p1: {months: {"2026-09": {infrequent_or_irregular_income_received: 60}, "2026-10": {infrequent_or_irregular_income_received: 10}}, facts: {receipts: [{kind: social_security}, {kind: ssi}, {kind: pension}, {kind: unemployment_compensation}, {kind: child_support}, {kind: colorado_works_cash}, {kind: adult_financial_cash}, {kind: tax_exempt_interest}, {kind: other_taxable}, {kind: other_nontaxable}, {kind: other_nontaxable, amount: 60, irregular: true, month: "2026-09"}, {kind: other_nontaxable, amount: 10, irregular: true, month: "2026-10"}]}}}, expect: 10}
