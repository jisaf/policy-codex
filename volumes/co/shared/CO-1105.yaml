id: CO-1105
name: Is an inmate of a public institution
identifier: is_inmate_of_public_institution
kind: derived
type: yes/no
scope: person-month
program: All
meaning: "Whether, this month, the person is an inmate of a public institution as 42 CFR 435.1010 defines it, the definition Medicaid and CHP+ read: living in an institution that is the responsibility of a governmental unit or under its administrative control, other than a medical institution, an intermediate care facility, a publicly operated community residence serving no more than 16 residents, or a child-care institution for children with title IV-E foster care maintenance payments; and not in a public educational or vocational training institution to secure education or training, or in the institution for a temporary period pending other arrangements appropriate to the person's needs."
precision: "Read from the neutral setting facts (CO-3330 to CO-3332, CO-3336) as of the determination date. A correctional or holding facility is never a community residence (435.1010, (b)(3)). CHP+'s carve-out for the 90 days before release under the Reentry Demonstration Initiative is chp_is_in_reentry_period (CO-1749), read by the CHP+ rules. Adult Financial's bar is narrower: af_is_inmate_of_correctional_institution (CO-3343). Coverage review F-15: a community corrections participant or halfway-house resident with freedom of movement and association (is_in_community_corrections_with_freedom_of_movement, CO-4566) is not an inmate, since 10 CCR 2505-10 § 8.100.3.G.1.b.i.5 (S3361) enrolls such persons without the incarceration limit of G.1.b.ii."
derived: [all, [not, [in, residence_setting_type, [private_dwelling, room_and_board, hotel, commercial_property]]], residence_setting_operated_by_government, [not, resides_in_medical_institution], [not, ["=", residence_setting_type, educational_or_vocational_institution]], [not, [all, [in, residence_setting_type, [assisted_living_residence, group_home, host_home, other_long_term_care_facility, substance_use_treatment_facility, child_care_institution, other_institution]], ["<=", residence_setting_bed_count, public_community_residence_max_residents]]], [not, [all, ["=", residence_setting_type, child_care_institution], ["=", child_welfare_payment_type, title_iv_e_foster_care]]], [not, [otherwise, residence_setting_stay_is_temporary_pending_other_arrangements, false]], [not, [otherwise, is_in_community_corrections_with_freedom_of_movement, false]]]
sources: [S1956, S2202, S653, S3361]
implemented: engine
tags: [chp, ma]
rationale: "Same-word audit SW-20 and SW-21, dual-entry audit 2.10 and 3.20: where a person lives was stated by thirteen facts, each one program's classification (SNAP's meals institution, Medicaid's medical institution and IMD, the OAP Health Care exclusion, Adult Financial's three facility lists, LEAP's living arrangements, the inmate fact), which could contradict one another. One neutral description of the setting, in the terms of 42 CFR 435.1010 (S2201, S2202), is stated once; each program's test is a derived item. Same-word SW-21: the fact had narrowed 435.1010's inmate to correctional and juvenile-justice facilities; it is now 435.1010's definition, fetched (D-190), with each exception in it, and Adult Financial's own correctional-institution bar is its own item."
tests:
  - {id: CO-1105-T1, title: "County jail", month: "2026-10", as_of: "2026-10-01", given: {residence_setting_type: correctional_facility, residence_setting_operated_by_government: true}, expect: true}
  - {id: CO-1105-T2, title: "A state hospital is a medical institution, not a public institution", month: "2026-10", as_of: "2026-10-01", given: {residence_setting_type: psychiatric_hospital, residence_setting_operated_by_government: true}, expect: false}
  - {id: CO-1105-T3, title: "A public group home of 12 residents is a community residence", month: "2026-10", as_of: "2026-10-01", given: {residence_setting_type: group_home, residence_setting_operated_by_government: true, residence_setting_bed_count: 12}, expect: false}
  - {id: CO-1105-T4, title: "A public group facility of 40 residents", month: "2026-10", as_of: "2026-10-01", given: {residence_setting_type: other_institution, residence_setting_operated_by_government: true, residence_setting_bed_count: 40}, expect: true}
  - {id: CO-1105-T5, title: "Exception (b): temporary, pending other arrangements", month: "2026-10", as_of: "2026-10-01", given: {residence_setting_type: correctional_facility, residence_setting_operated_by_government: true, residence_setting_stay_is_temporary_pending_other_arrangements: true}, expect: false}
  - {id: CO-1105-T6, title: "A private prison is not a public institution", month: "2026-10", as_of: "2026-10-01", given: {residence_setting_type: correctional_facility, residence_setting_operated_by_government: false}, expect: false}
  - {id: CO-1105-T7, month: "2026-10", as_of: "2026-10-01", given: {residence_setting_type: private_dwelling}, expect: false}
  - {id: CO-1105-T8, title: "Coverage review F-15: a government halfway house of 40 beds, with freedom of movement (G.1.b.i.5)", month: "2026-11", as_of: "2026-11-10", given: {residence_setting_type: correctional_facility, residence_setting_operated_by_government: true, resides_in_medical_institution: false, residence_setting_stay_is_temporary_pending_other_arrangements: false, is_in_community_corrections_with_freedom_of_movement: true}, expect: false}
