id: CO-1359
name: Claims lawful immigration status
identifier: claims_lawful_immigration_status
kind: derived
type: yes/no
scope: person
program: All
meaning: Whether the person is a non-citizen who has declared a lawful immigration status (any status other than undocumented), the declaration SAVE verification and the reasonable opportunity period attach to.
derived: [in, citizenship_status, [lawful_permanent_resident, refugee, asylee, cuban_haitian_entrant, compact_of_free_association_migrant, other_qualified_non_citizen, other_non_qualified_non_citizen]]
sources: [S802, S852, S873, S887, S896]
implemented: engine
tags: [verification, immigration]
rationale: Every program verifies a declared immigration status through SAVE (S802, S852, S873, S887, S896); no existing item states the declaration program-neutrally.
tests:
  - {id: CO-1359-T1, as_of: "2026-10-01", given: {citizenship_status: lawful_permanent_resident}, expect: true}
  - {id: CO-1359-T2, as_of: "2026-10-01", given: {citizenship_status: undocumented}, expect: false}
  - {id: CO-1359-T3, as_of: "2026-10-01", given: {citizenship_status: citizen}, expect: false}
