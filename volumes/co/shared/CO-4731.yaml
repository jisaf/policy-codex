id: CO-4731
name: Lives with a spouse
identifier: lives_with_spouse
kind: derived
type: yes/no
scope: person
program: All
meaning: "This person lives in the same home as a person who is this person's spouse: some person in lives_with (CO-1925) is this person's spouse."
precision: "Unknown where this person's dwelling_id is not stated, as lives_with is; a reader says how it reads the absence (rule 12). A spouse with whom no spouse relationship is stated in the case is not seen."
derived: [exists, lives_with, [otherwise, [rel, [spouse], [P]], false]]
sources: [S1632]
implemented: engine
tags: [household]
rationale: "Coverage review 2 of Adult Financial, G-5: 3.534.D.2.B deducts for \"the sponsor's spouse living in the same household with the sponsor\"; sponsor_has_spouse_in_household (CO-2388) tested only that the sponsor had a spouse. Whether a person lives with their spouse is asked of a person other than the one evaluated (the sponsor's spouse), so it is its own item that a reader evaluates on that person."
tests:
  - {id: CO-4731-T1, title: "Husband in the same home", as_of: "2026-10-01", given: {dwelling_id: home_a}, others: {p2: {dwelling_id: home_a}}, relationships: [[spouse, p1, p2]], expect: true}
  - {id: CO-4731-T2, title: "Husband in another home", as_of: "2026-10-01", given: {dwelling_id: home_a}, others: {p2: {dwelling_id: home_b}}, relationships: [[spouse, p1, p2]], expect: false}
  - {id: CO-4731-T3, title: "A cousin in the same home is not a spouse", as_of: "2026-10-01", given: {dwelling_id: home_a}, others: {p2: {dwelling_id: home_a}}, relationships: [[other_relative, p1, p2]], expect: false}
