id: CO-7820
name: "Start of the qualified non-citizen waiting period"
identifier: qualified_non_citizen_waiting_period_start_date
kind: derived
type: calendar date
scope: person
program: All
meaning: "The date from which the five years of 8 U.S.C. 1613(a) are counted: the date the person first obtained a qualified non-citizen status or entered the United States in one, whatever status the person holds now. It is the date of the status held now (qualified_status_date, CO-003) where the case shows that status is the first: the person entered the United States in it (us_entry_date on or after qualified_status_date), or is a lawful permanent resident admitted directly (status_before_lpr_adjustment none); otherwise it is the date of the first qualified status (first_qualified_status_date, CO-7770)."
precision: "KL-SNAP-2 and KL-CASH-2 (docs/reviews/known-limits.md; 2026-11-24): the reading Medicaid's five-year count took in coverage pass 7, C7-04 (ma_has_held_qualified_status_five_years_in_month, CO-7550), stated once for the other readers of the five years: SNAP (snap_meets_immigrant_additional_condition CO-307, snap_requires_verification_of_qualifying_quarters CO-3736, snap_requires_verification_of_military_connection CO-3738, and the 1931 arm of snap_is_exempt_from_waiting_period_other_than_military CO-3713) and the cash programs (has_held_qualified_status_five_years CO-508, read through meets_public_assistance_citizenship_requirement CO-905). 8 U.S.C. 1613(a) (S176) runs the five years 'beginning on the date of the alien's entry into the United States with a status within the meaning of the term \"qualified alien\"', 8 U.S.C. 1612(a)(2)(L) (S22) for SNAP 'beginning on the date of the alien's entry into the United States', and 10 CCR 2506-1 4.305.B.3.a (S12) 'on the date the non-citizen obtains status as a qualified non-citizen or enters the U.S. in a qualifying status': a later adjustment (a parolee of a year or more, a battered non-citizen or a conditional entrant who became a lawful permanent resident) does not restart them. No qualified status is held in the United States before entering it, so an entry on or after the status date shows the status held now is the first; an unstated entry date only leaves that shortcut unread. Required where read (decision 4 of 2026-11-23): where the case does not show the status held now is the first, first_qualified_status_date is read with no default, and so is status_before_lpr_adjustment for a lawful permanent resident who did not enter in the status (C7-09's reading); either one not stated is cannot determine here. Its readers also count from qualified_status_date, so a person whose status held now has itself been held five years needs neither."
derived: [case, [[otherwise, ["<=", qualified_status_date, us_entry_date], false], qualified_status_date], [[all, ["=", immigration_status, lawful_permanent_resident], ["=", status_before_lpr_adjustment, none]], qualified_status_date], [else, first_qualified_status_date]]
sources: [S176, S21, S22, S12, S1900]
implemented: engine
tags: [immigration]
link_class: primitive
link_basis: "The start of the 8 U.S.C. 1613(a) period, the first entry with or grant of a qualified status, as the statute states it; every reader applies the statute as written."
nearest: [CO-7770, CO-7550]
rationale: "KL-SNAP-2 and KL-CASH-2 (known limits recorded by the MAGI coverage pass 7 fix round, C7-04): SNAP's five-year test and its verification readers, and the cash programs' shared five-year test (CO-508), counted the five years from qualified_status_date, the status held now, so a lawful permanent resident who was paroled into the United States (a qualified alien under 8 U.S.C. 1641(b)(4), S1900) restarted them at the adjustment (LPR-EX-PAROLEE, stored household CO-1127: paroled 2019-05-01, LPR 2023-03-01: SNAP and Colorado Works counted three years in November 2026, though the five years ended 2024-05-01). Medicaid's CO-7550 writes the same choice of date inside its month test; this item states the date once, a neutral primitive, so the five readers outside Medicaid do not each restate it. first_qualified_status_date (CO-7770, the acknowledged nearest) is the supplied date of the first status, which this item reads only where the case does not already show it."
tests:
  # KL-SNAP-2, KL-CASH-2 (LPR-EX-PAROLEE): paroled into the United States 2019-05-01 for two years (8 U.S.C. 1641(b)(4), S1900), adjusted to lawful permanent resident 2023-03-01.
  - {id: CO-7820-T1, as_of: "2026-11-10", title: "LPR-EX-PAROLEE: qualified_status_date 2023-03-01 is after us_entry_date 2019-05-01 (not entered in it); an LPR whose earlier status is other (not admitted directly): the first date, 2019-05-01", given: {immigration_status: lawful_permanent_resident, qualified_status_date: "2023-03-01", us_entry_date: "2019-05-01", status_before_lpr_adjustment: other, first_qualified_status_date: "2019-05-01"}, expect: "2019-05-01"}
  - {id: CO-7820-T2, as_of: "2026-11-10", title: "LPR-EX-PAROLEE without the first date stated: required where read, cannot determine", given: {immigration_status: lawful_permanent_resident, qualified_status_date: "2023-03-01", us_entry_date: "2019-05-01", status_before_lpr_adjustment: other}, expect: unknown}
  - {id: CO-7820-T3, as_of: "2026-11-10", title: "A lawful permanent resident admitted directly on 2023-03-01 (status_before_lpr_adjustment none), entry date not stated: the LPR status is the first: 2023-03-01, no first date needed", given: {immigration_status: lawful_permanent_resident, qualified_status_date: "2023-03-01", status_before_lpr_adjustment: none}, expect: "2023-03-01"}
  - {id: CO-7820-T4, as_of: "2026-11-10", title: "A parolee who entered the United States paroled on 2023-03-01 (us_entry_date = qualified_status_date, 2023-03-01 <= 2023-03-01): the status held now is the first: 2023-03-01, no first date needed", given: {immigration_status: parolee_one_year_or_more, qualified_status_date: "2023-03-01", us_entry_date: "2023-03-01"}, expect: "2023-03-01"}
  - {id: CO-7820-T5, as_of: "2026-11-10", title: "An LPR since 2023-03-01 who entered 2019-05-01, the earlier status not stated: whether the LPR status is the first cannot be told: cannot determine", given: {immigration_status: lawful_permanent_resident, qualified_status_date: "2023-03-01", us_entry_date: "2019-05-01", first_qualified_status_date: "2019-05-01"}, expect: unknown}
  - {id: CO-7820-T6, as_of: "2026-11-10", title: "A battered non-citizen (the status held now) who entered 2018-02-01 and obtained the status 2022-06-01, no first date stated: not entered in it, not an LPR: the first date is read, not stated: cannot determine", given: {immigration_status: battered_non_citizen, qualified_status_date: "2022-06-01", us_entry_date: "2018-02-01"}, expect: unknown}
