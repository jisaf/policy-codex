id: CO-7820
name: "Start of the qualified non-citizen waiting period"
identifier: qualified_non_citizen_waiting_period_start_date
kind: derived
type: calendar date
scope: person
program: All
meaning: "The date from which the five years of 8 U.S.C. 1613(a) are counted: the date the person first obtained a qualified non-citizen status or entered the United States in one, whatever status the person holds now. It is the date of the status held now (qualified_status_date, CO-003) where the person entered the United States in it (us_entry_date on or after qualified_status_date); otherwise the date of the first qualified status where the case states it (first_qualified_status_date, CO-7770); otherwise the date of the status held now where the case shows that status is the first: a lawful permanent resident admitted directly or adjusted from a status in which the person was not a qualified alien (status_before_lpr_adjustment none or non_qualified_status), or another qualified non-citizen who held no qualified status before the one held now (has_held_earlier_qualified_status false, CO-7890); otherwise the first date, which is then required."
precision: "KL-SNAP-2 and KL-CASH-2 (docs/reviews/known-limits.md; 2026-11-24): the reading Medicaid's five-year count took in coverage pass 7, C7-04 (ma_has_held_qualified_status_five_years_in_month, CO-7550), stated once for the other readers of the five years: SNAP (snap_meets_immigrant_additional_condition CO-307, snap_requires_verification_of_qualifying_quarters CO-3736, snap_requires_verification_of_military_connection CO-3738, and the 1931 arm of snap_is_exempt_from_waiting_period_other_than_military CO-3713) and the cash programs (has_held_qualified_status_five_years CO-508, read through meets_public_assistance_citizenship_requirement CO-905). 8 U.S.C. 1613(a) (S176) runs the five years 'beginning on the date of the alien's entry into the United States with a status within the meaning of the term \"qualified alien\"', 8 U.S.C. 1612(a)(2)(L) (S22) for SNAP 'beginning on the date of the alien's entry into the United States', and 10 CCR 2506-1 4.305.B.3.a (S12) 'on the date the non-citizen obtains status as a qualified non-citizen or enters the U.S. in a qualifying status': a later adjustment (a parolee of a year or more, a battered non-citizen or a conditional entrant who became a lawful permanent resident) does not restart them. No qualified status is held in the United States before entering it, so an entry on or after the status date shows the status held now is the first; an unstated entry date only leaves that shortcut unread. Required where read (decision 4 of 2026-11-23): where the case does not show the status held now is the first, first_qualified_status_date is read with no default, and so is status_before_lpr_adjustment for a lawful permanent resident who did not enter in the status and states no first date (C7-09's reading), and has_held_earlier_qualified_status for any other qualified non-citizen who did not enter in the status and states no first date (KL-SNAP-3); one not stated where read is cannot determine here. Its readers also count from qualified_status_date, so a person whose status held now has itself been held five years needs neither. Coverage verification 7 follow-up (V7-8; 2026-11-24): a lawful permanent resident whose earlier status is non_qualified_status (a nonimmigrant admission such as a work, student or fiance visa, or no lawful status: not a qualified alien under 8 U.S.C. 1641(b), S1900) first obtained a qualified status when granted permanent residence, so the five years start at qualified_status_date, as for none and as Medicaid's CO-7550 reads it; before, this item read none alone that way and asked first_qualified_status_date for non_qualified_status (stated equal to qualified_status_date, or cannot determine). Close-out verification F1, the arm left (KL-SNAP-3, docs/reviews/known-limits.md; 2026-11-24): a qualified non-citizen who is not a lawful permanent resident and whose only qualified status began after entry (a battered non-citizen found so in 2022 who entered in no status in 2018) had no fact saying the status held now is the first, so the start was cannot determine unless first_qualified_status_date was stated with the same date again; has_held_earlier_qualified_status (CO-7890) false now gives qualified_status_date (1613(a): the five years begin on the date the person first held a qualified status, which is then the status held now). A first_qualified_status_date the case states is the start wherever the entry does not settle it, before the shortcuts are read: it is the date the shortcuts stand in for, so a lawful permanent resident who states it and not the earlier status has a start (was cannot determine, CO-7820-T5). Medicaid's five-year count reads this item too (ma_has_held_qualified_status_five_years_in_month, CO-7550), in place of the same choice written inside it."
derived: [case, [[otherwise, ["<=", qualified_status_date, us_entry_date], false], qualified_status_date], [[not, [unknown, first_qualified_status_date]], first_qualified_status_date], [["=", immigration_status, lawful_permanent_resident], [case, [[in, status_before_lpr_adjustment, [none, non_qualified_status]], qualified_status_date], [else, first_qualified_status_date]]], [[not, has_held_earlier_qualified_status], qualified_status_date], [else, first_qualified_status_date]]
sources: [S176, S21, S22, S12, S1900, S1901]
implemented: engine
tags: [immigration]
link_class: primitive
link_basis: "The start of the 8 U.S.C. 1613(a) period, the first entry with or grant of a qualified status, as the statute states it; every reader applies the statute as written."
nearest: [CO-7770, CO-7550, CO-7890]
rationale: "KL-SNAP-2 and KL-CASH-2 (known limits recorded by the MAGI coverage pass 7 fix round, C7-04): SNAP's five-year test and its verification readers, and the cash programs' shared five-year test (CO-508), counted the five years from qualified_status_date, the status held now, so a lawful permanent resident who was paroled into the United States (a qualified alien under 8 U.S.C. 1641(b)(4), S1900) restarted them at the adjustment (LPR-EX-PAROLEE, stored household CO-1127: paroled 2019-05-01, LPR 2023-03-01: SNAP and Colorado Works counted three years in November 2026, though the five years ended 2024-05-01). Medicaid's CO-7550 writes the same choice of date inside its month test; this item states the date once, a neutral primitive, so the five readers outside Medicaid do not each restate it. first_qualified_status_date (CO-7770, the acknowledged nearest) is the supplied date of the first status, which this item reads only where the case does not already show it."
tests:
  # KL-SNAP-2, KL-CASH-2 (LPR-EX-PAROLEE): paroled into the United States 2019-05-01 for two years (8 U.S.C. 1641(b)(4), S1900), adjusted to lawful permanent resident 2023-03-01.
  - {id: CO-7820-T1, as_of: "2026-11-10", title: "LPR-EX-PAROLEE: qualified_status_date 2023-03-01 is after us_entry_date 2019-05-01 (not entered in it); an LPR whose earlier status is other (not admitted directly): the first date, 2019-05-01", given: {immigration_status: lawful_permanent_resident, qualified_status_date: "2023-03-01", us_entry_date: "2019-05-01", status_before_lpr_adjustment: other, first_qualified_status_date: "2019-05-01"}, expect: "2019-05-01"}
  - {id: CO-7820-T2, as_of: "2026-11-10", title: "LPR-EX-PAROLEE without the first date stated: required where read, cannot determine", given: {immigration_status: lawful_permanent_resident, qualified_status_date: "2023-03-01", us_entry_date: "2019-05-01", status_before_lpr_adjustment: other}, expect: unknown}
  - {id: CO-7820-T3, as_of: "2026-11-10", title: "A lawful permanent resident admitted directly on 2023-03-01 (status_before_lpr_adjustment none), entry date not stated: the LPR status is the first: 2023-03-01, no first date needed", given: {immigration_status: lawful_permanent_resident, qualified_status_date: "2023-03-01", status_before_lpr_adjustment: none}, expect: "2023-03-01"}
  - {id: CO-7820-T4, as_of: "2026-11-10", title: "A parolee who entered the United States paroled on 2023-03-01 (us_entry_date = qualified_status_date, 2023-03-01 <= 2023-03-01): the status held now is the first: 2023-03-01, no first date needed", given: {immigration_status: parolee_one_year_or_more, qualified_status_date: "2023-03-01", us_entry_date: "2023-03-01"}, expect: "2023-03-01"}
  - {id: CO-7820-T5, as_of: "2026-11-10", title: "An LPR since 2023-03-01 who entered 2019-05-01, the earlier status not stated, the first date stated 2019-05-01: the stated first date is the start (KL-SNAP-3; was cannot determine, the earlier status read first)", given: {immigration_status: lawful_permanent_resident, qualified_status_date: "2023-03-01", us_entry_date: "2019-05-01", first_qualified_status_date: "2019-05-01"}, expect: "2019-05-01"}
  - {id: CO-7820-T6, as_of: "2026-11-10", title: "A battered non-citizen (the status held now) who entered 2018-02-01 and obtained the status 2022-06-01, no first date stated: not entered in it, not an LPR: the first date is read, not stated: cannot determine", given: {immigration_status: battered_non_citizen, qualified_status_date: "2022-06-01", us_entry_date: "2018-02-01"}, expect: unknown}
  # Coverage verification 7 follow-up (V7-8): a lawful permanent resident since 2023-03-01 who entered 2019-05-01 on a student visa (status_before_lpr_adjustment
  # non_qualified_status: not a qualified alien under 8 U.S.C. 1641(b), S1900), no first date stated. The permanent residence is the first qualified status: 2023-03-01.
  - {id: CO-7820-T7, as_of: "2026-11-10", title: "V7-8: an LPR since 2023-03-01 who adjusted from a non-qualified status, entered 2019-05-01, no first date: 2023-03-01 (was cannot determine: the first date was asked)", given: {immigration_status: lawful_permanent_resident, qualified_status_date: "2023-03-01", us_entry_date: "2019-05-01", status_before_lpr_adjustment: non_qualified_status}, expect: "2023-03-01"}
  - {id: CO-7820-T8, as_of: "2026-11-10", title: "V7-8: an LPR since 2023-03-01 from a non-qualified status, entry date not stated: 2023-03-01, as T3 for none", given: {immigration_status: lawful_permanent_resident, qualified_status_date: "2023-03-01", status_before_lpr_adjustment: non_qualified_status}, expect: "2023-03-01"}
  # KL-SNAP-3 (close-out verification F1, the arm left; probe A7): a battered non-citizen (8 U.S.C. 1641(c), S1901) found so on 2022-06-01 who entered
  # the United States on 2018-02-01 in no status. 2018-02-01 is before 2022-06-01, so the entry does not show the status held now is the first;
  # no first date is stated; not a lawful permanent resident. 1613(a) (S176): the five years begin "on the date of the alien's entry into the United
  # States with a status within the meaning of the term "qualified alien""; 4.305.B.3.a (S12): "on the date the non-citizen obtains status as a
  # qualified non-citizen". The case says no qualified status came before (has_held_earlier_qualified_status false): she first obtained one on 2022-06-01.
  - {id: CO-7820-T9, as_of: "2026-10-01", title: "KL-SNAP-3: a battered non-citizen since 2022-06-01 who entered in no status on 2018-02-01 and held no earlier qualified status: 2022-06-01 (was cannot determine, T6)", given: {immigration_status: battered_non_citizen, qualified_status_date: "2022-06-01", us_entry_date: "2018-02-01", has_held_earlier_qualified_status: false}, expect: "2022-06-01"}
  # The same person who was paroled for a year or more before (an earlier qualified status, 1641(b)(4), S1900), the parole's date not stated: the start is the parole's, not stated: cannot determine (decision 4).
  - {id: CO-7820-T10, as_of: "2026-10-01", title: "KL-SNAP-3: the same with an earlier qualified status, its date not stated: cannot determine (decision 4)", given: {immigration_status: battered_non_citizen, qualified_status_date: "2022-06-01", us_entry_date: "2018-02-01", has_held_earlier_qualified_status: true}, expect: unknown}
  # The parole's date stated, 2019-03-01: the start is 2019-03-01.
  - {id: CO-7820-T11, as_of: "2026-10-01", title: "KL-SNAP-3: the same with the earlier parole's date stated as the first date, 2019-03-01: 2019-03-01", given: {immigration_status: battered_non_citizen, qualified_status_date: "2022-06-01", us_entry_date: "2018-02-01", has_held_earlier_qualified_status: true, first_qualified_status_date: "2019-03-01"}, expect: "2019-03-01"}
  # A lawful permanent resident since 2023-03-01 who was paroled before (status_before_lpr_adjustment other), no first date: the fact is not read for a
  # permanent resident (status_before_lpr_adjustment states the earlier status); the parole's date is required: cannot determine, as T2.
  - {id: CO-7820-T12, as_of: "2026-11-10", title: "KL-SNAP-3: a lawful permanent resident adjusted from parole (other), no first date; has_held_earlier_qualified_status is not read for a permanent resident: cannot determine, as T2", given: {immigration_status: lawful_permanent_resident, qualified_status_date: "2023-03-01", us_entry_date: "2019-05-01", status_before_lpr_adjustment: other, has_held_earlier_qualified_status: false}, expect: unknown}
