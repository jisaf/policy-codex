id: CO-505
name: "Is a Colorado resident"
identifier: is_colorado_resident
kind: derived
type: yes/no
scope: person
program: All
meaning: "Whether the person's state of residence is Colorado: the person lives in Colorado and intends to remain. It states residence in the state only; a program's own residency rule (institutionalized persons, absences, county of residence, receipt of assistance in another state, custody bars) is a separate item that reads it."
precision: "Reads state_of_residence (CO-006) against colorado_state_code. Vocabulary fix round (docs/reviews/vocabulary-reuse.md, R-9, U-4): renamed from ma_meets_residency and made program All, because the item had no Medicaid-specific content (the 42 CFR 435.403(e)-(j) rules for institutionalized persons, absences and children placed out of state are not modeled, OQ-393) and CCCAP and LEAP read it as plain state residence. Medicaid, CHP+, CCCAP and LEAP read it directly; Colorado Works (CO-904) and Adult Financial (CO-942) read it inside their own residency items, which add their programs' other conditions."
derived: ["=", state_of_residence, colorado_state_code]
sources: [S171, S172, S495]
open: [OQ-393]
implemented: engine
tags: [household]
rationale: "No existing item states Medicaid residency; ma_is_emergency_medicaid_only (CO-510) and batch 6's category-eligibility rules need it. Distinct from any SNAP residency test (this volume has none stated as its own item; SNAP eligibility does not turn on a parallel state_of_residence check in this batch) because 8.100.3.B's no-durational-requirement, no-fixed-address rule is Medicaid-specific text. Vocabulary fix round (docs/reviews/vocabulary-reuse.md, R-9): shared under a neutral name. A Medicaid item of the same derivation would be a duplicate, and a program item that only reads this one would be an alias; when Medicaid's special residency rules are modeled they become ma_meets_residency over this item."
tests:
  - {id: CO-505-T1, as_of: "2026-10-01", given: {state_of_residence: "CO"}, expect: true}
  - {id: CO-505-T2, as_of: "2026-10-01", given: {state_of_residence: "WY"}, expect: false}
