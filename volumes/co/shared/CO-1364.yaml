id: CO-1364
name: Disability is verified
identifier: disability_is_verified
kind: derived
type: yes/no
scope: person
program: All
meaning: Whether the person's disability (receipt of a disability-based benefit, or a disability statement) is verified by SSA data or by documents.
derived: [any, disability_benefit_receipt_verified_by_electronic_data_source, disability_benefit_or_statement_document_received]
sources: [S807, S820]
implemented: engine
tags: [verification, disability]
rationale: 7 CFR 273.2(f)(1)(viii) (S807) verifies disability by proof of benefits, which SDX and BENDEX supply as verified upon receipt (S820); no existing item combines them.
tests:
  - {id: CO-1364-T1, as_of: "2026-10-01", given: {disability_benefit_receipt_verified_by_electronic_data_source: true}, expect: true}
  - {id: CO-1364-T2, as_of: "2026-10-01", given: {disability_benefit_receipt_verified_by_electronic_data_source: false, disability_benefit_or_statement_document_received: true}, expect: true}
  - {id: CO-1364-T3, as_of: "2026-10-01", given: {disability_benefit_receipt_verified_by_electronic_data_source: false, disability_benefit_or_statement_document_received: false}, expect: false}
