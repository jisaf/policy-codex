id: CO-7841
name: A pregnancy ended in the month, as the case records it
identifier: pregnancy_ended_in_month
kind: derived
type: yes/no
scope: person-month
program: All
meaning: "Whether the case records a pregnancy of the person that ended in the month: the stated pregnancy_end_date (CO-089) falls in it, or a child of the case she gave birth to (the gave_birth_to relationship) was born in it, a birth ending the pregnancy on the child's date of birth (most_recent_pregnancy_end_date, CO-7400, reads the same records). The end date is the last day of the pregnancy, so she was pregnant on a day of that month."
precision: "MAGI close-out, KL-MAGI-2 (2026-11-24). Relationships not stated are read as none, as pregnancy_ended_before_month (CO-7771) and most_recent_pregnancy_end_date (CO-7400) read them; a child she gave birth to whose date of birth is not stated leaves it unknown unless the stated end already settles it. Every recorded end counts, not only the most recent, so the month of an earlier birth is found too."
derived: [any, [all, [not, [unknown, pregnancy_end_date]], ["=", [month_of, pregnancy_end_date], [month]]], [">", [count, [filter, [persons], [all, [otherwise, [rel, [gave_birth_to], [P]], false], ["=", [month_of, [of, [P], date_of_birth]], [month]]]]], 0]]
sources: [S640, S1715, S224]
implemented: engine
tags: [ma, chp, household]
link_class: primitive
link_basis: "Whether a recorded pregnancy end (the stated end, or a recorded birth) falls in a month; a date primitive no program defines differently."
nearest: [CO-7771, CO-7773]
rationale: "MAGI close-out, KL-MAGI-2 (docs/reviews/known-limits.md): ma_is_pregnant_in_month (CO-3601) and chp_is_pregnant_in_month (CO-7051) read only the most recent recorded end, so the month of an earlier birth, and the month of the most recent birth of a person pregnant again with a stated start, were read from the current pregnancy's start as not pregnant. A month in which a recorded pregnancy ended is a pregnant month whichever pregnancy it was; no existing item says whether any recorded end falls in a month (CO-7771 and CO-7773 test before and on or after its first day)."
tests:
  - {id: CO-7841-T1, month: "2025-09", as_of: "2026-11-10", title: "KL-MAGI-2: she gave birth to p2 on 2025-09-10: month_of(2025-09-10) = 2025-09: true", given: {}, others: {p2: {date_of_birth: "2025-09-10"}}, relationships: [[gave_birth_to, p1, p2]], expect: true}
  - {id: CO-7841-T2, month: "2025-10", as_of: "2026-11-10", title: "KL-MAGI-2: the same in October 2025: 2025-09 is not 2025-10: false", given: {}, others: {p2: {date_of_birth: "2025-09-10"}}, relationships: [[gave_birth_to, p1, p2]], expect: false}
  - {id: CO-7841-T3, month: "2023-05", as_of: "2026-11-10", title: "KL-MAGI-2: two births, p2 on 2025-09-10 and p3 on 2023-05-02: May 2023, the month of the earlier birth: true", given: {}, others: {p2: {date_of_birth: "2025-09-10"}, p3: {date_of_birth: "2023-05-02"}}, relationships: [[gave_birth_to, p1, p2], [gave_birth_to, p1, p3]], expect: true}
  - {id: CO-7841-T4, month: "2026-08", as_of: "2026-11-10", title: "A miscarriage stated on 2026-08-02: month_of(2026-08-02) = 2026-08: true", given: {pregnancy_end_date: "2026-08-02"}, relationships: [], expect: true}
  - {id: CO-7841-T5, month: "2026-11", as_of: "2026-11-10", title: "No end stated and no child of the case born to her: false", given: {}, relationships: [], expect: false}
  - {id: CO-7841-T6, month: "2026-11", as_of: "2026-11-10", title: "A child of the case born to her whose date of birth is not stated, no end stated: unknown", given: {}, others: {p2: {}}, relationships: [[gave_birth_to, p1, p2]], expect: unknown}
