id: CO-905
name: "Meets the public assistance citizenship and qualified non-citizen requirement"
identifier: meets_public_assistance_citizenship_requirement
kind: derived
type: yes/no
scope: person
program: All
meaning: "The person is a U.S. citizen or national, or a qualified non-citizen who entered the United States before August 22, 1996, who is in a federal exempt category under 8 U.S.C. 1613(b), or who has held qualified status for five years, or an Iraqi or Afghan special immigrant, adjusted or not, or an Afghan or Ukrainian humanitarian parolee within the term federal law sets, whom federal law gives refugee benefits to the same extent as refugees: the requirement C.R.S. 26-2-111.8(2) sets for Colorado Works, the Old Age Pension, Aid to the Needy Disabled and Aid to the Blind, and that 26-2-706(1.5)(b) and 9 CCR 2503-6 3.604.1.B restate for Colorado Works and 9 CCR 2503-5 3.520.61.C and 3.520.68.A for Aid to the Needy Disabled."
precision: "Vocabulary fix round (R-4, U-2, U-3): the 8 U.S.C. 1613(b) exemption is is_exempt_from_five_year_bar (CO-1725); Colorado Works had read SNAP's own waiting-period exemption, whose under-18 and pre-1931 prongs are not 1613(b) categories (so a lawful permanent resident child inside five years was found eligible and a refugee inside five years was not), and Aid to the Needy Disabled read no exemption at all (so a refugee inside five years failed). The pre-1996 entry test reads us_entry_date (CO-1726), not the date the qualified status was obtained. Once both programs read the same federal exemption, the Colorado Works item and meets_public_assistance_citizenship_requirement (CO-905) were the same rule, as 26-2-111.8(2) makes them; CO-943 is retired into this item, renamed from cw_meets_citizenship_requirement. Adult Financial reads it only for AND and AB (af_category, CO-953): 3.520.61.C and 3.520.68.A state the test 'for AND only', and OAP keeps its own test (af_meets_citizenship_requirement_oap, CO-929). Does not model 26-2-111(2)(c)(II)-(III)'s hardship and SSI-eligibility exceptions (OQ-119). Final cash review FC-13 (OQ-550): Pub. L. 111-8 div. F sec. 602(b)(8) and Pub. L. 110-181 sec. 1244(g), as amended by Pub. L. 111-118 sec. 8120 (S2627-S2630), give Afghan and Iraqi special immigrants refugee benefits \"to the same extent, and for the same periods of time, as such refugees\", so this item accepts them, adjusted or not, as it accepts a refugee, with no five-year bar. is_qualified_non_citizen (CO-506) and is_exempt_from_five_year_bar (CO-1725), which Medicaid reads with its own special-immigrant rule, are unchanged. Final cash review 2, N-3 and P2-1: Pub. L. 117-128 sec. 401(b)(1) (D-260, S2800) makes a Ukrainian humanitarian parolee whose parole has not been terminated eligible for \"entitlement programs, and other benefits available to refugees ... to the same extent as such refugees\", and Pub. L. 117-43 sec. 2502(b)(1) (D-261, S2801) does the same for an Afghan humanitarian parolee \"until March 31, 2023, or the term of parole granted ..., whichever is later\"; both are \"Notwithstanding any other provision of law\". The item accepts them as it accepts a special immigrant, by the same reading FC-13 took: a Ukrainian parolee while parole_end_date (CO-2703), where stated, has not passed, and an Afghan parolee through the later of afghan_humanitarian_parolee_refugee_benefits_end_date (CO-4006) and parole_end_date; the immigration status itself, as SAVE states it, stands for a parole not ended where no end date is stated. A trafficking victim is accepted for Colorado Works only (cw_meets_citizenship_and_immigration_requirement, CO-4005): 22 U.S.C. 7105(b)(1)(A) reaches programs funded or administered by HHS and the other agencies of (b)(1)(B), and Aid to the Needy Disabled, Aid to the Blind and the Old Age Pension are State and county programs, so for them a trafficking victim stays a qualified non-citizen under the five-year bar. KL-CASH-2 closed (2026-11-24; docs/reviews/known-limits.md): the five years (has_held_qualified_status_five_years, CO-508) are counted from the start of the waiting period, the first qualified status (qualified_non_citizen_waiting_period_start_date, CO-7820; first_qualified_status_date, CO-7770, required where read), not from the status held now, so a lawful permanent resident who was paroled into the United States more than five years before meets the requirement (LPR-EX-PAROLEE: stored households CO-1141, Colorado Works, and CO-1142, AND-SO). 9 CCR 2503-5 3.520.68.A dates the AND bar from the date of admission for permanent residence: OQ-1485."
assumption: "Does not model the 40-qualifying-quarters exception 8 U.S.C. 1612(a)(2)(B) provides for SNAP: 3.604.1.B.3 and 26-2-111.8(2) state only the entry date, the five-year bar and the federal exceptions to it."
statute_override: "Federal law overrides 9 CCR 2503-6 3.604.1.B.3 and 9 CCR 2503-5 3.520.68.A, which exempt from the five-year bar only the 8 U.S.C. 1613(b) categories: Pub. L. 110-181 sec. 1244(g) and Pub. L. 111-8 div. F sec. 602(b)(8), as amended by Pub. L. 111-118 sec. 8120, give Iraqi and Afghan special immigrants, and Pub. L. 117-43 div. C sec. 2502(b)(1) and Pub. L. 117-128 sec. 401(b)(1) give Afghan and Ukrainian humanitarian parolees, the entitlement programs and other benefits available to refugees to the same extent as refugees, notwithstanding any other provision of law; refugees are exempt from the five-year bar (3.604.2.K), so each is accepted as a refugee is, the parolees for the term the statute sets."
derived: [any, is_us_citizen_or_national, [all, is_qualified_non_citizen, [any, ["<", us_entry_date, qualified_non_citizen_entry_cutoff_date], is_exempt_from_five_year_bar, has_held_qualified_status_five_years]], ["=", immigration_status, iraqi_afghan_special_immigrant], [all, ["=", immigration_status, lawful_permanent_resident], ["=", [otherwise, status_before_lpr_adjustment, none], iraqi_afghan_special_immigrant]], [all, ["=", immigration_status, ukrainian_humanitarian_parolee], [otherwise, ["<=", [det_date], parole_end_date], true]], [all, ["=", immigration_status, afghan_humanitarian_parolee], [any, ["<=", [det_date], afghan_humanitarian_parolee_refugee_benefits_end_date], [otherwise, ["<=", [det_date], parole_end_date], true]]]]
sources: [S402, S407, S441, S449, S451, S452, S1150, S1151, S2627, S2628, S2629, S2630, S2800, S2801, S2802]
implemented: engine
open: [OQ-1485]
tags: [cash, tanf, and, immigration, legal]
link_class: primitive
link_basis: "The citizenship requirement C.R.S. 26-2-111.8(2) sets for Colorado Works, OAP, AND and AB, stated once in the statute; neither program's rule defines it differently."
rationale: "Phase 5 authored this rule twice, as cw_meets_citizenship_requirement (CO-905) and af_meets_citizenship_requirement_and (CO-943). Vocabulary fix round (R-4): with the federal exemption list read the same way for both, the two derivations were identical (governance dup.compact), as C.R.S. 26-2-111.8(2), which governs all four state cash programs, says they should be. CO-905 survives under a program-neutral identifier; CO-943 is retired."
tests:
  - {id: CO-905-T1, as_of: "2026-10-01", given: {immigration_status: us_citizen}, expect: true}
  - {id: CO-905-T2, as_of: "2026-10-01", given: {immigration_status: undocumented}, expect: false}
  - {id: CO-905-T3, as_of: "2026-10-01", given: {immigration_status: lawful_permanent_resident, date_of_birth: "1970-01-01", qualified_status_date: "1990-01-01", us_entry_date: "1990-01-01", qualifying_quarters: 0, has_military_connection: false}, expect: true}
  - {id: CO-905-T4, as_of: "2026-10-01", given: {immigration_status: lawful_permanent_resident, date_of_birth: "1970-01-01", qualified_status_date: "2025-06-01", us_entry_date: "2025-06-01", qualifying_quarters: 0, has_military_connection: false}, expect: false}
  - {id: CO-905-T5, title: "Vocabulary fix round (R-4): LPR child inside five years - under 18 is not a 1613(b) category", as_of: "2026-10-01", given: {immigration_status: lawful_permanent_resident, date_of_birth: "2015-01-01", qualified_status_date: "2024-06-01", us_entry_date: "2024-06-01", has_military_connection: false}, expect: false}
  - {id: CO-905-T6, title: "Vocabulary fix round (R-4): refugee inside five years is in a 1613(b) exempt category", as_of: "2026-10-01", given: {immigration_status: refugee, date_of_birth: "1990-01-01", qualified_status_date: "2024-06-01", us_entry_date: "2024-06-01"}, expect: true}
  - {id: CO-905-T7, as_of: "2026-10-01", given: {immigration_status: us_citizen}, expect: true}
  - {id: CO-905-T8, as_of: "2026-10-01", given: {immigration_status: lawful_permanent_resident, qualified_status_date: "1998-01-01", us_entry_date: "1998-01-01"}, expect: true}
  - {id: CO-905-T9, as_of: "2026-10-01", given: {immigration_status: lawful_permanent_resident, qualified_status_date: "2024-01-01", us_entry_date: "2024-01-01", has_military_connection: false}, expect: false}
  - {id: CO-905-T10, title: "Carried from the retired CO-943: Vocabulary fix round (R-4): refugee inside the first five years meets the requirement through 8 U.S.C. 1613(b)", as_of: "2026-10-01", given: {immigration_status: refugee, qualified_status_date: "2024-01-01", us_entry_date: "2024-01-01"}, expect: true}
  - {id: CO-905-T11, title: "Carried from the retired CO-943: Vocabulary fix round (R-4): entered in 1994, LPR status obtained in 2023 - entry before August 22, 1996 (26-2-111.8(2)(a))", as_of: "2026-10-01", given: {immigration_status: lawful_permanent_resident, qualified_status_date: "2023-01-01", us_entry_date: "1994-05-01"}, expect: true}
  - {id: CO-905-T12, as_of: "2026-10-01", given: {immigration_status: undocumented}, expect: false}
  # Final cash review FC-13 (OQ-550): special immigrants are treated as refugees.
  - {id: CO-905-T13, title: "FC-13: an Afghan special immigrant admitted in 2025 who has not adjusted", as_of: "2026-10-01", given: {immigration_status: iraqi_afghan_special_immigrant, us_entry_date: "2025-03-01"}, expect: true}
  - {id: CO-905-T14, title: "FC-13: an Iraqi special immigrant who adjusted to permanent residence, entered 2024", as_of: "2026-10-01", given: {immigration_status: lawful_permanent_resident, status_before_lpr_adjustment: iraqi_afghan_special_immigrant, us_entry_date: "2024-03-01", qualified_status_date: "2024-03-01", has_military_connection: false}, expect: true}
  # Final cash review 2, N-3: humanitarian parolees are treated as refugees; a trafficking victim for Colorado Works only (CO-4005).
  - {id: CO-905-T15, title: "N-3: a Ukrainian humanitarian parolee since March 2024, parole running to 2027 (Pub. L. 117-128 sec. 401)", as_of: "2026-10-01", given: {immigration_status: ukrainian_humanitarian_parolee, us_entry_date: "2024-03-01", qualified_status_date: "2024-03-01", parole_end_date: "2027-02-28", has_military_connection: false}, expect: true}
  - {id: CO-905-T16, title: "N-3: an Afghan humanitarian parolee since March 2024, no end date stated (Pub. L. 117-43 sec. 2502)", as_of: "2026-10-01", given: {immigration_status: afghan_humanitarian_parolee, us_entry_date: "2024-03-01", qualified_status_date: "2024-03-01", has_military_connection: false}, expect: true}
  - {id: CO-905-T17, title: "N-3: an Afghan parolee whose parole ended in December 2025, after March 31, 2023 - inside five years, barred", as_of: "2026-10-01", given: {immigration_status: afghan_humanitarian_parolee, us_entry_date: "2022-03-01", qualified_status_date: "2022-03-01", parole_end_date: "2025-12-31", has_military_connection: false}, expect: false}
  - {id: CO-905-T18, title: "N-3: a certified trafficking victim since 2024 - Aid to the Needy Disabled keeps the five-year bar (7105 reaches HHS programs; Colorado Works reads CO-4005)", as_of: "2026-10-01", given: {immigration_status: trafficking_victim, us_entry_date: "2024-03-01", qualified_status_date: "2024-03-01", has_military_connection: false}, expect: false}
  # KL-CASH-2 (LPR-EX-PAROLEE): paroled into the United States 2019-05-01 (8 U.S.C. 1641(b)(4), S1900), lawful permanent resident 2023-03-01 (status_before_lpr_adjustment other); entered after 1996-08-22, no 1613(b) exemption, no military connection. Determined 2026-11-10.
  - {id: CO-905-T90, title: "KL-CASH-2 (was false): the five years from the parole, 2019-05-01 to 2026-11-10, 7 whole years: held (CO-508): meets the requirement; from the LPR date only 3", as_of: "2026-11-10", given: {immigration_status: lawful_permanent_resident, qualified_status_date: "2023-03-01", us_entry_date: "2019-05-01", status_before_lpr_adjustment: other, first_qualified_status_date: "2019-05-01", has_military_connection: false}, expect: true}
  - {id: CO-905-T91, title: "KL-CASH-2: the same without the first date stated: the five years cannot be told: cannot determine (required where read; was false)", as_of: "2026-11-10", given: {immigration_status: lawful_permanent_resident, qualified_status_date: "2023-03-01", us_entry_date: "2019-05-01", status_before_lpr_adjustment: other, has_military_connection: false}, expect: unknown}
  - {id: CO-905-T92, title: "KL-CASH-2: the same determined 2024-04-30: 2019-05-01 to 2024-04-30, 4 whole years: not held, no exemption: does not meet it", as_of: "2024-04-30", given: {immigration_status: lawful_permanent_resident, qualified_status_date: "2023-03-01", us_entry_date: "2019-05-01", status_before_lpr_adjustment: other, first_qualified_status_date: "2019-05-01", has_military_connection: false}, expect: false}
