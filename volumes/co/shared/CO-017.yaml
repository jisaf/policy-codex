id: CO-017
name: Is Medicare entitled or enrolled
identifier: is_medicare_entitled_or_enrolled
kind: derived
type: yes/no
scope: person
program: All
meaning: "The person is entitled to or enrolled for Medicare benefits under Part A, or enrolled for benefits under Part B (42 CFR 435.553(a)(2))."
derived: [any, medicare_part_a_entitled, medicare_part_b_enrolled]
sources: [S1206, S316]
implemented: engine
rationale: "A fact the case must supply; no existing item in the Colorado volume carries it (the volume began empty in phase 1, and the mwr volume's facts are not shared across volumes). It is reserved for the SNAP income, deduction, work registration and ABAWD rules of later batches, which read it by this identifier. Dual-entry audit 3.9: derived, so Part A entitlement is stated once (medicare_part_a_entitled, CO-803)."
tests:
  - {id: CO-017-T1, title: "Part A", as_of: "2026-11-01", given: {medicare_part_a_entitled: true}, expect: true}
  - {id: CO-017-T2, title: "Part B only", as_of: "2026-11-01", given: {medicare_part_a_entitled: false, medicare_part_b_enrolled: true}, expect: true}
  - {id: CO-017-T3, title: "Neither", as_of: "2026-11-01", given: {medicare_part_a_entitled: false, medicare_part_b_enrolled: false}, expect: false}
