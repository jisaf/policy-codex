id: CO-7400
name: Most recent pregnancy end date, as the case records it
identifier: most_recent_pregnancy_end_date
kind: derived
type: calendar date
scope: person
program: All
meaning: "The date the person's most recent pregnancy that has ended came to an end: the stated pregnancy_end_date (CO-089); where it is not stated, the date of birth of the child born last of the persons of the case she gave birth to (the gave_birth_to relationship), since a birth ends the pregnancy on the child's date of birth. Unknown where neither is stated."
precision: "Coverage pass 6, C6-03 (2026-11-24). The fact of a birth is recorded once, by the child's date_of_birth and the gave_birth_to relationship a newborn's case states (the product-owner rule that facts another record or edge can supply are read from it, not entered twice), so a mother applying with her newborn need not also state pregnancy_end_date. A stated pregnancy_end_date governs (a miscarriage or termination after the last birth is stated there). The latest birth is taken as the greatest number of days from the determination date to each such child's date of birth (P59 greatest; days_after back from the determination date), so a child born later counts over an older sibling; a child of the case whose date of birth is not stated leaves it unknown. Relationships not stated are read as none, as birth_mother_coverage_at_birth (CO-3322) reads them. Unknown where no end is stated and no child of the case was born to her: each reader says what that means for it (ma_is_pregnant_in_month CO-3601, chp_is_pregnant_in_month CO-7051: no ended pregnancy unless a pregnancy start is stated with no end, then the months from the start cannot be determined)."
derived: [case, [[not, [unknown, pregnancy_end_date]], pregnancy_end_date], [[">", [count, [filter, [persons], [otherwise, [rel, [gave_birth_to], [P]], false]]], 0], [days_after, [greatest, [filter, [persons], [otherwise, [rel, [gave_birth_to], [P]], false]], [days_between, [det_date], [of, [P], date_of_birth]]], [det_date]]], [else, pregnancy_end_date]]
sources: [S640, S1715, S224]
implemented: engine
tags: [ma, chp, household]
link_class: primitive
link_basis: "The date a pregnancy ended, as stated or as the recorded birth gives it (the child's date of birth); a date no program defines differently."
nearest: [CO-089, CO-3322]
rationale: "Coverage pass 6, C6-03 (docs/reviews/coverage6-medicaid-magi-chp.md): ma_is_pregnant_in_month (CO-3601), chp_is_pregnant_in_month (CO-7051) and the postpartum periods (CO-560, CO-566, CO-2406, CO-2407) read an ended pregnancy only through pregnancy_end_date, whose precision read it as no pregnancy where it was not stated. A mother applying with her newborn, the birth recorded by the baby's date of birth and the gave_birth_to relationship, was read as not pregnant in the birth month and without a postpartum period (CO-810 without pregnancy_end_date: 3,250 / 1,330 = 244.4% for one, ineligible_income in every month; with the birth read from the baby, 3,250 / 1,803.33 = 180.2% for two in October, the coverage period through October 2027). 10 CCR 2505-10 § 8.100.4.G.5 (S640) runs the period 'through the last day of the 12th month following the date the pregnancy ends'; 10 CCR 2505-3 § 430.3 (S1715) to 'the last day of the month 12 months after the birth of the child or termination of the pregnancy'."
