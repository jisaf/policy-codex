  - {id: CO-7400-T2, as_of: "2026-11-10", title: "C6-03 (CO-810 without pregnancy_end_date): she gave birth to p2, a person of the case born 2026-10-20: the pregnancy ended on 2026-10-20 (days from 2026-11-10 to 2026-10-20: -21; 2026-11-10 less 21 days = 2026-10-20)", given: {}, others: {p2: {date_of_birth: "2026-10-20"}}, relationships: [[gave_birth_to, p1, p2]], expect: "2026-10-20"}
  - {id: CO-7400-T3, as_of: "2026-11-10", title: "C6-03: two children of the case born to her, 2019-03-04 and 2026-10-20: the later birth (days -21 against -2,808: the greatest is -21), 2026-10-20", given: {}, others: {p2: {date_of_birth: "2019-03-04"}, p3: {date_of_birth: "2026-10-20"}}, relationships: [[gave_birth_to, p1, p2], [gave_birth_to, p1, p3]], expect: "2026-10-20"}
  - {id: CO-7400-T4, as_of: "2026-11-10", title: "C6-03: a miscarriage stated on 2026-09-01 after a birth in 2024: the stated date governs", given: {pregnancy_end_date: "2026-09-01"}, others: {p2: {date_of_birth: "2024-05-01"}}, relationships: [[gave_birth_to, p1, p2]], expect: "2026-09-01"}
