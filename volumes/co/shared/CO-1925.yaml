id: CO-1925
name: Lives with
identifier: lives_with
kind: derived
type: group of persons
scope: person
program: All
meaning: "The persons in the case who live in the same home as this person, this person included: the persons with the same dwelling_id. Symmetric: if p2 lives with p1, p1 lives with p2."
precision: "Unknown where this person's dwelling_id is not stated; a reader that needs it says how it reads the absence (rule 12). A temporarily absent person lives in the home they usually live in; each program's temporary-absence rule is its own item (cw_is_considered_living_in_home, CO-3354; cccap_caretaker_is_involuntarily_absent, CO-898)."
derived: [filter, [persons], ["=", [of, [P], dwelling_id], dwelling_id]]
sources: [S1207, S1208, S1227, S163, S408, S481, S1400]
implemented: engine
tags: [ma, household]
rationale: "OQ-42 and OQ-65: no fact stated co-residence. The MAGI non-filer household counts only the parents and siblings who live in the household (8.100.4.E.1.d, E.5), and 42 CFR 435.554(c)(3)(i)(A) asks whether a family caregiver primarily resides with the person cared for. Same-word audit SW-7 and dual-entry audit 3.6: living together was read from relationship edges by every household, caretaker and custody item, while Medicaid read a separate lives_with list stated on one person; the two disagreed in CO-04, and lives_with could be stated on p1 and not on p2. Each person states the home they live in once; lives_with is derived, symmetric, and every item that asks whether persons live together reads it (convention rule 17). The ID is kept; the group is now derived from dwelling_id (CO-3350)."
tests:
  - {id: CO-1925-T1, as_of: "2026-10-01", given: {dwelling_id: h1}, others: {p2: {dwelling_id: h1}, p3: {dwelling_id: h2}}, expect: [p1, p2]}
  - {id: CO-1925-T2, title: "No home stated: unknown", as_of: "2026-10-01", given: {}, others: {p2: {dwelling_id: h1}}, expect: unknown}
