id: CO-076
name: Expects to be claimed as a tax dependent
identifier: expects_to_be_claimed_as_dependent
kind: derived
type: yes/no
scope: person
program: All
meaning: "Whether the person expects to be claimed as a tax dependent by another taxpayer for the taxable year in which the Medicaid eligibility determination or renewal is being made: a tax_dependent relationship to a person of the case (the claiming filer), or a claim by a taxpayer outside the case (is_claimed_by_filer_outside_case, CO-2716)."
precision: "42 CFR 435.603(f)(2) and 10 CCR 2505-10 8.100.4.E.1.b key household composition off this expectation. The tax_filer / tax_dependent relationship is the one statement of a claim between persons of the case, so the expectation is derived from it and cannot contradict it; unknown when the person's relationships are unstated."
derived: [any, [exists_related, [tax_dependent], true], [otherwise, is_claimed_by_filer_outside_case, false]]
sources: [S161, S162, S163]
implemented: engine
tags: [ma, magi, household]
link_class: primitive
link_basis: "A tax-dependent claim as the person's tax facts state it; a fact of federal tax filing that no program defines differently."
rationale: "No existing item carries this fact. The interface note in the phase-3 brief asks that 'is claimed as a tax dependent' prefer the case's tax_filer/tax_dependent relationship edges where they are stated; this supplied fact is the fallback the household rule also reads so the rule still works when the relationship is not (yet) recorded, and is what 8.100.4.E.1.b's 'expects to be claimed' actually tests. Dual-entry audit 3.3 and 5.7 (audit fix round): derived from the tax_dependent relationship, with a supplied fact only for a claimer outside the case (CO-2716); the five contradicting statements in CO-74, CO-75, CO-76 and CO-77 are gone with the fact."
tests:
  - {id: CO-076-T1, as_of: "2026-10-01", title: "Claimed by a parent in the case", given: {}, others: {p2: {}}, relationships: [[tax_dependent, p1, p2]], expect: true}
  - {id: CO-076-T2, as_of: "2026-10-01", title: "No claim", given: {}, others: {p2: {}}, relationships: [[spouse, p1, p2]], expect: false}
  - {id: CO-076-T3, as_of: "2026-10-01", title: "Claimed by a grandparent who lives elsewhere", given: {is_claimed_by_filer_outside_case: true}, relationships: [], expect: true}
