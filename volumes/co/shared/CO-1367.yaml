id: CO-1367
name: Identity document is a lawful presence document
identifier: identity_document_is_lawful_presence_document
kind: derived
type: yes/no
scope: person
program: All
meaning: "Whether the identity document the person provided is one of the documents Colorado Works (for lawful presence) and Adult Financial (for identity) list: a Colorado driver's license or identification card, a U.S. military or military dependent's card, a Coast Guard merchant mariner card, or a Native American tribal document."
derived: [in, identity_verification_document_type, [colorado_drivers_license_or_id, us_military_card, military_dependent_id_card, merchant_mariner_card, tribal_document]]
sources: [S877, S885]
implemented: engine
tags: [verification, immigration]
open: [OQ-315]
rationale: 9 CCR 2503-6 3.604.3.I.4.a (S877) and 9 CCR 2503-5 3.520.66 (S885) list the same documents; one program-neutral item serves both rather than two identical program items.
tests:
  - {id: CO-1367-T1, as_of: "2026-10-01", given: {identity_verification_document_type: colorado_drivers_license_or_id}, expect: true}
  - {id: CO-1367-T2, as_of: "2026-10-01", given: {identity_verification_document_type: school_id_card}, expect: false}
