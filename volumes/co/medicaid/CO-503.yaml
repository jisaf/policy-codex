id: CO-503
name: "Medicaid: MAGI household income"
identifier: ma_magi_household_income
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: This person's MAGI household's total countable income for the month under 42 CFR 435.603(d) and 10 CCR 2505-10 8.100.4.C.1.f - the sum of each household member's own ma_person_magi_income, except that a member's income is left out when the member is expected to be claimed as a tax dependent and is not required to file a tax return (the members counted are ma_magi_household_income_members, CO-4558) - plus, for a sponsored non-citizen, the sponsor income § 8.100.3.K.1 counts to this person (ma_sponsor_deemed_income, CO-4551).
precision: "Not rounded (coverage pass 4, C4-13: 8.100.4.C and D state no rounding; before, the sum was rounded to the nearest dollar, as each member's figure was). Coverage review 3, C3-04: the parent of clause (a) below is a natural, adopted or step parent, as C.1.f.i says (ma_magi_household_income_members, CO-4558, reads the child and stepchild roles). Coverage review F-03: the sponsor income deemed to this person (CO-4551) is added for this person's own household figure only, since § 8.100.3.K.1 counts it \"to the sponsored alien\"; the other members' households do not include it. Coverage review F-04: the members whose income counts are the group ma_magi_household_income_members (CO-4558), factored out unchanged so the annualized figure (CO-4559) counts the same members. Sums over ma_magi_household_members. A member's income is excluded only when the member is not required to file a tax return AND either (a) 435.603(d)(2)(i): someone in THIS household (the group being summed, read as a bare `ma_magi_household_members`, not the member's own independently-computed household) is that member's parent, or (b) 435.603(d)(2)(ii): the member is a dependent claimed by someone other than a spouse or parent (ma_is_dependent_claimed_by_non_parent, CO-563). Clause (a) is deliberately evaluated against the SUMMING household, not the member's own ma_magi_household_members value: 8.100.4.C.1.f.iii states 'the income of a child or tax dependent who does not live with their natural, adopted, or step parent will always count towards the determination of their own eligibility' - and 'their own eligibility' is decided per household, so a dependent whose parent is not a member of THIS particular household (for example a grandchild's non-filer household that excludes the claiming grandparent's own household) counts fully here even though the same dependent's income is excluded when the parent IS a co-member of a different household being summed. Replaced the prior expects_to_be_claimed_as_dependent proxy, which both over- and under-counted relative to this test. A member's income is excluded only when the member is not required to file and either a parent of the member, or the non-parent who claims the member, is in the household being summed (P45); so a child with no parent in her own household counts her own income, as 8.100.4.C.1.f.iii requires. Each member's income counts lottery or gambling winnings only in the month received (CO-502, § 8.100.4.C.1.b.xiv.4); for this person's own winnings the household total then swaps that for the amount spread over months (ma_lottery_winnings_countable_for_recipient, CO-1187, xiv.1-3). The swap assumes this person's own income is counted in the household, which holds for anyone with winnings large enough to spread (they must file a return); it is not made conditional on the exclusion clauses above."
derived: ["+", [case, [[otherwise, ma_lottery_winnings_hardship_exemption_granted, false], [sum, ma_magi_household_income_members, ["-", [of, [P], ma_person_magi_income], [of, [P], ma_magi_gambling_receipts]]]], [else, ["+", [sum, ma_magi_household_income_members, [of, [P], ma_person_magi_income]], ["-", ma_lottery_winnings_countable_for_recipient, ma_magi_gambling_receipts]]]], ma_sponsor_deemed_income]
sources: [S1519, S1520, S669, S164, S167, S3352]
implemented: engine
tags: [ma, magi, income]
open: [OQ-1475]
rationale: "No existing item aggregates MAGI-based income to the household level; ma_magi_household_income_pct_fpl (CO-504) and batch 6's income-standard tests need this single total. Parallel in shape to snap_household_gross_income (CO-334) but excludes a different set of members (claimed dependents not required to file, per 435.603(d)(2)) rather than SNAP's ineligible-member pro rata rule, so it is not the same derivation. Fix round (C-6): the exclusion test now reads the two clauses of 8.100.4.C.1.f (435.603(d)(2)(i) and (ii)/(iii)) directly instead of the expects_to_be_claimed_as_dependent proxy the phase-3 review found wrong in both directions. The (d)(2)(i)/(f)(2)(i) 'included in the household of ... parent' clause is deliberately inlined as `[exists, ma_magi_household_members, [rel, [parent], [P]]]` rather than factored into a standalone `of`-callable item, because the condition is relative to the household group currently being summed (this item's own bare ma_magi_household_members), not to the member's own separately-computed household value - a standalone item read through `of` would evaluate the member's OWN household instead and give the wrong answer for exactly the case this fix targets (CO-01's p5, whose group [p4, p5] excludes p4's own parent p3 even though p4's own independently-computed household is [p3, p4, p5]). The (d)(2)(ii)/(f)(2)(i) clause, by contrast, is a fact about who claims the member and does not depend on which household is doing the summing, so it is factored out as ma_is_dependent_claimed_by_non_parent (CO-563). History moved from the precision note (HCPF review S-14): Fix round: replaced the prior expects_to_be_claimed_as_dependent proxy, which both over- and under-counted relative to this test, per the phase-3 review's C-6 finding. A member's income is excluded only when the member is not required to file and either a parent of the member, or the non-parent who claims the member, is in the household being summed (P45); so a child with no parent in her own household counts her own income, as 8.100.4.C.1.f.iii requires. Phase 7 fix round (S-9): each member's income counts lottery or gambling winnings only in the month received (CO-502, § 8.100.4.C.1.b.xiv.4); for this person's own winnings the household total then swaps that for the amount spread over months (ma_lottery_winnings_countable_for_recipient, CO-1187, xiv.1-3). The swap assumes this person's own income is counted in the household, which holds for anyone with winnings large enough to spread (they must file a return); it is not made conditional on the exclusion clauses above. Precision history (moved from precision, engineering follow-up pass task 5): per the phase-3 review's C-6 finding. OQ-216 (audit fix round 4): a person granted the lottery hardship exemption (CO-2222), the winner or another member denied because of winnings counted in the month received, has a household income without any member's winnings. Receipt records, migration phase 2 (2026-11-23): the winnings each member's income counts in the month received, and this person's, are ma_magi_gambling_receipts (CO-5502), the receipts of the month, instead of lottery_gambling_winnings_received."
