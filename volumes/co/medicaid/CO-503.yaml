id: CO-503
name: "Medicaid: MAGI household income"
identifier: ma_magi_household_income
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: This person's MAGI household's total countable income for the month under 42 CFR 435.603(d) and 10 CCR 2505-10 8.100.4.C.1.f - the sum of each household member's own ma_person_magi_income, except that a member's income is left out when the member is expected to be claimed as a tax dependent and is not required to file a tax return.
precision: Sums over ma_magi_household_members. A member counts if not expected to be claimed as a tax dependent, or if required to file, matching 435.603(d)(2)/8.100.4.C.1.f's "income of a child or tax dependent is not included unless required to file" rule; this reads expects_to_be_claimed_as_dependent as the proxy for "is a child in a parent's household or a claimed tax dependent" rather than re-deriving the parent-in-household test member by member.
derived: [round, [sum, [filter, ma_magi_household_members, [any, [not, [of, [P], expects_to_be_claimed_as_dependent]], [of, [P], is_required_to_file_tax_return]]], [of, [P], ma_person_magi_income]]]
sources: [S164, S167]
implemented: engine
tags: [ma, magi, income]
rationale: "No existing item aggregates MAGI-based income to the household level; ma_magi_household_income_pct_fpl (CO-504) and batch 6's income-standard tests need this single total. Parallel in shape to snap_household_gross_income (CO-334) but excludes a different set of members (claimed dependents not required to file, per 435.603(d)(2)) rather than SNAP's ineligible-member pro rata rule, so it is not the same derivation."
tests:
  - {id: CO-503-T1, as_of: "2026-10-01", month: "2026-10", given: {is_tax_filer: true, expects_to_be_claimed_as_dependent: false, is_required_to_file_tax_return: true, date_of_birth: "1985-01-22", is_pregnant: false, earned_income: 2380, self_employment_net_income: 0, other_taxable_income: 0, social_security_income: 0, pension_income: 0, unemployment_income: 0, other_unearned_income: 0, tax_exempt_interest: 0, foreign_earned_income_excluded: 0, pretax_deductions: 0}, others: {p4: {date_of_birth: "2009-04-08", is_pregnant: false, expects_to_be_claimed_as_dependent: true, is_required_to_file_tax_return: false, earned_income: 0, self_employment_net_income: 0, other_taxable_income: 0, social_security_income: 0, pension_income: 0, unemployment_income: 0, other_unearned_income: 0, tax_exempt_interest: 0, foreign_earned_income_excluded: 0, pretax_deductions: 0}, p5: {date_of_birth: "2026-02-03", is_pregnant: false, expects_to_be_claimed_as_dependent: true, is_required_to_file_tax_return: false, earned_income: 0, self_employment_net_income: 0, other_taxable_income: 0, social_security_income: 0, pension_income: 0, unemployment_income: 0, other_unearned_income: 0, tax_exempt_interest: 0, foreign_earned_income_excluded: 0, pretax_deductions: 0}}, relationships: [[tax_filer, p1, p4], [tax_filer, p1, p5]], expect: 2380}
  - {id: CO-503-T2, as_of: "2026-10-01", month: "2026-10", given: {is_tax_filer: true, expects_to_be_claimed_as_dependent: false, is_required_to_file_tax_return: true, date_of_birth: "1980-01-01", is_pregnant: false, earned_income: 1000, self_employment_net_income: 0, other_taxable_income: 0, social_security_income: 0, pension_income: 0, unemployment_income: 0, other_unearned_income: 0, tax_exempt_interest: 0, foreign_earned_income_excluded: 0, pretax_deductions: 0}, others: {p4: {date_of_birth: "2007-01-01", is_pregnant: false, expects_to_be_claimed_as_dependent: true, is_required_to_file_tax_return: true, earned_income: 500, self_employment_net_income: 0, other_taxable_income: 0, social_security_income: 0, pension_income: 0, unemployment_income: 0, other_unearned_income: 0, tax_exempt_interest: 0, foreign_earned_income_excluded: 0, pretax_deductions: 0}}, relationships: [[tax_filer, p1, p4]], expect: 1500}
