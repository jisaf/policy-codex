id: CO-503
name: "Medicaid: MAGI household income"
identifier: ma_magi_household_income
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: This person's MAGI household's total countable income for the month under 42 CFR 435.603(d) and 10 CCR 2505-10 8.100.4.C.1.f - the sum of each household member's own ma_person_magi_income, except that a member's income is left out when the member is expected to be claimed as a tax dependent and is not required to file a tax return.
precision: "Sums over ma_magi_household_members. A member's income is excluded only when the member is not required to file a tax return AND either (a) 435.603(d)(2)(i): someone in THIS household (the group being summed, read as a bare `ma_magi_household_members`, not the member's own independently-computed household) is that member's parent, or (b) 435.603(d)(2)(ii): the member is a dependent claimed by someone other than a spouse or parent (ma_is_dependent_claimed_by_non_parent, CO-563). Clause (a) is deliberately evaluated against the SUMMING household, not the member's own ma_magi_household_members value: 8.100.4.C.1.f.iii states 'the income of a child or tax dependent who does not live with their natural, adopted, or step parent will always count towards the determination of their own eligibility' - and 'their own eligibility' is decided per household, so a dependent whose parent is not a member of THIS particular household (for example a grandchild's non-filer household that excludes the claiming grandparent's own household) counts fully here even though the same dependent's income is excluded when the parent IS a co-member of a different household being summed. Fix round: replaced the prior expects_to_be_claimed_as_dependent proxy, which both over- and under-counted relative to this test, per the phase-3 review's C-6 finding. A member's income is excluded only when the member is not required to file and either a parent of the member, or the non-parent who claims the member, is in the household being summed (P45); so a child with no parent in her own household counts her own income, as 8.100.4.C.1.f.iii requires."
derived: [round, [sum, [filter, ma_magi_household_members, [not, [all, [not, [of, [P], is_required_to_file_tax_return]], [any, [has_relative_in, [child], ma_magi_household_members], [all, [has_relative_in, [tax_dependent], ma_magi_household_members], [of, [P], ma_is_dependent_claimed_by_non_parent]]]]]], [of, [P], ma_person_magi_income]]]
sources: [S164, S167]
implemented: engine
tags: [ma, magi, income]
rationale: "No existing item aggregates MAGI-based income to the household level; ma_magi_household_income_pct_fpl (CO-504) and batch 6's income-standard tests need this single total. Parallel in shape to snap_household_gross_income (CO-334) but excludes a different set of members (claimed dependents not required to file, per 435.603(d)(2)) rather than SNAP's ineligible-member pro rata rule, so it is not the same derivation. Fix round (C-6): the exclusion test now reads the two clauses of 8.100.4.C.1.f (435.603(d)(2)(i) and (ii)/(iii)) directly instead of the expects_to_be_claimed_as_dependent proxy the phase-3 review found wrong in both directions. The (d)(2)(i)/(f)(2)(i) 'included in the household of ... parent' clause is deliberately inlined as `[exists, ma_magi_household_members, [rel, [parent], [P]]]` rather than factored into a standalone `of`-callable item, because the condition is relative to the household group currently being summed (this item's own bare ma_magi_household_members), not to the member's own separately-computed household value - a standalone item read through `of` would evaluate the member's OWN household instead and give the wrong answer for exactly the case this fix targets (CO-01's p5, whose group [p4, p5] excludes p4's own parent p3 even though p4's own independently-computed household is [p3, p4, p5]). The (d)(2)(ii)/(f)(2)(i) clause, by contrast, is a fact about who claims the member and does not depend on which household is doing the summing, so it is factored out as ma_is_dependent_claimed_by_non_parent (CO-563)."
