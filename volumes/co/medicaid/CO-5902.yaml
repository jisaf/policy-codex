id: CO-5902
name: "Medicaid: most parental income that can be deemed to the child"
identifier: ma_ssi_deeming_benefit_zero_amount
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The amount of parental income which, deemed to this child as unearned income and combined with the child's own income, reduces the child's SSI benefit to zero: the least deemed amount at which the child's countable income, figured as 20 CFR 416.1165(e)(1) figures it (the deemed income added to the child's own unearned income, ma_ssi_household_unearned_income_before_deeming, the $20 general exclusion applied to the sum, and the countable earned income added), reaches the SSI Federal Benefit Rate for an individual; zero when the child's own income already reaches it. No more than this is deemed to a child who shares the parents' income with other eligible children (416.1165(e)(3))."
precision: "Worked back from the countable income, not searched for. With E the child's countable earned income once the whole $20 is used against unearned income (ma_ssi_countable_earned_income_with_general_exclusion_used, CO-5901), U the child's own unearned income and F the Federal Benefit Rate: the deemed income first takes back the part of the $20 the child's own unearned income left for earned income (each dollar of it adding at most one half of a dollar, ssi_earned_income_disregard_rate, of countable earned income, and nothing while the earnings are within the exclusions), and each dollar beyond that adds a dollar of countable unearned income. When E is at most F, countable income first reaches F after the whole $20 is used, so the amount is F - E + 20 - U, and not below zero. When E is more than F, the child reaches F while the deemed income is still taking the $20 back from earned income, each dollar adding one half of a dollar: the amount is the unused part of the $20, max(0, 20 - U), less (E - F) divided by one half, and not below zero. The benefit is the Federal Benefit Rate for an individual less countable income ((e)(1)). (e)(3)'s SSI benefit includes a federally administered State supplement; Colorado's supplement for a blind or disabled child under 60, AND-CS (9 CCR 2503-5 3.546, S706), is paid to a client 'receiving SSI' who is not receiving the full SSI benefit standard, up to a grant standard equal to the Federal Benefit Rate ($994 in 2026), so it is nothing once the SSI benefit is nothing and adds nothing to this amount."
derived: [case, [[">=", ssi_federal_benefit_rate_individual, ma_ssi_countable_earned_income_with_general_exclusion_used], [max, 0, ["-", ["+", ["-", ssi_federal_benefit_rate_individual, ma_ssi_countable_earned_income_with_general_exclusion_used], ssi_general_income_exclusion], ma_ssi_household_unearned_income_before_deeming]]], [else, [max, 0, ["+", [max, 0, ["-", ssi_general_income_exclusion, ma_ssi_household_unearned_income_before_deeming]], ["/", ["-", ssi_federal_benefit_rate_individual, ma_ssi_countable_earned_income_with_general_exclusion_used], ssi_earned_income_disregard_rate]]]]]
sources: [S3413, S4080, S310, S309, S706]
implemented: engine
tags: [ma, non_magi, income, household]
rationale: "Coverage review, 416.1165(e)(3) fill-up: 'We do not deem more income to an eligible child than the amount which, when combined with the child's own income, reduces his or her SSI benefit to zero.' ma_ssi_parental_income_deemed (CO-4626) divided the parents' income equally whatever each child's own income; this item states each child's limit, from the child's own income alone."
tests:
  - {id: CO-5902-T1, month: "2026-10", as_of: "2026-10-12", given: {ma_ssi_household_unearned_income_before_deeming: 0, ma_ssi_countable_earned_income_with_general_exclusion_used: 0}, title: "a child with no income of its own: 994 - 0 + 20 - 0 = 1,014 (1,014 deemed less the $20 is 994, the FBR)", expect: 1014}
  - {id: CO-5902-T2, month: "2026-10", as_of: "2026-10-12", given: {ma_ssi_household_unearned_income_before_deeming: 0, ma_ssi_countable_earned_income_with_general_exclusion_used: 800}, title: "a child earning 1,665 (800 countable): 994 - 800 + 20 - 0 = 214 (214 - 20 + 800 = 994)", expect: 214}
  - {id: CO-5902-T3, month: "2026-10", as_of: "2026-10-12", given: {ma_ssi_household_unearned_income_before_deeming: 300, ma_ssi_countable_earned_income_with_general_exclusion_used: 0}, title: "a child with 300 of its own unearned income: 994 - 0 + 20 - 300 = 714 (300 + 714 - 20 = 994)", expect: 714}
  - {id: CO-5902-T4, month: "2026-10", as_of: "2026-10-12", given: {ma_ssi_household_unearned_income_before_deeming: 1100, ma_ssi_countable_earned_income_with_general_exclusion_used: 0}, title: "own income alone zeroes the benefit (1,100 - 20 = 1,080 over 994): 994 + 20 - 1,100 = -86, so 0", expect: 0}
  - {id: CO-5902-T5, month: "2026-10", as_of: "2026-10-12", given: {ma_ssi_household_unearned_income_before_deeming: 10, ma_ssi_countable_earned_income_with_general_exclusion_used: 800}, title: "own unearned income under $20: 994 - 800 + 20 - 10 = 204 (10 + 204 - 20 = 194, plus 800 = 994)", expect: 204}
  - {id: CO-5902-T6, month: "2026-10", as_of: "2026-10-12", given: {ma_ssi_household_unearned_income_before_deeming: 0, ma_ssi_countable_earned_income_with_general_exclusion_used: 1000}, title: "earned income over the FBR once the $20 is used (wages 2,065: (2,065 - 65) / 2 = 1,000), under it with the $20 (990): max(0, 20 - 0) - (1,000 - 994) / 0.5 = 20 - 12 = 8 (8 deemed leaves 12 of the $20 for earnings: (2,065 - 65 - 12) / 2 = 994)", expect: 8}
