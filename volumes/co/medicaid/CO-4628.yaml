  - {id: CO-4628-T2, as_of: "2026-10-12", month: "2026-10", title: "blind: blind work expenses instead", given: {resides_in_medical_institution: false, meets_ssa_disability_criteria: true, is_blind: true, date_of_birth: "1986-01-01", impairment_related_work_expenses_paid: 200}, relationships: [], expect: 0}
