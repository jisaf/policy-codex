id: CO-4628
name: "Medicaid: impairment-related work expenses excluded"
identifier: ma_ssi_impairment_related_work_expenses
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The impairment-related work expenses excluded from the earned income of this person's SSI-related household for the month (20 CFR 416.1112(c)(6), incorporated by 10 CCR 2505-10 § 8.100.5.H.4.e): impairment_related_work_expenses_paid of each member living together (the spouse group of ma_ssi_countable_earned_income) who meets the SSA disability criteria, is not blind and is under ma_aged_age."
precision: "Subtracted after the $65 and any unused $20 and before the one half (416.1112(c)(5)-(7)). A person who received SSI as disabled for the month before turning 65 keeps the exclusion under (c)(6); that history is not stated, so the exclusion stops at 65. The pre-1990 rule of (c)(6)(i) is historical. Coverage pass 4, non-MAGI N4-9 (docs/operators.md, \"Ages in a month\"): the age is taken in the month evaluated, not on the determination date: an \"under N\" test on the first day of the month (ma_age_on_first_day_of_month, CO-4978), an \"N or older\" test on the last day (ma_age_on_last_day_of_month, CO-5402), and a test that excludes the person from what is favorable on the other day."
derived: [sum, ma_ssi_couple_members, [case, [[all, [otherwise, [of, [P], meets_ssa_disability_criteria], false], [not, [otherwise, [of, [P], is_blind], false]], ["<", [of, [P], ma_age_on_first_day_of_month], ma_aged_age]], [otherwise, [of, [P], impairment_related_work_expenses_paid], 0]], [else, 0]]]
sources: [S3412]
implemented: engine
tags: [ma, non_magi, income, disability]
rationale: "Coverage review NM-8: § 8.100.5.H.4.e incorporates 20 CFR 416.1112, but impairment-related work expenses had no fact and no exclusion, so a disabled worker's countable earned income was too high. Coverage pass 3 C3-1: sums over ma_ssi_couple_members (CO-3626), which keeps a newly admitted spouse in the couple through the admission month (§ 8.100.7.C.2.b) except for the institutionalized spouse's own test (42 U.S.C. 1396r-5(b)(1)); it had filtered on resides_in_medical_institution, which split the couple's incomes from the admission day while the size and resources still read them together."
