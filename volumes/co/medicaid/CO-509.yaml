id: CO-509
name: "Medicaid: meets the citizenship requirement"
identifier: ma_meets_citizenship_requirement
kind: derived
type: yes/no
scope: person
program: Medicaid
meaning: "Whether the person falls into one of the citizenship and immigration status categories of 10 CCR 2505-10 § 8.100.3.G.1.g (and 42 CFR 435.406(a)) that admit a person to full Medical Assistance: a citizen or national (i); a lawfully residing non-citizen who entered the United States before August 22, 1996 (ii); a qualified non-citizen who has held the status for five years (iii) or is exempt from the five-year rule (iv-v, ma_is_five_year_bar_exempt, CO-1172), and, from October 1, 2026, is also a lawful permanent resident, a Cuban or Haitian entrant or a Compact of Free Association migrant (42 U.S.C. 1396b(v)(5), ma_is_in_federal_payment_status_category, CO-2400); or a lawfully residing non-citizen who is a pregnant woman or a child under ma_magi_child_age_limit (vii, the CHIPRA 214 option, which 1396b(v)(5) keeps through its paragraph (4)). The Cover All Coloradans exception (ix.1) is not part of this test: it reaches only the categories ix.1.a-b list, which read ma_meets_status_for_cover_all_coloradans_categories (CO-1174) instead."
precision: "The five-year rule is counted from qualified_status_date (has_held_qualified_status_five_years, CO-508); § 8.100.3.G.1.g.iii counts it from the date of entry, which for a person admitted directly as a Lawful Permanent Resident is the same date. The lawfully residing arm (vii) reads ma_is_lawfully_present (CO-507), which includes every qualified non-citizen, so a Lawful Permanent Resident inside the five-year rule who is pregnant or under ma_magi_child_age_limit meets status through vii (\"falls into one of the categories listed in Section 8.100.3.G.1.g.iii... not subject to the five-year rule\"), as the text states; the age is read strictly as \"under the age of 19 years\". ii (a lawfully residing non-citizen who entered before August 22, 1996) reads ma_is_lawfully_present (CO-507) and us_entry_date (CO-1726) against qualified_non_citizen_entry_cutoff_date (CO-279), and from October 1, 2026 is subject to the same 1396b(v)(5)(B) limit as the qualified arm. viii (Afghan humanitarian parolees) is an exemption from the five-year rule and is read in ma_is_five_year_bar_exempt (CO-1172). B-1 limited the lawfully present arm to pregnant women and children, as vii states; B-2 replaced the veteran-only exemption with CO-1172; S-2 moved the Cover All Coloradans disjuncts to ma_is_cover_all_coloradans_person (CO-1173). See OQ-213 and OQ-214. The citizen-or-national arm reads is_us_citizen_or_national (CO-1358). From October 1, 2026 (ma_alien_payment_restriction_applies, CO-3034) the qualified non-citizen arm also requires a 1396b(v)(5)(B) status (CO-2400): a refugee, asylee, parolee, trafficking victim or other qualified non-citizen adult who is not a lawful permanent resident fails status and is reported emergency-only (CO-510), as CMS SHO #26-001 directs; a refugee or asylee child under ma_magi_child_age_limit or pregnant woman keeps full coverage through vii, since qualified non-citizens are lawfully residing for the CHIPRA 214 option (S1705). The determination date decides which rule applies, so a retroactive month before October 2026 on a later application is judged by the October 2026 rule (OQ-510). Colorado's § 8.100.3.G.1.g (version effective 11/14/2026) has not been amended; the federal limit is applied regardless (HCPF review B-1)."
statute_override: "Federal law overrides 10 CCR 2505-10 § 8.100.3.G.1.g.iii-v, which still admits refugees, asylees, parolees and other qualified non-citizen adults to full Medical Assistance: from October 1, 2026, 42 U.S.C. 1396b(v)(5) (Pub. L. 119-21 sec. 71109) allows federal payment for full coverage only for a citizen or national, a lawful permanent resident, a Cuban or Haitian entrant or a Compact of Free Association resident, so other qualified non-citizen adults are emergency-only unless Colorado funds them (OQ-518)."
