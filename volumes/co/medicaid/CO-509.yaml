rationale: "No existing Medicaid item combines the citizen/national test, the qualified-non-citizen five-year rule and its exemptions, and the lawfully residing pregnant woman and child category into the single status test the Medical Assistance categories read. Not the same test as any SNAP citizenship item, because 8.100.3.G.1.g's categories are Medicaid-specific text. History: batch 6 added the postpartum term; the fix round (C-8) used ma_is_under_child_age_or_turns_nineteen_this_month for the Cover All Coloradans age term; the phase-3 C-1 fix read the lawful-presence arm only for a non-qualified person. Phase 7 fix round: B-1 (the lawful-presence arm admitted any lawfully present adult, which vii limits to pregnant women and children under 19), B-2 (refugees, asylees, Cuban/Haitian entrants, COFA migrants and the other iv categories were held to the five-year rule they are exempt from; the 40-quarters exemption was missing) and S-2 (the Cover All Coloradans disjuncts satisfied status for every category, not only those ix.1.a-b lists; they now live in CO-1173). History moved from the precision note (HCPF review S-14): Phase 7 fix round: B-1 limited the lawfully present arm to pregnant women and children, as vii states; B-2 replaced the veteran-only exemption with CO-1172; S-2 moved the Cover All Coloradans disjuncts to ma_is_cover_all_coloradans_person (CO-1173). See OQ-213 and OQ-214. Vocabulary fix round (U-3): the citizen-or-national arm reads is_us_citizen_or_national (CO-1358). From October 1, 2026 (ma_alien_payment_restriction_applies, CO-3034) the qualified non-citizen arm also requires a 1396b(v)(5)(B) status (CO-2400): a refugee, asylee, parolee, trafficking victim or other qualified non-citizen adult who is not a lawful permanent resident fails status and is reported emergency-only (CO-510), as CMS SHO #26-001 directs; a refugee or asylee child under ma_magi_child_age_limit or pregnant woman keeps full coverage through vii, since qualified non-citizens are lawfully residing for the CHIPRA 214 option (S1705). The determination date decides which rule applies, so a retroactive month before October 2026 on a later application is judged by the October 2026 rule (OQ-510). Colorado's § 8.100.3.G.1.g (version effective 11/14/2026) has not been amended; the federal limit is applied regardless (HCPF review B-1). Precision history (moved from precision, engineering follow-up pass task 5): (phase-3 K-2).  OQ-44 fix (product-owner decision of 2026-11-21; docs/reviews/audit-dual-entry.md 3.1; same-word audit SW-18): reads the one immigration_status fact (CO-002), which replaced citizenship_status, lawful_presence_status (CO-084), federal_five_year_bar_exempt_category (CO-1724) and ma_five_year_bar_exempt_category (CO-1170). The ii arm (entry before August 22, 1996) is now modeled from us_entry_date. Legal UX walkthrough L3 (audit fix round 4): the departure from the rule text now carries its statute_override note. Tagged legal."
