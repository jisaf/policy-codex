id: CO-509
name: "Medicaid: meets the citizenship requirement"
identifier: ma_meets_citizenship_requirement
kind: derived
type: yes/no
scope: person
program: Medicaid
meaning: Whether the person meets Medical Assistance's citizenship/immigration-status requirement for full benefits under 42 CFR 435.406 and 10 CCR 2505-10 8.100.3.G.1.g - a citizen or national; a qualified non-citizen who meets the five-year bar or an exception to it (this batch models the veteran/active-duty exception); or, regardless of status, a person under ma_magi_child_age_limit, a pregnant person, or a person within 12 months postpartum, per Colorado's Cover All Coloradans rule ("Persons who are under the age of 19 ... who are pregnant, or who are within 12 months of the beginning of their postpartum period shall not be excluded from the following Medical Assistance Categories on the basis of immigration status," 8.100.3.G.1.g.viii.1).
precision: "The postpartum extension is read as 12 months after the month the person's most recent pregnancy ended (ma_postpartum_coverage_end_month, CO-560, batch 6), through the last day of that month; a person with no known pregnancy_end_date is treated as not postpartum (known false), not unknown, so this term does not turn the whole item unknown for a person for whom postpartum status is simply inapplicable or not yet stated. The five-year-bar exceptions this batch models are limited to the veteran/active-duty category (8.100.3.G.1.g.iv.1-2). The lawful-presence arm (ma_is_lawfully_present, CO-507) is read only for a person who is NOT a qualified non-citizen ([not, ma_is_qualified_non_citizen]): a qualified non-citizen's status is governed exclusively by the qualified/five-year-bar arm immediately before it, so a qualified non-citizen inside the bar cannot shortcut the bar by also being 'lawfully present' - fixed per the phase-3 review's C-1 finding, which found ma_is_lawfully_present as a bare disjunct of this item made ma_meets_five_year_bar (CO-508) unreachable for every qualified non-citizen."
derived: [any, [in, citizenship_status, [citizen, us_national]], [all, ma_is_qualified_non_citizen, [any, ma_meets_five_year_bar, is_veteran_or_active_duty]], [all, [not, ma_is_qualified_non_citizen], ma_is_lawfully_present], [<, age, ma_magi_child_age_limit], is_pregnant, [all, [not, [unknown, pregnancy_end_date]], [<, [det_date], [first_day, [month_after, ma_postpartum_coverage_end_month]]]]]
sources: [S173, S174, S175, S224]
implemented: engine
tags: [ma, magi, immigration, age]
rationale: "No existing Medicaid item combines the citizen/national test, the qualified-non-citizen five-year-bar test and its exceptions, and Colorado's Cover All Coloradans age/pregnancy/postpartum exception into the single yes/no test ma_is_emergency_medicaid_only (CO-510) and batch 6's category-eligibility rules need. Not the same test as any SNAP citizenship item (snap_meets_citizenship_requirement, batch 1) because Colorado's Cover All Coloradans rule and the 435.406(b) emergency-only carve-out are Medicaid-specific text with no SNAP counterpart. Edited by batch 6 to add the postpartum term OQ-43 flagged as missing, once pregnancy_end_date (CO-089) and ma_postpartum_coverage_end_month (CO-560) existed to build it from; see the batch-6 report and the rewritten OQ-43."
tests:
