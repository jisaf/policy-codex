id: CO-509
name: "Medicaid: meets the citizenship requirement"
identifier: ma_meets_citizenship_requirement
kind: derived
type: yes/no
scope: person
program: Medicaid
meaning: "Whether the person falls into one of the citizenship and immigration status categories of 10 CCR 2505-10 § 8.100.3.G.1.g (and 42 CFR 435.406(a)) that admit a person to full Medical Assistance: a citizen or national (i); a qualified non-citizen who has held the status for five years (iii) or is exempt from the five-year rule (iv-v, ma_is_five_year_bar_exempt, CO-1172); or a lawfully residing non-citizen who is a pregnant woman or a child under 19 (vii, the CHIPRA 214 option). The Cover All Coloradans exception (ix.1) is not part of this test: it reaches only the categories ix.1.a-b list, which read ma_meets_status_for_cover_all_coloradans_categories (CO-1174) instead."
precision: "The five-year rule is counted from qualified_status_date (has_held_qualified_status_five_years, CO-508); § 8.100.3.G.1.g.iii counts it from the date of entry, which for a person admitted directly as a Lawful Permanent Resident is the same date. The lawfully residing arm (vii) reads ma_is_lawfully_present (CO-507), which includes every qualified non-citizen, so a Lawful Permanent Resident inside the five-year rule who is pregnant or under 19 meets status through vii (\"falls into one of the categories listed in Section 8.100.3.G.1.g.iii ... not subject to the five-year rule\"), as the text states; the age is read strictly as \"under the age of 19 years\". ii (a lawfully residing non-citizen who entered before August 22, 1996) is not modeled, because no fact states the date of entry (phase-3 K-2). viii (Afghan humanitarian parolees) exempted parolees only until March 31, 2023 or the end of parole; not modeled. Phase 7 fix round: B-1 limited the lawfully present arm to pregnant women and children, as vii states; B-2 replaced the veteran-only exemption with CO-1172; S-2 moved the Cover All Coloradans disjuncts to ma_is_cover_all_coloradans_person (CO-1173). See OQ-213 and OQ-214. Vocabulary fix round (U-3): the citizen-or-national arm reads is_us_citizen_or_national (CO-1358)."
derived: [any, is_us_citizen_or_national, [all, is_qualified_non_citizen, [any, has_held_qualified_status_five_years, ma_is_five_year_bar_exempt]], [all, ma_is_lawfully_present, [any, is_pregnant, [<, age, ma_magi_child_age_limit]]]]
sources: [S173, S655, S656, S657, S658, S607, S176]
open: [OQ-213, OQ-214]
implemented: engine
tags: [ma, magi, immigration, age]
rationale: "No existing Medicaid item combines the citizen/national test, the qualified-non-citizen five-year rule and its exemptions, and the lawfully residing pregnant woman and child category into the single status test the Medical Assistance categories read. Not the same test as any SNAP citizenship item, because 8.100.3.G.1.g's categories are Medicaid-specific text. History: batch 6 added the postpartum term; the fix round (C-8) used ma_is_under_child_age_or_turns_nineteen_this_month for the Cover All Coloradans age term; the phase-3 C-1 fix read the lawful-presence arm only for a non-qualified person. Phase 7 fix round: B-1 (the lawful-presence arm admitted any lawfully present adult, which vii limits to pregnant women and children under 19), B-2 (refugees, asylees, Cuban/Haitian entrants, COFA migrants and the other iv categories were held to the five-year rule they are exempt from; the 40-quarters exemption was missing) and S-2 (the Cover All Coloradans disjuncts satisfied status for every category, not only those ix.1.a-b lists; they now live in CO-1173)."
