id: CO-7552
name: "Medicaid: in the Cover All Coloradans population in the month"
identifier: ma_is_cover_all_coloradans_person_in_month
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether, in the month evaluated, the person is in the population 10 CCR 2505-10 § 8.100.3.G.1.g.ix.1 (Cover All Coloradans) protects from exclusion on the basis of immigration status: under 19 or with the 19th birthday in the month (ma_is_under_child_age_or_turns_nineteen_this_month, CO-564), pregnant in the month (ma_is_pregnant_in_month, CO-3601), or in the month the most recent pregnancy ended or one of the 12 months after it (most_recent_pregnancy_end_date, CO-7400; ma_postpartum_coverage_end_month, CO-560)."
precision: "Pattern sweep, MAGI (2026-11-24, docs/reviews/pattern-sweep-magi.md, PS-02). ix.1 (S607) and CHP+'s § 110.1.B.5.o (S606) name 'Persons who are under the age of 19, whose 19th birthday occurred in the current month, who are pregnant, or who are within 12 months of the beginning of their postpartum period': 'the current month' is the month evaluated (§ 8.100.4.G.1, S3351; § 8.100.3.E.1, S217, a retroactive month's own requirements). ma_is_cover_all_coloradans_person (CO-1173) measures each condition on the determination date, so a youth who turned 19 after a retroactive month was outside the population in that month, and a woman pregnant in a retroactive month whose pregnancy had ended more than 12 months later was too. The postpartum months begin with the month the pregnancy ended, as CO-1173 counts them ('the beginning of their postpartum period'); with no ended pregnancy known (CO-7400 unknown: no end date and no birth recorded) the person is not postpartum, as CO-1173 and pregnancy_end_date (CO-089) declare. CO-1173 is unchanged for its person-scope readers (the presumptive determinations, read on the determination date) and the non-MAGI categories."
derived: [any, ma_is_under_child_age_or_turns_nineteen_this_month, ma_is_pregnant_in_month, [all, [not, [unknown, most_recent_pregnancy_end_date]], [">=", [month], [month_of, most_recent_pregnancy_end_date]], ["<=", [month], ma_postpartum_coverage_end_month]]]
sources: [S607, S606, S3351, S217]
implemented: engine
tags: [ma, magi, immigration, age]
nearest: [CO-1173]
rationale: "Pattern sweep, MAGI (PS-02): CO-1173 is person-scope and read by the month-scoped MAGI and CHP+ items (CO-562, CO-1175, CO-1174's readers, CHP+'s CO-2707), so the Cover All Coloradans population of a retroactive month was the determination date's. UNDOC-19 (stored household CO-1002): an undocumented youth who turned 19 on 2026-09-20, applying on 2026-11-02 with a retroactive request, was emergency-only in August and September, though the rule protects her in both (under 19; her 19th birthday in the current month)."
tests:
  - {id: CO-7552-T1, as_of: "2026-11-10", month: "2026-09", title: "PS-02 (UNDOC-19): born 2007-09-20, September 2026: the 19th birthday in the current month", given: {date_of_birth: "2007-09-20", is_pregnant: false, sex: female}, expect: true}
  - {id: CO-7552-T2, as_of: "2026-11-10", month: "2026-10", title: "PS-02 (UNDOC-19): the same, October 2026: 19, not pregnant, no pregnancy", given: {date_of_birth: "2007-09-20", is_pregnant: false, sex: female}, expect: false}
  - {id: CO-7552-T3, as_of: "2026-11-10", month: "2025-08", title: "PS-02: pregnant from 2025-06-01 to a birth on 2025-09-10 (end stated), August 2025 (pregnant in the month; on the determination date more than 12 months after the end)", given: {date_of_birth: "1995-02-01", is_pregnant: false, pregnancy_start_date: "2025-06-01", pregnancy_end_date: "2025-09-10", ma_application_date: "2025-08-05"}, expect: true}
  - {id: CO-7552-T4, as_of: "2026-11-10", month: "2026-09", title: "PS-02: the same pregnancy, September 2026: the 12th month after September 2025", given: {date_of_birth: "1995-02-01", is_pregnant: false, pregnancy_start_date: "2025-06-01", pregnancy_end_date: "2025-09-10", ma_application_date: "2025-08-05"}, expect: true}
  - {id: CO-7552-T5, as_of: "2026-11-10", month: "2026-10", title: "PS-02: the same, October 2026: past the 12 months", given: {date_of_birth: "1995-02-01", is_pregnant: false, pregnancy_start_date: "2025-06-01", pregnancy_end_date: "2025-09-10", ma_application_date: "2025-08-05"}, expect: false}
  - {id: CO-7552-T6, as_of: "2026-11-10", month: "2025-04", title: "PS-02: the same, April 2025: before the pregnancy, not postpartum", given: {date_of_birth: "1995-02-01", is_pregnant: false, pregnancy_start_date: "2025-06-01", pregnancy_end_date: "2025-09-10", ma_application_date: "2025-03-05"}, expect: false}
