id: CO-3387
name: "SSI method: student earned income exclusion basis for the month"
identifier: ssi_student_earned_income_exclusion_basis
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "For a student under 22 regularly attending school, the month's earned income (wages_gross and ma_self_employment_net_earnings) up to the monthly maximum of the student earned income exclusion (20 CFR 416.1112(c)(3)); 0 for anyone else. ma_ssi_excluded_earned_income (CO-2471) applies the yearly maximum to the running total of it."
derived: [case, [[all, ["<", age, ssi_student_age_limit], ssi_is_student_regularly_attending_school], [min, [+, wages_gross, ma_self_employment_net_earnings], ssi_student_earned_income_exclusion_monthly]], [else, 0]]
sources: [S2210, S2211]
implemented: engine
tags: [non_magi, income, student]
rationale: "Same-word audit SW-28: the student earned income exclusion's yearly maximum needs the months before; this item is the month's amount before the yearly cap, so the exclusion is computed without an item reading itself."
tests:
  - {id: CO-3387-T1, month: "2026-01", as_of: "2026-01-15", given: {date_of_birth: "2008-01-01", ssi_is_student_regularly_attending_school: true, wages_gross: 3000, ma_self_employment_net_earnings: 0}, expect: 2410}
  - {id: CO-3387-T2, month: "2026-01", as_of: "2026-01-15", given: {date_of_birth: "1990-01-01", ssi_is_student_regularly_attending_school: true, wages_gross: 3000}, expect: 0}
