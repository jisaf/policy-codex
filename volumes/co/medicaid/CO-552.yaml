id: CO-552
name: "Medicaid: meets a MAGI category's non-income requirements"
identifier: ma_meets_some_category_demographics
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: Whether the person meets at least one MAGI covered group's non-income requirements (age, pregnancy, dependent-child relationship, or former-foster-care history) regardless of whether their household income is within that group's standard - used to distinguish a person who has no income-eligible category from a person who has no category at all, whatever their income.
precision: "The former foster care term reads ma_is_former_foster_care_category (CO-549) itself, which has no income half (vocabulary review D-4: it had read the retired was_foster_youth_at_eighteen, CO-054, while the category rule read ma_age_at_foster_care_exit, so the two could disagree). Otherwise restates each category rule's own non-income conditions rather than reading the category rules themselves, because ma_is_child_category and its siblings already combine the demographic test with the income test and cannot be asked for only one half. The Parents/Caretaker demographic term no longer tests minimum essential coverage, mirroring CO-547's fix-round edit (C-3): the MEC condition belongs to the Adults category's own demographic term instead. Same-word audit SW-1/SW-3 (engineering follow-up pass, OQ-396): \"parent or caretaker relative\" is ma_caretaker_relative_of (CO-2606), Medicaid's own reading of the neutral parent, stepparent and has_primary_responsibility_for roles."
derived: [any, [<, age, ma_magi_child_age_limit], ma_is_pregnant_in_month, [exists, ma_caretaker_relative_of, [of, [P], ma_is_dependent_child]], [all, [">=", age, ma_magi_child_age_limit], [<, age, ma_adult_upper_age_limit], [not, ma_is_pregnant_in_month], [not, is_medicare_entitled_or_enrolled], [not, [exists, ma_caretaker_relative_of, [all, [<, [of, [P], age], ma_magi_child_age_limit], [not, [of, [P], dependent_child_has_minimum_essential_coverage]]]]]], ma_is_former_foster_care_category, [all, [<, age, ma_needy_newborn_age_limit_years], mother_was_enrolled_in_medicaid_at_birth]]
sources: [S638, S640, S639, S1732, S1718, S1733]
implemented: engine
tags: [ma, magi, age]
rationale: "No existing item separates a category's demographic conditions from its income test. ma_magi_eligibility_status (CO-554) needs this to report 'ineligible_income' (fits a category's demographics but is over income) rather than 'ineligible_no_category' (fits none at all, such as an elderly Medicare-entitled person excluded from the Adults category by age and Medicare status alone) for a person whose ma_magi_category is 'none'. Fix round: mirrored CO-547/CO-548's C-3 MEC relocation. Final verification F-1 (2026-11-22): reads ma_is_pregnant_in_month (CO-3601) in place of the current-status is_pregnant, so a retroactive month before a birth or other end of pregnancy is a pregnant month (§ 8.100.3.E.1-2, S1503, S2411; 42 U.S.C. 1396a(e)(16), S224)."
tests:
  - {id: CO-552-T1, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "1990-01-01", is_pregnant: false, is_medicare_entitled_or_enrolled: false, ma_age_at_foster_care_exit: 0, was_enrolled_in_medicaid_at_foster_care_exit: false, mother_was_enrolled_in_medicaid_at_birth: false}, relationships: [], expect: true}
  - {id: CO-552-T2, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "1947-03-12", is_pregnant: false, is_medicare_entitled_or_enrolled: true, ma_age_at_foster_care_exit: 0, was_enrolled_in_medicaid_at_foster_care_exit: false, mother_was_enrolled_in_medicaid_at_birth: false}, relationships: [], expect: false}
