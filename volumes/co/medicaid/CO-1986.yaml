id: CO-1986
name: Qualifies for the veterans-related personal needs allowance
identifier: ma_qualifies_for_veterans_personal_needs_allowance
kind: derived
type: yes/no
scope: person
program: Medicaid
meaning: Whether the person, a resident of a nursing facility or other Long-Term Care institution, receives a non-service-connected disability pension from the U.S. Department of Veterans Affairs and has no spouse or dependent child, or is the surviving spouse of a person who received such a pension and has no dependent child (10 CCR 2505-10 § 8.100.7.V.3.d.ii; C.R.S. 25.5-6-206(2)(b)).
precision: "A dependent child is a child of the person who is a dependent child under the Medical Assistance rules (ma_is_dependent_child)."
derived: [all, [not, [exists, [filter, [persons], [rel, [parent], [P]]], [of, [P], ma_is_dependent_child]]], [any, [all, receives_va_non_service_connected_pension, [not, is_married]], [otherwise, is_surviving_spouse_of_va_pensioner, false]]]
sources: [S1231, S1232]
implemented: engine
tags: [ma, ltc, income]
rationale: "OQ-98: the $90 allowance turns on VA pension receipt and the absence of a spouse or dependent child, which no fact states. Dual-entry audit 2.11: derived from the VA pension facts (CO-2862, CO-2863), is_married (CO-930) and the person's dependent children read across the parent edge."
tests:
  - {id: CO-1986-T5, title: "Unmarried pensioner, no children", as_of: "2026-11-01", given: {receives_va_non_service_connected_pension: true, is_married: false}, relationships: [], expect: true}
  - {id: CO-1986-T6, title: "Married pensioner", as_of: "2026-11-01", given: {receives_va_non_service_connected_pension: true, is_married: true}, relationships: [], expect: false}
