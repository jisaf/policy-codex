id: CO-614
name: "Medicaid: is Specified Low-Income Medicare Beneficiary (SLMB) eligible"
identifier: ma_slmb_eligible
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether the person is eligible as a Specified Low-Income Medicare Beneficiary - entitled to Medicare Part A, countable income above the QMB limit but at or below ma_slmb_income_limit_pct of the federal poverty level for their household size, and countable resources at or below the MSP resource limit - per 10 CCR 2505-10 8.100.6.M."
precision: "Same monthly-guideline shape as ma_qmb_eligible (CO-613); the \"above QMB\" floor is read from ma_qmb_eligible directly rather than restating the 100% comparison, so a person who qualifies for QMB is not also reported SLMB-eligible (ma_msp_category, CO-617, tests QMB first regardless, but this item's own floor keeps it accurate standing alone). Reads ma_ssi_poverty_guideline_monthly (CO-1750) instead of restating the lookup. For an SLMB member in the December before the month, the annual Social Security cost-of-living increase is subtracted from countable income through the month following the month the year's poverty guidelines are published (§ 8.100.6.M.7; ma_msp_cola_disregard, CO-3629; OQ-622). Pattern sweep, non-MAGI Medicaid (docs/reviews/pattern-sweep-nonmagi.md, P1): Part A entitlement is read in the month (ma_is_entitled_to_medicare_part_a_in_month, CO-7503; § 8.100.6.M.2.a, M.5, N.3-4, S2407, S1749; § 8.100.3.E.1, S1503). Before, the entitlement of the determination date was read in every month, so a retroactive month before Part A began was an MSP month."
derived: [all, ma_is_entitled_to_medicare_part_a_in_month, [not, ma_qmb_eligible], [<=, ["-", ma_ssi_countable_income, [case, [["=", ma_msp_december_category, slmb], ma_msp_cola_disregard], [else, 0]]], ["*", ma_ssi_poverty_guideline_monthly, ma_slmb_income_limit_pct]], [<=, ma_msp_countable_resources, [case, [["=", ma_ssi_household_size, 2], ma_msp_resource_limit_couple], [else, ma_msp_resource_limit_individual]]]]
sources: [S1748, S2407, S1503]
implemented: engine
tags: [ma, non_magi, msp, income, resources]
open: [OQ-622, OQ-900]
rationale: "No existing item states the SLMB eligibility test. ma_msp_category (CO-617) needs it. History moved from the precision note (HCPF review S-14): Vocabulary fix round (U-1): reads ma_ssi_poverty_guideline_monthly (CO-1750) instead of restating the lookup. Final verification F-6 (2026-11-22): a member of this program in the December before the month keeps the annual Social Security COLA disregarded (ma_msp_cola_disregard, CO-3629) through the period § 8.100.6.L.12, M.7 or N.6 names (S2406, S2407, S2409; OQ-622). Coverage pass 3 C3-5: reads ma_msp_countable_resources (CO-5206), which leaves out a home counted only because of a recorded beneficiary deed: Medicare Savings Program benefits are not subject to estate recovery (42 U.S.C. 1396p(b)(1)(B)(ii); OQ-900)."
tests:
  - {id: CO-614-T1, as_of: "2026-10-01", month: "2026-10", given: {medicare_part_a_entitled: true, ma_qmb_eligible: false, ma_ssi_countable_income: 1500, ma_ssi_household_size: 1, ma_msp_countable_resources: 3000}, expect: true}
  - {id: CO-614-T2, as_of: "2026-10-01", month: "2026-10", given: {medicare_part_a_entitled: true, ma_qmb_eligible: true, ma_ssi_countable_income: 1200, ma_ssi_household_size: 1, ma_msp_countable_resources: 3000}, expect: false}
  # Time audit T-9: each comparison tested at its limit, with the two sides equal (the strict/inclusive flip of the comparison fails it).
  - {"id": "CO-614-T3", "month": "2026-10", "as_of": "2026-10-01", "title": "T-9: ma_msp_countable_resources equal to [\"case\",[[\"=\",\"ma_ssi_household_size\",2],\"ma_msp_resource_limit_couple\"],[\"else\",\"ma_msp_resource_limit_individual\"]] (ma_msp_countable_resources at or under [\"case\",[[\"=\",\"ma_ssi_household_size\",2],\"ma_msp_resource_limit_couple\"],[\"else\",\"ma_msp_resource_limit_individual\"]])", "given": {"medicare_part_a_entitled": true, "ma_qmb_eligible": false, "ma_ssi_countable_income": 1500, "ma_ssi_household_size": 1, "ma_msp_countable_resources": 9950}, "expect": true}
  # Pattern sweep P1: Part A from 2026-10-01, determined 2026-11-12. August is before the entitlement: false whatever the income and resources.
  - {id: CO-614-T90, month: "2026-08", as_of: "2026-11-12", title: "Pattern sweep: a retroactive month before Part A entitlement", given: {medicare_part_a_entitled: true, medicare_part_a_entitlement_date: "2026-10-01"}, expect: false}
