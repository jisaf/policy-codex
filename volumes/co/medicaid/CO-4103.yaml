id: CO-4103
name: "Medicaid: VA Aid and Attendance is used as patient payment"
identifier: ma_va_aid_and_attendance_is_patient_payment
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether the portion of the person's VA pension for Aid and Attendance and Unusual Medical Expenses (va_aid_and_attendance_amount) is used as patient payment to the medical facility, under 10 CCR 2505-10 § 8.100.5.K.2: the person receives that portion (receives_va_aid_and_attendance), lives in a State Veterans Home (resides_in_state_veterans_home) and has no dependents - is not married and has no child who is a dependent child under the Medical Assistance rules (ma_is_dependent_child). Otherwise (K.1.a-b) the portion is not used as patient payment."
assumption: "§ 8.100.5.K does not define 'dependents'. The volume reads them as a spouse or a dependent child, as § 8.100.7.V.3.d.ii's veterans' personal needs allowance, the other Long-Term Care rule about a VA pensioner, says 'has no spouse or dependent child' (ma_qualifies_for_veterans_personal_needs_allowance, CO-1986; OQ-720)."
precision: "K speaks only of 'a veteran or surviving spouse of a veteran': K.1.a, K.1.b and K.2 together cover every such person in a medical facility, so the rule treats a recipient of the pension's A&A or UME portion as one, and the volume reads no separate veteran or surviving-spouse fact. Eligibility is unchanged: K's lead-in excludes the portion from income 'when determining eligibility', which ma_ltc_gross_income (CO-641) does in every case; this item only decides whether ma_patient_payment (CO-658) adds the portion back."
derived: [all, receives_va_aid_and_attendance, resides_in_state_veterans_home, [not, is_married], [not, [exists, [filter, [persons], [rel, [parent], [P]]], [of, [P], ma_is_dependent_child]]]]
sources: [S2900, S1231]
implemented: engine
tags: [ma, ltc, income]
open: [OQ-720]
rationale: "Final verification pass 2, F2-2 (docs/reviews/final2-medicaid-chp.md): ma_ltc_gross_income (CO-641) subtracted the A&A/UME portion whenever it was received, and ma_patient_payment (CO-658) started from that income, so the portion never entered the patient payment, although § 8.100.5.K.2 (S2900) uses it as patient payment for a veteran or surviving spouse with no dependents in a State Veterans Home. CO-641's precision admitted the gap; no item stated K.2's condition."
tests:
  - {id: CO-4103-T1, as_of: "2026-11-01", month: "2026-11", title: "A widowed veteran with no children in a State Veterans Home, receiving A&A: used as patient payment", given: {receives_va_aid_and_attendance: true, resides_in_state_veterans_home: true, marital_status: widowed}, relationships: [], expect: true}
  - {id: CO-4103-T2, as_of: "2026-11-01", month: "2026-11", title: "K.1.a: the same veteran in a private nursing facility: not used", given: {receives_va_aid_and_attendance: true, resides_in_state_veterans_home: false, marital_status: widowed}, relationships: [], expect: false}
  - {id: CO-4103-T3, as_of: "2026-11-01", month: "2026-11", title: "K.1.b: a married veteran (a spouse outside the case) in a State Veterans Home: not used", given: {receives_va_aid_and_attendance: true, resides_in_state_veterans_home: true, marital_status: married}, relationships: [], expect: false}
  - {id: CO-4103-T4, as_of: "2026-11-01", month: "2026-11", title: "No A&A or UME portion: nothing to use", given: {receives_va_aid_and_attendance: false}, relationships: [], expect: false}
