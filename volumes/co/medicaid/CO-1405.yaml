id: CO-1405
name: "Medicaid: requires verification of resources"
identifier: ma_requires_verification_of_resources
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether the resources of an aged, blind or disabled applicant and of a spouse living with the applicant (ma_ssi_couple_members, CO-3626) must be verified for Medical Assistance: for full Medical Assistance, any resources of either available in the month, counted or excluded (MAGI categories have no resource test); for an applicant for a Medicare Savings Program only, the liquid resources (cash, accounts, stocks and bonds, and retirement accounts that can be withdrawn), or any resource whose attested value is questionable, since the attested value of non-liquid resources, burial funds and life insurance is accepted (42 CFR 435.952(e)(2)-(4)); unless documentation is not reasonably available."
precision: "Liquid and non-liquid follow 20 CFR 416.1201(b)-(c) (S2420): cash, financial institution accounts, stocks, bonds and mutual fund shares (liquid_resources_value) and retirement accounts that can be converted to cash within 20 days (retirement_accounts_value) are liquid; real property, vehicles and household goods are not. Life insurance, which 416.1201(b) lists as liquid, is taken on attestation under 435.952(e)(4)(i) (S2419), the State accepting the attested cash surrender value under (e)(4)(i)(A); burial funds under (e)(3). A non-liquid value is verified only when the attestation is questionable (435.952(e)(2)(ii), S2418; resources_attestation_is_questionable); verification after eligibility under (e)(2)(iii) is not modeled. The couple's resources are verified once, through the applicant's resources_are_verified, as the couple's resources are counted together (ma_ssi_countable_resources, CO-608). 435.952(e)(1) on interest and dividends is ma_requires_verification_of_unearned_income (CO-1404). Final verification pass 3, P2-2: an application for the Children with Disabilities Buy-In only (ma_application_is_children_buy_in_only, CO-4206) has no resource verification: the program counts no resources (§ 8.100.6.Q.1.c) and follows the MAGI verification requirements (Q.3, S3000). A disabled child whose application is not so limited is screened in the SSI-related categories too, which count resources, so the resources are verified as before."
derived: [all, ma_is_aged_blind_or_disabled, [not, [otherwise, ma_application_is_children_buy_in_only, false]], [not, documentation_not_reasonably_available], [any, [all, [not, ma_application_is_msp_only], [exists, ma_ssi_couple_members, [any, [of, [P], has_resources_other_than_cash], [">", [of, [P], ssi_countable_resources_individual], 0]]]], [all, ma_application_is_msp_only, [any, [exists, ma_ssi_couple_members, [">", ["+", [of, [P], liquid_resources_value], [otherwise, [of, [P], retirement_accounts_value], 0]], 0]], resources_attestation_is_questionable]]]]
sources: [S3000, S866, S1089, S839, S2418, S2419, S2420]
implemented: engine
tags: [verification, ma, resources, non_magi]
rationale: "Final verification pass 3, P2-2 (2026-11-22): no resource verification for a Children with Disabilities Buy-In-only application (§ 8.100.6.Q.1.c, Q.3). No existing item states this Medical Assistance verification requirement; the phase-9 chapter needs one item per element so the person's pending counts and status can be derived. History moved from the precision note (HCPF review S-14): Vocabulary fix round (docs/reviews/vocabulary-reuse.md, R-11): the MSP-only branch reads the SSI-method countable resources the MSP resource test uses (ma_ssi_countable_resources, CO-608, through ssi_countable_resources_individual), not SNAP's liquid resources. Final verification V-6 (2026-11-22): the MSP-only arm tested ssi_countable_resources_individual, which counts real property, vehicles and life insurance, so an applicant with only non-liquid resources was asked for documents against 42 CFR 435.952(e)(2); it now reads the liquid resources and a questionable attestation. V-3: the resources of a spouse living with an aged, blind or disabled applicant count in the couple's test (CO-608) and were never verified; both arms now read the couple."
