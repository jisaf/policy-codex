  - {id: CO-1405-T3, month: "2026-10", as_of: "2026-10-01", given: {ma_ssi_couple_members: [p1], ma_is_aged_blind_or_disabled: true, documentation_not_reasonably_available: false, ma_application_is_msp_only: false, has_resources_other_than_cash: false, ssi_countable_resources_individual: 0}, expect: false}
  - {id: CO-1405-T4, month: "2026-10", as_of: "2026-10-01", given: {ma_ssi_couple_members: [p1], ma_is_aged_blind_or_disabled: true, documentation_not_reasonably_available: false, ma_application_is_msp_only: false, has_resources_other_than_cash: true, ssi_countable_resources_individual: 0}, expect: true}
  - {id: CO-1405-T5, month: "2026-10", as_of: "2026-10-01", given: {ma_ssi_couple_members: [p1], ma_is_aged_blind_or_disabled: true, documentation_not_reasonably_available: false, ma_application_is_msp_only: true, ssi_countable_resources_individual: 0, liquid_resources_value: 0, retirement_accounts_value: 0, resources_attestation_is_questionable: false}, expect: false}
