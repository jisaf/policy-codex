identifier: ma_requires_verification_of_resources
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether the person's resources must be verified for Medical Assistance: for an aged, blind or disabled applicant with resources available in the month (MAGI categories have no resource test)."
