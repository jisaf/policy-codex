id: CO-1640
name: "Medical Assistance: aged, blind and disabled income is reasonably compatible"
identifier: ma_abd_income_is_reasonably_compatible
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether an aged, blind or disabled applicant's attested monthly income is reasonably compatible with the electronic data source's figure, judged against the applicable income standard: both at or below it, both above it, or the attested figure at or below it and the data no more than ma_reasonable_compatibility_threshold_pct above the attested figure. For a long-term care applicant the figures are gross income and the standard is ma_special_income_group_pct of the SSI individual rate (the special income group); for any other aged, blind or disabled applicant they are SSI-related countable income (ma_ssi_countable_income, and ma_ssi_countable_income_reported_by_data_source for the data) and the standard is the SSI rate for the household size, the couple rate for a couple (ma_ssi_income_standard)."
precision: The long-term care comparison stays on gross income because the special income group tests gross income (§ 8.100.7.A.1). The countable comparison applies the same $20, $65 and one-half disregards to both figures and combines a spouse living with the person (OQ-374, resolved). The ma_reasonable_compatibility_threshold_pct threshold is applied to the attested figure, OQ-302's first half.
derived: [case, [ma_is_long_term_care_applicant, [any, [all, ["<=", ["+", wages_gross, ma_self_employment_net_earnings, ma_ssi_gross_unearned_receipts], ["*", ssi_federal_benefit_rate_individual, ma_special_income_group_pct]], ["<=", electronic_data_source_monthly_gross_income, ["*", ssi_federal_benefit_rate_individual, ma_special_income_group_pct]]], [all, [">", ["+", wages_gross, ma_self_employment_net_earnings, ma_ssi_gross_unearned_receipts], ["*", ssi_federal_benefit_rate_individual, ma_special_income_group_pct]], [">", electronic_data_source_monthly_gross_income, ["*", ssi_federal_benefit_rate_individual, ma_special_income_group_pct]]], [all, ["<=", ["+", wages_gross, ma_self_employment_net_earnings, ma_ssi_gross_unearned_receipts], ["*", ssi_federal_benefit_rate_individual, ma_special_income_group_pct]], ["<=", electronic_data_source_monthly_gross_income, ["*", ["+", wages_gross, ma_self_employment_net_earnings, ma_ssi_gross_unearned_receipts], ["+", 1, ma_reasonable_compatibility_threshold_pct]]]]]], [else, [any, [all, ["<=", ma_ssi_countable_income, ma_ssi_income_standard], ["<=", ma_ssi_countable_income_reported_by_data_source, ma_ssi_income_standard]], [all, [">", ma_ssi_countable_income, ma_ssi_income_standard], [">", ma_ssi_countable_income_reported_by_data_source, ma_ssi_income_standard]], [all, ["<=", ma_ssi_countable_income, ma_ssi_income_standard], ["<=", ma_ssi_countable_income_reported_by_data_source, ["*", ma_ssi_countable_income, ["+", 1, ma_reasonable_compatibility_threshold_pct]]]]]]]
sources: [S867, S864, S838, S308]
implemented: engine
tags: [verification, ma, income, non_magi]
open: [OQ-302]
rationale: "Review C-6 and OQ-302: 8.100.5.B.1.c applies reasonable compatibility against \"the applicable Medical Assistance program income standard\"; ma_income_is_reasonably_compatible (CO-1402) uses the MAGI standard, which is the wrong one for an SSI-related determination. Receipt records, migration phase 2: the attested gross income of a long-term care applicant is wages, self-employment earnings and the gross unearned receipts (ma_ssi_gross_unearned_receipts, CO-5514), which leave out loans, income tax refunds and VA Aid and Attendance (not income)."
nearest: [CO-1402]
tests:
  - {id: CO-1640-T1, month: "2026-10", as_of: "2026-10-01", given: {ma_is_long_term_care_applicant: false, ma_ssi_income_standard: 994, ma_ssi_countable_income: 880, ma_ssi_countable_income_reported_by_data_source: 930}, title: "$900 of Social Security attested, $950 reported: both countable figures within the individual rate", expect: true}
  - {id: CO-1640-T2, month: "2026-10", as_of: "2026-10-01", given: {ma_is_long_term_care_applicant: false, ma_ssi_income_standard: 994, ma_ssi_countable_income: 680, ma_ssi_countable_income_reported_by_data_source: 1180}, title: "$700 attested, $1,200 reported: the data is over the standard and more than 20% above", expect: false}
  - {id: CO-1640-T4, month: "2026-10", as_of: "2026-10-01", given: {ma_is_long_term_care_applicant: false, ma_ssi_income_standard: 1491, ma_ssi_countable_income: 1400, ma_ssi_countable_income_reported_by_data_source: 1600}, title: "OQ-374: couple at the couple rate; the data is above it but within 20% of the attested figure", expect: true}
  - {id: CO-1640-T5, month: "2026-10", as_of: "2026-10-01", given: {ma_is_long_term_care_applicant: false, ma_ssi_income_standard: 1491, ma_ssi_countable_income: 1400, ma_ssi_countable_income_reported_by_data_source: 1700}, title: "OQ-374: couple; the data is more than 20% above the attested figure", expect: false}
  - {id: CO-1640-T6, month: "2026-10", as_of: "2026-10-01", given: {ma_is_long_term_care_applicant: false, ma_ssi_income_standard: 994, ma_ssi_countable_income: 1100, ma_ssi_countable_income_reported_by_data_source: 1150}, title: "OQ-374: both countable figures over the standard", expect: true}
  - {id: CO-1640-T3, month: "2026-10", as_of: "2026-10-01", given: {ma_is_long_term_care_applicant: true, wages_gross: 0, self_employment_gross_receipts: 0, self_employment_net_earnings_for_tax: 0, electronic_data_source_monthly_gross_income: 2300, receipts: [{kind: social_security, amount: 2000}]}, expect: true}
