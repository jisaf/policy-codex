id: CO-1640
name: "Medical Assistance: aged, blind and disabled income is reasonably compatible"
identifier: ma_abd_income_is_reasonably_compatible
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether an aged, blind or disabled applicant's attested monthly gross income is reasonably compatible with the electronic data source's figure, judged against the applicable aged, blind and disabled income standard (the SSI benefit rate, or 300% of it for a long-term care applicant): both at or below it, both above it, or the attested figure at or below it and the data no more than 20% above the attested figure."
precision: Both figures are gross monthly income; the SSI-related standard is the individual rate (a couple's rate and the disregards are not applied), so the comparison is an approximation near the line (OQ-374).
derived: [any, [all, ["<=", ["+", wages_gross, ma_self_employment_net_earnings, social_security_income, pension_income, unemployment_income, child_support_received, tanf_cash_income, adult_financial_cash_income, other_unearned_income_taxable, other_unearned_income_nontaxable, tax_exempt_interest], [case, [ma_is_long_term_care_applicant, ["*", ssi_federal_benefit_rate_individual, ma_special_income_group_pct]], [else, ssi_federal_benefit_rate_individual]]], ["<=", electronic_data_source_monthly_gross_income, [case, [ma_is_long_term_care_applicant, ["*", ssi_federal_benefit_rate_individual, ma_special_income_group_pct]], [else, ssi_federal_benefit_rate_individual]]]], [all, [">", ["+", wages_gross, ma_self_employment_net_earnings, social_security_income, pension_income, unemployment_income, child_support_received, tanf_cash_income, adult_financial_cash_income, other_unearned_income_taxable, other_unearned_income_nontaxable, tax_exempt_interest], [case, [ma_is_long_term_care_applicant, ["*", ssi_federal_benefit_rate_individual, ma_special_income_group_pct]], [else, ssi_federal_benefit_rate_individual]]], [">", electronic_data_source_monthly_gross_income, [case, [ma_is_long_term_care_applicant, ["*", ssi_federal_benefit_rate_individual, ma_special_income_group_pct]], [else, ssi_federal_benefit_rate_individual]]]], [all, ["<=", ["+", wages_gross, ma_self_employment_net_earnings, social_security_income, pension_income, unemployment_income, child_support_received, tanf_cash_income, adult_financial_cash_income, other_unearned_income_taxable, other_unearned_income_nontaxable, tax_exempt_interest], [case, [ma_is_long_term_care_applicant, ["*", ssi_federal_benefit_rate_individual, ma_special_income_group_pct]], [else, ssi_federal_benefit_rate_individual]]], ["<=", electronic_data_source_monthly_gross_income, ["*", ["+", wages_gross, ma_self_employment_net_earnings, social_security_income, pension_income, unemployment_income, child_support_received, tanf_cash_income, adult_financial_cash_income, other_unearned_income_taxable, other_unearned_income_nontaxable, tax_exempt_interest], ["+", 1, ma_reasonable_compatibility_threshold_pct]]]]]
sources: [S867, S864, S838]
implemented: engine
tags: [verification, ma, income, non_magi]
open: [OQ-302, OQ-374]
rationale: "Review C-6 and OQ-302: 8.100.5.B.1.c applies reasonable compatibility against \"the applicable Medical Assistance program income standard\"; ma_income_is_reasonably_compatible (CO-1402) uses the MAGI standard, which is the wrong one for an SSI-related determination."
nearest: [CO-1402]
