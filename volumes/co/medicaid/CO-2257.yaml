  - {id: CO-2257-T2, as_of: "2026-10-01", title: "A 16-year-old placed privately; parents lived in Utah at placement", given: {ma_was_placed_in_institution_by_a_state: false, date_of_birth: "2010-01-01", ma_parent_or_guardian_state_at_placement: UT}, expect: UT}
  - {id: CO-2257-T3, as_of: "2026-10-01", title: "A 40-year-old incapable since birth; parents lived in Colorado at placement", given: {ma_was_placed_in_institution_by_a_state: false, date_of_birth: "1986-01-01", ma_became_incapable_of_indicating_intent_before_age_twenty_one: true, ma_parent_or_guardian_state_at_placement: CO}, expect: CO}
  - {id: CO-2257-T4, as_of: "2026-10-01", title: "A 75-year-old incapable since a stroke, in a Colorado facility", given: {ma_was_placed_in_institution_by_a_state: false, date_of_birth: "1951-01-01", ma_became_incapable_of_indicating_intent_before_age_twenty_one: false, ma_institution_state: CO}, expect: CO}
