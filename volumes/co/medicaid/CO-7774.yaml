id: CO-7774
name: "Medicaid: first month a pregnancy coverage period reaching the month can begin"
identifier: ma_pregnancy_coverage_period_search_start_month
kind: derived
type: month
scope: person-month
program: Medicaid
meaning: "The first month in which a pregnancy coverage period that can still reach the month evaluated (10 CCR 2505-10 § 8.100.4.G.5; 42 U.S.C. 1396a(e)(5), (e)(16)) can begin: the first month of the application being determined - the first month of the requested retroactive period (ma_retroactive_coverage_requested, CO-4100; § 8.100.3.E.1-2), or else the month containing ma_application_date - or, where later, the month after the latest pregnancy end the case records whose postpartum period (ma_postpartum_coverage_months after the month it ended) ended before the month evaluated: a period that begins in or before that end's month is the period of that pregnancy or an earlier one, and ends before the month evaluated."
precision: "Coverage pass 7, C7-02 (2026-11-24). A period runs from its first month through the 12th month after the end of the pregnancy current in that month (G.5, S640: 'through the last day of the 12th month following the date the pregnancy ends'; (e)(16)(A), S224). An end e reaches the month m when m is no later than ma_postpartum_coverage_months after the month of e, that is when the month of e is not before m less ma_postpartum_coverage_months; the latest end that does not reach m is latest_pregnancy_end_date_before_month (CO-7772) read for that month (at), and whether there is one is pregnancy_ended_before_month (CO-7771). A month from the one after it opens a period of a later pregnancy only. The retroactive period's length is read as ma_pregnancy_coverage_period_start_month (CO-565) reads it: three months before 2027, then two (a person whose period opens in a retroactive month is in the Pregnant Women category in the application month, never an expansion adult; CO-2472 would make the rule circular)."
derived: [case, [[not, [at, pregnancy_ended_before_month, [months_before, ma_postpartum_coverage_months, [month]]]], [case, [[otherwise, ma_retroactive_coverage_requested, false], [months_before, [case, [["<", ma_application_date, ma_retroactive_coverage_change_date], ma_retroactive_coverage_months], [else, ma_retroactive_coverage_months_other_after_change]], [month_of, ma_application_date]]], [else, [month_of, ma_application_date]]]], [[">", [month_after, [month_of, [at, latest_pregnancy_end_date_before_month, [months_before, ma_postpartum_coverage_months, [month]]]]], [case, [[otherwise, ma_retroactive_coverage_requested, false], [months_before, [case, [["<", ma_application_date, ma_retroactive_coverage_change_date], ma_retroactive_coverage_months], [else, ma_retroactive_coverage_months_other_after_change]], [month_of, ma_application_date]]], [else, [month_of, ma_application_date]]]], [month_after, [month_of, [at, latest_pregnancy_end_date_before_month, [months_before, ma_postpartum_coverage_months, [month]]]]]], [else, [case, [[otherwise, ma_retroactive_coverage_requested, false], [months_before, [case, [["<", ma_application_date, ma_retroactive_coverage_change_date], ma_retroactive_coverage_months], [else, ma_retroactive_coverage_months_other_after_change]], [month_of, ma_application_date]]], [else, [month_of, ma_application_date]]]]]
sources: [S640, S224, S5060, S1503, S2411]
implemented: engine
tags: [ma, magi]
nearest: [CO-565, CO-7401]
rationale: "Coverage pass 7, C7-02 (docs/reviews/coverage7-medicaid-magi-chp.md): the coverage period was searched from the application's first month and ran while the person was pregnant on the determination date, so a member whose first pregnancy's postpartum year had ended and who was pregnant again (PG-SECOND: member since 2025-03, birth 2025-09-10, pregnant again from 2026-10-05, $5,500) was read as still in the first period in October and November 2026 (eligible, pregnant, at 241.6%). The search for a period reaching a month now starts after the last pregnancy whose period ended before it, and each period ends with its own pregnancy's postpartum year (ma_pregnancy_coverage_period_begins_in_month, CO-7775)."
siblings:
  - {id: CO-7776, reason: "CHP+'s search start for its prenatal enrollment span; Medicaid keeps its own (retroactive months, its own postpartum parameter)"}
tests:
  # PG-SECOND: application 2025-03-01, no retroactive request; she gave birth to p2 on 2025-09-10 (ma_postpartum_coverage_months 12).
  - {id: CO-7774-T1, month: "2026-10", as_of: "2026-11-10", title: "C7-02 (PG-SECOND): October 2026 less 12 months = 2025-10; the birth of 2025-09-10 is before 2025-10-01, so its period (through 2026-09) does not reach October: search from the month after it, 2025-10", given: {ma_application_date: "2025-03-01", ma_retroactive_coverage_requested: false}, others: {p2: {date_of_birth: "2025-09-10"}}, relationships: [[gave_birth_to, p1, p2]], expect: "2025-10"}
  - {id: CO-7774-T2, month: "2026-09", as_of: "2026-11-10", title: "C7-02 (PG-SECOND): September 2026 less 12 = 2025-09; the birth (2025-09-10) is not before 2025-09-01, it reaches September: search from the application month, 2025-03", given: {ma_application_date: "2025-03-01", ma_retroactive_coverage_requested: false}, others: {p2: {date_of_birth: "2025-09-10"}}, relationships: [[gave_birth_to, p1, p2]], expect: "2025-03"}
  - {id: CO-7774-T3, month: "2026-11", as_of: "2026-11-10", title: "No pregnancy end recorded; application 2026-11-02 with a retroactive request (before 2027-01-01: three months): 2026-11 - 3 = 2026-08", given: {ma_application_date: "2026-11-02", ma_retroactive_coverage_requested: true}, relationships: [], expect: "2026-08"}
  - {id: CO-7774-T4, month: "2026-11", as_of: "2026-11-10", title: "A child of the case born to her on 2019-03-04, application 2026-11-02, no request: 2026-11 - 12 = 2025-11; the 2019 birth is before it; the month after it (2019-04) is before the application month: 2026-11", given: {ma_application_date: "2026-11-02", ma_retroactive_coverage_requested: false}, others: {p2: {date_of_birth: "2019-03-04"}}, relationships: [[gave_birth_to, p1, p2]], expect: "2026-11"}
