id: CO-4205
name: "Medicaid: lost the Parent/Caretaker Relative category to earnings and is in the twelve Transitional Medical Assistance months"
identifier: ma_tma_parent_caretaker_is_in_transitional_period
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether the person is one of the individuals 10 CCR 2505-10 § 8.100.4.I.1 grants Transitional Medical Assistance to, this month: the person lost the Parent/Caretaker Relative category because of new or increased earnings, was in that category in at least ma_extension_prior_months_required of the ma_extension_lookback_months months before the first month of ineligibility (I.1.a), this month is one of the ma_transitional_medical_assistance_months months beginning with that month, a parent or caretaker relative in the household is still employed (I.1.b.i), and the household still includes a dependent child (I.3)."
precision: "I.3's \"the household must include a dependent child\" is tested over the TMA household (ma_tma_household_members, CO-4204), not over the person's own caretaker relationships. The dependent child is the 42 CFR 435.4 dependent child ma_is_dependent_child (CO-544) states. The family's other members reach the remaining months through ma_is_eligible_for_transitional_medical_assistance (CO-2430, I.2), which reads this item for a member of their household; residency and status are tested there."
derived: [all, [not, [unknown, ma_first_month_of_ineligibility]], ["=", ma_ineligibility_reason, increased_earnings], [">=", [month], ma_first_month_of_ineligibility], ["<=", [month], [months_after, ["-", ma_transitional_medical_assistance_months, 1], ma_first_month_of_ineligibility]], [">=", [count_months, [months_ending, ma_extension_lookback_months, [month_before, ma_first_month_of_ineligibility]], ["=", ma_prior_enrollment_category, parent_caretaker]], ma_extension_prior_months_required], ma_household_has_employed_parent_caretaker, [exists, ma_tma_household_members, [of, [P], ma_is_dependent_child]]]
sources: [S1719, S3004]
implemented: engine
tags: [ma, magi, income]
rationale: "Final verification pass 3, F3-4: the test of the parent who lost the category is split out of ma_is_eligible_for_transitional_medical_assistance (CO-2430), so that CO-2430 can give the family's remaining months to a dependent child or other member of that parent's household (I.2) by reading this item for the parent, without restating the parent's month of ineligibility and history on the child. I.3 is tested over the household."
tests:
  - {id: CO-4205-T1, month: "2026-11", as_of: "2026-11-01", given: {ma_first_month_of_ineligibility: "2026-10", ma_ineligibility_reason: increased_earnings, ma_prior_enrollment_category: {"2026-04": parent_caretaker, "2026-05": parent_caretaker, "2026-06": parent_caretaker, "2026-07": parent_caretaker, "2026-08": parent_caretaker, "2026-09": parent_caretaker}, ma_household_has_employed_parent_caretaker: true, ma_tma_household_members: [p1, p2]}, title: "Parent lost the category in October on a raise after six months enrolled; still employed", others: {p2: {date_of_birth: "2018-01-01"}}, expect: true}
  - {id: CO-4205-T2, month: "2026-11", as_of: "2026-11-01", given: {date_of_birth: "1990-01-01", ma_first_month_of_ineligibility: "2026-10", ma_ineligibility_reason: increased_earnings, ma_prior_enrollment_category: {"2026-04": parent_caretaker, "2026-05": parent_caretaker, "2026-06": parent_caretaker, "2026-07": parent_caretaker, "2026-08": parent_caretaker, "2026-09": parent_caretaker}, ma_household_has_employed_parent_caretaker: true, ma_tma_household_members: [p1, p2]}, title: "I.3: the only child has turned 19 and is no longer a dependent child", others: {p2: {date_of_birth: "2007-06-01", is_full_time_secondary_student_finishing_before_nineteen: false}}, expect: false}
  - {id: CO-4205-T3, month: "2026-11", as_of: "2026-11-01", given: {ma_first_month_of_ineligibility: "2026-10", ma_ineligibility_reason: other, ma_household_has_employed_parent_caretaker: true, ma_tma_household_members: [p1, p2]}, title: "Lost the category for another reason", others: {p2: {date_of_birth: "2018-01-01"}}, expect: false}
