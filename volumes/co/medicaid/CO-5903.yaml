id: CO-5903
name: "Medicaid: parental income to be deemed to the eligible children"
identifier: ma_ssi_parental_income_to_be_deemed
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The income of this child's ineligible parents that remains to be deemed to the eligible children for the month (10 CCR 2505-10 § 8.100.5.H.3.a, H.3.b.iii; 20 CFR 416.1165(d)-(e)): the parents' income after the allocations and disregards (ma_ssi_deeming_parents_countable_income), less the Ineligible Parent(s) Allocation - the SSI Federal Benefit Rate for a couple when two deemed parents live with the child, for an individual when one does - and not below zero; zero when no parent's income is deemed."
precision: "The amount ma_ssi_parental_income_deemed (CO-4626) divided equally before the 416.1165(e)(3) fill-up; it is now stated once and read there, divided among the blind or disabled children sharing it (ma_ssi_deeming_children) with no child given more than ma_ssi_deeming_benefit_zero_amount (CO-5902). A parent and a stepparent living with the child are read as both parents (416.1160(a)(2), 416.1165(d)(3)). The allocation is deducted for every deemed parent; 416.1165(d)'s exception for a parent receiving public income-maintenance payments is not separated (such a parent's grant is not in the income facts the parents' income reads)."
derived: [case, [["=", [count, ma_ssi_deeming_parents], 0], 0], [else, [max, 0, ["-", ma_ssi_deeming_parents_countable_income, [case, [[">=", [count, ma_ssi_deeming_parents], 2], ma_ssi_federal_benefit_rate_couple], [else, ssi_federal_benefit_rate_individual]]]]]]
sources: [S3405, S3413, S3415]
implemented: engine
tags: [ma, non_magi, income, household]
rationale: "Coverage review, 416.1165(e)(3) fill-up: CO-4626 computed the parents' remaining income inside its equal division; the fill-up reads it for each child sharing it (ma_ssi_deeming_share_zeroes_benefit, CO-5904), so it is stated once. The terms are CO-4626's, unchanged."
tests:
  - {id: CO-5903-T1, as_of: "2026-10-12", month: "2026-10", title: "X-DEEM: 3,957.50 - 994 = 2,963.50", given: {ma_ssi_deeming_parents: [p2], ma_ssi_deeming_parents_countable_income: 3957.5}, others: {p2: {}}, relationships: [[child, p2]], expect: 2963.5}
  - {id: CO-5903-T2, as_of: "2026-10-12", month: "2026-10", title: "two parents: 2,000 - 1,491 = 509", given: {ma_ssi_deeming_parents: [p2, p3], ma_ssi_deeming_parents_countable_income: 2000}, others: {p2: {}, p3: {}}, relationships: [[child, p2], [child, p3]], expect: 509}
  - {id: CO-5903-T3, as_of: "2026-10-12", month: "2026-10", title: "one parent under the allocation: 900 - 994 is below zero, so 0", given: {ma_ssi_deeming_parents: [p2], ma_ssi_deeming_parents_countable_income: 900}, others: {p2: {}}, relationships: [[child, p2]], expect: 0}
  - {id: CO-5903-T4, as_of: "2026-10-12", month: "2026-10", title: "no deemed parent", given: {ma_ssi_deeming_parents: []}, expect: 0}
