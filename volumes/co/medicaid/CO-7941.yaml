id: CO-7941
name: "Medicaid: disabled widow(er) countable income"
identifier: ma_disabled_widow_countable_income
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The person's SSI-related countable income with the Social Security benefits 42 U.S.C. 1383c(d) disregards taken out (ma_disabled_widow_disregarded_social_security_receipts, CO-7940), for the disabled widow(er) group (10 CCR 2505-10 § 8.100.6.I, S625; 42 U.S.C. 1383c(d)(2) (S3416) deems the group SSI recipients 'for so long as such person (i) would be eligible for such supplemental security income benefits ... in the absence of benefits described in paragraph (1)(A)', and (1)(A) describes benefits 'under subsection (e) or (f) of section 402 of this title (or under any other subsection of section 402 of this title if such person is also eligible for benefits under such subsection (e) or (f))'): the Disabled Adult Child computation (ma_dac_countable_income, CO-1160), term for term, with that figure in place of the whole current Social Security; a disability insurance benefit on the person's own record stays in the unearned income the $20 general exclusion applies to."
precision: "NM-KL-2 (2026-11-24; docs/reviews/known-limits.md; coverage pass 7, non-MAGI F7-10). A registered sibling of CO-1160: every term but the Social Security taken out (the couple's unearned income counted, CO-2281; the couple's earned income after its exclusions, CO-6051, less the Ineligible Child Allocation from the spouse's earnings, CO-2279; the $65, any unused $20, impairment-related work expenses, one half and the exclusions after it) must stay the same, so a change to one is a change to both. Read by ma_disabled_widow_meets_ssi_income_test (CO-7943) where an ineligible spouse's income is deemed or there is no spouse; ma_ssi_own_countable_income_with_widow_benefit_disregarded (CO-7942) is the own-income form."
derived: ["+", [max, 0, ["-", [max, 0, ["-", ma_ssi_household_unearned_income_counted, ma_disabled_widow_disregarded_social_security_receipts]], ssi_general_income_exclusion]], [max, 0, ["-", ["*", [max, 0, ["-", [max, 0, ["-", ["-", ma_ssi_couple_earned_income_after_exclusions, ma_ssi_child_allocation_from_spouse_earned], ["+", ssi_earned_income_exclusion, [max, 0, ["-", ssi_general_income_exclusion, [max, 0, ["-", ma_ssi_household_unearned_income_counted, ma_disabled_widow_disregarded_social_security_receipts]]]]]]], ma_ssi_impairment_related_work_expenses]], ssi_earned_income_disregard_rate], ma_ssi_earned_income_excluded_after_half]]]
sources: [S625, S3416, S5361, S5362, S1955]
implemented: engine
tags: [ma, non_magi, income]
nearest: [CO-1160]
siblings:
  - {id: CO-1160, reason: "the disabled widow(er) countable income repeats the Disabled Adult Child computation with only the 402 benefits taken out (1383c(d)(2)); every other term must stay the same"}
rationale: "NM-KL-2 (F7-10): ma_disabled_widow_eligible (CO-1162) read the Disabled Adult Child figure through ma_ssi_income_test_status (CO-5516), which took out every Social Security benefit, the person's own disability insurance benefit included."
tests:
  # NM-KL-2, hand-computed: unearned U, the 402 benefits W taken out, the $20 (S3002), earned E less $65 and the unused $20, one half.
  - {id: CO-7941-T1, month: "2026-11", as_of: "2026-11-12", title: "NM-KL-2: own disability benefit 1,100 and widow's benefit 300, unearned counted 1,400, no earnings: (1,400 - 300) - 20 = 1,080", given: {ma_ssi_household_unearned_income_counted: 1400, ma_disabled_widow_disregarded_social_security_receipts: 300, ma_ssi_couple_earned_income_after_exclusions: 0, ma_ssi_child_allocation_from_spouse_earned: 0, ma_ssi_impairment_related_work_expenses: 0, ma_ssi_earned_income_excluded_after_half: 0}, expect: 1080}
  - {id: CO-7941-T2, month: "2026-11", as_of: "2026-11-12", title: "NM-KL-2: widow's benefit 900, own disability benefit 400 and wages 300: (1,300 - 900) - 20 = 380; (300 - 65) / 2 = 117.5; 497.5", given: {ma_ssi_household_unearned_income_counted: 1300, ma_disabled_widow_disregarded_social_security_receipts: 900, ma_ssi_couple_earned_income_after_exclusions: 300, ma_ssi_child_allocation_from_spouse_earned: 0, ma_ssi_impairment_related_work_expenses: 0, ma_ssi_earned_income_excluded_after_half: 0}, expect: 497.5}
  - {id: CO-7941-T3, month: "2026-11", as_of: "2026-11-12", title: "NM-KL-2: widow's benefit 1,300 only and wages 300: unearned 0 after the benefit, the whole $20 goes to earnings: (300 - 85) / 2 = 107.5", given: {ma_ssi_household_unearned_income_counted: 1300, ma_disabled_widow_disregarded_social_security_receipts: 1300, ma_ssi_couple_earned_income_after_exclusions: 300, ma_ssi_child_allocation_from_spouse_earned: 0, ma_ssi_impairment_related_work_expenses: 0, ma_ssi_earned_income_excluded_after_half: 0}, expect: 107.5}
