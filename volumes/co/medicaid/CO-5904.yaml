id: CO-5904
name: "Medicaid: the parental income shared with other eligible children zeroes this child's SSI benefit"
identifier: ma_ssi_deeming_share_zeroes_benefit
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether this child is a blind or disabled child who shares the deemed income of ineligible parents with at least one other eligible child (ma_ssi_deeming_children) and whose share of it, once each child sharing it has been given no more than reduces its SSI benefit to zero and the rest has gone to the others (20 CFR 416.1165(e)(2)-(3)), would reduce this child's benefit to zero: the parental income to be deemed (ma_ssi_parental_income_to_be_deemed) is more than the sum, over the children sharing it, of the lesser of each child's ma_ssi_deeming_benefit_zero_amount and this child's. Such a child is deemed no more than its own ma_ssi_deeming_benefit_zero_amount, and is ineligible: (e)(3) says the share 'makes that child ineligible (reduces the amount to zero)'."
precision: "The fill-up of (e)(3) as one test per child. Dividing equally, giving a child whose share exceeds its limit only its limit and dividing the rest equally among the others ((e)(2), 'in the manner described'), and repeating while any child's new share exceeds its limit, ends with every child given the lesser of its limit and one common level, the level at which the amounts given add up to the income to be deemed. A child's limit is below that level exactly when giving every child the lesser of its own limit and this child's limit leaves income over, which is what this item compares, with no ordering of the children and no loop. A child whose limit equals the level is given its limit, as the children above it are, and is not counted here. Each child's test reads its own parents' income and its own group of children sharing it, as ma_ssi_parental_income_deemed (CO-4626) did. An only eligible child is never counted: (e)(1) deems to the only eligible child 'any of your parents' current monthly income that remains', and (e)(3) passes the rest 'to other eligible children', of whom there are none; the child's eligibility is the same either way. Membership of this child in the group is read as being blind (is_blind) or disabled (meets_ssa_disability_criteria) with parents whose income is deemed, which is the group's test for this child. Coverage pass 4, non-MAGI N4-13 (decision 4 of 2026-11-23: missing information is cannot determine unless the rule says otherwise; readers do not invent defaults): the child's blindness and disability are read as stated, no longer as no when unstated. Pattern sweep, non-MAGI Medicaid (docs/reviews/pattern-sweep-nonmagi.md, P1): disability is read in the month: not in a month before the disability onset (ma_month_is_before_disability_onset, CO-4888; the onset is 'the date on which the person's disability began', CO-4887; 10 CCR 2505-10 § 8.100.5.C.4.b, S3623; § 8.100.3.E.1, S1503). Before, the undated finding was read in every month."
derived: [all, [">", [count, ma_ssi_deeming_parents], 0], [">=", [count, ma_ssi_deeming_children], 2], [any, is_blind, [all, meets_ssa_disability_criteria, [not, ma_month_is_before_disability_onset]]], ["<", ma_ssi_deeming_limit_sum, ma_ssi_parental_income_to_be_deemed]]
sources: [S3413, S4080, S3623, S1503]
implemented: engine
tags: [ma, non_magi, income, household]
siblings:
  - {id: CO-6061, reason: "the Pickle copy puts this child's Pickle limit (CO-6058) in place of its SSI-related one; every other term must stay the same"}
rationale: "Coverage review, 416.1165(e)(3) fill-up: ma_ssi_parental_income_deemed (CO-4626) divided the parents' income equally, so a child whose own income used up part of its share kept that part, and the other children were deemed less than (e)(3) gives them (an answer in their favour). The item language has no operator for a fill-up; it needs none, because whether a child's limit binds is a sum of lesser-ofs over the children (filter, sum, min and of are enough), and CO-4626 gives the children whose limit does not bind what is left, equally. Duplicate-paths audit D-M3: the sum over the children is ma_ssi_deeming_limit_sum (CO-6059), which the Pickle division reads too."
