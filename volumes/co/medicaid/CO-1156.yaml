id: CO-1156
name: "Medicaid: Old Age Pension Health Care Program status"
identifier: ma_oap_health_care_status
kind: derived
type: one of
options: [not_oap_recipient, medicaid_eligible, ineligible_institution, eligible_state_only]
scope: person-month
program: Medicaid
role: outcome
meaning: "Whether an Old Age Pension recipient gets medical care through the state-only Old Age Pension Health Care Program (SISC C). The program serves persons receiving OAP-A or OAP-B who do not qualify for Medicaid (10 CCR 2505-10 §§ 8.941.1, 8.941.1.A, 8.941.3; § 8.100.3.F.1.j; § 8.100.6.K.7) and who are not patients in an institution for tuberculosis or behavioral or mental health disorders (C.R.S. 25.5-2-101(2)). An OAP recipient who receives SSI or meets SSI eligibility criteria, even except for income, is Medicaid-eligible instead (SISC B, § 8.100.6.K.2-4)."
precision: "OAP receipt reads af_category (CO-953) as oap (9 CCR 2503-5 now states a single OAP category; OAP-A/OAP-B survive only as the Medicaid labels of 8.100.6.K.1, OQ-111); AND-CS, AND-SO and AB recipients are not OAP recipients (§ 8.941.3.B). 'Meets SSI eligibility criteria except for the level of their income' (§ 8.100.6.K.4) is read as meeting Medicaid's citizenship and immigration requirement (CO-509), aged, blind or disabled (CO-603) and within the SSI resource standard (CO-610) - OAP itself has no five-year bar (9 CCR 2503-5 3.520.67.E, af_meets_citizenship_requirement_oap, CO-929), so a qualified non-citizen inside the bar can receive OAP but not SSI-related Medicaid, which is the population SISC C serves; full MAGI eligibility (CO-562) also counts as qualifying for Medicaid. OAP-C (court-committed) recipients are excluded by § 8.941.3.B but af_category has no OAP-C option, so that exclusion is not tested (OQ-206). Eligibility is not retroactive (§ 8.941.1.E); this item states the month's status."
derived: [case, [[not, ["=", af_category, oap]], "not_oap_recipient"], [[any, receives_ssi, ma_is_ssi_related_eligible, ma_magi_is_fully_eligible, [all, ma_meets_citizenship_requirement, ma_is_aged_blind_or_disabled, ma_meets_ssi_resource_standard]], "medicaid_eligible"], [is_patient_in_institution_for_mental_diseases, "ineligible_institution"], [else, "eligible_state_only"]]
sources: [S617, S618, S619, S620, S621]
open: [OQ-206]
implemented: engine
tags: [ma, oap, non_magi]
rationale: "No existing item states the Old Age Pension Health Care Program; the Adult Financial chapter decides the pension (af_category) and the Medicaid chapter decides SSI-related Medicaid, but nothing reports the state-only medical program between them. Declared an outcome."
tests:
  - {id: CO-1156-T1, as_of: "2026-10-01", month: "2026-10", title: "OAP-A, no SSI, over the SSI resource standard: state-only OAP health care", given: {af_category: oap, receives_ssi: false, ma_is_ssi_related_eligible: false, ma_magi_is_fully_eligible: false, ma_meets_citizenship_requirement: true, ma_is_aged_blind_or_disabled: true, ma_meets_ssi_resource_standard: false, is_patient_in_institution_for_mental_diseases: false}, expect: eligible_state_only}
  - {id: CO-1156-T2, as_of: "2026-10-01", month: "2026-10", given: {af_category: "none"}, expect: not_oap_recipient}
  - {id: CO-1156-T3, as_of: "2026-10-01", month: "2026-10", title: "OAP-B with SSI: Medicaid (SISC B)", given: {af_category: oap, receives_ssi: true}, expect: medicaid_eligible}
  - {id: CO-1156-T4, as_of: "2026-10-01", month: "2026-10", title: "OAP-A meeting SSI criteria except income: Medicaid (SISC B)", given: {af_category: oap, receives_ssi: false, ma_is_ssi_related_eligible: false, ma_magi_is_fully_eligible: false, ma_meets_citizenship_requirement: true, ma_is_aged_blind_or_disabled: true, ma_meets_ssi_resource_standard: true}, expect: medicaid_eligible}
  - {id: CO-1156-T5, as_of: "2026-10-01", month: "2026-10", title: "IMD patient", given: {af_category: oap, receives_ssi: false, ma_is_ssi_related_eligible: false, ma_magi_is_fully_eligible: false, ma_meets_citizenship_requirement: true, ma_is_aged_blind_or_disabled: true, ma_meets_ssi_resource_standard: false, is_patient_in_institution_for_mental_diseases: true}, expect: ineligible_institution}
  - {id: CO-1156-T6, as_of: "2026-10-01", month: "2026-10", title: "OAP-A recipient, LPR inside the five-year bar: OAP has no bar but Medicaid does - state-only OAP health care", given: {af_category: oap, receives_ssi: false, ma_is_ssi_related_eligible: false, ma_magi_is_fully_eligible: false, ma_meets_citizenship_requirement: false, is_patient_in_institution_for_mental_diseases: false}, expect: eligible_state_only}
