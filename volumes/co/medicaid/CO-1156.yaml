id: CO-1156
name: "Medicaid: Old Age Pension Health Care Program status"
identifier: ma_oap_health_care_status
kind: derived
type: one of
options: [not_oap_recipient, medicaid_eligible, ineligible_oap_c, ineligible_institution, ineligible_before_application, eligible_state_only]
scope: person-month
program: Medicaid
role: outcome
meaning: "Whether an Old Age Pension recipient gets medical care through the state-only Old Age Pension Health Care Program (SISC C). The program serves persons receiving OAP-A or OAP-B who do not qualify for Medicaid (10 CCR 2505-10 §§ 8.941.1, 8.941.1.A, 8.941.3; § 8.100.3.F.1.j; § 8.100.6.K.7) and who are not patients in an institution for tuberculosis or behavioral or mental health disorders (C.R.S. 25.5-2-101(2)). An OAP recipient who receives SSI or meets SSI eligibility criteria, even except for income, is Medicaid-eligible instead (SISC B, § 8.100.6.K.2-4)."
precision: "OAP receipt reads the Adult Financial case record adult_financial_program_received (CO-2710) as oap (9 CCR 2503-5 now states a single OAP category; OAP-A/OAP-B survive only as the Medicaid labels of 8.100.6.K.1, OQ-111); AND-CS, AND-SO and AB recipients are not OAP recipients (§ 8.941.3.B). 'Meets SSI eligibility criteria except for the level of their income' (§ 8.100.6.K.4) is ma_oap_sisc_b_eligible (CO-1177): residency, Medicaid's citizenship and immigration requirement (CO-509), aged, blind or disabled (CO-603) and within the SSI resource standard (CO-610) - OAP itself has no five-year bar (9 CCR 2503-5 3.520.67.E, af_meets_citizenship_requirement_oap, CO-929), so a qualified non-citizen inside the bar can receive OAP but not SSI-related Medicaid, which is the population SISC C serves; full MAGI eligibility (CO-562) also counts as qualifying for Medicaid. OAP-C (court-committed) recipients are excluded by § 8.941.3.B; receipt of OAP-C is the oap_c option of the same record (receives_oap_c, CO-2208) and such a recipient who does not qualify for Medicaid is reported ineligible_oap_c (OQ-206, resolved). Eligibility is not retroactive (§ 8.941.1.E, 'shall begin on the date of application or date eligibility is established, whichever is later'): a month before the month of the application (ma_application_date) is ineligible_before_application, while a Medicaid-eligible recipient keeps medicaid_eligible there, since Medical Assistance has retroactive months; a month in which the person did not receive OAP is not_oap_recipient. § 8.100.6.K.7's OAP-A, OAP-B and OAP Refugee recipients who lost OAP to a cost of living adjustment other than OASDI remain in SISC C: ma_lost_oap_to_non_oasdi_cost_of_living_adjustment (CO-2209) brings them in as if they still received OAP (OQ-206, resolved); a current OAP Refugee recipient is an OAP recipient in adult_financial_program_received. The institutional exclusion reads ma_oap_is_patient_in_tb_or_mental_health_institution (CO-1748). \"Do not qualify for Medicaid under Title XIX\" (§ 8.941.1) and \"do not otherwise qualify for the Colorado Medicaid Program\" (§ 8.941.3.A) are read as ma_has_full_coverage_category (CO-1176), which adds the protected groups (Pickle, disabled widow(er)s, DAC), the Buy-In programs, long-term care and the needy-under-21 group to SSI-related, MAGI and SISC B eligibility (final verification pass 3, pattern sweep after F3-2: the item had named four categories). Coverage pass 6, non-MAGI F6-5 (docs/reviews/coverage6-medicaid-nonmagi.md): the SSI branch reads ma_receives_ssi_in_month (CO-7351), SSI from the month of the original SSI eligibility date (10 CCR 2505-10 § 8.100.6.C.1.a, C.7, S5030), so a retroactive month before an SSI award is judged by the SSI-related tests of that month; before, receives_ssi (the award as of the determination date) made every month an SSI month."
derived: [case, [[not, [any, ["=", adult_financial_program_received, oap], ma_lost_oap_to_non_oasdi_cost_of_living_adjustment]], "not_oap_recipient"], [[any, ma_receives_ssi_in_month, ma_has_full_coverage_category], "medicaid_eligible"], [receives_oap_c, "ineligible_oap_c"], [ma_oap_is_patient_in_tb_or_mental_health_institution, "ineligible_institution"], [["<", [month], [month_of, ma_application_date]], "ineligible_before_application"], [else, "eligible_state_only"]]
sources: [S617, S618, S619, S620, S621, S665, S667, S1510, S5030]
implemented: engine
tags: [ma, oap, non_magi]
rationale: "Final verification pass 3, pattern sweep after F3-2 (2026-11-22): the Medicaid-eligible branch reads ma_has_full_coverage_category (CO-1176) in place of SSI-related, full MAGI and SISC B eligibility alone. No existing item states the Old Age Pension Health Care Program; the Adult Financial chapter decides the pension (af_category) and the Medicaid chapter decides SSI-related Medicaid, but nothing reports the state-only medical program between them. Declared an outcome. Vocabulary fix round (governance read.cross_program): accepts_from lists the other programs' items this rule reads on purpose. The Medicaid rule names the other program's result (OAP receipt, CHP+ eligibility). History moved from the precision note (HCPF review S-14): Vocabulary fix round (docs/reviews/vocabulary-reuse.md, R-14): the institutional exclusion reads ma_oap_is_patient_in_tb_or_mental_health_institution (CO-1748). Precision history (moved from precision, engineering follow-up pass task 5): (CO-1177, phase 7 fix round S-3). Heavier-definitions audit H-3 (audit fix round; OQ-542 resolved): OAP receipt reads the Adult Financial case record (adult_financial_program_received, CO-2710), not this volume's own Adult Financial determination (af_category), as \"persons receiving OAP\" (§ 8.100.6.K.2-4) says. Final verification P2-5 (2026-11-22): eligible_state_only was reported for months before the application, against § 8.941.1.E (S617); those months are now ineligible_before_application."
tests:
  - {id: CO-1156-T1, as_of: "2026-10-01", month: "2026-10", title: "OAP-A, no SSI, over the SSI resource standard: state-only OAP health care", given: {ma_application_date: "2026-10-01", adult_financial_program_received: oap, receives_ssi: false, ma_has_full_coverage_category: false, receives_oap_c: false, ma_oap_is_patient_in_tb_or_mental_health_institution: false}, expect: eligible_state_only}
  - {id: CO-1156-T2, as_of: "2026-10-01", month: "2026-10", given: {ma_application_date: "2026-10-01", adult_financial_program_received: "none", ma_lost_oap_to_non_oasdi_cost_of_living_adjustment: false}, expect: not_oap_recipient}
  - {id: CO-1156-T7, as_of: "2026-10-01", month: "2026-10", title: "OQ-206: OAP-C recipient committed to a Regional Center, not Medicaid-eligible", given: {ma_application_date: "2026-10-01", adult_financial_program_received: oap, receives_ssi: false, ma_has_full_coverage_category: false, receives_oap_c: true}, expect: ineligible_oap_c}
  - {id: CO-1156-T8, as_of: "2026-10-01", month: "2026-10", title: "OQ-206: former OAP-A recipient who lost OAP to a VA cost of living increase - SISC C", given: {ma_application_date: "2026-10-01", adult_financial_program_received: "none", ma_lost_oap_to_non_oasdi_cost_of_living_adjustment: true, receives_ssi: false, ma_has_full_coverage_category: false, receives_oap_c: false, ma_oap_is_patient_in_tb_or_mental_health_institution: false}, expect: eligible_state_only}
  - {id: CO-1156-T3, as_of: "2026-10-01", month: "2026-10", title: "OAP-B with SSI: Medicaid (SISC B)", given: {ma_application_date: "2026-10-01", adult_financial_program_received: oap, receives_ssi: true}, expect: medicaid_eligible}
  - {id: CO-1156-T4, as_of: "2026-10-01", month: "2026-10", title: "OAP-A meeting SSI criteria except income: Medicaid (SISC B)", given: {ma_application_date: "2026-10-01", adult_financial_program_received: oap, receives_ssi: false, ma_oap_sisc_b_eligible: true}, expect: medicaid_eligible}
  - {id: CO-1156-T5, as_of: "2026-10-01", month: "2026-10", title: "IMD patient", given: {ma_application_date: "2026-10-01", adult_financial_program_received: oap, receives_ssi: false, ma_has_full_coverage_category: false, receives_oap_c: false, ma_oap_is_patient_in_tb_or_mental_health_institution: true}, expect: ineligible_institution}
  - {id: CO-1156-T6, as_of: "2026-10-01", month: "2026-10", title: "OAP-A recipient, LPR inside the five-year bar: OAP has no bar but Medicaid does - state-only OAP health care", given: {ma_application_date: "2026-10-01", adult_financial_program_received: oap, receives_ssi: false, ma_has_full_coverage_category: false, receives_oap_c: false, ma_oap_is_patient_in_tb_or_mental_health_institution: false}, expect: eligible_state_only}
  - {id: CO-1156-T9, as_of: "2026-11-10", month: "2026-09", title: "P2-5: an OAP recipient applying 2026-11-03 who would be state-only: no retroactive month", given: {adult_financial_program_received: oap, receives_ssi: false, ma_has_full_coverage_category: false, receives_oap_c: false, ma_oap_is_patient_in_tb_or_mental_health_institution: false, ma_application_date: "2026-11-03"}, expect: ineligible_before_application}
  - {id: CO-1156-T10, as_of: "2026-10-01", month: "2026-10", title: "Pattern sweep after F3-2: an OAP-A recipient in the Pickle group (a protected group) qualifies for Medicaid, not OAP Health Care", given: {ma_application_date: "2026-10-01", adult_financial_program_received: oap, receives_ssi: false, ma_magi_is_fully_eligible: false, ma_is_ssi_related_eligible: false, ma_oap_sisc_b_eligible: false, ma_protected_group_category: pickle}, expect: medicaid_eligible}
  # Coverage pass 6 F6-5: an OAP recipient awarded SSI from 2026-10-01 who applied 2026-11-05: August is not an SSI month and no full coverage category is met, so the OAP arms apply; August is before the application month: ineligible_before_application (was medicaid_eligible).
  - {id: CO-1156-T90, as_of: "2026-11-12", month: "2026-08", title: "F6-5: a month before the SSI award is not medicaid_eligible through SSI", given: {ma_application_date: "2026-11-05", adult_financial_program_received: oap, receives_ssi: true, ssi_eligibility_date: "2026-10-01", ma_has_full_coverage_category: false, receives_oap_c: false, ma_oap_is_patient_in_tb_or_mental_health_institution: false}, expect: ineligible_before_application}
