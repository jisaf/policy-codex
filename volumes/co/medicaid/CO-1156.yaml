id: CO-1156
name: "Medicaid: Old Age Pension Health Care Program status"
identifier: ma_oap_health_care_status
kind: derived
type: one of
options: [not_oap_recipient, medicaid_eligible, ineligible_oap_c, ineligible_institution, eligible_state_only]
scope: person-month
program: Medicaid
role: outcome
meaning: "Whether an Old Age Pension recipient gets medical care through the state-only Old Age Pension Health Care Program (SISC C). The program serves persons receiving OAP-A or OAP-B who do not qualify for Medicaid (10 CCR 2505-10 §§ 8.941.1, 8.941.1.A, 8.941.3; § 8.100.3.F.1.j; § 8.100.6.K.7) and who are not patients in an institution for tuberculosis or behavioral or mental health disorders (C.R.S. 25.5-2-101(2)). An OAP recipient who receives SSI or meets SSI eligibility criteria, even except for income, is Medicaid-eligible instead (SISC B, § 8.100.6.K.2-4)."
precision: "OAP receipt reads af_category (CO-953) as oap (9 CCR 2503-5 now states a single OAP category; OAP-A/OAP-B survive only as the Medicaid labels of 8.100.6.K.1, OQ-111); AND-CS, AND-SO and AB recipients are not OAP recipients (§ 8.941.3.B). 'Meets SSI eligibility criteria except for the level of their income' (§ 8.100.6.K.4) is ma_oap_sisc_b_eligible (CO-1177, phase 7 fix round S-3): residency, Medicaid's citizenship and immigration requirement (CO-509), aged, blind or disabled (CO-603) and within the SSI resource standard (CO-610) - OAP itself has no five-year bar (9 CCR 2503-5 3.520.67.E, af_meets_citizenship_requirement_oap, CO-929), so a qualified non-citizen inside the bar can receive OAP but not SSI-related Medicaid, which is the population SISC C serves; full MAGI eligibility (CO-562) also counts as qualifying for Medicaid. OAP-C (court-committed) recipients are excluded by § 8.941.3.B; af_category has no OAP-C option, so receipt is the supplied receives_oap_c (CO-2208) and such a recipient who does not qualify for Medicaid is reported ineligible_oap_c (OQ-206, resolved). Eligibility is not retroactive (§ 8.941.1.E); this item states the month's status. § 8.100.6.K.7's OAP-A, OAP-B and OAP Refugee recipients who lost OAP to a cost of living adjustment other than OASDI remain in SISC C: ma_lost_oap_to_non_oasdi_cost_of_living_adjustment (CO-2209) brings them in as if they still received OAP (OQ-206, resolved); a current OAP Refugee recipient is an OAP recipient in af_category. Vocabulary fix round (docs/reviews/vocabulary-reuse.md, R-14): the institutional exclusion reads ma_oap_is_patient_in_tb_or_mental_health_institution (CO-1748)."
derived: [case, [[not, [any, ["=", af_category, oap], ma_lost_oap_to_non_oasdi_cost_of_living_adjustment]], "not_oap_recipient"], [[any, receives_ssi, ma_is_ssi_related_eligible, ma_magi_is_fully_eligible, ma_oap_sisc_b_eligible], "medicaid_eligible"], [receives_oap_c, "ineligible_oap_c"], [ma_oap_is_patient_in_tb_or_mental_health_institution, "ineligible_institution"], [else, "eligible_state_only"]]
sources: [S617, S618, S619, S620, S621, S665, S667, S1510]
implemented: engine
tags: [ma, oap, non_magi]
accepts_from: [af_category]
rationale: "No existing item states the Old Age Pension Health Care Program; the Adult Financial chapter decides the pension (af_category) and the Medicaid chapter decides SSI-related Medicaid, but nothing reports the state-only medical program between them. Declared an outcome. Vocabulary fix round (governance read.cross_program): accepts_from lists the other programs' items this rule reads on purpose. The Medicaid rule names the other program's result (OAP receipt, CHP+ eligibility)."
tests:
  - {id: CO-1156-T1, as_of: "2026-10-01", month: "2026-10", title: "OAP-A, no SSI, over the SSI resource standard: state-only OAP health care", given: {af_category: oap, receives_ssi: false, ma_is_ssi_related_eligible: false, ma_magi_is_fully_eligible: false, ma_oap_sisc_b_eligible: false, receives_oap_c: false, ma_oap_is_patient_in_tb_or_mental_health_institution: false}, expect: eligible_state_only}
  - {id: CO-1156-T2, as_of: "2026-10-01", month: "2026-10", given: {af_category: "none", ma_lost_oap_to_non_oasdi_cost_of_living_adjustment: false}, expect: not_oap_recipient}
  - {id: CO-1156-T7, as_of: "2026-10-01", month: "2026-10", title: "OQ-206: OAP-C recipient committed to a Regional Center, not Medicaid-eligible", given: {af_category: oap, receives_ssi: false, ma_is_ssi_related_eligible: false, ma_magi_is_fully_eligible: false, ma_oap_sisc_b_eligible: false, receives_oap_c: true}, expect: ineligible_oap_c}
  - {id: CO-1156-T8, as_of: "2026-10-01", month: "2026-10", title: "OQ-206: former OAP-A recipient who lost OAP to a VA cost of living increase - SISC C", given: {af_category: "none", ma_lost_oap_to_non_oasdi_cost_of_living_adjustment: true, receives_ssi: false, ma_is_ssi_related_eligible: false, ma_magi_is_fully_eligible: false, ma_oap_sisc_b_eligible: false, receives_oap_c: false, ma_oap_is_patient_in_tb_or_mental_health_institution: false}, expect: eligible_state_only}
  - {id: CO-1156-T3, as_of: "2026-10-01", month: "2026-10", title: "OAP-B with SSI: Medicaid (SISC B)", given: {af_category: oap, receives_ssi: true}, expect: medicaid_eligible}
  - {id: CO-1156-T4, as_of: "2026-10-01", month: "2026-10", title: "OAP-A meeting SSI criteria except income: Medicaid (SISC B)", given: {af_category: oap, receives_ssi: false, ma_is_ssi_related_eligible: false, ma_magi_is_fully_eligible: false, ma_oap_sisc_b_eligible: true}, expect: medicaid_eligible}
  - {id: CO-1156-T5, as_of: "2026-10-01", month: "2026-10", title: "IMD patient", given: {af_category: oap, receives_ssi: false, ma_is_ssi_related_eligible: false, ma_magi_is_fully_eligible: false, ma_oap_sisc_b_eligible: false, receives_oap_c: false, ma_oap_is_patient_in_tb_or_mental_health_institution: true}, expect: ineligible_institution}
  - {id: CO-1156-T6, as_of: "2026-10-01", month: "2026-10", title: "OAP-A recipient, LPR inside the five-year bar: OAP has no bar but Medicaid does - state-only OAP health care", given: {af_category: oap, receives_ssi: false, ma_is_ssi_related_eligible: false, ma_magi_is_fully_eligible: false, ma_oap_sisc_b_eligible: false, receives_oap_c: false, ma_oap_is_patient_in_tb_or_mental_health_institution: false}, expect: eligible_state_only}
