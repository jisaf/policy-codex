rationale: "OQ-1023 (earned-income records E0, finding E0-F4), settled: 8.100.3.K.10.c-e (S4107) say board, room, and room and board payments 'shall be considered earned income in the month received to the extent' they exceed the allotment and the costs; 8.100.5.F.1 (S3001) sends the ABD programs to 8.100.3 for general income types. The SSI method read none of room_and_board_payments_received and counted the board-only and room-only receipts in full as unearned income (no allotment, no costs, no earned income disregards)."
