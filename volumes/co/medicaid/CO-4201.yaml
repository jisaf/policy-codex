id: CO-4201
name: "Medicaid: Children with Disabilities Buy-In household unearned income"
identifier: ma_cbwd_household_unearned_income
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The gross unearned income for the month of the child's Children with Disabilities Buy-In household (the MAGI household, ma_magi_household_members, 10 CCR 2505-10 § 8.100.6.Q.1.b.i) counted under § 8.100.5.F (Q.1.b.ii-iii): each member's Social Security, pension, unemployment, other taxable and non-taxable unearned income, tax-exempt interest, lottery and gambling winnings in the month received, child support received, and, for a member who is not an unemancipated child, in-kind support and maintenance (§ 8.100.5.F.5, H.1.b), less what the SSI-related method excludes (ma_ssi_excluded_unearned_income); child support received by a blind or disabled child of the Buy-In's age is reduced by one third (§ 8.100.5.H.4.c)."
precision: "SSI, OAP, General Assistance and TANF cash are exempt (§ 8.100.5.F.6.y) and are not read. Child support is stated on the child for whom it is paid (child_support_received). The one-third reduction is read for every member who could be an applicant or recipient child (ma_cbwd_max_age or younger, meeting the SSA disability criteria or blind), so two disabled siblings have the same household figure. Lottery and gambling winnings count in the month received (§ 8.100.5.F.4-5, F.5.i); the hardship exemption of F.5.i.1, once granted to the child (ma_lottery_winnings_hardship_exemption_granted), removes them. Unstated exclusions, in-kind support and winnings are 0. Every member of the MAGI household counts (OQ-740)."
derived: [sum, ma_magi_household_members, [max, 0, ["-", ["+", [of, [P], social_security_income], [of, [P], pension_income], [of, [P], unemployment_income], [of, [P], other_unearned_income_taxable], [of, [P], other_unearned_income_nontaxable], [of, [P], tax_exempt_interest], [case, [[otherwise, ma_lottery_winnings_hardship_exemption_granted, false], 0], [else, [otherwise, [of, [P], lottery_gambling_winnings_received], 0]]], [case, [[all, ["<=", [of, [P], age], ma_cbwd_max_age], [any, [otherwise, [of, [P], meets_ssa_disability_criteria], false], [otherwise, [of, [P], is_blind], false]]], ["-", [otherwise, [of, [P], child_support_received], 0], ["/", [otherwise, [of, [P], child_support_received], 0], ma_ssi_child_support_reduction_divisor]]], [else, [otherwise, [of, [P], child_support_received], 0]]], [case, [[of, [P], ma_is_ssi_unemancipated_child], 0], [else, [otherwise, [of, [P], ssi_in_kind_support_and_maintenance], 0]]]], [otherwise, [of, [P], ma_ssi_excluded_unearned_income], 0]]]]
sources: [S3000, S3001, S3002, S3003, S1506]
implemented: engine
tags: [ma, non_magi, buy_in, income]
open: [OQ-740]
rationale: "Final verification pass 3, F3-1: § 8.100.6.Q.1.b applies § 8.100.5.F's income rules to the MAGI household; MAGI income (CO-503) leaves out child support, non-taxable unearned income and in-kind support that § 8.100.5.F counts. No existing item sums § 8.100.5.F unearned income over a MAGI household (ma_ssi_household_unearned_income_sum, CO-663, sums over a person and a spouse)."
tests:
