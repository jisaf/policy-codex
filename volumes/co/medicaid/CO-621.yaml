id: CO-621
name: "Medicaid: Children with Disabilities Buy-In monthly premium"
identifier: ma_cbwd_premium
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: The monthly premium a Children with Disabilities Buy-In household owes, on the sliding scale by household income-as-a-percentage-of-FPL band 10 CCR 2505-10 8.100.6.Q.1.g.iv states.
precision: Uses the same ma_magi_household_income_pct_fpl figure ma_cbwd_eligible (CO-620) tests eligibility against. See OQ-82 on why the band boundaries and dollar amounts are literal values cited to S318 rather than a separate parameter table.
derived: [case, [[<=, ma_magi_household_income_pct_fpl, 1.33], 0], [[<=, ma_magi_household_income_pct_fpl, 1.85], 70], [[<=, ma_magi_household_income_pct_fpl, 2.50], 90], [else, 120]]
sources: [S318]
open: [OQ-82]
implemented: engine
tags: [ma, non_magi, buy_in, income]
rationale: "No existing item states the CBwD premium schedule. Named directly by the phase-4 brief's interface."
tests:
  - {id: CO-621-T1, as_of: "2026-10-01", month: "2026-10", given: {ma_magi_household_income_pct_fpl: 1.0}, expect: 0}
  - {id: CO-621-T2, as_of: "2026-10-01", month: "2026-10", given: {ma_magi_household_income_pct_fpl: 2.9}, expect: 120}
