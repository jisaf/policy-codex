id: CO-621
name: "Medicaid: Children with Disabilities Buy-In monthly premium"
identifier: ma_cbwd_premium
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The monthly premium a Children with Disabilities Buy-In household owes, on the sliding scale by household income-as-a-percentage-of-FPL band 10 CCR 2505-10 8.100.6.Q.1.g.iv states. Informational: no rule reads it and it is not a declared outcome; it reports the premium beside ma_buy_in_category."
precision: "Reads the household band amount from ma_cbwd_premium_table (CO-2458, P48) on ma_cbwd_countable_household_income_pct_fpl (CO-4203), the figure ma_cbwd_eligible (CO-620) tests (final verification pass 3, F3-1: it had read the MAGI percentage), capped at ma_cbwd_premium_cap_pct_lower of the household's monthly MAGI income, read as the \"family's adjusted gross income\" of Q.1.g.i, at or below ma_cbwd_premium_cap_threshold_pct of FPL and ma_cbwd_premium_cap_pct_upper above (Q.1.g.i, which caps premiums and cost sharing together; cost sharing is not modeled, so the cap is applied to the premium). The household owes one premium however many children are eligible (Q.1.g.iii): it is reported on the oldest eligible child in the MAGI household and is 0 for the others. No premium for the month of the determination or earlier (Q.1.g.ii; ma_buy_in_determination_month, CO-2462) or for a member within 12 months postpartum (Q.1.g.vi). § 8.100.6.Q.1.g's third and fourth bands say \"individuals\" where the first two say \"households\" (OQ-144); the volume reads every band as the household's. The public health emergency waiver (Q.1.g.vii) is read as ended (OQ-511). Dated parameter in place of literal bands."
derived: [case, [["<=", [month], ma_buy_in_determination_month], 0], [[all, [not, [unknown, pregnancy_end_date]], ["<=", [month], ma_postpartum_coverage_end_month]], 0], [[exists, ma_magi_household_members, [all, ["<", [of, [P], date_of_birth], date_of_birth], [of, [P], ma_cbwd_eligible]]], 0], [else, [min, [band, ma_cbwd_premium_table, ma_cbwd_countable_household_income_pct_fpl], ["*", [case, [["<=", ma_cbwd_countable_household_income_pct_fpl, ma_cbwd_premium_cap_threshold_pct], ma_cbwd_premium_cap_pct_lower], [else, ma_cbwd_premium_cap_pct_upper]], ma_magi_household_income]]]]
sources: [S1728, S3000]
open: [OQ-144, OQ-511, OQ-740]
implemented: engine
tags: [ma, non_magi, buy_in, income]
rationale: "No existing item states the CBwD premium schedule. Named directly by the phase-4 brief's interface. History moved from the precision note (HCPF review S-14): HCPF fix round (S-8, OQ-82 overruled): dated parameter in place of literal bands."
