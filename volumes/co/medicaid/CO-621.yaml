  - {id: CO-621-T2, month: "2026-10", as_of: "2026-10-01", given: {ma_cbwd_countable_household_income_pct_fpl: 2.9, ma_buy_in_determination_month: "2026-01", ma_magi_household_members: [p1], ma_magi_household_income: 4000, date_of_birth: "2015-01-01"}, expect: 120}
  - {id: CO-621-T90, month: "2026-11", as_of: "2026-11-01", given: {ma_cbwd_countable_household_income_pct_fpl: 1.4, ma_magi_household_income: 2000, ma_buy_in_determination_month: "2026-01", ma_magi_household_members: [p1], date_of_birth: "2015-01-01"}, title: "HCPF fix round (S-8): household at 140% FPL with $2,000 MAGI income - $70 band, under the 5% cap ($100)", expect: 70}
  - {id: CO-621-T91, month: "2026-11", as_of: "2026-11-01", given: {ma_cbwd_countable_household_income_pct_fpl: 1.4, ma_magi_household_income: 1200, ma_buy_in_determination_month: "2026-01", ma_magi_household_members: [p1], date_of_birth: "2015-01-01"}, title: "HCPF fix round (S-8): household at 140% FPL with $1,200 MAGI income - capped at 5%, $60", expect: 60}
  - {id: CO-621-T92, month: "2026-11", as_of: "2026-11-01", given: {date_of_birth: "2018-01-01", ma_cbwd_countable_household_income_pct_fpl: 1.4, ma_magi_household_income: 2000, ma_buy_in_determination_month: "2026-01", ma_magi_household_members: [p1, p2]}, title: "HCPF fix round (S-8): second eligible child, younger than an eligible sibling - no second premium", others: {p2: {date_of_birth: "2015-01-01", ma_cbwd_eligible: true}}, expect: 0}
