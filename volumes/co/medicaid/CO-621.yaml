  # Coverage pass 7 F7-8 (CBWD-TWINS, CO-1108): § 8.100.6.Q.1.g.iii (S1728), "the total premium shall be the amount due for one eligible child". Twins p1 and p2 (born 2015-01-01), both eligible, no older eligible child: 140% is in the 70 band, under the 5% cap (0.05 x 2,000 = 100): 70 for the household, 70 / 2 = 35 on each twin (was 70 on each, 140 in all). Triplets: 70 / 3 on each.
  - {id: CO-621-T95, month: "2026-11", as_of: "2026-11-01", title: "F7-8: twins both eligible: the household's 70 shared, 35 each (was 70 each)", given: {ma_cbwd_eligible: true, ma_cbwd_countable_household_income_pct_fpl: 1.4, ma_magi_household_income: 2000, ma_buy_in_determination_month: "2026-01", ma_magi_household_members: [p1, p2], date_of_birth: "2015-01-01"}, others: {p2: {date_of_birth: "2015-01-01", ma_cbwd_eligible: true, ma_buy_in_determination_month: "2026-01"}}, expect: 35}
  - {id: CO-621-T96, month: "2026-11", as_of: "2026-11-01", title: "F7-8: triplets all eligible: 70 / 3 each", given: {ma_cbwd_eligible: true, ma_cbwd_countable_household_income_pct_fpl: 1.4, ma_magi_household_income: 2000, ma_buy_in_determination_month: "2026-01", ma_magi_household_members: [p1, p2, p3], date_of_birth: "2015-01-01"}, others: {p2: {date_of_birth: "2015-01-01", ma_cbwd_eligible: true, ma_buy_in_determination_month: "2026-01"}, p3: {date_of_birth: "2015-01-01", ma_cbwd_eligible: true, ma_buy_in_determination_month: "2026-01"}}, expect: 23.333333333333332}
