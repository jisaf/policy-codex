id: CO-1962
name: "Medicaid community engagement: is a parent, guardian or caretaker relative of a dependent child or disabled individual"
identifier: ma_is_parent_guardian_or_caretaker_relative_of_care_recipient
kind: derived
type: yes/no
scope: person
program: Medicaid
meaning: "Whether the person is excluded from community engagement as the parent, guardian or caretaker relative of a dependent child or disabled individual (42 CFR 435.554(c)(3)): the person has a parent or caretaker relationship to a person who is a dependent child or disabled individual (ma_community_engagement_is_care_recipient, CO-1961), or is a court-appointed guardian of one."
precision: "A parent or caretaker edge in the case is read as a parent with legal status who provides some level of care, or a caretaker relative who lives with the child and assumes primary responsibility, as 435.554(a) defines them; the caretaker edge carries the relatives 435.4 lists, which 435.554(a) repeats, and its State-option relatives follow the State's 435.110 elections, which Colorado's definition of caretaker relative states: any relative, or any adult with whom the dependent child lives who assumes responsibility for the child's care (§ 8.100.1, S1500; OQ-51)."
derived: [any, [exists_related, [parent, caretaker], [of, [P], ma_community_engagement_is_care_recipient]], ma_is_guardian_of_dependent_child_or_disabled_individual]
sources: [S1207, S1208, S1500]
implemented: engine
tags: [ma, magi]
open: [OQ-412]
rationale: "OQ-65: the first three roles of 435.554(c)(3) need no criterion beyond the definitions."
tests:
  - {id: CO-1962-T1, as_of: "2027-03-01", given: {ma_is_guardian_of_dependent_child_or_disabled_individual: false}, title: "Parent of a 6-year-old who relies on her for care", others: {p2: {date_of_birth: "2020-06-01", ma_relies_on_another_for_care: true}}, relationships: [[parent, p2]], expect: true}
  - {id: CO-1962-T2, as_of: "2027-03-01", given: {ma_is_guardian_of_dependent_child_or_disabled_individual: false}, title: "Parent of a 15-year-old without a disability", others: {p2: {date_of_birth: "2011-06-01", ma_relies_on_another_for_care: true, has_disability_under_ada: false}}, relationships: [[parent, p2]], expect: false}
  - {id: CO-1962-T3, as_of: "2027-03-01", given: {ma_is_guardian_of_dependent_child_or_disabled_individual: true}, title: "Court-appointed guardian, no relationship in the case", relationships: [], expect: true}
