id: CO-655
name: "Medicaid: Minimum Monthly Maintenance Needs Allowance (MMMNA)"
identifier: ma_mmmna
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: The community spouse's minimum monthly income needs - the MMMNA standard plus an excess shelter allowance for shelter costs above 30% of the standard, capped at the current MMMNA maximum - per 42 U.S.C. 1396r-5(d)(3)-(4) and 10 CCR 2505-10 § 8.100.7.Q.
precision: Does not model 8.100.7.Q.2's additional approved amounts for the community spouse's medical expenses or insurance premiums (those instead deduct from health_insurance_premiums_paid, per CO-835's rationale, or are out of scope) or 8.100.7.Q.3's exceptional-circumstances fair-hearing increase.
derived: ["min", ma_mmmna_cap, ["+", ma_mmmna_standard, ["max", 0, ["-", ma_community_spouse_shelter_costs, ["*", ma_mmmna_shelter_threshold_pct, ma_mmmna_standard]]]]]
sources: [S358, S372]
implemented: engine
tags: [ma, ltc, income, legal]
rationale: "No existing item computes the MMMNA. ma_community_spouse_income_allowance (CO-656) needs it. Dual-entry audit 1.2: the shelter costs are the community spouse's own, read across the spouse edge (ma_community_spouse_shelter_costs, CO-2802), not a figure supplied on the institutionalized spouse (CO-834, retired)."
tests:
  - {id: CO-655-T1, as_of: "2026-10-01", month: "2026-10", parameters: {ma_mmmna_shelter_threshold_pct: 0.30}, given: {ma_mmmna_standard: 2100, ma_community_spouse_shelter_costs: 800}, expect: 2270}
  - {id: CO-655-T2, as_of: "2026-10-01", month: "2026-10", parameters: {ma_mmmna_shelter_threshold_pct: 0.30}, given: {ma_mmmna_standard: 2100, ma_community_spouse_shelter_costs: 400}, expect: 2100}
  - {id: CO-655-T3, title: "Phase 7: capped at the 2026 CMS maximum MMMNA, 4066.50", as_of: "2026-10-01", month: "2026-10", parameters: {ma_mmmna_shelter_threshold_pct: 0.30}, given: {ma_mmmna_standard: 2100, ma_community_spouse_shelter_costs: 5000}, expect: 4066.5}
