id: CO-5175
name: "Medicaid SSI method: a person's gross receipts from self-employment"
identifier: ma_ssi_self_employment_receipts
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The gross receipts of the month of the person's businesses that the SSI method's earnings counting table counts as net profit (ma_ssi_earnings_treatment_table, CO-5107, row counted_net_of_costs: self-employment and farm receipts), before the cost of doing business is deducted (10 CCR 2505-10 8.100.3.K.9.a; 8.100.5.F.4.b)."
precision: "Earned-income records, Medicaid and CHP+ track E1: replaces self_employment_gross_receipts (CO-1700) in ma_self_employment_net_earnings (CO-1704). Field-effect sweep (docs/reviews/field-sweep-snap-cash-nonmagi.md), FS-MA-2: a record stated as a stream (no month and no date) is received only in the months from the month its job or business began through the month it ended (job_start_date, job_end_date; each absent: before, or through, the months the case covers; CO-5100), since earned income \"is countable as income in the month received\" (10 CCR 2505-10 8.100.5.F.4, S3001) and wages are counted \"when you receive them\" (20 CFR 416.1111(a), S4940); a pay stated with its month or date is placed by it, a final pay after the job ended included. Before, a stream was counted in every month whatever its job's dates. The clause is Adult Financial's and Colorado Works' (af_earned_pay, CO-5130; cw_earned_pay, CO-5140)."
derived: [sum_receipts, earnings, [all, [received_in, [month]], [any, [not, [unknown, [receipt, month]]], [all, [any, [unknown, [receipt, job_start_date]], ["<=", [month_of, [receipt, job_start_date]], [month]]], [any, [unknown, [receipt, job_end_date]], [">=", [month_of, [receipt, job_end_date]], [month]]]]], ["=", [lookup, ma_ssi_earnings_treatment_table, [receipt, kind]], counted_net_of_costs]], [receipt, amount]]
sources: [S1154, S3001, S4940]
implemented: engine
tags: [ma, non_magi, income]
rationale: "Earned-income records, step E1 (Medicaid and CHP+): the business's gross receipts read from the earnings records through the counting table."
nearest: [CO-1704, CO-1703, CO-5161, CO-5162, CO-5172, CO-5178]
tests:
  - {id: CO-5175-T1, month: "2026-10", as_of: "2026-10-01", given: {earnings: [{kind: self_employment_receipts, amount: 1500}, {kind: farm_self_employment_receipts, amount: 600}, {kind: business_cost_operating, amount: 200}, {kind: wages, amount: 800}]}, title: "Business 1,500 + farm 600; costs and wages not read: 2,100", expect: 2100}
  - {id: CO-5175-T2, month: "2026-10", as_of: "2026-10-01", given: {earnings: [{kind: self_employment_receipts}]}, title: "A business whose receipts are not stated: cannot determine", expect: unknown}
  # Field-effect sweep, non-MAGI Medicaid (docs/reviews/field-sweep-snap-cash-nonmagi.md); hand-computed from the text quoted in each title.
  - {id: CO-5175-T3, month: "2027-02", as_of: "2027-02-15", title: "FS-MA-2b (probe): business receipts of 2,000 a month from a business that begins 2027-05-01, read for February: 0", given: {earnings: [{kind: self_employment_receipts, amount: 2000, job_start_date: "2027-05-01"}]}, expect: 0}
  - {id: CO-5175-T4, month: "2026-11", as_of: "2026-11-12", title: "FS-MA-2: business receipts of 2,000 a month from a business that began 2026-11-20, read in its first month: 2,000", given: {earnings: [{kind: self_employment_receipts, amount: 2000, job_start_date: "2026-11-20"}]}, expect: 2000}
