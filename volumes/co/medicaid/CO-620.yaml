id: CO-620
name: "Medicaid: is Children with Disabilities Buy-In eligible"
identifier: ma_cbwd_eligible
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: Whether the child is eligible for the Medicaid Buy-In Program for Children with Disabilities - 18 or younger, disabled, and with MAGI household income at or below 300% of the federal poverty level - per 10 CCR 2505-10 8.100.6.Q.1.
precision: "8.100.6.Q.1.b directs the MAGI household rules of 8.100.4.E for CBwD's income test, unlike WAwD's applicant-only rule; this item reuses ma_magi_household_income_pct_fpl (CO-504, batch 5-6) rather than the SSI-methodology income items this batch otherwise builds. Resources are not counted (8.100.6.Q.1.c). Does not model 8.100.6.Q.1.e's employment carve-out for a 16-18-year-old (who is instead evaluated for WAwD if employed) - out of scope for this item's eligibility test, which assumes the applicant is being evaluated for CBwD in the first place. Status reads ma_meets_status_for_cover_all_coloradans_categories (CO-1174), since § 8.100.3.G.1.g.ix.1.b lists both Buy-In programs among the categories Cover All Coloradans reaches. A child in a continuous eligibility period that began in the Children with Disabilities Buy-In (§ 8.100.3.Q.2.d) stays eligible for the period unless enrollment is discontinued for unpaid premiums (Q.2.d.i)."
derived: [any, [all, ma_meets_residency, ma_meets_status_for_cover_all_coloradans_categories, ["<=", age, 18], is_disabled_for_buy_in, ["<=", ma_magi_household_income_pct_fpl, ma_cbwd_income_limit_pct]], [all, ma_child_is_in_non_magi_continuous_eligibility_period, ["=", ma_continuous_eligibility_program, cbwd_buy_in]]]
sources: [S607, S318, S1724]
implemented: engine
tags: [ma, non_magi, buy_in, income, disability]
rationale: "No existing item states the CBwD eligibility test. ma_buy_in_category (CO-622) needs it. Conjoins is_colorado_resident (CO-505) and ma_meets_citizenship_requirement (CO-509) as CO-611 does, per the phase-4 review's C-19 finding. History moved from the precision note (HCPF review S-14): Phase 7 fix round (S-2): status reads ma_meets_status_for_cover_all_coloradans_categories (CO-1174), since § 8.100.3.G.1.g.ix.1.b lists both Buy-In programs among the categories Cover All Coloradans reaches. HCPF fix round (C-7): a child in a continuous eligibility period that began in the Children with Disabilities Buy-In (§ 8.100.3.Q.2.d) stays eligible for the period unless enrollment is discontinued for unpaid premiums (Q.2.d.i)."
nearest: [CO-618]
