id: CO-620
name: "Medicaid: is Children with Disabilities Buy-In eligible"
identifier: ma_cbwd_eligible
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: Whether the child is eligible for the Medicaid Buy-In Program for Children with Disabilities - 18 or younger, disabled, and with MAGI household income at or below 300% of the federal poverty level - per 10 CCR 2505-10 8.100.6.Q.1.
precision: "8.100.6.Q.1.b directs the MAGI household rules of 8.100.4.E for CBwD's income test, unlike WAwD's applicant-only rule; this item reuses ma_magi_household_income_pct_fpl (CO-504, batch 5-6) rather than the SSI-methodology income items this batch otherwise builds. Resources are not counted (8.100.6.Q.1.c). Does not model 8.100.6.Q.1.e's employment carve-out for a 16-18-year-old (who is instead evaluated for WAwD if employed) - out of scope for this item's eligibility test, which assumes the applicant is being evaluated for CBwD in the first place. Fix round: HCPF OM 26-024 (D-74, S574) confirms the 300% ceiling but describes a different, operational income methodology for CBMS caseworkers - household income after a flat $20 unearned/$65-plus-one-half earned disregard (the same SSI-style structure D-73 states for WAwD), not the codified MAGI-household-income rule 8.100.6.Q.1.b actually directs. This item follows the rule text (ma_magi_household_income_pct_fpl) rather than the memo's caseworker-facing approximation; the discrepancy is recorded as OQ-174 rather than changed, since 8.100.6.Q.1.b's cross-reference to 8.100.4.E is unambiguous and the memo does not purport to amend the regulation."
derived: [all, ma_meets_residency, ma_meets_citizenship_requirement, [<=, age, 18], is_disabled_for_buy_in, [<=, ma_magi_household_income_pct_fpl, ma_cbwd_income_limit_pct]]
sources: [S318, S574]
open: [OQ-174]
implemented: engine
tags: [ma, non_magi, buy_in, income, disability]
rationale: "No existing item states the CBwD eligibility test. ma_buy_in_category (CO-622) needs it. Conjoins ma_meets_residency (CO-505) and ma_meets_citizenship_requirement (CO-509) as CO-611 does, per the phase-4 review's C-19 finding. Fix round: D-74 (S574) added as a confirming/conflicting source per OQ-174."
nearest: [CO-618]
