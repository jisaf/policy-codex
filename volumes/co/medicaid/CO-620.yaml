id: CO-620
name: "Medicaid: is Children with Disabilities Buy-In eligible"
identifier: ma_cbwd_eligible
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether the child is eligible for the Medicaid Buy-In Program for Children with Disabilities - at most ma_cbwd_max_age (CO-3026), disabled, with household income after the 8.100.5.H disregards (ma_cbwd_countable_household_income_pct_fpl, CO-4203) at or below ma_cbwd_income_limit_pct (CO-243) of the federal poverty level, not a child of ma_wawd_min_age or older who is employed (such a child is determined for the Buy-In for Working Adults with Disabilities instead), and, where the family can enroll in employer-based family coverage toward which the employer pays at least ma_cbwd_employer_contribution_min_pct of the premium, enrolled in it - per 10 CCR 2505-10 8.100.6.Q.1."
precision: "8.100.6.Q.1.b takes the household from the MAGI household rules of 8.100.4.E (unlike WAwD's applicant-only rule) and the income from 8.100.5.F, F.6 and H: the income tested is ma_cbwd_countable_household_income_pct_fpl (CO-4203), the MAGI household's 8.100.5.F income after the 8.100.5.H disregards against the poverty level for the MAGI household's size (final verification pass 3, F3-1; OQ-740 for how the disregards apply to a family). Resources are not counted (8.100.6.Q.1.c). Q.1.e: a child of ma_wawd_min_age (16) through ma_cbwd_max_age (18) with earned income in the month (has_earned_income) is employed and is excluded here, so ma_buy_in_category (CO-622) reports the Working Adults program or none; the WAwD minimum age is read because Q.1.e's age 16 is the age from which that program takes the child. Q.1.f is read as a condition of eligibility: where employer family coverage with at least the minimum employer share is available (employer_family_coverage_employer_premium_share), the child must be enrolled in it (is_enrolled_in_employer_family_coverage; OQ-623). Status reads ma_meets_status_for_cover_all_coloradans_categories (CO-1174), since § 8.100.3.G.1.g.ix.1.b lists both Buy-In programs among the categories Cover All Coloradans reaches. A child in a continuous eligibility period that began in the Children with Disabilities Buy-In (§ 8.100.3.Q.2.d) stays eligible for the period unless enrollment is discontinued for unpaid premiums (Q.2.d.i). Coverage review 2 (non-MAGI N2-3, fixed in the MAGI round): the upper age reads ma_age_before_month (CO-4790), the age on the last day of the month before the determination month, so a child whose 19th birthday falls earlier in the determination month stays eligible for that month: § 8.100.6.Q.1.a and § 8.100.5.C.3 grant the whole month. The Q.1.e test of 16 (a lower limit) reads age on the determination date. Time audit T-1 (2026-11-23): the bar on a working child of ma_wawd_min_age or older reads ma_age_on_first_day_of_month (CO-4978): the child is barred for the whole month only when that old on every day of it (§ 8.100.5.C.3, S3900); it read age (CO-300), the age on the determination date, in every month."
derived: [any, [all, ma_meets_residency, ma_meets_status_for_cover_all_coloradans_categories, ["<=", ma_age_before_month, ma_cbwd_max_age], meets_ssa_disability_criteria, ["<=", ma_cbwd_countable_household_income_pct_fpl, ma_cbwd_income_limit_pct], [not, [all, [">=", ma_age_on_first_day_of_month, ma_wawd_min_age], has_earned_income]], [not, [all, [">=", employer_family_coverage_employer_premium_share, ma_cbwd_employer_contribution_min_pct], [not, is_enrolled_in_employer_family_coverage]]]], [all, ma_child_is_in_non_magi_continuous_eligibility_period, ["=", ma_continuous_eligibility_program, cbwd_buy_in]]]
sources: [S3900, S607, S318, S1724, S1752, S3000]
implemented: engine
tags: [ma, non_magi, buy_in, income, disability]
open: [OQ-623, OQ-740]
rationale: "Final verification pass 3, F3-1 (2026-11-22): the income test read MAGI household income (CO-504), with no 8.100.5.F income rules and no 8.100.5.H disregards; it reads CO-4203. No existing item states the CBwD eligibility test. ma_buy_in_category (CO-622) needs it. Conjoins is_colorado_resident (CO-505) and ma_meets_citizenship_requirement (CO-509) as CO-611 does, per the phase-4 review's C-19 finding. History moved from the precision note (HCPF review S-14): Phase 7 fix round (S-2): status reads ma_meets_status_for_cover_all_coloradans_categories (CO-1174), since § 8.100.3.G.1.g.ix.1.b lists both Buy-In programs among the categories Cover All Coloradans reaches. HCPF fix round (C-7): a child in a continuous eligibility period that began in the Children with Disabilities Buy-In (§ 8.100.3.Q.2.d) stays eligible for the period unless enrollment is discontinued for unpaid premiums (Q.2.d.i). Final verification F-7 (2026-11-22): § 8.100.6.Q.1.e (an employed child of 16 through 18 is determined for the Working Adults program) and Q.1.f (enrollment in employer family coverage with at least a 50% employer contribution) are listed eligibility conditions; e was called out of scope and f was not modeled."
