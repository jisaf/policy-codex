  - {id: CO-620-T2, as_of: "2026-10-01", month: "2026-10", given: {age: 10, is_disabled_for_buy_in: true, ma_magi_household_income_pct_fpl: 3.5, ma_meets_residency: true, ma_meets_citizenship_requirement: true}, expect: false}
