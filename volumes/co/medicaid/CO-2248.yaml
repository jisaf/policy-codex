id: CO-2248
name: "Medicaid: requires verification of joint ownership"
identifier: ma_requires_verification_of_joint_ownership
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether an aged, blind or disabled person must verify joint ownership of real property: the person alleges that selling it would cause undue hardship to the co-owner through loss of housing (10 CCR 2505-10 § 8.100.5.M.3.h.ii). Read from the person's real property holdings records (holdings, CO-5300) held in the month: true when one states the allegation (co_owner_would_lose_housing); false when every one states it is not so, or the person states no real property."
precision: "Records E2/H2 leftovers (docs/reviews/records-e2-h2.md, section 5): read from the holdings, no longer from the person fact ma_claims_co_owner_hardship_for_real_property (CO-2244, retired). The records read are the ones the M.3.h exclusion reads (ma_excluded_real_property_value, CO-4620): the kinds Medicaid's holdings table counts less the real property exclusions (ma_ssi_holding_treatment_table, CO-5303: real_property), valued in the month and still held at its first moment (a disposed_date in the month or later, or none). M.3.h (S1515): \"When the applicant alleges that the sale of real property would cause undue hardship to the co-owner due to loss of housing, all of the following information must be obtained: ... ii) Verification of joint ownership.\" The verification is required when a record states the allegation, and a record that leaves it out is cannot determine here (decision 4 of 2026-11-23: no rule says what an unstated allegation is for the verification; the resource readers give it the meaning 8.100.5.E.3 gives, not shown, through `otherwise`). One record stating the allegation settles it whatever the others leave out (the first sum reads the stated allegations only); otherwise the second sum is unknown while any record leaves it out. A person whose holdings state no real property alleges nothing about the sale of real property, so M.3.h's condition (\"When the applicant alleges\") is not met and no verification is required: false, not 'not applicable', since the item answers whether the verification is required, and for that person it is not. An unstated holdings list is cannot determine."
derived: [all, ma_is_aged_blind_or_disabled, [any, [">", [sum_receipts, holdings, [all, ["=", [lookup, ma_ssi_holding_treatment_table, [receipt, kind]], counted_less_real_property_exclusions], [received_in, [month]], [any, [unknown, [receipt, disposed_date]], [">=", [month_of, [receipt, disposed_date]], [month]]], [otherwise, [receipt, co_owner_would_lose_housing], false]], 1], 0], [">", [sum_receipts, holdings, [all, ["=", [lookup, ma_ssi_holding_treatment_table, [receipt, kind]], counted_less_real_property_exclusions], [received_in, [month]], [any, [unknown, [receipt, disposed_date]], [">=", [month_of, [receipt, disposed_date]], [month]]], [receipt, co_owner_would_lose_housing]], 1], 0]]]
sources: [S1515]
implemented: engine
tags: [ma, resources, verification]
rationale: "OQ-379: verification of joint ownership was not modeled."
