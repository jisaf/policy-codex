id: CO-5901
name: "Medicaid: SSI-related countable earned income with the whole $20 taken from unearned income"
identifier: ma_ssi_countable_earned_income_with_general_exclusion_used
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "This person's (and, if living together, their spouse's) countable earned income for the month as ma_ssi_countable_earned_income (CO-605) figures it, but with no part of the ssi_general_income_exclusion left over for earned income: the combined earned income less the ssi_earned_income_exclusion, impairment-related work expenses, one half of the remainder (ssi_earned_income_disregard_rate) and the exclusions taken after the one half (20 CFR 416.1112(c), 416.1124(c)(12); 10 CCR 2505-10 § 8.100.5.H.4.b). It is the countable earned income once the person's unearned income, deemed income included, is at least the $20 general exclusion (20 CFR 416.1165(e)(1))."
precision: "The same terms as CO-605 (siblings) except the unused part of the $20, which CO-605 measures on the unearned income with the deemed parental income in it (CO-2281). The most parental income that can be deemed to a child (ma_ssi_deeming_benefit_zero_amount, CO-5902) reads this figure: once the deemed income has used the whole $20 against unearned income, each further dollar deemed adds a dollar of countable income; below that, it adds one half of a dollar of countable earned income for each dollar of the $20 it takes from earned income."
derived: [max, 0, ["-", ["*", [max, 0, ["-", [max, 0, ["-", ["-", [sum, ma_ssi_couple_members, [max, 0, ["-", ["+", [of, [P], wages_gross], [of, [P], ma_self_employment_net_earnings]], [otherwise, [of, [P], ma_ssi_excluded_earned_income], 0]]]], ma_ssi_child_allocation_from_spouse_earned], ssi_earned_income_exclusion]], ma_ssi_impairment_related_work_expenses]], ssi_earned_income_disregard_rate], ma_ssi_earned_income_excluded_after_half]]
sources: [S308, S309, S310, S3413, S4080]
implemented: engine
tags: [ma, non_magi, income]
siblings:
  - {id: CO-605, reason: "the same earned income exclusions with no part of the $20 general exclusion carried to earned income; every other term must stay the same"}
rationale: "Coverage review, 416.1165(e)(3) fill-up: the amount of deemed income that, 'when combined with the child's own income, reduces his or her SSI benefit to zero' depends on the child's earned income, and on how much of the $20 general exclusion the deemed income takes from earned income. CO-605 measures the unused $20 on the unearned income with the deemed amount already in it, so this item states the child's countable earned income with the whole $20 used, from which CO-5902 works back."
tests:
  - {id: CO-5901-T1, month: "2026-10", as_of: "2026-10-12", given: {ma_ssi_couple_members: [p1], wages_gross: 1665, ma_self_employment_net_earnings: 0, ma_ssi_excluded_earned_income: 0, ma_ssi_child_allocation_from_spouse_earned: 0, ma_ssi_impairment_related_work_expenses: 0, ma_ssi_earned_income_excluded_after_half: 0, earnings: [{kind: wages, amount: 1665}, {kind: self_employment_receipts}]}, title: "a working child of 16 earning 1,665: (1,665 - 65) x 0.5 = 800", expect: 800}
  - {id: CO-5901-T2, month: "2026-10", as_of: "2026-10-12", given: {ma_ssi_couple_members: [p1], wages_gross: 1665, ma_self_employment_net_earnings: 0, ma_ssi_excluded_earned_income: 0, ma_ssi_child_allocation_from_spouse_earned: 0, ma_ssi_impairment_related_work_expenses: 100, ma_ssi_earned_income_excluded_after_half: 50, earnings: [{kind: wages, amount: 1665}, {kind: self_employment_receipts}]}, title: "with 100 of impairment-related work expenses and 50 set aside after the half: (1,665 - 65 - 100) x 0.5 - 50 = 700", expect: 700}
  - {id: CO-5901-T3, month: "2026-10", as_of: "2026-10-12", given: {ma_ssi_couple_members: [p1], wages_gross: 50, ma_self_employment_net_earnings: 0, ma_ssi_excluded_earned_income: 0, ma_ssi_child_allocation_from_spouse_earned: 0, ma_ssi_impairment_related_work_expenses: 0, ma_ssi_earned_income_excluded_after_half: 0, earnings: [{kind: wages, amount: 50}, {kind: self_employment_receipts}]}, title: "earnings under the $65: 0", expect: 0}
