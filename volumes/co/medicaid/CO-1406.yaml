id: CO-1406
name: "Medicaid: requires verification of pregnancy"
identifier: ma_requires_verification_of_pregnancy
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether the person's pregnancy must be verified for Medical Assistance: self-attestation is accepted unless the agency has information not reasonably compatible with it."
derived: [all, is_pregnant, pregnancy_attestation_is_questionable]
sources: [S842, S868]
implemented: engine
tags: [verification, ma]
rationale: No existing item states this Medical Assistance verification requirement; the phase-9 chapter needs one item per element so the person's pending counts and status can be derived.
tests:
