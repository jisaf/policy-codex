  - {id: CO-1406-T2, month: "2026-10", as_of: "2026-10-01", given: {is_pregnant: true, pregnancy_attestation_is_questionable: false}, expect: false}
  - {id: CO-1406-T3, month: "2026-10", as_of: "2026-10-01", given: {is_pregnant: false}, expect: false}
