id: CO-2431
name: "Medicaid: is eligible for the four-month extension"
identifier: ma_is_eligible_for_four_month_extension
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether the person is eligible for the four-month extended Medical Assistance of 10 CCR 2505-10 § 8.100.4.I.5: the family became ineligible solely or partly because of support income such as alimony, received Medical Assistance in at least three of the six months before the first month of ineligibility, this month is one of the four months beginning with that month, and the person is a Colorado resident meeting the status requirement of a Cover All Coloradans category (§ 8.100.3.G.1.g.ix.1.a lists the 4 Month Extended Medical Assistance)."
precision: "\"Meet all other eligibility criteria for Medical Assistance before the alimony income is applied\" and I.5.a's rule that only alimony under a divorce or separation executed on or before December 31, 2018 counts are part of the reason fact: support_income is recorded only where countable support income caused the loss. Coverage pass 5, C5-17 (2026-11-23): a recorded reason for the loss of eligibility (ma_ineligibility_reason) without its first month cannot be determined (decision 4); neither stated records no loss, and no extension."
derived: [all, [case, [[not, [unknown, ma_first_month_of_ineligibility]], true], [[unknown, ma_ineligibility_reason], false]], ["=", ma_ineligibility_reason, support_income], [">=", [month], ma_first_month_of_ineligibility], ["<=", [month], [months_after, ["-", ma_four_month_extension_months, 1], ma_first_month_of_ineligibility]], [">=", [count_months, [months_ending, ma_extension_lookback_months, [month_before, ma_first_month_of_ineligibility]], [not, ["=", ma_prior_enrollment_category, none]]], ma_extension_prior_months_required], ma_meets_residency, ma_meets_status_for_cover_all_coloradans_categories]
sources: [S1720, S607]
implemented: engine
tags: [ma, magi, income]
rationale: "C-4 of the HCPF review: the four-month extension had no item."
