id: CO-2606
name: "Medicaid: persons of whom this person is a parent or caretaker relative"
identifier: ma_caretaker_relative_of
kind: derived
type: group of persons
scope: person
program: Medicaid
meaning: "The persons of whom this person is a parent (natural, adoptive or step, as the MAGI rules read parent, S169) or a caretaker relative: under § 8.100.1 (S1500) \"a person who is related to the dependent child or any adult with whom the dependent child is living and who assumes responsibility for the dependent child's care\". Read from the neutral roles parent, stepparent and has_primary_responsibility_for."
precision: "Same-word audit SW-1/SW-3 (OQ-396 resolved): the caretaker role is retired; a relative or other adult who has assumed responsibility for the child's care is stated with has_primary_responsibility_for, whether or not related, since Colorado's definition takes 42 CFR 435.4's option for any adult the child lives with (S1500, S205). A grandparent or other relative who lives with the child but has not assumed responsibility is not a caretaker relative. Whether S1500's \"assumes responsibility\" is met by care shared with a parent in the home, which has_primary_responsibility_for may not state, is OQ-540. Whether the person is a dependent child is tested by the reader."
derived: [filter, [persons], [rel, [parent, stepparent, has_primary_responsibility_for], [P]]]
sources: [S1500, S205, S169]
implemented: engine
tags: [ma, magi, household]
open: [OQ-540]
rationale: "Same-word audit SW-0/SW-3 and OQ-396: the shared caretaker edge carried five programs' tests; Medicaid's parent-or-caretaker-relative relation becomes its own derived item over neutral roles, read by CO-539, CO-547, CO-548, CO-552, CO-2430 and CO-2439. No existing item states it."
tests:
  - {id: CO-2606-T1, title: "Mother and stepfather of a child", as_of: "2026-10-01", given: {}, others: {p2: {}, p3: {}}, relationships: [[parent, p1, p3], [spouse, p1, p2], [stepparent, p2, p3]], expect: [p3]}
  - {id: CO-2606-T2, title: "Aunt who has taken on the care of her nephew", as_of: "2026-10-01", given: {}, others: {p2: {}}, relationships: [[other_relative, p1, p2], [has_primary_responsibility_for, p1, p2]], expect: [p2]}
  - {id: CO-2606-T3, title: "Grandmother living with the child who has not assumed its care", as_of: "2026-10-01", given: {}, others: {p2: {}}, relationships: [[grandparent, p1, p2]], expect: []}
  - {id: CO-2606-T4, title: "Court-appointed guardian with no stated responsibility for care", as_of: "2026-10-01", given: {}, others: {p2: {}}, relationships: [[legal_guardian, p1, p2]], expect: []}
