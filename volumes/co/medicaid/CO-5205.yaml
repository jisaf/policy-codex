id: CO-5205
name: "Medicaid: home equity counted only because of a beneficiary deed"
identifier: ma_home_equity_counted_only_by_beneficiary_deed
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The person's home equity when the home is a countable resource only because a beneficiary deed on it has been executed and recorded (10 CCR 2505-10 § 8.100.5.M.2.a.xiv, M.3.e): home_equity when ma_home_is_countable_resource holds and ma_home_is_countable_resource_without_beneficiary_deed does not; otherwise 0."
precision: "Subtracted by the Medicare Savings Program resources (ma_msp_countable_resources, CO-5206; OQ-900) and by parental deeming (ma_ssi_parental_resources_deemed, CO-4627), where no estate recovery reaches the home: 42 U.S.C. 1396p(b)(1)(B)(ii) never recovers Medicare cost-sharing or the Medicare Savings Program benefits, and a deeming parent receives nothing that could be recovered from the parent's estate. Resource records, Medicaid track H1 (docs/reviews/records-holdings-medicaid.md): the equity is the person's equity interest in the home at the determination month (ma_home_equity_interest_in_month, CO-5327): for a couple's joint home, each spouse's share, so the couple's figures subtract the home once. Coverage pass 4, non-MAGI N4-7 and N4-9: per month, the home record as of the month's first moment (20 CFR 416.1207(a)) and the person's age in the month, since every reader is per month (the person's resources in the month, ma_ssi_countable_resources_in_month, CO-5322; the Medicare Savings Program and parental resource figures); before, every month read the determination month."
derived: [case, [[all, ma_home_is_countable_resource, [not, ma_home_is_countable_resource_without_beneficiary_deed]], ma_home_equity_interest_in_month], [else, 0]]
sources: [S3403, S3751, S4665]
open: [OQ-900]
implemented: engine
tags: [ma, non_magi, resources]
rationale: "Coverage pass 3 C3-5 and the probe hand-check of CO-402: the beneficiary-deed home counted in the Medicare Savings Program and parental-deeming resources, where § 8.100.5.M.2.a.xiv's \"subject to estate recovery\" cannot be met."
nearest: [CO-4622, CO-5204]
tests:
  - {id: CO-5205-T1, month: "2026-11", as_of: "2026-11-01", title: "Counted only by the deed", given: {home_equity: 150000, ma_home_is_countable_resource: true, ma_home_is_countable_resource_without_beneficiary_deed: false, holdings: [{kind: bank_account}, {kind: home, value: 150000, amount_owed: 0}]}, expect: 150000}
  - {id: CO-5205-T2, month: "2026-11", as_of: "2026-11-01", title: "Counted anyway (left for good, no one at home)", given: {home_equity: 150000, ma_home_is_countable_resource: true, ma_home_is_countable_resource_without_beneficiary_deed: true, holdings: [{kind: bank_account}, {kind: home, value: 150000, amount_owed: 0}]}, expect: 0}
  - {id: CO-5205-T3, month: "2026-11", as_of: "2026-11-01", title: "Not counted", given: {home_equity: 150000, ma_home_is_countable_resource: false, ma_home_is_countable_resource_without_beneficiary_deed: false, holdings: [{kind: bank_account}, {kind: home, value: 150000, amount_owed: 0}]}, expect: 0}
