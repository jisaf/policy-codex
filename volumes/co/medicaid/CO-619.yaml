id: CO-619
name: "Medicaid: Working Adults with Disabilities monthly premium"
identifier: ma_wawd_premium
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: The monthly premium a Working Adults with Disabilities Buy-In participant owes, on the sliding scale by income-as-a-percentage-of-FPL band 10 CCR 2505-10 8.100.6.P.1.f.iii states.
precision: "Recomputes the applicant's own countable income the same way ma_wawd_eligible (CO-618) does, expresses it as a fraction of the size-1 monthly poverty guideline, and reports the band amount the cited text states, capped at 7.5% of that income per 8.100.6.P.1.f.i ('the amount of premiums cannot exceed 7.5% of the individual's income') - the phase-4 review's C-16 finding. The cap does not bind on any stated band (the tightest point is the $25 band's floor, 7.5% of 40% FPL = $39.90), so it is carried defensively rather than to change today's output. See OQ-82 on why the band boundaries and dollar amounts are literal values cited to S317 rather than a separate parameter table (volume.yaml has no percentage-band table type). Fix round: the income computation now carries the unused part of the $20 general disregard over to earned income, matching CO-618's fix and D-73's own worked example (S572: $10,255 earned + $650 unearned -> $5,725 countable income, band 301-450% FPL, premium $200 - HCPF OM 26-023's own example, reproduced exactly). D-73's 2026 income chart (S573) reproduces the band boundaries and dollar amounts this item's literal case values already state, confirming no change is needed to the bands themselves."
