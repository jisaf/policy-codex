rationale: "No existing item states the WAwD premium schedule. ma_buy_in_category's premium is not itself an outcome the interface lists, but the phase-4 brief's interface names ma_wawd_premium directly, so it is authored here regardless. Fix round: D-73 (S572, S573) added as a confirming source; the disregard-carryover fix (S572) matches CO-618's."
