id: CO-1402
name: "Medicaid: income is reasonably compatible"
identifier: ma_income_is_reasonably_compatible
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether the attested household income is reasonably compatible with the electronic data source's, the applicable income standard being the highest MAGI standard the person could qualify under plus the ma_magi_income_disregard_pct disregard (the income up to which the category items grant eligibility, § 8.100.4.D.1): both at or below the applicable income standard; the attested figure above the standard, whatever the data figure (both above, § 8.100.4.C.2.a.iii; or the data figure below, which Colorado's verification plan takes as attested, the person ineligible, with no further information requested); or the attested figure at or below the standard and the data figure no more than ma_reasonable_compatibility_threshold_pct above the attested figure (C.2.a.ii). The same three arms are applied a second time at the limited Family Planning standard (ma_family_planning_income_upper_pct plus the disregard), on that category's own figures (the attested ma_family_planning_household_income_pct_fpl, CO-1153, and the data ma_electronic_data_source_family_planning_income_pct_fpl, CO-4977, both on the household counted with the applicant as two), and the income is compatible only when it is compatible at both."
derived: [all, [any, [">", ma_magi_household_income_pct_fpl, ["+", ma_magi_highest_income_standard_pct, ma_magi_income_disregard_pct]], ["<=", ma_electronic_data_source_household_income_pct_fpl, ["+", ma_magi_highest_income_standard_pct, ma_magi_income_disregard_pct]], ["<=", ma_electronic_data_source_household_income_pct_fpl, ["*", ma_magi_household_income_pct_fpl, ["+", 1, ma_reasonable_compatibility_threshold_pct]]]], [any, [">", ma_family_planning_household_income_pct_fpl, ["+", ma_family_planning_income_upper_pct, ma_magi_income_disregard_pct]], ["<=", ma_electronic_data_source_family_planning_income_pct_fpl, ["+", ma_family_planning_income_upper_pct, ma_magi_income_disregard_pct]], ["<=", ma_electronic_data_source_family_planning_income_pct_fpl, ["*", ma_family_planning_household_income_pct_fpl, ["+", 1, ma_reasonable_compatibility_threshold_pct]]]]]
sources: [S838, S864, S867, S3364, S168, S613, S614]
precision: "Coverage review 3, C3-03: limited Family Planning's 260% is the applicable standard for an applicant over every full-coverage standard; compared at the full-coverage standard alone, every Family Planning attestation was above the standard and so compatible, and no income verification was asked whatever the data source reported. The Family Planning arms read the category's own attested figure (CO-1153, the budget-period income over the household counted with the applicant as two) and the data source on the same size (CO-4977), the figures the category item compares, as the full-coverage arms read CO-504 and CO-1344. Coverage review F-12 (OQ-302): Colorado's MAGI verification plan (D-317, S3364) says that when \"an individual attests to income above the applicable standard and data source indicates income below the standard, the state will take the attestation and make the person ineligible ... Additional information will not be requested\"; the item had treated that combination as not compatible, so CO-1403 asked for earned income documentation. The attested figure is then the one eligibility uses, and the person is ineligible on it. The plan's threshold (10%) predates the rule's 20% (ma_reasonable_compatibility_threshold_pct), which governs; neither says 20% of what (OQ-302). With both at or below the standard the any is true on its second term; with the attested figure at or below and the data above, only the threshold term can be true. Coverage review 2, N-04: the standard had been compared without the 5% disregard, so an attestation between the standard and the standard plus the disregard counted as above the standard (compatible) while the category items (CO-545 to CO-548) granted eligibility on it, and no verification was asked even with a data figure far above. C.2.a.iii's 'ineligible due to income' and the plan's 'make the person ineligible' are true on the attestation only above the standard after the disregard (§ 8.100.4.D.1.a: the disregard is the last step of each eligibility test), so that is the standard compared here."
implemented: engine
tags: [verification, ma, income, magi]
open: [OQ-302, OQ-204]
rationale: "No existing item compares attested and electronic income; 42 CFR 435.952(c)(1) (S838) and 8.100.4.C.2.a (S864) make the comparison the trigger for documentation. Coverage review 3, C3-03: tests T1 to T8 now also state the Family Planning figures, at 0.75 of the MAGI figures (the one-person to two-person guideline ratio), all within that standard, so their answers are unchanged."
