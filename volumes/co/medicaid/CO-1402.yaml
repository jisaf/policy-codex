id: CO-1402
name: "Medicaid: income is reasonably compatible"
identifier: ma_income_is_reasonably_compatible
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether the attested household income is reasonably compatible with the electronic data source's, the applicable income standard being the highest MAGI standard the person could qualify under plus the ma_magi_income_disregard_pct disregard (the income up to which the category items grant eligibility, § 8.100.4.D.1): both at or below the applicable income standard; the attested figure above the standard, whatever the data figure (both above, § 8.100.4.C.2.a.iii; or the data figure below, which Colorado's verification plan takes as attested, the person ineligible, with no further information requested); or the attested figure at or below the standard and the data figure no more than ma_reasonable_compatibility_threshold_pct above the attested figure (C.2.a.ii)."
derived: [any, [">", ma_magi_household_income_pct_fpl, ["+", ma_magi_highest_income_standard_pct, ma_magi_income_disregard_pct]], ["<=", ma_electronic_data_source_household_income_pct_fpl, ["+", ma_magi_highest_income_standard_pct, ma_magi_income_disregard_pct]], ["<=", ma_electronic_data_source_household_income_pct_fpl, ["*", ma_magi_household_income_pct_fpl, ["+", 1, ma_reasonable_compatibility_threshold_pct]]]]
sources: [S838, S864, S867, S3364, S168]
precision: "Coverage review F-12 (OQ-302): Colorado's MAGI verification plan (D-317, S3364) says that when \"an individual attests to income above the applicable standard and data source indicates income below the standard, the state will take the attestation and make the person ineligible ... Additional information will not be requested\"; the item had treated that combination as not compatible, so CO-1403 asked for earned income documentation. The attested figure is then the one eligibility uses, and the person is ineligible on it. The plan's threshold (10%) predates the rule's 20% (ma_reasonable_compatibility_threshold_pct), which governs; neither says 20% of what (OQ-302). With both at or below the standard the any is true on its second term; with the attested figure at or below and the data above, only the threshold term can be true. Coverage review 2, N-04: the standard had been compared without the 5% disregard, so an attestation between the standard and the standard plus the disregard counted as above the standard (compatible) while the category items (CO-545 to CO-548) granted eligibility on it, and no verification was asked even with a data figure far above. C.2.a.iii's 'ineligible due to income' and the plan's 'make the person ineligible' are true on the attestation only above the standard after the disregard (§ 8.100.4.D.1.a: the disregard is the last step of each eligibility test), so that is the standard compared here."
implemented: engine
tags: [verification, ma, income, magi]
open: [OQ-302]
rationale: No existing item compares attested and electronic income; 42 CFR 435.952(c)(1) (S838) and 8.100.4.C.2.a (S864) make the comparison the trigger for documentation.
tests:
  - {id: CO-1402-T1, month: "2026-10", as_of: "2026-10-01", given: {ma_magi_household_income_pct_fpl: 1, ma_electronic_data_source_household_income_pct_fpl: 1.1, ma_magi_highest_income_standard_pct: 1.38}, expect: true}
  - {id: CO-1402-T2, month: "2026-10", as_of: "2026-10-01", given: {ma_magi_household_income_pct_fpl: 1.5, ma_electronic_data_source_household_income_pct_fpl: 1.6, ma_magi_highest_income_standard_pct: 1.38}, expect: true}
  - {id: CO-1402-T3, month: "2026-10", as_of: "2026-10-01", given: {ma_magi_household_income_pct_fpl: 1.3, ma_electronic_data_source_household_income_pct_fpl: 1.5, ma_magi_highest_income_standard_pct: 1.38}, expect: true}
  - {id: CO-1402-T4, month: "2026-10", as_of: "2026-10-01", given: {ma_magi_household_income_pct_fpl: 1, ma_electronic_data_source_household_income_pct_fpl: 1.5, ma_magi_highest_income_standard_pct: 1.38}, expect: false}
  - {id: CO-1402-T5, month: "2026-10", as_of: "2026-10-01", title: "Coverage review F-12: attested above the standard, data below - taken as attested, no documentation (verification plan, S3364); was false", given: {ma_magi_household_income_pct_fpl: 1.5, ma_electronic_data_source_household_income_pct_fpl: 1.2, ma_magi_highest_income_standard_pct: 1.38}, expect: true}
  - {id: CO-1402-T6, month: "2026-11", as_of: "2026-11-10", title: "Coverage review 2, N-04 (RV2-RC): attested 145% (within 142% plus the 5% disregard), data 300% - not compatible; was true", given: {ma_magi_household_income_pct_fpl: 1.45, ma_electronic_data_source_household_income_pct_fpl: 3.0, ma_magi_highest_income_standard_pct: 1.42}, expect: false}
  - {id: CO-1402-T7, month: "2026-11", as_of: "2026-11-10", title: "Coverage review 2 (RV2-RCB): attested and data both 145%", given: {ma_magi_household_income_pct_fpl: 1.45, ma_electronic_data_source_household_income_pct_fpl: 1.45, ma_magi_highest_income_standard_pct: 1.42}, expect: true}
  - {id: CO-1402-T8, month: "2026-11", as_of: "2026-11-10", title: "Attested 150%, above 142% plus the disregard, data 120% - taken as attested (ineligible), no documentation", given: {ma_magi_household_income_pct_fpl: 1.5, ma_electronic_data_source_household_income_pct_fpl: 1.2, ma_magi_highest_income_standard_pct: 1.42}, expect: true}
