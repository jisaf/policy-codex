id: CO-603
name: "Medicaid: is aged, blind, or disabled"
identifier: ma_is_aged_blind_or_disabled
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether the person meets any one of the three SSI-related non-financial categories for the month - aged in the month (ma_is_aged, CO-600: 65 by the last day of the month), blind, or disabled - per 42 U.S.C. 1382c(a)(1)(A) and 10 CCR 2505-10 8.100.6.A."
precision: "Coverage pass 6, non-MAGI F6-4 (docs/reviews/coverage6-medicaid-nonmagi.md): per month. The long-term care, HCBS, PACE, protected-group and verification rules that read it are per-month outcomes, and a month-scoped rule that tests an age for the month it evaluates measures it in that month (docs/operators.md, Ages in a month; 10 CCR 2505-10 8.100.7.A.2.a \"Have attained the age of 65 years\", S1753; 8.100.5.C.1). Before, it was a per-person item reading [at, ma_is_aged, [det_month]], so a nursing facility resident who turned 65 in the determination month was aged in every retroactive month before the birthday. Blindness and disability stay the stated determinations; the disability onset gate of a retroactive month is ma_is_aged_blind_or_disabled_in_month (CO-5201)."
derived: [any, ma_is_aged, is_blind, meets_ssa_disability_criteria]
sources: [S303, S304, S305, S1753]
implemented: engine
tags: [ma, non_magi, age, disability]
rationale: "No existing item combines the three prongs. ma_is_ssi_related_eligible (CO-611) needs the combined test. Reads is_blind and meets_ssa_disability_criteria directly rather than through ma_is_blind/ma_is_disabled, per the phase-4 review's minor finding (fix-round C-15): those two items were single-element [all, x] wrappers with no added meaning over the supplied SSA/SSI determination, and were withdrawn (formerly CO-601, CO-602)."
tests:
  - {id: CO-603-T1, month: "2026-10", as_of: "2026-10-01", given: {date_of_birth: "1947-03-12", is_blind: false, meets_ssa_disability_criteria: false}, expect: true}
  - {id: CO-603-T2, month: "2026-10", as_of: "2026-10-01", given: {date_of_birth: "1980-01-01", is_blind: false, meets_ssa_disability_criteria: false}, expect: false}
  # Coverage pass 6 F6-4 (AGE65-RETRO-LTC, CO-902): born 1961-10-15, determined 2026-11-12. 8.100.7.A.2.a "Have attained the age of 65 years" (S1753), taken on the last day of the month (CO-5402):
  # August 31, 2026: 64 (the 65th birthday is 2026-10-15), so not aged; not blind or disabled: false. October 31, 2026: 65: true.
  - {id: CO-603-T3, month: "2026-08", as_of: "2026-11-12", title: "F6-4: a retroactive month before the 65th birthday is not aged", given: {date_of_birth: "1961-10-15", is_blind: false, meets_ssa_disability_criteria: false}, expect: false}
  - {id: CO-603-T4, month: "2026-10", as_of: "2026-11-12", title: "F6-4: the month of the 65th birthday is aged", given: {date_of_birth: "1961-10-15", is_blind: false, meets_ssa_disability_criteria: false}, expect: true}
