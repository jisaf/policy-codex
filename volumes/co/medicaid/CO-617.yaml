id: CO-617
name: "Medicaid: Medicare Savings Program category"
identifier: ma_msp_category
kind: derived
type: one of
options: [qmb, slmb, qi, qdwi, none]
scope: person-month
program: Medicaid
role: outcome
meaning: "The single Medicare Savings Program category this person qualifies under for the month, tested in the order Colorado's tiers of Medicare cost-sharing assistance run (10 CCR 2505-10 8.100.6.L-8.100.6.O) - QMB first (the most generous), then SLMB, then QI-1, then QDWI, or none. QMB is reported only for a month in which its coverage can be in effect (ma_qmb_is_in_effect, CO-3623: from the month after the month of determination, never retroactively, § 8.100.6.L.10-11), and QDWI from the month of determination (ma_qdwi_is_in_effect, CO-3624, § 8.100.6.O.5); a person who meets the QMB test in the determination month or a retroactive month is reported none for it, since SLMB and QI-1 cover only income above the QMB limit. It answers whether the criteria are met for the month; whether the month falls inside the coverage period (not before the retroactive months of § 8.100.3.E.1, and for QMB not before the effective month) is not tested here, as ma_month_is_before_coverage_period (CO-4101) tests it for the MAGI and OAP outcomes (final verification pass 3, P3-1)."
precision: "QMB and SLMB/QI-1 are structured as increasing income bands that cannot overlap by construction (ma_slmb_eligible and ma_qi_eligible each exclude the tier below); QDWI is a separate track (Part A entitlement on a disability basis that has been or is being lost) that can coincide with none of the others, so testing it last is a matter of the category list's order, not exclusivity. The Medicare Savings Programs are Medical Assistance categories, so § 8.100.3.G.1.g's citizenship and immigration status requirement (ma_meets_citizenship_requirement, CO-509) applies to them, and from October 1, 2026 42 U.S.C. 1396b(v)(5) limits them like any partial benefit (CMS SHO #26-001, note 14, S1703). Coverage pass 7, non-MAGI F7-5 (docs/reviews/coverage7-medicaid-nonmagi.md): reads the general requirement of 10 CCR 2505-10 § 8.100.3.G.1.c (S659) through ma_meets_imd_requirement (CO-1179), as the SSI-related groups (CO-611) and the MAGI groups (CO-562) do: G.1 states what a person \"shall\" meet \"To be eligible to receive Medical Assistance\", and names no category it leaves out. Before, a patient aged 21 to 64 of an institution for mental diseases could be found eligible here although no other Medical Assistance category admitted him (IMD-LTC, stored household CO-1104). Coverage pass 7 (found while fixing F7-5, docs/reviews/coverage7-medicaid-nonmagi.md, F7-5a): residency, § 8.100.3.G.1.a (S661), read in the month (ma_meets_residency_in_month, CO-7650; S1518, S1503), as every other aged, blind and disabled category reads it since the Medicaid status by month round (MS-1); the Medicare Savings Programs read no residency at all before, so a month before a move to Colorado could be an MSP month (CO-617-T93). The residency and IMD requirements are read inside each category's arm, after the category's own test, so a person who meets no category is none whatever those facts say (a household that does not state its residence setting is not made cannot determine for a category it does not reach)."
derived: [case, [[not, ma_meets_citizenship_requirement_in_month], none], [ma_abd_denied_for_noncooperation, none], [[all, ma_qmb_eligible, ma_qmb_is_in_effect, ma_meets_residency_in_month, ma_meets_imd_requirement], qmb], [[all, ma_slmb_eligible, ma_meets_residency_in_month, ma_meets_imd_requirement], slmb], [[all, ma_qi_eligible, ma_meets_residency_in_month, ma_meets_imd_requirement], qi], [[all, ma_qdwi_eligible, ma_qdwi_is_in_effect, ma_meets_residency_in_month, ma_meets_imd_requirement], qdwi], [else, none]]
sources: [S312, S313, S314, S315, S1703, S607, S2406, S2410, S3621, S3622, S659, S661, S1518, S1503]
implemented: engine
tags: [ma, non_magi, msp]
rationale: "No existing item reports which single MSP category a person qualifies under. Needed as the batch's MSP outcome per the phase-4 brief's interface (role: outcome). CO-01's p2 (QMB by income, given the resource test the coordinator's case will supply) is the worked example in the batch report. History moved from the precision note (HCPF review S-14): HCPF fix round (B-1): the Medicare Savings Programs are Medical Assistance categories, so § 8.100.3.G.1.g's citizenship and immigration status requirement (ma_meets_citizenship_requirement, CO-509) applies to them, and from October 1, 2026 42 U.S.C. 1396b(v)(5) limits them like any partial benefit (CMS SHO #26-001, note 14, S1703). Final verification F-5 (2026-11-22): QMB was reported in the determination month and every retroactive month; § 8.100.6.L.10-11 (S2406) makes it effective the month after the month of determination and not retroactive, and § 8.100.6.O.5 (S2410) makes QDWI effective the month of determination. Coverage pass 2 (first pass NM-28): denied when ma_abd_denied_for_noncooperation (CO-4886) holds (§ 8.100.5.E.6, § 8.100.7.V.2.c)."
nearest: [CO-387, CO-612]
