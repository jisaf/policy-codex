  - {id: CO-559-T2, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "2015-01-01", attested_household_income_pct_fpl: 1.50}, expect: false}
  - {id: CO-559-T3, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "1990-01-01", attested_household_income_pct_fpl: 0.50}, expect: false}
