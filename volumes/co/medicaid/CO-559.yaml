  - {id: CO-559-T2, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "2015-01-01", is_enrolled_in_medical_assistance: false, is_pregnant: false, received_presumptive_eligibility_in_last_twelve_months: false, declared_household_income_pct_fpl: 1.50}, expect: false}
