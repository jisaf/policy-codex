id: CO-559
name: "Medicaid: is presumptively eligible, child"
identifier: ma_is_presumptively_eligible_child
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether a child under ma_magi_child_age_limit is presumptively eligible for State Plan approved medical services under 10 CCR 2505-10 8.100.4.F.2.b, 42 CFR 435.1102(a), and 42 U.S.C. 1396r-1a(a) - under ma_magi_child_age_limit, declared household income at or below ma_magi_income_standard_child, not already receiving another Medical Assistance program (§ 8.100.4.F.8), and no presumptive eligibility in the last 12 months, or, for a pregnant child, during this pregnancy (§ 8.100.4.F.9). Informational: no rule reads it and it is not a declared outcome; ma_hospital_presumptive_eligibility_category (an outcome) carries the hospital route, and this reports the qualified-entity route."
assumption: "Fix round (C-15): reads declared_household_income_pct_fpl (CO-3151) instead of ma_magi_household_income_pct_fpl (CO-504), retiring the OQ-54 assumption on this item, for the same reason given on ma_is_presumptively_eligible_pregnant (CO-558). No income disregard is applied, for the same reason given there."
derived: [all, [<, age, ma_magi_child_age_limit], [not, is_enrolled_in_medical_assistance], [case, [is_pregnant, [not, received_presumptive_eligibility_this_pregnancy]], [else, [not, received_presumptive_eligibility_in_last_twelve_months]]], ["<=", declared_household_income_pct_fpl, ma_magi_income_standard_child]]
precision: "The declaration that the child is a citizen or a documented immigrant (§ 8.100.4.F.2.b, S1501) is not a condition here, for the reason given on ma_is_presumptively_eligible_pregnant (CO-558): § 8.100.3.G.1.g.ix.1.a (S607) says a person under ma_magi_child_age_limit shall not be excluded from MAGI Child Presumptive Eligibility on the basis of immigration status (OQ-56, resolved)."
sources: [S219, S220, S223, S246, S1501, S607, S2100]
implemented: engine
tags: [ma, magi, income, age]
rationale: "Heavier-definitions audit L-2 (audit fix round 4): § 8.100.4.F.8-9's bars (already receiving Medical Assistance; once every 12 months, once per pregnancy) were not tested. No existing item states presumptive eligibility for a child. Not the same test as ma_is_child_category (CO-545), which applies the 5% disregard as the last step of a full determination; parallel in shape to ma_is_presumptively_eligible_pregnant (CO-558) but keyed on age rather than pregnancy, since 8.100.4.F.2.a/.b and 435.1102/1103 state the two presumptive-eligibility populations as parallel but separate rules. Fix round (C-15): switched from ma_magi_household_income_pct_fpl to declared_household_income_pct_fpl (CO-3151), matching CO-558 and CO-708."
nearest: [CO-558]
