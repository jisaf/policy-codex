  - {id: CO-559-T4, as_of: "2026-10-01", month: "2026-10", title: "L-2: presumptive eligibility in the last 12 months (F.9)", given: {date_of_birth: "2015-01-01", is_enrolled_in_medical_assistance: false, is_pregnant: false, received_presumptive_eligibility_in_last_twelve_months: true, declared_household_income_pct_fpl: 1.00}, expect: false}
