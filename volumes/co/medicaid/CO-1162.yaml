id: CO-1162
name: "Medicaid: is disabled widow(er) eligible"
identifier: ma_disabled_widow_eligible
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: Whether the person is eligible as a disabled widow(er) (10 CCR 2505-10 §§ 8.100.3.F.1.e, 8.100.6.I) - a disabled widow or widower aged ma_disabled_widow_min_age through 64 who received SSI in the past and no longer receives SSI payments because of Social Security benefits, has no Medicare hospital insurance, and meets the other Medical Assistance requirements; the group ends when the person becomes eligible for Medicare Part A.
precision: "'Meet all other Medical Assistance requirements' (§ 8.100.6.I.1.f) is read as residency, status, and the SSI-related income and resource criteria of § 8.100.5 that § 8.100.6.A.1 gives every ABD category, applied as 42 U.S.C. 1383c(d)(2) and 42 CFR 435.138(a) deem the group SSI recipients 'for so long as such person ... would be eligible for such supplemental security income benefits ... in the absence of' the widow(er)'s benefits: the SSI resource standard (ma_meets_ssi_resource_standard), and the SSI income test with the Social Security benefit disregarded (ma_ssi_income_test_status, CO-5516: met, or met with OASDI disregarded; the countable income is ma_dac_countable_income, the computation the Disabled Adult Child group uses): income at a rate of not more than the SSI Federal Benefit Rate (42 U.S.C. 1382(a), S3950), the test 1383c(d) names. T-9 hand check A-4 (receipts migration phase 2): the item read \"below\" by analogy with the Disabled Adult Child group (OQ-209), the opposite of CO-609 for the same SSI test; both now read CO-5516. The whole Social Security benefit is disregarded: a disabled widow(er) is paid the higher of the own and the widow(er)'s benefit, and 1383c(d)(1)(A) names a benefit under 402(e) or (f) 'or under any other subsection of section 402' where the person is also eligible under (e) or (f). 'Have received SSI in the past' and 'no longer receive SSI payments because of Social Security payments' (§ 8.100.6.I.1.b, d) read lost_ssi_due_to_social_security_benefits (CO-1180), not the SSI-or-OAP fact. 'Not have hospital insurance under Medicare' reads medicare_part_a_entitled (CO-803). The upper bound is ma_aged_age (CO-237), 65, which § 8.100.6.I.1.c states as 'not 65 years old'. Widowhood reads marital_status widowed; is_widow_or_widower (CO-1111) is retired. Time audit T-1 (2026-11-23): the minimum age reads ma_age_on_last_day_of_month (CO-5402) and \"under 65\" ma_age_on_first_day_of_month (CO-4978), so each is met if it is met on any day of the month (§ 8.100.5.C.1, S3900); it read age (CO-300), the age on the determination date, in every month. Pattern sweep, non-MAGI Medicaid (docs/reviews/pattern-sweep-nonmagi.md, P1): disability is read in the month: not in a month before the disability onset (ma_month_is_before_disability_onset, CO-4888; the onset is 'the date on which the person's disability began', CO-4887; 10 CCR 2505-10 § 8.100.5.C.4.b, S3623; § 8.100.3.E.1, S1503). Before, the undated finding was read in every month."
derived: [all, ma_meets_residency_in_month, ma_meets_citizenship_requirement_in_month, ["=", marital_status, widowed], [all, meets_ssa_disability_criteria, [not, ma_month_is_before_disability_onset]], lost_ssi_due_to_social_security_benefits, [">=", ma_age_on_last_day_of_month, ma_disabled_widow_min_age], ["<", ma_age_on_first_day_of_month, ma_aged_age], [not, medicare_part_a_entitled], ma_meets_ssi_resource_standard, [in, ma_ssi_income_test_status, [met, met_with_oasdi_disregarded]]]
sources: [S3900, S625, S3411, S3416, S3417, S3950, S3623, S1503]
implemented: engine
tags: [ma, non_magi, disability, age]
open: [OQ-209]
rationale: "No existing item states the disabled widow(er) group. ma_protected_group_category (CO-1163) needs it. History moved from the precision note (HCPF review S-14): Vocabulary fix round (C-1): widowhood reads marital_status widowed; is_widow_or_widower (CO-1111) is retired. Precision history (moved from precision, engineering follow-up pass task 5): (phase 7 fix round, S-7). Coverage review NM-9 (OQ-209's first half resolved): the group tested no income or resource standard, so a disabled widow with $40,000 in savings was eligible; § 8.100.6.A.1 sends every ABD category to § 8.100.5 for income and resources, and 1383c(d)(2) keeps the group only while SSI would be payable without the widow(er)'s benefit. T-9 threshold hand check A-4 (receipts migration phase 2): the income test is the one SSI income test (ma_ssi_income_test_status, CO-5516), at or under the rate (S3950)."
