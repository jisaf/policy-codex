  - {id: CO-3601-T12, as_of: "2026-11-10", month: "2026-10", title: "C6-03 (CO-810 without pregnancy_end_date): applied 2026-10-05 pregnant since 2026-02-10, gave birth to p2 (a person of the case, born 2026-10-20): the pregnancy ended 2026-10-20 (CO-7400), so October is a pregnant month", given: {is_pregnant: false, pregnancy_start_date: "2026-02-10", ma_application_date: "2026-10-05"}, others: {p2: {date_of_birth: "2026-10-20"}}, relationships: [[gave_birth_to, p1, p2]], expect: true}
