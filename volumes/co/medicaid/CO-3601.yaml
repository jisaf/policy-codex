id: CO-3601
name: "Medicaid: is pregnant in the month"
identifier: ma_is_pregnant_in_month
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether the person was pregnant at some time in the month, the condition of the Pregnant Women MAGI category (10 CCR 2505-10 § 8.100.4.G.5) for that month. Never a month before the month the pregnancy began, where pregnancy_start_date is stated. Otherwise: for the determination month and later months, and the months from the application month on, the person's current pregnancy (is_pregnant); for an earlier month, a retroactive month under § 8.100.3.E, a month from the month the pregnancy began; for a pregnancy that has ended (most_recent_pregnancy_end_date, CO-7400: the stated end, or the date of birth of the child of the case she gave birth to), the month it ended and the months from the month it began through it; and, for a person not pregnant now who states the start of a pregnancy but no end, the months from its start cannot be determined."
precision: "A month counts if the person was pregnant on any day of it, so the month of a birth is a pregnant month, as coverage under § 8.100.4.G.1 is for whole months; the month a pregnancy ended is a pregnant month whether or not its start is stated (the end date is the last day of the pregnancy). A current pregnancy is not dated for the determination month and later months, nor for the months from the application month on: is_pregnant answers for them where no start date is stated. For a retroactive month the dates decide; the start date is read only when the month is not settled otherwise, and an unstated start date leaves such a month unknown, not silently pregnant or not. § 8.100.3.E.2 (S2411): 'An applicant does not have to be eligible in the month of application to be eligible for retroactive Medical Assistance'. Coverage pass 6 (2026-11-24): C6-06, a stated pregnancy_start_date governs the months before it whatever is_pregnant says (§ 8.100.4.G.1: eligibility in a month is judged on that month's facts; before, a pregnancy that began after the application month was read as a pregnancy in the application month, PG-STARTS-LATER: applied 2026-09-20, pregnant from 2026-10-12, $2,200; September was read as size 2, 2,200 / 1,803.33 = 122.0%, eligible, and is size 1, 2,200 / 1,330 = 165.4%, less 5 = 160.4% > 133%, ineligible_income). C6-03, an ended pregnancy is read from most_recent_pregnancy_end_date (CO-7400), so a birth recorded by the child's date of birth and the gave_birth_to relationship ends the pregnancy without a separate pregnancy_end_date; a person not pregnant now (is_pregnant false) who states a pregnancy_start_date and no end, with no birth recorded, cannot be determined for the months from its start (the end is the missing fact); with neither a start nor an end stated nor a birth recorded she is read as having no ended pregnancy, the reading pregnancy_end_date (CO-089) states."
derived: [all, [not, [all, [not, [unknown, pregnancy_start_date]], ["<", [month], [month_of, pregnancy_start_date]]]], [any, [all, is_pregnant, [any, [">=", [month], [det_month]], [">=", [month], [month_of, ma_application_date]], ["<=", [month_of, pregnancy_start_date], [month]]]], [all, [not, [unknown, most_recent_pregnancy_end_date]], ["<=", [month], [month_of, most_recent_pregnancy_end_date]], [any, ["=", [month], [month_of, most_recent_pregnancy_end_date]], ["<=", [month_of, pregnancy_start_date], [month]]]], [all, [not, is_pregnant], [unknown, most_recent_pregnancy_end_date], [not, [unknown, pregnancy_start_date]], ["<=", [month], [month_of, pregnancy_end_date]]]]]
sources: [S640, S1503, S2411, S224, S3351]
implemented: engine
tags: [ma, magi]
rationale: "Final verification F-1 (docs/reviews/final-medicaid-chp.md): ma_is_pregnant_category (CO-546) read the person-scoped is_pregnant, \"currently pregnant\" on the determination date, in every month, so a retroactive month before a birth was never a pregnant month. 10 CCR 2505-10 § 8.100.3.E.1-2 (S1503, S2411) provides coverage in each of the months before the application in which the person met the requirements, and 42 U.S.C. 1396a(e)(16)(A) (S224) continues postpartum coverage for a woman who received Medical Assistance while pregnant \"including during a period of retroactive eligibility\". No existing item states pregnancy month by month."
tests:
  - {id: CO-3601-T1, as_of: "2026-09-15", month: "2026-07", title: "Delivered 2026-08-10, applied 2026-09-15, pregnancy began 2025-11-05: July is a pregnant month", given: {is_pregnant: false, pregnancy_end_date: "2026-08-10", pregnancy_start_date: "2025-11-05", ma_application_date: "2026-09-15"}, expect: true}
  - {id: CO-3601-T2, as_of: "2026-09-15", month: "2026-08", title: "The month of the birth is a pregnant month", given: {is_pregnant: false, pregnancy_end_date: "2026-08-10", pregnancy_start_date: "2025-11-05", ma_application_date: "2026-09-15"}, expect: true}
  - {id: CO-3601-T3, as_of: "2026-09-15", month: "2026-09", title: "The application month, after the birth: not pregnant", given: {is_pregnant: false, pregnancy_end_date: "2026-08-10", pregnancy_start_date: "2025-11-05", ma_application_date: "2026-09-15"}, expect: false}
  - {id: CO-3601-T4, as_of: "2026-09-15", month: "2026-06", title: "A miscarriage on 2026-08-10 of a pregnancy that began 2026-07-01: June is not a pregnant month", given: {is_pregnant: false, pregnancy_end_date: "2026-08-10", pregnancy_start_date: "2026-07-01", ma_application_date: "2026-09-15"}, expect: false}
  - {id: CO-3601-T5, as_of: "2026-10-15", month: "2026-10", title: "Currently pregnant in the determination month: is_pregnant answers, no dates needed", given: {is_pregnant: true}, expect: true}
  - {id: CO-3601-T6, as_of: "2026-10-15", month: "2026-07", title: "Currently pregnant, pregnancy began 2026-05-20: July, a retroactive month, is a pregnant month", given: {is_pregnant: true, ma_application_date: "2026-10-05", pregnancy_start_date: "2026-05-20"}, expect: true}
  - {id: CO-3601-T7, as_of: "2026-10-15", month: "2026-07", title: "Currently pregnant, pregnancy began 2026-08-12: July is not a pregnant month", given: {is_pregnant: true, ma_application_date: "2026-10-05", pregnancy_start_date: "2026-08-12"}, expect: false}
  - {id: CO-3601-T8, as_of: "2026-10-15", month: "2026-07", title: "Currently pregnant, start date not stated: a retroactive month is unknown", given: {is_pregnant: true, ma_application_date: "2026-10-05"}, expect: unknown}
  - {id: CO-3601-T9, as_of: "2026-10-15", month: "2026-10", title: "Never pregnant", given: {is_pregnant: false}, expect: false}
  - {id: CO-3601-T10, as_of: "2026-11-10", month: "2026-09", title: "C6-06 (PG-STARTS-LATER): applied 2026-09-20 not pregnant, pregnant from 2026-10-12 (stated), pregnant on the determination date: September is before the month the pregnancy began, not a pregnant month (was true through is_pregnant)", given: {is_pregnant: true, pregnancy_start_date: "2026-10-12", ma_application_date: "2026-09-20"}, expect: false}
  - {id: CO-3601-T11, as_of: "2026-11-10", month: "2026-10", title: "C6-06: the same; October, the month the pregnancy began, is a pregnant month", given: {is_pregnant: true, pregnancy_start_date: "2026-10-12", ma_application_date: "2026-09-20"}, expect: true}
  - {id: CO-3601-T12, as_of: "2026-11-10", month: "2026-10", title: "C6-03 (CO-810 without pregnancy_end_date): applied 2026-10-05 pregnant since 2026-02-10, gave birth to p2 (a person of the case, born 2026-10-20): the pregnancy ended 2026-10-20 (CO-7400), so October is a pregnant month", given: {is_pregnant: false, pregnancy_start_date: "2026-02-10", ma_application_date: "2026-10-05"}, others: {p2: {date_of_birth: "2026-10-20"}}, relationships: [[gave_birth_to, p1, p2]], expect: true}
  - {id: CO-3601-T13, as_of: "2026-11-10", month: "2026-11", title: "C6-03: the same; November is after the month the pregnancy ended: not a pregnant month", given: {is_pregnant: false, pregnancy_start_date: "2026-02-10", ma_application_date: "2026-10-05"}, others: {p2: {date_of_birth: "2026-10-20"}}, relationships: [[gave_birth_to, p1, p2]], expect: false}
