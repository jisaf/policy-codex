program: Medicaid
meaning: "The person's own countable income for the month as ma_ssi_own_countable_income (CO-7354) figures it, with the person's counted Social Security (ma_ssi_counted_social_security_receipts) left out of the unearned income: the own-income form of ma_dac_countable_income (CO-1160), which the Disabled Adult Children and disabled widow(er)s tests compare (10 CCR 2505-10 § 8.100.6.I, J), for a person whose ineligible spouse's income is not deemed (20 CFR 416.1163(d)(1), S5031)."
precision: "Read by ma_ssi_income_test_status (CO-5516, met_with_oasdi_disregarded) and ma_dac_eligible (CO-1161) where ma_ssi_ineligible_spouse_income_is_not_deemed (CO-7353) holds. Pattern sweep, non-MAGI Medicaid (docs/reviews/pattern-sweep-nonmagi.md, P2): the SSI method's excluded earned income (ma_ssi_excluded_earned_income, CO-2471; the infrequent part, CO-4883) and in-kind support and maintenance (ssi_in_kind_support_and_maintenance, CO-802) are read as computed, required where read (decision 4 of 2026-11-23): they are unknown only where a fact they rest on is not stated (a student's school attendance, the shelter costs others pay), and no rule reads that as none; before, an unknown figure was read as 0."
