id: CO-7353
name: "Medicaid SSI method: an ineligible spouse's income is not deemed"
identifier: ma_ssi_ineligible_spouse_income_is_not_deemed
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether, for the SSI-related income test of the month, no income is deemed to the person from a spouse who lives with the person (20 CFR 416.1163(d)(1), S5031, as 42 CFR 435.601(b)(2), S4754, applies the SSI methodology where Colorado's text is silent): the spouse is an ineligible spouse (10 CCR 2505-10 § 8.100.5.H.2.c, 'a parent or spouse who is not applying or eligible for SSI', S1506), is not aged, blind or disabled in the month, and the spouse's earned and unearned income, less the Ineligible Child Allocation (H.3.a.i), is not more than the couple Federal Benefit Rate less the individual one. The person's own countable income is then tested against the individual rate."
precision: "The spouse is a member of ma_ssi_couple_members (CO-3626), so lives with the person in the month. The spouse's income is the unearned receipts the SSI method counts (ma_ssi_unearned_receipts) and gambling winnings, without in-kind support and maintenance (20 CFR 416.1161(a)(11), S5032), plus gross earned income less what the SSI method does not count (as ma_ssi_couple_earned_income_after_exclusions, CO-6051, counts each member's), less the whole Ineligible Child Allocation (ma_ssi_ineligible_child_allocation, CO-2277; allocated from unearned income, then earned, H.3.b.i), not below zero. A spouse who is aged, blind or disabled is not read as an ineligible spouse here: such a spouse, applying with the person, is a possible eligible spouse, and the couple's combined test applies as before (OQ-1385). Not stated whether the spouse applied for SSI (has_applied_for_ssi) where the spouse is not aged, blind or disabled: cannot determine (decision 4). Colorado's Medicare Savings Program text compares a couple's income with the couple maximum 'whether one or both members apply' (§ 8.100.6.L.3), so the Medicare Savings Programs do not read this item."
derived: [exists, [filter, ma_ssi_couple_members, [all, [otherwise, [rel, [spouse, holds_out_as_spouse_with], [P]], false], [not, [of, [P], ma_is_aged_blind_or_disabled]], [not, [of, [P], ma_is_applying_for_or_eligible_for_ssi]]]], ["<=", [max, 0, ["-", ["+", [of, [P], ma_ssi_unearned_receipts], [of, [P], ma_ssi_gambling_receipts], [max, 0, ["-", [of, [P], ma_ssi_gross_earned_income], [otherwise, [of, [P], ma_ssi_excluded_earned_income], 0]]]], ma_ssi_ineligible_child_allocation]], ["-", ma_ssi_federal_benefit_rate_couple, ssi_federal_benefit_rate_individual]]]
sources: [S5031, S5032, S4754, S1506, S1746]
open: [OQ-1385]
implemented: engine
tags: [ma, non_magi, income]
rationale: "Coverage pass 6, non-MAGI F6-6 (docs/reviews/coverage6-medicaid-nonmagi.md): the volume combined a living-together spouse's income and tested it against the couple rate whatever the spouse's status, so an aged person whose younger spouse has little income was tested at 1,491 on the couple's income where 416.1163(d)(1) deems nothing and tests the person alone at 994 (INELIG-SPOUSE, CO-906; the error only grants). Colorado's § 8.100.5.H.1.a (S1746) makes the income of spouses living together 'mutually available' and names no standard; H.2.c defines the ineligible spouse the SSI deeming rules turn on; 42 CFR 435.601(b)(2) applies the SSI methodology the rule is silent on, as the volume does elsewhere (coverage pass 4, N4-3). No conflict: Colorado's text states no threshold and no standard that (d) would override."
nearest: [CO-2278, CO-2279]
tests:
  # 20 CFR 416.1163(d)(1) (S5031). 2026 FBR: couple 1,491, individual 994; difference 497.
  # INELIG-SPOUSE (CO-906): the spouse p2, 50, not blind or disabled, not applying for SSI, no income; no children: 0 <= 497: true.
  - {id: CO-7353-T1, month: "2026-11", as_of: "2026-11-20", title: "F6-6 (INELIG-SPOUSE): an ineligible spouse with no income: nothing deemed", given: {ma_ssi_couple_members: [p1, p2], ma_ssi_ineligible_child_allocation: 0}, others: {p2: {ma_is_aged_blind_or_disabled: false, ma_is_applying_for_or_eligible_for_ssi: false, ma_ssi_unearned_receipts: 0, ma_ssi_gambling_receipts: 0, ma_ssi_gross_earned_income: 0, ma_ssi_excluded_earned_income: 0}}, relationships: [[spouse, p2]], expect: true}
  # The spouse earns 497: not more than 497 (the boundary): true. Earns 498: false.
  - {id: CO-7353-T2, month: "2026-11", as_of: "2026-11-20", title: "F6-6: the spouse's income at the difference (497): not more than it, nothing deemed", given: {ma_ssi_couple_members: [p1, p2], ma_ssi_ineligible_child_allocation: 0}, others: {p2: {ma_is_aged_blind_or_disabled: false, ma_is_applying_for_or_eligible_for_ssi: false, ma_ssi_unearned_receipts: 0, ma_ssi_gambling_receipts: 0, ma_ssi_gross_earned_income: 497, ma_ssi_excluded_earned_income: 0}}, relationships: [[spouse, p2]], expect: true}
  - {id: CO-7353-T3, month: "2026-11", as_of: "2026-11-20", title: "F6-6: the spouse's income one dollar over the difference (498): deemed, the couple", given: {ma_ssi_couple_members: [p1, p2], ma_ssi_ineligible_child_allocation: 0}, others: {p2: {ma_is_aged_blind_or_disabled: false, ma_is_applying_for_or_eligible_for_ssi: false, ma_ssi_unearned_receipts: 0, ma_ssi_gambling_receipts: 0, ma_ssi_gross_earned_income: 498, ma_ssi_excluded_earned_income: 0}}, relationships: [[spouse, p2]], expect: false}
  # The spouse has a pension of 700 and one ineligible child's allocation of 497 (994 / 2, H.3.a.i): 700 - 497 = 203 <= 497: true.
  - {id: CO-7353-T4, month: "2026-11", as_of: "2026-11-20", title: "F6-6: after the Ineligible Child Allocation the spouse's income is under the difference", given: {ma_ssi_couple_members: [p1, p2], ma_ssi_ineligible_child_allocation: 497}, others: {p2: {ma_is_aged_blind_or_disabled: false, ma_is_applying_for_or_eligible_for_ssi: false, ma_ssi_unearned_receipts: 700, ma_ssi_gambling_receipts: 0, ma_ssi_gross_earned_income: 0, ma_ssi_excluded_earned_income: 0}}, relationships: [[spouse, p2]], expect: true}
  # An aged spouse (a possible eligible spouse, OQ-1385): the couple's test applies: false.
  - {id: CO-7353-T5, month: "2026-11", as_of: "2026-11-20", title: "An aged spouse is not read as an ineligible spouse (OQ-1385)", given: {ma_ssi_couple_members: [p1, p2], ma_ssi_ineligible_child_allocation: 0}, others: {p2: {ma_is_aged_blind_or_disabled: true, ma_ssi_unearned_receipts: 0, ma_ssi_gambling_receipts: 0, ma_ssi_gross_earned_income: 0, ma_ssi_excluded_earned_income: 0}}, relationships: [[spouse, p2]], expect: false}
  # A spouse who has applied for SSI is not an ineligible spouse (H.2.c): false. No spouse in the couple: false.
  - {id: CO-7353-T6, month: "2026-11", as_of: "2026-11-20", title: "A spouse applying for SSI is not an ineligible spouse", given: {ma_ssi_couple_members: [p1, p2], ma_ssi_ineligible_child_allocation: 0}, others: {p2: {ma_is_aged_blind_or_disabled: false, ma_is_applying_for_or_eligible_for_ssi: true, ma_ssi_unearned_receipts: 0, ma_ssi_gambling_receipts: 0, ma_ssi_gross_earned_income: 0, ma_ssi_excluded_earned_income: 0}}, relationships: [[spouse, p2]], expect: false}
  - {id: CO-7353-T7, month: "2026-11", as_of: "2026-11-20", title: "No spouse in the couple", given: {ma_ssi_couple_members: [p1], ma_ssi_ineligible_child_allocation: 0}, relationships: [], expect: false}
