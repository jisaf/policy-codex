id: CO-7353
name: "Medicaid SSI method: an ineligible spouse's income is not deemed"
identifier: ma_ssi_ineligible_spouse_income_is_not_deemed
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether, for the SSI-related income test of the month, no income is deemed to the person from a spouse who lives with the person (20 CFR 416.1163(d)(1), S5031, as 42 CFR 435.601(b)(2), S4754, applies the SSI methodology where Colorado's text is silent): the spouse is an ineligible spouse (10 CCR 2505-10 § 8.100.5.H.2.c, 'a parent or spouse who is not applying or eligible for SSI', S1506), is not aged, blind or disabled in the month, and the spouse's earned and unearned income, less the Ineligible Child Allocation (H.3.a.i), is not more than the couple Federal Benefit Rate less the individual one. The person's own countable income is then tested against the individual rate."
precision: "The spouse is a member of ma_ssi_couple_members (CO-3626), so lives with the person in the month. The spouse's income is the unearned receipts the SSI method counts (ma_ssi_unearned_receipts) and gambling winnings, without in-kind support and maintenance (20 CFR 416.1161(a)(11), S5032), plus gross earned income less what the SSI method does not count (as ma_ssi_couple_earned_income_after_exclusions, CO-6051, counts each member's), less the whole Ineligible Child Allocation (ma_ssi_ineligible_child_allocation, CO-2277; allocated from unearned income, then earned, H.3.b.i), not below zero. A spouse who is aged, blind or disabled is not read as an ineligible spouse here: such a spouse, applying with the person, is a possible eligible spouse, and the couple's combined test applies as before (OQ-1385). Not stated whether the spouse applied for SSI (has_applied_for_ssi) where the spouse is not aged, blind or disabled: cannot determine (decision 4). Colorado's Medicare Savings Program text compares a couple's income with the couple maximum 'whether one or both members apply' (§ 8.100.6.L.3), so the Medicare Savings Programs do not read this item. Pattern sweep, non-MAGI Medicaid (docs/reviews/pattern-sweep-nonmagi.md, P1): aged, blind or disabled is read in the month with the disability onset gate (ma_is_aged_blind_or_disabled_in_month, CO-5201; 10 CCR 2505-10 § 8.100.5.C.4.b, S3623: disability approved, or 'a disability onset date determined on or prior to the date of a medical service'; § 8.100.3.E.1, S1503), as the SSI-related groups (CO-611) and OAP SISC B (CO-1177) already read it. Before, it read ma_is_aged_blind_or_disabled (CO-603), which has no onset gate, so a retroactive month before the onset of a disability was a disabled month. Pattern sweep, non-MAGI Medicaid (docs/reviews/pattern-sweep-nonmagi.md, P2): the SSI method's excluded earned income (ma_ssi_excluded_earned_income, CO-2471; the infrequent part, CO-4883) and in-kind support and maintenance (ssi_in_kind_support_and_maintenance, CO-802) are read as computed, required where read (decision 4 of 2026-11-23): they are unknown only where a fact they rest on is not stated (a student's school attendance, the shelter costs others pay), and no rule reads that as none; before, an unknown figure was read as 0."
derived: [exists, [filter, ma_ssi_couple_members, [all, [otherwise, [rel, [spouse, holds_out_as_spouse_with], [P]], false], [not, [of, [P], ma_is_aged_blind_or_disabled_in_month]], [not, [of, [P], ma_is_applying_for_or_eligible_for_ssi]]]], ["<=", [max, 0, ["-", ["+", [of, [P], ma_ssi_unearned_receipts], [of, [P], ma_ssi_gambling_receipts], [max, 0, ["-", [of, [P], ma_ssi_gross_earned_income], [of, [P], ma_ssi_excluded_earned_income]]]], ma_ssi_ineligible_child_allocation]], ["-", ma_ssi_federal_benefit_rate_couple, ssi_federal_benefit_rate_individual]]]
sources: [S5031, S5032, S4754, S1506, S1746, S3623, S1503]
open: [OQ-1385]
implemented: engine
tags: [ma, non_magi, income]
rationale: "Coverage pass 6, non-MAGI F6-6 (docs/reviews/coverage6-medicaid-nonmagi.md): the volume combined a living-together spouse's income and tested it against the couple rate whatever the spouse's status, so an aged person whose younger spouse has little income was tested at 1,491 on the couple's income where 416.1163(d)(1) deems nothing and tests the person alone at 994 (INELIG-SPOUSE, CO-906; the error only grants). Colorado's § 8.100.5.H.1.a (S1746) makes the income of spouses living together 'mutually available' and names no standard; H.2.c defines the ineligible spouse the SSI deeming rules turn on; 42 CFR 435.601(b)(2) applies the SSI methodology the rule is silent on, as the volume does elsewhere (coverage pass 4, N4-3). No conflict: Colorado's text states no threshold and no standard that (d) would override."
nearest: [CO-2278, CO-2279]
tests:
