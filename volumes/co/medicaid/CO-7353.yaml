  # INELIG-SPOUSE (CO-906): the spouse p2, 50, not blind or disabled, not applying for SSI, no income; no children: 0 <= 497: true.
  # Pattern sweep (P1): the month's aged, blind or disabled (ma_is_aged_blind_or_disabled_in_month, CO-5201) is stated beside the person-scope one; the reader now reads the month's.
  - {id: CO-7353-T1, month: "2026-11", as_of: "2026-11-20", title: "F6-6 (INELIG-SPOUSE): an ineligible spouse with no income: nothing deemed", given: {ma_ssi_couple_members: [p1, p2], ma_ssi_ineligible_child_allocation: 0}, others: {p2: {ma_is_aged_blind_or_disabled: false, ma_is_aged_blind_or_disabled_in_month: false, ma_is_applying_for_or_eligible_for_ssi: false, ma_ssi_unearned_receipts: 0, ma_ssi_gambling_receipts: 0, ma_ssi_gross_earned_income: 0, ma_ssi_excluded_earned_income: 0}}, relationships: [[spouse, p2]], expect: true}
