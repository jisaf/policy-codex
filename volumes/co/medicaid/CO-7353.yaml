  - {id: CO-7353-T4, month: "2026-11", as_of: "2026-11-20", title: "F6-6: after the Ineligible Child Allocation the spouse's income is under the difference", given: {ma_ssi_couple_members: [p1, p2], ma_ssi_ineligible_child_allocation: 497}, others: {p2: {ma_is_aged_blind_or_disabled: false, ma_is_aged_blind_or_disabled_in_month: false, ma_is_applying_for_or_eligible_for_ssi: false, ma_ssi_unearned_receipts: 700, ma_ssi_gambling_receipts: 0, ma_ssi_gross_earned_income: 0, ma_ssi_excluded_earned_income: 0}}, relationships: [[spouse, p2]], expect: true}
