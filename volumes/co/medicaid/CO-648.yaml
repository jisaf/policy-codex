id: CO-648
name: "Medicaid: meets the LTC resource standard"
identifier: ma_meets_ltc_resource_standard
kind: derived
type: yes/no
scope: person
program: Medicaid
meaning: Whether this person's countable resources for Long-Term Care eligibility do not exceed the SSI-related individual resource limit - the institutionalized spouse is resource eligible when the couple's total resources are at or below the CSRA plus the $2,000 individual resource allowance - per 42 U.S.C. 1396r-5(c)(2) and 10 CCR 2505-10 § 8.100.7.O.1.
derived: ["<=", ma_institutionalized_spouse_countable_resources, ma_ssi_resource_limit_individual]
sources: [S357]
implemented: engine
tags: [ma, ltc, resources]
rationale: "No existing item compares ma_institutionalized_spouse_countable_resources to the individual resource limit. ma_ltc_financially_eligible (CO-651) needs it. Reuses ma_ssi_resource_limit_individual (CO-233, batch 8) rather than a new parameter, since 8.100.7.O.1's '$2,000' is the same SSI-related individual limit 8.100.5.M.1 states."
nearest: [CO-610]
tests:
  - {id: CO-648-T1, as_of: "2026-10-01", given: {ma_institutionalized_spouse_countable_resources: 1600, ma_ssi_resource_limit_individual: 2000}, expect: true}
  - {id: CO-648-T2, as_of: "2026-10-01", given: {ma_institutionalized_spouse_countable_resources: 16000, ma_ssi_resource_limit_individual: 2000}, expect: false}
