id: CO-3616
name: "Medicaid: income available for the patient payment after the personal needs allowance"
identifier: ma_patient_payment_available_income
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "A Long-Term Care institution resident's income left for the patient payment after the personal needs allowance (ma_personal_needs_allowance, CO-1987) and the earned income reserve, before the other deductions (10 CCR 2505-10 § 8.100.7.T.1.a, V.3.b.ii.1, V.3.d.iii, V.3.f): the unearned income less the allowance, plus the countable earned income - the earned income less any part of the allowance the unearned income could not meet, less ma_ltc_earned_income_reserve_base, times ma_ltc_earned_income_reserve_rate. For a person with an income trust, the trust's monthly distribution (ma_income_trust_distribution, CO-2238) less the allowance."
precision: "Earned income is the resident's gross earned income as the SSI method counts it (ma_ssi_gross_earned_income, CO-5171): every earned income of a Long-Term Care institution resident is read as coming from an income-producing activity of § 8.100.7.V.3.e (sheltered work, protected employment, vocational rehabilitation, employment training, work within the facility), since a resident's earnings come from such an activity in practice and no fact separates them (earned-income records, step E1: ma_ltc_earned_income, CO-3615, which held that reading and had become the same figure, is removed). V.3.f.i reserves the personal needs allowance from earned income only when unearned income cannot meet it, and V.3.f.iii computes the additional reserve on the total gross earned income when the allowance comes from unearned income; so the part of the allowance unearned income leaves unmet is taken from earned income first, and the $65 and one-half are then applied to the rest. SSI paid to an institutionalized person is not in ma_ltc_gross_income (CO-641), which § 8.100.7.V.3.i.ii requires. For a trust user the distribution is the income the rule names (OQ-96), and no earned income reserve is applied to it. Each part is floored at zero. Blocked (OQ-1060): the personal needs allowance it deducts (CO-1987, CO-887) rests on S1228, which is not a quotation. HCPF Operational Memo OM 25-073 (D-125), the only document that states them, could not be fetched on 2026-11-23 (hcpf.colorado.gov refused, HTTP 403; medicaid.gov, sos.state.co.us, ecfr.gov, law.cornell.edu, govinfo.gov and federalregister.gov answered but state no Colorado figure), so the item stays Draft until the memo is stored and the excerpt replaced by its quotation."
open: [OQ-1060]
derived: [case, [has_income_trust, [max, 0, ["-", ma_income_trust_distribution, ma_personal_needs_allowance]]], [else, [+, [max, 0, ["-", [max, 0, ["-", ma_ltc_gross_income, ma_ssi_gross_earned_income]], ma_personal_needs_allowance]], [max, 0, ["*", ["-", ["-", ma_ssi_gross_earned_income, [max, 0, ["-", ma_personal_needs_allowance, [max, 0, ["-", ma_ltc_gross_income, ma_ssi_gross_earned_income]]]]], ma_ltc_earned_income_reserve_base], ma_ltc_earned_income_reserve_rate]]]]]
sources: [S2401, S2402, S2403, S2405, S360]
implemented: engine
tags: [ma, ltc, income]
rationale: "Final verification F-3 (docs/reviews/final-medicaid-chp.md): ma_patient_payment (CO-658) deducted only the personal needs allowance, the community spouse and family allowances and every health insurance premium, in every month; 10 CCR 2505-10 § 8.100.7.V.3.b-i (S2400-S2405) lists further deductions and adds Long-Term Care insurance payments, and limits the Part B premium to the first two months. The earned income reserve of V.3.d.iii and its interaction with the personal needs allowance (V.3.f) had no item."
tests:
  - {id: CO-3616-T1, as_of: "2026-11-01", month: "2026-11", title: "Unearned only: 2,000 less the 75 allowance", parameters: {ma_personal_needs_allowance_institutional: 75}, given: {ma_qualifies_for_veterans_personal_needs_allowance: false, has_income_trust: false, ma_ltc_gross_income: 2000, ma_ssi_gross_earned_income: 0}, expect: 1925}
  - {id: CO-3616-T2, as_of: "2026-11-01", month: "2026-11", title: "Unearned 1,200 and earnings 465: 1,125 + (465 - 65) x 0.5 = 1,325", parameters: {ma_personal_needs_allowance_institutional: 75}, given: {ma_qualifies_for_veterans_personal_needs_allowance: false, has_income_trust: false, ma_ltc_gross_income: 1665, ma_ssi_gross_earned_income: 465}, expect: 1325}
  - {id: CO-3616-T3, as_of: "2026-11-01", month: "2026-11", title: "Unearned 25 cannot meet the 75 allowance: 50 comes from earnings 400; (400 - 50 - 65) x 0.5 = 142.5", parameters: {ma_personal_needs_allowance_institutional: 75}, given: {ma_qualifies_for_veterans_personal_needs_allowance: false, has_income_trust: false, ma_ltc_gross_income: 425, ma_ssi_gross_earned_income: 400}, expect: 142.5}
  - {id: CO-3616-T4, as_of: "2026-11-01", month: "2026-11", title: "Income trust: the distribution less the allowance", parameters: {ma_personal_needs_allowance_institutional: 75}, given: {ma_qualifies_for_veterans_personal_needs_allowance: false, has_income_trust: true, ma_income_trust_distribution: 3185}, expect: 3110}
