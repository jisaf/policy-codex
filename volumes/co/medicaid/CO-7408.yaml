id: CO-7408
name: "Medicaid: household income under the premium tax credit methodology for the previous calendar year, as a share of the poverty level"
identifier: ma_premium_tax_credit_previous_year_income_pct_fpl
kind: derived
type: rate
scope: person
program: Medicaid
meaning: "This person's household income for the calendar year before the determination's, as the premium tax credit methodology computes it (26 CFR 1.36B-1(e)): the previous year's income (previous_year_annual_income) of each taxpayer in the person's premium tax credit family (ma_premium_tax_credit_family) and of each other member of the family who is required to file a return, with the sponsor income 8 U.S.C. 1631(a) deems to the person for the last month of that year counted for twelve months, as a fraction of the annual federal poverty guideline for the family's size in effect on the first day of the open enrollment period before that year (45 CFR 155.410(e): November 1 of the year before it). The figure § 8.100.4.C.5 tests for a month of the previous calendar year, as ma_premium_tax_credit_household_income_pct_fpl (CO-4561) is the figure for a month of the determination's year."
precision: "Coverage pass 6, C6-09 (2026-11-24). The family, the taxpayers and the filing requirement are the ones the case states for the determination (the case states one tax household); a retroactive month reaches back at most three months (§ 8.100.3.E.1), so only the previous calendar year is ever read. The guideline for 2025 is the 2024 figure (in force on November 1, 2024), added to federal_poverty_guideline_annual_table (CO-181) and its each-additional figure (CO-182) from 89 FR 2961 (S5061). Unknown where a counted member's previous-year income is not stated."
derived: ["/", ["+", [sum, ma_premium_tax_credit_family, [case, [[any, [not, [of, [P], expects_to_be_claimed_as_dependent]], [of, [P], is_required_to_file_tax_return]], [of, [P], previous_year_annual_income]], [else, 0]]], ["*", 12, [at, ma_sponsor_deemed_income, [months_before, [month_of_year, [det_month]], [det_month]]]]], [lookup_extended, [as_of, federal_poverty_guideline_annual_table, [first_day, [latest_month_of_year, federal_exchange_open_enrollment_start_month, [months_before, ["+", 12, [month_of_year, [det_month]]], [det_month]]]]], [count, ma_premium_tax_credit_family], [as_of, federal_poverty_guideline_annual_each_additional, [first_day, [latest_month_of_year, federal_exchange_open_enrollment_start_month, [months_before, ["+", 12, [month_of_year, [det_month]]], [det_month]]]]]]]
sources: [S3359, S3360, S3357, S3358, S5061, S2970]
implemented: engine
tags: [ma, magi, income]
open: [OQ-811]
nearest: [CO-4561]
rationale: "Coverage pass 6, C6-09 (docs/reviews/coverage6-medicaid-magi-chp.md, P2): ma_magi_household_income_pct_fpl (CO-504) applied the determination year's C.5 figure to a retroactive month of the previous calendar year. It now reads this item for such a month."
tests:
  - {id: CO-7408-T1, as_of: "2027-02-10", title: "C6-09: applied in February 2027 with retroactive coverage reaching November and December 2026; one filer whose 2026 income was 12,000; the 2026 figure for one in force on November 1, 2025 is 15,650 (the 2025 guideline): 12,000 / 15,650 = 76.7%", given: {ma_premium_tax_credit_family: [p1], expects_to_be_claimed_as_dependent: false, previous_year_annual_income: 12000, ma_sponsor_deemed_income: {"2026-12": 0}}, expect: 0.7667731629392971}
  - {id: CO-7408-T2, as_of: "2026-02-10", title: "C6-09: applied in February 2026, a retroactive month of 2025; one filer whose 2025 income was 18,000; the guideline in force on November 1, 2024 is the 2024 figure, 15,060 for one (S5061): 18,000 / 15,060 = 119.5%", given: {ma_premium_tax_credit_family: [p1], expects_to_be_claimed_as_dependent: false, previous_year_annual_income: 18000, ma_sponsor_deemed_income: {"2025-12": 0}}, expect: 1.1952191235059761}
  - {id: CO-7408-T3, as_of: "2026-02-10", title: "C6-09: the previous year's income not stated: unknown (decision 4)", given: {ma_premium_tax_credit_family: [p1], expects_to_be_claimed_as_dependent: false, expected_annual_income: 18000, ma_sponsor_deemed_income: {"2025-12": 0}}, expect: unknown}
