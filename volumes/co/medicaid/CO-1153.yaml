id: CO-1153
name: "Medicaid: Limited Family Planning household income as a percentage of FPL"
identifier: ma_family_planning_household_income_pct_fpl
kind: derived
type: rate
scope: person-month
program: Medicaid
meaning: The person's MAGI household income as a fraction of the monthly poverty guideline for a household one larger than the person's MAGI household - 10 CCR 2505-10 § 8.100.4.E.3 counts an individual applying for the limited Family Planning category "as a household of two in addition to any other household members".
precision: "\"A household of two in addition to any other household members\" is read as the applicant counting as two people, so the size is ma_magi_household_size (CO-501) plus one (OQ-204). Sizes above 8 add federal_poverty_guideline_annual_each_additional per member, as ma_magi_household_income_pct_fpl (CO-504) does; no rounding."
derived: ["/", ma_magi_household_income, ["/", [+, [lookup, federal_poverty_guideline_annual_table, [min, [+, ma_magi_household_size, 1], 8]], ["*", federal_poverty_guideline_annual_each_additional, [max, 0, ["-", [+, ma_magi_household_size, 1], 8]]]], 12]]
sources: [S614, S613]
open: [OQ-204]
implemented: engine
tags: [ma, magi, income, household]
nearest: [CO-504]
rationale: "ma_magi_household_income_pct_fpl (CO-504) uses the household size itself; § 8.100.4.E.3 gives the family planning applicant a larger household, so the same income is a smaller percentage. ma_family_planning_income_in_band (CO-1155) needs it."
tests:
  - {id: CO-1153-T1, as_of: "2026-10-01", month: "2026-10", title: "Household of 3 counted as 4: 5500 / (33000/12) = 2.0", given: {ma_magi_household_income: 5500, ma_magi_household_size: 3}, expect: 2.0}
  - {id: CO-1153-T2, as_of: "2026-10-01", month: "2026-10", title: "Household of 8 counted as 9: 61400 / ((55720 + 5680)/12) = 12", given: {ma_magi_household_income: 61400, ma_magi_household_size: 8}, expect: 12}
