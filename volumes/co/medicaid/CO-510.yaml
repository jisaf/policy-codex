id: CO-510
name: "Medicaid: is emergency Medicaid only"
identifier: ma_is_emergency_medicaid_only
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: Whether the person fails citizenship and immigration requirements but meets every other requirement of a categorical Medical Assistance program (ma_meets_requirements_other_than_status, CO-1150), and so is limited to emergency medical services (and reproductive health care) under 42 CFR 435.406(b), 42 U.S.C. 1396b(v) and 10 CCR 2505-10 §§ 8.100.3.F.1.k and 8.100.3.G.1.g.ix.2 (numbered viii.2 in the Cornell copy, D-39), rather than full Medical Assistance benefits.
precision: "Limited to residency, citizenship, and category, the requirements needed to state 42 CFR 435.406(b)'s 'otherwise meet the eligibility requirements of the State plan' condition; a person who also fails income (so ma_magi_category is 'none' for a reason other than citizenship) is not \"emergency Medicaid only\" under this item - batch 6's ma_magi_eligibility_status reports ineligible_income for that person instead. 8.100.3.G.1.g.viii.2's emergency-only benefit is itself further limited to a true emergency medical condition (including labor and delivery); this item states eligibility for the coverage category, not a claim-by-claim emergency determination. Edited in the fix round to add the [not, [=, ma_magi_category, \"none\"]] conjunct, per the phase-3 review's C-11 finding that an undocumented resident who meets no category or income standard at all was still reported emergency_only, though 435.406(b) grants the emergency-only benefit only to someone who 'otherwise' meets the plan's requirements."
derived: [all, [not, ma_meets_citizenship_requirement], ma_meets_requirements_other_than_status]
sources: [S173, S175, S600, S601, S603]
implemented: engine
tags: [ma, immigration, emergency]
open: [OQ-200]
rationale: "No existing item states emergency-only Medicaid eligibility. 42 CFR 435.406(b) (S173) and 8.100.3.G.1.g.viii.2 (S175) both carve out limited emergency coverage for a person who is otherwise eligible but fails citizenship; batch 6's ma_magi_eligibility_status needs a single fact to report emergency_only rather than ineligible for a person like the target household's p3 (an undocumented Colorado resident). Fix round: added the category conjunct (C-11) so a non-citizen who fits no category and is over every income standard is reported ineligible_income by CO-554, not emergency_only. Phase 7: the category conjunct is now ma_meets_requirements_other_than_status (CO-1150), which keeps the MAGI category route and adds the SSI-related and institutional long-term care routes § 8.100.3.F.1.k's 'one of the categorical Medical Assistance programs' covers; ma_emergency_medicaid_status (CO-1151) is the emergency determination built on it."
tests:
  - {id: CO-510-T1, as_of: "2026-10-01", month: "2026-10", given: {state_of_residence: "CO", citizenship_status: undocumented, lawful_presence_status: not_lawfully_present, date_of_birth: "1985-01-22", is_pregnant: false, ma_magi_category: adult}, expect: true}
  - {id: CO-510-T2, as_of: "2026-10-01", month: "2026-10", given: {state_of_residence: "CO", citizenship_status: citizen, lawful_presence_status: unknown, date_of_birth: "1985-01-22", is_pregnant: false, ma_magi_category: adult}, expect: false}
  - {id: CO-510-T3, as_of: "2026-10-01", month: "2026-10", given: {state_of_residence: "WY", citizenship_status: undocumented, lawful_presence_status: not_lawfully_present, date_of_birth: "1985-01-22", is_pregnant: false, ma_magi_category: adult}, expect: false}
  - {id: CO-510-T4, as_of: "2026-10-01", month: "2026-10", given: {state_of_residence: "CO", citizenship_status: undocumented, lawful_presence_status: not_lawfully_present, date_of_birth: "1985-01-22", is_pregnant: false, ma_magi_category: "none", is_blind: false, is_disabled_ssa: false, in_medical_institution: false}, expect: false}
  - {id: CO-510-T5, as_of: "2026-10-01", month: "2026-10", title: "Phase 7: undocumented blind resident with no MAGI category, within the SSI income and resource standards", given: {state_of_residence: "CO", citizenship_status: undocumented, lawful_presence_status: not_lawfully_present, date_of_birth: "1985-01-22", is_pregnant: false, ma_magi_category: "none", is_blind: true, ma_meets_ssi_income_standard: true, ma_meets_ssi_resource_standard: true}, expect: true}
