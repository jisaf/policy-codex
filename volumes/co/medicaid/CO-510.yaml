id: CO-510
name: "Medicaid: is emergency Medicaid only"
identifier: ma_is_emergency_medicaid_only
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: Whether the person fails citizenship and immigration requirements but meets every other requirement of a categorical Medical Assistance program (ma_meets_requirements_other_than_status, CO-1150), and so is limited to emergency medical services (and reproductive health care) under 42 CFR 435.406(b), 42 U.S.C. 1396b(v) and 10 CCR 2505-10 §§ 8.100.3.F.1.k and 8.100.3.G.1.g.ix.2 (numbered viii.2 in the Cornell copy, D-39), rather than full Medical Assistance benefits.
precision: "A person who fails the status test (CO-509) is emergency-only when every other requirement of a categorical program is met (ma_meets_requirements_other_than_status, CO-1150: residency, the institution for mental diseases requirement, and a MAGI category, the SSI-related standards, OAP SISC B, or institutional long-term care) and the person is not fully covered through Cover All Coloradans in a category § 8.100.3.G.1.g.ix.1.a-b lists (ma_is_covered_under_cover_all_coloradans, CO-1175). So an undocumented child in the Children's category is fully covered, not emergency-only, while an undocumented postpartum adult whose only category is Adult is emergency-only (phase 7 fix round, S-2). A person who meets no category, or is over every income standard, is not emergency-only; ma_magi_eligibility_status (CO-554) reports ineligible_income for that person. The emergency-only benefit is itself limited to a true emergency medical condition (including labor and delivery); this item states eligibility for the coverage category, and ma_emergency_medicaid_status (CO-1151) reads the month's emergency medical condition."
derived: [all, [not, ma_meets_citizenship_requirement], [not, ma_is_covered_under_cover_all_coloradans], ma_meets_requirements_other_than_status]
sources: [S173, S175, S600, S601, S603, S607]
implemented: engine
tags: [ma, immigration, emergency]
open: [OQ-200, OQ-214]
rationale: "No existing item states emergency-only Medicaid eligibility. 42 CFR 435.406(b) (S173) and 8.100.3.G.1.g.viii.2 (S175) both carve out limited emergency coverage for a person who is otherwise eligible but fails citizenship; batch 6's ma_magi_eligibility_status needs a single fact to report emergency_only rather than ineligible for a person like the target household's p3 (an undocumented Colorado resident). Fix round: added the category conjunct (C-11) so a non-citizen who fits no category and is over every income standard is reported ineligible_income by CO-554, not emergency_only. Phase 7: the category conjunct is now ma_meets_requirements_other_than_status (CO-1150), which keeps the MAGI category route and adds the SSI-related and institutional long-term care routes § 8.100.3.F.1.k's 'one of the categorical Medical Assistance programs' covers; ma_emergency_medicaid_status (CO-1151) is the emergency determination built on it."
