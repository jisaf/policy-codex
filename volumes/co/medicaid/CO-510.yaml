id: CO-510
name: "Medicaid: is emergency Medicaid only"
identifier: ma_is_emergency_medicaid_only
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: Whether the person meets every Medical Assistance requirement this batch models except citizenship, and so is limited to emergency medical services (and reproductive health care) under 42 CFR 435.406(b) and 10 CCR 2505-10 8.100.3.G.1.g.viii.2, rather than full Medical Assistance benefits.
precision: "Limited to residency, citizenship, and category, the requirements needed to state 42 CFR 435.406(b)'s 'otherwise meet the eligibility requirements of the State plan' condition; a person who also fails income (so ma_magi_category is 'none' for a reason other than citizenship) is not \"emergency Medicaid only\" under this item - batch 6's ma_magi_eligibility_status reports ineligible_income for that person instead. 8.100.3.G.1.g.viii.2's emergency-only benefit is itself further limited to a true emergency medical condition (including labor and delivery); this item states eligibility for the coverage category, not a claim-by-claim emergency determination. Edited in the fix round to add the [not, [=, ma_magi_category, \"none\"]] conjunct, per the phase-3 review's C-11 finding that an undocumented resident who meets no category or income standard at all was still reported emergency_only, though 435.406(b) grants the emergency-only benefit only to someone who 'otherwise' meets the plan's requirements."
derived: [all, ma_meets_residency, [not, ma_meets_citizenship_requirement], [not, [=, ma_magi_category, "none"]]]
sources: [S173, S175]
implemented: engine
tags: [ma, immigration, emergency]
rationale: "No existing item states emergency-only Medicaid eligibility. 42 CFR 435.406(b) (S173) and 8.100.3.G.1.g.viii.2 (S175) both carve out limited emergency coverage for a person who is otherwise eligible but fails citizenship; batch 6's ma_magi_eligibility_status needs a single fact to report emergency_only rather than ineligible for a person like the target household's p3 (an undocumented Colorado resident). Fix round: added the category conjunct (C-11) so a non-citizen who fits no category and is over every income standard is reported ineligible_income by CO-554, not emergency_only."
tests:
  - {id: CO-510-T1, as_of: "2026-10-01", month: "2026-10", given: {state_of_residence: "CO", citizenship_status: undocumented, lawful_presence_status: not_lawfully_present, date_of_birth: "1985-01-22", is_pregnant: false, ma_magi_category: adult}, expect: true}
  - {id: CO-510-T2, as_of: "2026-10-01", month: "2026-10", given: {state_of_residence: "CO", citizenship_status: citizen, lawful_presence_status: unknown, date_of_birth: "1985-01-22", is_pregnant: false, ma_magi_category: adult}, expect: false}
  - {id: CO-510-T3, as_of: "2026-10-01", month: "2026-10", given: {state_of_residence: "WY", citizenship_status: undocumented, lawful_presence_status: not_lawfully_present, date_of_birth: "1985-01-22", is_pregnant: false, ma_magi_category: adult}, expect: false}
  - {id: CO-510-T4, as_of: "2026-10-01", month: "2026-10", given: {state_of_residence: "CO", citizenship_status: undocumented, lawful_presence_status: not_lawfully_present, date_of_birth: "1985-01-22", is_pregnant: false, ma_magi_category: "none"}, expect: false}
