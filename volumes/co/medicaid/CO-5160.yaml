id: CO-5160
name: "Medicaid MAGI: a person's counted pay from employment"
identifier: ma_magi_wage_earnings
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The person's earnings of the month, other than a business's (ma_magi_self_employment_earnings, CO-5161), that Medicaid's MAGI counting table counts (ma_magi_earnings_treatment_table, CO-5106), each at its gross amount: the rows counted (wages, salaries, tips, compensation for services, 10 CCR 2505-10 8.100.4.C.1.a.i, a.v), counted because no rule excludes them, and Difficulty of Care payments (counted here; ma_excluded_difficulty_of_care_payments, CO-5214, subtracts them where 8.100.3.K.7 excludes them); and uniformed services special pay unless it is paid for service in a combat zone (combat_zone), which 26 U.S.C. 112 leaves out of gross income. A pay received once counts in the month received (42 CFR 435.603(e)(1); 8.100.4.C.1.d.i)."
precision: "Earned-income records, Medicaid and CHP+ track E1 (docs/reviews/records-earnings-medicaid.md): replaces wages_gross in ma_person_magi_income (CO-502). The rows are the table's; this item reads no kind by name. Pretax deductions stay the tax-return fact pretax_deductions (CO-080), which CO-502 subtracts."
derived: [sum_receipts, earnings, [all, [received_in, [month]], [any, [in, [lookup, ma_magi_earnings_treatment_table, [receipt, kind]], [counted, counted_no_rule_excludes, excluded_live_in_provider]], [all, ["=", [lookup, ma_magi_earnings_treatment_table, [receipt, kind]], excluded_in_combat_zone], [not, [receipt, combat_zone]]]]], [receipt, amount]]
sources: [S165, S166, S3754, S4340]
implemented: engine
tags: [ma, magi, income]
rationale: "Earned-income records, step E1 (Medicaid and CHP+): MAGI's pay from employment read from the earnings records through its counting table, so a part of a pay is never stated twice and no kind is counted by silence (design decisions D1, D4)."
nearest: [CO-5501, CO-5161]
tests:
  - {id: CO-5160-T1, month: "2026-10", as_of: "2026-10-01", given: {earnings: [{kind: wages, amount: 1800}, {kind: work_study, amount: 300}, {kind: decennial_census_employment, amount: 200}]}, title: "Wages 1,800 + work-study 300 + Census wages 200 (each counted by the MAGI table) = 2,300", expect: 2300}
  - {id: CO-5160-T2, month: "2026-10", as_of: "2026-10-01", given: {earnings: [{kind: wages, amount: 2000}, {kind: self_employment_receipts, amount: 900, net_for_tax: 600}, {kind: business_cost_operating, amount: 300}]}, title: "The business is not pay from employment (CO-5161 counts its net for tax): 2,000", expect: 2000}
  - {id: CO-5160-T3, month: "2026-10", as_of: "2026-10-01", given: {earnings: [{kind: wages, amount: 2000}, {kind: uniformed_services_special_pay, amount: 225, combat_zone: true}]}, title: "Hostile fire pay for a month served in a combat zone is not gross income (26 U.S.C. 112(a), (b), (c)(5)(B)): 2,000", expect: 2000}
  - {id: CO-5160-T4, month: "2026-10", as_of: "2026-10-01", given: {earnings: [{kind: wages, amount: 2000}, {kind: uniformed_services_special_pay, amount: 225}]}, title: "Special pay outside a combat zone is compensation for services (8.100.4.C.1.a.v): 2,000 + 225 = 2,225", expect: 2225}
  - {id: CO-5160-T5, month: "2026-10", as_of: "2026-10-01", given: {earnings: [{kind: wages, amount: 900, frequency: once, month: "2026-09"}, {kind: wages, amount: 1100}]}, title: "A pay of September is not counted in October: 1,100", expect: 1100}
  - {id: CO-5160-T6, month: "2026-10", as_of: "2026-10-01", given: {}, title: "Earnings not stated: cannot determine", expect: unknown}
  - {id: CO-5160-T7, month: "2026-10", as_of: "2026-10-01", given: {earnings: []}, title: "A stated empty list: no pay", expect: 0}
  - {id: CO-5160-T8, month: "2026-10", as_of: "2026-10-01", given: {earnings: [{kind: difficulty_of_care_payment, amount: 1800}, {kind: employer_vendor_payment, amount: 250}]}, title: "Difficulty of Care counted here (CO-5214 subtracts it where K.7 excludes it); the employer's vendor payment is not counted by the MAGI table: 1,800", expect: 1800}
