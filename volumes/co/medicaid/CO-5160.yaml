id: CO-5160
name: "Medicaid MAGI: a person's counted pay from employment"
identifier: ma_magi_wage_earnings
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The person's earnings of the month, other than a business's (ma_magi_self_employment_earnings, CO-5161), that Medicaid's MAGI counting table counts (ma_magi_earnings_treatment_table, CO-5106), each at its gross amount: the rows counted (wages, salaries, tips, compensation for services, 10 CCR 2505-10 8.100.4.C.1.a.i, a.v), counted because no rule excludes them, and Difficulty of Care payments (counted here; ma_excluded_difficulty_of_care_payments, CO-5214, subtracts them where 8.100.3.K.7 excludes them); uniformed services special pay unless it is paid for service in a combat zone (combat_zone), which 26 U.S.C. 112 leaves out of gross income; and pay in kind (8.100.3.K.3-4; C.1.a.v) unless it is meals or lodging furnished for the employer's convenience (employer_convenience_meals_or_lodging, 26 U.S.C. 119(a)). A pay the record states as combat zone compensation (combat_zone_compensation: for a month during any part of which a member of the Armed Forces served in a combat zone, all of an enlisted member's pay, or the part of an officer's up to the maximum enlisted amount stated as its own record, 26 U.S.C. 112(a)-(b)) is left out. Boarders' payments are counted net of their costs apart (ma_magi_boarder_earnings, CO-6450). A pay received once counts in the month received (42 CFR 435.603(e)(1); 8.100.4.C.1.d.i)."
precision: "Earned-income records, Medicaid and CHP+ track E1 (docs/reviews/records-earnings-medicaid.md): replaces wages_gross in ma_person_magi_income (CO-502). The rows are the table's; this item reads no kind by name. Pretax deductions stay the tax-return fact pretax_deductions (CO-080), which CO-502 subtracts. Coverage pass 4 (2026-11-23): pay in kind and an employer's vendor payment are counted (C4-04; before, the table did not count them); basic pay for a combat-zone month is left out as the record states it (C4-02, OQ-1123 settled; before, counted); boarders' payments moved to CO-6450, net of their costs (C4-03, OQ-1121 settled; before, counted here at their gross amount)."
derived: [sum_receipts, earnings, [all, [received_in, [month]], [not, [receipt, combat_zone_compensation]], [any, [in, [lookup, ma_magi_earnings_treatment_table, [receipt, kind]], [counted, counted_no_rule_excludes, excluded_live_in_provider]], [all, ["=", [lookup, ma_magi_earnings_treatment_table, [receipt, kind]], counted_unless_employer_convenience], [not, [receipt, employer_convenience_meals_or_lodging]]], [all, ["=", [lookup, ma_magi_earnings_treatment_table, [receipt, kind]], excluded_in_combat_zone], [not, [receipt, combat_zone]]]]], [receipt, amount]]
sources: [S165, S166, S3754, S4340, S4107, S4631, S4636]
implemented: engine
tags: [ma, magi, income]
rationale: "Earned-income records, step E1 (Medicaid and CHP+): MAGI's pay from employment read from the earnings records through its counting table, so a part of a pay is never stated twice and no kind is counted by silence (design decisions D1, D4)."
nearest: [CO-5501, CO-5161]
tests:
  - {id: CO-5160-T1, month: "2026-10", as_of: "2026-10-01", given: {earnings: [{kind: wages, amount: 1800}, {kind: work_study, amount: 300}, {kind: decennial_census_employment, amount: 200}]}, title: "Wages 1,800 + work-study 300 + Census wages 200 (each counted by the MAGI table) = 2,300", expect: 2300}
  - {id: CO-5160-T2, month: "2026-10", as_of: "2026-10-01", given: {earnings: [{kind: wages, amount: 2000}, {kind: self_employment_receipts, amount: 900, net_for_tax: 600}, {kind: business_cost_operating, amount: 300}]}, title: "The business is not pay from employment (CO-5161 counts its net for tax): 2,000", expect: 2000}
  - {id: CO-5160-T3, month: "2026-10", as_of: "2026-10-01", given: {earnings: [{kind: wages, amount: 2000}, {kind: uniformed_services_special_pay, amount: 225, combat_zone: true}]}, title: "Hostile fire pay for a month served in a combat zone is not gross income (26 U.S.C. 112(a), (b), (c)(5)(B)): 2,000", expect: 2000}
  - {"id": "CO-5160-T4", "month": "2026-10", "as_of": "2026-10-01", "given": {"earnings": [{"kind": "wages", "amount": 2000}, {"kind": "uniformed_services_special_pay", "amount": 225, "combat_zone": false}]}, "title": "Special pay outside a combat zone is compensation for services (8.100.4.C.1.a.v): 2,000 + 225 = 2,225", "expect": 2225}
  - {id: CO-5160-T5, month: "2026-10", as_of: "2026-10-01", given: {earnings: [{kind: wages, amount: 900, frequency: once, month: "2026-09"}, {kind: wages, amount: 1100}]}, title: "A pay of September is not counted in October: 1,100", expect: 1100}
  - {id: CO-5160-T6, month: "2026-10", as_of: "2026-10-01", given: {}, title: "Earnings not stated: cannot determine", expect: unknown}
  - {id: CO-5160-T7, month: "2026-10", as_of: "2026-10-01", given: {earnings: []}, title: "A stated empty list: no pay", expect: 0}
  - {id: CO-5160-T8, month: "2026-10", as_of: "2026-10-01", given: {earnings: [{kind: difficulty_of_care_payment, amount: 1800}, {kind: employer_vendor_payment, amount: 250}]}, title: "Coverage pass 4, C4-04: Difficulty of Care counted here (CO-5214 subtracts it where K.7 excludes it), and the employer's vendor payment is compensation for services (8.100.4.C.1.a.v; 26 U.S.C. 61(a)(1)): 1,800 + 250 = 2,050", expect: 2050}
  - {id: CO-5160-T9, month: "2026-11", as_of: "2026-11-10", given: {earnings: [{kind: wages, amount: 2800, combat_zone_compensation: true}, {kind: uniformed_services_special_pay, amount: 225, combat_zone: true}]}, title: "Coverage pass 4, C4-02 (B-COMBAT): an enlisted member who served in a combat zone in November: basic pay 2,800, combat zone compensation (26 U.S.C. 112(a), S4340), and hostile fire pay 225 for the combat zone: neither counted, 0", expect: 0}
  - {id: CO-5160-T10, month: "2026-11", as_of: "2026-11-10", given: {earnings: [{kind: wages, amount: 7000, combat_zone_compensation: true}, {kind: wages, amount: 2000}]}, title: "Coverage pass 4, C4-02: an officer's pay for a combat-zone month of 9,000, stated as 7,000 of combat zone compensation (112(b): up to the maximum enlisted amount) and 2,000 apart: 2,000", expect: 2000}
  - {id: CO-5160-T11, month: "2026-11", as_of: "2026-11-10", given: {earnings: [{kind: wages, amount: 1200}, {kind: in_kind_pay, amount: 800}]}, title: "Coverage pass 4, C4-04 (B-INKIND): cash wages 1,200 and a house worth 800 the employer provides in place of wages (8.100.3.K.3-4, S4107; 8.100.4.C.1.a.v): 1,200 + 800 = 2,000", expect: 2000}
  - {id: CO-5160-T12, month: "2026-11", as_of: "2026-11-10", given: {earnings: [{kind: wages, amount: 1200}, {kind: employer_vendor_payment, amount: 800}]}, title: "Coverage pass 4, C4-04 (B-VENDOR): wages 1,200 and 800 of rent the employer pays the landlord from the person's pay (26 U.S.C. 61(a)(1), S4631): 2,000", expect: 2000}
  - {id: CO-5160-T13, month: "2026-11", as_of: "2026-11-10", given: {earnings: [{kind: wages, amount: 1200}, {kind: in_kind_pay, amount: 800, employer_convenience_meals_or_lodging: true}]}, title: "Coverage pass 4, C4-04: lodging a ranch hand must accept on the ranch as a condition of employment, for the employer's convenience, is not gross income (26 U.S.C. 119(a)(2), S4636): 1,200", expect: 1200}
  - {id: CO-5160-T14, month: "2026-11", as_of: "2026-11-10", given: {earnings: [{kind: wages, amount: 1100}, {kind: boarder_payments, amount: 900, boarders: 2, provides: room_and_board}, {kind: business_cost_boarder_provision, amount: 250}]}, title: "Coverage pass 4, C4-03: boarders' payments are counted net of their costs by CO-6450, not here: 1,100", expect: 1100}
