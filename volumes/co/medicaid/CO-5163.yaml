id: CO-5163
name: "Medicaid: a person's pay from an employer, for verification"
identifier: ma_employer_pay_for_verification
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The person's pay of the month from an employer, the wages an electronic data source or the person's documents verify (10 CCR 2505-10 8.100.4.B, 8.100.5.B): the earnings records of the kinds paid by an employer for work as an employee (wages, uniformed services special pay, work-study, WIOA on-the-job training, summer youth employment, SCSEP, other subsidized employment, decennial Census employment, Difficulty of Care payments, an employer's health insurance subsidy), at their gross amounts. Pay in kind, an employer's payments to a third party, a business's receipts and boarders' payments are not wages."
precision: "Earned-income records, Medicaid and CHP+ track E1: replaces wages_gross in ma_requires_verification_of_earned_income (CO-1403) and, by its adopted-method link, chp_requires_verification_of_earned_income (CO-1642). It names the kinds that restate wages_gross and its parts, so the verification element asks for the same pay it asked for before; it is not a counting rule (what counts is each method's table). Field-effect sweep (docs/reviews/field-sweep-snap-cash-nonmagi.md), FS-MA-2: a record stated as a stream (no month and no date) is received only in the months from the month its job or business began through the month it ended (job_start_date, job_end_date; each absent: before, or through, the months the case covers; CO-5100), since earned income \"is countable as income in the month received\" (10 CCR 2505-10 8.100.5.F.4, S3001) and wages are counted \"when you receive them\" (20 CFR 416.1111(a), S4940); a pay stated with its month or date is placed by it, a final pay after the job ended included. Before, a stream was counted in every month whatever its job's dates. The clause is Adult Financial's and Colorado Works' (af_earned_pay, CO-5130; cw_earned_pay, CO-5140)."
derived: [sum_receipts, earnings, [all, [received_in, [month]], [any, [not, [unknown, [receipt, month]]], [all, [any, [unknown, [receipt, job_start_date]], ["<=", [month_of, [receipt, job_start_date]], [month]]], [any, [unknown, [receipt, job_end_date]], [">=", [month_of, [receipt, job_end_date]], [month]]]]], [in, [receipt, kind], [wages, uniformed_services_special_pay, work_study, wioa_on_the_job_training, summer_youth_employment, scsep_employment, subsidized_employment, decennial_census_employment, difficulty_of_care_payment, employer_health_insurance_subsidy]]], [receipt, amount]]
sources: [S861, S864, S869, S4940]
implemented: engine
tags: [verification, ma, income]
rationale: "Earned-income records, step E1 (Medicaid and CHP+): the verification of wages reads the earnings records; one item so Medicaid and CHP+ ask for the same pay."
nearest: [CO-1403, CO-5164]
tests:
  - {id: CO-5163-T1, month: "2026-10", as_of: "2026-10-01", given: {earnings: [{kind: wages, amount: 1500}, {kind: work_study, amount: 200}, {kind: in_kind_pay, amount: 300}, {kind: self_employment_receipts, amount: 800}]}, title: "Wages 1,500 + work-study 200; pay in kind and the business are not wages: 1,700", expect: 1700}
  - {id: CO-5163-T2, month: "2026-10", as_of: "2026-10-01", given: {earnings: [{kind: self_employment_receipts, amount: 800}]}, title: "Only a business: 0", expect: 0}
  # Field-effect sweep, non-MAGI Medicaid (docs/reviews/field-sweep-snap-cash-nonmagi.md); hand-computed from the text quoted in each title.
  - {id: CO-5163-T3, month: "2026-11", as_of: "2026-11-12", title: "FS-MA-2: wages of 1,500 a month from a job that ended 2026-10-15, and 900 from one that continues: 900", given: {earnings: [{kind: wages, amount: 1500, job_end_date: "2026-10-15"}, {kind: wages, amount: 900}]}, expect: 900}
