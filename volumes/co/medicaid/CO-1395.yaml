id: CO-1395
name: "Medicaid: requires verification of citizenship"
identifier: ma_requires_verification_of_citizenship
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether the person's declared citizenship must be verified for Medical Assistance: always at application for a person declaring citizenship, except SSI recipients, persons entitled to or enrolled in Medicare, Social Security disability recipients, children in Title IV-B foster care or receiving Title IV-E foster care or adoption assistance, and newborns deemed eligible through their mother's coverage; never again at a renewal (or a later application after a break in coverage) unless there is information indicating a change in citizenship."
precision: citizenship_attestation_is_questionable stands for information indicating a potential change in citizenship at renewal (435.956(a)(4)(ii)); 8.100.3.H.4.h's five-year-gap exception, when the eligibility site has not kept the documents, is not modeled (OQ-372).
derived: [all, claims_citizenship, [not, [any, receives_ssi, is_medicare_entitled_or_enrolled, receives_social_security_disability, is_in_title_iv_foster_care_or_adoption_assistance, mother_was_enrolled_in_medicaid_at_birth]], [not, [all, ma_determination_is_renewal, [not, citizenship_attestation_is_questionable]]]]
sources: [S844, S854, S849, S1052, S1053]
implemented: engine
tags: [verification, ma, immigration]
open: [OQ-372]
rationale: No existing item states this Medical Assistance verification requirement; the phase-9 chapter needs one item per element so the person's pending counts and status can be derived.
tests:
  - {id: CO-1395-T1, month: "2026-10", as_of: "2026-10-01", given: {citizenship_status: citizen, receives_ssi: false, is_medicare_entitled_or_enrolled: false, receives_social_security_disability: false, is_in_title_iv_foster_care_or_adoption_assistance: false, mother_was_enrolled_in_medicaid_at_birth: false, ma_determination_is_renewal: false}, expect: true}
  - {id: CO-1395-T2, month: "2026-10", as_of: "2026-10-01", given: {citizenship_status: citizen, receives_ssi: false, is_medicare_entitled_or_enrolled: true}, expect: false}
  - {id: CO-1395-T3, month: "2026-10", as_of: "2026-10-01", given: {citizenship_status: citizen, receives_ssi: false, is_medicare_entitled_or_enrolled: false, receives_social_security_disability: false, is_in_title_iv_foster_care_or_adoption_assistance: false, mother_was_enrolled_in_medicaid_at_birth: true}, expect: false}
  - {id: CO-1395-T4, month: "2026-10", as_of: "2026-10-01", given: {citizenship_status: lawful_permanent_resident}, expect: false}
