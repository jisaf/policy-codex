id: CO-1395
name: "Medicaid: requires verification of citizenship"
identifier: ma_requires_verification_of_citizenship
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether the person's declared citizenship must be verified for Medical Assistance: always at application for a person declaring citizenship, except SSI recipients, persons entitled to or enrolled in Medicare, Social Security disability recipients, children in Title IV-B foster care or receiving Title IV-E foster care or adoption assistance, and newborns deemed eligible through their mother's coverage; never again at a renewal (or a later application after a break in coverage) unless there is information indicating a change in citizenship."
precision: "citizenship_attestation_is_questionable stands for information indicating a potential change in citizenship at renewal (435.956(a)(4)(ii)); 8.100.3.H.4.h.ii's five-year-gap exception, when the eligibility site has not kept the documents, is ma_must_resubmit_citizenship_documentation (CO-2214; OQ-372, resolved). The Social Security disability exemption reads receives_ssdi (CO-1727). Coverage review F-23: § 8.100.3.H.1.b.vii also exempts \"Individuals receiving Medical Assistance during a period of presumptive eligibility\"; presumptive eligibility is decided from declarations (ma_hospital_presumptive_eligibility_category, CO-2439; CO-558, CO-559), and this item asks only about the full determination, so the exemption has no answer to change here."
derived: [all, ma_verification_is_applicable, is_us_citizen_or_national, [not, [any, receives_ssi, is_medicare_entitled_or_enrolled, receives_ssdi, ma_is_in_title_iv_foster_care_or_adoption_assistance, mother_was_enrolled_in_medicaid_at_birth]], [not, [all, ma_determination_is_renewal, [not, citizenship_attestation_is_questionable], [not, ma_must_resubmit_citizenship_documentation]]]]
sources: [S2103, S844, S854, S849, S1052, S1053]
implemented: engine
tags: [verification, ma, immigration]
rationale: "No existing item states this Medical Assistance verification requirement; the phase-9 chapter needs one item per element so the person's pending counts and status can be derived. History moved from the precision note (HCPF review S-14): Vocabulary fix round (R-5): the Social Security disability exemption reads receives_ssdi (CO-1727). Heavier-definitions audit H-13 (audit fix round 4): applies only to a person for whom coverage is requested (ma_verification_is_applicable, CO-3157); a member who only appears on the application owes no citizenship (and so identity, CO-1398, which follows it) document."
