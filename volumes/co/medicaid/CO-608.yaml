id: CO-608
name: "Medicaid: SSI-related countable resources"
identifier: ma_ssi_countable_resources
kind: derived
type: money
scope: person
program: Medicaid
meaning: This person's countable resources for SSI-related, OAP and Medicare Savings Program purposes - ssi_countable_resources_of_couple if the person has ma_ssi_household_size 2 (married and living together, not institutionalized), otherwise ssi_countable_resources_individual - compared against the resource standards of 10 CCR 2505-10 8.100.5.M.1.
derived: [case, [["=", ma_ssi_household_size, 2], ssi_countable_resources_of_couple], [else, ssi_countable_resources_individual]]
sources: [S1735]
implemented: engine
tags: [ma, non_magi, resources]
rationale: "No existing item selects between the individual and couple resource figures based on household size. ma_meets_ssi_resource_standard (CO-610) needs it. Dual-entry audit 2.6: reads the couple's resources through ssi_countable_resources_of_couple (CO-2861), so the figure is stated on one spouse."
tests:
  - {id: CO-608-T1, as_of: "2026-10-01", given: {ssi_countable_resources_individual: 1900, ssi_countable_resources_of_couple: 46000, resides_in_medical_institution: true}, others: {}, relationships: [], expect: 1900}
  - {id: CO-608-T2, as_of: "2026-10-01", given: {ssi_countable_resources_individual: 100, ssi_countable_resources_of_couple: 46000, resides_in_medical_institution: false}, others: {p2: {resides_in_medical_institution: false}}, relationships: [[spouse, p2]], expect: 46000}
