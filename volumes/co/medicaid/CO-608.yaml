id: CO-608
name: "Medicaid: SSI-related countable resources"
identifier: ma_ssi_countable_resources
kind: derived
type: money
scope: person
program: Medicaid
meaning: "This person's countable resources for SSI-related, OAP and Medicare Savings Program purposes, compared against the resource standards of 10 CCR 2505-10 8.100.5.M.1: the Medicaid countable resources (ma_ssi_countable_resources_individual) of the person and of a spouse living with the person (ma_ssi_couple_members, the group of ma_ssi_household_size), less the self-funded retirement accounts in the name of that spouse, which are exempt in determining the person's eligibility (§ 8.100.5.N.3); plus, for a child, the resources of ineligible parents deemed to the child (ma_ssi_parental_resources_deemed)."
precision: "A spouse in a medical institution is not in the couple (ma_excluded_from_ssi_household, CO-661), so the person's own figure is compared with the individual limit. The spouse's retirement accounts stay countable for a long-term care applicant whose spouse is a community spouse (§ 8.100.5.N.4), which ma_institutionalized_spouse_countable_resources (CO-647) carries; this item serves the SSI-related, OAP and MSP tests."
derived: ["+", ["-", [sum, ma_ssi_couple_members, [of, [P], ma_ssi_countable_resources_individual]], [sum, [filter, ma_ssi_couple_members, [otherwise, [rel, [spouse, holds_out_as_spouse_with], [P]], false]], [otherwise, [of, [P], retirement_accounts_value], 0]]], ma_ssi_parental_resources_deemed]
sources: [S1735, S3401, S3414]
implemented: engine
tags: [ma, non_magi, resources]
rationale: "No existing item selects between the individual and couple resource figures based on household size. ma_meets_ssi_resource_standard (CO-610) needs it. Dual-entry audit 2.6: reads the couple's resources through ssi_countable_resources_of_couple (CO-2861), so the figure is stated on one spouse. Coverage review NM-3: the couple's figure had counted the spouse's IRA, so an aged applicant with a younger spouse's $40,000 IRA failed both the SSI-related and QMB resource tests. NM-2, NM-4, NM-5: the person figures are Medicaid's own (CO-4623). NM-10: a parent's resources are deemed to a child (CO-4627)."
tests:
  - {id: CO-608-T1, as_of: "2026-10-01", title: "individual", given: {ma_ssi_countable_resources_individual: 1900, retirement_accounts_value: 0, ma_ssi_couple_members: [p1], ma_ssi_parental_resources_deemed: 0}, others: {}, relationships: [], expect: 1900}
  - {id: CO-608-T2, as_of: "2026-10-12", title: "NM-3 (X-IRA): the spouse's 40,000 IRA is exempt for the applicant", given: {ma_ssi_countable_resources_individual: 1000, retirement_accounts_value: 0, ma_ssi_couple_members: [p1, p2], ma_ssi_parental_resources_deemed: 0}, others: {p2: {ma_ssi_countable_resources_individual: 40500, retirement_accounts_value: 40000}}, relationships: [[spouse, p2]], expect: 1500}
  - {id: CO-608-T3, as_of: "2026-10-12", title: "the applicant's own IRA counts", given: {ma_ssi_countable_resources_individual: 41000, retirement_accounts_value: 40000, ma_ssi_couple_members: [p1, p2], ma_ssi_parental_resources_deemed: 0}, others: {p2: {ma_ssi_countable_resources_individual: 500, retirement_accounts_value: 0}}, relationships: [[spouse, p2]], expect: 41500}
  - {id: CO-608-T4, as_of: "2026-10-12", title: "NM-10: a child with parental resources deemed", given: {ma_ssi_countable_resources_individual: 0, retirement_accounts_value: 0, ma_ssi_couple_members: [p1], ma_ssi_parental_resources_deemed: 2500}, others: {}, relationships: [], expect: 2500}
