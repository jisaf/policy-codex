id: CO-608
name: "Medicaid: SSI-related countable resources"
identifier: ma_ssi_countable_resources
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "This person's countable resources for SSI-related, OAP and Medicare Savings Program purposes, compared against the resource standards of 10 CCR 2505-10 8.100.5.M.1: the Medicaid countable resources (ma_ssi_countable_resources_individual) of the person and of a spouse living with the person (ma_ssi_couple_members, the group of ma_ssi_household_size), less the self-funded retirement accounts in the name of that spouse, which are exempt in determining the person's eligibility (§ 8.100.5.N.3); plus, for a child, the resources of ineligible parents deemed to the child (ma_ssi_parental_resources_deemed). For an institutionalized spouse in the institution, the resources 42 U.S.C. 1396r-5(c)(2) attributes to that spouse: both spouses' resources less the community spouse resource allowance (ma_institutionalized_spouse_countable_resources, CO-647)."
precision: "A spouse admitted to a medical institution leaves the community spouse's couple from the month after admission (ma_excluded_from_ssi_household, CO-661), so the community spouse's own figure is compared with the individual limit. An institutionalized spouse in the institution (ma_is_institutionalized_spouse_in_institution, CO-5200) is tested on CO-647 against the individual limit, from the admission month: 1396r-5(c)(2) makes all the resources held by either spouse available to the institutionalized spouse to the extent they exceed the allowance, and 1396r-5(a)(1) makes the section supersede the SSI couple rule for that spouse's eligibility under every group, not only long-term care. The community spouse's retirement accounts count there (§ 8.100.5.N.4); for everyone else this item serves the SSI-related, OAP and MSP tests with § 8.100.5.N.3's exemption. Resource records, Medicaid track H1 (docs/reviews/records-holdings-medicaid.md): the spouse's self-funded retirement accounts left out (N.3) are what the spouse's own figure counted for them (ma_ssi_retirement_accounts_counted_in_month, CO-5326, at the determination month). The couple excludes one automobile (20 CFR 416.1218(b): \"In determining the resources of an individual (and spouse, if any)\", S4660; 8.100.5.M.2.c): each spouse's own figure excludes that spouse's automobile, so the smaller of the two (ma_ssi_excluded_automobile_equity_in_month, CO-5321) is added back. A joint holding of the spouses is stated on each spouse's list with each one's share, so the couple's figure counts it once (8.100.5.M.3.d). Coverage pass 4, non-MAGI N4-7 (docs/reviews/coverage4-medicaid-nonmagi.md): per month. Each month the determination evaluates (a retroactive month, the application month, the determination month and after) is judged on the holdings at that month's first moment (ma_ssi_countable_resources_in_month, CO-5322; 20 CFR 416.1207(a), S4501, the holdings record's own definition of its month) and on the couple as it stands in that month (ma_ssi_couple_members, CO-3626, now per month), as 10 CCR 2505-10 8.100.3.E.1 requires a retroactive month in which the person \"met all applicable eligibility requirements\" (OQ-952, resolved). Before, every month read the determination month's holdings. The figures read for a long-term care spouse in the institution (ma_institutionalized_spouse_countable_resources, CO-647) and for deeming parents (ma_ssi_parental_resources_deemed, CO-4627) are still taken at the determination month (the spousal snapshot and attribution of 8.100.7.L-O are made at the application and the determination). Coverage pass 4, non-MAGI N4-6: the couple excludes one automobile, a car the two own together counted once at its whole equity: the two spouses' own excluded automobiles (ma_ssi_excluded_automobile_equity_in_month, CO-5321) are added back less the couple's one, the larger of the two spouses' ma_ssi_couple_automobile_equity_in_month (CO-6733, a joint car at its whole equity), at least 0. For two different cars this is the smaller car, as before; for one joint car, nothing (it had added back the other spouse's half of the same car)."
derived: [case, [ma_is_institutionalized_spouse_in_institution, ma_institutionalized_spouse_countable_resources], [else, ["+", ["-", [sum, ma_ssi_couple_members, [of, [P], ma_ssi_countable_resources_in_month]], [sum, [filter, ma_ssi_couple_members, [otherwise, [rel, [spouse, holds_out_as_spouse_with], [P]], false]], [of, [P], ma_ssi_retirement_accounts_counted_in_month]]], [max, 0, ["-", ["+", ma_ssi_excluded_automobile_equity_in_month, [sum, [filter, ma_ssi_couple_members, [otherwise, [rel, [spouse, holds_out_as_spouse_with], [P]], false]], [of, [P], ma_ssi_excluded_automobile_equity_in_month]]], [max, ma_ssi_couple_automobile_equity_in_month, [sum, [filter, ma_ssi_couple_members, [otherwise, [rel, [spouse, holds_out_as_spouse_with], [P]], false]], [of, [P], ma_ssi_couple_automobile_equity_in_month]]]]], ma_ssi_parental_resources_deemed]]]
sources: [S1735, S3401, S3414, S373, S3615, S3750, S4660, S4501, S217]
implemented: engine
tags: [ma, non_magi, resources]
rationale: "No existing item selects between the individual and couple resource figures based on household size. ma_meets_ssi_resource_standard (CO-610) needs it. Dual-entry audit 2.6: reads the couple's resources through ssi_countable_resources_of_couple (CO-2861), so the figure is stated on one spouse. Coverage review NM-3: the couple's figure had counted the spouse's IRA, so an aged applicant with a younger spouse's $40,000 IRA failed both the SSI-related and QMB resource tests. NM-2, NM-4, NM-5: the person figures are Medicaid's own (CO-4623). NM-10: a parent's resources are deemed to a child (CO-4627). Coverage pass 3 C3-1 fix round: once the institutionalized spouse is counted alone from the admission month (CO-3626, 1396r-5(b)(1)), the resource side follows 1396r-5(c)(2) instead of the person's own figure, which the volume had already compared from the month after admission (a rich community spouse's resources went uncounted)."
tests:
  # Pattern sweep (P2): the person is stated not an institutionalized spouse in the institution (the test is about resources); ma_ltc_couple (CO-643) now needs a marital status.
  - {id: CO-608-T1, month: "2026-10", as_of: "2026-10-01", title: "individual", given: {ma_is_institutionalized_spouse_in_institution: false, ma_ssi_countable_resources_in_month: 1900, ma_ssi_couple_members: [p1], ma_ssi_parental_resources_deemed: 0, holdings: [{kind: bank_account}]}, others: {}, relationships: [], expect: 1900}
  - {id: CO-608-T2, month: "2026-10", as_of: "2026-10-12", title: "NM-3 (X-IRA): the spouse's 40,000 IRA is exempt for the applicant (the spouse's own figure, 500 + 0.8 x 40,000 = 32,500 by N.5.b, less the 32,000 it counted for the IRA): 1,000 + 32,500 - 32,000 = 1,500", given: {ma_ssi_countable_resources_in_month: 1000, ma_is_institutionalized_spouse_in_institution: false, ma_ssi_couple_members: [p1, p2], ma_ssi_parental_resources_deemed: 0, holdings: [{kind: bank_account}]}, others: {p2: {ma_ssi_countable_resources_in_month: 32500, holdings: [{kind: bank_account}, {kind: retirement_account, value: 40000}]}}, relationships: [[spouse, p2]], expect: 1500}
  - {id: CO-608-T3, month: "2026-10", as_of: "2026-10-12", title: "the applicant's own IRA counts, less 20% for the taxes not provided (N.5.b): (1,000 + 0.8 x 40,000) + 500 = 33,500", given: {ma_ssi_countable_resources_in_month: 33000, ma_is_institutionalized_spouse_in_institution: false, ma_ssi_couple_members: [p1, p2], ma_ssi_parental_resources_deemed: 0, holdings: [{kind: bank_account}, {kind: retirement_account, value: 40000}]}, others: {p2: {ma_ssi_countable_resources_in_month: 500, holdings: [{kind: bank_account}]}}, relationships: [[spouse, p2]], expect: 33500}
  - {id: CO-608-T4, month: "2026-10", as_of: "2026-10-12", title: "NM-10: a child with parental resources deemed", given: {ma_is_institutionalized_spouse_in_institution: false, ma_ssi_countable_resources_in_month: 0, ma_ssi_couple_members: [p1], ma_ssi_parental_resources_deemed: 2500, holdings: [{kind: bank_account}]}, others: {}, relationships: [], expect: 2500}
  - {id: CO-608-T90, month: "2026-11", as_of: "2026-11-20", title: "C3-1 fix round: an institutionalized spouse in the institution is tested on the 1396r-5(c)(2) figure", given: {ma_is_institutionalized_spouse_in_institution: true, ma_institutionalized_spouse_countable_resources: 37468}, relationships: [], expect: 37468}
  - {id: CO-608-T91, month: "2026-11", as_of: "2026-11-20", title: "N4-6 (JOINTCAR): one 10,000 car owned jointly, half on each list, and 500 in the bank each: 500 + 500 + max(0, 5,000 + 5,000 - max(10,000, 10,000)) = 1,000 (was 6,000)", given: {ma_is_institutionalized_spouse_in_institution: false, ma_ssi_couple_members: [p1, p2], ma_ssi_parental_resources_deemed: 0, holdings: [{kind: bank_account, value: 500}, {kind: vehicle, value: 10000, amount_owed: 0, share: 0.5, co_owners: spouse, holding_id: car1, used_for_transportation: true}]}, others: {p2: {holdings: [{kind: bank_account, value: 500}, {kind: vehicle, value: 10000, amount_owed: 0, share: 0.5, co_owners: spouse, holding_id: car1, used_for_transportation: true}]}}, relationships: [[spouse, p2]], expect: 1000}
  - {id: CO-608-T92, month: "2026-08", as_of: "2026-11-12", title: "N4-7 (RETRO-RES): a retroactive month is judged on its own first moment: August 5,000", given: {ma_is_institutionalized_spouse_in_institution: false, ma_ssi_couple_members: [p1], ma_ssi_parental_resources_deemed: 0, holdings: [{kind: bank_account, value: 5000, month: "2026-08"}, {kind: bank_account, value: 1000, month: "2026-09"}, {kind: bank_account, value: 1000, month: "2026-10"}, {kind: bank_account, value: 1000, month: "2026-11"}]}, expect: 5000}
