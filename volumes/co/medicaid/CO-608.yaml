id: CO-608
name: "Medicaid: SSI-related countable resources"
identifier: ma_ssi_countable_resources
kind: derived
type: money
scope: person
program: Medicaid
meaning: "This person's countable resources for SSI-related, OAP and Medicare Savings Program purposes, compared against the resource standards of 10 CCR 2505-10 8.100.5.M.1: the Medicaid countable resources (ma_ssi_countable_resources_individual) of the person and of a spouse living with the person (ma_ssi_couple_members, the group of ma_ssi_household_size), less the self-funded retirement accounts in the name of that spouse, which are exempt in determining the person's eligibility (§ 8.100.5.N.3); plus, for a child, the resources of ineligible parents deemed to the child (ma_ssi_parental_resources_deemed). For an institutionalized spouse in the institution, the resources 42 U.S.C. 1396r-5(c)(2) attributes to that spouse: both spouses' resources less the community spouse resource allowance (ma_institutionalized_spouse_countable_resources, CO-647)."
precision: "A spouse admitted to a medical institution leaves the community spouse's couple from the month after admission (ma_excluded_from_ssi_household, CO-661), so the community spouse's own figure is compared with the individual limit. An institutionalized spouse in the institution (ma_is_institutionalized_spouse_in_institution, CO-5200) is tested on CO-647 against the individual limit, from the admission month: 1396r-5(c)(2) makes all the resources held by either spouse available to the institutionalized spouse to the extent they exceed the allowance, and 1396r-5(a)(1) makes the section supersede the SSI couple rule for that spouse's eligibility under every group, not only long-term care. The community spouse's retirement accounts count there (§ 8.100.5.N.4); for everyone else this item serves the SSI-related, OAP and MSP tests with § 8.100.5.N.3's exemption."
derived: [case, [ma_is_institutionalized_spouse_in_institution, ma_institutionalized_spouse_countable_resources], [else, ["+", ["-", [sum, ma_ssi_couple_members, [of, [P], ma_ssi_countable_resources_individual]], [sum, [filter, ma_ssi_couple_members, [otherwise, [rel, [spouse, holds_out_as_spouse_with], [P]], false]], [otherwise, [of, [P], retirement_accounts_value], 0]]], ma_ssi_parental_resources_deemed]]]
sources: [S1735, S3401, S3414, S373, S3615, S3750]
implemented: engine
tags: [ma, non_magi, resources]
rationale: "No existing item selects between the individual and couple resource figures based on household size. ma_meets_ssi_resource_standard (CO-610) needs it. Dual-entry audit 2.6: reads the couple's resources through ssi_countable_resources_of_couple (CO-2861), so the figure is stated on one spouse. Coverage review NM-3: the couple's figure had counted the spouse's IRA, so an aged applicant with a younger spouse's $40,000 IRA failed both the SSI-related and QMB resource tests. NM-2, NM-4, NM-5: the person figures are Medicaid's own (CO-4623). NM-10: a parent's resources are deemed to a child (CO-4627). Coverage pass 3 C3-1 fix round: once the institutionalized spouse is counted alone from the admission month (CO-3626, 1396r-5(b)(1)), the resource side follows 1396r-5(c)(2) instead of the person's own figure, which the volume had already compared from the month after admission (a rich community spouse's resources went uncounted)."
tests:
  - {id: CO-608-T1, as_of: "2026-10-01", title: "individual", given: {ma_ssi_countable_resources_individual: 1900, retirement_accounts_value: 0, ma_ssi_couple_members: [p1], ma_ssi_parental_resources_deemed: 0, holdings: [{kind: bank_account}]}, others: {}, relationships: [], expect: 1900}
  - {id: CO-608-T2, as_of: "2026-10-12", title: "NM-3 (X-IRA): the spouse's 40,000 IRA is exempt for the applicant", given: {ma_ssi_countable_resources_individual: 1000, retirement_accounts_value: 0, ma_is_institutionalized_spouse_in_institution: false, ma_ssi_couple_members: [p1, p2], ma_ssi_parental_resources_deemed: 0, holdings: [{kind: bank_account}]}, others: {p2: {ma_ssi_countable_resources_individual: 40500, retirement_accounts_value: 40000, holdings: [{kind: bank_account}, {kind: retirement_account, value: 40000}]}}, relationships: [[spouse, p2]], expect: 1500}
  - {id: CO-608-T3, as_of: "2026-10-12", title: "the applicant's own IRA counts", given: {ma_ssi_countable_resources_individual: 41000, retirement_accounts_value: 40000, ma_is_institutionalized_spouse_in_institution: false, ma_ssi_couple_members: [p1, p2], ma_ssi_parental_resources_deemed: 0, holdings: [{kind: bank_account}, {kind: retirement_account, value: 40000}]}, others: {p2: {ma_ssi_countable_resources_individual: 500, retirement_accounts_value: 0, holdings: [{kind: bank_account}]}}, relationships: [[spouse, p2]], expect: 41500}
  - {id: CO-608-T4, as_of: "2026-10-12", title: "NM-10: a child with parental resources deemed", given: {ma_ssi_countable_resources_individual: 0, retirement_accounts_value: 0, ma_ssi_couple_members: [p1], ma_ssi_parental_resources_deemed: 2500, holdings: [{kind: bank_account}]}, others: {}, relationships: [], expect: 2500}
  - {id: CO-608-T90, as_of: "2026-11-20", title: "C3-1 fix round: an institutionalized spouse in the institution is tested on the 1396r-5(c)(2) figure", given: {ma_is_institutionalized_spouse_in_institution: true, ma_institutionalized_spouse_countable_resources: 37468}, relationships: [], expect: 37468}
