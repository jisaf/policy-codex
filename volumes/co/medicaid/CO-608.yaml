  # Resource records, Medicaid track H1: hand-computed from 20 CFR 416.1218(b) (S4660) and 8.100.5.M.1 (S301): one automobile for the couple.
  - {id: CO-608-T5, month: "2026-10", as_of: "2026-10-12", title: "a couple with one car each used for transportation (equity 6,000 and 4,000): each figure excludes its own car (500 and 700); the couple excludes only the larger: 500 + 700 + 4,000 = 5,200", given: {ma_is_institutionalized_spouse_in_institution: false, ma_ssi_couple_members: [p1, p2], ma_ssi_parental_resources_deemed: 0, holdings: [{kind: bank_account, value: 500}, {kind: vehicle, value: 6000, amount_owed: 0, used_for_transportation: true}]}, others: {p2: {holdings: [{kind: bank_account, value: 700}, {kind: vehicle, value: 4000, amount_owed: 0, used_for_transportation: true}]}}, relationships: [[spouse, p2]], expect: 5200}
