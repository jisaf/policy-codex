id: CO-5173
name: "Medicaid SSI method: a person's infrequent or irregular earned income"
identifier: ma_ssi_irregular_earned_receipts
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The person's earnings of the month that are received infrequently or irregularly (each record's irregular field: received only once in the calendar quarter from a single source and not in the month before or after, or not reasonably expected; 20 CFR 416.1112(c)(2)) and that the SSI method's earnings counting table counts (ma_ssi_earnings_treatment_table, CO-5107): pay counted as such or because no rule excludes it, and a business's receipts."
precision: "Earned-income records, Medicaid and CHP+ track E1: replaces infrequent_or_irregular_earned_income_received (CO-4010) in ma_ssi_excluded_infrequent_earned_income (CO-4883). A business's irregular receipts are read at their amount, as the scalar fact stated them. Pay the table holds exempt (Census wages) is not read: it is excluded before (c)(2) is applied (20 CFR 416.1112(a): the exclusions apply 'in the order listed ... to the rest of your income'). An irregular field not stated is false (the field's default: pay counts unless the exception is shown, design D3). Coverage pass 4, non-MAGI N4-5: a Difficulty of Care payment is counted here only when it is not foster care (exempt_if_foster_care); exempt pay is excluded before the $30 (416.1112(a)). Field-effect sweep (docs/reviews/field-sweep-snap-cash-nonmagi.md), FS-MA-2: a record stated as a stream (no month and no date) is received only in the months from the month its job or business began through the month it ended (job_start_date, job_end_date; each absent: before, or through, the months the case covers; CO-5100), since earned income \"is countable as income in the month received\" (10 CCR 2505-10 8.100.5.F.4, S3001) and wages are counted \"when you receive them\" (20 CFR 416.1111(a), S4940); a pay stated with its month or date is placed by it, a final pay after the job ended included. Before, a stream was counted in every month whatever its job's dates. The clause is Adult Financial's and Colorado Works' (af_earned_pay, CO-5130; cw_earned_pay, CO-5140)."
derived: [sum_receipts, earnings, [all, [received_in, [month]], [any, [not, [unknown, [receipt, month]]], [all, [any, [unknown, [receipt, job_start_date]], ["<=", [month_of, [receipt, job_start_date]], [month]]], [any, [unknown, [receipt, job_end_date]], [">=", [month_of, [receipt, job_end_date]], [month]]]]], [receipt, irregular], [any, [in, [lookup, ma_ssi_earnings_treatment_table, [receipt, kind]], [counted, counted_no_rule_excludes, exempt_dependent_child_six_months, counted_net_of_costs]], [all, ["=", [lookup, ma_ssi_earnings_treatment_table, [receipt, kind]], exempt_if_foster_care], [not, [receipt, foster_care]]]]], [receipt, amount]]
sources: [S3618, S3412, S4940]
implemented: engine
tags: [ma, non_magi, income]
rationale: "Earned-income records, step E1 (Medicaid and CHP+): the infrequent or irregular pay is a property of the pay (design 2.2, irregular), read from the records instead of a part of wages_gross stated a second time."
nearest: [CO-4883]
tests:
  - {id: CO-5173-T1, month: "2026-10", as_of: "2026-10-01", given: {earnings: [{kind: wages, amount: 1000}, {kind: wages, amount: 45, irregular: true, frequency: once, month: "2026-10"}]}, title: "A one-time odd-job pay of 45 in October beside regular wages: 45", expect: 45}
  - {id: CO-5173-T2, month: "2026-10", as_of: "2026-10-01", given: {earnings: [{kind: wages, amount: 1000}]}, title: "No irregular pay: 0", expect: 0}
  - {id: CO-5173-T3, month: "2026-11", as_of: "2026-11-01", given: {earnings: [{kind: difficulty_of_care_payment, amount: 50, irregular: true, frequency: once, month: "2026-11", foster_care: true}, {kind: difficulty_of_care_payment, amount: 20, irregular: true, frequency: once, month: "2026-11"}, {kind: work_study, amount: 30, irregular: true, frequency: once, month: "2026-11"}]}, title: "N4-5: only the Difficulty of Care payment that is not foster care is counted irregular pay; foster care and work-study are exempt: 20", expect: 20}
  # Field-effect sweep, non-MAGI Medicaid (docs/reviews/field-sweep-snap-cash-nonmagi.md); hand-computed from the text quoted in each title.
  - {id: CO-5173-T4, month: "2026-11", as_of: "2026-11-12", title: "FS-MA-2: an irregular 50 stated as a stream of a job that ended 2026-10-31: 0", given: {earnings: [{kind: wages, amount: 50, irregular: true, job_end_date: "2026-10-31"}]}, expect: 0}
