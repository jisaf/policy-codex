id: CO-504
name: "Medicaid: MAGI household income as a percentage of the poverty guideline"
identifier: ma_magi_household_income_pct_fpl
kind: derived
type: rate
scope: person-month
program: Medicaid
meaning: "This person's MAGI household income for the month, expressed as a decimal fraction of the monthly federal poverty guideline for ma_magi_household_size (1.00 = 100% of the guideline) - the figure 10 CCR 2505-10 8.100.4.G's covered-group income limits and the 8.100.4.D 5% disregard are stated against: the budget period figure of § 8.100.4.C.4 (ma_budget_period_household_income_pct_fpl, CO-4567: the month's income, or the annualized income of C.4.a where lower), or, where the person's household income under the premium tax credit methodology is below 100% of the poverty level and lower still, that figure (§ 8.100.4.C.5; 42 CFR 435.603(i))."
precision: "The monthly poverty guideline is the annual federal_poverty_guideline_annual_table figure (plus federal_poverty_guideline_annual_each_additional for a household size above 8) divided by 12 (CO-4567); no rounding is applied to the ratio itself. Coverage review F-04 and F-05: C.4.a's annualized figure (CO-4559) and C.5's premium tax credit figure (CO-4561, CO-4564) are reached only where the figure before each is higher, which is their order in the rule (each applies to an applicant \"found financially ineligible\", or who \"does not meet the financial eligibility requirements\", on the figure before it), since each MAGI standard is a ceiling. 42 CFR 435.603(i) determines financial eligibility \"in accordance with 26 CFR 1.36B-1(e)\": the C.5 figure replaces the MAGI one in every category's test, so a person below 100% meets every standard but the Parents and Caretaker Relatives 68%, and C.5's \"shall be found eligible\" is read through the Adults, Children's and Pregnant Women standards such a person meets. CHP+ reads this ratio too (10 CCR 2505-3 § 150.1 adopts § 8.100.4.C): a child the C.5 figure brings under the Children's standard is Medicaid eligible, not CHP+. Reasonable compatibility (ma_income_is_reasonably_compatible, CO-1402) compares the data source with this figure."
derived: [case, [[otherwise, ma_meets_premium_tax_credit_income_test, false], [min, ma_premium_tax_credit_household_income_pct_fpl, ma_budget_period_household_income_pct_fpl]], [else, ma_budget_period_household_income_pct_fpl]]
sources: [S55, S161, S3356, S3357, S3358]
implemented: engine
tags: [ma, magi, income]
open: [OQ-811]
rationale: "No existing item expresses MAGI household income as a percentage of the poverty guideline; every batch-6 covered-group income test (child 142%, parent/caretaker 68%, adult 133%, pregnant 195%, the current § 8.100.4.G figures) needs this single ratio rather than re-deriving the monthly guideline lookup in each rule. Parallel in shape to how snap_bbce_gross_income_limit (CO-339) looks up snap_poverty_guideline_table, but expresses a ratio rather than a dollar limit because Colorado's MAGI limits (8.100.4.G) are stated as percentages, not dollar tables."
tests:
  - {id: CO-504-T1, as_of: "2026-10-01", month: "2026-10", given: {ma_magi_household_income: 2750, ma_annualized_household_income: 2750, ma_magi_household_size: 4}, expect: 1.0}
  - {id: CO-504-T2, as_of: "2026-10-01", month: "2026-10", given: {ma_magi_household_income: 1375, ma_annualized_household_income: 1375, ma_magi_household_size: 4}, expect: 0.5}
  - {id: CO-504-T3, as_of: "2026-11-10", month: "2026-11", title: "Coverage review F-05 (RV-SE): 225.6% on the month, 75.2% annualized, 76.7% under the premium tax credit methodology - the lowest", given: {ma_budget_period_household_income_pct_fpl: 0.752, ma_meets_premium_tax_credit_income_test: true, ma_premium_tax_credit_household_income_pct_fpl: 0.767}, expect: 0.752}
  - {id: CO-504-T4, as_of: "2026-11-10", month: "2026-11", title: "Coverage review F-05: a filer at 150% on the month whose year is under the methodology at 90%", given: {ma_budget_period_household_income_pct_fpl: 1.5, ma_meets_premium_tax_credit_income_test: true, ma_premium_tax_credit_household_income_pct_fpl: 0.9}, expect: 0.9}
  - {id: CO-504-T5, as_of: "2026-11-10", month: "2026-11", title: "The premium tax credit figure not stated: the budget period figure", given: {ma_budget_period_household_income_pct_fpl: 1.5}, expect: 1.5}
