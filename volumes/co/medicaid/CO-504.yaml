id: CO-504
name: "Medicaid: MAGI household income as a percentage of the poverty guideline"
identifier: ma_magi_household_income_pct_fpl
kind: derived
type: rate
scope: person-month
program: Medicaid
meaning: "This person's MAGI household income for the month, expressed as a decimal fraction of the monthly federal poverty guideline for ma_magi_household_size (1.00 = 100% of the guideline) - the figure 10 CCR 2505-10 8.100.4.G's covered-group income limits and the 8.100.4.D 5% disregard are stated against: the budget period figure of § 8.100.4.C.4 (ma_budget_period_household_income_pct_fpl, CO-4567: the month's income, or the annualized income of C.4.a where lower), or, where the person's household income under the premium tax credit methodology is below 100% of the poverty level and lower still, that figure (§ 8.100.4.C.5; 42 CFR 435.603(i))."
precision: "The monthly poverty guideline is the annual federal_poverty_guideline_annual_table figure (plus federal_poverty_guideline_annual_each_additional for a household size above 8) divided by 12 (CO-4567); no rounding is applied to the ratio itself. Coverage review F-04 and F-05: C.4.a's annualized figure (CO-4559) and C.5's premium tax credit figure (CO-4561, CO-4564) are reached only where the figure before each is higher, which is their order in the rule (each applies to an applicant \"found financially ineligible\", or who \"does not meet the financial eligibility requirements\", on the figure before it), since each MAGI standard is a ceiling. 42 CFR 435.603(i) determines financial eligibility \"in accordance with 26 CFR 1.36B-1(e)\": the C.5 figure replaces the MAGI one in every category's test, so a person below 100% meets every standard but the Parents and Caretaker Relatives 68%, and C.5's \"shall be found eligible\" is read through the Adults, Children's and Pregnant Women standards such a person meets. CHP+ reads this ratio too (10 CCR 2505-3 § 150.1 adopts § 8.100.4.C): a child the C.5 figure brings under the Children's standard is Medicaid eligible, not CHP+. Reasonable compatibility (ma_income_is_reasonably_compatible, CO-1402) compares the data source with this figure. Coverage pass 5, C5-07 (2026-11-23): the C.5 test is read as it is: where it cannot be determined (the expected annual income of a counted member of the premium tax credit family not stated, CO-4556; or that family not known, CO-4560), this figure is unknown, so a person over every standard on the month's figure cannot be determined, since C.5 may make the person eligible; before, an unknown test was read as not met, a default no rule gives. A person eligible on the month's figure is determined without it, since every MAGI and CHP+ income test reads the month's figure first (ma_magi_monthly_household_income_pct_fpl, CO-6452). A person with no premium tax credit family (a non-filer who is not claimed) has the test false (CO-4564)."
derived: [case, [ma_meets_premium_tax_credit_income_test, [min, ma_premium_tax_credit_household_income_pct_fpl, ma_budget_period_household_income_pct_fpl]], [else, ma_budget_period_household_income_pct_fpl]]
sources: [S55, S161, S3356, S3357, S3358]
implemented: engine
tags: [ma, magi, income]
open: [OQ-811]
rationale: "No existing item expresses MAGI household income as a percentage of the poverty guideline; every batch-6 covered-group income test (child 142%, parent/caretaker 68%, adult 133%, pregnant 195%, the current § 8.100.4.G figures) needs this single ratio rather than re-deriving the monthly guideline lookup in each rule. Parallel in shape to how snap_bbce_gross_income_limit (CO-339) looks up snap_poverty_guideline_table, but expresses a ratio rather than a dollar limit because Colorado's MAGI limits (8.100.4.G) are stated as percentages, not dollar tables."
