  - {id: CO-1150-T2, as_of: "2026-10-01", month: "2026-10", title: "No MAGI category; aged person within the SSI income and resource standards", given: {is_colorado_resident: true, ma_meets_imd_requirement: true, ma_magi_category: "none", ma_is_aged_blind_or_disabled: true, ma_meets_ssi_income_standard: true, ma_meets_ssi_resource_standard: true}, expect: true}
