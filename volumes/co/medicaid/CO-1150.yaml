id: CO-1150
name: "Medicaid: meets every requirement other than citizenship or immigration status"
identifier: ma_meets_requirements_other_than_status
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether the person is a Colorado resident who meets the criteria of one of the categorical Medical Assistance programs apart from citizenship and immigration status - not excluded as a patient in an institution for mental diseases (§ 8.100.3.G.1.c), and a MAGI category (whose income test is part of the category), the SSI-related aged, blind or disabled income and resource standards, OAP SISC B (an aged, blind or disabled OAP recipient within the SSI resource standard, § 8.100.6.K.4), or institutional long-term care financial eligibility with the nursing facility level of care - the \"otherwise meets the eligibility requirements\" condition of 42 U.S.C. 1396b(v)(2)(B), 42 CFR 440.255(c)(2) and 10 CCR 2505-10 § 8.100.3.F.1.k."
precision: "The routes are the categorical programs this volume derives without reading citizenship: ma_magi_category (CO-551), the SSI-related financial tests (CO-603, CO-609, CO-610; ma_is_ssi_related_eligible itself reads citizenship and so cannot be used), OAP SISC B without its status term (OAP receipt, adult_financial_program_received, CO-2710, with CO-603 and CO-610; ma_oap_sisc_b_eligible, CO-1177, reads status), and the institutional long-term care tests (CO-640, CO-651). The non-MAGI routes require the person to be aged, blind or disabled, as §§ 8.100.3.F.1.b-d and f-g state, so a person who is not is settled without the long-term care facts. The Buy-In programs, HCBS waivers and PACE are not routes: their own items read status (CO-618, CO-620 through CO-1174; CO-653 and CO-654), and an HCBS or PACE applicant who fails status is emergency-eligible here only through the SSI-related or OAP route (OQ-200). 1396b(v)(2)(B) excludes the requirement of receiving SSI or a State supplementary payment, which the SSI-related route does not test."
derived: [all, ma_meets_residency_in_month, ma_meets_imd_requirement, [any, [not, ["=", ma_magi_category, "none"]], [all, ma_is_aged_blind_or_disabled, [any, [all, ma_meets_ssi_income_standard, ma_meets_ssi_resource_standard], [all, ["=", adult_financial_program_received, oap], ma_meets_ssi_resource_standard], [all, ma_is_institutionalized, meets_nursing_facility_level_of_care, ma_ltc_financially_eligible]]]]]
sources: [S600, S603, S604, S173, S659, S621, S660]
open: [OQ-200]
implemented: engine
tags: [ma, emergency, immigration]
rationale: "ma_is_emergency_medicaid_only (CO-510) tested only the MAGI category, so an undocumented aged or disabled resident who meets the SSI-related standards, or a nursing facility resident who meets the long-term care financial tests, was never emergency-eligible, although § 8.100.3.F.1.k gives emergency coverage to anyone who meets 'the criteria for one of the categorical Medical Assistance programs'. No existing item states that condition across chapters. CO-510 now reads it. Vocabulary fix round (governance read.cross_program): accepts_from lists the other programs' items this rule reads on purpose. The Medicaid rule names the other program's result (OAP receipt, CHP+ eligibility). Precision history (moved from precision, engineering follow-up pass task 5): CO-653 and CO-654 read status since the phase 7 fix round (B-3). Heavier-definitions audit H-3 (audit fix round; OQ-542 resolved): OAP receipt reads the Adult Financial case record (adult_financial_program_received, CO-2710), not this volume's own Adult Financial determination (af_category), as \"persons receiving OAP\" (§ 8.100.6.K.2-4) says."
