id: CO-1150
name: "Medicaid: meets every requirement other than citizenship or immigration status"
identifier: ma_meets_requirements_other_than_status
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: Whether the person is a Colorado resident who meets the criteria of one of the categorical Medical Assistance programs apart from citizenship and immigration status - a MAGI category (whose income test is part of the category), the SSI-related aged, blind or disabled income and resource standards, or institutional long-term care financial eligibility with the nursing facility level of care - the "otherwise meets the eligibility requirements" condition of 42 U.S.C. 1396b(v)(2)(B), 42 CFR 440.255(c)(2) and 10 CCR 2505-10 § 8.100.3.F.1.k.
precision: "The three routes are the categorical programs this volume derives without reading citizenship: ma_magi_category (CO-551), the SSI-related financial tests (CO-603, CO-609, CO-610; ma_is_ssi_related_eligible itself reads citizenship and so cannot be used), and the institutional long-term care tests (CO-640, CO-651). Both non-MAGI routes require the person to be aged, blind or disabled, as §§ 8.100.3.F.1.b and f-g state for the SSI-related and institutional groups, so a person who is not is settled without the long-term care facts. The Buy-In programs and HCBS are not routes here because their own items read citizenship. 1396b(v)(2)(B) excludes the requirement of receiving SSI or a State supplementary payment, which the SSI-related route does not test. See OQ-200."
derived: [all, ma_meets_residency, [any, [not, [=, ma_magi_category, "none"]], [all, ma_is_aged_blind_or_disabled, [any, [all, ma_meets_ssi_income_standard, ma_meets_ssi_resource_standard], [all, ma_is_institutionalized, meets_nursing_facility_level_of_care, ma_ltc_financially_eligible]]]]]
sources: [S600, S603, S604, S173]
open: [OQ-200]
implemented: engine
tags: [ma, emergency, immigration]
rationale: "ma_is_emergency_medicaid_only (CO-510) tested only the MAGI category, so an undocumented aged or disabled resident who meets the SSI-related standards, or a nursing facility resident who meets the long-term care financial tests, was never emergency-eligible, although § 8.100.3.F.1.k gives emergency coverage to anyone who meets 'the criteria for one of the categorical Medical Assistance programs'. No existing item states that condition across chapters. CO-510 now reads it."
tests:
  - {id: CO-1150-T1, as_of: "2026-10-01", month: "2026-10", title: "MAGI adult route", given: {ma_meets_residency: true, ma_magi_category: adult}, expect: true}
  - {id: CO-1150-T2, as_of: "2026-10-01", month: "2026-10", title: "No MAGI category; aged person within the SSI income and resource standards", given: {ma_meets_residency: true, ma_magi_category: "none", ma_is_aged_blind_or_disabled: true, ma_meets_ssi_income_standard: true, ma_meets_ssi_resource_standard: true}, expect: true}
  - {id: CO-1150-T3, as_of: "2026-10-01", month: "2026-10", title: "Over the SSI income standard but financially eligible for institutional care at nursing facility level of care", given: {ma_meets_residency: true, ma_magi_category: "none", ma_is_aged_blind_or_disabled: true, ma_meets_ssi_income_standard: false, ma_meets_ssi_resource_standard: true, ma_is_institutionalized: true, meets_nursing_facility_level_of_care: true, ma_ltc_financially_eligible: true}, expect: true}
  - {id: CO-1150-T4, as_of: "2026-10-01", month: "2026-10", title: "No route", given: {ma_meets_residency: true, ma_magi_category: "none", ma_is_aged_blind_or_disabled: false, ma_is_institutionalized: false}, expect: false}
  - {id: CO-1150-T5, as_of: "2026-10-01", month: "2026-10", title: "Not a Colorado resident", given: {ma_meets_residency: false, ma_magi_category: adult}, expect: false}
