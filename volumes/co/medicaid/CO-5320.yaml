nth]], [unknown, [receipt, disposed_date]], [any, [not, ["=", [receipt, replacement_property], real_property]], [">", [month], [months_after, ma_replacement_proceeds_exclusion_months, [month_of, [receipt, source_date]]]]]], ["*", [otherwise, [receipt, share], 1], [receipt, value]]], ma_ssi_retirement_accounts_counted_in_month, [sum_receipts, holdings, [all, ["=", [lookup, ma_ssi_holding_treatment_table, [receipt, kind]], counted_less_real_property_exclusions], [received_in, [month]], [unknown, [receipt, disposed_date]], [not, [otherwise, [receipt, income_producing], false]], [not, [otherwise, [receipt, produces_for_household_use], false]]], ["*", [otherwise, [receipt, share], 1], ["-", [receipt, value], [receipt, amount_owed]]]], [max, 0, ["-", [sum_receipts, holdings, [all, ["=", [lookup, ma_ssi_holding_treatment_table, [receipt, kind]], counted_less_one_transportation_vehicle], [received_in, [month]], [unknown, [receipt, disposed_date]]], [max, 0, ["*", [otherwise, [receipt, share], 1], ["-", [receipt, value], [receipt, amount_owed]]]]], ma_ssi_excluded_automobile_equity_in_month]], [case, [[">", [sum_receipts, holdings, [all, ["=", [lookup, ma_ssi_holding_treatment_table, [receipt, kind]], counted_cash_value_if_face_over_limit], [received_in, [month]], [unknown, [receipt, disposed_date]]], [receipt, face_value]], ssi_life_insurance_face_value_exclusion_limit], [sum_receipts, holdings, [all, ["=", [lookup, ma_ssi_holding_treatment_table, [receipt, kind]], counted_cash_value_if_face_over_limit], [received_in, [month]], [unknown, [receipt, disposed_date]]], ["*", [otherwise, [receipt, share], 1], [receipt, value]]]], [else, 0]], [max, 0, ["-", [sum_receipts, holdings, [all, ["=", [lookup, ma_ssi_holding_treatment_table, [receipt, kind]], burial_exclusion], [received_in, [month]], [unknown, [receipt, disposed_date]], [not, [receipt, irrevocable]]], [max, 0, ["-", ["*", [otherwise, [receipt, share], 1], [receipt, value]], [otherwise, [receipt, accrued_interest], 0]]]], [max, 0, ["-", ["-", ssi_burial_funds_exclusion, [sum_receipts, holdings, [all, ["=", [lookup, ma_ssi_holding_treatment_table, [receipt, kind]], burial_exclusion], [received_in, [month]], [unknown, [receipt, disposed_date]], [receipt, irrevocable]], ["*", [otherwise, [receipt, share], 1], [receipt, value]]]], [case, [[all, ["<=", [sum_receipts, holdings, [all, ["=", [lookup, ma_ssi_holding_treatment_table, [receipt, kind]], counted_cash_value_if_face_over_limit], [received_in, [month]], [unknown, [receipt, disposed_date]]], [receipt, face_value]], ssi_life_insurance_face_value_exclusion_limit], [">", [sum_receipts, holdings, [all, ["=", [lookup, ma_ssi_holding_treatment_table, [receipt, kind]], counted_cash_value_if_face_over_limit], [received_in, [month]], [unknown, [receipt, disposed_date]]], ["*", [otherwise, [receipt, share], 1], [receipt, value]]], 0]], [sum_receipts, holdings, [all, ["=", [lookup, ma_ssi_holding_treatment_table, [receipt, kind]], counted_cash_value_if_face_over_limit], [received_in, [month]], [unknown, [receipt, disposed_date]]], [receipt, face_value]]], [else, 0]]]]]]]
