id: CO-5320
name: "Medicaid SSI method: the person's holdings counted in the month"
identifier: ma_ssi_holdings_countable_in_month
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The person's own countable resources in the month by the SSI method's holdings counting table (ma_ssi_holding_treatment_table, CO-5303), before the rules that turn on Medicaid's own findings and on the home: each holding the person holds in the month (holdings, CO-5300; not transferred), at the person's share, as its row says. Rows counted (cash, accounts, securities, investment personal property, installment contracts and notes, and the rows counted because no rule excludes them): the value (10 CCR 2505-10 8.100.5.M.3.a-d, j; 20 CFR 416.1201(a)-(b)). The unspent part of a retroactive SSI or Social Security payment: counted from the tenth month after the month of receipt (8.100.5.F.6.c). A federal income tax refund held: counted from the thirteenth month after the month of receipt (26 U.S.C. 6409; ma_federal_tax_refund_resource_exclusion_months, CO-6500); a State or local refund: counted. A State or local earned income tax credit held: counted from the second month after the month of receipt (8.100.5.F.6.u). Proceeds held toward replacing real property: counted from the fourth month after the month of receipt (8.100.5.P.4; ma_replacement_proceeds_exclusion_months, CO-6501); toward personal property: counted. Loan proceeds and the payments 8.100.5.F.6 exempts (relocation, disaster and emergency assistance, Civil Liberties Act, Agent Orange, Radiation Exposure and Nazi persecution payments) held: not counted (F.6.a, f, k, r, s, v, x). Retirement accounts: ma_ssi_retirement_accounts_counted_in_month (CO-5326; 8.100.5.N.2). Real property other than the home and other than property producing income or goods for the person's support: its equity (M.3.g; 416.1201(c)(2)). Vehicles: their equity, each floored at 0, less the one automobile used for transportation (ma_ssi_excluded_automobile_equity_in_month, CO-5321; M.2.c, M.3.k; 416.1218(b)). Life insurance: the cash surrender value when the face value of the person's policies is over ssi_life_insurance_face_value_exclusion_limit (M.2.f; 416.1230(a)). Revocable burial funds and contracts, less the interest left in them, over ssi_burial_funds_exclusion reduced by the irrevocable burial funds and by the face value of life insurance whose cash surrender value is excluded (M.2.i-j). Rows excluded (ABLE accounts, burial spaces, household goods and personal effects) are not counted."
precision: "Resource records, Medicaid track H1 (docs/reviews/records-holdings-medicaid.md): the figure ssi_countable_resources_individual (CO-800) states for the determination month, read in any month, so the spousal assessment at the application month (ma_spousal_resources_at_snapshot, CO-888) reads the holdings valued in that month. A holding is read in the month it is valued in (P57: its month; one with no month has the same value in every month the case covers; the first moment of the month, 20 CFR 416.1207(a), S4501), and a holding with a disposed_date is a transfer, read by ma_uncompensated_transfers_in_lookback (CO-5325), not held. The person's share is the record's share (absent: the whole holding, CO-5300's declaration); an account is read at its value (liquid, 416.1201(b)), property at its equity, value less what is owed (416.1201(c)(2), S4500). Real property stated income-producing or producing goods for the household's use is counted above its exclusion by ma_countable_income_producing_property_value (CO-4621), not here; a real property record that does not state either is read as neither, and a revocable burial record that does not state accrued interest as having none (each the reading the scalar facts' readers gave, kept for the decision-4 round: docs/reviews/records-holdings-medicaid.md, requests). The face value test and the burial fund exclusion are the person's own (M.2.f, M.2.j: a separate $1,500 for each spouse). Medicaid's findings on real property (CO-4620), the income-producing excess (CO-4621), the home (CO-4622) and the value found available from a trust, an annuity or a life estate are added by ma_ssi_countable_resources_in_month (CO-5322). A couple excludes one automobile: the couple's figures add back the smaller spouse's (CO-608, CO-647, CO-801, CO-888)."
