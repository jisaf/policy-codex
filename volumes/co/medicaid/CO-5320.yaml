rationale: "Resource records, step H1 (Medicaid): the SSI method's figure is read from the holdings records by the one counting table (design 3.3, decision D6), in place of the scalar facts summed one at a time by ssi_countable_resources_individual (CO-800), so a kind of holding is counted or excluded by its row, the vehicle the rule excludes is found by P58 (decision D5), and the figure can be read in the month the spousal assessment needs (decision D8)."
tests:
  # Hand-computed from 8.100.5.M (S4504, S4505), F.6.c (S3404) and 20 CFR 416.1218(b) (S4660); figures in each title.
  - {id: CO-5320-T1, month: "2026-10", as_of: "2026-10-01", title: "1,200 in the bank, a 6,000 car used for transportation and a 3,000 car, a 1,000-face policy (cash value 400 excluded): 1,200 + (6,000 + 3,000 - 6,000) = 4,200", given: {holdings: [{kind: bank_account, value: 1200}, {kind: vehicle, value: 6000, amount_owed: 0, used_for_transportation: true}, {kind: vehicle, value: 3000, amount_owed: 0, used_for_transportation: false}, {kind: life_insurance, value: 400, face_value: 1000}]}, expect: 4200}
  - {id: CO-5320-T2, month: "2026-10", as_of: "2026-10-01", title: "two cars used for transportation, equity 6,000 and 9,000 - 7,000 = 2,000, and a car owing more than it is worth (4,000 - 5,000, floored at 0): 6,000 + 2,000 + 0 - 6,000 = 2,000", given: {holdings: [{kind: vehicle, value: 6000, amount_owed: 0, used_for_transportation: true}, {kind: vehicle, value: 9000, amount_owed: 7000, used_for_transportation: true}, {kind: vehicle, value: 4000, amount_owed: 5000, used_for_transportation: false}]}, expect: 2000}
  - {id: CO-5320-T3, month: "2026-10", as_of: "2026-10-01", title: "F.6.c: a retroactive payment of 3,000 received in June 2026 is left out through March 2027: 1,000", given: {holdings: [{kind: bank_account, value: 1000}, {kind: held_retroactive_ssa_benefit, value: 3000, source_date: "2026-06-15"}]}, expect: 1000}
  - {id: CO-5320-T4, month: "2026-10", as_of: "2026-10-01", title: "F.6.c: received in December 2025, the tenth month after is October 2026: 1,000 + 3,000 = 4,000", given: {holdings: [{kind: bank_account, value: 1000}, {kind: held_retroactive_ssa_benefit, value: 3000, source_date: "2025-12-15"}]}, expect: 4000}
  - {id: CO-5320-T5, month: "2026-10", as_of: "2026-10-01", title: "M.2.k, M.3.j, N.5.b: a 6,000 ABLE account left out, 2,500 of collectibles counted, a 4,000 IRA counted less 20%: 1,000 + 2,500 + 3,200 = 6,700", given: {holdings: [{kind: bank_account, value: 1000}, {kind: able_account, value: 6000}, {kind: investment_personal_property, value: 2500}, {kind: retirement_account, value: 4000}]}, expect: 6700}
  - {id: CO-5320-T6, month: "2026-10", as_of: "2026-10-01", title: "M.2.j: a 1,100 revocable burial trust with 100 of interest, 500 irrevocable, a 1,000-face policy with cash value 300: 1,000 - (1,500 - 500 - 1,000) = 1,000", given: {holdings: [{kind: life_insurance, value: 300, face_value: 1000}, {kind: burial_fund, value: 500, irrevocable: true}, {kind: burial_fund, value: 1100, irrevocable: false, accrued_interest: 100}]}, expect: 1000}
  - {id: CO-5320-T7, month: "2026-10", as_of: "2026-10-01", title: "a joint account with the spouse, half each: 0.5 x 3,000 = 1,500; September's balance is not October's; an account given away is not held: 1,500 + 700 = 2,200", given: {holdings: [{kind: bank_account, value: 3000, share: 0.5, co_owners: spouse, holding_id: h1}, {kind: bank_account, value: 500, month: "2026-09"}, {kind: bank_account, value: 700, month: "2026-10"}, {kind: securities, value: 9000, disposed_date: "2026-05-01", amount_owed: 0, compensation_received: 0, ma_transfer_exempt: false}]}, expect: 2200}
  - {id: CO-5320-T8, month: "2026-10", as_of: "2026-10-01", title: "a 5,000 lot counted at its equity (8,000 less 3,000 owed); a 7,000 rental is CO-4621's: 5,000", given: {holdings: [{kind: real_property, value: 8000, amount_owed: 3000}, {kind: real_property, value: 7000, amount_owed: 0, income_producing: true}]}, expect: 5000}
  - {id: CO-5320-T9, month: "2026-10", as_of: "2026-10-01", title: "a car whose use for transportation is not stated: cannot be determined (416.1218(b)(1))", given: {holdings: [{kind: vehicle, value: 4000, amount_owed: 0}]}, expect: unknown}
  - {id: CO-5320-T10, month: "2026-10", as_of: "2026-10-01", title: "M.2.f: face value 5,000 over 1,500: the 900 cash value counted", given: {holdings: [{kind: bank_account, value: 500}, {kind: life_insurance, value: 900, face_value: 5000}]}, expect: 1400}
  - {id: CO-5320-T11, month: "2026-10", as_of: "2026-10-01", title: "no holdings stated: cannot be determined", given: {}, expect: unknown}
