rationale: "Heavier-definitions audit L-2 (audit fix round 4), which asked for § 8.100.4.F's own text: F.1 and F.2.c open limited family planning presumptive eligibility at presumptive eligibility sites, beside the pregnant and child routes (CO-558, CO-559); only the hospital route (CO-2439) stated it."
