id: CO-3155
name: "Medicaid: is presumptively eligible, limited family planning"
identifier: ma_is_presumptively_eligible_limited_family_planning
kind: derived
type: yes/no
scope: person
program: Medicaid
meaning: "Whether an applicant who is not pregnant is presumptively eligible for limited family planning at a Medical Assistance presumptive eligibility site under 10 CCR 2505-10 § 8.100.4.F.1 and F.2.c: declared household income, the applicant counted as two, at or below ma_family_planning_income_upper_pct of the poverty guideline, and not within a full-coverage group's standard on the declared household (a child under 19 at or below ma_magi_income_standard_child, or an adult 19 through the 65th-birthday month at or below ma_income_limit_adult_pct; coverage review 3, C3-01, in place of the rule's 133% floor); a declaration of citizenship or lawful immigration status; not already receiving another Medical Assistance program (F.8); and no presumptive eligibility in the last 12 months (F.9). From October 1, 2026 a non-citizen outside the federal payment categories of 42 U.S.C. 1396b(v)(5) does not qualify. No age or gender restriction (F.1). Informational: no rule reads it and it is not a declared outcome."
precision: "Read as the limited family planning arm of ma_hospital_presumptive_eligibility_category (CO-2439) reads § 8.100.3.R.2.c, which states F.2.c's test in the same words: \"cannot be eligible for a Medicaid eligibility category that provides full coverage\" through F.8, since a presumptive determination is made from declarations before any full determination; the applicant counted as two through ma_declared_household_income_pct_fpl_limited_family_planning (CO-3152, OQ-590)."
statute_override: "Federal law overrides 10 CCR 2505-10 § 8.100.4.F.2.c's floor (\"greater than 133%\"), which the household of two moves to 180% of the one-person guideline: 42 CFR 435.214(c) sets the group's income standard as the one \"established in the State plan\", and Colorado State Plan page S59 (approved 12/18/2013, effective 01/01/2014) covers the 42 CFR 435.214 group at household income \"at or below a standard established by the state\", with no floor, so only the 260% ceiling is tested and F.2.c's \"cannot be eligible for a Medicaid eligibility category that provides full coverage\" is read from the declarations: a child at or below the Children's standard or an adult at or below the Adults standard, on the declared household (OQ-204, OQ-590)."
derived: [all, [not, is_pregnant], [any, is_us_citizen_or_national, claims_lawful_immigration_status], [not, is_enrolled_in_medical_assistance], [not, received_presumptive_eligibility_in_last_twelve_months], [not, [all, ma_alien_payment_restriction_applies, [not, ma_is_in_federal_payment_status_category]]], [not, [any, [all, ma_is_under_child_age_or_turns_nineteen_this_month, ["<=", declared_household_income_pct_fpl, ma_magi_income_standard_child]], [all, [">=", age, ma_magi_child_age_limit], ma_is_under_adult_upper_age_through_birthday_month, ["<=", declared_household_income_pct_fpl, ma_income_limit_adult_pct]]]], ["<=", ma_declared_household_income_pct_fpl_limited_family_planning, ma_family_planning_income_upper_pct]]
sources: [S1501, S2100, S1700, S678, S3681, S1722]
implemented: engine
tags: [ma, magi, income, immigration]
