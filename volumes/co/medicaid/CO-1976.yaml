id: CO-1976
name: "Medicaid: claimed dependent has the non-filer household"
identifier: ma_dependent_is_routed_to_non_filer_rules
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether a person who expects to be claimed as a tax dependent has the non-filer MAGI household instead of the claiming filer's under 42 CFR 435.603(f)(2)(i)-(iii) and 10 CCR 2505-10 § 8.100.4.E.1.c and E.5: (i) claimed by someone other than a spouse or parent (ma_is_dependent_claimed_by_non_parent); or, for a child under 19, (ii) claimed by one parent while living with both parents who do not expect to file jointly, (iii) claimed by a non-custodial parent, or (E.5) claimed by married parents filing jointly when one parent lives outside the household because of separation or pending divorce."
precision: "Living with both parents is two parents of the child in the child's lives_with (CO-1925); where lives_with is not stated, every parent in the case is read as living with the child, the volume's earlier convention. The claiming parent is the person the child has a tax_dependent edge to who is also the child's parent. Coverage pass 4, C4-08: per month, \"a child under 19\" read on the first day of the month evaluated (ma_age_on_first_day_of_month, CO-4978), as the household (CO-500) is. Coverage pass 4, C4-06 (2026-11-23): where the custodial parent (ma_custodial_parent, CO-1946) is not stated, it is read from the stated home, which is where the child spends most nights: a claiming parent the child lives with is custodial (also where no home is stated, the convention above); a claiming parent the child does not live with is non-custodial, so (iii) routes the child to the non-filer rules, whether or not another parent lives with the child (coverage pass 5, C5-11: 42 CFR 435.603(f)(2)(iii) reads the custodial parent from where the child lives, \"the parent with whom the child spends most nights\", and a parent the child does not live with is not that parent; before, a child living with neither parent, in a third home, was cannot determine, KIN-CLAIMED). Where no home is stated the volume's convention reads the claiming parent as living with the child, so no case is left undetermined by this reading. Before, an unstated custodial parent was read as the claiming parent, a default no rule gives, so a child living with her non-filer mother and claimed by her father in another home was placed in the father's household (H3)."
derived: [any, ma_is_dependent_claimed_by_non_parent, [all, ["<", ma_age_on_first_day_of_month, ma_magi_child_age_limit], [any, [all, [exists_related, [tax_dependent], [all, [rel, [child], [P]], [not, [of, [P], files_jointly_with_spouse]]]], ["=", [count, [filter, [persons], [all, [rel, [child], [P]], [otherwise, [in_group, [P], lives_with], true]]]], 2]], [exists_related, [tax_dependent], [all, [rel, [child], [P]], [otherwise, [not, ["=", [P], ma_custodial_parent]], [not, [otherwise, [in_group, [P], lives_with], true]]]]], [all, [exists_related, [tax_dependent], [all, [rel, [child], [P]], [of, [P], files_jointly_with_spouse]]], [exists_related, [child], [otherwise, [of, [P], ma_lives_apart_due_to_separation_or_pending_divorce], false]]]]]]
sources: [S162, S169, S1226, S1227]
implemented: engine
tags: [ma, magi, household]
rationale: "OQ-42: the household closure (CO-500) needs one test for every route from the claimed-dependent rule to the non-filer rules; CO-563 states only (i)."
tests:
  - {id: CO-1976-T1, month: "2026-10", as_of: "2026-10-01", given: {date_of_birth: "2012-05-01", expects_to_be_claimed_as_dependent: true, ma_custodial_parent: p2, lives_with: [p1, p2]}, title: "(iii) claimed by the non-custodial father", others: {p2: {files_jointly_with_spouse: false}, p3: {files_jointly_with_spouse: false}}, relationships: [[child, p2], [child, p3], [tax_dependent, p3]], expect: true}
  - {id: CO-1976-T2, month: "2026-10", as_of: "2026-10-01", given: {date_of_birth: "2012-05-01", expects_to_be_claimed_as_dependent: true, ma_custodial_parent: p2, lives_with: [p1, p2]}, title: "Claimed by the custodial mother, father not in the home", others: {p2: {files_jointly_with_spouse: false}, p3: {files_jointly_with_spouse: false}}, relationships: [[child, p2], [child, p3], [tax_dependent, p2]], expect: false}
  - {id: CO-1976-T3, month: "2026-10", as_of: "2026-10-01", given: {date_of_birth: "2012-05-01", expects_to_be_claimed_as_dependent: true, lives_with: [p1, p2, p3]}, title: "(ii) lives with both unmarried parents, claimed by one", others: {p2: {files_jointly_with_spouse: false}, p3: {files_jointly_with_spouse: false}}, relationships: [[child, p2], [child, p3], [tax_dependent, p2]], expect: true}
  - {id: CO-1976-T4, month: "2026-10", as_of: "2026-10-01", given: {date_of_birth: "2012-05-01", expects_to_be_claimed_as_dependent: true}, title: "E.5: married parents file jointly, father lives apart pending divorce", others: {p2: {files_jointly_with_spouse: true, ma_lives_apart_due_to_separation_or_pending_divorce: false}, p3: {files_jointly_with_spouse: true, ma_lives_apart_due_to_separation_or_pending_divorce: true}}, relationships: [[child, p2], [child, p3], [tax_dependent, p2]], expect: true}
  - {id: CO-1976-T5, month: "2026-10", as_of: "2026-10-01", given: {date_of_birth: "2012-05-01", expects_to_be_claimed_as_dependent: true}, title: "Married parents filing jointly, both at home", others: {p2: {files_jointly_with_spouse: true}, p3: {files_jointly_with_spouse: true}}, relationships: [[child, p2], [child, p3], [tax_dependent, p2]], expect: false}
  - {id: CO-1976-T6, month: "2026-10", as_of: "2026-10-01", given: {date_of_birth: "2012-05-01", expects_to_be_claimed_as_dependent: true}, title: "(i) claimed by a grandparent", others: {p2: {}}, relationships: [[grandchild, p2], [tax_dependent, p2]], expect: true}
  - {id: CO-1976-T7, month: "2026-11", as_of: "2026-11-10", given: {date_of_birth: "2016-05-01", lives_with: [p1, p2]}, title: "Coverage pass 4, C4-06 (H3): the child lives with her mother p2; her father p3, in another home, claims her; custody not stated: the father is the non-custodial parent (E.1.c.iii; 435.603(f)(2)(iii)), so the non-filer rules apply", others: {p2: {files_jointly_with_spouse: false}, p3: {files_jointly_with_spouse: false}}, relationships: [[child, p2], [child, p3], [tax_dependent, p3]], expect: true}
  - {id: CO-1976-T8, month: "2026-11", as_of: "2026-11-10", given: {date_of_birth: "2016-05-01", lives_with: [p1, p3]}, title: "Coverage pass 4, C4-06: the child lives with her father p3, who claims her; the mother lives elsewhere; custody not stated: the claiming parent is custodial, the filer's household", others: {p2: {files_jointly_with_spouse: false}, p3: {files_jointly_with_spouse: false}}, relationships: [[child, p2], [child, p3], [tax_dependent, p3]], expect: false}
  - {id: CO-1976-T9, month: "2026-11", as_of: "2026-11-10", given: {date_of_birth: "2016-05-01", lives_with: [p1]}, title: "Coverage pass 5, C5-11 (was C4-06's cannot determine): the child lives with neither parent (with an aunt who does not claim her); her father claims her; custody not stated: she spends her nights with neither parent, so the claiming father is not the custodial parent (435.603(f)(2)(iii)(B)): routed to the non-filer rules", others: {p2: {files_jointly_with_spouse: false}, p3: {files_jointly_with_spouse: false}}, relationships: [[child, p2], [child, p3], [tax_dependent, p3]], expect: true}
  - {id: CO-1976-T10, month: "2026-11", as_of: "2026-11-10", given: {date_of_birth: "2016-05-01", lives_with: [p1, p2], ma_custodial_parent: p3}, title: "Coverage pass 4, C4-06: a stated custodial parent wins over the home (a custody order naming the father, the claimer): not routed", others: {p2: {files_jointly_with_spouse: false}, p3: {files_jointly_with_spouse: false}}, relationships: [[child, p2], [child, p3], [tax_dependent, p3]], expect: false}
