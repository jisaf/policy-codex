id: CO-1976
name: "Medicaid: claimed dependent has the non-filer household"
identifier: ma_dependent_is_routed_to_non_filer_rules
kind: derived
type: yes/no
scope: person
program: Medicaid
meaning: "Whether a person who expects to be claimed as a tax dependent has the non-filer MAGI household instead of the claiming filer's under 42 CFR 435.603(f)(2)(i)-(iii) and 10 CCR 2505-10 § 8.100.4.E.1.c and E.5: (i) claimed by someone other than a spouse or parent (ma_is_dependent_claimed_by_non_parent); or, for a child under 19, (ii) claimed by one parent while living with both parents who do not expect to file jointly, (iii) claimed by a non-custodial parent, or (E.5) claimed by married parents filing jointly when one parent lives outside the household because of separation or pending divorce."
precision: Living with both parents is two parents of the child in the child's lives_with (CO-1925); where lives_with is not stated, every parent in the case is read as living with the child, the volume's earlier convention. The claiming parent is the person the child has a tax_dependent edge to who is also the child's parent.
derived: [any, ma_is_dependent_claimed_by_non_parent, [all, ["<", age, ma_magi_child_age_limit], [any, [all, [exists_related, [tax_dependent], [all, [rel, [child], [P]], [not, [of, [P], files_jointly_with_spouse]]]], ["=", [count, [filter, [persons], [all, [rel, [child], [P]], [otherwise, [in_group, [P], lives_with], true]]]], 2]], [exists_related, [tax_dependent], [all, [rel, [child], [P]], [otherwise, [not, ["=", [P], ma_custodial_parent]], false]]], [all, [exists_related, [tax_dependent], [all, [rel, [child], [P]], [of, [P], files_jointly_with_spouse]]], [exists_related, [child], [otherwise, [of, [P], ma_lives_apart_due_to_separation_or_pending_divorce], false]]]]]]
sources: [S162, S169, S1226, S1227]
implemented: engine
tags: [ma, magi, household]
rationale: "OQ-42: the household closure (CO-500) needs one test for every route from the claimed-dependent rule to the non-filer rules; CO-563 states only (i)."
tests:
  - {id: CO-1976-T1, as_of: "2026-10-01", given: {date_of_birth: "2012-05-01", expects_to_be_claimed_as_dependent: true, ma_custodial_parent: p2, lives_with: [p1, p2]}, title: "(iii) claimed by the non-custodial father", others: {p2: {files_jointly_with_spouse: false}, p3: {files_jointly_with_spouse: false}}, relationships: [[child, p2], [child, p3], [tax_dependent, p3]], expect: true}
  - {id: CO-1976-T2, as_of: "2026-10-01", given: {date_of_birth: "2012-05-01", expects_to_be_claimed_as_dependent: true, ma_custodial_parent: p2, lives_with: [p1, p2]}, title: "Claimed by the custodial mother, father not in the home", others: {p2: {files_jointly_with_spouse: false}, p3: {files_jointly_with_spouse: false}}, relationships: [[child, p2], [child, p3], [tax_dependent, p2]], expect: false}
  - {id: CO-1976-T3, as_of: "2026-10-01", given: {date_of_birth: "2012-05-01", expects_to_be_claimed_as_dependent: true, lives_with: [p1, p2, p3]}, title: "(ii) lives with both unmarried parents, claimed by one", others: {p2: {files_jointly_with_spouse: false}, p3: {files_jointly_with_spouse: false}}, relationships: [[child, p2], [child, p3], [tax_dependent, p2]], expect: true}
  - {id: CO-1976-T4, as_of: "2026-10-01", given: {date_of_birth: "2012-05-01", expects_to_be_claimed_as_dependent: true}, title: "E.5: married parents file jointly, father lives apart pending divorce", others: {p2: {files_jointly_with_spouse: true, ma_lives_apart_due_to_separation_or_pending_divorce: false}, p3: {files_jointly_with_spouse: true, ma_lives_apart_due_to_separation_or_pending_divorce: true}}, relationships: [[child, p2], [child, p3], [tax_dependent, p2]], expect: true}
  - {id: CO-1976-T5, as_of: "2026-10-01", given: {date_of_birth: "2012-05-01", expects_to_be_claimed_as_dependent: true}, title: "Married parents filing jointly, both at home", others: {p2: {files_jointly_with_spouse: true}, p3: {files_jointly_with_spouse: true}}, relationships: [[child, p2], [child, p3], [tax_dependent, p2]], expect: false}
  - {id: CO-1976-T6, as_of: "2026-10-01", given: {date_of_birth: "2012-05-01", expects_to_be_claimed_as_dependent: true}, title: "(i) claimed by a grandparent", others: {p2: {}}, relationships: [[grandchild, p2], [tax_dependent, p2]], expect: true}
