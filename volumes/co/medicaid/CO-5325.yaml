id: CO-5325
name: "Medicaid: the person's uncompensated transfers on or after the look-back date"
identifier: ma_uncompensated_transfers_in_lookback
kind: derived
type: money
scope: person
program: Medicaid
meaning: "The uncompensated value of the holdings the person gave away, sold or otherwise transferred on or after the look-back date (10 CCR 2505-10 8.100.7.F.1.d, F.2.a: the months \"prior to the month of application for long-term care services\", 60 months for a transfer on or after February 8, 2006, S365, S4671): for each holdings record (CO-5300) with a disposed_date in or after the month ma_transfer_lookback_months before the month of the person's Medical Assistance application (ma_application_date), its fair market value at the transfer, at the person's share and less what was owed against it, less the compensation received (F.1.b, F.1.f, F.2.c.i), never below 0; a transfer the eligibility site finds exempt (the record's ma_transfer_exempt, decision D9; 8.100.7.G.12.a-b, S4672) or that has been returned in whole (G.12.c) is left out."
precision: "Resource records, Medicaid track H1: one transfer, one record, read by every program's look-back (design 3.1); replaces uncompensated_transfer_value_in_lookback (CO-824) and transfer_was_exempt (CO-825), a total with no date and one finding for all of a person's transfers. The look-back is counted in months, as F.1.d defines the period (\"the number of months prior to the month of application\"): a transfer in the first month of the period is in it whatever its day. The application is the person's (ma_application_date); unknown when it is not stated, as the look-back date then is (decision 4). A transfer after the application is in the period too (F.2: \"on or after the look-back period\"; F.2.i). A transfer whose holding has been returned in whole (the record's returned_date) is left out: \"No period of ineligibility shall be assessed\" when \"All of the resources transferred without fair consideration have been returned to the individual\" (8.100.7.G.12.c, S4672); the scalar total could not say so. Counting the look-back in months rather than from the day 60 months before the application (F.2.a) is OQ-1244. The spouse's transfers are the spouse's records, added by ma_transfer_penalty_months (CO-649)."
derived: [at, [sum_receipts, holdings, [all, [not, [unknown, [receipt, disposed_date]]], [">=", [month_of, [receipt, disposed_date]], [months_before, ma_transfer_lookback_months, [month]]], [unknown, [receipt, returned_date]], [not, [receipt, ma_transfer_exempt]]], [max, 0, ["-", ["*", [otherwise, [receipt, share], 1], ["-", [receipt, value], [receipt, amount_owed]]], [receipt, compensation_received]]]], [month_of, ma_application_date]]
sources: [S365, S4671, S1742, S366, S4672]
open: [OQ-1244]
implemented: engine
tags: [ma, ltc, legal]
rationale: "Resource records, step H1 (Medicaid; design 3.1, decision D9): the look-back reads dated transfer records with their own findings, so two transfers, one exempt and one not, or one inside the look-back and one before it, are told apart, and the transfer SNAP and Adult Financial read is the same record."
tests:
  # Hand-computed from 8.100.7.F.1.d, f, F.2.a (S365, S4671): look-back from the application month (2026-10) back 60 months is 2021-10.
  - {id: CO-5325-T1, as_of: "2026-10-01", title: "45,000 given to a nephew in June 2025, nothing received: 45,000", given: {ma_application_date: "2026-10-01", holdings: [{kind: other_resource, value: 45000, amount_owed: 0, compensation_received: 0, disposed_date: "2025-06-15", ma_transfer_exempt: false}]}, expect: 45000}
  - {id: CO-5325-T2, as_of: "2026-10-01", title: "a house worth 120,000 owing 20,000 sold to a son for 30,000: 100,000 - 30,000 = 70,000", given: {ma_application_date: "2026-10-01", holdings: [{kind: real_property, value: 120000, amount_owed: 20000, compensation_received: 30000, disposed_date: "2024-03-01", ma_transfer_exempt: false}]}, expect: 70000}
  - {id: CO-5325-T3, as_of: "2026-10-01", title: "an exempt transfer of 45,000 and a non-exempt one of 5,000: 5,000", given: {ma_application_date: "2026-10-01", holdings: [{kind: other_resource, value: 45000, amount_owed: 0, compensation_received: 0, disposed_date: "2025-06-15", ma_transfer_exempt: true}, {kind: bank_account, value: 5000, compensation_received: 0, amount_owed: 0, disposed_date: "2026-01-10", ma_transfer_exempt: false}]}, expect: 5000}
  - {id: CO-5325-T4, as_of: "2026-10-01", title: "the look-back month: a transfer in October 2021 is in it, one in September 2021 is not: 2,000", given: {ma_application_date: "2026-10-20", holdings: [{kind: other_resource, value: 2000, amount_owed: 0, compensation_received: 0, disposed_date: "2021-10-01", ma_transfer_exempt: false}, {kind: other_resource, value: 7000, amount_owed: 0, compensation_received: 0, disposed_date: "2021-09-30", ma_transfer_exempt: false}]}, expect: 2000}
  - {id: CO-5325-T5, as_of: "2026-10-01", title: "sold at fair market value: 0", given: {ma_application_date: "2026-10-01", holdings: [{kind: vehicle, value: 8000, amount_owed: 0, compensation_received: 8000, disposed_date: "2026-02-01", ma_transfer_exempt: false}]}, expect: 0}
  - {id: CO-5325-T6, as_of: "2026-10-01", title: "holdings still held: no transfer", given: {ma_application_date: "2026-10-01", holdings: [{kind: bank_account, value: 1500}]}, expect: 0}
  - {id: CO-5325-T7, as_of: "2026-10-01", title: "no application date: the look-back date cannot be placed", given: {holdings: [{kind: other_resource, value: 45000, amount_owed: 0, compensation_received: 0, disposed_date: "2025-06-15", ma_transfer_exempt: false}]}, expect: unknown}
  - {id: CO-5325-T8, as_of: "2026-10-01", title: "G.12.c: a 45,000 gift returned in whole in March 2026: 0", given: {ma_application_date: "2026-10-01", holdings: [{kind: other_resource, value: 45000, amount_owed: 0, compensation_received: 0, disposed_date: "2025-06-15", returned_date: "2026-03-01", ma_transfer_exempt: false}]}, expect: 0}
