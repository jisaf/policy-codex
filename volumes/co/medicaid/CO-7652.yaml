id: CO-7652
name: "Medicaid: meets the citizenship requirement in a month before the qualified status held now"
identifier: ma_meets_citizenship_requirement_before_qualified_status
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "For a qualified non-citizen, in a month that ends before the person obtained the qualified status held now (qualified_status_date, CO-003), whether the person meets a status category of 10 CCR 2505-10 § 8.100.3.G.1.g in that month: not in a month before the month the person entered the United States (us_entry_date, CO-1726); for a lawful permanent resident who held a qualified status before adjusting (status_before_lpr_adjustment, CO-2700: refugee, asylee, deportation withheld, Cuban or Haitian entrant, or Iraqi or Afghan special immigrant), that earlier status, exempt from the five-year rule (iv.9-10, v; ma_is_five_year_bar_exempt CO-1172), within 42 U.S.C. 1396b(v)(5)(B) only as a Cuban or Haitian entrant; or a lawfully residing non-citizen (ma_is_lawfully_present, CO-507) who entered before August 22, 1996 (ii) or who is pregnant in the month or a child under ma_magi_child_age_limit on its first day (vii)."
precision: "Medicaid status by month (2026-11-24, docs/reviews/medicaid-status-by-month.md, MS-2). qualified_status_date is the date of a change the case states (OQ-1425's assumption reads the determination date's status in a retroactive month only where no such date is stated): in a month that ends before it, the person did not hold the qualified status the case states, so its arms (the five years, the exemptions that status opens, its 1396b(v)(5)(B) category) are not read for the month, and the month needs the status held then. The earlier status is stated for a lawful permanent resident (CO-2700), required where read (coverage pass 7, C7-09, 2026-11-24; decision 4 of 2026-11-23: before, read as none, admitted directly in no special class); for another qualified status the case states none, so only the arms that do not depend on it are read: a month before entry into the United States meets no category of G.1.g (each is a status held in the United States); lawful presence (ma_is_lawfully_present), which every qualified status includes and which the case does not date, is read as stated (OQ-1425), so the lawfully residing pregnant woman or child (vii, S1705) and the ii arm keep it. The October 2026 federal payment limit is read on the determination date, as CO-509 and CO-7551 read it (OQ-510). The month counts if the condition holds on any day of it (§ 8.100.4.G.1, S3351; § 8.100.5.C.1, S3900). Read only by ma_meets_citizenship_requirement_in_month (CO-7551) for such a month."
derived: [case, [["<", [month], [month_of, us_entry_date]], false], [else, [any, [all, ["=", immigration_status, lawful_permanent_resident], [in, status_before_lpr_adjustment, [refugee, asylee, deportation_withheld, cuban_haitian_entrant, iraqi_afghan_special_immigrant]], [any, [not, [as_of, ma_alien_payment_restriction_applies, [det_date]]], ["=", status_before_lpr_adjustment, cuban_haitian_entrant]]], [all, ma_is_lawfully_present, ["<", us_entry_date, qualified_non_citizen_entry_cutoff_date], [not, [as_of, ma_alien_payment_restriction_applies, [det_date]]]], [all, ma_is_lawfully_present, [any, ma_is_pregnant_in_month, ["<", ma_age_on_first_day_of_month, ma_magi_child_age_limit]]]]]]
sources: [S173, S176, S655, S656, S657, S1700, S1704, S1705, S3351, S3900, S1503]
open: [OQ-1425, OQ-510, OQ-1446]
implemented: engine
tags: [ma, magi, non_magi, immigration, age]
nearest: [CO-7551, CO-509]
rationale: "Medicaid status by month (MS-2): ma_meets_citizenship_requirement_in_month (CO-7551) read the stated status in every month, so a person granted asylum in September, or a refugee who became a lawful permanent resident in September, was judged in a retroactive August by the status of the determination date. The earlier status of a qualified non-citizen who is not a lawful permanent resident is not stated by any fact (OQ-1446)."
tests:
  # Lawful permanent resident since 2026-09-15, adjusted from refugee (admitted 2019-03-01), adult of 40, not pregnant; determined 2026-11-10 (after the October 2026 limit, OQ-510).
  # August 2026: a refugee in August (CO-2700): exempt from the five years, but not in 1396b(v)(5)(B): the qualified arm fails; entered 2019 (ii no); an adult not pregnant (vii no): false.
  - {id: CO-7652-T1, as_of: "2026-11-10", month: "2026-08", title: "MS-2: an LPR adjusted from refugee in September, August after the federal limit: a refugee adult then, not in 1396b(v)(5)(B)", given: {immigration_status: lawful_permanent_resident, status_before_lpr_adjustment: refugee, qualified_status_date: "2026-09-15", us_entry_date: "2019-03-01", date_of_birth: "1986-01-01", is_pregnant: false}, expect: false}
  # Determined 2026-09-25, before the limit: August a refugee, exempt from the five years: met.
  - {id: CO-7652-T2, as_of: "2026-09-25", month: "2026-07", title: "MS-2: the same determined before October 2026: a refugee, exempt, met", given: {immigration_status: lawful_permanent_resident, status_before_lpr_adjustment: refugee, qualified_status_date: "2026-09-15", us_entry_date: "2019-03-01", date_of_birth: "1986-01-01", is_pregnant: false}, expect: true}
  # Adjusted from Cuban or Haitian entrant: a 1396b(v)(5)(B) status either way: met after the limit.
  - {id: CO-7652-T3, as_of: "2026-11-10", month: "2026-08", title: "MS-2: an LPR adjusted from Cuban or Haitian entrant: a (v)(5)(B) status in August too", given: {immigration_status: lawful_permanent_resident, status_before_lpr_adjustment: cuban_haitian_entrant, qualified_status_date: "2026-09-15", us_entry_date: "2020-05-01", date_of_birth: "1986-01-01", is_pregnant: false}, expect: true}
  # Refugee admitted 2026-09-10 (entry the same day): August is before entry into the United States: false, whatever the age.
  - {id: CO-7652-T4, as_of: "2026-11-10", month: "2026-08", title: "MS-2: a refugee child admitted on 2026-09-10: no category before entering the United States", given: {immigration_status: refugee, qualified_status_date: "2026-09-10", us_entry_date: "2026-09-10", date_of_birth: "2015-01-01", is_pregnant: false}, expect: false}
  # Asylee granted 2026-09-20, in the United States since 2022-06-01, child of 11: lawfully present as stated (OQ-1425), under 19 on 2026-08-01: vii, met.
  - {id: CO-7652-T5, as_of: "2026-11-10", month: "2026-08", title: "MS-2: an asylee child granted asylum in September: a lawfully residing child in August (vii)", given: {immigration_status: asylee, qualified_status_date: "2026-09-20", us_entry_date: "2022-06-01", date_of_birth: "2015-01-01", is_pregnant: false}, expect: true}
  # The same asylee as an adult of 40, not pregnant: no earlier status stated, entered after 1996, not vii: false.
  - {id: CO-7652-T6, as_of: "2026-11-10", month: "2026-08", title: "MS-2: an asylee adult granted asylum in September: no category in August", given: {immigration_status: asylee, qualified_status_date: "2026-09-20", us_entry_date: "2022-06-01", date_of_birth: "1986-01-01", is_pregnant: false}, expect: false}
  - {id: CO-7652-T7, as_of: "2026-11-10", month: "2026-08", title: "MS-2: no entry date stated: cannot determine", given: {immigration_status: asylee, qualified_status_date: "2026-09-20", date_of_birth: "1986-01-01", is_pregnant: false}, expect: unknown}
