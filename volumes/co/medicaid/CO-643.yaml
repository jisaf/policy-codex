id: CO-643
name: "Medicaid: LTC couple with a community spouse"
identifier: ma_ltc_couple
kind: derived
type: yes/no
scope: person
program: Medicaid
meaning: Whether this institutionalized person has a community spouse - a spouse who is not in a medical institution or nursing facility - triggering the spousal impoverishment rules of 42 U.S.C. 1396r-5 and 10 CCR 2505-10 § 8.100.7.K, unless the person is in a Medicaid Buy-In program, to whom those rules do not apply (§ 8.7100.C.3; ma_is_in_buy_in_program, CO-2210; OQ-127, resolved).
precision: "Does not create a separate ma_community_spouse item naming the spouse as a value (see OQ-97); downstream items read the community spouse's income and shelter facts as supplied facts stated for the institutionalized spouse instead. Reads resides_in_medical_institution (CO-1742), not SNAP's majority-of-meals institution fact. Coverage pass 6, non-MAGI F6-7 (docs/reviews/coverage6-medicaid-nonmagi.md): a person who is married (is_married, CO-930) with no spouse who is a person of the case (marital_status married, CO-844) has a spouse the rules of § 8.100.7.K-T reach (K.2.d: the institutionalized spouse 'Is married to a spouse who is not in a medical institution or nursing facility'; L: 'All non-exempt resources owned by a married couple are counted, whether owned jointly or individually'), and without the spouse's facts (where the spouse lives, the spouse's resources and income) whether there is a community spouse cannot be determined (decision 4 of 2026-11-23: missing information is cannot determine unless the rule says otherwise). Before, only the spouse edge was read, so such a person was read as having no community spouse: no CSRA, no attribution of the couple's resources and no income allowance (MARRIED-SPOUSE-NOT-IN-CASE, CO-909). A case states the spouse as a person of the case to determine these rules. The SSI method is not changed: a spouse who is not a person of the case is not on the household roster (dwelling_id, CO-3350), so does not live with the person, and the person's own income and resources are tested alone, as § 8.100.5.H.1.a and § 8.100.7.C.2.b count only spouses living together."
derived: [all, ma_is_institutionalized_spouse, [case, [[otherwise, [exists_related, [spouse], true], false], [exists_related, [spouse], [not, [of, [P], resides_in_medical_institution]]]], [[not, is_married], false]], [not, ma_is_in_buy_in_program]]
sources: [S354, S1509, S1754]
implemented: engine
tags: [ma, ltc, legal]
rationale: "No existing item states the spousal-impoverishment gate. ma_csra (CO-646), ma_institutionalized_spouse_countable_resources (CO-647), ma_home_equity_disqualifies (CO-650) and ma_patient_payment (CO-658) need it. The target household's p1/p2 (p1 institutionalized, p2 a community spouse) is the worked example in the batch report. Reads ma_is_institutionalized_spouse (CO-644), not ma_is_institutionalized (CO-640), per the phase-4 review's C-2 finding: § 8.100.7.K.2.b-c reach an HCBS or PACE participant, which CO-640's medical-institution-only test does not. History moved from the precision note (HCPF review S-14): Vocabulary fix round (docs/reviews/vocabulary-reuse.md, R-8): reads resides_in_medical_institution (CO-1742), not SNAP's majority-of-meals institution fact."
