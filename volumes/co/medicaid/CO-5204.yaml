id: CO-5204
name: "Medicaid: home is a countable resource other than by a beneficiary deed"
identifier: ma_home_is_countable_resource_without_beneficiary_deed
kind: derived
type: yes/no
scope: person
program: Medicaid
meaning: "Whether the person's home (home_equity) is a countable resource for the aged, blind and disabled groups for a reason other than a beneficiary deed (10 CCR 2505-10 § 8.100.5.M.2.a): for a person in a long-term care institution, receiving HCBS or enrolled in PACE, when it has been transferred to a trust or other entity (xiii); or when the person no longer lives in it and neither a spouse nor a dependent relative lives there (ix), unless the person intends to return and, for a person living in an institution or facility, the intent is documented in writing (iv, v, vii, viii, xii)."
precision: "The arms of ma_home_is_countable_resource (CO-4622) other than xiv, as that item states them; read alone by ma_home_equity_counted_only_by_beneficiary_deed (CO-5205), which the Medicare Savings Program resources and parental deeming subtract. Resource records, Medicaid track H1 (docs/reviews/records-holdings-medicaid.md): read from the home holdings record (CO-5300) at the determination month: lives_in, intends_to_return, intent_in_writing, outside_colorado and held_in_trust_or_entity are its fields (each read as not so when the record does not state it, as the scalar facts were, except lives_in, which is read from residence_setting_type when not stated, as before; owns_and_lives_in_home, CO-3401, and lives_in_owned_home, CO-4610, the same fact stated twice, are its one field lives_in). A home whose equity the record does not state is read as no home here, as home_equity not stated was (only its countability turns on it; CO-650 reads the equity itself)."
