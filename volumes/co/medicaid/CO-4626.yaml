id: CO-4626
name: "Medicaid: parental income deemed to the child"
identifier: ma_ssi_parental_income_deemed
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The income of this child's ineligible parents deemed to the child as unearned income for the month (10 CCR 2505-10 § 8.100.5.H.3.a, H.3.b.iii; 42 U.S.C. 1382c(f)(2)(A); 20 CFR 416.1165(d)-(e)): the parents' income that remains to be deemed after the allocations and disregards and the Ineligible Parent(s) Allocation (ma_ssi_parental_income_to_be_deemed), divided among the blind or disabled children sharing it (ma_ssi_deeming_children) so that no child is deemed more than reduces its SSI benefit to zero (416.1165(e)(2)-(3)): a child whose share would reduce its benefit to zero (ma_ssi_deeming_share_zeroes_benefit) is deemed that limit (ma_ssi_deeming_benefit_zero_amount), and the rest is divided equally among the children whose limit is not reached; zero when no parent's income is deemed."
precision: "The child's own $20 general income exclusion then applies to the child's unearned income with the deemed income in it (416.1165(e)(1)): ma_ssi_household_unearned_income_counted (CO-2281) adds this amount. With no child's limit reached this is the equal division of (e)(2). A child whose limit is reached is deemed exactly its limit, so its countable income is the Federal Benefit Rate, and it is ineligible by (e)(3) ('makes that child ineligible (reduces the amount to zero)'): ma_ssi_income_test_status (CO-5516) reads CO-5904 for that. When every child's limit is reached, each is deemed its limit and what is left is deemed to no one ('We do not deem more income to an eligible child than ...'). The only eligible child is deemed all of it ((e)(1); see CO-5904). The division is figured from this child's parents' income and this child's group, each other child's limit and test read for that child, as the equal division was. A child of the parents who is not in the group (not blind or disabled) is given an equal part of what the children whose limit is reached leave, as it was given an equal part before; it is not an eligible child, and no SSI-related category reads its deemed income."
derived: [case, [["=", [count, ma_ssi_deeming_parents], 0], 0], [ma_ssi_deeming_share_zeroes_benefit, ma_ssi_deeming_benefit_zero_amount], [else, ["/", ["-", ma_ssi_parental_income_to_be_deemed, [sum, [filter, ma_ssi_deeming_children, [of, [P], ma_ssi_deeming_share_zeroes_benefit]], [of, [P], ma_ssi_deeming_benefit_zero_amount]]], [max, 1, [count, [filter, ma_ssi_deeming_children, [not, [of, [P], ma_ssi_deeming_share_zeroes_benefit]]]]]]]]
sources: [S3405, S3413, S3415, S4080]
implemented: engine
tags: [ma, non_magi, income, household]
rationale: "Coverage review NM-10 (OQ-83 resolved): the volume deemed no part of a parent's income to an applicant child. § 8.100.5.H.3.a's allocations reduce 'the gross income that is deemed available to the applicant/client', and H.3.a.ii's Ineligible Parent(s) Allocation is deducted after the standard disregards (H.3.b.iii), the sequence of 20 CFR 416.1165. Coverage review, 416.1165(e)(3) fill-up (2026-11-23): the division was equal whatever each child's own income, so a child whose own income used up part of its share kept that part and the other children were deemed less than (e)(3) gives them, an answer in their favour; the parents' remaining income is now ma_ssi_parental_income_to_be_deemed (CO-5903), and the fill-up composes filter, sum, min and of (CO-5904), with no new operator."
siblings: [{id: CO-5222, reason: "the Pickle copy reads CO-5221; every other term must stay the same"}]
tests:
