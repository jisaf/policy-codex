id: CO-6733
name: "Medicaid SSI method: the couple's largest automobile equity on a spouse's list"
identifier: ma_ssi_couple_automobile_equity_in_month
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The largest equity, for the couple, of a vehicle on the person's holdings list that is used for transportation and held at the first moment of the month: a vehicle the person owns with the spouse (co_owners spouse) at its whole equity, value less amount owed, since the couple owns all of it; any other at the person's share of its equity; none below 0. The automobile 20 CFR 416.1218(b) (S4660) excludes \"In determining the resources of an individual (and spouse, if any)\" is one automobile for the couple, so the couple's figures exclude the larger of the two spouses' values of this item, a car the two own together counted once at its whole equity."
precision: "Coverage pass 4, non-MAGI N4-6 (docs/reviews/coverage4-medicaid-nonmagi.md): a car the spouses own together is stated on each list with the same holding_id and each spouse's share (the joint-holding convention, holdings CO-5300), so each spouse's own excluded automobile (ma_ssi_excluded_automobile_equity_in_month, CO-5321) is half of it; the couple figures had added back the smaller of the two, which for one joint car is the other half of the same car, so half the car was counted. The couple figures now add back the two spouses' own exclusions less the couple's one (the larger of this item for the two), which is the smaller of two different cars, as before, and nothing for one joint car. A co_owners field not stated means no one else owns the holding (its absence meaning). Field-effect sweep (docs/reviews/field-sweep-snap-cash-nonmagi.md), FS-MA-4: a holding the person cannot get at (accessible false) because it is in probate, frozen by a creditor's lien or levy or a court order, or held under a trust's terms the person can neither revoke nor direct (inaccessible_reason) is not read: Medical Assistance deems available a resource the person \"is not legally restricted from using\" (10 CCR 2505-10 8.100.5.E.3.c, S4670), and \"If a property right cannot be liquidated, the property will not be considered a resource\" (20 CFR 416.1201(a)(1), S4500). One a co-owner refuses to release is still read, since a resource is not \"unavailable merely because the individual ... may need to initiate legal proceedings to access\" it (E.4, S4670). accessible defaults to true (CO-5300); the reason is required where it is false (decision 4). Before, accessible was not read."
derived: [largest, holdings, [all, ["=", [lookup, ma_ssi_holding_treatment_table, [receipt, kind]], counted_less_one_transportation_vehicle], [received_in, [month]], [any, [receipt, accessible], [not, [in, [receipt, inaccessible_reason], [probate, lien_or_court_order, trust_terms]]]], [any, [unknown, [receipt, disposed_date]], [">=", [month_of, [receipt, disposed_date]], [month]]], [receipt, used_for_transportation]], [max, 0, [case, [["=", [otherwise, [receipt, co_owners], none], spouse], ["-", [receipt, value], [receipt, amount_owed]]], [else, ["*", [otherwise, [receipt, share], 1], ["-", [receipt, value], [receipt, amount_owed]]]]]]]
sources: [S4660, S2215, S4501, S4670, S4500]
implemented: engine
tags: [ma, non_magi, resources]
rationale: "Coverage pass 4, non-MAGI N4-6: one automobile for a couple who own it together. Nearest: ma_ssi_excluded_automobile_equity_in_month (CO-5321), the person's own excluded automobile at the person's share, which each individual figure subtracts; this item values a joint car at the couple's whole equity, for the couple's one exclusion only."
nearest: [CO-5321]
tests:
  - {id: CO-6733-T1, as_of: "2026-11-20", month: "2026-11", title: "A 10,000 car owned with the spouse, half each: the couple's equity is the whole 10,000 (the person's own exclusion is 5,000)", given: {holdings: [{kind: vehicle, value: 10000, amount_owed: 0, share: 0.5, co_owners: spouse, holding_id: car1, used_for_transportation: true}]}, expect: 10000}
  - {id: CO-6733-T2, as_of: "2026-11-20", month: "2026-11", title: "The person's own 6,000 car (owing 1,000) and half of a 4,000 car owned with someone outside the case: max(6,000 - 1,000, 0.5 x 4,000) = 5,000", given: {holdings: [{kind: vehicle, value: 6000, amount_owed: 1000, used_for_transportation: true}, {kind: vehicle, value: 4000, amount_owed: 0, share: 0.5, co_owners: outside_case, holding_id: car2, used_for_transportation: true}]}, expect: 5000}
  - {id: CO-6733-T3, as_of: "2026-11-20", month: "2026-11", title: "A car not used for transportation is not the excluded one: 0", given: {holdings: [{kind: vehicle, value: 3000, amount_owed: 0, used_for_transportation: false}]}, expect: 0}
  # Field-effect sweep, non-MAGI Medicaid (docs/reviews/field-sweep-snap-cash-nonmagi.md); hand-computed from the text quoted in each title.
  - {id: CO-6733-T4, month: "2026-11", as_of: "2026-11-12", title: "FS-MA-4: the couple's largest accessible transportation vehicle: 6,000 in probate is not a resource, so 3,000", given: {holdings: [{kind: vehicle, value: 6000, amount_owed: 0, used_for_transportation: true, accessible: false, inaccessible_reason: probate}, {kind: vehicle, value: 3000, amount_owed: 0, used_for_transportation: true}]}, expect: 3000}
