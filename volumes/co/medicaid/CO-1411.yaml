id: CO-1411
name: "Medicaid: pending verification count"
identifier: ma_pending_verification_count
kind: derived
type: whole number
scope: person-month
program: Medicaid
role: outcome
meaning: "The number of verification elements Medical Assistance requires for this person that are not yet verified: the pending status elements plus SSN, earned and unearned income, resources, pregnancy, residency, age, household composition, and for a long-term care applicant the institutional stay, asset transfers, trust and annuity documents, and for an aged, blind or disabled person the quarterly verification of efforts to sell real property and the verification of joint ownership (OQ-379). Earned and unearned income are counted for every person whose income enters the determination (ma_income_verification_members, CO-3633), the person included, so a member's outstanding pay stubs keep a requesting child's verification pending."
derived: ["+", ma_pending_status_verification_count, [case, [ma_ssn_verification_is_pending, 1], [else, 0]], [sum, ma_income_verification_members, ["+", [case, [[of, [P], ma_earned_income_verification_is_pending], 1], [else, 0]], [case, [[of, [P], ma_unearned_income_verification_is_pending], 1], [else, 0]]]], [case, [ma_resources_verification_is_pending, 1], [else, 0]], [case, [ma_pregnancy_verification_is_pending, 1], [else, 0]], [case, [ma_residency_verification_is_pending, 1], [else, 0]], [case, [ma_age_verification_is_pending, 1], [else, 0]], [case, [ma_household_composition_verification_is_pending, 1], [else, 0]], [case, [ma_institutional_stay_verification_is_pending, 1], [else, 0]], [case, [ma_asset_transfers_verification_is_pending, 1], [else, 0]], [case, [ma_trust_verification_is_pending, 1], [else, 0]], [case, [ma_annuity_verification_is_pending, 1], [else, 0]], [case, [ma_sale_efforts_verification_is_pending, 1], [else, 0]], [case, [ma_joint_ownership_verification_is_pending, 1], [else, 0]]]
sources: [S851, S863, S866, S1086, S1087]
implemented: engine
tags: [verification, ma]
rationale: "No existing item counts a person's outstanding Medical Assistance verifications. Final verification V-3 (2026-11-22): the income elements of a non-requesting household member reached no status; they are now summed over ma_income_verification_members (CO-3633)."
tests:
  - {id: CO-1411-T1, month: "2026-10", as_of: "2026-10-01", given: {ma_income_verification_members: [p1], ma_sale_efforts_verification_is_pending: false, ma_joint_ownership_verification_is_pending: false, ma_ssn_verification_is_pending: false, ma_earned_income_verification_is_pending: false, ma_unearned_income_verification_is_pending: false, ma_resources_verification_is_pending: true, ma_pregnancy_verification_is_pending: false, ma_residency_verification_is_pending: false, ma_age_verification_is_pending: false, ma_household_composition_verification_is_pending: false, ma_institutional_stay_verification_is_pending: false, ma_asset_transfers_verification_is_pending: false, ma_trust_verification_is_pending: false, ma_annuity_verification_is_pending: false, ma_pending_status_verification_count: 1}, expect: 2}
  - {id: CO-1411-T2, month: "2026-10", as_of: "2026-10-01", given: {ma_income_verification_members: [p1], ma_sale_efforts_verification_is_pending: false, ma_joint_ownership_verification_is_pending: false, ma_ssn_verification_is_pending: false, ma_earned_income_verification_is_pending: false, ma_unearned_income_verification_is_pending: false, ma_resources_verification_is_pending: false, ma_pregnancy_verification_is_pending: false, ma_residency_verification_is_pending: false, ma_age_verification_is_pending: false, ma_household_composition_verification_is_pending: false, ma_institutional_stay_verification_is_pending: false, ma_asset_transfers_verification_is_pending: true, ma_trust_verification_is_pending: true, ma_annuity_verification_is_pending: false, ma_pending_status_verification_count: 0}, expect: 2}
  - {id: CO-1411-T3, month: "2026-10", as_of: "2026-10-01", given: {ma_income_verification_members: [p1], ma_sale_efforts_verification_is_pending: false, ma_joint_ownership_verification_is_pending: false, ma_ssn_verification_is_pending: false, ma_earned_income_verification_is_pending: false, ma_unearned_income_verification_is_pending: false, ma_resources_verification_is_pending: false, ma_pregnancy_verification_is_pending: false, ma_residency_verification_is_pending: false, ma_age_verification_is_pending: false, ma_household_composition_verification_is_pending: false, ma_institutional_stay_verification_is_pending: false, ma_asset_transfers_verification_is_pending: false, ma_trust_verification_is_pending: false, ma_annuity_verification_is_pending: false, ma_pending_status_verification_count: 0}, expect: 0}
