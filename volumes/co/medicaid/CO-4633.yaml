id: CO-4633
name: "Medicaid: Ineligible Child Allocation from the deemed parents' income"
identifier: ma_ssi_deeming_ineligible_child_allocation
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The Ineligible Child Allocation taken from the income of this child's ma_ssi_deeming_parents before it is deemed (10 CCR 2505-10 § 8.100.5.H.3.a.i, H.3.b.ii; 20 CFR 416.1165(b)): for each other child or stepchild of those parents who is an unemancipated child living with them, is not applying for or eligible for SSI, and is not one of the blind or disabled children sharing the deemed income (ma_ssi_deeming_children), one half of the SSI individual Federal Benefit Rate less that child's own gross income."
precision: "Duplicate-paths audit D-M4 (P1, fixed): the amount each child generates is the one statement ma_ssi_ineligible_child_allocation_generated (CO-6050; its own income, child support in full), which ma_ssi_ineligible_child_allocation (CO-2277) reads too for the children of an applicant's ineligible spouse; this item takes it for the children of an applicant child's ineligible parents. Both test the home the same way (H.3.a.i, 'each ineligible child in the home'): the persons who live with the child (lives_with, a temporary absence notwithstanding, 20 CFR 416.1167(a)), or, where the household states no homes, a child who does not reside in a medical institution. Before, this item tested only residence in a medical institution, so a child temporarily in hospital and still a member of the home (416.1167(a)(1)) generated no allocation. Zero when no parent's income is deemed."
derived: [case, [["=", [count, ma_ssi_deeming_parents], 0], 0], [else, [sum, [filter, [persons], [all, [otherwise, [has_relative_in, [child, stepchild], ma_ssi_deeming_parents], false], [not, [in_group, [P], ma_ssi_deeming_children]], [of, [P], ma_is_ssi_unemancipated_child], [not, [of, [P], ma_is_applying_for_or_eligible_for_ssi]], [otherwise, [in_group, [P], lives_with], [not, [otherwise, [of, [P], resides_in_medical_institution], false]]]]], [of, [P], ma_ssi_ineligible_child_allocation_generated]]]]
sources: [S308, S3405, S3413]
implemented: engine
tags: [ma, non_magi, income, household]
open: [OQ-1122]
rationale: "Coverage review NM-10: before a parent's income is deemed to an applicant child, H.3.b.ii and 416.1165(b) deduct an allocation for each ineligible child in the household; CO-2277 takes it only from an applicant's ineligible spouse. Receipt records, migration phase 2: the child's own income is its wages and self-employment earnings, the unearned receipts the SSI method counts (ma_ssi_unearned_receipts, CO-5511), its child support in full (ma_ssi_child_support_receipts, CO-5513) and its winnings (CO-5512). Before receipt records it was the sum of the scalar facts, which held the exempt receipts (General Assistance, foster care payments, educational grants) inside the other non-taxable income and left out Colorado Works and Adult Financial cash; the receipts read each kind by the SSI method's table, so the child's exempt receipts do not reduce the allocation (20 CFR 416.1163(b), which takes the child's income after the exclusions of 416.1161(a), S3413). Earned-income records, step E1 (Medicaid and CHP+): earned income is the earnings records the SSI method's counting table counts (ma_ssi_gross_earned_income, CO-5171), replacing wages_gross plus ma_self_employment_net_earnings."
tests:
  - {id: CO-4633-T1, month: "2026-10", as_of: "2026-10-12", given: {ma_ssi_deeming_parents: [p2], ma_ssi_deeming_children: [p1]}, title: "one ineligible sibling with no income: half the FBR", others: {p2: {}, p3: {ma_is_ssi_unemancipated_child: true, ma_is_applying_for_or_eligible_for_ssi: false, resides_in_medical_institution: false, wages_gross: 0, ma_self_employment_net_earnings: 0, receipts: [{kind: ssi}], earnings: [{kind: self_employment_receipts}]}}, relationships: [[parent, p2, p3]], expect: 497}
  - {id: CO-4633-T2, month: "2026-10", as_of: "2026-10-12", given: {ma_ssi_deeming_parents: [], ma_ssi_deeming_children: []}, title: "no deemed parent: none", others: {p2: {}}, relationships: [[child, p2]], expect: 0}
  - {id: CO-4633-T3, month: "2026-10", as_of: "2026-10-01", title: "Duplicate-paths audit D-M4 (household MA-child-allocation-institution): the disabled child d (8) applies; its sibling c lives in a medical institution (another home): no allocation, as for the applicant's spouse (CO-2277-T4)", given: {date_of_birth: "2018-01-01", dwelling_id: h1, receipts: [], earnings: [], ma_is_applying_for_or_eligible_for_ssi: true, is_emancipated_minor: false, resides_in_medical_institution: false, is_blind: false, meets_ssa_disability_criteria: true, ma_ssi_deeming_parents: [p2, p3], ma_ssi_deeming_children: [p1]}, others: {p2: {date_of_birth: "1955-01-01", dwelling_id: h1}, p3: {date_of_birth: "1960-01-01", dwelling_id: h1}, c: {date_of_birth: "2016-01-01", dwelling_id: h2, receipts: [], earnings: [], ma_is_applying_for_or_eligible_for_ssi: false, is_emancipated_minor: false, resides_in_medical_institution: true}}, relationships: [[spouse, p2, p3], [parent, p2, c], [parent, p3, c], [parent, p2, p1], [parent, p3, p1]], expect: 0}
