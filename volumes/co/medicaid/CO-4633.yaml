id: CO-4633
name: "Medicaid: Ineligible Child Allocation from the deemed parents' income"
identifier: ma_ssi_deeming_ineligible_child_allocation
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The Ineligible Child Allocation taken from the income of this child's ma_ssi_deeming_parents before it is deemed (10 CCR 2505-10 § 8.100.5.H.3.a.i, H.3.b.ii; 20 CFR 416.1165(b)): for each other child or stepchild of those parents who is an unemancipated child living with them, is not applying for or eligible for SSI, and is not one of the blind or disabled children sharing the deemed income (ma_ssi_deeming_children), one half of the SSI individual Federal Benefit Rate less that child's own gross income."
precision: The child's own income is its earned income and the unearned income the SSI method counts, with child support in full, as in ma_ssi_ineligible_child_allocation (CO-2277), which takes the allocation for the children of an applicant's ineligible spouse; this item takes it for the children of an applicant child's ineligible parents. Zero when no parent's income is deemed.
derived: [case, [["=", [count, ma_ssi_deeming_parents], 0], 0], [else, [sum, [filter, [persons], [all, [otherwise, [has_relative_in, [child, stepchild], ma_ssi_deeming_parents], false], [not, [in_group, [P], ma_ssi_deeming_children]], [of, [P], ma_is_ssi_unemancipated_child], [not, [of, [P], ma_is_applying_for_or_eligible_for_ssi]], [not, [otherwise, [of, [P], resides_in_medical_institution], false]]]], [max, 0, ["-", ["*", ma_ssi_ineligible_child_allocation_rate, ssi_federal_benefit_rate_individual], ["+", [of, [P], wages_gross], [of, [P], ma_self_employment_net_earnings], [of, [P], ma_ssi_unearned_receipts], [of, [P], ma_ssi_child_support_receipts], [of, [P], ma_ssi_gambling_receipts]]]]]]]
sources: [S308, S3405, S3413]
implemented: engine
tags: [ma, non_magi, income, household]
rationale: "Coverage review NM-10: before a parent's income is deemed to an applicant child, H.3.b.ii and 416.1165(b) deduct an allocation for each ineligible child in the household; CO-2277 takes it only from an applicant's ineligible spouse. Receipt records, migration phase 2: the child's own income is its wages and self-employment earnings, the unearned receipts the SSI method counts (ma_ssi_unearned_receipts, CO-5511), its child support in full (ma_ssi_child_support_receipts, CO-5513) and its winnings (CO-5512). Before receipt records it was the sum of the scalar facts, which held the exempt receipts (General Assistance, foster care payments, educational grants) inside the other non-taxable income and left out Colorado Works and Adult Financial cash; the receipts read each kind by the SSI method's table, so the child's exempt receipts do not reduce the allocation (20 CFR 416.1163(b), which takes the child's income after the exclusions of 416.1161(a), S3413)."
tests:
  - {id: CO-4633-T1, month: "2026-10", as_of: "2026-10-12", given: {ma_ssi_deeming_parents: [p2], ma_ssi_deeming_children: [p1]}, title: "one ineligible sibling with no income: half the FBR", others: {p2: {}, p3: {ma_is_ssi_unemancipated_child: true, ma_is_applying_for_or_eligible_for_ssi: false, resides_in_medical_institution: false, wages_gross: 0, ma_self_employment_net_earnings: 0, receipts: [{kind: ssi}], earnings: [{kind: self_employment_receipts}]}}, relationships: [[parent, p2, p3]], expect: 497}
  - {id: CO-4633-T2, month: "2026-10", as_of: "2026-10-12", given: {ma_ssi_deeming_parents: [], ma_ssi_deeming_children: []}, title: "no deemed parent: none", others: {p2: {}}, relationships: [[child, p2]], expect: 0}
