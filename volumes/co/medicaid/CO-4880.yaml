  - {id: CO-4880-T2, title: "The same son, not claimed as a dependent: not a dependent relative", as_of: "2026-11-01", given: {residence_setting_type: nursing_facility, dwelling_id: nf1, resides_in_medical_institution: true, ma_spouse_or_qualifying_child_lives_in_home: false}, others: {p2: {date_of_birth: "1986-02-02", resides_in_medical_institution: false, residence_setting_type: private_dwelling, dwelling_id: h1}}, relationships: [[parent, p1, p2]], expect: false}
