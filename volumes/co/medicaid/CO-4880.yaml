  - {id: CO-4880-T5, title: "A claimed dependent who is herself in a medical institution does not live in the home", as_of: "2026-11-01", given: {residence_setting_type: nursing_facility, dwelling_id: nf1, resides_in_medical_institution: true, ma_spouse_or_qualifying_child_lives_in_home: false}, others: {p2: {resides_in_medical_institution: true, residence_setting_type: nursing_facility, dwelling_id: nf2}}, relationships: [[tax_filer, p1, p2]], expect: false}
