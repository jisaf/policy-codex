id: CO-4880
name: "Medicaid: spouse or dependent relative lives in the home"
identifier: ma_spouse_or_dependent_relative_lives_in_home
kind: derived
type: yes/no
scope: person
program: Medicaid
meaning: "Whether this person's spouse or a dependent relative lives in this person's home, the condition that keeps a home the person has left exempt under 10 CCR 2505-10 § 8.100.5.M.2.a.iv, vi, vii, ix and xi. A dependent relative is \"one who is claimed as a dependent by an applicant for federal income tax purposes\" (§ 8.100.1); a spouse, or a child under 21 or blind or disabled (ma_spouse_or_qualifying_child_lives_in_home, CO-889), counts as well."
precision: "A dependent relative is a person whom this person, or this person's spouse, claims as a tax dependent (the tax_filer / tax_dependent edge; a joint return's claim reaches both spouses), whatever the family tie. Living in the home is read as in CO-889: the relative does not reside in a medical institution and, where this person's lives_with is stated, is in it; for a person in a facility, a relative who lives in a private dwelling is read as living in the person's home. The relatives of CO-889 are kept beside the tax dependents: they are the 42 U.S.C. 1396p(f)(2) relatives and a minor or disabled child at home is a dependent relative under the SSI rule (20 CFR 416.1212(c)) that 42 CFR 435.601(b) does not let the state narrow. If the person has no stated relationships, Medicaid reads no such relative."
derived: [any, ma_spouse_or_qualifying_child_lives_in_home, [otherwise, [exists, [filter, [persons], [otherwise, [has_relative_in, [tax_dependent], [reachable, [spouse]]], false]], [all, [not, [otherwise, [of, [P], resides_in_medical_institution], false]], [any, [otherwise, [in_group, [P], lives_with], true], [all, [otherwise, [not, ["=", residence_setting_type, private_dwelling]], false], [otherwise, ["=", [of, [P], residence_setting_type], private_dwelling], true]]]]], false]]
sources: [S3403, S3616, S370]
implemented: engine
tags: [ma, ltc, resources, household]
rationale: "Coverage pass 2, N2-4: ma_home_is_countable_resource (CO-4622) read § 8.100.5.M.2.a's \"spouse or dependent relative\" as CO-889, the 42 U.S.C. 1396p(f)(2) list that governs the equity-limit exception (CO-650). That list leaves out a dependent parent, sibling or adult child, and § 8.100.1 (S3616) defines a dependent relative as a tax dependent. No item asked whether a tax dependent lives in the home; the tax_filer edge already states the claim, so no new supplied fact is needed. CO-889 stays the equity-limit exception alone."
tests:
