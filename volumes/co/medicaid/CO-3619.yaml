id: CO-3619
name: "Medicaid: community spouse's approved medical expenses and premiums"
identifier: ma_community_spouse_medical_needs
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The additional amount 10 CCR 2505-10 § 8.100.7.Q.2 adds to the community spouse's minimum monthly needs: the documented medical and remedial care expenses not paid by a third party (medical_expenses_out_of_pocket, counted once that person's medical expenses are documented: medical_expenses_verification_document_received) and the Medicare, Long-Term Care insurance and health insurance premiums (health_insurance_premiums_paid) of the community spouse and of each dependent family member living with the community spouse (ma_family_allowance_members, CO-2469), read from those persons' facts."
assumption: "Q.2 says an additional amount 'may be approved'; the volume reads it as approved whenever the expenses are documented as Q.2.a requires and paid as Q.2.b describes (OQ-620). Q.2.b's premiums are read for the same persons as Q.2.a's expenses."
precision: "The person evaluated is the institutionalized spouse; the community spouse is the spouse who does not reside in a medical institution, as in ma_community_spouse_income (CO-2467). medical_expenses_out_of_pocket already excludes expenses reimbursed by insurance or another third party (Q.2.a.ii); Q.2.a: 'Each medical or remedial care expense claimed for deduction must be documented'; a person's expenses count only once the agency has received the documents (medical_expenses_verification_document_received, CO-1326), and the documentation's content (service, date, amount, provider) and Q.2.a.i's licensed practitioner are the eligibility site's check of the documents. Q.2.b's premiums carry no documentation sentence and are read as stated. Q.4's cap applies to the MMMNA and the excess shelter allowance only, so this amount is added after the cap (ma_mmmna, CO-655)."
derived: [sum, [filter, [persons], [any, [in_group, [P], [filter, [reachable, [spouse]], [not, [of, [P], resides_in_medical_institution]]]], [in_group, [P], ma_family_allowance_members]]], [+, [case, [["<=", [of, [P], medical_expenses_out_of_pocket], 0], 0], [[of, [P], medical_expenses_verification_document_received], [of, [P], medical_expenses_out_of_pocket]], [else, 0]], [of, [P], health_insurance_premiums_paid]]]
sources: [S1756]
implemented: engine
tags: [ma, ltc, income]
open: [OQ-620]
rationale: "Final verification F-4 (docs/reviews/final-medicaid-chp.md): the community spouse's needs were only the MMMNA and the excess shelter allowance; § 8.100.7.Q.2 (S1756) adds the community spouse's and dependents' medical expenses and premiums above the Q.4 cap, and CO-655 and CO-835 noted them as not modeled with no open question. Final verification pass 2, P2-2: Q.2.a's documentation requirement was left to the eligibility site; a person's expenses now count only once documented (CO-1326)."
tests:
  - {id: CO-3619-T1, as_of: "2026-11-01", month: "2026-11", title: "Community spouse p2 pays a 202.90 Part B premium and 60 of prescriptions; no dependents", given: {resides_in_medical_institution: true, ma_family_allowance_members: []}, others: {p2: {resides_in_medical_institution: false, medical_expenses_out_of_pocket: 60, medical_expenses_verification_document_received: true, health_insurance_premiums_paid: 202.9}}, relationships: [[spouse, p1, p2]], expect: 262.9}
  - {id: CO-3619-T2, as_of: "2026-11-01", month: "2026-11", title: "P2-2: the 60 of prescriptions is not yet documented: only the premium is added", given: {resides_in_medical_institution: true, ma_family_allowance_members: []}, others: {p2: {resides_in_medical_institution: false, medical_expenses_out_of_pocket: 60, medical_expenses_verification_document_received: false, health_insurance_premiums_paid: 202.9}}, relationships: [[spouse, p1, p2]], expect: 202.9}
