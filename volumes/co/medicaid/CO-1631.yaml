id: CO-1631
name: "Medical Assistance: long-term care applicant"
identifier: ma_is_long_term_care_applicant
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether the person is an aged, blind or disabled person seeking long-term care: in a medical institution, in an HCBS waiver target group, or enrolled in PACE, so the long-term care documentation of 8.100.7.A.2 applies."
precision: "Vocabulary fix round (docs/reviews/vocabulary-reuse.md, R-8): reads resides_in_medical_institution (CO-1742), not SNAP's majority-of-meals institution fact."
derived: [all, ma_is_aged_blind_or_disabled, [any, resides_in_medical_institution, [not, ["=", meets_hcbs_waiver_target_group, none]], is_enrolled_in_pace]]
sources: [S1086, S1087]
implemented: engine
tags: [verification, ma, ltc]
rationale: "Review K-3: the long-term care documentation requirements need the group they apply to; ma_is_institutionalized (CO-570) also requires the 30-day expectation, which is itself one of the facts documented."
tests:
  - {id: CO-1631-T1, month: "2026-10", as_of: "2026-10-01", given: {ma_is_aged_blind_or_disabled: true, resides_in_medical_institution: true}, expect: true}
  - {id: CO-1631-T2, month: "2026-10", as_of: "2026-10-01", given: {ma_is_aged_blind_or_disabled: true, resides_in_medical_institution: false, meets_hcbs_waiver_target_group: none, is_enrolled_in_pace: false}, expect: false}
  - {id: CO-1631-T3, month: "2026-10", as_of: "2026-10-01", given: {ma_is_aged_blind_or_disabled: false}, expect: false}
