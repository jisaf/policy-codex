id: CO-1152
name: "Medicaid: Breast and Cervical Cancer Program eligibility status"
identifier: ma_bccp_eligibility_status
kind: derived
type: one of
options: [eligible, ineligible_sex_or_age, ineligible_not_in_need_of_treatment, ineligible_residency, ineligible_status, ineligible_creditable_coverage, ineligible_other_medicaid]
scope: person-month
program: Medicaid
role: outcome
meaning: Whether the person is eligible for the Breast and Cervical Cancer Program (10 CCR 2505-10 § 8.715.2; 42 U.S.C. 1396a(a)(10)(A)(ii)(XVIII) and (aa)) - a woman under 65, screened by a Colorado Women's Cancer Control Initiative Qualified Entity and found In Need of Treatment, a Colorado resident, a citizen or qualifying non-citizen (or a person within the Cover All Coloradans exception), without creditable coverage, and not eligible under another Medicaid program - and, if not, the first failing condition.
precision: "Status reads ma_meets_status_for_cover_all_coloradans_categories (CO-1174): the citizen and qualified non-citizen categories § 8.715.2.C.3 names (ma_meets_citizenship_requirement, CO-509, which also covers § 8.100.3.G.1.g.v's Cuban/Haitian entrants and COFA migrants that C.3's '(ii)-(iv)' skips) and the exception C.3 cross-references as '8.100.3(G)(1)(g)(viii)', read as the Cover All Coloradans exception now numbered ix (OQ-202). Creditable coverage reads the BCCP-specific facts ma_bccp_has_creditable_coverage (CO-1191: C.R.S. 10-16-102(16) less § 8.715.3.B's exclusions, with § 8.715.3.D) and ma_bccp_creditable_coverage_exception_applies (CO-1192: § 8.715.3.C), in place of the CHP+ coverage fact (OQ-203). 'Not eligible under another Medicaid program' (§ 8.715.2.C.6; 1396a(aa)(1)) reads ma_has_full_coverage_category (CO-1176), so a woman eligible for long-term care, a Buy-In program, OAP SISC B or a protected group is not also reported BCCP eligible. The one-year eligibility period and treatment-start timing of §§ 8.715.2.F and 8.715.5 are not modeled; the status is evaluated for the month. Time audit T-1 (2026-11-23): \"has not yet attained the age of 65\" reads ma_age_on_first_day_of_month (CO-4978): under 65 on some day of the month; that the whole month counts for this group is OQ-950's assumption; it read age (CO-300), the age on the determination date, in every month."
derived: [case, [[not, [all, ["=", sex, "female"], [<, ma_age_on_first_day_of_month, ma_bccp_age_limit]]], "ineligible_sex_or_age"], [[not, is_screened_in_need_of_breast_or_cervical_cancer_treatment], "ineligible_not_in_need_of_treatment"], [[not, ma_meets_residency], "ineligible_residency"], [[not, ma_meets_status_for_cover_all_coloradans_categories], "ineligible_status"], [[all, ma_bccp_has_creditable_coverage, [not, ma_bccp_creditable_coverage_exception_applies]], "ineligible_creditable_coverage"], [ma_has_full_coverage_category, "ineligible_other_medicaid"], [else, "eligible"]]
sources: [S608, S609, S610, S611, S612, S672, S673, S674, S607]
open: [OQ-201, OQ-202, OQ-203, OQ-214, OQ-950]
implemented: engine
tags: [ma, emergency, medical]
rationale: "No existing item states BCCP eligibility, a full-benefit Medicaid group (§ 8.715.7.A) with its own screening, age and coverage tests. Declared an outcome. Precision history (moved from precision, engineering follow-up pass task 5): (phase 7 fix round, S-11; OQ-203); (phase 7 fix round, S-1)."
