id: CO-5171
name: "Medicaid SSI method: a person's gross earned income"
identifier: ma_ssi_gross_earned_income
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The person's gross earned income of the month as the SSI method counts it, before the exclusions of 20 CFR 416.1112 and 10 CCR 2505-10 8.100.5.H.4: the pay from employment (ma_ssi_wage_earnings, CO-5170), the net earnings from self-employment (ma_self_employment_net_earnings, CO-1704; 8.100.5.F.4.b), and the part of boarders' payments that is earned income (ma_ssi_boarder_earned_income, CO-5177; 8.100.3.K.10.c-e)."
precision: "Earned-income records, Medicaid and CHP+ track E1: the one statement of a person's earned income that the SSI-related groups, long-term care gross income, the spousal allowances, the ineligible child and spouse allocations, deeming and the buy-ins read; each read wages_gross plus ma_self_employment_net_earnings before."
derived: ["+", ma_ssi_wage_earnings, ma_self_employment_net_earnings, ma_ssi_boarder_earned_income]
sources: [S3001, S1154, S4107]
implemented: engine
tags: [ma, non_magi, income]
rationale: "Earned-income records, step E1 (Medicaid and CHP+): fifteen SSI-method items wrote wages_gross + ma_self_employment_net_earnings each; they read this one item, so a change to what is earned income is made once."
nearest: [CO-5170, CO-1704]
tests:
  - {id: CO-5171-T1, month: "2026-10", as_of: "2026-10-01", given: {earnings: [{kind: wages, amount: 1200}, {kind: self_employment_receipts, amount: 900}, {kind: business_cost_operating, amount: 250}, {kind: business_cost_capital_principal, amount: 100}]}, title: "Wages 1,200 + (900 - 250 operating costs; principal not allowed, 8.100.3.K.9.b.ii) = 1,850", expect: 1850}
  - {id: CO-5171-T3, month: "2026-11", as_of: "2026-11-01", given: {earnings: [{kind: wages, amount: 1000}, {kind: boarder_payments, amount: 500, boarders: 1, provides: room_and_board}]}, title: "OQ-1023 settled: wages 1,000 + room and board 500 less the FY 2027 one-person allotment 306 (K.10.e) = 1,194", expect: 1194}
  - {id: CO-5171-T2, month: "2026-10", as_of: "2026-10-01", given: {earnings: []}, title: "No earnings: 0", expect: 0}
