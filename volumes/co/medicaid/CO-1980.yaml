scope: person
program: Medicaid
meaning: "The Bureau of Economic Analysis region, as 10 CCR 2505-10 § 8.100.7.G.6.a.i.a) lists its counties, in which the person resides and intends to remain: the region whose average private-pay rate is the income-trust gross income ceiling."
precision: "Read from ma_ltc_private_pay_region_by_county_table (CO-3021), where every option of county_of_residence has a row (hard-coded numbers audit H-7: before, three literal county lists with region IV as the remainder)."
