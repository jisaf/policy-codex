id: CO-1980
name: "Medicaid: long-term care private-pay region"
identifier: ma_ltc_private_pay_region
kind: derived
type: one of
options: [region_i, region_ii, region_iii, region_iv]
scope: person
program: Medicaid
meaning: "The Bureau of Economic Analysis region, as 10 CCR 2505-10 § 8.100.7.G.6.a.i.a) lists its counties, in which the person resides and intends to remain: the region whose average private-pay rate is the income-trust gross income ceiling."
precision: Region IV is the remaining case; every option of county_of_residence is in exactly one list.
