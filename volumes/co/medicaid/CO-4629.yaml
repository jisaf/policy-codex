id: CO-4629
name: "Medicaid: blind work expenses and earned income for a self-support plan excluded"
identifier: ma_ssi_earned_income_excluded_after_half
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The earned income of this person's SSI-related household excluded after the one-half disregard for the month (20 CFR 416.1112(c)(8)-(9), incorporated by 10 CCR 2505-10 § 8.100.5.H.4.e; § 8.100.5.F.6.q): for each member living together (the spouse group of ma_ssi_countable_earned_income), blind_work_expenses_paid when the member is blind and under ma_aged_age, and the earnings it sets aside under a plan for self-support (ma_ssi_pass_set_aside_earned_income, CO-5176) when the member is blind or disabled and under ma_aged_age."
precision: "The SSA approves a plan to achieve self-support only for a blind or disabled person, and § 8.100.5.F.6.q requires that SSI permit the disregard; pass_set_aside_earned_income states only income under an approved plan. The SSI-before-65 continuation of (c)(8)-(9) is not stated, so the exclusions stop at 65. Coverage pass 4, non-MAGI N4-9 (docs/operators.md, \"Ages in a month\"): the age is taken in the month evaluated, not on the determination date: an \"under N\" test on the first day of the month (ma_age_on_first_day_of_month, CO-4978), an \"N or older\" test on the last day (ma_age_on_last_day_of_month, CO-5402), and a test that excludes the person from what is favorable on the other day. Coverage pass 4, non-MAGI N4-13 (decision 4 of 2026-11-23: missing information is cannot determine unless the rule says otherwise; readers do not invent defaults): a member's blindness and disability (the SSA's or the Department's finding, 8.100.6.B) are read as stated for every member, no longer as no for a member whose finding is unstated."
derived: [sum, ma_ssi_couple_members, [case, [["<", [of, [P], ma_age_on_first_day_of_month], ma_aged_age], [+, [case, [[of, [P], is_blind], [otherwise, [of, [P], blind_work_expenses_paid], 0]], [else, 0]], [case, [[any, [of, [P], is_blind], [of, [P], meets_ssa_disability_criteria]], [of, [P], ma_ssi_pass_set_aside_earned_income]], [else, 0]]]], [else, 0]]]
sources: [S3412, S3404]
implemented: engine
tags: [ma, non_magi, income, disability]
rationale: "Coverage review NM-7, NM-8: blind work expenses and earned income used for an approved plan to achieve self-support had no exclusion in the SSI method, though § 8.100.5.H.4.e incorporates 20 CFR 416.1112. Coverage pass 3 C3-1: sums over ma_ssi_couple_members (CO-3626), which keeps a newly admitted spouse in the couple through the admission month (§ 8.100.7.C.2.b) except for the institutionalized spouse's own test (42 U.S.C. 1396r-5(b)(1)); it had filtered on resides_in_medical_institution, which split the couple's incomes from the admission day while the size and resources still read them together. Earned-income records, step E1 (Medicaid and CHP+): the set-aside is the earnings records' pass_set_aside (ma_ssi_pass_set_aside_earned_income, CO-5176), replacing pass_set_aside_earned_income."
tests:
  - {id: CO-4629-T1, as_of: "2026-10-12", month: "2026-10", given: {resides_in_medical_institution: false, is_blind: true, meets_ssa_disability_criteria: false, date_of_birth: "1986-01-01", blind_work_expenses_paid: 150, earnings: [{kind: wages, pass_set_aside: 100}, {kind: self_employment_receipts}]}, relationships: [], expect: 250}
  - {id: CO-4629-T2, as_of: "2026-10-12", month: "2026-10", title: "disabled, not blind: the plan only", given: {resides_in_medical_institution: false, is_blind: false, meets_ssa_disability_criteria: true, date_of_birth: "1986-01-01", blind_work_expenses_paid: 150, earnings: [{kind: wages, pass_set_aside: 100}, {kind: self_employment_receipts}]}, relationships: [], expect: 100}
  - {id: CO-4629-T3, month: "2026-11", as_of: "2026-11-20", title: "N4-9: blind, 64 on 2026-11-01: blind work expenses 80 taken after the half (416.1112(c)(8))", given: {date_of_birth: "1961-11-15", is_blind: true, meets_ssa_disability_criteria: false, blind_work_expenses_paid: 80, ma_ssi_couple_members: [p1], ma_ssi_pass_set_aside_earned_income: 0}, expect: 80}
