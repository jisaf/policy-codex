id: CO-888
name: "Medicaid: spouses' countable resources at the spousal impoverishment snapshot"
identifier: ma_spousal_resources_at_snapshot
kind: derived
type: money
scope: person
program: Medicaid
meaning: "The couple's total countable resources as assessed at the time of the initial Medical Assistance application (10 CCR 2505-10 § 8.100.7.L, S3419: \"All non-exempt resources owned by a married couple are counted, whether owned jointly or individually\"; M.1: \"based on the total resources owned by the couple as of the time of Medical Assistance application\"), the figure the CSRA is computed from and \"established at intake only\": in the month of the person's application (ma_application_date), the person's and the spouse's countable resources (ma_ssi_countable_resources_in_month, CO-5322), each with the real property left out only while efforts to sell it are made added back (ma_real_property_for_sale_excluded_in_month, CO-5323; 8.100.5.M.2.b.vi, S4666), and the couple's one automobile (the smaller spouse's excluded automobile added back, 20 CFR 416.1218(b), S4660)."
precision: "Resource records, Medicaid track H1 (decision D8): derived from the holdings the couple states valued in the application month (a holding with no month has the same value in every month the case covers, CO-5300); unknown when the application date is not stated or a holding read in that month cannot be valued (decision 4: never a silent zero). Coverage review NM-18: the meaning had dated the assessment at the start of the first continuous period of institutionalization, the date of 42 U.S.C. 1396r-5(c)(1)(A); Colorado's CSRA is the couple's resources up to the maximum (OQ-126), which 1396r-5(c)(2) attributes at the time of application, so the application date governs here. The spouse is the legal spouse wherever each lives, as in ma_institutionalized_spouse_countable_resources (CO-647). Whether each spouse's home is countable is judged on the determination date's facts (CO-4622), its equity in the application month. A joint holding is stated on each spouse's list with each one's share, so the couple's figure counts it once (L: \"whether owned jointly or individually\")."
derived: [at, ["+", ["+", ma_ssi_countable_resources_in_month, ma_real_property_for_sale_excluded_in_month], [sum, [filter, [persons], [otherwise, [rel, [spouse], [P]], false]], ["+", [of, [P], ma_ssi_countable_resources_in_month], [of, [P], ma_real_property_for_sale_excluded_in_month]]], [min, ma_ssi_excluded_automobile_equity_in_month, [sum, [filter, [persons], [otherwise, [rel, [spouse], [P]], false]], [of, [P], ma_ssi_excluded_automobile_equity_in_month]]]], [month_of, ma_application_date]]
sources: [S652, S1220, S3419, S4666, S4660]
implemented: engine
tags: [ma, ltc, resources]
rationale: "ssi_countable_resources_couple (CO-801) is read both as the § 8.100.7.L intake snapshot (by ma_csra, CO-646) and as the current-month figure § 8.100.7.O.1 tests each month (by ma_institutionalized_spouse_countable_resources, CO-647), so the two can never differ and spend-down cannot be expressed - the phase-4 review's C-13 finding. This item is the snapshot only; CO-801 becomes the current-month figure CO-647 subtracts the CSRA from. ma_csra (CO-646) needs it. Vocabulary fix round (docs/reviews/vocabulary-reuse.md, C-2): renamed from countable_resources_couple_at_snapshot; Medicaid's spousal impoverishment rule defines it. Resource records, step H1 (Medicaid; design 3.2, decision D8): derived from the couple's dated holdings at the application month instead of supplied by the worker's assessment, so the figure the CSRA is computed from and the current-month figure read the same records, each in its month."
tests:
  # Hand-computed from 8.100.7.L, M.1 (S3419, S652), 8.100.5.M.2.b.vi (S4666), 20 CFR 416.1218(b) (S4660).
  - {id: CO-888-T1, as_of: "2026-11-01", title: "applied in October 2026; October balances 1,900 and 44,100, November's lower: 46,000", given: {ma_application_date: "2026-10-01", holdings: [{kind: bank_account, value: 1900, month: "2026-10"}, {kind: bank_account, value: 1500, month: "2026-11"}]}, others: {p2: {holdings: [{kind: bank_account, value: 44100, month: "2026-10"}, {kind: bank_account, value: 30000, month: "2026-11"}]}}, relationships: [[spouse, p2]], expect: 46000}
  - {id: CO-888-T2, as_of: "2026-11-01", title: "M.2.b.vi: a 40,000 lot for sale stays in the assessment; one car each (8,000 and 5,000 equity), the couple excludes one: 2,000 + 40,000 + 5,000 + 10,000 = 57,000", given: {ma_application_date: "2026-11-02", holdings: [{kind: bank_account, value: 2000}, {kind: real_property, value: 40000, amount_owed: 0, listed_for_sale: true, ma_sale_efforts_unsuccessful: true, co_owner_would_lose_housing: false}, {kind: vehicle, value: 8000, amount_owed: 0, used_for_transportation: true}]}, others: {p2: {holdings: [{kind: bank_account, value: 10000}, {kind: vehicle, value: 5000, amount_owed: 0, used_for_transportation: true}]}}, relationships: [[spouse, p2]], expect: 57000}
  - {id: CO-888-T3, as_of: "2026-11-01", title: "a joint 30,000 account, half on each list, counted once: 15,000 + 15,000 + 500 = 30,500", given: {ma_application_date: "2026-11-02", holdings: [{kind: bank_account, value: 30000, share: 0.5, co_owners: spouse, holding_id: joint}, {kind: bank_account, value: 500}]}, others: {p2: {holdings: [{kind: bank_account, value: 30000, share: 0.5, co_owners: spouse, holding_id: joint}]}}, relationships: [[spouse, p2]], expect: 30500}
  - {id: CO-888-T4, as_of: "2026-11-01", title: "no application date: cannot be determined (decision D8)", given: {holdings: [{kind: bank_account, value: 2000}]}, others: {p2: {holdings: [{kind: bank_account, value: 10000}]}}, relationships: [[spouse, p2]], expect: unknown}
