id: CO-2278
name: "Medicaid: ineligible child allocation taken from an ineligible spouse's unearned income"
identifier: ma_ssi_child_allocation_from_spouse_unearned
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: The part of the Ineligible Child Allocation (ma_ssi_ineligible_child_allocation) deducted from the unearned income of the person's spouse living with the person who is not applying for or eligible for SSI - the ineligible parent whose gross income the allocation reduces (10 CCR 2505-10 § 8.100.5.H.3.a.i) - unearned income first (H.3.b.i), up to that spouse's unearned income as the SSI method counts it (ma_ssi_unearned_receipts, in-kind support and maintenance, winnings).
derived: [case, [["=", ma_ssi_ineligible_child_allocation, 0], 0], [else, [min, ma_ssi_ineligible_child_allocation, [sum, [filter, ma_ssi_couple_members, [all, [rel, [spouse, holds_out_as_spouse_with], [P]], [not, [of, [P], ma_is_applying_for_or_eligible_for_ssi]]]], ["+", [of, [P], ma_ssi_unearned_receipts], [of, [P], ssi_in_kind_support_and_maintenance], [of, [P], ma_ssi_gambling_receipts]]]]]]
sources: [S1506, S1955, S3001]
implemented: engine
tags: [ma, non_magi, income]
open: [OQ-473]
rationale: "Final verification pass 3, pattern sweep (2026-11-22): the income read now includes lottery and gambling winnings received in the month (§ 8.100.5.F.5.i, S3001; an unstated receipt is 0). OQ-83: the allocation reduces the ineligible parent's income before the standard disregards (H.3.b.ii), unearned income first. Same-word audit SW-6: the SSI method treats as spouses two unrelated persons living together who lead people to believe they are married (20 CFR 416.1806(a)(3), S1955), so the holds_out_as_spouse_with role is read beside the legal spouse. Coverage pass 3 C3-1: sums over ma_ssi_couple_members (CO-3626), which keeps a newly admitted spouse in the couple through the admission month (§ 8.100.7.C.2.b) except for the institutionalized spouse's own test (42 U.S.C. 1396r-5(b)(1)); it had filtered on resides_in_medical_institution, which split the couple's incomes from the admission day while the size and resources still read them together. Receipt records, migration phase 2: the spouse's unearned income is the counted receipts (CO-5511) plus in-kind support and winnings (CO-5512): the same figure the couple's sum (CO-663) counts for the spouse, from which CO-2281 takes the allocation; before receipt records it was the gross figure, so the allocation could exceed what the sum counted."
tests:
  - {id: CO-2278-T1, month: "2026-10", as_of: "2026-10-01", given: {ma_ssi_ineligible_child_allocation: 894, resides_in_medical_institution: false}, title: "Spouse not applying for SSI with $500 of pension; $894 allocation", others: {p2: {resides_in_medical_institution: false, ma_is_applying_for_or_eligible_for_ssi: false, ssi_in_kind_support_and_maintenance: 0, receipts: [{kind: ssi}, {kind: pension, amount: 500}, {kind: child_support}, {kind: colorado_works_cash}, {kind: adult_financial_cash}]}}, relationships: [[spouse, p2]], expect: 500}
  - {id: CO-2278-T2, month: "2026-10", as_of: "2026-10-01", given: {ma_ssi_ineligible_child_allocation: 894, resides_in_medical_institution: false}, title: "Spouse receiving SSI: no ineligible spouse", others: {p2: {resides_in_medical_institution: false, ma_is_applying_for_or_eligible_for_ssi: true}}, relationships: [[spouse, p2]], expect: 0}
  - {id: CO-2278-T3, month: "2026-10", as_of: "2026-10-01", given: {ma_ssi_ineligible_child_allocation: 0}, title: "No allocation", expect: 0}
