 start_date]], [month]]], [any, [unknown, [receipt, end_date]], [">=", [month_of, [receipt, end_date]], [month]]]]], [in, [lookup, ma_ssi_receipt_treatment_table, [receipt, kind]], [counted, counted_no_rule_excludes, counted_net_of_expenses]], [not, [all, [receipt, retroactive], [in, [receipt, kind], [social_security, ssi]]]], [">", [receipt, for_dependent], 0], [not, [unknown, [receipt, for_person]]], [in_group, [receipt, for_person], [reachable, [spouse], false]]], [receipt, for_dependent]], 0], 0], [[in_group, [P], lives_with], [sum_receipts, [of, [P], receipts], [all, [received_in, [month]], [any, [not, [unknown, [receipt, month]]], [all, [any, [unknown, [receipt, start_date]], ["<=", [month_of, [receipt, start_date]], [month]]], [any, [unknown, [receipt, end_date]], [">=", [month_of, [receipt, end_date]], [month]]]]], [in, [lookup, ma_ssi_receipt_treatment_table, [receipt, kind]], [counted, counted_no_rule_excludes, counted_net_of_expenses]], [not, [all, [receipt, retroactive], [in, [receipt, kind], [social_security, ssi]]]], [">", [receipt, for_dependent], 0], [not, [unknown, [receipt, for_person]]], [in_group, [receipt, for_person], [reachable, [spouse], false]]], [receipt, for_dependent]]], [else, 0]]]]]], ma_ssi_excluded_infrequent_unearned_income]]
