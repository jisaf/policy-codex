id: CO-5511
name: "Medicaid SSI method: a person's counted unearned receipts"
identifier: ma_ssi_unearned_receipts
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The person's receipts of the month that the SSI method's counting table counts (ma_ssi_receipt_treatment_table, CO-5510: counted, counted because no rule excludes it, or rents), each less the parts the method does not count as income (none below 0): the part set aside under a plan for self-support (10 CCR 2505-10 8.100.5.F.6.q), what a death benefit, an inheritance or a settlement paid toward the deceased's last illness and burial or the costs it covers (spent_on_covered_costs: F.5.a, \"Death benefits, reduced by the cost of last illness and burial\"; 20 CFR 416.1121(e), (g)), what an award includes for the claim's medical, legal or related expenses (claim_expense: 416.1123(b)(3), \"We include less than you actually receive if part of the payment is for an expense you had in getting the payment\"), the amount of a veterans benefit paid because of a dependent (for_dependent: 416.1123(e)(1)), which is the dependent's and not the veteran's, and of a retroactive payment from a program other than SSI the legal fees connected with the claim (designated_for_legal_fees: 416.1123(b)(3)); a retroactive Title II or SSI payment left out (F.6.c); rents less the ordinary and necessary expenses of the rental property paid in the month, up to the rents (20 CFR 416.1121(d); 8.100.5.J.1); plus the amount of a veterans benefit attributable to the person as a dependent, from the stated receipts of any person of the case who receives it and with whom the person resides (the record's for_dependent, on a record whose for_person names this person; 20 CFR 416.1123(e)(2)(i): \"we count the amount attributable to you as your unearned cash income if ... You reside with the individual who receives the veterans benefit\"); less the first $60 a calendar quarter of such income received infrequently or irregularly (416.1124(c)(6); ma_ssi_excluded_infrequent_unearned_income, CO-6731). Before child support (the child's, ma_ssi_child_support_receipts), in-kind support and maintenance, gambling winnings (ma_ssi_gambling_receipts) and the $20 general income disregard, which the rules that read it apply."
precision: "Rental expenses are rental_property_expenses_paid (CO-4458), read only for a month with rents; coverage pass 4, non-MAGI N4-13 (decision 4): no longer read as 0 when not stated, so a person with rents who states no expenses cannot be determined (it had been the reading of ma_ssi_excluded_unearned_income, CO-2470). Coverage pass 4, non-MAGI N4-3 and N4-4 (docs/reviews/coverage4-medicaid-nonmagi.md): the record's parts the method does not count, and the quarterly $60, are read here, so every SSI-method sum that reads this item (the person, a spouse, deemed parents, the buy-ins) leaves them out; 42 CFR 435.601(b)(2) (S4754) brings 416.1123 and 416.1124(c)(6) where Colorado's text names nothing. The amount the VA pays the veteran for a dependent is the dependent's income only where 416.1123(e)(2) says so (the dependent lives with the veteran or is paid separately); a dependent the VA pays separately states that payment on the dependent's own list ((e)(2)(ii)). Field-effect sweep (docs/reviews/field-sweep-snap-cash-nonmagi.md), FS-MA-1: a receipt stated as a stream (no month and no date) is received only in the months from the month of its start_date through the month of its end_date (each absent: before, or through, the months the case covers; CO-5000), since unearned income \"is countable as income in the month received\" (10 CCR 2505-10 8.100.5.F.5, S3001) and is counted \"when you receive it\" (20 CFR 416.1123(a), S4940); in its first and last months it is read at its amount, and a payment stated with its month or date is placed by it, a final payment after the stream ended included. Before, a stream was counted in every month whatever its dates. The clause is SNAP's (snap_counted_recurring_receipts, CO-5011). Field-effect sweep (docs/reviews/field-sweep-snap-cash-nonmagi.md), FS-MA-8: of a retroactive payment from a benefit program other than SSI, the legal fees connected with the claim (designated_for_legal_fees, the part of designated_for_lump_sum_costs that is legal fees) are subtracted, and the payment's other designated costs are not: 20 CFR 416.1123(b)(3) (S4756), \"If you receive a retroactive check from a benefit program other than SSI, legal fees connected with the claim are subtracted. We do not subtract from any taxable unearned income the part you have to use to pay personal income taxes\"; the legal fees are required where read (decision 4 of 2026-11-23): a retroactive payment that does not state them cannot be determined. Before, nothing of designated_for_lump_sum_costs was read. Cross-list records round (docs/reviews/cross-list-records.md), FS-MA-3, OQ-1348 resolved: the dependent's side, 416.1123(e)(2)(i) (S4756), is read as Adult Financial and Colorado Works read the same sentence (af_counted_unearned_receipts CO-5017, cw_counted_unearned_receipts CO-5651; docs/conventions.md, \"Whose list a receipt is on\"): the dependent's figure adds the for_dependent of each counted receipt received in the month, on the stated receipts list of any person of the case, whose for_person names this person (compared with this person as the persons joined to this person by no edge, [reachable, [spouse], false], the person alone), where that person is one the dependent lives with (lives_with, CO-1925: the same home); lives_with is read only for a person whose award names the dependent, so a dependent named by an award whose home is not stated cannot be determined (decision 4), and a part for a dependent living elsewhere is no one's (neither (e)(2)(i) nor (ii)). The receipt's own conditions are the veteran's: received in the month, inside the stream's dates, a kind this item counts, not a retroactive Title II or SSI payment; so the part leaves the veteran's figure and enters the dependent's in the same months. A case of one person has no one else's award (0). A person of the case whose receipts list is not stated gives no part here (that person's own income is then unknown wherever the SSI method reads it); a person no rule reads is not asked for a list only to look for an award. Before, the part reached no one: by hand 300, the codex 0 (FS-MA-3's probe, CO-5511-T26)."
