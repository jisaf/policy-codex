id: CO-5511
name: "Medicaid SSI method: a person's counted unearned receipts"
identifier: ma_ssi_unearned_receipts
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The person's receipts of the month that the SSI method's counting table counts (ma_ssi_receipt_treatment_table, CO-5510: counted, counted because no rule excludes it, or rents), each less the parts the method does not count as income (none below 0): the part set aside under a plan for self-support (10 CCR 2505-10 8.100.5.F.6.q), what a death benefit, an inheritance or a settlement paid toward the deceased's last illness and burial or the costs it covers (spent_on_covered_costs: F.5.a, \"Death benefits, reduced by the cost of last illness and burial\"; 20 CFR 416.1121(e), (g)), what an award includes for the claim's medical, legal or related expenses (claim_expense: 416.1123(b)(3), \"We include less than you actually receive if part of the payment is for an expense you had in getting the payment\"), and the amount of a veterans benefit paid because of a dependent (for_dependent: 416.1123(e)(1)); a retroactive Title II or SSI payment left out (F.6.c); rents less the ordinary and necessary expenses of the rental property paid in the month, up to the rents (20 CFR 416.1121(d); 8.100.5.J.1); less the first $60 a calendar quarter of such income received infrequently or irregularly (416.1124(c)(6); ma_ssi_excluded_infrequent_unearned_income, CO-6731). Before child support (the child's, ma_ssi_child_support_receipts), in-kind support and maintenance, gambling winnings (ma_ssi_gambling_receipts) and the $20 general income disregard, which the rules that read it apply."
precision: "Rental expenses are rental_property_expenses_paid (CO-4458), read as 0 when not stated (the reading of ma_ssi_excluded_unearned_income, CO-2470, which this item replaces; an expense, not a receipt). Coverage pass 4, non-MAGI N4-3 and N4-4 (docs/reviews/coverage4-medicaid-nonmagi.md): the record's parts the method does not count, and the quarterly $60, are read here, so every SSI-method sum that reads this item (the person, a spouse, deemed parents, the buy-ins) leaves them out; 42 CFR 435.601(b)(2) (S4754) brings 416.1123 and 416.1124(c)(6) where Colorado's text names nothing. The amount the VA pays the veteran for a dependent is the dependent's income only where 416.1123(e)(2) says so (the dependent lives with the veteran or is paid separately); a dependent whose own SSI-method income is tested states it on the dependent's own list only when the VA pays the dependent separately, so for a dependent living with the veteran the codex does not yet add it to the dependent's income (recorded in the review, N4-3)."
derived: [max, 0, ["-", ["-", [sum_receipts, receipts, [all, [received_in, [month]], [in, [lookup, ma_ssi_receipt_treatment_table, [receipt, kind]], [counted, counted_no_rule_excludes, counted_net_of_expenses]], [not, [all, [receipt, retroactive], [in, [receipt, kind], [social_security, ssi]]]]], [max, 0, ["-", [receipt, amount], ["+", [receipt, pass_set_aside], [receipt, spent_on_covered_costs], [receipt, claim_expense], [receipt, for_dependent]]]]], [min, [otherwise, rental_property_expenses_paid, 0], [sum_receipts, receipts, [all, [received_in, [month]], [in, [lookup, ma_ssi_receipt_treatment_table, [receipt, kind]], [counted_net_of_expenses]]], [receipt, amount]]]], ma_ssi_excluded_infrequent_unearned_income]]
sources: [S3001, S3404, S3617, S2209, S3618, S3619, S3620, S2900, S2609, S4754, S4755, S4756]
implemented: engine
tags: [ma, non_magi, income]
rationale: "Receipt records, migration phase 2: the SSI method's unearned income read from the receipts through its counting table, replacing the scalar unearned income facts less ma_ssi_excluded_unearned_income (CO-2470) in every SSI-method sum (the couple, deemed parents, an ineligible spouse, the buy-ins)."
tests:
  - {id: CO-5511-T1, month: "2026-10", as_of: "2026-10-01", given: {receipts: [{kind: social_security, amount: 900}, {kind: pension, amount: 300}, {kind: ssi, amount: 200}, {kind: colorado_works_cash, amount: 400}, {kind: loan, amount: 600}]}, title: "Social Security and a pension counted; SSI, Colorado Works cash and a loan not (F.5.j; 8.100.6.C; F.6.j; 416.1103(f))", expect: 1200}
  - {id: CO-5511-T2, month: "2026-10", as_of: "2026-10-01", given: {receipts: [{kind: social_security, amount: 900, pass_set_aside: 300}, {kind: social_security, amount: 2400, frequency: once, retroactive: true, month: "2026-10"}, {kind: foster_care_payment, amount: 600}]}, title: "NM-7, NM-23: 300 of Social Security set aside under a PASS, a retroactive Social Security payment and foster care payments are exempt (F.6.q, c, l)", expect: 600}
  - {id: CO-5511-T3, month: "2026-10", as_of: "2026-10-01", given: {receipts: [{kind: pension, amount: 500}, {kind: va_aid_and_attendance, amount: 400}]}, title: "N2-1: VA Aid and Attendance is not income (8.100.5.K); the rest of the VA pension is", expect: 500}
  - {id: CO-5511-T4, month: "2026-11", as_of: "2026-11-01", given: {receipts: [{kind: general_assistance, amount: 200}, {kind: charitable_need_based_cash, amount: 100}, {kind: workforce_program_payment, amount: 300}, {kind: vocational_training_allowance, amount: 50}, {kind: americorps, amount: 400}, {kind: rental_income, amount: 900}], rental_property_expenses_paid: 1100}, title: "NM-23, NM-26, NM-27: General Assistance, charity, WIOA payments and AmeriCorps exempt; a vocational rehabilitation allowance is not income (416.1103(a)(3), (b)(1); coverage pass 4 N4-3, was counted by silence); rents 900 less min(1,100, 900) of expenses count 0: 0", expect: 0}
  - {id: CO-5511-T5, month: "2026-10", as_of: "2026-10-01", given: {receipts: [{kind: child_support, amount: 250}, {kind: gambling_winnings, amount: 1000, frequency: once, month: "2026-10"}]}, title: "Child support and gambling winnings are read apart (ma_ssi_child_support_receipts, ma_ssi_gambling_receipts)", expect: 0}
  - {id: CO-5511-T6, month: "2026-10", as_of: "2026-10-01", given: {receipts: [{kind: interest_and_dividends, amount: 40}, {kind: other_nontaxable, amount: 5000, frequency: once, month: "2026-10"}]}, title: "Interest and dividends on resources are counted (F.5.e); an inheritance in the month received (F.5.c)", expect: 5040}
  - {id: CO-5511-T7, month: "2026-10", as_of: "2026-10-01", given: {}, title: "Receipts not stated: cannot determine", expect: unknown}
  - {id: CO-5511-T8, month: "2026-10", as_of: "2026-10-01", given: {receipts: [{kind: sponsor_payment, amount: 300}]}, title: "Money from a sponsor is not counted pending OQ-972", expect: 0}
  - {id: CO-5511-T9, month: "2026-11", as_of: "2026-11-12", given: {receipts: [{kind: social_security, amount: 800}, {kind: reverse_mortgage, amount: 500}, {kind: reimbursement, amount: 400, date: "2026-11-03", frequency: once}, {kind: housing_utility_allowance, amount: 60}, {kind: colorado_works_diversion, amount: 1000, date: "2026-11-03", frequency: once}]}, title: "N4-1: reverse mortgage payments are not income (L.1), a reimbursement (F.6.w), a HUD utility allowance (F.6.g) and a Colorado Works diversion payment (F.6.y) are exempt: Social Security 800 alone", expect: 800}
  - {id: CO-5511-T10, month: "2026-11", as_of: "2026-11-12", given: {receipts: [{kind: social_security, amount: 800}, {kind: resource_liquidation, amount: 3000, date: "2026-11-03", frequency: once}, {kind: savings_account_distribution, amount: 200}, {kind: insurance_cash_value, amount: 500, date: "2026-11-05", frequency: once}]}, title: "N4-2: the proceeds of selling a car, a withdrawal from her own account and cash value taken from her own policy are resources that changed form (P.1, 416.1103(c)): 800", expect: 800}
  - {id: CO-5511-T11, month: "2026-11", as_of: "2026-11-12", given: {receipts: [{kind: social_security, amount: 800}, {kind: property_or_food_tax_refund, amount: 150, date: "2026-11-04", frequency: once}, {kind: crime_victim_compensation, amount: 600, date: "2026-11-03", frequency: once}, {kind: in_home_care_allowance, amount: 300}, {kind: vocational_training_allowance, amount: 50}]}, title: "N4-3: a property tax refund (416.1124(c)(1)), crime victim compensation ((c)(17)), an in-home care allowance and a vocational rehabilitation allowance (416.1103(a)(3), (b)(1)) are not counted, by 435.601(b)(2): 800", expect: 800}
  - {id: CO-5511-T12, month: "2026-11", as_of: "2026-11-12", given: {receipts: [{kind: social_security, amount: 400}, {kind: other_nontaxable, amount: 3000, date: "2026-11-03", frequency: once, spent_on_covered_costs: 2500}, {kind: workers_compensation, amount: 1500, date: "2026-11-03", frequency: once, claim_expense: 1200}]}, title: "N4-4: a 3,000 death benefit less 2,500 spent on the funeral (F.5.a) and a 1,500 award less 1,200 of claim expenses (416.1123(b)(3)): 400 + 500 + 300 = 1,200", expect: 1200}
