  - {id: CO-5511-T15, month: "2026-11", as_of: "2026-11-12", given: {receipts: [{kind: interest_and_dividends, amount: 5}, {kind: state_veteran_annuity, amount: 100}, {kind: kinship_care_payment, amount: 300}]}, title: "Counted by Colorado text against Subpart K (F.5.e, F.5.j.vi; OQ-1280) and kinship care by silence (OQ-971): 5 + 100 + 300 = 405", expect: 405}
