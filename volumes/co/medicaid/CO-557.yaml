id: CO-557
name: "Medicaid: retroactive coverage start month"
identifier: ma_retroactive_coverage_start_month
kind: derived
type: month
scope: person
program: Medicaid
meaning: The first month of the retroactive Medical Assistance coverage period under 10 CCR 2505-10 8.100.3.E.1 and 42 CFR 435.915(a) - ma_retroactive_coverage_months (3) months before the month of application, or the month the person became eligible for Medical Assistance (ma_eligibility_start_date), whichever is later, for a person who received covered medical services in that period and met every applicable eligibility requirement at the time.
precision: "8.100.3.E.1's 'or as of the date the person became eligible for Medical Assistance, whichever is later' reads ma_eligibility_start_date (CO-2206; OQ-55, resolved): when the month containing that date is later than the three-month start, the period begins in that month. Coverage is stated by month, so a person who became eligible during a month is covered from that month. Vocabulary fix round (U-7): reads ma_retroactive_coverage_months (CO-197) with pattern P44 instead of a hard-coded count, so a change to the parameter changes the rule."
derived: [case, [[">", [month_of, ma_eligibility_start_date], [months_before, ma_retroactive_coverage_months, [month_of, ma_application_date]]], [month_of, ma_eligibility_start_date]], [else, [months_before, ma_retroactive_coverage_months, [month_of, ma_application_date]]]]
sources: [S217, S218, S1503]
implemented: engine
tags: [ma]
rationale: "No existing item computes a retroactive coverage start month. Written as three single-step month_before applications, matching ma_child_continuous_eligibility_end_month's (CO-556) treatment of the missing 'N months before/after' catalog pattern - see the batch report's engine-gap note."
tests:
  - {id: CO-557-T1, as_of: "2026-10-01", given: {ma_application_date: "2026-10-15", ma_eligibility_start_date: "2025-01-01"}, expect: "2026-07"}
  - {id: CO-557-T2, as_of: "2026-10-01", given: {ma_application_date: "2027-01-05", ma_eligibility_start_date: "2026-10-01"}, expect: "2026-10"}
  - {id: CO-557-T3, as_of: "2026-10-01", title: "OQ-55: became eligible in August, after the three-month start", given: {ma_application_date: "2026-10-15", ma_eligibility_start_date: "2026-08-20"}, expect: "2026-08"}
  - {id: CO-557-T4, as_of: "2026-10-01", title: "OQ-55: eligible only from the application month - no retroactive months", given: {ma_application_date: "2026-10-15", ma_eligibility_start_date: "2026-10-02"}, expect: "2026-10"}
