id: CO-557
name: "Medicaid: retroactive coverage start month"
identifier: ma_retroactive_coverage_start_month
kind: derived
type: month
scope: person
program: Medicaid
meaning: "The first month of the retroactive Medical Assistance coverage period under 10 CCR 2505-10 8.100.3.E.1 and 42 CFR 435.915(a): ma_retroactive_coverage_months_for_application (CO-2472) months before the month of application - three for an application made before January 1, 2027, then one for an expansion adult and two for anyone else (42 U.S.C. 1396a(a)(34) as Pub. L. 119-21 sec. 71112 amended it). Whether the person is covered in a month of the period is decided by that month's own facts (ma_magi_eligibility_status, CO-554): a month before the person became eligible is a month whose facts do not make the person eligible. Read by ma_month_is_before_coverage_period (CO-4101), which marks the months before it."
precision: "Coverage pass 7, C7-08 (2026-11-24): 8.100.3.E.1's 'or as of the date the person became eligible for Medical Assistance, whichever is later' was read from a supplied date (ma_eligibility_start_date, CO-2206, now retired): when the month containing it was later than the window's start, the window began in that month. That date is an outcome of the months' own facts (the first month in which the person met every requirement), stated a second time, and a stated date later than the facts show closed retroactive months the facts make eligible (CO-137: May 2026 ineligible_before_coverage_period with the date 2026-06-01 stated, eligible on its own facts), while an unstated date left the whole window unknown (C7-01). 42 CFR 435.915(a)(2) (S218) covers a retroactive month in which the person 'Would have been eligible for Medicaid at the time he received the services', and 42 U.S.C. 1396a(a)(34) as amended (S1706) one in which the person 'was (or upon application would have been) eligible for such assistance at the time such care and services were furnished': eligibility is a fact of each month, which CO-554 decides month by month, so the later of the two dates is the first month the facts make the person eligible, and no date is stated twice (product-owner rule, 2026-11-21: facts another record can supply are read from it, not entered twice). Coverage is stated by month. Reads ma_retroactive_coverage_months_for_application (CO-2472), whose figures are parameters (ma_retroactive_coverage_months, CO-197, and the 2027 figures)."
derived: [months_before, ma_retroactive_coverage_months_for_application, [month_of, ma_application_date]]
sources: [S217, S218, S1503, S1706]
implemented: engine
tags: [ma]
rationale: "No existing item computes a retroactive coverage start month. Written as three single-step month_before applications, matching ma_child_continuous_eligibility_end_month's (CO-556) treatment of the missing 'N months before/after' catalog pattern - see the batch report's engine-gap note. History moved from the precision note (HCPF review S-14): Vocabulary fix round (U-7): reads ma_retroactive_coverage_months (CO-197) with pattern P44 instead of a hard-coded count, so a change to the parameter changes the rule. HCPF fix round (C-11): the number of months is ma_retroactive_coverage_months_for_application (CO-2472): three for an application before January 1, 2027, then one for an expansion adult and two for anyone else (Pub. L. 119-21 sec. 71112)."
tests:
  - {id: CO-557-T1, as_of: "2026-10-01", given: {ma_application_date: "2026-10-15"}, title: "An application of 2026-10-15, before 2027: 2026-10 - 3 = 2026-07", expect: "2026-07"}
  - {id: CO-557-T2, as_of: "2027-01-05", given: {ma_application_date: "2027-01-05", ma_magi_category: {"2027-01": parent_caretaker}}, expect: "2026-11", title: "HCPF fix round (C-11): a parent's application of 2027-01-05 reaches back two months (Pub. L. 119-21 sec. 71112), to November 2026 (2027-01 - 2)"}
  - {id: CO-557-T3, as_of: "2026-10-01", given: {ma_application_date: "2026-10-15"}, title: "C7-08 (restated; was 2026-08, from a stated date the person became eligible of 2026-08-20): the window is the three months before the application month, 2026-10 - 3 = 2026-07; whether July is covered is July's own facts (CO-554)", expect: "2026-07"}
  - {id: CO-557-T4, as_of: "2026-12-01", given: {ma_application_date: "2026-12-31"}, title: "C7-08 (restated; was 2026-10, a stated date of 2026-10-02): an application on 2026-12-31, the last day before ma_retroactive_coverage_change_date (2027-01-01): three months, 2026-12 - 3 = 2026-09", expect: "2026-09"}
  - {id: CO-557-T90, as_of: "2027-01-05", given: {ma_application_date: "2027-01-05", ma_magi_category: {"2027-01": adult}}, title: "HCPF fix round (C-11): an expansion adult's application of 2027-01-05 reaches back one month (2027-01 - 1 = 2026-12)", expect: "2026-12"}
