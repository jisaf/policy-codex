id: CO-5502
name: "Medicaid MAGI: a person's gambling winnings received in the month"
identifier: ma_magi_gambling_receipts
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The person's lottery and gambling winnings received in the month (receipts that ma_magi_receipt_treatment_table, CO-5500, gives counted_winnings), every game added: the amount 10 CCR 2505-10 8.100.4.C.1.b.xiv counts in the month received for the members of the winner's household (xiv.4) and spreads over months for the winner (xiv.1-3; ma_lottery_winnings_spread_months, CO-1185)."
precision: "The month's winnings are spread together, as the ledger read the month's lottery_gambling_winnings_received before receipt records: xiv states the bands by the winnings, not by game, and no text on file says that two games won in one month are spread apart (receipts let a rule read them apart if the owner decides so). Field sweep (coverage pass 5, docs/reviews/field-sweep-magi.md): a stream of receipts (a record with no month and no date) is the payment of the months its source ran, from the month of its start_date through the month of its end_date (CO-5000), and MAGI counts the month's income (10 CCR 2505-10 § 8.100.4.C.4: \"current or previous monthly household income\"), so a stream is counted only in those months. Before, a stream was counted in every month."
derived: [sum_receipts, receipts, [all, [received_in, [month]], [any, [not, [unknown, [receipt, month]]], [all, [any, [unknown, [receipt, start_date]], ["<=", [month_of, [receipt, start_date]], [month]]], [any, [unknown, [receipt, end_date]], [">=", [month_of, [receipt, end_date]], [month]]]]], [in, [lookup, ma_magi_receipt_treatment_table, [receipt, kind]], [counted_winnings]]], [receipt, amount]]
sources: [S669, S165]
implemented: engine
tags: [ma, magi, income]
open: [OQ-592]
rationale: "Receipt records, migration phase 2: replaces lottery_gambling_winnings_received in the MAGI items (CO-502, CO-503, CO-1185, CO-1187). Nearest: the gambling and child support sums of the other method's table (ma_magi_gambling_receipts, CO-5502; ma_ssi_gambling_receipts, CO-5512; ma_ssi_child_support_receipts, CO-5513) have the same shape over a different table or treatment: MAGI and the SSI method count different money, so each method keeps its own sum rather than one sum with the table as a constant."
nearest: [CO-5512, CO-5513]
tests:
  - {id: CO-5502-T1, month: "2026-10", as_of: "2026-10-01", given: {receipts: [{kind: gambling_winnings, amount: 60000, frequency: once, month: "2026-10"}, {kind: gambling_winnings, amount: 30000, frequency: once, month: "2026-10"}, {kind: gambling_winnings, amount: 500, frequency: once, month: "2026-09"}, {kind: pension, amount: 700}]}, title: "Two games won in October added; a win in September is not October's", expect: 90000}
  - {id: CO-5502-T2, month: "2026-10", as_of: "2026-10-01", given: {receipts: [{kind: social_security, amount: 900}]}, title: "No winnings", expect: 0}
