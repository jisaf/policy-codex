id: CO-607
name: "Medicaid: SSI-related countable income"
identifier: ma_ssi_countable_income
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: This person's total countable income for SSI-related, OAP and Medicare Savings Program purposes for the month - the sum of ma_ssi_countable_earned_income and ma_ssi_countable_unearned_income - compared against the income standards of 10 CCR 2505-10 8.100.5.H and 8.100.6.
derived: ["+", ma_ssi_countable_earned_income, ma_ssi_countable_unearned_income]
sources: [S1746]
implemented: engine
tags: [ma, non_magi, income]
rationale: No existing item combines the earned and unearned countable income totals. ma_meets_ssi_income_standard (CO-609) and the MSP/Buy-In income tests all need this single figure. CO-01's p1 (gross unearned income 1420+610=2030, countable income 2010 after the $20 general exclusion) is the worked example in the batch report; either figure exceeds the $994 FBR, so ma_meets_ssi_income_standard's result is the same.
tests:
  - {id: CO-607-T1, month: "2026-10", as_of: "2026-10-01", given: {date_of_birth: "1950-01-01", wages_gross: 0, self_employment_gross_receipts: 0, ssi_in_kind_support_and_maintenance: 0, resides_in_medical_institution: true, receipts: [{kind: social_security, amount: 1420}, {kind: ssi}, {kind: pension, amount: 610}, {kind: child_support}, {kind: colorado_works_cash}, {kind: adult_financial_cash}]}, others: {}, relationships: [], expect: 2010}
  - {id: CO-607-T2, month: "2026-10", as_of: "2026-10-01", given: {date_of_birth: "1950-01-01", wages_gross: 0, self_employment_gross_receipts: 0, ssi_in_kind_support_and_maintenance: 0, resides_in_medical_institution: false, receipts: [{kind: social_security, amount: 1180}, {kind: ssi}, {kind: child_support}, {kind: colorado_works_cash}, {kind: adult_financial_cash}]}, others: {p2: {date_of_birth: "1950-01-01", resides_in_medical_institution: true, institution_entry_date: "2026-08-03"}}, relationships: [[spouse, p2]], expect: 1160}
