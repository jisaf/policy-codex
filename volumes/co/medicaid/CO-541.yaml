id: CO-541
name: "Medicaid: MAGI Parents and Caretaker Relatives category income standard"
identifier: ma_magi_income_standard_parent_caretaker
kind: derived
type: rate
scope: global
program: Medicaid
meaning: The income standard, as a decimal fraction of the federal poverty level (MAGI-equivalent), that governs the Parents and Caretaker Relatives MAGI Medical Assistance category, stated at 10 CCR 2505-10 8.100.4.G.3.
precision: 42 CFR 435.110(c) states the federal floor as a State's 1988 AFDC income standard for the applicable family size, converted to a MAGI-equivalent standard - a historical dollar figure, not a flat percentage, that no fetched document states, so no federal-floor comparison parallel to ma_magi_income_standard_child (CO-540) is modeled here; Colorado's 60% is applied directly.
assumption: Modeled as the greater of ma_income_limit_parent_caretaker_pct and itself (rather than a bare reference to that parameter) so the derivation is a rule, not a governance-flagged alias, given there is no numeric federal floor in the fetched text to compare it against.
derived: [max, ma_income_limit_parent_caretaker_pct, ma_income_limit_parent_caretaker_pct]
sources: [S203, S204]
open: [OQ-49]
implemented: engine
tags: [ma, magi, income, state_election]
rationale: "No existing item states the Parents/Caretaker-category income standard. ma_is_parent_caretaker_category (CO-547) needs it. Not the same shape as ma_magi_income_standard_child/_adult/_pregnant (CO-540, CO-542, CO-543), which compare against a real federal-floor parameter, because this category's federal floor is an AFDC-conversion this volume cannot state as a number; see OQ-49. The four MAGI income standards (CO-540, CO-541, CO-542, CO-543) share one shape (the greater of a Colorado percentage and the federal floor) and differ only in which covered group's parameters they read; each is kept as its own item so a category rule cites its own standard, per the same-shape acknowledgement governance asks for."
nearest: [CO-540, CO-542, CO-543]
