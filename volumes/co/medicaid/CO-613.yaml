id: CO-613
name: "Medicaid: is Qualified Medicare Beneficiary (QMB) eligible"
identifier: ma_qmb_eligible
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: Whether the person is eligible as a Qualified Medicare Beneficiary - entitled to Medicare Part A, countable income (self, plus spouse if living together) at or below 100% of the federal poverty level for their household size, and countable resources at or below the MSP resource limit - per 42 U.S.C. 1396d(p) and 10 CCR 2505-10 8.100.6.L.
precision: "The income limit is expressed as monthly (annual ma_poverty_guideline_table figure divided by 12) times ma_qmb_income_limit_pct, matching how ma_magi_household_income_pct_fpl (CO-504) treats the same table for the MAGI chapter. Couples compare against the couple's guideline (ma_ssi_household_size 2) per 8.100.6.L.3, whether one or both spouses apply. HCPF OM 26-025 (D-75, S571) confirms this reproduces the 2026 published QMB income limits once the $20 general income exclusion (already subtracted out of ma_ssi_countable_income by CO-606) is added back: 100% of the 2026 size-1 monthly guideline is $1,330.00, and $1,330.00 + $20 = $1,350.00, D-75's individual figure exactly. The couple figure ($1,803.33 + $20 = $1,823.33) is $0.67 short of D-75's stated $1,824 - a rounding difference the memo's own arithmetic does not explain from the fetched text alone."
derived: [all, receives_medicare_part_a, [<=, ma_ssi_countable_income, ["*", [/, [lookup, ma_poverty_guideline_table, ma_ssi_household_size], 12], ma_qmb_income_limit_pct]], [<=, ma_ssi_countable_resources, [case, [[=, ma_ssi_household_size, 2], msp_resource_limit_couple], [else, msp_resource_limit_individual]]]]
sources: [S312, S316, S571]
implemented: engine
tags: [ma, non_magi, msp, income, resources]
rationale: "No existing item states the QMB eligibility test. ma_msp_category (CO-617) needs it. CO-01's p2 (income 1180, household size 1, 1180 <= 1330 = 100% of the size-1 monthly guideline) is the worked example in the batch report. Fix round: msp_resource_limit_individual/_couple (CO-807/CO-808) are now versioned parameters per D-72 (OQ-81 resolved for resources); D-75 (S571) is added as a confirming source for the income test, which was already a percentage-of-FPL comparison rather than a supplied limit."
tests:
  - {id: CO-613-T1, as_of: "2026-10-01", month: "2026-10", given: {receives_medicare_part_a: true, ma_ssi_countable_income: 1180, ma_ssi_household_size: 1, ma_ssi_countable_resources: 3000, msp_resource_limit_individual: 9660}, expect: true}
  - {id: CO-613-T2, as_of: "2026-10-01", month: "2026-10", given: {receives_medicare_part_a: true, ma_ssi_countable_income: 1400, ma_ssi_household_size: 1, ma_ssi_countable_resources: 3000, msp_resource_limit_individual: 9660}, expect: false}
  - {id: CO-613-T3, as_of: "2026-10-01", month: "2026-10", given: {receives_medicare_part_a: false, ma_ssi_countable_income: 1000, ma_ssi_household_size: 1, ma_ssi_countable_resources: 3000, msp_resource_limit_individual: 9660}, expect: false}
  - {id: CO-613-T4, as_of: "2026-10-01", month: "2026-10", given: {receives_medicare_part_a: true, ma_ssi_countable_income: 1330, ma_ssi_household_size: 1, ma_ssi_countable_resources: 11450, msp_resource_limit_individual: 11450}, expect: true}
  - {id: CO-613-T5, as_of: "2026-10-01", month: "2026-10", given: {receives_medicare_part_a: true, ma_ssi_countable_income: 1330.01, ma_ssi_household_size: 1, ma_ssi_countable_resources: 11450, msp_resource_limit_individual: 11450}, expect: false}
