id: CO-560
name: "Medicaid: postpartum coverage end month"
identifier: ma_postpartum_coverage_end_month
kind: derived
type: month
scope: person
program: Medicaid
meaning: "The last month of a person's postpartum Medical Assistance coverage period under 42 U.S.C. 1396a(e)(16) - ma_postpartum_coverage_months months after the month the person's pregnancy ended, for a person who was eligible for and received Medical Assistance while pregnant."
precision: "The current Secretary of State text of § 8.100.4.G.5 (D-65, S640) provides coverage 'through the last day of the 12th month following the date the pregnancy ends', so the 12-month reading below is the rule's own text; the 60-day sentence was the out-of-date Cornell copy. The same 12-month period appears in the version of § 8.100.4.G.5 effective 06/30/2022 (D-77, S675); the version effective 04/14/2022 (D-78, S676) still stated 60 days. Reads ma_postpartum_coverage_months (CO-198) with pattern P44 instead of a hard-coded count, so a change to the parameter changes the rule."
derived: [months_after, ma_postpartum_coverage_months, [month_of, pregnancy_end_date]]
sources: [S675, S676, S224, S600, S607, S640]
implemented: engine
tags: [ma, magi]
rationale: "No existing item computes a postpartum coverage end month. Needed to complete the postpartum extension OQ-43 (batch 5) flagged as not yet modeled; ma_meets_citizenship_requirement (CO-509) is edited by this batch to read it (see the batch report). Written as twelve single-step month_after applications for the same engine-gap reason as ma_child_continuous_eligibility_end_month (CO-556). History moved from the precision note (HCPF review S-14): Phase 7 (OQ-52, resolved): the current Secretary of State text of § 8.100.4.G.5 (D-65, S640) provides coverage 'through the last day of the 12th month following the date the pregnancy ends', so the 12-month reading below is the rule's own text; the 60-day sentence was the out-of-date Cornell copy. The same 12-month period appears in the version of § 8.100.4.G.5 effective 06/30/2022 (D-77, S675); the version effective 04/14/2022 (D-78, S676) still stated 60 days. Vocabulary fix round (U-7): reads ma_postpartum_coverage_months (CO-198) with pattern P44 instead of a hard-coded count, so a change to the parameter changes the rule."
nearest: [CO-556]
tests:
  - {id: CO-560-T1, as_of: "2026-10-01", given: {pregnancy_end_date: "2026-03-15"}, expect: "2027-03"}
