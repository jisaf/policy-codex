sources: [S224, S175]
open: [OQ-52]
implemented: engine
tags: [ma, magi]
rationale: "No existing item computes a postpartum coverage end month. Needed to complete the postpartum extension OQ-43 (batch 5) flagged as not yet modeled; ma_meets_citizenship_requirement (CO-509) is edited by this batch to read it (see the batch report). Written as twelve single-step month_after applications for the same engine-gap reason as ma_child_continuous_eligibility_end_month (CO-556)."
