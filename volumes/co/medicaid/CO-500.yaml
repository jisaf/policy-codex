id: CO-500
name: "Medicaid: MAGI household members"
identifier: ma_magi_household_members
kind: derived
type: group of persons
scope: person-month
program: Medicaid
meaning: This person's MAGI household under 42 CFR 435.603(f) and 10 CCR 2505-10 8.100.4.E.1 - a tax filer not claimed as a dependent's household is the filer, the filer's spouse if living in the home, and everyone the filer claims as a tax dependent; a claimed tax dependent's household is the claiming filer's household (the filer, the filer's spouse living in the home, the filer's other dependents, and the dependent's own spouse living with the dependent), unless the filer claiming them is someone other than their spouse or parent, in which case (and for a true non-filer) the household is the non-filer household of that person, their spouse, their own children and stepchildren under ma_magi_child_age_limit (not a child's child or a child's spouse), and, if this person is themselves under that age, their own parents and siblings under that age living with them.
precision: "Household membership is symmetric within the case model but each person's own value of this item is their own household, per 8.100.4.E's per-applicant test. A claimed dependent who meets any exception of 435.603(f)(2)(i)-(iii) or § 8.100.4.E.5 (ma_dependent_is_routed_to_non_filer_rules, CO-1976, OQ-42 resolved) has the non-filer household. In the non-filer household only persons in this person's lives_with (CO-1925) are counted, so a parent outside the home (a non-custodial parent, or the parent living apart under E.5) is not; where lives_with is not stated, whether two persons live together cannot be determined (C6-10 (2026-11-24): living together is read from lives_with (CO-1925) as stated, required where read (decision 4 of 2026-11-23): no text on file says the persons of one Single Streamlined Application live together unless it says otherwise (10 CCR 2505-10 § 8.100.4.E.1 asks for the relationship to the tax filer 'as declared on the Single Streamlined Application' and E.1.a.ii, E.1.b.ii-iv, E.1.d for living in the home; 42 CFR 435.907, D-196, says nothing of the home), so a case that states no dwelling_id cannot be determined where MAGI asks whether two persons live together; before, a stated relationship edge was read as living together (convention rule 17's fallback), which the other programs' readers still do). 'Siblings' is read through the engine's shared_relative pattern (P43, docs/conventions.md), which finds the persons who share a parent edge with this person directly - not by re-walking the parent-then-child chain that over-included an unrelated person in this item's earlier draft (see the batch-6 report). Same-word audit SW-1/SW-2: parents and children are natural, adopted and step (the parent and stepparent roles), and siblings are siblings (CO-2609) and step_siblings (CO-2610), as 42 CFR 435.603(f)(3) and § 8.100.4.E read them (S169). Coverage review F-01: the non-filer household takes single steps from this person (this person, read as the walk over spouse edges that crosses none; a child or stepchild under the age limit, including a child of this person's spouse; and for a person under the limit, parents and siblings), so a grandchild or a child's spouse is not reached through a child, as E.1.d.iii lists only the applicant's own children. Coverage review F-02: in the filer and claimed-dependent households a spouse edge is crossed only where the spouse is in the lives_with of the person the chain has reached (E.1.a.ii 'if living in the home', E.1.b.ii and b.iv, E.4 'Married couples living together'); where no dwelling_id is stated whether the spouse lives in the home cannot be determined, as the non-filer arm reads it (C6-10). A spouse living elsewhere is in neither person's household, whether or not they file jointly. Coverage review 2, N-03: the filer and claimed-dependent households also take single steps, as F-01 made the non-filer household do; the closure over spouse, tax_filer and tax_dependent edges had reached a claimed dependent's own spouse, and anyone that spouse claims, from the filer, which E.1.a does not list. The filer's household (E.1.a.i-iii) is the filer, the filer's spouse living in the home, and the persons the filer claims or a spouse living in the home claims on a joint return (a spouse is read as filing jointly unless files_jointly_with_spouse is stated false). A claimed dependent's household (E.1.b.i-iv) is the dependent; the claiming filer; the filer's spouse living with the filer; the filer's other dependents, including those a joint-filing spouse claims; and the dependent's own spouse living with the dependent. Coverage pass 4, C4-08 (2026-11-23; time contract month-v1): the household is built for each month, and the ages in the non-filer household (E.1.d, \"children under the age of 19\") are taken in the month evaluated: a person under 19 on the first day of the month (ma_age_on_first_day_of_month, CO-4978) is under 19 on that day, and G.1 makes a person eligible for the whole month on any day of it, so a retroactive month reads the household as it was then (42 CFR 435.915(a)(2), S218: \"would have been eligible ... at the time\"). A child who turns 19 during a month is in a parent's non-filer household for that month and out of it from the next. Before, the household was built once on the determination date's ages and every month read it, so a son who turned 19 in October was out of his mother's household in a retroactive September (RETRO19, stored household CO-722). Coverage pass 5, C5-05 (2026-11-23): the claimed-dependent household (E.1.b) is the claiming filer's household; where the claimer is not a person of the case (is_claimed_by_filer_outside_case, CO-2716, with no tax_dependent edge in the case) and the person is not routed to the non-filer rules (a claimer who is a parent, outside_claimer_is_parent, CO-7052, and none of E.1.c.ii-iii or E.5), the filer, the filer's spouse and other dependents are not stated, so the household is unknown (cannot determine; decision 4) unless the claimer is declared as a person of the case with the tax_filer edge. Before, it was the person alone (and the spouse), as if the claimer had no household."
statute_override: "Federal law overrides 10 CCR 2505-10 § 8.100.3.J.2 for the MAGI groups: 42 CFR 435.603(f) (in force from January 1, 2014) builds the household from the tax filer, the filer's spouse and dependents, or the non-filer's relatives, with no exception for a recipient of Old Age Pension A, and 435.603(d) counts that member's MAGI income (the pension itself is not MAGI income), so an OAP-A recipient is a member of a MAGI household although J.2 leaves the recipient out and J.2.a's exception names SSI recipients only (coverage review 3, C3-05)."
