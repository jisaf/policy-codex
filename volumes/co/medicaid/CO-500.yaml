id: CO-500
name: "Medicaid: MAGI household members"
identifier: ma_magi_household_members
kind: derived
type: group of persons
scope: person
program: Medicaid
meaning: This person's MAGI household under 42 CFR 435.603(f) and 10 CCR 2505-10 8.100.4.E.1 - a tax filer not claimed as a dependent's household is the filer, the filer's spouse, and everyone the filer claims as a tax dependent; a claimed tax dependent's household is the claiming filer's household, unless the filer claiming them is someone other than their spouse or parent, in which case (and for a true non-filer) the household is the non-filer household of that person, their spouse, their children under ma_magi_child_age_limit, and, if this person is themselves under that age, their own parents and children under that age living with them.
precision: "Household membership is symmetric within the case model but each person's own value of this item is their own household, per 8.100.4.E's per-applicant test. 'Living with' is read from the case's stated relationships (a spouse, parent/child, or tax_filer/tax_dependent edge being stated at all is read as living together/claiming, matching this volume's snap_household_members convention of crossing a stated spouse edge unconditionally)."
assumption: "Only the 435.603(f)(2)(i) exception (claimed by someone other than a spouse or parent) is modeled for the claimed-dependent branch; the (f)(2)(ii) joint-filing and (f)(2)(iii) non-custodial-parent exceptions are not, because they need facts (living with both parents, which parent has custody) this batch does not have a clean single-hop derivation for from the relationships this volume models - see OQ-42. The non-filer branch's 'siblings under 19' is also not modeled: deriving 'shares a parent with this person' needs comparing two different persons' own parent groups, and no pattern-catalog operator lets a rule test membership between two independently-bound persons inside one filter pass (the only operator that could walk a parent-then-child chain, `reachable`, reapplies the same condition at every hop with no notion of the original subject or a hop limit, which over-includes an intermediate minor parent's own parent - see OQ-41 and the engine-gap note in the batch report). For the target household this makes no numeric difference: p5's only parent, p4, has no other children."
derived: [case, [[all, is_tax_filer, [not, [any, expects_to_be_claimed_as_dependent, [exists_related, [tax_dependent], true]]]], [reachable, [spouse, tax_filer, tax_dependent], [any, [rel, [spouse], [P]], [rel, [tax_filer], [P]]]]], [[all, [any, expects_to_be_claimed_as_dependent, [exists_related, [tax_dependent], true]], [exists_related, [tax_dependent], [rel, [spouse, child], [P]]]], [reachable, [spouse, tax_filer, tax_dependent], [any, [rel, [tax_dependent], [P]], [rel, [spouse], [P]], [rel, [tax_filer], [P]]]]], [else, [filter, [persons], [any, [in_group, [P], [reachable, [spouse, parent], [any, [rel, [spouse], [P]], [all, [rel, [parent], [P]], [<, [of, [P], age], ma_magi_child_age_limit]]]]], [all, [<, age, ma_magi_child_age_limit], [rel, [child], [P]]]]]]]
sources: [S161, S162, S163, S169]
open: [OQ-41, OQ-42]
implemented: engine
tags: [ma, magi, household]
rationale: "No existing item in this volume builds the MAGI household closure; every other batch-5/6/7 rule that reads a household (ma_magi_household_size, ma_magi_household_income, and CHP+'s cross-program reads) needs this single group. Modeled with the P36 reachable closure for the filer and claimed-dependent branches (a taxpayer's own dependents and a dependent's filer's household chain cleanly through tax_filer/tax_dependent and spouse edges with no over-inclusion risk in the case data this volume models) and with P37 filter plus P36 reachable-as-membership-test for the non-filer branch, so the under-19 upward parent hop cannot re-trigger from an already-added person the way a single reachable closure would (see the assumption above)."
tests:
  - {id: CO-500-T1, as_of: "2026-10-01", given: {is_tax_filer: true, expects_to_be_claimed_as_dependent: false, date_of_birth: "1985-01-22"}, others: {p4: {date_of_birth: "2009-04-08"}, p5: {date_of_birth: "2026-02-03"}}, relationships: [[tax_filer, p1, p4], [tax_filer, p1, p5]], expect: [p1, p4, p5]}
  - {id: CO-500-T2, as_of: "2026-10-01", given: {is_tax_filer: false, expects_to_be_claimed_as_dependent: true, date_of_birth: "2009-04-08"}, others: {p3: {is_tax_filer: true, expects_to_be_claimed_as_dependent: false, date_of_birth: "1985-01-22"}, p5: {date_of_birth: "2026-02-03"}}, relationships: [[tax_filer, p3, p1], [parent, p3, p1], [tax_filer, p3, p5]], expect: [p1, p3, p5]}
  - {id: CO-500-T3, as_of: "2026-10-01", given: {is_tax_filer: false, expects_to_be_claimed_as_dependent: true, date_of_birth: "2026-02-03"}, others: {p3: {is_tax_filer: true, expects_to_be_claimed_as_dependent: false, date_of_birth: "1985-01-22"}, p4: {date_of_birth: "2009-04-08"}}, relationships: [[tax_filer, p3, p1], [grandparent, p3, p1], [parent, p4, p1], [tax_filer, p3, p4]], expect: [p1, p4]}
  - {id: CO-500-T4, as_of: "2026-10-01", given: {is_tax_filer: false, expects_to_be_claimed_as_dependent: false, date_of_birth: "1990-05-01"}, others: {p2: {date_of_birth: "1990-05-01"}}, relationships: [[spouse, p1, p2]], expect: [p1, p2]}
  - {id: CO-500-T5, as_of: "2026-10-01", given: {is_tax_filer: false, expects_to_be_claimed_as_dependent: true, date_of_birth: "2009-04-08"}, others: {p3: {is_tax_filer: true, expects_to_be_claimed_as_dependent: false, date_of_birth: "1985-01-22"}, p5: {date_of_birth: "2026-02-03"}}, relationships: [[tax_filer, p3, p1], [parent, p3, p1], [parent, p1, p5], [tax_filer, p3, p5]], expect: [p1, p3, p5]}
