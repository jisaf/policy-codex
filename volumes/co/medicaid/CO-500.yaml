  - {id: CO-500-T2, as_of: "2026-10-01", given: {is_tax_filer: false, expects_to_be_claimed_as_dependent: true, date_of_birth: "2009-04-08"}, others: {p3: {is_tax_filer: true, expects_to_be_claimed_as_dependent: false, date_of_birth: "1985-01-22"}, p5: {date_of_birth: "2026-02-03"}}, relationships: [[tax_filer, p3, p1], [parent, p3, p1], [tax_filer, p3, p5]], expect: [p1, p3, p5]}
  - {id: CO-500-T3, as_of: "2026-10-01", given: {is_tax_filer: false, expects_to_be_claimed_as_dependent: true, date_of_birth: "2026-02-03"}, others: {p3: {is_tax_filer: true, expects_to_be_claimed_as_dependent: false, date_of_birth: "1985-01-22"}, p4: {date_of_birth: "2009-04-08"}}, relationships: [[tax_filer, p3, p1], [grandparent, p3, p1], [parent, p4, p1], [tax_filer, p3, p4]], expect: [p1, p4]}
  - {id: CO-500-T4, as_of: "2026-10-01", given: {is_tax_filer: false, expects_to_be_claimed_as_dependent: false, date_of_birth: "1990-05-01"}, others: {p2: {date_of_birth: "1990-05-01"}}, relationships: [[spouse, p1, p2]], expect: [p1, p2]}
  - {id: CO-500-T5, as_of: "2026-10-01", given: {is_tax_filer: false, expects_to_be_claimed_as_dependent: true, date_of_birth: "2009-04-08"}, others: {p3: {is_tax_filer: true, expects_to_be_claimed_as_dependent: false, date_of_birth: "1985-01-22"}, p5: {date_of_birth: "2026-02-03"}}, relationships: [[tax_filer, p3, p1], [parent, p3, p1], [parent, p1, p5], [tax_filer, p3, p5]], expect: [p1, p3, p5]}
