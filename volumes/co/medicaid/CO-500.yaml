id: CO-500
name: "Medicaid: MAGI household members"
identifier: ma_magi_household_members
kind: derived
type: group of persons
scope: person
program: Medicaid
meaning: This person's MAGI household under 42 CFR 435.603(f) and 10 CCR 2505-10 8.100.4.E.1 - a tax filer not claimed as a dependent's household is the filer, the filer's spouse if living in the home, and everyone the filer claims as a tax dependent; a claimed tax dependent's household is the claiming filer's household (the filer, the filer's spouse living in the home, the filer's other dependents, and the dependent's own spouse living with the dependent), unless the filer claiming them is someone other than their spouse or parent, in which case (and for a true non-filer) the household is the non-filer household of that person, their spouse, their own children and stepchildren under ma_magi_child_age_limit (not a child's child or a child's spouse), and, if this person is themselves under that age, their own parents and siblings under that age living with them.
precision: "Household membership is symmetric within the case model but each person's own value of this item is their own household, per 8.100.4.E's per-applicant test. A claimed dependent who meets any exception of 435.603(f)(2)(i)-(iii) or § 8.100.4.E.5 (ma_dependent_is_routed_to_non_filer_rules, CO-1976, OQ-42 resolved) has the non-filer household. In the non-filer household only persons in this person's lives_with (CO-1925) are counted, so a parent outside the home (a non-custodial parent, or the parent living apart under E.5) is not; where lives_with is not stated, 'living with' is read from the case's stated relationships (a spouse, parent/child, or tax_filer/tax_dependent edge being stated at all is read as living together/claiming, matching this volume's snap_household_members convention of crossing a stated spouse edge unconditionally). 'Siblings' is read through the engine's shared_relative pattern (P43, docs/conventions.md), which finds the persons who share a parent edge with this person directly - not by re-walking the parent-then-child chain that over-included an unrelated person in this item's earlier draft (see the batch-6 report). Same-word audit SW-1/SW-2: parents and children are natural, adopted and step (the parent and stepparent roles), and siblings are siblings (CO-2609) and step_siblings (CO-2610), as 42 CFR 435.603(f)(3) and § 8.100.4.E read them (S169). Coverage review F-01: the non-filer household takes single steps from this person (this person, read as the walk over spouse edges that crosses none; a child or stepchild under the age limit, including a child of this person's spouse; and for a person under the limit, parents and siblings), so a grandchild or a child's spouse is not reached through a child, as E.1.d.iii lists only the applicant's own children. Coverage review F-02: in the filer and claimed-dependent households a spouse edge is crossed only where the spouse is in the lives_with of the person the chain has reached (E.1.a.ii 'if living in the home', E.1.b.ii and b.iv, E.4 'Married couples living together'); where no dwelling_id is stated the spouse is read as living in the home, as the non-filer arm reads it. A spouse living elsewhere is in neither person's household, whether or not they file jointly. Coverage review 2, N-03: the filer and claimed-dependent households also take single steps, as F-01 made the non-filer household do; the closure over spouse, tax_filer and tax_dependent edges had reached a claimed dependent's own spouse, and anyone that spouse claims, from the filer, which E.1.a does not list. The filer's household (E.1.a.i-iii) is the filer, the filer's spouse living in the home, and the persons the filer claims or a spouse living in the home claims on a joint return (a spouse is read as filing jointly unless files_jointly_with_spouse is stated false). A claimed dependent's household (E.1.b.i-iv) is the dependent; the claiming filer; the filer's spouse living with the filer; the filer's other dependents, including those a joint-filing spouse claims; and the dependent's own spouse living with the dependent. The ages in the non-filer household (E.1.d, a child under 19) are taken on the determination date: E.1 builds the household as declared, and G.1's whole month governs eligibility, not who is counted in the household; a child who turns 19 during the month leaves the non-filer household of a parent in that month."
derived: [case, [[all, [any, is_tax_filer, [exists_related, [tax_filer], true]], [not, expects_to_be_claimed_as_dependent]], [filter, [persons], [any, [in_group, [P], [reachable, [spouse], false]], [all, [rel, [spouse], [P]], [otherwise, [in_group, [P], lives_with], true]], [rel, [tax_filer], [P]], [otherwise, [has_relative_in, [tax_dependent], [filter, [persons], [all, [rel, [spouse], [P]], [otherwise, [in_group, [P], lives_with], true], [otherwise, [of, [P], files_jointly_with_spouse], true]]]], false]]]], [[all, expects_to_be_claimed_as_dependent, [not, ma_dependent_is_routed_to_non_filer_rules]], [filter, [persons], [any, [in_group, [P], [reachable, [spouse], false]], [rel, [tax_dependent], [P]], [otherwise, [has_relative_in, [spouse], [filter, [otherwise, [of, [P], lives_with], [persons]], [rel, [tax_dependent], [P]]]], false], [otherwise, [has_relative_in, [tax_dependent], [filter, [persons], [any, [rel, [tax_dependent], [P]], [all, [otherwise, [has_relative_in, [spouse], [filter, [otherwise, [of, [P], lives_with], [persons]], [rel, [tax_dependent], [P]]]], false], [otherwise, [of, [P], files_jointly_with_spouse], true]]]]], false], [all, [rel, [spouse], [P]], [otherwise, [in_group, [P], lives_with], true]]]]], [else, [filter, [persons], [all, [any, [in_group, [P], [reachable, [spouse], false]], [rel, [spouse], [P]], [all, [rel, [parent, stepparent], [P]], [<, [of, [P], age], ma_magi_child_age_limit]], [all, [<, [of, [P], age], ma_magi_child_age_limit], [otherwise, [has_relative_in, [child], [filter, [persons], [rel, [spouse], [P]]]], false]], [all, [<, age, ma_magi_child_age_limit], [rel, [child, stepchild], [P]]], [all, [<, age, ma_magi_child_age_limit], [any, [in_group, [P], siblings], [in_group, [P], step_siblings]], [<, [of, [P], age], ma_magi_child_age_limit]]], [otherwise, [in_group, [P], lives_with], true]]]]]
sources: [S161, S162, S163, S169, S170, S1226, S1227]
implemented: engine
tags: [ma, magi, household]
rationale: "No existing item in this volume builds the MAGI household closure; every other batch-5/6/7 rule that reads a household (ma_magi_household_size, ma_magi_household_income, and CHP+'s cross-program reads) needs this single group. Modeled (coverage review 2, N-03) with single steps from this person for the filer and claimed-dependent branches, P37 filter with has_relative_in (P45) for the claiming filer's spouse and other dependents (the P36 reachable closure first used there over-included a dependent's spouse and that spouse's dependents) and with P37 filter plus P36 reachable-as-membership-test for the non-filer branch's spouse/parent/child terms and P43 shared_relative for its sibling term, so the under-19 upward parent hop cannot re-trigger from an already-added person the way a single reachable closure over parent/child edges would (see OQ-41, batch 5, now resolved by the P43 pattern this batch added). Dual-entry audit 3.3 (audit fix round): reads expects_to_be_claimed_as_dependent (CO-076) alone, now derived from the tax_dependent relationship, in place of the any of the supplied fact and the edge. Dual-entry audit 3.3 (audit fix round): a person who claims a dependent of the case (a tax_filer edge) is read as a tax filer, so the edge and is_tax_filer (CO-075) cannot give two answers."
