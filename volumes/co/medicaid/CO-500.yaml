id: CO-500
name: "Medicaid: MAGI household members"
identifier: ma_magi_household_members
kind: derived
type: group of persons
scope: person
program: Medicaid
meaning: This person's MAGI household under 42 CFR 435.603(f) and 10 CCR 2505-10 8.100.4.E.1 - a tax filer not claimed as a dependent's household is the filer, the filer's spouse, and everyone the filer claims as a tax dependent; a claimed tax dependent's household is the claiming filer's household, unless the filer claiming them is someone other than their spouse or parent, in which case (and for a true non-filer) the household is the non-filer household of that person, their spouse, their children under ma_magi_child_age_limit, and, if this person is themselves under that age, their own parents and siblings under that age living with them.
precision: "Household membership is symmetric within the case model but each person's own value of this item is their own household, per 8.100.4.E's per-applicant test. A claimed dependent who meets any exception of 435.603(f)(2)(i)-(iii) or § 8.100.4.E.5 (ma_dependent_is_routed_to_non_filer_rules, CO-1976, OQ-42 resolved) has the non-filer household. In the non-filer household only persons in this person's lives_with (CO-1925) are counted, so a parent outside the home (a non-custodial parent, or the parent living apart under E.5) is not; where lives_with is not stated, 'living with' is read from the case's stated relationships (a spouse, parent/child, or tax_filer/tax_dependent edge being stated at all is read as living together/claiming, matching this volume's snap_household_members convention of crossing a stated spouse edge unconditionally). 'Siblings' is read through the engine's shared_relative pattern (P43, docs/conventions.md), which finds the persons who share a parent edge with this person directly - not by re-walking the parent-then-child chain that over-included an unrelated person in this item's earlier draft (see the batch-6 report)."
derived: [case, [[all, is_tax_filer, [not, [any, expects_to_be_claimed_as_dependent, [exists_related, [tax_dependent], true]]]], [reachable, [spouse, tax_filer, tax_dependent], [any, [rel, [spouse], [P]], [rel, [tax_filer], [P]]]]], [[all, [any, expects_to_be_claimed_as_dependent, [exists_related, [tax_dependent], true]], [not, ma_dependent_is_routed_to_non_filer_rules]], [reachable, [spouse, tax_filer, tax_dependent], [any, [rel, [tax_dependent], [P]], [rel, [spouse], [P]], [rel, [tax_filer], [P]]]]], [else, [filter, [persons], [all, [any, [in_group, [P], [reachable, [spouse, parent], [any, [rel, [spouse], [P]], [all, [rel, [parent], [P]], [<, [of, [P], age], ma_magi_child_age_limit]]]]], [all, [<, age, ma_magi_child_age_limit], [rel, [child], [P]]], [all, [<, age, ma_magi_child_age_limit], [in_group, [P], [shared_relative, parent]], [<, [of, [P], age], ma_magi_child_age_limit]]], [otherwise, [in_group, [P], lives_with], true]]]]]
sources: [S161, S162, S163, S169, S1226, S1227]
implemented: engine
tags: [ma, magi, household]
rationale: "No existing item in this volume builds the MAGI household closure; every other batch-5/6/7 rule that reads a household (ma_magi_household_size, ma_magi_household_income, and CHP+'s cross-program reads) needs this single group. Modeled with the P36 reachable closure for the filer and claimed-dependent branches (a taxpayer's own dependents and a dependent's filer's household chain cleanly through tax_filer/tax_dependent and spouse edges with no over-inclusion risk in the case data this volume models) and with P37 filter plus P36 reachable-as-membership-test for the non-filer branch's spouse/parent/child terms and P43 shared_relative for its sibling term, so the under-19 upward parent hop cannot re-trigger from an already-added person the way a single reachable closure over parent/child edges would (see OQ-41, batch 5, now resolved by the P43 pattern this batch added)."
