id: CO-1164
name: "Medicaid: meets the HCBS waiver's age criteria"
identifier: ma_hcbs_waiver_age_criteria_met
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether the person's age (and, for CES, marital status) fits the target group of the HCBS waiver the Case Management Agency designated (meets_hcbs_waiver_target_group, CO-821), per 10 CCR 2505-10 § 8.7101: Children's Extensive Support - unmarried and under ma_hcbs_ces_age_limit; Children's Habilitation Residential Program - under ma_hcbs_chrp_age_limit; Children with Complex Health Needs - under ma_hcbs_cwchn_age_limit; Brain Injury - ma_hcbs_bi_min_age or older; Community Mental Health Supports, Elderly, Blind and Disabled, Complementary and Integrative Health, Supported Living Services and Developmental Disabilities - ma_hcbs_adult_min_age or older. False when no waiver is designated."
precision: "EBD's age follows the subgroup the Case Management Agency finds (ma_hcbs_ebd_subgroup, CO-2264): aged, ma_aged_age or older; physically disabled or blind, ma_hcbs_adult_min_age or older (§ 8.7101.G.2.c.i bounds the subgroup at 64 but reclassifies a participant who reaches ma_aged_age as aged without a break, so no upper bound is applied); HIV/AIDS, ma_hcbs_adult_min_age or older. The diagnoses, settings and BI's injury-before-65 condition are ma_meets_hcbs_waiver_condition_criteria (CO-2270) and the level of care CO-1178 (OQ-210, resolved). Coverage pass 4, non-MAGI N4-9 (docs/operators.md, \"Ages in a month\"): the age is taken in the month evaluated, not on the determination date: an \"under N\" test on the first day of the month (ma_age_on_first_day_of_month, CO-4978), an \"N or older\" test on the last day (ma_age_on_last_day_of_month, CO-5402), and a test that excludes the person from what is favorable on the other day. Per month: its reader (ma_hcbs_waiver_eligible, CO-653) is per month. Pattern sweep, non-MAGI Medicaid (docs/reviews/pattern-sweep-nonmagi.md, P2, P3): whether the person is married is read from a spouse of the case or the marital status as stated, required where read (decision 4 of 2026-11-23); before, is_married (CO-930) read a person with neither stated as not married."
derived: [case, [["=", meets_hcbs_waiver_target_group, "ces"], [all, [<, ma_age_on_first_day_of_month, ma_hcbs_ces_age_limit], [not, [any, [otherwise, [exists_related, [spouse], true], false], ["=", marital_status, married]]]]], [["=", meets_hcbs_waiver_target_group, "chrp"], [<, ma_age_on_first_day_of_month, ma_hcbs_chrp_age_limit]], [["=", meets_hcbs_waiver_target_group, "cwchn"], [<, ma_age_on_first_day_of_month, ma_hcbs_cwchn_age_limit]], [["=", meets_hcbs_waiver_target_group, "bi"], [">=", ma_age_on_last_day_of_month, ma_hcbs_bi_min_age]], [["=", meets_hcbs_waiver_target_group, "ebd"], [case, [["=", ma_hcbs_ebd_subgroup, "aged"], [">=", ma_age_on_last_day_of_month, ma_aged_age]], [[in, ma_hcbs_ebd_subgroup, [physically_disabled_or_blind, hiv_aids]], [">=", ma_age_on_last_day_of_month, ma_hcbs_adult_min_age]], [else, false]]], [[in, meets_hcbs_waiver_target_group, [cmhs, cih, sls, dd]], [">=", ma_age_on_last_day_of_month, ma_hcbs_adult_min_age]], [else, false]]
sources: [S628, S629, S630, S631, S632, S633, S634, S635, S636, S637, S1512]
implemented: engine
tags: [ma, hcbs, age]
rationale: "meets_hcbs_waiver_target_group (CO-821) carries the Case Management Agency's designation but nothing checked it against the age bounds § 8.7101 states for each waiver, so a 40-year-old designated for a children's waiver was HCBS-eligible. ma_hcbs_waiver_eligible (CO-653) now reads it. Dual-entry audit 3.4: the CES under-18 test reads is_married (CO-930), so a spouse edge counts as well as marital_status."
tests:
  - {id: CO-1164-T1, month: "2026-10", as_of: "2026-10-01", title: "CES, age 11, single", given: {meets_hcbs_waiver_target_group: ces, date_of_birth: "2015-01-01", marital_status: single}, expect: true}
  - {id: CO-1164-T2, month: "2026-10", as_of: "2026-10-01", title: "CES, age 18", given: {meets_hcbs_waiver_target_group: ces, date_of_birth: "2008-01-01", marital_status: single}, expect: false}
  - {id: CO-1164-T3, month: "2026-10", as_of: "2026-10-01", title: "CHRP, age 20", given: {meets_hcbs_waiver_target_group: chrp, date_of_birth: "2006-01-01"}, expect: true}
  - {id: CO-1164-T4, month: "2026-10", as_of: "2026-10-01", title: "CwCHN, age 19", given: {meets_hcbs_waiver_target_group: cwchn, date_of_birth: "2007-01-01"}, expect: false}
  - {id: CO-1164-T5, month: "2026-10", as_of: "2026-10-01", title: "BI, age 16", given: {meets_hcbs_waiver_target_group: bi, date_of_birth: "2010-01-01"}, expect: true}
  - {id: CO-1164-T6, month: "2026-10", as_of: "2026-10-01", title: "EBD, age 17", given: {meets_hcbs_waiver_target_group: ebd, ma_hcbs_ebd_subgroup: physically_disabled_or_blind, date_of_birth: "2009-01-01"}, expect: false}
  - {id: CO-1164-T9, month: "2026-10", as_of: "2026-10-01", title: "OQ-210: EBD aged subgroup at 60", given: {meets_hcbs_waiver_target_group: ebd, ma_hcbs_ebd_subgroup: aged, date_of_birth: "1966-01-01"}, expect: false}
  - {id: CO-1164-T10, month: "2026-10", as_of: "2026-10-01", title: "OQ-210: EBD aged subgroup at 70", given: {meets_hcbs_waiver_target_group: ebd, ma_hcbs_ebd_subgroup: aged, date_of_birth: "1956-01-01"}, expect: true}
  - {id: CO-1164-T11, month: "2026-10", as_of: "2026-10-01", title: "OQ-210: EBD physically disabled at 40", given: {meets_hcbs_waiver_target_group: ebd, ma_hcbs_ebd_subgroup: physically_disabled_or_blind, date_of_birth: "1986-01-01"}, expect: true}
  - {id: CO-1164-T7, month: "2026-10", as_of: "2026-10-01", given: {meets_hcbs_waiver_target_group: none, date_of_birth: "1970-01-01"}, expect: false}
  - {id: CO-1164-T8, month: "2026-10", as_of: "2026-10-01", title: "DD, age 30", given: {meets_hcbs_waiver_target_group: dd, date_of_birth: "1996-01-01"}, expect: true}
  - {id: CO-1164-T12, month: "2026-11", as_of: "2026-12-01", title: "N4-9: EBD aged, 65 on 2026-11-20: 65 on the last day of November, the age criterion is met in November", given: {meets_hcbs_waiver_target_group: ebd, ma_hcbs_ebd_subgroup: aged, date_of_birth: "1961-11-20"}, expect: true}
  - {id: CO-1164-T13, month: "2026-10", as_of: "2026-12-01", title: "N4-9: 64 on the last day of October: not met in October", given: {meets_hcbs_waiver_target_group: ebd, ma_hcbs_ebd_subgroup: aged, date_of_birth: "1961-11-20"}, expect: false}
