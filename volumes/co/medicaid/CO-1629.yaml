id: CO-1629
name: "Medical Assistance: age verification is pending"
identifier: ma_age_verification_is_pending
kind: derived
type: yes/no
scope: person-month
program: Medicaid
role: outcome
meaning: Whether Medical Assistance (and CHP+, which reads this item) requires verification of the person's questionable age and it has not been provided.
derived: [all, ma_requires_verification_of_age, [not, age_is_verified]]
sources: [S842, S863]
implemented: engine
tags: [verification, ma]
rationale: "Review U-1: the count items held this test as an anonymous arm, so no outcome told a worker which document was outstanding and for whom; the count now sums this item."
tests:
  - {id: CO-1629-T1, month: "2026-10", as_of: "2026-10-01", given: {ma_requires_verification_of_age: true, age_verified_by_electronic_data_source: false, age_verification_document_received: false}, expect: true}
  - {id: CO-1629-T2, month: "2026-10", as_of: "2026-10-01", given: {ma_requires_verification_of_age: false}, expect: false}
