  - {id: CO-555-T4, month: "2026-10", as_of: "2026-10-01", given: {date_of_birth: "2014-04-08", ma_is_child_category: false, ma_continuous_eligibility_program: ssi_mandatory, is_colorado_resident: true}, title: "HCPF fix round (C-7): child of 12 whose period began in SSI Mandatory", expect: true}
