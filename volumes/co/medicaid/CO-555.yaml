id: CO-555
name: "Medicaid: continuous eligibility applies"
identifier: ma_continuous_eligibility_applies
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether continuous eligibility under 10 CCR 2505-10 8.100.3.Q and 42 CFR 435.926 applies to the person this month - under 19, currently eligible for the Children's MAGI category on the plain category test (ma_is_child_category), and a Colorado resident. HCPF fix round (C-7): a period that began in SSI Mandatory or long-term care services, or when the child left Foster Care Medicaid to live with relatives, reunite with parents or under guardianship, also opens one, and the child is categorized in the MAGI Children's category for the rest of it (§ 8.100.3.Q.2.b.i, c.i, Q.3; ma_continuous_eligibility_program, CO-2446). Periods that began in the Children with Disabilities Buy-In, Pickle, Disabled Adult Child or Limited Family Planning stay in those programs (ma_child_is_in_non_magi_continuous_eligibility_period, CO-2448)."
precision: This item states the age, category and residency conditions of 8.100.3.Q.1 and 435.926(b) and the residency exception of 8.100.3.Q.1.b.iv; the other exceptions end a period already open, so ma_child_is_in_continuous_eligibility_period (CO-561) tests them month by month through ma_continuous_eligibility_exception_applies (CO-2205; OQ-53, resolved). This item is a per-month test (whether CE would open or continue to apply in the month it is asked about); ma_child_is_in_continuous_eligibility_period (CO-561) reads it [at] the period's start month specifically - not the current month - so that the category test that opens the period is not re-run, and defeated, by the very income change 435.926(d)/8.100.3.Q.1.a says the period protects against. The age condition reads ma_is_under_child_age_or_turns_nineteen_this_month (CO-564), the test the Children category itself uses, so the category and continuous eligibility agree in the month the child turns 19. Colorado's section 1115 authority for longer continuous eligibility (children up to age three, people leaving incarceration) was never implemented and expired June 30, 2026 (CMS letter of June 30, 2026, S1713), so § 8.100.3.Q's 12-month period is the whole rule (HCPF review C-10).
derived: [all, ma_is_under_child_age_or_turns_nineteen_this_month, [any, ma_is_child_category, [in, [otherwise, ma_continuous_eligibility_program, magi], [ssi_mandatory, long_term_care, foster_care_exit]]], ma_meets_residency]
sources: [S215, S216, S1724, S1713]
implemented: engine
tags: [ma, magi, age]
rationale: "No existing item states whether continuous eligibility applies. ma_child_continuous_eligibility_end_month (CO-556) needs it as the gate on whether an end month is even meaningful for this person. Reads ma_is_child_category (CO-545), not ma_magi_category (CO-551), because CO-551 was edited in the fix round to itself read ma_child_is_in_continuous_eligibility_period (CO-561), which reads this item [at] the period's start month; reading ma_magi_category here would make the two items mutually recursive. History moved from the precision note (HCPF review S-14): Vocabulary fix round (U-14): the age condition reads ma_is_under_child_age_or_turns_nineteen_this_month (CO-564), the test the Children category itself uses, so the category and continuous eligibility agree in the month the child turns 19. Precision history (moved from precision, engineering follow-up pass task 5): (CO-561, fix round)."
