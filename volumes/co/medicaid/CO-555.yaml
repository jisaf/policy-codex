id: CO-555
name: "Medicaid: continuous eligibility applies"
identifier: ma_continuous_eligibility_applies
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: Whether continuous eligibility under 10 CCR 2505-10 8.100.3.Q and 42 CFR 435.926 applies to the person this month - under 19, currently eligible for the Children's MAGI category on the plain category test (ma_is_child_category), and a Colorado resident.
precision: "This batch models only the age, category, and residency conditions of 8.100.3.Q.1 and 435.926(b), and the residency exception of 8.100.3.Q.1.b.iv/435.926(d)(3); the remaining exceptions (death, becoming an inmate, leaving the required household, being unable to be located, requesting withdrawal, agency error or fraud) are not modeled because this volume has no supplied fact for any of them - see OQ-53. This item is a per-month test (whether CE would open or continue to apply in the month it is asked about); ma_child_is_in_continuous_eligibility_period (CO-561, fix round) reads it [at] the period's start month specifically - not the current month - so that the category test that opens the period is not re-run, and defeated, by the very income change 435.926(d)/8.100.3.Q.1.a says the period protects against."
derived: [all, [<, age, ma_magi_child_age_limit], ma_is_child_category, ma_meets_residency]
sources: [S215, S216]
open: [OQ-53]
implemented: engine
tags: [ma, magi, age]
rationale: "No existing item states whether continuous eligibility applies. ma_child_continuous_eligibility_end_month (CO-556) needs it as the gate on whether an end month is even meaningful for this person. Reads ma_is_child_category (CO-545), not ma_magi_category (CO-551), because CO-551 was edited in the fix round to itself read ma_child_is_in_continuous_eligibility_period (CO-561), which reads this item [at] the period's start month; reading ma_magi_category here would make the two items mutually recursive."
tests:
  - {id: CO-555-T1, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "2009-04-08", ma_is_child_category: true, ma_meets_residency: true}, expect: true}
  - {id: CO-555-T2, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "2009-04-08", ma_is_child_category: false, ma_meets_residency: true}, expect: false}
  - {id: CO-555-T3, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "1990-01-01", ma_is_child_category: false, ma_meets_residency: true}, expect: false}
