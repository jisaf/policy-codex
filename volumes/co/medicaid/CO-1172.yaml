  - {id: CO-1172-T10, as_of: "2026-10-01", title: "American Indian born in Canada (iv.4)", given: {immigration_status: lawful_permanent_resident, has_military_connection: false, is_american_indian_born_in_canada_or_tribal_member: true}, expect: true}
