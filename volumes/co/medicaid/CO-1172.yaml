id: CO-1172
name: "Medicaid: is exempt from the five-year rule"
identifier: ma_is_five_year_bar_exempt
kind: derived
type: yes/no
scope: person
program: Medicaid
meaning: "Whether a qualified non-citizen is exempt from Medical Assistance's five-year rule under 10 CCR 2505-10 § 8.100.3.G.1.g.iv-v: a refugee, asylee, Cuban or Haitian entrant or Compact of Free Association migrant (iv.9-10, v.1-2, \"on any date\"); an honorably discharged veteran or a person on active duty, or the spouse or dependent child of one (iv.2-3); a Lawful Permanent Resident who has worked federal_qualifying_quarters_threshold work quarters (iv.1); or a person in one of the other iv categories (iv.4-8, 11, and a refugee or asylee who has adjusted to LPR, iv.9-10)."
precision: "Refugees and asylees are exempt whether or not they have adjusted to LPR: § 8.100.3.G.1.g.iv opens with \"Be a Legal Permanent Resident\" but lists persons \"granted asylum\" and \"refugee\" (iv.9-10) and trafficking victims (iv.11), and 8 U.S.C. 1613(b)(1), which iv cites, exempts refugees and asylees as such; reading iv as excluding an unadjusted refugee would leave refugees and asylees under no adult category at all (OQ-213). The 40-quarters exemption is read for a Lawful Permanent Resident only, as iv states it; qualifying_quarters (CO-004) counts quarters credited from a parent's or spouse's work as 8 U.S.C. 1612(b)(2)(B), which iv.1 cites, allows. The veteran and active-duty exemption is read for any qualified non-citizen, as the item it replaces did. This item does not itself test that the person is a qualified non-citizen; ma_meets_citizenship_requirement (CO-509) reads it only for one. The 8 U.S.C. 1613(b) categories (refugee, asylee, Cuban or Haitian entrant, COFA migrant, veteran or active duty, and a refugee or asylee adjusted to LPR or an Amerasian immigrant) are read from the shared is_exempt_from_five_year_bar (CO-1725), so Medicaid and the cash programs cannot disagree on them; ma_five_year_bar_exempt_category (CO-1170) now carries only the categories of iv that 1613(b) does not list. From October 1, 2026 an exemption admits a qualified non-citizen to full Medical Assistance only if the person is also in a 42 U.S.C. 1396b(v)(5)(B) status (ma_is_in_federal_payment_status_category, CO-2400): ma_meets_citizenship_requirement (CO-509) reads both. An exempt refugee or asylee who has not adjusted to lawful permanent residence is then no longer admitted as an adult (HCPF review B-1); this item still states the exemption, which keeps meaning for the five-year rule once the person adjusts."
