tags: [ma, immigration]
rationale: "B-2 of the phase 7 review: CO-509 exempted only veterans from the five-year rule, so refugees, asylees, Cuban/Haitian entrants and COFA migrants - whom § 8.100.3.G.1.g.iv-v exempt - were emergency-only for five years, and the new 40-quarters exemption was missing. No existing Medicaid item states the exemptions; SNAP's waiting-period exemption (CO-306) reads a different statute and is not reused (vocabulary review R-4). History moved from the precision note (HCPF review S-14): Vocabulary fix round (R-4): the 8 U.S.C. 1613(b) categories (refugee, asylee, Cuban or Haitian entrant, COFA migrant, veteran or active duty, and a refugee or asylee adjusted to LPR or an Amerasian immigrant) are read from the shared is_exempt_from_five_year_bar (CO-1725), so Medicaid and the cash programs cannot disagree on them; ma_five_year_bar_exempt_category (CO-1170) now carries only the categories of iv that 1613(b) does not list. From October 1, 2026 an exemption admits a qualified non-citizen to full Medical Assistance only if the person is also in a 42 U.S.C. 1396b(v)(5)(B) status (ma_is_in_federal_payment_status_category, CO-2400): ma_meets_citizenship_requirement (CO-509) reads both. An exempt refugee or asylee who has not adjusted to lawful permanent residence is then no longer admitted as an adult (HCPF review B-1); this item still states the exemption, which keeps meaning for the five-year rule once the person adjusts."
