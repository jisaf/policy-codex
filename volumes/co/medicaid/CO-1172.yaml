id: CO-1172
name: "Medicaid: is exempt from the five-year rule"
identifier: ma_is_five_year_bar_exempt
kind: derived
type: yes/no
scope: person
program: Medicaid
meaning: "Whether a qualified non-citizen is exempt from Medical Assistance's five-year rule under 10 CCR 2505-10 § 8.100.3.G.1.g.iv-v and viii: a refugee, asylee, Cuban or Haitian entrant or Compact of Free Association migrant (iv.9-10, v.1-2, \"on any date\"); an honorably discharged veteran or a person on active duty, or the spouse or dependent child of one (iv.2-3); a Lawful Permanent Resident who has worked 40 work quarters (iv.1), is a Hmong or Highland Lao veteran (iv.6), or is an Iraqi or Afghan special immigrant who arrived on or after December 26, 2007 and adjusted to LPR (iv.7-8); an American Indian born in Canada or a tribal member (iv.4); a victim of a severe form of trafficking (iv.11); or an Afghan humanitarian parolee through the later of March 31, 2023 and the end of parole (viii)."
precision: "Refugees and asylees are exempt whether or not they have adjusted to LPR: § 8.100.3.G.1.g.iv opens with \"Be a Legal Permanent Resident\" but lists persons \"granted asylum\" and \"refugee\" (iv.9-10) and trafficking victims (iv.11), and 8 U.S.C. 1613(b)(1), which iv cites, exempts refugees and asylees as such; reading iv as excluding an unadjusted refugee would leave refugees and asylees under no adult category at all (OQ-213). The 40-quarters exemption is read for a Lawful Permanent Resident only, as iv states it; qualifying_quarters (CO-004) counts quarters credited from a parent's or spouse's work as 8 U.S.C. 1612(b)(2)(B), which iv.1 cites, allows. The veteran and active-duty exemption is read for any qualified non-citizen, as the item it replaces did. This item does not itself test that the person is a qualified non-citizen; ma_meets_citizenship_requirement (CO-509) reads it only for one. The 8 U.S.C. 1613(b) categories (refugee, asylee, Cuban or Haitian entrant, COFA migrant, veteran or active duty, and a refugee or asylee adjusted to LPR or an Amerasian immigrant) are read from the shared is_exempt_from_five_year_bar (CO-1725), so Medicaid and the cash programs cannot disagree on them; the categories of iv that 1613(b) does not list are read here from immigration_status and the history facts (CO-2700 to CO-2703). From October 1, 2026 an exemption admits a qualified non-citizen to full Medical Assistance only if the person is also in a 42 U.S.C. 1396b(v)(5)(B) status (ma_is_in_federal_payment_status_category, CO-2400): ma_meets_citizenship_requirement (CO-509) reads both. An exempt refugee or asylee who has not adjusted to lawful permanent residence is then no longer admitted as an adult (HCPF review B-1); this item still states the exemption, which keeps meaning for the five-year rule once the person adjusts. The Hmong veteran (iv.6) and special immigrant (iv.7-8) categories are read for a Lawful Permanent Resident, as iv.6 and iv.7-8 state; the American Indian born in Canada (iv.4) and the trafficking victim (iv.11) are read whatever the status, like the refugee and asylee (OQ-213). viii is read from parole_end_date (CO-2703) and ma_afghan_humanitarian_parolee_exemption_end_date (CO-2705); from October 1, 2026 an Afghan parolee who has not adjusted is outside 1396b(v)(5)(B), so the exemption no longer admits the person to full coverage (CO-509)."
derived: [any, is_exempt_from_five_year_bar, ["=", immigration_status, trafficking_victim], [otherwise, is_american_indian_born_in_canada_or_tribal_member, false], [all, ["=", immigration_status, lawful_permanent_resident], [any, [">=", qualifying_quarters, ma_five_year_bar_exempt_work_quarters], [otherwise, is_hmong_or_highland_lao_veteran, false], [all, ["=", [otherwise, status_before_lpr_adjustment, none], iraqi_afghan_special_immigrant], [">=", us_entry_date, iraqi_afghan_special_immigrant_entry_start_date]]]], [all, ["=", immigration_status, afghan_humanitarian_parolee], [any, ["<=", [det_date], ma_afghan_humanitarian_parolee_exemption_end_date], ["<=", [det_date], parole_end_date]]]]
sources: [S656, S657, S176, S1700, S1905]
open: [OQ-213]
implemented: engine
tags: [ma, immigration]
rationale: "B-2 of the phase 7 review: CO-509 exempted only veterans from the five-year rule, so refugees, asylees, Cuban/Haitian entrants and COFA migrants - whom § 8.100.3.G.1.g.iv-v exempt - were emergency-only for five years, and the new 40-quarters exemption was missing. No existing Medicaid item states the exemptions; SNAP's waiting-period exemption (CO-306) reads a different statute and is not reused (vocabulary review R-4). History moved from the precision note (HCPF review S-14): Vocabulary fix round (R-4): the 8 U.S.C. 1613(b) categories (refugee, asylee, Cuban or Haitian entrant, COFA migrant, veteran or active duty, and a refugee or asylee adjusted to LPR or an Amerasian immigrant) are read from the shared is_exempt_from_five_year_bar (CO-1725), so Medicaid and the cash programs cannot disagree on them; ma_five_year_bar_exempt_category (CO-1170) now carries only the categories of iv that 1613(b) does not list. From October 1, 2026 an exemption admits a qualified non-citizen to full Medical Assistance only if the person is also in a 42 U.S.C. 1396b(v)(5)(B) status (ma_is_in_federal_payment_status_category, CO-2400): ma_meets_citizenship_requirement (CO-509) reads both. An exempt refugee or asylee who has not adjusted to lawful permanent residence is then no longer admitted as an adult (HCPF review B-1); this item still states the exemption, which keeps meaning for the five-year rule once the person adjusts.  OQ-44 fix (product-owner decision of 2026-11-21; docs/reviews/audit-dual-entry.md 3.1; same-word audit SW-18): reads the one immigration_status fact (CO-002), which replaced citizenship_status, lawful_presence_status (CO-084), federal_five_year_bar_exempt_category (CO-1724) and ma_five_year_bar_exempt_category (CO-1170). iv.4, iv.6, iv.7-8 and iv.11 had been the options of CO-1170; viii (Afghan humanitarian parolees) was not modeled."
