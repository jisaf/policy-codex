id: CO-1172
name: "Medicaid: is exempt from the five-year rule"
identifier: ma_is_five_year_bar_exempt
kind: derived
type: yes/no
scope: person
program: Medicaid
meaning: "Whether a qualified non-citizen is exempt from Medical Assistance's five-year rule under 10 CCR 2505-10 § 8.100.3.G.1.g.iv-v: a refugee, asylee, Cuban or Haitian entrant or Compact of Free Association migrant (iv.9-10, v.1-2, \"on any date\"); an honorably discharged veteran or a person on active duty, or the spouse or dependent child of one (iv.2-3); a Lawful Permanent Resident who has worked 40 work quarters (iv.1); or a person in one of the other iv categories (iv.4-8, 11, and a refugee or asylee who has adjusted to LPR, iv.9-10)."
precision: "Refugees and asylees are exempt whether or not they have adjusted to LPR: § 8.100.3.G.1.g.iv opens with \"Be a Legal Permanent Resident\" but lists persons \"granted asylum\" and \"refugee\" (iv.9-10) and trafficking victims (iv.11), and 8 U.S.C. 1613(b)(1), which iv cites, exempts refugees and asylees as such; reading iv as excluding an unadjusted refugee would leave refugees and asylees under no adult category at all (OQ-213). The 40-quarters exemption is read for a Lawful Permanent Resident only, as iv states it; qualifying_quarters (CO-004) counts quarters credited from a parent's or spouse's work as 8 U.S.C. 1612(b)(2)(B), which iv.1 cites, allows. The veteran and active-duty exemption is read for any qualified non-citizen, as the item it replaces did. This item does not itself test that the person is a qualified non-citizen; ma_meets_citizenship_requirement (CO-509) reads it only for one."
derived: [any, [in, citizenship_status, [refugee, asylee, cuban_haitian_entrant, compact_of_free_association_migrant]], is_veteran_or_active_duty, [not, [=, ma_five_year_bar_exempt_category, "none"]], [all, [=, citizenship_status, lawful_permanent_resident], [">=", qualifying_quarters, ma_five_year_bar_exempt_work_quarters]]]
sources: [S656, S657, S176]
open: [OQ-213]
implemented: engine
tags: [ma, immigration]
rationale: "B-2 of the phase 7 review: CO-509 exempted only veterans from the five-year rule, so refugees, asylees, Cuban/Haitian entrants and COFA migrants - whom § 8.100.3.G.1.g.iv-v exempt - were emergency-only for five years, and the new 40-quarters exemption was missing. No existing Medicaid item states the exemptions; SNAP's waiting-period exemption (CO-306) reads a different statute and is not reused (vocabulary review R-4)."
tests:
  - {id: CO-1172-T1, as_of: "2026-10-01", title: "COFA migrant with status since 2024", given: {citizenship_status: compact_of_free_association_migrant, is_veteran_or_active_duty: false, ma_five_year_bar_exempt_category: "none"}, expect: true}
  - {id: CO-1172-T2, as_of: "2026-10-01", title: "LPR since 2023 with 40 work quarters", given: {citizenship_status: lawful_permanent_resident, is_veteran_or_active_duty: false, ma_five_year_bar_exempt_category: "none", qualifying_quarters: 40}, expect: true}
  - {id: CO-1172-T3, as_of: "2026-10-01", title: "LPR since 2023 with 12 work quarters", given: {citizenship_status: lawful_permanent_resident, is_veteran_or_active_duty: false, ma_five_year_bar_exempt_category: "none", qualifying_quarters: 12}, expect: false}
  - {id: CO-1172-T4, as_of: "2026-10-01", title: "Refugee who has not adjusted to LPR", given: {citizenship_status: refugee}, expect: true}
  - {id: CO-1172-T5, as_of: "2026-10-01", title: "LPR admitted as an Afghan special immigrant", given: {citizenship_status: lawful_permanent_resident, is_veteran_or_active_duty: false, ma_five_year_bar_exempt_category: iraqi_or_afghan_special_immigrant_adjusted_to_lpr}, expect: true}
  - {id: CO-1172-T6, as_of: "2026-10-01", title: "Veteran", given: {citizenship_status: other_qualified_non_citizen, is_veteran_or_active_duty: true}, expect: true}
