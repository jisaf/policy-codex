id: CO-1400
name: "Medicaid: requires verification of immigration status"
identifier: ma_requires_verification_of_immigration_status
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether the person's declared immigration status must be verified for Medical Assistance through VLP: every non-citizen declaring a lawful status, except children and pregnant persons, whose coverage under Cover All Coloradans does not turn on status."
derived: [all, claims_lawful_immigration_status, [not, ma_is_under_child_age_or_turns_nineteen_this_month], [not, is_pregnant]]
sources: [S852, S840, S870]
implemented: engine
tags: [verification, ma, immigration]
open: [OQ-308]
rationale: No existing item states this Medical Assistance verification requirement; the phase-9 chapter needs one item per element so the person's pending counts and status can be derived.
tests:
  - {id: CO-1400-T1, month: "2026-10", as_of: "2026-10-01", given: {citizenship_status: lawful_permanent_resident, ma_is_under_child_age_or_turns_nineteen_this_month: false, is_pregnant: false}, expect: true}
  - {id: CO-1400-T2, month: "2026-10", as_of: "2026-10-01", given: {citizenship_status: lawful_permanent_resident, ma_is_under_child_age_or_turns_nineteen_this_month: true}, expect: false}
  - {id: CO-1400-T3, month: "2026-10", as_of: "2026-10-01", given: {citizenship_status: undocumented}, expect: false}
