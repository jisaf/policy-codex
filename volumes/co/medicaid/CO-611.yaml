id: CO-611
name: "Medicaid: is SSI-related eligible"
identifier: ma_is_ssi_related_eligible
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: Whether the person is eligible for Medical Assistance under the SSI-related Aged, Blind and Disabled category - an SSI recipient, or aged/blind/disabled and meeting both the SSI income and resource standards, plus residency and citizenship - per 10 CCR 2505-10 8.100.6.C and 8.100.5.
precision: "A person receiving SSI is categorically eligible under 8.100.6.C.1.a-b without a separate income/resource test this item performs (SSA has already determined it); a person not receiving SSI must independently meet ma_is_aged_blind_or_disabled_in_month (CO-5201: a disabled person not in a month before the disability onset, § 8.100.5.C.4.b) and both standards, and is not eligible when Medical Assistance is denied for failing to pursue potential resources or income or refusing to release the patient payment (ma_abd_denied_for_noncooperation, CO-4886; § 8.100.5.E.6, § 8.100.7.V.2.c). The SSA's determination governs an SSI recipient's Medicaid, so neither gate reaches the receives_ssi arm, as in ma_ssi_related_category (CO-612). § 8.100.3.G.1.c's general requirement not to be a patient in an institution for mental diseases between 21 and 64 is applied (ma_meets_imd_requirement, CO-1179). Coverage pass 6, non-MAGI F6-5 (docs/reviews/coverage6-medicaid-nonmagi.md): the SSI branch reads ma_receives_ssi_in_month (CO-7351), SSI from the month of the original SSI eligibility date (10 CCR 2505-10 § 8.100.6.C.1.a, C.7, S5030), so a retroactive month before an SSI award is judged by the SSI-related tests of that month; before, receives_ssi (the award as of the determination date) made every month an SSI month."
derived: [all, ma_meets_residency_in_month, ma_meets_citizenship_requirement_in_month, [any, ma_receives_ssi_in_month, [all, [not, ma_abd_denied_for_noncooperation], ma_is_aged_blind_or_disabled_in_month, ma_meets_ssi_income_standard, ma_meets_ssi_resource_standard]], ma_meets_imd_requirement]
sources: [S659, S303, S3621, S3622, S3623, S5030]
implemented: engine
tags: [ma, non_magi, income, resources, age, disability]
rationale: "No existing item combines SSI recipiency or the independent aged/blind/disabled-plus-both-standards path with residency and citizenship into one SSI-related eligibility test. ma_ssi_related_category (CO-612) needs it. Reuses is_colorado_resident (CO-505) and ma_meets_citizenship_requirement (CO-509) from the MAGI chapter rather than restating Colorado's single residency/citizenship rule a second time for the non-MAGI chapter. History moved from the precision note (HCPF review S-14): Phase 7 fix round (S-5): § 8.100.3.G.1.c's general requirement not to be a patient in an institution for mental diseases between 21 and 64 is applied (ma_meets_imd_requirement, CO-1179). Coverage pass 3 C3-2: the pass-2 non-cooperation and onset gates (NM-28, NM-30) had been put in CO-612 only, so ma_has_full_coverage_category (CO-1176) still read a denied person or a month before the onset as SSI-related eligible; both gates now sit here, where every reader of SSI-related eligibility meets them."
nearest: [CO-505, CO-509]
