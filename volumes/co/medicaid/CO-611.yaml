  - {id: CO-611-T2, as_of: "2026-10-01", month: "2026-10", given: {state_of_residence: "CO", citizenship_status: citizen, lawful_presence_status: unknown, date_of_birth: "1947-03-12", is_pregnant: false, receives_ssi: false, ma_is_aged_blind_or_disabled: true, ma_meets_ssi_income_standard: false, ma_meets_ssi_resource_standard: true}, expect: false}
