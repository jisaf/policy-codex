id: CO-2277
name: "Medicaid: ineligible child allocation"
identifier: ma_ssi_ineligible_child_allocation
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The total Ineligible Child Allocation for the person's SSI-related household (the person and a spouse living with the person): for each child of either who is an unemancipated child in the home and is not applying for or eligible for SSI, one half of the SSI individual Federal Benefit Rate, reduced by the child's own gross income (10 CCR 2505-10 § 8.100.5.H.3.a.i, H.2.a-b)."
precision: "Duplicate-paths audit D-M4 (P1, fixed): the child must be in the home (H.3.a.i: 'available for each ineligible child in the home'): one of the persons who live with the person (lives_with, the same home, a temporary absence notwithstanding; 20 CFR 416.1167(a)), or, where the household states no homes, a child the parent edge joins who does not reside in a medical institution (the volume's convention for living together); the amount is the one per-child statement ma_ssi_ineligible_child_allocation_generated (CO-6050), which the parental deeming allocation (CO-4633) reads too, with the same test of the home. Before, this item tested no home, so an applicant's child living away in a medical institution generated a $497 allocation that CO-4633 did not give. The child's own income is its earned income and the unearned income the SSI method counts, child support included in full, since the one-third reduction of § 8.100.5.H.4.c 'does not apply to ineligible children when calculating the ineligible child allocation disregard'. A child is in the home through the parent edge, the volume's convention for living together. Pattern sweep, non-MAGI Medicaid (docs/reviews/pattern-sweep-nonmagi.md, P1, P2, P3): the household of the month is ma_ssi_lives_with_in_month (CO-7505): those living in the person's home, and a spouse, parent or child who lives elsewhere through the month the two ceased to live together (20 CFR 416.1165(g)(4), S5122; 416.1167(a)(1), S5120; § 8.100.7.C.2.b, S1759), a person who died through the month of death ((g)(3), S5122; 416.1163(f)(4), S5121); a person who lives in a facility (its dwelling_id the facility's) is a member through the month of entry (institution_entry_date) and not from the month after (§ 8.100.7.A.1, S3406: from 'the first day of the month following the month during which a child under the age of 18 ceases to live with his or her parent(s)'; 416.1167(a)(1)), while a person away for a stay the person returns from keeps the home's dwelling_id and stays a member (a temporary absence, 416.1167(a); duplicate-paths D-M4). Living together is read as stated, required where read (decision 4 of 2026-11-23; convention rule 17): no text on file says the persons of one application live together unless it says otherwise. A child not yet born in the month is not a child in the home (ma_is_ssi_unemancipated_child, CO-2275). Before, a child whose home was not stated was read as in the home unless the child lived in a medical institution, in every month."
derived: [sum, [filter, [persons], [all, [has_relative_in, [child], ma_ssi_couple_members], [in_group, [P], ma_ssi_lives_with_in_month], [of, [P], ma_is_ssi_unemancipated_child], [not, [of, [P], ma_is_applying_for_or_eligible_for_ssi]]]], [of, [P], ma_ssi_ineligible_child_allocation_generated]]
sources: [S1506, S1955, S3001, S5120, S5122]
implemented: engine
tags: [ma, non_magi, income]
open: [OQ-1122]
rationale: "Final verification pass 3, pattern sweep (2026-11-22): the income read now includes lottery and gambling winnings received in the month (§ 8.100.5.F.5.i, S3001; an unstated receipt is 0). OQ-83: the Ineligible Child Allocation of § 8.100.5.H.3.a.i was not modeled. Same-word audit SW-6: the SSI method treats as spouses two unrelated persons living together who lead people to believe they are married (20 CFR 416.1806(a)(3), S1955), so the holds_out_as_spouse_with role is read beside the legal spouse. Coverage pass 3 C3-1: sums over ma_ssi_couple_members (CO-3626), which keeps a newly admitted spouse in the couple through the admission month (§ 8.100.7.C.2.b) except for the institutionalized spouse's own test (42 U.S.C. 1396r-5(b)(1)); it had filtered on resides_in_medical_institution, which split the couple's incomes from the admission day while the size and resources still read them together. Receipt records, migration phase 2: the child's own income is its wages and self-employment earnings, the unearned receipts the SSI method counts (ma_ssi_unearned_receipts, CO-5511), its child support in full (ma_ssi_child_support_receipts, CO-5513) and its winnings (CO-5512). Before receipt records it was the sum of the scalar facts, which held the exempt receipts (General Assistance, foster care payments, educational grants) inside the other non-taxable income and left out Colorado Works and Adult Financial cash; the receipts read each kind by the SSI method's table, so the child's exempt receipts do not reduce the allocation (20 CFR 416.1163(b), which takes the child's income after the exclusions of 416.1161(a), S3413). Earned-income records, step E1 (Medicaid and CHP+): earned income is the earnings records the SSI method's counting table counts (ma_ssi_gross_earned_income, CO-5171), replacing wages_gross plus ma_self_employment_net_earnings."
tests:
  # Pattern sweep (P2, decision 4; convention rule 17): the home is stated (dwelling_id), required where read; the story has one home.
  - {id: CO-2277-T1, month: "2026-10", as_of: "2026-10-01", given: {dwelling_id: h1, date_of_birth: "1980-01-01", resides_in_medical_institution: false}, title: "Couple with two children of 8 and 12, one with $100 of child support", others: {p2: {dwelling_id: h1, date_of_birth: "1980-01-01", resides_in_medical_institution: false}, p3: {dwelling_id: h1, date_of_birth: "2018-01-01", ma_is_applying_for_or_eligible_for_ssi: false, receipts: [{kind: ssi}], earnings: []}, p4: {dwelling_id: h1, date_of_birth: "2014-01-01", ma_is_applying_for_or_eligible_for_ssi: false, receipts: [{kind: ssi}, {kind: child_support, amount: 100}], earnings: []}}, relationships: [[spouse, p1, p2], [parent, p1, p3], [parent, p1, p4]], expect: 894}
  - {id: CO-2277-T2, month: "2026-10", as_of: "2026-10-01", given: {resides_in_medical_institution: false}, title: "The only child receives SSI: no allocation", others: {p3: {date_of_birth: "2018-01-01", ma_is_applying_for_or_eligible_for_ssi: true}}, relationships: [[parent, p3]], expect: 0}
  - {id: CO-2277-T3, month: "2026-10", as_of: "2026-10-01", given: {date_of_birth: "1980-01-01", resides_in_medical_institution: false}, title: "No children", others: {p2: {date_of_birth: "1980-01-01", resides_in_medical_institution: false}}, relationships: [[spouse, p1, p2]], expect: 0}
  # Pattern sweep (P1, P3): the child's home is the institution since 2026-01-15 (stated: required where read for a month, CO-7505); October follows the month of entry, so the child is not in the home.
  - {id: CO-2277-T4, month: "2026-10", as_of: "2026-10-01", title: "Duplicate-paths audit D-M4 (household MA-child-allocation-institution): the couple's child of 10 lives in a medical institution (another home): not in the home (H.3.a.i), no allocation (it was 497); the disabled child of 8 applies for SSI: none", given: {date_of_birth: "1955-01-01", dwelling_id: h1, residence_setting_type: private_dwelling, receipts: [], earnings: [], ma_is_applying_for_or_eligible_for_ssi: true, resides_in_medical_institution: false, is_emancipated_minor: false}, others: {p2: {date_of_birth: "1960-01-01", dwelling_id: h1, receipts: [], earnings: [{kind: wages, amount: 1500}], ma_is_applying_for_or_eligible_for_ssi: false, resides_in_medical_institution: false, is_emancipated_minor: false}, c: {date_of_birth: "2016-01-01", dwelling_id: h2, residence_setting_type: hospital, institution_entry_date: "2026-01-15", receipts: [], earnings: [], ma_is_applying_for_or_eligible_for_ssi: false, is_emancipated_minor: false, resides_in_medical_institution: true}, d: {date_of_birth: "2018-01-01", dwelling_id: h1, receipts: [], earnings: [], ma_is_applying_for_or_eligible_for_ssi: true, is_emancipated_minor: false, resides_in_medical_institution: false}}, relationships: [[spouse, p1, p2], [parent, p1, c], [parent, p2, c], [parent, p1, d], [parent, p2, d]], expect: 0}
  - {id: CO-2277-T5, month: "2026-10", as_of: "2026-10-01", title: "Duplicate-paths audit D-M4: the same child at home (h1), in hospital for a stay it returns from: in the home (a temporary absence, 20 CFR 416.1167(a)): 497", given: {date_of_birth: "1955-01-01", dwelling_id: h1, receipts: [], earnings: [], ma_is_applying_for_or_eligible_for_ssi: true, resides_in_medical_institution: false, is_emancipated_minor: false}, others: {p2: {date_of_birth: "1960-01-01", dwelling_id: h1, receipts: [], earnings: [{kind: wages, amount: 1500}], ma_is_applying_for_or_eligible_for_ssi: false, resides_in_medical_institution: false, is_emancipated_minor: false}, c: {date_of_birth: "2016-01-01", dwelling_id: h1, receipts: [], earnings: [], ma_is_applying_for_or_eligible_for_ssi: false, is_emancipated_minor: false, resides_in_medical_institution: true}}, relationships: [[spouse, p1, p2], [parent, p1, c], [parent, p2, c]], expect: 497}
  # Pattern sweep P3: a child (p3) born 2026-10-03, determined 2026-11-12. August: not yet born, so no ineligible child in the home: 0.
  # October: born; one half of the 2026 FBR (994 / 2 = 497) less the child's own income (none): 497.
  - {id: CO-2277-T6, month: "2026-08", as_of: "2026-11-12", title: "Pattern sweep: a child not yet born gives no allocation", given: {ma_ssi_couple_members: [p1], dwelling_id: h1, residence_setting_type: private_dwelling}, others: {p3: {date_of_birth: "2026-10-03", dwelling_id: h1, residence_setting_type: private_dwelling, ma_is_applying_for_or_eligible_for_ssi: false, ma_ssi_ineligible_child_allocation_generated: 497}}, relationships: [[parent, p1, p3]], expect: 0}
  - {id: CO-2277-T7, month: "2026-10", as_of: "2026-11-12", title: "Pattern sweep: from the month of birth the child gives the allocation", given: {ma_ssi_couple_members: [p1], dwelling_id: h1, residence_setting_type: private_dwelling}, others: {p3: {date_of_birth: "2026-10-03", dwelling_id: h1, residence_setting_type: private_dwelling, ma_is_applying_for_or_eligible_for_ssi: false, ma_ssi_ineligible_child_allocation_generated: 497}}, relationships: [[parent, p1, p3]], expect: 497}
