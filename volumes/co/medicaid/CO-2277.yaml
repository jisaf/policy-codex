id: CO-2277
name: "Medicaid: ineligible child allocation"
identifier: ma_ssi_ineligible_child_allocation
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The total Ineligible Child Allocation for the person's SSI-related household (the person and a spouse living with the person): for each child of either who is an unemancipated child in the home and is not applying for or eligible for SSI, one half of the SSI individual Federal Benefit Rate, reduced by the child's own gross income (10 CCR 2505-10 § 8.100.5.H.3.a.i, H.2.a-b)."
precision: "The child's own income is gross earned and unearned income, child support included in full, since the one-third reduction of § 8.100.5.H.4.c 'does not apply to ineligible children when calculating the ineligible child allocation disregard'. A child is in the home through the parent edge, the volume's convention for living together."
derived: [sum, [filter, [persons], [all, [has_relative_in, [child], [reachable, [spouse], [all, [not, resides_in_medical_institution], [not, [of, [P], resides_in_medical_institution]]]]], [of, [P], ma_is_ssi_unemancipated_child], [not, [of, [P], ma_is_applying_for_or_eligible_for_ssi]]]], [max, 0, ["-", ["*", ma_ssi_ineligible_child_allocation_rate, ssi_federal_benefit_rate_individual], [+, [of, [P], wages_gross], [of, [P], ma_self_employment_net_earnings], [of, [P], social_security_income], [of, [P], pension_income], [of, [P], unemployment_income], [of, [P], other_unearned_income_taxable], [of, [P], other_unearned_income_nontaxable], [of, [P], tax_exempt_interest], [of, [P], child_support_received]]]]]
sources: [S1506]
implemented: engine
tags: [ma, non_magi, income]
rationale: "OQ-83: the Ineligible Child Allocation of § 8.100.5.H.3.a.i was not modeled."
tests:
  - {id: CO-2277-T1, as_of: "2026-10-01", month: "2026-10", title: "Couple with two children of 8 and 12, one with $100 of child support", parameters: {ssi_federal_benefit_rate_individual: 994}, given: {date_of_birth: "1980-01-01", resides_in_medical_institution: false}, others: {p2: {date_of_birth: "1980-01-01", resides_in_medical_institution: false}, p3: {date_of_birth: "2018-01-01", ma_is_applying_for_or_eligible_for_ssi: false, wages_gross: 0, self_employment_net_earnings_for_tax: 0, self_employment_gross_receipts: 0, social_security_income: 0, pension_income: 0, unemployment_income: 0, other_unearned_income_taxable: 0, other_unearned_income_nontaxable: 0, tax_exempt_interest: 0, child_support_received: 0}, p4: {date_of_birth: "2014-01-01", ma_is_applying_for_or_eligible_for_ssi: false, wages_gross: 0, self_employment_net_earnings_for_tax: 0, self_employment_gross_receipts: 0, social_security_income: 0, pension_income: 0, unemployment_income: 0, other_unearned_income_taxable: 0, other_unearned_income_nontaxable: 0, tax_exempt_interest: 0, child_support_received: 100}}, relationships: [[spouse, p1, p2], [parent, p1, p3], [parent, p1, p4]], expect: 894}
  - {id: CO-2277-T2, as_of: "2026-10-01", month: "2026-10", title: "The only child receives SSI: no allocation", parameters: {ssi_federal_benefit_rate_individual: 994}, given: {resides_in_medical_institution: false}, others: {p3: {date_of_birth: "2018-01-01", ma_is_applying_for_or_eligible_for_ssi: true}}, relationships: [[parent, p3]], expect: 0}
  - {id: CO-2277-T3, as_of: "2026-10-01", month: "2026-10", title: "No children", parameters: {ssi_federal_benefit_rate_individual: 994}, given: {date_of_birth: "1980-01-01", resides_in_medical_institution: false}, others: {p2: {date_of_birth: "1980-01-01", resides_in_medical_institution: false}}, relationships: [[spouse, p1, p2]], expect: 0}
