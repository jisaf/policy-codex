id: CO-2277
name: "Medicaid: ineligible child allocation"
identifier: ma_ssi_ineligible_child_allocation
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The total Ineligible Child Allocation for the person's SSI-related household (the person and a spouse living with the person): for each child of either who is an unemancipated child in the home and is not applying for or eligible for SSI, one half of the SSI individual Federal Benefit Rate, reduced by the child's own gross income (10 CCR 2505-10 § 8.100.5.H.3.a.i, H.2.a-b)."
precision: "The child's own income is gross earned and unearned income, child support included in full, since the one-third reduction of § 8.100.5.H.4.c 'does not apply to ineligible children when calculating the ineligible child allocation disregard'. A child is in the home through the parent edge, the volume's convention for living together."
derived: [sum, [filter, [persons], [all, [has_relative_in, [child], ma_ssi_couple_members], [of, [P], ma_is_ssi_unemancipated_child], [not, [of, [P], ma_is_applying_for_or_eligible_for_ssi]]]], [max, 0, ["-", ["*", ma_ssi_ineligible_child_allocation_rate, ssi_federal_benefit_rate_individual], [+, [of, [P], wages_gross], [of, [P], ma_self_employment_net_earnings], [of, [P], social_security_income], [of, [P], pension_income], [of, [P], unemployment_income], [of, [P], other_unearned_income_taxable], [of, [P], other_unearned_income_nontaxable], [of, [P], tax_exempt_interest], [of, [P], child_support_received], [otherwise, [of, [P], lottery_gambling_winnings_received], 0]]]]]
sources: [S1506, S1955, S3001]
implemented: engine
tags: [ma, non_magi, income]
rationale: "Final verification pass 3, pattern sweep (2026-11-22): the income read now includes lottery and gambling winnings received in the month (§ 8.100.5.F.5.i, S3001; an unstated receipt is 0). OQ-83: the Ineligible Child Allocation of § 8.100.5.H.3.a.i was not modeled. Same-word audit SW-6: the SSI method treats as spouses two unrelated persons living together who lead people to believe they are married (20 CFR 416.1806(a)(3), S1955), so the holds_out_as_spouse_with role is read beside the legal spouse. Coverage pass 3 C3-1: sums over ma_ssi_couple_members (CO-3626), which keeps a newly admitted spouse in the couple through the admission month (§ 8.100.7.C.2.b) except for the institutionalized spouse's own test (42 U.S.C. 1396r-5(b)(1)); it had filtered on resides_in_medical_institution, which split the couple's incomes from the admission day while the size and resources still read them together."
