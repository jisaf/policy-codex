id: CO-1715
name: "Medicaid: Working Adults with Disabilities countable income"
identifier: ma_wawd_countable_income
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The applicant's own countable income for the month for the Buy-In Program for Working Adults with Disabilities (10 CCR 2505-10 8.100.6.P.1.b, 'only the applicant's income will be considered'): earned income (gross wages and net earnings from self-employment) less the ssi_earned_income_exclusion earned income exclusion and any part of the ssi_general_income_exclusion general income exclusion unearned income did not use, and then one half, plus unearned income (Social Security, pension, unemployment, other unearned income and in-kind support and maintenance) less the ssi_general_income_exclusion general income exclusion."
precision: "The SSI-method disregards of 8.100.5.H.4 applied to the applicant alone, without a living-together spouse's income. The unused part of the ssi_general_income_exclusion general income exclusion is carried to earned income, as § 8.100.5.H (which P.1.b points to) and 20 CFR 416.1124(c)(12) direct and as ma_ssi_countable_earned_income (CO-605) does. Final verification pass 3, pattern sweep (income methods): lottery and gambling winnings in the month received count as unearned income (§ 8.100.5.F.5.i, S3001) unless the hardship exemption is granted (CO-2222), and in-kind support and maintenance is not counted for an unemancipated child of 16 to 20 (§ 8.100.5.H.1.b). Coverage review NM-7, NM-8: the unearned income the SSI method excludes (ma_ssi_excluded_unearned_income, CO-2470: tax refunds, loans, educational and energy assistance, federally excluded payments, retroactive SSI and Title II lump sums, foster care payments and income set aside under a plan for self-support) is left out, and the 20 CFR 416.1112(c) exclusions incorporated by § 8.100.5.H.4.e apply to the applicant's earnings: impairment-related work expenses (not blind) before the one half, blind work expenses (blind) and earned income set aside under an approved plan after it. A Buy-In applicant meets the disability criteria and is under 65 (ma_wawd_eligible), so (c)(6)'s conditions are read from blindness alone."
derived: ["+", [max, 0, ["-", ["*", [max, 0, ["-", [max, 0, ["-", ["+", wages_gross, ma_self_employment_net_earnings], ["+", ssi_earned_income_exclusion, [max, 0, ["-", ssi_general_income_exclusion, [max, 0, ["-", ["+", social_security_income, pension_income, unemployment_income, other_unearned_income_taxable, other_unearned_income_nontaxable, tax_exempt_interest, [case, [[otherwise, ma_is_ssi_unemancipated_child, false], 0], [else, ssi_in_kind_support_and_maintenance]], [case, [[otherwise, ma_lottery_winnings_hardship_exemption_granted, false], 0], [else, [otherwise, lottery_gambling_winnings_received, 0]]]], [otherwise, ma_ssi_excluded_unearned_income, 0]]]]]]]], [case, [[not, [otherwise, is_blind, false]], [otherwise, impairment_related_work_expenses_paid, 0]], [else, 0]]]], ssi_earned_income_disregard_rate], [+, [case, [[otherwise, is_blind, false], [otherwise, blind_work_expenses_paid, 0]], [else, 0]], [otherwise, pass_set_aside_earned_income, 0]]]], [max, 0, ["-", [max, 0, ["-", ["+", social_security_income, pension_income, unemployment_income, other_unearned_income_taxable, other_unearned_income_nontaxable, tax_exempt_interest, [case, [[otherwise, ma_is_ssi_unemancipated_child, false], 0], [else, ssi_in_kind_support_and_maintenance]], [case, [[otherwise, ma_lottery_winnings_hardship_exemption_granted, false], 0], [else, [otherwise, lottery_gambling_winnings_received, 0]]]], [otherwise, ma_ssi_excluded_unearned_income, 0]]], ssi_general_income_exclusion]]]
sources: [S317, S607, S1154, S308, S3001, S1506, S3412, S3404]
implemented: engine
tags: [ma, non_magi, buy_in, income]
rationale: "Final verification pass 3, pattern sweep (2026-11-22): lottery and gambling winnings (§ 8.100.5.F.5.i) were left out, and in-kind support and maintenance was counted for an unemancipated child (§ 8.100.5.H.1.b). Vocabulary fix round (U-11, R-1): ma_wawd_eligible (CO-618) and ma_wawd_premium (CO-619) computed the same income inline six times, and from wages only; one item now states it, with self-employment. History moved from the precision note (HCPF review S-14): HCPF fix round (S-8): the unused part of the $20 general income exclusion is carried to earned income, as § 8.100.5.H (which P.1.b points to) and 20 CFR 416.1124(c)(12) direct and as ma_ssi_countable_earned_income (CO-605) does."
