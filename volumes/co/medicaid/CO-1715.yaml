id: CO-1715
name: "Medicaid: Working Adults with Disabilities countable income"
identifier: ma_wawd_countable_income
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The applicant's own countable income for the month for the Buy-In Program for Working Adults with Disabilities (10 CCR 2505-10 8.100.6.P.1.b, 'only the applicant's income will be considered'): earned income (gross wages and net earnings from self-employment) less the ssi_earned_income_exclusion earned income exclusion and any part of the ssi_general_income_exclusion general income exclusion unearned income did not use, and then one half, plus unearned income (the receipts the SSI method's counting table counts, ma_ssi_unearned_receipts, with in-kind support and maintenance and gambling winnings) less the ssi_general_income_exclusion general income exclusion."
precision: "The SSI-method disregards of 8.100.5.H.4 applied to the applicant alone, without a living-together spouse's income. The unused part of the ssi_general_income_exclusion general income exclusion is carried to earned income, as § 8.100.5.H (which P.1.b points to) and 20 CFR 416.1124(c)(12) direct and as ma_ssi_countable_earned_income (CO-605) does. Final verification pass 3, pattern sweep (income methods): lottery and gambling winnings in the month received count as unearned income (§ 8.100.5.F.5.i, S3001) unless the hardship exemption is granted (CO-2222), and in-kind support and maintenance is not counted for an unemancipated child of 16 to 20 (§ 8.100.5.H.1.b). Coverage review NM-7, NM-8: the unearned income the SSI method excludes (tax refunds, loans, educational and energy assistance, federally excluded payments, retroactive SSI and Title II lump sums, foster care payments and income set aside under a plan for self-support) is left out: the applicant's unearned income is ma_ssi_unearned_receipts (CO-5511), read through the SSI method's counting table (CO-5510), and the 20 CFR 416.1112(c) exclusions incorporated by § 8.100.5.H.4.e apply to the applicant's earnings: impairment-related work expenses (not blind) before the one half, blind work expenses (blind) and earned income set aside under an approved plan after it. A Buy-In applicant meets the disability criteria (ma_wawd_eligible, CO-618), so (c)(6)'s conditions are read from blindness and age: (c)(6) and (c)(8) apply \"if you are disabled (but not blind) and under age 65\" and \"if you are blind and under age 65\", and P.1.a sets no upper age for the Buy-In, so the exclusions stop at ma_aged_age, as in CO-4628 and CO-4629 (coverage pass 3 C3-7; the SSI-before-65 continuation is not stated). The earned income 20 CFR 416.1112(c)(2)-(3) and § 8.100.5.F.6.z exclude (ma_ssi_excluded_earned_income, CO-2471: student, infrequent, Census) comes off the applicant's earnings before the $65 (coverage pass 3 C3-6). Coverage pass 4, non-MAGI N4-9 (docs/operators.md, \"Ages in a month\"): the age is taken in the month evaluated, not on the determination date: an \"under N\" test on the first day of the month (ma_age_on_first_day_of_month, CO-4978), an \"N or older\" test on the last day (ma_age_on_last_day_of_month, CO-5402), and a test that excludes the person from what is favorable on the other day. Coverage pass 6, non-MAGI F6-10 (decision 4 of 2026-11-23: each supplied fact states once whether it is required or what its rule-given default is; readers do not invent defaults): the person's own blindness (is_blind) is read as stated, no longer as false when unstated (blind work expenses and the impairment-related work expenses turn on it, 20 CFR 416.1112(c)(6), (c)(8)). The lottery hardship exemption keeps the default its fact declares. Blindness is asked only where it decides an amount: impairment-related work expenses or blind work expenses stated above 0 (with none, there is nothing for 20 CFR 416.1112(c)(6) or (c)(8) to exclude)."
