rationale: "Final verification pass 3, pattern sweep (2026-11-22): lottery and gambling winnings (§ 8.100.5.F.5.i) were left out, and in-kind support and maintenance was counted for an unemancipated child (§ 8.100.5.H.1.b). Vocabulary fix round (U-11, R-1): ma_wawd_eligible (CO-618) and ma_wawd_premium (CO-619) computed the same income inline six times, and from wages only; one item now states it, with self-employment. History moved from the precision note (HCPF review S-14): HCPF fix round (S-8): the unused part of the $20 general income exclusion is carried to earned income, as § 8.100.5.H (which P.1.b points to) and 20 CFR 416.1124(c)(12) direct and as ma_ssi_countable_earned_income (CO-605) does. Coverage pass 3 C3-6, C3-7: the student, infrequent and Census exclusions (CO-2471) are subtracted, and impairment-related and blind work expenses and PASS stop at 65. Receipt records, migration phase 2 (2026-11-23): the applicant's unearned income is ma_ssi_unearned_receipts (CO-5511) and the winnings ma_ssi_gambling_receipts (CO-5512), from the receipts, instead of the scalar facts less ma_ssi_excluded_unearned_income (CO-2470). Earned-income records, step E1 (Medicaid and CHP+): earned income is the earnings records the SSI method's counting table counts (ma_ssi_gross_earned_income, CO-5171), replacing wages_gross plus ma_self_employment_net_earnings; the plan-for-self-support set-aside is the records' pass_set_aside (ma_ssi_pass_set_aside_earned_income, CO-5176)."
