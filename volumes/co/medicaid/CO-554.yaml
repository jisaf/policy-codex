id: CO-554
name: "Medicaid: MAGI eligibility status"
identifier: ma_magi_eligibility_status
kind: derived
type: one of
options: [eligible, ineligible_before_coverage_period, incarceration_limited, emergency_only, pending_community_engagement, ineligible_community_engagement, ineligible_income, ineligible_residency, ineligible_institution, ineligible_no_category]
scope: person-month
program: Medicaid
role: outcome
meaning: The reason code for the person's MAGI Medical Assistance eligibility this month - full eligibility, emergency-Medicaid-only, pending because an applicant who meets the Adults group criteria has not shown that the community engagement requirement is met and the notice of noncompliance is due or its 30-day showing period is running (42 CFR 435.558(a)), ineligible because the person meets the Adults group criteria but not the community engagement requirement that conditions that group from January 1, 2027 (42 CFR 435.119(d)) and the showing period has ended, ineligible because household income exceeds every category the person could otherwise fit, ineligible because the person is not a Colorado resident, or ineligible because the person fits no MAGI category's demographic requirements at all; or, for a month the application cannot cover - before the person's birth, or before the month of application and outside a requested retroactive period (ma_month_is_before_coverage_period, CO-4101) - ineligible_before_coverage_period. An inmate of a public institution who meets a MAGI category, is in a pregnancy coverage period, or is a child in a continuous eligibility period is enrolled with benefits limited to an inpatient stay of 24 hours or longer in a medical institution and, in the 90 days before release, Reentry Demonstration Initiative services (incarceration_limited; 10 CCR 2505-10 § 8.100.3.G.1.b.ii, S3361; for a continuous eligibility child, § 8.100.3.Q.1.b.ii.1).
precision: "A month the application cannot cover (CO-4101) is checked first: whether the person would have met a category then does not make the month eligible (10 CCR 2505-10 § 8.100.3.E.1-2). Where whether the person is in a locked-in pregnancy coverage period is unknown (a retroactive request with no pregnancy_start_date, F2-1), a person who meets the Pregnant Women category this month and is not limited to emergency Medicaid is eligible without it. Residency is checked next because it is a threshold requirement of every category; a child in an open continuous eligibility period (ma_child_is_in_continuous_eligibility_period, CO-561) is reported eligible next, per 42 CFR 435.926(d)/10 CCR 2505-10 8.100.3.Q.1.a's 'without regard to changes in income' rule (the phase-3 review's C-4(a) finding) - checked ahead of emergency-only and the income/no-category branches so a CE period is not defeated by a later citizenship or income change; emergency-only is checked next because 8.100.3.G.1.g.viii.2 (S175) grants it to a resident who fails citizenship but otherwise meets the plan's requirements, matching ma_is_emergency_medicaid_only's own scope (CO-510); The emergency-only branch also requires a MAGI category, because ma_is_emergency_medicaid_only (CO-510) now covers the SSI-related and long-term care routes too, and this is the MAGI status (the cross-chapter emergency determination is ma_emergency_medicaid_status, CO-1151); the income/no-category distinction (ma_meets_some_category_demographics, CO-552) is checked last, only once residency, continuous eligibility, and citizenship are settled. Coverage review F-07: § 8.100.3.G.1.b.ii (S3361) limits every eligible inmate's benefits, not only a continuous eligibility child's, so an inmate of a public institution (CO-1105) who meets a MAGI category, or is in a pregnancy coverage period, is incarceration_limited; the row follows the continuous eligibility rows (an inmate child in a period is already incarceration_limited) and precedes the full-benefit rows. An inmate limited to emergency Medicaid by status stays emergency_only. G.1.b.ii says 'incarcerated in a correctional institution'; the row reads 435.1010's inmate of a public institution, as the continuous eligibility row and CHP+ (§ 120.1.C, 430.2.B) do. Whether the person is an inmate is read for the month (ma_is_inmate_in_month, CO-7555: in the institution on every day of the month, from institution_entry_date) and is required where read: where the setting facts are not stated the status cannot be determined (pattern sweep, MAGI, PS-05, 2026-11-24: the reading \"not an inmate\" had no rule; decision 4). Coverage pass 5, C5-04 (2026-11-23): § 8.100.3.G.1.c (S659), \"To be eligible to receive Medical Assistance, an eligible person shall: ... Not be a patient in an institution for tuberculosis or mental disease, unless the person is under 21 years of age or has attained 65 years of age\", is a condition of every category, and no row read it: a patient of 21 to 64 in an institution for mental diseases (ma_meets_imd_requirement false, CO-1179) was reported eligible although ma_magi_is_fully_eligible (CO-562) was false. Such a month is ineligible_institution, tested after the continuous eligibility rows (a child in a period is under 21, so the exclusion never reaches one) and before the inmate, pregnancy-period and category rows: the pregnancy coverage period continues coverage \"regardless of changes in the woman's financial circumstances\" (G.5), and G.1.c is not a financial circumstance, so the period does not lift it. Whether the CMS-approved 1115 demonstration Colorado Expanding the Substance Use Disorder Continuum of Care, which § 8.100.3.G.1.b.ii incorporates for reentry services, lifts the exclusion for a stay in an institution for mental diseases for substance use treatment is OQ-1325: G.1.c names no exception for it."
derived: [case, [ma_month_is_before_coverage_period, ineligible_before_coverage_period], [[not, ma_meets_residency], ineligible_residency], [[all, ma_child_is_in_continuous_eligibility_period, ma_is_inmate_in_month], incarceration_limited], [ma_child_is_in_continuous_eligibility_period, eligible], [[not, ma_meets_imd_requirement], ineligible_institution], [[all, ma_is_inmate_in_month, [any, [otherwise, ma_is_in_pregnancy_coverage_period, false], [all, [not, ["=", ma_magi_category, none]], [not, ma_is_emergency_medicaid_only]]]], incarceration_limited], [[otherwise, ma_is_in_pregnancy_coverage_period, [all, ma_is_pregnant_category, [not, ma_is_emergency_medicaid_only]]], eligible], [[all, ma_is_emergency_medicaid_only, [not, ["=", ma_magi_category, none]]], emergency_only], [[all, ["=", ma_magi_category, none], ma_is_adult_category, [not, ma_meets_adult_group_community_engagement_condition], [in, ma_community_engagement_status, [notice_required, notice_period]]], pending_community_engagement], [[all, ["=", ma_magi_category, none], ma_is_adult_category, [not, ma_meets_adult_group_community_engagement_condition]], ineligible_community_engagement], [[all, ["=", ma_magi_category, none], ma_meets_some_category_demographics], ineligible_income], [["=", ma_magi_category, none], ineligible_no_category], [else, eligible]]
sources: [S171, S172, S173, S600, S607, S215, S216, S640, S1200, S1211, S1725, S1503, S2411, S3361, S659, S3351, S217]
open: [OQ-1325]
implemented: engine
tags: [ma, magi, immigration]
rationale: "No existing item reports a MAGI eligibility reason code. Declared an outcome per the batch instructions (ma_magi_category and ma_magi_eligibility_status carry role: outcome). Distinct from ma_magi_is_eligible (CO-553), which only reports pass/fail: the target household's p3 (an undocumented adult over the Parents/Caretaker income standard) needs to be reported as emergency_only, not as ineligible_income or ineligible_no_category, since the checked-first citizenship carve-out governs regardless of her category or income. Fix round: inserted the continuous-eligibility branch (C-4) ahead of emergency-only and the income/no-category branches. Fix round (C-13): inserted ma_is_in_pregnancy_coverage_period (CO-566) immediately after the continuous-eligibility branch and ahead of emergency-only and income/no-category, for the same reason - a locked-in pregnancy coverage period is not defeated by a later income rise, citizenship question, or category miss. History moved from the precision note (HCPF review S-14): Phase 7: the emergency-only branch also requires a MAGI category, because ma_is_emergency_medicaid_only (CO-510) now covers the SSI-related and long-term care routes too, and this is the MAGI status (the cross-chapter emergency determination is ma_emergency_medicaid_status, CO-1151); the income/no-category distinction (ma_meets_some_category_demographics, CO-552) is checked last, only once residency, continuous eligibility, and citizenship are settled. Precision history (moved from precision, engineering follow-up pass task 5): (ma_child_is_in_continuous_eligibility_period, CO-561, fix round); (CO-510, edited in the fix round per C-11 to require a category). OQ-413 (4), audit fix round 4: pending_community_engagement for an applicant during the noncompliance procedure. Final verification pass 2 (P3-3, F2-1): a month before birth or outside the application's coverage is ineligible_before_coverage_period; an unknown pregnancy coverage period does not make the status unknown for a woman who meets the category this month."
