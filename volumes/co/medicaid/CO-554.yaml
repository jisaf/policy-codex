id: CO-554
name: "Medicaid: MAGI eligibility status"
identifier: ma_magi_eligibility_status
kind: derived
type: one of
options: [eligible, emergency_only, ineligible_income, ineligible_residency, ineligible_no_category]
scope: person-month
program: Medicaid
role: outcome
meaning: The reason code for the person's MAGI Medical Assistance eligibility this month - full eligibility, emergency-Medicaid-only, ineligible because household income exceeds every category the person could otherwise fit, ineligible because the person is not a Colorado resident, or ineligible because the person fits no MAGI category's demographic requirements at all.
precision: "Residency is checked first because it is a threshold requirement of every category; a child in an open continuous eligibility period (ma_child_is_in_continuous_eligibility_period, CO-561, fix round) is reported eligible next, per 42 CFR 435.926(d)/10 CCR 2505-10 8.100.3.Q.1.a's 'without regard to changes in income' rule (the phase-3 review's C-4(a) finding) - checked ahead of emergency-only and the income/no-category branches so a CE period is not defeated by a later citizenship or income change; emergency-only is checked next because 8.100.3.G.1.g.viii.2 (S175) grants it to a resident who fails citizenship but otherwise meets the plan's requirements, matching ma_is_emergency_medicaid_only's own scope (CO-510, edited in the fix round per C-11 to require a category); the income/no-category distinction (ma_meets_some_category_demographics, CO-552) is checked last, only once residency, continuous eligibility, and citizenship are settled."
derived: [case, [[not, ma_meets_residency], "ineligible_residency"], [ma_child_is_in_continuous_eligibility_period, "eligible"], [ma_is_emergency_medicaid_only, "emergency_only"], [[all, [=, ma_magi_category, "none"], ma_meets_some_category_demographics], "ineligible_income"], [[=, ma_magi_category, "none"], "ineligible_no_category"], [else, "eligible"]]
sources: [S171, S172, S173, S175, S215, S216]
implemented: engine
tags: [ma, magi, immigration]
rationale: "No existing item reports a MAGI eligibility reason code. Declared an outcome per the batch instructions (ma_magi_category and ma_magi_eligibility_status carry role: outcome). Distinct from ma_magi_is_eligible (CO-553), which only reports pass/fail: the target household's p3 (an undocumented adult over the Parents/Caretaker income standard) needs to be reported as emergency_only, not as ineligible_income or ineligible_no_category, since the checked-first citizenship carve-out governs regardless of her category or income. Fix round: inserted the continuous-eligibility branch (C-4) ahead of emergency-only and the income/no-category branches."
tests:
  - {id: CO-554-T1, as_of: "2026-10-01", month: "2026-10", given: {ma_meets_residency: false, ma_child_is_in_continuous_eligibility_period: false, ma_is_emergency_medicaid_only: false, ma_magi_category: "none", ma_meets_some_category_demographics: false}, expect: ineligible_residency}
  - {id: CO-554-T2, as_of: "2026-10-01", month: "2026-10", given: {ma_meets_residency: true, ma_child_is_in_continuous_eligibility_period: false, ma_is_emergency_medicaid_only: true, ma_magi_category: "none", ma_meets_some_category_demographics: true}, expect: emergency_only}
  - {id: CO-554-T3, as_of: "2026-10-01", month: "2026-10", given: {ma_meets_residency: true, ma_child_is_in_continuous_eligibility_period: false, ma_is_emergency_medicaid_only: false, ma_magi_category: "none", ma_meets_some_category_demographics: true}, expect: ineligible_income}
  - {id: CO-554-T4, as_of: "2026-10-01", month: "2026-10", given: {ma_meets_residency: true, ma_child_is_in_continuous_eligibility_period: false, ma_is_emergency_medicaid_only: false, ma_magi_category: "none", ma_meets_some_category_demographics: false}, expect: ineligible_no_category}
  - {id: CO-554-T5, as_of: "2026-10-01", month: "2026-10", given: {ma_meets_residency: true, ma_child_is_in_continuous_eligibility_period: false, ma_is_emergency_medicaid_only: false, ma_magi_category: child, ma_meets_some_category_demographics: true}, expect: eligible}
  - {id: CO-554-T6, as_of: "2027-01-01", month: "2027-01", given: {ma_meets_residency: true, ma_child_is_in_continuous_eligibility_period: true, ma_is_emergency_medicaid_only: false, ma_magi_category: "none", ma_meets_some_category_demographics: false}, expect: eligible}
