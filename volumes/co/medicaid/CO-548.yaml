id: CO-548
name: "Medicaid: meets the Adults MAGI category"
identifier: ma_is_adult_category
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether the person meets the Adults MAGI Medical Assistance category under 10 CCR 2505-10 8.100.4.G.4 and 42 CFR 435.119(b) - age ma_magi_child_age_limit through under ma_adult_upper_age_limit (65), not pregnant, not entitled to or enrolled in Medicare, not otherwise eligible under the Children's, Pregnant Women, or Parents/Caretaker Relatives categories, any dependent child under ma_magi_child_age_limit in the person's household as a parent or caretaker relative has minimum essential coverage, with household income at or below ma_magi_income_standard_adult, applying the ma_magi_income_disregard_pct income disregard of 42 CFR 435.603(d)(4) and 8.100.4.D as the last step only if income above the plain standard would otherwise make the person ineligible."
precision: "8.100.4.G.4 also folds in a parent or caretaker relative whose income exceeds the Parents/Caretaker standard but who otherwise meets this category's own criteria (income at or below 133%), which this rule reaches automatically since it does not exclude someone for having a dependent child, only for already qualifying under ma_is_parent_caretaker_category. This batch does not separately model the Former Foster Care category as a 435.119(b)(4) exclusion because 435.150(b)(2) instead makes Former Foster Care itself conditional on not being eligible under 435.110-435.145 (the mandatory groups including Adults); this rule's own mandatory-group exclusions (Children's, Pregnant Women, Parents/Caretaker) are the ones 435.119(b)(4) names. The minimum-essential-coverage condition is added, moved here from CO-547: 8.100.4.G.4.a and 42 CFR 435.119(c)(1) condition Adults eligibility, not Parents/Caretaker eligibility, on a dependent child in the parent/caretaker relative's household having MEC. The age is under ma_magi_child_age_limit, per 435.119(c)(2), not the parent/caretaker category's own 18/18-in-school dependent-child age (ma_dependent_child_age_limit, CO-190) - the negative-condition form 435.119(c)(1) states: the person fails this category only if there IS a dependent child under ma_magi_child_age_limit in the household without MEC. Per 42 CFR 435.603(d)(4), the disregard disjunct is gated on ma_magi_income_standard_adult being this person's highest standard (ma_magi_highest_income_standard_pct, CO-539). This item states the group criteria of 435.119(b)-(c); the community engagement requirement 435.119(d) adds from January 1, 2027 is ma_meets_adult_group_community_engagement_condition (CO-1975), which ma_magi_category (CO-551) applies together with this item (OQ-65). Same-word audit SW-1/SW-3 (engineering follow-up pass, OQ-396): \"parent or caretaker relative\" is ma_caretaker_relative_of (CO-2606), Medicaid's own reading of the neutral parent, stepparent and has_primary_responsibility_for roles."
derived: [all, [">=", age, ma_magi_child_age_limit], [<, age, ma_adult_upper_age_limit], [not, ma_is_pregnant_in_month], [not, is_medicare_entitled_or_enrolled], [not, ma_is_child_category], [not, ma_is_pregnant_category], [not, ma_is_parent_caretaker_category], [not, [exists, ma_caretaker_relative_of, [all, [<, [of, [P], age], ma_magi_child_age_limit], [not, [of, [P], dependent_child_has_minimum_essential_coverage]]]]], [any, ["<=", ma_magi_household_income_pct_fpl, ma_magi_income_standard_adult], [all, ["=", ma_magi_income_standard_adult, ma_magi_highest_income_standard_pct], ["<=", ["-", ma_magi_household_income_pct_fpl, ma_magi_income_disregard_pct], ma_magi_income_standard_adult]]]]
sources: [S207, S208, S165, S168]
implemented: engine
tags: [ma, magi, income, age]
rationale: "No existing item states the Adults-category test. ma_magi_category (CO-551) needs it, listed last among the mandatory groups per the phase-3 brief's ordering, and its exclusion of the other mandatory categories reads ma_is_child_category, ma_is_pregnant_category, and ma_is_parent_caretaker_category directly rather than ma_magi_category itself, to avoid a circular reference (ma_magi_category's own case expression reads this item). Fix round: added the MEC exclusion (C-3, moved from CO-547) and gated the disregard disjunct on ma_magi_highest_income_standard_pct (C-2). Precision history (moved from precision, engineering follow-up pass task 5): (ma_magi_highest_income_standard_pct, CO-539, fix round); per the phase-3 review's C-3 finding; the phase-3 review's C-2 finding; in the fix round. Final verification F-1 (2026-11-22): reads ma_is_pregnant_in_month (CO-3601) in place of the current-status is_pregnant, so a retroactive month before a birth or other end of pregnancy is a pregnant month (§ 8.100.3.E.1-2, S1503, S2411; 42 U.S.C. 1396a(e)(16), S224)."
