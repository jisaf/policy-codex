id: CO-4558
name: "Medicaid: MAGI household members whose income counts"
identifier: ma_magi_household_income_members
kind: derived
type: group of persons
scope: person-month
program: Medicaid
meaning: "The members of this person's MAGI household whose income counts toward the household's income under 42 CFR 435.603(d)(2) and 10 CCR 2505-10 § 8.100.4.C.1.f: every member except one who is not required to file a tax return (leaving Title II Social Security and Tier I railroad benefits out of the test, C.1.f.i.1, f.ii.1) and either has a parent in this household or is claimed as a tax dependent, by someone other than a spouse or parent, who is in this household."
precision: "The test ma_magi_household_income (CO-503) applied inline, factored out without change so the annualized household income (ma_annualized_household_income, CO-4559) counts the same members; CO-503's precision states the reading (the summing household, not the member's own; § 8.100.4.C.1.f.iii). Coverage review F-17: the filing requirement is is_required_to_file_tax_return_excluding_social_security (CO-4568), which leaves Title II and Tier I benefits out of the threshold test as § 8.100.4.C.1.f.i.1 and f.ii.1 (S167) require, or, where that is not stated, is_required_to_file_tax_return (CO-078); the two differ only for a member who receives such benefits. Coverage review 3, C3-04: C.1.f.i excludes the income of a child \"included in the household of their natural, adopted, or step parent\", so the parent test reads the child and stepchild roles (volume.yaml's child role is the legal child only); a stepchild whose legal parent is not in the household (deceased or living elsewhere) and who is not required to file is left out."
statute_override: "Federal law overrides 10 CCR 2505-10 § 8.100.4.C.1.f's last paragraph (the second \"ii)\", S167: \"The income of a child or tax dependent who does not live with their natural, adopted, or step parent will always count towards the determination of their own eligibility, even if the child's or tax dependent's income is below the tax filing threshold\"): 42 CFR 435.603(d)(2)(i) (S164, in force since January 1, 2014) leaves out the MAGI-based income of an individual \"included in the household of his or her natural, adopted or step parent\" who is not expected to be required to file, and a dependent claimed by a parent is in that parent's household (E.1.b) wherever she lives, so her income below the filing threshold is not counted in her own determination either (coverage pass 5, C5-14: a 20-year-old student claimed by her parents and living in another home)."
derived: [filter, ma_magi_household_members, [not, [all, [not, [otherwise, [of, [P], is_required_to_file_tax_return_excluding_social_security], [of, [P], is_required_to_file_tax_return]]], [any, [has_relative_in, [child, stepchild], ma_magi_household_members], [all, [has_relative_in, [tax_dependent], ma_magi_household_members], [of, [P], ma_is_dependent_claimed_by_non_parent]]]]]]
sources: [S164, S167]
implemented: engine
tags: [ma, magi, income, household]
rationale: "Coverage review F-04 (2026-11-22): the annualized household income of § 8.100.4.C.4.a must count the same members as the monthly figure; CO-503 held the member test twice inline, and a third copy would let the three drift."
tests:
  - {id: CO-4558-T1, month: "2026-10", as_of: "2026-10-01", title: "A child not required to file, with her parent in the household, is left out", given: {ma_magi_household_members: [p1, p2], is_required_to_file_tax_return: true}, others: {p2: {is_required_to_file_tax_return: false, ma_is_dependent_claimed_by_non_parent: false}}, relationships: [[parent, p1, p2]], expect: [p1]}
  - {id: CO-4558-T2, month: "2026-10", as_of: "2026-10-01", title: "A child required to file counts", given: {ma_magi_household_members: [p1, p2], is_required_to_file_tax_return: true}, others: {p2: {is_required_to_file_tax_return: true}}, relationships: [[parent, p1, p2]], expect: [p1, p2]}
  - {id: CO-4558-T3, month: "2026-10", as_of: "2026-10-01", title: "C.1.f.iii: a dependent with no parent in this household counts", given: {ma_magi_household_members: [p1], is_required_to_file_tax_return: false, ma_is_dependent_claimed_by_non_parent: false}, others: {p2: {date_of_birth: "1958-01-01"}}, relationships: [[tax_filer, p2, p1]], expect: [p1]}
  - {id: CO-4558-T4, month: "2026-10", as_of: "2026-10-01", title: "Coverage review F-17: a child required to file only because of her survivor benefits is not required to file under C.1.f.i.1 - left out", given: {ma_magi_household_members: [p1, p2], is_required_to_file_tax_return: true}, others: {p2: {is_required_to_file_tax_return: true, is_required_to_file_tax_return_excluding_social_security: false, ma_is_dependent_claimed_by_non_parent: false}}, relationships: [[parent, p1, p2]], expect: [p1]}
  - {id: CO-4558-T5, month: "2026-11", as_of: "2026-11-10", title: "Coverage review 3, C3-04 (RV3-STEP): a stepchild of 16 not required to file, with her stepfather in the household and her legal parent not, is left out (was counted)", given: {ma_magi_household_members: [p1, p2], is_required_to_file_tax_return: true}, others: {p2: {is_required_to_file_tax_return: false, ma_is_dependent_claimed_by_non_parent: false}}, relationships: [[stepparent, p1, p2]], expect: [p1]}
