id: CO-4627
name: "Medicaid: parental resources deemed to the child"
identifier: ma_ssi_parental_resources_deemed
kind: derived
type: money
scope: person
program: Medicaid
meaning: "The resources of this child's ineligible parents deemed to the child (42 U.S.C. 1382c(f)(2)(A); 20 CFR 416.1202(b)): the parents' own countable resources (ma_ssi_countable_resources_individual) less their self-funded retirement accounts, above the resource limit for a couple when two deemed parents live with the child or for an individual when one does; zero when no parent's resources are deemed."
precision: "Pension funds of a parent or stepparent are excluded (416.1202(b)(1)(i)); the parent's retirement accounts are read as them. The excess is deemed to each eligible child in full: 416.1202(b) divides nothing. A parent's home that counts only because of a recorded beneficiary deed (ma_home_equity_counted_only_by_beneficiary_deed, CO-5205) is left out: § 8.100.5.M.2.a.xiv counts a home \"which is subject to estate recovery\", and nothing paid for the child is recovered from the parent's estate (42 U.S.C. 1396p(b)(1)). Resource records, Medicaid track H1 (docs/reviews/records-holdings-medicaid.md): the parent's pension funds left out are what the parent's own figure counted for the parent's retirement accounts (ma_ssi_retirement_accounts_counted_in_month, CO-5326, at the determination month). Each parent's own figure excludes that parent's one automobile; whether two deeming parents exclude one automobile between them, as a couple does (416.1218(b)), is OQ-1241."
derived: [case, [["=", [count, ma_ssi_deeming_parents], 0], 0], [else, [max, 0, ["-", [sum, ma_ssi_deeming_parents, [max, 0, ["-", ["-", [of, [P], ma_ssi_countable_resources_individual], [at, [of, [P], ma_ssi_retirement_accounts_counted_in_month], [det_month]]], [of, [P], ma_home_equity_counted_only_by_beneficiary_deed]]]], [case, [[">=", [count, ma_ssi_deeming_parents], 2], ssi_resource_limit_couple], [else, ssi_resource_limit_individual]]]]]]
sources: [S3414, S3415, S3403, S3751]
open: [OQ-1241]
implemented: engine
tags: [ma, non_magi, resources, household]
rationale: "Coverage review NM-10: no parent's resources reached a child applying under the SSI-related rules; 1382c(f)(2)(A) deems them and 416.1202(b) states the limit. Coverage pass 3 C3-5: the beneficiary-deed home of a deeming parent is no longer deemed."
tests:
  - {id: CO-4627-T1, as_of: "2026-10-12", title: "one parent with 1,500: nothing over 2,000", given: {ma_ssi_deeming_parents: [p2]}, others: {p2: {ma_ssi_countable_resources_individual: 1500, retirement_accounts_value: 0, holdings: [{kind: bank_account}]}}, relationships: [[child, p2]], expect: 0}
  - {id: CO-4627-T2, as_of: "2026-10-12", title: "two parents with 9,000, of it a 4,000 IRA: 5,000 - 3,000", given: {ma_ssi_deeming_parents: [p2, p3]}, others: {p2: {ma_ssi_countable_resources_individual: 9000, retirement_accounts_value: 4000, holdings: [{kind: bank_account}, {kind: retirement_account, value: 4000}]}, p3: {ma_ssi_countable_resources_individual: 0, retirement_accounts_value: 0, holdings: [{kind: bank_account}]}}, relationships: [[child, p2], [child, p3]], expect: 2000}
