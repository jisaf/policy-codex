id: CO-4888
name: "Medicaid: month is before the disability onset"
identifier: ma_month_is_before_disability_onset
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether the month ends before the person's disability onset date (disability_onset_date), so that no medical service in it was on or after the onset and the person does not meet the SSA definition of disability for that month (10 CCR 2505-10 § 8.100.5.C.4.b.ii)."
precision: "A month is before the onset when it is earlier than the month containing the onset date; the onset month itself is not, because a service on or after the onset day in it qualifies (C.4.b reads the date of the medical service, and the volume determines whole months). An unstated onset date is read as no such month. C.4.b.i (SSI or SSDI approved on or before the service) is not separated: an approval follows the onset."
derived: [otherwise, ["<", [month], [month_of, disability_onset_date]], false]
sources: [S3623]
implemented: engine
tags: [ma, non_magi, disability]
rationale: "Coverage pass 2 (first pass NM-30, deferred): the disabled arm of ma_ssi_related_category (CO-612) read the undated SSA finding, so a retroactive month before the onset read disabled. CO-612 reads this item in that arm. The Buy-In (§ 8.100.6.P-Q) and long-term care (§ 8.100.7) groups have their own retroactive rules and are not read here."
tests:
  - {id: CO-4888-T1, as_of: "2026-11-01", month: "2026-08", title: "Onset 2026-09-15; August is before it", given: {disability_onset_date: "2026-09-15"}, expect: true}
  - {id: CO-4888-T2, as_of: "2026-11-01", month: "2026-09", title: "The onset month is not before it", given: {disability_onset_date: "2026-09-15"}, expect: false}
  - {id: CO-4888-T3, as_of: "2026-11-01", month: "2026-08", title: "No onset date stated", given: {}, expect: false}
