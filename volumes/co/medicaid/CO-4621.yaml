implemented: engine
tags: [ma, non_magi, resources]
rationale: "Coverage review NM-4: real_property_other_than_home_equity (CO-3393) leaves out property used to produce income and no other fact stated it, so a person with a $150,000 rental property was resource-eligible; § 8.100.5.J.2-3 exclude at most $6,000 of it."
tests:
  - {id: CO-4621-T1, month: "2026-10", as_of: "2026-10-12", title: "rental house: 150,000 less 6,000", given: {holdings: [{kind: bank_account}, {kind: real_property, value: 150000, amount_owed: 0, income_producing: true}]}, expect: 144000}
  - {id: CO-4621-T2, month: "2026-10", as_of: "2026-10-12", title: "small non-business property within the exclusion", given: {holdings: [{kind: bank_account}, {kind: real_property, value: 5000, amount_owed: 0, income_producing: true}]}, expect: 0}
  - {id: CO-4621-T3, month: "2026-10", as_of: "2026-10-12", title: "business property with the 6% return: 360 of 6,000", given: {holdings: [{kind: bank_account}, {kind: real_property, value: 8000, amount_owed: 0, income_producing: true, used_in_trade_or_business: true, net_annual_return: 360}]}, expect: 2000}
  - {id: CO-4621-T4, month: "2026-10", as_of: "2026-10-12", title: "business property below the return: counted in full", given: {holdings: [{kind: bank_account}, {kind: real_property, value: 8000, amount_owed: 0, income_producing: true, used_in_trade_or_business: true, net_annual_return: 300}]}, expect: 8000}
  # Resource records, Medicaid track H1: hand-computed from 8.100.5.J.2 (S3402): property producing goods for the household's own support is non-business property essential to self-support.
  - {id: CO-4621-T5, month: "2026-10", as_of: "2026-10-12", title: "7,000 of land producing food for the household: 7,000 - 6,000 = 1,000", given: {holdings: [{kind: real_property, value: 7000, amount_owed: 0, income_producing: false, produces_for_household_use: true}]}, expect: 1000}
  # Field-effect sweep, non-MAGI Medicaid (docs/reviews/field-sweep-snap-cash-nonmagi.md); hand-computed from the text quoted in each title.
  - {id: CO-4621-T6, month: "2026-11", as_of: "2026-11-12", title: "FS-MA-6: 8,000 of equipment (personal property, not household goods) used to produce goods for the household's own support, not in a business: J.2 (S3402) excludes non-business property essential to self-support up to 6,000: 8,000 - 6,000 = 2,000; 1,000 of household goods stated income-producing are excluded whole (M.2.d)", given: {holdings: [{kind: personal_property, value: 8000, amount_owed: 0, household_goods_or_personal_effects: false, produces_for_household_use: true}, {kind: personal_property, value: 1000, amount_owed: 0, household_goods_or_personal_effects: true, income_producing: true}]}, expect: 2000}
