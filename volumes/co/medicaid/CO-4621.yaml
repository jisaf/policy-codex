id: CO-4621
name: "Medicaid: countable income-producing property"
identifier: ma_countable_income_producing_property_value
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The part of the person's income-producing and self-support property that counts as a resource in the month for the aged, blind and disabled groups: the equity, at the person's share, of the real property holdings records (CO-5300) stated as producing income (income_producing) or goods for the household's own use (produces_for_household_use), less ma_income_producing_property_exclusion, which is excluded for non-business property essential to self-support (10 CCR 2505-10 § 8.100.5.J.2) and for property used in a trade or business only if its yearly net return is at least ma_income_producing_property_min_return_rate of the excluded value (J.3); above the exclusion the property counts (M.3.g)."
precision: "Resource records, Medicaid track H1 (docs/reviews/records-holdings-medicaid.md): the non-business property and the trade or business property are each excluded up to the $6,000 their paragraph names (J.2, J.3), the return of the business records against 6% of the business property's excluded value. Property the person uses to produce income or goods or services for the person's own support is read as essential to self-support, so property producing goods for the household's own use (stated for Adult Financial before the records, home_use_production_property_equity_value, CO-4425) is J.2 property too, and non-business income-producing property stated for Adult Financial (CO-4423) is the same property Medicaid reads (one statement, one record). A record that does not state used_in_trade_or_business is read as not a trade or business, the reading the scalar facts' reader gave (J.2 is the general exclusion); a business record with no net return stated cannot be tested against J.3 and is unknown."
