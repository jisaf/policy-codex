id: CO-7942
name: "Medicaid SSI method: the person's own countable income with the disabled widow(er)'s Social Security disregarded"
identifier: ma_ssi_own_countable_income_with_widow_benefit_disregarded
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The person's own countable income for the month as ma_ssi_own_countable_income (CO-7354) figures it, with the Social Security benefits 42 U.S.C. 1383c(d) disregards (ma_disabled_widow_disregarded_social_security_receipts, CO-7940) left out of the unearned income: the own-income form of ma_disabled_widow_countable_income (CO-7941), which the disabled widow(er) test compares (10 CCR 2505-10 § 8.100.6.I, S625; S3416) for a person whose ineligible spouse's income is not deemed (20 CFR 416.1163(d)(1), S5031)."
precision: "NM-KL-2 (2026-11-24; docs/reviews/known-limits.md). A registered sibling of ma_ssi_own_countable_income_with_oasdi_disregarded (CO-7355), the Disabled Adult Child test's own-income form, which takes out every current Social Security benefit: every other term must stay the same. Read by ma_disabled_widow_meets_ssi_income_test (CO-7943) where ma_ssi_ineligible_spouse_income_is_not_deemed (CO-7353) holds."
