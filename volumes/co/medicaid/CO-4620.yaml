  - {id: CO-4620-T2, month: "2026-10", as_of: "2026-10-12", title: "for sale, value not stated: the whole of the other real property", given: {real_property_other_than_home_equity: 50000, ma_excess_real_property_is_for_sale: true, ma_claims_co_owner_hardship_for_real_property: false, holdings: [{kind: bank_account}, {kind: real_property, value: 50000, amount_owed: 0, ma_sale_efforts_unsuccessful: true, co_owner_would_lose_housing: false}]}, expect: 50000}
  - {id: CO-4620-T3, month: "2026-10", as_of: "2026-10-12", title: "no finding: nothing left out", given: {real_property_other_than_home_equity: 50000, real_property_for_sale_value: 50000, ma_excess_real_property_is_for_sale: false, ma_claims_co_owner_hardship_for_real_property: false, holdings: [{kind: bank_account}, {kind: real_property, listed_for_sale: true, amount_owed: 0, value: 50000, ma_sale_efforts_unsuccessful: false, co_owner_would_lose_housing: false}]}, expect: 0}
