id: CO-4620
name: "Medicaid: excess real property left out while for sale or co-owned"
identifier: ma_excluded_real_property_value
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The part of the person's real property other than the home that the aged, blind and disabled resource test leaves out in the month: property the person is making reasonable but unsuccessful efforts to sell (10 CCR 2505-10 § 8.100.5.M.2.b), and the person's share of property whose sale would cause the co-owner who lives in it undue hardship through loss of housing (§ 8.100.5.M.3.h): the equity, at the person's share, of each real property holdings record (CO-5300) valued in the month that the eligibility site has found so (the record's ma_sale_efforts_unsuccessful or co_owner_would_lose_housing, decision D9)."
precision: "Resource records, Medicaid track H1 (docs/reviews/records-holdings-medicaid.md): read in the month in context (ma_ssi_countable_resources_individual, CO-4623, reads it at the determination month, as the scalar findings were read; ma_ssi_countable_resources_in_month, CO-5322, in any month). The findings are fields of the property's record, so a person with a lot for sale and another lot not for sale states two records, and the finding names the one it is about. A record that does not state a finding is read as not found (the exclusion is the person's to show: resources are available unless shown otherwise, 8.100.5.E.3, S4670), the reading the scalar facts' reader gave. Income-producing property is not real property this item reads (CO-4621 counts it above its exclusion). The documents the two findings need are verification items (CO-2246 to CO-2249), which keep the case pending until they arrive. Once the property sells, the proceeds are a bank account or cash (M.2.b.vii, § 8.100.5.P). Never more than the real property the SSI method counted, since it is a part of the same records."
derived: [sum_receipts, holdings, [all, ["=", [lookup, ma_ssi_holding_treatment_table, [receipt, kind]], counted_less_real_property_exclusions], [received_in, [month]], [unknown, [receipt, disposed_date]], [not, [otherwise, [receipt, income_producing], false]], [not, [otherwise, [receipt, produces_for_household_use], false]], [any, [otherwise, [receipt, ma_sale_efforts_unsuccessful], false], [otherwise, [receipt, co_owner_would_lose_housing], false]]], ["*", [otherwise, [receipt, share], 1], ["-", [receipt, value], [receipt, amount_owed]]]]
sources: [S1514, S1515, S4670]
open: [OQ-1243]
implemented: engine
tags: [ma, non_magi, resources]
rationale: "Coverage review NM-2: the volume stated both exemptions as findings and verified them, but no resource item read them, so real property for sale or co-owned with a resident was counted in full."
tests:
  - {id: CO-4620-T1, month: "2026-10", as_of: "2026-10-12", title: "for sale: the listed lot is left out", given: {real_property_other_than_home_equity: 60000, real_property_for_sale_value: 50000, ma_excess_real_property_is_for_sale: true, ma_claims_co_owner_hardship_for_real_property: false, holdings: [{kind: bank_account}, {kind: real_property, value: 10000, amount_owed: 0, ma_sale_efforts_unsuccessful: false, co_owner_would_lose_housing: false}, {kind: real_property, listed_for_sale: true, amount_owed: 0, value: 50000, ma_sale_efforts_unsuccessful: true, co_owner_would_lose_housing: false}]}, expect: 50000}
  - {id: CO-4620-T2, month: "2026-10", as_of: "2026-10-12", title: "for sale, value not stated: the whole of the other real property", given: {real_property_other_than_home_equity: 50000, ma_excess_real_property_is_for_sale: true, ma_claims_co_owner_hardship_for_real_property: false, holdings: [{kind: bank_account}, {kind: real_property, value: 50000, amount_owed: 0, ma_sale_efforts_unsuccessful: true, co_owner_would_lose_housing: false}]}, expect: 50000}
  - {id: CO-4620-T3, month: "2026-10", as_of: "2026-10-12", title: "no finding: nothing left out", given: {real_property_other_than_home_equity: 50000, real_property_for_sale_value: 50000, ma_excess_real_property_is_for_sale: false, ma_claims_co_owner_hardship_for_real_property: false, holdings: [{kind: bank_account}, {kind: real_property, listed_for_sale: true, amount_owed: 0, value: 50000, ma_sale_efforts_unsuccessful: false, co_owner_would_lose_housing: false}]}, expect: 0}
  - {id: CO-4620-T4, month: "2026-10", as_of: "2026-10-12", title: "co-owner hardship, capped at the real property", given: {real_property_other_than_home_equity: 30000, real_property_co_owned_with_resident_value: 20000, real_property_for_sale_value: 25000, ma_excess_real_property_is_for_sale: true, ma_claims_co_owner_hardship_for_real_property: true, holdings: [{kind: bank_account}, {kind: real_property, listed_for_sale: true, amount_owed: 0, value: 25000, ma_sale_efforts_unsuccessful: true, co_owner_would_lose_housing: false}, {kind: real_property, co_owner_lives_in_it: true, amount_owed: 0, value: 5000, ma_sale_efforts_unsuccessful: false, co_owner_would_lose_housing: true}]}, expect: 30000}
