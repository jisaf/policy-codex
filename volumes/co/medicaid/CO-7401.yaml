id: CO-7401
name: "Medicaid: the pregnancy coverage period opens in the month"
identifier: ma_pregnancy_coverage_period_opens_in_month
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether the month is a month of the application being determined in which the person, while pregnant, was eligible for and received Medical Assistance, so that the coverage period of 10 CCR 2505-10 § 8.100.4.G.5 and 42 U.S.C. 1396a(e)(5) and (e)(16) can run from it: a month from the first month of the requested retroactive period (ma_retroactive_coverage_requested, CO-4100; § 8.100.3.E), or else the month of application, through the determination month, in which the eligibility history (ma_prior_enrollment_category, CO-2424) records the Pregnant Women category; or records other Medical Assistance (Parent/Caretaker Relative or any other category) in a month she was pregnant (ma_is_pregnant_in_month, CO-3601); or in which she met the Pregnant Women category (ma_is_pregnant_category, CO-546) and the residency requirement of the month (ma_meets_residency_in_month, CO-7650), with neither earned nor unearned income verification pending in the month. A month the history records as Pregnant Women opens a period for a pregnancy she had in that month: not a month in the postpartum year of a pregnancy that ended before it (pregnancy_ended_before_month CO-7771, latest_pregnancy_end_date_before_month CO-7772) unless she was pregnant in it (ma_is_pregnant_in_month, CO-3601)."
precision: "Coverage pass 6, C6-01 and C6-02 (2026-11-24). 42 U.S.C. 1396a(e)(5) (S5060): 'A woman who, while pregnant, is eligible for, has applied for, and has received medical assistance under the State plan, shall continue to be eligible under the plan, as though she were pregnant, for all pregnancy-related and postpartum medical assistance', and (e)(16)(A) (S224) extends it to the 12-month period for 'an individual who, while pregnant, is eligible for and has received medical assistance under the State plan ... (including during a period of retroactive eligibility)': the provision reaches any Medical Assistance received while pregnant, not only the Pregnant Women category, and any month of the pregnancy, not only the month of application. The history is the record of approvals made before this determination (CO-2424), so it is read only for a month before the determination month; a month the history records as Pregnant Women opens the period as recorded (heavier-definitions audit H-6), and one it records as other Medical Assistance opens it where she was pregnant in that month. A month of this application in which the history records none, or which it does not record, is tested on the category: G.5 ('Once eligibility has been approved') and 8.100.3.E.2 ('An applicant does not have to be eligible in the month of application'), so a pregnant applicant ineligible in the application month (a last paycheck) and eligible in a later month of the same application opens the period in that later month (C6-02). The category needs income verification not pending in the month (G.5, 'once the income verification requirements are met'; audit L-3), tested after it, so a month over the standard is decided without the verification state. A month after the determination month opens nothing in this determination. A retroactive month is a month of this application only where retroactive coverage was requested. Coverage pass 7 (2026-11-24): C7-08, a retroactive month stands on its own facts (42 CFR 435.915(a)(2), S218: 'Would have been eligible for Medicaid at the time he received the services'): the category arm reads the month's residency (ma_meets_residency_in_month, CO-7650, whose retroactive months read state_of_residence_start_date) instead of a supplied date the person became eligible (ma_eligibility_start_date, retired), which a month's own facts decide; C7-02, the history arm opens a month only for a pregnancy she had in it: a month the history records as Pregnant Women in the postpartum year of an earlier pregnancy (on or before the 12th month after a recorded end before the month) is that pregnancy's month, and opens nothing unless she was pregnant again in it, so a later pregnancy opens its own period only in a month of that pregnancy (PG-SECOND: the history records Pregnant Women from March 2025 through September 2026 for a pregnancy that ended 2025-09-10; October 2025 to September 2026 are postpartum months of it and open nothing for the pregnancy that began 2026-10-05). The retroactive period's length is read as ma_pregnancy_coverage_period_start_month (CO-565) reads it, not from CO-2472 (circular)."
derived: [all, ["<=", [month], [det_month]], [">=", [month], [case, [[otherwise, ma_retroactive_coverage_requested, false], [months_before, [case, [["<", ma_application_date, ma_retroactive_coverage_change_date], ma_retroactive_coverage_months], [else, ma_retroactive_coverage_months_other_after_change]], [month_of, ma_application_date]]], [else, [month_of, ma_application_date]]]], [any, [all, ["<", [month], [det_month]], [otherwise, ["=", ma_prior_enrollment_category, pregnant], false], [any, ma_is_pregnant_in_month, [not, pregnancy_ended_before_month], [">", [month], [months_after, ma_postpartum_coverage_months, [month_of, latest_pregnancy_end_date_before_month]]]]], [all, ["<", [month], [det_month]], [otherwise, [in, ma_prior_enrollment_category, [parent_caretaker, other_medical_assistance]], false], ma_is_pregnant_in_month], [all, ma_is_pregnant_category, ma_meets_residency_in_month, [not, ma_earned_income_verification_is_pending], [not, ma_unearned_income_verification_is_pending]]]]
sources: [S640, S5060, S224, S1503, S2411, S1719, S218]
implemented: engine
tags: [ma, magi]
nearest: [CO-565, CO-566]
rationale: "Coverage pass 6, C6-01 and C6-02 (docs/reviews/coverage6-medicaid-magi-chp.md): the period opened only in the application month (or a requested retroactive month), and only on the history recorded for that one month or the category met in it. A member enrolled before her pregnancy (PP-ENROLLED: application 2025-05-01, history other Medical Assistance through the pregnancy, birth 2026-10-15, wages 2,800) had no period: November 2026 to October 2027 ineligible_income (2,800 / 1,330 = 210.5%, less 5 = 205.5% > 133%), although (e)(5) and (e)(16) continue her coverage through October 2027. An applicant ineligible in the application month and eligible as a pregnant woman in a later month of the same application (PG-LATER-ELIG: September 4,000 / 1,803.33 = 221.8% > 195%, October 3,000 / 1,803.33 = 166.4%) had no period either. ma_pregnancy_coverage_period_start_month (CO-565) is now the first month of the application in which this item is true, and ma_is_in_pregnancy_coverage_period (CO-566) runs from it."
