id: CO-7401
name: "Medicaid: the pregnancy coverage period opens in the month"
identifier: ma_pregnancy_coverage_period_opens_in_month
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether the month is a month of the application being determined in which the person, while pregnant, was eligible for and received Medical Assistance, so that the coverage period of 10 CCR 2505-10 § 8.100.4.G.5 and 42 U.S.C. 1396a(e)(5) and (e)(16) can run from it: a month from the first month of the requested retroactive period (ma_retroactive_coverage_requested, CO-4100; § 8.100.3.E), or else the month of application, through the determination month, in which the eligibility history (ma_prior_enrollment_category, CO-2424) records the Pregnant Women category; or records other Medical Assistance (Parent/Caretaker Relative or any other category) in a month she was pregnant (ma_is_pregnant_in_month, CO-3601); or in which she met the Pregnant Women category (ma_is_pregnant_category, CO-546), on or after the month she became eligible (ma_eligibility_start_date) where the month is before the application month, with neither earned nor unearned income verification pending in the month."
precision: "Coverage pass 6, C6-01 and C6-02 (2026-11-24). 42 U.S.C. 1396a(e)(5) (S5060): 'A woman who, while pregnant, is eligible for, has applied for, and has received medical assistance under the State plan, shall continue to be eligible under the plan, as though she were pregnant, for all pregnancy-related and postpartum medical assistance', and (e)(16)(A) (S224) extends it to the 12-month period for 'an individual who, while pregnant, is eligible for and has received medical assistance under the State plan ... (including during a period of retroactive eligibility)': the provision reaches any Medical Assistance received while pregnant, not only the Pregnant Women category, and any month of the pregnancy, not only the month of application. The history is the record of approvals made before this determination (CO-2424), so it is read only for a month before the determination month; a month the history records as Pregnant Women opens the period as recorded (heavier-definitions audit H-6), and one it records as other Medical Assistance opens it where she was pregnant in that month. A month of this application in which the history records none, or which it does not record, is tested on the category: G.5 ('Once eligibility has been approved') and 8.100.3.E.2 ('An applicant does not have to be eligible in the month of application'), so a pregnant applicant ineligible in the application month (a last paycheck) and eligible in a later month of the same application opens the period in that later month (C6-02). The category needs income verification not pending in the month (G.5, 'once the income verification requirements are met'; audit L-3), tested after it, so a month over the standard is decided without the verification state. A month after the determination month opens nothing in this determination. A retroactive month is a month of this application only where retroactive coverage was requested; before the month of application, the category counts only from the month she became eligible (ma_eligibility_start_date). The retroactive period's length is read as ma_pregnancy_coverage_period_start_month (CO-565) reads it, not from CO-2472 (circular)."
derived: [all, ["<=", [month], [det_month]], [">=", [month], [case, [[otherwise, ma_retroactive_coverage_requested, false], [months_before, [case, [["<", ma_application_date, ma_retroactive_coverage_change_date], ma_retroactive_coverage_months], [else, ma_retroactive_coverage_months_other_after_change]], [month_of, ma_application_date]]], [else, [month_of, ma_application_date]]]], [any, [all, ["<", [month], [det_month]], [otherwise, ["=", ma_prior_enrollment_category, pregnant], false]], [all, ["<", [month], [det_month]], [otherwise, [in, ma_prior_enrollment_category, [parent_caretaker, other_medical_assistance]], false], ma_is_pregnant_in_month], [all, ma_is_pregnant_category, [any, [">=", [month], [month_of, ma_application_date]], ["<=", [month_of, ma_eligibility_start_date], [month]]], [not, ma_earned_income_verification_is_pending], [not, ma_unearned_income_verification_is_pending]]]]
sources: [S640, S5060, S224, S1503, S2411, S1719]
implemented: engine
tags: [ma, magi]
nearest: [CO-565, CO-566]
rationale: "Coverage pass 6, C6-01 and C6-02 (docs/reviews/coverage6-medicaid-magi-chp.md): the period opened only in the application month (or a requested retroactive month), and only on the history recorded for that one month or the category met in it. A member enrolled before her pregnancy (PP-ENROLLED: application 2025-05-01, history other Medical Assistance through the pregnancy, birth 2026-10-15, wages 2,800) had no period: November 2026 to October 2027 ineligible_income (2,800 / 1,330 = 210.5%, less 5 = 205.5% > 133%), although (e)(5) and (e)(16) continue her coverage through October 2027. An applicant ineligible in the application month and eligible as a pregnant woman in a later month of the same application (PG-LATER-ELIG: September 4,000 / 1,803.33 = 221.8% > 195%, October 3,000 / 1,803.33 = 166.4%) had no period either. ma_pregnancy_coverage_period_start_month (CO-565) is now the first month of the application in which this item is true, and ma_is_in_pregnancy_coverage_period (CO-566) runs from it."
tests:
  - {id: CO-7401-T1, as_of: "2026-11-10", month: "2026-03", title: "C6-01 (PP-ENROLLED): enrolled since an application of 2025-05-01; March 2026 the history records other Medical Assistance and she was pregnant: (e)(5), the period opens", given: {ma_application_date: "2025-05-01", ma_retroactive_coverage_requested: false, ma_prior_enrollment_category: {"2026-03": other_medical_assistance}, ma_is_pregnant_in_month: {"2026-03": true}}, expect: true}
  - {id: CO-7401-T2, as_of: "2026-11-10", month: "2025-12", title: "C6-01: the same in December 2025, other Medical Assistance recorded but not pregnant (the pregnancy began 2026-01-10): nothing opens; the category is not met either (not pregnant)", given: {ma_application_date: "2025-05-01", ma_retroactive_coverage_requested: false, ma_prior_enrollment_category: {"2025-12": other_medical_assistance}, ma_is_pregnant_in_month: {"2025-12": false}, ma_is_pregnant_category: {"2025-12": false}}, expect: false}
  - {id: CO-7401-T3, as_of: "2026-11-10", month: "2026-03", title: "H-6 kept: the history records the Pregnant Women category: opens as recorded", given: {ma_application_date: "2025-05-01", ma_retroactive_coverage_requested: false, ma_prior_enrollment_category: {"2026-03": pregnant}}, expect: true}
  - {id: CO-7401-T4, as_of: "2026-11-10", month: "2026-10", title: "C5-01 kept (MA-PG-DELIVERED): first-time applicant, applied 2026-10-05, history none; October: size 2, 3,250 / 1,803.33 = 180.2% <= 195%, the category met, nothing pending: opens", given: {ma_application_date: "2026-10-05", ma_retroactive_coverage_requested: false, ma_prior_enrollment_category: {"2026-10": none}, ma_is_pregnant_category: {"2026-10": true}, ma_earned_income_verification_is_pending: {"2026-10": false}, ma_unearned_income_verification_is_pending: {"2026-10": false}}, expect: true}
  - {id: CO-7401-T5, as_of: "2026-11-10", month: "2026-09", title: "C6-02 (PG-LATER-ELIG): applied 2026-09-28; September size 2, 4,000 / 1,803.33 = 221.8% > 195%: the category is not met, nothing opens in September", given: {ma_application_date: "2026-09-28", ma_retroactive_coverage_requested: false, ma_prior_enrollment_category: {"2026-09": none}, ma_is_pregnant_category: {"2026-09": false}}, expect: false}
  - {id: CO-7401-T6, as_of: "2026-11-10", month: "2026-10", title: "C6-02 (PG-LATER-ELIG): October, a later month of the same application, 3,000 / 1,803.33 = 166.4% <= 195%, nothing pending: opens (§ 430.3's 'month the pregnant woman becomes eligible'; G.5)", given: {ma_application_date: "2026-09-28", ma_retroactive_coverage_requested: false, ma_prior_enrollment_category: {"2026-10": none}, ma_is_pregnant_category: {"2026-10": true}, ma_earned_income_verification_is_pending: {"2026-10": false}, ma_unearned_income_verification_is_pending: {"2026-10": false}}, expect: true}
  - {id: CO-7401-T7, as_of: "2026-11-10", month: "2026-08", title: "A month before the application month with no retroactive request is not a month of this application: nothing opens though the history records Pregnant Women", given: {ma_application_date: "2026-09-28", ma_retroactive_coverage_requested: false, ma_prior_enrollment_category: {"2026-08": pregnant}}, expect: false}
  - {id: CO-7401-T8, as_of: "2026-11-10", month: "2026-08", title: "A requested retroactive month (window July to September for an application of 2026-10-05), the category met, eligible from 2026-01-01, nothing pending: opens", given: {ma_application_date: "2026-10-05", ma_retroactive_coverage_requested: true, ma_eligibility_start_date: "2026-01-01", ma_prior_enrollment_category: {"2026-08": none}, ma_is_pregnant_category: {"2026-08": true}, ma_earned_income_verification_is_pending: {"2026-08": false}, ma_unearned_income_verification_is_pending: {"2026-08": false}}, expect: true}
  - {id: CO-7401-T9, as_of: "2026-11-10", month: "2026-08", title: "A requested retroactive month before the month she became eligible (2026-09-14, moved to Colorado): the category is not counted there", given: {ma_application_date: "2026-10-05", ma_retroactive_coverage_requested: true, ma_eligibility_start_date: "2026-09-14", ma_prior_enrollment_category: {"2026-08": none}, ma_is_pregnant_category: {"2026-08": true}}, expect: false}
  - {id: CO-7401-T10, as_of: "2026-11-10", month: "2026-12", title: "A month after the determination month opens nothing in this determination", given: {ma_application_date: "2026-10-05", ma_retroactive_coverage_requested: false, ma_is_pregnant_category: {"2026-12": true}}, expect: false}
  - {id: CO-7401-T11, as_of: "2026-11-10", month: "2026-11", title: "The determination month: the history is not read for it (CO-2424 records months before it); other Medical Assistance stated there and the category not met: nothing opens", given: {ma_application_date: "2026-10-05", ma_retroactive_coverage_requested: false, ma_prior_enrollment_category: {"2026-11": other_medical_assistance}, ma_is_pregnant_in_month: {"2026-11": true}, ma_is_pregnant_category: {"2026-11": false}}, expect: false}
