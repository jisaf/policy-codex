  - {id: CO-7401-T2, as_of: "2026-11-10", month: "2025-12", title: "C6-01: the same in December 2025, other Medical Assistance recorded but not pregnant (the pregnancy began 2026-01-10): nothing opens; the category is not met either (not pregnant)", given: {ma_application_date: "2025-05-01", ma_retroactive_coverage_requested: false, ma_prior_enrollment_category: {"2025-12": other_medical_assistance}, ma_is_pregnant_in_month: {"2025-12": false}, ma_is_pregnant_category: {"2025-12": false}}, expect: false}
