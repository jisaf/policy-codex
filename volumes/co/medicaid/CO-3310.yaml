  # Pattern sweep (P1): the month's aged, blind or disabled (ma_is_aged_blind_or_disabled_in_month, CO-5201) is stated beside the person-scope one; the reader now reads the month's.
  - {id: CO-3310-T4, month: "2026-10", as_of: "2026-10-12", title: "NM-12 (X-WAWDHCBS): a Buy-In worker above 300% of the FBR requesting HCBS", given: {ma_is_institutionalized: false, meets_hcbs_waiver_target_group: ebd, ma_meets_residency: true, ma_is_aged_blind_or_disabled: true, ma_is_aged_blind_or_disabled_in_month: true, ma_meets_citizenship_requirement: true, ma_meets_special_income_group: false, ma_reaches_hcbs_without_special_income_group: true, ma_meets_ltc_resource_standard: true, ma_home_equity_disqualifies: false, meets_nursing_facility_level_of_care: true}, expect: none}
  - {id: CO-3310-T90, month: "2026-10", as_of: "2026-10-01", title: "NM-28: refuses to release the patient payment (V.2.c)", given: {ma_is_institutionalized: true, meets_hcbs_waiver_target_group: none, ma_meets_residency: true, ma_is_aged_blind_or_disabled: true, ma_meets_citizenship_requirement: true, ma_meets_special_income_group: true, ma_meets_ltc_resource_standard: true, ma_home_equity_disqualifies: false, meets_nursing_facility_level_of_care: true, ma_abd_denied_for_noncooperation: true}, expect: failed_to_cooperate}
