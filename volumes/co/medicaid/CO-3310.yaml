id: CO-3310
name: "Medicaid LTC: requirement not met before the transfer penalty"
identifier: ma_ltc_unmet_requirement
kind: derived
type: one of
options: [none, not_institutionalized_or_waiver, failed_to_cooperate, ineligible_residency, not_aged_blind_or_disabled, ineligible_status, ineligible_institution, ineligible_income, ineligible_resources, home_equity_exceeds_limit, ineligible_level_of_care]
scope: person-month
program: Medicaid
meaning: "The first Long-Term Care requirement, in ma_ltc_eligibility_status's order, the person does not meet before the transfer-of-assets penalty is considered - institutionalized or in a waiver or PACE, cooperation (§ 8.100.5.E.6, § 8.100.7.V.2.c), residency, aged, blind or disabled, citizenship or immigration status, the special income group, the resource standard, home equity, level of care - or none when the person meets them all; with none, the person is eligible for Long-Term Care apart from any transfer penalty and the requested setting."
precision: "The same arms, in the same order, as the first nine of ma_ltc_eligibility_status (CO-652), which reads this item: separating them changes no status. A person who requests HCBS or PACE and reaches it through SSI (including 1619(b)) or OAP Medicaid, or through the Working Adults Buy-In (§ 8.100.7.B.1.a, c; ma_reaches_hcbs_without_special_income_group, CO-4630), is not held to the special income group's income test or the long-term care resource test (coverage review NM-12). Blocked (OQ-1061): the special income group it reads (CO-642) rests, with an income trust, on the regional ceiling of S1230, which is not a quotation. HCPF Operational Memo OM 25-073 (D-125), the only document that states them, could not be fetched on 2026-11-23 (hcpf.colorado.gov refused, HTTP 403; medicaid.gov, sos.state.co.us, ecfr.gov, law.cornell.edu, govinfo.gov and federalregister.gov answered but state no Colorado figure), so the item stays Draft until the memo is stored and the excerpt replaced by its quotation. Pattern sweep, non-MAGI Medicaid (docs/reviews/pattern-sweep-nonmagi.md, P1): aged, blind or disabled is read in the month with the disability onset gate (ma_is_aged_blind_or_disabled_in_month, CO-5201; 10 CCR 2505-10 § 8.100.5.C.4.b, S3623: disability approved, or 'a disability onset date determined on or prior to the date of a medical service'; § 8.100.3.E.1, S1503), as the SSI-related groups (CO-611) and OAP SISC B (CO-1177) already read it. Before, it read ma_is_aged_blind_or_disabled (CO-603), which has no onset gate, so a retroactive month before the onset of a disability was a disabled month. Coverage pass 7, non-MAGI F7-5 (docs/reviews/coverage7-medicaid-nonmagi.md): reads the general requirement of 10 CCR 2505-10 § 8.100.3.G.1.c (S659) through ma_meets_imd_requirement (CO-1179), as the SSI-related groups (CO-611) and the MAGI groups (CO-562) do: G.1 states what a person \"shall\" meet \"To be eligible to receive Medical Assistance\", and names no category it leaves out. Before, a patient aged 21 to 64 of an institution for mental diseases could be found eligible here although no other Medical Assistance category admitted him (IMD-LTC, stored household CO-1104)."
open: [OQ-1061, OQ-1415]
derived: [case, [[not, [any, ma_is_institutionalized, [not, ["=", meets_hcbs_waiver_target_group, none]], ["=", [otherwise, ma_ltc_setting_requested, none], pace]]], not_institutionalized_or_waiver], [ma_abd_denied_for_noncooperation, failed_to_cooperate], [[not, ma_meets_residency_in_month], ineligible_residency], [[not, ma_is_aged_blind_or_disabled_in_month], not_aged_blind_or_disabled], [[not, [any, ma_meets_citizenship_requirement_in_month, [all, ma_is_cover_all_coloradans_person_in_month, [not, ["=", meets_hcbs_waiver_target_group, none]]]]], ineligible_status], [[not, ma_meets_imd_requirement], ineligible_institution], [[all, [not, ma_meets_special_income_group], [not, ma_reaches_hcbs_without_special_income_group]], ineligible_income], [[all, [not, ma_meets_ltc_resource_standard], [not, ma_reaches_hcbs_without_special_income_group]], ineligible_resources], [ma_home_equity_disqualifies, home_equity_exceeds_limit], [[not, [any, meets_nursing_facility_level_of_care, [all, [not, ["=", meets_hcbs_waiver_target_group, none]], ma_meets_designated_waiver_level_of_care]]], ineligible_level_of_care], [else, none]]
sources: [S354, S1507, S3408, S3621, S3622, S3623, S1503, S659]
implemented: engine
tags: [ma, ltc]
rationale: "Dual-entry audit 1.7: § 8.100.7.F.8.a apportions a transfer penalty when the individual's spouse 'becomes institutionalized and is otherwise eligible for Medical Assistance'. 'Otherwise eligible' is eligibility apart from the penalty, which the rule determines after the other requirements (§ 8.100.7.F follows the financial and categorical tests); ma_ltc_eligibility_status reads the penalty, so the spouse's eligibility apart from it needs its own item for the apportionment to be derived without a cycle. Coverage pass 2 (first pass NM-28): denied when ma_abd_denied_for_noncooperation (CO-4886) holds (§ 8.100.5.E.6, § 8.100.7.V.2.c)."
