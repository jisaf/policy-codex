id: CO-3310
name: "Medicaid LTC: requirement not met before the transfer penalty"
identifier: ma_ltc_unmet_requirement
kind: derived
type: one of
options: [none, not_institutionalized_or_waiver, failed_to_cooperate, ineligible_residency, not_aged_blind_or_disabled, ineligible_status, ineligible_income, ineligible_resources, home_equity_exceeds_limit, ineligible_level_of_care]
scope: person-month
program: Medicaid
meaning: "The first Long-Term Care requirement, in ma_ltc_eligibility_status's order, the person does not meet before the transfer-of-assets penalty is considered - institutionalized or in a waiver or PACE, cooperation (§ 8.100.5.E.6, § 8.100.7.V.2.c), residency, aged, blind or disabled, citizenship or immigration status, the special income group, the resource standard, home equity, level of care - or none when the person meets them all; with none, the person is eligible for Long-Term Care apart from any transfer penalty and the requested setting."
precision: "The same arms, in the same order, as the first nine of ma_ltc_eligibility_status (CO-652), which reads this item: separating them changes no status. A person who requests HCBS or PACE and reaches it through SSI (including 1619(b)) or OAP Medicaid, or through the Working Adults Buy-In (§ 8.100.7.B.1.a, c; ma_reaches_hcbs_without_special_income_group, CO-4630), is not held to the special income group's income test or the long-term care resource test (coverage review NM-12)."
derived: [case, [[not, [any, ma_is_institutionalized, [not, ["=", meets_hcbs_waiver_target_group, none]], ["=", [otherwise, ma_ltc_setting_requested, none], pace]]], not_institutionalized_or_waiver], [ma_abd_denied_for_noncooperation, failed_to_cooperate], [[not, ma_meets_residency], ineligible_residency], [[not, ma_is_aged_blind_or_disabled], not_aged_blind_or_disabled], [[not, [any, ma_meets_citizenship_requirement, [all, ma_is_cover_all_coloradans_person, [not, ["=", meets_hcbs_waiver_target_group, none]]]]], ineligible_status], [[all, [not, ma_meets_special_income_group], [not, ma_reaches_hcbs_without_special_income_group]], ineligible_income], [[all, [not, ma_meets_ltc_resource_standard], [not, ma_reaches_hcbs_without_special_income_group]], ineligible_resources], [ma_home_equity_disqualifies, home_equity_exceeds_limit], [[not, [any, meets_nursing_facility_level_of_care, [all, [not, ["=", meets_hcbs_waiver_target_group, none]], ma_meets_designated_waiver_level_of_care]]], ineligible_level_of_care], [else, none]]
sources: [S354, S1507, S3408, S3621, S3622]
implemented: engine
tags: [ma, ltc]
rationale: "Dual-entry audit 1.7: § 8.100.7.F.8.a apportions a transfer penalty when the individual's spouse 'becomes institutionalized and is otherwise eligible for Medical Assistance'. 'Otherwise eligible' is eligibility apart from the penalty, which the rule determines after the other requirements (§ 8.100.7.F follows the financial and categorical tests); ma_ltc_eligibility_status reads the penalty, so the spouse's eligibility apart from it needs its own item for the apportionment to be derived without a cycle. Coverage pass 2 (first pass NM-28): denied when ma_abd_denied_for_noncooperation (CO-4886) holds (§ 8.100.5.E.6, § 8.100.7.V.2.c)."
tests:
