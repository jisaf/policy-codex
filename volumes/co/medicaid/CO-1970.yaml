id: CO-1970
name: "Medicaid community engagement: described in a mandatory group (I)-(VII)"
identifier: ma_is_described_in_mandatory_group_i_to_vii
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether, this month, the person is described in a mandatory coverage group of section 1902(a)(10)(A)(i)(I)-(VII) of the Social Security Act, which deems community engagement for the month (42 CFR 435.553(a)(3)), in the groups that reach a person the other mandatory exceptions do not: (I) receiving TANF (title IV-A) cash or title IV-E foster care or adoption assistance, or in Colorado's MAGI Parents and Caretaker Relatives category (section 1931); (II) receiving SSI, or treated by SSA as an SSI recipient without a payment, including section 1619(b) status (a qualified severely impaired individual, (II)(bb))."
precision: "Subclause by subclause (OQ-413 part (1), resolved): (I)'s plans under titles I, X and XIV were repealed for the States from January 1, 1974 (Pub. L. 92-603 sec. 303, S2106), and title XVI cash for Colorado residents is the federal SSI program, read under (II); (III), (IV), (VI) and (VII) describe pregnant women and children under 19, who are deemed for the month already, under 19 by 435.553(a)(1) (the age arm of CO-1969, under 19 on the first day of the month) and pregnant or postpartum as specified excluded individuals by 435.553(a)(4) (CO-1965); (V), qualified family members, is empty: \"No individual shall be a qualified family member for any period after September 30, 1998\" (42 U.S.C. 1396d(m)(2), S2105). So the Pregnant and Children categories are not read here; they had been, and a Colorado category above the mandatory income level (195% for pregnant women, 142% for children) is not the mandatory group in any case. (II)(cc), a person under 21 in the first month of SSI eligibility, is the SSI award's first month and is read through receives_ssi, a fact about the award."
derived: [any, receives_ssi, retains_ssi_status_without_payment, receives_tanf_cash, is_in_title_iv_foster_care_or_adoption_assistance, ma_is_parent_caretaker_category]
sources: [S1206, S1215, S2104, S2105, S2106]
implemented: engine
tags: [ma, magi]
rationale: "OQ-65: 435.553(a)(3) names federal subclauses; the volume states them through the receipt facts and the Colorado MAGI categories that implement them. OQ-413 (1), audit fix round 4: read subclause by subclause; section 1619(b) status added, the Pregnant and Children categories dropped as covered by 435.553(a)(1) and (a)(4)."
