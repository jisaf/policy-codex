id: CO-1970
name: "Medicaid community engagement: described in a mandatory group (I)-(VII)"
identifier: ma_is_described_in_mandatory_group_i_to_vii
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether, this month, the person is described in a mandatory coverage group of section 1902(a)(10)(A)(i)(I)-(VII) of the Social Security Act, which deems community engagement for the month (42 CFR 435.553(a)(3)): receiving TANF (title IV-A) cash, title IV-E foster care or adoption assistance, or SSI ((I), (II)); or in Colorado's MAGI Parents and Caretaker Relatives (section 1931, (I)), Pregnant Women ((III), (IV)) or Children ((III), (IV), (VI), (VII)) category."
precision: Subclause (V) (qualified family members, 1905(m)(1)) has no Colorado category of its own and is not read. A person in the Adults group in the month assessed fails the three MAGI categories by definition (435.119(b)(4)); the term matters for look-back months in which the person was in one of them (OQ-413).
derived: [any, receives_ssi, receives_tanf_cash, ma_is_in_title_iv_foster_care_or_adoption_assistance, ma_is_parent_caretaker_category, ma_is_pregnant_category, ma_is_child_category]
sources: [S1206, S1215]
implemented: engine
tags: [ma, magi]
open: [OQ-413]
rationale: "OQ-65: 435.553(a)(3) names federal subclauses; the volume states them through the receipt facts and the Colorado MAGI categories that implement them."
