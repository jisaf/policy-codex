id: CO-2455
name: "Medicaid: months between renewals"
identifier: ma_renewal_interval_months
kind: derived
type: whole number
scope: person-month
program: Medicaid
meaning: "The number of months between this person's scheduled redeterminations: 6 for a person in the Adults group whose redetermination is scheduled on or after January 1, 2027, unless the person is an Indian (42 U.S.C. 1396a(e)(14)(L)(ii) exempts the individuals 1396a(xx)(9)(A)(ii)(II) describes), and 12 otherwise."
precision: The statute dates the change by when the redetermination is scheduled; the determination date stands for it. ma_is_indian (CO-1938) is the Indian definition the community engagement exclusion reads, the same 1396a(xx)(9)(A)(ii)(II) group.
derived: [case, [[all, [">=", [det_date], ma_six_month_renewal_start_date], ["=", ma_magi_category, adult], [not, ma_is_indian]], ma_expansion_adult_renewal_interval_months], [else, ma_standard_renewal_interval_months]]
sources: [S1707]
implemented: engine
tags: [ma, magi]
rationale: "C-11 of the HCPF review: no item stated renewal frequency. The community engagement renewal review months (ma_community_engagement_review_months, CO-1973) run from the most recent determination to the month before the renewal, so a six-month renewal shortens them without a change to that item."
tests:
  - {id: CO-2455-T1, month: "2027-03", as_of: "2027-03-01", given: {ma_magi_category: adult, ma_is_indian: false}, title: "Expansion adult in 2027", expect: 6}
  - {id: CO-2455-T2, month: "2026-11", as_of: "2026-11-01", given: {ma_magi_category: adult, ma_is_indian: false}, title: "Expansion adult before 2027", expect: 12}
  - {id: CO-2455-T3, month: "2027-03", as_of: "2027-03-01", given: {ma_magi_category: adult, ma_is_indian: true}, title: "Indian expansion adult", expect: 12}
  - {id: CO-2455-T4, month: "2027-03", as_of: "2027-03-01", given: {ma_magi_category: parent_caretaker}, title: Parent, expect: 12}
