id: CO-889
name: "Medicaid: spouse or qualifying child lives in the home"
identifier: ma_spouse_or_qualifying_child_lives_in_home
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether this person's spouse, or a child of this person who is under 21 or blind or disabled of any age, is lawfully residing in this person's home (42 U.S.C. 1396p(f)(2)): read as a spouse or such a child who does not reside in a medical institution and, where this person's lives_with is stated, is in it."
precision: "A person who lives in a facility (residence_setting_type other than private_dwelling) does not share a dwelling with the community home, so lives_with cannot show the relative is in it; the relative's own residence then decides: a relative who lives in a private dwelling is read as living in the person's home. Coverage review NM-5: since lives_with is derived from dwelling_id, a spouse at home had stopped counting for a person in a nursing facility; ma_home_is_countable_resource (CO-4622) reads this item for § 8.100.5.M.2.a.ix. Disability is the SSA finding (meets_ssa_disability_criteria). (Until the pattern sweep: if the person had no stated relationships, Medicaid read no such relative.) Pattern sweep, non-MAGI Medicaid (docs/reviews/pattern-sweep-nonmagi.md, P1, P2, P3): per month. The relative is in the person's home in the month: not in a medical institution in the month (ma_resides_in_medical_institution_in_month, CO-7500: a relative admitted in September was at home in a retroactive August), a child under 21 by the age on the first day of the month ('under' is met on any day of it; docs/operators.md, Ages in a month) and born by the month. ma_home_equity_disqualifies (CO-650) reads it in the determination month. Required where read (decision 4 of 2026-11-23; convention rule 17): the person's relationships, the homes (lives_with) and the settings are read as stated; before, unstated relationships were read as no relative, an unstated home as living together, an unstated setting as not in an institution, and the age was the determination date's. Living in the home in the month is read from ma_ssi_lives_with_in_month (CO-7505): a spouse, parent or child who lives elsewhere on the determination date is in the home through the month the two ceased to live together (for one who entered a facility, the month of entry)."
derived: [exists_related, [spouse, parent], [all, [any, [rel, [spouse], [P]], ["<=", [month_of, [of, [P], date_of_birth]], [month]]], [any, [rel, [spouse], [P]], ["<", [of, [P], ma_age_on_first_day_of_month], ma_home_equity_child_age_limit], [of, [P], is_blind], [of, [P], meets_ssa_disability_criteria]], [not, [of, [P], ma_resides_in_medical_institution_in_month]], [any, [in_group, [P], ma_ssi_lives_with_in_month], [all, [not, ["=", residence_setting_type, private_dwelling]], ["=", [of, [P], residence_setting_type], private_dwelling]]]]]
sources: [S370, S1753, S1503]
implemented: engine
tags: [ma, ltc, resources, legal, household]
rationale: "ma_home_equity_disqualifies (CO-650) read ma_ltc_couple - whether a spouse exists and is not in an institution - as the 1396p(f)(2) exception, but that fact asks nothing about who lives in the home: it excuses a couple whose community spouse lives with relatives and disqualifies an unmarried applicant whose disabled adult child lives in the home - the phase-4 review's C-20 finding. No existing item asks whether anyone specifically resides in the individual's home. Dual-entry audit 1.8: derived from the spouse and child edges, age, blindness and disability, and where the relative lives, so it is not stated beside them. Coverage pass 2 (found while fixing N2-4): the derivation followed the [spouse, child] edges, which from this person reach the persons this person is a child of, so a minor or disabled child in the home was never found (a parent of the person was read instead); it now follows [spouse, parent], the persons this person is a spouse or parent of (T4, T5)."
tests:
  # Pattern sweep (P2, decision 4; rule 17): the homes and settings are stated (required where read); the story has one home.
  - {month: "2026-11", id: CO-889-T1, title: "Wife at home", as_of: "2026-11-01", given: {dwelling_id: h1, residence_setting_type: private_dwelling}, others: {p2: {dwelling_id: h1, residence_setting_type: private_dwelling, resides_in_medical_institution: false}}, relationships: [[spouse, p1, p2]], expect: true}
  - {month: "2026-11", id: CO-889-T2, title: "Adult son, 30, not disabled", as_of: "2026-11-01", given: {dwelling_id: h1, residence_setting_type: private_dwelling}, others: {p2: {dwelling_id: h1, residence_setting_type: private_dwelling, date_of_birth: "1996-01-01", is_blind: false, meets_ssa_disability_criteria: false, resides_in_medical_institution: false}}, relationships: [[parent, p1, p2]], expect: false}
  - {month: "2026-11", id: CO-889-T3, title: "NM-5: in a nursing facility, wife in the community home", as_of: "2026-11-01", given: {residence_setting_type: nursing_facility, dwelling_id: nf1}, others: {p2: {resides_in_medical_institution: false, residence_setting_type: private_dwelling, dwelling_id: h1}}, relationships: [[spouse, p1, p2]], expect: true}
  - {month: "2026-11", id: CO-889-T4, title: "Coverage pass 2: in a nursing facility, son of 10 in the community home", as_of: "2026-11-01", given: {residence_setting_type: nursing_facility, dwelling_id: nf1, resides_in_medical_institution: true}, others: {p2: {date_of_birth: "2016-01-01", is_blind: false, meets_ssa_disability_criteria: false, resides_in_medical_institution: false, residence_setting_type: private_dwelling, dwelling_id: h1}}, relationships: [[parent, p1, p2]], expect: true}
  - {month: "2026-11", id: CO-889-T5, title: "Coverage pass 2: the person's own parent of 10 years is not a child of the person (direction check)", as_of: "2026-11-01", given: {residence_setting_type: nursing_facility, dwelling_id: nf1, resides_in_medical_institution: true}, others: {p2: {date_of_birth: "2016-01-01", is_blind: false, meets_ssa_disability_criteria: false, resides_in_medical_institution: false, residence_setting_type: private_dwelling, dwelling_id: h1}}, relationships: [[parent, p2, p1]], expect: false}
  # Pattern sweep P1: the spouse (p2) entered a nursing facility 2026-09-14; the person (p1) at home; determined 2026-11-12. August: the spouse lived in the home: true. October: in the facility: false.
  - {id: CO-889-T90, month: "2026-08", as_of: "2026-11-12", title: "Pattern sweep: a spouse admitted in September lived in the home in August", given: {dwelling_id: h1, residence_setting_type: private_dwelling}, others: {p2: {dwelling_id: nf1, residence_setting_type: nursing_facility, institution_entry_date: "2026-09-14"}}, relationships: [[spouse, p2]], expect: true}
  - {id: CO-889-T91, month: "2026-10", as_of: "2026-11-12", title: "Pattern sweep: from the month of admission the spouse is not in the home", given: {dwelling_id: h1, residence_setting_type: private_dwelling}, others: {p2: {dwelling_id: nf1, residence_setting_type: nursing_facility, institution_entry_date: "2026-09-14"}}, relationships: [[spouse, p2]], expect: false}
  - {id: CO-889-T92, month: "2026-10", as_of: "2026-11-12", title: "Pattern sweep: no relationships stated: cannot determine (decision 4; was no relative)", given: {dwelling_id: h1, residence_setting_type: private_dwelling}, expect: unknown}
