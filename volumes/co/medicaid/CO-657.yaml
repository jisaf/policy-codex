  - {id: CO-657-T2, month: "2026-10", as_of: "2026-10-01", given: {ma_mmmna_standard: 2100, ma_family_allowance_members: [p3]}, title: "N2-2: (2,100 - 200 wages) / 3 = 633.33 (was 500 under the rule text)", others: {p3: {ma_mmmna_standard: 2100, wages_gross: 200, self_employment_gross_receipts: 0, receipts: [{kind: ssi}], earnings: [{kind: wages, amount: 200}]}}, relationships: [], expect: 633.3333333333334}
  - {id: CO-657-T3, month: "2026-11", as_of: "2026-11-01", given: {ma_mmmna_standard: 2705, ma_family_allowance_members: [p3]}, title: "N2-2: MMMNA 2,705, a child with 600 of survivor benefits: (2,705 - 600) / 3 = 701.67 (the rule's 2,705/3 - 600 = 301.67 is below the federal floor)", others: {p3: {wages_gross: 0, self_employment_gross_receipts: 0, receipts: [{kind: social_security, amount: 600}, {kind: ssi}], earnings: []}}, relationships: [], expect: 701.6666666666666}
