id: CO-657
name: "Medicaid: family allowance"
identifier: ma_family_allowance
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: The sum of the allowance for each dependent family member living with the community spouse - one third of the MMMNA standard, reduced by that member's own monthly income, per family member - per 10 CCR 2505-10 § 8.100.7.T.1.c.i.
derived: ["sum", family_members_with_community_spouse, ["max", 0, ["-", ["/", ma_mmmna_standard, ma_family_allowance_divisor], ["+", ["of", ["P"], social_security_income], ["of", ["P"], pension_income], ["of", ["P"], earned_income], ["of", ["P"], other_unearned_income]]]]]
sources: [S360]
open: [OQ-95]
implemented: engine
tags: [ma, ltc, income]
rationale: "No existing item computes the family allowance. ma_patient_payment (CO-658) needs it. The target household has no dependent family member living with p2, so this item's contribution is zero (the batch report's worked example). Dropped the 42 U.S.C. 1396r-5(d)(1)(C) citation from meaning per the phase-4 review's C-17 finding: the federal provision is one third of the amount by which the MMMNA exceeds the member's income, but § 8.100.7.T.1.c.i is 'one third of the amount of the MMMNA and shall be reduced by the monthly income of that family member' - a different arithmetic, and the one this item implements, since Colorado's rule governs."
tests:
  - {id: CO-657-T1, as_of: "2026-10-01", month: "2026-10", given: {family_members_with_community_spouse: [], ma_mmmna_standard: 2100}, expect: 0}
  - {id: CO-657-T2, as_of: "2026-10-01", month: "2026-10", given: {ma_mmmna_standard: 2100, family_members_with_community_spouse: [p3]}, others: {p3: {ma_mmmna_standard: 2100, social_security_income: 0, pension_income: 0, earned_income: 200, other_unearned_income: 0}}, relationships: [], expect: 500}
