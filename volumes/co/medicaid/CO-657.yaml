id: CO-657
name: "Medicaid: family allowance"
identifier: ma_family_allowance
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: The sum of the allowance for each dependent family member living with the community spouse - one third of the MMMNA standard, reduced by that member's own monthly income, per family member - per 10 CCR 2505-10 § 8.100.7.T.1.c.i.
precision: "A family member's income includes self-employment (ma_self_employment_net_earnings, CO-1704) and both parts of other unearned income. The family members are derived from the child, parent and tax-dependent edges and residence with the community spouse (ma_family_allowance_members, CO-2469)."
derived: [sum, ma_family_allowance_members, [max, 0, ["-", ["/", ma_mmmna_standard, ma_family_allowance_divisor], ["+", [of, [P], social_security_income], [of, [P], pension_income], [of, [P], wages_gross], [of, [P], ma_self_employment_net_earnings], [of, [P], other_unearned_income_taxable], [of, [P], other_unearned_income_nontaxable], [of, [P], tax_exempt_interest]]]]]
sources: [S1736]
open: [OQ-95]
implemented: engine
tags: [ma, ltc, income]
rationale: "No existing item computes the family allowance. ma_patient_payment (CO-658) needs it. The target household has no dependent family member living with p2, so this item's contribution is zero (the batch report's worked example). Dropped the 42 U.S.C. 1396r-5(d)(1)(C) citation from meaning per the phase-4 review's C-17 finding: the federal provision is one third of the amount by which the MMMNA exceeds the member's income, but § 8.100.7.T.1.c.i is 'one third of the amount of the MMMNA and shall be reduced by the monthly income of that family member' - a different arithmetic, and the one this item implements, since Colorado's rule governs. History moved from the precision note (HCPF review S-14): Vocabulary fix round (R-1): a family member's income includes self-employment (ma_self_employment_net_earnings, CO-1704) and both parts of other unearned income. HCPF fix round (OQ-95 resolved): the family members are derived from the child, parent and tax-dependent edges and residence with the community spouse (ma_family_allowance_members, CO-2469)."
tests:
  - {id: CO-657-T1, month: "2026-10", as_of: "2026-10-01", given: {ma_mmmna_standard: 2100, ma_family_allowance_members: []}, expect: 0}
  - {id: CO-657-T2, month: "2026-10", as_of: "2026-10-01", given: {ma_mmmna_standard: 2100, ma_family_allowance_members: [p3]}, others: {p3: {ma_mmmna_standard: 2100, social_security_income: 0, pension_income: 0, wages_gross: 200, self_employment_gross_receipts: 0, other_unearned_income_nontaxable: 0, other_unearned_income_taxable: 0, tax_exempt_interest: 0}}, relationships: [], expect: 500}
