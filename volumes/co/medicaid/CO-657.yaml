id: CO-657
name: "Medicaid: family allowance"
identifier: ma_family_allowance
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The sum of the allowance for each dependent family member living with the community spouse: one third of the amount by which the MMMNA standard exceeds that member's own monthly income, the federal floor of 42 U.S.C. 1396r-5(d)(1)(C), which supersedes the smaller figure of 10 CCR 2505-10 § 8.100.7.T.1.c.i (one third of the MMMNA standard, reduced by the member's income)."
precision: "A family member's income includes self-employment (ma_self_employment_net_earnings, CO-1704) and the unearned receipts the spousal impoverishment rules count (ma_spousal_unearned_receipts, CO-5531) with gambling winnings (CO-5512): unemployment compensation included, which the scalar sum left out before receipt records; child support and cash assistance left out as before (OQ-974). The family members are derived from the child, parent and tax-dependent edges and residence with the community spouse (ma_family_allowance_members, CO-2469). The state figure (MMMNA/3 - I) is never more than the federal one ((MMMNA - I)/3) and is smaller whenever the member has income, so the federal floor is the whole formula; a member whose income is at or above the standard gets 0."
statute_override: "Federal law overrides 10 CCR 2505-10 § 8.100.7.T.1.c.i, which sets the family allowance at one third of the MMMNA reduced by the family member's income: 42 U.S.C. 1396r-5(d)(1)(C) sets it at at least one third of the amount by which the MMMNA exceeds the member's income, and 1396r-5(a)(1) makes the section supersede any inconsistent provision, so a member with income keeps the larger federal figure (in force since 1989; coverage pass 2, N2-2)."
derived: [sum, ma_family_allowance_members, [max, 0, ["/", ["-", ma_mmmna_standard, ["+", [of, [P], wages_gross], [of, [P], ma_self_employment_net_earnings], [of, [P], ma_spousal_unearned_receipts], [of, [P], ma_ssi_gambling_receipts]]], ma_family_allowance_divisor]]]
sources: [S1736, S3001, S3615]
implemented: engine
tags: [ma, ltc, income, legal]
rationale: "Final verification pass 3, pattern sweep (2026-11-22): the income read now includes lottery and gambling winnings received in the month (§ 8.100.5.F.5.i, S3001; an unstated receipt is 0). No existing item computes the family allowance. ma_patient_payment (CO-658) needs it. The target household has no dependent family member living with p2, so this item's contribution is zero (the batch report's worked example). Dropped the 42 U.S.C. 1396r-5(d)(1)(C) citation from meaning per the phase-4 review's C-17 finding: the federal provision is one third of the amount by which the MMMNA exceeds the member's income, but § 8.100.7.T.1.c.i is 'one third of the amount of the MMMNA and shall be reduced by the monthly income of that family member' - a different arithmetic, and the one this item implements, since Colorado's rule governs. History moved from the precision note (HCPF review S-14): Vocabulary fix round (R-1): a family member's income includes self-employment (ma_self_employment_net_earnings, CO-1704) and both parts of other unearned income. HCPF fix round (OQ-95 resolved): the family members are derived from the child, parent and tax-dependent edges and residence with the community spouse (ma_family_allowance_members, CO-2469). Coverage pass 2, N2-2: the C-17 reading weighed the two formulas but not the federal \"at least\" and 1396r-5(a)(1)'s supersession (S3615); the state figure fell below the federal floor for every member with income (CO-112's couple with a 15-year-old who has 600: 301.67 against 701.67), so the item now takes the federal figure as a statute_override, as CO-658 does for the income trust deductions. Receipt records, migration phase 2 (2026-11-23): each member's unearned income is read from the receipts (ma_spousal_unearned_receipts, CO-5531, and CO-5512) instead of the scalar facts."
tests:
