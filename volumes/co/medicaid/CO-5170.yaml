id: CO-5170
name: "Medicaid SSI method: a person's gross pay from employment"
identifier: ma_ssi_wage_earnings
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The person's earned income of the month other than from self-employment and boarders, before any exclusion, as the SSI method's earnings counting table reads it (ma_ssi_earnings_treatment_table, CO-5107): each earnings record the table counts (wages, salaries, commissions, bonuses and other special payments received because of employment, 10 CCR 2505-10 8.100.5.F.4.a; the kinds counted because no rule excludes them), and each it holds exempt (8.100.5.F.6), or exempt for a dependent child (8.100.3.K.8.c): earned income in gross income, which ma_ssi_excluded_earned_income (CO-2471) then leaves out, at its gross amount, a pay received once in the month received (8.100.5.F.4: 'countable as income in the month received')."
precision: "Earned-income records, Medicaid and CHP+ track E1 (docs/reviews/records-earnings-medicaid.md): replaces wages_gross in every SSI-method, long-term care, spousal and buy-in item, through ma_ssi_gross_earned_income (CO-5171). The rows are the table's; this item reads no kind by name. The part set aside under a plan for self-support stays in the pay: it is excluded after the one half (ma_ssi_pass_set_aside_earned_income, CO-5176; 20 CFR 416.1112(c)(9)). Coverage pass 4, non-MAGI N4-5: a Difficulty of Care payment that is foster care (exempt_if_foster_care) is gross income as every exempt pay is; ma_ssi_exempt_earned_receipts (CO-5172) takes it out. Field-effect sweep (docs/reviews/field-sweep-snap-cash-nonmagi.md), FS-MA-2: a record stated as a stream (no month and no date) is received only in the months from the month its job or business began through the month it ended (job_start_date, job_end_date; each absent: before, or through, the months the case covers; CO-5100), since earned income \"is countable as income in the month received\" (10 CCR 2505-10 8.100.5.F.4, S3001) and wages are counted \"when you receive them\" (20 CFR 416.1111(a), S4940); a pay stated with its month or date is placed by it, a final pay after the job ended included. Before, a stream was counted in every month whatever its job's dates. The clause is Adult Financial's and Colorado Works' (af_earned_pay, CO-5130; cw_earned_pay, CO-5140)."
derived: [sum_receipts, earnings, [all, [received_in, [month]], [any, [not, [unknown, [receipt, month]]], [all, [any, [unknown, [receipt, job_start_date]], ["<=", [month_of, [receipt, job_start_date]], [month]]], [any, [unknown, [receipt, job_end_date]], [">=", [month_of, [receipt, job_end_date]], [month]]]]], [in, [lookup, ma_ssi_earnings_treatment_table, [receipt, kind]], [counted, counted_no_rule_excludes, exempt, exempt_if_foster_care, exempt_dependent_child_six_months]]], [receipt, amount]]
sources: [S3001, S3617, S4107, S4940]
implemented: engine
tags: [ma, non_magi, income]
rationale: "Earned-income records, step E1 (Medicaid and CHP+): the SSI method's pay from employment read from the earnings records through its counting table, so a part of a pay (Census wages, an irregular pay, a student's wages) is its own record and is never stated twice (design 2.5: exclusions applied once to disjoint pools)."
nearest: [CO-5511, CO-5171]
tests:
  - {id: CO-5170-T1, month: "2026-10", as_of: "2026-10-01", given: {earnings: [{kind: wages, amount: 1200}, {kind: decennial_census_employment, amount: 300}, {kind: self_employment_receipts, amount: 900}, {kind: business_cost_operating, amount: 100}]}, title: "Wages 1,200 + Census wages 300 (exempt, but gross income); the business is not read here: 1,500", expect: 1500}
  - {id: CO-5170-T2, month: "2026-10", as_of: "2026-10-01", given: {earnings: [{kind: wages, amount: 700, frequency: once, month: "2026-11"}, {kind: wages, amount: 1000}]}, title: "A pay of November is not October's income: 1,000", expect: 1000}
  - {id: CO-5170-T3, month: "2026-10", as_of: "2026-10-01", given: {}, title: "Earnings not stated: cannot determine", expect: unknown}
  - {id: CO-5170-T5, month: "2026-10", as_of: "2026-10-01", given: {earnings: [{kind: wages, amount: 900}, {kind: in_kind_pay, amount: 450}, {kind: wioa_on_the_job_training, amount: 300}]}, title: "OQ-1023 settled: pay in kind is earned income (8.100.3.K.3-4; 416.1110(a)(3)) and WIOA wages are in gross income (CO-5179 exempts a dependent child's): 900 + 450 + 300 = 1,650", expect: 1650}
  - {id: CO-5170-T4, month: "2026-10", as_of: "2026-10-01", given: {earnings: [{kind: employer_vendor_payment, amount: 250}, {kind: work_study, amount: 400}]}, title: "Work-study counted (no rule excludes it); the employer's vendor payment is not read by the table: 400", expect: 400}
  - {id: CO-5170-T6, month: "2026-11", as_of: "2026-11-01", given: {earnings: [{kind: difficulty_of_care_payment, amount: 600, foster_care: true}, {kind: difficulty_of_care_payment, amount: 400}, {kind: work_study, amount: 100}]}, title: "N4-5: Difficulty of Care payments, foster care or not, and work-study pay are gross earned income: 600 + 400 + 100 = 1,100", expect: 1100}
  # Field-effect sweep, non-MAGI Medicaid (docs/reviews/field-sweep-snap-cash-nonmagi.md); hand-computed from the text quoted in each title.
  - {id: CO-5170-T7, month: "2027-02", as_of: "2027-02-15", title: "FS-MA-2 (probe): a 1,500 wage stream of a job that ended 2026-12-15, read for February 2027: earned income counts in the month received (8.100.5.F.4, S3001; 416.1111(a), S4940): 0", given: {earnings: [{kind: wages, amount: 1500, job_end_date: "2026-12-15"}]}, expect: 0}
  - {id: CO-5170-T8, month: "2026-11", as_of: "2026-11-12", title: "FS-MA-2: a 1,500 wage stream of a job that ended 2026-10-15, its final pay of 700 dated 2026-11-06, and 900 from a job that began 2026-11-10: 700 + 900 = 1,600", given: {earnings: [{kind: wages, amount: 1500, job_end_date: "2026-10-15"}, {kind: wages, amount: 700, date: "2026-11-06", frequency: once}, {kind: wages, amount: 900, job_start_date: "2026-11-10"}]}, expect: 1600}
