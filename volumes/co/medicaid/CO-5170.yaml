id: CO-5170
name: "Medicaid SSI method: a person's gross pay from employment"
identifier: ma_ssi_wage_earnings
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The person's earned income of the month other than from self-employment and boarders, before any exclusion, as the SSI method's earnings counting table reads it (ma_ssi_earnings_treatment_table, CO-5107): each earnings record the table counts (wages, salaries, commissions, bonuses and other special payments received because of employment, 10 CCR 2505-10 8.100.5.F.4.a; the kinds counted because no rule excludes them), and each it holds exempt (8.100.5.F.6: earned income in gross income, which ma_ssi_excluded_earned_income, CO-2471, then leaves out), at its gross amount, a pay received once in the month received (8.100.5.F.4: 'countable as income in the month received')."
precision: "Earned-income records, Medicaid and CHP+ track E1 (docs/reviews/records-earnings-medicaid.md): replaces wages_gross in every SSI-method, long-term care, spousal and buy-in item, through ma_ssi_gross_earned_income (CO-5171). The rows are the table's; this item reads no kind by name. The part set aside under a plan for self-support stays in the pay: it is excluded after the one half (ma_ssi_pass_set_aside_earned_income, CO-5176; 20 CFR 416.1112(c)(9))."
derived: [sum_receipts, earnings, [all, [received_in, [month]], [in, [lookup, ma_ssi_earnings_treatment_table, [receipt, kind]], [counted, counted_no_rule_excludes, counted_text_excludes, exempt]]], [receipt, amount]]
sources: [S3001, S3617, S4107]
implemented: engine
tags: [ma, non_magi, income]
rationale: "Earned-income records, step E1 (Medicaid and CHP+): the SSI method's pay from employment read from the earnings records through its counting table, so a part of a pay (Census wages, an irregular pay, a student's wages) is its own record and is never stated twice (design 2.5: exclusions applied once to disjoint pools)."
nearest: [CO-5511, CO-5171]
tests:
  - {id: CO-5170-T1, month: "2026-10", as_of: "2026-10-01", given: {earnings: [{kind: wages, amount: 1200}, {kind: decennial_census_employment, amount: 300}, {kind: self_employment_receipts, amount: 900}, {kind: business_cost_operating, amount: 100}]}, title: "Wages 1,200 + Census wages 300 (exempt, but gross income); the business is not read here: 1,500", expect: 1500}
  - {id: CO-5170-T2, month: "2026-10", as_of: "2026-10-01", given: {earnings: [{kind: wages, amount: 700, frequency: once, month: "2026-11"}, {kind: wages, amount: 1000}]}, title: "A pay of November is not October's income: 1,000", expect: 1000}
  - {id: CO-5170-T3, month: "2026-10", as_of: "2026-10-01", given: {}, title: "Earnings not stated: cannot determine", expect: unknown}
  - {id: CO-5170-T4, month: "2026-10", as_of: "2026-10-01", given: {earnings: [{kind: employer_vendor_payment, amount: 250}, {kind: work_study, amount: 400}]}, title: "Work-study counted (no rule excludes it); the employer's vendor payment is not read by the table: 400", expect: 400}
