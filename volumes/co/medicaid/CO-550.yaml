id: CO-550
name: "Medicaid: is an Eligible Needy Newborn"
identifier: ma_is_needy_newborn
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: Whether the person is an "Eligible Needy Newborn" under 10 CCR 2505-10 8.100.4.G.7 and 42 CFR 435.117(b) - under ma_needy_newborn_age_limit_years (1), whose mother was enrolled in Medicaid at the time of the person's birth (including through retroactive coverage).
precision: "8.100.4.G.7's third sentence (\"not required to live with the mother\") means this item does not read any parent/child relationship or household membership - mother_was_enrolled_in_medicaid_at_birth is read directly as the child's own fact. Coverage review 3, C3-07: the age is ma_age_on_first_day_of_month (CO-4978), the age on the first day of the month evaluated (time audit T-1: not the determination month), which is exact for an \"under one\" limit: a child whose first birthday falls on the first of the month is one on every day of it and is not a needy newborn for that month (G.7's \"one year\" has ended). Coverage review 2, N-02 had read ma_age_before_month (CO-4790), the age on the last day of the month before the determination month; either way a child whose first birthday falls later in the month than its first day is a needy newborn for the whole month (§ 8.100.4.G.1, S3351), as F3-3 and F-06 read the 19th and 65th birthdays. 42 CFR 435.117(b)'s \"until the child's first birthday\" (S212) is read with G.1's whole month."
derived: [all, [<, ma_age_on_first_day_of_month, ma_needy_newborn_age_limit_years], mother_was_enrolled_in_medicaid_at_birth]
sources: [S211, S212, S1733, S3351]
implemented: engine
tags: [ma, magi, age]
rationale: "No existing item states the Eligible Needy Newborn test. ma_magi_category (CO-551) needs it, listed first per the phase-3 brief's mandatory-group ordering, ahead of the Children's category, since 8.100.4.G.7 makes it 'continuously eligible for one year' without regard to income - a stronger, unconditional entitlement that the Children's category's income test should not override."
tests:
  - {id: CO-550-T1, month: "2026-10", as_of: "2026-10-01", given: {date_of_birth: "2026-02-03", mother_was_enrolled_in_medicaid_at_birth: true}, expect: true}
  - {id: CO-550-T2, month: "2026-10", as_of: "2026-10-01", given: {date_of_birth: "2026-02-03", mother_was_enrolled_in_medicaid_at_birth: false}, expect: false}
  - {id: CO-550-T3, month: "2026-10", as_of: "2026-10-01", given: {date_of_birth: "2024-02-03", mother_was_enrolled_in_medicaid_at_birth: true}, expect: false}
  - {id: CO-550-T4, month: "2026-11", as_of: "2026-11-10", title: "Coverage review 2, N-02 (RV2-NB): first birthday on November 5, determined November 10 - a needy newborn for all of November", given: {date_of_birth: "2025-11-05", mother_was_enrolled_in_medicaid_at_birth: true}, expect: true}
  - {id: CO-550-T5, month: "2026-12", as_of: "2026-12-01", title: "The month after the first-birthday month", given: {date_of_birth: "2025-11-05", mother_was_enrolled_in_medicaid_at_birth: true}, expect: false}
