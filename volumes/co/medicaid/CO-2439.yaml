  - {id: CO-2439-T2, as_of: "2026-11-01", given: {ma_is_applying_at_hospital_pe_site: true, receives_medicaid: false, citizenship_status: citizen, is_pregnant: false, ma_received_presumptive_eligibility_in_last_twelve_months: false, date_of_birth: "1986-05-01", attested_household_income_pct_fpl: 1.5, ma_declares_current_employment: false}, title: "Adult of 40 at 150% FPL: limited family planning", expect: limited_family_planning}
  - {id: CO-2439-T3, as_of: "2026-11-01", given: {ma_is_applying_at_hospital_pe_site: true, receives_medicaid: false, citizenship_status: citizen, is_pregnant: false, ma_received_presumptive_eligibility_in_last_twelve_months: false, date_of_birth: "1996-05-01", attested_household_income_pct_fpl: 3, ma_declares_current_employment: true, claims_disability: true, ma_attested_own_income_pct_fpl: 3}, title: "Employed applicant of 30 with a disability, own income 300% FPL", expect: employed_disabled}
  - {id: CO-2439-T4, as_of: "2026-11-01", given: {ma_is_applying_at_hospital_pe_site: true, receives_medicaid: false, citizenship_status: citizen, is_pregnant: true, ma_received_presumptive_eligibility_this_pregnancy: false, ma_received_presumptive_eligibility_in_last_twelve_months: true, attested_household_income_pct_fpl: 1.8}, title: "Pregnant at 180% FPL who had PE earlier this year but not this pregnancy", expect: pregnant}
  - {id: CO-2439-T5, as_of: "2026-11-01", given: {ma_is_applying_at_hospital_pe_site: true, receives_medicaid: false, citizenship_status: citizen, is_pregnant: false, ma_received_presumptive_eligibility_in_last_twelve_months: true}, title: "Adult who had PE nine months ago", expect: none}
  - {id: CO-2439-T6, as_of: "2026-11-01", given: {ma_is_applying_at_hospital_pe_site: true, receives_medicaid: false, citizenship_status: refugee, is_pregnant: false, ma_received_presumptive_eligibility_in_last_twelve_months: false, date_of_birth: "1986-05-01", attested_household_income_pct_fpl: 1}, title: "Refugee adult of 40 at 100% FPL after October 1, 2026", expect: none}
  - {id: CO-2439-T7, as_of: "2026-09-15", given: {ma_is_applying_at_hospital_pe_site: true, receives_medicaid: false, citizenship_status: refugee, is_pregnant: false, ma_received_presumptive_eligibility_in_last_twelve_months: false, date_of_birth: "1986-05-01", attested_household_income_pct_fpl: 1}, title: "The same refugee adult in September 2026", expect: adult}
  - {id: CO-2439-T8, as_of: "2026-11-01", given: {ma_is_applying_at_hospital_pe_site: true, receives_medicaid: true}, title: "Already enrolled in Medical Assistance", expect: none}
