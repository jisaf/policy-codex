id: CO-2439
name: "Medicaid: hospital presumptive eligibility category"
identifier: ma_hospital_presumptive_eligibility_category
kind: derived
type: one of
options: [pregnant, child, parent_caretaker, adult, employed_disabled, limited_family_planning, none]
scope: person
program: Medicaid
role: outcome
meaning: "The group under which a qualified hospital site may find the applicant presumptively eligible under 10 CCR 2505-10 § 8.100.3.R, from the applicant's declarations, or none: a pregnant woman at or below ma_income_limit_pregnant_pct of the poverty level (R.2.a, once per pregnancy); a child under ma_magi_child_age_limit at or below ma_income_limit_child_pct (R.2.b); a parent or caretaker relative of a dependent child at or below ma_income_limit_parent_caretaker_pct (R.2.e); an adult ma_magi_child_age_limit to ma_adult_upper_age_limit at or below ma_income_limit_adult_pct (R.2.d); an employed applicant ma_hospital_pe_employed_disabled_min_age or older declaring a disability, own income at or below ma_wawd_income_limit_pct (R.2.f); or limited family planning, above ma_family_planning_income_lower_pct and at or below ma_family_planning_income_upper_pct (R.2.c). The applicant declares citizenship or a lawful status, is not already receiving Medical Assistance (R.8) and, except during a new pregnancy, has not had presumptive eligibility in the last 12 months (R.9). From October 1, 2026 only a citizen, national, lawful permanent resident, Cuban or Haitian entrant or COFA migrant qualifies outside the pregnant and child groups (42 U.S.C. 1396b(v)(5))."
precision: "Groups are tested in the order listed, so a parent at or below ma_income_limit_parent_caretaker_pct is reported parent_caretaker rather than adult. \"Aged 19-65\" (R.1.c, R.2.d) is read as ma_magi_child_age_limit through 64, the Adults group's own range (ma_adult_upper_age_limit, CO-199; OQ-513). R.2.c's \"cannot be eligible for a Medicaid eligibility category that provides full coverage\" is read through R.8 (not already receiving Medical Assistance), since a presumptive determination is made from declarations before any full determination. A parent or caretaker relative is one with a dependent child (ma_is_dependent_child, CO-544); a legally appointed guardian or conservator (R.2.e) is recorded as a caretaker relationship. Same-word audit SW-1/SW-3 (engineering follow-up pass, OQ-396): \"parent or caretaker relative\" is ma_caretaker_relative_of (CO-2606), Medicaid's own reading of the neutral parent, stepparent and has_primary_responsibility_for roles."
derived: [case, [[not, ma_is_applying_at_hospital_pe_site], none], [[at, receives_medicaid, [det_month]], none], [[not, [any, is_us_citizen_or_national, claims_lawful_immigration_status]], none], [[all, is_pregnant, [not, ma_received_presumptive_eligibility_this_pregnancy], ["<=", attested_household_income_pct_fpl, ma_magi_income_standard_pregnant]], pregnant], [ma_received_presumptive_eligibility_in_last_twelve_months, none], [[all, ["<", age, ma_magi_child_age_limit], ["<=", attested_household_income_pct_fpl, ma_magi_income_standard_child]], child], [[all, ma_alien_payment_restriction_applies, [not, ma_is_in_federal_payment_status_category]], none], [[all, [exists, ma_caretaker_relative_of, [of, [P], ma_is_dependent_child]], ["<=", attested_household_income_pct_fpl, ma_income_limit_parent_caretaker_pct]], parent_caretaker], [[all, [">=", age, ma_magi_child_age_limit], ["<", age, ma_adult_upper_age_limit], ["<=", attested_household_income_pct_fpl, ma_income_limit_adult_pct]], adult], [[all, [">=", age, ma_hospital_pe_employed_disabled_min_age], ma_declares_current_employment, claims_disability, ["<=", ma_attested_own_income_pct_fpl, ma_wawd_income_limit_pct]], employed_disabled], [[all, [">", attested_household_income_pct_fpl, ma_family_planning_income_lower_pct], ["<=", attested_household_income_pct_fpl, ma_family_planning_income_upper_pct]], limited_family_planning], [else, none]]
sources: [S1721, S1722, S1700]
implemented: engine
tags: [ma, magi, income, immigration]
open: [OQ-513]
rationale: "C-5 of the HCPF review: only the MAGI pregnant and child presumptive tests (CO-558, CO-559) existed, under § 8.100.4.F; § 8.100.3.R's hospital groups for adults, parents and caretakers, employed applicants with disabilities and limited family planning had no item."
tests:
