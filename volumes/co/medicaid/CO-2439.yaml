id: CO-2439
name: "Medicaid: hospital presumptive eligibility category"
identifier: ma_hospital_presumptive_eligibility_category
kind: derived
type: one of
options: [pregnant, child, parent_caretaker, adult, employed_disabled, limited_family_planning, none]
scope: person
program: Medicaid
role: outcome
meaning: "The group under which a qualified hospital site may find the applicant presumptively eligible under 10 CCR 2505-10 § 8.100.3.R, from the applicant's declarations, or none: a pregnant woman at or below ma_income_limit_pregnant_pct of the poverty level (R.2.a, once per pregnancy); a child under ma_magi_child_age_limit at or below ma_income_limit_child_pct (R.2.b); a parent or caretaker relative of a dependent child at or below ma_income_limit_parent_caretaker_pct (R.2.e); an adult ma_magi_child_age_limit to ma_adult_upper_age_limit at or below ma_income_limit_adult_pct (R.2.d); an employed applicant ma_hospital_pe_employed_disabled_min_age or older declaring a disability, own income at or below ma_wawd_income_limit_pct (R.2.f); or limited family planning, above ma_family_planning_income_lower_pct and at or below ma_family_planning_income_upper_pct (R.2.c). Outside the pregnant and child groups the applicant declares citizenship or a lawful status; is not already receiving Medical Assistance (R.8) and, except during a new pregnancy, has not had presumptive eligibility in the last 12 months (R.9). From October 1, 2026 only a citizen, national, lawful permanent resident, Cuban or Haitian entrant or COFA migrant qualifies outside the pregnant and child groups (42 U.S.C. 1396b(v)(5)). A pregnant woman and a child need not declare a status (R.2.a-b, 'unless they meet the exceptions'), and a person under 19, pregnant or postpartum (§ 8.100.3.G.1.g.ix.1) qualifies for the employed-disabled group without one (R.2.f; ix.1.b names the Buy-In for working adults with disabilities)."
precision: "Groups are tested in the order listed, so a parent at or below ma_income_limit_parent_caretaker_pct is reported parent_caretaker rather than adult. \"Aged 19-65\" (R.1.c, R.2.d) is read as the Adults group's own range, ma_magi_child_age_limit through the end of the month the person turns 65 (ma_is_under_adult_upper_age_through_birthday_month, CO-4550; § 8.100.1, S3350): Colorado's hospital presumptive eligibility state plan page (CO-13-051-MM, S21, S3363) opens it to the \"Adult Group, if covered by the state\" and selects none of the \"Eligibility groups for individuals age 65 and over\" (OQ-513, resolved by the coverage round). R.2.c's \"cannot be eligible for a Medicaid eligibility category that provides full coverage\" is read through R.8 (not already receiving Medical Assistance), since a presumptive determination is made from declarations before any full determination. Every group is decided on the applicant's declarations (heavier-definitions audit H-9, H-10): household income through declared_household_income_pct_fpl (CO-3151, the declared amount and size, CO-092 and CO-3150); the limited family planning group's \"counted individually as a household member of two\" through CO-3152, the declared size counting the applicant as two (OQ-590); the employed-disabled group's own income through ma_declared_own_income_pct_fpl (CO-3153); and the parent or caretaker relative, guardian or conservator of a dependent child through the declaration ma_declares_parent_or_caretaker_of_dependent_child (CO-3154), not relationship edges. R.2.a, R.2.b and R.2.f except from the status declaration persons who 'meet the exceptions outlined under 8.100.3.G.1.g.viii'; the paragraph that names these categories is ix (ix.1.a: MAGI Pregnant, MAGI Children and the MAGI presumptive categories; ix.1.b: the Buy-In for Working Adults with Disabilities), so the cross-reference is read as ix, as for § 8.100.4.F.2.a-b (CO-558, CO-559; OQ-56, resolved). Every pregnant woman and every child under 19 meets ix.1; an employed applicant with a disability meets it when under 19, pregnant or within 12 months postpartum (ma_is_cover_all_coloradans_person, CO-1173). R.2.c-e (limited family planning, adults, parents and caretakers) have no exception. Coverage review 2, N-02 sweep: the child group reads ma_is_under_child_age_or_turns_nineteen_this_month (CO-564), as the adult group's upper age reads CO-4550 (F-06), so a child in the month of the 19th birthday is in the child group for that month."
statute_override: "Federal law overrides 10 CCR 2505-10 § 8.100.3.R.2.c's floor (\"greater than 133%\"), which the household of two moves to 180% of the one-person guideline: 42 CFR 435.214(c) sets the group's income standard as the one \"established in the State plan\", and Colorado State Plan page S59 (approved 12/18/2013, effective 01/01/2014) covers the 42 CFR 435.214 group at household income \"at or below a standard established by the state\", with no floor, so only the 260% ceiling is tested and R.2.c's \"cannot be eligible for a Medicaid eligibility category that provides full coverage\" is applied by testing the full-coverage groups first (OQ-204, OQ-590)."
