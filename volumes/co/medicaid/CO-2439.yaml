rationale: "C-5 of the HCPF review: only the MAGI pregnant and child presumptive tests (CO-558, CO-559) existed, under § 8.100.4.F; § 8.100.3.R's hospital groups for adults, parents and caretakers, employed applicants with disabilities and limited family planning had no item. Dual-entry audit 3.16 (audit fix round): the R.8 bar reads is_enrolled_in_medical_assistance (CO-2435, renamed from ma_is_receiving_medical_assistance and made program All). Heavier-definitions audit H-9 and H-10 (audit fix round 4): declared amounts and the parent or caretaker declaration in place of supplied ratios and relationship edges. Final verification F-2 (2026-11-22): the status declaration and the October 2026 federal payment limit were tested before the pregnant and child groups, so an undocumented pregnant woman or child at a hospital site got none, contradicting R.2.a-b's exception and the volume's own reading of the same cross-reference (OQ-56). The two tests now apply to the parent and caretaker, adult and limited family planning groups, and to the employed-disabled group only for a person outside ix.1."
