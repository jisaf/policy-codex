id: CO-5172
name: "Medicaid SSI method: a person's exempt earned income"
identifier: ma_ssi_exempt_earned_receipts
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The person's earnings of the month that the SSI method's earnings counting table holds exempt (ma_ssi_earnings_treatment_table, CO-5107: row exempt, or exempt_if_foster_care for a record whose foster_care field is true): earned income in gross income that 10 CCR 2505-10 8.100.5.F.6 or 20 CFR 416.1124 does not count, such as all wages the Census Bureau paid for temporary decennial Census employment (F.6.z), College Work-Study pay (F.6.aa), uniformed services special pay (416.1124(c)(19)) and a Difficulty of Care payment for providing foster care (F.6.l)."
precision: "Earned-income records, Medicaid and CHP+ track E1: replaces decennial_census_wages_received (CO-4881) in ma_ssi_excluded_earned_income (CO-2471) and ma_cbwd_household_earned_income (CO-4200). The exempt pay is its own record, so the exclusions that follow (infrequent pay, the student exclusion) never reach it. Field-effect sweep (docs/reviews/field-sweep-snap-cash-nonmagi.md), FS-MA-2: a record stated as a stream (no month and no date) is received only in the months from the month its job or business began through the month it ended (job_start_date, job_end_date; each absent: before, or through, the months the case covers; CO-5100), since earned income \"is countable as income in the month received\" (10 CCR 2505-10 8.100.5.F.4, S3001) and wages are counted \"when you receive them\" (20 CFR 416.1111(a), S4940); a pay stated with its month or date is placed by it, a final pay after the job ended included. Before, a stream was counted in every month whatever its job's dates. The clause is Adult Financial's and Colorado Works' (af_earned_pay, CO-5130; cw_earned_pay, CO-5140)."
derived: [sum_receipts, earnings, [all, [received_in, [month]], [any, [not, [unknown, [receipt, month]]], [all, [any, [unknown, [receipt, job_start_date]], ["<=", [month_of, [receipt, job_start_date]], [month]]], [any, [unknown, [receipt, job_end_date]], [">=", [month_of, [receipt, job_end_date]], [month]]]]], [any, ["=", [lookup, ma_ssi_earnings_treatment_table, [receipt, kind]], exempt], [all, ["=", [lookup, ma_ssi_earnings_treatment_table, [receipt, kind]], exempt_if_foster_care], [receipt, foster_care]]]], [receipt, amount]]
sources: [S3617, S4674, S3404, S2803, S4940]
implemented: engine
tags: [ma, non_magi, income]
rationale: "Earned-income records, step E1 (Medicaid and CHP+): the exempt earned income read through the counting table, not a named fact subtracted from wages_gross."
nearest: [CO-2471, CO-1703, CO-5161, CO-5162, CO-5175, CO-5178]
tests:
  - {id: CO-5172-T1, month: "2026-10", as_of: "2026-10-01", given: {earnings: [{kind: wages, amount: 900}, {kind: decennial_census_employment, amount: 600}]}, title: "Census wages 600 exempt (F.6.z); wages not: 600", expect: 600}
  - {id: CO-5172-T2, month: "2026-10", as_of: "2026-10-01", given: {earnings: [{kind: wages, amount: 900}]}, title: "None: 0", expect: 0}
  - {id: CO-5172-T3, month: "2026-11", as_of: "2026-11-01", given: {earnings: [{kind: work_study, amount: 2200}, {kind: difficulty_of_care_payment, amount: 600, foster_care: true}, {kind: difficulty_of_care_payment, amount: 400}, {kind: uniformed_services_special_pay, amount: 225}]}, title: "N4-5, N4-3: work-study (F.6.aa), a foster-care Difficulty of Care payment (F.6.l) and special pay (416.1124(c)(19)) exempt; a Difficulty of Care payment for a waiver participant not: 2,200 + 600 + 225 = 3,025", expect: 3025}
  # Field-effect sweep, non-MAGI Medicaid (docs/reviews/field-sweep-snap-cash-nonmagi.md); hand-computed from the text quoted in each title.
  - {id: CO-5172-T4, month: "2026-11", as_of: "2026-11-12", title: "FS-MA-2: work-study pay of 400 a month from a job that ended 2026-10-31: 0", given: {earnings: [{kind: work_study, amount: 400, job_end_date: "2026-10-31"}]}, expect: 0}
