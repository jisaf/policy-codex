id: CO-654
name: "Medicaid: is PACE eligible"
identifier: ma_pace_eligible
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether this person is eligible to enroll in the Program of All-Inclusive Care for the Elderly for the month - a Colorado resident meeting the citizenship and immigration status requirement, aged, blind or disabled, ma_pace_min_age or older, meets the nursing facility level of care, resides in a PACE organization's service area, can live in a community setting without jeopardizing health or safety, and is financially eligible for Long-Term Care - per 10 CCR 2505-10 §§ 8.100.3.F.1.f-g, 8.100.3.G.1, 8.7100.B/8.7100.C.9 and 8.497, and 42 CFR 460.150(b)-(c), which § 8.497.1.B.1 incorporates."
precision: "The age floor is 42 CFR 460.150(b)(1)'s, incorporated by § 8.497.1.B.1 (OQ-93). Residence in a PACE organization's service area (460.150(b)(3)) and the ability to live in a community setting without jeopardizing health or safety (460.150(c)) are tested. Residency, status and aged/blind/disabled are tested; status is ma_meets_citizenship_requirement (CO-509) alone, because § 8.100.3.G.1.g.ix.1.b excepts PACE from the Long-Term Care waivers Cover All Coloradans reaches."
derived: [all, ma_meets_residency, ma_meets_citizenship_requirement, ma_is_aged_blind_or_disabled, [">=", age, ma_pace_min_age], meets_nursing_facility_level_of_care, ma_ltc_financially_eligible, ma_resides_in_pace_service_area, ma_can_live_in_community_without_jeopardy]
sources: [S351, S649, S650, S607, S660, S661, S1726]
implemented: engine
tags: [ma, ltc]
rationale: "No existing item states a PACE eligibility test. ma_ltc_eligibility_status (CO-652) needs it. History moved from the precision note (HCPF review S-14): HCPF fix round (B-3): residence in a PACE organization's service area (460.150(b)(3)) and the ability to live in a community setting without jeopardizing health or safety (460.150(c)) are tested. Phase 7 fix round (B-3): residency, status and aged/blind/disabled are tested; status is ma_meets_citizenship_requirement (CO-509) alone, because § 8.100.3.G.1.g.ix.1.b excepts PACE from the Long-Term Care waivers Cover All Coloradans reaches. Precision history (moved from precision, engineering follow-up pass task 5): (OQ-93, resolved in phase 7)."
