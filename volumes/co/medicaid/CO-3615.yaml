id: CO-3615
name: "Medicaid: LTC earned income"
identifier: ma_ltc_earned_income
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The gross earned income within ma_ltc_gross_income (CO-641) for the month: wages and net self-employment earnings, the income 10 CCR 2505-10 § 8.100.7.V.3.d.iii and V.3.f apply the earned income reserve to."
precision: "Every earned income of a Long-Term Care institution resident is read as coming from an income-producing activity of § 8.100.7.V.3.e (sheltered work, protected employment, vocational rehabilitation, employment training, work within the facility): a resident's earnings come from such an activity in practice, and no fact separates them."
derived: [+, wages_gross, ma_self_employment_net_earnings]
sources: [S2402, S2403]
implemented: engine
tags: [ma, ltc, income]
rationale: "Final verification F-3 (docs/reviews/final-medicaid-chp.md): ma_patient_payment (CO-658) deducted only the personal needs allowance, the community spouse and family allowances and every health insurance premium, in every month; 10 CCR 2505-10 § 8.100.7.V.3.b-i (S2400-S2405) lists further deductions and adds Long-Term Care insurance payments, and limits the Part B premium to the first two months. The earned income reserve needs the earned part of the LTC gross income apart from the unearned part."
tests:
  - {id: CO-3615-T1, as_of: "2026-11-01", month: "2026-11", given: {wages_gross: 300, ma_self_employment_net_earnings: 0, earnings: [{kind: wages, amount: 300}, {kind: self_employment_receipts}]}, expect: 300}
