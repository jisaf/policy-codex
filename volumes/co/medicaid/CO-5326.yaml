id: CO-5326
name: "Medicaid SSI method: the person's retirement accounts counted in the month"
identifier: ma_ssi_retirement_accounts_counted_in_month
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The value at which the person's retirement accounts held in the month count as the person's resource (10 CCR 2505-10 8.100.5.N.2, S3401: \"Self-funded retirement accounts in the name of the applicant are countable as a resource to the applicant\"), at the person's share: each retirement_account holdings record (CO-5300) valued in the month and not transferred."
precision: "Resource records, Medicaid track H1: read by ma_ssi_holdings_countable_in_month (CO-5320) for the person's own figure, and subtracted for a spouse living with the applicant (8.100.5.N.3, by ma_ssi_countable_resources, CO-608) and for a deeming parent (20 CFR 416.1202(b)(1)(i), S3414: pension funds, by ma_ssi_parental_resources_deemed, CO-4627), so the amount subtracted is the amount the spouse's or the parent's own figure counted. The record's self_funded field is not read: retirement_accounts_value (CO-3392), which the records restate, did not tell self-funded accounts from pensions, and N.3 and 416.1202(b)(1)(i) leave both out for the spouse and the parent."
derived: [sum_receipts, holdings, [all, ["=", [receipt, kind], retirement_account], [in, [lookup, ma_ssi_holding_treatment_table, [receipt, kind]], [counted, counted_less_taxes]], [received_in, [month]], [unknown, [receipt, disposed_date]]], ["*", [otherwise, [receipt, share], 1], [receipt, value]]]
sources: [S3401, S3414]
implemented: engine
tags: [ma, non_magi, resources]
rationale: "Resource records, step H1 (Medicaid): the retirement accounts are read from the holdings records once, so the applicant's own count and the spouse's and parent's exemptions read the same figure."
tests:
  # Hand-computed from 8.100.5.N.2 (S3401).
  - {id: CO-5326-T1, month: "2026-10", as_of: "2026-10-01", title: "a 40,000 IRA and a 10,000 401(k) held jointly, half each: 40,000 + 5,000 = 45,000", given: {holdings: [{kind: retirement_account, value: 40000}, {kind: retirement_account, value: 10000, share: 0.5, co_owners: outside_case, holding_id: k}]}, expect: 45000}
  - {id: CO-5326-T2, month: "2026-10", as_of: "2026-10-01", title: "no retirement account: 0", given: {holdings: [{kind: bank_account, value: 300}]}, expect: 0}
