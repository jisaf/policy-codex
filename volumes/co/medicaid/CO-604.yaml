  - {id: CO-604-T3, month: "2026-10", as_of: "2026-10-01", given: {ma_excluded_from_ssi_household: false}, others: {p2: {ma_excluded_from_ssi_household: true}}, relationships: [[spouse, p2]], expect: 1}
