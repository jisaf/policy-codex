id: CO-604
name: "Medicaid: SSI-related household size (self and a spouse living together)"
identifier: ma_ssi_household_size
kind: derived
type: whole number
scope: person-month
program: Medicaid
meaning: 1 for a person with no spouse, or with a spouse who is not living with them (including an institutionalized spouse, beginning the month after admission), or 2 for a person living together with a spouse who is not institutionalized or was admitted this same month - the household size 10 CCR 2505-10 8.100.5.H.1.a's "mutually available" rule and 8.100.6.L.3's couple income comparison for QMB, SLMB and QI1 both key off.
precision: "Living together is modeled as neither spouse counting as ma_excluded_from_ssi_household (CO-661), which is true for an institutionalized spouse only beginning the first day of the month after institution_entry_date per § 8.100.7.C.2.b; in the admission month itself the couple's incomes are still mutually available (§ 8.100.5.H.1.a) and household size stays 2. Batch 9's spousal impoverishment rules govern the LTC couple's resource and income treatment from that point. Coverage pass 4, non-MAGI N4-7: per month, the couple of the month (ma_ssi_couple_members, CO-3626): in a retroactive month before an admission both spouses are at home; from the month after it, each is alone (8.100.7.C.2.b)."
derived: [count, ma_ssi_couple_members]
sources: [S1746, S1759, S1955]
implemented: engine
tags: [ma, non_magi, income, resources, household]
rationale: "No existing item states the SSI-related household size test. ma_ssi_countable_earned_income, ma_ssi_countable_unearned_income (CO-605, CO-606), ma_ssi_countable_resources (CO-608), and the QMB/SLMB/QI/QDWI rules (CO-613-CO-616) all need the same 1-or-2 test rather than each re-deriving the spouse-living-together closure. Precision history (moved from precision, engineering follow-up pass task 5): the phase-4 review's C-21 finding. Same-word audit SW-6: the SSI method treats as spouses two unrelated persons living together who lead people to believe they are married (20 CFR 416.1806(a)(3), S1955), so the holds_out_as_spouse_with role is read beside the legal spouse. Refactor (2026-11-23, before the C3-1 fix): counts ma_ssi_couple_members (CO-3626), the group CO-3626 already wrote out the same way, instead of restating it."
