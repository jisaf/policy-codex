id: CO-566
name: "Medicaid: is in the pregnancy coverage period"
identifier: ma_is_in_pregnancy_coverage_period
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether the month falls within a pregnant or recently-pregnant person's locked-in Medical Assistance coverage period under 10 CCR 2505-10 8.100.4.G.5 and 42 U.S.C. 1396a(e)(5) and (e)(16) - from ma_pregnancy_coverage_period_start_month, a month of the application in which the period opens (ma_pregnancy_coverage_period_opens_in_month, CO-7401), through ma_postpartum_coverage_end_month, during which \"coverage will be provided regardless of changes in the woman's financial circumstances.\""
assumption: "8.100.4.G.5 conditions the lock-in on eligibility having 'been approved' and the income verification requirements being met. The approval is a recorded act: a start month that CBMS's eligibility history records as the Pregnant Women category (ma_prior_enrollment_category = pregnant, CO-2424) opens the period as recorded, without re-deriving that month's category from income facts (heavier-definitions audit H-6). Otherwise the category is computed [at] that month, and the period opens only once neither earned nor unearned income verification is pending in that month (audit L-3, 'once the income verification requirements are met'). The start month is always a month of the application being determined (its application month or a requested retroactive month, CO-565), and the history records approvals made before this determination, not this one: a start month the history records as none or as another category does not block the period, since G.5 provides coverage 'for a period beginning with the date of application' and G.7 and 42 U.S.C. 1396a(e)(16)(A) reach coverage of the birth 'through retroactive Medical Assistance' (coverage pass 5, C5-01: a first-time applicant's history is truthfully none for every month before this determination, and reading it as a determination that she was not covered closed the period for her, her 12 postpartum months and her baby's needy-newborn year with it). The end month (CO-560) is the current text's 12-month period (OQ-52, resolved in phase 7). Coverage pass 6, C6-01 and C6-02 (2026-11-24): the opening test moved to ma_pregnancy_coverage_period_opens_in_month (CO-7401), read at the start month, and the start month (CO-565) is the first month of the application, through the determination month, in which it is met: a month the history records as other Medical Assistance while she was pregnant opens the period too (42 U.S.C. 1396a(e)(5), S5060: 'has received medical assistance under the State plan', any category), so a member enrolled before her pregnancy keeps her 12 postpartum months whatever her income after the birth; and an applicant ineligible in the application month opens it in the first later month of the application in which she met the Pregnant Women category."
precision: "Recorded approval first, computed approval second, as continuous eligibility reads its period (CO-561). The computed arm reads ma_is_pregnant_category (CO-546) [at] the start month, not this month: without it every pregnant applicant was locked into Medicaid whatever her income, so CHP+ prenatal (10 CCR 2505-3 § 110.1.F) was unreachable. It reads the two income verification pending flags (CO-1624, CO-1625) [at] the start month after the category, so an applicant over the standard is decided without them; an applicant within the standard whose verification state is not stated is unknown, not locked in. A history not stated, none, or another category for the start month: the category is computed (C5-01). True for every month from ma_pregnancy_coverage_period_start_month (inclusive) through ma_postpartum_coverage_end_month (inclusive) for a currently pregnant person, or a person whose pregnancy has ended within that window; false, not unknown, before the person has an ma_application_date (the period cannot have started) and once pregnancy_end_date and postpartum coverage have both run out. Coverage review F-16 (fix round 2026-11-23): for the Legal Immigrant Prenatal population (ma_is_legal_immigrant_prenatal_population, CO-5219) the period ends on the events of § 8.100.4.G.6.a: death (i), leaving the required household (iii), unable to be located (v), a withdrawal request (vi) and an erroneous grant (viii), read from the same facts as the continuous-eligibility exceptions of § 8.100.3.Q.1.b (ma_continuous_eligibility_exception_applies, CO-2205). Residency (iv) and becoming an inmate (ii) are carried by ma_magi_eligibility_status (CO-554: ineligible_residency, incarceration_limited). A reasonable opportunity period that ends with documents pending (vii) is carried by the verification outcome, not here: the pending status verification count reads this period, so reading it back would be circular. Coverage pass 6, C6-03 (2026-11-24): the end of the pregnancy is read from most_recent_pregnancy_end_date (CO-7400), so a birth recorded by the child's date of birth and the gave_birth_to relationship ends it; a person not pregnant now who states a pregnancy_start_date with no end and no birth recorded cannot be determined after the start month (the end month is unknown), not read as never pregnant."
derived: [all, [not, [unknown, ma_application_date]], [">=", [month], ma_pregnancy_coverage_period_start_month], [at, ma_pregnancy_coverage_period_opens_in_month, ma_pregnancy_coverage_period_start_month], [any, is_pregnant, [all, [any, [not, [unknown, most_recent_pregnancy_end_date]], [not, [unknown, pregnancy_start_date]]], ["<=", [month], ma_postpartum_coverage_end_month]]], [not, [all, ma_is_legal_immigrant_prenatal_population, [any, is_deceased, ma_has_left_required_household, ma_is_unable_to_be_located, ma_has_requested_withdrawal_from_continuous_eligibility, ma_eligibility_was_erroneously_granted]]]]
sources: [S640, S1719, S3755, S5060, S224]
implemented: engine
tags: [ma, magi]
rationale: "No existing item models 8.100.4.G.5's income-change lock-in for pregnancy-based eligibility - CO-546 (ma_is_pregnant_category) is a plain per-month income test that flips to false the month household income crosses 195% FPL, which the phase-3 review's C-13 finding identifies as the pregnant-category analogue of the continuous-eligibility defect (C-4) fixed for children this round. ma_magi_category (CO-551) and ma_magi_eligibility_status (CO-554) read this item the same way they read ma_child_is_in_continuous_eligibility_period (CO-561). Precision history (moved from precision, engineering follow-up pass task 5): Phase 7. Final verification F-1 (2026-11-22): the start month (CO-565) is now the earliest month of the retroactive window in which the Pregnant Women category was met, so the period, and the 12-month postpartum period after it, reach a woman who delivered before she applied; the rule tests state the start month directly. Coverage review F-16 (fix round 2026-11-23): the Legal Immigrant Prenatal period no longer ignores G.6.a's ending events."
tests:
  - {id: CO-566-T1, as_of: "2026-11-01", month: "2026-11", title: "Still pregnant, income now over 195% FPL - the coverage period protects her anyway", given: {ma_is_legal_immigrant_prenatal_population: false, ma_pregnancy_coverage_period_start_month: "2026-10", ma_application_date: "2026-10-09", is_pregnant: true, ma_is_pregnant_category: {"2026-10": true, "2026-11": false}, ma_earned_income_verification_is_pending: {"2026-10": false}, ma_unearned_income_verification_is_pending: {"2026-10": false}}, expect: true}
  - {id: CO-566-T2, as_of: "2027-01-01", month: "2027-01", title: "Pregnancy ended 2026-03-15; postpartum end month is 2027-03, so January is still in the period", given: {ma_is_legal_immigrant_prenatal_population: false, ma_pregnancy_coverage_period_start_month: "2026-01", ma_application_date: "2026-01-05", is_pregnant: false, pregnancy_end_date: "2026-03-15", ma_is_pregnant_category: {"2026-01": true}, ma_earned_income_verification_is_pending: {"2026-01": false}, ma_unearned_income_verification_is_pending: {"2026-01": false}}, expect: true}
  - {id: CO-566-T3, as_of: "2027-05-01", month: "2027-05", title: "Past the postpartum end month", given: {ma_pregnancy_coverage_period_start_month: "2026-01", ma_application_date: "2026-01-05", is_pregnant: false, pregnancy_end_date: "2026-03-15", ma_is_pregnant_category: {"2026-01": true}, ma_earned_income_verification_is_pending: {"2026-01": false}, ma_unearned_income_verification_is_pending: {"2026-01": false}}, expect: false}
  - {id: CO-566-T4, as_of: "2026-09-01", month: "2026-09", title: "Before the application month - the period has not started", given: {ma_pregnancy_coverage_period_start_month: "2026-10", ma_application_date: "2026-10-09", is_pregnant: true}, expect: false}
  - {id: CO-566-T5, as_of: "2026-10-01", month: "2026-10", title: "Phase 7: pregnant applicant over the 195% standard in the start month - no locked-in period (CHP+ prenatal may apply instead)", given: {ma_pregnancy_coverage_period_start_month: "2026-10", ma_application_date: "2026-10-05", is_pregnant: true, ma_is_pregnant_category: {"2026-10": false}}, expect: false}
  - {id: CO-566-T6, as_of: "2027-01-01", month: "2027-01", title: "H-6: CBMS records October 2026 in the Pregnant Women category; October's income is not stated and her income is now over 195% FPL", given: {ma_is_legal_immigrant_prenatal_population: false, ma_pregnancy_coverage_period_start_month: "2026-10", ma_application_date: "2026-10-09", is_pregnant: true, ma_prior_enrollment_category: {"2026-10": pregnant}, ma_is_pregnant_category: {"2027-01": false}}, expect: true}
  - {id: CO-566-T7, as_of: "2027-01-01", month: "2027-01", title: "C5-01 (was H-6's 'no lock-in'): the history records October, the application month, as another category; she met the Pregnant Women category in October and its income verification was not pending: the period is open from October (the history records earlier approvals, not this application's)", given: {ma_is_legal_immigrant_prenatal_population: false, ma_pregnancy_coverage_period_start_month: "2026-10", ma_application_date: "2026-10-09", is_pregnant: true, ma_prior_enrollment_category: {"2026-10": other_medical_assistance}, ma_is_pregnant_category: {"2026-10": true, "2027-01": false}, ma_earned_income_verification_is_pending: {"2026-10": false}, ma_unearned_income_verification_is_pending: {"2026-10": false}}, expect: true}
  - {id: CO-566-T11, as_of: "2026-11-10", month: "2026-11", title: "C5-01 (MA-PG-DELIVERED): first-time applicant, history none for October, applied 2026-10-05 pregnant, delivered 2026-10-20; October: household 2, 3,250 / 1,803.33 = 180.2% <= 195%, the category met, verification not pending: November is in the period", given: {ma_is_legal_immigrant_prenatal_population: false, ma_pregnancy_coverage_period_start_month: "2026-10", ma_application_date: "2026-10-05", is_pregnant: false, pregnancy_end_date: "2026-10-20", ma_prior_enrollment_category: {"2026-10": none}, ma_is_pregnant_category: {"2026-10": true}, ma_earned_income_verification_is_pending: {"2026-10": false}, ma_unearned_income_verification_is_pending: {"2026-10": false}}, expect: true}
  - {id: CO-566-T12, as_of: "2026-11-10", month: "2027-10", title: "C5-01: the same; the pregnancy ended in October 2026, so October 2027 is the 12th month after it, the last month of the period (G.5)", given: {ma_is_legal_immigrant_prenatal_population: false, ma_pregnancy_coverage_period_start_month: "2026-10", ma_application_date: "2026-10-05", is_pregnant: false, pregnancy_end_date: "2026-10-20", ma_prior_enrollment_category: {"2026-10": none}, ma_is_pregnant_category: {"2026-10": true}, ma_earned_income_verification_is_pending: {"2026-10": false}, ma_unearned_income_verification_is_pending: {"2026-10": false}}, expect: true}
  - {id: CO-566-T13, as_of: "2026-11-10", month: "2027-11", title: "C5-01: the same; November 2027 is past the 12th month after the pregnancy ended: not in the period", given: {ma_is_legal_immigrant_prenatal_population: false, ma_pregnancy_coverage_period_start_month: "2026-10", ma_application_date: "2026-10-05", is_pregnant: false, pregnancy_end_date: "2026-10-20", ma_prior_enrollment_category: {"2026-10": none}, ma_is_pregnant_category: {"2026-10": true}, ma_earned_income_verification_is_pending: {"2026-10": false}, ma_unearned_income_verification_is_pending: {"2026-10": false}}, expect: false}
  - {id: CO-566-T14, as_of: "2026-11-10", month: "2026-11", title: "C5-01: history none for October and the category not met there (her income over 195% + 5): no period", given: {ma_pregnancy_coverage_period_start_month: "2026-10", ma_application_date: "2026-10-05", is_pregnant: true, ma_prior_enrollment_category: {"2026-10": none}, ma_is_pregnant_category: {"2026-10": false}}, expect: false}
  - {id: CO-566-T8, as_of: "2026-11-01", month: "2026-11", title: "L-3: within the standard in October, but earned income verification is still pending for October: not yet locked in", given: {ma_pregnancy_coverage_period_start_month: "2026-10", ma_application_date: "2026-10-09", is_pregnant: true, ma_is_pregnant_category: {"2026-10": true, "2026-11": false}, ma_earned_income_verification_is_pending: {"2026-10": true}, ma_unearned_income_verification_is_pending: {"2026-10": false}}, expect: false}
  - {id: CO-566-T9, as_of: "2026-09-20", month: "2026-12", title: "F-1: delivered 2026-08-10, applied 2026-09-15 with retroactive coverage requested (restated for C6-01: a retroactive month is a month of the application only where requested); the period opened in June, a retroactive month: December is in the postpartum period", given: {ma_retroactive_coverage_requested: true, ma_eligibility_start_date: "2026-01-01", ma_is_legal_immigrant_prenatal_population: false, ma_application_date: "2026-09-15", ma_pregnancy_coverage_period_start_month: "2026-06", is_pregnant: false, pregnancy_end_date: "2026-08-10", ma_is_pregnant_category: {"2026-06": true}, ma_earned_income_verification_is_pending: {"2026-06": false}, ma_unearned_income_verification_is_pending: {"2026-06": false}}, expect: true}
  - {id: CO-566-T10, as_of: "2026-10-15", month: "2026-10", title: "F2-1: retroactive coverage requested but the pregnancy start date not stated: whether a retroactive month opened the period is unknown (ma_magi_category and ma_magi_eligibility_status still answer from this month, CO-551-T9, CO-554-T12)", given: {ma_application_date: "2026-10-05", ma_retroactive_coverage_requested: true, is_pregnant: true, ma_is_pregnant_category: {"2026-10": true}}, expect: unknown}
  - {id: CO-566-T90, as_of: "2026-11-01", month: "2026-11", title: "F-16: a Legal Immigrant Prenatal member who asked to be withdrawn: the period ends (G.6.a.vi)", given: {ma_pregnancy_coverage_period_start_month: "2026-10", ma_application_date: "2026-10-09", is_pregnant: true, ma_prior_enrollment_category: {"2026-10": pregnant}, ma_is_legal_immigrant_prenatal_population: true, is_deceased: false, ma_has_left_required_household: false, ma_is_unable_to_be_located: false, ma_has_requested_withdrawal_from_continuous_eligibility: true, ma_eligibility_was_erroneously_granted: false}, expect: false}
  - {id: CO-566-T15, as_of: "2026-11-10", month: "2026-11", title: "C6-01 (PP-ENROLLED): enrolled since 2025-05-01, the period opened in January 2026 (other Medical Assistance while pregnant, (e)(5)); she gave birth to p2 on 2026-10-15 (a person of the case; no pregnancy_end_date stated): November 2026 is in the period, through October 2027, whatever her income (was false)", given: {ma_is_legal_immigrant_prenatal_population: false, ma_application_date: "2025-05-01", ma_pregnancy_coverage_period_start_month: "2026-01", ma_pregnancy_coverage_period_opens_in_month: {"2026-01": true}, is_pregnant: false}, others: {p2: {date_of_birth: "2026-10-15"}}, relationships: [[gave_birth_to, p1, p2]], expect: true}
  - {id: CO-566-T16, as_of: "2026-11-10", month: "2027-10", title: "C6-01: the same; October 2027 is the 12th month after the birth (October 2026 + 12): in the period", given: {ma_is_legal_immigrant_prenatal_population: false, ma_application_date: "2025-05-01", ma_pregnancy_coverage_period_start_month: "2026-01", ma_pregnancy_coverage_period_opens_in_month: {"2026-01": true}, is_pregnant: false}, others: {p2: {date_of_birth: "2026-10-15"}}, relationships: [[gave_birth_to, p1, p2]], expect: true}
  - {id: CO-566-T17, as_of: "2026-11-10", month: "2027-11", title: "C6-01: the same; November 2027 is after it", given: {ma_is_legal_immigrant_prenatal_population: false, ma_application_date: "2025-05-01", ma_pregnancy_coverage_period_start_month: "2026-01", ma_pregnancy_coverage_period_opens_in_month: {"2026-01": true}, is_pregnant: false}, others: {p2: {date_of_birth: "2026-10-15"}}, relationships: [[gave_birth_to, p1, p2]], expect: false}
