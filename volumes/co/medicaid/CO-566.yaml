id: CO-566
name: "Medicaid: is in the pregnancy coverage period"
identifier: ma_is_in_pregnancy_coverage_period
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: Whether the month falls within a pregnant or recently-pregnant person's locked-in Medical Assistance coverage period under 10 CCR 2505-10 8.100.4.G.5 - from ma_pregnancy_coverage_period_start_month through ma_postpartum_coverage_end_month, during which "coverage will be provided regardless of changes in the woman's financial circumstances."
assumption: "8.100.4.G.5 conditions the lock-in on eligibility having 'been approved' and the income verification requirements being met. The approval is a recorded act: a start month that CBMS's eligibility history records as the Pregnant Women category (ma_prior_enrollment_category = pregnant, CO-2424) opens the period as recorded, without re-deriving that month's category from income facts (heavier-definitions audit H-6). Only where no history is recorded for the start month (the application being determined) is the category computed [at] that month, and then the period opens only once neither earned nor unearned income verification is pending in that month (audit L-3, 'once the income verification requirements are met'). A start month the history records as any other category, or none, opens no period. The end month (CO-560) is the current text's 12-month period (OQ-52, resolved in phase 7)."
precision: "Recorded approval first, computed approval second, as continuous eligibility reads its period (CO-561). The computed arm reads ma_is_pregnant_category (CO-546) [at] the start month, not this month: without it every pregnant applicant was locked into Medicaid whatever her income, so CHP+ prenatal (10 CCR 2505-3 § 110.1.F) was unreachable. It reads the two income verification pending flags (CO-1624, CO-1625) [at] the start month after the category, so an applicant over the standard is decided without them; an applicant within the standard whose verification state is not stated is unknown, not locked in. If the start month's history is not stated, Medicaid reads it as no recorded approval and computes. True for every month from ma_pregnancy_coverage_period_start_month (inclusive) through ma_postpartum_coverage_end_month (inclusive) for a currently pregnant person, or a person whose pregnancy has ended within that window; false, not unknown, before the person has an ma_application_date (the period cannot have started) and once pregnancy_end_date and postpartum coverage have both run out."
derived: [all, [not, [unknown, ma_application_date]], [">=", [month], ma_pregnancy_coverage_period_start_month], [any, [otherwise, ["=", [at, ma_prior_enrollment_category, ma_pregnancy_coverage_period_start_month], pregnant], false], [all, [unknown, [at, ma_prior_enrollment_category, ma_pregnancy_coverage_period_start_month]], [at, ma_is_pregnant_category, ma_pregnancy_coverage_period_start_month], [not, [at, ma_earned_income_verification_is_pending, ma_pregnancy_coverage_period_start_month]], [not, [at, ma_unearned_income_verification_is_pending, ma_pregnancy_coverage_period_start_month]]]], [any, is_pregnant, [all, [not, [unknown, pregnancy_end_date]], ["<=", [month], ma_postpartum_coverage_end_month]]]]
sources: [S640, S1719]
implemented: engine
tags: [ma, magi]
rationale: "No existing item models 8.100.4.G.5's income-change lock-in for pregnancy-based eligibility - CO-546 (ma_is_pregnant_category) is a plain per-month income test that flips to false the month household income crosses 195% FPL, which the phase-3 review's C-13 finding identifies as the pregnant-category analogue of the continuous-eligibility defect (C-4) fixed for children this round. ma_magi_category (CO-551) and ma_magi_eligibility_status (CO-554) read this item the same way they read ma_child_is_in_continuous_eligibility_period (CO-561). Precision history (moved from precision, engineering follow-up pass task 5): Phase 7."
tests:
  - {id: CO-566-T1, as_of: "2026-11-01", month: "2026-11", title: "Still pregnant, income now over 195% FPL - the coverage period protects her anyway", given: {ma_application_date: "2026-10-09", is_pregnant: true, ma_is_pregnant_category: {"2026-10": true, "2026-11": false}, ma_earned_income_verification_is_pending: {"2026-10": false}, ma_unearned_income_verification_is_pending: {"2026-10": false}}, expect: true}
  - {id: CO-566-T2, as_of: "2027-01-01", month: "2027-01", title: "Pregnancy ended 2026-03-15; postpartum end month is 2027-03, so January is still in the period", given: {ma_application_date: "2026-01-05", is_pregnant: false, pregnancy_end_date: "2026-03-15", ma_is_pregnant_category: {"2026-01": true}, ma_earned_income_verification_is_pending: {"2026-01": false}, ma_unearned_income_verification_is_pending: {"2026-01": false}}, expect: true}
  - {id: CO-566-T3, as_of: "2027-05-01", month: "2027-05", title: "Past the postpartum end month", given: {ma_application_date: "2026-01-05", is_pregnant: false, pregnancy_end_date: "2026-03-15", ma_is_pregnant_category: {"2026-01": true}, ma_earned_income_verification_is_pending: {"2026-01": false}, ma_unearned_income_verification_is_pending: {"2026-01": false}}, expect: false}
  - {id: CO-566-T4, as_of: "2026-09-01", month: "2026-09", title: "Before the application month - the period has not started", given: {ma_application_date: "2026-10-09", is_pregnant: true}, expect: false}
  - {id: CO-566-T5, as_of: "2026-10-01", month: "2026-10", title: "Phase 7: pregnant applicant over the 195% standard in the start month - no locked-in period (CHP+ prenatal may apply instead)", given: {ma_application_date: "2026-10-05", is_pregnant: true, ma_is_pregnant_category: {"2026-10": false}}, expect: false}
  - {id: CO-566-T6, as_of: "2027-01-01", month: "2027-01", title: "H-6: CBMS records October 2026 in the Pregnant Women category; October's income is not stated and her income is now over 195% FPL", given: {ma_application_date: "2026-10-09", is_pregnant: true, ma_prior_enrollment_category: {"2026-10": pregnant}, ma_is_pregnant_category: {"2027-01": false}}, expect: true}
  - {id: CO-566-T7, as_of: "2027-01-01", month: "2027-01", title: "H-6: the history records October as another category: no pregnancy lock-in from October", given: {ma_application_date: "2026-10-09", is_pregnant: true, ma_prior_enrollment_category: {"2026-10": other_medical_assistance}, ma_is_pregnant_category: {"2026-10": true, "2027-01": false}}, expect: false}
  - {id: CO-566-T8, as_of: "2026-11-01", month: "2026-11", title: "L-3: within the standard in October, but earned income verification is still pending for October: not yet locked in", given: {ma_application_date: "2026-10-09", is_pregnant: true, ma_is_pregnant_category: {"2026-10": true, "2026-11": false}, ma_earned_income_verification_is_pending: {"2026-10": true}, ma_unearned_income_verification_is_pending: {"2026-10": false}}, expect: false}
