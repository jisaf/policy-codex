  - {id: CO-4978-T2, month: "2026-11", as_of: "2026-11-10", title: "Coverage review 2, RV2-NB: born 2025-11-05, still 0 on November 1", given: {date_of_birth: "2025-11-05"}, expect: 0}
  - {id: CO-4978-T3, month: "2026-11", as_of: "2026-11-01", title: "18th birthday on November 1", given: {date_of_birth: "2008-11-01"}, expect: 18}
