id: CO-5531
name: "Medicaid: a community spouse's or family member's unearned receipts"
identifier: ma_spousal_unearned_receipts
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The unearned income of a community spouse or a dependent family member received in the month, as the spousal impoverishment rules count the person's own income (10 CCR 2505-10 § 8.100.7.R.2, T.1.c; 42 U.S.C. 1396r-5(d)): every receipt the SSI method's counting table (CO-5510) treats as income other than child support and the cash assistance of Colorado Works and Adult Financial (counted, counted because no rule excludes it, rents, exempt), and a retroactive SSI payment, at its gross amount; not a loan, an income tax refund or VA Aid and Attendance, which are not income. Gambling winnings are added by the readers (ma_ssi_gambling_receipts)."
precision: "Child support and Colorado Works or Adult Financial cash are left out, as the ledger read the community spouse's and the family members' income before receipt records (child_support_received, tanf_cash_income and adult_financial_cash_income were not among the facts summed); OQ-974 asks whether they belong. VA Aid and Attendance (the receipts of kind va_aid_and_attendance) is left out, an assumption pending OQ-1050: 8.100.5.K (S2900) says the portion \"shall not be considered as income when determining eligibility\", and this figure is post-eligibility (the community spouse monthly income allowance and the family allowance are deducted after the institutionalized spouse is determined eligible, 42 U.S.C. 1396r-5(d)(1)-(2), S4201; 8.100.7.T.1, S1736), where 8.100.7.R.2 (S1756) measures \"gross income\" and K.1-2 speak only of the institutionalized veteran's patient payment. The text does not settle it the other way either: 8.100.5.F.5.j.vi (S3001), the income section for the long-term care programs, lists \"Veterans benefits other than Aid and Attendance (A&A) and Unusual Medical Expenses (UME)\" as unearned income, and 20 CFR 416.1103(b)(1) (S4200) gives \"Cash given you by the Department of Veterans Affairs to purchase aid and attendance\" as not income at all; neither is tied to eligibility. Counting it would lower the allowance by the amount of the portion (OQ-1050 gives a worked example). Field-effect sweep (docs/reviews/field-sweep-snap-cash-nonmagi.md), FS-MA-1: a receipt stated as a stream (no month and no date) is received only in the months from the month of its start_date through the month of its end_date (each absent: before, or through, the months the case covers; CO-5000), since unearned income \"is countable as income in the month received\" (10 CCR 2505-10 8.100.5.F.5, S3001) and is counted \"when you receive it\" (20 CFR 416.1123(a), S4940); in its first and last months it is read at its amount, and a payment stated with its month or date is placed by it, a final payment after the stream ended included. Before, a stream was counted in every month whatever its dates. The clause is SNAP's (snap_counted_recurring_receipts, CO-5011)."
derived: [sum_receipts, receipts, [all, [received_in, [month]], [any, [not, [unknown, [receipt, month]]], [all, [any, [unknown, [receipt, start_date]], ["<=", [month_of, [receipt, start_date]], [month]]], [any, [unknown, [receipt, end_date]], [">=", [month_of, [receipt, end_date]], [month]]]]], [any, [in, [lookup, ma_ssi_receipt_treatment_table, [receipt, kind]], [counted, counted_no_rule_excludes, counted_net_of_expenses, exempt]], [all, [receipt, retroactive], [in, [lookup, ma_ssi_receipt_treatment_table, [receipt, kind]], [ssi_benefit]]]]], [receipt, amount]]
sources: [S1756, S1736, S3001, S2209, S2900, S4200, S4201, S4940]
implemented: engine
tags: [ma, ltc, income]
open: [OQ-974, OQ-1050]
rationale: "Receipt records, migration phase 2: replaces the scalar facts summed for the community spouse's income (CO-2467) and a family member's income (CO-657). Nearest: ma_ssi_gross_unearned_receipts (CO-5514), the gross income of long-term care, which counts child support and cash assistance; the spousal rules' sum left them out, so the two are kept apart rather than one subtracted from the other."
nearest: [CO-5514]
tests:
  - {id: CO-5531-T1, month: "2026-10", as_of: "2026-10-01", given: {receipts: [{kind: social_security, amount: 900}, {kind: pension, amount: 300}, {kind: general_assistance, amount: 100}, {kind: child_support, amount: 200}, {kind: colorado_works_cash, amount: 400}, {kind: loan, amount: 500}, {kind: va_aid_and_attendance, amount: 250}]}, title: "Social Security, a pension and General Assistance counted; child support, Colorado Works cash, a loan and VA Aid and Attendance not", expect: 1300}
  - {id: CO-5531-T2, month: "2026-10", as_of: "2026-10-01", given: {receipts: [{kind: social_security, amount: 1500}, {kind: va_aid_and_attendance, amount: 400}]}, title: "OQ-1050 assumption: a community spouse with $1,500 Social Security and a $400 VA Aid and Attendance portion: $1,500 (counting the portion would give $1,900)", expect: 1500}
  # Field-effect sweep, non-MAGI Medicaid (docs/reviews/field-sweep-snap-cash-nonmagi.md); hand-computed from the text quoted in each title.
  - {id: CO-5531-T3, month: "2026-11", as_of: "2026-11-12", title: "FS-MA-1: the community spouse's Social Security 1,000 and a pension that ended 2026-10-31: 1,000", given: {receipts: [{kind: social_security, amount: 1000}, {kind: pension, amount: 600, end_date: "2026-10-31"}]}, expect: 1000}
