  - {id: CO-502-T2, month: "2026-10", as_of: "2026-10-01", given: {wages_gross: 0, self_employment_gross_receipts: 0, self_employment_net_earnings_for_tax: 0, magi_other_taxable_income: 0, foreign_earned_income_excluded: 0, pretax_deductions: 100, discharged_student_loan_debt: 0, receipts: [{kind: social_security, amount: 1420}, {kind: ssi}, {kind: pension, amount: 610}, {kind: child_support}, {kind: colorado_works_cash}, {kind: adult_financial_cash}, {kind: tax_exempt_interest, amount: 50}], earnings: []}, expect: 1980}
