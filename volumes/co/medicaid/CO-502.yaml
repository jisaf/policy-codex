id: CO-502
name: "Medicaid: person's MAGI-based income"
identifier: ma_person_magi_income
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "This person's own MAGI-based income for the month under 42 CFR 435.603(e) and 10 CCR 2505-10 § 8.100.4.C - taxable earned and unearned income (including Social Security benefits, whether or not taxable, capital gains, lottery and gambling winnings in the month received, and countable discharged student loan debt), plus tax-exempt interest and excluded foreign earned income added back in, minus above-the-line pretax deductions (including pre-tax 401(k)/403(b) contributions, net operating losses and capital losses)."
precision: "Monthly amount for the month in context. Child support received, Supplemental Security Income, and TANF cash assistance are excluded per § 8.100.4.C.1.d; a lump sum is counted only in the month received (§ 8.100.4.C.1.d.i and 435.603(e)(1)) - this item reads its supplied income facts as already stating that convention, per this volume's shared income-fact meanings - except lottery and gambling winnings over $79,999, which § 8.100.4.C.1.b.xiv spreads over two or more months for the winner: this item counts winnings in the month received (ma_lottery_winnings_counted_in_month_received, CO-1186), which is how they count for the other members of the winner's household (xiv.4), and ma_magi_household_income (CO-503) substitutes the spread amount when the household is the winner's own. Capital gains (xiii) are in other_taxable_income (CO-079); discharged student loan debt (xv) is ma_countable_discharged_student_loan_income (CO-1190), not other_taxable_income or other_unearned_income; pre-tax 401(k) or 403(b) contributions, net operating losses and capital losses (§ 8.100.4.C.1.e.viii, xiii-xv) are in pretax_deductions (CO-080), since earned_income (CO-023) is gross wages. Rounded to the nearest dollar following this volume's snap_household_gross_income convention (halves up), since no MAGI-specific rounding election is stated in the cited text. Phase 7 fix round (S-9) added the winnings and student loan terms."
derived: [round, ["-", [+, earned_income, self_employment_net_income, other_taxable_income, social_security_income, pension_income, unemployment_income, other_unearned_income, tax_exempt_interest, foreign_earned_income_excluded, ma_lottery_winnings_counted_in_month_received, ma_countable_discharged_student_loan_income], pretax_deductions]]
sources: [S164, S165, S166, S167, S669, S670, S671]
implemented: engine
tags: [ma, magi, income]
rationale: "No existing item computes a single person's MAGI-based income; ma_magi_household_income (CO-503) sums this fact over each countable household member. Built from the shared batch-1 income facts plus this batch's own MAGI-specific additions (other_taxable_income, tax_exempt_interest, foreign_earned_income_excluded, pretax_deductions) rather than reusing a SNAP income item, because MAGI counts Social Security and tax-exempt interest that SNAP's countable-income facts do not and excludes SSI/TANF/child support that SNAP counts differently."
tests:
  - {id: CO-502-T1, as_of: "2026-10-01", month: "2026-10", given: {earned_income: 2380, self_employment_net_income: 0, other_taxable_income: 0, social_security_income: 0, pension_income: 0, unemployment_income: 0, other_unearned_income: 0, tax_exempt_interest: 0, foreign_earned_income_excluded: 0, pretax_deductions: 0, lottery_gambling_winnings_amount: 0, discharged_student_loan_debt: 0}, expect: 2380}
  - {id: CO-502-T2, as_of: "2026-10-01", month: "2026-10", given: {earned_income: 0, self_employment_net_income: 0, other_taxable_income: 0, social_security_income: 1420, pension_income: 610, unemployment_income: 0, other_unearned_income: 0, tax_exempt_interest: 50, foreign_earned_income_excluded: 0, pretax_deductions: 100, lottery_gambling_winnings_amount: 0, discharged_student_loan_debt: 0}, expect: 1980}
  - {id: CO-502-T3, as_of: "2026-10-01", month: "2026-10", title: "Phase 7 fix round (S-9): $100,000 lottery win in October counts whole in the month received here; $12,000 private student loan cancelled", given: {earned_income: 2000, self_employment_net_income: 0, other_taxable_income: 0, social_security_income: 0, pension_income: 0, unemployment_income: 0, other_unearned_income: 0, tax_exempt_interest: 0, foreign_earned_income_excluded: 0, pretax_deductions: 0, lottery_gambling_winnings_amount: 100000, lottery_gambling_winnings_month: "2026-10", discharged_student_loan_debt: 12000, student_loan_discharge_reason: other}, expect: 114000}
