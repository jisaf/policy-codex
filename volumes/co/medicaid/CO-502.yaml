id: CO-502
name: "Medicaid: person's MAGI-based income"
identifier: ma_person_magi_income
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: This person's own MAGI-based income for the month under 42 CFR 435.603(e) and 10 CCR 2505-10 § 8.100.4.C - taxable earned and unearned income (including Social Security benefits, whether or not taxable, capital gains, lottery and gambling winnings in the month received, and countable discharged student loan debt), plus tax-exempt interest and excluded foreign earned income added back in, minus above-the-line pretax deductions (including pre-tax 401(k)/403(b) contributions, net operating losses and capital losses).
precision: "Monthly amount for the month in context. Child support received, Supplemental Security Income, and TANF cash assistance are excluded per § 8.100.4.C.1.d; a lump sum is counted only in the month received (§ 8.100.4.C.1.d.i and 435.603(e)(1)), which the receipts state by their month or date - except lottery and gambling winnings over $79,999, which § 8.100.4.C.1.b.xiv spreads over two or more months for the winner: this item counts winnings in the month received (ma_magi_gambling_receipts, CO-5502), which is how they count for the other members of the winner's household (xiv.4), and ma_magi_household_income (CO-503) substitutes the spread amount when the household is the winner's own. Capital gains (xiii) are in magi_other_taxable_income (CO-079); discharged student loan debt (xv) is ma_countable_discharged_student_loan_income (CO-1190), not magi_other_taxable_income or other_unearned_income_nontaxable; pre-tax 401(k) or 403(b) contributions, net operating losses and capital losses (§ 8.100.4.C.1.e.viii, xiii-xv) are in pretax_deductions (CO-080), since wages_gross (CO-023) is gross wages. Rounded to the nearest dollar following this volume's snap_household_gross_income convention (halves up), since no MAGI-specific rounding election is stated in the cited text. Phase 7 fix round (S-9) added the winnings and student loan terms. Unearned income is the receipts the MAGI counting table counts (ma_magi_unearned_receipts, CO-5501; ma_magi_receipt_treatment_table, CO-5500), each kind with its paragraph of 8.100.4.C.1; non-taxable money (gifts, veterans' benefits, workers' compensation) is not MAGI income (8.100.4.C.1.d). Self-employment is the federal tax figure (self_employment_net_earnings_for_tax, CO-024). Coverage review F-18 (fix round 2026-11-23): Difficulty of Care payments are part of wages_gross (difficulty_of_care_payments_received, CO-5209) and are subtracted when § 8.100.3.K.7 excludes them (ma_excluded_difficulty_of_care_payments, CO-5214)."
derived: [round, ["-", ["-", ["+", wages_gross, self_employment_net_earnings_for_tax, magi_other_taxable_income, ma_magi_unearned_receipts, foreign_earned_income_excluded, ma_magi_gambling_receipts, ma_countable_discharged_student_loan_income], pretax_deductions], ma_excluded_difficulty_of_care_payments]]
sources: [S164, S165, S166, S167, S669, S670, S671, S3754]
implemented: engine
tags: [ma, magi, income]
rationale: "No existing item computes a single person's MAGI-based income; ma_magi_household_income (CO-503) sums this fact over each countable household member. Built from the shared batch-1 income facts plus this batch's own MAGI-specific additions (magi_other_taxable_income, tax_exempt_interest, foreign_earned_income_excluded, pretax_deductions) rather than reusing a SNAP income item, because MAGI counts Social Security and tax-exempt interest that SNAP's countable-income facts do not and excludes SSI/TANF/child support that SNAP counts differently. History moved from the precision note (HCPF review S-14): Vocabulary fix round (R-1): reads the taxable part of other unearned income (other_unearned_income_taxable, CO-1714); the non-taxable part (gifts and contributions, veterans' benefits, workers' compensation; other_unearned_income_nontaxable, CO-030) is not MAGI income (8.100.4.C.1.d). Self-employment is the federal tax figure (self_employment_net_earnings_for_tax, CO-024). OQ-216 (audit fix round 4): reads the month's receipt (lottery_gambling_winnings_received, CO-1181) directly, which is § 8.100.4.C.1.b.xiv.4's \"count only in the month received\" for the other members; ma_lottery_winnings_counted_in_month_received (CO-1186), which restated it, is retired. Coverage review F-18 (fix round 2026-11-23): Difficulty of Care payments, deferred twice, now have a fact and K.7's conditions. Receipt records, migration phase 2 (2026-11-23): Social Security, pensions, unemployment, the taxable other income and tax-exempt interest are the receipts the MAGI counting table counts (ma_magi_unearned_receipts, CO-5501), and the month's winnings ma_magi_gambling_receipts (CO-5502), instead of the scalar facts."
