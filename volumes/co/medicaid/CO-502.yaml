  - {id: CO-502-T5, month: "2026-10", as_of: "2026-10-01", given: {magi_other_taxable_income: 0, foreign_earned_income_excluded: 0, pretax_deductions: 150, discharged_student_loan_debt: 0, receipts: [], lives_full_time_with_care_recipient: true, care_recipient_receives_hcbs_waiver_services: true, difficulty_of_care_younger_foster_individuals: 0, difficulty_of_care_older_foster_individuals: 0, earnings: [{kind: wages, amount: 2000}, {kind: difficulty_of_care_payment, amount: 1800}, {kind: self_employment_receipts, amount: 900, net_for_tax: 600}, {kind: business_cost_operating, amount: 300}]}, title: "Earned-income records (E1): wages 2,000 + Difficulty of Care 1,800 (excluded for a live-in provider, K.7) + the business's net for tax 600 (not its 900 of receipts) - pretax deductions 150 = 2,000 + 1,800 + 600 - 150 - 1,800 = 2,450", expect: 2450}
