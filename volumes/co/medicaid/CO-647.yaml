id: CO-647
name: "Medicaid: institutionalized spouse's countable resources"
identifier: ma_institutionalized_spouse_countable_resources
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The countable resources attributed to the institutionalized spouse for their own eligibility - the Medicaid countable resources (ma_ssi_countable_resources_individual) of the person and the spouse together minus the CSRA, for a person with a community spouse, or the person's own figure for the month otherwise (ma_ssi_countable_resources_in_month, CO-5322) - per 42 U.S.C. 1396r-5(c)(2) and 10 CCR 2505-10 §§ 8.100.7.O.1 and 8.100.5.N.4 (a community spouse's retirement accounts count)."
precision: "The spouse is the legal spouse wherever each lives, as in ssi_countable_resources_couple (CO-801). When the CSRA has not been transferred to the community spouse by the deadline of § 8.100.7.M.3 (ma_csra_transfer_is_overdue, CO-4636), the couple's resources are attributed to the institutionalized spouse without the allowance (coverage review NM-19). Resource records, Medicaid track H1 (docs/reviews/records-holdings-medicaid.md): the couple excludes one automobile (20 CFR 416.1218(b), S4660; 42 U.S.C. 1396r-5(c)(5) counts the resources the SSI rules do not exclude): the smaller of the spouses' excluded automobiles (ma_ssi_excluded_automobile_equity_in_month, CO-5321, at the determination month) is added back to the two individual figures. A joint holding of the spouses is counted once (each spouse's list states its share). Coverage pass 4, non-MAGI N4-6: the couple excludes one automobile, a car the two own together counted once at its whole equity: the two spouses' own excluded automobiles (ma_ssi_excluded_automobile_equity_in_month, CO-5321) are added back less the couple's one, the larger of the two spouses' ma_ssi_couple_automobile_equity_in_month (CO-6733, a joint car at its whole equity), at least 0. For two different cars this is the smaller car, as before; for one joint car, nothing (it had added back the other spouse's half of the same car). Coverage pass 6, non-MAGI F6-2 (docs/reviews/coverage6-medicaid-nonmagi.md): per month. A person with no community spouse is judged each month on the holdings at that month's first moment (ma_ssi_countable_resources_in_month, CO-5322; 20 CFR 416.1207(a), S4501), so a retroactive month in which the person held more than the limit is not resource eligible (10 CCR 2505-10 8.100.3.E.1, S1503: a retroactive month needs \"all applicable eligibility requirements\" met in it; 8.100.7.A.2.f, the resource limits of 8.100.5). Before, every month read the determination month's figure (ma_ssi_countable_resources_individual, CO-4623), so a nursing facility resident who spent down before applying was resource eligible in the retroactive months. The couple's attribution and the CSRA stay at their dates (the spousal snapshot and attribution of 8.100.7.L-O are made at the application and the determination)."
derived: [case, [[all, ma_ltc_couple, [not, [otherwise, ma_csra_transfer_is_overdue, false]]], [max, 0, ["-", ["+", ma_ssi_countable_resources_individual, [sum, [filter, [persons], [otherwise, [rel, [spouse], [P]], false]], [of, [P], ma_ssi_countable_resources_individual]], [max, 0, ["-", ["+", [at, ma_ssi_excluded_automobile_equity_in_month, [det_month]], [sum, [filter, [persons], [otherwise, [rel, [spouse], [P]], false]], [at, [of, [P], ma_ssi_excluded_automobile_equity_in_month], [det_month]]]], [max, [at, ma_ssi_couple_automobile_equity_in_month, [det_month]], [sum, [filter, [persons], [otherwise, [rel, [spouse], [P]], false]], [at, [of, [P], ma_ssi_couple_automobile_equity_in_month], [det_month]]]]]]], ma_csra]]], [ma_ltc_couple, ["+", ma_ssi_countable_resources_individual, [sum, [filter, [persons], [otherwise, [rel, [spouse], [P]], false]], [of, [P], ma_ssi_countable_resources_individual]], [max, 0, ["-", ["+", [at, ma_ssi_excluded_automobile_equity_in_month, [det_month]], [sum, [filter, [persons], [otherwise, [rel, [spouse], [P]], false]], [at, [of, [P], ma_ssi_excluded_automobile_equity_in_month], [det_month]]]], [max, [at, ma_ssi_couple_automobile_equity_in_month, [det_month]], [sum, [filter, [persons], [otherwise, [rel, [spouse], [P]], false]], [at, [of, [P], ma_ssi_couple_automobile_equity_in_month], [det_month]]]]]]]], [else, ma_ssi_countable_resources_in_month]]
sources: [S357, S373, S3418, S4660, S4501, S1503]
implemented: engine
tags: [ma, ltc, resources]
rationale: "No existing item combines the CSRA subtraction with the non-couple fallback to ssi_countable_resources_individual. ma_meets_ltc_resource_standard (CO-648) needs it. The target household's p1 (46000 - CSRA) is the worked example in the batch report. Dual-entry audit 2.6: reads the couple's resources through ssi_countable_resources_of_couple (CO-2861), so the figure is stated on one spouse. Coverage review NM-1, NM-2, NM-4, NM-5: reads Medicaid's own per-person figure (CO-4623), so burial funds over the exclusion, income-producing property, the home where § 8.100.5.M.2.a counts it, and the exclusion of real property for sale or co-owned with a resident (M.2.b.vi keeps the property in the spousal assessment of § 8.100.7.L while efforts to sell it are made) reach the long-term care test."
