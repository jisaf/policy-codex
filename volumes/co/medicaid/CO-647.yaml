  - {id: CO-647-T7, month: "2026-10", as_of: "2026-11-12", title: "F6-2: no community spouse, the month after the spend-down (1,200)", given: {ma_ltc_couple: false, holdings: [{kind: bank_account, value: 8000, month: "2026-08"}, {kind: bank_account, value: 1200, month: "2026-10"}]}, expect: 1200}
