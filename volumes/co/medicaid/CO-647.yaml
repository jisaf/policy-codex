id: CO-647
name: "Medicaid: institutionalized spouse's countable resources"
identifier: ma_institutionalized_spouse_countable_resources
kind: derived
type: money
scope: person
program: Medicaid
meaning: The countable resources attributed to the institutionalized spouse for their own eligibility - countable_resources_couple minus the CSRA, for a person with a community spouse, or their own countable_resources_individual otherwise - per 42 U.S.C. 1396r-5(c)(2) and 10 CCR 2505-10 § 8.100.7.O.1.
derived: [case, [ma_ltc_couple, ["max", 0, ["-", countable_resources_couple, ma_csra]]], [else, countable_resources_individual]]
sources: [S357, S373]
implemented: engine
tags: [ma, ltc, resources]
rationale: "No existing item combines the CSRA subtraction with the non-couple fallback to countable_resources_individual. ma_meets_ltc_resource_standard (CO-648) needs it. The target household's p1 (46000 - CSRA) is the worked example in the batch report."
tests:
  - {id: CO-647-T1, as_of: "2026-10-01", given: {ma_ltc_couple: true, countable_resources_couple: 46000, ma_csra: 30000, countable_resources_individual: 1900}, expect: 16000}
  - {id: CO-647-T2, as_of: "2026-10-01", given: {ma_ltc_couple: false, countable_resources_couple: 0, ma_csra: 0, countable_resources_individual: 1900}, expect: 1900}
