id: CO-647
name: "Medicaid: institutionalized spouse's countable resources"
identifier: ma_institutionalized_spouse_countable_resources
kind: derived
type: money
scope: person
program: Medicaid
meaning: "The countable resources attributed to the institutionalized spouse for their own eligibility - the Medicaid countable resources (ma_ssi_countable_resources_individual) of the person and the spouse together minus the CSRA, for a person with a community spouse, or the person's own figure otherwise - per 42 U.S.C. 1396r-5(c)(2) and 10 CCR 2505-10 §§ 8.100.7.O.1 and 8.100.5.N.4 (a community spouse's retirement accounts count)."
precision: "The spouse is the legal spouse wherever each lives, as in ssi_countable_resources_couple (CO-801). When the CSRA has not been transferred to the community spouse by the deadline of § 8.100.7.M.3 (ma_csra_transfer_is_overdue, CO-4636), the couple's resources are attributed to the institutionalized spouse without the allowance (coverage review NM-19)."
derived: [case, [[all, ma_ltc_couple, [not, [otherwise, ma_csra_transfer_is_overdue, false]]], ["max", 0, ["-", [+, ma_ssi_countable_resources_individual, [sum, [filter, [persons], [otherwise, [rel, [spouse], [P]], false]], [of, [P], ma_ssi_countable_resources_individual]]], ma_csra]]], [ma_ltc_couple, [+, ma_ssi_countable_resources_individual, [sum, [filter, [persons], [otherwise, [rel, [spouse], [P]], false]], [of, [P], ma_ssi_countable_resources_individual]]]], [else, ma_ssi_countable_resources_individual]]
sources: [S357, S373, S3418]
implemented: engine
tags: [ma, ltc, resources]
rationale: "No existing item combines the CSRA subtraction with the non-couple fallback to ssi_countable_resources_individual. ma_meets_ltc_resource_standard (CO-648) needs it. The target household's p1 (46000 - CSRA) is the worked example in the batch report. Dual-entry audit 2.6: reads the couple's resources through ssi_countable_resources_of_couple (CO-2861), so the figure is stated on one spouse. Coverage review NM-1, NM-2, NM-4, NM-5: reads Medicaid's own per-person figure (CO-4623), so burial funds over the exclusion, income-producing property, the home where § 8.100.5.M.2.a counts it, and the exclusion of real property for sale or co-owned with a resident (M.2.b.vi keeps the property in the spousal assessment of § 8.100.7.L while efforts to sell it are made) reach the long-term care test."
tests:
  - {id: CO-647-T1, as_of: "2026-10-01", given: {ma_ltc_couple: true, ma_ssi_countable_resources_individual: 1900, ma_csra: 30000}, others: {p2: {ma_ssi_countable_resources_individual: 44100}}, relationships: [[spouse, p2]], expect: 16000}
  - {id: CO-647-T2, as_of: "2026-10-01", given: {ma_ltc_couple: false, ma_csra: 0, ma_ssi_countable_resources_individual: 1900}, expect: 1900}
  - {id: CO-647-T3, as_of: "2026-10-01", title: "NM-19: the CSRA was not transferred in time", given: {ma_ltc_couple: true, ma_csra_transfer_is_overdue: true, ma_ssi_countable_resources_individual: 1900, ma_csra: 30000}, others: {p2: {ma_ssi_countable_resources_individual: 44100}}, relationships: [[spouse, p2]], expect: 46000}
