id: CO-5515
name: "Medicaid: Social Security benefits received in the month"
identifier: ma_social_security_receipts
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The person's current Social Security (Title II, OASDI) benefits received in the month, at the gross amount: the receipts of kind social_security other than a retroactive payment. The benefit the Pickle, Disabled Adult Child and disabled widow(er) groups disregard in whole or in part (10 CCR 2505-10 8.100.6.D-E, J; 42 U.S.C. 1383c(d)) and whose January cost-of-living increase the Medicare Savings Programs disregard (8.100.6.L.12, M.7, N.6)."
derived: [sum_receipts, receipts, [all, [received_in, [month]], ["=", [receipt, kind], social_security], [not, [receipt, retroactive]]], [receipt, amount]]
sources: [S623, S626, S3416, S2406]
implemented: engine
tags: [ma, non_magi, income]
rationale: "Receipt records, migration phase 2: replaces social_security_income in the Pickle, Disabled Adult Child and Medicare Savings Program items (CO-1158, CO-1160, CO-5221, CO-3627); a retroactive payment was not part of social_security_income before receipt records (it was part of the lump sum)."
tests:
  - {id: CO-5515-T1, month: "2026-10", as_of: "2026-10-01", given: {receipts: [{kind: social_security, amount: 1100}, {kind: social_security, amount: 2400, frequency: once, retroactive: true, month: "2026-10"}, {kind: pension, amount: 300}]}, title: "The current benefit; a retroactive payment and a pension are not", expect: 1100}
