id: CO-1965
name: "Medicaid community engagement: is a specified excluded individual"
identifier: ma_is_specified_excluded_individual
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether, this month, the person is a specified excluded individual under 42 CFR 435.554(c), to whom community engagement is not a condition of eligibility (435.554(b)): former foster care youth (ma_is_former_foster_care_category); an Indian (447.51); a parent, guardian, caretaker relative or qualifying family caregiver of a dependent child or disabled individual; a veteran rated totally disabled; medically frail; complying with the State's TANF work requirements; a member of a SNAP household who is not exempt from SNAP work requirements; participating in a drug addiction or alcoholic treatment and rehabilitation program (7 U.S.C. 2012(h)); an inmate of a public institution; or pregnant or entitled to postpartum medical assistance."
precision: "Former foster care is read through ma_is_former_foster_care_category (CO-549), which states the 1902(a)(10)(A)(i)(IX) group without the turned-18-after-2023 condition, as 435.554(c)(1) directs. Postpartum entitlement under 1902(e)(5) or (16) is read through ma_is_in_pregnancy_coverage_period (CO-566). Participation in a treatment program reads participates_in_drug_alcohol_treatment (CO-045), whose meaning is the 7 U.S.C. 2012(h) program 435.554(c)(8) adopts; Colorado states no minimum time commitment (OQ-412). Evaluated in the determination month for the applicable-individual test (CO-1974) and in each look-back month as a mandatory exception (CO-1969). Coverage pass 5 (2026-11-23, the class of C5-02 and C5-03): pregnancy is read for the month evaluated (ma_is_pregnant_in_month, CO-3601), not on the determination date (is_pregnant), so a retroactive month in which the person was pregnant is a pregnant month although the pregnancy has ended, and a month before a pregnancy began is not."
derived: [any, ma_is_former_foster_care_category, ma_is_indian, ma_is_parent_guardian_or_caretaker_relative_of_care_recipient, ma_is_family_caregiver_for_community_engagement, is_veteran_rated_totally_disabled, ma_is_medically_frail, complies_with_tanf_work_requirements, [all, receives_snap, [not, ma_is_exempt_from_snap_work_requirements]], participates_in_drug_alcohol_treatment, is_inmate_of_public_institution, ma_is_pregnant_in_month, ma_is_in_pregnancy_coverage_period]
sources: [S1208, S1209, S1214]
implemented: engine
tags: [ma, magi]
open: [OQ-412]
accepts_from:
  - {from: participates_in_drug_alcohol_treatment, class: primitive, source: S1209}
rationale: "OQ-65: the ten exclusions of 435.554(c), each read from its own item or fact. Dual-entry audit 4.1 (audit fix round): the SNAP exclusion reads the volume's own SNAP work-requirement exemptions (ma_is_exempt_from_snap_work_requirements, CO-2711); SNAP receipt stays the record receives_snap."
