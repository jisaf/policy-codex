id: CO-1177
name: "Medicaid: is eligible as an OAP recipient meeting SSI criteria except income (SISC B)"
identifier: ma_oap_sisc_b_eligible
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether the person is an Old Age Pension recipient who receives Medical Assistance under SISC B because the person also meets SSI eligibility criteria except for the level of income - 10 CCR 2505-10 §§ 8.100.6.K.2-4, 8.100.3.F.1.c-d and 8.100.3.M.2.b: receives OAP (adult_financial_program_received, CO-2710), a Colorado resident, meets Medicaid's citizenship and immigration status requirement, aged, blind or disabled, and within the SSI resource standard."
precision: "'Meets SSI eligibility criteria except for the level of their income' is read as residency, status (CO-509), aged, blind or disabled in the month (CO-5201, which applies the disability onset of § 8.100.5.C.4.b) and the SSI resource standard (CO-610), and Medical Assistance not denied for non-cooperation (ma_abd_denied_for_noncooperation, CO-4886; § 8.100.5.E.6, § 8.100.7.V.2.c), since SISC B is a Medical Assistance category; the SSI income standard is not tested, so an OAP grant above the SSI federal benefit rate does not defeat it. § 8.100.3.M.2.b names only OAP \"A\" for code B while § 8.100.6.K.4 names OAP-A and OAP-B; the Adult Financial record carries a single OAP category, so both are read (OQ-206). OAP recipients who lost OAP to a non-OASDI cost of living adjustment (§ 8.100.6.K.7) are SISC C, not SISC B, so this item reads current OAP receipt only; ma_oap_health_care_status (CO-1156) brings them in through ma_lost_oap_to_non_oasdi_cost_of_living_adjustment (OQ-206, resolved). Pattern sweep, non-MAGI Medicaid (docs/reviews/pattern-sweep-nonmagi.md, P1): OAP receipt is read in the month (ma_receives_oap_in_month, CO-7508: for a month before the determination month, not before the month the program began, adult_financial_program_start_date, CO-7507). Before, the program of the determination date was read in every month."
derived: [all, ma_receives_oap_in_month, ma_meets_residency_in_month, ma_meets_citizenship_requirement_in_month, ma_is_aged_blind_or_disabled_in_month, ma_meets_ssi_resource_standard, [not, ma_abd_denied_for_noncooperation]]
sources: [S621, S665, S660, S3621, S3623, S1503]
implemented: engine
tags: [ma, oap, non_magi]
rationale: "S-3 of the phase 7 review: OAP recipients who meet SSI criteria except income had no Medicaid route; ma_oap_health_care_status (CO-1156) reported them medicaid_eligible but ma_ssi_related_category (CO-612) tested the SSI income standard and reported none. No existing item states SISC B. Read by CO-612, CO-1150 (without status), CO-1156 and ma_has_full_coverage_category (CO-1176). Vocabulary fix round (governance read.cross_program): accepts_from lists the other programs' items this rule reads on purpose. The Medicaid rule names the other program's result (OAP receipt, CHP+ eligibility). Heavier-definitions audit H-3 (audit fix round; OQ-542 resolved): OAP receipt reads the Adult Financial case record (adult_financial_program_received, CO-2710), not this volume's own Adult Financial determination (af_category), as \"persons receiving OAP\" (§ 8.100.6.K.2-4) says. Coverage pass 3 C3-2: the non-cooperation denial and the onset gate were applied to SISC B only inside ma_ssi_related_category (CO-612), so ma_has_full_coverage_category (CO-1176), which reads this item directly, still counted a denied OAP recipient as fully covered and ma_oap_health_care_status (CO-1156) gave no coverage at all; both gates are now here."
tests:
  - {id: CO-1177-T1, as_of: "2026-10-01", month: "2026-10", title: "OAP recipient, citizen, aged, within the SSI resource standard", given: {adult_financial_program_received: oap, is_colorado_resident: true, ma_meets_citizenship_requirement_in_month: true, ma_is_aged_blind_or_disabled_in_month: true, ma_meets_ssi_resource_standard: true, ma_abd_denied_for_noncooperation: false}, expect: true}
  - {id: CO-1177-T2, as_of: "2026-10-01", month: "2026-10", title: "OAP recipient inside the five-year rule", given: {adult_financial_program_received: oap, is_colorado_resident: true, ma_meets_citizenship_requirement_in_month: false}, expect: false}
  - {id: CO-1177-T3, as_of: "2026-10-01", month: "2026-10", title: "Not an OAP recipient", given: {adult_financial_program_received: "none"}, expect: false}
  - {id: CO-1177-T4, as_of: "2026-10-01", month: "2026-10", title: "OAP recipient over the SSI resource standard", given: {adult_financial_program_received: oap, is_colorado_resident: true, ma_meets_citizenship_requirement_in_month: true, ma_is_aged_blind_or_disabled: true, ma_meets_ssi_resource_standard: false}, expect: false}
  - {id: CO-1177-T90, as_of: "2026-10-12", month: "2026-10", title: "C3-2 (Z-NONCOOP): an OAP recipient denied Medical Assistance under E.6 is not SISC B", given: {adult_financial_program_received: oap, state_of_residence: "CO", immigration_status: us_citizen, date_of_birth: "1950-03-01", is_pregnant: false, ma_is_aged_blind_or_disabled_in_month: true, ma_meets_ssi_resource_standard: true, ma_abd_denied_for_noncooperation: true}, expect: false}
  # Pattern sweep P1: OAP from 2026-10-01, determined 2026-11-12. August: not yet an OAP recipient: false.
  - {id: CO-1177-T91, month: "2026-08", as_of: "2026-11-12", title: "Pattern sweep: a retroactive month before OAP began", given: {adult_financial_program_received: oap, adult_financial_program_start_date: "2026-10-01"}, expect: false}
  # MS-1 (Medicaid status by month): moved to Colorado 2026-09-20, applied 2026-10-15, determined 2026-11-10; residency in the month (CO-7650): August, before the application month, month_of(2026-09-20) = 2026-09 > 2026-08: not a resident; September, the month of the move: a resident.
  - {id: "CO-1177-T120", month: "2026-08", as_of: "2026-11-10", title: "MS-1, a retroactive month before and after the move to Colorado: 2026-08, before", given: {state_of_residence: "CO", state_of_residence_start_date: "2026-09-20", ma_application_date: "2026-10-15", ma_receives_oap_in_month: true, ma_meets_citizenship_requirement_in_month: true, ma_is_aged_blind_or_disabled_in_month: true, ma_meets_ssi_resource_standard: true, ma_abd_denied_for_noncooperation: false}, expect: false}
  - {id: "CO-1177-T121", month: "2026-09", as_of: "2026-11-10", title: "MS-1, a retroactive month before and after the move to Colorado: 2026-09, after", given: {state_of_residence: "CO", state_of_residence_start_date: "2026-09-20", ma_application_date: "2026-10-15", ma_receives_oap_in_month: true, ma_meets_citizenship_requirement_in_month: true, ma_is_aged_blind_or_disabled_in_month: true, ma_meets_ssi_resource_standard: true, ma_abd_denied_for_noncooperation: false}, expect: true}
