id: CO-1177
name: "Medicaid: is eligible as an OAP recipient meeting SSI criteria except income (SISC B)"
identifier: ma_oap_sisc_b_eligible
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether the person is an Old Age Pension recipient who receives Medical Assistance under SISC B because the person also meets SSI eligibility criteria except for the level of income - 10 CCR 2505-10 §§ 8.100.6.K.2-4, 8.100.3.F.1.c-d and 8.100.3.M.2.b: receives OAP (af_category, CO-953), a Colorado resident, meets Medicaid's citizenship and immigration status requirement, aged, blind or disabled, and within the SSI resource standard."
precision: "'Meets SSI eligibility criteria except for the level of their income' is read as residency, status (CO-509), aged, blind or disabled (CO-603) and the SSI resource standard (CO-610); the SSI income standard is not tested, so an OAP grant above the SSI federal benefit rate does not defeat it. § 8.100.3.M.2.b names only OAP \"A\" for code B while § 8.100.6.K.4 names OAP-A and OAP-B; af_category carries a single OAP category, so both are read (OQ-206). OAP recipients who lost OAP to a non-OASDI cost of living adjustment (§ 8.100.6.K.7) are SISC C, not SISC B, so this item reads current OAP receipt only; ma_oap_health_care_status (CO-1156) brings them in through ma_lost_oap_to_non_oasdi_cost_of_living_adjustment (OQ-206, resolved)."
derived: [all, ["=", af_category, oap], is_colorado_resident, ma_meets_citizenship_requirement, ma_is_aged_blind_or_disabled, ma_meets_ssi_resource_standard]
sources: [S621, S665, S660]
open: [OQ-206]
implemented: engine
tags: [ma, oap, non_magi]
accepts_from: [af_category]
rationale: "S-3 of the phase 7 review: OAP recipients who meet SSI criteria except income had no Medicaid route; ma_oap_health_care_status (CO-1156) reported them medicaid_eligible but ma_ssi_related_category (CO-612) tested the SSI income standard and reported none. No existing item states SISC B. Read by CO-612, CO-1150 (without status), CO-1156 and ma_has_full_coverage_category (CO-1176). Vocabulary fix round (governance read.cross_program): accepts_from lists the other programs' items this rule reads on purpose. The Medicaid rule names the other program's result (OAP receipt, CHP+ eligibility)."
tests:
  - {id: CO-1177-T1, as_of: "2026-10-01", month: "2026-10", title: "OAP recipient, citizen, aged, within the SSI resource standard", given: {af_category: oap, is_colorado_resident: true, ma_meets_citizenship_requirement: true, ma_is_aged_blind_or_disabled: true, ma_meets_ssi_resource_standard: true}, expect: true}
  - {id: CO-1177-T2, as_of: "2026-10-01", month: "2026-10", title: "OAP recipient inside the five-year rule", given: {af_category: oap, is_colorado_resident: true, ma_meets_citizenship_requirement: false}, expect: false}
  - {id: CO-1177-T3, as_of: "2026-10-01", month: "2026-10", title: "Not an OAP recipient", given: {af_category: "none"}, expect: false}
  - {id: CO-1177-T4, as_of: "2026-10-01", month: "2026-10", title: "OAP recipient over the SSI resource standard", given: {af_category: oap, is_colorado_resident: true, ma_meets_citizenship_requirement: true, ma_is_aged_blind_or_disabled: true, ma_meets_ssi_resource_standard: false}, expect: false}
