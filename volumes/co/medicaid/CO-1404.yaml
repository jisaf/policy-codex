id: CO-1404
name: "Medicaid: requires verification of unearned income"
identifier: ma_requires_verification_of_unearned_income
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether the person's unearned income must be verified for Medical Assistance: for an aged, blind or disabled applicant whenever received; for others, who may self-attest it, only when questionable."
derived: [all, has_unearned_income, [any, ma_is_aged_blind_or_disabled, unearned_income_attestation_is_questionable]]
sources: [S862, S866, S863]
implemented: engine
tags: [verification, ma, income]
rationale: No existing item states this Medical Assistance verification requirement; the phase-9 chapter needs one item per element so the person's pending counts and status can be derived.
tests:
  - {id: CO-1404-T1, month: "2026-10", as_of: "2026-10-01", given: {has_unearned_income: true, ma_is_aged_blind_or_disabled: true}, expect: true}
  - {id: CO-1404-T2, month: "2026-10", as_of: "2026-10-01", given: {has_unearned_income: true, ma_is_aged_blind_or_disabled: false, unearned_income_attestation_is_questionable: false}, expect: false}
  - {id: CO-1404-T3, month: "2026-10", as_of: "2026-10-01", given: {has_unearned_income: false}, expect: false}
