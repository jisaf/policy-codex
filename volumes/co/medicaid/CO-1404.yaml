id: CO-1404
name: "Medicaid: requires verification of unearned income"
identifier: ma_requires_verification_of_unearned_income
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether the person's unearned income must be verified for Medical Assistance: for an aged, blind or disabled applicant whenever unearned income was received in the month or in the month before (§ 8.100.5.B.1.d), except that a Medicare Savings Program applicant's interest and dividends are taken on attestation (42 CFR 435.952(e)(1)(i)); for others, who may self-attest it, only when questionable; unless documentation is not reasonably available."
precision: "Heavier-definitions audit L-5 (audit fix round 4): \"received in the month for which eligibility is being determined or during the previous month\" is read as the month evaluated and the calendar month before it, so income that stopped last month is still verified. Audit H-14: for an MSP-only application (ma_application_is_msp_only) the aged, blind or disabled arm reads has_unearned_income_other_than_interest_and_dividends (CO-3159), so interest and dividends alone require no verification; the resources half of 435.952(e) is ma_requires_verification_of_resources (CO-1405)."
derived: [all, [not, documentation_not_reasonably_available], [any, [all, ma_is_aged_blind_or_disabled, [any, [case, [ma_application_is_msp_only, has_unearned_income_other_than_interest_and_dividends], [else, has_unearned_income]], [at, [case, [ma_application_is_msp_only, has_unearned_income_other_than_interest_and_dividends], [else, has_unearned_income]], [month_before, [month]]]]], [all, has_unearned_income, unearned_income_attestation_is_questionable]]]
sources: [S862, S866, S863, S839, S1089]
implemented: engine
tags: [verification, ma, income]
rationale: "No existing item states this Medical Assistance verification requirement; the phase-9 chapter needs one item per element so the person's pending counts and status can be derived. Heavier-definitions audit H-14 and L-5 (audit fix round 4): MSP interest and dividends on attestation; the previous month read."
tests:
  - {id: CO-1404-T1, month: "2026-10", as_of: "2026-10-01", given: {has_unearned_income: true, ma_is_aged_blind_or_disabled: true, ma_application_is_msp_only: false, documentation_not_reasonably_available: false}, expect: true}
  - {id: CO-1404-T2, month: "2026-10", as_of: "2026-10-01", given: {has_unearned_income: true, ma_is_aged_blind_or_disabled: false, unearned_income_attestation_is_questionable: false, documentation_not_reasonably_available: false}, expect: false}
  - {id: CO-1404-T3, month: "2026-10", as_of: "2026-10-01", given: {has_unearned_income: false, ma_is_aged_blind_or_disabled: false, documentation_not_reasonably_available: false}, expect: false}
  - {id: CO-1404-T4, month: "2026-10", as_of: "2026-10-01", given: {has_unearned_income: true, documentation_not_reasonably_available: true}, expect: false}
  - {id: CO-1404-T9, month: "2026-10", as_of: "2026-10-01", title: "H-14: MSP-only applicant whose only unearned income, in October and September, is interest", given: {documentation_not_reasonably_available: false, ma_is_aged_blind_or_disabled: true, ma_application_is_msp_only: true, has_unearned_income_other_than_interest_and_dividends: {"2026-10": false, "2026-09": false}, has_unearned_income: true, unearned_income_attestation_is_questionable: false}, expect: false}
  - {id: CO-1404-T10, month: "2026-10", as_of: "2026-10-01", title: "H-14: the same $35 of interest for an applicant for full Medical Assistance as disabled", given: {documentation_not_reasonably_available: false, ma_is_aged_blind_or_disabled: true, ma_application_is_msp_only: false, social_security_income: 0, pension_income: 0, unemployment_income: 0, child_support_received: 0, tanf_cash_income: 0, adult_financial_cash_income: 0, other_unearned_income_taxable: 35, taxable_interest_and_dividend_income: 35, other_unearned_income_nontaxable: 0, tax_exempt_interest: 0}, expect: true}
  - {id: CO-1404-T11, month: "2026-10", as_of: "2026-10-01", title: "L-5: an aged applicant whose pension stopped in September", given: {documentation_not_reasonably_available: false, ma_is_aged_blind_or_disabled: true, ma_application_is_msp_only: false, has_unearned_income: {"2026-10": false, "2026-09": true}}, expect: true}
  - {id: CO-1404-T12, month: "2026-10", as_of: "2026-10-01", title: "L-5: no unearned income in October or September", given: {documentation_not_reasonably_available: false, ma_is_aged_blind_or_disabled: true, ma_application_is_msp_only: false, has_unearned_income: {"2026-10": false, "2026-09": false}, unearned_income_attestation_is_questionable: false}, expect: false}
