id: CO-4975
name: "Medicaid: MAGI household income for the budget period"
identifier: ma_budget_period_household_income
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "This person's MAGI household income under the budget period rules of 10 CCR 2505-10 § 8.100.4.C.4: the month's income (ma_magi_household_income, CO-503), or, where it is lower, the annualized income of a household with self-employment, seasonal or commission earnings (ma_annualized_household_income, CO-4559; C.4.a)."
precision: "C.4.a applies the annualized figure to \"Applicants who are found financially ineligible based on current or previous monthly household income\"; each MAGI standard, the limited Family Planning ceiling included, is a ceiling, so the lower of the two gives that order for every test (OQ-810). Where nothing is annualized the two are the same. Every MAGI income ratio divides this figure: ma_budget_period_household_income_pct_fpl (CO-4567) over the MAGI household size and ma_family_planning_household_income_pct_fpl (CO-1153) over the Family Planning size."
derived: [min, ma_magi_household_income, ma_annualized_household_income]
sources: [S3356]
implemented: engine
tags: [ma, magi, income]
open: [OQ-810]
nearest: [CO-4567, CO-4559]
rationale: "Coverage review 3, C3-02 (2026-11-22): limited Family Planning (CO-1153) divided the month's income alone, so C.4.a's annualized figure, which F-04 gave every other MAGI test inside CO-4567, never reached it. The budget-period amount is factored out of CO-4567 unchanged so both ratios read the same figure rather than their own copies."
tests:
  - {id: CO-4975-T1, month: "2026-11", as_of: "2026-11-10", title: "Coverage review 3, RV3-FPA: $6,000 this month, $3,000 a month annualized: the annualized figure", given: {ma_magi_household_income: 6000, ma_annualized_household_income: 3000}, expect: 3000}
  - {id: CO-4975-T2, month: "2026-11", as_of: "2026-11-10", title: "Annualized higher than the month: the month's figure", given: {ma_magi_household_income: 1000, ma_annualized_household_income: 1500}, expect: 1000}
