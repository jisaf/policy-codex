  - {id: CO-1163-T4, as_of: "2026-10-01", month: "2026-10", given: {ma_is_aged_blind_or_disabled: true, is_colorado_resident: true, ma_meets_citizenship_requirement: true, retains_ssi_status_without_payment: false, ma_dac_eligible: false, ma_disabled_widow_eligible: true}, expect: disabled_widow}
