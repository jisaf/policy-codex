id: CO-1163
name: "Medicaid: protected SSI-related group"
identifier: ma_protected_group_category
kind: derived
type: one of
options: [none, continued_ssi_status, disabled_adult_child, disabled_widow, pickle]
scope: person-month
program: Medicaid
role: outcome
meaning: "Which protected group keeps an aged, blind or disabled person on Medical Assistance after SSI or OAP cash ends: SSI recipients who remain eligible as SSI recipients without a payment, including section 1619(b) (10 CCR 2505-10 §§ 8.100.1, 8.100.6.C.8) - continued_ssi_status; Disabled Adult Children (§ 8.100.6.J) - disabled_adult_child; disabled widow(er)s aged 50 through 64 (§ 8.100.6.I) - disabled_widow; the Pickle Amendment group (§ 8.100.6.D-E) - pickle; or none."
precision: "A person who is not aged, blind or disabled (CO-603) is none without further facts. The groups are tested in the order listed and the first that applies is reported. Continued SSI status also requires residency and status, as the other groups do. The 1972-disregard, 1973 and 1983-actuarial-change groups (§§ 8.100.6.F-H) are closed historical cohorts and are not modeled (OQ-209). Disabled widow(er)s meet the SSI-related income and resource criteria without the widow(er)'s benefit (CO-1162, coverage review NM-9). The non-cooperation denial (ma_abd_denied_for_noncooperation, CO-4886) is tested after continued SSI status: a member who remains eligible as an SSI recipient without a payment, 1619(b) included, \"shall receive Medical Assistance benefits\" (§ 8.100.6.C.8) on the SSA's determination, as ma_ssi_related_category (CO-612) and ma_is_ssi_related_eligible (CO-611) exempt an SSI recipient from the denial (coverage pass 3 C3-9)."
derived: [case, [[not, ma_is_aged_blind_or_disabled], "none"], [[all, ma_meets_residency, ma_meets_citizenship_requirement, retains_ssi_status_without_payment], "continued_ssi_status"], [ma_abd_denied_for_noncooperation, "none"], [ma_dac_eligible, "disabled_adult_child"], [ma_disabled_widow_eligible, "disabled_widow"], [ma_pickle_eligible, "pickle"], [else, "none"]]
sources: [S627, S626, S625, S623, S624, S3621, S3622]
open: [OQ-209]
implemented: engine
tags: [ma, non_magi, disability]
rationale: "ma_ssi_related_category (CO-612) reports SSI receipt and the SSI-related standards but none of the groups § 8.100.3.F.1.e and h and § 8.100.6.C-J protect after the cash payment ends. Declared an outcome. Coverage pass 2 (first pass NM-28): denied when ma_abd_denied_for_noncooperation (CO-4886) holds (§ 8.100.5.E.6, § 8.100.7.V.2.c). Coverage pass 3 C3-9: the denial had been tested before continued SSI status, unlike CO-612's SSI-recipient exception, with no record of why the two differed."
