id: CO-663
name: "Medicaid: SSI-related household gross unearned income"
identifier: ma_ssi_household_unearned_income_sum
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "This person's (and, if living together, their spouse's) combined unearned income for the month that the SSI-related method counts, before the allocations and the $20 general income disregard, per 10 CCR 2505-10 8.100.5.H.4.a: each member's counted unearned receipts (ma_ssi_unearned_receipts: Social Security, pensions, unemployment and the other kinds the SSI method's counting table counts, less what it exempts), in-kind support and maintenance, and gambling winnings."
precision: "The same spouse-living-together group sum ma_ssi_countable_unearned_income (CO-606) applies the $20 general exclusion to, extracted as its own item so ma_ssi_countable_earned_income (CO-605) can read the pre-exclusion total directly, per 20 CFR 416.1124(c)(12)'s carryover of any unused part of the $20 exclusion to earned income. The couple is ma_ssi_couple_members (CO-3626), which reads resides_in_medical_institution (CO-1742) through ma_excluded_from_ssi_household and ma_is_institutionalized_spouse_in_institution, not SNAP's majority-of-meals institution fact. Each member's unearned income is the receipts the SSI method's counting table counts (ma_ssi_unearned_receipts, CO-5511; ma_ssi_receipt_treatment_table, CO-5510), what 8.100.5.F.6 and 20 CFR 416.1124 exempt already left out. Final verification pass 3, pattern sweep (income methods): lottery and gambling winnings are unearned income in the month received (§ 8.100.5.F.4-5, F.5.i, S3001) and are counted, unless the person has the hardship exemption of F.5.i.1 (ma_lottery_winnings_hardship_exemption_granted, CO-2222, whose terms are the same as § 8.100.4.C.1.b.xiv.5's; the winnings are ma_ssi_gambling_receipts, CO-5512); and in-kind support and maintenance is not counted for an unemancipated child (§ 8.100.5.H.1.b, \"This does not apply to unemancipated children\"; ma_is_ssi_unemancipated_child, CO-2275). Coverage pass 3 C3-13 (P3, noted): the F.5.i.1 hardship exemption is read from the person evaluated, not from each member, so an applicant's exemption also removes a living-together spouse's winnings; F.5.i.1 makes it \"an applicant/member's\" request. Left as is in this round (P3); a per-member reading would be [of, [P], ma_lottery_winnings_hardship_exemption_granted]."
derived: [sum, ma_ssi_couple_members, [max, 0, ["+", [of, [P], ma_ssi_unearned_receipts], [case, [[otherwise, [of, [P], ma_is_ssi_unemancipated_child], false], 0], [else, [of, [P], ssi_in_kind_support_and_maintenance]]], [case, [[otherwise, ma_lottery_winnings_hardship_exemption_granted, false], 0], [else, [of, [P], ma_ssi_gambling_receipts]]]]]]
sources: [S308, S310, S1955, S3001, S1506]
implemented: engine
tags: [ma, non_magi, income]
open: [OQ-822]
rationale: "Final verification pass 3, pattern sweep (2026-11-22): the sum left out lottery and gambling winnings, which § 8.100.5.F.5.i counts, and counted in-kind support and maintenance for an unemancipated child, which § 8.100.5.H.1.b excludes. No existing item exposes the SSI-related household's combined unearned income before the $20 exclusion; ma_ssi_countable_unearned_income (CO-606) previously computed it inline and discarded it. ma_ssi_countable_earned_income (CO-605) needs the pre-exclusion figure to find how much of the $20 exclusion is unused. History moved from the precision note (HCPF review S-14): Vocabulary fix round (docs/reviews/vocabulary-reuse.md, R-8): reads resides_in_medical_institution (CO-1742), not SNAP's majority-of-meals institution fact. HCPF fix round (OQ-390): unearned income 20 CFR 416.1124 excludes is subtracted for each member (ma_ssi_excluded_unearned_income, CO-2470, read as 0 when not stated). Precision history (moved from precision, engineering follow-up pass task 5): the phase-4 review's C-9 finding. Same-word audit SW-6: the SSI method treats as spouses two unrelated persons living together who lead people to believe they are married (20 CFR 416.1806(a)(3), S1955), so the holds_out_as_spouse_with role is read beside the legal spouse. Coverage pass 3 C3-1: sums over ma_ssi_couple_members (CO-3626), which keeps a newly admitted spouse in the couple through the admission month (§ 8.100.7.C.2.b) except for the institutionalized spouse's own test (42 U.S.C. 1396r-5(b)(1)); it had filtered on resides_in_medical_institution, which split the couple's incomes from the admission day while the size and resources still read them together. Receipt records, migration phase 2 (2026-11-23): each member's unearned income is ma_ssi_unearned_receipts (CO-5511) and the winnings ma_ssi_gambling_receipts (CO-5512), from the receipts, instead of the scalar facts less ma_ssi_excluded_unearned_income (CO-2470)."
