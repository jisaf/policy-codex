id: CO-663
name: "Medicaid: SSI-related household gross unearned income"
identifier: ma_ssi_household_unearned_income_sum
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: This person's (and, if living together, their spouse's) combined gross unearned income for the month - Social Security, pension, unemployment, other unearned income, and in-kind support and maintenance - before any exclusion, per 10 CCR 2505-10 8.100.5.H.4.a.
precision: "The same spouse-living-together group sum ma_ssi_countable_unearned_income (CO-606) applies the $20 general exclusion to, extracted as its own item so ma_ssi_countable_earned_income (CO-605) can read the pre-exclusion total directly, per 20 CFR 416.1124(c)(12)'s carryover of any unused part of the $20 exclusion to earned income. Reads resides_in_medical_institution (CO-1742), not SNAP's majority-of-meals institution fact. Unearned income 20 CFR 416.1124 excludes is subtracted for each member (ma_ssi_excluded_unearned_income, CO-2470, read as 0 when not stated). Final verification pass 3, pattern sweep (income methods): lottery and gambling winnings are unearned income in the month received (§ 8.100.5.F.4-5, F.5.i, S3001) and are counted, unless the person has the hardship exemption of F.5.i.1 (ma_lottery_winnings_hardship_exemption_granted, CO-2222, whose terms are the same as § 8.100.4.C.1.b.xiv.5's; an unstated receipt is 0); and in-kind support and maintenance is not counted for an unemancipated child (§ 8.100.5.H.1.b, \"This does not apply to unemancipated children\"; ma_is_ssi_unemancipated_child, CO-2275)."
derived: [sum, [reachable, [spouse, holds_out_as_spouse_with], [all, [not, resides_in_medical_institution], [not, [of, [P], resides_in_medical_institution]]]], [max, 0, ["-", ["+", [of, [P], social_security_income], [of, [P], pension_income], [of, [P], unemployment_income], [of, [P], other_unearned_income_taxable], [of, [P], other_unearned_income_nontaxable], [of, [P], tax_exempt_interest], [case, [[otherwise, [of, [P], ma_is_ssi_unemancipated_child], false], 0], [else, [of, [P], ssi_in_kind_support_and_maintenance]]], [case, [[otherwise, ma_lottery_winnings_hardship_exemption_granted, false], 0], [else, [otherwise, [of, [P], lottery_gambling_winnings_received], 0]]]], [otherwise, [of, [P], ma_ssi_excluded_unearned_income], 0]]]]
sources: [S308, S310, S1955, S3001, S1506]
implemented: engine
tags: [ma, non_magi, income]
open: [OQ-822]
rationale: "Final verification pass 3, pattern sweep (2026-11-22): the sum left out lottery and gambling winnings, which § 8.100.5.F.5.i counts, and counted in-kind support and maintenance for an unemancipated child, which § 8.100.5.H.1.b excludes. No existing item exposes the SSI-related household's combined unearned income before the $20 exclusion; ma_ssi_countable_unearned_income (CO-606) previously computed it inline and discarded it. ma_ssi_countable_earned_income (CO-605) needs the pre-exclusion figure to find how much of the $20 exclusion is unused. History moved from the precision note (HCPF review S-14): Vocabulary fix round (docs/reviews/vocabulary-reuse.md, R-8): reads resides_in_medical_institution (CO-1742), not SNAP's majority-of-meals institution fact. HCPF fix round (OQ-390): unearned income 20 CFR 416.1124 excludes is subtracted for each member (ma_ssi_excluded_unearned_income, CO-2470, read as 0 when not stated). Precision history (moved from precision, engineering follow-up pass task 5): the phase-4 review's C-9 finding. Same-word audit SW-6: the SSI method treats as spouses two unrelated persons living together who lead people to believe they are married (20 CFR 416.1806(a)(3), S1955), so the holds_out_as_spouse_with role is read beside the legal spouse."
