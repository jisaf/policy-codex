id: CO-561
name: "Medicaid: child is in a continuous eligibility period"
identifier: ma_child_is_in_continuous_eligibility_period
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: Whether this month falls inside a child's 12-month continuous eligibility period under 42 CFR 435.926(d) and 10 CCR 2505-10 8.100.3.Q.1.a - continuous eligibility applied at the period's start month, the person is still under ma_magi_child_age_limit, still meets residency, and this month is on or before ma_child_continuous_eligibility_end_month.
precision: "435.926(d) is the operative sentence: 'A child's eligibility may not be terminated during a continuous eligibility period, regardless of any changes in circumstances,' subject to the listed exceptions: age 19 and residency are tested here, and the other exceptions of § 8.100.3.Q.1.b (death, inmate status, leaving the required household, being unable to be located, a withdrawal request, an expired reasonable opportunity period, an erroneous grant) through ma_continuous_eligibility_exception_applies (CO-2205), read in this month (OQ-53, resolved). A period CBMS has recorded (continuous_eligibility_period_start_month stated, CO-094) stands as recorded: the determination that opened it found the child eligible (§ 8.100.3.Q.1, \"who through an eligibility determination, reassessment or redetermination, are found eligible\"; 435.926(b)(2), \"Eligible and enrolled\"), so the past month's category test is not re-run from income facts that may not be stated for that month (heavier-definitions audit H-5). The recorded period counts here when it began in MAGI Medical Assistance, SSI Mandatory, long-term care or at a foster care exit (ma_continuous_eligibility_program, CO-2446; § 8.100.3.Q.2.b.i, c.i, Q.3); a period that began in the Buy-In, Pickle, DAC or Limited Family Planning is CO-2448's. Only a period the application being determined would open is computed: ma_continuous_eligibility_applies [at] the application month (not this month), per the note on CO-555, so a later month's income rise cannot retroactively make the period never have applied. The months run from the recorded start month, or the application month when none is recorded, through ma_child_continuous_eligibility_end_month (CO-556). The age condition reads ma_is_under_child_age_or_turns_nineteen_this_month (CO-564), the test the Children category itself uses, so the category and continuous eligibility agree in the month the child turns 19."
derived: [all, [any, [all, [not, [unknown, continuous_eligibility_period_start_month]], [in, [otherwise, ma_continuous_eligibility_program, magi], [magi, ssi_mandatory, long_term_care, foster_care_exit]]], [at, ma_continuous_eligibility_applies, [month_of, ma_application_date]]], ma_is_under_child_age_or_turns_nineteen_this_month, ma_meets_residency, [">=", [month], [otherwise, continuous_eligibility_period_start_month, [month_of, ma_application_date]]], ["<=", [month], ma_child_continuous_eligibility_end_month], [not, ma_continuous_eligibility_exception_applies]]
sources: [S215, S216, S1502, S1724]
implemented: engine
tags: [ma, magi, age]
rationale: "No existing item states whether a given month falls inside an already-open continuous eligibility period; without it, continuous eligibility is computed (CO-555, CO-556) but nothing reads it, which is the phase-3 review's C-4(a) finding. ma_magi_category (CO-551) and ma_magi_eligibility_status (CO-554) both need this single per-month yes/no so that a child in the period stays child/eligible 'without regard to changes in income' (8.100.3.Q.1.a) even in a month their own current-month category test would otherwise report none/ineligible_income. History moved from the precision note (HCPF review S-14): Vocabulary fix round (U-14): the age condition reads ma_is_under_child_age_or_turns_nineteen_this_month (CO-564), the test the Children category itself uses, so the category and continuous eligibility agree in the month the child turns 19."
tests:
  - {id: CO-561-T1, as_of: "2027-01-15", month: "2027-01", given: {date_of_birth: "2010-03-02", ma_application_date: "2026-04-10", continuous_eligibility_period_start_month: "2026-04", state_of_residence: "CO", ma_is_child_category: {"2026-04": true, "2027-01": false}, ma_continuous_eligibility_exception_applies: false}, expect: true}
  - {id: CO-561-T4, as_of: "2027-01-15", month: "2027-01", title: "OQ-53: the child asked to be withdrawn from continuous eligibility in December", given: {date_of_birth: "2010-03-02", ma_application_date: "2026-04-10", continuous_eligibility_period_start_month: "2026-04", state_of_residence: "CO", ma_is_child_category: {"2026-04": true, "2027-01": false}, ma_continuous_eligibility_exception_applies: true}, expect: false}
  - {id: CO-561-T2, as_of: "2027-05-15", month: "2027-05", given: {date_of_birth: "2010-03-02", ma_application_date: "2026-04-10", continuous_eligibility_period_start_month: "2026-04", state_of_residence: "CO", ma_is_child_category: {"2026-04": true, "2027-05": false}}, expect: false}
  - {id: CO-561-T3, as_of: "2026-10-15", month: "2026-10", given: {date_of_birth: "1990-01-01", ma_application_date: "2026-10-10", state_of_residence: "CO", ma_is_child_category: false}, expect: false}
  - {id: CO-561-T5, as_of: "2027-01-15", month: "2027-01", title: "Heavier-definitions audit H-5: CBMS records the period opened in April 2026; April's income is not stated and January's is over the limit", given: {date_of_birth: "2010-03-02", ma_application_date: "2026-04-10", continuous_eligibility_period_start_month: "2026-04", state_of_residence: "CO", ma_is_child_category: false, ma_continuous_eligibility_exception_applies: false}, expect: true}
  - {id: CO-561-T6, as_of: "2027-01-15", month: "2027-01", title: "H-5: no period recorded, and the application month's category test failed", given: {date_of_birth: "2010-03-02", ma_application_date: "2026-04-10", state_of_residence: "CO", ma_is_child_category: {"2026-04": false, "2027-01": false}, ma_continuous_eligibility_exception_applies: false}, expect: false}
  - {id: CO-561-T7, as_of: "2027-01-15", month: "2027-01", title: "H-5: a recorded period that began in the Children with Disabilities Buy-In is not a MAGI period (CO-2448 carries it)", given: {date_of_birth: "2010-03-02", ma_application_date: "2026-04-10", continuous_eligibility_period_start_month: "2026-04", ma_continuous_eligibility_program: cbwd_buy_in, state_of_residence: "CO", ma_is_child_category: {"2026-04": false, "2027-01": false}, ma_continuous_eligibility_exception_applies: false}, expect: false}
  - {id: CO-561-T8, as_of: "2026-10-15", month: "2026-07", title: "A retroactive month before the application month is not inside the period", given: {date_of_birth: "2010-03-02", ma_application_date: "2026-10-10", state_of_residence: "CO", ma_is_child_category: {"2026-10": true, "2026-07": false}, ma_continuous_eligibility_exception_applies: false}, expect: false}
  # Time audit T-9: each comparison tested at its limit, with the two sides equal (the strict/inclusive flip of the comparison fails it).
