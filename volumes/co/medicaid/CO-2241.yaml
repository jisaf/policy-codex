id: CO-2241
name: "Medicaid: SSI-related countable income reported by electronic data"
identifier: ma_ssi_countable_income_reported_by_data_source
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The SSI-related countable income the electronic data sources report for the person and a spouse living with the person: the reported unearned income less the $20 general income disregard, plus the reported earned income less the $65 earned income disregard and any unused part of the $20, halved - the computation ma_ssi_countable_income makes from the attested figures (10 CCR 2505-10 § 8.100.5.H.4.a-b; 20 CFR 416.1124(c)(12))."
precision: "Reported unearned income is the reported gross income less its earned part (electronic_data_source_monthly_earned_income); both are summed over the same spouse-living-together group ma_ssi_household_unearned_income_sum (CO-663) uses. The Ineligible Child Allocation and an unemancipated child's child support (CO-2281) are not applied: the data sources report income, not the household's children or SSI status, so the comparison with ma_ssi_countable_income can differ by the allocation in a household with ineligible children."
derived: ["+", [max, 0, ["-", ["-", [sum, [reachable, [spouse], [all, [not, resides_in_medical_institution], [not, [of, [P], resides_in_medical_institution]]]], [of, [P], electronic_data_source_monthly_gross_income]], [sum, [reachable, [spouse], [all, [not, resides_in_medical_institution], [not, [of, [P], resides_in_medical_institution]]]], [of, [P], electronic_data_source_monthly_earned_income]]], ssi_general_income_exclusion]], ["*", [max, 0, ["-", [sum, [reachable, [spouse], [all, [not, resides_in_medical_institution], [not, [of, [P], resides_in_medical_institution]]]], [of, [P], electronic_data_source_monthly_earned_income]], ["+", ssi_earned_income_exclusion, [max, 0, ["-", ssi_general_income_exclusion, ["-", [sum, [reachable, [spouse], [all, [not, resides_in_medical_institution], [not, [of, [P], resides_in_medical_institution]]]], [of, [P], electronic_data_source_monthly_gross_income]], [sum, [reachable, [spouse], [all, [not, resides_in_medical_institution], [not, [of, [P], resides_in_medical_institution]]]], [of, [P], electronic_data_source_monthly_earned_income]]]]]]]], ssi_earned_income_disregard_rate]]
sources: [S308, S864]
implemented: engine
tags: [ma, non_magi, income, verification]
rationale: "OQ-374: the aged, blind and disabled reasonable compatibility test compared gross figures with a countable-income standard; this item puts the data source's figure on the same countable footing as the attested one."
tests:
  - {id: CO-2241-T1, as_of: "2026-10-01", month: "2026-10", title: "Single person, $1,180 of Social Security reported", given: {resides_in_medical_institution: false, electronic_data_source_monthly_gross_income: 1180, electronic_data_source_monthly_earned_income: 0}, relationships: [], expect: 1160}
  - {id: CO-2241-T2, as_of: "2026-10-01", month: "2026-10", title: "Single person, $1,000 of wages reported", given: {resides_in_medical_institution: false, electronic_data_source_monthly_gross_income: 1000, electronic_data_source_monthly_earned_income: 1000}, relationships: [], expect: 457.5}
  - {id: CO-2241-T3, as_of: "2026-10-01", month: "2026-10", title: "Couple: $900 of Social Security and the spouse's $400 of wages", given: {resides_in_medical_institution: false, electronic_data_source_monthly_gross_income: 900, electronic_data_source_monthly_earned_income: 0}, others: {p2: {resides_in_medical_institution: false, electronic_data_source_monthly_gross_income: 400, electronic_data_source_monthly_earned_income: 400}}, relationships: [[spouse, p2]], expect: 1047.5}
