id: CO-2205
name: "Medicaid: a continuous eligibility exception applies"
identifier: ma_continuous_eligibility_exception_applies
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether, this month, one of the exceptions of 10 CCR 2505-10 § 8.100.3.Q.1.b ends (or, for an inmate, suspends) a child's continuous eligibility period other than the residency exception, which ma_child_is_in_continuous_eligibility_period (CO-561) tests itself: the child has died (i); is an inmate of a public institution (ii); is no longer part of the Medical Assistance required household (iii); is unable to be located (v); has requested withdrawal (vi); failed to provide documentation during a reasonable opportunity period (vii); or the eligibility was erroneously granted through agency error, fraud or perjury (viii)."
precision: "The period ends 'effective the earliest possible month', so each month fact is read as true from the month of the event on. An inmate's coverage moves to the limited incarceration benefit and full coverage is reinstated for the rest of the period on release (Q.1.b.ii.1), so the inmate prong reads the month's own inmate status (is_inmate_of_public_institution, CO-1105) and the period resumes in a later month the child is not an inmate. Exception vii is read from the volume's reasonable opportunity items: a month after the month the reasonable opportunity period ended (ma_reasonable_opportunity_period_end_date) with citizenship, identity or immigration status still pending (ma_pending_status_verification_count). A person to whom no reasonable opportunity notice was sent (ma_reasonable_opportunity_notice_date not stated) had no reasonable opportunity period and cannot fail to provide documentation during one, so the prong is false for that person."
derived: [any, is_deceased, is_inmate_of_public_institution, ma_has_left_required_household, ma_is_unable_to_be_located, ma_has_requested_withdrawal_from_continuous_eligibility, ma_eligibility_was_erroneously_granted, [all, [otherwise, [">", [month], [month_of, ma_reasonable_opportunity_period_end_date]], false], [">", ma_pending_status_verification_count, 0]]]
sources: [S1502, S216]
implemented: engine
tags: [ma, magi]
rationale: "OQ-53: ma_child_is_in_continuous_eligibility_period (CO-561) tested only age and residency among the exceptions of § 8.100.3.Q.1.b; this item gathers the others so CO-561 reads one condition."
tests:
  - {id: CO-2205-T1, as_of: "2026-12-01", month: "2026-12", title: "No exception; no reasonable opportunity notice was sent", given: {is_deceased: false, is_inmate_of_public_institution: false, ma_has_left_required_household: false, ma_is_unable_to_be_located: false, ma_has_requested_withdrawal_from_continuous_eligibility: false, ma_eligibility_was_erroneously_granted: false}, expect: false}
  - {id: CO-2205-T2, as_of: "2026-12-01", month: "2026-12", title: "The child died", given: {is_deceased: true}, expect: true}
  - {id: CO-2205-T3, as_of: "2026-12-01", month: "2026-12", title: "Inmate this month", given: {is_deceased: false, is_inmate_of_public_institution: true}, expect: true}
  - {id: CO-2205-T4, as_of: "2026-12-01", month: "2026-12", title: "Moved out of the required household", given: {is_deceased: false, is_inmate_of_public_institution: false, ma_has_left_required_household: true}, expect: true}
  - {id: CO-2205-T5, as_of: "2026-12-01", month: "2026-12", title: "Cannot be located", given: {is_deceased: false, is_inmate_of_public_institution: false, ma_has_left_required_household: false, ma_is_unable_to_be_located: true}, expect: true}
  - {id: CO-2205-T6, as_of: "2026-12-01", month: "2026-12", title: "Withdrawal requested", given: {is_deceased: false, is_inmate_of_public_institution: false, ma_has_left_required_household: false, ma_is_unable_to_be_located: false, ma_has_requested_withdrawal_from_continuous_eligibility: true}, expect: true}
  - {id: CO-2205-T7, as_of: "2026-12-01", month: "2026-12", title: "Erroneous grant", given: {is_deceased: false, is_inmate_of_public_institution: false, ma_has_left_required_household: false, ma_is_unable_to_be_located: false, ma_has_requested_withdrawal_from_continuous_eligibility: false, ma_eligibility_was_erroneously_granted: true}, expect: true}
  - {id: CO-2205-T8, as_of: "2026-12-01", month: "2026-12", title: "Status still unverified after a reasonable opportunity period that ended in November", given: {is_deceased: false, is_inmate_of_public_institution: false, ma_has_left_required_household: false, ma_is_unable_to_be_located: false, ma_has_requested_withdrawal_from_continuous_eligibility: false, ma_eligibility_was_erroneously_granted: false, ma_pending_status_verification_count: 1, ma_reasonable_opportunity_period_end_date: "2026-11-20"}, expect: true}
  - {id: CO-2205-T9, as_of: "2026-12-01", month: "2026-11", title: "Status unverified but the period ends this month", given: {is_deceased: false, is_inmate_of_public_institution: false, ma_has_left_required_household: false, ma_is_unable_to_be_located: false, ma_has_requested_withdrawal_from_continuous_eligibility: false, ma_eligibility_was_erroneously_granted: false, ma_pending_status_verification_count: 1, ma_reasonable_opportunity_period_end_date: "2026-11-20"}, expect: false}
