id: CO-2205
name: "Medicaid: a continuous eligibility exception applies"
identifier: ma_continuous_eligibility_exception_applies
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether, this month, one of the exceptions of 10 CCR 2505-10 § 8.100.3.Q.1.b ends a child's continuous eligibility period other than the residency exception, which ma_child_is_in_continuous_eligibility_period (CO-561) tests itself: the child has died (i); is no longer part of the Medical Assistance required household (iii); is unable to be located (v); has requested withdrawal (vi); failed to provide documentation during a reasonable opportunity period (vii); or the eligibility was erroneously granted through agency error, fraud or perjury (viii)."
precision: "The period ends 'effective the earliest possible month', so each month fact is read as true from the month of the event on. An inmate's coverage moves to the limited incarceration benefit and full coverage is reinstated for the rest of the period on release (Q.1.b.ii.1), so the inmate prong reads the month's own inmate status (is_inmate_of_public_institution, CO-1105) and the period resumes in a later month the child is not an inmate. Exception vii is read from the volume's reasonable opportunity items: a month after the month the reasonable opportunity period ended (ma_reasonable_opportunity_period_end_date) with citizenship, identity or immigration status still pending (ma_pending_status_verification_count). A person to whom no reasonable opportunity notice was sent (ma_reasonable_opportunity_notice_date not stated) had no reasonable opportunity period and cannot fail to provide documentation during one, so the prong is false for that person. An inmate of a public institution (ii) no longer ends the period here: § 8.100.3.Q.1.b.ii.1 moves the child to a limited Incarceration benefit and reinstates full coverage on release within the period, which ma_magi_eligibility_status (CO-554) reports as incarceration_limited."
derived: [any, is_deceased, ma_has_left_required_household, ma_is_unable_to_be_located, ma_has_requested_withdrawal_from_continuous_eligibility, ma_eligibility_was_erroneously_granted, [all, [otherwise, [">", [month], [month_of, ma_reasonable_opportunity_period_end_date]], false], [">", ma_pending_status_verification_count, 0]]]
sources: [S1502, S216, S1725]
implemented: engine
tags: [ma, magi]
rationale: "OQ-53: ma_child_is_in_continuous_eligibility_period (CO-561) tested only age and residency among the exceptions of § 8.100.3.Q.1.b; this item gathers the others so CO-561 reads one condition. History moved from the precision note (HCPF review S-14): HCPF fix round (C-8): an inmate of a public institution (ii) no longer ends the period here: § 8.100.3.Q.1.b.ii.1 moves the child to a limited Incarceration benefit and reinstates full coverage on release within the period, which ma_magi_eligibility_status (CO-554) reports as incarceration_limited."
