id: CO-543
name: "Medicaid: MAGI Pregnant Women category income standard"
identifier: ma_magi_income_standard_pregnant
kind: derived
type: rate
scope: person-month
program: Medicaid
meaning: "The income standard in force in the month, as a decimal fraction of the federal poverty level (MAGI-equivalent), that governs the Pregnant Women MAGI Medical Assistance category - the greater of the federal minimum floor 42 CFR 435.116(c)(1)(i) sets (ma_federal_magi_floor_pct) and Colorado's own percentage stated at 10 CCR 2505-10 8.100.4.G.5 (ma_income_limit_pregnant_pct, which 435.116(c)(1)(ii) permits up to)."
precision: "Colorado's own percentage (ma_income_limit_pregnant_pct, CO-194) exceeds the federal floor, so this rule resolves to it; the max pattern states that comparison explicitly rather than assuming it. Hard-coded numbers audit R-1: the meaning stated 185%, which was wrong (the current § 8.100.4.G.5 figure is 195%); it now names the parameter. MAGI close-out, MAGI-SW-1 (2026-11-24; docs/reviews/known-limits.md): per month. A global item is one value per case, so the parameter was read on the determination date in every month that read it (docs/operators.md, Resolution step 2), and a retroactive or application month in another version period of ma_income_limit_pregnant_pct (CO-194: 185% from 2022-04-14, 195% from 2022-06-30) took the determination date's figure. Eligibility in a month is judged on that month (10 CCR 2505-10 § 8.100.4.G.1, S3351: 'any person who is determined to be eligible for Medical Assistance based on MAGI at any time during a calendar month shall be eligible for benefits during the entire month'), and a retroactive month is one in which the person 'met all applicable eligibility requirements' (§ 8.100.3.E.1, S1503), so the figure of a month is the one in force in it: the version in force on the month's first day, or on the determination date in the determination month, as non-MAGI F7-2 made the personal needs allowance (CO-1987). Rules about the determination itself (presumptive eligibility, CO-2439, CO-3155, CO-708) read it in the determination month."
derived: [max, ma_federal_magi_floor_pct, ma_income_limit_pregnant_pct]
sources: [S640, S210, S675, S676, S3351, S1503]
implemented: engine
tags: [ma, magi, income, state_election]
rationale: "No existing item states the Pregnant-Women-category income standard. ma_is_pregnant_category (CO-546) needs it. Same shape as ma_magi_income_standard_child (CO-540) and ma_magi_income_standard_adult (CO-542), and, with the Children's standard (142%, CO-540), one where Colorado's own percentage (195%) exceeds the federal floor (133%), which is the case the phase-3 brief's 'model Colorado's rule and cite both, where they differ' instruction is written for. The four MAGI income standards (CO-540, CO-541, CO-542, CO-543) share one shape (the greater of a Colorado percentage and the federal floor) and differ only in which covered group's parameters they read; each is kept as its own item so a category rule cites its own standard, per the same-shape acknowledgement governance asks for."
nearest: [CO-540, CO-542]
