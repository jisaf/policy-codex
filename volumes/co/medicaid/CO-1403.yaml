id: CO-1403
name: "Medicaid: requires verification of earned income"
identifier: ma_requires_verification_of_earned_income
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether the person must document earned income for Medical Assistance: wages that an electronic data source could not verify, or that are questionable; earnings the data reports when the attested and data figures are not reasonably compatible against the applicable standard (MAGI, or aged, blind and disabled), including for an adult who attested no earnings; and self-employment income only when the ledger is questionable; unless documentation is not reasonably available."
precision: "The MAGI data figure is household-level, so the not-reasonably-compatible arm asks each adult member and each member attesting earnings, not a child with none (OQ-302). Coverage review 2, N-04: compatibility is judged at each applicant's own standard (CO-1402), so the arm also asks the earners of a household in which any member requesting coverage has income that is not reasonably compatible at that member's standard; a parent whose own attestation is above her standard (and is taken as attested) still documents the earnings her child's eligibility rests on."
derived: [all, [not, documentation_not_reasonably_available], [any, [all, [">", wages_gross, 0], [any, [not, earned_income_verified_by_electronic_data_source], earned_income_attestation_is_questionable]], [all, [case, [ma_is_aged_blind_or_disabled, [">", electronic_data_source_monthly_gross_income, 0]], [else, [">", ma_electronic_data_source_household_income_pct_fpl, 0]]], [not, [case, [ma_is_aged_blind_or_disabled, ma_abd_income_is_reasonably_compatible], [else, [all, ma_income_is_reasonably_compatible, [not, [exists, ma_magi_household_members, [all, [otherwise, [of, [P], ma_is_requesting_coverage], false], [not, [of, [P], ma_income_is_reasonably_compatible]]]]]]]]], [any, [">", wages_gross, 0], [">=", age, ma_magi_child_age_limit]]], [all, [">", self_employment_gross_receipts, 0], earned_income_attestation_is_questionable]]]
sources: [S861, S864, S865, S867, S838, S839]
implemented: engine
tags: [verification, ma, income]
open: [OQ-302]
rationale: No existing item states this Medical Assistance verification requirement; the phase-9 chapter needs one item per element so the person's pending counts and status can be derived.
