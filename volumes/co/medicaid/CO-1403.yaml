id: CO-1403
name: "Medicaid: requires verification of earned income"
identifier: ma_requires_verification_of_earned_income
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether the person must document earned income for Medical Assistance: wages that an electronic data source could not verify, or that are questionable; earnings the data reports when the attested and data figures are not reasonably compatible against the applicable standard (MAGI, or aged, blind and disabled), including for an adult who attested no earnings; and self-employment income only when the ledger is questionable; unless documentation is not reasonably available."
precision: The MAGI data figure is household-level, so the not-reasonably-compatible arm asks each adult member and each member attesting earnings, not a child with none (OQ-302).
derived: [all, [not, documentation_not_reasonably_available], [any, [all, [">", wages_gross, 0], [any, [not, earned_income_verified_by_electronic_data_source], earned_income_attestation_is_questionable]], [all, [case, [ma_is_aged_blind_or_disabled, [">", electronic_data_source_monthly_gross_income, 0]], [else, [">", electronic_data_source_household_income_pct_fpl, 0]]], [not, [case, [ma_is_aged_blind_or_disabled, ma_abd_income_is_reasonably_compatible], [else, ma_income_is_reasonably_compatible]]], [any, [">", wages_gross, 0], [">=", age, ma_magi_child_age_limit]]], [all, [">", self_employment_gross_receipts, 0], earned_income_attestation_is_questionable]]]
sources: [S861, S864, S865, S867, S838, S839]
implemented: engine
tags: [verification, ma, income]
open: [OQ-302]
rationale: No existing item states this Medical Assistance verification requirement; the phase-9 chapter needs one item per element so the person's pending counts and status can be derived.
tests:
  - {id: CO-1403-T1, month: "2026-10", as_of: "2026-10-01", given: {documentation_not_reasonably_available: false, wages_gross: 2380, self_employment_gross_receipts: 0, earned_income_verified_by_electronic_data_source: false}, expect: true}
  - {id: CO-1403-T2, month: "2026-10", as_of: "2026-10-01", given: {documentation_not_reasonably_available: false, wages_gross: 2380, earned_income_verified_by_electronic_data_source: true, earned_income_attestation_is_questionable: false, ma_is_aged_blind_or_disabled: false, electronic_data_source_household_income_pct_fpl: 1.2, ma_income_is_reasonably_compatible: true, self_employment_gross_receipts: 0, self_employment_net_earnings_for_tax: 0}, expect: false}
  - {id: CO-1403-T3, month: "2026-10", as_of: "2026-10-01", given: {documentation_not_reasonably_available: false, wages_gross: 2380, self_employment_gross_receipts: 0, earned_income_verified_by_electronic_data_source: true, earned_income_attestation_is_questionable: false, ma_is_aged_blind_or_disabled: false, electronic_data_source_household_income_pct_fpl: 1.9, ma_income_is_reasonably_compatible: false}, expect: true}
  - {id: CO-1403-T4, month: "2026-10", as_of: "2026-10-01", given: {documentation_not_reasonably_available: false, wages_gross: 0, self_employment_gross_receipts: 600, self_employment_net_earnings_for_tax: 600, earned_income_attestation_is_questionable: false, ma_is_aged_blind_or_disabled: false, electronic_data_source_household_income_pct_fpl: 0}, expect: false}
  - {id: CO-1403-T5, month: "2026-10", as_of: "2026-10-01", given: {documentation_not_reasonably_available: false, wages_gross: 0, self_employment_gross_receipts: 0, self_employment_net_earnings_for_tax: 0, date_of_birth: "1990-01-01", ma_is_aged_blind_or_disabled: false, electronic_data_source_household_income_pct_fpl: 1.9, ma_income_is_reasonably_compatible: false}, expect: true}
