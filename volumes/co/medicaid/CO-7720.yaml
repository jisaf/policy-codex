id: CO-7720
name: "Medicaid long-term care: receipts a federal statute excludes from income for every federally assisted program"
identifier: ma_ltc_federally_excluded_unearned_receipts
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The part of the person's gross unearned receipts of the month (ma_ssi_gross_unearned_receipts, CO-5514, counted the same way) that a federal statute bars from being counted as income in any federal or federally assisted program, so that it is not income for the long-term care gross income of 10 CCR 2505-10 § 8.100.7.A.1 either: home energy assistance under the Low-Income Home Energy Assistance Act (energy_assistance_federal; 42 U.S.C. 8624(f)(1), 'shall not be considered income or resources ... for any purpose under any Federal or State law'), payments to Domestic Volunteer Service Act volunteers below the minimum wage (dvsa_title_i_volunteer_payment; 42 U.S.C. 5044(f)(1), 'shall not in any way reduce or eliminate the level of or eligibility for assistance or services ... under any governmental program'), and the payments the receipt kind federally_excluded_payment names (a payment a federal statute excludes from income for federally funded means-tested programs: the Indian judgment and tribal trust funds, Alaska Native Claims Settlement Act distributions, Civil Liberties Act restitution, Agent Orange settlement, Radiation Exposure Compensation and Nazi persecution payments of § 8.100.5.F.6.h, i, r, s, v and x, among others; 20 CFR 416.1124(b))."
precision: "Each row's receipts are summed by the placement CO-5514 uses (a payment by its month or date, a stream from the month of its start_date through the month of its end_date) at the amount CO-5514 counts (less covered costs, claim expenses, a dependent's part and a retroactive payment's legal fees), so ma_ltc_gross_income (CO-641) subtracts exactly what CO-5514 added for these kinds. A Domestic Volunteer Service Act payment at or above the minimum wage is its own kind (dvsa_title_i_payment_at_or_above_minimum_wage) and is not here: 5044(f)(1) 'shall not apply' to it. Coverage pass 7, non-MAGI F7-6 (docs/reviews/coverage7-medicaid-nonmagi.md): OQ-822 records the conflict between § 8.100.5.F.6's exemptions 'for ... Long Term Care' and § 8.100.7.A.1's 'income before application of deductions, exemptions or disregards', a choice Colorado's own texts leave open; these statutes leave no choice, since each governs 'notwithstanding any other provision of law'. Not here, with the reason: AmeriCorps (42 U.S.C. 12637(d), S5244, excepts programs 'as provided under the Social Security Act', which Medicaid is); educational assistance, of which only the Title IV, Bureau of Indian Education and 29 U.S.C. 3174 part is excluded by 20 U.S.C. 1087uu (S5243) and the receipt kind does not tell that part apart (docs/reviews/known-limits.md, NM-KL-3); the other F.6 exemptions are Colorado's (OQ-822)."
derived: [sum_receipts, receipts, [all, [received_in, [month]], [any, [not, [unknown, [receipt, month]]], [all, [any, [unknown, [receipt, start_date]], ["<=", [month_of, [receipt, start_date]], [month]]], [any, [unknown, [receipt, end_date]], [">=", [month_of, [receipt, end_date]], [month]]]]], [in, [receipt, kind], [energy_assistance_federal, dvsa_title_i_volunteer_payment, federally_excluded_payment]], [in, [lookup, ma_ssi_receipt_treatment_table, [receipt, kind]], [counted, counted_no_rule_excludes, counted_net_of_expenses, child_support, exempt, exempt_public_assistance]]], [max, 0, ["-", [receipt, amount], ["+", [receipt, spent_on_covered_costs], [receipt, claim_expense], [receipt, for_dependent], [case, [[all, [receipt, retroactive], [not, ["=", [receipt, kind], ssi]]], [receipt, designated_for_legal_fees]], [else, 0]]]]]]
sources: [S5241, S5242, S5246, S351, S2209, S3001]
implemented: engine
tags: [ma, non_magi, ltc, income]
open: [OQ-822]
rationale: "Coverage pass 7, non-MAGI F7-6 (FEDEXCL-LTC and LIHEAP-LTC, stored households CO-1105 and CO-1106): ma_ltc_gross_income (CO-641) summed every receipt the SSI method's counting table marks exempt, so a LEAP payment or a federally excluded payment could put a nursing facility resident over three times the FBR. The SSI-related groups already exclude them (CO-5510's exempt rows)."
tests:
  # Coverage pass 7 F7-6, hand-computed: 42 U.S.C. 8624(f)(1) (S5241), 42 U.S.C. 5044(f)(1) (S5242); the kind federally_excluded_payment by its meaning (CO-5000).
  - {id: CO-7720-T1, month: "2026-11", as_of: "2026-11-12", title: "F7-6: Social Security 2,900 and a 400 LEAP payment in November: 400", given: {receipts: [{kind: social_security, amount: 2900}, {kind: energy_assistance_federal, amount: 400, frequency: once, month: "2026-11"}]}, expect: 400}
  - {id: CO-7720-T2, month: "2026-10", as_of: "2026-11-12", title: "F7-6: the same in October, before the LEAP payment's month: 0", given: {receipts: [{kind: social_security, amount: 2900}, {kind: energy_assistance_federal, amount: 400, frequency: once, month: "2026-11"}]}, expect: 0}
  - {id: CO-7720-T3, month: "2026-11", as_of: "2026-11-12", title: "F7-6: a 200 federally excluded payment and a 150 VISTA stipend below the minimum wage: 200 + 150 = 350; a 300 stipend at or above the minimum wage and energy assistance from a private agency (energy_assistance_other, F.6.j, Colorado's exemption) are not here", given: {receipts: [{kind: federally_excluded_payment, amount: 200, frequency: once, month: "2026-11"}, {kind: dvsa_title_i_volunteer_payment, amount: 150}, {kind: dvsa_title_i_payment_at_or_above_minimum_wage, amount: 300}, {kind: energy_assistance_other, amount: 80, frequency: once, month: "2026-11"}]}, expect: 350}
  - {id: CO-7720-T4, month: "2026-11", as_of: "2026-11-12", title: "F7-6: no receipts: 0", given: {receipts: []}, expect: 0}
