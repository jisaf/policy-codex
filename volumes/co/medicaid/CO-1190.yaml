id: CO-1190
name: "Medicaid: countable discharged student loan income"
identifier: ma_countable_discharged_student_loan_income
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The discharged, forgiven or cancelled student loan debt counted as the borrower's MAGI income this month. MAGI follows the Internal Revenue Code (42 CFR 435.603(e)): nothing is counted for a discharge from January 2021 through December 2025, which 26 U.S.C. 108(f)(5) as amended by the American Rescue Plan Act excluded; nor for a discharge on account of the death or total and permanent disability of the student from January 2018 on (10 CCR 2505-10 § 8.100.4.C.1.b.xv.1 for 2018 through 2025; 108(f)(5) as amended by Pub. L. 119-21 sec. 70119 from 2026); nor under Public Service Loan Forgiveness, Teacher Loan Forgiveness, a healthcare loan forgiveness program or a Closed School discharge (xv.2). Otherwise the amount discharged."
precision: "xv.2's exclusions are applied to the named programs always (OQ-217: HCPF applies them consistently, not case by case). The dates are parameters (CO-2463 to CO-2465), read by the month of discharge. The 2021-2025 exclusion's carve-out for a loan from an educational organization or private lender discharged on account of services performed for it (S1709) is not distinguished: student_loan_discharge_reason has no option for it. § 8.100.4.C.1.b.xv still states \"tax years 2018 through 2025\" and counts other discharges; the codex follows the Internal Revenue Code, which MAGI applies, and the conflict is flagged for HCPF rule cleanup (HCPF review S-10). A month with no discharge (amount 0) has 0 without the reason being read."
derived: [case, [["=", discharged_student_loan_debt, 0], 0], [[in, student_loan_discharge_reason, [public_service_loan_forgiveness, teacher_loan_forgiveness, healthcare_loan_forgiveness, closed_school_discharge]], 0], [[all, [">=", [month], ma_student_loan_general_exclusion_start_month], ["<=", [month], ma_student_loan_general_exclusion_end_month]], 0], [[all, ["=", student_loan_discharge_reason, death_or_disability], [">=", [month], ma_student_loan_death_disability_exclusion_start_month]], 0], [else, discharged_student_loan_debt]]
sources: [S670, S1708, S1709]
implemented: engine
tags: [ma, magi, income]
rationale: "S-9 of the phase 7 review: discharged student loan debt is new MAGI income in the current § 8.100.4.C.1.b.xv, with exceptions; ma_person_magi_income (CO-502) had no term for it. No existing item states it."
tests:
  - {id: CO-1190-T1, month: "2026-10", as_of: "2026-10-01", given: {discharged_student_loan_debt: 12000, student_loan_discharge_reason: other}, title: "Private loan cancelled for another reason", expect: 12000}
  - {id: CO-1190-T2, month: "2026-10", as_of: "2026-10-01", given: {discharged_student_loan_debt: 40000, student_loan_discharge_reason: public_service_loan_forgiveness}, title: "Public Service Loan Forgiveness", expect: 0}
  - {id: CO-1190-T3, month: "2025-06", as_of: "2025-06-01", given: {discharged_student_loan_debt: 30000, student_loan_discharge_reason: death_or_disability}, title: "Disability discharge in 2025", expect: 0}
  - {id: CO-1190-T4, month: "2026-10", as_of: "2026-10-01", given: {discharged_student_loan_debt: 30000, student_loan_discharge_reason: death_or_disability}, title: "HCPF fix round (S-10): disability discharge in 2026 - excluded under 108(f)(5) as amended by Pub. L. 119-21", expect: 0}
  - {id: CO-1190-T5, month: "2026-10", as_of: "2026-10-01", given: {discharged_student_loan_debt: 0}, expect: 0}
  - {id: CO-1190-T6, month: "2025-06", as_of: "2025-06-01", given: {discharged_student_loan_debt: 22000, student_loan_discharge_reason: other}, title: "HCPF fix round (S-10): income-driven repayment forgiveness in 2025 - excluded 2021-2025", expect: 0}
  - {id: CO-1190-T7, month: "2020-06", as_of: "2020-06-01", given: {discharged_student_loan_debt: 22000, student_loan_discharge_reason: other}, title: "HCPF fix round (S-10): other cancellation in 2020 - counted", expect: 22000}
