id: CO-622
name: "Medicaid: Buy-In category"
identifier: ma_buy_in_category
kind: derived
type: one of
options: [working_adults_with_disabilities, children_with_disabilities, none]
scope: person-month
program: Medicaid
role: outcome
meaning: "The single Medicaid Buy-In Program this person qualifies under for the month - Working Adults with Disabilities, Children with Disabilities, or none - per 10 CCR 2505-10 8.100.6.P and 8.100.6.Q. It answers whether the criteria are met for the month; whether the month falls inside the coverage period (not before the retroactive months of § 8.100.3.E.1, and for QMB not before the effective month) is not tested here, as ma_month_is_before_coverage_period (CO-4101) tests it for the MAGI and OAP outcomes (final verification pass 3, P3-1)."
precision: "The two programs' age ranges (16+ for WAwD, 18 or younger for CBwD) overlap at 16-18, where 8.100.6.Q.1.e routes an employed 16-18-year-old to WAwD instead. ma_cbwd_eligible (CO-620) enforces Q.1.e itself: a child of 16 to 18 with earned income in the month is not CBwD-eligible. This item also tests WAwD first (ma_wawd_eligible requires is_employed), so a person who meets both tests is reported in WAwD, as Q.1.e directs for an employed child. Final verification pass 2, P3-1: the precision said Q.1.e was not enforced, which F-7 had changed. Coverage pass 7, non-MAGI F7-5 (docs/reviews/coverage7-medicaid-nonmagi.md): reads the general requirement of 10 CCR 2505-10 § 8.100.3.G.1.c (S659) through ma_meets_imd_requirement (CO-1179), as the SSI-related groups (CO-611) and the MAGI groups (CO-562) do: G.1 states what a person \"shall\" meet \"To be eligible to receive Medical Assistance\", and names no category it leaves out. Before, a patient aged 21 to 64 of an institution for mental diseases could be found eligible here although no other Medical Assistance category admitted him (IMD-LTC, stored household CO-1104)."
derived: [case, [[not, ma_meets_imd_requirement], "none"], [ma_abd_denied_for_noncooperation, "none"], [ma_wawd_eligible, "working_adults_with_disabilities"], [ma_cbwd_eligible, "children_with_disabilities"], [else, "none"]]
sources: [S1751, S1727, S1752, S1728, S3621, S3622, S659]
implemented: engine
tags: [ma, non_magi, buy_in]
rationale: "No existing item reports which Buy-In program a person qualifies under. Needed as the batch's Buy-In outcome per the phase-4 brief's interface (role: outcome). Coverage pass 2 (first pass NM-28): denied when ma_abd_denied_for_noncooperation (CO-4886) holds (§ 8.100.5.E.6, § 8.100.7.V.2.c)."
nearest: [CO-387, CO-612, CO-617]
tests:
  - {id: CO-622-T1, as_of: "2026-10-01", month: "2026-10", given: {ma_meets_imd_requirement: true, ma_wawd_eligible: true, ma_cbwd_eligible: false}, expect: working_adults_with_disabilities}
  - {id: CO-622-T2, as_of: "2026-10-01", month: "2026-10", given: {ma_meets_imd_requirement: true, ma_wawd_eligible: false, ma_cbwd_eligible: true}, expect: children_with_disabilities}
  - {id: CO-622-T3, as_of: "2026-10-01", month: "2026-10", given: {ma_meets_imd_requirement: true, ma_wawd_eligible: false, ma_cbwd_eligible: false}, expect: none}
  - {id: CO-622-T90, as_of: "2026-10-01", month: "2026-10", title: "NM-28: denied for non-cooperation", given: {ma_meets_imd_requirement: true, ma_wawd_eligible: true, ma_cbwd_eligible: false, ma_abd_denied_for_noncooperation: true}, expect: none}
  # Coverage pass 7 F7-5: § 8.100.3.G.1.c (S659) applies to the Buy-Ins as to every Medical Assistance category (CO-1179). Born 1986-03-12: 40 in October 2026.
  - {id: CO-622-T91, as_of: "2026-10-01", month: "2026-10", title: "F7-5: Working Adults Buy-In eligible at 40, a patient of an institution for mental diseases: none (was working_adults_with_disabilities)", given: {date_of_birth: "1986-03-12", is_patient_in_institution_for_mental_diseases: true, ma_wawd_eligible: true, ma_cbwd_eligible: false}, expect: none}
