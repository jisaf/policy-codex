  # Coverage pass 7 F7-1: the July of the month evaluated (§ 8.100.7.Q.1.a, S651). The guideline for 2 (CO-181): 21,640 from 2026-01-01, 21,150 in 2025. 1.5 x 21,640 / 12 = 2,705; 1.5 x 21,150 / 12 = 2,643.75.
