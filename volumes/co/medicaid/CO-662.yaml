id: CO-662
name: "Medicaid: MMMNA standard"
identifier: ma_mmmna_standard
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The current minimum monthly maintenance needs allowance before any excess shelter allowance - ma_mmmna_applicable_pct (CO-1801) of the monthly federal poverty guideline for a family of ma_mmmna_family_size (CO-3032), as adjusted in the most recent July - per 42 U.S.C. 1396r-5(d)(3)(A)(i)/(B)(iii) and 10 CCR 2505-10 § 8.100.7.Q.1.a."
precision: "§ 8.100.7.Q.1.a (S651) states the MMMNA \"is equal to 150% of the federal poverty level for a family of two and is adjusted in July of each year\", so the standard is derived from the one federal table, federal_poverty_guideline_annual_table (CO-181), as of the first day of the most recent month numbered ma_mmmna_adjustment_month (CO-3031) on or before the determination date (P25, P50): January through June uses the guideline adjusted the previous July. OQ-145 resolved; hard-coded numbers audit D-1: the size-2 figure was restated as its own July-dated parameter (CO-1954), now retired."
derived: ["*", ma_mmmna_applicable_pct, ["/", [lookup, [as_of, federal_poverty_guideline_annual_table, [first_day, [latest_month_of_year, ma_mmmna_adjustment_month, [det_month]]]], ma_mmmna_family_size], 12]]
sources: [S358, S372, S644, S1219]
implemented: engine
tags: [ma, ltc, income, legal]
rationale: "The former item (CO-829, withdrawn) modeled this figure as a supplied fact because 8.100.7.Q.1.a's dollar figure is not itself in any fetched document, but the formula and its input (federal_poverty_guideline_annual_table, CO-181) both are - the same 'text states the formula, volume already has the input' shape G-1 identifies. ma_mmmna (CO-655) and ma_family_allowance (CO-657) need the current standard. Precision history (moved from precision, engineering follow-up pass task 5): per the phase-4 review's G-1 finding."
