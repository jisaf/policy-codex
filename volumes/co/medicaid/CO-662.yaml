id: CO-662
name: "Medicaid: MMMNA standard"
identifier: ma_mmmna_standard
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: The current minimum monthly maintenance needs allowance before any excess shelter allowance - 150% of the federal poverty level for a family of two, per 42 U.S.C. 1396r-5(d)(3)(A)(i)/(B)(iii) and 10 CCR 2505-10 § 8.100.7.Q.1.a.
precision: "§ 8.100.7.Q.1.a (S358) states the MMMNA 'is equal to 150% of the federal poverty level for a family of two and is adjusted in July of each year'; federal_poverty_guideline_annual_table (CO-181) already carries the size-2 annual guideline this batch needs, so the standard is derived - ma_mmmna_applicable_pct (CO-1801) times one-twelfth of the size-2 guideline - rather than supplied as its own annually-invented figure, per the phase-4 review's G-1 finding. OQ-145 resolved: the size-2 guideline is read from ma_mmmna_poverty_guideline_family_of_two_annual (CO-1954), dated from each July 1, so January through June uses the guideline adjusted the previous July ($2,643.75 for January-June 2026, from the 2025 guideline) and July 2026 on uses $2,705.00, the figure CMS publishes (D-72)."
derived: ["*", ma_mmmna_applicable_pct, ["/", ma_mmmna_poverty_guideline_family_of_two_annual, 12]]
sources: [S358, S372, S644, S1219]
implemented: engine
tags: [ma, ltc, income, legal]
rationale: "The former item (CO-829, withdrawn) modeled this figure as a supplied fact because 8.100.7.Q.1.a's dollar figure is not itself in any fetched document, but the formula and its input (federal_poverty_guideline_annual_table, CO-181) both are - the same 'text states the formula, volume already has the input' shape G-1 identifies. ma_mmmna (CO-655) and ma_family_allowance (CO-657) need the current standard."
tests:
  - {id: CO-662-T1, as_of: "2026-10-01", month: "2026-10", given: {ma_mmmna_applicable_pct: 1.5}, expect: 2705.0}
  - {id: CO-662-T2, as_of: "2026-03-01", month: "2026-03", title: "OQ-145: January-June 2026 uses the 2025 guideline set in July 2025: 1.5 x 21150 / 12", given: {ma_mmmna_applicable_pct: 1.5}, expect: 2643.75}
