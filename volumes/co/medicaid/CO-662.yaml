id: CO-662
name: "Medicaid: MMMNA standard"
identifier: ma_mmmna_standard
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: The current minimum monthly maintenance needs allowance before any excess shelter allowance - 150% of the federal poverty level for a family of two, per 42 U.S.C. 1396r-5(d)(3)(A)(i)/(B)(iii) and 10 CCR 2505-10 § 8.100.7.Q.1.a.
precision: "§ 8.100.7.Q.1.a (S358) states the MMMNA 'is equal to 150% of the federal poverty level for a family of two and is adjusted in July of each year'; ma_poverty_guideline_table (CO-181) already carries the size-2 annual guideline this batch needs, so the standard is derived - ma_mmmna_applicable_pct (CO-331) times one-twelfth of the size-2 guideline - rather than supplied as its own annually-invented figure, per the phase-4 review's G-1 finding. Does not model the July-versus-January adjustment timing: ma_poverty_guideline_table's versions are keyed from January 1, so a determination made January through June of a year uses that calendar year's guideline rather than the prior July's, one figure early - see OQ-145."
derived: ["*", ma_mmmna_applicable_pct, ["/", [lookup, ma_poverty_guideline_table, 2], 12]]
sources: [S358, S372]
open: [OQ-145]
implemented: engine
tags: [ma, ltc, income, legal]
rationale: "The former item (CO-829, withdrawn) modeled this figure as a supplied fact because 8.100.7.Q.1.a's dollar figure is not itself in any fetched document, but the formula and its input (ma_poverty_guideline_table, CO-181) both are - the same 'text states the formula, volume already has the input' shape G-1 identifies. ma_mmmna (CO-655) and ma_family_allowance (CO-657) need the current standard."
tests:
  - {id: CO-662-T1, as_of: "2026-10-01", month: "2026-10", given: {ma_mmmna_applicable_pct: 1.5}, expect: 2705.0}
