id: CO-2456
name: "Medicaid: funding source of the person's coverage"
identifier: ma_funding_source
kind: derived
type: one of
options: [title_xix, title_xix_emergency, title_xxi, state_only, none]
scope: person-month
program: Medicaid
meaning: "Which funding pays for the coverage this volume finds for the person this month: state funds only (Cover All Coloradans and the other coverage C.R.S. 25.5-2-104(4) and 25.5-5-201(6)(c) fund with state funds where federal financial participation is unavailable, the Old Age Pension State Only program, and the Reproductive Health Care Program); title XIX emergency services only (42 U.S.C. 1396b(v)(2)); title XXI (Child Health Plan Plus for a child or pregnant woman who meets the citizenship and immigration status requirement; state funds where CHP+ reaches a person who does not, since CMS does not count state-only coverage as CHIP); title XIX (any other full or limited Medical Assistance the volume finds); or none."
precision: "The volume states eligibility, not claiming: where a person qualifies through more than one route the first in the order of the derivation is reported. A person reported emergency-only is reported title_xix_emergency even if the Reproductive Health Care Program also covers family planning. The aid codes CBMS assigns are not stated here (OQ-514)."
derived: [case, [ma_is_covered_under_cover_all_coloradans, state_only], [ma_is_emergency_medicaid_only, title_xix_emergency], [[in, chp_eligibility_status, [eligible_child, eligible_prenatal, eligible_newborn, eligible_incarceration_limited]], [case, [ma_meets_citizenship_requirement, title_xxi], [else, state_only]]], [ma_has_full_coverage_category, title_xix], [[not, ["=", ma_needy_young_person_category, none]], title_xix], [[not, ["=", ma_msp_category, none]], title_xix], [["=", ma_family_planning_status, limited_family_planning], title_xix], [["=", ma_family_planning_status, reproductive_health_care_program], state_only], [["=", ma_oap_health_care_status, eligible_state_only], state_only], [else, none]]
sources: [S1729, S1730, S1731, S1703, S607]
implemented: engine
tags: [ma, chp, immigration]
open: [OQ-514]
accepts_from:
  - {from: chp_eligibility_status, class: rule_required, source: S1731}
rationale: "C-12 of the HCPF review: CBMS needs the funding stream for aid codes and HCPF for budget, and no item stated it. It is not a program outcome. The order puts the state-funded Cover All Coloradans coverage first because ma_magi_is_fully_eligible (CO-562) also reports those children and pregnant people as fully eligible."
tests:
  - {id: CO-2456-T1, month: "2026-10", as_of: "2026-10-01", given: {ma_is_covered_under_cover_all_coloradans: true}, title: "Undocumented child covered through Cover All Coloradans", expect: state_only}
  - {id: CO-2456-T2, month: "2026-10", as_of: "2026-10-01", given: {ma_is_covered_under_cover_all_coloradans: false, ma_oap_health_care_status: not_oap_recipient, chp_eligibility_status: eligible_child, ma_meets_citizenship_requirement: true, ma_is_emergency_medicaid_only: false}, title: "Citizen child on CHP+", expect: title_xxi}
  - {id: CO-2456-T3, month: "2026-10", as_of: "2026-10-01", given: {ma_is_covered_under_cover_all_coloradans: false, ma_oap_health_care_status: not_oap_recipient, chp_eligibility_status: ineligible, ma_has_full_coverage_category: true, ma_is_emergency_medicaid_only: false}, title: "Citizen adult with full MAGI coverage", expect: title_xix}
  - {id: CO-2456-T4, month: "2026-11", as_of: "2026-11-01", given: {ma_is_covered_under_cover_all_coloradans: false, ma_oap_health_care_status: not_oap_recipient, chp_eligibility_status: ineligible, ma_has_full_coverage_category: false, ma_needy_young_person_category: none, ma_msp_category: none, ma_family_planning_status: ineligible, ma_is_emergency_medicaid_only: true}, title: "Refugee adult after October 2026: emergency only", expect: title_xix_emergency}
  - {id: CO-2456-T5, month: "2026-10", as_of: "2026-10-01", given: {ma_is_covered_under_cover_all_coloradans: false, ma_oap_health_care_status: not_oap_recipient, chp_eligibility_status: ineligible, ma_has_full_coverage_category: false, ma_needy_young_person_category: none, ma_msp_category: none, ma_family_planning_status: reproductive_health_care_program, ma_is_emergency_medicaid_only: false}, title: "Undocumented adult in the Reproductive Health Care Program", expect: state_only}
