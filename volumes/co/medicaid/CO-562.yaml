id: CO-562
name: "Medicaid: is fully eligible for MAGI Medical Assistance (not emergency-only)"
identifier: ma_magi_is_fully_eligible
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether the person is eligible for full-scope MAGI Medical Assistance benefits, as distinct from the emergency-only benefit 42 CFR 435.406(b) and 10 CCR 2505-10 § 8.100.3.G.1.g.ix.2 grant to a person who otherwise qualifies but fails citizenship - a Colorado resident, not excluded as a patient in an institution for mental diseases (§ 8.100.3.G.1.c), who qualifies under at least one MAGI covered group and either meets the citizenship and immigration status requirement (CO-509) or, in the Children's or Pregnant category (including a needy newborn), is a Cover All Coloradans person (§ 8.100.3.G.1.g.ix.1.a, CO-1173)."
precision: "Distinct from ma_magi_is_eligible (CO-553), which is true for both full and emergency-only coverage. It is the MAGI part of what 10 CCR 2505-3-120.1.B's \"eligible to receive assistance under Title XIX\" exclusion and 42 CFR 457.310(b)(2)(i)'s \"found eligible or potentially eligible for Medicaid\" mean for CHP+: the whole test is ma_has_full_coverage_category (CO-1176), which adds the SSI-related, OAP SISC B, protected-group, Buy-In, long-term care and needy-under-21 categories (final verification pass 3, F3-2; this precision had called this item the whole test). A person whose only Title XIX entitlement is emergency services has nothing CHP+ needs to defer to. Cover All Coloradans reaches only the MAGI Children and Pregnant categories (ix.1.a; S-2, OQ-214), so an undocumented postpartum or 19-year-old person in the Adult or Parent and Caretaker Relative category is not fully eligible; and § 8.100.3.G.1.c's IMD exclusion is applied (S-5, CO-1179). OQ-214 sweep: C.R.S. 25.5-2-104(2) makes a child under 19 who would be eligible for medical assistance but for immigration status eligible for state medical assistance with the same benefits, and C.R.S. 25.5-5-201(6)(a) makes a pregnant non-citizen who meets every other requirement eligible for medical assistance; neither is limited to the categories § 8.100.3.G.1.g.ix.1.a-b lists, so a child or pregnant person in any MAGI category is fully eligible whatever their status. A postpartum person who was not covered while pregnant is reached only by the rule's ix.1 list (still OQ-214). Coverage pass 5 (2026-11-23, the class of C5-02 and C5-03): pregnancy is read for the month evaluated (ma_is_pregnant_in_month, CO-3601), not on the determination date (is_pregnant), so a retroactive month in which the person was pregnant is a pregnant month although the pregnancy has ended, and a month before a pregnancy began is not. Pattern sweep, MAGI (2026-11-24, PS-01, PS-02): status and the Cover All Coloradans population are read for the month evaluated (ma_meets_citizenship_requirement_in_month, CO-7551; ma_is_cover_all_coloradans_person_in_month, CO-7552; ma_meets_status_for_cover_all_coloradans_categories_in_month, CO-7553), not on the determination date: 8.100.4.G.1 (S3351), 8.100.3.E.1 (S217), 8 U.S.C. 1613(a) (S176), ix.1's 'current month' (S607)."
derived: [all, ma_meets_residency_in_month, ma_meets_imd_requirement, [not, ["=", ma_magi_category, "none"]], [any, ma_meets_citizenship_requirement_in_month, ma_is_under_child_age_or_turns_nineteen_this_month, ma_is_pregnant_in_month, [all, ma_is_cover_all_coloradans_person_in_month, [in, ma_magi_category, [needy_newborn, child, pregnant]]]]]
sources: [S607, S659, S171, S172, S173, S600, S1217, S1218, S3351, S217, S176]
implemented: engine
tags: [ma, magi, immigration]
rationale: "No existing item distinguishes full Medicaid eligibility from emergency-only eligibility for a downstream reader that needs only the former. Added in the fix round per the phase-3 review's C-10 finding: CO-553 (ma_magi_is_eligible) is true for an emergency-only person, and CHP+'s chp_child_is_eligible/chp_prenatal_is_eligible/chp_eligibility_status (CO-705/706/707) had been reading it directly for their 'not eligible for Medicaid' test, which would wrongly deny CHP+ to a pregnant or child applicant whose only Title XIX entitlement is emergency services. Those three items are edited by this fix round to read ma_magi_is_fully_eligible instead. History moved from the precision note (HCPF review S-14): Phase 7 fix round: Cover All Coloradans reaches only the MAGI Children and Pregnant categories (ix.1.a; S-2, OQ-214), so an undocumented postpartum or 19-year-old person in the Adult or Parent and Caretaker Relative category is not fully eligible; and § 8.100.3.G.1.c's IMD exclusion is applied (S-5, CO-1179). OQ-214 sweep: C.R.S. 25.5-2-104(2) makes a child under 19 who would be eligible for medical assistance but for immigration status eligible for state medical assistance with the same benefits, and C.R.S. 25.5-5-201(6)(a) makes a pregnant non-citizen who meets every other requirement eligible for medical assistance; neither is limited to the categories § 8.100.3.G.1.g.ix.1.a-b lists, so a child or pregnant person in any MAGI category is fully eligible whatever their status. A postpartum person who was not covered while pregnant is reached only by the rule's ix.1 list (still OQ-214). Precision history (moved from precision, engineering follow-up pass task 5): per the phase-3 review's C-10 finding."
