id: CO-2469
name: "Medicaid: family members for the family allowance"
identifier: ma_family_allowance_members
kind: derived
type: group of persons
scope: person
program: Medicaid
meaning: "The family members for whom an institutionalized spouse's income provides a family allowance (10 CCR 2505-10 § 8.100.7.T.1.c.ii): persons who are a child or parent of either spouse, reside with the community spouse, and are claimed as a tax dependent by either spouse."
precision: "A dependent sibling of either spouse, whom T.1.c.ii also names, is not reached: the ledger has no sibling edge to a spouse; such a person is not counted (OQ-95's remaining half). The spouses themselves are not children or parents of either spouse, so they are never in the group."
derived: [filter, [persons], [all, [has_relative_in, [child, parent], [reachable, [spouse]]], [has_relative_in, [tax_dependent], [reachable, [spouse]]], [otherwise, [of, [P], ma_resides_with_community_spouse], false]]]
sources: [S360]
implemented: engine
tags: [ma, ltc, household]
rationale: "OQ-95 (resolved in the HCPF fix round): family_members_with_community_spouse (CO-838) was the worker's own list. The child, parent and tax-dependent edges of the MAGI chapter state most of the definition."
tests:
  - {id: CO-2469-T1, as_of: "2026-10-01", given: {}, title: "Minor child of the couple, claimed by the community spouse, at home", relationships: [[spouse, p1, p2], [parent, p1, p3], [parent, p2, p3], [tax_filer, p2, p3]], persons: {p2: {facts: {}}, p3: {facts: {ma_resides_with_community_spouse: true}}}, expect_length: 1, expect_first: p3, expect_last: p3}
  - {id: CO-2469-T2, as_of: "2026-10-01", given: {}, title: "Adult child who files her own return", relationships: [[spouse, p1, p2], [parent, p1, p3], [parent, p2, p3]], persons: {p2: {facts: {}}, p3: {facts: {ma_resides_with_community_spouse: true}}}, expect: []}
