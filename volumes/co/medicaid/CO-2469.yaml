id: CO-2469
name: "Medicaid: family members for the family allowance"
identifier: ma_family_allowance_members
kind: derived
type: group of persons
scope: person
program: Medicaid
meaning: "The family members for whom an institutionalized spouse's income provides a family allowance (10 CCR 2505-10 § 8.100.7.T.1.c.ii): persons who are a child or parent of either spouse, reside with the community spouse, and are claimed as a tax dependent by either spouse."
precision: "A sibling of either spouse, whom T.1.c.ii also names, is a child of a parent of either spouse who is not a spouse: siblings are derived from shared parents (same-word audit SW-2), so the case states the spouse's parent and the sibling's parent edge, not a sibling edge (OQ-95 resolved). A half sibling (one shared parent) is a sibling; a step-sibling is not. The spouses themselves are not children or parents of either spouse, so they are never in the group."
derived: [filter, [persons], [all, [any, [has_relative_in, [child, parent], [reachable, [spouse]]], [all, [has_relative_in, [child], [filter, [persons], [has_relative_in, [parent], [reachable, [spouse]]]]], [not, [in_group, [P], [reachable, [spouse]]]]]], [has_relative_in, [tax_dependent], [reachable, [spouse]]], [otherwise, [of, [P], ma_resides_with_community_spouse], false]]]
sources: [S1736]
implemented: engine
tags: [ma, ltc, household]
rationale: "OQ-95 (resolved in the HCPF fix round): family_members_with_community_spouse (CO-838) was the worker's own list. The child, parent and tax-dependent edges of the MAGI chapter state most of the definition."
