rationale: "ma_pickle_countable_income (CO-1158) disregards only the cost-of-living increases; § 8.100.6.J.1.c.i disregards the whole current OASDI income. ma_dac_eligible (CO-1161) needs it. Same-word audit SW-6: the SSI method treats as spouses two unrelated persons living together who lead people to believe they are married (20 CFR 416.1806(a)(3), S1955), so the holds_out_as_spouse_with role is read beside the legal spouse. Coverage pass 3 C3-1: sums over ma_ssi_couple_members (CO-3626), which keeps a newly admitted spouse in the couple through the admission month (§ 8.100.7.C.2.b) except for the institutionalized spouse's own test (42 U.S.C. 1396r-5(b)(1)); it had filtered on resides_in_medical_institution, which split the couple's incomes from the admission day while the size and resources still read them together. Coverage pass 3 C3-3: the earned side now takes the 20 CFR 416.1112(c) exclusions § 8.100.5.H.4.e incorporates, as ma_ssi_countable_earned_income (CO-605) does: ma_ssi_excluded_earned_income (CO-2471: student, infrequent, Census) from each member before the $65, impairment-related work expenses (CO-4628) before the one half, and blind work expenses and PASS (CO-4629) after it. It had applied only the $65, any unused $20 and the half, so a Disabled Adult Child paying impairment-related work expenses or a student under 22 was counted on gross earnings. Receipt records, migration phase 2: the current OASDI disregarded is ma_social_security_receipts (CO-5515). Earned-income records, step E1 (Medicaid and CHP+): earned income is the earnings records the SSI method's counting table counts (ma_ssi_gross_earned_income, CO-5171), replacing wages_gross plus ma_self_employment_net_earnings."
