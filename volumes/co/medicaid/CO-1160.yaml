id: CO-1160
name: "Medicaid: Disabled Adult Child countable income"
identifier: ma_dac_countable_income
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The person's SSI-related countable income with the current OASDI income disregarded, for the Disabled Adult Child test (10 CCR 2505-10 § 8.100.6.J.1.c.i, iii). The disabled widow(er) group reads the same figure (ma_disabled_widow_eligible, CO-1162): 42 U.S.C. 1383c(d)(2) tests SSI eligibility in the absence of the widow(er)'s Social Security benefit."
precision: "OQ-208 resolved: § 8.100.6.J.1.c disregards the current OASDI income and tests other countable income, so the OASDI comes off the household's unearned income first and the ssi_general_income_exclusion general exclusion (with any unused part carried to earned income, as in CO-605) applies to the income that remains."
