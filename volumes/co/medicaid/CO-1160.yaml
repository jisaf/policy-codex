id: CO-1160
name: "Medicaid: Disabled Adult Child countable income"
identifier: ma_dac_countable_income
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The person's SSI-related countable income with the current OASDI income disregarded, for the Disabled Adult Child test (10 CCR 2505-10 § 8.100.6.J.1.c.i, iii). The disabled widow(er) group reads the same figure (ma_disabled_widow_eligible, CO-1162): 42 U.S.C. 1383c(d)(2) tests SSI eligibility in the absence of the widow(er)'s Social Security benefit."
precision: "OQ-208 resolved: § 8.100.6.J.1.c disregards the current OASDI income and tests other countable income, so the OASDI comes off the household's unearned income first and the ssi_general_income_exclusion general exclusion (with any unused part carried to earned income, as in CO-605) applies to the income that remains."
derived: ["+", [max, 0, ["-", [max, 0, ["-", ma_ssi_household_unearned_income_sum, social_security_income]], ssi_general_income_exclusion]], ["*", [max, 0, ["-", [sum, [reachable, [spouse, holds_out_as_spouse_with], [all, [not, resides_in_medical_institution], [not, [of, [P], resides_in_medical_institution]]]], ["+", [of, [P], wages_gross], [of, [P], ma_self_employment_net_earnings]]], ["+", ssi_earned_income_exclusion, [max, 0, ["-", ssi_general_income_exclusion, [max, 0, ["-", ma_ssi_household_unearned_income_sum, social_security_income]]]]]]], ssi_earned_income_disregard_rate]]
sources: [S626, S626, S1955, S3416]
implemented: engine
tags: [ma, non_magi, income]
rationale: "ma_pickle_countable_income (CO-1158) disregards only the cost-of-living increases; § 8.100.6.J.1.c.i disregards the whole current OASDI income. ma_dac_eligible (CO-1161) needs it. Same-word audit SW-6: the SSI method treats as spouses two unrelated persons living together who lead people to believe they are married (20 CFR 416.1806(a)(3), S1955), so the holds_out_as_spouse_with role is read beside the legal spouse."
nearest: [CO-1158]
tests:
  - {id: CO-1160-T1, month: "2026-10", as_of: "2026-10-01", given: {ma_ssi_household_unearned_income_sum: 1200, social_security_income: 1100, resides_in_medical_institution: false, wages_gross: 0, ma_self_employment_net_earnings: 0, receipts: [{kind: social_security, amount: 1100}, {kind: ssi}, {kind: pension}, {kind: unemployment_compensation}, {kind: child_support}, {kind: colorado_works_cash}, {kind: adult_financial_cash}, {kind: tax_exempt_interest}, {kind: other_taxable}, {kind: other_nontaxable}]}, title: "1100 OASDI and 100 other unearned: 100 - 20 = 80", relationships: [], expect: 80}
  - {id: CO-1160-T2, month: "2026-10", as_of: "2026-10-01", given: {ma_ssi_household_unearned_income_sum: 1100, social_security_income: 1100, resides_in_medical_institution: false, wages_gross: 300, ma_self_employment_net_earnings: 0, receipts: [{kind: social_security, amount: 1100}, {kind: ssi}, {kind: pension}, {kind: unemployment_compensation}, {kind: child_support}, {kind: colorado_works_cash}, {kind: adult_financial_cash}, {kind: tax_exempt_interest}, {kind: other_taxable}, {kind: other_nontaxable}]}, title: "OQ-208: OASDI only, earnings 300: the whole $20 goes to earnings, (300 - 85) / 2 = 107.5", relationships: [], expect: 107.5}
