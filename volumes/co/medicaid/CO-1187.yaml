id: CO-1187
name: "Medicaid: lottery or gambling winnings counted for the winner this month"
identifier: ma_lottery_winnings_countable_for_recipient
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The part of the person's lottery or gambling winnings counted as the person's own MAGI income this month in determining the person's own eligibility - each month's receipt divided equally over its ma_lottery_winnings_spread_months (CO-1185) months beginning with the month received, the installments of every receipt whose spread reaches this month added together, and nothing outside those months (10 CCR 2505-10 § 8.100.4.C.1.b.xiv.1-3; 42 U.S.C. 1396a(e)(14)(K)(i)-(ii))."
precision: "The receipts read are those of the ma_lottery_winnings_spread_max_months months ending with this month, the longest spread there is (P54, the sum for each month). Not rounded here; ma_magi_household_income (CO-503) rounds the household total. A person granted the hardship exemption of § 8.100.4.C.1.b.xiv.5 continues to be eligible (42 U.S.C. 1396a(e)(14)(K)(iii)), so the winnings are not counted for that person (ma_lottery_winnings_hardship_exemption_granted, CO-2222); if the exemption is not stated, Medicaid reads it as not granted. OQ-216, resolved."
derived: [case, [[otherwise, ma_lottery_winnings_hardship_exemption_granted, false], 0], [else, [sum_months, [months_ending, ma_lottery_winnings_spread_max_months, [month]], [case, [["=", [at, lottery_gambling_winnings_received, [that_month]], 0], 0], [["<=", [month], [months_after, ["-", [at, ma_lottery_winnings_spread_months, [that_month]], 1], [that_month]]], [/, [at, lottery_gambling_winnings_received, [that_month]], [at, ma_lottery_winnings_spread_months, [that_month]]]], [else, 0]]]]]
sources: [S669, S1519, S1520]
implemented: engine
tags: [ma, magi, income]
open: [OQ-592]
rationale: "S-9 of the phase 7 review: the current § 8.100.4.C.1.b.xiv divides winnings over $79,999 equally between two or more months for the winner. No existing item states the monthly amount."
tests:
  - {id: CO-1187-T1, as_of: "2026-10-01", month: "2026-10", title: "$100,000 won in October: four months of $25,000", month_defaults: {lottery_gambling_winnings_received: 0}, given: {lottery_gambling_winnings_received: {"2026-10": 100000}, ma_lottery_winnings_hardship_exemption_granted: false}, expect: 25000}
  - {id: CO-1187-T2, as_of: "2026-10-01", month: "2027-01", title: "Fourth month of the spread", month_defaults: {lottery_gambling_winnings_received: 0}, given: {lottery_gambling_winnings_received: {"2026-10": 100000}, ma_lottery_winnings_hardship_exemption_granted: false}, expect: 25000}
  - {id: CO-1187-T3, as_of: "2026-10-01", month: "2027-02", title: "After the spread", month_defaults: {lottery_gambling_winnings_received: 0}, given: {lottery_gambling_winnings_received: {"2026-10": 100000}, ma_lottery_winnings_hardship_exemption_granted: false}, expect: 0}
  - {id: CO-1187-T4, as_of: "2026-10-01", month: "2026-09", title: "Before the month received", month_defaults: {lottery_gambling_winnings_received: 0}, given: {lottery_gambling_winnings_received: {"2026-10": 100000}, ma_lottery_winnings_hardship_exemption_granted: false}, expect: 0}
  - {id: CO-1187-T5, as_of: "2026-10-01", month: "2026-10", title: "$5,000 in the month received", month_defaults: {lottery_gambling_winnings_received: 0}, given: {lottery_gambling_winnings_received: {"2026-10": 5000}, ma_lottery_winnings_hardship_exemption_granted: false}, expect: 5000}
  - {id: CO-1187-T7, as_of: "2026-10-01", month: "2026-11", title: "OQ-216: hardship exemption granted after the November termination", month_defaults: {lottery_gambling_winnings_received: 0}, given: {lottery_gambling_winnings_received: {"2026-10": 100000}, ma_lottery_winnings_hardship_exemption_granted: true}, expect: 0}
  - {id: CO-1187-T6, as_of: "2026-10-01", month: "2026-10", title: "No winnings", month_defaults: {lottery_gambling_winnings_received: 0}, given: {lottery_gambling_winnings_received: {}}, expect: 0}
  - {id: CO-1187-T8, as_of: "2026-10-01", month: "2026-12", title: "OQ-216: $100,000 in October (4 months of $25,000) and $90,000 in December (3 months of $30,000) overlap in December", month_defaults: {lottery_gambling_winnings_received: 0}, given: {lottery_gambling_winnings_received: {"2026-10": 100000, "2026-12": 90000}, ma_lottery_winnings_hardship_exemption_granted: false}, expect: 55000}
  - {id: CO-1187-T9, as_of: "2026-10-01", month: "2027-02", title: "OQ-216: the October spread has ended; the December spread runs through February", month_defaults: {lottery_gambling_winnings_received: 0}, given: {lottery_gambling_winnings_received: {"2026-10": 100000, "2026-12": 90000}, ma_lottery_winnings_hardship_exemption_granted: false}, expect: 30000}
  - {id: CO-1187-T10, as_of: "2026-10-01", month: "2026-11", title: "OQ-216: $5,000 in October counts only in October; $85,000 in November is spread over November and December", month_defaults: {lottery_gambling_winnings_received: 0}, given: {lottery_gambling_winnings_received: {"2026-10": 5000, "2026-11": 85000}, ma_lottery_winnings_hardship_exemption_granted: false}, expect: 42500}
