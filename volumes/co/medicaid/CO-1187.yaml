id: CO-1187
name: "Medicaid: lottery or gambling winnings counted for the winner this month"
identifier: ma_lottery_winnings_countable_for_recipient
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: The part of the person's lottery or gambling winnings counted as the person's own MAGI income this month in determining the person's own eligibility - each month's receipt divided equally over its ma_lottery_winnings_spread_months (CO-1185) months beginning with the month received, the installments of every receipt whose spread reaches this month added together, and nothing outside those months (10 CCR 2505-10 § 8.100.4.C.1.b.xiv.1-3; 42 U.S.C. 1396a(e)(14)(K)(i)-(ii)).
precision: The receipts read are those of the ma_lottery_winnings_spread_max_months months ending with this month, the longest spread there is (P54, the sum for each month). Not rounded here; ma_magi_household_income (CO-503) rounds the household total. A person granted the hardship exemption of § 8.100.4.C.1.b.xiv.5 continues to be eligible (42 U.S.C. 1396a(e)(14)(K)(iii)), so the winnings are not counted for that person (ma_lottery_winnings_hardship_exemption_granted, CO-2222); if the exemption is not stated, Medicaid reads it as not granted. OQ-216, resolved.
derived: [case, [[otherwise, ma_lottery_winnings_hardship_exemption_granted, false], 0], [else, [sum_months, [months_ending, ma_lottery_winnings_spread_max_months, [month]], [case, [["=", [at, ma_magi_gambling_receipts, [that_month]], 0], 0], [["<=", [month], [months_after, ["-", [at, ma_lottery_winnings_spread_months, [that_month]], 1], [that_month]]], ["/", [at, ma_magi_gambling_receipts, [that_month]], [at, ma_lottery_winnings_spread_months, [that_month]]]], [else, 0]]]]]
sources: [S669, S1519, S1520]
implemented: engine
tags: [ma, magi, income]
open: [OQ-592]
rationale: "S-9 of the phase 7 review: the current § 8.100.4.C.1.b.xiv divides winnings over $79,999 equally between two or more months for the winner. No existing item states the monthly amount. Receipt records, migration phase 2: each month's winnings are ma_magi_gambling_receipts (CO-5502) read in that month, the gambling receipts received in it."
