  - {id: CO-1187-T1, month: "2026-10", as_of: "2026-10-01", given: {ma_lottery_winnings_hardship_exemption_granted: false, receipts: [{kind: social_security}, {kind: ssi}, {kind: pension}, {kind: unemployment_compensation}, {kind: child_support}, {kind: colorado_works_cash}, {kind: adult_financial_cash}, {kind: tax_exempt_interest}, {kind: other_taxable}, {kind: other_nontaxable}, {kind: gambling_winnings, amount: 100000, frequency: once, month: "2026-10"}]}, title: "$100,000 won in October: four months of $25,000", month_defaults: {}, expect: 25000}
  - {id: CO-1187-T2, month: "2027-01", as_of: "2026-10-01", given: {ma_lottery_winnings_hardship_exemption_granted: false, receipts: [{kind: social_security}, {kind: ssi}, {kind: pension}, {kind: unemployment_compensation}, {kind: child_support}, {kind: colorado_works_cash}, {kind: adult_financial_cash}, {kind: tax_exempt_interest}, {kind: other_taxable}, {kind: other_nontaxable}, {kind: gambling_winnings, amount: 100000, frequency: once, month: "2026-10"}]}, title: "Fourth month of the spread", month_defaults: {}, expect: 25000}
