id: CO-1187
name: "Medicaid: lottery or gambling winnings counted for the winner this month"
identifier: ma_lottery_winnings_countable_for_recipient
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The part of the person's lottery or gambling winnings counted as the person's own MAGI income this month in determining the person's own eligibility - the winnings divided equally over ma_lottery_winnings_spread_months (CO-1185) months beginning with the month received, and nothing outside those months (10 CCR 2505-10 § 8.100.4.C.1.b.xiv.1-3)."
precision: "Not rounded here; ma_magi_household_income (CO-503) rounds the household total. The hardship exemption of § 8.100.4.C.1.b.xiv.5 (a written request within 30 days of a denial or termination caused by the winnings, showing severe medical or financial hardship) is a county decision after the fact and is not modeled (OQ-216). A person with no winnings (amount 0) has 0 without the month being read."
derived: [case, [[=, lottery_gambling_winnings_amount, 0], 0], [[all, [">=", [month], lottery_gambling_winnings_month], ["<=", [month], [months_after, ["-", ma_lottery_winnings_spread_months, 1], lottery_gambling_winnings_month]]], [/, lottery_gambling_winnings_amount, ma_lottery_winnings_spread_months]], [else, 0]]
sources: [S669]
open: [OQ-216]
implemented: engine
tags: [ma, magi, income]
rationale: "S-9 of the phase 7 review: the current § 8.100.4.C.1.b.xiv divides winnings over $79,999 equally between two or more months for the winner. No existing item states the monthly amount."
tests:
  - {id: CO-1187-T1, as_of: "2026-10-01", month: "2026-10", title: "$100,000 won in October: four months of $25,000", given: {lottery_gambling_winnings_amount: 100000, lottery_gambling_winnings_month: "2026-10"}, expect: 25000}
  - {id: CO-1187-T2, as_of: "2026-10-01", month: "2027-01", title: "Fourth month of the spread", given: {lottery_gambling_winnings_amount: 100000, lottery_gambling_winnings_month: "2026-10"}, expect: 25000}
  - {id: CO-1187-T3, as_of: "2026-10-01", month: "2027-02", title: "After the spread", given: {lottery_gambling_winnings_amount: 100000, lottery_gambling_winnings_month: "2026-10"}, expect: 0}
  - {id: CO-1187-T4, as_of: "2026-10-01", month: "2026-09", title: "Before the month received", given: {lottery_gambling_winnings_amount: 100000, lottery_gambling_winnings_month: "2026-10"}, expect: 0}
  - {id: CO-1187-T5, as_of: "2026-10-01", month: "2026-10", title: "$5,000 in the month received", given: {lottery_gambling_winnings_amount: 5000, lottery_gambling_winnings_month: "2026-10"}, expect: 5000}
  - {id: CO-1187-T6, as_of: "2026-10-01", month: "2026-10", given: {lottery_gambling_winnings_amount: 0}, expect: 0}
