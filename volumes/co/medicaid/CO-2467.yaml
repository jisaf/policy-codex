id: CO-2467
name: "Medicaid: community spouse's income"
identifier: ma_community_spouse_income
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The community spouse's own gross monthly income from sources other than the institutionalized spouse, less mandatory FICA and Medicare taxes (10 CCR 2505-10 § 8.100.7.R.2), read from the income of the person's spouse who does not reside in a medical institution: wages, net self-employment earnings, the unearned receipts the spousal impoverishment rules count (ma_spousal_unearned_receipts) and gambling winnings."
precision: "The institutionalized spouse's own income is left out because the group keeps only spouses not residing in a medical institution; the person evaluated is the institutionalized spouse. Income from the institutionalized spouse (the community spouse income allowance) is not among the receipts summed. Child support the community spouse receives (support for a child, the child's income) and Colorado Works or Adult Financial cash are left out as before receipt records (OQ-974); a loan, an income tax refund and VA Aid and Attendance are not income. Field-effect sweep (docs/reviews/field-sweep-snap-cash-nonmagi.md), CO-2467: the community spouse's receipts are read at their gross amount, an award's claim expenses (claim_expense) and a retroactive payment's legal fees included, since 8.100.7.R.2 (S1756) takes \"the gross income less mandatory deduct ions for FICA and Medicare tax\" and names no other deduction; the SSI method's 20 CFR 416.1123(b)(3), which subtracts them (ma_ssi_unearned_receipts, CO-5511), is the eligibility rule for the person's own income, not R.2's. Recorded as a state policy choice, OQ-1345. Streams are placed by their dates (FS-MA-1, through ma_spousal_unearned_receipts, CO-5531). Coverage pass 6, non-MAGI F6-10 (decision 4 of 2026-11-23: each supplied fact states once whether it is required or what its rule-given default is; readers do not invent defaults): the community spouse's withheld FICA and Medicare taxes (§ 8.100.7.R.2) are read as stated, no longer as 0 when unstated. A community spouse with no earned income in the month has no FICA or Medicare tax withheld (the taxes R.2 names are levied on earnings), so the withheld amount is asked only of a spouse with earnings."
derived: [sum, [filter, [reachable, [spouse]], [not, [of, [P], resides_in_medical_institution]]], [max, 0, ["-", ["+", [of, [P], ma_ssi_gross_earned_income], [of, [P], ma_spousal_unearned_receipts], [of, [P], ma_ssi_gambling_receipts]], [case, [["=", [of, [P], ma_ssi_gross_earned_income], 0], 0], [else, [of, [P], ma_payroll_taxes_withheld]]]]]]
sources: [S1756, S1754, S3001]
open: [OQ-1345]
implemented: engine
tags: [ma, ltc, income]
rationale: "Final verification pass 3, pattern sweep (2026-11-22): the income read now includes lottery and gambling winnings received in the month (§ 8.100.5.F.5.i, S3001; an unstated receipt is 0). OQ-97 (resolved in the HCPF fix round): community_spouse_income (CO-833) was supplied directly for the institutionalized spouse's month. Reading the spouse's own facts across the spouse edge keeps one statement of each person's income, as the SSI-related group sum (ma_ssi_household_unearned_income_sum, CO-663) already does. Receipt records, migration phase 2 (2026-11-23): the community spouse's unearned income is read from the receipts (ma_spousal_unearned_receipts, CO-5531, and CO-5512) instead of the scalar facts. Earned-income records, step E1 (Medicaid and CHP+): earned income is the earnings records the SSI method's counting table counts (ma_ssi_gross_earned_income, CO-5171), replacing wages_gross plus ma_self_employment_net_earnings."
tests:
  - {id: CO-2467-T1, month: "2026-10", as_of: "2026-10-01", given: {resides_in_medical_institution: true}, title: "Spouse at home with Social Security of $1,180", others: {p2: {ma_payroll_taxes_withheld: 0, resides_in_medical_institution: false, wages_gross: 0, ma_self_employment_net_earnings: 0, receipts: [{kind: social_security, amount: 1180}, {kind: ssi}], earnings: [{kind: self_employment_receipts}]}}, relationships: [[spouse, p2]], expect: 1180}
  - {id: CO-2467-T2, month: "2026-10", as_of: "2026-10-01", given: {resides_in_medical_institution: true}, title: "Spouse earning $2,000 with $153 FICA withheld", others: {p2: {resides_in_medical_institution: false, wages_gross: 2000, ma_self_employment_net_earnings: 0, ma_payroll_taxes_withheld: 153, receipts: [{kind: ssi}], earnings: [{kind: wages, amount: 2000}, {kind: self_employment_receipts}]}}, relationships: [[spouse, p2]], expect: 1847}
  # Field-effect sweep, non-MAGI Medicaid (docs/reviews/field-sweep-snap-cash-nonmagi.md); hand-computed from the text quoted in each title.
  - {id: CO-2467-T3, month: "2026-10", as_of: "2026-10-01", given: {resides_in_medical_institution: true}, title: "CO-2467 (sweep): the community spouse's workers' compensation of 1,500, 1,200 of it for the claim's expenses: 8.100.7.R.2 (S1756) takes the community spouse's \"gross income less mandatory deductions for FICA and Medicare tax\", so the claim expenses are not taken off (OQ-1345): 1,500", others: {p2: {ma_payroll_taxes_withheld: 0, resides_in_medical_institution: false, receipts: [{kind: workers_compensation, amount: 1500, claim_expense: 1200}], earnings: []}}, relationships: [[spouse, p2]], expect: 1500}
  # Coverage pass 6 F6-10 (decision 4): 8.100.7.R.2 (S1756) deducts the community spouse's mandatory FICA and Medicare taxes; for a spouse with wages of 1,000 not stated, the income cannot be determined (it was read as 0). Stated 76.50 (7.65% of 1,000): 1,180 + 1,000 - 76.50 = 2,103.50. A spouse with no earnings has none withheld: T1 (1,180).
  - {id: CO-2467-T4, month: "2026-10", as_of: "2026-10-01", given: {resides_in_medical_institution: true}, title: "F6-10: the working spouse's withheld payroll taxes not stated: cannot determine", others: {p2: {resides_in_medical_institution: false, wages_gross: 1000, receipts: [{kind: social_security, amount: 1180}], earnings: [{kind: wages, amount: 1000}]}}, relationships: [[spouse, p2]], expect: unknown}
  - {id: CO-2467-T5, month: "2026-10", as_of: "2026-10-01", given: {resides_in_medical_institution: true}, title: "F6-10: the working spouse's withheld payroll taxes stated: 1,180 + 1,000 - 76.50", others: {p2: {resides_in_medical_institution: false, wages_gross: 1000, ma_payroll_taxes_withheld: 76.5, receipts: [{kind: social_security, amount: 1180}], earnings: [{kind: wages, amount: 1000}]}}, relationships: [[spouse, p2]], expect: 2103.5}
