id: CO-2467
name: "Medicaid: community spouse's income"
identifier: ma_community_spouse_income
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The community spouse's own gross monthly income from sources other than the institutionalized spouse, less mandatory FICA and Medicare taxes (10 CCR 2505-10 § 8.100.7.R.2), read from the income of the person's spouse who does not reside in a medical institution: wages, net self-employment earnings, the unearned receipts the spousal impoverishment rules count (ma_spousal_unearned_receipts) and gambling winnings."
precision: The institutionalized spouse's own income is left out because the group keeps only spouses not residing in a medical institution; the person evaluated is the institutionalized spouse. Income from the institutionalized spouse (the community spouse income allowance) is not among the receipts summed. Child support the community spouse receives (support for a child, the child's income) and Colorado Works or Adult Financial cash are left out as before receipt records (OQ-974); a loan, an income tax refund and VA Aid and Attendance are not income.
derived: [sum, [filter, [reachable, [spouse]], [not, [of, [P], resides_in_medical_institution]]], [max, 0, ["-", ["+", [of, [P], wages_gross], [of, [P], ma_self_employment_net_earnings], [of, [P], ma_spousal_unearned_receipts], [of, [P], ma_ssi_gambling_receipts]], [otherwise, [of, [P], ma_payroll_taxes_withheld], 0]]]]
sources: [S1756, S1754, S3001]
implemented: engine
tags: [ma, ltc, income]
rationale: "Final verification pass 3, pattern sweep (2026-11-22): the income read now includes lottery and gambling winnings received in the month (§ 8.100.5.F.5.i, S3001; an unstated receipt is 0). OQ-97 (resolved in the HCPF fix round): community_spouse_income (CO-833) was supplied directly for the institutionalized spouse's month. Reading the spouse's own facts across the spouse edge keeps one statement of each person's income, as the SSI-related group sum (ma_ssi_household_unearned_income_sum, CO-663) already does. Receipt records, migration phase 2 (2026-11-23): the community spouse's unearned income is read from the receipts (ma_spousal_unearned_receipts, CO-5531, and CO-5512) instead of the scalar facts."
tests:
  - {id: CO-2467-T1, month: "2026-10", as_of: "2026-10-01", given: {resides_in_medical_institution: true}, title: "Spouse at home with Social Security of $1,180", others: {p2: {resides_in_medical_institution: false, social_security_income: 1180, pension_income: 0, wages_gross: 0, ma_self_employment_net_earnings: 0, unemployment_income: 0, other_unearned_income_taxable: 0, other_unearned_income_nontaxable: 0, tax_exempt_interest: 0, tanf_cash_income: 0, adult_financial_cash_income: 0, child_support_received: 0, receipts: [{kind: social_security, amount: 1180}, {kind: ssi}]}}, relationships: [[spouse, p2]], expect: 1180}
  - {id: CO-2467-T2, month: "2026-10", as_of: "2026-10-01", given: {resides_in_medical_institution: true}, title: "Spouse earning $2,000 with $153 FICA withheld", others: {p2: {resides_in_medical_institution: false, social_security_income: 0, pension_income: 0, wages_gross: 2000, ma_self_employment_net_earnings: 0, unemployment_income: 0, other_unearned_income_taxable: 0, other_unearned_income_nontaxable: 0, tax_exempt_interest: 0, tanf_cash_income: 0, adult_financial_cash_income: 0, child_support_received: 0, ma_payroll_taxes_withheld: 153, receipts: [{kind: ssi}]}}, relationships: [[spouse, p2]], expect: 1847}
