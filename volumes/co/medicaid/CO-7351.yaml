id: CO-7351
name: "Medicaid: receives SSI in the month"
identifier: ma_receives_ssi_in_month
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether the person is an SSI recipient in the month (10 CCR 2505-10 § 8.100.6.C.1.a, 'persons receiving financial assistance under SSI'): SSA has awarded the person SSI (receives_ssi, CO-012) and, for a month before the determination month, the month is not before the month of the original SSI eligibility date (ssi_eligibility_date, CO-7350; § 8.100.6.C.7)."
precision: "The determination month and the months after read the award as stated on the determination date. A retroactive month (§ 8.100.3.E.1, S1503: the person 'met all applicable eligibility requirements' in it) is an SSI month from the month the award makes the person eligible (8.100.5.C.1: eligibility is effective 'the first day of the month the person becomes eligible'); a month before it is judged by the SSI-related tests of the month. The eligibility date is required for such a month (decision 4 of 2026-11-23). Coverage pass 7, non-MAGI F7-7 (docs/reviews/coverage7-medicaid-nonmagi.md): an infant within the special provision of § 8.100.6.C.10.a.i (S5245; ma_ssi_infant_eligible_from_birth, CO-7723: born in a hospital, SSA's onset in the stay at birth, the birth within three months of the SSI eligibility date) is an SSI recipient from the month of birth: 'the effective date of Medicaid eligibility shall be the infant's date of birth'. Before, the birth month was judged by the SSI-related tests with the parents' income deemed (INFANT-SSI, stored household CO-1107). The provision is read only after the eligibility-date test fails and from the birth month, so no other person is asked its facts."
derived: [all, receives_ssi, [case, [[">=", [month], [det_month]], true], [else, [any, ["<=", [month_of, ssi_eligibility_date], [month]], [all, ["<=", [month_of, date_of_birth], [month]], ma_ssi_infant_eligible_from_birth]]]]]
sources: [S5030, S1503, S5245]
implemented: engine
tags: [ma, non_magi, disability]
rationale: "Coverage pass 6, non-MAGI F6-5 (docs/reviews/coverage6-medicaid-nonmagi.md): ma_is_ssi_related_eligible (CO-611) and ma_ssi_related_category (CO-612) read receives_ssi, the award as of the determination date, in every month, so a person awarded SSI from October was an SSI recipient in a retroactive August in which the SSI-related resource test failed (SSI-RETRO, CO-907). The same pattern as ma_is_institutionalized_spouse_in_institution (CO-5200) for a dated status."
nearest: [CO-5200, CO-640]
tests:
  # Coverage pass 6 F6-5 (SSI-RETRO, CO-907): award from 2026-10-01, determined 2026-11-12. § 8.100.6.C.1.a (S5030) "persons receiving financial assistance under SSI".
  # August: month_of(2026-10-01) = 2026-10 > 2026-08: false. October: 2026-10 <= 2026-10: true. The determination month: receives_ssi: true. No award: false in any month. No date for a retroactive month: unknown.
  - {id: CO-7351-T1, month: "2026-08", as_of: "2026-11-12", title: "F6-5: a retroactive month before the award's eligibility date", given: {date_of_birth: "1958-03-01", receives_ssi: true, ssi_eligibility_date: "2026-10-01"}, expect: false}
  - {id: CO-7351-T2, month: "2026-10", as_of: "2026-11-12", title: "F6-5: the month of the eligibility date", given: {receives_ssi: true, ssi_eligibility_date: "2026-10-01"}, expect: true}
  - {id: CO-7351-T3, month: "2026-11", as_of: "2026-11-12", title: "The determination month reads the award as stated", given: {receives_ssi: true}, expect: true}
  - {id: CO-7351-T4, month: "2026-08", as_of: "2026-11-12", title: "No SSI award: no SSI month", given: {receives_ssi: false}, expect: false}
  - {id: CO-7351-T5, month: "2026-09", as_of: "2026-11-12", title: "F6-5: a retroactive month with the eligibility date not stated cannot be determined (decision 4)", given: {receives_ssi: true}, expect: unknown}
  # Coverage pass 7 F7-7 (INFANT-SSI, CO-1107): § 8.100.6.C.10.a.i (S5245): born 2026-08-10 in a hospital, SSA's onset 2026-08-10, discharged 2026-08-25, SSI eligible from 2026-09-01, determined 2026-11-12. August: before the eligibility month, but the infant provision dates SSI Medicaid from the birth: true (was false). July: before the birth: false.
  - {id: CO-7351-T90, month: "2026-08", as_of: "2026-11-12", title: "F7-7: the birth month of an SSI infant born in a hospital with the onset in the stay: true (was false)", given: {receives_ssi: true, ssi_eligibility_date: "2026-09-01", date_of_birth: "2026-08-10", born_in_hospital: true, disability_onset_date: "2026-08-10", birth_hospital_discharge_date: "2026-08-25", residence_setting_type: private_dwelling}, expect: true}
  - {id: CO-7351-T91, month: "2026-07", as_of: "2026-11-12", title: "F7-7: the month before the birth: false", given: {receives_ssi: true, ssi_eligibility_date: "2026-09-01", date_of_birth: "2026-08-10", born_in_hospital: true, disability_onset_date: "2026-08-10", birth_hospital_discharge_date: "2026-08-25", residence_setting_type: private_dwelling}, expect: false}
  - {id: CO-7351-T92, month: "2026-08", as_of: "2026-11-12", title: "F7-7: born at home: the birth month is not an SSI month", given: {receives_ssi: true, ssi_eligibility_date: "2026-09-01", date_of_birth: "2026-08-10", born_in_hospital: false, disability_onset_date: "2026-08-10", residence_setting_type: private_dwelling}, expect: false}
