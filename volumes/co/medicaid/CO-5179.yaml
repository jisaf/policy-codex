id: CO-5179
name: "Medicaid SSI method: WIOA wages of a dependent child exempt for the month"
identifier: ma_ssi_excluded_wioa_wages
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The person's wages of the month from a Workforce Innovation and Opportunity Act program (ma_ssi_wioa_earned_receipts, CO-5178) that 10 CCR 2505-10 8.100.3.K.8.c exempts: wages 'paid to any dependent child who is applying for or receiving Medical Assistance are exempt in determining eligibility for a period not to exceed six months in each calendar year'. The person is a dependent child as 8.100.1 defines it: under 18, or 18 and a full-time student expected to graduate by 19 (ma_is_dependent_child, CO-544), who lives with a parent, legal guardian, caretaker relative or foster parent (a person of the home, lives_with, toward whom the person is a child, stepchild, ward, foster child or in that person's primary care). The six months are the first six months of the calendar year, through the month, in which the person had such wages; in a seventh or later month the wages are counted (K.8.a counts a caretaker relative's). Otherwise 0."
precision: "Earned-income records, Medicaid and CHP+ track E1 (OQ-1023, settled by K.8.c as written): before E1 every WIOA on-the-job training wage was counted as part of wages_gross. 'Applying for or receiving Medical Assistance' is read as the person whose eligibility the SSI-related figure is for: the exemption is read through ma_ssi_excluded_earned_income (CO-2471), which the applicant's and the couple's countable income read; the ineligible child allocation reads the child's gross income, as before. A month with no WIOA wages uses none of the six."
derived: [case, [["<=", ma_ssi_wioa_earned_receipts, 0], 0], [[not, [all, ma_is_dependent_child, [exists, lives_with, [rel, [child, stepchild, ward, foster_child, in_primary_care_of], [P]]]]], 0], [[">", [count_months, [months_from_to, [latest_month_of_year, 1, [month]], [month]], [">", ma_ssi_wioa_earned_receipts, 0]], ma_ssi_wioa_dependent_child_exempt_months], 0], [else, ma_ssi_wioa_earned_receipts]]
sources: [S4107, S4341, S1500]
implemented: engine
tags: [ma, non_magi, income]
rationale: "OQ-1023 (earned-income records E0, finding E0-F4), settled: 8.100.3.K.8.c (S4107) exempts a dependent child's WIA program wages for up to six months a calendar year; the SSI method counted them in every month. A child of 17 in a WIOA on-the-job training program earning 650 a month, with no other income, had countable earned income (650 - 85) / 2 = 282.50 in every month; in the first six months of the year it is 0."
nearest: [CO-5178, CO-2471]
