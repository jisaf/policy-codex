id: CO-6450
name: "Medicaid MAGI: a person's boarder earnings, net of the costs of providing the room or meals"
identifier: ma_magi_boarder_earnings
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The person's payments from boarders received in the month (earnings records the MAGI counting table counts net of provision costs: boarder_payments), less the documentable costs of providing the room or meals paid in the month (the records it deducts from them: business_cost_boarder_provision), and never less than zero: 10 CCR 2505-10 8.100.3.K.10.c-e count board, room, and room and board payments as earned income \"to the extent that the payment ... exceeds ... documentable expenses directly related to the provision\" of them, and 26 U.S.C. 62(a)(4), which 8.100.4.C.1 incorporates, takes the deductions attributable to property held for the production of rents out of adjusted gross income. The food stamp allotment per boarder of K.10.c and e is not subtracted: it is an income disregard, which 42 U.S.C. 1396a(e)(14)(B) bars for MAGI."
precision: "Coverage pass 4, C4-03 (2026-11-23; OQ-1121 settled): before, ma_magi_wage_earnings (CO-5160) counted the payments at their gross amount. The costs of the month are taken from the payments of the month, all boarders together, as K.10 states them per payment and the tax return reports rents net of their expenses; a month whose costs exceed the payments gives 0, not a loss set against other income (K.10's \"to the extent that\"). A cost record not stated is no cost: the earnings list is the whole statement of the person's pay and costs (decision 4 reads an unstated list as unknown, a stated one as complete). The SSI method's own figure, with the allotment, is ma_ssi_boarder_earned_income (CO-5177)."
derived: [max, 0, ["-", [sum_receipts, earnings, [all, [received_in, [month]], ["=", [lookup, ma_magi_earnings_treatment_table, [receipt, kind]], counted_net_of_provision_costs]], [receipt, amount]], [sum_receipts, earnings, [all, [received_in, [month]], ["=", [lookup, ma_magi_earnings_treatment_table, [receipt, kind]], deducted_from_boarder_payments]], [receipt, amount]]]]
sources: [S4107, S166, S4632, S4630]
implemented: engine
tags: [ma, magi, income]
rationale: "Coverage pass 4, C4-03: MAGI counted boarders' payments at their gross amount (CO-5106 row counted), although 8.100.3.K.10.c-e (on file, S4107) and 26 U.S.C. 62(a)(4) net the costs of providing the room or meals. The net is a floor at zero over two sums, so it cannot be a value inside CO-5160's one sum; it is its own item, which ma_person_magi_income (CO-502) adds."
nearest: [CO-5160, CO-5161, CO-5162, CO-5177]
tests:
  - {id: CO-6450-T1, month: "2026-11", as_of: "2026-11-10", given: {earnings: [{kind: wages, amount: 1100}, {kind: boarder_payments, amount: 900, boarders: 2, provides: room_and_board}, {kind: business_cost_boarder_provision, amount: 250}]}, title: "Coverage pass 4, C4-03 (B-BOARD): two boarders pay 900 for room and board; 250 of documented costs: 900 - 250 = 650 (K.10.e; 26 U.S.C. 62(a)(4)); no allotment per boarder (42 U.S.C. 1396a(e)(14)(B)); wages are not read here", expect: 650}
  - {id: CO-6450-T2, month: "2026-11", as_of: "2026-11-10", given: {earnings: [{kind: boarder_payments, amount: 300, boarders: 1, provides: room_only}, {kind: business_cost_boarder_provision, amount: 400}]}, title: "Costs above the payments: 300 - 400 = -100, read as 0 (K.10.d: earned income only \"to the extent that\" the payment exceeds the costs)", expect: 0}
  - {id: CO-6450-T3, month: "2026-11", as_of: "2026-11-10", given: {earnings: [{kind: boarder_payments, amount: 600, boarders: 1, provides: board_only}, {kind: business_cost_boarder_provision, amount: 150, month: "2026-10", frequency: once}]}, title: "A cost paid in October does not come off November's payments: 600 - 0 = 600", expect: 600}
  - {id: CO-6450-T4, month: "2026-11", as_of: "2026-11-10", given: {earnings: [{kind: wages, amount: 2000}]}, title: "No boarders: 0", expect: 0}
  - {id: CO-6450-T5, month: "2026-11", as_of: "2026-11-10", given: {}, title: "Earnings not stated: cannot determine (decision 4)", expect: unknown}
