  - {id: CO-1186-T2, as_of: "2026-10-01", month: "2026-11", given: {lottery_gambling_winnings_amount: 100000, lottery_gambling_winnings_month: "2026-10"}, expect: 0}
  - {id: CO-1186-T3, as_of: "2026-10-01", month: "2026-10", given: {lottery_gambling_winnings_amount: 0}, expect: 0}
