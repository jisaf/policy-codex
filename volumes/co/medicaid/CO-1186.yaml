id: CO-1186
name: "Medicaid: lottery or gambling winnings counted in the month received"
identifier: ma_lottery_winnings_counted_in_month_received
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The person's lottery or gambling winnings counted as MAGI income this month for determining the eligibility of the other members of the person's household - the whole amount in the month received and nothing in any other month (10 CCR 2505-10 § 8.100.4.C.1.b.xiv.4: winnings \"will continue to count only in the month received in determining the eligibility for the members of their household\")."
precision: "This is the amount ma_person_magi_income (CO-502) includes, so every household that counts the person's income sees the winnings only in the month received; ma_magi_household_income (CO-503) replaces it with the spread amount (ma_lottery_winnings_countable_for_recipient, CO-1187) when the household is the winner's own. For winnings of $79,999 or less the two are the same. A person with no winnings (amount 0) has 0 without the month being read."
derived: [case, [[=, lottery_gambling_winnings_amount, 0], 0], [[=, [month], lottery_gambling_winnings_month], lottery_gambling_winnings_amount], [else, 0]]
sources: [S669]
implemented: engine
tags: [ma, magi, income]
rationale: "S-9 of the phase 7 review. No existing item counts lottery or gambling winnings for MAGI; § 8.100.4.C.1.b.xiv.4 treats them differently for the winner and for the other members of the household, so the household-member amount is its own item."
tests:
