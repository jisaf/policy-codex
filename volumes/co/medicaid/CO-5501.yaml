id: CO-5501
name: "Medicaid MAGI: a person's counted unearned receipts"
identifier: ma_magi_unearned_receipts
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The person's receipts of the month that Medicaid's MAGI counting table counts (ma_magi_receipt_treatment_table, CO-5500: counted, or counted because no rule excludes it), each at its gross amount, except a kind the table counts at its taxable amount (counted_taxable_amount: a savings account distribution, cash value taken from an insurance policy), which counts the part in federal gross income the record states (taxable_amount; 26 U.S.C. 61(a), 223(f)(1), 408A(d)(1), 529(c)(3)(B)), a receipt paid once in the month received (42 CFR 435.603(e)(1); 10 CCR 2505-10 8.100.4.C.1.d.i). Gambling winnings are counted apart (ma_magi_gambling_receipts, CO-5502), since b.xiv spreads them for the winner. A pension or annuity counts the taxable part the record states, else its whole amount (counted_taxable_amount_where_stated; 26 U.S.C. 61(a)(8), (10), 72(b)(1), 104(a)(4)), and an income tax refund the taxable part the record states, else nothing (counted_stated_taxable_amount_only; 111(a)) (coverage pass 5, C5-09). Educational assistance counts the part used for living expenses that is in federal gross income, the smaller of for_living_expenses and taxable_amount (counted_taxable_living_expense_part; 10 CCR 2505-10 8.100.4.C.1.d.ii excludes only what is \"used for educational purposes and not for living expenses\"; coverage pass 7, C7-03). A social security benefit counts its amount less the part recouped for an earlier overpayment and the part received for a person living elsewhere (26 U.S.C. 86(d)(1), (2)(A); field sweep, coverage pass 5)."
precision: "Field sweep (coverage pass 5, docs/reviews/field-sweep-magi.md): a stream of receipts (a record with no month and no date) is the payment of the months its source ran, from the month of its start_date through the month of its end_date (CO-5000), and MAGI counts the month's income (10 CCR 2505-10 § 8.100.4.C.4: \"current or previous monthly household income\"), so a stream is counted only in those months. Before, a stream was counted in every month. Coverage verification 7, V7-3 (docs/reviews/verify-coverage7-fixes.md): educational assistance tests the taxable amount first: a record whose taxable_amount is 0 (an educational loan, a grant used only for tuition and fees) counts 0 whatever part is for living expenses, the smaller of the two being 0, so for_living_expenses is read only where the taxable amount is more than 0 (M3-C: a tuition-only grant with the living-expense part not stated, wages 1,200 / 1,330 = 90.2%, eligible, was cannot determine)."
derived: [sum_receipts, receipts, [all, [received_in, [month]], [any, [not, [unknown, [receipt, month]]], [all, [any, [unknown, [receipt, start_date]], ["<=", [month_of, [receipt, start_date]], [month]]], [any, [unknown, [receipt, end_date]], [">=", [month_of, [receipt, end_date]], [month]]]]], [in, [lookup, ma_magi_receipt_treatment_table, [receipt, kind]], [counted, counted_no_rule_excludes, counted_net_of_repayments_and_others_benefits, counted_taxable_amount, counted_taxable_amount_where_stated, counted_stated_taxable_amount_only, counted_taxable_living_expense_part]]], [case, [["=", [lookup, ma_magi_receipt_treatment_table, [receipt, kind]], counted_net_of_repayments_and_others_benefits], ["-", ["-", [receipt, amount], [receipt, recouped]], [receipt, for_person_living_elsewhere]]], [["=", [lookup, ma_magi_receipt_treatment_table, [receipt, kind]], counted_taxable_amount], [receipt, taxable_amount]], [["=", [lookup, ma_magi_receipt_treatment_table, [receipt, kind]], counted_taxable_amount_where_stated], [otherwise, [receipt, taxable_amount], [receipt, amount]]], [["=", [lookup, ma_magi_receipt_treatment_table, [receipt, kind]], counted_stated_taxable_amount_only], [otherwise, [receipt, taxable_amount], 0]], [["=", [lookup, ma_magi_receipt_treatment_table, [receipt, kind]], counted_taxable_living_expense_part], [case, [[any, ["<=", [receipt, taxable_amount], 0], ["<=", [receipt, for_living_expenses], 0]], 0], [else, [min, [receipt, for_living_expenses], [receipt, taxable_amount]]]]], [else, [receipt, amount]]]]
sources: [S165, S166, S4631, S4633, S4634, S4635]
implemented: engine
tags: [ma, magi, income]
rationale: "Receipt records, migration phase 2: MAGI unearned income read from the receipts through the MAGI counting table, replacing social_security_income + pension_income + unemployment_income + other_unearned_income_taxable + tax_exempt_interest in ma_person_magi_income (CO-502) and the MAGI arm of ma_has_unearned_income_for_verification (CO-2870). Coverage pass 4, C4-01 (2026-11-23): a savings account distribution was counted at its whole amount, although a health savings account, Roth IRA or tuition program distribution for its qualified purpose is not gross income; it and insurance cash value are now counted at the taxable amount the record states."
tests:
  - {id: CO-5501-T1, month: "2026-10", as_of: "2026-10-01", given: {receipts: [{kind: social_security, amount: 1420}, {kind: pension, amount: 610}, {kind: tax_exempt_interest, amount: 50}, {kind: ssi, amount: 300}, {kind: child_support, amount: 250}, {kind: colorado_works_cash, amount: 400}]}, title: "Social Security, a pension and tax-exempt interest counted; SSI, child support and Colorado Works cash not (8.100.4.C.1.b-d)", expect: 2080}
  - {id: CO-5501-T2, month: "2026-10", as_of: "2026-10-01", given: {receipts: [{kind: other_taxable, amount: 100}, {kind: other_nontaxable, amount: 400}, {kind: gift, amount: 75}]}, title: "Taxable residual counted, non-taxable residual not (the old other_unearned_income_taxable / _nontaxable split)", expect: 100}
  - {id: CO-5501-T3, month: "2026-10", as_of: "2026-10-01", given: {receipts: [{kind: social_security, amount: 2400, frequency: once, retroactive: true, month: "2026-10"}, {kind: social_security, amount: 900}]}, title: "A retroactive Social Security payment counts in the month received (435.603(e)(1); 8.100.4.C.1.c.iii, d.i)", expect: 3300}
  - {id: CO-5501-T4, month: "2026-10", as_of: "2026-10-01", given: {receipts: [{kind: unemployment_compensation, amount: 1200, frequency: once, month: "2026-09"}]}, title: "A one-time payment of another month is not counted in this one", expect: 0}
  - {id: CO-5501-T5, month: "2026-10", as_of: "2026-10-01", given: {receipts: [{kind: gambling_winnings, amount: 5000, frequency: once, month: "2026-10"}]}, title: "Gambling winnings are counted apart (CO-5502); unearned receipts 0", expect: 0}
  - {id: CO-5501-T6, month: "2026-10", as_of: "2026-10-01", given: {}, title: "Receipts not stated: cannot determine", expect: unknown}
  - {id: CO-5501-T7, month: "2026-10", as_of: "2026-10-01", given: {receipts: []}, title: "A stated empty list: no unearned income", expect: 0}
  - {id: CO-5501-T8, month: "2026-11", as_of: "2026-11-10", given: {receipts: [{kind: savings_account_distribution, amount: 500, month: "2026-11", frequency: once, taxable_amount: 0}]}, title: "Coverage pass 4, C4-01 (B-HSA): a $500 health savings account distribution used to pay a hospital bill is not gross income (26 U.S.C. 223(f)(1), S4633): taxable amount 0, counted 0", expect: 0}
  - {id: CO-5501-T9, month: "2026-11", as_of: "2026-11-10", given: {receipts: [{kind: savings_account_distribution, amount: 500, month: "2026-11", frequency: once, taxable_amount: 500}, {kind: pension, amount: 700}]}, title: "Coverage pass 4, C4-01: a $500 traditional IRA withdrawal, all of it in gross income (taxable amount 500), and a $700 pension: 500 + 700 = 1,200", expect: 1200}
  - {id: CO-5501-T10, month: "2026-11", as_of: "2026-11-10", given: {receipts: [{kind: savings_account_distribution, amount: 500, month: "2026-11", frequency: once}]}, title: "Coverage pass 4, C4-01: a savings account distribution that does not state its taxable amount: cannot determine (decision 4), not its whole amount", expect: unknown}
  - {id: CO-5501-T11, month: "2026-11", as_of: "2026-11-10", given: {receipts: [{kind: insurance_cash_value, amount: 2000, month: "2026-11", frequency: once, taxable_amount: 300}, {kind: savings_account_distribution, amount: 400, month: "2026-10", frequency: once, taxable_amount: 400}]}, title: "Coverage pass 4, C4-09: $2,000 of cash value surrendered, $300 of it income from the contract (8.100.4.C.1.b.vii; 26 U.S.C. 61(a)(9)): 300; an October distribution is not counted in November: 300 + 0 = 300", expect: 300}
  - {"id": "CO-5501-T12", "month": "2026-11", "as_of": "2026-11-10", "title": "C5-09 (PENSION-104): military disability retired pay of 2,000 a month, wholly excluded under 26 U.S.C. 104(a)(4), the record stating taxable_amount 0: counted 0 (was 2,000)", "given": {"receipts": [{"kind": "pension", "amount": 2000, "taxable_amount": 0}]}, "expect": 0}
  - {"id": "CO-5501-T13", "month": "2026-11", "as_of": "2026-11-10", "title": "C5-09: a civil service annuity of 2,000 a month, 300 of it the return of the after-tax investment (72(b)(1)), taxable_amount 1,700: counted 1,700", "given": {"receipts": [{"kind": "pension", "amount": 2000, "taxable_amount": 1700}]}, "expect": 1700}
  - {"id": "CO-5501-T14", "month": "2026-11", "as_of": "2026-11-10", "title": "C5-09: a pension of 2,000 that does not state a taxable part: a pension is gross income (61(a)(10)) unless the record states otherwise: 2,000", "given": {"receipts": [{"kind": "pension", "amount": 2000}]}, "expect": 2000}
  - {"id": "CO-5501-T15", "month": "2026-11", "as_of": "2026-11-10", "title": "C5-09: a State income tax refund of 400 in November to a filer who itemized last year, all of it a recovery that reduced last year's tax (111(a)), taxable_amount 400: counted 400 (was 0)", "given": {"receipts": [{"kind": "income_tax_refund", "amount": 400, "month": "2026-11", "frequency": "once", "taxable_amount": 400}]}, "expect": 400}
  - {"id": "CO-5501-T16", "month": "2026-11", "as_of": "2026-11-10", "title": "C5-09: an income tax refund of 400 that does not state a taxable part: a refund is gross income only to the extent 111(a) makes the recovery income, which the record would state: 0", "given": {"receipts": [{"kind": "income_tax_refund", "amount": 400, "month": "2026-11", "frequency": "once"}]}, "expect": 0}
  - {"id": "CO-5501-T17", "month": "2026-10", "as_of": "2026-11-10", "title": "Field sweep: unemployment compensation of 1,200 a month that began 2026-11-01: nothing in October (was 1,200)", "given": {"receipts": [{"kind": "unemployment_compensation", "amount": 1200, "start_date": "2026-11-01"}]}, "expect": 0}
  - {"id": "CO-5501-T18", "month": "2026-11", "as_of": "2026-11-10", "title": "Field sweep: the same in November: 1,200", "given": {"receipts": [{"kind": "unemployment_compensation", "amount": 1200, "start_date": "2026-11-01"}]}, "expect": 1200}
  - {"id": "CO-5501-T19", "month": "2026-11", "as_of": "2026-11-10", "title": "Field sweep: a Social Security benefit of 1,400 from which SSA withholds 140 to recover an earlier overpayment: 1,400 - 140 = 1,260 (26 U.S.C. 86(d)(2)(A); was 1,400)", "given": {"receipts": [{"kind": "social_security", "amount": 1400, "recouped": 140}]}, "expect": 1260}
  - {"id": "CO-5501-T20", "month": "2026-11", "as_of": "2026-11-10", "title": "Field sweep: a mother receives 1,100 of Social Security, 400 of it for her son who lives with his grandparents: 1,100 - 400 = 700 (86(d)(1): received by reason of her own entitlement)", "given": {"receipts": [{"kind": "social_security", "amount": 1100, "for_person_living_elsewhere": 400}]}, "expect": 700}
  # Coverage pass 7, C7-03 (SCHOLAR-LIVING): a $4,000 grant received once in November 2026, $2,500 of it for housing.
  - {"id": "CO-5501-T90", "month": "2026-11", "as_of": "2026-11-10", "title": "C7-03 (was 0): a $4,000 grant, $2,500 of it for housing (for_living_expenses 2,500), the $2,500 in federal gross income (taxable_amount 2,500): min(2,500, 2,500) = 2,500 counted in the month received (d.i)", "given": {"receipts": [{"kind": "educational_assistance", "amount": 4000, "month": "2026-11", "frequency": "once", "for_living_expenses": 2500, "taxable_amount": 2500}]}, "expect": 2500}
  - {"id": "CO-5501-T91", "month": "2026-11", "as_of": "2026-11-10", "title": "C7-03: a $4,000 scholarship all for tuition and books (for_living_expenses 0): d.ii excludes it: 0, the taxable amount not read", "given": {"receipts": [{"kind": "educational_assistance", "amount": 4000, "month": "2026-11", "frequency": "once", "for_living_expenses": 0}]}, "expect": 0}
  - {"id": "CO-5501-T92", "month": "2026-11", "as_of": "2026-11-10", "title": "C7-03: an educational loan of $3,000, $1,000 of it for rent: a loan is not gross income (taxable_amount 0): min(1,000, 0) = 0", "given": {"receipts": [{"kind": "educational_assistance", "amount": 3000, "month": "2026-11", "frequency": "once", "for_living_expenses": 1000, "taxable_amount": 0}]}, "expect": 0}
  - {"id": "CO-5501-T93", "month": "2026-11", "as_of": "2026-11-10", "title": "C7-03: a grant that does not state the part for living expenses: cannot be determined (required where read)", "given": {"receipts": [{"kind": "educational_assistance", "amount": 4000, "month": "2026-11", "frequency": "once"}]}, "expect": "unknown"}
  - {"id": "CO-5501-T94", "month": "2026-11", "as_of": "2026-11-10", "title": "C7-03: a $4,000 grant to a student who is not a candidate for a degree, all of it taxable (taxable_amount 4,000), $2,500 of it for housing: min(2,500, 4,000) = 2,500 (the $1,500 for tuition is used for educational purposes, d.ii)", "given": {"receipts": [{"kind": "educational_assistance", "amount": 4000, "month": "2026-11", "frequency": "once", "for_living_expenses": 2500, "taxable_amount": 4000}]}, "expect": 2500}
  # Coverage verification 7, V7-3 (M3-C): a $4,000 grant used only for tuition, none of it in federal gross income (taxable_amount 0), the
  # living-expense part not stated. The row counts min(living part, 0) = 0 whatever the living part is, so the field is not read: 0.
  - {"id": "CO-5501-T95", "month": "2026-11", "as_of": "2026-11-10", "title": "V7-3: a tuition-only grant, taxable_amount 0, the living-expense part not stated: 0 (was cannot determine)", "given": {"receipts": [{"kind": "educational_assistance", "amount": 4000, "month": "2026-11", "frequency": "once", "taxable_amount": 0}]}, "expect": 0}
  # (M3-B) The same grant with $2,500 of it in federal gross income and the living-expense part not stated: min(?, 2,500) is not known: cannot determine.
  - {"id": "CO-5501-T96", "month": "2026-11", "as_of": "2026-11-10", "title": "V7-3: taxable_amount 2,500 and the living-expense part not stated: cannot determine (required where the taxable amount is more than 0)", "given": {"receipts": [{"kind": "educational_assistance", "amount": 4000, "month": "2026-11", "frequency": "once", "taxable_amount": 2500}]}, "expect": "unknown"}
