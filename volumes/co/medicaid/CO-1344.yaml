id: CO-1344
name: "Medicaid: data source household income as a share of the poverty guideline"
identifier: ma_electronic_data_source_household_income_pct_fpl
kind: derived
type: rate
scope: person-month
program: Medicaid
meaning: The monthly household income an electronic data source match (IEVS, the Federal Data Services Hub, The Work Number) reports for the person's Medical Assistance household, as a fraction of the federal poverty guideline for that household's size, for comparison with the attested figure.
precision: "The data source reports gross income; the comparison of 42 CFR 435.952 (S864, S867) takes it as reported. The 8-person table and each additional person follow ma_magi_household_income_pct_fpl."
derived: ["/", [sum, ma_magi_household_members, [of, [P], electronic_data_source_monthly_gross_income]], ["/", [+, [lookup, federal_poverty_guideline_annual_table, [min, ma_magi_household_size, 8]], ["*", federal_poverty_guideline_annual_each_additional, [max, 0, ["-", ma_magi_household_size, 8]]]], 12]]
sources: [S864]
implemented: engine
tags: [verification, income, ma]
rationale: "No existing item in the volume carries this fact; the phase-9 verification chapter (design amended 2026-11-21) needs it, and it is program-neutral so every program's verification rules read the same value. Dual-entry audit 2.4: the ratio is computed from each MAGI household member's data-source income (CO-1589) and the guideline for the MAGI household size, so the match is stated once, per person."
tests:
  - {id: CO-1344-T1, title: "Two members, 3,210 reported, household of two", month: "2026-10", as_of: "2026-10-01", parameters: {federal_poverty_guideline_annual_table: {"2": 24000}}, given: {ma_magi_household_members: [p1, p2], ma_magi_household_size: 2, electronic_data_source_monthly_gross_income: 2000}, others: {p2: {electronic_data_source_monthly_gross_income: 1560}}, expect: 1.78}
