id: CO-1344
name: "Medicaid: data source household income as a share of the poverty guideline"
identifier: ma_electronic_data_source_household_income_pct_fpl
kind: derived
type: rate
scope: person-month
program: Medicaid
meaning: The monthly household income an electronic data source match (IEVS, the Federal Data Services Hub, The Work Number) reports for the person's Medical Assistance household, as a fraction of the federal poverty guideline for that household's size, for comparison with the attested figure.
precision: "The data source reports gross income; the comparison of 42 CFR 435.952 (S864, S867) takes it as reported. The guideline beyond the table's last row is read as ma_magi_household_income_pct_fpl reads it (lookup_extended). Coverage pass 4, C4-14 (2026-11-23): the sum is over the members whose income counts (ma_magi_household_income_members, CO-4558), as the attested figure's is (CO-503; 8.100.4.C.1.f, 42 CFR 435.603(d)(2)), so 8.100.4.C.2 compares like with like; before, a child below the filing threshold had her data-source income added to the data figure though the attested figure leaves it out (a parent attesting 2,000 and a son of 16 earning 600: 2,600 against 2,000, not compatible)."
derived: ["/", [sum, ma_magi_household_income_members, [of, [P], electronic_data_source_monthly_gross_income]], ["/", [lookup_extended, federal_poverty_guideline_annual_table, ma_magi_household_size, federal_poverty_guideline_annual_each_additional], 12]]
sources: [S864, S164, S167]
implemented: engine
tags: [verification, income, ma]
rationale: "No existing item in the volume carries this fact; the phase-9 verification chapter (design amended 2026-11-21) needs it, and it is program-neutral so every program's verification rules read the same value. Dual-entry audit 2.4: the ratio is computed from each MAGI household member's data-source income (CO-1589) and the guideline for the MAGI household size, so the match is stated once, per person."
tests:
  - {id: CO-1344-T1, title: "Two members, 3,210 reported, household of two", month: "2026-10", as_of: "2026-10-01", parameters: {federal_poverty_guideline_annual_table: {"2": 24000}}, given: {ma_magi_household_members: [p1, p2], ma_magi_household_income_members: [p1, p2], ma_magi_household_size: 2, electronic_data_source_monthly_gross_income: 2000}, others: {p2: {electronic_data_source_monthly_gross_income: 1560}}, expect: 1.78}
  - {id: CO-1344-T2, month: "2026-11", as_of: "2026-11-10", title: "Coverage pass 4, C4-14: a parent whose data source shows 2,000 and her son of 16 below the filing threshold whose data source shows 600; household of two, the son's income does not count (C.1.f.i): 2,000 / (21,640 / 12 = 1,803.33) = 110.9%, not 2,600 / 1,803.33 = 144.2%", given: {ma_magi_household_income_members: [p1], ma_magi_household_size: 2, electronic_data_source_monthly_gross_income: 2000}, others: {p2: {electronic_data_source_monthly_gross_income: 600}}, expect: 1.1090573012939002}
