id: CO-5327
name: "Medicaid: the person's equity interest in the home in the month"
identifier: ma_home_equity_interest_in_month
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The person's ownership interest in the home valued in the month: the equity (value less what is owed) of each home holdings record (CO-5300) the person holds, at the person's share (10 CCR 2505-10 8.100.5.M.2.a.ii, S4665: \"The individual’s ownership interest in the home must have an equity value that\"; M.3.f: \"an individual’s home if the individual’s equity interest in the home exceeds the equity value limit\")."
precision: "Resource records, Medicaid track H1: a couple's home owned by both spouses is one joint holding stated on each spouse's list with each spouse's share (holding_id, co_owners spouse), so each spouse's interest is that share and the couple's figures count the home once (\"Only one principal place of residence is excluded for a single individual or a married couple\", M.2.a.i, S4665). Read by ma_home_equity_disqualifies (CO-650) at the determination month, ma_home_equity_counted_only_by_beneficiary_deed (CO-5205), and ma_ssi_countable_resources_in_month (CO-5322) when the home is countable. Unknown when a home record does not state its value. Coverage pass 4, non-MAGI N4-8 (20 CFR 416.1207(a), S4501: \"Resources determinations are made as of the first moment of the month\"): a holding the person disposed of is still held at the first moment of the month of its disposed_date and of every month before it, so it is read in those months and left out from the month after (it is then a transfer, ma_uncompensated_transfers_in_lookback, CO-5325); it was left out of every month, the month of disposal included."
derived: [sum_receipts, holdings, [all, ["=", [lookup, ma_ssi_holding_treatment_table, [receipt, kind]], home_rules], [received_in, [month]], [any, [unknown, [receipt, disposed_date]], [">=", [month_of, [receipt, disposed_date]], [month]]]], ["*", [otherwise, [receipt, share], 1], ["-", [receipt, value], [receipt, amount_owed]]]]
sources: [S4665, S369, S3403, S4501]
implemented: engine
tags: [ma, non_magi, ltc, resources]
rationale: "Resource records, step H1 (Medicaid): the home equity a couple stated on each spouse (home_equity, CO-826, twelve stored households) is one joint holding, so the equity limit (1396p(f): the individual's equity interest) and a countable home read each spouse's share, never the home twice."
tests:
  # Hand-computed from 8.100.5.M.2.a.ii (S4665).
  - {id: CO-5327-T1, month: "2026-10", as_of: "2026-10-01", title: "a 300,000 home owing 60,000: 240,000", given: {holdings: [{kind: home, value: 300000, amount_owed: 60000}]}, expect: 240000}
  - {id: CO-5327-T2, month: "2026-10", as_of: "2026-10-01", title: "a 240,000 home owned with the spouse, half each: 120,000", given: {holdings: [{kind: home, value: 240000, amount_owed: 0, share: 0.5, co_owners: spouse, holding_id: home}]}, expect: 120000}
  - {id: CO-5327-T3, month: "2026-10", as_of: "2026-10-01", title: "no home: 0", given: {holdings: [{kind: bank_account, value: 100}]}, expect: 0}
