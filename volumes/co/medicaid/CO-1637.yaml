id: CO-1637
name: "Medical Assistance: asset transfers verification is pending"
identifier: ma_asset_transfers_verification_is_pending
kind: derived
type: yes/no
scope: person-month
program: Medicaid
role: outcome
meaning: Whether a long-term care applicant must document transfers of assets on or after the 60-month look-back date and has not.
precision: "The look-back is 60 months before the date of application (8.100.7.F.2.a, ma_transfer_lookback_months); the documentation is either the transfers made or a declaration that none was made without fair consideration (OQ-379). Coverage review NM-13: a person determined eligible under the Working Adults Buy-In owes no B.2.a documents (§ 8.100.7.B.2.c; ma_owes_long_term_care_asset_disclosure, CO-4631)."
derived: [all, ma_owes_long_term_care_asset_disclosure, [not, asset_transfer_verification_document_received]]
sources: [S1741, S1742, S3408]
implemented: engine
tags: [verification, ma, ltc]
rationale: "Review K-3: the long-term care documentation 8.100.7.A.2 requires had no item; the Medical Assistance count sums this one."
tests:
  - {id: CO-1637-T1, month: "2026-10", as_of: "2026-10-01", given: {ma_owes_long_term_care_asset_disclosure: true, asset_transfer_verification_document_received: false}, expect: true}
  - {id: CO-1637-T2, month: "2026-10", as_of: "2026-10-01", given: {ma_owes_long_term_care_asset_disclosure: true, asset_transfer_verification_document_received: true}, expect: false}
