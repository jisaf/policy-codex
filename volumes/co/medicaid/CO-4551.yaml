sources: [S3352, S3353, S3354, S2970, S1619]
implemented: engine
tags: [ma, magi, income, immigration]
open: [OQ-812]
rationale: "Coverage pass 4, C4-10: sponsorship is read from the sponsor edge or the fact, with no default for a non-citizen the deeming can reach. Coverage review F-03 (2026-11-22): § 8.100.3.K.1 counts a sponsor's and the sponsor's spouse's income to the sponsored non-citizen, and no Medicaid item read is_sponsored_non_citizen (CO-1573) or the sponsor relationship, so a lawful permanent resident past the five-year bar was tested on her household's income alone. SNAP (snap_sponsor_income_after_reductions), Colorado Works (cw_sponsor_deemed_income, CO-2365) and Adult Financial (af_deemed_sponsor_income, CO-2386) each deem under their own rules, with allowances K.1 does not have; none serves Medicaid."
