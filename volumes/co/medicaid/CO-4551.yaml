id: CO-4551
name: "Medicaid: sponsor income deemed to a sponsored non-citizen"
identifier: ma_sponsor_deemed_income
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The income of this sponsored non-citizen's sponsors and of the sponsors' spouses that counts to the person for the month under 10 CCR 2505-10 § 8.100.3.K.1 and 8 U.S.C. 1631(a)-(b): each such person's own MAGI-based income (ma_person_magi_income), for a person who is not a citizen or national, whose sponsor executed an affidavit of support (is_sponsored_non_citizen), who has fewer than federal_qualifying_quarters_threshold qualifying quarters, and who is not a pregnant woman or a child (K.1.a); none when 8 U.S.C. 1631(f)'s battered spouse and child rule applies (ma_sponsor_deeming_battery_exception_applies); and, for the federal_sponsor_deeming_exception_months after an indigence determination (8 U.S.C. 1631(e)), no more than the support the sponsors actually provide."
precision: "K.1 counts the income \"to the sponsored alien\": it is added to this person's own MAGI household income (ma_magi_household_income, CO-503) for this person's own determination, not to the other members' households. A sponsor or sponsor's spouse who is already a member of this person's MAGI household (a sponsoring spouse living in the home) is left out, since that income already counts. The income counted is each one's MAGI-based income for the month, the measure § 8.100.4.C applies to the household; K.1 states no allowance or deduction for the sponsor. \"A child\" (K.1.a) is read as the Children's group's age, under 19 through the birthday month (ma_is_under_child_age_or_turns_nineteen_this_month, CO-564), and \"a pregnant woman\" as a woman pregnant in the month (ma_is_pregnant_in_month, CO-3601). qualifying_quarters (CO-004) is SSA's credited total, including a spouse's or parent's quarters; quarters in which the person received a federal means-tested benefit after 1996 are the supplier's to leave out (1631(b)(2)(B)). A person whose sponsorship is not stated is read as not sponsored. The sponsors are persons of the case (sponsors, CO-2713; sponsor_spouses_not_cosigning, CO-2714); a sponsor who is not declared contributes nothing."
derived: [case, [[not, [all, [otherwise, is_sponsored_non_citizen, false], [not, is_us_citizen_or_national]]], 0], [[any, [">=", qualifying_quarters, federal_qualifying_quarters_threshold], ma_is_pregnant_in_month, ma_is_under_child_age_or_turns_nineteen_this_month, ma_sponsor_deeming_battery_exception_applies], 0], [[otherwise, [all, [">=", [month], [month_of, ma_sponsor_indigence_determination_date]], ["<", [month], [months_after, federal_sponsor_deeming_exception_months, [month_of, ma_sponsor_indigence_determination_date]]]], false], [min, [sum, [filter, [persons], [all, [any, [in_group, [P], sponsors], [in_group, [P], sponsor_spouses_not_cosigning]], [not, [in_group, [P], ma_magi_household_members]]]], [of, [P], ma_person_magi_income]], [otherwise, support_received_from_sponsor, 0]]], [else, [sum, [filter, [persons], [all, [any, [in_group, [P], sponsors], [in_group, [P], sponsor_spouses_not_cosigning]], [not, [in_group, [P], ma_magi_household_members]]]], [of, [P], ma_person_magi_income]]]]
sources: [S3352, S3353, S3354, S2970]
implemented: engine
tags: [ma, magi, income, immigration]
open: [OQ-812]
rationale: "Coverage review F-03 (2026-11-22): § 8.100.3.K.1 counts a sponsor's and the sponsor's spouse's income to the sponsored non-citizen, and no Medicaid item read is_sponsored_non_citizen (CO-1573) or the sponsor relationship, so a lawful permanent resident past the five-year bar was tested on her household's income alone. SNAP (snap_sponsor_income_after_reductions), Colorado Works (cw_sponsor_deemed_income, CO-2365) and Adult Financial (af_deemed_sponsor_income, CO-2386) each deem under their own rules, with allowances K.1 does not have; none serves Medicaid."
