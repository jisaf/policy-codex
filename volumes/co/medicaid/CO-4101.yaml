id: CO-4101
name: "Medicaid: month is before any MAGI coverage can begin"
identifier: ma_month_is_before_coverage_period
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether the month is one in which the person cannot have MAGI Medical Assistance coverage from the application being determined: a month before the month of the person's birth, or a month before the month of application (ma_application_date) that is not a retroactive coverage month - no retroactive coverage was requested (ma_retroactive_coverage_requested, CO-4100), or the month is before the first month of the retroactive period (ma_retroactive_coverage_start_month, CO-557) (10 CCR 2505-10 § 8.100.3.E.1-2; 42 CFR 435.915(a); 42 U.S.C. 1396a(a)(34) as Pub. L. 119-21 sec. 71112 amended it). A month before the widest window the application date allows (three months before an application made before ma_retroactive_coverage_change_date, then the longer of the expansion adult's and everyone else's window) is before coverage whatever the window's length; a month inside every window the date allows is not; a month between the two is decided by the window's length, unknown where that is not known. A month inside the window is a retroactive month, and whether the person is covered in it is decided by that month's own facts."
precision: "Coverage pass 7, C7-01 and C7-08 (2026-11-24): the window's first month (CO-557) no longer reads a supplied date the person became eligible (ma_eligibility_start_date, retired): 42 CFR 435.915(a)(2) (S218) covers a retroactive month in which the person 'Would have been eligible for Medicaid at the time he received the services', and 42 U.S.C. 1396a(a)(34) as amended (S1706) one in which the person 'was (or upon application would have been) eligible for such assistance at the time such care and services were furnished', so E.1's 'as of the date the person became eligible ... whichever is later' is the first month whose own facts make the person eligible, which ma_magi_eligibility_status (CO-554) decides month by month. And an unknown window length no longer reads as covered: before, with the start date not stated (CO-557 unknown) every requested month was read as covered (RETRO-NOSTART: application 2026-11-02, April to July eligible; by hand before the August to October window), and from 2027 a month the shortened window excludes was covered where the category of the application month, and so the window's length (CO-2472), was not known (RETRO-2027-UNKNOWN: application 2027-01-15, September and October 2026 eligible; by hand before any window, November unknown). Coverage pass 7, C7-10: a date of birth not stated leaves the month unknown (was: not before birth; decision 4 of 2026-11-23). Coverage pass 6, C6-05(c) (2026-11-24): with no application date stated, a month before the determination month cannot be determined (whether the application reaches it is not known; decision 4 of 2026-11-23), and the determination month and later months are not before coverage; before, every past month was read as covered, as a screening does, so CO-226 at $1,000 without an application date was eligible in March 2026 (75.2%). A month a continuous eligibility or pregnancy coverage period covers is never before the application without being a requested retroactive month, so the order in ma_magi_eligibility_status (CO-554), which tests this first, takes nothing from those periods. The retroactive period's length is the one CO-557 states (three months for an application before 2027; then one for an expansion adult and two for anyone else)."
derived: [any, ["<", [month], [month_of, date_of_birth]], [case, [[unknown, ma_application_date], [case, [[">=", [month], [det_month]], false], [else, ["<", [month], [month_of, ma_application_date]]]]], [else, [all, ["<", [month], [month_of, ma_application_date]], [any, [not, [otherwise, ma_retroactive_coverage_requested, false]], ["<", [month], [months_before, [case, [["<", ma_application_date, ma_retroactive_coverage_change_date], ma_retroactive_coverage_months], [else, [max, ma_retroactive_coverage_months_expansion_adult, ma_retroactive_coverage_months_other_after_change]]], [month_of, ma_application_date]]], [all, ["<", [month], [months_before, [case, [["<", ma_application_date, ma_retroactive_coverage_change_date], ma_retroactive_coverage_months], [else, [min, ma_retroactive_coverage_months_expansion_adult, ma_retroactive_coverage_months_other_after_change]]], [month_of, ma_application_date]]], ["<", [month], ma_retroactive_coverage_start_month]]]]]]]
sources: [S1503, S2411, S217, S218, S1706]
implemented: engine
tags: [ma, magi]
rationale: "Final verification pass 2, P3-3 (docs/reviews/final2-medicaid-chp.md): the month-level MAGI outcomes answered 'meets the criteria in month m' for any month, so a stored household read pregnant / eligible in a month before the retroactive window, and a newborn read needy_newborn / eligible before his birth. ma_magi_eligibility_status (CO-554) reads this item first, as ma_oap_health_care_status (CO-1156) reports ineligible_before_application. No existing item states which months an application can cover: CO-557 states only the first month of the retroactive window."
tests:
  - {id: CO-4101-T1, as_of: "2026-09-20", month: "2026-05", title: "Retroactive coverage requested, window June to August: May is before it", given: {date_of_birth: "1996-08-14", ma_application_date: "2026-09-15", ma_retroactive_coverage_requested: true, ma_retroactive_coverage_start_month: "2026-06"}, expect: true}
  - {id: CO-4101-T2, as_of: "2026-09-20", month: "2026-06", title: "Retroactive coverage requested: June is a retroactive month", given: {date_of_birth: "1996-08-14", ma_application_date: "2026-09-15", ma_retroactive_coverage_requested: true, ma_retroactive_coverage_start_month: "2026-06"}, expect: false}
  - {id: CO-4101-T3, as_of: "2026-09-20", month: "2026-08", title: "No retroactive coverage requested: August, before the application month, cannot be covered", given: {date_of_birth: "1996-08-14", ma_application_date: "2026-09-15", ma_retroactive_coverage_requested: false}, expect: true}
  - {id: CO-4101-T4, as_of: "2026-09-20", month: "2026-09", title: "The application month", given: {date_of_birth: "1996-08-14", ma_application_date: "2026-09-15", ma_retroactive_coverage_requested: false}, expect: false}
  - {id: CO-4101-T5, as_of: "2026-09-20", month: "2026-07", title: "Born 2026-08-10: July is before his birth, even in a requested retroactive month", given: {date_of_birth: "2026-08-10", ma_application_date: "2026-09-15", ma_retroactive_coverage_requested: true, ma_retroactive_coverage_start_month: "2026-06"}, expect: true}
  - {id: CO-4101-T6, as_of: "2026-09-20", month: "2026-05", title: "C6-05(c) (restated; was false): no application date stated: May 2026, before the determination month, cannot be determined", given: {date_of_birth: "1996-08-14"}, expect: unknown}
  - {id: CO-4101-T7, month: "2026-03", as_of: "2026-11-10", title: "C6-05(c): no application date stated: March 2026, before the determination month, cannot be determined (was false: a covered month)", given: {date_of_birth: "1990-01-01"}, expect: unknown}
  - {id: CO-4101-T8, month: "2026-11", as_of: "2026-11-10", title: "C6-05(c): no application date stated: the determination month is not before coverage", given: {date_of_birth: "1990-01-01"}, expect: false}
  - {id: CO-4101-T9, month: "2026-12", as_of: "2026-11-10", title: "C6-05(c): no application date stated: a later month is not before coverage", given: {date_of_birth: "1990-01-01"}, expect: false}
  # Coverage pass 7, C7-01 (RETRO-NOSTART): application 2026-11-02 with a retroactive request, before ma_retroactive_coverage_change_date (2027-01-01): the window is ma_retroactive_coverage_months = 3 months, 2026-11 - 3 = 2026-08 (August to October). No date the person became eligible is read (C7-08).
  - {id: CO-4101-T10, as_of: "2026-11-10", month: "2026-07", title: "C7-01 (RETRO-NOSTART; was false, a covered month): July 2026 < 2026-08, the first month of the widest window the date allows: before coverage", given: {date_of_birth: "1990-01-01", ma_application_date: "2026-11-02", ma_retroactive_coverage_requested: true}, expect: true}
  - {id: CO-4101-T11, as_of: "2026-11-10", month: "2026-04", title: "C7-01 (RETRO-NOSTART): April 2026 < 2026-08: before coverage (was false)", given: {date_of_birth: "1990-01-01", ma_application_date: "2026-11-02", ma_retroactive_coverage_requested: true}, expect: true}
  - {id: CO-4101-T12, as_of: "2026-11-10", month: "2026-08", title: "C7-01 (RETRO-NOSTART): August 2026 is the window's first month (2026-11 - 3): a retroactive month, decided by its own facts", given: {date_of_birth: "1990-01-01", ma_application_date: "2026-11-02", ma_retroactive_coverage_requested: true}, expect: false}
  # C7-01 (RETRO-2027-UNKNOWN): application 2027-01-15 (on or after 2027-01-01) with a request; the application month's category not known, so neither is the window's length (1 for an expansion adult, 2 for anyone else, CO-2472). Widest: max(1, 2) = 2, 2027-01 - 2 = 2026-11; narrowest: min(1, 2) = 1, 2027-01 - 1 = 2026-12.
  - {id: CO-4101-T13, as_of: "2027-01-20", month: "2026-10", title: "C7-01 (RETRO-2027-UNKNOWN; was false): October 2026 < 2026-11, before every window the date allows: before coverage", given: {date_of_birth: "1990-01-01", ma_application_date: "2027-01-15", ma_retroactive_coverage_requested: true}, expect: true}
  - {id: CO-4101-T14, as_of: "2027-01-20", month: "2026-11", title: "C7-01 (RETRO-2027-UNKNOWN; was false): November 2026 is in a two-month window and not in a one-month window: the category of January 2027 not known, it cannot be determined", given: {date_of_birth: "1990-01-01", ma_application_date: "2027-01-15", ma_retroactive_coverage_requested: true}, expect: unknown}
  - {id: CO-4101-T15, as_of: "2027-01-20", month: "2026-12", title: "C7-01 (RETRO-2027-UNKNOWN): December 2026 is in every window the date allows (2026-12 >= 2026-12): not before coverage, whatever the category", given: {date_of_birth: "1990-01-01", ma_application_date: "2027-01-15", ma_retroactive_coverage_requested: true}, expect: false}
  # C7-01 (CO-73 with a request): application 2027-03-02. An expansion adult: window 1 month, 2027-03 - 1 = 2027-02 (1396a(a)(34)(A)); anyone else: 2 months, 2027-03 - 2 = 2027-01 (B).
  - {id: CO-4101-T16, as_of: "2027-03-10", month: "2027-01", title: "C7-01: an expansion adult applying 2027-03-02 with a request: January 2027 < 2027-02, the window's first month: before coverage (was false with no start date stated)", given: {date_of_birth: "1990-01-01", ma_application_date: "2027-03-02", ma_retroactive_coverage_requested: true, ma_magi_category: {"2027-03": adult}}, expect: true}
  - {id: CO-4101-T17, as_of: "2027-03-10", month: "2027-01", title: "C7-01: a child applying 2027-03-02 with a request: window 2 months from 2027-01: January is a retroactive month", given: {date_of_birth: "2021-06-01", ma_application_date: "2027-03-02", ma_retroactive_coverage_requested: true, ma_magi_category: {"2027-03": child}}, expect: false}
  - {id: CO-4101-T18, as_of: "2027-03-10", month: "2026-12", title: "C7-01: the same child: December 2026 < 2027-01: before coverage (was false)", given: {date_of_birth: "2021-06-01", ma_application_date: "2027-03-02", ma_retroactive_coverage_requested: true, ma_magi_category: {"2027-03": child}}, expect: true}
  - {id: CO-4101-T19, as_of: "2026-11-10", month: "2026-11", title: "C7-10: the date of birth not stated: whether the month is before the person's birth cannot be determined (was false; decision 4)", given: {ma_application_date: "2026-11-02", ma_retroactive_coverage_requested: false}, expect: unknown}
