id: CO-3626
name: "Medicaid: SSI-method couple"
identifier: ma_ssi_couple_members
kind: derived
type: group of persons
scope: person
program: Medicaid
meaning: "The person and, where the person lives with a spouse (or a person held out as a spouse) and neither is excluded from the other's SSI household, that spouse: the persons whose income and resources an SSI-related, Old Age Pension or Medicare Savings Program determination counts together (10 CCR 2505-10 § 8.100.5.H.1.a, 8.100.6.L.3). An institutionalized spouse in the institution is counted alone from the month of admission, because no income of the community spouse is deemed to that spouse (42 U.S.C. 1396r-5(b)(1); § 8.100.7.C.1, C.2.c); the community spouse keeps the couple until the month after admission (§ 8.100.7.C.2.b)."
precision: "The same group ma_ssi_household_size (CO-604) counts and the SSI countable income items sum over. The walk is directional (docs/operators.md, reachable): the edge from an institutionalized spouse in the institution (ma_is_institutionalized_spouse_in_institution, CO-5200) to the community spouse is not crossed, while the edge from the community spouse to the newly admitted spouse is crossed through the admission month. So in the admission month the community spouse's couple is both spouses and the institutionalized spouse's is the person alone; from the month after, each is alone (ma_excluded_from_ssi_household, CO-661)."
derived: [reachable, [spouse, holds_out_as_spouse_with], [all, [not, ma_excluded_from_ssi_household], [not, [of, [P], ma_excluded_from_ssi_household]], [not, ma_is_institutionalized_spouse_in_institution]]]
sources: [S1747, S1759, S3750]
implemented: engine
tags: [ma, non_magi, household]
rationale: "Final verification F-6 and V-3 (docs/reviews/final-medicaid-chp.md, docs/reviews/final-verification.md): the COLA disregard and the verification of a spouse's income and resources read the couple as a group; the group was written inline in CO-604 and CO-606 only. Coverage pass 3 C3-1 and the probe hand-check of CO-395: the income sums now read this group (they had filtered on resides_in_medical_institution), and the group leaves out the community spouse for an institutionalized spouse in the institution (S3750)."
