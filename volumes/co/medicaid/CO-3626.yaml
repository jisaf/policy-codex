  - {id: CO-3626-T4, month: "2026-12", as_of: "2026-12-01", title: "From the month after admission each spouse is alone", given: {ma_excluded_from_ssi_household: false, ma_is_institutionalized_spouse_in_institution: false}, others: {p2: {ma_excluded_from_ssi_household: true, ma_is_institutionalized_spouse_in_institution: true}}, relationships: [[spouse, p2]], expect: [p1]}
