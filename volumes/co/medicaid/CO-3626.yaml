meaning: "The person and, where the person lives with a spouse (or a person held out as a spouse) and neither is excluded from the other's SSI household, that spouse: the persons whose income and resources an SSI-related, Old Age Pension or Medicare Savings Program determination counts together (10 CCR 2505-10 § 8.100.5.H.1.a, 8.100.6.L.3)."
precision: "The same group ma_ssi_household_size (CO-604) counts and the SSI countable income items sum over."
derived: [reachable, [spouse, holds_out_as_spouse_with], [all, [not, ma_excluded_from_ssi_household], [not, [of, [P], ma_excluded_from_ssi_household]]]]
