  - {id: CO-3626-T2, month: "2026-11", as_of: "2026-11-20", title: "C3-1: the institutionalized spouse in the admission month is counted alone", given: {ma_excluded_from_ssi_household: false, ma_is_institutionalized_spouse_in_institution: true}, others: {p2: {ma_excluded_from_ssi_household: false, ma_is_institutionalized_spouse_in_institution: false}}, relationships: [[spouse, p2]], expect: [p1]}
