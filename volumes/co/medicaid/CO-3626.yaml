implemented: engine
tags: [ma, non_magi, household]
rationale: "Final verification F-6 and V-3 (docs/reviews/final-medicaid-chp.md, docs/reviews/final-verification.md): the COLA disregard and the verification of a spouse's income and resources read the couple as a group; the group was written inline in CO-604 and CO-606 only."
