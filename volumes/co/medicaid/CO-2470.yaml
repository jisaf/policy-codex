id: CO-2470
name: "SSI method: excluded unearned income"
identifier: ma_ssi_excluded_unearned_income
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The part of the person's gross unearned income for the month that the SSI method does not count for the SSI-related Medical Assistance groups: income tax refunds and loan proceeds, which are not income (20 CFR 416.1103(d), (f)), grants and scholarships for educational expenses (416.1124(c)(3)), payments other federal laws exclude, home energy assistance and major disaster assistance among them (416.1124(b), (c)(5)); and the receipts 10 CCR 2505-10 § 8.100.5.F.6 exempts for the aged, blind and disabled categories: retroactive lump sums of SSI or Title II benefits (F.6.c), payments for providing foster care (F.6.l), and income set aside under a plan for self-support (F.6.q; 416.1124(c)(13)); and the portion of a VA pension for Aid and Attendance or Unusual Medical Expenses, which § 8.100.5.K says \"shall not be considered as income when determining eligibility\" (F.5.j.vi)."
precision: "The sum of the neutral receipt facts the program's list names (each part of the gross income facts, so the program's countable income subtracts it); an unstated receipt is 0. Coverage review NM-6, NM-7, NM-23: a lump sum (lump_sum_received) is part of the unearned income facts and so is counted in the month received (§ 8.100.5.F.5.c, f), except the retroactive SSI and Title II parts F.6.c exempts; the retroactive public assistance part of retroactive_ssi_or_public_assistance_lump_sum_received is exempt too (F.6.y exempts SSI, OAP-A and TANF cash, and the SSI part is F.6.c's). The nine-month resource exemption of F.6.c for the unspent retroactive payment is not separated from liquid_resources_value (OQ-822). Coverage pass 2, N2-1: the A&A/UME portion (va_aid_and_attendance_amount, CO-837, when receives_va_aid_and_attendance, CO-836) is part of pension_income as stated, so it is subtracted here for every SSI-method sum that reads this item (CO-663, CO-1715, CO-4201, CO-4634); the long-term care gross income (CO-641) subtracts it itself and does not read this item. Using it as patient payment in a State Veterans Home (K.2, CO-4103) is a post-eligibility rule and does not change the eligibility exclusion."
derived: [+, [+, [+, [+, [+, [otherwise, educational_assistance_received, 0], [otherwise, loan_proceeds_received, 0]], [otherwise, energy_assistance_received, 0]], [otherwise, tax_refunds_and_credits_received, 0]], [otherwise, federally_excluded_payments_received, 0]], [otherwise, pass_set_aside_income, 0], [otherwise, retroactive_social_security_lump_sum_received, 0], [otherwise, retroactive_ssi_or_public_assistance_lump_sum_received, 0], [otherwise, foster_care_provider_payments_received, 0], [case, [[otherwise, receives_va_aid_and_attendance, false], [otherwise, va_aid_and_attendance_amount, 0]], [else, 0]]]
sources: [S308, S310, S2209, S3404, S2900]
implemented: engine
tags: [non_magi, income]
rationale: "Same-word audit SW-28, dual-entry audit 3.24 and 3.25: each program's excluded income and allowable business costs were program-prefixed supplied amounts, so one receipt or one set of business costs was entered once per program. The neutral fact describes the receipt or the cost; each program's exclusion or allowable cost is its own derived item citing its list (product-owner decision, convention rule 13). The ID and identifier are kept; the amount is now derived. Coverage pass 2, N2-1: the VA Aid and Attendance and Unusual Medical Expenses portion was counted in every SSI-method test (CO-663 reads pension_income whole), although § 8.100.5.K (S2900) excludes it when determining eligibility; it is added here because the four SSI-method sums already subtract this item."
