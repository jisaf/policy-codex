id: CO-2470
name: "SSI method: excluded unearned income"
identifier: ma_ssi_excluded_unearned_income
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The part of the person's gross unearned income for the month that the SSI method does not count for the SSI-related Medical Assistance groups: income tax refunds and loan proceeds, which are not income (20 CFR 416.1103(d), (f)), grants and scholarships for educational expenses (416.1124(c)(3)), payments other federal laws exclude, home energy assistance and major disaster assistance among them (416.1124(b), (c)(5)); and the receipts 10 CCR 2505-10 § 8.100.5.F.6 exempts for the aged, blind and disabled categories: retroactive lump sums of SSI or Title II benefits (F.6.c), payments for providing foster care (F.6.l), and income set aside under a plan for self-support (F.6.q; 416.1124(c)(13)); and the portion of a VA pension for Aid and Attendance or Unusual Medical Expenses, which § 8.100.5.K says \"shall not be considered as income when determining eligibility\" (F.5.j.vi); assistance from other agencies and organizations (F.6.j: county General Assistance and emergency assistance, and need-based cash from charitable organizations), Workforce Investment Act training allowances and youth employment project payments (F.6.o, p), and AmeriCorps payments (416.1112(c)(10), 416.1124(c)(23)); and, for rents, the ordinary and necessary expenses of the rental property (416.1121(d); § 8.100.5.J.1 for an exempt home), so rents count net."
precision: "The sum of the neutral receipt facts the program's list names (each part of the gross income facts, so the program's countable income subtracts it); an unstated receipt is 0. Coverage review NM-6, NM-7, NM-23: a lump sum (lump_sum_received) is part of the unearned income facts and so is counted in the month received (§ 8.100.5.F.5.c, f), except the retroactive SSI and Title II parts F.6.c exempts; the retroactive public assistance part of retroactive_ssi_or_public_assistance_lump_sum_received is exempt too (F.6.y exempts SSI, OAP-A and TANF cash, and the SSI part is F.6.c's). The nine-month resource exemption of F.6.c for the unspent retroactive payment is not separated from liquid_resources_value (OQ-822). Coverage pass 2, N2-1: the A&A/UME portion (va_aid_and_attendance_amount, CO-837, when receives_va_aid_and_attendance, CO-836) is part of pension_income as stated, so it is subtracted here for every SSI-method sum that reads this item (CO-663, CO-1715, CO-4201, CO-4634); the long-term care gross income (CO-641) subtracts it itself and does not read this item. Using it as patient payment in a State Veterans Home (K.2, CO-4103) is a post-eligibility rule and does not change the eligibility exclusion. Coverage pass 2 (first pass NM-23 j, o, p, y, NM-26 (c)(10), NM-27 J.1, deferred): general_or_emergency_assistance_received (CO-3812) and charitable_need_based_cash_received (CO-4308) carry F.6.j (and F.6.y's General Assistance); workforce_program_payments_received (CO-3815) less its non-WIOA part vocational_training_allowance_received (CO-4300) carries F.6.o and p (WIA is now WIOA; YEDPA payments are in the same fact); americorps_payments_received (CO-4016). Rents count net of rental_property_expenses_paid (CO-4458), the expense never more than the rents stated as rental_income_received (CO-4457), so a rental loss does not offset other income; the expenses are 416.1121(d)'s, which take in J.1's three for an exempt home (OQ-867). The long-term care gross income (CO-641) does not read this item (§ 8.100.7.A.1) and counts gross rents."
