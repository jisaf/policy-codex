sources: [S308, S310, S2209, S3404, S2900, S3617, S3618, S3619, S3620]
implemented: engine
tags: [non_magi, income]
open: [OQ-867]
rationale: "Same-word audit SW-28, dual-entry audit 3.24 and 3.25: each program's excluded income and allowable business costs were program-prefixed supplied amounts, so one receipt or one set of business costs was entered once per program. The neutral fact describes the receipt or the cost; each program's exclusion or allowable cost is its own derived item citing its list (product-owner decision, convention rule 13). The ID and identifier are kept; the amount is now derived. Coverage pass 2, N2-1: the VA Aid and Attendance and Unusual Medical Expenses portion was counted in every SSI-method test (CO-663 reads pension_income whole), although § 8.100.5.K (S2900) excludes it when determining eligibility; it is added here because the four SSI-method sums already subtract this item."
