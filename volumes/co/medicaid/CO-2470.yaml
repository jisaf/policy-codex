id: CO-2470
name: "SSI method: excluded unearned income"
identifier: ma_ssi_excluded_unearned_income
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The part of the person's gross unearned income for the month that the SSI method does not count for the SSI-related Medical Assistance groups: income tax refunds and loan proceeds, which are not income (20 CFR 416.1103(d), (f)), grants and scholarships for educational expenses (416.1124(c)(3)), and payments other federal laws exclude, home energy assistance and major disaster assistance among them (416.1124(b), (c)(5))."
precision: "The sum of the neutral receipt facts the program's list names (each part of the gross income facts, so the program's countable income subtracts it); an unstated receipt is 0."
derived: [+, [+, [+, [+, [otherwise, educational_assistance_received, 0], [otherwise, loan_proceeds_received, 0]], [otherwise, energy_assistance_received, 0]], [otherwise, tax_refunds_and_credits_received, 0]], [otherwise, federally_excluded_payments_received, 0]]
sources: [S308, S310, S2209]
implemented: engine
tags: [non_magi, income]
rationale: "Same-word audit SW-28, dual-entry audit 3.24 and 3.25: each program's excluded income and allowable business costs were program-prefixed supplied amounts, so one receipt or one set of business costs was entered once per program. The neutral fact describes the receipt or the cost; each program's exclusion or allowable cost is its own derived item citing its list (product-owner decision, convention rule 13). The ID and identifier are kept; the amount is now derived."
tests:
  - {id: CO-2470-T1, month: "2026-10", as_of: "2026-10-01", given: {}, expect: 0}
  - {id: CO-2470-T2, month: "2026-10", as_of: "2026-10-01", given: {educational_assistance_received: 300, federally_excluded_payments_received: 50}, expect: 350}
