id: CO-618
name: "Medicaid: is Working Adults with Disabilities Buy-In eligible"
identifier: ma_wawd_eligible
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: Whether the person is eligible for the Medicaid Buy-In Program for Working Adults with Disabilities - at least ma_wawd_min_age, employed, disabled, and with countable income at or below ma_wawd_income_limit_pct (CO-242) of the federal poverty guideline for ma_wawd_household_size (CO-3030) - per 10 CCR 2505-10 8.100.6.P.1.
precision: "'Only the applicant's income will be considered' (8.100.6.P.1.b), and 8.100.5.H.1's carve-out ('the applicant's spouse's income does not count toward the applicant') means this item computes the applicant's own earned/unearned income and disregards without combining a living-together spouse's income, unlike ma_ssi_countable_income (CO-607); it applies the same $65-plus-one-half and $20 disregard structure to the applicant's own income only. Resources are not counted (8.100.6.P.1.c), so no resource test is included. Status reads ma_meets_status_for_cover_all_coloradans_categories (CO-1174), since § 8.100.3.G.1.g.ix.1.b lists both Buy-In programs among the categories Cover All Coloradans reaches. The income is ma_wawd_countable_income (CO-1715), which now counts self-employment; employment reads ma_has_earned_income (CO-6200, pay for work or business receipts in the month, from the earnings records; has_earned_income, CO-1356, before the records E1 integration) instead of the retired is_employed (CO-805), which a case could state true with no earnings. Time audit T-1 (2026-11-23): the minimum age reads ma_age_on_last_day_of_month (CO-5402), so a person who reaches it during the month meets it for the month (§ 8.100.5.C.1, S3900); it read age (CO-300), the age on the determination date, in every month."
derived: [all, ma_meets_residency_in_month, ma_meets_status_for_cover_all_coloradans_categories_in_month, [">=", ma_age_on_last_day_of_month, ma_wawd_min_age], ma_has_earned_income, ma_wawd_is_disabled, ["<=", ma_wawd_countable_income, ["*", ["/", [lookup, federal_poverty_guideline_annual_table, ma_wawd_household_size], 12], ma_wawd_income_limit_pct]]]
sources: [S3900, S607, S317]
implemented: engine
tags: [ma, non_magi, buy_in, income, disability]
rationale: "No existing item states the WAwD eligibility test. ma_buy_in_category (CO-622) needs it. ma_wawd_premium (CO-619) reuses the same applicant-only income computation this item makes inline, since both read the identical 8.100.6.P.1.b definition of countable income for this program. Conjoins is_colorado_resident (CO-505) and ma_meets_citizenship_requirement (CO-509) as CO-611 does, per the phase-4 review's C-19 finding: § 8.100.6.P.1 does not restate them because § 8.100.3/8.100.5.B carry them for the whole of 8.100. History moved from the precision note (HCPF review S-14): Phase 7 fix round (S-2): status reads ma_meets_status_for_cover_all_coloradans_categories (CO-1174), since § 8.100.3.G.1.g.ix.1.b lists both Buy-In programs among the categories Cover All Coloradans reaches. Vocabulary fix round (U-11, D-5): the income is ma_wawd_countable_income (CO-1715), which now counts self-employment; employment reads ma_has_earned_income (CO-6200, pay for work or business receipts in the month, from the earnings records; has_earned_income, CO-1356, before the records E1 integration) instead of the retired is_employed (CO-805), which a case could state true with no earnings."
