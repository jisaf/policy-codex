id: CO-618
name: "Medicaid: is Working Adults with Disabilities Buy-In eligible"
identifier: ma_wawd_eligible
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: Whether the person is eligible for the Medicaid Buy-In Program for Working Adults with Disabilities - at least 16, employed, disabled, and with countable income at or below 450% of the federal poverty level for a single individual - per 10 CCR 2505-10 8.100.6.P.1.
precision: "'Only the applicant's income will be considered' (8.100.6.P.1.b), and 8.100.5.H.1's carve-out ('the applicant's spouse's income does not count toward the applicant') means this item computes the applicant's own earned/unearned income and disregards without combining a living-together spouse's income, unlike ma_ssi_countable_income (CO-607); it applies the same $65-plus-one-half and $20 disregard structure to the applicant's own income only. Resources are not counted (8.100.6.P.1.c), so no resource test is included. Status reads ma_meets_status_for_cover_all_coloradans_categories (CO-1174), since § 8.100.3.G.1.g.ix.1.b lists both Buy-In programs among the categories Cover All Coloradans reaches. The income is ma_wawd_countable_income (CO-1715), which now counts self-employment; employment reads has_earned_income (CO-1356, wages or self-employment receipts in the month) instead of the retired is_employed (CO-805), which a case could state true with no earnings."
derived: [all, ma_meets_residency, ma_meets_status_for_cover_all_coloradans_categories, [">=", age, ma_wawd_min_age], has_earned_income, ma_wawd_is_disabled, [<=, ma_wawd_countable_income, ["*", [/, [lookup, federal_poverty_guideline_annual_table, 1], 12], ma_wawd_income_limit_pct]]]
sources: [S607, S317]
implemented: engine
tags: [ma, non_magi, buy_in, income, disability]
rationale: "No existing item states the WAwD eligibility test. ma_buy_in_category (CO-622) needs it. ma_wawd_premium (CO-619) reuses the same applicant-only income computation this item makes inline, since both read the identical 8.100.6.P.1.b definition of countable income for this program. Conjoins is_colorado_resident (CO-505) and ma_meets_citizenship_requirement (CO-509) as CO-611 does, per the phase-4 review's C-19 finding: § 8.100.6.P.1 does not restate them because § 8.100.3/8.100.5.B carry them for the whole of 8.100. History moved from the precision note (HCPF review S-14): Phase 7 fix round (S-2): status reads ma_meets_status_for_cover_all_coloradans_categories (CO-1174), since § 8.100.3.G.1.g.ix.1.b lists both Buy-In programs among the categories Cover All Coloradans reaches. Vocabulary fix round (U-11, D-5): the income is ma_wawd_countable_income (CO-1715), which now counts self-employment; employment reads has_earned_income (CO-1356, wages or self-employment receipts in the month) instead of the retired is_employed (CO-805), which a case could state true with no earnings."
tests:
  - {id: CO-618-T1, as_of: "2026-10-01", month: "2026-10", given: {age: 30, ma_wawd_is_disabled: true, wages_gross: 2000, self_employment_gross_receipts: 0, social_security_income: 0, pension_income: 0, unemployment_income: 0, other_unearned_income_nontaxable: 0, other_unearned_income_taxable: 0, tax_exempt_interest: 0, in_kind_support_and_maintenance: 0, is_colorado_resident: true, ma_meets_citizenship_requirement: true}, expect: true}
  - {id: CO-618-T2, as_of: "2026-10-01", month: "2026-10", title: "No wages or self-employment receipts in the month (D-5: has_earned_income replaces is_employed)", given: {age: 30, ma_wawd_is_disabled: true, wages_gross: 0, self_employment_gross_receipts: 0, social_security_income: 0, pension_income: 0, unemployment_income: 0, other_unearned_income_nontaxable: 0, other_unearned_income_taxable: 0, tax_exempt_interest: 0, in_kind_support_and_maintenance: 0, is_colorado_resident: true, ma_meets_citizenship_requirement: true}, expect: false}
  - {id: CO-618-T3, as_of: "2026-10-01", month: "2026-10", given: {age: 30, ma_wawd_is_disabled: true, wages_gross: 2000, self_employment_gross_receipts: 0, social_security_income: 0, pension_income: 0, unemployment_income: 0, other_unearned_income_nontaxable: 0, other_unearned_income_taxable: 0, tax_exempt_interest: 0, in_kind_support_and_maintenance: 0, is_colorado_resident: true, ma_meets_citizenship_requirement: false, ma_is_cover_all_coloradans_person: false}, expect: false}
