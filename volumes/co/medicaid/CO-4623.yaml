id: CO-4623
name: "Medicaid: SSI-related countable resources of the individual"
identifier: ma_ssi_countable_resources_individual
kind: derived
type: money
scope: person
program: Medicaid
meaning: "This person's own countable resources for the aged, blind and disabled groups and long-term care (10 CCR 2505-10 § 8.100.5.J, M) on the determination date: ma_ssi_countable_resources_in_month (CO-5322) at the determination month: the SSI method's holdings counted (ma_ssi_holdings_countable_in_month, CO-5320, by the holdings counting table CO-5303), less the real property left out while for sale or co-owned with a resident (ma_excluded_real_property_value), plus income-producing property above its exclusion (ma_countable_income_producing_property_value), the home when § 8.100.5.M.2.a makes it countable (ma_home_is_countable_resource), and the value the Department finds available from a trust, an annuity or a life estate (§ 8.100.7.E, H, I). An ABLE account is left out (M.2.k) and personal property held as an investment (M.3.j) counted, by their rows."
precision: "The person's own holdings, not combined with a spouse's; ma_ssi_countable_resources (CO-608) and ma_institutionalized_spouse_countable_resources (CO-647) combine the spouses' figures, with the couple's one automobile. Resource records, Medicaid track H1 (docs/reviews/records-holdings-medicaid.md): read from the holdings records (CO-5300) through CO-5322, which states the figure for any month; this item is its determination-month value, which every person-scope reader reads."
derived: [at, ma_ssi_countable_resources_in_month, [det_month]]
sources: [S2215, S1514, S3402, S3403, S3421, S3423, S4504, S4505]
implemented: engine
tags: [ma, non_magi, resources]
rationale: "Coverage review NM-2, NM-4, NM-5: the Medicaid resource rules of § 8.100.5.J and M that the SSI-method figure, which Adult Financial also reads, does not carry (Medicaid's own findings on real property for sale and co-owned, income-producing property, and the home) are applied once per person here, so the couple, long-term care and deeming items read one figure. Coverage review NM-20, NM-27: ABLE accounts, investment personal property and the Department's trust, annuity and life estate findings are Medicaid's resource rules too. Resource records, step H1 (Medicaid; design 3.3, decision D6): read from the holdings records through the SSI method's one counting table, so the ABLE account and the investment property are rows of the table rather than adjustments made one fact at a time."
tests:
  # Hand-computed from 8.100.5.M.2.b (S1514), J.2 (S3402), M.2.a (S3403), M.2.k and M.3.j (S3421), 8.100.7.I (S3423).
  - {id: CO-4623-T1, as_of: "2026-10-12", title: "M.2.b: 1,000 in the bank and a 50,000 lot whose sale efforts are unsuccessful: 1,000", given: {holdings: [{kind: bank_account, value: 1000}, {kind: real_property, value: 50000, amount_owed: 0, listed_for_sale: true, ma_sale_efforts_unsuccessful: true, co_owner_would_lose_housing: false}]}, expect: 1000}
  - {id: CO-4623-T2, as_of: "2026-10-12", title: "1,200 in the bank, a 150,000 rental (144,000 above the 6,000 exclusion) and a 240,000 home counted (nursing facility, no intent to return, no one at home): 385,200", given: {residence_setting_type: nursing_facility, resides_in_medical_institution: true, ma_spouse_or_dependent_relative_lives_in_home: false, holdings: [{kind: bank_account, value: 1200}, {kind: real_property, value: 150000, amount_owed: 0, income_producing: true}, {kind: home, value: 240000, amount_owed: 0}]}, expect: 385200}
  - {id: CO-4623-T3, as_of: "2026-10-12", title: "NM-27, NM-20: 6,000 in an ABLE account left out; 2,500 of collectibles (nothing owed) and 10,000 found available from a life estate added: 1,000 + 2,500 + 10,000 = 13,500", given: {holdings: [{kind: bank_account, value: 1000}, {kind: able_account, value: 6000}, {kind: investment_personal_property, value: 2500, amount_owed: 0},{kind: life_estate, ma_found_available_value: 10000}]}, expect: 13500}
