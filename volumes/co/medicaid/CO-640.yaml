id: CO-640
name: "Medicaid: is institutionalized"
identifier: ma_is_institutionalized
kind: derived
type: yes/no
scope: person
program: Medicaid
meaning: Whether this person is institutionalized for Long-Term Care purposes - currently in a medical institution or Long-Term Care institution and expected to remain, or to receive HCBS/PACE, for at least 30 consecutive full days - per 42 CFR 435.1005/435.1009 and 10 CCR 2505-10 §§ 8.100.7.A.2.c and 8.100.7.K.2.
precision: "A person who dies before the 30th day (8.100.7.A.2.c.i-iii) meets the requirement on a physician's or case manager's statement that the stay would have lasted 30 days: expects_institutional_stay_of_thirty_days is read as that statement, and its documentation is ma_requires_verification_of_institutional_stay (CO-1632) (coverage review NM-34). A hospital or Long-Term Care institution is read as eligible for Medical Assistance reimbursement (A.2.d); a facility that is not is outside this item (NM-35). Reads resides_in_medical_institution (CO-1742), not SNAP's majority-of-meals institution fact."
derived: [all, resides_in_medical_institution, expects_institutional_stay_of_thirty_days]
sources: [S1753, S3422]
implemented: engine
tags: [ma, ltc]
rationale: "No existing item states the institutionalized-for-LTC-purposes test (snap_resides_in_institution_providing_meals alone, used by SNAP and the MAGI chapter for institution exclusion, does not test the 30-day expectation). ma_meets_special_income_group's institutional gate, ma_ltc_couple (CO-643) and ma_ltc_eligibility_status (CO-652) need it. History moved from the precision note (HCPF review S-14): Vocabulary fix round (docs/reviews/vocabulary-reuse.md, R-8): reads resides_in_medical_institution (CO-1742), not SNAP's majority-of-meals institution fact."
tests:
  - {id: CO-640-T1, as_of: "2026-10-01", given: {resides_in_medical_institution: true, expects_institutional_stay_of_thirty_days: true}, expect: true}
  - {id: CO-640-T2, as_of: "2026-10-01", given: {resides_in_medical_institution: true, expects_institutional_stay_of_thirty_days: false}, expect: false}
