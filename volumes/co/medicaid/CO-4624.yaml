id: CO-4624
name: "Medicaid: parents whose income and resources are deemed to the child"
identifier: ma_ssi_deeming_parents
kind: derived
type: group of persons
scope: person-month
program: Medicaid
meaning: "For a child under ma_ssi_unemancipated_child_age_limit who is not emancipated and does not reside in a medical institution, the child's parents and stepparents who live with the child, do not reside in a medical institution, and are not applying for or eligible for SSI (ineligible parents, 10 CCR 2505-10 § 8.100.5.H.2.c): the persons whose income and resources are deemed to the child (42 U.S.C. 1382c(f)(2)(A), 20 CFR 416.1165, 416.1202(b)); empty for anyone else."
precision: "Deeming stops once the child is institutionalized (§ 8.100.7.A.1). Coverage pass 2, N2-7: A.1 provides Medical Assistance \"beginning the first day of the month following the month during which a child under the age of 18 ceases to live with his or her parent(s)\", which leaves the month of admission deemed; this item is read once for the case (person scope, as the deemed resources, CO-4627, are), so it cannot keep deeming for the admission month alone without keeping it for the months after. It stops deeming from the month of admission: the only answer that differs is the SSI-related category for that one month, and in the child's favour. Living together is lives_with (read as together when not stated). A parent or stepparent who is applying for or eligible for SSI (ma_is_applying_for_or_eligible_for_ssi, CO-2271) is not an ineligible parent. The exception of 20 CFR 416.1165(i) and 416.1202(b)(2) for a child previously paid the reduced SSI benefit of a medical facility is not modeled: a disabled child served by an HCBS waiver reaches Medicaid through the 300% special income group, which counts only the child's own income. Coverage pass 4, non-MAGI N4-9 (docs/operators.md, \"Ages in a month\"): the age is taken in the month evaluated, not on the determination date: an \"under N\" test on the first day of the month (ma_age_on_first_day_of_month, CO-4978), an \"N or older\" test on the last day (ma_age_on_last_day_of_month, CO-5402), and a test that excludes the person from what is favorable on the other day. Per month: the deeming of 20 CFR 416.1165 stops with the month the child is no longer under 18, so a retroactive month before the birthday is deemed and a month after it is not; every reader is per month (ma_ssi_parental_resources_deemed, CO-4627, is per month too). Pattern sweep, non-MAGI Medicaid (docs/reviews/pattern-sweep-nonmagi.md, P1, P2, P3): the household of the month is ma_ssi_lives_with_in_month (CO-7505): those living in the person's home, and a spouse, parent or child who lives elsewhere through the month the two ceased to live together (20 CFR 416.1165(g)(4), S5122; 416.1167(a)(1), S5120; § 8.100.7.C.2.b, S1759), a person who died through the month of death ((g)(3), S5122; 416.1163(f)(4), S5121); a person who lives in a facility (its dwelling_id the facility's) is a member through the month of entry (institution_entry_date) and not from the month after (§ 8.100.7.A.1, S3406: from 'the first day of the month following the month during which a child under the age of 18 ceases to live with his or her parent(s)'; 416.1167(a)(1)), while a person away for a stay the person returns from keeps the home's dwelling_id and stays a member (a temporary absence, 416.1167(a); duplicate-paths D-M4). Living together is read as stated, required where read (decision 4 of 2026-11-23; convention rule 17): no text on file says the persons of one application live together unless it says otherwise. A stepparent is deemed only in a month the child's own parent who is the stepparent's spouse lives in the child's household (416.1165(g)(3), S5122: 'If you live with a stepparent following the death of your natural or adoptive parent, we do not deem income from the stepparent'; (g)(4): no deeming from the stepparent 'if your natural or adoptive parent has permanently left the household'). The child's relationships are read as stated, required where read. Before, every month read the institution (any stay in a medical institution, even one the child returns from) and the homes of the determination date, a case with no homes stated was read as one home, a child with no relationships stated had no parent, and a stepparent was deemed whatever the parent's presence."
derived: [filter, [persons], [all, ["<", ma_age_on_first_day_of_month, ma_ssi_unemancipated_child_age_limit], [not, [otherwise, is_emancipated_minor, false]], [any, [rel, [child], [P]], [all, [rel, [stepchild], [P]], [has_relative_in, [spouse], [filter, [persons], [all, [rel, [child], [P]], [in_group, [P], ma_ssi_lives_with_in_month]]]]]], [in_group, [P], ma_ssi_lives_with_in_month], [not, [of, [P], ma_is_applying_for_or_eligible_for_ssi]]]]
sources: [S3405, S3406, S3413, S3414, S3415, S5120, S5122]
implemented: engine
tags: [ma, non_magi, income, resources, household]
rationale: "Coverage review NM-10: no part of a parent's income or resources reached a child applying under the SSI-related rules (OQ-83), though § 8.100.5.H.3.a says the allocations reduce 'the gross income that is deemed available to the applicant/client' and 42 U.S.C. 1382c(f)(2)(A) deems a parent's income and resources to a child under 18. The deeming items read this group."
tests:
  # Pattern sweep (P2, decision 4; convention rule 17): the home is stated (dwelling_id), required where read; the story has one home.
  - {id: CO-4624-T1, month: "2026-10", as_of: "2026-10-12", title: "child of 10 living with a working parent", given: {dwelling_id: h1, date_of_birth: "2016-03-01", resides_in_medical_institution: false}, others: {p2: {dwelling_id: h1, date_of_birth: "1985-01-01", resides_in_medical_institution: false, ma_is_applying_for_or_eligible_for_ssi: false}}, relationships: [[child, p2]], expect: [p2]}
  - {id: CO-4624-T2, month: "2026-10", as_of: "2026-10-12", title: "the parent receives SSI: not an ineligible parent", given: {date_of_birth: "2016-03-01", resides_in_medical_institution: false}, others: {p2: {date_of_birth: "1985-01-01", resides_in_medical_institution: false, ma_is_applying_for_or_eligible_for_ssi: true}}, relationships: [[child, p2]], expect: []}
  - {id: CO-4624-T3, month: "2026-10", as_of: "2026-10-12", title: "a person of 19: no deeming", given: {date_of_birth: "2007-03-01", resides_in_medical_institution: false}, others: {p2: {date_of_birth: "1985-01-01", resides_in_medical_institution: false, ma_is_applying_for_or_eligible_for_ssi: false}}, relationships: [[child, p2]], expect: []}
  # Pattern sweep (P1, P2): the homes and the child's entry to the institution (2026-08-01) are stated, required where read; October follows the month of entry, so the child no longer lives with the parent and nothing is deemed (CO-7505).
  - {id: CO-4624-T4, month: "2026-10", as_of: "2026-10-12", title: "child in a medical institution: no deeming", given: {dwelling_id: hosp1, residence_setting_type: hospital, institution_entry_date: "2026-08-01", date_of_birth: "2016-03-01", resides_in_medical_institution: true}, others: {p2: {dwelling_id: h1, residence_setting_type: private_dwelling, date_of_birth: "1985-01-01", resides_in_medical_institution: false, ma_is_applying_for_or_eligible_for_ssi: false}}, relationships: [[child, p2]], expect: []}
  # Pattern sweep (P2, decision 4; convention rule 17): the home is stated (dwelling_id), required where read; the story has one home.
  - {id: CO-4624-T5, month: "2026-10", as_of: "2026-11-20", title: "N4-9: the child is 17 on 2026-10-01: the parent is deemed in October", given: {dwelling_id: h1, date_of_birth: "2008-11-15", resides_in_medical_institution: false}, others: {p2: {dwelling_id: h1, date_of_birth: "1985-01-01", resides_in_medical_institution: false, ma_is_applying_for_or_eligible_for_ssi: false}}, relationships: [[child, p2]], expect: [p2]}
  - {id: CO-4624-T6, month: "2026-12", as_of: "2026-11-20", title: "N4-9: 18 on 2026-12-01: no deeming in December", given: {date_of_birth: "2008-11-15", resides_in_medical_institution: false}, others: {p2: {date_of_birth: "1985-01-01", resides_in_medical_institution: false, ma_is_applying_for_or_eligible_for_ssi: false}}, relationships: [[child, p2]], expect: []}
  # Pattern sweep P1/P3. A child (p1, born 2016-03-01) in a hospital since 2026-09-10; the parent (p2) at home, not applying for or eligible for SSI; determined 2026-11-20.
  # September: the child left the household in September; deeming ceases from the month after (8.100.7.A.1, S3406; 416.1165(g)(4), S5122): [p2]. October: the child no longer lives with the parent (CO-7505): [].
  - {id: CO-4624-T7, month: "2026-09", as_of: "2026-11-20", title: "Pattern sweep: a child in a hospital since September is deemed the parent's income through September", given: {date_of_birth: "2016-03-01", dwelling_id: hosp1, residence_setting_type: hospital, institution_entry_date: "2026-09-10"}, others: {p2: {date_of_birth: "1985-01-01", dwelling_id: h1, residence_setting_type: private_dwelling, ma_is_applying_for_or_eligible_for_ssi: false}}, relationships: [[child, p2]], expect: [p2]}
  - {id: CO-4624-T8, month: "2026-10", as_of: "2026-11-20", title: "Pattern sweep: from the month after the month of entry, no deeming", given: {date_of_birth: "2016-03-01", dwelling_id: hosp1, residence_setting_type: hospital, institution_entry_date: "2026-09-10"}, others: {p2: {date_of_birth: "1985-01-01", dwelling_id: h1, residence_setting_type: private_dwelling, ma_is_applying_for_or_eligible_for_ssi: false}}, relationships: [[child, p2]], expect: []}
  # The parent died 2026-09-05 (416.1165(g)(3), S5122): not deemed from October.
  - {id: CO-4624-T9, month: "2026-10", as_of: "2026-11-20", title: "Pattern sweep: a parent who died in September is not deemed from October", given: {date_of_birth: "2016-03-01", dwelling_id: h1, residence_setting_type: private_dwelling}, others: {p2: {date_of_birth: "1985-01-01", dwelling_id: h1, residence_setting_type: private_dwelling, ma_is_applying_for_or_eligible_for_ssi: false, date_of_death: "2026-09-05"}}, relationships: [[child, p2]], expect: []}
  # The mother (p2) moved out 2026-08-20; the stepfather (p3, her husband) stays with the child (p1). August: both live with the child: [p2, p3].
  # October: the mother has left (from September, (g)(4)); the stepfather is not deemed once the child's parent has left the household: [].
  - {id: CO-4624-T10, month: "2026-08", as_of: "2026-11-20", title: "Pattern sweep: mother and stepfather both in the household in August", given: {date_of_birth: "2016-03-01", dwelling_id: h1, residence_setting_type: private_dwelling, ceased_living_with_parent_or_child_date: "2026-08-20"}, others: {p2: {date_of_birth: "1985-01-01", dwelling_id: h2, residence_setting_type: private_dwelling, ma_is_applying_for_or_eligible_for_ssi: false}, p3: {date_of_birth: "1984-01-01", dwelling_id: h1, residence_setting_type: private_dwelling, ma_is_applying_for_or_eligible_for_ssi: false}}, relationships: [[child, p2], [stepchild, p3], [spouse, p2, p3]], expect: [p2, p3]}
  - {id: CO-4624-T11, month: "2026-10", as_of: "2026-11-20", title: "Pattern sweep: the parent has left; the stepparent who remains is not deemed", given: {date_of_birth: "2016-03-01", dwelling_id: h1, residence_setting_type: private_dwelling, ceased_living_with_parent_or_child_date: "2026-08-20"}, others: {p2: {date_of_birth: "1985-01-01", dwelling_id: h2, residence_setting_type: private_dwelling, ma_is_applying_for_or_eligible_for_ssi: false}, p3: {date_of_birth: "1984-01-01", dwelling_id: h1, residence_setting_type: private_dwelling, ma_is_applying_for_or_eligible_for_ssi: false}}, relationships: [[child, p2], [stepchild, p3], [spouse, p2, p3]], expect: []}
