id: CO-1175
name: "Medicaid: is covered under Cover All Coloradans"
identifier: ma_is_covered_under_cover_all_coloradans
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether a person who does not meet the citizenship and immigration status requirement (ma_meets_citizenship_requirement, CO-509) is nevertheless fully covered this month through Cover All Coloradans (10 CCR 2505-10 § 8.100.3.G.1.g.ix.1): a child, pregnant or postpartum person (ma_is_cover_all_coloradans_person, CO-1173) who qualifies for a Medical Assistance category ix.1.a-b lists - the MAGI Children or Pregnant category (including a needy newborn), a Buy-In program, or an HCBS waiver."
precision: "The MAGI categories are read from ma_magi_category (CO-551), which does not read status; needy_newborn is counted with child, since a needy newborn is a child under 19 in the Children's group. Transitional Medical Assistance, the 4 Month Extended Medical Assistance and Psych <21 are not modeled in this volume. CHP+ is not a Medical Assistance category; ma_emergency_medicaid_status (CO-1151) reads CHP+ eligibility separately. OQ-214 sweep: a child under 19 or a pregnant person who meets every requirement of any categorical program other than status (ma_meets_requirements_other_than_status, CO-1150) is covered here too, by C.R.S. 25.5-2-104(2) (state medical assistance for a child, the same benefits) and 25.5-5-201(6)(a) (medical assistance for a pregnant non-citizen); a postpartum person who was not covered while pregnant still reaches only the ix.1.a-b list. A person covered here is not limited to emergency coverage (ma_is_emergency_medicaid_only, CO-510). Coverage pass 5 (2026-11-23, the class of C5-02 and C5-03): pregnancy is read for the month evaluated (ma_is_pregnant_in_month, CO-3601), not on the determination date (is_pregnant), so a retroactive month in which the person was pregnant is a pregnant month although the pregnancy has ended, and a month before a pregnancy began is not. Pattern sweep, MAGI (2026-11-24, PS-01, PS-02): status and the Cover All Coloradans population are read for the month evaluated (ma_meets_citizenship_requirement_in_month, CO-7551; ma_is_cover_all_coloradans_person_in_month, CO-7552; ma_meets_status_for_cover_all_coloradans_categories_in_month, CO-7553), not on the determination date: 8.100.4.G.1 (S3351), 8.100.3.E.1 (S217), 8 U.S.C. 1613(a) (S176), ix.1's 'current month' (S607)."
derived: [all, [not, ma_meets_citizenship_requirement_in_month], ma_is_cover_all_coloradans_person_in_month, [any, [in, ma_magi_category, [needy_newborn, child, pregnant]], [all, [any, ma_is_under_child_age_or_turns_nineteen_this_month, ma_is_pregnant_in_month], ma_meets_requirements_other_than_status], [not, ["=", ma_buy_in_category, "none"]], ma_hcbs_waiver_eligible]]
sources: [S607, S1217, S1218, S3351, S217, S176]
open: [OQ-214]
implemented: engine
tags: [ma, immigration, emergency]
rationale: "S-2 of the phase 7 review: once the Cover All Coloradans population no longer satisfies ma_meets_citizenship_requirement (CO-509) for every category, the emergency-only test (CO-510) needs to know whether a child, pregnant or postpartum person who fails status is fully covered in a listed category (an undocumented child in the Children's category) or only otherwise eligible elsewhere (an undocumented postpartum adult in the Adult category, who is emergency-only). No existing item states it."
tests:
  - {id: CO-1175-T1, as_of: "2026-10-01", month: "2026-10", title: "Undocumented child in the Children's category", given: {ma_meets_citizenship_requirement_in_month: false, ma_is_cover_all_coloradans_person_in_month: true, ma_magi_category: child}, expect: true}
  - {id: CO-1175-T2, as_of: "2026-10-01", month: "2026-10", title: "Undocumented postpartum adult in the Adult category, no Buy-In or waiver", given: {ma_meets_citizenship_requirement_in_month: false, ma_is_cover_all_coloradans_person_in_month: true, ma_magi_category: adult, ma_is_under_child_age_or_turns_nineteen_this_month: false, is_pregnant: false, ma_buy_in_category: "none", ma_hcbs_waiver_eligible: false}, expect: false}
  - {id: CO-1175-T3, as_of: "2026-10-01", month: "2026-10", title: "Undocumented adult, not a Cover All Coloradans person", given: {ma_meets_citizenship_requirement_in_month: false, ma_is_cover_all_coloradans_person_in_month: false}, expect: false}
  - {id: CO-1175-T4, as_of: "2026-10-01", month: "2026-10", title: "Meets status: not a Cover All Coloradans case", given: {ma_meets_citizenship_requirement_in_month: true}, expect: false}
  - {id: CO-1175-T5, as_of: "2026-10-01", month: "2026-10", title: "Undocumented disabled child in an HCBS waiver", given: {ma_meets_citizenship_requirement_in_month: false, ma_is_cover_all_coloradans_person_in_month: true, ma_magi_category: "none", ma_buy_in_category: "none", ma_hcbs_waiver_eligible: true}, expect: true}
  - {id: CO-1175-T9, as_of: "2026-10-01", month: "2026-10", title: "OQ-214: an undocumented disabled 10-year-old who meets the SSI-related standards only", given: {ma_meets_citizenship_requirement_in_month: false, ma_is_cover_all_coloradans_person_in_month: true, ma_magi_category: "none", ma_is_under_child_age_or_turns_nineteen_this_month: true, ma_meets_requirements_other_than_status: true}, expect: true}
  - {id: CO-1175-T10, as_of: "2026-10-01", month: "2026-10", title: "OQ-214: a postpartum adult in the Adults category only, not covered while pregnant", given: {ma_meets_citizenship_requirement_in_month: false, ma_is_cover_all_coloradans_person_in_month: true, ma_magi_category: adult, ma_is_under_child_age_or_turns_nineteen_this_month: false, is_pregnant: false, ma_buy_in_category: "none", ma_hcbs_waiver_eligible: false}, expect: false}
