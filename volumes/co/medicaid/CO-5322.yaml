id: CO-5322
name: "Medicaid: SSI-related countable resources of the individual in the month"
identifier: ma_ssi_countable_resources_in_month
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "This person's own countable resources in the month for the aged, blind and disabled groups and long-term care (10 CCR 2505-10 8.100.5.J, M; 8.100.7.E, H, I): the SSI method's holdings counted in the month (ma_ssi_holdings_countable_in_month, CO-5320), less the real property left out while efforts to sell it are unsuccessful or because its sale would cost a co-owner the co-owner's home (ma_excluded_real_property_value, CO-4620), plus income-producing and self-support property above its exclusion (ma_countable_income_producing_property_value, CO-4621), the person's equity interest in the home when 8.100.5.M.2.a makes it countable (ma_home_is_countable_resource, CO-4622; ma_home_equity_interest_in_month, CO-5327), and the value the Department finds available from a trust, an annuity or a life estate the person holds (each record's ma_found_available_value)."
precision: "Resource records, Medicaid track H1: ma_ssi_countable_resources_individual (CO-4623) is this figure at the determination month; ma_spousal_resources_at_snapshot (CO-888) reads it at the application month. Whether the home is countable is judged on the determination date's facts (CO-4622 reads the home's record at the determination month and the person's residence), and its equity in the month in context. A trust, annuity or life estate record whose ma_found_available_value is not stated adds nothing: the Department's determination (8.100.7.E.7.c) is what makes a value available, the reading the scalar fact's reader gave (kept for the decision-4 round). The person's own holdings, not combined with a spouse's."
derived: ["+", [max, 0, ["-", ma_ssi_holdings_countable_in_month, ma_excluded_real_property_value]], ma_countable_income_producing_property_value, [case, [ma_home_is_countable_resource, ma_home_equity_interest_in_month], [else, 0]], [sum_receipts, holdings, [all, ["=", [lookup, ma_ssi_holding_treatment_table, [receipt, kind]], counted_value_found_available], [received_in, [month]], [unknown, [receipt, disposed_date]]], [otherwise, [receipt, ma_found_available_value], 0]]]
sources: [S1514, S1515, S3402, S3403, S4665, S3423]
open: [OQ-1243]
implemented: engine
tags: [ma, non_magi, resources]
rationale: "Resource records, step H1 (Medicaid): the figure ma_ssi_countable_resources_individual (CO-4623) computed, read in any month, so the spousal assessment of 8.100.7.L can read the couple's holdings at the time of application (decision D8)."
tests:
  # Hand-computed from 8.100.5.M (S4504, S4505), M.2.b (S1514), J.2 (S3402), M.2.a (S3403), 8.100.7.E-I (S3423).
  - {id: CO-5322-T1, month: "2026-10", as_of: "2026-10-12", title: "1,000 in the bank and a 50,000 lot whose sale efforts are unsuccessful: 1,000 + 50,000 - 50,000 = 1,000", given: {holdings: [{kind: bank_account, value: 1000}, {kind: real_property, value: 50000, amount_owed: 0, listed_for_sale: true, ma_sale_efforts_unsuccessful: true, co_owner_would_lose_housing: false}]}, expect: 1000}
  - {id: CO-5322-T2, month: "2026-10", as_of: "2026-10-12", title: "1,200 in the bank, a 150,000 rental (150,000 - 6,000 = 144,000) and a 240,000 home counted (nursing facility, no intent to return): 1,200 + 144,000 + 240,000 = 385,200", given: {residence_setting_type: nursing_facility, resides_in_medical_institution: true, ma_spouse_or_dependent_relative_lives_in_home: false, holdings: [{kind: bank_account, value: 1200}, {kind: real_property, value: 150000, amount_owed: 0, income_producing: true}, {kind: home, value: 240000, amount_owed: 0}]}, expect: 385200}
  - {id: CO-5322-T3, month: "2026-10", as_of: "2026-10-12", title: "8.100.7.I: 10,000 the Department finds available from a revocable annuity: 1,000 + 10,000 = 11,000", given: {holdings: [{kind: bank_account, value: 1000}, {kind: annuity, ma_found_available_value: 10000}]}, expect: 11000}
  - {id: CO-5322-T4, month: "2026-10", as_of: "2026-10-12", title: "lives at home: the 240,000 home is exempt: 1,000", given: {residence_setting_type: private_dwelling, ma_spouse_or_dependent_relative_lives_in_home: false, holdings: [{kind: bank_account, value: 1000}, {kind: home, value: 240000, amount_owed: 0, lives_in: true}]}, expect: 1000}
