id: CO-2471
name: "SSI method: excluded earned income"
identifier: ma_ssi_excluded_earned_income
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The part of the person's gross earned income for the month that the SSI method does not count for the SSI-related Medical Assistance groups: the student earned income exclusion of 20 CFR 416.1112(c)(3) - for a student under 22 regularly attending school, the earned income of the month up to the monthly maximum, and no more than what remains of the yearly maximum after the months of the calendar year before; the first $30 of infrequent or irregular earned income in a calendar quarter (416.1112(c)(2), ma_ssi_excluded_infrequent_earned_income, CO-4883); and wages the Census Bureau pays for temporary decennial Census work, which 10 CCR 2505-10 § 8.100.5.F.6.z exempts (the earnings the SSI method's earnings counting table holds exempt, ma_ssi_exempt_earned_receipts, CO-5172)."
precision: "The month's exclusion is the yearly running total of each month's basis (ma_ssi_student_earned_income_exclusion_basis, CO-5174: the month's earned income, ma_ssi_gross_earned_income, up to the monthly maximum, for a student under 22) capped at the yearly maximum, less the same total through the month before (P54), so no item reads itself. The maxima are the SSA's figures for the year (CO-3379, CO-3380, D-206). § 8.100.5.H.4.d states $400 a month and $1,620 a year, the figures of 20 CFR 416.1112(c)(3) before 2002; the edition H.4.e incorporates (2012) indexes them yearly from 2002 ((c)(3)(ii)), so SSA's figures for the year govern (coverage review NM-31). Coverage pass 3 C3-11, fixed in earned-income records E1: 20 CFR 416.1112(a) (S3412) excludes first the income other Federal laws exclude and then applies the exclusions \"in the order listed in paragraph (c) ... to the rest of your income\". The parts are disjoint records: the exempt pay (Census wages, F.6.z; a dependent child's WIOA wages, 8.100.3.K.8.c, ma_ssi_excluded_wioa_wages, CO-5179) and then the infrequent pay ((c)(2)) are taken before the student exclusion ((c)(3)), whose basis is the earned income left after them (CO-5174), so pay already excluded no longer uses up the student exclusion's yearly maximum."
derived: [+, ["-", [min, ssi_student_earned_income_exclusion_annual, [sum_months, [months_from_to, [latest_month_of_year, 1, [month]], [month]], [at, ma_ssi_student_earned_income_exclusion_basis, [that_month]]]], [min, ssi_student_earned_income_exclusion_annual, [sum_months, [months_from_to, [latest_month_of_year, 1, [month]], [month_before, [month]]], [at, ma_ssi_student_earned_income_exclusion_basis, [that_month]]]]], ma_ssi_excluded_infrequent_earned_income, ma_ssi_exempt_earned_receipts, ma_ssi_excluded_wioa_wages]
sources: [S308, S309, S2210, S2211, S3002, S3617, S3618]
implemented: engine
tags: [non_magi, income, student]
rationale: "Same-word audit SW-28, dual-entry audit 3.24 and 3.25: each program's excluded income and allowable business costs were program-prefixed supplied amounts, so one receipt or one set of business costs was entered once per program. The neutral fact describes the receipt or the cost; each program's exclusion or allowable cost is its own derived item citing its list (product-owner decision, convention rule 13). The SSI student earned income exclusion was an example of what a case had to enter itself; its 2026 figures were fetched from the SSA's Federal Register notice (D-206), ssa.gov being refused. Coverage pass 2 (first pass NM-23 z and NM-26, deferred): the infrequent or irregular earnings exclusion (CO-4883) and decennial Census wages (CO-4881) are added; AmeriCorps payments (416.1112(c)(10)) are stated in the unearned income facts (americorps_payments_received, CO-4016) and excluded by ma_ssi_excluded_unearned_income (CO-2470). Earned-income records, step E1 (Medicaid and CHP+): the student basis is Medicaid's own (ma_ssi_student_earned_income_exclusion_basis, CO-5174) instead of the shared CO-3387, and the exempt pay is the earnings the SSI table holds exempt (ma_ssi_exempt_earned_receipts, CO-5172) instead of decennial_census_wages_received; an unstated part is no longer read as none."
tests:
  - {id: CO-2471-T1, month: "2026-10", as_of: "2026-10-01", given: {date_of_birth: "2008-01-01", ssi_is_student_regularly_attending_school: true, earnings: [{kind: wages, amount: 900}, {kind: self_employment_receipts}]}, month_defaults: {ma_self_employment_net_earnings: 0}, expect: 900}
  - {id: CO-2471-T2, title: "Above the monthly maximum", month: "2026-01", as_of: "2026-01-15", given: {date_of_birth: "2008-01-01", ssi_is_student_regularly_attending_school: true, ma_self_employment_net_earnings: 0, earnings: [{kind: wages, amount: 3000}, {kind: self_employment_receipts}]}, expect: 2410}
  - {id: CO-2471-T3, title: "The yearly maximum: 2,410 a month for four months leaves 90 in May", month: "2026-05", as_of: "2026-05-15", given: {date_of_birth: "2008-01-01", ssi_is_student_regularly_attending_school: true, earnings: [{kind: wages, amount: 3000}, {kind: self_employment_receipts}]}, month_defaults: {ma_self_employment_net_earnings: 0}, expect: 90}
  - {id: CO-2471-T4, month: "2026-10", as_of: "2026-10-01", given: {date_of_birth: "1990-01-01", ssi_is_student_regularly_attending_school: true, earnings: [{kind: wages, amount: 900}, {kind: self_employment_receipts}]}, expect: 0}
  - {id: CO-2471-T6, month: "2026-05", as_of: "2026-05-15", title: "C3-11 fixed (416.1112(a) order): a student of 18 with 2,000 of Census wages and 500 of other wages every month of 2026. The Census wages are exempt first (F.6.z); the student exclusion applies to the 500 left each month (5 x 500 = 2,500, under the 9,730 yearly maximum): May excludes 2,000 + 500 = 2,500 (it excluded 2,090 when the Census wages also used up the yearly maximum: 4 x 2,410 = 9,640, leaving 90)", given: {date_of_birth: "2008-01-01", ssi_is_student_regularly_attending_school: true, earnings: [{kind: decennial_census_employment, amount: 2000}, {kind: wages, amount: 500}]}, expect: 2500}
  - {id: CO-2471-T5, month: "2026-11", as_of: "2026-11-01", title: "NM-23 z, NM-26: an adult (no student exclusion) with 1,200 of Census wages and 25 for one odd job", given: {date_of_birth: "1970-01-01", ssi_is_student_regularly_attending_school: false, earnings: [{kind: decennial_census_employment, amount: 1200}, {kind: wages, irregular: true, amount: 25, frequency: once, month: "2026-11"}]}, expect: 1225}
