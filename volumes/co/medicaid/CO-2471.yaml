id: CO-2471
name: "SSI method: excluded earned income"
identifier: ma_ssi_excluded_earned_income
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The part of the person's gross earned income for the month that the SSI method does not count for the SSI-related Medical Assistance groups: the student earned income exclusion of 20 CFR 416.1112(c)(3) - for a student under 22 regularly attending school, the earned income of the month up to the monthly maximum, and no more than what remains of the yearly maximum after the months of the calendar year before; the first $30 of infrequent or irregular earned income in a calendar quarter (416.1112(c)(2), ma_ssi_excluded_infrequent_earned_income, CO-4883); and wages the Census Bureau pays for temporary decennial Census work, which 10 CCR 2505-10 § 8.100.5.F.6.z exempts (decennial_census_wages_received, CO-4881)."
precision: "The month's exclusion is the yearly running total of each month's basis (ssi_student_earned_income_exclusion_basis, CO-3387: the month's earned income, wages_gross and ma_self_employment_net_earnings, up to the monthly maximum, for a student under 22) capped at the yearly maximum, less the same total through the month before (P54), so no item reads itself. The maxima are the SSA's figures for the year (CO-3379, CO-3380, D-206). § 8.100.5.H.4.d states $400 a month and $1,620 a year, the figures of 20 CFR 416.1112(c)(3) before 2002; the edition H.4.e incorporates (2012) indexes them yearly from 2002 ((c)(3)(ii)), so SSA's figures for the year govern (coverage review NM-31). Coverage pass 3 C3-11 (P3, noted): 20 CFR 416.1112(a) applies the exclusions \"in the order listed in paragraph (c) ... to the rest of your income\"; the three parts here are added independently, so wages the infrequent or Census exclusion already removed can also use up the student exclusion's yearly maximum. The month's countable figure is unaffected (each reader floors at zero); only the yearly cap is reached early."
derived: [+, ["-", [min, ssi_student_earned_income_exclusion_annual, [sum_months, [months_from_to, [latest_month_of_year, 1, [month]], [month]], [at, ssi_student_earned_income_exclusion_basis, [that_month]]]], [min, ssi_student_earned_income_exclusion_annual, [sum_months, [months_from_to, [latest_month_of_year, 1, [month]], [month_before, [month]]], [at, ssi_student_earned_income_exclusion_basis, [that_month]]]]], ma_ssi_excluded_infrequent_earned_income, [otherwise, decennial_census_wages_received, 0]]
sources: [S308, S309, S2210, S2211, S3002, S3617, S3618]
implemented: engine
tags: [non_magi, income, student]
rationale: "Same-word audit SW-28, dual-entry audit 3.24 and 3.25: each program's excluded income and allowable business costs were program-prefixed supplied amounts, so one receipt or one set of business costs was entered once per program. The neutral fact describes the receipt or the cost; each program's exclusion or allowable cost is its own derived item citing its list (product-owner decision, convention rule 13). The SSI student earned income exclusion was an example of what a case had to enter itself; its 2026 figures were fetched from the SSA's Federal Register notice (D-206), ssa.gov being refused. Coverage pass 2 (first pass NM-23 z and NM-26, deferred): the infrequent or irregular earnings exclusion (CO-4883) and decennial Census wages (CO-4881) are added; AmeriCorps payments (416.1112(c)(10)) are stated in the unearned income facts (americorps_payments_received, CO-4016) and excluded by ma_ssi_excluded_unearned_income (CO-2470)."
tests:
  - {id: CO-2471-T1, month: "2026-10", as_of: "2026-10-01", given: {date_of_birth: "2008-01-01", ssi_is_student_regularly_attending_school: true, earnings: [{kind: wages, amount: 900}, {kind: self_employment_receipts}]}, month_defaults: {wages_gross: 900, ma_self_employment_net_earnings: 0}, expect: 900}
  - {id: CO-2471-T2, title: "Above the monthly maximum", month: "2026-01", as_of: "2026-01-15", given: {date_of_birth: "2008-01-01", ssi_is_student_regularly_attending_school: true, wages_gross: 3000, ma_self_employment_net_earnings: 0, earnings: [{kind: wages, amount: 3000}, {kind: self_employment_receipts}]}, expect: 2410}
  - {id: CO-2471-T3, title: "The yearly maximum: 2,410 a month for four months leaves 90 in May", month: "2026-05", as_of: "2026-05-15", given: {date_of_birth: "2008-01-01", ssi_is_student_regularly_attending_school: true, earnings: [{kind: wages, amount: 3000}, {kind: self_employment_receipts}]}, month_defaults: {wages_gross: 3000, ma_self_employment_net_earnings: 0}, expect: 90}
  - {id: CO-2471-T4, month: "2026-10", as_of: "2026-10-01", given: {date_of_birth: "1990-01-01", ssi_is_student_regularly_attending_school: true, wages_gross: 900, earnings: [{kind: wages, amount: 900}, {kind: self_employment_receipts}]}, expect: 0}
  - {id: CO-2471-T5, month: "2026-11", as_of: "2026-11-01", title: "NM-23 z, NM-26: an adult (no student exclusion) with 1,200 of Census wages and 25 for one odd job", given: {date_of_birth: "1970-01-01", ssi_is_student_regularly_attending_school: false, decennial_census_wages_received: 1200, infrequent_or_irregular_earned_income_received: 25, earnings: [{kind: decennial_census_employment, amount: 1200}, {kind: wages, irregular: true, amount: 25}, {kind: self_employment_receipts}]}, month_defaults: {wages_gross: 1225, ma_self_employment_net_earnings: 0}, expect: 1225}
