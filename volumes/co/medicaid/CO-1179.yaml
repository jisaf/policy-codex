id: CO-1179
name: "Medicaid: meets the institution for mental diseases requirement"
identifier: ma_meets_imd_requirement
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether the person meets the general Medical Assistance requirement of 10 CCR 2505-10 § 8.100.3.G.1.c: not a patient in an institution for tuberculosis or mental disease this month, unless under ma_imd_exclusion_min_age or ma_aged_age or older (the ages at which inpatient psychiatric treatment is a covered service)."
precision: "The ages are tested first, so a person under ma_imd_exclusion_min_age or ma_aged_age or older meets the requirement without the institution fact. § 8.100.3.G.1.c conditions the under-21 and 65-or-older exception on the person 'receiving active treatment as an inpatient in a psychiatric facility eligible for Medical Assistance reimbursement'; is_patient_in_institution_for_mental_diseases (CO-1104) does not distinguish active treatment, so a patient of those ages is read as within the exception. The § 8.100.4.H extension for a patient who turns ma_imd_exclusion_min_age during inpatient psychiatric treatment is not modeled. Read by the MAGI full-coverage test (CO-562), the SSI-related test (CO-611) and the emergency-only route (CO-1150). Coverage review 2, N-12: the ages are taken on the determination date, and this item is read by non-MAGI groups too (CO-611, CO-1150). A person who reaches 65 during the month is within the exception on the determination date. A MAGI person who turns 21 during the month and is a patient of an institution for mental diseases loses the exception from that date, though § 8.100.4.G.1's whole month would keep the month; the case is narrow (an inpatient under 21 is ordinarily within the § 8.100.4.H.1.a psychiatric group, CO-2419, which keeps the month)."
derived: [not, [all, [">=", age, ma_imd_exclusion_min_age], [<, age, ma_aged_age], is_patient_in_institution_for_mental_diseases]]
sources: [S659]
implemented: engine
tags: [ma, medical, age]
rationale: "S-5 of the phase 7 review: the general IMD exclusion was read only by CHP+ (CO-705/706) and OAP health care (CO-1156), although § 8.100.3.G.1.c applies to every Medical Assistance program. No existing item states the Medicaid exclusion with its age exceptions."
