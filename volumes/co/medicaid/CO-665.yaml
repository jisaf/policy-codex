identifier: ma_ltc_trustee_fee_deduction
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: The trustee or maintenance fee deducted from this institutionalized person's monthly patient payment, when applicable - the actual fee paid, capped at $20 a month - per 10 CCR 2505-10 § 8.100.7.V.3.b.ii.5).
derived: ["min", ["max", 0, [otherwise, trustee_maintenance_fees_paid, 0]], ma_ltc_trustee_fee_monthly_cap]
