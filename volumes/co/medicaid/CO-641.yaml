id: CO-641
name: "Medicaid: LTC gross income"
identifier: ma_ltc_gross_income
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: This person's gross monthly income for Long-Term Care eligibility and patient payment purposes - all earned and unearned income, including in-kind support and maintenance and child support received, before any SSI-program deductions, exemptions or disregards - less any VA Aid and Attendance/Unusual Medical Expenses pension portion, per 10 CCR 2505-10 §§ 8.100.7.A.1 and 8.100.5.K.
precision: "Sums wages_gross, ma_self_employment_net_earnings, social_security_income, pension_income, unemployment_income, tanf_cash_income, adult_financial_cash_income, other_unearned_income_taxable, other_unearned_income_nontaxable, tax_exempt_interest, ssi_in_kind_support_and_maintenance and child_support_received; excludes the VA A&A/UME amount only when receives_va_aid_and_attendance is true. § 8.100.7.A.1 (S351) defines gross income as \"income before application of deductions, exemptions or disregards,\" and ISM is income under 42 U.S.C. 1382a(a)(2)(A) and § 8.100.5.F.5.k (S306, S311). The A&A/UME portion is left out for every person, as § 8.100.5.K's lead-in (S2900) excludes it 'when determining eligibility'; for a veteran or surviving spouse with no dependents in a State Veterans Home, ma_patient_payment (CO-658) adds it back under K.2 (ma_va_aid_and_attendance_is_patient_payment, CO-4103). Self-employment is Medicaid's own net (CO-1704, 8.100.3.K.9); the cash assistance fact was split into Colorado Works and Adult Financial grants, both still counted; SSI is not added (it was not counted before, and the LTC income test for an SSI recipient is not this item's question). No SSI-method exclusion is subtracted here, because § 8.100.7.A (S351) defines this gross income as income before the SSI program's deductions, exemptions or disregards. Final verification pass 3, pattern sweep (income methods): lottery and gambling winnings in the month received are counted (§ 8.100.5.F.1, F.4-5, F.5.i: the income rules for the \"ABD and Long Term Care Medical Programs\", S3001), unless the hardship exemption is granted (CO-2222); an unstated receipt is 0."
derived: ["max", 0, ["-", ["+", social_security_income, pension_income, wages_gross, ma_self_employment_net_earnings, unemployment_income, tanf_cash_income, adult_financial_cash_income, other_unearned_income_taxable, other_unearned_income_nontaxable, tax_exempt_interest, ssi_in_kind_support_and_maintenance, child_support_received, [case, [[otherwise, ma_lottery_winnings_hardship_exemption_granted, false], 0], [else, [otherwise, lottery_gambling_winnings_received, 0]]]], ["case", [receives_va_aid_and_attendance, va_aid_and_attendance_amount], ["else", 0]]]]
sources: [S351, S364, S306, S311, S2900, S3001]
open: [OQ-822]
implemented: engine
tags: [ma, ltc, income]
rationale: "Final verification pass 3, pattern sweep (2026-11-22): lottery and gambling winnings (§ 8.100.5.F.5.i) were left out of the gross income. No existing item states LTC's 'gross income before SSI-program deductions' rule, distinct from ma_ssi_countable_income (CO-607, batch 8), which applies the SSI disregards. ma_meets_special_income_group (CO-642) and ma_patient_payment (CO-658) need it. The target household's p1 (social security 1420 + pension 610 = 2030, no VA benefit) is the worked example in the batch report. History moved from the precision note (HCPF review S-14): Vocabulary fix round (R-1): self-employment is Medicaid's own net (CO-1704, 8.100.3.K.9); the cash assistance fact was split into Colorado Works and Adult Financial grants, both still counted; SSI is not added (it was not counted before, and the LTC income test for an SSI recipient is not this item's question). HCPF fix round (OQ-390 resolved): no SSI-method exclusion is subtracted here, because § 8.100.7.A (S351) defines this gross income as income before the SSI program's deductions, exemptions or disregards. Final verification pass 2, F2-2: the A&A/UME exclusion was cited as § 8.100.6.C; it is § 8.100.5.K (S2900), whose K.2 exception is now applied in the patient payment (CO-4103, CO-658)."
