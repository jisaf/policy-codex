id: CO-641
name: "Medicaid: LTC gross income"
identifier: ma_ltc_gross_income
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "This person's gross monthly income for Long-Term Care eligibility and patient payment purposes - all earned and unearned income, including in-kind support and maintenance and child support received, before any SSI-program deductions, exemptions or disregards (the gross unearned receipts of the SSI method, ma_ssi_gross_unearned_receipts, with gambling winnings) - not counting what is not income: a loan, an income tax refund, and the VA Aid and Attendance/Unusual Medical Expenses pension portion, per 10 CCR 2505-10 §§ 8.100.7.A.1 and 8.100.5.K."
precision: "Sums wages_gross, ma_self_employment_net_earnings, the gross unearned receipts (ma_ssi_gross_unearned_receipts, CO-5514: every receipt the SSI method's counting table treats as income, exempt receipts and child support included, and a retroactive SSI payment), ssi_in_kind_support_and_maintenance and the month's gambling winnings (ma_ssi_gambling_receipts, CO-5512) unless the hardship exemption is granted. § 8.100.7.A.1 (S351) defines gross income as \"income before application of deductions, exemptions or disregards,\" and ISM is income under 42 U.S.C. 1382a(a)(2)(A) and § 8.100.5.F.5.k (S306, S311). The A&A/UME portion (a receipt of kind va_aid_and_attendance) is left out for every person, as § 8.100.5.K's lead-in (S2900) excludes it 'when determining eligibility'; for a veteran or surviving spouse with no dependents in a State Veterans Home, ma_patient_payment (CO-658) adds it back under K.2 (ma_va_aid_and_attendance_is_patient_payment, CO-4103). A loan and an income tax refund are not income (20 CFR 416.1103(d), (f); coverage C3-10)."
derived: [max, 0, ["+", ma_ssi_gross_earned_income, ma_ssi_gross_unearned_receipts, ssi_in_kind_support_and_maintenance, [case, [[otherwise, ma_lottery_winnings_hardship_exemption_granted, false], 0], [else, ma_ssi_gambling_receipts]]]]
sources: [S351, S364, S306, S311, S2900, S3001, S2209]
implemented: engine
tags: [ma, ltc, income]
open: [OQ-822, OQ-867]
rationale: "Final verification pass 3, pattern sweep (2026-11-22): lottery and gambling winnings (§ 8.100.5.F.5.i) were left out of the gross income. No existing item states LTC's 'gross income before SSI-program deductions' rule, distinct from ma_ssi_countable_income (CO-607, batch 8), which applies the SSI disregards. ma_meets_special_income_group (CO-642) and ma_patient_payment (CO-658) need it. The target household's p1 (social security 1420 + pension 610 = 2030, no VA benefit) is the worked example in the batch report. History moved from the precision note (HCPF review S-14): Vocabulary fix round (R-1): self-employment is Medicaid's own net (CO-1704, 8.100.3.K.9); the cash assistance fact was split into Colorado Works and Adult Financial grants, both still counted; SSI is not added (it was not counted before, and the LTC income test for an SSI recipient is not this item's question). HCPF fix round (OQ-390 resolved): no SSI-method exclusion is subtracted here, because § 8.100.7.A (S351) defines this gross income as income before the SSI program's deductions, exemptions or disregards. Final verification pass 2, F2-2: the A&A/UME exclusion was cited as § 8.100.6.C; it is § 8.100.5.K (S2900), whose K.2 exception is now applied in the patient payment (CO-4103, CO-658). Coverage pass 3 C3-10: loan proceeds and tax refunds had been counted in the 300% test. Receipt records, migration phase 2 (2026-11-23): reads the receipts through the SSI method's counting table (CO-5514, CO-5512) instead of the scalar facts less the VA portion, loans and tax refunds; VA Aid and Attendance is its own receipt, stated once (va_aid_and_attendance), not a separate amount subtracted from the pension that holds it. Earned-income records, step E1 (Medicaid and CHP+): earned income is the earnings records the SSI method's counting table counts, exempt pay included (ma_ssi_gross_earned_income, CO-5171), replacing wages_gross plus ma_self_employment_net_earnings."
