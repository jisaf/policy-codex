id: CO-641
name: "Medicaid: LTC gross income"
identifier: ma_ltc_gross_income
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: This person's gross monthly income for Long-Term Care eligibility and patient payment purposes - all earned and unearned income, including in-kind support and maintenance and child support received, before any SSI-program deductions, exemptions or disregards - less any VA Aid and Attendance/Unusual Medical Expenses pension portion, per 10 CCR 2505-10 §§ 8.100.7.A.1 and 8.100.6.C.1.
precision: Sums earned_income, self_employment_net_income, social_security_income, pension_income, unemployment_income, cash_assistance_income, other_unearned_income, in_kind_support_and_maintenance and child_support_received; excludes the VA A&A/UME amount only when receives_va_aid_and_attendance is true. § 8.100.7.A.1 (S351) defines gross income as "income before application of deductions, exemptions or disregards," and ISM is income under 42 U.S.C. 1382a(a)(2)(A) and § 8.100.5.F.5.k (S306, S311); ma_ssi_countable_unearned_income (CO-606) already counts ISM as unearned income for the SSI-related test, so omitting it here would let the two income items disagree about what income is - the phase-4 review's C-14 finding. I did not find a fetched line excluding ISM or child support from LTC gross income. Does not model the 8.100.6.C.2 exception (a veteran/widow(er) with no dependents in a State Veterans Home, where the A&A/UME amount is instead used as patient payment). Does not add § 8.100.7.V.3.c's Long-Term Care insurance payments (S543), which the text excludes from income for eligibility but includes as income available for patient payment - see OQ-168.
derived: ["max", 0, ["-", ["+", social_security_income, pension_income, earned_income, self_employment_net_income, unemployment_income, cash_assistance_income, other_unearned_income, in_kind_support_and_maintenance, child_support_received], ["case", [receives_va_aid_and_attendance, va_aid_and_attendance_amount], ["else", 0]]]]
sources: [S351, S364, S306, S311, S543]
open: [OQ-168]
implemented: engine
tags: [ma, ltc, income]
rationale: "No existing item states LTC's 'gross income before SSI-program deductions' rule, distinct from ma_ssi_countable_income (CO-607, batch 8), which applies the SSI disregards. ma_meets_special_income_group (CO-642) and ma_patient_payment (CO-658) need it. The target household's p1 (social security 1420 + pension 610 = 2030, no VA benefit) is the worked example in the batch report."
tests:
  - {id: CO-641-T1, as_of: "2026-10-01", month: "2026-10", given: {social_security_income: 1420, pension_income: 610, earned_income: 0, self_employment_net_income: 0, unemployment_income: 0, cash_assistance_income: 0, other_unearned_income: 0, in_kind_support_and_maintenance: 0, child_support_received: 0, receives_va_aid_and_attendance: false, va_aid_and_attendance_amount: 0}, expect: 2030}
  - {id: CO-641-T2, as_of: "2026-10-01", month: "2026-10", given: {social_security_income: 1420, pension_income: 610, earned_income: 0, self_employment_net_income: 0, unemployment_income: 0, cash_assistance_income: 0, other_unearned_income: 0, in_kind_support_and_maintenance: 0, child_support_received: 0, receives_va_aid_and_attendance: true, va_aid_and_attendance_amount: 200}, expect: 1830}
  - {id: CO-641-T3, as_of: "2026-10-01", month: "2026-10", given: {social_security_income: 1420, pension_income: 610, earned_income: 0, self_employment_net_income: 0, unemployment_income: 0, cash_assistance_income: 0, other_unearned_income: 0, in_kind_support_and_maintenance: 150, child_support_received: 100, receives_va_aid_and_attendance: false, va_aid_and_attendance_amount: 0}, expect: 2280}
