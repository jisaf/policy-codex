id: CO-505
name: "Medicaid: meets residency requirement"
identifier: ma_meets_residency
kind: derived
type: yes/no
scope: person
program: Medicaid
meaning: Whether the person is a resident of Colorado for Medical Assistance purposes under 42 CFR 435.403 and 10 CCR 2505-10 8.100.3.B - living in Colorado and considering it their place of residence at the time of application, with no durational requirement.
precision: Reads state_of_residence directly; this volume does not model the 435.403(e)-(j) special rules for an institutionalized person incapable of indicating intent (the target household's grandmother, p1, is capable of indicating intent), so those are out of scope for this batch.
derived: [=, state_of_residence, "CO"]
sources: [S171, S172]
implemented: engine
tags: [ma, immigration, household]
rationale: "No existing item states Medicaid residency; ma_is_emergency_medicaid_only (CO-510) and batch 6's category-eligibility rules need it. Distinct from any SNAP residency test (this volume has none stated as its own item; SNAP eligibility does not turn on a parallel state_of_residence check in this batch) because 8.100.3.B's no-durational-requirement, no-fixed-address rule is Medicaid-specific text."
tests:
  - {id: CO-505-T1, as_of: "2026-10-01", given: {state_of_residence: "CO"}, expect: true}
  - {id: CO-505-T2, as_of: "2026-10-01", given: {state_of_residence: "WY"}, expect: false}
