id: CO-649
name: "Medicaid: transfer penalty period, whole months"
identifier: ma_transfer_penalty_months
kind: derived
type: whole number
scope: person
program: Medicaid
meaning: The number of whole months this person is ineligible for Long-Term Care services because of an uncompensated transfer of assets within the 60-month look-back period - the uncompensated value divided by the average regional monthly private-pay rate, with any partial month reported separately - per 42 U.S.C. 1396p(c)(1)(E) and 10 CCR 2505-10 § 8.100.7.F.2.c.i-d. Zero if the transfer was exempt.
precision: A whole number, the floor of the division in § 8.100.7.F.2.c.i; the remaining partial month is § 8.100.7.F.2.d's separate day calculation (thirty days times the decimal fractional share, rounded up), reported by ma_transfer_penalty_days (CO-659) rather than folded into this item as a fraction of a month, per the phase-4 review's C-6 finding. Does not model the penalty period's start date (8.100.7.F.2.c.ii) or the between-spouses apportionment of 8.100.7.F.8 - see OQ-94. Expressed as the negation of ceil(-x) because the pattern catalog has no floor operator.
derived: [case, [transfer_was_exempt, 0], [else, ["*", -1, ["ceil", ["*", -1, ["/", uncompensated_transfer_value_in_lookback, transfer_penalty_divisor]]]]]]
sources: [S365, S366, S379]
open: [OQ-94]
implemented: engine
tags: [ma, ltc, legal]
rationale: "No existing item states the transfer-penalty-months arithmetic. ma_ltc_financially_eligible (CO-651) and ma_ltc_eligibility_status (CO-652) need it."
tests:
  - {id: CO-649-T1, as_of: "2026-10-01", given: {uncompensated_transfer_value_in_lookback: 45000, transfer_penalty_divisor: 9000, transfer_was_exempt: false}, expect: 5}
  - {id: CO-649-T2, as_of: "2026-10-01", given: {uncompensated_transfer_value_in_lookback: 45000, transfer_penalty_divisor: 9000, transfer_was_exempt: true}, expect: 0}
  - {id: CO-649-T3, as_of: "2026-10-01", given: {uncompensated_transfer_value_in_lookback: 56500, transfer_penalty_divisor: 9000, transfer_was_exempt: false}, expect: 6}
