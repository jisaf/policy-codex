id: CO-649
name: "Medicaid: transfer penalty period, whole months"
identifier: ma_transfer_penalty_months
kind: derived
type: whole number
scope: person
program: Medicaid
meaning: "The number of whole months this person is ineligible for Long-Term Care services because of an uncompensated transfer of assets within the 60-month look-back period - the uncompensated value divided by the average regional monthly private-pay rate, with any partial month reported separately - per 42 U.S.C. 1396p(c)(1)(E) and 10 CCR 2505-10 § 8.100.7.F.2.c.i-d. Zero if the transfer was exempt."
precision: "A whole number, the floor of the division in § 8.100.7.F.2.c.i; the remaining partial month is § 8.100.7.F.2.d's separate day calculation (thirty days times the decimal fractional share, rounded up), reported by ma_transfer_penalty_days (CO-659) rather than folded into this item as a fraction of a month. The start date (8.100.7.F.2.c.ii) is transfer_penalty_period_start_date (CO-886), which ma_transfer_penalty_applies (CO-660) reads. Between institutionalized spouses (8.100.7.F.8) the division is multiplied by this person's share (ma_transfer_penalty_share_rate, CO-2235: half when apportioned) before the floor, and the months reassigned from a spouse who died or left the institution (ma_transfer_penalty_months_assigned_from_spouse, CO-2233) are added (OQ-94, resolved). Expressed as the negation of ceil(-x) because the pattern catalog has no floor operator. Blocked (OQ-1060): the divisor it reads (transfer_penalty_divisor, CO-832) rests on S1228, which is not a quotation. HCPF Operational Memo OM 25-073 (D-125), the only document that states them, could not be fetched on 2026-11-23 (hcpf.colorado.gov refused, HTTP 403; medicaid.gov, sos.state.co.us, ecfr.gov, law.cornell.edu, govinfo.gov and federalregister.gov answered but state no Colorado figure), so the item stays Draft until the memo is stored and the excerpt replaced by its quotation."
open: [OQ-1060]
derived: [case, [transfer_was_exempt, 0], [else, ["+", ["*", -1, ["ceil", ["*", -1, ["*", ma_transfer_penalty_share_rate, ["/", [+, uncompensated_transfer_value_in_lookback, [sum, [filter, [persons], [otherwise, [rel, [spouse], [P]], false]], [of, [P], uncompensated_transfer_value_in_lookback]]], transfer_penalty_divisor]]]]], ma_transfer_penalty_months_assigned_from_spouse]]]
sources: [S365, S366, S379, S1507]
implemented: engine
tags: [ma, ltc, legal]
rationale: "No existing item states the transfer-penalty-months arithmetic. ma_ltc_financially_eligible (CO-651) and ma_ltc_eligibility_status (CO-652) need it. Precision history (moved from precision, engineering follow-up pass task 5): per the phase-4 review's C-6 finding. Dual-entry audit 1.6: the couple's transfers are each spouse's own uncompensated_transfer_value_in_lookback summed once across the spouse edge (8.100.7.F: a transfer by \"the individual or the individual's spouse\"); the apportionment is ma_transfer_penalty_share_rate."
tests:
  - {id: CO-649-T1, as_of: "2026-10-01", parameters: {transfer_penalty_divisor: 9000}, given: {uncompensated_transfer_value_in_lookback: 45000, transfer_was_exempt: false, ma_transfer_penalty_is_apportioned_with_spouse: false, ma_transfer_penalty_months_assigned_from_spouse: 0}, expect: 5}
  - {id: CO-649-T4, as_of: "2026-10-01", title: "OQ-94: 5.5 months apportioned with an institutionalized spouse - 2 whole months each", parameters: {transfer_penalty_divisor: 9000}, given: {uncompensated_transfer_value_in_lookback: 49500, transfer_was_exempt: false, ma_transfer_penalty_is_apportioned_with_spouse: true, ma_transfer_penalty_months_assigned_from_spouse: 0}, expect: 2}
  - {id: CO-649-T5, as_of: "2026-10-01", title: "OQ-94: the spouse died with 2 months of the spouse's share left", parameters: {transfer_penalty_divisor: 9000}, given: {uncompensated_transfer_value_in_lookback: 49500, transfer_was_exempt: false, ma_transfer_penalty_is_apportioned_with_spouse: true, ma_transfer_penalty_months_assigned_from_spouse: 2}, expect: 4}
  - {id: CO-649-T2, as_of: "2026-10-01", parameters: {transfer_penalty_divisor: 9000}, given: {uncompensated_transfer_value_in_lookback: 45000, transfer_was_exempt: true}, expect: 0}
  - {id: CO-649-T3, as_of: "2026-10-01", parameters: {transfer_penalty_divisor: 9000}, given: {uncompensated_transfer_value_in_lookback: 56500, transfer_was_exempt: false, ma_transfer_penalty_is_apportioned_with_spouse: false, ma_transfer_penalty_months_assigned_from_spouse: 0}, expect: 6}
