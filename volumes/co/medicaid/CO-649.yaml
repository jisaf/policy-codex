id: CO-649
name: "Medicaid: transfer penalty period, whole months"
identifier: ma_transfer_penalty_months
kind: derived
type: whole number
scope: person
program: Medicaid
meaning: "The number of whole months this person is ineligible for Long-Term Care services because of uncompensated transfers of assets on or after the look-back date - the uncompensated value of the person's and the spouse's transfers (ma_uncompensated_transfers_in_lookback, CO-5325, each transfer a holdings record with its own date and the eligibility site's exemption finding) divided by the average regional monthly private-pay rate, with any partial month reported separately - per 42 U.S.C. 1396p(c)(1)(E) and 10 CCR 2505-10 § 8.100.7.F.2.c.i-d. An exempt transfer adds nothing."
precision: "A whole number, the floor of the division in § 8.100.7.F.2.c.i; the remaining partial month is § 8.100.7.F.2.d's separate day calculation (thirty days times the decimal fractional share, rounded up), reported by ma_transfer_penalty_days (CO-659) rather than folded into this item as a fraction of a month. The start date (8.100.7.F.2.c.ii) is transfer_penalty_period_start_date (CO-886), which ma_transfer_penalty_applies (CO-660) reads. Between institutionalized spouses (8.100.7.F.8) the division is multiplied by this person's share (ma_transfer_penalty_share_rate, CO-2235: half when apportioned) before the floor, and the months reassigned from a spouse who died or left the institution (ma_transfer_penalty_months_assigned_from_spouse, CO-2233) are added (OQ-94, resolved). Expressed as the negation of ceil(-x) because the pattern catalog has no floor operator. Blocked (OQ-1060): the divisor it reads (transfer_penalty_divisor, CO-832) rests on S1228, which is not a quotation. HCPF Operational Memo OM 25-073 (D-125), the only document that states them, could not be fetched on 2026-11-23 (hcpf.colorado.gov refused, HTTP 403; medicaid.gov, sos.state.co.us, ecfr.gov, law.cornell.edu, govinfo.gov and federalregister.gov answered but state no Colorado figure), so the item stays Draft until the memo is stored and the excerpt replaced by its quotation. Resource records, Medicaid track H1 (docs/reviews/records-holdings-medicaid.md): the transfers are the holdings records (CO-5300) with a disposed_date on or after the look-back date (CO-5325), in place of the undated total uncompensated_transfer_value_in_lookback (CO-824) and the one finding transfer_was_exempt (CO-825) for all of a person's transfers. An exemption is a finding about one transfer (decision D9: the record's ma_transfer_exempt), so an exempt transfer adds nothing and the person's other transfers still count; the months reassigned from a spouse are added whether or not any transfer is exempt (they were 0 for a person whose one finding was exempt, which could not tell the transfers apart)."
open: [OQ-1060]
derived: ["+", ["*", -1, [ceil, ["*", -1, ["*", ma_transfer_penalty_share_rate, ["/", ["+", ma_uncompensated_transfers_in_lookback, [sum, [filter, [persons], [otherwise, [rel, [spouse], [P]], false]], [of, [P], ma_uncompensated_transfers_in_lookback]]], transfer_penalty_divisor]]]]], ma_transfer_penalty_months_assigned_from_spouse]
sources: [S365, S366, S379, S1507, S4671]
implemented: engine
tags: [ma, ltc, legal]
rationale: "No existing item states the transfer-penalty-months arithmetic. ma_ltc_financially_eligible (CO-651) and ma_ltc_eligibility_status (CO-652) need it. Precision history (moved from precision, engineering follow-up pass task 5): per the phase-4 review's C-6 finding. Dual-entry audit 1.6: the couple's transfers are each spouse's own uncompensated_transfer_value_in_lookback summed once across the spouse edge (8.100.7.F: a transfer by \"the individual or the individual's spouse\"); the apportionment is ma_transfer_penalty_share_rate."
