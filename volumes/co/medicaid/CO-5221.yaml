rationale: "Coverage review NM-17 (parent half) and the Pickle child under 18 with ineligible parents, deferred P2s (fix round 2026-11-23): the Pickle test (ma_pickle_countable_income, CO-1158) counted no deemed parental income, so a Pickle child under 18 living with ineligible parents was tested on the child's own income only, and E.3's parent half had nothing to come off."
