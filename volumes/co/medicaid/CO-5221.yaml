P], unemployment_income], [of, [P], other_unearned_income_taxable], [of, [P], other_unearned_income_nontaxable], [of, [P], tax_exempt_interest], [otherwise, [of, [P], ssi_in_kind_support_and_maintenance], 0], [otherwise, [of, [P], lottery_gambling_winnings_received], 0]], ["+", [otherwise, [of, [P], ma_ssi_excluded_unearned_income], 0], [otherwise, [of, [P], adoption_subsidy_received], 0]]]]], ma_ssi_deeming_ineligible_child_allocation]]]]]]], ssi_earned_income_disregard_rate]]
