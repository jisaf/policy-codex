rationale: "Coverage review NM-17 (parent half) and the Pickle child under 18 with ineligible parents, deferred P2s (fix round 2026-11-23): the Pickle test (ma_pickle_countable_income, CO-1158) counted no deemed parental income, so a Pickle child under 18 living with ineligible parents was tested on the child's own income only, and E.3's parent half had nothing to come off. Receipt records, migration phase 2: the parents' unearned income from the receipts (CO-5511, CO-5512), the OASDI held at the child's loss by subtracting the increase from the current benefit (CO-5515). Earned-income records, step E1 (Medicaid and CHP+): earned income is the earnings records the SSI method's counting table counts (ma_ssi_gross_earned_income, CO-5171), replacing wages_gross plus ma_self_employment_net_earnings."
