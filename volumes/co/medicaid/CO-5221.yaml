id: CO-5221
name: "Medicaid: deeming parents' countable income for the Pickle test"
identifier: ma_pickle_deeming_parents_countable_income
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The combined countable income of this child's ma_ssi_deeming_parents for the month, figured as ma_ssi_deeming_parents_countable_income figures it (10 CCR 2505-10 § 8.100.5.H.3.b, H.4.a-b; 20 CFR 416.1165), except that each parent's OASDI is the lesser of the current benefit and the benefit when the child lost SSI (social_security_income_when_child_lost_ssi_or_oap): the parents' cost-of-living increases since the loss are disregarded (§ 8.100.6.E.3)."
precision: "The same derivation as CO-4634 with only the OASDI term changed, so a later change to one must be followed in the other (siblings): each parent's counted unearned receipts less the parent's OASDI increase since the child lost SSI (ma_social_security_receipts, CO-5515, less social_security_income_when_child_lost_ssi_or_oap). An unstated base is read as the current benefit (no increase). Coverage pass 4, non-MAGI N4-13 (decision 4 of 2026-11-23: missing information is cannot determine unless the rule says otherwise; readers do not invent defaults): the parent's Social Security when the child lost SSI is read as stated, no longer as the current benefit (a disregard of 0) when unstated; the Pickle disregard turns on it (8.100.6.D-E)."
