id: CO-646
name: "Medicaid: Community Spouse Resource Allowance (CSRA)"
identifier: ma_csra
kind: derived
type: money
scope: person
program: Medicaid
meaning: The amount of the couple's resources protected for the community spouse - the largest of (a) the couple's total resources at the § 8.100.7.L snapshot, but no more than the current CSRA maximum standard, (b) the increased CSRA of § 8.100.7.S (ma_csra_increased), and (c) an amount a court has ordered the institutionalized spouse to transfer to the community spouse - per 10 CCR 2505-10 § 8.100.7.M.1.
precision: "OQ-126 resolved: § 8.100.7.M.1 takes the largest of three amounts; (b) and (c) were added in the open-question sweep. Branch (a) gives the community spouse the couple's total resources up to the maximum, which 42 U.S.C. 1396r-5(f)(2)(A)(i) permits as a State plan standard set at the maximum (S1222): the spousal-share and minimum-standard terms never bind for such a State. § 8.100.7.M.1.a has no spousal-share (half-of-total) term and no minimum-standard floor; that shape belongs to 42 U.S.C. 1396r-5(f)(2)(A) (S371), which Colorado's fetched text does not adopt - see OQ-126. ma_csra_minimum (CO-827) is accordingly not read here. Reads ma_spousal_resources_at_snapshot (CO-888), not ssi_countable_resources_couple (CO-801): § 8.100.7.L's resource assessment is taken \"at the time of initial Medical Assistance application\" and § 8.100.7.M.1 says the CSRA is \"established at intake only,\" while CO-801 is the current-month figure § 8.100.7.O.1 tests against the CSRA each month (CO-647) - the two must be able to differ once the couple spends down."
derived: ["max", ["max", ["min", ma_csra_maximum, ma_spousal_resources_at_snapshot], ma_csra_increased], [otherwise, ma_court_ordered_transfer_to_community_spouse, 0]]
sources: [S355, S371, S1220, S1221, S1222]
implemented: engine
tags: [ma, ltc, resources, legal]
rationale: "No existing item states the CSRA formula. ma_institutionalized_spouse_countable_resources (CO-647) needs it. The target household's p1/p2 (total resources 46000, capped at the case's supplied maximum standard) is the worked example in the batch report. Precision history (moved from precision, engineering follow-up pass task 5): per the phase-4 review's C-13 finding."
tests:
  - {id: CO-646-T1, as_of: "2026-10-01", given: {ma_spousal_resources_at_snapshot: 46000, ma_csra_increased: 0}, expect: 46000}
  - {id: CO-646-T2, as_of: "2026-10-01", title: "Phase 7: capped at the 2026 CMS maximum resource standard, 162660", given: {ma_spousal_resources_at_snapshot: 400000, ma_csra_increased: 0}, expect: 162660}
  - {id: CO-646-T3, as_of: "2026-10-01", given: {ma_spousal_resources_at_snapshot: 100000, ma_csra_increased: 0}, expect: 100000}
  - {id: CO-646-T4, as_of: "2026-10-01", title: "OQ-126: (b) the increased CSRA is the largest", given: {ma_spousal_resources_at_snapshot: 400000, ma_csra_increased: 282660}, expect: 282660}
  - {id: CO-646-T5, as_of: "2026-10-01", title: "OQ-126: (c) a court-ordered transfer is the largest", given: {ma_spousal_resources_at_snapshot: 50000, ma_csra_increased: 0, ma_court_ordered_transfer_to_community_spouse: 90000}, expect: 90000}
