id: CO-646
name: "Medicaid: Community Spouse Resource Allowance (CSRA)"
identifier: ma_csra
kind: derived
type: money
scope: person
program: Medicaid
meaning: The amount of the couple's total resources protected for the community spouse - the couple's total resources at the § 8.100.7.L snapshot, but no more than the current CSRA maximum standard - per 10 CCR 2505-10 § 8.100.7.M.1.a.
precision: "Implements only § 8.100.7.M.1.a, \"the total resources of the couple but no more than the current maximum allowance\"; this is a floor on the CSRA, not a ceiling - § 8.100.7.M.1.b's increased CSRA (calculated under § 8.100.7.S when the community spouse's income remains below the MMMNA even with the full CSRA) and § 8.100.7.M.1.c's court-ordered amount can only raise it, and neither is modeled. § 8.100.7.M.1.a has no spousal-share (half-of-total) term and no minimum-standard floor; that shape belongs to 42 U.S.C. 1396r-5(f)(2)(A) (S371), which Colorado's fetched text does not adopt - see OQ-126. csra_minimum_standard (CO-827) is accordingly not read here. Reads countable_resources_couple_at_snapshot (CO-888), not countable_resources_couple (CO-801), per the phase-4 review's C-13 finding: § 8.100.7.L's resource assessment is taken \"at the time of initial Medical Assistance application\" and § 8.100.7.M.1 says the CSRA is \"established at intake only,\" while CO-801 is the current-month figure § 8.100.7.O.1 tests against the CSRA each month (CO-647) - the two must be able to differ once the couple spends down."
derived: ["min", csra_maximum_standard, countable_resources_couple_at_snapshot]
sources: [S355, S371]
open: [OQ-126]
implemented: engine
tags: [ma, ltc, resources, legal]
rationale: "No existing item states the CSRA formula. ma_institutionalized_spouse_countable_resources (CO-647) needs it. The target household's p1/p2 (total resources 46000, capped at the case's supplied maximum standard) is the worked example in the batch report."
tests:
  - {id: CO-646-T1, as_of: "2026-10-01", given: {countable_resources_couple_at_snapshot: 46000, csra_maximum_standard: 155000}, expect: 46000}
  - {id: CO-646-T2, as_of: "2026-10-01", given: {countable_resources_couple_at_snapshot: 400000, csra_maximum_standard: 155000}, expect: 155000}
  - {id: CO-646-T3, as_of: "2026-10-01", given: {countable_resources_couple_at_snapshot: 100000, csra_maximum_standard: 155000}, expect: 100000}
