  - {id: CO-616-T2, as_of: "2026-10-01", month: "2026-10", given: {ma_qdwi_meets_disability_work_history: false, ma_ssi_countable_resources: 3500, ma_ssi_household_size: 1, ma_ssi_countable_income: 2000, ma_has_full_coverage_category: false}, expect: false}
  - {id: CO-616-T3, as_of: "2026-10-01", month: "2026-10", given: {ma_qdwi_meets_disability_work_history: true, ma_ssi_countable_resources: 3500, ma_ssi_household_size: 1, ma_ssi_countable_income: 2000, ma_has_full_coverage_category: true}, expect: false}
