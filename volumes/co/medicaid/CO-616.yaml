id: CO-616
name: "Medicaid: is Qualified Disabled and Working Individual (QDWI) eligible"
identifier: ma_qdwi_eligible
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: Whether the person is eligible as a Qualified Disabled and Working Individual - previously Part-A-entitled on the basis of disability, employed, resources at or below twice the SSI resource limit, income under 200% of the federal poverty level, and not otherwise eligible for Medical Assistance - per 10 CCR 2505-10 8.100.6.O.
derived: [all, is_entitled_to_medicare_part_a_on_basis_of_disability, is_employed, [<=, ma_ssi_countable_resources, ["*", 2, [case, [[=, ma_ssi_household_size, 2], ma_ssi_resource_limit_couple], [else, ma_ssi_resource_limit_individual]]]], [<, ma_ssi_countable_income, ["*", [/, [lookup, ma_poverty_guideline_table, ma_ssi_household_size], 12], ma_qdwi_income_limit_pct]], [not, ma_is_ssi_related_eligible]]
sources: [S315]
open: [OQ-84]
implemented: engine
tags: [ma, non_magi, msp, income, resources, disability]
rationale: "No existing item states the QDWI eligibility test. ma_msp_category (CO-617) needs it. Resources compare against twice the SSI-related limit (ma_ssi_resource_limit_individual/_couple, CO-233/CO-234) per 8.100.6.O.2.c, rather than a separate literal $4,000/$6,000 parameter, so the two figures cannot drift apart if the underlying SSI limit changes."
tests:
  - {id: CO-616-T1, as_of: "2026-10-01", month: "2026-10", given: {is_entitled_to_medicare_part_a_on_basis_of_disability: true, is_employed: true, ma_ssi_countable_resources: 3500, ma_ssi_household_size: 1, ma_ssi_countable_income: 2000, ma_is_ssi_related_eligible: false}, expect: true}
  - {id: CO-616-T2, as_of: "2026-10-01", month: "2026-10", given: {is_entitled_to_medicare_part_a_on_basis_of_disability: true, is_employed: false, ma_ssi_countable_resources: 3500, ma_ssi_household_size: 1, ma_ssi_countable_income: 2000, ma_is_ssi_related_eligible: false}, expect: false}
