id: CO-616
name: "Medicaid: is Qualified Disabled and Working Individual (QDWI) eligible"
identifier: ma_qdwi_eligible
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: Whether the person is eligible as a Qualified Disabled and Working Individual - previously Part-A-entitled on the basis of disability, resources at or below twice the SSI resource limit, income under 200% of the federal poverty level, and not otherwise eligible for Medical Assistance - per 10 CCR 2505-10 8.100.6.O.
precision: "Does not test is_employed. 8.100.6.O.2.a-b's conditions describe how SSDI entitlement was lost in the past (earnings above SGA while still disabled) and that the premium-free Part A extension has been exhausted, both already carried through is_entitled_to_medicare_part_a_on_basis_of_disability (OQ-84); they are not a present-tense employment test, and § 8.100.6.O states no such test - the phase-4 review's C-12 finding. 'Not otherwise eligible for Medical Assistance' (8.100.6.O) is read as not SSI-related eligible, not MAGI-eligible, and not eligible for institutional, HCBS or PACE long-term care - the phase-4 review's C-10 finding; a person eligible under the MAGI chapter (ma_magi_eligibility_status, CO-554) or under the LTC chapter (ma_ltc_eligibility_status, CO-652) is 'otherwise eligible' just as an SSI-related-eligible person is."
derived: [all, is_entitled_to_medicare_part_a_on_basis_of_disability, [<=, ma_ssi_countable_resources, ["*", 2, [case, [[=, ma_ssi_household_size, 2], ma_ssi_resource_limit_couple], [else, ma_ssi_resource_limit_individual]]]], [<, ma_ssi_countable_income, ["*", [/, [lookup, ma_poverty_guideline_table, ma_ssi_household_size], 12], ma_qdwi_income_limit_pct]], [not, ma_is_ssi_related_eligible], [not, [=, ma_magi_eligibility_status, "eligible"]], [not, [in, ma_ltc_eligibility_status, [eligible_institutional, eligible_hcbs, eligible_pace]]]]
sources: [S315, S570, S571]
open: [OQ-84]
implemented: engine
tags: [ma, non_magi, msp, income, resources, disability]
rationale: "No existing item states the QDWI eligibility test. ma_msp_category (CO-617) needs it. Resources compare against twice the SSI-related limit (ma_ssi_resource_limit_individual/_couple, CO-233/CO-234) per 8.100.6.O.2.c, rather than a separate literal $4,000/$6,000 parameter, so the two figures cannot drift apart if the underlying SSI limit changes. Fix round: HCPF OM 25-078 (D-72, S570) confirms twice the SSI-related limit ($2,000 x 2 = $4,000 individual, $3,000 x 2 = $6,000 couple, CO-233/CO-234) reproduces its stated 2025/2026 QDWI resource figures exactly (unchanged both years); D-75 (S571) confirms the income test reproduces its 2026 QDWI income limits exactly, since QDWI's own figures do not include the $20 disregard the memo adds for QMB/SLMB/QI-1 ('The QDWI program does not include the earned income disregard'): 200% of the 2026 size-1 monthly guideline is $2,660.00, D-75's individual figure exactly."
tests:
  - {id: CO-616-T1, as_of: "2026-10-01", month: "2026-10", given: {is_entitled_to_medicare_part_a_on_basis_of_disability: true, ma_ssi_countable_resources: 3500, ma_ssi_household_size: 1, ma_ssi_countable_income: 2000, ma_is_ssi_related_eligible: false, ma_magi_eligibility_status: ineligible_income, ma_ltc_eligibility_status: not_institutionalized_or_waiver}, expect: true}
  - {id: CO-616-T2, as_of: "2026-10-01", month: "2026-10", given: {is_entitled_to_medicare_part_a_on_basis_of_disability: false, ma_ssi_countable_resources: 3500, ma_ssi_household_size: 1, ma_ssi_countable_income: 2000, ma_is_ssi_related_eligible: false, ma_magi_eligibility_status: ineligible_income, ma_ltc_eligibility_status: not_institutionalized_or_waiver}, expect: false}
  - {id: CO-616-T3, as_of: "2026-10-01", month: "2026-10", given: {is_entitled_to_medicare_part_a_on_basis_of_disability: true, ma_ssi_countable_resources: 3500, ma_ssi_household_size: 1, ma_ssi_countable_income: 2000, ma_is_ssi_related_eligible: false, ma_magi_eligibility_status: eligible, ma_ltc_eligibility_status: not_institutionalized_or_waiver}, expect: false}
  - {id: CO-616-T4, as_of: "2026-10-01", month: "2026-10", given: {is_entitled_to_medicare_part_a_on_basis_of_disability: true, ma_ssi_countable_resources: 4000, ma_ssi_household_size: 1, ma_ssi_countable_income: 2659.99, ma_is_ssi_related_eligible: false, ma_magi_eligibility_status: ineligible_income, ma_ltc_eligibility_status: not_institutionalized_or_waiver}, expect: true}
  - {id: CO-616-T5, as_of: "2026-10-01", month: "2026-10", given: {is_entitled_to_medicare_part_a_on_basis_of_disability: true, ma_ssi_countable_resources: 4000, ma_ssi_household_size: 1, ma_ssi_countable_income: 2660, ma_is_ssi_related_eligible: false, ma_magi_eligibility_status: ineligible_income, ma_ltc_eligibility_status: not_institutionalized_or_waiver}, expect: false}
