id: CO-616
name: "Medicaid: is Qualified Disabled and Working Individual (QDWI) eligible"
identifier: ma_qdwi_eligible
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: Whether the person is eligible as a Qualified Disabled and Working Individual - previously Part-A-entitled on the basis of disability, resources at or below ma_qdwi_resource_limit_rate (CO-3024) times the SSI resource limit, income under ma_qdwi_income_limit_pct (CO-241) of the federal poverty level, and not otherwise eligible for Medical Assistance - per 10 CCR 2505-10 8.100.6.O.
precision: "Does not test is_employed. 8.100.6.O.2.a-b's conditions describe how SSDI entitlement was lost in the past (earnings above SGA while still disabled) and that the premium-free Part A extension has been exhausted, both now carried through ma_qdwi_meets_disability_work_history (CO-1157), which joins continued disability with the two history facts (OQ-84); they are not a present-tense employment test, and § 8.100.6.O states no such test. 'Not otherwise eligible for Medical Assistance' (8.100.6.O) is read as not having a full-coverage Medicaid category (ma_has_full_coverage_category, CO-1176: full MAGI, SSI-related, OAP SISC B, a protected group, a Buy-In program, or institutional, HCBS or PACE long-term care). Reads ma_ssi_poverty_guideline_monthly (CO-1750) instead of restating the lookup."
derived: [all, ma_qdwi_meets_disability_work_history, [<=, ma_ssi_countable_resources, ["*", ma_qdwi_resource_limit_rate, [case, [["=", ma_ssi_household_size, 2], ssi_resource_limit_couple], [else, ssi_resource_limit_individual]]]], [<, ma_ssi_countable_income, ["*", ma_ssi_poverty_guideline_monthly, ma_qdwi_income_limit_pct]], [not, ma_has_full_coverage_category]]
sources: [S613, S315, S622]
implemented: engine
tags: [ma, non_magi, msp, income, resources, disability]
rationale: "No existing item states the QDWI eligibility test. ma_msp_category (CO-617) needs it. Resources compare against twice the SSI-related limit (ssi_resource_limit_individual/_couple, CO-233/CO-234) per 8.100.6.O.2.c, rather than a separate literal $4,000/$6,000 parameter, so the two figures cannot drift apart if the underlying SSI limit changes. History moved from the precision note (HCPF review S-14): Vocabulary fix round (U-1): reads ma_ssi_poverty_guideline_monthly (CO-1750) instead of restating the lookup. Precision history (moved from precision, engineering follow-up pass task 5): (OQ-84, resolved in phase 7); the phase-4 review's C-12 finding; the phase-4 review's C-10 finding, widened in the phase 7 fix round (S-1) to the protected groups and SISC B, which are full-benefit Medicaid."
tests:
