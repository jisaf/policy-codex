id: CO-1974
name: Medicaid community engagement status
identifier: ma_community_engagement_status
kind: derived
type: one of
options: [not_assessed, excluded, met, notice_required, notice_period, not_met]
scope: person-month
program: Medicaid
role: outcome
meaning: "The community engagement result for the person at this determination under 42 CFR 435.550-435.559: not_assessed (no application, renewal or change-in-circumstances review at this determination, including an enrolled beneficiary before the first renewal on or after the implementation date, 435.559(c)); excluded (a specified excluded individual in the determination month, so not an applicable individual, 435.551, 435.554(b)); met (at application, every month of the look-back met; at renewal or a change-in-circumstances redetermination, at least ma_community_engagement_renewal_required_months months met); notice_required (the information does not show the requirement met and no notice of noncompliance has been sent, which must precede any denial or disenrollment, 435.558(a)(1)); notice_period (a notice has been sent and the 30 days to make a satisfactory showing have not ended on the determination date, 435.558(a)(2)); or not_met (the period has ended with no satisfactory showing)."
precision: "The result is the same for every month of the determination; it is stated per month so the look-back can read each month assessed. Specified excluded status is tested in the determination month; in a look-back month it is a mandatory exception (435.553(a)(4)), so a person excluded in some look-back months and not now still meets those months. A satisfactory showing made during the notice period is new information in the facts the look-back reads, and the status is then met or excluded. OQ-413 part (4), resolved: the notice, the showing period and continued coverage of 435.558 are modeled (CO-3161 to CO-3165; ma_meets_adult_group_community_engagement_condition, CO-1975). The verification rules of 435.557 are not: notice_required is the result once the facts the case states do not show the requirement met. Part (3): the applicable individual of 435.551 is the Adults group of § 435.119 (branch (a)); branch (b), a section 1115 demonstration covering adults not otherwise eligible under the State plan, has no Colorado population (OQ-413)."
derived: [case, [["=", ma_community_engagement_review_type, none], not_assessed], [[at, ma_is_specified_excluded_individual, [det_month]], excluded], [[case, [["=", ma_community_engagement_review_type, application], [each, ma_community_engagement_review_months, [at, ma_meets_community_engagement_for_month, [month]]]], [else, [">=", [count_months, ma_community_engagement_review_months, [at, ma_meets_community_engagement_for_month, [month]]], ma_community_engagement_renewal_required_months]]], met], [[unknown, ma_community_engagement_noncompliance_notice_date], notice_required], [["<=", [det_date], ma_community_engagement_response_period_end_date], notice_period], [else, not_met]]
sources: [S1201, S1208, S1211, S1212, S2108, S2109, S2107]
effective: {from: "2027-01-01", to: present}
implemented: engine
tags: [ma, magi]
open: [OQ-410, OQ-411]
rationale: "OQ-65: one outcome states the requirement's result with its reason, for the Adults-group condition (CO-1975) and for notices (435.556(d)). OQ-413 (4), audit fix round 4: notice_required and notice_period before not_met."
tests:
  - {id: CO-1974-T1, month: "2027-03", as_of: "2027-03-01", given: {ma_community_engagement_review_type: application, ma_application_date: "2027-03-01", ma_is_specified_excluded_individual: {"2027-03": false}, ma_meets_community_engagement_for_month: {"2027-02": true}}, title: "Application, the one look-back month met", expect: met}
  - {id: CO-1974-T2, month: "2027-03", as_of: "2027-03-01", given: {ma_community_engagement_review_type: application, ma_application_date: "2027-03-01", ma_is_specified_excluded_individual: {"2027-03": false}, ma_meets_community_engagement_for_month: {"2027-02": false}}, title: "OQ-413 (4): application, look-back month not met, no notice of noncompliance sent yet", expect: notice_required}
  - {id: CO-1974-T3, month: "2027-03", as_of: "2027-03-01", given: {ma_community_engagement_review_type: application, ma_is_specified_excluded_individual: {"2027-03": true}}, title: "Excluded as a parent of a young child", expect: excluded}
  - {id: CO-1974-T4, month: "2027-09", as_of: "2027-09-15", given: {ma_community_engagement_review_type: renewal, ma_most_recent_determination_effective_date: "2027-06-01", ma_is_specified_excluded_individual: {"2027-09": false}, ma_meets_community_engagement_for_month: {"2027-06": false, "2027-07": true, "2027-08": false}}, title: "Renewal: one of three months met is enough", expect: met}
  - {id: CO-1974-T5, month: "2027-09", as_of: "2027-09-15", given: {ma_community_engagement_review_type: renewal, ma_most_recent_determination_effective_date: "2027-06-01", ma_is_specified_excluded_individual: {"2027-09": false}, ma_meets_community_engagement_for_month: {"2027-06": false, "2027-07": false, "2027-08": false}, ma_community_engagement_noncompliance_notice_date: "2027-08-02"}, title: "Renewal: no month met; the notice of August 2 was received August 7 and the showing period ended September 5", expect: not_met}
  - {id: CO-1974-T6, month: "2027-03", as_of: "2027-03-01", given: {ma_community_engagement_review_type: none}, title: "Enrolled beneficiary between reviews", expect: not_assessed}
  - {id: CO-1974-T7, month: "2027-09", as_of: "2027-09-15", title: "OQ-413 (4): renewal, no month met; notice dated September 10, the showing period runs through October 14", given: {ma_community_engagement_review_type: renewal, ma_most_recent_determination_effective_date: "2027-06-01", ma_is_specified_excluded_individual: {"2027-09": false}, ma_meets_community_engagement_for_month: {"2027-06": false, "2027-07": false, "2027-08": false}, ma_community_engagement_noncompliance_notice_date: "2027-09-10"}, expect: notice_period}
