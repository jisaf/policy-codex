id: CO-1634
name: "Medical Assistance: requires verification of a trust"
identifier: ma_requires_verification_of_trust
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether trust documents must be submitted: for a long-term care applicant who (or whose spouse) transferred assets into a trust, is a trust beneficiary, or has an income trust."
