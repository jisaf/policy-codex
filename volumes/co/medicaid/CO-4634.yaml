id: CO-4634
name: "Medicaid: deemed parents' income after allocations and disregards"
identifier: ma_ssi_deeming_parents_countable_income
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The combined income of this child's ma_ssi_deeming_parents for the month after the Ineligible Child Allocation (ma_ssi_deeming_ineligible_child_allocation, taken from unearned income first) and the standard disregards: the ssi_general_income_exclusion from unearned income, any unused part of it and the ssi_earned_income_exclusion from earned income, and one half of the earned remainder (10 CCR 2505-10 § 8.100.5.H.3.b.i-ii, H.4.a-b; 20 CFR 416.1165(a)-(b), (d)(1)-(2))."
precision: "Each parent's income is that person's income as the SSI-related method counts it (the counted unearned receipts, ma_ssi_unearned_receipts, CO-5511, with in-kind support and maintenance and winnings; wages and Medicaid's net self-employment earnings less ma_ssi_excluded_earned_income). Zero when no parent's income is deemed. Subsidized adoption funds are not deemed: § 8.100.5.F.6.t (S4041) exempts the income of the child receiving them, and the subsidy is paid for the child although received by the adoptive parent. Receipt records, migration phase 3: the subsidy is a receipt kind of its own (adoption_subsidy), which the SSI method's counting table exempts, so ma_ssi_unearned_receipts no longer holds it and it is no longer subtracted here (it was adoption_subsidy_received, CO-4451, stated inside the other non-taxable receipts). Pattern sweep, non-MAGI Medicaid (docs/reviews/pattern-sweep-nonmagi.md, P2): the SSI method's excluded earned income (ma_ssi_excluded_earned_income, CO-2471; the infrequent part, CO-4883) and in-kind support and maintenance (ssi_in_kind_support_and_maintenance, CO-802) are read as computed, required where read (decision 4 of 2026-11-23): they are unknown only where a fact they rest on is not stated (a student's school attendance, the shelter costs others pay), and no rule reads that as none; before, an unknown figure was read as 0."
derived: ["+", [max, 0, ["-", [max, 0, ["-", [sum, ma_ssi_deeming_parents, [max, 0, ["+", [of, [P], ma_ssi_unearned_receipts], [of, [P], ssi_in_kind_support_and_maintenance], [of, [P], ma_ssi_gambling_receipts]]]], ma_ssi_deeming_ineligible_child_allocation]], ssi_general_income_exclusion]], ["*", [max, 0, ["-", [max, 0, ["-", [sum, ma_ssi_deeming_parents, [max, 0, ["-", [of, [P], ma_ssi_gross_earned_income], [of, [P], ma_ssi_excluded_earned_income]]]], [max, 0, ["-", ma_ssi_deeming_ineligible_child_allocation, [sum, ma_ssi_deeming_parents, [max, 0, ["+", [of, [P], ma_ssi_unearned_receipts], [of, [P], ssi_in_kind_support_and_maintenance], [of, [P], ma_ssi_gambling_receipts]]]]]]]], ["+", ssi_earned_income_exclusion, [max, 0, ["-", ssi_general_income_exclusion, [max, 0, ["-", [sum, ma_ssi_deeming_parents, [max, 0, ["+", [of, [P], ma_ssi_unearned_receipts], [of, [P], ssi_in_kind_support_and_maintenance], [of, [P], ma_ssi_gambling_receipts]]]], ma_ssi_deeming_ineligible_child_allocation]]]]]]], ssi_earned_income_disregard_rate]]
sources: [S308, S1506, S3405, S3413]
implemented: engine
tags: [ma, non_magi, income, household]
siblings:
  - {id: CO-5221, reason: "the Pickle copy (§ 8.100.6.E.3) holds each parent's OASDI at the child's loss; every other term must stay the same"}
rationale: "Coverage review NM-10: 20 CFR 416.1165(d) and § 8.100.5.H.3.b apply the $20 and $65-plus-one-half disregards to the parents' income, after the ineligible child allocation and before the parent allocation; ma_ssi_parental_income_deemed (CO-4626) reads the result. Coverage pass 3 C3-4: the adoption subsidy is subtracted from each parent's unearned income before deeming; the first fix round's deeming (NM-10) had deemed it to the child. Receipt records, migration phase 2: each parent's unearned income is ma_ssi_unearned_receipts (CO-5511) and the winnings ma_ssi_gambling_receipts (CO-5512). Earned-income records, step E1 (Medicaid and CHP+): earned income is the earnings records the SSI method's counting table counts (ma_ssi_gross_earned_income, CO-5171), replacing wages_gross plus ma_self_employment_net_earnings."
tests:
  # Pattern sweep (P2, decision 4): the story's earners are not students under 22 and no one else pays their shelter, so the SSI method's excluded earned income and in-kind support and maintenance are stated (0); before, an unknown figure was read as 0.
  - {id: CO-4634-T1, month: "2026-10", as_of: "2026-10-12", given: {ma_ssi_excluded_earned_income: 0, ssi_in_kind_support_and_maintenance: 0, ma_ssi_deeming_parents: [p2], ma_ssi_deeming_ineligible_child_allocation: 0}, title: "X-DEEM: one parent earning 8,000: (8,000 - 20 - 65) / 2", others: {p2: {ma_ssi_excluded_earned_income: 0, ssi_in_kind_support_and_maintenance: 0, ma_self_employment_net_earnings: 0, receipts: [{kind: ssi}, {kind: child_support}, {kind: colorado_works_cash}, {kind: adult_financial_cash}], earnings: [{kind: wages, amount: 8000}, {kind: self_employment_receipts}]}}, relationships: [[child, p2]], expect: 3957.5}
  # Pattern sweep (P2, decision 4): the story's earners are not students under 22 and no one else pays their shelter, so the SSI method's excluded earned income and in-kind support and maintenance are stated (0); before, an unknown figure was read as 0.
  - {id: CO-4634-T2, month: "2026-10", as_of: "2026-10-12", given: {ma_ssi_excluded_earned_income: 0, ssi_in_kind_support_and_maintenance: 0, ma_ssi_deeming_parents: [p2, p3], ma_ssi_deeming_ineligible_child_allocation: 422}, title: "416.1165 example 4 shape: allocation beyond unearned income comes off earned income", others: {p2: {ma_ssi_excluded_earned_income: 0, ssi_in_kind_support_and_maintenance: 0, ma_self_employment_net_earnings: 0, receipts: [{kind: ssi}, {kind: pension, amount: 350}, {kind: child_support}, {kind: colorado_works_cash}, {kind: adult_financial_cash}], earnings: [{kind: self_employment_receipts}]}, p3: {ma_ssi_excluded_earned_income: 0, ssi_in_kind_support_and_maintenance: 0, ma_self_employment_net_earnings: 0, receipts: [{kind: ssi}, {kind: child_support}, {kind: colorado_works_cash}, {kind: adult_financial_cash}], earnings: [{kind: wages, amount: 1525}, {kind: self_employment_receipts}]}}, relationships: [[child, p2], [child, p3]], expect: 684}
  - {id: CO-4634-T3, month: "2026-10", as_of: "2026-10-12", given: {ma_ssi_deeming_parents: [], ma_ssi_deeming_ineligible_child_allocation: 0}, title: "no deemed parent", expect: 0}
