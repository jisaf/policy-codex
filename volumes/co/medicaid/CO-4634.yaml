id: CO-4634
name: "Medicaid: deemed parents' income after allocations and disregards"
identifier: ma_ssi_deeming_parents_countable_income
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The combined income of this child's ma_ssi_deeming_parents for the month after the Ineligible Child Allocation (ma_ssi_deeming_ineligible_child_allocation, taken from unearned income first) and the standard disregards: the ssi_general_income_exclusion from unearned income, any unused part of it and the ssi_earned_income_exclusion from earned income, and one half of the earned remainder (10 CCR 2505-10 § 8.100.5.H.3.b.i-ii, H.4.a-b; 20 CFR 416.1165(a)-(b), (d)(1)-(2))."
precision: "Each parent's income is that person's income as the SSI-related method counts it (the counted unearned receipts, ma_ssi_unearned_receipts, CO-5511, with in-kind support and maintenance and winnings; wages and Medicaid's net self-employment earnings less ma_ssi_excluded_earned_income). Zero when no parent's income is deemed. Subsidized adoption funds (adoption_subsidy_received) are not deemed: § 8.100.5.F.6.t exempts the income of the child receiving them, and the subsidy is paid for the child although stated on the adoptive parent; it has no receipt kind of its own, so it is stated inside the other non-taxable receipts and subtracted here (read as 0 when not stated)."
derived: ["+", [max, 0, ["-", [max, 0, ["-", [sum, ma_ssi_deeming_parents, [max, 0, ["-", ["+", [of, [P], ma_ssi_unearned_receipts], [otherwise, [of, [P], ssi_in_kind_support_and_maintenance], 0], [of, [P], ma_ssi_gambling_receipts]], [otherwise, [of, [P], adoption_subsidy_received], 0]]]], ma_ssi_deeming_ineligible_child_allocation]], ssi_general_income_exclusion]], ["*", [max, 0, ["-", [max, 0, ["-", [sum, ma_ssi_deeming_parents, [max, 0, ["-", ["+", [of, [P], wages_gross], [of, [P], ma_self_employment_net_earnings]], [otherwise, [of, [P], ma_ssi_excluded_earned_income], 0]]]], [max, 0, ["-", ma_ssi_deeming_ineligible_child_allocation, [sum, ma_ssi_deeming_parents, [max, 0, ["-", ["+", [of, [P], ma_ssi_unearned_receipts], [otherwise, [of, [P], ssi_in_kind_support_and_maintenance], 0], [of, [P], ma_ssi_gambling_receipts]], [otherwise, [of, [P], adoption_subsidy_received], 0]]]]]]]], ["+", ssi_earned_income_exclusion, [max, 0, ["-", ssi_general_income_exclusion, [max, 0, ["-", [sum, ma_ssi_deeming_parents, [max, 0, ["-", ["+", [of, [P], ma_ssi_unearned_receipts], [otherwise, [of, [P], ssi_in_kind_support_and_maintenance], 0], [of, [P], ma_ssi_gambling_receipts]], [otherwise, [of, [P], adoption_subsidy_received], 0]]]], ma_ssi_deeming_ineligible_child_allocation]]]]]]], ssi_earned_income_disregard_rate]]
sources: [S308, S1506, S3405, S3413]
implemented: engine
tags: [ma, non_magi, income, household]
siblings:
  - {id: CO-5221, reason: "the Pickle copy (§ 8.100.6.E.3) holds each parent's OASDI at the child's loss; every other term must stay the same"}
rationale: "Coverage review NM-10: 20 CFR 416.1165(d) and § 8.100.5.H.3.b apply the $20 and $65-plus-one-half disregards to the parents' income, after the ineligible child allocation and before the parent allocation; ma_ssi_parental_income_deemed (CO-4626) reads the result. Coverage pass 3 C3-4: the adoption subsidy is subtracted from each parent's unearned income before deeming; the first fix round's deeming (NM-10) had deemed it to the child. Receipt records, migration phase 2: each parent's unearned income is ma_ssi_unearned_receipts (CO-5511) and the winnings ma_ssi_gambling_receipts (CO-5512)."
