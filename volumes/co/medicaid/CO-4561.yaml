id: CO-4561
name: "Medicaid: household income under the premium tax credit methodology, as a share of the poverty line"
identifier: ma_premium_tax_credit_household_income_pct_fpl
kind: derived
type: rate
scope: person
program: Medicaid
meaning: "This person's household income for the calendar year of the determination as the premium tax credit methodology computes it (26 CFR 1.36B-1(e)): the expected annual income (expected_annual_income) of each taxpayer in the person's premium tax credit family (ma_premium_tax_credit_family) and of each other member of the family who is required to file a return, as a fraction of the annual federal poverty guideline for the family's size in effect on the first day of the open enrollment period before that year (1.36B-1(h))."
precision: "A taxpayer is a member not claimed as another's dependent (the filer and a spouse filing jointly); a claimed member counts only where required to file (is_required_to_file_tax_return, CO-078). The guideline is the one in force on the first day of the federal_exchange_open_enrollment_start_month before the determination's calendar year (45 CFR 155.410(e): November 1 of the preceding year), so a 2026 determination reads the 2025 guidelines, unlike the MAGI ratio, which reads the guideline in force on the determination date (ma_magi_household_income_pct_fpl, CO-504; OQ-515). Unknown where a counted member's expected annual income is not stated; the C.5 test then does not apply (CO-4564)."
derived: ["/", [sum, ma_premium_tax_credit_family, [case, [[any, [not, [of, [P], expects_to_be_claimed_as_dependent]], [of, [P], is_required_to_file_tax_return]], [of, [P], expected_annual_income]], [else, 0]]], [lookup_extended, [as_of, federal_poverty_guideline_annual_table, [first_day, [latest_month_of_year, federal_exchange_open_enrollment_start_month, [months_before, [month_of_year, [det_month]], [det_month]]]]], [count, ma_premium_tax_credit_family], [as_of, federal_poverty_guideline_annual_each_additional, [first_day, [latest_month_of_year, federal_exchange_open_enrollment_start_month, [months_before, [month_of_year, [det_month]], [det_month]]]]]]]
sources: [S3359, S3360, S3357, S3358, S1710]
implemented: engine
tags: [ma, magi, income]
open: [OQ-810, OQ-811]
rationale: "Coverage review F-05 (2026-11-22): § 8.100.4.C.5 (42 CFR 435.603(i)) finds eligible an applicant whose income under the premium tax credit methodology is below 100% of the poverty level; no item computed that income, which is annual, for the tax family, and against the guideline of the preceding open enrollment period."
tests:
  - {id: CO-4561-T1, as_of: "2026-11-10", title: "Coverage review F-05 (RV-SE): one filer expecting $11,998 for 2026, against the 2025 guideline for one ($15,650): 76.7%", given: {ma_premium_tax_credit_family: [p1], expects_to_be_claimed_as_dependent: false, expected_annual_income: 11998}, expect: 0.7666453674121405}
  - {id: CO-4561-T2, as_of: "2026-11-10", title: "Filer and a claimed teenager who is not required to file: the teenager's income is not counted; family of two ($21,150)", given: {ma_premium_tax_credit_family: [p1, p2], expects_to_be_claimed_as_dependent: false, expected_annual_income: 18000}, others: {p2: {expects_to_be_claimed_as_dependent: true, is_required_to_file_tax_return: false, expected_annual_income: 3000}}, expect: 0.851063829787234}
