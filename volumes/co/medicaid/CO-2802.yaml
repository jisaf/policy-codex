id: CO-2802
name: "Medicaid: community spouse's shelter costs"
identifier: ma_community_spouse_shelter_costs
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The community spouse's monthly shelter expenses for the excess shelter allowance of 10 CCR 2505-10 § 8.100.7.Q.1.b: the community spouse's own rent or mortgage (principal and interest), taxes and insurance, plus a condominium or cooperative's required maintenance fee, plus the larger of the standard utility allowance Colorado uses under 7 U.S.C. 2014(e) and the community spouse's actual verified utility expenses. Read from the facts of the person's spouse who does not reside in a medical institution."
precision: "The standard utility allowance is the SNAP allowance (snap_utility_allowance_amount, CO-1500) the community spouse's own SNAP household reaches under 10 CCR 2506-1 4.407.31 (OQ-560): zero when the household incurs no utility cost separate from the rent, which is also the rule's own exclusion (\"A utility allowance shall not be allowed if the utility expenses are included in the rent or maintenance charge\"). The person evaluated is the institutionalized spouse; the institutionalized spouse's own shelter facts are left out because the group keeps only spouses not residing in a medical institution."
derived: [sum, [filter, [reachable, [spouse]], [not, [of, [P], resides_in_medical_institution]]], ["+", [of, [P], shelter_cost_monthly], [otherwise, [of, [P], housing_maintenance_fee], 0], [max, [of, [P], snap_utility_allowance_amount], [otherwise, [of, [P], utility_expenses_actual], 0]]]]
sources: [S1756]
implemented: engine
tags: [ma, ltc, income]
open: [OQ-560]
accepts_from: [snap_utility_allowance_amount]
rationale: "Dual-entry audit 1.2 and 5.4 (OQ-97 finished): shelter_costs_community_spouse (CO-834, retired) stated the community spouse's own shelter costs, utility allowance included, on the institutionalized spouse, beside the community spouse's own shelter_cost_monthly, and the two disagreed in CO-01 and CO-02 (1,100 against 1,400). The rule names the SNAP standard utility allowance, so the SNAP item is read on purpose (accepts_from)."
tests:
  - {id: CO-2802-T1, title: "Community spouse pays 1,400 rent, mortgage, tax and insurance and qualifies for the heating and cooling allowance", month: "2026-10", as_of: "2026-10-01", given: {resides_in_medical_institution: true}, others: {p2: {resides_in_medical_institution: false, shelter_cost_monthly: 1400, snap_utility_allowance_amount: 616}}, relationships: [[spouse, p1, p2]], expect: 2016}
  - {id: CO-2802-T2, title: "Actual utilities above the allowance, and a condominium fee", month: "2026-10", as_of: "2026-10-01", given: {resides_in_medical_institution: true}, others: {p2: {resides_in_medical_institution: false, shelter_cost_monthly: 900, housing_maintenance_fee: 250, snap_utility_allowance_amount: 616, utility_expenses_actual: 700}}, relationships: [[spouse, p1, p2]], expect: 1850}
  - {id: CO-2802-T3, title: "Utilities included in the rent: no utility allowance", month: "2026-10", as_of: "2026-10-01", given: {resides_in_medical_institution: true}, others: {p2: {resides_in_medical_institution: false, shelter_cost_monthly: 1100, snap_utility_allowance_amount: 0, utility_expenses_actual: 0}}, relationships: [[spouse, p1, p2]], expect: 1100}
