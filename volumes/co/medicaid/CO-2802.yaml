id: CO-2802
name: "Medicaid: community spouse's shelter costs"
identifier: ma_community_spouse_shelter_costs
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The community spouse's monthly shelter expenses for the excess shelter allowance of 10 CCR 2505-10 § 8.100.7.Q.1.b: the community spouse's own rent or mortgage (principal and interest), taxes and insurance, plus a condominium or cooperative's required maintenance fee, plus the larger of the standard utility allowance Colorado uses under 7 U.S.C. 2014(e) and the community spouse's actual verified utility expenses. Read from the facts of the person's spouse who does not reside in a medical institution."
precision: "The standard utility allowance is the SNAP allowance (snap_utility_allowance_amount, CO-1500) the community spouse's own SNAP household reaches under 10 CCR 2506-1 4.407.31 (OQ-560): zero when the household incurs no utility cost separate from the rent, which is also the rule's own exclusion (\"A utility allowance shall not be allowed if the utility expenses are included in the rent or maintenance charge\"). The person evaluated is the institutionalized spouse; the institutionalized spouse's own shelter facts are left out because the group keeps only spouses not residing in a medical institution. Coverage pass 6, non-MAGI F6-10 (decision 4 of 2026-11-23: each supplied fact states once whether it is required or what its rule-given default is; readers do not invent defaults): the condominium or cooperative maintenance fee is read as stated, no longer as 0 when unstated; the actual utility expenses keep the default their fact declares (Q.1.b.ii's 'actual, verified' expenses). Coverage pass 7, non-MAGI F7-3 (docs/reviews/coverage7-medicaid-nonmagi.md): the community spouse is the person's spouse (a spouse edge to the person evaluated) who is not in a medical institution in the month (ma_resides_in_medical_institution_in_month, CO-7500), as ma_ltc_couple (CO-643) reads her; § 8.100.7.K.1 (S1754): \"A community spouse is defined as the spouse of an institutionalized spouse\". Before, the group was every person reachable over the spouse edge, the person evaluated included, not in a medical institution on the determination date, so an HCBS or PACE spouse living at home (K.2.b-c) was counted as part of the community spouse (her income, shelter and medical needs), which raised the MMMNA and the community spouse's income together and removed the increased CSRA of § 8.100.7.S (HCBS-CSRA, stored household CO-1102); and a spouse who entered a facility after a retroactive month was not the community spouse of that month although CO-643 read her as one."
derived: [sum, [filter, [persons], [all, [rel, [spouse], [P]], [not, [of, [P], ma_resides_in_medical_institution_in_month]]]], ["+", [of, [P], shelter_cost_monthly], [of, [P], housing_maintenance_fee], [max, [of, [P], snap_utility_allowance_amount], [otherwise, [of, [P], utility_expenses_actual], 0]]]]
sources: [S1756, S1754]
implemented: engine
tags: [ma, ltc, income]
open: [OQ-560]
accepts_from:
  - {from: snap_utility_allowance_amount, class: adopted_method, source: S1756}
rationale: "Dual-entry audit 1.2 and 5.4 (OQ-97 finished): shelter_costs_community_spouse (CO-834, retired) stated the community spouse's own shelter costs, utility allowance included, on the institutionalized spouse, beside the community spouse's own shelter_cost_monthly, and the two disagreed in CO-01 and CO-02 (1,100 against 1,400). The rule names the SNAP standard utility allowance, so the SNAP item is read on purpose (accepts_from)."
tests:
  - {id: CO-2802-T1, title: "Community spouse pays 1,400 rent, mortgage, tax and insurance and qualifies for the heating and cooling allowance", month: "2026-10", as_of: "2026-10-01", given: {resides_in_medical_institution: true}, others: {p2: {housing_maintenance_fee: 0, resides_in_medical_institution: false, shelter_cost_monthly: 1400, snap_utility_allowance_amount: 616}}, relationships: [[spouse, p1, p2]], expect: 2016}
  - {id: CO-2802-T2, title: "Actual utilities above the allowance, and a condominium fee", month: "2026-10", as_of: "2026-10-01", given: {resides_in_medical_institution: true}, others: {p2: {resides_in_medical_institution: false, shelter_cost_monthly: 900, housing_maintenance_fee: 250, snap_utility_allowance_amount: 616, utility_expenses_actual: 700}}, relationships: [[spouse, p1, p2]], expect: 1850}
  - {id: CO-2802-T3, title: "Utilities included in the rent: no utility allowance", month: "2026-10", as_of: "2026-10-01", given: {resides_in_medical_institution: true}, others: {p2: {housing_maintenance_fee: 0, resides_in_medical_institution: false, shelter_cost_monthly: 1100, snap_utility_allowance_amount: 0, utility_expenses_actual: 0}}, relationships: [[spouse, p1, p2]], expect: 1100}
  # Coverage pass 6 F6-10 (decision 4): Q.1.b.i (S1756) adds "in the case of a condominium or cooperative, any required maintenance fee"; not stated, the shelter costs cannot be determined (it was read as 0).
  - {id: CO-2802-T4, title: "F6-10: the maintenance fee not stated: cannot determine", month: "2026-10", as_of: "2026-10-01", given: {resides_in_medical_institution: true}, others: {p2: {resides_in_medical_institution: false, shelter_cost_monthly: 1400, snap_utility_allowance_amount: 616}}, relationships: [[spouse, p1, p2]], expect: unknown}
  # Coverage pass 7 F7-3: an HCBS spouse (K.2.c) at home with the community spouse is not the community spouse (§ 8.100.7.K.1, S1754). Her shelter: 634 + 0 + max(616, 0) = 1,250 (was 1,250 + p1's 0 + 0 + 616 = 1,866).
  - {id: CO-2802-T90, title: "F7-3: p1 on an HCBS waiver at home; only the community spouse p2's shelter costs: 634 + 616 = 1,250", month: "2026-11", as_of: "2026-11-01", given: {resides_in_medical_institution: false, shelter_cost_monthly: 0, housing_maintenance_fee: 0, snap_utility_allowance_amount: 616}, others: {p2: {resides_in_medical_institution: false, shelter_cost_monthly: 634, housing_maintenance_fee: 0, snap_utility_allowance_amount: 616}}, relationships: [[spouse, p1, p2]], expect: 1250}
