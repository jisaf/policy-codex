id: CO-612
name: "Medicaid: SSI-related category"
identifier: ma_ssi_related_category
kind: derived
type: one of
options: [ssi_recipient, aged, blind, disabled, oap_sisc_b, none]
scope: person-month
program: Medicaid
role: outcome
meaning: "The single SSI-related Aged, Blind and Disabled category this person qualifies under for the month, tested in the order 10 CCR 2505-10 8.100.6.C-8.100.6.A lists them - an SSI recipient first, then aged, blind, or disabled (in that order, for a person who independently meets both SSI standards), or none. It answers whether the criteria are met for the month; whether the month falls inside the coverage period (not before the retroactive months of § 8.100.3.E.1, and for QMB not before the effective month) is not tested here, as ma_month_is_before_coverage_period (CO-4101) tests it for the MAGI and OAP outcomes (final verification pass 3, P3-1)."
precision: "A person can meet more than one of aged/blind/disabled at once (for example, an aged blind person); this item reports the first the case order lists, matching the \"otherwise\" ordering pattern (P33) other category outcomes in this volume use (see snap_eligibility_status, CO-387). Tests [not, ma_is_ssi_related_eligible] before the receives_ssi branch - an SSI recipient who fails residency, citizenship, or (mechanically, though not for an actual SSI recipient) the income/resource standards is not SSI-related eligible, and this item's own meaning promises \"the... category this person qualifies under\", which must not name one when ma_is_ssi_related_eligible is false. An Old Age Pension recipient who meets SSI criteria except the level of income (§ 8.100.6.K.4, SISC B; ma_oap_sisc_b_eligible, CO-1177) is reported oap_sisc_b when not otherwise SSI-related eligible."
derived: [case, [ma_is_ssi_related_eligible, [case, [receives_ssi, "ssi_recipient"], [ma_is_aged, "aged"], [is_blind, "blind"], [meets_ssa_disability_criteria, "disabled"], [else, "none"]]], [ma_oap_sisc_b_eligible, "oap_sisc_b"], [else, "none"]]
sources: [S621, S665, S303]
implemented: engine
tags: [ma, non_magi, age, disability]
rationale: "No existing item reports which SSI-related category a person qualifies under as a single enumerated outcome. Needed as the batch's SSI-related outcome per the phase-4 brief's interface (role: outcome). Reads is_blind and meets_ssa_disability_criteria directly rather than through ma_is_blind/ma_is_disabled, per the phase-4 review's minor finding (fix-round C-15): those two items were single-element [all, x] wrappers with no added meaning over the supplied SSA/SSI determination, and were withdrawn (formerly CO-601, CO-602). History moved from the precision note (HCPF review S-14): Phase 7 fix round (S-3): an Old Age Pension recipient who meets SSI criteria except the level of income (§ 8.100.6.K.4, SISC B; ma_oap_sisc_b_eligible, CO-1177) is reported oap_sisc_b when not otherwise SSI-related eligible. Precision history (moved from precision, engineering follow-up pass task 5): per the phase-4 review's C-5 finding."
nearest: [CO-387]
tests:
  - {id: CO-612-T1, as_of: "2026-10-01", month: "2026-10", given: {receives_ssi: true, ma_is_ssi_related_eligible: true, ma_is_aged: false, is_blind: false, meets_ssa_disability_criteria: false}, expect: ssi_recipient}
  - {id: CO-612-T2, as_of: "2026-10-01", month: "2026-10", given: {receives_ssi: false, ma_is_ssi_related_eligible: true, ma_is_aged: true, is_blind: false, meets_ssa_disability_criteria: false}, expect: aged}
  - {id: CO-612-T3, as_of: "2026-10-01", month: "2026-10", given: {receives_ssi: false, ma_is_ssi_related_eligible: false, ma_is_aged: true, is_blind: false, meets_ssa_disability_criteria: false, ma_oap_sisc_b_eligible: false}, expect: none}
  - {id: CO-612-T4, as_of: "2026-10-01", month: "2026-10", given: {receives_ssi: false, ma_is_ssi_related_eligible: true, ma_is_aged: false, is_blind: false, meets_ssa_disability_criteria: true}, expect: disabled}
  - {id: CO-612-T5, as_of: "2026-10-01", month: "2026-10", given: {receives_ssi: true, ma_is_ssi_related_eligible: false, ma_is_aged: false, is_blind: false, meets_ssa_disability_criteria: false, ma_oap_sisc_b_eligible: false}, expect: none}
  - {id: CO-612-T6, as_of: "2026-10-01", month: "2026-10", title: "Phase 7 fix round (S-3): OAP recipient meeting SSI criteria except income - SISC B", given: {ma_is_ssi_related_eligible: false, ma_oap_sisc_b_eligible: true}, expect: oap_sisc_b}
