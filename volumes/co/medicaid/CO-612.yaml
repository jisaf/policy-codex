id: CO-612
name: "Medicaid: SSI-related category"
identifier: ma_ssi_related_category
kind: derived
type: one of
options: [ssi_recipient, aged, blind, disabled, oap_sisc_b, none]
scope: person-month
program: Medicaid
role: outcome
meaning: "The single SSI-related Aged, Blind and Disabled category this person qualifies under for the month, tested in the order 10 CCR 2505-10 8.100.6.C-8.100.6.A lists them - an SSI recipient first, then aged, blind, or disabled (in that order, for a person who independently meets both SSI standards), or none. It answers whether the criteria are met for the month; whether the month falls inside the coverage period (not before the retroactive months of § 8.100.3.E.1, and for QMB not before the effective month) is not tested here, as ma_month_is_before_coverage_period (CO-4101) tests it for the MAGI and OAP outcomes (final verification pass 3, P3-1)."
precision: "A person can meet more than one of aged/blind/disabled at once (for example, an aged blind person); this item reports the first the case order lists, matching the \"otherwise\" ordering pattern (P33) other category outcomes in this volume use (see snap_eligibility_status, CO-387). Tests [not, ma_is_ssi_related_eligible] before the receives_ssi branch - an SSI recipient who fails residency, citizenship, or (mechanically, though not for an actual SSI recipient) the income/resource standards is not SSI-related eligible, and this item's own meaning promises \"the... category this person qualifies under\", which must not name one when ma_is_ssi_related_eligible is false. An Old Age Pension recipient who meets SSI criteria except the level of income (§ 8.100.6.K.4, SISC B; ma_oap_sisc_b_eligible, CO-1177) is reported oap_sisc_b when not otherwise SSI-related eligible. Coverage pass 6, non-MAGI F6-5 (docs/reviews/coverage6-medicaid-nonmagi.md): the SSI branch reads ma_receives_ssi_in_month (CO-7351), SSI from the month of the original SSI eligibility date (10 CCR 2505-10 § 8.100.6.C.1.a, C.7, S5030), so a retroactive month before an SSI award is judged by the SSI-related tests of that month; before, receives_ssi (the award as of the determination date) made every month an SSI month."
derived: [case, [ma_is_ssi_related_eligible, [case, [ma_receives_ssi_in_month, "ssi_recipient"], [ma_abd_denied_for_noncooperation, "none"], [ma_is_aged, "aged"], [is_blind, "blind"], [[all, meets_ssa_disability_criteria, [not, ma_month_is_before_disability_onset]], "disabled"], [else, "none"]]], [[all, ma_oap_sisc_b_eligible, [not, ma_abd_denied_for_noncooperation]], "oap_sisc_b"], [else, "none"]]
sources: [S621, S665, S303, S3621, S3622, S3623, S5030]
implemented: engine
tags: [ma, non_magi, age, disability]
rationale: "No existing item reports which SSI-related category a person qualifies under as a single enumerated outcome. Needed as the batch's SSI-related outcome per the phase-4 brief's interface (role: outcome). Reads is_blind and meets_ssa_disability_criteria directly rather than through ma_is_blind/ma_is_disabled, per the phase-4 review's minor finding (fix-round C-15): those two items were single-element [all, x] wrappers with no added meaning over the supplied SSA/SSI determination, and were withdrawn (formerly CO-601, CO-602). History moved from the precision note (HCPF review S-14): Phase 7 fix round (S-3): an Old Age Pension recipient who meets SSI criteria except the level of income (§ 8.100.6.K.4, SISC B; ma_oap_sisc_b_eligible, CO-1177) is reported oap_sisc_b when not otherwise SSI-related eligible. Precision history (moved from precision, engineering follow-up pass task 5): per the phase-4 review's C-5 finding. Coverage pass 2 (first pass NM-28): denied when ma_abd_denied_for_noncooperation (CO-4886) holds (§ 8.100.5.E.6, § 8.100.7.V.2.c). An SSI recipient is not: the SSA's determination governs that Medicaid. Coverage pass 2 (first pass NM-30): the disabled arm does not hold in a month before the disability onset date (ma_month_is_before_disability_onset, CO-4888; § 8.100.5.C.4.b)."
nearest: [CO-387]
tests:
  - {id: CO-612-T1, as_of: "2026-10-01", month: "2026-10", given: {receives_ssi: true, ma_is_ssi_related_eligible: true, ma_is_aged: false, is_blind: false, meets_ssa_disability_criteria: false}, expect: ssi_recipient}
  - {id: CO-612-T2, as_of: "2026-10-01", month: "2026-10", given: {receives_ssi: false, ma_is_ssi_related_eligible: true, ma_is_aged: true, is_blind: false, meets_ssa_disability_criteria: false}, expect: aged}
  - {id: CO-612-T3, as_of: "2026-10-01", month: "2026-10", given: {receives_ssi: false, ma_is_ssi_related_eligible: false, ma_is_aged: true, is_blind: false, meets_ssa_disability_criteria: false, ma_oap_sisc_b_eligible: false}, expect: none}
  - {id: CO-612-T4, as_of: "2026-10-01", month: "2026-10", given: {receives_ssi: false, ma_is_ssi_related_eligible: true, ma_is_aged: false, is_blind: false, meets_ssa_disability_criteria: true}, expect: disabled}
  - {id: CO-612-T5, as_of: "2026-10-01", month: "2026-10", given: {receives_ssi: true, ma_is_ssi_related_eligible: false, ma_is_aged: false, is_blind: false, meets_ssa_disability_criteria: false, ma_oap_sisc_b_eligible: false}, expect: none}
  - {id: CO-612-T6, as_of: "2026-10-01", month: "2026-10", title: "Phase 7 fix round (S-3): OAP recipient meeting SSI criteria except income - SISC B", given: {ma_is_ssi_related_eligible: false, ma_oap_sisc_b_eligible: true}, expect: oap_sisc_b}
  - {id: CO-612-T90, as_of: "2026-10-01", month: "2026-10", title: "NM-28: aged and otherwise eligible, but failed to pursue potential income (E.6)", given: {receives_ssi: false, ma_is_ssi_related_eligible: true, ma_is_aged: true, is_blind: false, meets_ssa_disability_criteria: false, ma_abd_denied_for_noncooperation: true}, expect: none}
  - {id: CO-612-T91, as_of: "2026-10-01", month: "2026-10", title: "NM-28: an SSI recipient keeps SSI Medicaid", given: {receives_ssi: true, ma_is_ssi_related_eligible: true, ma_is_aged: true, is_blind: false, meets_ssa_disability_criteria: false, ma_abd_denied_for_noncooperation: true}, expect: ssi_recipient}
  - {id: CO-612-T92, as_of: "2026-11-01", month: "2026-08", title: "NM-30: a retroactive month before the disability onset", given: {receives_ssi: false, ma_is_ssi_related_eligible: true, ma_is_aged: false, is_blind: false, meets_ssa_disability_criteria: true, ma_month_is_before_disability_onset: true}, expect: none}
  - {id: CO-612-T93, as_of: "2026-11-01", month: "2026-09", title: "NM-30: the onset month", given: {receives_ssi: false, ma_is_ssi_related_eligible: true, ma_is_aged: false, is_blind: false, meets_ssa_disability_criteria: true, ma_month_is_before_disability_onset: false}, expect: disabled}
  # Coverage pass 6 F6-5 (SSI-RETRO, CO-907): SSI from 2026-10-01; in August not SSI-related eligible (resources 5,000 > 2,000) and not OAP SISC B: none (was ssi_recipient).
  - {id: CO-612-T94, as_of: "2026-11-12", month: "2026-08", title: "F6-5: no SSI recipient category before the award's eligibility date", given: {receives_ssi: true, ssi_eligibility_date: "2026-10-01", ma_is_ssi_related_eligible: false, ma_oap_sisc_b_eligible: false, ma_abd_denied_for_noncooperation: false}, expect: none}
