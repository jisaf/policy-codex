id: CO-5516
name: "Medicaid: SSI income test"
identifier: ma_ssi_income_test_status
kind: derived
type: one of
options: [met, not_met]
scope: person-month
program: Medicaid
meaning: "The SSI income test as the SSI-related groups apply it (10 CCR 2505-10 8.100.6.C.1, 8.100.6.K.3-4) and as the disabled widow(er) group starts from it: met when the person's SSI-related countable income (ma_ssi_countable_income) is at a rate of not more than the SSI Federal Benefit Rate for the SSI household size (ma_ssi_income_standard), the income test of 42 U.S.C. 1382(a)(1)(A) and (2)(A); otherwise not met. The disabled widow(er) group's test in the absence of the widow(er)'s benefits (42 U.S.C. 1383c(d)(2)) is ma_disabled_widow_meets_ssi_income_test (CO-7943), which reads this one first. Not met, first, for a child whose share of the parental income deemed to several eligible children reduces its SSI benefit to zero (ma_ssi_deeming_share_zeroes_benefit): 20 CFR 416.1165(e)(3) deems no more to such a child than brings its countable income to the Federal Benefit Rate, and says the share 'makes that child ineligible (reduces the amount to zero)'. The one statement of the test both ma_meets_ssi_income_standard (CO-609) and the disabled widow(er) group (CO-1162, through CO-7943) read, so the two cannot read the boundary two ways (T-9 hand check A-3, A-4)."
precision: "\"At a rate of not more than\" (S3950): income equal to the Federal Benefit Rate meets the test. Colorado's texts on file give the SSI-related groups and the disabled widow(er) group no comparison word of their own (S303, S319, S625), so the statute's governs both. The Disabled Adult Child and Pickle groups keep their own Colorado wording (\"below\", S626; \"less than\", S624) and do not read this item. The 416.1165(e)(3) arm is read first because the limit is the amount that brings the child's countable income to the rate itself, where \"not more than\" would otherwise meet the test; (e)(3) settles that child's case in its own words. It is false for everyone but a blind or disabled child sharing deemed parental income with another eligible child (CO-5904). Coverage pass 6, non-MAGI F6-6 (docs/reviews/coverage6-medicaid-nonmagi.md): where no income of an ineligible spouse is deemed (ma_ssi_ineligible_spouse_income_is_not_deemed, CO-7353; 20 CFR 416.1163(d)(1), S5031: 'we subtract only your own countable income from the Federal benefit rate for an individual'), the person's own countable income (ma_ssi_own_countable_income, CO-7354) is compared with the individual rate (ma_ssi_income_standard, CO-2240, then the individual rate). Before, the couple's combined income was compared with the couple rate whatever the spouse's income (INELIG-SPOUSE, CO-906). NM-KL-2 (2026-11-24; docs/reviews/known-limits.md; coverage pass 7, non-MAGI F7-10): the value met_with_oasdi_disregarded, which only the disabled widow(er) group read, compared the Disabled Adult Child figures (CO-1160, CO-7355), every current Social Security benefit taken out; 1383c(d)(2) takes out only the benefits under 42 U.S.C. 402, so the group's own test (CO-7943) reads its own figures (CO-7941, CO-7942), and this item no longer computes a figure that needs the benefit type of each Social Security receipt (CO-5000), so CO-609 never waits on it."
derived: [case, [ma_ssi_deeming_share_zeroes_benefit, not_met], [ma_ssi_ineligible_spouse_income_is_not_deemed, [case, [["<=", ma_ssi_own_countable_income, ma_ssi_income_standard], met], [else, not_met]]], [["<=", ma_ssi_countable_income, ma_ssi_income_standard], met], [else, not_met]]
sources: [S3950, S303, S319, S3416, S4080, S5031]
implemented: engine
tags: [ma, non_magi, income]
rationale: "T-9 threshold hand check (docs/reviews/t9-threshold-handcheck.md, A-3 and A-4), folded into receipts migration phase 2: CO-609 read the SSI income test as \"at or under\" and CO-1162 as \"under\" for the same \"would be eligible for SSI\" test; one item now states it, settled by the governing text (42 U.S.C. 1382(a), S3950). Coverage review, 416.1165(e)(3) fill-up (2026-11-23): a child held to its deeming limit has countable income equal to the rate; without the first arm the test would read it as met, against (e)(3)."
tests:
  - {id: CO-5516-T1, month: "2026-10", as_of: "2026-10-01", given: {ma_ssi_ineligible_spouse_income_is_not_deemed: false, ma_ssi_deeming_share_zeroes_benefit: false, ma_ssi_countable_income: 994, ma_ssi_income_standard: 994}, title: "T-9: countable income equal to the Federal Benefit Rate meets the test (\"not more than\", S3950)", expect: met}
  - {id: CO-5516-T2, month: "2026-10", as_of: "2026-10-01", given: {ma_ssi_ineligible_spouse_income_is_not_deemed: false, ma_ssi_deeming_share_zeroes_benefit: false, ma_ssi_countable_income: 1400, ma_ssi_income_standard: 994}, title: "NM-KL-2: 1,400 > 994: not met; the disabled widow(er) test with the 402 benefits taken out is CO-7943 (was met_with_oasdi_disregarded here)", expect: not_met}
  - {id: CO-5516-T3, month: "2026-10", as_of: "2026-10-01", given: {ma_ssi_ineligible_spouse_income_is_not_deemed: false, ma_ssi_deeming_share_zeroes_benefit: false, ma_ssi_countable_income: 995, ma_ssi_income_standard: 994}, title: "One dollar over the rate: not met", expect: not_met}
  - {id: CO-5516-T4, month: "2026-10", as_of: "2026-10-12", given: {ma_ssi_deeming_share_zeroes_benefit: true, ma_ssi_countable_income: 994, ma_ssi_income_standard: 994}, title: "416.1165(e)(3): a child held to its deeming limit has countable income equal to the rate (1,014 deemed - 20 = 994), and its share of the parents' income makes it ineligible", expect: not_met}
  # Coverage pass 6 F6-6 (INELIG-SPOUSE, CO-906): no income deemed; own countable income 1,100 - 20 = 1,080 > 994 (the individual rate, S5031): not_met (the couple's 1,080 <= 1,491 had met it). With own 980: met.
  - {id: CO-5516-T90, month: "2026-11", as_of: "2026-11-20", title: "F6-6: own income 1,080 against the individual rate 994: not met", given: {ma_ssi_deeming_share_zeroes_benefit: false, ma_ssi_ineligible_spouse_income_is_not_deemed: true, ma_ssi_own_countable_income: 1080, ma_ssi_countable_income: 1080, ma_ssi_income_standard: 994}, expect: not_met}
  - {id: CO-5516-T91, month: "2026-11", as_of: "2026-11-20", title: "F6-6: own income 980 against the individual rate 994: met", given: {ma_ssi_deeming_share_zeroes_benefit: false, ma_ssi_ineligible_spouse_income_is_not_deemed: true, ma_ssi_own_countable_income: 980, ma_ssi_countable_income: 1500, ma_ssi_income_standard: 994}, expect: met}
  # Own income 1,080 over the individual rate: not met. NM-KL-2: the figure with Social Security disregarded is no longer this test's; the disabled widow(er) group reads its own (CO-7943-T4); before, 80 <= 994 gave met_with_oasdi_disregarded here.
  - {id: CO-5516-T92, month: "2026-11", as_of: "2026-11-20", title: "F6-6, NM-KL-2: own income 1,080 > 994: not met (was met_with_oasdi_disregarded, the Social Security disregarded, 80)", given: {ma_ssi_deeming_share_zeroes_benefit: false, ma_ssi_ineligible_spouse_income_is_not_deemed: true, ma_ssi_own_countable_income: 1080, ma_ssi_income_standard: 994}, expect: not_met}
