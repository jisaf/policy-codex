id: CO-5516
name: "Medicaid: SSI income test"
identifier: ma_ssi_income_test_status
kind: derived
type: one of
options: [met, met_with_oasdi_disregarded, not_met]
scope: person-month
program: Medicaid
meaning: "The SSI income test as the SSI-related groups apply it (10 CCR 2505-10 8.100.6.C.1, 8.100.6.K.3-4) and as 42 U.S.C. 1383c(d) applies it to a disabled widow(er) \"in the absence of\" the Social Security benefit: met when the person's SSI-related countable income (ma_ssi_countable_income) is at a rate of not more than the SSI Federal Benefit Rate for the SSI household size (ma_ssi_income_standard), the income test of 42 U.S.C. 1382(a)(1)(A) and (2)(A); met with OASDI disregarded when it is not, but the countable income with the current Social Security benefit disregarded (ma_dac_countable_income) is; otherwise not met. The one statement of the test both ma_meets_ssi_income_standard (CO-609) and ma_disabled_widow_eligible (CO-1162) read, so the two cannot read the boundary two ways (T-9 hand check A-3, A-4)."
precision: "\"At a rate of not more than\" (S3950): income equal to the Federal Benefit Rate meets the test. Colorado's texts on file give the SSI-related groups and the disabled widow(er) group no comparison word of their own (S303, S319, S625), so the statute's governs both. The Disabled Adult Child and Pickle groups keep their own Colorado wording (\"below\", S626; \"less than\", S624) and do not read this item."
derived: [case, [["<=", ma_ssi_countable_income, ma_ssi_income_standard], met], [["<=", ma_dac_countable_income, ma_ssi_income_standard], met_with_oasdi_disregarded], [else, not_met]]
sources: [S3950, S303, S319, S3416]
implemented: engine
tags: [ma, non_magi, income]
rationale: "T-9 threshold hand check (docs/reviews/t9-threshold-handcheck.md, A-3 and A-4), folded into receipts migration phase 2: CO-609 read the SSI income test as \"at or under\" and CO-1162 as \"under\" for the same \"would be eligible for SSI\" test; one item now states it, settled by the governing text (42 U.S.C. 1382(a), S3950)."
tests:
  - {id: CO-5516-T1, month: "2026-10", as_of: "2026-10-01", given: {ma_ssi_countable_income: 994, ma_dac_countable_income: 0, ma_ssi_income_standard: 994}, title: "T-9: countable income equal to the Federal Benefit Rate meets the test (\"not more than\", S3950)", expect: met}
  - {id: CO-5516-T2, month: "2026-10", as_of: "2026-10-01", given: {ma_ssi_countable_income: 1400, ma_dac_countable_income: 994, ma_ssi_income_standard: 994}, title: "T-9: with the Social Security benefit disregarded, income equal to the rate meets it (A-4)", expect: met_with_oasdi_disregarded}
  - {id: CO-5516-T3, month: "2026-10", as_of: "2026-10-01", given: {ma_ssi_countable_income: 1400, ma_dac_countable_income: 995, ma_ssi_income_standard: 994}, title: "Over the rate either way", expect: not_met}
