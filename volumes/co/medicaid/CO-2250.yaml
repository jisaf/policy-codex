id: CO-2250
name: "Medicaid: meets the residency requirement"
identifier: ma_meets_residency
kind: derived
type: yes/no
scope: person
program: Medicaid
meaning: "Whether the person is a resident of Colorado for Medical Assistance (10 CCR 2505-10 § 8.100.3.B.2-5; 42 CFR 435.403): a person living in Colorado who considers it the place of residence, including one temporarily absent who intends to return (is_colorado_resident); or, for a person in an institution who is incapable of indicating intent, Colorado is the state of residence the institutional rules give (ma_institutionalized_state_of_residence)."
precision: "Medicaid status by month (2026-11-24, docs/reviews/medicaid-status-by-month.md, MS-1): the residency of the determination date; every month-scoped Medicaid item reads ma_meets_residency_in_month (CO-7650), which adds, for a month before the application month, that the person lived in Colorado in it (state_of_residence_start_date, CO-7651). state_of_residence, which is_colorado_resident reads, is the state the person lives in and intends to remain in, so a person temporarily absent with intent to return (B.4) is stated with Colorado and a person who intends to return to a home outside Colorado (§ 8.100.5.M.2.a.iii) is not. Federal residency for a person receiving a State supplementary payment (the paying State, 435.403(f)) and for a title IV-E child (the State where the child lives, 435.403(g)) is not restated by Colorado and not modeled. Coverage pass 6, C6-05(a) (2026-11-24): where neither state_of_residence nor county_of_residence is stated, residence cannot be determined (decision 4 of 2026-11-23: no rule makes an unstated residence a non-resident); before, is_colorado_resident (CO-505) read it as not a resident, so the MAGI outcomes and family planning reported ineligible_residency (CO-226 without state_of_residence). is_colorado_resident itself, shared with other programs, is unchanged; every Medicaid category reads residency through this item, so the non-MAGI categories that read it get the same answer (8.100.3.B governs them all)."
derived: [case, [[all, [otherwise, ma_is_incapable_of_indicating_intent, false], resides_in_medical_institution], ["=", ma_institutionalized_state_of_residence, colorado_state_code]], [[any, is_colorado_resident, [not, [all, [unknown, state_of_residence], [unknown, county_of_residence]]]], is_colorado_resident], [else, ["=", state_of_residence, colorado_state_code]]]
sources: [S1518]
implemented: engine
tags: [ma]
open: [OQ-472, OQ-1425, OQ-1445]
rationale: "OQ-393: is_colorado_resident states residence in the state only; Medicaid's own rules for institutionalized persons who cannot indicate intent were not modeled. Medicaid's eligibility items now read this item."
tests:
  - {id: CO-2250-T1, as_of: "2026-10-01", title: "Lives in Colorado", given: {state_of_residence: CO}, expect: true}
  - {id: CO-2250-T2, as_of: "2026-10-01", title: "Lives in Wyoming", given: {state_of_residence: WY}, expect: false}
  - {id: CO-2250-T3, as_of: "2026-10-01", title: "Nursing facility resident in Colorado, incapable of indicating intent since an injury at 70, placed by no state", given: {ma_is_incapable_of_indicating_intent: true, resides_in_medical_institution: true, ma_was_placed_in_institution_by_a_state: false, date_of_birth: "1950-01-01", ma_became_incapable_of_indicating_intent_before_age_twenty_one: false, ma_institution_state: CO, state_of_residence: WY}, expect: true}
  - {id: CO-2250-T4, as_of: "2026-10-01", title: "Placed in a Colorado facility by Nebraska", given: {ma_is_incapable_of_indicating_intent: true, resides_in_medical_institution: true, ma_was_placed_in_institution_by_a_state: true, ma_institutional_placement_arranging_state: NE, ma_institution_state: CO}, expect: false}
  - {id: CO-2250-T5, as_of: "2026-11-10", title: "C6-05(a): neither the state nor the county of residence stated: cannot determine (was false through is_colorado_resident, so ineligible_residency)", given: {}, expect: unknown}
  - {id: CO-2250-T6, as_of: "2026-11-10", title: "C6-05(a): the state not stated, a Colorado county stated: resident (is_colorado_resident reads the county)", given: {county_of_residence: denver}, expect: true}
