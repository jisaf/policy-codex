id: CO-658
name: "Medicaid: patient payment"
identifier: ma_patient_payment
kind: derived
type: money
scope: person-month
program: Medicaid
role: outcome
meaning: "The amount of an institutionalized person's income applied monthly to the cost of Long-Term Care institution care, once they have been determined eligible for Medical Assistance - gross income minus the personal needs allowance, the community spouse monthly income allowance, the family allowance and deductible health insurance premiums, floored at zero, or 0 for a person who is not institutionalized or who has not been determined financially eligible for LTC - per 10 CCR 2505-10 §§ 8.100.7.T.1 and 8.100.7.V.3.b and 42 CFR 435.725(c)."
precision: "Deducts ma_personal_needs_allowance (CO-1987), which is the veterans-related $90 allowance for a resident who qualifies for it, otherwise the base allowance (ma_personal_needs_allowance_institutional, CO-887, a dated parameter since the open-question sweep; OQ-98 and OQ-212 resolved). Omits 8.100.7.T.1.d's \"allowable deductions identified in section 8.100.7.V\" beyond health insurance premiums (the Home Maintenance Allowance, trustee/maintenance fees, mandatory tax withholding and Medicare Part B/D premium deductions are not separately modeled). The community spouse income allowance term is included only when ma_ltc_couple is true. For a person with an income trust the income applied is the trust's monthly distribution (ma_income_trust_distribution, CO-2238: the income transferred in less at most $20 retained for trust expenses; OQ-96). The trust rule lists only the personal needs allowance, spousal income payments and approved PETI payments as deductions from the distribution; the family allowance is still deducted, because 42 U.S.C. 1396r-5(d)(1) requires it for every institutionalized spouse (OQ-471). § 8.100.7.T.1 makes the deductions only \"during each month after the institutionalized spouse becomes Medical Assistance eligible,\" and § 8.100.7.V.3.b only \"once an applicant ... has been determined eligible for Medical Assistance\"; the outcome's type is money, so a person who is not institutionalized, or who is institutionalized but not yet (or no longer) financially eligible for LTC, reports 0 rather than \"not applicable.\""
derived: [case, [[not, [all, ma_is_institutionalized, ma_ltc_financially_eligible]], 0], [else, ["max", 0, ["-", [case, [has_income_trust, ma_income_trust_distribution], [else, ma_ltc_gross_income]], ["+", ma_personal_needs_allowance, ["case", [ma_ltc_couple, ma_community_spouse_income_allowance], ["else", 0]], ma_family_allowance, health_insurance_premiums_paid]]]]]
sources: [S360, S361, S374, S1508]
open: [OQ-471, OQ-519, OQ-520]
implemented: engine
tags: [ma, ltc, income]
rationale: "No existing item computes patient payment. Named directly by the phase-4 brief's interface as role: outcome. The target household's p1 (2030 minus the personal needs allowance, minus the spouse allowance, no family allowance or premiums, once eligible) is the worked example in the batch report. Gated on ma_is_institutionalized and ma_ltc_financially_eligible per the phase-4 review's C-3 finding: § 8.100.7.T.1 and § 8.100.7.V.3.b compute a patient payment only after eligibility, and the ungated formula previously reported a payment for the community spouse and for an ineligible applicant."
nearest: [CO-621]
