id: CO-658
name: "Medicaid: patient payment"
identifier: ma_patient_payment
kind: derived
type: money
scope: person-month
program: Medicaid
role: outcome
meaning: The amount of an institutionalized person's income applied monthly to the cost of Long-Term Care institution care, once they have been determined eligible for Medical Assistance - gross income minus the personal needs allowance, the community spouse monthly income allowance, the family allowance and deductible health insurance premiums, floored at zero, or 0 for a person who is not institutionalized or who has not been determined financially eligible for LTC - per 10 CCR 2505-10 §§ 8.100.7.T.1 and 8.100.7.V.3.b and 42 CFR 435.725(c).
precision: Uses the non-veteran base personal needs allowance (ma_personal_needs_allowance_institutional, CO-373, a parameter since the fix round that fetched D-69's 2026 figure - formerly CO-887, a supplied fact per OQ-91), not the veterans-related $90 allowance (OQ-98). Now includes § 8.100.7.V.3.b.ii.4)-8)'s remaining stated deductions - the Home Maintenance Allowance (ma_home_maintenance_allowance, CO-664), trustee/maintenance fees capped at $20 (ma_ltc_trustee_fee_deduction, CO-665), mandatory income tax withheld (ma_mandatory_tax_withholding_deduction, CO-666), mandatory garnishments repaying a federal assistance overpayment (ma_mandatory_garnishment_deduction, CO-667), and Medicare Part B for the first two months and Part D on an ongoing basis (ma_medicare_part_b_ltc_deduction, CO-668, ma_medicare_part_d_ltc_deduction, CO-669) - per the phase-4 review's G-2 finding, which named these as stated rules that could be authored now. Does not add § 8.100.7.V.3.c's Long-Term Care insurance payments (S543, income for patient payment though not for eligibility - see OQ-168) or § 8.100.7.B.3's Alternative Care Facility room-and-board cap (S544 - see OQ-169). The community spouse income allowance term is included only when ma_ltc_couple is true. § 8.100.7.T.1 makes the deductions only "during each month after the institutionalized spouse becomes Medical Assistance eligible," and § 8.100.7.V.3.b only "once an applicant ... has been determined eligible for Medical Assistance"; the outcome's type is money, so a person who is not institutionalized, or who is institutionalized but not yet (or no longer) financially eligible for LTC, reports 0 rather than "not applicable."
derived: [case, [[not, [all, ma_is_institutionalized, ma_ltc_financially_eligible]], 0], [else, ["max", 0, ["-", ma_ltc_gross_income, ["+", ma_personal_needs_allowance_institutional, ["case", [ma_ltc_couple, ma_community_spouse_income_allowance], ["else", 0]], ma_family_allowance, health_insurance_premiums_paid, ma_home_maintenance_allowance, ma_ltc_trustee_fee_deduction, ma_mandatory_tax_withholding_deduction, ma_mandatory_garnishment_deduction, ma_medicare_part_b_ltc_deduction, ma_medicare_part_d_ltc_deduction]]]]]
sources: [S360, S361, S374, S540, S541, S542, S543, S544, S563]
open: [OQ-98, OQ-168, OQ-169]
implemented: engine
tags: [ma, ltc, income]
rationale: "No existing item computes patient payment. Named directly by the phase-4 brief's interface as role: outcome. The target household's p1 (2030 minus the personal needs allowance, minus the spouse allowance, no family allowance or premiums, once eligible) is the worked example in the batch report. Gated on ma_is_institutionalized and ma_ltc_financially_eligible per the phase-4 review's C-3 finding: § 8.100.7.T.1 and § 8.100.7.V.3.b compute a patient payment only after eligibility, and the ungated formula previously reported a payment for the community spouse and for an ineligible applicant."
nearest: [CO-621]
