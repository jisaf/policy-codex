id: CO-658
name: "Medicaid: patient payment"
identifier: ma_patient_payment
kind: derived
type: money
scope: person-month
program: Medicaid
role: outcome
meaning: "The amount of an institutionalized person's income applied monthly to the cost of Long-Term Care institution care, once they have been determined eligible for Medical Assistance (10 CCR 2505-10 §§ 8.100.7.T.1 and 8.100.7.V.3.b-i; 42 CFR 435.725(c)): the income left after the personal needs allowance and the earned income reserve (ma_patient_payment_available_income, CO-3616), less the community spouse monthly income allowance, the family allowance, the Home Maintenance Allowance (CO-3618), mandatory income tax withheld, garnishments repaying a federal assistance overpayment, the Medicare Part B premium the person pays in the first ma_nf_part_b_premium_deduction_months months in the Nursing Facility and the Medicare Part D premium, floored at zero, plus any Long-Term Care insurance benefits for the month and, for a veteran or surviving spouse of a veteran with no dependents in a State Veterans Home, the VA pension's Aid and Attendance and Unusual Medical Expenses portion (§ 8.100.5.K.2); or 0 for a person who is not institutionalized or who has not been determined financially eligible for LTC."
precision: "Deducts ma_personal_needs_allowance (CO-1987), which is the veterans-related $90 allowance for a resident who qualifies for it, otherwise the base allowance (ma_personal_needs_allowance_institutional, CO-887, OQ-98 and OQ-212 resolved), and the $65 plus one-half earned income reserve, inside CO-3616. The community spouse income allowance term is included only when ma_ltc_couple is true and the institutionalized spouse does not refuse to make it available (ma_institutionalized_spouse_refuses_income_allowance, CO-1949): § 8.100.7.T.1.b deducts the allowance 'only to the extent that income of the institutionalized spouse is actually made available', and T.1.e applies income not made available to the cost of care (coverage review NM-14). An allowance made available in part is read as made available. The deductions follow § 8.100.7.V.3.b.ii in full: 1) the personal needs allowance; 2) the monthly income allowance; 3) the family allowance; 4) the Home Maintenance Allowance; 5) trustee fees, which are the up-to-$20 a month retained by an income trust (ma_income_trust_distribution, CO-2238, OQ-96), so they are inside the distribution; 6) mandatory income tax withheld (V.3.d.iv); 7) garnishments repaying a federal assistance overpayment; 8.a) the Medicare Part B premium only for the first and second month in the Nursing Facility, counted from the month of institution_entry_date (V.3.b.ii.8.a and V.1.e.i, 'the first two months of admission'; V.1.e.ii says 'the first two months of Long-Term Care institution eligibility', OQ-721), and not when the State already pays it through the Medicare Buy-In, which medicare_part_b_premium_paid states as 0 (V.1.e.ii; OQ-520, resolved); 8.b) the Part D premium in every month; 8.c) other medical and remedial expenses go through NF PETI and are not deducted, so other health insurance premiums (health_insurance_premiums_paid less Parts B and D) are not deducted here. SSI paid to the institutionalized person is outside ma_ltc_gross_income (V.3.i.ii). The VA Aid and Attendance and Unusual Medical Expenses portion, which ma_ltc_gross_income (CO-641) leaves out, is added back after the floor at zero when ma_va_aid_and_attendance_is_patient_payment (CO-4103) is true: § 8.100.5.K.2 says the portion 'shall be used as patient payment to the medical facility', so it is not reduced by the deductions, which are taken from the person's other income; under K.1.a-b it is not used. Long-Term Care insurance benefits are added after the floor at zero (V.3.c.i.1 and b: with no income left, only the insurance payment is used); V.3.c.i.1.a's order of application when the total exceeds the cost of care is the facility's, and no cost-of-care fact is read. For a person with an income trust the income applied is the trust's monthly distribution; the trust rule lists only the personal needs allowance, spousal income payments and approved PETI payments as deductions from the distribution; the family allowance is still deducted, because 42 U.S.C. 1396r-5(d)(1) requires it for every institutionalized spouse (OQ-471). § 8.100.7.T.1 makes the deductions only \"during each month after the institutionalized spouse becomes Medical Assistance eligible,\" and § 8.100.7.V.3.b only \"once an applicant... has been determined eligible for Medical Assistance\"; the outcome's type is money, so a person who is not institutionalized, or who is institutionalized but not yet (or no longer) financially eligible for LTC, reports 0 rather than \"not applicable.\" A resident's private health insurance premium is a Nursing Facility PETI-IME expense, prior authorized (§ 8.482.33.A, C.1-2, S3008), which V.3.b.ii.8.c leaves out of the patient payment deductions (final verification pass 3, P3-3). Income the eligibility site leaves out because it was committed elsewhere in the admission month, or is needed for living expenses in the discharge month (§ 8.100.7.V.4.a.iii-vi; ma_patient_payment_income_committed_elsewhere, CO-4638), is deducted before the floor (coverage review NM-29). Blocked (OQ-1060): the personal needs allowance it deducts (CO-1987, CO-887) rests on S1228, which is not a quotation. HCPF Operational Memo OM 25-073 (D-125), the only document that states them, could not be fetched on 2026-11-23 (hcpf.colorado.gov refused, HTTP 403; medicaid.gov, sos.state.co.us, ecfr.gov, law.cornell.edu, govinfo.gov and federalregister.gov answered but state no Colorado figure), so the item stays Draft until the memo is stored and the excerpt replaced by its quotation."
statute_override: "Federal law overrides the deduction list of 10 CCR 2505-10 § 8.100.7's income trust rule (6.a.i.c), which names only the personal needs allowance, spousal income and PETI payments: 42 U.S.C. 1396r-5(d)(1) requires the family allowance for an institutionalized spouse's dependent family members, which the rule's first sentence also allows, so a trust user keeps it (OQ-471)."
derived: [case, [[not, [all, ma_is_institutionalized, ma_ltc_financially_eligible]], 0], [else, ["+", [max, 0, ["-", ma_patient_payment_available_income, ["+", [case, [[all, ma_ltc_couple, [not, [otherwise, ma_institutionalized_spouse_refuses_income_allowance, false]]], ma_community_spouse_income_allowance], [else, 0]], ma_family_allowance, ma_home_maintenance_allowance, [otherwise, mandatory_income_tax_withheld, 0], [otherwise, garnishment_repaying_federal_assistance_overpayment, 0], [case, [["<=", [otherwise, medicare_part_b_premium_paid, 0], 0], 0], [["<=", [month], [months_after, ["-", ma_nf_part_b_premium_deduction_months, 1], [month_of, institution_entry_date]]], medicare_part_b_premium_paid], [else, 0]], [otherwise, medicare_part_d_premium_paid, 0], [otherwise, ma_patient_payment_income_committed_elsewhere, 0]]]], [otherwise, long_term_care_insurance_benefits_received, 0], [case, [ma_va_aid_and_attendance_is_patient_payment, ma_va_aid_and_attendance_receipts], [else, 0]]]]]
sources: [S360, S361, S374, S1508, S2400, S2401, S2402, S2403, S2404, S2405, S2900, S3008, S3410, S3420]
