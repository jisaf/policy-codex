open: [OQ-471, OQ-519, OQ-721, OQ-1060]
rationale: "No existing item computes patient payment. Named directly by the phase-4 brief's interface as role: outcome. The target household's p1 (2030 minus the personal needs allowance, minus the spouse allowance, no family allowance or premiums, once eligible) is the worked example in the batch report. Gated on ma_is_institutionalized and ma_ltc_financially_eligible per the phase-4 review's C-3 finding: § 8.100.7.T.1 and § 8.100.7.V.3.b compute a patient payment only after eligibility, and the ungated formula previously reported a payment for the community spouse and for an ineligible applicant. Precision history (moved from precision, engineering follow-up pass task 5): (ma_personal_needs_allowance_institutional, CO-887, a dated parameter since the open-question sweep; OQ-98 and OQ-212 resolved). Legal UX walkthrough L3 (audit fix round 4): the departure from the rule text now carries its statute_override note. Tagged legal. Final verification F-3 (2026-11-22): the formula deducted every health insurance premium in every month and none of the other § 8.100.7.V.3.b.ii deductions, and did not add Long-Term Care insurance; it now follows V.3.b-i in full (earned income reserve, Home Maintenance Allowance, mandatory income tax, garnishments, Part B for the first two months only and not under the Buy-In, Part D, and Long-Term Care insurance added). OQ-520 is resolved by V.1.e and V.3.b.ii.8 (P2-1). Final verification pass 2, F2-2: the VA Aid and Attendance and Unusual Medical Expenses portion never entered the patient payment; § 8.100.5.K.2 (S2900) uses it for a veteran or surviving spouse with no dependents in a State Veterans Home (CO-4103). P2-1: the two texts that count the Part B months are recorded as OQ-721. Receipt records, migration phase 2 (2026-11-23): the VA Aid and Attendance portion added back under § 8.100.5.K.2 is the receipts of that kind (ma_va_aid_and_attendance_receipts, CO-5530) instead of va_aid_and_attendance_amount."
