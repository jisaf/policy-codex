id: CO-6061
name: "Medicaid Pickle: the child's share of the deemed income would reduce its benefit to zero"
identifier: ma_pickle_deeming_share_zeroes_benefit
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "For the Pickle test, whether this child is a blind or disabled child who shares the deemed income of ineligible parents with at least one other eligible child (ma_ssi_deeming_children) and whose share of the Pickle parental income to be deemed (ma_pickle_parental_income_to_be_deemed), once each child sharing it has been given no more than reduces its SSI benefit to zero and the rest has gone to the others (20 CFR 416.1165(e)(2)-(3)), would reduce this child's benefit to zero: that income is more than the sum, over the children, of the lesser of each child's limit and this child's Pickle limit (ma_pickle_deeming_benefit_zero_amount), this child's own term being its Pickle limit and each other child's its SSI-related limit (ma_ssi_deeming_benefit_zero_amount)."
precision: "Sibling of ma_ssi_deeming_share_zeroes_benefit (CO-5904) (duplicate-paths audit D-M3). Written as the SSI sum at this child's SSI limit with this child's own term replaced: sum over the children of min(each child's SSI limit, this child's Pickle limit), less min(this child's SSI limit, its Pickle limit), plus its Pickle limit. It reads this child as one of the children sharing the income, as CO-5904 does. Coverage pass 4, non-MAGI N4-13 (decision 4 of 2026-11-23: missing information is cannot determine unless the rule says otherwise; readers do not invent defaults): the child's blindness and disability are read as stated, no longer as no when unstated. Pattern sweep, non-MAGI Medicaid (docs/reviews/pattern-sweep-nonmagi.md, P1): disability is read in the month: not in a month before the disability onset (ma_month_is_before_disability_onset, CO-4888; the onset is 'the date on which the person's disability began', CO-4887; 10 CCR 2505-10 § 8.100.5.C.4.b, S3623; § 8.100.3.E.1, S1503). Before, the undated finding was read in every month."
derived: [all, [">", [count, ma_ssi_deeming_parents], 0], [">=", [count, ma_ssi_deeming_children], 2], [any, is_blind, [all, meets_ssa_disability_criteria, [not, ma_month_is_before_disability_onset]]], ["<", ["+", ["-", [sum, ma_ssi_deeming_children, [min, [of, [P], ma_ssi_deeming_benefit_zero_amount], ma_pickle_deeming_benefit_zero_amount]], [min, ma_ssi_deeming_benefit_zero_amount, ma_pickle_deeming_benefit_zero_amount]], ma_pickle_deeming_benefit_zero_amount], ma_pickle_parental_income_to_be_deemed]]
sources: [S3413, S4080, S666, S3623, S1503]
implemented: engine
tags: [ma, non_magi, income, household]
siblings:
  - {id: CO-5904, reason: "the Pickle copy puts this child's Pickle limit (CO-6058) in place of its SSI-related one; every other term must stay the same"}
rationale: "Duplicate-paths audit D-M3 (P1)."
nearest: [CO-5904, CO-5222]
tests:
