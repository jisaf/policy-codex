  - {id: CO-6061-T2, month: "2026-10", as_of: "2026-10-12", given: {ma_ssi_deeming_parents: [p2], ma_ssi_deeming_children: [p1, p3], is_blind: false, meets_ssa_disability_criteria: true, ma_ssi_deeming_benefit_zero_amount: 1014, ma_pickle_deeming_benefit_zero_amount: 1014, ma_pickle_parental_income_to_be_deemed: 1000}, others: {p2: {}, p3: {ma_ssi_deeming_benefit_zero_amount: 300}}, title: "Income to be deemed 1,000: min(300, 1,014) + min(1,014, 1,014) - 1,014 + 1,014 = 1,314 >= 1,000: false", expect: false}
