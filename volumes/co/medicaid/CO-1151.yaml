id: CO-1151
name: "Medicaid: emergency Medicaid status"
identifier: ma_emergency_medicaid_status
kind: derived
type: one of
options: [not_applicable_status_met, ineligible_residency, ineligible_other_requirements, eligible_emergency_condition, eligible_no_current_emergency]
scope: person-month
program: Medicaid
role: outcome
meaning: "The emergency Medicaid determination for the month. A Colorado resident who meets citizenship or immigration requirements (including a child, pregnant or postpartum person under Cover All Coloradans) is not limited to emergency coverage (not_applicable_status_met). A resident who fails status but meets every other requirement of a categorical program is limited to emergency (and reproductive) services (10 CCR 2505-10 §§ 8.100.3.F.1.k, 8.100.3.G.1.g.ix.2; 42 U.S.C. 1396b(v); 42 CFR 435.406(b), 435.350, 440.255(c)); the coverage pays for this month's care when the person has an emergency medical condition (eligible_emergency_condition) and otherwise stands without a covered service (eligible_no_current_emergency). ineligible_residency and ineligible_other_requirements report the failing condition."
precision: "Residency first, then status, then the other requirements (ma_is_emergency_medicaid_only, CO-510, which reads ma_meets_requirements_other_than_status, CO-1150), then the month's emergency medical condition. Colorado's emergency eligibility does not wait for an emergency: the application is complete without a physician statement and an approved member is not asked to reapply for 12 months (§ 8.100.3.G.1.g.ix.2), so eligible_no_current_emergency is an eligible member with nothing to pay for this month, not a denial. Prenatal care and follow-up care are outside emergency-only coverage (§ 8.100.3.G.1.g.ix.2); a pregnant person regardless of status is instead covered through MAGI Pregnant or CHP+ prenatal under Cover All Coloradans (§ 8.100.3.G.1.g.ix.1; 10 CCR 2505-3 § 110.1.B.5.o), so reaches not_applicable_status_met here. The fetched 10 CCR 2505-3 states no separate unborn-child (from-conception) CHIP category."
derived: [case, [[not, ma_meets_residency], "ineligible_residency"], [ma_meets_citizenship_requirement, "not_applicable_status_met"], [[not, ma_is_emergency_medicaid_only], "ineligible_other_requirements"], [has_emergency_medical_condition, "eligible_emergency_condition"], [else, "eligible_no_current_emergency"]]
sources: [S600, S601, S602, S603, S604, S605, S173, S607, S606]
open: [OQ-200]
implemented: engine
tags: [ma, emergency, immigration]
rationale: "Emergency Medicaid had no determination of its own: ma_is_emergency_medicaid_only (CO-510) is a yes/no read by the MAGI outcomes, and ma_magi_eligibility_status (CO-554) reports emergency_only only for a MAGI category. No existing item reads the emergency medical condition (CO-1100) or reports why a person is or is not emergency-eligible. Declared an outcome."
tests:
  - {id: CO-1151-T1, as_of: "2026-10-01", month: "2026-10", title: "Status fails, otherwise eligible, emergency this month", given: {ma_meets_residency: true, ma_meets_citizenship_requirement: false, ma_is_emergency_medicaid_only: true, has_emergency_medical_condition: true}, expect: eligible_emergency_condition}
  - {id: CO-1151-T2, as_of: "2026-10-01", month: "2026-10", title: "Status fails, otherwise eligible, no emergency this month", given: {ma_meets_residency: true, ma_meets_citizenship_requirement: false, ma_is_emergency_medicaid_only: true, has_emergency_medical_condition: false}, expect: eligible_no_current_emergency}
  - {id: CO-1151-T3, as_of: "2026-10-01", month: "2026-10", title: "Meets status", given: {ma_meets_residency: true, ma_meets_citizenship_requirement: true}, expect: not_applicable_status_met}
  - {id: CO-1151-T4, as_of: "2026-10-01", month: "2026-10", title: "Status fails and no categorical program is met", given: {ma_meets_residency: true, ma_meets_citizenship_requirement: false, ma_is_emergency_medicaid_only: false}, expect: ineligible_other_requirements}
  - {id: CO-1151-T5, as_of: "2026-10-01", month: "2026-10", given: {ma_meets_residency: false}, expect: ineligible_residency}
  - {id: CO-1151-T6, as_of: "2026-10-01", month: "2026-10", title: "Undocumented pregnant resident: Cover All Coloradans, not emergency-only", given: {state_of_residence: "CO", citizenship_status: undocumented, lawful_presence_status: not_lawfully_present, date_of_birth: "1995-05-01", is_pregnant: true}, expect: not_applicable_status_met}
