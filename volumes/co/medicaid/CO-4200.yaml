id: CO-4200
name: "Medicaid: Children with Disabilities Buy-In household earned income"
identifier: ma_cbwd_household_earned_income
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The gross earned income for the month of the child's Children with Disabilities Buy-In household - the MAGI household of 10 CCR 2505-10 § 8.100.4.E (ma_magi_household_members, § 8.100.6.Q.1.b.i) - counted under § 8.100.5.F (Q.1.b.ii): each member's wages and net earnings from self-employment (§ 8.100.5.F.4.a-b), less, for a blind or disabled child of the Buy-In's age who is a student regularly attending school, the student earned income exemption (§ 8.100.5.H.4.d, ma_ssi_excluded_earned_income)."
precision: "Every member of the MAGI household counts, not only the members whose income MAGI's tax-dependent rule (§ 8.100.4.C.1.f; 42 CFR 435.603(d)(2)) would count: Q.1.b takes from § 8.100.4 only the household (E), and the income rules from § 8.100.5.F (OQ-740). Net earnings from self-employment are the non-MAGI figure (ma_self_employment_net_earnings, CO-1704). The student exemption is the one the SSI-related groups apply (ma_ssi_excluded_earned_income, CO-2471, with SSA's figures for the year), read for a member who is ma_cbwd_max_age or younger and meets the SSA disability criteria or is blind. An unstated exemption is 0."
derived: [sum, ma_magi_household_members, [max, 0, ["-", ["+", [of, [P], wages_gross], [of, [P], ma_self_employment_net_earnings]], [case, [[all, ["<=", [of, [P], age], ma_cbwd_max_age], [any, [otherwise, [of, [P], meets_ssa_disability_criteria], false], [otherwise, [of, [P], is_blind], false]]], [otherwise, [of, [P], ma_ssi_excluded_earned_income], 0]], [else, 0]]]]]
sources: [S3000, S3001, S3002]
implemented: engine
tags: [ma, non_magi, buy_in, income]
open: [OQ-740]
rationale: "Final verification pass 3, F3-1: ma_cbwd_eligible (CO-620) tested MAGI household income, but § 8.100.6.Q.1.b applies § 8.100.5.F's income rules and § 8.100.5.H's disregards to the MAGI household. No existing item sums § 8.100.5.F earned income over a MAGI household: ma_ssi_countable_earned_income (CO-605) sums over a person and a spouse, and ma_wawd_countable_income (CO-1715) over the applicant alone."
tests:
  - {id: CO-4200-T1, as_of: "2026-10-12", month: "2026-10", title: "A parent's wages and a disabled child with none", given: {ma_magi_household_members: [p1, p2], date_of_birth: "2016-05-20", wages_gross: 0, ma_self_employment_net_earnings: 0, meets_ssa_disability_criteria: true}, others: {p2: {date_of_birth: "1996-08-14", wages_gross: 5050, ma_self_employment_net_earnings: 0, meets_ssa_disability_criteria: false}}, expect: 5050}
  - {id: CO-4200-T2, as_of: "2026-10-12", month: "2026-10", title: "A disabled 17-year-old student's wages, after the student exemption of 300", given: {ma_magi_household_members: [p1, p2], date_of_birth: "2009-01-10", wages_gross: 300, ma_self_employment_net_earnings: 0, meets_ssa_disability_criteria: true, ma_ssi_excluded_earned_income: 300}, others: {p2: {date_of_birth: "1980-08-14", wages_gross: 2000, ma_self_employment_net_earnings: 400, meets_ssa_disability_criteria: false}}, expect: 2400}
  - {id: CO-4200-T3, as_of: "2026-10-12", month: "2026-10", title: "A sibling of 17 who is not disabled: her wages count in full", given: {ma_magi_household_members: [p1, p2], date_of_birth: "2016-01-10", wages_gross: 0, ma_self_employment_net_earnings: 0, meets_ssa_disability_criteria: true}, others: {p2: {date_of_birth: "2009-03-01", wages_gross: 500, ma_self_employment_net_earnings: 0, meets_ssa_disability_criteria: false, is_blind: false, ma_ssi_excluded_earned_income: 500}}, expect: 500}
