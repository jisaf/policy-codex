id: CO-4200
name: "Medicaid: Children with Disabilities Buy-In household earned income"
identifier: ma_cbwd_household_earned_income
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The gross earned income for the month of the child's Children with Disabilities Buy-In household - the MAGI household of 10 CCR 2505-10 § 8.100.4.E (ma_magi_household_members, § 8.100.6.Q.1.b.i) - counted under § 8.100.5.F (Q.1.b.ii): each member's wages and net earnings from self-employment (§ 8.100.5.F.4.a-b), less, for a blind or disabled child of the Buy-In's age who is a student regularly attending school, the student earned income exemption (§ 8.100.5.H.4.d, ma_ssi_excluded_earned_income)."
precision: "Every member of the MAGI household counts, not only the members whose income MAGI's tax-dependent rule (§ 8.100.4.C.1.f; 42 CFR 435.603(d)(2)) would count: Q.1.b takes from § 8.100.4 only the household (E), and the income rules from § 8.100.5.F (OQ-740). Net earnings from self-employment are the non-MAGI figure (ma_self_employment_net_earnings, CO-1704). The student exemption is the one the SSI-related groups apply (ma_ssi_excluded_earned_income, CO-2471, with SSA's figures for the year), read for a member who is ma_cbwd_max_age or younger and meets the SSA disability criteria or is blind. An unstated exemption is 0. Coverage pass 3 C3-8: the infrequent or irregular earned income exclusion (ma_ssi_excluded_infrequent_earned_income, CO-4883; 20 CFR 416.1112(c)(2)) and decennial Census wages (§ 8.100.5.F.6.z) apply to any earner, so they come off every member's earnings; a blind or disabled child of the Buy-In's age takes the whole of CO-2471, which holds both and the student exclusion. Coverage pass 4, non-MAGI N4-9 (docs/operators.md, \"Ages in a month\"): the age is taken in the month evaluated, not on the determination date: an \"under N\" test on the first day of the month (ma_age_on_first_day_of_month, CO-4978), an \"N or older\" test on the last day (ma_age_on_last_day_of_month, CO-5402), and a test that excludes the person from what is favorable on the other day. Coverage pass 4, non-MAGI N4-13 (decision 4 of 2026-11-23: missing information is cannot determine unless the rule says otherwise; readers do not invent defaults): a member's blindness and disability (the SSA's or the Department's finding, 8.100.6.B) are read as stated for every member, no longer as no for a member whose finding is unstated. Pattern sweep, non-MAGI Medicaid (docs/reviews/pattern-sweep-nonmagi.md, P2): the SSI method's excluded earned income (ma_ssi_excluded_earned_income, CO-2471; the infrequent part, CO-4883) and in-kind support and maintenance (ssi_in_kind_support_and_maintenance, CO-802) are read as computed, required where read (decision 4 of 2026-11-23): they are unknown only where a fact they rest on is not stated (a student's school attendance, the shelter costs others pay), and no rule reads that as none; before, an unknown figure was read as 0."
derived: [sum, ma_magi_household_members, [max, 0, ["-", [of, [P], ma_ssi_gross_earned_income], [case, [[all, ["<=", [of, [P], ma_age_on_first_day_of_month], ma_cbwd_max_age], [any, [of, [P], meets_ssa_disability_criteria], [of, [P], is_blind]]], [of, [P], ma_ssi_excluded_earned_income]], [else, [+, [of, [P], ma_ssi_excluded_infrequent_earned_income], [of, [P], ma_ssi_exempt_earned_receipts]]]]]]]
sources: [S3000, S3001, S3002]
implemented: engine
tags: [ma, non_magi, buy_in, income]
open: [OQ-740]
rationale: "Final verification pass 3, F3-1: ma_cbwd_eligible (CO-620) tested MAGI household income, but § 8.100.6.Q.1.b applies § 8.100.5.F's income rules and § 8.100.5.H's disregards to the MAGI household. No existing item sums § 8.100.5.F earned income over a MAGI household: ma_ssi_countable_earned_income (CO-605) sums over a person and a spouse, and ma_wawd_countable_income (CO-1715) over the applicant alone. Coverage pass 3 C3-8: since deb753e CO-2471 also held the infrequent $30 and Census wages, which this item subtracted only for the child. Earned-income records, step E1 (Medicaid and CHP+): earned income is the earnings records the SSI method's counting table counts (ma_ssi_gross_earned_income, CO-5171), replacing wages_gross plus ma_self_employment_net_earnings; Census wages are the earnings the table holds exempt (ma_ssi_exempt_earned_receipts, CO-5172), replacing decennial_census_wages_received."
tests:
  # Pattern sweep (P2, decision 4): the story's earners are not students under 22 and no one else pays their shelter, so the SSI method's excluded earned income and in-kind support and maintenance are stated (0); before, an unknown figure was read as 0.
  - {id: CO-4200-T1, as_of: "2026-10-12", month: "2026-10", title: "A parent's wages and a disabled child with none", given: {ma_ssi_excluded_earned_income: 0, ssi_in_kind_support_and_maintenance: 0, ma_magi_household_members: [p1, p2], date_of_birth: "2016-05-20", ma_self_employment_net_earnings: 0, meets_ssa_disability_criteria: true, earnings: [{kind: self_employment_receipts}]}, others: {p2: {ma_ssi_excluded_earned_income: 0, ssi_in_kind_support_and_maintenance: 0, date_of_birth: "1996-08-14", ma_self_employment_net_earnings: 0, meets_ssa_disability_criteria: false, earnings: [{kind: wages, amount: 5050}, {kind: self_employment_receipts}]}}, expect: 5050}
  - {id: CO-4200-T2, as_of: "2026-10-12", month: "2026-10", title: "A disabled 17-year-old student's wages, after the student exemption of 300", given: {ma_magi_household_members: [p1, p2], date_of_birth: "2009-01-10", ma_self_employment_net_earnings: 0, meets_ssa_disability_criteria: true, ma_ssi_excluded_earned_income: 300, earnings: [{kind: wages, amount: 300}, {kind: self_employment_receipts}]}, others: {p2: {date_of_birth: "1980-08-14", ma_self_employment_net_earnings: 400, meets_ssa_disability_criteria: false, earnings: [{kind: wages, amount: 2000}, {kind: self_employment_receipts}]}}, expect: 2400}
  # Pattern sweep (P2, decision 4): the story's earners are not students under 22 and no one else pays their shelter, so the SSI method's excluded earned income and in-kind support and maintenance are stated (0); before, an unknown figure was read as 0.
  - {id: CO-4200-T3, as_of: "2026-10-12", month: "2026-10", title: "A sibling of 17 who is not disabled: her wages count in full", given: {ma_ssi_excluded_earned_income: 0, ssi_in_kind_support_and_maintenance: 0, ma_magi_household_members: [p1, p2], date_of_birth: "2016-01-10", ma_self_employment_net_earnings: 0, meets_ssa_disability_criteria: true, earnings: [{kind: self_employment_receipts}]}, others: {p2: {ssi_in_kind_support_and_maintenance: 0, date_of_birth: "2009-03-01", ma_self_employment_net_earnings: 0, meets_ssa_disability_criteria: false, is_blind: false, ma_ssi_excluded_earned_income: 500, earnings: [{kind: wages, amount: 500}, {kind: self_employment_receipts}]}}, expect: 500}
  - {id: CO-4200-T90, as_of: "2026-10-12", month: "2026-11", title: "C3-8: a parent's 4,900 of wages, 30 of them an irregular payment: 4,870", given: {ma_magi_household_members: [p1], date_of_birth: "1996-08-14", meets_ssa_disability_criteria: false, is_blind: false, ma_self_employment_net_earnings: 0, ma_ssi_excluded_infrequent_earned_income: 30, earnings: [{kind: wages, amount: 4900}, {kind: self_employment_receipts}]}, others: {}, relationships: [], expect: 4870}
  - {id: CO-4200-T91, month: "2026-11", as_of: "2026-12-01", title: "N4-9: 18 on 2026-11-01: a disabled member 18 or under, the SSI exclusions taken: 500 - 300 = 200", given: {ma_magi_household_members: [p1], date_of_birth: "2007-11-15", meets_ssa_disability_criteria: true, is_blind: false, earnings: [{kind: wages, amount: 500}], ma_ssi_excluded_earned_income: 300}, expect: 200}
  - {id: CO-4200-T92, month: "2026-12", as_of: "2026-12-01", title: "N4-9: 19 on 2026-12-01: only the infrequent and exempt pay (0): 500", given: {ma_magi_household_members: [p1], date_of_birth: "2007-11-15", meets_ssa_disability_criteria: true, is_blind: false, earnings: [{kind: wages, amount: 500}], ma_ssi_excluded_earned_income: 300}, expect: 500}
