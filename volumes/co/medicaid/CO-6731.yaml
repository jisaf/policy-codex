id: CO-6731
name: "SSI method: excluded infrequent or irregular unearned income"
identifier: ma_ssi_excluded_infrequent_unearned_income
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The part of the person's infrequent or irregular unearned income for the month that the SSI method does not count: what remains, after the earlier months of the calendar quarter, of the first ssi_infrequent_unearned_income_quarterly_exclusion ($60) of such income received in the quarter (20 CFR 416.1124(c)(6), S2609), brought to the aged, blind and disabled groups by 42 CFR 435.601(b)(2) (S4754), Colorado's text naming nothing."
precision: "The quarter's running total of the irregular receipts (ma_ssi_irregular_unearned_receipts, CO-6730), capped at the exclusion, less the same total through the month before, so the quarter's first $60 is excluded in the months it is received and no more (the pattern of ma_ssi_excluded_infrequent_earned_income, CO-4883). The quarter is the calendar quarter containing the month. 416.1124(a) applies the exclusions of (c) in the order listed, so (c)(6) comes before the $20 general exclusion ((c)(12)), which the readers apply after ma_ssi_unearned_receipts (CO-5511) subtracts this. Receipts not stated: cannot determine (decision 4)."
derived: ["-", [min, ssi_infrequent_unearned_income_quarterly_exclusion, [sum_months, [months_from_to, [months_before, ["-", ["-", [month_of_year, [month]], 1], ["*", 3, ["-", 0, [ceil, ["-", 0, ["/", ["-", [month_of_year, [month]], 1], 3]]]]]], [month]], [month]], [at, ma_ssi_irregular_unearned_receipts, [that_month]]]], [min, ssi_infrequent_unearned_income_quarterly_exclusion, [sum_months, [months_from_to, [months_before, ["-", ["-", [month_of_year, [month]], 1], ["*", 3, ["-", 0, [ceil, ["-", 0, ["/", ["-", [month_of_year, [month]], 1], 3]]]]]], [month]], [month_before, [month]]], [at, ma_ssi_irregular_unearned_receipts, [that_month]]]]]
sources: [S2609, S4754]
implemented: engine
tags: [non_magi, income]
rationale: "Coverage pass 4, non-MAGI N4-3: 416.1124(c)(6) had no item. Nearest: ma_ssi_excluded_infrequent_earned_income (CO-4883), the same quarterly running cap over the earnings records' irregular pay with the $30 of 416.1112(c)(2); the two exclusions are separate paragraphs with separate figures and apply to separate income, so each keeps its own item."
nearest: [CO-4883]
tests:
  - {id: CO-6731-T1, as_of: "2026-11-01", month: "2026-11", title: "A 30 gift in November, nothing irregular earlier in the quarter: min(60, 30) - min(60, 0) = 30 excluded", given: {receipts: [{kind: social_security, amount: 1000}, {kind: gift, amount: 30, irregular: true, frequency: once, month: "2026-11"}]}, expect: 30}
  - {id: CO-6731-T2, as_of: "2026-11-01", month: "2026-11", title: "100 in November: the first 60, min(60, 100) - 0 = 60", given: {receipts: [{kind: gift, amount: 100, irregular: true, frequency: once, month: "2026-11"}]}, expect: 60}
  - {id: CO-6731-T3, as_of: "2026-11-01", month: "2026-11", title: "50 in October and 50 in November (one quarter): min(60, 100) - min(60, 50) = 10 left for November", given: {receipts: [{kind: gift, amount: 50, irregular: true, frequency: once, month: "2026-10"}, {kind: other_nontaxable, amount: 50, irregular: true, frequency: once, month: "2026-11"}]}, expect: 10}
  - {id: CO-6731-T4, as_of: "2026-10-01", month: "2026-10", title: "September's 50 is in the quarter before: October's 50 all excluded, min(60, 50) - min(60, 0) = 50", given: {receipts: [{kind: gift, amount: 50, irregular: true, frequency: once, month: "2026-09"}, {kind: gift, amount: 50, irregular: true, frequency: once, month: "2026-10"}]}, expect: 50}
  - {id: CO-6731-T5, as_of: "2026-11-01", month: "2026-11", title: "A gift not stated irregular: none excluded", given: {receipts: [{kind: gift, amount: 30, frequency: once, month: "2026-11"}]}, expect: 0}
