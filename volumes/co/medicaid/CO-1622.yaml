id: CO-1622
name: "Medical Assistance: immigration status verification is pending"
identifier: ma_immigration_status_verification_is_pending
kind: derived
type: yes/no
scope: person-month
program: Medicaid
role: outcome
meaning: Whether Medical Assistance (and CHP+, which reads this item) requires verification of the person's declared legal immigration status through VLP and it has not been provided.
precision: "Reads claims_lawful_immigration_status directly: every declared legal status is verified through VLP, for children and pregnant persons too (8.100.4.B.1.e, 110.1.C; review C-3, OQ-308)."
derived: [all, claims_lawful_immigration_status, [not, immigration_status_verified_by_electronic_data_source]]
sources: [S852, S870, S1085]
implemented: engine
tags: [verification, ma]
rationale: "Review U-1: the count items held this test as an anonymous arm, so no outcome told a worker which document was outstanding and for whom; the count now sums this item."
tests:
  - {id: CO-1622-T1, month: "2026-10", as_of: "2026-10-01", given: {immigration_status: lawful_permanent_resident, immigration_status_verified_by_electronic_data_source: false}, expect: true}
  - {id: CO-1622-T2, month: "2026-10", as_of: "2026-10-01", given: {immigration_status: lawful_permanent_resident, immigration_status_verified_by_electronic_data_source: true}, expect: false}
  - {id: CO-1622-T3, month: "2026-10", as_of: "2026-10-01", given: {immigration_status: undocumented}, expect: false}
