id: CO-1410
name: "Medicaid: pending status verification count"
identifier: ma_pending_status_verification_count
kind: derived
type: whole number
scope: person-month
program: Medicaid
meaning: "The number of status elements (citizenship, identity, immigration status) Medical Assistance requires for this person that are not yet verified, the elements a reasonable opportunity period covers: the sum of the person's pending citizenship, identity and immigration status items."
derived: ["+", [case, [ma_citizenship_verification_is_pending, 1], [else, 0]], [case, [ma_identity_verification_is_pending, 1], [else, 0]], [case, [ma_immigration_status_verification_is_pending, 1], [else, 0]]]
sources: [S840, S853, S859, S1085]
implemented: engine
tags: [verification, ma, immigration]
rationale: During a reasonable opportunity period the person receives benefits while these elements are pending (435.956(a)(5), S840), unlike any other missing verification; the status needs the count separately.
tests:
  - {id: CO-1410-T1, month: "2026-10", as_of: "2026-10-01", given: {ma_citizenship_verification_is_pending: true, ma_identity_verification_is_pending: true, ma_immigration_status_verification_is_pending: false}, expect: 2}
  - {id: CO-1410-T2, month: "2026-10", as_of: "2026-10-01", given: {ma_citizenship_verification_is_pending: false, ma_identity_verification_is_pending: false, ma_immigration_status_verification_is_pending: true}, expect: 1}
