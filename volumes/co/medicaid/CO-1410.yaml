id: CO-1410
name: "Medicaid: pending status verification count"
identifier: ma_pending_status_verification_count
kind: derived
type: whole number
scope: person-month
program: Medicaid
meaning: The number of status elements (citizenship, identity, immigration status) Medical Assistance requires for this person that are not yet verified, the elements a reasonable opportunity period covers.
derived: ["+", [case, [[all, ma_requires_verification_of_citizenship, [not, [any, citizenship_verified_by_electronic_data_source, [all, citizenship_verification_document_received, ma_citizenship_document_is_acceptable]]]], 1], [else, 0]], [case, [[all, ma_requires_verification_of_identity, [not, [any, identity_verified_by_electronic_data_source, [all, identity_verification_document_received, ma_identity_document_is_acceptable]]]], 1], [else, 0]], [case, [[all, ma_requires_verification_of_immigration_status, [not, immigration_status_verified_by_electronic_data_source]], 1], [else, 0]]]
sources: [S840, S853, S859]
implemented: engine
tags: [verification, ma, immigration]
rationale: During a reasonable opportunity period the person receives benefits while these elements are pending (435.956(a)(5), S840), unlike any other missing verification; the status needs the count separately.
tests:
  - {id: CO-1410-T1, month: "2026-10", as_of: "2026-10-01", given: {ma_requires_verification_of_citizenship: true, citizenship_verified_by_electronic_data_source: false, citizenship_verification_document_received: false, ma_requires_verification_of_identity: true, identity_verified_by_electronic_data_source: false, identity_verification_document_received: false, ma_requires_verification_of_immigration_status: false}, expect: 2}
  - {id: CO-1410-T2, month: "2026-10", as_of: "2026-10-01", given: {ma_requires_verification_of_citizenship: true, citizenship_verified_by_electronic_data_source: false, citizenship_verification_document_received: true, ma_citizenship_document_is_acceptable: true, ma_requires_verification_of_identity: false, ma_requires_verification_of_immigration_status: true, immigration_status_verified_by_electronic_data_source: true}, expect: 0}
