id: CO-507
name: "Medicaid: is lawfully present"
identifier: ma_is_lawfully_present
kind: derived
type: yes/no
scope: person
program: Medicaid
meaning: "Whether the person is a lawfully residing non-citizen, or a citizen or national, as 10 CCR 2505-10 § 8.100.3.G.1.g uses the term (ii, vii): a citizen or national; a qualified non-citizen (vii's \"categories listed in Section 8.100.3.G.1.g.iii\" and vii.15-16, 19-21, 23-25, 28); or a non-citizen in one of the vii categories that are not qualified statuses: temporary residents, Temporary Protected Status, employment authorization under 8 CFR 274a.12(c), Family Unity, Deferred Enforced Departure, deferred action other than DACA, an administrative stay of removal, an approved petition with a pending adjustment, a pending asylum, withholding or Convention Against Torture application with employment authorization or by a child under 14 pending 180 days, Convention Against Torture withholding, a pending Special Immigrant Juvenile application, lawful presence in American Samoa, a valid nonimmigrant status, parole for less than a year (vii.1-14), an American Indian born in Canada or tribal member (vii.22), or an Iraqi or Afghan special immigrant who arrived on or after December 26, 2007 and has not adjusted (vii.26-27)."
precision: "Reads immigration_status (CO-002). DACA is excluded (vii.6). vii.17-18 (veterans and active duty \"lawfully residing in Colorado\") presuppose a lawful status that another arm already reads. The citizen-or-national arm reads is_us_citizen_or_national (CO-1358), the qualified arm is_qualified_non_citizen (CO-506)."
derived: [any, is_us_citizen_or_national, is_qualified_non_citizen, [in, immigration_status, [temporary_resident, temporary_protected_status, employment_authorized_under_274a12c, family_unity, deferred_enforced_departure, deferred_action, administrative_stay_of_removal, pending_adjustment_with_approved_petition, asylum_or_withholding_applicant_with_employment_authorization, asylum_or_withholding_applicant_under_14_pending_180_days, cat_withholding_granted, special_immigrant_juvenile_applicant, american_samoa_lawfully_present, nonimmigrant, parolee_less_than_one_year]], [all, ["=", immigration_status, iraqi_afghan_special_immigrant], [">=", us_entry_date, iraqi_afghan_special_immigrant_entry_start_date]], [otherwise, is_american_indian_born_in_canada_or_tribal_member, false]]
sources: [S174, S658, S1902, S1903, S1904, S600, S607]
implemented: engine
tags: [ma, immigration]
rationale: "No existing item states 'lawfully present' as distinct from 'qualified non-citizen'. ma_meets_citizenship_requirement (CO-509) needs it for § 8.100.3.G.1.g.vii, which admits a lawfully residing pregnant woman or child under 19 without the five-year rule (phase 7 fix round, B-1; earlier this item served the Cover All Coloradans arm, which CO-509 no longer carries). History moved from the precision note (HCPF review S-14): Vocabulary fix round (U-3): the citizen-or-national arm reads is_us_citizen_or_national (CO-1358).  OQ-44 fix (product-owner decision of 2026-11-21; docs/reviews/audit-dual-entry.md 3.1; same-word audit SW-18): reads the one immigration_status fact (CO-002), which replaced citizenship_status, lawful_presence_status (CO-084), federal_five_year_bar_exempt_category (CO-1724) and ma_five_year_bar_exempt_category (CO-1170). The lawfully residing categories had been one supplied yes/no (lawful_presence_status) that only Medicaid read, so a child with a lawfully present status and the flag unstated was unknown, and an undocumented person with the flag true was admitted."
tests:
  - {id: CO-507-T1, as_of: "2026-10-01", given: {immigration_status: us_citizen}, expect: true}
  - {id: CO-507-T2, as_of: "2026-10-01", given: {immigration_status: temporary_protected_status}, expect: true}
  - {id: CO-507-T3, as_of: "2026-10-01", given: {immigration_status: undocumented}, expect: false}
  - {id: CO-507-T4, as_of: "2026-10-01", title: "DACA is excluded from vii.6", given: {immigration_status: daca}, expect: false}
  - {id: CO-507-T5, as_of: "2026-10-01", title: "Afghan special immigrant not yet adjusted, arrived 2021 (vii.27)", given: {immigration_status: iraqi_afghan_special_immigrant, us_entry_date: "2021-09-01"}, expect: true}
  - {id: CO-507-T6, as_of: "2026-10-01", title: "Refugee: a qualified non-citizen is lawfully residing", given: {immigration_status: refugee}, expect: true}
  - {id: CO-507-T7, as_of: "2026-10-01", title: "Undocumented, no other category", given: {immigration_status: undocumented}, expect: false}
