id: CO-7551
name: "Medicaid: meets the citizenship requirement in the month"
identifier: ma_meets_citizenship_requirement_in_month
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether, in the month evaluated, the person falls into one of the citizenship and immigration status categories of 10 CCR 2505-10 § 8.100.3.G.1.g that admit a person to full Medical Assistance, as ma_meets_citizenship_requirement (CO-509) states them, with each condition that changes with time read for the month: the five years of 8 U.S.C. 1613(a) (ma_has_held_qualified_status_five_years_in_month, CO-7550), the pregnancy of the lawfully residing pregnant woman (ma_is_pregnant_in_month, CO-3601) and the age of the lawfully residing child, under ma_magi_child_age_limit on the first day of the month (ma_age_on_first_day_of_month, CO-4978). In a month before the determination month that ends before a qualified non-citizen obtained the qualified status held now (qualified_status_date, CO-003), the status held then is tested instead (ma_meets_citizenship_requirement_before_qualified_status, CO-7652)."
precision: "Pattern sweep, MAGI (2026-11-24, docs/reviews/pattern-sweep-magi.md, PS-01). 10 CCR 2505-10 § 8.100.4.G.1 (S3351) makes each month its own ('eligible ... at any time during a calendar month'), and § 8.100.3.E.1 (S217) gives a retroactive month only to a person who 'met all applicable eligibility requirements' in it; CO-509 is one value per person, measured on the determination date, so a lawful permanent resident whose five years ended between a retroactive month and the determination, a lawfully residing child who turned 19 after a retroactive month, and a lawfully residing woman pregnant in a retroactive month but not on the determination date were judged in that month by the determination date's facts. The five years end, the pregnancy and the age under 19 are each met on a day of the month (G.1; docs/operators.md, Ages in a month). The October 2026 federal payment limit (ma_alien_payment_restriction_applies, CO-3034) is read on the determination date, as CO-509 reads it (OQ-510, a recorded state policy choice: the determination date, not the month of service, decides it). Every other condition is CO-509's (the precision and statute_override of CO-509 apply). Read by every Medicaid item that tests status for a month: the MAGI items ma_magi_is_fully_eligible (CO-562), ma_is_emergency_medicaid_only (CO-510), ma_family_planning_status (CO-1154), ma_needy_young_person_category (CO-2419), ma_is_covered_under_cover_all_coloradans (CO-1175) and ma_meets_status_for_cover_all_coloradans_categories_in_month (CO-7553); and, since Medicaid status by month (2026-11-24, docs/reviews/medicaid-status-by-month.md, MS-2), the non-MAGI and shared items ma_is_ssi_related_eligible (CO-611), ma_msp_category (CO-617), ma_ltc_eligibility_status (CO-652), ma_pace_eligible (CO-654), ma_emergency_medicaid_status (CO-1151), ma_pickle_eligible (CO-1159), ma_dac_eligible (CO-1161), ma_disabled_widow_eligible (CO-1162), ma_protected_group_category (CO-1163), ma_oap_sisc_b_eligible (CO-1177), ma_funding_source (CO-2456) and ma_ltc_unmet_requirement (CO-3310): the categories of 8.100.3.G.1.g are one test for every Medical Assistance category, and § 8.100.5.C.1 (S3900) makes the Aged, Blind and Disabled categories effective from the first day of the month the person becomes eligible, so the same day-of-the-month reading applies. MS-2: qualified_status_date is the date of a change the case states, so in a month before the determination month that ends before it the stated qualified status was not held, and CO-7652 tests the status held then; qualified_status_date is required for a qualified non-citizen in a month before the determination month (decision 4 of 2026-11-23). CO-509 itself is unchanged and read only by person-scope items (ma_meets_status_for_cover_all_coloradans_categories, CO-1174; the spouse's status in ma_transfer_penalty_is_apportioned_with_spouse, CO-2232, a test at the determination)."
derived: [case, [[any, [">=", [month], [det_month]], [not, is_qualified_non_citizen], ["<=", [month_of, qualified_status_date], [month]]], [any, is_us_citizen_or_national, [all, [any, [all, is_qualified_non_citizen, [any, ma_has_held_qualified_status_five_years_in_month, ma_is_five_year_bar_exempt]], ["=", immigration_status, iraqi_afghan_special_immigrant], [all, ma_is_lawfully_present, ["<", us_entry_date, qualified_non_citizen_entry_cutoff_date]]], [any, [not, [as_of, ma_alien_payment_restriction_applies, [det_date]]], ma_is_in_federal_payment_status_category]], [all, ma_is_lawfully_present, [any, ma_is_pregnant_in_month, ["<", ma_age_on_first_day_of_month, ma_magi_child_age_limit]]]]], [else, ma_meets_citizenship_requirement_before_qualified_status]]
sources: [S173, S655, S656, S657, S658, S176, S1700, S1704, S1705, S3351, S217]
open: [OQ-510, OQ-213, OQ-517, OQ-518, OQ-550, OQ-1425, OQ-1446]
implemented: engine
tags: [ma, magi, immigration, age]
nearest: [CO-509, CO-7550]
rationale: "Pattern sweep, MAGI (PS-01): the month-scoped MAGI items read the person-scope status test CO-509, which measures the five years, the pregnancy and the child's age on the determination date. LPR-5Y (stored household CO-1000): a lawful permanent resident since 2021-09-15, applying on 2026-11-02 with a retroactive request, was full-coverage eligible in August 2026 although her five years ended in September. YOUTH-19 (CO-1001): a lawfully residing youth who turned 19 in September was emergency-only in August. CO-509 is kept for its person-scope and non-MAGI readers."
tests:
  - {id: CO-7551-T1, as_of: "2026-11-10", month: "2026-08", title: "PS-01 (LPR-5Y): lawful permanent resident adult since 2021-09-15, August 2026: inside the five years, no exemption", given: {status_before_lpr_adjustment: none, immigration_status: lawful_permanent_resident, qualified_status_date: "2021-09-15", us_entry_date: "2021-09-15", date_of_birth: "1990-01-01", is_pregnant: false, has_military_connection: false, qualifying_quarters: 8, ma_application_date: "2026-11-02"}, expect: false}
  - {id: CO-7551-T2, as_of: "2026-11-10", month: "2026-09", title: "PS-01 (LPR-5Y): the same, September 2026: the five years end on September 15", given: {immigration_status: lawful_permanent_resident, qualified_status_date: "2021-09-15", us_entry_date: "2021-09-15", date_of_birth: "1990-01-01", is_pregnant: false, has_military_connection: false, qualifying_quarters: 8, ma_application_date: "2026-11-02"}, expect: true}
