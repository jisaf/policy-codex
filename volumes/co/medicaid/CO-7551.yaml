id: CO-7551
name: "Medicaid: meets the citizenship requirement in the month"
identifier: ma_meets_citizenship_requirement_in_month
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether, in the month evaluated, the person falls into one of the citizenship and immigration status categories of 10 CCR 2505-10 § 8.100.3.G.1.g that admit a person to full Medical Assistance, as ma_meets_citizenship_requirement (CO-509) states them, with each condition that changes with time read for the month: the five years of 8 U.S.C. 1613(a) (ma_has_held_qualified_status_five_years_in_month, CO-7550), the pregnancy of the lawfully residing pregnant woman (ma_is_pregnant_in_month, CO-3601) and the age of the lawfully residing child, under ma_magi_child_age_limit on the first day of the month (ma_age_on_first_day_of_month, CO-4978)."
precision: "Pattern sweep, MAGI (2026-11-24, docs/reviews/pattern-sweep-magi.md, PS-01). 10 CCR 2505-10 § 8.100.4.G.1 (S3351) makes each month its own ('eligible ... at any time during a calendar month'), and § 8.100.3.E.1 (S217) gives a retroactive month only to a person who 'met all applicable eligibility requirements' in it; CO-509 is one value per person, measured on the determination date, so a lawful permanent resident whose five years ended between a retroactive month and the determination, a lawfully residing child who turned 19 after a retroactive month, and a lawfully residing woman pregnant in a retroactive month but not on the determination date were judged in that month by the determination date's facts. The five years end, the pregnancy and the age under 19 are each met on a day of the month (G.1; docs/operators.md, Ages in a month). The October 2026 federal payment limit (ma_alien_payment_restriction_applies, CO-3034) is read on the determination date, as CO-509 reads it (OQ-510, a recorded state policy choice: the determination date, not the month of service, decides it). Every other condition is CO-509's (the precision and statute_override of CO-509 apply). Read by the MAGI and CHP+ items that test status for a month: ma_magi_is_fully_eligible (CO-562), ma_is_emergency_medicaid_only (CO-510), ma_family_planning_status (CO-1154), ma_needy_young_person_category (CO-2419) and ma_meets_status_for_cover_all_coloradans_categories_in_month (CO-7553). CO-509 itself is unchanged and still read by the non-MAGI categories (left to that family's sweep)."
derived: [any, is_us_citizen_or_national, [all, [any, [all, is_qualified_non_citizen, [any, ma_has_held_qualified_status_five_years_in_month, ma_is_five_year_bar_exempt]], ["=", immigration_status, iraqi_afghan_special_immigrant], [all, ma_is_lawfully_present, ["<", us_entry_date, qualified_non_citizen_entry_cutoff_date]]], [any, [not, [as_of, ma_alien_payment_restriction_applies, [det_date]]], ma_is_in_federal_payment_status_category]], [all, ma_is_lawfully_present, [any, ma_is_pregnant_in_month, ["<", ma_age_on_first_day_of_month, ma_magi_child_age_limit]]]]
sources: [S173, S655, S656, S657, S658, S176, S1700, S1704, S1705, S3351, S217]
open: [OQ-510, OQ-213, OQ-517, OQ-518, OQ-550, OQ-1425]
implemented: engine
tags: [ma, magi, immigration, age]
nearest: [CO-509, CO-7550]
rationale: "Pattern sweep, MAGI (PS-01): the month-scoped MAGI items read the person-scope status test CO-509, which measures the five years, the pregnancy and the child's age on the determination date. LPR-5Y (stored household CO-1000): a lawful permanent resident since 2021-09-15, applying on 2026-11-02 with a retroactive request, was full-coverage eligible in August 2026 although her five years ended in September. YOUTH-19 (CO-1001): a lawfully residing youth who turned 19 in September was emergency-only in August. CO-509 is kept for its person-scope and non-MAGI readers."
tests:
  - {id: CO-7551-T1, as_of: "2026-11-10", month: "2026-08", title: "PS-01 (LPR-5Y): lawful permanent resident adult since 2021-09-15, August 2026: inside the five years, no exemption", given: {immigration_status: lawful_permanent_resident, qualified_status_date: "2021-09-15", us_entry_date: "2021-09-15", date_of_birth: "1990-01-01", is_pregnant: false, has_military_connection: false, qualifying_quarters: 8, ma_application_date: "2026-11-02"}, expect: false}
  - {id: CO-7551-T2, as_of: "2026-11-10", month: "2026-09", title: "PS-01 (LPR-5Y): the same, September 2026: the five years end on September 15", given: {immigration_status: lawful_permanent_resident, qualified_status_date: "2021-09-15", us_entry_date: "2021-09-15", date_of_birth: "1990-01-01", is_pregnant: false, has_military_connection: false, qualifying_quarters: 8, ma_application_date: "2026-11-02"}, expect: true}
  - {id: CO-7551-T3, as_of: "2026-11-10", month: "2026-08", title: "PS-01 (YOUTH-19): Temporary Protected Status, born 2007-09-20, August 2026: 18 on the first day, a lawfully residing child (vii)", given: {immigration_status: temporary_protected_status, us_entry_date: "2015-06-01", date_of_birth: "2007-09-20", is_pregnant: false, ma_application_date: "2026-11-02"}, expect: true}
  - {id: CO-7551-T4, as_of: "2026-11-10", month: "2026-10", title: "PS-01 (YOUTH-19): the same, October 2026: 19 on the first day, an adult entered after 1996: not met", given: {immigration_status: temporary_protected_status, us_entry_date: "2015-06-01", date_of_birth: "2007-09-20", is_pregnant: false, ma_application_date: "2026-11-02"}, expect: false}
  - {id: CO-7551-T5, as_of: "2026-11-10", month: "2026-09", title: "PS-01: Temporary Protected Status adult, pregnant from 2026-03-01 to a birth on 2026-10-05 (end stated), September: pregnant in the month (vii)", given: {immigration_status: temporary_protected_status, us_entry_date: "2015-06-01", date_of_birth: "1995-02-01", is_pregnant: false, pregnancy_start_date: "2026-03-01", pregnancy_end_date: "2026-10-05", ma_application_date: "2026-09-02"}, expect: true}
  - {id: CO-7551-T6, as_of: "2026-11-10", month: "2026-11", title: "PS-01: the same, November: not pregnant, an adult: not met (the postpartum months are the pregnancy coverage period's and Cover All Coloradans', not vii's)", given: {immigration_status: temporary_protected_status, us_entry_date: "2015-06-01", date_of_birth: "1995-02-01", is_pregnant: false, pregnancy_start_date: "2026-03-01", pregnancy_end_date: "2026-10-05", ma_application_date: "2026-09-02"}, expect: false}
  - {id: CO-7551-T7, as_of: "2026-11-10", month: "2026-09", title: "PS-01: refugee adult, September 2026, determined in November: the October 2026 federal limit is read on the determination date (OQ-510): not met", given: {immigration_status: refugee, qualified_status_date: "2024-02-01", date_of_birth: "1988-01-01", is_pregnant: false, ma_application_date: "2026-11-02"}, expect: false}
  - {id: CO-7551-T8, as_of: "2026-11-10", month: "2026-09", title: "Citizen", given: {immigration_status: us_citizen, date_of_birth: "1980-01-01", is_pregnant: false}, expect: true}
