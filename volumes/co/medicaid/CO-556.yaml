id: CO-556
name: "Medicaid: child continuous eligibility end month"
identifier: ma_child_continuous_eligibility_end_month
kind: derived
type: month
scope: person
program: Medicaid
meaning: The last month of a child's continuous eligibility period under 10 CCR 2505-10 8.100.3.Q.2 and 42 CFR 435.926(c) - 11 months after the period's start month (a 12-month period inclusive of its start month), anchored on the month ma_application_date falls in, or on continuous_eligibility_period_start_month when that fact states an earlier month (a period already open from a prior determination or redetermination).
precision: "8.100.3.Q.2 begins the period 'on the first day of the month the application is received, or from the date all criteria are met'; this item anchors on [month_of, ma_application_date] (P10), not [det_month], falling back to that anchor only when continuous_eligibility_period_start_month (CO-094) is unknown (P4, 'otherwise'). The end month is 11, not 12, months after the start month: 42 CFR 435.926(c)(1) states the period's length as ma_continuous_eligibility_months months and (c)(2) begins it on the application/all-criteria-met date, so a period beginning in month M covers M through M+11 inclusive (twelve months total) and ends with M+11, not M+ma_continuous_eligibility_months. Reads ma_continuous_eligibility_months (CO-196) with pattern P44 instead of a hard-coded count, so a change to the parameter changes the rule. Coverage pass 6, C6-08 (2026-11-24): the start month is ma_child_continuous_eligibility_start_month (CO-7405): the recorded start, else the first month of the application, through the determination month, in which continuous eligibility applies."
derived: [months_after, ["-", ma_continuous_eligibility_months, 1], [at, ma_child_continuous_eligibility_start_month, [det_month]]]
sources: [S215, S216]
implemented: engine
tags: [ma, magi, age]
rationale: "No existing item computes a continuous eligibility end month correctly. Rewritten in the fix round per the phase-3 review's C-4(b)/(c) findings: the prior derivation was twelve nested month_after steps off [det_month], which (b) counted a thirteen-month period and (c) anchored on the wrong date (8.100.3.Q.2 names the application-received month, not the determination month). Uses months_after (P44, now implemented per docs/conventions.md) rather than nested month_after steps, and ma_application_date (CO-088) with continuous_eligibility_period_start_month (CO-094) as the anchor, matching ma_retroactive_coverage_start_month's (CO-557) own use of ma_application_date. History moved from the precision note (HCPF review S-14): Vocabulary fix round (U-7): reads ma_continuous_eligibility_months (CO-196) with pattern P44 instead of a hard-coded count, so a change to the parameter changes the rule. Precision history (moved from precision, engineering follow-up pass task 5): per the phase-3 review's C-4(c) finding; the phase-3 review's C-4(b) finding."
tests:
  - {id: CO-556-T1, as_of: "2026-10-01", title: "A period from October 2026 (restated for C6-08: the start month is CO-7405): September 2027", given: {ma_application_date: "2026-10-15", ma_child_continuous_eligibility_start_month: {"2026-10": "2026-10"}}, expect: "2027-09"}
  - {id: CO-556-T2, as_of: "2027-01-15", given: {ma_application_date: "2027-01-05", continuous_eligibility_period_start_month: "2026-04"}, expect: "2027-03"}
  - {id: CO-556-T3, as_of: "2026-11-10", title: "C6-08: applied 2026-10-05, the Children's category first met in November (a transition from CHP+): the period runs November 2026 + 11 = October 2027", given: {ma_application_date: "2026-10-05", ma_continuous_eligibility_applies: {"2026-10": false, "2026-11": true}}, expect: "2027-10"}
