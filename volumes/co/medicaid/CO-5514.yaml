id: CO-5514
name: "Medicaid SSI method: a person's gross unearned receipts"
identifier: ma_ssi_gross_unearned_receipts
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The person's unearned income received in the month before any exemption, deduction or disregard: every receipt the SSI method's counting table (CO-5510) treats as income (counted, counted because no rule excludes it, rents, child support, exempt) and a retroactive SSI payment, at its gross amount less the parts that are not the person's income at all (what a death benefit, an inheritance or a settlement paid toward the deceased's last illness and burial or the costs it covers, 10 CCR 2505-10 8.100.5.F.5.a and 20 CFR 416.1121(e), (g); what an award includes for the claim's expenses, 416.1123(b)(3); a veterans benefit's amount for a dependent, 416.1123(e)(1)), plus the amount of a veterans benefit attributable to the person as a dependent, from the stated receipts of any person of the case who receives it and with whom the person resides (the record's for_dependent, on a record whose for_person names this person; 20 CFR 416.1123(e)(2)(i): \"we count the amount attributable to you as your unearned cash income if ... You reside with the individual who receives the veterans benefit\"); not a loan, an income tax refund, VA Aid and Attendance, a reverse mortgage payment, a reimbursement, the proceeds of converting a resource or a government program's social services or vocational rehabilitation assistance, which are not income (20 CFR 416.1103; 8.100.5.K, L.1, P.1, F.6.w), not current SSI, not money from a sponsor (OQ-972), and not gambling winnings, which the readers add with the hardship exemption (ma_ssi_gambling_receipts). The gross income of long-term care (8.100.7.A.1, ma_ltc_gross_income) and the unearned income to verify for an aged, blind or disabled applicant (8.100.5.B.1.d)."
precision: "Coverage pass 4, non-MAGI N4-1, N4-2 and N4-4: the rows the counting table now reads as not income (reverse_mortgage, reimbursement, resource_liquidation, savings_account_distribution, insurance_cash_value, in_home_care_allowance, vocational_training_allowance) are out of the gross income, as loans and tax refunds were (coverage pass 3 C3-10); the 416.1121(e) and 416.1123(b)(3) parts are not income received, so they are out too. The $60 a quarter of 416.1124(c)(6) and the PASS set-aside are exclusions, not \"not income\", so they stay in (8.100.7.A.1: \"before application of deductions, exemptions or disregards\"). Field-effect sweep (docs/reviews/field-sweep-snap-cash-nonmagi.md), FS-MA-1: a receipt stated as a stream (no month and no date) is received only in the months from the month of its start_date through the month of its end_date (each absent: before, or through, the months the case covers; CO-5000), since unearned income \"is countable as income in the month received\" (10 CCR 2505-10 8.100.5.F.5, S3001) and is counted \"when you receive it\" (20 CFR 416.1123(a), S4940); in its first and last months it is read at its amount, and a payment stated with its month or date is placed by it, a final payment after the stream ended included. Before, a stream was counted in every month whatever its dates. The clause is SNAP's (snap_counted_recurring_receipts, CO-5011). Field-effect sweep (docs/reviews/field-sweep-snap-cash-nonmagi.md), FS-MA-8: of a retroactive payment from a benefit program other than SSI, the legal fees connected with the claim (designated_for_legal_fees, the part of designated_for_lump_sum_costs that is legal fees) are subtracted, and the payment's other designated costs are not: 20 CFR 416.1123(b)(3) (S4756), \"If you receive a retroactive check from a benefit program other than SSI, legal fees connected with the claim are subtracted. We do not subtract from any taxable unearned income the part you have to use to pay personal income taxes\"; the legal fees are required where read (decision 4 of 2026-11-23): a retroactive payment that does not state them cannot be determined. Before, nothing of designated_for_lump_sum_costs was read. Cross-list records round (docs/reviews/cross-list-records.md), OQ-1348 resolved: the amount of a veterans benefit attributable to the person as a dependent of a person of the case she lives with is her gross unearned income (416.1123(e)(2)(i), S4756), read from that person's receipts as ma_ssi_unearned_receipts (CO-5511) reads it, on the receipts this item reads; so the long-term care gross income and the verification of a dependent living with a veteran include it. Before, the part was taken from the veteran's gross income and added to no one's."
derived: ["+", [sum_receipts, receipts, [all, [received_in, [month]], [any, [not, [unknown, [receipt, month]]], [all, [any, [unknown, [receipt, start_date]], ["<=", [month_of, [receipt, start_date]], [month]]], [any, [unknown, [receipt, end_date]], [">=", [month_of, [receipt, end_date]], [month]]]]], [any, [in, [lookup, ma_ssi_receipt_treatment_table, [receipt, kind]], [counted, counted_no_rule_excludes, counted_net_of_expenses, child_support, exempt, exempt_public_assistance]], [all, [receipt, retroactive], [in, [lookup, ma_ssi_receipt_treatment_table, [receipt, kind]], [ssi_benefit]]]]], [max, 0, ["-", [receipt, amount], ["+", [receipt, spent_on_covered_costs], [receipt, claim_expense], [receipt, for_dependent], [case, [[all, [receipt, retroactive], [not, ["=", [receipt, kind], ssi]]], [receipt, designated_for_legal_fees]], [else, 0]]]]]], [case, [["=", [count, [persons]], 1], 0], [else, [sum, [filter, [persons], [not, [unknown, [of, [P], receipts]]]], [case, [["=", [sum_receipts, [of, [P], receipts], [all, [received_in, [month]], [any, [not, [unknown, [receipt, month]]], [all, [any, [unknown, [receipt, start_date]], ["<=", [month_of, [receipt, start_date]], [month]]], [any, [unknown, [receipt, end_date]], [">=", [month_of, [receipt, end_date]], [month]]]]], [any, [in, [lookup, ma_ssi_receipt_treatment_table, [receipt, kind]], [counted, counted_no_rule_excludes, counted_net_of_expenses, child_support, exempt, exempt_public_assistance]], [all, [receipt, retroactive], [in, [lookup, ma_ssi_receipt_treatment_table, [receipt, kind]], [ssi_benefit]]]], [">", [receipt, for_dependent], 0], [not, [unknown, [receipt, for_person]]], [in_group, [receipt, for_person], [reachable, [spouse], false]]], [receipt, for_dependent]], 0], 0], [[in_group, [P], lives_with], [sum_receipts, [of, [P], receipts], [all, [received_in, [month]], [any, [not, [unknown, [receipt, month]]], [all, [any, [unknown, [receipt, start_date]], ["<=", [month_of, [receipt, start_date]], [month]]], [any, [unknown, [receipt, end_date]], [">=", [month_of, [receipt, end_date]], [month]]]]], [any, [in, [lookup, ma_ssi_receipt_treatment_table, [receipt, kind]], [counted, counted_no_rule_excludes, counted_net_of_expenses, child_support, exempt, exempt_public_assistance]], [all, [receipt, retroactive], [in, [lookup, ma_ssi_receipt_treatment_table, [receipt, kind]], [ssi_benefit]]]], [">", [receipt, for_dependent], 0], [not, [unknown, [receipt, for_person]]], [in_group, [receipt, for_person], [reachable, [spouse], false]]], [receipt, for_dependent]]], [else, 0]]]]]]
sources: [S3001, S2209, S2900, S3404, S351, S4750, S4751, S4752, S4755, S4756, S4757, S4940]
implemented: engine
tags: [ma, non_magi, ltc, income]
rationale: "Receipt records, migration phase 2: replaces the sum of the scalar unearned income facts less loans, tax refunds and VA Aid and Attendance in ma_ltc_gross_income (CO-641) and the reasonable compatibility of a long-term care applicant (CO-1640), and the aged, blind and disabled arm of ma_has_unearned_income_for_verification (CO-2870)."
tests:
  - {id: CO-5514-T1, month: "2026-10", as_of: "2026-10-01", given: {receipts: [{kind: social_security, amount: 900}, {kind: foster_care_payment, amount: 600}, {kind: colorado_works_cash, amount: 300}, {kind: child_support, amount: 100}, {kind: loan, amount: 600}, {kind: income_tax_refund, amount: 250}, {kind: va_aid_and_attendance, amount: 400}, {kind: ssi, amount: 200}]}, title: "Exempt income is gross income; loans, refunds and VA Aid and Attendance are not income", expect: 1900}
  - {id: CO-5514-T2, month: "2026-10", as_of: "2026-10-01", given: {receipts: [{kind: ssi, amount: 1500, frequency: once, retroactive: true, month: "2026-10"}, {kind: gambling_winnings, amount: 500, frequency: once, month: "2026-10"}]}, title: "A retroactive SSI payment is gross income in the month received; gambling is added by the readers", expect: 1500}
  - {id: CO-5514-T3, month: "2026-11", as_of: "2026-11-20", given: {receipts: [{kind: social_security, amount: 2500}, {kind: reverse_mortgage, amount: 600}]}, title: "N4-1: a reverse mortgage payment is not income (L.1), so not in the 300% test's gross income: 2,500", expect: 2500}
  - {id: CO-5514-T4, month: "2026-11", as_of: "2026-11-20", given: {receipts: [{kind: social_security, amount: 400}, {kind: other_nontaxable, amount: 3000, date: "2026-11-03", frequency: once, spent_on_covered_costs: 2500}, {kind: workers_compensation, amount: 1500, date: "2026-11-03", frequency: once, claim_expense: 1200}, {kind: crime_victim_compensation, amount: 600, date: "2026-11-04", frequency: once}, {kind: resource_liquidation, amount: 3000, date: "2026-11-05", frequency: once}]}, title: "N4-2, N4-4: 400 + (3,000 - 2,500) + (1,500 - 1,200) + 600 (exempt, still gross income) + 0 (a resource sold) = 1,800", expect: 1800}
  # Field-effect sweep, non-MAGI Medicaid (docs/reviews/field-sweep-snap-cash-nonmagi.md); hand-computed from the text quoted in each title.
  - {id: CO-5514-T5, month: "2026-11", as_of: "2026-11-12", title: "FS-MA-1: Social Security 800 and a 500 pension that ended 2026-10-31: 800", given: {receipts: [{kind: social_security, amount: 800}, {kind: pension, amount: 500, end_date: "2026-10-31"}]}, expect: 800}
  - {id: CO-5514-T6, month: "2026-11", as_of: "2026-11-12", title: "FS-MA-8: 1,000 of retroactive unemployment less 100 of legal fees for the claim: 900", given: {receipts: [{kind: unemployment_compensation, amount: 1000, date: "2026-11-05", frequency: once, retroactive: true, designated_for_lump_sum_costs: 300, designated_for_legal_fees: 100}]}, expect: 900}
  # Cross-list records round (docs/reviews/cross-list-records.md): 416.1123(e)(2), the dependent's side (OQ-1348 resolved).
  - {id: CO-5514-T7, month: "2027-02", as_of: "2027-02-15", title: "The wife p1, $800 of Social Security, living with the veteran p2, whose $1,500 award has $300 attributable to her (416.1123(e)(2)(i)): her gross unearned income 800 + 300 = 1,100", given: {receipts: [{kind: social_security, amount: 800}], dwelling_id: h1}, others: {p2: {receipts: [{kind: other_nontaxable, amount: 1500, for_dependent: 300, for_person: p1}], dwelling_id: h1}}, relationships: [[spouse, p1, p2]], expect: 1100}
  - {id: CO-5514-T8, month: "2027-02", as_of: "2027-02-15", title: "The same wife living in another home: the part is not hers (no separate payment): 800", given: {receipts: [{kind: social_security, amount: 800}], dwelling_id: h2}, others: {p2: {receipts: [{kind: other_nontaxable, amount: 1500, for_dependent: 300, for_person: p1}], dwelling_id: h1}}, relationships: [[spouse, p1, p2]], expect: 800}
