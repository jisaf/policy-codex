id: CO-600
name: "Medicaid: is aged"
identifier: ma_is_aged
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether the person meets the SSI-related \"aged\" category's age requirement in the month - ma_aged_age years or older on some day of it, per 42 U.S.C. 1382c(a)(1)(A) and the federal ceiling of 42 CFR 435.520, with 10 CCR 2505-10 § 8.100.5.C.1's effective date for the Aged, Blind and Disabled categories (\"the first day of the month the person becomes eligible\", S3900)."
precision: "Reads ma_age_on_last_day_of_month (CO-5402): a person whose 65th birthday falls in the month is aged for the whole month, and one who turns 65 in a later month is not aged in a retroactive month before it. Time audit T-1 (2026-11-23, CO-533): this read age (CO-300) on the determination date in every month, so the retroactive months before a 65th birthday were aged. A rule about the determination itself reads it [at] the determination month; ma_is_aged_blind_or_disabled (CO-603) reads it in the month since coverage pass 6 (F6-4)."
derived: [">=", ma_age_on_last_day_of_month, ma_aged_age]
sources: [S3900, S304, S305]
implemented: engine
tags: [ma, non_magi, age]
rationale: "No existing item states the SSI-related aged-category age test (the MAGI chapter's category rules use different age floors for children, adults and former foster youth). ma_is_aged_blind_or_disabled (CO-603) needs it. Same shape as snap_is_elderly (CO-301, age at least a parameter), acknowledged: SNAP's elderly age is 60 (7 CFR 271.2) and Medicaid's aged category is 65 (42 CFR 435.520), so the two are distinct policy thresholds owned by different programs. Also same shape as af_is_oap_age (CO-940, age at least a parameter), acknowledged: the Old Age Pension age floor is 60 (26-2-111(2)(a)(I)), a third distinct policy threshold owned by the Adult Financial program."
nearest: [CO-301, CO-940]
tests:
  - {id: CO-600-T1, month: "2026-10", as_of: "2026-10-01", given: {date_of_birth: "1947-03-12"}, expect: true}
  - {id: CO-600-T2, month: "2026-10", as_of: "2026-10-01", given: {date_of_birth: "1980-01-01"}, expect: false}
  # Time audit T-1 (CO-533): 65th birthday on 2026-10-20, determination 2026-11-12.
  - {id: CO-600-T3, as_of: "2026-11-12", month: "2026-09", title: "T-1: the retroactive month before the 65th birthday month is not aged", given: {date_of_birth: "1961-10-20"}, expect: false}
  - {id: CO-600-T4, as_of: "2026-11-12", month: "2026-10", title: "T-1: the 65th-birthday month is aged (8.100.5.C.1)", given: {date_of_birth: "1961-10-20"}, expect: true}
