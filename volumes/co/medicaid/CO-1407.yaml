id: CO-1407
name: "Medicaid: requires verification of residency"
identifier: ma_requires_verification_of_residency
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether the person's Colorado residency must be documented for Medical Assistance: attestation is accepted unless questionable, and not where documentation is not reasonably available (the case-by-case special-circumstances exception)."
derived: [all, residency_attestation_is_questionable, [not, documentation_not_reasonably_available]]
sources: [S842, S863, S839]
implemented: engine
tags: [verification, ma]
rationale: No existing item states this Medical Assistance verification requirement; the phase-9 chapter needs one item per element so the person's pending counts and status can be derived.
