id: CO-547
name: "Medicaid: meets the Parents and Caretaker Relatives MAGI category"
identifier: ma_is_parent_caretaker_category
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: Whether the person meets the Parents and Caretaker Relatives MAGI Medical Assistance category under 10 CCR 2505-10 8.100.4.G.3 - a parent or caretaker relative of a dependent child living with them, with household income at or below ma_magi_income_standard_parent_caretaker, applying the 5% income disregard of 42 CFR 435.603(d)(4) and 8.100.4.D as the last step only if income above the plain standard would otherwise make the person ineligible.
precision: "'Living with them' is read from the case's stated parent or caretaker relationship edge, per this volume's convention (see ma_magi_household_members, CO-500) that a stated relationship edge is read as living together. 'Parent or caretaker relative' reads the case's parent and caretaker relationship roles; this batch does not separately test 42 CFR 435.4's caretaker-relative list of specific relations (grandparent, aunt, and so on) because this volume's relationship model already narrows caretaker to that meaning - see OQ-51. Per 42 CFR 435.603(d)(4), the disregard disjunct is gated on ma_magi_income_standard_parent_caretaker being this person's highest standard (ma_magi_highest_income_standard_pct, CO-539, fix round) - the phase-3 review's C-2 finding: it is available here only for a person the Adults group is closed to (65+, Medicare-entitled), not for every parent/caretaker between 60% and 65% of FPL, who is placed in the Adults group instead. Dropped the minimum-essential-coverage condition on the dependent child in the fix round: 8.100.4.G.3 states only the dependent-child relationship, with no MEC condition; the MEC condition belongs to the Adults category (8.100.4.G.4.a, 42 CFR 435.119(c)(1)) - the phase-3 review's C-3 finding."
derived: [all, [exists_related, [parent, caretaker], [of, [P], ma_is_dependent_child]], [any, ["<=", ma_magi_household_income_pct_fpl, ma_magi_income_standard_parent_caretaker], [all, [=, ma_magi_income_standard_parent_caretaker, ma_magi_highest_income_standard_pct], ["<=", ["-", ma_magi_household_income_pct_fpl, ma_magi_income_disregard_pct], ma_magi_income_standard_parent_caretaker]]]]
sources: [S203, S205, S165, S168]
open: [OQ-51]
implemented: engine
tags: [ma, magi, income, household]
rationale: "No existing item states the Parents/Caretaker-category test. ma_magi_category (CO-551) needs it, listed after the Pregnant Women category and before Former Foster Care and Adults per the phase-3 brief's mandatory-group ordering. Uses exists_related (P26) over both the parent and caretaker relationship roles because 8.100.4.G.3 and 435.110(b)/435.4 read 'parent' and 'caretaker relative' as alternative bases for the same category. Fix round: dropped the MEC conjunct (C-3, moved to CO-548) and gated the disregard disjunct on ma_magi_highest_income_standard_pct (C-2)."
tests:
  - {id: CO-547-T1, as_of: "2026-10-01", month: "2026-10", given: {ma_magi_household_income_pct_fpl: 0.50, ma_magi_highest_income_standard_pct: 1.33}, others: {p2: {date_of_birth: "2015-01-01", is_enrolled_in_school: false}}, relationships: [[parent, p2]], expect: true}
  - {id: CO-547-T2, as_of: "2026-10-01", month: "2026-10", title: "Fix round (C-2): a parent under 65, not Medicare-entitled, at 63% FPL - the Adults group (133%) is her highest standard, so the disregard is not available at 60%; the correct category is adult, not parent_caretaker", given: {ma_magi_household_income_pct_fpl: 0.63, ma_magi_highest_income_standard_pct: 1.33}, others: {p2: {date_of_birth: "2015-01-01", is_enrolled_in_school: false}}, relationships: [[parent, p2]], expect: false}
  - {id: CO-547-T3, as_of: "2026-10-01", month: "2026-10", given: {ma_magi_household_income_pct_fpl: 0.80, ma_magi_highest_income_standard_pct: 1.33}, others: {p2: {date_of_birth: "2015-01-01", is_enrolled_in_school: false}}, relationships: [[parent, p2]], expect: false}
  - {id: CO-547-T4, as_of: "2026-10-01", month: "2026-10", given: {ma_magi_household_income_pct_fpl: 0.30, ma_magi_highest_income_standard_pct: 1.33}, others: {}, relationships: [], expect: false}
  - {id: CO-547-T5, as_of: "2026-10-01", month: "2026-10", title: "Fix round (C-2): a Medicare-entitled grandmother caretaker at 63% FPL - the Adults group is closed to her (Medicare-entitled), so 60% is her highest standard and the disregard IS available", given: {ma_magi_household_income_pct_fpl: 0.63, ma_magi_highest_income_standard_pct: 0.60}, others: {p2: {date_of_birth: "2015-01-01", is_enrolled_in_school: false}}, relationships: [[caretaker, p2]], expect: true}
