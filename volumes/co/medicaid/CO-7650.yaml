id: CO-7650
name: "Medicaid: meets the residency requirement in the month"
identifier: ma_meets_residency_in_month
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether the person is a resident of Colorado for Medical Assistance in the month evaluated: a resident on the determination date (ma_meets_residency, CO-2250) who was living in Colorado on some day of the month. In the application month and after, the residence the person states for the application holds (10 CCR 2505-10 § 8.100.3.B.1-2: the person applies in the county where the person lives and is a resident who is living in Colorado 'at the time of application'); in a month before the application month, the person lived in Colorado from the month of state_of_residence_start_date (CO-7651), or, for a person incapable of indicating intent whose residence the institutional rules give, was in the medical institution in the month (ma_resides_in_medical_institution_in_month, CO-7500)."
precision: "Medicaid status by month (2026-11-24, docs/reviews/medicaid-status-by-month.md, MS-1). § 8.100.3.E.1 (S1503) gives a retroactive month only to a person who 'met all applicable eligibility requirements' in it, and 42 CFR 435.915(a)(2) (S218) only where the person 'would have been eligible for Medicaid at the time he received the services if he had applied': a person living in another state in a retroactive month was not a resident of Colorado in it (§ 8.100.3.B.2, S1518, 'living within the state of Colorado'). ma_meets_residency (CO-2250) is one value per person, the determination date's, and every month-scoped Medicaid item read it, so a retroactive month before a move to Colorado was a month of residence. A month counts if the person lived in Colorado on any day of it (§ 8.100.4.G.1, S3351, for MAGI; § 8.100.5.C.1, S3900, from 'the first day of the month the person becomes eligible' for the Aged, Blind and Disabled categories), so the month of the move is a month of residence. The application month needs no date: the person applied where the person lived (B.1-2). state_of_residence_start_date is required for a month before the application month (decision 4 of 2026-11-23); ma_application_date is read only for a month before the determination month. B.2 measures the intent to remain 'at the time of application', and 435.915(a)(2) each retroactive month 'at the time': OQ-1445 records the reading (each retroactive month needs living in Colorado in it). The incapable-of-intent arm reads ma_is_incapable_of_indicating_intent with its declared default (not stated: no finding of incapacity), as CO-2250 does. A person who moved away from Colorado and back between a retroactive month and the determination is not stated by any fact (OQ-1425). is_colorado_resident (CO-505), shared with SNAP, CHP+, Colorado Works, Adult Financial, CCCAP and LEAP, is unchanged."
derived: [all, ma_meets_residency, [any, [">=", [month], [det_month]], [">=", [month], [month_of, ma_application_date]], ["<=", [month_of, state_of_residence_start_date], [month]], [all, [otherwise, ma_is_incapable_of_indicating_intent, false], ma_resides_in_medical_institution_in_month]]]
sources: [S1518, S172, S1503, S218, S3351, S3900]
open: [OQ-1445, OQ-1425]
implemented: engine
tags: [ma, magi, non_magi]
nearest: [CO-2250, CO-7500]
rationale: "Medicaid status by month (MS-1): the MAGI sweep recorded residency under OQ-1425 and the non-MAGI sweep listed its readers as SHARED (docs/reviews/pattern-sweep-nonmagi.md); every Medicaid category reads residency for a month (CO-554, CO-562, CO-611, CO-653, CO-1151 and the rest), so the month's reading is one Medicaid item over the determination date's (CO-2250), not a change to the shared is_colorado_resident (CO-505), whose other readers fix their own point in time. MOVED-IN (stored household CO-1060): a person who moved from Wyoming to Denver on 2026-09-20 and applied on 2026-10-15 with a retroactive request was a resident in July and August."
tests:
  # Moved to Colorado 2026-09-20; applied 2026-10-15; determined 2026-11-10. State CO on the determination date.
  # August: before the application month; month_of(2026-09-20) = 2026-09 > 2026-08: false. September: 2026-09 <= 2026-09 (a day of the month in Colorado): true.
  - {id: CO-7650-T1, as_of: "2026-11-10", month: "2026-08", title: "MS-1: a retroactive month before the move to Colorado: not a resident", given: {state_of_residence: CO, state_of_residence_start_date: "2026-09-20", ma_application_date: "2026-10-15"}, expect: false}
  - {id: CO-7650-T2, as_of: "2026-11-10", month: "2026-09", title: "MS-1: the month of the move: a resident on a day of it", given: {state_of_residence: CO, state_of_residence_start_date: "2026-09-20", ma_application_date: "2026-10-15"}, expect: true}
  # October: the application month (2026-10 >= 2026-10): the residence stated for the application; no date read.
  - {id: CO-7650-T3, as_of: "2026-11-10", month: "2026-10", title: "MS-1: the application month: resident at the time of application, no date needed", given: {state_of_residence: CO, ma_application_date: "2026-10-15"}, expect: true}
  - {id: CO-7650-T4, as_of: "2026-11-10", month: "2026-11", title: "MS-1: the determination month: as stated, nothing else read", given: {state_of_residence: CO}, expect: true}
  # July: before the application month with no date stated: cannot be determined (decision 4).
  - {id: CO-7650-T5, as_of: "2026-11-10", month: "2026-07", title: "MS-1: a retroactive month with no residence start date stated: cannot determine", given: {state_of_residence: CO, ma_application_date: "2026-10-15"}, expect: unknown}
  - {id: CO-7650-T6, as_of: "2026-11-10", month: "2026-07", title: "MS-1: living in Colorado since 2019: a resident in a retroactive month", given: {state_of_residence: CO, state_of_residence_start_date: "2019-04-01", ma_application_date: "2026-10-15"}, expect: true}
  - {id: CO-7650-T7, as_of: "2026-11-10", month: "2026-09", title: "MS-1: not a resident on the determination date (Wyoming): false in every month", given: {state_of_residence: WY, state_of_residence_start_date: "2015-01-01", ma_application_date: "2026-10-15"}, expect: false}
  # Incapable of indicating intent, in a Colorado nursing facility since 2026-08-03 (placed by no state; became incapable at 70, CO-2250-T3's facts); state of residence stated WY.
  # August: before the application month, no Colorado start date; in the institution from the month of entry (CO-7500): resident.
  - {id: CO-7650-T8, as_of: "2026-11-10", month: "2026-08", title: "MS-1: incapable of indicating intent, in a Colorado facility from 2026-08-03: resident in August through the institution", given: {ma_is_incapable_of_indicating_intent: true, resides_in_medical_institution: true, institution_entry_date: "2026-08-03", ma_was_placed_in_institution_by_a_state: false, date_of_birth: "1950-01-01", ma_became_incapable_of_indicating_intent_before_age_twenty_one: false, ma_institution_state: CO, state_of_residence: WY, ma_application_date: "2026-10-15"}, expect: true}
