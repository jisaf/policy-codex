id: CO-806
name: "Medicaid Buy-In for Working Adults: has a disability"
identifier: ma_wawd_is_disabled
kind: derived
type: yes/no
scope: person
program: Medicaid
meaning: "Whether the person has a disability for the Buy-In Program for Working Adults with Disabilities (10 CCR 2505-10 § 8.100.6.P.1.d): a disability as defined by the Social Security Administration's medical listing (meets_ssa_disability_criteria), or a limited disability as determined by a state contractor (ma_wawd_limited_disability_finding)."
derived: [any, meets_ssa_disability_criteria, [otherwise, ma_wawd_limited_disability_finding, false]]
sources: [S317]
implemented: engine
tags: [non_magi, buy_in, disability]
rationale: "8.100.6.P.1.d and 8.100.6.Q.1.d (S317, S318) each require a disability finding for the Buy-In programs, using a standard (SSA medical listing, plus WAwD's alternative limited-disability standard) that is not identical to the SSI/OAP disability standard meets_ssa_disability_criteria carries (1382c(a)(3)'s inability to engage in substantial gainful activity). ma_wawd_eligible and ma_cbwd_eligible (CO-618, CO-620) need it. Same-word audit SW-14, dual-entry 3.13: derived from the SSA finding (CO-011) and the contractor's finding (CO-2820), so a person found disabled by SSA is stated once; the Children's Buy-In (CO-620) reads CO-011 alone, since § 8.100.6.Q.1.d (S318) names only the SSA medical listing."
tests:
  - {id: CO-806-T1, title: "SSA disability", as_of: "2026-11-01", given: {meets_ssa_disability_criteria: true}, expect: true}
  - {id: CO-806-T2, title: "Limited disability found by the state contractor only", as_of: "2026-11-01", given: {meets_ssa_disability_criteria: false, ma_wawd_limited_disability_finding: true}, expect: true}
  - {id: CO-806-T3, title: "Neither", as_of: "2026-11-01", given: {meets_ssa_disability_criteria: false}, expect: false}
