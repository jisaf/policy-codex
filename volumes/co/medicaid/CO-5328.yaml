id: CO-5328
name: "Medicaid: the person's liquid holdings in the month, counted or not"
identifier: ma_liquid_holdings_value_in_month
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The value, at the person's share, of the person's liquid resources held in the month, whether counted or excluded: cash, financial institution accounts, stocks, bonds and mutual fund shares, retirement accounts, and the money of any source still held in an account or as cash (education savings and ABLE accounts, business cash, and the held_ records), each a holdings record (CO-5300) valued in the month and not transferred (20 CFR 416.1201(b), S2420: \"cash or other property which can be converted to cash within 20 days\")."
precision: "Resource records, Medicaid track H1: the figure the Medicare Savings Program verification reads (ma_requires_verification_of_resources, CO-1405: 42 CFR 435.952(e), the liquid resources verified, the attested value of non-liquid resources accepted), in place of liquid_resources_value (CO-3390) and retirement_accounts_value (CO-3392). The kinds are those the scalar liquid resources and retirement accounts restate (the translator's carving, scripts/records/translate-holdings.ts); life insurance, which 416.1201(b) lists as liquid, is taken on attestation (435.952(e)(4)(i)) and burial funds under (e)(3), as before."
derived: [sum_receipts, holdings, [all, [in, [receipt, kind], [cash, bank_account, securities, retirement_account, education_savings_account, able_account, business_cash_and_assets, held_income_tax_refund, held_eitc, held_retroactive_ssa_benefit, held_excluded_payment, held_loan_proceeds, held_replacement_proceeds, held_prorated_income]], [received_in, [month]], [unknown, [receipt, disposed_date]]], ["*", [otherwise, [receipt, share], 1], [receipt, value]]]
sources: [S2420, S2418, S2419]
implemented: engine
tags: [verification, ma, resources]
rationale: "Resource records, step H1 (Medicaid): the verification of liquid resources reads the holdings records, as the resource tests do."
tests:
  # Hand-computed from 20 CFR 416.1201(b) (S2420).
  - {id: CO-5328-T1, month: "2026-10", as_of: "2026-10-01", title: "300 in the bank, an 800 IRA and a 200 refund held, a car not liquid: 1,300", given: {holdings: [{kind: bank_account, value: 300}, {kind: retirement_account, value: 800}, {kind: held_income_tax_refund, value: 200, paid_by: federal, source_date: "2026-04-01"}, {kind: vehicle, value: 5000, amount_owed: 0, used_for_transportation: true}]}, expect: 1300}
  - {id: CO-5328-T2, month: "2026-10", as_of: "2026-10-01", title: "only a home: 0", given: {holdings: [{kind: home, value: 90000, amount_owed: 0}]}, expect: 0}
