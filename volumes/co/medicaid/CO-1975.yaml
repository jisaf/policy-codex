id: CO-1975
name: "Medicaid: Adults group community engagement condition"
identifier: ma_meets_adult_group_community_engagement_condition
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether the community engagement condition 42 CFR 435.119(d) attaches to the Adults group is satisfied for the month: the month is before ma_community_engagement_start_date, the requirement is not yet in force on the determination date (ma_community_engagement_requirement_in_force, CO-3035), the person's community engagement status (CO-1974) is not_assessed, excluded or met, or the person is an enrolled beneficiary (a renewal or a change-in-circumstances review) whose coverage continues: while a notice of noncompliance is due or its showing period runs (435.558(a)(3); 42 U.S.C. 1396a(xx)(6)(A)(ii)(II)), and after the period ends with no satisfactory showing, through the month after the month it ended, the latest month the State may disenroll (435.558(d)(2)(ii))."
precision: "Medical assistance furnished before the start date is not conditioned (435.559(a)), so a retroactive month before it passes even at a later determination; a determination made before the start date does not assess the requirement at all. Hard-coded numbers audit E-1: the second arm compared the determination date with the start date; it reads the versions of CO-3035 instead. OQ-413 part (4): an applicant is not found eligible in the Adults group while the notice is due or the showing period runs (ma_magi_eligibility_status, CO-554, reports pending_community_engagement), and is denied once it ends (ineligible_community_engagement); an enrolled beneficiary keeps coverage through those months and is disenrolled \"not later than the end of the month following the month in which the 30-calendar day period ... ends\" (435.558(d)(2)(ii)), read as that latest month: the State may disenroll earlier after advance notice, which no Colorado rule yet states (OQ-593)."
derived: [any, ["<", [first_day, [month]], ma_community_engagement_start_date], [not, ma_community_engagement_requirement_in_force], [not, [in, ma_community_engagement_status, [notice_required, notice_period, not_met]]], [all, [in, ma_community_engagement_review_type, [renewal, change_in_circumstances]], [case, [["=", ma_community_engagement_status, not_met], ["<=", [month], [month_after, [month_of, ma_community_engagement_response_period_end_date]]]], [else, true]]]]
sources: [S1200, S1212, S2108, S2109]
implemented: engine
open: [OQ-593]
tags: [ma, magi]
rationale: "OQ-65: ma_magi_category (CO-551) places a person in the Adults group only when this holds, and ma_magi_eligibility_status (CO-554) reports the failure as its own reason. OQ-413 (4), audit fix round 4: continued coverage of an enrolled beneficiary through the notice period and until disenrollment."
tests:
  - {id: CO-1975-T1, month: "2026-10", as_of: "2026-10-01", given: {}, title: "Before the start date the condition does not apply", expect: true}
  - {id: CO-1975-T2, month: "2027-03", as_of: "2027-03-01", title: "An applicant whose showing period ended: denied", given: {ma_community_engagement_status: not_met, ma_community_engagement_review_type: application}, expect: false}
  - {id: CO-1975-T3, month: "2027-03", as_of: "2027-03-01", given: {ma_community_engagement_status: excluded}, expect: true}
  - {id: CO-1975-T5, month: "2027-01", as_of: "2026-12-15", given: {}, title: "A December 2026 determination does not assess the requirement for January 2027", expect: true}
  - {id: CO-1975-T4, month: "2026-12", as_of: "2027-03-01", given: {ma_community_engagement_status: not_met}, title: "A retroactive month before the start date", expect: true}
  - {id: CO-1975-T6, month: "2027-09", as_of: "2027-09-15", title: "OQ-413 (4): an enrolled beneficiary at renewal during the showing period keeps coverage", given: {ma_community_engagement_status: notice_period, ma_community_engagement_review_type: renewal}, expect: true}
  - {id: CO-1975-T7, month: "2027-03", as_of: "2027-03-15", title: "OQ-413 (4): an applicant during the showing period is not yet eligible in the Adults group", given: {ma_community_engagement_status: notice_period, ma_community_engagement_review_type: application}, expect: false}
  - {id: CO-1975-T8, month: "2027-10", as_of: "2027-09-15", title: "OQ-413 (4): renewal, the period ended September 5 with no showing; covered through October, the latest month of disenrollment", given: {ma_community_engagement_status: not_met, ma_community_engagement_review_type: renewal, ma_community_engagement_response_period_end_date: "2027-09-05"}, expect: true}
  - {id: CO-1975-T9, month: "2027-11", as_of: "2027-09-15", title: "OQ-413 (4): the same beneficiary in November: disenrolled", given: {ma_community_engagement_status: not_met, ma_community_engagement_review_type: renewal, ma_community_engagement_response_period_end_date: "2027-09-05"}, expect: false}
