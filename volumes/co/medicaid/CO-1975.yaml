id: CO-1975
name: "Medicaid: Adults group community engagement condition"
identifier: ma_meets_adult_group_community_engagement_condition
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether the community engagement condition 42 CFR 435.119(d) attaches to the Adults group is satisfied for the month: the month is before ma_community_engagement_start_date (January 1, 2027), the determination is made before it, or the person's community engagement status (CO-1974) is not not_met."
precision: Medical assistance furnished before January 1, 2027 is not conditioned (435.559(a)), so a retroactive month before then passes even at a later determination; a determination made before the start date does not assess the requirement at all.
derived: [any, ["<", [first_day, [month]], ma_community_engagement_start_date], ["<", [det_date], ma_community_engagement_start_date], [not, ["=", ma_community_engagement_status, not_met]]]
sources: [S1200, S1212]
implemented: engine
tags: [ma, magi]
rationale: "OQ-65: ma_magi_category (CO-551) places a person in the Adults group only when this holds, and ma_magi_eligibility_status (CO-554) reports the failure as its own reason."
tests:
  - {id: CO-1975-T1, month: "2026-10", as_of: "2026-10-01", given: {}, title: "Before the start date the condition does not apply", expect: true}
  - {id: CO-1975-T2, month: "2027-03", as_of: "2027-03-01", given: {ma_community_engagement_status: not_met}, expect: false}
  - {id: CO-1975-T3, month: "2027-03", as_of: "2027-03-01", given: {ma_community_engagement_status: excluded}, expect: true}
  - {id: CO-1975-T4, month: "2026-12", as_of: "2027-03-01", given: {ma_community_engagement_status: not_met}, title: "A retroactive month before the start date", expect: true}
