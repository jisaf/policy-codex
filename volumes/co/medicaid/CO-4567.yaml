id: CO-4567
name: "Medicaid: MAGI household income for the budget period, as a share of the poverty guideline"
identifier: ma_budget_period_household_income_pct_fpl
kind: derived
type: rate
scope: person-month
program: Medicaid
meaning: "This person's MAGI household income under the budget period rules of 10 CCR 2505-10 § 8.100.4.C.4 - the month's income (ma_magi_household_income), or, where it is lower, the annualized income of a household with self-employment, seasonal or commission earnings (ma_annualized_household_income, C.4.a) - as a fraction of the monthly federal poverty guideline for ma_magi_household_size."
precision: "C.4.a applies the annualized figure to \"Applicants who are found financially ineligible based on current or previous monthly household income\": an applicant eligible on the month's income keeps it, and one ineligible on it is tested on the annualized income, which the lower of the two gives for every income standard, since each MAGI standard is a ceiling. Where nothing is annualized the two are the same. The guideline is read as ma_magi_household_income_pct_fpl read it before the coverage round (lookup_extended beyond the table's last row, divided by 12, no rounding of the ratio)."
derived: ["/", [min, ma_magi_household_income, ma_annualized_household_income], ["/", [lookup_extended, federal_poverty_guideline_annual_table, ma_magi_household_size, federal_poverty_guideline_annual_each_additional], 12]]
sources: [S3356, S55, S161]
implemented: engine
tags: [ma, magi, income]
open: [OQ-810]
rationale: "Coverage review F-04 (2026-11-22): the household income ratio every MAGI and CHP+ income test reads (ma_magi_household_income_pct_fpl, CO-504) was the month's income alone; C.4.a's annualized figure needs a step before C.5's premium tax credit test, which CO-504 now applies to this item."
tests:
  - {id: CO-4567-T1, month: "2026-11", as_of: "2026-11-10", title: "Coverage review F-04 (RV-SE): monthly $3,000, annualized $1,000, household of one: 1,000 / (15,960 / 12) = 75.2%", given: {ma_magi_household_income: 3000, ma_annualized_household_income: 1000, ma_magi_household_size: 1}, expect: 0.7518796992481203}
  - {id: CO-4567-T2, month: "2026-11", as_of: "2026-11-10", title: "Annualized higher than the month: the month's figure (eligible on it)", given: {ma_magi_household_income: 1000, ma_annualized_household_income: 1500, ma_magi_household_size: 1}, expect: 0.7518796992481203}
