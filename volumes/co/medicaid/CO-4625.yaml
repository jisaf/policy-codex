id: CO-4625
name: "Medicaid: blind or disabled children sharing the deemed parental income"
identifier: ma_ssi_deeming_children
kind: derived
type: group of persons
scope: person-month
program: Medicaid
meaning: "The blind or disabled children under ma_ssi_unemancipated_child_age_limit, not emancipated and not in a medical institution, who are children or stepchildren of a parent in this person's ma_ssi_deeming_parents (this person among them when blind or disabled): the eligible children among whom the parents' deemed income is divided equally (20 CFR 416.1165(e)(2))."
precision: "Blind is is_blind and disabled is meets_ssa_disability_criteria. A child whose own income already makes the child ineligible stays in the group: 416.1165(e)(3) does not take it out of the division but limits what it is deemed and passes the rest to the others, which ma_ssi_parental_income_deemed (CO-4626) does through ma_ssi_deeming_share_zeroes_benefit (CO-5904); the division is equal only among the children whose limit is not reached. Coverage pass 4, non-MAGI N4-9 (docs/operators.md, \"Ages in a month\"): the age is taken in the month evaluated, not on the determination date: an \"under N\" test on the first day of the month (ma_age_on_first_day_of_month, CO-4978), an \"N or older\" test on the last day (ma_age_on_last_day_of_month, CO-5402), and a test that excludes the person from what is favorable on the other day. Per month, as the deeming parents it reads (CO-4624). Coverage pass 4, non-MAGI N4-13 (decision 4 of 2026-11-23: missing information is cannot determine unless the rule says otherwise; readers do not invent defaults): a member's blindness and disability (the SSA's or the Department's finding, 8.100.6.B) are read as stated for every member, no longer as no for a member whose finding is unstated. Pattern sweep, non-MAGI Medicaid (docs/reviews/pattern-sweep-nonmagi.md, P1, P3): the blind or disabled children who share the deemed income are those in the child's household in the month (ma_ssi_lives_with_in_month, CO-7505; 20 CFR 416.1165, S3413: the deeming rules apply to 'a child living with your parents'); a child who lives in a facility is in it through the month of entry and not after (§ 8.100.7.A.1, S3406), and a child away for a stay the child returns from stays a member (416.1167(a)). Living together is read as stated, required where read (decision 4; convention rule 17). Before, a sibling living in another home shared the deemed income, and a sibling in a hospital was left out of every month. Pattern sweep, non-MAGI Medicaid (docs/reviews/pattern-sweep-nonmagi.md, P1): disability is read in the month: not in a month before the disability onset (ma_month_is_before_disability_onset, CO-4888; the onset is 'the date on which the person's disability began', CO-4887; 10 CCR 2505-10 § 8.100.5.C.4.b, S3623; § 8.100.3.E.1, S1503). Before, the undated finding was read in every month."
derived: [filter, [persons], [all, [otherwise, [has_relative_in, [child, stepchild], ma_ssi_deeming_parents], false], ["<", [of, [P], ma_age_on_first_day_of_month], ma_ssi_unemancipated_child_age_limit], [not, [otherwise, [of, [P], is_emancipated_minor], false]], [in_group, [P], ma_ssi_lives_with_in_month], [any, [of, [P], is_blind], [all, [of, [P], meets_ssa_disability_criteria], [not, [of, [P], ma_month_is_before_disability_onset]]]]]]
sources: [S3413, S3406, S5120, S3623, S1503]
implemented: engine
tags: [ma, non_magi, income, household]
rationale: "Coverage review NM-10: 20 CFR 416.1165(e)(2) divides the parental income to be deemed equally among the eligible children; ma_ssi_parental_income_deemed (CO-4626) needs the count."
tests:
  # Pattern sweep (P2, decision 4; convention rule 17): the home is stated (dwelling_id), required where read; the story has one home.
  - {id: CO-4625-T1, month: "2026-10", as_of: "2026-10-12", title: "two disabled children of one parent", given: {dwelling_id: h1, date_of_birth: "2016-03-01", meets_ssa_disability_criteria: true, ma_ssi_deeming_parents: [p2]}, others: {p2: {dwelling_id: h1, date_of_birth: "1985-01-01"}, p3: {dwelling_id: h1, date_of_birth: "2018-03-01", meets_ssa_disability_criteria: true, resides_in_medical_institution: false}}, relationships: [[child, p2], [parent, p2, p3]], expect: [p1, p3]}
  # Pattern sweep P3: the disabled sibling (p3) lives in another home (with the other parent, not a person of the case): not in the child's household, so not sharing: [p1].
  - {id: CO-4625-T2, month: "2026-10", as_of: "2026-10-12", title: "Pattern sweep: a disabled sibling living elsewhere does not share the deemed income", given: {date_of_birth: "2016-03-01", meets_ssa_disability_criteria: true, ma_ssi_deeming_parents: [p2], dwelling_id: h1, residence_setting_type: private_dwelling}, others: {p2: {date_of_birth: "1985-01-01", dwelling_id: h1, residence_setting_type: private_dwelling}, p3: {date_of_birth: "2018-03-01", meets_ssa_disability_criteria: true, dwelling_id: h2, residence_setting_type: private_dwelling}}, relationships: [[child, p2], [parent, p2, p3]], expect: [p1]}
