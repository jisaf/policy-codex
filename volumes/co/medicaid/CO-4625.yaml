id: CO-4625
name: "Medicaid: blind or disabled children sharing the deemed parental income"
identifier: ma_ssi_deeming_children
kind: derived
type: group of persons
scope: person-month
program: Medicaid
meaning: "The blind or disabled children under ma_ssi_unemancipated_child_age_limit, not emancipated and not in a medical institution, who are children or stepchildren of a parent in this person's ma_ssi_deeming_parents (this person among them when blind or disabled): the eligible children among whom the parents' deemed income is divided equally (20 CFR 416.1165(e)(2))."
precision: "Blind is is_blind and disabled is meets_ssa_disability_criteria. A child whose own income already makes the child ineligible stays in the group: 416.1165(e)(3) does not take it out of the division but limits what it is deemed and passes the rest to the others, which ma_ssi_parental_income_deemed (CO-4626) does through ma_ssi_deeming_share_zeroes_benefit (CO-5904); the division is equal only among the children whose limit is not reached. Coverage pass 4, non-MAGI N4-9 (docs/operators.md, \"Ages in a month\"): the age is taken in the month evaluated, not on the determination date: an \"under N\" test on the first day of the month (ma_age_on_first_day_of_month, CO-4978), an \"N or older\" test on the last day (ma_age_on_last_day_of_month, CO-5402), and a test that excludes the person from what is favorable on the other day. Per month, as the deeming parents it reads (CO-4624)."
derived: [filter, [persons], [all, [otherwise, [has_relative_in, [child, stepchild], ma_ssi_deeming_parents], false], ["<", [of, [P], ma_age_on_first_day_of_month], ma_ssi_unemancipated_child_age_limit], [not, [otherwise, [of, [P], is_emancipated_minor], false]], [not, [otherwise, [of, [P], resides_in_medical_institution], false]], [any, [otherwise, [of, [P], is_blind], false], [otherwise, [of, [P], meets_ssa_disability_criteria], false]]]]
sources: [S3413]
implemented: engine
tags: [ma, non_magi, income, household]
rationale: "Coverage review NM-10: 20 CFR 416.1165(e)(2) divides the parental income to be deemed equally among the eligible children; ma_ssi_parental_income_deemed (CO-4626) needs the count."
tests:
  - {id: CO-4625-T1, month: "2026-10", as_of: "2026-10-12", title: "two disabled children of one parent", given: {date_of_birth: "2016-03-01", meets_ssa_disability_criteria: true, ma_ssi_deeming_parents: [p2]}, others: {p2: {date_of_birth: "1985-01-01"}, p3: {date_of_birth: "2018-03-01", meets_ssa_disability_criteria: true, resides_in_medical_institution: false}}, relationships: [[child, p2], [parent, p2, p3]], expect: [p1, p3]}
