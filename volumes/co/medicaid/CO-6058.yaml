id: CO-6058
name: "Medicaid Pickle: the parental income that reduces a Pickle child's benefit to zero"
identifier: ma_pickle_deeming_benefit_zero_amount
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "For a Pickle child, the amount of parental income which, deemed to the child as unearned income and combined with the child's own income with its OASDI increases disregarded, reduces the child's SSI benefit to zero: as ma_ssi_deeming_benefit_zero_amount (CO-5902) figures it (20 CFR 416.1165(e)(1), (3)), from the child's own Pickle unearned income (ma_pickle_household_unearned_income_before_deeming) and Pickle countable earned income with the $20 used against unearned income (ma_pickle_countable_earned_income_with_general_exclusion_used); zero when the child's own income already reaches the Federal Benefit Rate."
precision: "Sibling of CO-5902 (duplicate-paths audit D-M3). The other children sharing the parents' income keep their SSI-related limits (CO-5902) in the Pickle child's division (ma_pickle_parental_income_deemed, CO-5222): only this child's income is read with the Pickle disregard."
derived: [case, [[">=", ssi_federal_benefit_rate_individual, ma_pickle_countable_earned_income_with_general_exclusion_used], [max, 0, ["-", ["+", ["-", ssi_federal_benefit_rate_individual, ma_pickle_countable_earned_income_with_general_exclusion_used], ssi_general_income_exclusion], ma_pickle_household_unearned_income_before_deeming]]], [else, [max, 0, ["+", [max, 0, ["-", ssi_general_income_exclusion, ma_pickle_household_unearned_income_before_deeming]], ["/", ["-", ssi_federal_benefit_rate_individual, ma_pickle_countable_earned_income_with_general_exclusion_used], ssi_earned_income_disregard_rate]]]]]
sources: [S3413, S4080, S666]
implemented: engine
tags: [ma, non_magi, income, household]
siblings:
  - {id: CO-5902, reason: "the Pickle copy reads the child's Pickle income (CO-6056, CO-6057); every other term must stay the same"}
rationale: "Duplicate-paths audit D-M3 (P1): CO-5222 kept the equal division where 416.1165(e)(3) limits each child's share; the limit for the Pickle child is figured from its Pickle income."
nearest: [CO-5902]
tests:
  - {id: CO-6058-T1, month: "2026-10", as_of: "2026-10-01", given: {ma_pickle_countable_earned_income_with_general_exclusion_used: 0, ma_pickle_household_unearned_income_before_deeming: 714}, title: "A Pickle child with 714 of countable OASDI and no earnings: 994 + 20 - 714 = 300", expect: 300}
