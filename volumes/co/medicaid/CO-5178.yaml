id: CO-5178
name: "Medicaid SSI method: a person's WIOA program wages"
identifier: ma_ssi_wioa_earned_receipts
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The person's wages of the month from participation in a program under the Workforce Innovation and Opportunity Act (the successor of the Workforce Investment Act that 10 CCR 2505-10 8.100.3.K.8 names): the earnings records the SSI method's earnings counting table counts except for a dependent child applying for or receiving Medical Assistance (ma_ssi_earnings_treatment_table, CO-5107, row exempt_dependent_child_six_months; K.8.a, K.8.c)."
precision: "Earned-income records, Medicaid and CHP+ track E1 (OQ-1023): read by ma_ssi_excluded_wioa_wages (CO-5179), which counts the months of the calendar year the wages are exempted in."
derived: [sum_receipts, earnings, [all, [received_in, [month]], ["=", [lookup, ma_ssi_earnings_treatment_table, [receipt, kind]], exempt_dependent_child_six_months]], [receipt, amount]]
sources: [S4107]
implemented: engine
tags: [ma, non_magi, income]
rationale: "OQ-1023 (earned-income records E0, finding E0-F4), settled: 8.100.3.K.8.c exempts these wages for a dependent child; the pay is its own record (WIOA on-the-job training), so the exemption reads it without a part of wages_gross stated twice."
nearest: [CO-5179]
tests:
  - {id: CO-5178-T1, month: "2026-11", as_of: "2026-11-01", given: {earnings: [{kind: wages, amount: 300}, {kind: wioa_on_the_job_training, amount: 650}]}, title: "WIOA on-the-job training wages 650; other wages not read: 650", expect: 650}
