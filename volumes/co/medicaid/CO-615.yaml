id: CO-615
name: "Medicaid: is Qualifying Individual 1 (QI-1) eligible"
identifier: ma_qi_eligible
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether the person is eligible as a Qualifying Individual 1 - entitled to Medicare Part A, income at least ma_slmb_income_limit_pct but less than ma_qi_income_limit_pct of the federal poverty level for their household size, resources at or below the MSP resource limit, and not otherwise eligible for Medical Assistance - per 10 CCR 2505-10 8.100.6.N."
precision: "'Not otherwise eligible for Medical Assistance' (8.100.6.N.4.d) is read as no full-coverage Medical Assistance category (ma_has_full_coverage_category, CO-1176): full MAGI, SSI-related, OAP SISC B, a protected group, a Buy-In program, long-term care, or a needy person under 21, the same test QDWI reads (§ 8.100.6.O.4). Coverage review NM-11: it had read only SSI-related, MAGI and long-term care, so a Working Adults Buy-In member was also reported QI-1. Reads ma_ssi_poverty_guideline_monthly (CO-1750) instead of restating the lookup. For a QI-1 member in the December before the month, the annual Social Security cost-of-living increase is subtracted from countable income until the year's poverty guidelines are published (§ 8.100.6.N.6; ma_msp_cola_disregard, CO-3629; OQ-622)."
derived: [all, medicare_part_a_entitled, [">=", ["-", ma_ssi_countable_income, [case, [["=", ma_msp_december_category, qi], ma_msp_cola_disregard], [else, 0]]], ["*", ma_ssi_poverty_guideline_monthly, ma_slmb_income_limit_pct]], [<, ["-", ma_ssi_countable_income, [case, [["=", ma_msp_december_category, qi], ma_msp_cola_disregard], [else, 0]]], ["*", ma_ssi_poverty_guideline_monthly, ma_qi_income_limit_pct]], [<=, ma_msp_countable_resources, [case, [["=", ma_ssi_household_size, 2], ma_msp_resource_limit_couple], [else, ma_msp_resource_limit_individual]]], [not, ma_has_full_coverage_category]]
sources: [S1749, S2409, S3407]
implemented: engine
tags: [ma, non_magi, msp, income, resources]
open: [OQ-622, OQ-900]
rationale: "No existing item states the QI-1 eligibility test. ma_msp_category (CO-617) needs it. The 120% floor reuses ma_slmb_income_limit_pct (CO-239) per 8.100.6.N.4.b's own text ('at least 120%'), matching that parameter's own nearest note. History moved from the precision note (HCPF review S-14): Vocabulary fix round (U-1): reads ma_ssi_poverty_guideline_monthly (CO-1750) instead of restating the lookup. Precision history (moved from precision, engineering follow-up pass task 5): the phase-4 review's C-10 finding. Final verification F-6 (2026-11-22): a member of this program in the December before the month keeps the annual Social Security COLA disregarded (ma_msp_cola_disregard, CO-3629) through the period § 8.100.6.L.12, M.7 or N.6 names (S2406, S2407, S2409; OQ-622). Coverage pass 3 C3-5: reads ma_msp_countable_resources (CO-5206), which leaves out a home counted only because of a recorded beneficiary deed: Medicare Savings Program benefits are not subject to estate recovery (42 U.S.C. 1396p(b)(1)(B)(ii); OQ-900)."
