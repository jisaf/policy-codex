id: CO-615
name: "Medicaid: is Qualifying Individual 1 (QI-1) eligible"
identifier: ma_qi_eligible
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: Whether the person is eligible as a Qualifying Individual 1 - entitled to Medicare Part A, income at least 120% but less than 135% of the federal poverty level for their household size, resources at or below the MSP resource limit, and not otherwise eligible for Medical Assistance - per 10 CCR 2505-10 8.100.6.N.
derived: [all, receives_medicare_part_a, [">=", ma_ssi_countable_income, ["*", [/, [lookup, ma_poverty_guideline_table, ma_ssi_household_size], 12], ma_slmb_income_limit_pct]], [<, ma_ssi_countable_income, ["*", [/, [lookup, ma_poverty_guideline_table, ma_ssi_household_size], 12], ma_qi_income_limit_pct]], [<=, ma_ssi_countable_resources, [case, [[=, ma_ssi_household_size, 2], msp_resource_limit_couple], [else, msp_resource_limit_individual]]], [not, ma_is_ssi_related_eligible]]
sources: [S314]
implemented: engine
tags: [ma, non_magi, msp, income, resources]
rationale: "No existing item states the QI-1 eligibility test. ma_msp_category (CO-617) needs it. The 120% floor reuses ma_slmb_income_limit_pct (CO-239) per 8.100.6.N.4.b's own text ('at least 120%'), matching that parameter's own nearest note."
open: [OQ-81]
tests:
  - {id: CO-615-T1, as_of: "2026-10-01", month: "2026-10", given: {receives_medicare_part_a: true, ma_ssi_countable_income: 1600, ma_ssi_household_size: 1, ma_ssi_countable_resources: 3000, msp_resource_limit_individual: 9660, ma_is_ssi_related_eligible: false}, expect: true}
  - {id: CO-615-T2, as_of: "2026-10-01", month: "2026-10", given: {receives_medicare_part_a: true, ma_ssi_countable_income: 1200, ma_ssi_household_size: 1, ma_ssi_countable_resources: 3000, msp_resource_limit_individual: 9660, ma_is_ssi_related_eligible: false}, expect: false}
