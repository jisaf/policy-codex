id: CO-5321
name: "Medicaid SSI method: the equity of the person's one automobile excluded"
identifier: ma_ssi_excluded_automobile_equity_in_month
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The equity of the one automobile the SSI method excludes for the person in the month: the largest equity (value less what is owed, at the person's share, floored at 0) of the vehicles the person holds that are used for transportation for the person or a member of the household (10 CCR 2505-10 8.100.5.M.2.c, S4504: \"One automobile is totally excluded regardless of its value if it is used for transportation\"; 20 CFR 416.1218(b)(1), S4660); 0 when none is."
precision: "Resource records, Medicaid track H1: P58 largest (docs/operators.md), over the vehicle records (the holdings table's row counted_less_one_transportation_vehicle) valued in the month and not transferred, whose used_for_transportation is true; a vehicle record that does not state whether it is used for transportation makes the figure unknown (the exclusion turns on it). The equity is floored at 0 record by record, as P58 returns the true largest (a car owing more than it is worth has equity 0, not a negative figure). Excluding the vehicle with the largest equity is the reading most advantageous to the person, the one P58 returns (the market-value reading is OQ-1205's question for Adult Financial; 416.1218(b)(1) and M.2.c exclude one automobile \"regardless of value\"). 416.1218(b) excludes one automobile \"In determining the resources of an individual (and spouse, if any)\": the person's own figure (ma_ssi_holdings_countable_in_month, CO-5320) subtracts this, and each figure that adds a couple's resources (ma_ssi_countable_resources, CO-608; ma_institutionalized_spouse_countable_resources, CO-647; ssi_countable_resources_couple, CO-801; ma_spousal_resources_at_snapshot, CO-888) adds back the smaller of the two spouses' figures, so the couple excludes one automobile, the larger."
derived: [largest, holdings, [all, ["=", [lookup, ma_ssi_holding_treatment_table, [receipt, kind]], counted_less_one_transportation_vehicle], [received_in, [month]], [unknown, [receipt, disposed_date]], [receipt, used_for_transportation]], [max, 0, ["*", [otherwise, [receipt, share], 1], ["-", [receipt, value], [receipt, amount_owed]]]]]
sources: [S4504, S4660, S2215]
implemented: engine
tags: [ma, non_magi, resources]
rationale: "Resource records, step H1 (Medicaid), decision D5: the automobile the rule excludes is found from the vehicles' records by P58 largest, instead of a supplied part of the vehicles' total (transportation_vehicle_equity_value, CO-3395) that the household chose; and the couple's one automobile (416.1218(b): \"an individual (and spouse, if any)\") replaces the one excluded for each spouse."
tests:
  # Hand-computed from 8.100.5.M.2.c (S4504) and 20 CFR 416.1218(b)(1) (S4660).
  - {id: CO-5321-T1, month: "2026-10", as_of: "2026-10-01", title: "two cars used for transportation, equity 6,000 and 2,000: 6,000", given: {holdings: [{kind: vehicle, value: 6000, amount_owed: 0, used_for_transportation: true}, {kind: vehicle, value: 2000, amount_owed: 0, used_for_transportation: true}]}, expect: 6000}
  - {id: CO-5321-T2, month: "2026-10", as_of: "2026-10-01", title: "the larger equity, not the larger value: 9,000 owing 8,000 (1,000) against 6,000 owing nothing: 6,000", given: {holdings: [{kind: vehicle, value: 9000, amount_owed: 8000, used_for_transportation: true}, {kind: vehicle, value: 6000, amount_owed: 0, used_for_transportation: true}]}, expect: 6000}
  - {id: CO-5321-T3, month: "2026-10", as_of: "2026-10-01", title: "a car not used for transportation: none excluded", given: {holdings: [{kind: bank_account, value: 100}, {kind: vehicle, value: 3000, amount_owed: 0, used_for_transportation: false}]}, expect: 0}
  - {id: CO-5321-T4, month: "2026-10", as_of: "2026-10-01", title: "the only car used for transportation owes more than it is worth: equity floored at 0", given: {holdings: [{kind: vehicle, value: 4000, amount_owed: 5000, used_for_transportation: true}]}, expect: 0}
  - {id: CO-5321-T5, month: "2026-10", as_of: "2026-10-01", title: "half of a 10,000 car owned with the spouse: 5,000", given: {holdings: [{kind: vehicle, value: 10000, amount_owed: 0, used_for_transportation: true, share: 0.5, co_owners: spouse, holding_id: car}]}, expect: 5000}
  - {id: CO-5321-T6, month: "2026-10", as_of: "2026-10-01", title: "use for transportation not stated: cannot be determined", given: {holdings: [{kind: vehicle, value: 3000, amount_owed: 0}]}, expect: unknown}
