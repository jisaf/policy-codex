id: CO-659
name: "Medicaid: transfer penalty period, partial-month days"
identifier: ma_transfer_penalty_days
kind: derived
type: whole number
scope: person
program: Medicaid
meaning: "The number of additional days of ineligibility, beyond the whole months of ma_transfer_penalty_months, for an uncompensated transfer of assets - ma_transfer_penalty_days_per_month (CO-3023) times the decimal fractional share of the partial month, rounded up to the nearest whole number - per 10 CCR 2505-10 § 8.100.7.F.2.d. Informational: no rule reads it and it is not a declared outcome; it reports the partial-month days beside ma_transfer_penalty_months."
precision: "Recomputes the raw (unfloored) division 8.100.7.F.2.c.i states, times this person's share of an apportioned period (ma_transfer_penalty_share_rate, CO-2235; § 8.100.7.F.8, OQ-94), and subtracts the whole months of ma_transfer_penalty_months (CO-649) other than those reassigned from a spouse, the floor of that same product, to isolate the fractional part, since the pattern catalog has no operator that returns a division's fractional remainder directly. Blocked (OQ-1060): the divisor it reads (transfer_penalty_divisor, CO-832) rests on S1228, which is not a quotation. HCPF Operational Memo OM 25-073 (D-125), the only document that states them, could not be fetched on 2026-11-23 (hcpf.colorado.gov refused, HTTP 403; medicaid.gov, sos.state.co.us, ecfr.gov, law.cornell.edu, govinfo.gov and federalregister.gov answered but state no Colorado figure), so the item stays Draft until the memo is stored and the excerpt replaced by its quotation."
derived: [case, [transfer_was_exempt, 0], [else, ["ceil", ["*", ma_transfer_penalty_days_per_month, ["-", ["*", ma_transfer_penalty_share_rate, ["/", [+, uncompensated_transfer_value_in_lookback, [sum, [filter, [persons], [otherwise, [rel, [spouse], [P]], false]], [of, [P], uncompensated_transfer_value_in_lookback]]], transfer_penalty_divisor]], ["-", ma_transfer_penalty_months, ma_transfer_penalty_months_assigned_from_spouse]]]]]]
sources: [S365, S366, S379, S1507, S1758]
open: [OQ-821, OQ-1060]
implemented: engine
tags: [ma, ltc, legal]
rationale: "No existing item states § 8.100.7.F.2.d's partial-month day arithmetic; ma_transfer_penalty_months (CO-649) reports only whole months as of the phase-4 review's C-6 fix. Not a bare alias of CO-649: it recomputes the raw uncompensated-value-over-divisor figure to recover the fractional remainder CO-649's floor discards, then applies § 8.100.7.F.2.d's days-per-month multiplication (CO-3023, a literal 30 before the hard-coded numbers audit H-12) and round-up. Dual-entry audit 1.6: the couple's transfers are each spouse's own uncompensated_transfer_value_in_lookback summed once across the spouse edge (8.100.7.F: a transfer by \"the individual or the individual's spouse\"); the apportionment is ma_transfer_penalty_share_rate."
nearest: [CO-649]
tests:
  - {id: CO-659-T1, as_of: "2026-10-01", parameters: {transfer_penalty_divisor: 9000}, given: {uncompensated_transfer_value_in_lookback: 56500, transfer_was_exempt: false, ma_transfer_penalty_months: 6, ma_transfer_penalty_share_rate: 1, ma_transfer_penalty_months_assigned_from_spouse: 0}, expect: 9}
  - {id: CO-659-T4, as_of: "2026-10-01", title: "OQ-94: half of 5.5 months is 2 months and 22.5 days, rounded up to 23", parameters: {transfer_penalty_divisor: 9000}, given: {uncompensated_transfer_value_in_lookback: 49500, transfer_was_exempt: false, ma_transfer_penalty_months: 2, ma_transfer_penalty_share_rate: 0.5, ma_transfer_penalty_months_assigned_from_spouse: 0}, expect: 23}
  - {id: CO-659-T2, as_of: "2026-10-01", parameters: {transfer_penalty_divisor: 9000}, given: {uncompensated_transfer_value_in_lookback: 45000, transfer_was_exempt: false, ma_transfer_penalty_months: 5, ma_transfer_penalty_share_rate: 1, ma_transfer_penalty_months_assigned_from_spouse: 0}, expect: 0}
  - {id: CO-659-T3, as_of: "2026-10-01", parameters: {transfer_penalty_divisor: 9000}, given: {uncompensated_transfer_value_in_lookback: 45000, transfer_was_exempt: true, ma_transfer_penalty_months: 0}, expect: 0}
