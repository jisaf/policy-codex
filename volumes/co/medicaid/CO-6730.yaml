id: CO-6730
name: "Medicaid SSI method: a person's infrequent or irregular unearned receipts"
identifier: ma_ssi_irregular_unearned_receipts
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The person's unearned receipts of the month that are received infrequently or irregularly (each record's irregular field: received only once in the calendar quarter from a single source and not in the month before or after, or not reasonably expected; 20 CFR 416.1124(c)(6)) and that the SSI method's counting table counts (ma_ssi_receipt_treatment_table, CO-5510: counted, counted because no rule excludes it, or rents), each at the amount ma_ssi_unearned_receipts (CO-5511) counts it: less the parts the method does not count (a plan for self-support's set-aside, what a death benefit paid for the last illness and burial, an award's claim expenses, a veterans benefit's amount for a dependent); a retroactive Title II or SSI payment left out."
precision: "Gambling winnings and child support, which the readers add apart (ma_ssi_gambling_receipts, ma_ssi_child_support_receipts), are not part of this sum, so the $60 is taken from the other unearned income only. Receipts not stated: cannot determine (decision 4). Field-effect sweep (docs/reviews/field-sweep-snap-cash-nonmagi.md), FS-MA-1: a receipt stated as a stream (no month and no date) is received only in the months from the month of its start_date through the month of its end_date (each absent: before, or through, the months the case covers; CO-5000), since unearned income \"is countable as income in the month received\" (10 CCR 2505-10 8.100.5.F.5, S3001) and is counted \"when you receive it\" (20 CFR 416.1123(a), S4940); in its first and last months it is read at its amount, and a payment stated with its month or date is placed by it, a final payment after the stream ended included. Before, a stream was counted in every month whatever its dates. The clause is SNAP's (snap_counted_recurring_receipts, CO-5011). Field-effect sweep (docs/reviews/field-sweep-snap-cash-nonmagi.md), FS-MA-8: of a retroactive payment from a benefit program other than SSI, the legal fees connected with the claim (designated_for_legal_fees, the part of designated_for_lump_sum_costs that is legal fees) are subtracted, and the payment's other designated costs are not: 20 CFR 416.1123(b)(3) (S4756), \"If you receive a retroactive check from a benefit program other than SSI, legal fees connected with the claim are subtracted. We do not subtract from any taxable unearned income the part you have to use to pay personal income taxes\"; the legal fees are required where read (decision 4 of 2026-11-23): a retroactive payment that does not state them cannot be determined. Before, nothing of designated_for_lump_sum_costs was read."
derived: [sum_receipts, receipts, [all, [received_in, [month]], [any, [not, [unknown, [receipt, month]]], [all, [any, [unknown, [receipt, start_date]], ["<=", [month_of, [receipt, start_date]], [month]]], [any, [unknown, [receipt, end_date]], [">=", [month_of, [receipt, end_date]], [month]]]]], [receipt, irregular], [in, [lookup, ma_ssi_receipt_treatment_table, [receipt, kind]], [counted, counted_no_rule_excludes, counted_net_of_expenses]], [not, [all, [receipt, retroactive], [in, [receipt, kind], [social_security, ssi]]]]], [max, 0, ["-", [receipt, amount], ["+", [receipt, pass_set_aside], [receipt, spent_on_covered_costs], [receipt, claim_expense], [receipt, for_dependent], [case, [[all, [receipt, retroactive], [not, ["=", [receipt, kind], ssi]]], [receipt, designated_for_legal_fees]], [else, 0]]]]]]
sources: [S2609, S4754, S4755, S4756, S4940]
implemented: engine
tags: [ma, non_magi, income]
rationale: "Coverage pass 4, non-MAGI N4-3 (docs/reviews/coverage4-medicaid-nonmagi.md): the receipts' irregular field had no SSI-method reader, so a small one-time payment 416.1124(c)(6) does not count was counted. Nearest: ma_ssi_irregular_earned_receipts (CO-5173), the earnings records' irregular pay under 416.1112(c)(2): a different list and table."
nearest: [CO-5173]
tests:
  - {id: CO-6730-T1, month: "2026-11", as_of: "2026-11-01", given: {receipts: [{kind: social_security, amount: 1000}, {kind: gift, amount: 30, irregular: true, frequency: once, month: "2026-11"}]}, title: "A 30 gift received once in the quarter is irregular; Social Security is not: 30", expect: 30}
  - {id: CO-6730-T2, month: "2026-11", as_of: "2026-11-01", given: {receipts: [{kind: crime_victim_compensation, amount: 100, irregular: true, frequency: once, month: "2026-11"}, {kind: gift, amount: 40, irregular: true, frequency: once, month: "2026-10"}]}, title: "An exempt receipt is not part of it, nor October's gift in November: 0", expect: 0}
  - {id: CO-6730-T3, month: "2026-11", as_of: "2026-11-01", given: {}, title: "Receipts not stated: cannot determine", expect: unknown}
  # Field-effect sweep, non-MAGI Medicaid (docs/reviews/field-sweep-snap-cash-nonmagi.md); hand-computed from the text quoted in each title.
  - {id: CO-6730-T4, month: "2026-11", as_of: "2026-11-12", title: "FS-MA-1: an irregular 30 stated as a stream that ended 2026-10-31: 0", given: {receipts: [{kind: gift, amount: 30, irregular: true, end_date: "2026-10-31"}]}, expect: 0}
  - {id: CO-6730-T5, month: "2026-11", as_of: "2026-11-12", title: "FS-MA-8: an irregular retroactive payment of 100 with 40 of legal fees for the claim: 100 - 40 = 60", given: {receipts: [{kind: unemployment_compensation, amount: 100, irregular: true, date: "2026-11-05", frequency: once, retroactive: true, designated_for_lump_sum_costs: 40, designated_for_legal_fees: 40}]}, expect: 60}
