id: CO-501
name: "Medicaid: MAGI family size"
identifier: ma_magi_household_size
kind: derived
type: whole number
scope: person-month
program: Medicaid
meaning: "This person's MAGI family size under 42 CFR 435.603(b) and 10 CCR 2505-10 8.100.4.E.2 - the count of this person's ma_magi_household_members, except that any pregnant member of the household counts as herself plus the number of children she is expected to deliver. It is the MAGI family size: it counts an expected child of a pregnant member (vocabulary fix round C-3)."
precision: "Applies the pregnant-member addition to every pregnant member of the household, not only to the person the size is computed for, per 8.100.4.E.2 (\"regardless of the Medical Assistance category\" and without limiting it to the pregnant woman's own family size). Coverage pass 5, C5-02 (2026-11-23): the size is the month's, so the addition is the month's pregnancy: a member pregnant at some time in the month (ma_is_pregnant_in_month, CO-3601) counts as herself plus the children she is expected to deliver less any born to her that month who are persons of the case (ma_expected_children_in_month, CO-7050), and a member not yet born in the month (a newborn of the case, in a retroactive month before the birth) is not counted, since the expected child stands for the child until it is born. Before, the addition read is_pregnant, the pregnancy on the determination date, in every month: a pregnancy that ended before the application was not counted in the retroactive months it covered, and one that began after them was."
derived: [sum, ma_magi_household_members, [case, [[">", [month_of, [of, [P], date_of_birth]], [month]], 0], [[of, [P], ma_is_pregnant_in_month], [+, 1, [of, [P], ma_expected_children_in_month]]], [else, 1]]]
sources: [S161, S170, S3351]
implemented: engine
tags: [ma, magi, household]
rationale: "No existing item counts MAGI family size; ma_magi_household_income_pct_fpl (CO-504) and batch 6's income-standard rules need it as the key into federal_poverty_guideline_annual_table (CO-181). Distinct from a plain count of ma_magi_household_members because of the pregnant-member addition 435.603(b) and 8.100.4.E.2 both require."
tests:
  - {id: CO-501-T1, month: "2026-10", as_of: "2026-10-01", given: {is_tax_filer: true, expects_to_be_claimed_as_dependent: false, date_of_birth: "1985-01-22", is_pregnant: false}, others: {p4: {date_of_birth: "2009-04-08", is_pregnant: false}, p5: {date_of_birth: "2026-02-03", is_pregnant: false}}, relationships: [[tax_filer, p1, p4], [tax_filer, p1, p5]], expect: 3}
  - {id: CO-501-T2, month: "2026-10", as_of: "2026-10-01", given: {is_tax_filer: true, expects_to_be_claimed_as_dependent: false, date_of_birth: "1990-01-01", is_pregnant: true, expected_number_of_children: 2}, others: {}, relationships: [], expect: 3}
  - {id: CO-501-T3, month: "2026-09", as_of: "2026-11-10", title: "C5-02 (PG-RETRO-ENDED): a single filer pregnant from 2026-03-01 until the pregnancy ended 2026-09-20, one child expected, applied 2026-11-02: in September she was pregnant, so 1 + 1 = 2", given: {is_tax_filer: true, expects_to_be_claimed_as_dependent: false, date_of_birth: "1990-01-01", is_pregnant: false, pregnancy_start_date: "2026-03-01", pregnancy_end_date: "2026-09-20", expected_number_of_children: 1, ma_application_date: "2026-11-02"}, relationships: [], expect: 2}
  - {id: CO-501-T4, month: "2026-11", as_of: "2026-11-10", title: "C5-02: the same in November, after the pregnancy ended: 1", given: {is_tax_filer: true, expects_to_be_claimed_as_dependent: false, date_of_birth: "1990-01-01", is_pregnant: false, pregnancy_start_date: "2026-03-01", pregnancy_end_date: "2026-09-20", expected_number_of_children: 1, ma_application_date: "2026-11-02"}, relationships: [], expect: 1}
  - {id: CO-501-T5, month: "2026-08", as_of: "2026-11-10", title: "C5-02 (PG-RETRO-LATER): pregnant since 2026-10-01, one child expected, applied 2026-11-02; in August, a retroactive month, she was not yet pregnant: 1 (was 2)", given: {is_tax_filer: true, expects_to_be_claimed_as_dependent: false, date_of_birth: "1990-01-01", is_pregnant: true, pregnancy_start_date: "2026-10-01", expected_number_of_children: 1, ma_application_date: "2026-11-02"}, relationships: [], expect: 1}
  - {id: CO-501-T6, month: "2026-10", as_of: "2026-11-10", title: "C5-02: the birth month: the mother, pregnant until she gave birth to p2 on 2026-10-15 (one child expected), claims p2: herself plus 1 expected less the 1 born in October (0), and p2 counted as itself: 1 + 0 + 1 = 2", given: {is_tax_filer: true, expects_to_be_claimed_as_dependent: false, date_of_birth: "1990-01-01", is_pregnant: false, pregnancy_start_date: "2026-01-10", pregnancy_end_date: "2026-10-15", expected_number_of_children: 1, ma_application_date: "2026-11-02"}, others: {p2: {date_of_birth: "2026-10-15", is_pregnant: false}}, relationships: [[tax_filer, p1, p2], [parent, p1, p2], [gave_birth_to, p1, p2]], expect: 2}
  - {id: CO-501-T7, month: "2026-09", as_of: "2026-11-10", title: "C5-02: the same in September, before p2 was born: herself plus the expected child (2), and p2, not yet born, not counted: 2", given: {is_tax_filer: true, expects_to_be_claimed_as_dependent: false, date_of_birth: "1990-01-01", is_pregnant: false, pregnancy_start_date: "2026-01-10", pregnancy_end_date: "2026-10-15", expected_number_of_children: 1, ma_application_date: "2026-11-02"}, others: {p2: {date_of_birth: "2026-10-15", is_pregnant: false}}, relationships: [[tax_filer, p1, p2], [parent, p1, p2], [gave_birth_to, p1, p2]], expect: 2}
