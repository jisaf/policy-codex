id: CO-7550
name: "Medicaid: has held qualified non-citizen status for five years by the end of the month"
identifier: ma_has_held_qualified_status_five_years_in_month
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether, on some day of the month evaluated, the person has held qualified non-citizen status for the waiting period of 8 U.S.C. 1613(a) (qualified_non_citizen_waiting_period_years, five), counted from the date the person first obtained a qualified status or entered the United States in one (first_qualified_status_date, CO-7770; the date of the status held now, qualified_status_date, where the person entered the United States in it, us_entry_date on or after that date, or is a lawful permanent resident admitted directly or adjusted from a status that was not a qualified status, status_before_lpr_adjustment none or non_qualified_status): the period has ended by the last day of the month. Met also where the status held now (qualified_status_date, CO-003) has itself been held for the period, which no earlier status can shorten."
precision: "Coverage pass 7, C7-04 (2026-11-24): the five years were counted from qualified_status_date, the date of the status held now, so a parolee, battered non-citizen or conditional entrant who later became a lawful permanent resident restarted them at the adjustment, though 1613(a) (S176) runs them 'beginning on the date of the alien's entry into the United States with a status within the meaning of the term \"qualified alien\"' and 10 CCR 2506-1 4.305.B.3.a (S12) 'on the date the non-citizen obtains status as a qualified non-citizen or enters the U.S. in a qualifying status' (LPR-EX-PAROLEE: paroled 2019-05-01, LPR 2023-03-01: the five years ended 2024-04-30; November 2026 was emergency_only, is eligible). The first date is required where read (decision 4), except where the case already shows that the status held now is the first: the person entered the United States in it (us_entry_date not before qualified_status_date: no qualified status is held in the United States before entering it; an unstated entry date only leaves this shortcut unread), or a lawful permanent resident's earlier status (C7-09) is none or non_qualified_status (coverage verification 7, V7-8: a status in which the person was not a qualified alien, such as a student or work visa, so the permanent residence is the first qualified status; before, such a person stated first_qualified_status_date equal to qualified_status_date, or was cannot determine). Pattern sweep, MAGI (2026-11-24, docs/reviews/pattern-sweep-magi.md, PS-01). 8 U.S.C. 1613(a) (S176) bars a qualified alien from a federal means-tested benefit 'for a period of 5 years beginning on the date of the alien's entry into the United States with a status', so whether the bar applies is a fact of each month: a retroactive month before the fifth anniversary is inside it, a later month is not. 10 CCR 2505-10 § 8.100.4.G.1 (S3351) makes a person eligible for a whole month who is eligible 'at any time during' it, so the month in which the five years end is outside the bar (the last day of the month). has_held_qualified_status_five_years (CO-508), a neutral fact of the person on the determination date, is unchanged; Medicaid's month-scoped status test reads this item (ma_meets_citizenship_requirement_in_month, CO-7551)."
derived: [any, ["<=", qualified_non_citizen_waiting_period_years, [years_between, qualified_status_date, [days_after, -1, [first_day, [month_after, [month]]]]]], ["<=", qualified_non_citizen_waiting_period_years, [years_between, [case, [[otherwise, ["<=", qualified_status_date, us_entry_date], false], qualified_status_date], [[all, ["=", immigration_status, lawful_permanent_resident], [in, status_before_lpr_adjustment, [none, non_qualified_status]]], qualified_status_date], [else, first_qualified_status_date]], [days_after, -1, [first_day, [month_after, [month]]]]]]]
sources: [S176, S3351, S217, S12, S1900]
implemented: engine
tags: [ma, magi, immigration]
nearest: [CO-508]
rationale: "Pattern sweep, MAGI (PS-01): has_held_qualified_status_five_years (CO-508) is counted to the determination date and read through the person-scope status test (CO-509) in every month a determination evaluates, so a retroactive month before the fifth anniversary of a lawful permanent resident's status was judged as if the five years had passed. CO-508 is shared and read once per person; this item is Medicaid's reading for the month (G.1's any day)."
tests:
  - {id: CO-7550-T1, as_of: "2026-11-10", month: "2026-08", title: "PS-01 (C7-04: entered the United States in the status, us_entry_date stated, so it is the first): status from 2021-09-15, August 2026: four years, inside the bar", given: {qualified_status_date: "2021-09-15", us_entry_date: "2021-09-15"}, expect: false}
  - {id: CO-7550-T2, as_of: "2026-11-10", month: "2026-09", title: "PS-01: the same, September 2026: five years on September 15, a day of the month", given: {qualified_status_date: "2021-09-15"}, expect: true}
  - {id: CO-7550-T3, as_of: "2026-11-10", month: "2026-11", title: "PS-01: the same, the determination month", given: {qualified_status_date: "2021-09-15"}, expect: true}
  - {id: CO-7550-T4, as_of: "2026-11-10", month: "2026-10", title: "PS-01: status date not stated: cannot determine", given: {}, expect: unknown}
  # Coverage pass 7, C7-04 (LPR-EX-PAROLEE): paroled into the United States 2019-05-01 for two years (a qualified alien from that day, 8 U.S.C. 1641(b)(4), S1900), adjusted to lawful permanent resident 2023-03-01 (qualified_status_date; status_before_lpr_adjustment other); November 2026, last day 2026-11-30.
  - {id: CO-7550-T90, as_of: "2026-11-10", month: "2026-11", title: "C7-04 (was false): years from 2019-05-01 (first_qualified_status_date) to 2026-11-30: 7 >= 5: held; from the LPR date 2023-03-01 only 3", given: {immigration_status: lawful_permanent_resident, status_before_lpr_adjustment: other, qualified_status_date: "2023-03-01", first_qualified_status_date: "2019-05-01"}, expect: true}
  - {id: CO-7550-T91, as_of: "2026-11-10", month: "2026-11", title: "C7-04: the same without the first date stated: the LPR status, held 3 years, does not settle it: cannot be determined (required where read)", given: {immigration_status: lawful_permanent_resident, status_before_lpr_adjustment: other, qualified_status_date: "2023-03-01"}, expect: unknown}
  - {id: CO-7550-T92, as_of: "2026-11-10", month: "2026-11", title: "C7-04: a lawful permanent resident admitted directly (status_before_lpr_adjustment none) on 2023-03-01: the first status is the LPR status: 3 years by 2026-11-30: not held (no first date needed)", given: {immigration_status: lawful_permanent_resident, status_before_lpr_adjustment: none, qualified_status_date: "2023-03-01"}, expect: false}
  - {id: CO-7550-T93, as_of: "2026-11-10", month: "2026-11", title: "C7-04, C7-09: an LPR since 2020-01-15 whose earlier status is not stated: the LPR status alone has been held 6 years by 2026-11-30: held, whatever the earlier status", given: {immigration_status: lawful_permanent_resident, qualified_status_date: "2020-01-15"}, expect: true}
  - {id: CO-7550-T94, as_of: "2026-11-10", month: "2026-11", title: "C7-04, C7-09: an LPR since 2023-03-01 whose earlier status is not stated: whether the LPR status is the first cannot be told: unknown", given: {immigration_status: lawful_permanent_resident, qualified_status_date: "2023-03-01"}, expect: unknown}
  - {id: CO-7550-T95, as_of: "2026-11-10", month: "2024-04", title: "C7-04 (LPR-EX-PAROLEE): April 2024, last day 2024-04-30: 2019-05-01 to 2024-04-30 is 4 whole years (the fifth anniversary is 2024-05-01): not held", given: {immigration_status: lawful_permanent_resident, status_before_lpr_adjustment: other, qualified_status_date: "2023-03-01", first_qualified_status_date: "2019-05-01"}, expect: false}
  - {id: CO-7550-T96, as_of: "2026-11-10", month: "2024-05", title: "C7-04 (LPR-EX-PAROLEE): May 2024: 5 years on 2024-05-01, a day of the month: held", given: {immigration_status: lawful_permanent_resident, status_before_lpr_adjustment: other, qualified_status_date: "2023-03-01", first_qualified_status_date: "2019-05-01"}, expect: true}
  - {id: CO-7550-T97, as_of: "2026-11-10", month: "2026-11", title: "C7-04: a parolee who entered the United States paroled on 2023-03-01 (us_entry_date = qualified_status_date): the parole is the first qualified status, 3 years by 2026-11-30: not held, no first date needed", given: {immigration_status: parolee_one_year_or_more, qualified_status_date: "2023-03-01", us_entry_date: "2023-03-01"}, expect: false}
  # Coverage verification 7, V7-8 (M4-C pattern): a lawful permanent resident since 2023-03-01 who adjusted from a student visa
  # (status_before_lpr_adjustment non_qualified_status), first_qualified_status_date not stated. The permanent residence is the first qualified
  # status, so the five years run from 2023-03-01: to 2026-11-30, 3 whole years < 5: not held (was cannot determine: the date was asked again).
  - {id: CO-7550-T98, as_of: "2026-11-10", month: "2026-11", title: "V7-8: an LPR since 2023-03-01 who adjusted from a non-qualified status, no first date: 3 years by 2026-11-30, not held (was cannot determine)", given: {immigration_status: lawful_permanent_resident, status_before_lpr_adjustment: non_qualified_status, qualified_status_date: "2023-03-01"}, expect: false}
  # The same LPR since 2021-11-15: to 2026-11-30, 5 years: held in November 2026 (the first arm, the status held now).
  - {id: CO-7550-T99, as_of: "2026-11-10", month: "2026-11", title: "V7-8: an LPR since 2021-11-15 from a non-qualified status: 5 years by 2026-11-30: held", given: {immigration_status: lawful_permanent_resident, status_before_lpr_adjustment: non_qualified_status, qualified_status_date: "2021-11-15"}, expect: true}
