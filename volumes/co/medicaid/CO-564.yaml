id: CO-564
name: "Medicaid: under the child age limit, or turns 19 this month"
identifier: ma_is_under_child_age_or_turns_nineteen_this_month
kind: derived
type: yes/no
scope: person
program: Medicaid
meaning: "Whether the person's 19th birthday (ma_magi_child_age_limit) falls in the determination month or later - the person was under ma_magi_child_age_limit on the last day of the month before the determination month - the age condition 8.100.4.G.2.a states as \"eligible ... through the end of the month in which they turn 19 years old,\" which 8.100.3.G.1.g.ix.1's Cover All Coloradans exception and 10 CCR 2505-3-110.1.B.5.o (CHP+) state as \"under the age of 19, whose 19th birthday occurred in the current month\"."
precision: "Age is taken on the day before the first day of the determination month (the last day of the month before), with the same day-before idiom snap_abawd_countable_month (CO-416) and af_is_oap_age (CO-940) use for a birthday month. A person who is under 19 on that day either is still under 19 on the determination date or turned 19 during the determination month, on or before the determination date; both are inside \"the month in which they turn 19\". A person who turned 19 in an earlier month is not. Final verification pass 3, F3-3: the test had been \"age 19 and the birth month equals the determination month\" with the birth month taken as a year-month (for example 2007-11 against 2026-11), which is never equal, so a person whose 19th birthday fell earlier in the determination month was outside the Children's group, Cover All Coloradans and CHP+."
derived: ["<", [years_between, date_of_birth, [days_after, -1, [first_day, [det_month]]]], ma_magi_child_age_limit]
sources: [S638, S600, S607, S1744]
implemented: engine
tags: [ma, magi, age, chp]
rationale: "Final verification pass 3, F3-3 (2026-11-22): the year-month comparison never held after the birthday; the age is now taken on the last day of the month before the determination month. No existing item extends the plain [<, age, ma_magi_child_age_limit] test through the month of the 19th birthday. CO-545 (Medicaid Children's category), CO-509 (citizenship/Cover All Coloradans), and the CHP+ child rules (CO-704..CO-708, which now read this item directly) all used the plain age test with no extension, so a child whose 19th birthday fell on, say, the 3rd of the determination month lost the Children's category, the immigration-status protection, and CHP+ child status for the rest of that month - though all three source provisions state coverage runs 'through the end of the month' the birthday occurs in, and 8.100.4.G.1 independently forbids a mid-month eligibility drop (K-1, not fixed in this round). Fixed per the phase-3 review's C-8 finding by factoring the shared test into this single item so the three places do not drift."
tests:
  - {id: CO-564-T1, as_of: "2026-10-01", given: {date_of_birth: "2007-10-20"}, expect: true}
  - {id: CO-564-T2, as_of: "2026-11-01", given: {date_of_birth: "2007-10-20"}, expect: false}
  - {id: CO-564-T3, as_of: "2026-10-01", given: {date_of_birth: "2009-04-08"}, expect: true}
  - {id: CO-564-T4, as_of: "2026-10-01", given: {date_of_birth: "1985-01-22"}, expect: false}
  - {id: CO-564-T5, as_of: "2026-11-10", title: "F3-3: the 19th birthday on November 5, determination November 10 - through the end of November", given: {date_of_birth: "2007-11-05"}, expect: true}
  - {id: CO-564-T6, as_of: "2026-11-30", title: "F3-3: the 19th birthday on November 25, determination on the last day of November", given: {date_of_birth: "2007-11-25"}, expect: true}
  - {id: CO-564-T7, as_of: "2026-12-01", title: "F3-3: the month after the 19th birthday month", given: {date_of_birth: "2007-11-05"}, expect: false}
  - {id: CO-564-T8, as_of: "2026-11-01", title: "F3-3: the 19th birthday on the first of the determination month", given: {date_of_birth: "2007-11-01"}, expect: true}
