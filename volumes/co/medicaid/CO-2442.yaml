id: CO-2442
name: "Medicaid: Express Lane status"
identifier: ma_express_lane_status
kind: derived
type: one of
options: [not_applicable, enrolled, enrolled_pending_citizenship_verification, refer_to_single_streamlined_application]
scope: person-month
program: Medicaid
role: outcome
meaning: "The Express Lane outcome for a child under 10 CCR 2505-10 § 8.100.4.J: not applicable (no forwarded referral, or the family did not opt in); enrolled (the child meets every eligibility requirement, judged on the income declared on the source application, and is fully eligible for MAGI Medical Assistance as a child or needy newborn); enrolled pending citizenship or identity verification (the same, except that verification of U.S. citizenship or identity is outstanding, giving 90 days of eligibility); or referred to the Single Streamlined Application (the child does not satisfy a requirement)."
precision: "J's \"eligibility is based on income declared on the [source] application\" is carried by the income facts the case states: for an Express Lane child they are the amounts on the source application. Additional verification requested before automatic enrollment (J.1.a.iv) is reported by ma_verification_status."
derived: [case, [[not, [in, [otherwise, ma_express_lane_source, none], [free_reduced_lunch_application, snap_or_colorado_works_application]]], not_applicable], [[not, ma_express_lane_family_opted_in], not_applicable], [[all, [in, ma_magi_category, [child, needy_newborn]], ma_magi_is_fully_eligible, [any, ma_citizenship_verification_is_pending, ma_identity_verification_is_pending]], enrolled_pending_citizenship_verification], [[all, [in, ma_magi_category, [child, needy_newborn]], ma_magi_is_fully_eligible], enrolled], [else, refer_to_single_streamlined_application]]
sources: [S1723]
implemented: engine
tags: [ma, magi, verification]
rationale: C-6 of the HCPF review. The current § 8.100.4.J adopts Express Lane (42 U.S.C. 1396a(e)(13)) for children from Free/Reduced Lunch, Food Assistance and Colorado Works applications; no item stated it.
tests:
  - {id: CO-2442-T1, month: "2026-10", as_of: "2026-10-01", given: {ma_express_lane_source: snap_or_colorado_works_application, ma_express_lane_family_opted_in: true, ma_magi_category: child, ma_magi_is_fully_eligible: true, ma_citizenship_verification_is_pending: false, ma_identity_verification_is_pending: false}, title: "SNAP application, opted in, child fully eligible, citizenship verified", expect: enrolled}
  - {id: CO-2442-T2, month: "2026-10", as_of: "2026-10-01", given: {ma_express_lane_source: free_reduced_lunch_application, ma_express_lane_family_opted_in: true, ma_magi_category: child, ma_magi_is_fully_eligible: true, ma_citizenship_verification_is_pending: true}, title: "Citizenship verification outstanding: 90 days of eligibility", expect: enrolled_pending_citizenship_verification}
  - {id: CO-2442-T3, month: "2026-10", as_of: "2026-10-01", given: {ma_express_lane_source: free_reduced_lunch_application, ma_express_lane_family_opted_in: true, ma_magi_category: none, ma_magi_is_fully_eligible: false}, title: "Income over the children's standard: evaluated on the Single Streamlined Application", expect: refer_to_single_streamlined_application}
  - {id: CO-2442-T4, month: "2026-10", as_of: "2026-10-01", given: {ma_express_lane_source: free_reduced_lunch_automatic}, title: "Automatic lunch enrollment is not forwarded", expect: not_applicable}
