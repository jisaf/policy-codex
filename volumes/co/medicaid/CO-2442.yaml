id: CO-2442
name: "Medicaid: Express Lane status"
identifier: ma_express_lane_status
kind: derived
type: one of
options: [not_applicable, enrolled, enrolled_pending_citizenship_verification, verification_period_expired, refer_to_single_streamlined_application]
scope: person-month
program: Medicaid
role: outcome
meaning: "The Express Lane outcome for a child under 10 CCR 2505-10 § 8.100.4.J: not applicable (no forwarded referral, or the family did not opt in); enrolled (the child meets every eligibility requirement, judged on the income declared on the source application, ma_express_lane_child_meets_requirements, CO-3156); enrolled pending citizenship or identity verification (the same, except that verification of U.S. citizenship or identity is outstanding, giving 90 days of eligibility); the 90 days of eligibility ended with citizenship or identity still unverified (verification_period_expired, after ma_express_lane_verification_period_end_date, CO-2445); or referred to the Single Streamlined Application (the child does not satisfy a requirement, J.1.a.vi, J.2.a.vi)."
precision: "J.1.a.v and J.2.a.v (\"Eligibility is based on income declared on the [source] application as well as eligibility requirements outlined in this volume\", S1723, the complete § 8.100.4.J since heavier-definitions audit H-8) are read through CO-3156, which compares the source application's declared household income with the children's standard instead of building the MAGI household (audit H-7); 42 U.S.C. 1396a(e)(13)(A)(i)(I) (S2102) has a child whom the finding would make ineligible determined by regular procedures, which is the referral. Additional verification requested before automatic enrollment (J.1.a.iv, J.2.a.iv) is reported by ma_verification_status. Coverage review 2, N-05: a child who fails the Medicaid requirements but meets CHP+'s on the declared income is enrolled in CHP+ under 10 CCR 2505-3 § 180 (chp_express_lane_status, CO-4793); this item still reports the Medicaid referral (J.1.a.vi, J.2.a.vi)."
derived: [case, [[not, [in, [otherwise, ma_express_lane_source, none], [free_reduced_lunch_application, snap_or_colorado_works_application]]], not_applicable], [[not, ma_express_lane_family_opted_in], not_applicable], [[all, ma_express_lane_child_meets_requirements, [any, ma_citizenship_verification_is_pending, ma_identity_verification_is_pending], [">", [det_date], ma_express_lane_verification_period_end_date]], verification_period_expired], [[all, ma_express_lane_child_meets_requirements, [any, ma_citizenship_verification_is_pending, ma_identity_verification_is_pending]], enrolled_pending_citizenship_verification], [ma_express_lane_child_meets_requirements, enrolled], [else, refer_to_single_streamlined_application]]
sources: [S1723, S2102]
implemented: engine
tags: [ma, magi, verification]
rationale: "Heavier-definitions audit H-7 and H-8 (audit fix round 4): reads the declared-income test (CO-3156) in place of the full MAGI determination; S1723 now quotes the whole of § 8.100.4.J, including J.1.a.v and J.2.a.v, the declared-income sentences the meaning relied on. C-6 of the HCPF review. The current § 8.100.4.J adopts Express Lane (42 U.S.C. 1396a(e)(13)) for children from Free/Reduced Lunch, Food Assistance and Colorado Works applications; no item stated it. Final verification V-10 (2026-11-22): the 90-day end date (CO-2445) was computed but read by nothing, so a child still awaiting citizenship verification on day 120 was reported enrolled_pending_citizenship_verification; J.1.a.iii and J.2.a.iii give 90 days of eligibility 'while awaiting this verification'. What follows the end of the 90 days (termination with notice under the reasonable opportunity rules) is processing outside this item."
tests:
  - {id: CO-2442-T1, month: "2026-10", as_of: "2026-10-01", given: {ma_express_lane_source: snap_or_colorado_works_application, ma_express_lane_family_opted_in: true, ma_express_lane_child_meets_requirements: true, ma_citizenship_verification_is_pending: false, ma_identity_verification_is_pending: false}, title: "SNAP application, opted in, child fully eligible, citizenship verified", expect: enrolled}
  - {id: CO-2442-T2, month: "2026-10", as_of: "2026-10-01", given: {ma_express_lane_source: free_reduced_lunch_application, ma_express_lane_family_opted_in: true, ma_express_lane_child_meets_requirements: true, ma_citizenship_verification_is_pending: true, ma_express_lane_verification_period_end_date: "2026-12-20"}, title: "Citizenship verification outstanding: 90 days of eligibility", expect: enrolled_pending_citizenship_verification}
  - {id: CO-2442-T3, month: "2026-10", as_of: "2026-10-01", given: {ma_express_lane_source: free_reduced_lunch_application, ma_express_lane_family_opted_in: true, ma_express_lane_child_meets_requirements: false}, title: "Declared income over the children's standard: evaluated on the Single Streamlined Application", expect: refer_to_single_streamlined_application}
  - {id: CO-2442-T4, month: "2026-10", as_of: "2026-10-01", given: {ma_express_lane_source: free_reduced_lunch_automatic}, title: "Automatic lunch enrollment is not forwarded", expect: not_applicable}
  - {id: CO-2442-T5, month: "2026-10", as_of: "2026-10-01", title: "H-7: a Food Assistance application declares $3,000 for four; no MAGI tax facts are stated", given: {ma_express_lane_source: snap_or_colorado_works_application, ma_express_lane_family_opted_in: true, date_of_birth: "2018-03-01", is_colorado_resident: true, declared_household_income_monthly: 3000, declared_household_size: 4, ma_citizenship_verification_is_pending: false, ma_identity_verification_is_pending: false}, expect: enrolled}
  - {id: CO-2442-T6, month: "2026-12", as_of: "2026-12-28", title: "V-10: enrolled 2026-09-21; day 98 with citizenship still unverified: the 90 days have ended", given: {ma_express_lane_source: snap_or_colorado_works_application, ma_express_lane_family_opted_in: true, ma_express_lane_child_meets_requirements: true, ma_citizenship_verification_is_pending: true, ma_express_lane_verification_period_end_date: "2026-12-20"}, expect: verification_period_expired}
  # Time audit T-9: each comparison tested at its limit, with the two sides equal (the strict/inclusive flip of the comparison fails it).
  - {"id": "CO-2442-T7", "month": "2026-10", "as_of": "2026-10-01", "title": "T-9: ma_express_lane_verification_period_end_date equal to [\"det_date\"] (det_date over ma_express_lane_verification_period_end_date)", "given": {"ma_express_lane_source": "free_reduced_lunch_application", "ma_express_lane_family_opted_in": true, "ma_express_lane_child_meets_requirements": true, "ma_citizenship_verification_is_pending": true, "ma_express_lane_verification_period_end_date": "2026-10-01"}, "expect": "enrolled_pending_citizenship_verification"}
