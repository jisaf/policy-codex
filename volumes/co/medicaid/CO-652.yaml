id: CO-652
name: "Medicaid: LTC eligibility status"
identifier: ma_ltc_eligibility_status
kind: derived
type: one of
options: [eligible_institutional, eligible_hcbs, eligible_pace, ineligible_residency, not_aged_blind_or_disabled, ineligible_status, ineligible_income, ineligible_resources, ineligible_level_of_care, transfer_penalty, home_equity_exceeds_limit, not_institutionalized_or_waiver]
scope: person-month
program: Medicaid
role: outcome
meaning: The single Long-Term Care eligibility outcome for this person for the month - eligible for institutional, HCBS, or PACE services, or the reason for ineligibility - per 10 CCR 2505-10 § 8.100.7.
precision: "Tests, in order, whether the person is institutionalized or designated for an HCBS waiver at all; Colorado residency (§ 8.100.3.G.1.a); aged, blind or disabled (§ 8.100.3.F.1.f-g: the institutional and HCBS groups are 'Persons who are blind, disabled, or aged'); citizenship and immigration status (§ 8.100.3.G.1.g; § 8.7100.C.1 requires waiver members to meet § 8.100's long-term care criteria), where a child, pregnant or postpartum person designated for an HCBS waiver passes under Cover All Coloradans (§ 8.100.3.G.1.g.ix.1.b reaches the Long-Term Care waivers except PACE, not institutional care); the transfer penalty; home equity; the income test; the resource test; the level of care - nursing facility level of care, or for a person designated for a waiver the level of care that waiver requires (ma_meets_designated_waiver_level_of_care, CO-1178; § 8.7101 requires ICF/IID level of care for CES, SLS, DD and CHRP's developmental disability route and allows hospital level of care for CwCHN and CIH); then which setting (PACE first, then HCBS, then institutional at nursing facility level of care with status) the person is eligible for. A Cover All Coloradans person who reaches the setting branches but fits neither HCBS nor, lacking status, institutional care or PACE is ineligible_status; a status-meeting institutionalized person without nursing facility level of care is ineligible_level_of_care; anyone else left (a waiver designee outside the waiver's age criteria, for example) is not_institutionalized_or_waiver, in place of the former misleading ineligible_income default. The PACE-before-HCBS ordering for a person who could be either is an authoring choice, not a reading of the text - see OQ-100. Phase 7 fix round: B-3 added the residency, aged/blind/disabled and status branches (an undocumented nursing facility resident was eligible_institutional here and emergency-eligible in CO-1151 at once); S-4 the waiver-specific level of care."
derived: [case, [[not, [any, ma_is_institutionalized, [not, [=, meets_hcbs_waiver_target_group, "none"]]]], "not_institutionalized_or_waiver"], [[not, ma_meets_residency], "ineligible_residency"], [[not, ma_is_aged_blind_or_disabled], "not_aged_blind_or_disabled"], [[not, [any, ma_meets_citizenship_requirement, [all, ma_is_cover_all_coloradans_person, [not, [=, meets_hcbs_waiver_target_group, "none"]]]]], "ineligible_status"], [ma_transfer_penalty_applies, "transfer_penalty"], [ma_home_equity_disqualifies, "home_equity_exceeds_limit"], [[not, ma_meets_special_income_group], "ineligible_income"], [[not, ma_meets_ltc_resource_standard], "ineligible_resources"], [[not, [any, meets_nursing_facility_level_of_care, [all, [not, [=, meets_hcbs_waiver_target_group, "none"]], ma_meets_designated_waiver_level_of_care]]], "ineligible_level_of_care"], [ma_pace_eligible, "eligible_pace"], [ma_hcbs_waiver_eligible, "eligible_hcbs"], [[all, ma_is_institutionalized, meets_nursing_facility_level_of_care, ma_meets_citizenship_requirement], "eligible_institutional"], [[not, ma_meets_citizenship_requirement], "ineligible_status"], [ma_is_institutionalized, "ineligible_level_of_care"], [else, "not_institutionalized_or_waiver"]]
sources: [S351, S660, S661, S607, S662, S663, S664]
open: [OQ-100, OQ-214]
implemented: engine
tags: [ma, ltc, hcbs]
rationale: "No existing item reports Long-Term Care eligibility status. Named directly by the phase-4 brief's interface as role: outcome."
nearest: [CO-622]
tests:
  - {id: CO-652-T1, as_of: "2026-10-01", month: "2026-10", given: {ma_meets_residency: true, ma_is_aged_blind_or_disabled: true, ma_meets_citizenship_requirement: true, ma_is_institutionalized: true, meets_hcbs_waiver_target_group: "none", ma_transfer_penalty_applies: false, ma_home_equity_disqualifies: false, ma_meets_special_income_group: true, ma_meets_ltc_resource_standard: true, meets_nursing_facility_level_of_care: true, ma_pace_eligible: false, ma_hcbs_waiver_eligible: false}, expect: eligible_institutional}
  - {id: CO-652-T2, as_of: "2026-10-01", month: "2026-10", given: {ma_is_institutionalized: false, meets_hcbs_waiver_target_group: "none", ma_transfer_penalty_applies: false, ma_home_equity_disqualifies: false, ma_meets_special_income_group: true, ma_meets_ltc_resource_standard: true, meets_nursing_facility_level_of_care: true, ma_pace_eligible: false, ma_hcbs_waiver_eligible: false}, expect: not_institutionalized_or_waiver}
  - {id: CO-652-T3, as_of: "2026-10-01", month: "2026-10", given: {ma_meets_residency: true, ma_is_aged_blind_or_disabled: true, ma_meets_citizenship_requirement: true, ma_is_institutionalized: true, meets_hcbs_waiver_target_group: "none", ma_transfer_penalty_applies: true, ma_home_equity_disqualifies: false, ma_meets_special_income_group: true, ma_meets_ltc_resource_standard: true, meets_nursing_facility_level_of_care: true, ma_pace_eligible: false, ma_hcbs_waiver_eligible: false}, expect: transfer_penalty}
  - {id: CO-652-T4, as_of: "2026-10-01", month: "2026-10", given: {ma_meets_residency: true, ma_is_aged_blind_or_disabled: true, ma_meets_citizenship_requirement: true, ma_is_institutionalized: true, meets_hcbs_waiver_target_group: "none", ma_transfer_penalty_applies: false, ma_home_equity_disqualifies: false, ma_meets_special_income_group: false, ma_meets_ltc_resource_standard: true, meets_nursing_facility_level_of_care: true, ma_pace_eligible: false, ma_hcbs_waiver_eligible: false}, expect: ineligible_income}
  - {id: CO-652-T5, as_of: "2026-10-01", month: "2026-10", given: {ma_meets_residency: true, ma_is_aged_blind_or_disabled: true, ma_meets_citizenship_requirement: true, ma_is_institutionalized: false, meets_hcbs_waiver_target_group: "ebd", ma_transfer_penalty_applies: false, ma_home_equity_disqualifies: false, ma_meets_special_income_group: true, ma_meets_ltc_resource_standard: true, meets_nursing_facility_level_of_care: true, ma_pace_eligible: false, ma_hcbs_waiver_eligible: true}, expect: eligible_hcbs}
  - {id: CO-652-T6, as_of: "2026-10-01", month: "2026-10", given: {ma_meets_residency: true, ma_is_aged_blind_or_disabled: true, ma_meets_citizenship_requirement: true, ma_is_institutionalized: false, meets_hcbs_waiver_target_group: "ebd", ma_transfer_penalty_applies: false, ma_home_equity_disqualifies: false, ma_meets_special_income_group: true, ma_meets_ltc_resource_standard: true, meets_nursing_facility_level_of_care: false, ma_meets_designated_waiver_level_of_care: false, ma_pace_eligible: false, ma_hcbs_waiver_eligible: false}, expect: ineligible_level_of_care}
