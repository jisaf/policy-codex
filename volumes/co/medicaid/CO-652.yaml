  - {id: CO-652-T8, as_of: "2026-10-01", month: "2026-10", title: "Phase 7 fix round (B-3): not a Colorado resident", given: {ma_is_institutionalized: true, meets_hcbs_waiver_target_group: "none", ma_meets_residency: false}, expect: ineligible_residency}
  - {id: CO-652-T9, as_of: "2026-10-01", month: "2026-10", title: "Phase 7 fix round (B-3): nursing facility resident of 50, neither blind nor disabled", given: {ma_is_institutionalized: true, meets_hcbs_waiver_target_group: "none", ma_meets_residency: true, ma_is_aged_blind_or_disabled: false}, expect: not_aged_blind_or_disabled}
  - {id: CO-652-T10, as_of: "2026-10-01", month: "2026-10", title: "Phase 7 fix round (S-4): SLS designee at ICF/IID level of care, not nursing facility level of care", given: {ma_meets_residency: true, ma_is_aged_blind_or_disabled: true, ma_meets_citizenship_requirement: true, ma_is_institutionalized: false, meets_hcbs_waiver_target_group: "sls", ma_transfer_penalty_applies: false, ma_home_equity_disqualifies: false, ma_meets_special_income_group: true, ma_meets_ltc_resource_standard: true, meets_nursing_facility_level_of_care: false, ma_meets_designated_waiver_level_of_care: true, ma_pace_eligible: false, ma_hcbs_waiver_eligible: true}, expect: eligible_hcbs}
