id: CO-652
name: "Medicaid: LTC eligibility status"
identifier: ma_ltc_eligibility_status
kind: derived
type: one of
options: [eligible_institutional, eligible_hcbs, eligible_pace, ineligible_residency, not_aged_blind_or_disabled, ineligible_status, ineligible_income, ineligible_resources, ineligible_level_of_care, transfer_penalty, home_equity_exceeds_limit, not_eligible_for_requested_setting, not_institutionalized_or_waiver]
scope: person-month
program: Medicaid
role: outcome
meaning: The single Long-Term Care eligibility outcome for this person for the month - eligible for the long-term care setting the person requests (institutional, HCBS or PACE), or the reason for ineligibility - per 10 CCR 2505-10 § 8.100.7.
precision: "Tests, in order, whether the person is institutionalized, designated for an HCBS waiver or requesting PACE at all; Colorado residency (§ 8.100.3.G.1.a); aged, blind or disabled (§ 8.100.3.F.1.f-g); citizenship and immigration status (§ 8.100.3.G.1.g; § 8.7100.C.1), where a child, pregnant or postpartum person designated for an HCBS waiver passes under Cover All Coloradans (§ 8.100.3.G.1.g.ix.1.b reaches the Long-Term Care waivers except PACE); the income test; the resource test; home equity; the level of care - nursing facility level of care, or for a waiver designee the level of care that waiver requires (ma_meets_designated_waiver_level_of_care, CO-1178); the transfer penalty, which § 8.100.7.F.2.c.ii starts only once the person is otherwise eligible, so a person who fails income, resources, home equity or level of care is reported for that reason first; then eligibility for the setting the person requests (ma_ltc_setting_requested, CO-2411): PACE (ma_pace_eligible), HCBS (ma_hcbs_waiver_eligible) or institutional care (institutionalized, nursing facility level of care, status). A person who passes every financial and functional test but not the requested setting's own conditions (outside a PACE service area, for example) is not_eligible_for_requested_setting."
derived: [case, [[not, [any, ma_is_institutionalized, [not, ["=", meets_hcbs_waiver_target_group, none]], ["=", [otherwise, ma_ltc_setting_requested, none], pace]]], not_institutionalized_or_waiver], [[not, ma_meets_residency], ineligible_residency], [[not, ma_is_aged_blind_or_disabled], not_aged_blind_or_disabled], [[not, [any, ma_meets_citizenship_requirement, [all, ma_is_cover_all_coloradans_person, [not, ["=", meets_hcbs_waiver_target_group, none]]]]], ineligible_status], [[not, ma_meets_special_income_group], ineligible_income], [[not, ma_meets_ltc_resource_standard], ineligible_resources], [ma_home_equity_disqualifies, home_equity_exceeds_limit], [[not, [any, meets_nursing_facility_level_of_care, [all, [not, ["=", meets_hcbs_waiver_target_group, none]], ma_meets_designated_waiver_level_of_care]]], ineligible_level_of_care], [ma_transfer_penalty_applies, transfer_penalty], [["=", ma_ltc_setting_requested, pace], [case, [ma_pace_eligible, eligible_pace], [else, not_eligible_for_requested_setting]]], [["=", ma_ltc_setting_requested, hcbs], [case, [ma_hcbs_waiver_eligible, eligible_hcbs], [else, not_eligible_for_requested_setting]]], [["=", ma_ltc_setting_requested, institutional], [case, [[all, ma_is_institutionalized, meets_nursing_facility_level_of_care, ma_meets_citizenship_requirement], eligible_institutional], [[not, ma_meets_citizenship_requirement], ineligible_status], [ma_is_institutionalized, ineligible_level_of_care], [else, not_eligible_for_requested_setting]]], [else, not_eligible_for_requested_setting]]
sources: [S351, S660, S661, S607, S662, S663, S664, S1726, S379]
open: [OQ-214]
implemented: engine
tags: [ma, ltc, hcbs]
rationale: "No existing item reports Long-Term Care eligibility status. Named directly by the phase-4 brief's interface as role: outcome. HCPF fix round: B-3 overruled OQ-100 (resolved) - the outcome is eligibility for the requested setting, not PACE, then HCBS, then institutional by order; S-2 moved the transfer penalty after income, resources, home equity and level of care."
nearest: [CO-622]
