id: CO-652
name: "Medicaid: LTC eligibility status"
identifier: ma_ltc_eligibility_status
kind: derived
type: one of
options: [eligible_institutional, eligible_hcbs, eligible_pace, ineligible_residency, not_aged_blind_or_disabled, ineligible_status, ineligible_institution, ineligible_income, ineligible_resources, ineligible_level_of_care, transfer_penalty, home_equity_exceeds_limit, not_eligible_for_requested_setting, not_institutionalized_or_waiver, failed_to_cooperate]
scope: person-month
program: Medicaid
role: outcome
meaning: "The single Long-Term Care eligibility outcome for this person for the month - eligible for the long-term care setting the person requests (institutional, HCBS or PACE), or the reason for ineligibility - per 10 CCR 2505-10 § 8.100.7. It answers whether the criteria are met for the month; whether the month falls inside the coverage period (not before the retroactive months of § 8.100.3.E.1, and for QMB not before the effective month) is not tested here, as ma_month_is_before_coverage_period (CO-4101) tests it for the MAGI and OAP outcomes (final verification pass 3, P3-1)."
precision: "Tests, in order, whether the person is institutionalized, designated for an HCBS waiver or requesting PACE at all; Colorado residency (§ 8.100.3.G.1.a); aged, blind or disabled (§ 8.100.3.F.1.f-g); citizenship and immigration status (§ 8.100.3.G.1.g; § 8.7100.C.1), where a child, pregnant or postpartum person designated for an HCBS waiver passes under Cover All Coloradans (§ 8.100.3.G.1.g.ix.1.b reaches the Long-Term Care waivers except PACE); the income test; the resource test; home equity; the level of care - nursing facility level of care, or for a waiver designee the level of care that waiver requires (ma_meets_designated_waiver_level_of_care, CO-1178); the transfer penalty, which § 8.100.7.F.2.c.ii starts only once the person is otherwise eligible, so a person who fails income, resources, home equity or level of care is reported for that reason first; then eligibility for the setting the person requests (ma_ltc_setting_requested, CO-2411): PACE (ma_pace_eligible), HCBS (ma_hcbs_waiver_eligible) or institutional care (institutionalized, nursing facility level of care, status). A person who passes every financial and functional test but not the requested setting's own conditions (outside a PACE service area, for example) is not_eligible_for_requested_setting. Coverage pass 7, non-MAGI F7-5 (docs/reviews/coverage7-medicaid-nonmagi.md): reads the general requirement of 10 CCR 2505-10 § 8.100.3.G.1.c (S659) through ma_meets_imd_requirement (CO-1179), as the SSI-related groups (CO-611) and the MAGI groups (CO-562) do: G.1 states what a person \"shall\" meet \"To be eligible to receive Medical Assistance\", and names no category it leaves out. Before, a patient aged 21 to 64 of an institution for mental diseases could be found eligible here although no other Medical Assistance category admitted him (IMD-LTC, stored household CO-1104)."
derived: [case, [[not, ["=", ma_ltc_unmet_requirement, none]], ma_ltc_unmet_requirement], [ma_transfer_penalty_applies, transfer_penalty], [["=", ma_ltc_setting_requested, pace], [case, [ma_pace_eligible, eligible_pace], [else, not_eligible_for_requested_setting]]], [["=", ma_ltc_setting_requested, hcbs], [case, [ma_hcbs_waiver_eligible, eligible_hcbs], [else, not_eligible_for_requested_setting]]], [["=", ma_ltc_setting_requested, institutional], [case, [[all, ma_is_institutionalized, meets_nursing_facility_level_of_care, ma_meets_citizenship_requirement_in_month], eligible_institutional], [[not, ma_meets_citizenship_requirement_in_month], ineligible_status], [ma_is_institutionalized, ineligible_level_of_care], [else, not_eligible_for_requested_setting]]], [else, not_eligible_for_requested_setting]]
sources: [S351, S660, S661, S607, S662, S663, S664, S1726, S379, S659]
open: [OQ-214]
implemented: engine
tags: [ma, ltc, hcbs]
rationale: "No existing item reports Long-Term Care eligibility status. Named directly by the phase-4 brief's interface as role: outcome. HCPF fix round: B-3 overruled OQ-100 (resolved) - the outcome is eligibility for the requested setting, not PACE, then HCBS, then institutional by order; S-2 moved the transfer penalty after income, resources, home equity and level of care. Dual-entry audit 1.7: the requirements tested before the transfer penalty are their own item (ma_ltc_unmet_requirement, CO-3310), unchanged in order and result, so the apportionment between spouses (CO-2232) can read a spouse's eligibility apart from the penalty without a dependency cycle."
nearest: [CO-622]
