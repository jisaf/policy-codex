id: CO-652
name: "Medicaid: LTC eligibility status"
identifier: ma_ltc_eligibility_status
kind: derived
type: one of
options: [eligible_institutional, eligible_hcbs, eligible_pace, ineligible_income, ineligible_resources, ineligible_level_of_care, transfer_penalty, home_equity_exceeds_limit, not_institutionalized_or_waiver]
scope: person-month
program: Medicaid
role: outcome
meaning: The single Long-Term Care eligibility outcome for this person for the month - eligible for institutional, HCBS, or PACE services, or the reason for ineligibility - per 10 CCR 2505-10 § 8.100.7.
precision: Tests, in order, whether the person is institutionalized or meets an HCBS/PACE target group at all; the transfer penalty; home equity; the income test; the resource test; the nursing facility level of care; then which setting (PACE first, then HCBS, then institutional) the person is otherwise eligible for. The PACE-before-HCBS ordering for a person who could be either is an authoring choice, not a reading of the text - see OQ-100. Per the phase-4 review's C-8 finding, a level-of-care failure is reported as ineligible_level_of_care rather than falling through to the misleading ineligible_income default (a person who fails the level of care but otherwise meets every financial test previously fell to an unreachable-looking else branch that misreported the reason as income); § 8.100.7.A.2 and § 8.401 make the level of care a condition of institutional coverage as well as HCBS/PACE, so the test is placed before all three setting branches rather than only gating HCBS and PACE.
derived: [case, [[not, [any, ma_is_institutionalized, [not, [=, meets_hcbs_waiver_target_group, "none"]]]], "not_institutionalized_or_waiver"], [ma_transfer_penalty_applies, "transfer_penalty"], [ma_home_equity_disqualifies, "home_equity_exceeds_limit"], [[not, ma_meets_special_income_group], "ineligible_income"], [[not, ma_meets_ltc_resource_standard], "ineligible_resources"], [[not, meets_nursing_facility_level_of_care], "ineligible_level_of_care"], [ma_pace_eligible, "eligible_pace"], [ma_hcbs_waiver_eligible, "eligible_hcbs"], [ma_is_institutionalized, "eligible_institutional"], [else, "ineligible_income"]]
sources: [S351, S547]
open: [OQ-100, OQ-170]
implemented: engine
tags: [ma, ltc, hcbs]
rationale: "No existing item reports Long-Term Care eligibility status. Named directly by the phase-4 brief's interface as role: outcome."
nearest: [CO-622]
tests:
  - {id: CO-652-T1, as_of: "2026-10-01", month: "2026-10", given: {ma_is_institutionalized: true, meets_hcbs_waiver_target_group: "none", ma_transfer_penalty_applies: false, ma_home_equity_disqualifies: false, ma_meets_special_income_group: true, ma_meets_ltc_resource_standard: true, meets_nursing_facility_level_of_care: true, ma_pace_eligible: false, ma_hcbs_waiver_eligible: false}, expect: eligible_institutional}
  - {id: CO-652-T2, as_of: "2026-10-01", month: "2026-10", given: {ma_is_institutionalized: false, meets_hcbs_waiver_target_group: "none", ma_transfer_penalty_applies: false, ma_home_equity_disqualifies: false, ma_meets_special_income_group: true, ma_meets_ltc_resource_standard: true, meets_nursing_facility_level_of_care: true, ma_pace_eligible: false, ma_hcbs_waiver_eligible: false}, expect: not_institutionalized_or_waiver}
  - {id: CO-652-T3, as_of: "2026-10-01", month: "2026-10", given: {ma_is_institutionalized: true, meets_hcbs_waiver_target_group: "none", ma_transfer_penalty_applies: true, ma_home_equity_disqualifies: false, ma_meets_special_income_group: true, ma_meets_ltc_resource_standard: true, meets_nursing_facility_level_of_care: true, ma_pace_eligible: false, ma_hcbs_waiver_eligible: false}, expect: transfer_penalty}
  - {id: CO-652-T4, as_of: "2026-10-01", month: "2026-10", given: {ma_is_institutionalized: true, meets_hcbs_waiver_target_group: "none", ma_transfer_penalty_applies: false, ma_home_equity_disqualifies: false, ma_meets_special_income_group: false, ma_meets_ltc_resource_standard: true, meets_nursing_facility_level_of_care: true, ma_pace_eligible: false, ma_hcbs_waiver_eligible: false}, expect: ineligible_income}
  - {id: CO-652-T5, as_of: "2026-10-01", month: "2026-10", given: {ma_is_institutionalized: false, meets_hcbs_waiver_target_group: "ebd", ma_transfer_penalty_applies: false, ma_home_equity_disqualifies: false, ma_meets_special_income_group: true, ma_meets_ltc_resource_standard: true, meets_nursing_facility_level_of_care: true, ma_pace_eligible: false, ma_hcbs_waiver_eligible: true}, expect: eligible_hcbs}
  - {id: CO-652-T6, as_of: "2026-10-01", month: "2026-10", given: {ma_is_institutionalized: false, meets_hcbs_waiver_target_group: "ebd", ma_transfer_penalty_applies: false, ma_home_equity_disqualifies: false, ma_meets_special_income_group: true, ma_meets_ltc_resource_standard: true, meets_nursing_facility_level_of_care: false, ma_pace_eligible: false, ma_hcbs_waiver_eligible: false}, expect: ineligible_level_of_care}
  - {id: CO-652-T7, as_of: "2026-10-01", month: "2026-10", given: {ma_is_institutionalized: false, meets_hcbs_waiver_target_group: "ebd", ma_transfer_penalty_applies: false, ma_home_equity_disqualifies: false, ma_meets_special_income_group: true, ma_meets_ltc_resource_standard: true, meets_nursing_facility_level_of_care: true, ma_pace_eligible: true, ma_hcbs_waiver_eligible: true}, expect: eligible_pace}
