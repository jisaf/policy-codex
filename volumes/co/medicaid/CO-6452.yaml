id: CO-6452
name: "Medicaid: the month's MAGI household income, as a share of the poverty guideline"
identifier: ma_magi_monthly_household_income_pct_fpl
kind: derived
type: rate
scope: person-month
program: Medicaid
meaning: "This person's MAGI household income for the month (ma_magi_household_income, CO-503), before any annualized income (C.4.a) or premium tax credit income (C.5) is considered, as a fraction of the monthly federal poverty guideline for ma_magi_household_size: the \"current ... monthly household income\" on which 10 CCR 2505-10 8.100.4.C.4.a first tests an applicant."
precision: "Coverage pass 4, C4-05 (2026-11-23): each MAGI and CHP+ income test reads this figure first and the budget figure (ma_magi_household_income_pct_fpl, CO-504) only where this one fails, which is C.4.a's order (\"Applicants who are found financially ineligible based on current or previous monthly household income\") and C.5's: a ceiling is met if either figure meets it, and the CHP+ floor (over the Medicaid standard) only if both are over it. So an applicant who meets a standard on the month's income is determined although the annualized figure cannot be (an expected annual income, or whether pay is seasonal or commission-based, not stated). The guideline is read as CO-4567 reads it."
derived: ["/", ma_magi_household_income, ["/", [lookup_extended, federal_poverty_guideline_annual_table, ma_magi_household_size, federal_poverty_guideline_annual_each_additional], 12]]
sources: [S3356, S55, S161]
implemented: engine
tags: [ma, magi, income]
nearest: [CO-4567, CO-504]
rationale: "Coverage pass 4, C4-05: with no default for C.4.a's facts, a test that read only the lower of the monthly and annualized figures would be unknown for an applicant eligible on the month; the month's ratio is its own item so each test can read it first."
tests:
  - {id: CO-6452-T1, month: "2026-11", as_of: "2026-11-10", title: "B-SE-noflag: 3,000 for one: 3,000 / (15,960 / 12 = 1,330) = 225.6%", given: {ma_magi_household_income: 3000, ma_magi_household_size: 1}, expect: 2.255639097744361}
  - {id: CO-6452-T2, month: "2026-11", as_of: "2026-11-10", title: "2,750 for four: 2,750 / (33,000 / 12 = 2,750) = 100%", given: {ma_magi_household_income: 2750, ma_magi_household_size: 4}, expect: 1.0}
