id: CO-5530
name: "Medicaid: VA Aid and Attendance received in the month"
identifier: ma_va_aid_and_attendance_receipts
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: The portion of the person's VA pension for Aid and Attendance and Unusual Medical Expenses received in the month (receipts of kind va_aid_and_attendance), which 10 CCR 2505-10 § 8.100.5.K says "shall not be considered as income when determining eligibility" and which K.2 uses as patient payment for a veteran or surviving spouse of a veteran in a State Veterans Home with no dependents.
precision: "The kind's meaning names Aid and Attendance and the housebound allowance; K names Aid and Attendance and Unusual Medical Expenses. A household states the VA's Unusual Medical Expenses portion as a receipt of this kind (the translation of va_aid_and_attendance_amount does), and a housebound allowance as one too; OQ-973 asks whether K reaches the housebound allowance. Field-effect sweep (docs/reviews/field-sweep-snap-cash-nonmagi.md), FS-MA-1: a receipt stated as a stream (no month and no date) is received only in the months from the month of its start_date through the month of its end_date (each absent: before, or through, the months the case covers; CO-5000), since unearned income \"is countable as income in the month received\" (10 CCR 2505-10 8.100.5.F.5, S3001) and is counted \"when you receive it\" (20 CFR 416.1123(a), S4940); in its first and last months it is read at its amount, and a payment stated with its month or date is placed by it, a final payment after the stream ended included. Before, a stream was counted in every month whatever its dates. The clause is SNAP's (snap_counted_recurring_receipts, CO-5011)."
derived: [sum_receipts, receipts, [all, [received_in, [month]], [any, [not, [unknown, [receipt, month]]], [all, [any, [unknown, [receipt, start_date]], ["<=", [month_of, [receipt, start_date]], [month]]], [any, [unknown, [receipt, end_date]], [">=", [month_of, [receipt, end_date]], [month]]]]], ["=", [receipt, kind], va_aid_and_attendance]], [receipt, amount]]
sources: [S2900, S4940]
implemented: engine
tags: [ma, ltc, income]
open: [OQ-973]
rationale: "Receipt records, migration phase 2: replaces va_aid_and_attendance_amount and receives_va_aid_and_attendance (CO-837, CO-836), which stated a part of a pension a second time, in the patient payment (CO-658) and its State Veterans Home test (CO-4103)."
tests:
  - {id: CO-5530-T1, month: "2026-10", as_of: "2026-10-01", given: {receipts: [{kind: pension, amount: 500}, {kind: va_aid_and_attendance, amount: 400}]}, title: "A VA pension of which 400 is Aid and Attendance, stated as two receipts", expect: 400}
  - {id: CO-5530-T2, month: "2026-10", as_of: "2026-10-01", given: {receipts: [{kind: pension, amount: 900}]}, title: "No Aid and Attendance", expect: 0}
  # Field-effect sweep, non-MAGI Medicaid (docs/reviews/field-sweep-snap-cash-nonmagi.md); hand-computed from the text quoted in each title.
  - {id: CO-5530-T3, month: "2026-11", as_of: "2026-11-12", title: "FS-MA-1: Aid and Attendance of 400 that began 2026-12-01: none in November: 0", given: {receipts: [{kind: va_aid_and_attendance, amount: 400, start_date: "2026-12-01"}]}, expect: 0}
