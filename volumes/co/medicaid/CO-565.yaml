id: CO-565
name: "Medicaid: pregnancy coverage period start month"
identifier: ma_pregnancy_coverage_period_start_month
kind: derived
type: month
scope: person-month
program: Medicaid
meaning: "The first month of a pregnant applicant's Medical Assistance coverage period under 10 CCR 2505-10 § 8.100.4.G.5 - \"a period beginning with the date of application for Medical Assistance\" - or, where retroactive coverage was requested for medical services received in the retroactive period (ma_retroactive_coverage_requested, CO-4100; § 8.100.3.E.1-2) and the person met the Pregnant Women category in a month of that period (42 U.S.C. 1396a(e)(16)(A), coverage while pregnant \"including during a period of retroactive eligibility\"), the earliest such month: the first month of the retroactive window that the eligibility history records as the Pregnant Women category, or, where no history is recorded for the month, in which the person met the category (ma_is_pregnant_category, CO-546) on or after the month the person became eligible (ma_eligibility_start_date); otherwise the month containing ma_application_date."
precision: "Without a request for retroactive coverage (ma_retroactive_coverage_requested false or not stated) the period begins in the application month and no retroactive month is read, so neither pregnancy_start_date nor ma_eligibility_start_date is needed: § 8.100.3.E.1 provides retroactive assistance only to a person who 'shall have received medical services at any time during that period', and E.2 makes it a request on the application or a later verbal request. Month-level, matching this volume's month-keyed person-month outcomes; a coverage period that begins mid-month is treated as beginning with that whole month, consistent with 8.100.4.G.1's whole-month-eligibility rule. The retroactive window is the three months before the application month for an application made before ma_retroactive_coverage_change_date, and ma_retroactive_coverage_months_other_after_change (two) for a later one: a person whose period opens in a retroactive month is in the Pregnant Women category in the application month, never in the Adults group, so the one-month figure for expansion adults (CO-2472) never applies to her; reading CO-2472 here would make the rule circular (CO-2472 reads the application month's category, which reads this item). The months are tested in order and the first that qualifies is the start; a month whose category is unknown before any month qualifies leaves the start unknown. The approval and income verification conditions of § 8.100.4.G.5 are tested at the start month by ma_is_in_pregnancy_coverage_period (CO-566). Stated per person per month because the rule reads the retroactive months' facts; the value is the same in every month evaluated."
derived: [case, [[otherwise, ma_retroactive_coverage_requested, false], [months_after, [count_months, [months_from_to, [months_before, [case, [["<", ma_application_date, ma_retroactive_coverage_change_date], ma_retroactive_coverage_months], [else, ma_retroactive_coverage_months_other_after_change]], [month_of, ma_application_date]], [month_before, [month_of, ma_application_date]]], [not, [some_month, [months_from_to, [months_before, [case, [["<", ma_application_date, ma_retroactive_coverage_change_date], ma_retroactive_coverage_months], [else, ma_retroactive_coverage_months_other_after_change]], [month_of, ma_application_date]], [month]], [any, [otherwise, ["=", ma_prior_enrollment_category, pregnant], false], [all, [unknown, ma_prior_enrollment_category], ma_is_pregnant_category, ["<=", [month_of, ma_eligibility_start_date], [month]]]]]]], [months_before, [case, [["<", ma_application_date, ma_retroactive_coverage_change_date], ma_retroactive_coverage_months], [else, ma_retroactive_coverage_months_other_after_change]], [month_of, ma_application_date]]]], [else, [month_of, ma_application_date]]]
sources: [S640, S1503, S2411, S224, S1719]
implemented: engine
tags: [ma, magi]
rationale: "No existing item states when a pregnant applicant's coverage period begins. ma_is_in_pregnancy_coverage_period (CO-566) needs this single anchor month. Fix round (C-13): added per the phase-3 review's finding that 8.100.4.G.5's lock-in sentence ('once eligibility has been approved, ... coverage will be provided regardless of changes in the woman's financial circumstances') had no item modeling the coverage period it protects, only its end month (ma_postpartum_coverage_end_month, CO-560). Final verification F-1 (2026-11-22): the period opened only in the application month, and only if the Pregnant Women category was met then, so a woman who delivered before applying had no postpartum coverage although 42 U.S.C. 1396a(e)(16)(A) (S224) continues it for a woman who received Medical Assistance while pregnant during a period of retroactive eligibility, and § 8.100.3.E.2 (S2411) says the applicant need not be eligible in the month of application. The start is now the earliest month of the retroactive window in which the category was met. Final verification pass 2, F2-1 (docs/reviews/final2-medicaid-chp.md): the retroactive window was scanned for every pregnant applicant, whether or not retroactive coverage was requested, so an applicant whose income rose over the standard by the application month was locked into Medicaid from a retroactive month she never asked to have covered, and CHP+ prenatal was denied; and every pregnant applicant needed pregnancy_start_date or her category was unknown. The window is now scanned only when ma_retroactive_coverage_requested (CO-4100) is true."
tests:
  - {id: CO-565-T1, month: "2026-10", as_of: "2026-10-12", title: "No retroactive month meets the category: the application month", given: {ma_application_date: "2026-10-09", ma_is_pregnant_category: {"2026-07": false, "2026-08": false, "2026-09": false}}, expect: "2026-10"}
  - {id: CO-565-T2, month: "2026-09", as_of: "2026-09-20", title: "F-1: delivered in August, applied 2026-09-15; the category is met in June, July and August: the period opens in June", given: {ma_retroactive_coverage_requested: true, ma_application_date: "2026-09-15", ma_eligibility_start_date: "2026-01-01", ma_is_pregnant_category: {"2026-06": true, "2026-07": true, "2026-08": true}}, expect: "2026-06"}
  - {id: CO-565-T3, month: "2026-09", as_of: "2026-09-20", title: "F-1: the person became eligible on 2026-07-14 (moved to Colorado): the period opens in July", given: {ma_retroactive_coverage_requested: true, ma_application_date: "2026-09-15", ma_eligibility_start_date: "2026-07-14", ma_is_pregnant_category: {"2026-06": true, "2026-07": true, "2026-08": true}}, expect: "2026-07"}
  - {id: CO-565-T4, month: "2027-02", as_of: "2027-02-10", title: "An application after 2026: a two-month window, December and January (November is not tested)", given: {ma_retroactive_coverage_requested: true, ma_application_date: "2027-02-03", ma_eligibility_start_date: "2026-01-01", ma_is_pregnant_category: {"2026-12": false, "2027-01": true}}, expect: "2027-01"}
  - {id: CO-565-T5, month: "2026-11", as_of: "2026-11-10", title: "The history records September as the Pregnant Women category", given: {ma_retroactive_coverage_requested: true, ma_application_date: "2026-11-02", ma_prior_enrollment_category: {"2026-08": none, "2026-09": pregnant}}, expect: "2026-09"}
  - {id: CO-565-T6, month: "2026-10", as_of: "2026-10-12", title: "The first retroactive month is unknown: the start is unknown", given: {ma_retroactive_coverage_requested: true, ma_application_date: "2026-10-09"}, expect: unknown}
  - {id: CO-565-T7, month: "2026-09", as_of: "2026-09-20", title: "F2-1: the category is met in June, July and August, but no retroactive coverage was requested: the period opens in the application month", given: {ma_retroactive_coverage_requested: false, ma_application_date: "2026-09-15", ma_eligibility_start_date: "2026-01-01", ma_is_pregnant_category: {"2026-06": true, "2026-07": true, "2026-08": true}}, expect: "2026-09"}
  - {id: CO-565-T8, month: "2026-10", as_of: "2026-10-12", title: "F2-1: no request stated and nothing known of the retroactive months: the application month, not unknown", given: {ma_application_date: "2026-10-09"}, expect: "2026-10"}
