id: CO-565
name: "Medicaid: pregnancy coverage period start month"
identifier: ma_pregnancy_coverage_period_start_month
kind: derived
type: month
scope: person-month
program: Medicaid
meaning: "The first month of the pregnancy coverage period the month evaluated falls in, under 10 CCR 2505-10 § 8.100.4.G.5 and 42 U.S.C. 1396a(e)(5) and (e)(16): the first month, from ma_pregnancy_coverage_period_search_start_month (CO-7774: the application's first month - the first month of the requested retroactive period (ma_retroactive_coverage_requested, CO-4100; § 8.100.3.E.1-2), or else the month containing ma_application_date - or, where later, the month after the last pregnancy whose postpartum year ended before the month evaluated) through the determination month, in which a period begins (ma_pregnancy_coverage_period_begins_in_month, CO-7775: it opens in the month, ma_pregnancy_coverage_period_opens_in_month CO-7401, for a pregnancy with a recorded end on or after it or that continues); where no such month begins one, the month containing ma_application_date. Informational: ma_is_in_pregnancy_coverage_period (CO-566) reads the same months, not this item."
precision: "Coverage pass 7, C7-02 (2026-11-24): the months searched start after the last pregnancy whose postpartum year ended before the month evaluated (CO-7774), and a month begins a period only for a pregnancy that has a recorded end on or after it or continues (CO-7775), so a later pregnancy has its own start month (PG-SECOND: member since 2025-03, birth 2025-09-10, pregnant again from 2026-10-05; for November 2026 the search runs from 2025-10, the month after the 2025-09 birth, whose year ended with 2026-09, and finds nothing at $5,500; before, March 2025). The first month is counted with sum_months (P54) over the months searched, so the search start of the month evaluated is read for each candidate. Without a request for retroactive coverage (ma_retroactive_coverage_requested false or not stated) no retroactive month is read: § 8.100.3.E.1 provides retroactive assistance only to a person who 'shall have received medical services at any time during that period', and E.2 makes it a request on the application or a later verbal request. Month-level, matching this volume's month-keyed person-month outcomes; a coverage period that begins mid-month is treated as beginning with that whole month, consistent with 8.100.4.G.1's whole-month-eligibility rule. The retroactive window is the three months before the application month for an application made before ma_retroactive_coverage_change_date, and ma_retroactive_coverage_months_other_after_change (two) for a later one: a person whose period opens in a retroactive month is in the Pregnant Women category in the application month, never in the Adults group, so the one-month figure for expansion adults (CO-2472) never applies to her; reading CO-2472 here would make the rule circular (CO-2472 reads the application month's category, which reads this item). The months are tested in order and the first that opens the period is the start; a month whose opening is unknown before any month opens it leaves the start unknown. Coverage pass 6 (2026-11-24): C6-01, the months searched run from the application month (or the first requested retroactive month) through the determination month, not the application month alone, so a member enrolled before her pregnancy (her application month long before it) opens the period in the first month she received Medical Assistance while pregnant (42 U.S.C. 1396a(e)(5), S5060); C6-02, an applicant ineligible in the application month and eligible as a pregnant woman in a later month of the same application opens it in that month (G.5; 8.100.3.E.2, 'An applicant does not have to be eligible in the month of application'). Stated per person per month because the rule reads the months' facts; the value is the same in every month evaluated."
derived: [case, [[some_month, [months_from_to, ma_pregnancy_coverage_period_search_start_month, [det_month]], ma_pregnancy_coverage_period_begins_in_month], [months_after, [sum_months, [months_from_to, ma_pregnancy_coverage_period_search_start_month, [det_month]], [case, [[some_month, [months_from_to, ma_pregnancy_coverage_period_search_start_month, [that_month]], ma_pregnancy_coverage_period_begins_in_month], 0], [else, 1]]], ma_pregnancy_coverage_period_search_start_month]], [else, [month_of, ma_application_date]]]
sources: [S640, S1503, S2411, S224, S1719, S5060]
implemented: engine
tags: [ma, magi]
rationale: "No existing item states when a pregnant applicant's coverage period begins. ma_is_in_pregnancy_coverage_period (CO-566) needs this single anchor month. Fix round (C-13): added per the phase-3 review's finding that 8.100.4.G.5's lock-in sentence ('once eligibility has been approved, ... coverage will be provided regardless of changes in the woman's financial circumstances') had no item modeling the coverage period it protects, only its end month (ma_postpartum_coverage_end_month, CO-560). Final verification F-1 (2026-11-22): the period opened only in the application month, and only if the Pregnant Women category was met then, so a woman who delivered before applying had no postpartum coverage although 42 U.S.C. 1396a(e)(16)(A) (S224) continues it for a woman who received Medical Assistance while pregnant during a period of retroactive eligibility, and § 8.100.3.E.2 (S2411) says the applicant need not be eligible in the month of application. The start is now the earliest month of the retroactive window in which the category was met. Final verification pass 2, F2-1 (docs/reviews/final2-medicaid-chp.md): the retroactive window was scanned for every pregnant applicant, whether or not retroactive coverage was requested, so an applicant whose income rose over the standard by the application month was locked into Medicaid from a retroactive month she never asked to have covered, and CHP+ prenatal was denied; and every pregnant applicant needed pregnancy_start_date or her category was unknown. The window is now scanned only when ma_retroactive_coverage_requested (CO-4100) is true. Coverage pass 6, C6-01 and C6-02 (2026-11-24): the months of the application are searched through the determination month, each tested by ma_pregnancy_coverage_period_opens_in_month (CO-7401), which also reads Medical Assistance of any category received while pregnant (42 U.S.C. 1396a(e)(5))."
