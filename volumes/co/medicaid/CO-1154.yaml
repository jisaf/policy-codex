id: CO-1154
name: "Medicaid: family planning and reproductive health care status"
identifier: ma_family_planning_status
kind: derived
type: one of
options: [full_coverage, limited_family_planning, reproductive_health_care_program, ineligible_residency, ineligible_income, ineligible]
scope: person-month
program: Medicaid
role: outcome
meaning: "Which route, if any, gives the person family planning services this month. A person eligible for a Medicaid category that provides full coverage (ma_has_full_coverage_category, CO-1176) or for the Breast and Cervical Cancer Program (whose clients receive all State Plan benefits, § 8.715.7.A) gets family planning services as a Medicaid client (10 CCR 2505-10 § 8.730.2.A), as does a child under ma_magi_child_age_limit eligible for state medical assistance (C.R.S. 25.5-2-104(2)) - full_coverage. A resident who meets the citizenship and immigration status requirement, is not fully covered, and whose family planning household income is over 133% and within 260% FPL qualifies for Limited Family Planning Medical Assistance (§ 8.100.4.G.8) - limited_family_planning. A resident with reproductive capacity who would be eligible for Medical Assistance but for immigration status qualifies for the state-only reproductive health-care program (C.R.S. 25.5-2-103; § 8.100.3.G.1.g.ix.2's reproductive care regardless of status) - reproductive_health_care_program."
precision: "Order: residency; full coverage; for a person meeting status (CO-509), the income band (otherwise ineligible_income); for a person failing status, reproductive capacity and eligibility but for status (otherwise ineligible). Limited family planning is not among the categories Cover All Coloradans reaches (§ 8.100.3.G.1.g.ix.1.a-b) and § 8.100.4.G.8 requires 'immigration or citizenship status', so the status test is CO-509 alone and an undocumented pregnant woman who is not fully covered reaches the reproductive health-care program (OQ-214). 'Would be eligible to enroll in the medical assistance program... but is not eligible due solely to the individual's immigration status' (25.5-2-103(1)(b)) is read as meeting a categorical program other than status (ma_is_emergency_medicaid_only, CO-510) or the Limited Family Planning income band (OQ-205). A child under ma_magi_child_age_limit who fails status and meets either is eligible for state medical assistance (C.R.S. 25.5-2-104(2)), which includes all Medical Assistance benefits, and so is reported full_coverage, not the reproductive health-care program, which 25.5-2-103(1)(b) closes to a person eligible for state medical assistance; a child who has declined state medical assistance (ma_has_declined_state_medical_assistance, CO-2207; OQ-205, resolved) is not reported full_coverage, and reaches the reproductive health-care program when the child has reproductive capacity. Limited family planning is read by the letter of § 8.100.4.G.8 ('no age or gender restriction'), although § 8.730.1 defines family planning services as services to individuals of child-bearing age (OQ-215). Full coverage reads the shared union CO-1176, which adds the protected groups and OAP SISC B, and BCCP is added here. A child in a continuous eligibility period that began in Limited Family Planning (§ 8.100.3.Q.2.g) keeps limited_family_planning for the period whatever the month's income. No age or gender restriction, deliberately (OQ-215, resolved): § 8.100.4.G.8 says the limited family planning category \"has no age or gender restriction\" (S613), and the federal group it implements is defined by income and not being pregnant alone (42 U.S.C. 1396a(ii)(1), S2114). § 8.730.1's \"individuals of child-bearing age\" (S677) and § 8.730.2.A (S616) define family planning services, the benefit, as 42 U.S.C. 1396d(a)(4)(C) does (S2114); they do not narrow who is eligible for the category. So an 81-year-old man or a six-year-old in the income band is reported limited_family_planning: that is the rule's eligibility answer, not a bug; which family planning services such a person can use is a benefit question this volume does not model. The reproductive health-care program route reads has_reproductive_capacity because C.R.S. 25.5-2-103 conditions that program on it."
