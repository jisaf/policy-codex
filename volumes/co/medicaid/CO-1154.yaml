id: CO-1154
name: "Medicaid: family planning and reproductive health care status"
identifier: ma_family_planning_status
kind: derived
type: one of
options: [full_coverage, limited_family_planning, reproductive_health_care_program, ineligible_residency, ineligible_income, ineligible]
scope: person-month
program: Medicaid
role: outcome
meaning: "Which route, if any, gives the person family planning services this month. A person fully eligible for a MAGI or SSI-related Medicaid category gets family planning services as a Medicaid client (10 CCR 2505-10 § 8.730.2.A) - full_coverage. A resident who meets citizenship or immigration requirements, is not fully eligible, and whose family planning household income is over 133% and within 260% FPL qualifies for Limited Family Planning Medical Assistance (§ 8.100.4.G.8) - limited_family_planning. A resident with reproductive capacity who would be eligible for Medical Assistance but for immigration status qualifies for the state-only reproductive health-care program (C.R.S. 25.5-2-103; § 8.100.3.G.1.g.ix.2's reproductive care regardless of status) - reproductive_health_care_program."
precision: "Order: residency; full coverage; for a person meeting status, the income band (otherwise ineligible_income); for a person failing status, reproductive capacity and eligibility but for status (otherwise ineligible). 'Would be eligible to enroll in the medical assistance program ... but is not eligible due solely to the individual's immigration status' (25.5-2-103(1)(b)) is read as meeting a categorical program other than status (ma_is_emergency_medicaid_only, CO-510) or the Limited Family Planning income band (OQ-205). A child under 19 is never in the program branch, because ma_meets_citizenship_requirement (CO-509) already treats children regardless of status, matching 25.5-2-103(1)(b)'s exclusion of a person eligible for state medical assistance (25.5-2-104). Declining state medical assistance is not modeled (OQ-205)."
derived: [case, [[not, ma_meets_residency], "ineligible_residency"], [[any, ma_magi_is_fully_eligible, ma_is_ssi_related_eligible], "full_coverage"], [ma_meets_citizenship_requirement, [case, [ma_family_planning_income_in_band, "limited_family_planning"], [else, "ineligible_income"]]], [[all, has_reproductive_capacity, [any, ma_is_emergency_medicaid_only, ma_family_planning_income_in_band]], "reproductive_health_care_program"], [else, "ineligible"]]
sources: [S613, S614, S615, S616, S601, S654]
open: [OQ-204, OQ-205]
implemented: engine
tags: [ma, magi, immigration, state_election]
rationale: "No existing item states the limited Family Planning category or Colorado's state-only reproductive health-care program. One outcome covers both because they are alternatives for the same services: a person meeting status reaches the limited category, a person failing only status reaches the state program. Declared an outcome."
tests:
  - {id: CO-1154-T1, as_of: "2026-10-01", month: "2026-10", given: {ma_meets_residency: false}, expect: ineligible_residency}
  - {id: CO-1154-T2, as_of: "2026-10-01", month: "2026-10", given: {ma_meets_residency: true, ma_magi_is_fully_eligible: true}, expect: full_coverage}
  - {id: CO-1154-T3, as_of: "2026-10-01", month: "2026-10", title: "Citizen at about 200% FPL with no full-coverage category", given: {ma_meets_residency: true, ma_magi_is_fully_eligible: false, ma_is_ssi_related_eligible: false, ma_meets_citizenship_requirement: true, ma_family_planning_income_in_band: true}, expect: limited_family_planning}
  - {id: CO-1154-T4, as_of: "2026-10-01", month: "2026-10", title: "Citizen above 260% FPL", given: {ma_meets_residency: true, ma_magi_is_fully_eligible: false, ma_is_ssi_related_eligible: false, ma_meets_citizenship_requirement: true, ma_family_planning_income_in_band: false}, expect: ineligible_income}
  - {id: CO-1154-T5, as_of: "2026-10-01", month: "2026-10", title: "Undocumented adult within the MAGI adult standard", given: {ma_meets_residency: true, ma_magi_is_fully_eligible: false, ma_is_ssi_related_eligible: false, ma_meets_citizenship_requirement: false, has_reproductive_capacity: true, ma_is_emergency_medicaid_only: true}, expect: reproductive_health_care_program}
  - {id: CO-1154-T6, as_of: "2026-10-01", month: "2026-10", title: "Undocumented adult in the family planning band only", given: {ma_meets_residency: true, ma_magi_is_fully_eligible: false, ma_is_ssi_related_eligible: false, ma_meets_citizenship_requirement: false, has_reproductive_capacity: true, ma_is_emergency_medicaid_only: false, ma_family_planning_income_in_band: true}, expect: reproductive_health_care_program}
  - {id: CO-1154-T7, as_of: "2026-10-01", month: "2026-10", given: {ma_meets_residency: true, ma_magi_is_fully_eligible: false, ma_is_ssi_related_eligible: false, ma_meets_citizenship_requirement: false, has_reproductive_capacity: false}, expect: ineligible}
