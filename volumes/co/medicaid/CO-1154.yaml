id: CO-1154
name: "Medicaid: family planning and reproductive health care status"
identifier: ma_family_planning_status
kind: derived
type: one of
options: [full_coverage, limited_family_planning, reproductive_health_care_program, ineligible_residency, ineligible_income, ineligible]
scope: person-month
program: Medicaid
role: outcome
meaning: "Which route, if any, gives the person family planning services this month. A person eligible for a Medicaid category that provides full coverage (ma_has_full_coverage_category, CO-1176) or for the Breast and Cervical Cancer Program (whose clients receive all State Plan benefits, § 8.715.7.A) gets family planning services as a Medicaid client (10 CCR 2505-10 § 8.730.2.A), as does a child under 19 eligible for state medical assistance (C.R.S. 25.5-2-104(2)) - full_coverage. A resident who meets the citizenship and immigration status requirement, is not fully covered, and whose family planning household income is over 133% and within 260% FPL qualifies for Limited Family Planning Medical Assistance (§ 8.100.4.G.8) - limited_family_planning. A resident with reproductive capacity who would be eligible for Medical Assistance but for immigration status qualifies for the state-only reproductive health-care program (C.R.S. 25.5-2-103; § 8.100.3.G.1.g.ix.2's reproductive care regardless of status) - reproductive_health_care_program."
precision: "Order: residency; full coverage; for a person meeting status (CO-509), the income band (otherwise ineligible_income); for a person failing status, reproductive capacity and eligibility but for status (otherwise ineligible). Limited family planning is not among the categories Cover All Coloradans reaches (§ 8.100.3.G.1.g.ix.1.a-b) and § 8.100.4.G.8 requires 'immigration or citizenship status', so the status test is CO-509 alone and an undocumented pregnant woman who is not fully covered reaches the reproductive health-care program (phase 7 fix round, S-2; OQ-214). 'Would be eligible to enroll in the medical assistance program ... but is not eligible due solely to the individual's immigration status' (25.5-2-103(1)(b)) is read as meeting a categorical program other than status (ma_is_emergency_medicaid_only, CO-510) or the Limited Family Planning income band (OQ-205). A child under 19 who fails status and meets either is eligible for state medical assistance (C.R.S. 25.5-2-104(2)), which includes all Medical Assistance benefits, and so is reported full_coverage, not the reproductive health-care program, which 25.5-2-103(1)(b) closes to a person eligible for state medical assistance; a child who has declined state medical assistance (ma_has_declined_state_medical_assistance, CO-2207; OQ-205, resolved) is not reported full_coverage, and reaches the reproductive health-care program when the child has reproductive capacity. Limited family planning is read by the letter of § 8.100.4.G.8 ('no age or gender restriction'), although § 8.730.1 defines family planning services as services to individuals of child-bearing age (OQ-215). Phase 7 fix round (S-1): full coverage reads the shared union CO-1176, which adds the protected groups and OAP SISC B, and BCCP is added here."
derived: [case, [[not, ma_meets_residency], "ineligible_residency"], [[any, ma_has_full_coverage_category, [=, ma_bccp_eligibility_status, "eligible"], [all, [<, age, ma_magi_child_age_limit], [not, ma_meets_citizenship_requirement], [any, ma_is_emergency_medicaid_only, ma_family_planning_income_in_band], [not, ma_has_declined_state_medical_assistance]]], "full_coverage"], [ma_meets_citizenship_requirement, [case, [ma_family_planning_income_in_band, "limited_family_planning"], [else, "ineligible_income"]]], [[all, has_reproductive_capacity, [any, ma_is_emergency_medicaid_only, ma_family_planning_income_in_band]], "reproductive_health_care_program"], [else, "ineligible"]]
sources: [S613, S614, S615, S616, S601, S654, S673, S607, S677]
open: [OQ-204, OQ-205, OQ-214, OQ-215]
implemented: engine
tags: [ma, magi, immigration, state_election]
rationale: "No existing item states the limited Family Planning category or Colorado's state-only reproductive health-care program. One outcome covers both because they are alternatives for the same services: a person meeting status reaches the limited category, a person failing only status reaches the state program. Declared an outcome."
