  - {id: CO-1154-T11, as_of: "2026-10-01", month: "2026-10", title: "Phase 7 fix round (S-2): undocumented child of 15 in the family planning band, not in a Medicaid category - state medical assistance", given: {is_colorado_resident: true, ma_has_full_coverage_category: false, ma_bccp_eligibility_status: ineligible_sex_or_age, date_of_birth: "2011-05-01", ma_meets_citizenship_requirement: false, ma_is_emergency_medicaid_only: false, ma_family_planning_income_in_band: true, ma_has_declined_state_medical_assistance: false}, expect: full_coverage}
