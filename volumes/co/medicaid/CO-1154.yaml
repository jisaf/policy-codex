rationale: "No existing item states the limited Family Planning category or Colorado's state-only reproductive health-care program. One outcome covers both because they are alternatives for the same services: a person meeting status reaches the limited category, a person failing only status reaches the state program. Declared an outcome. History moved from the precision note (HCPF review S-14): Phase 7 fix round (S-1): full coverage reads the shared union CO-1176, which adds the protected groups and OAP SISC B, and BCCP is added here. HCPF fix round (C-7): a child in a continuous eligibility period that began in Limited Family Planning (§ 8.100.3.Q.2.g) keeps limited_family_planning for the period whatever the month's income. Precision history (moved from precision, engineering follow-up pass task 5): (phase 7 fix round, S-2; OQ-214)."
