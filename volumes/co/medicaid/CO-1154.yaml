  - {id: CO-1154-T4, as_of: "2026-10-01", month: "2026-10", title: "Citizen above 260% FPL", given: {is_colorado_resident: true, ma_has_full_coverage_category: false, ma_bccp_eligibility_status: ineligible_sex_or_age, date_of_birth: "1990-01-01", ma_meets_citizenship_requirement: true, ma_family_planning_income_in_band: false}, expect: ineligible_income}
  - {id: CO-1154-T5, as_of: "2026-10-01", month: "2026-10", title: "Undocumented adult within the MAGI adult standard", given: {is_colorado_resident: true, ma_has_full_coverage_category: false, ma_bccp_eligibility_status: ineligible_sex_or_age, date_of_birth: "1990-01-01", ma_meets_citizenship_requirement: false, has_reproductive_capacity: true, ma_is_emergency_medicaid_only: true}, expect: reproductive_health_care_program}
