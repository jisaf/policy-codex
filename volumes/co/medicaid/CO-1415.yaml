id: CO-1415
name: "Medicaid: verification status"
identifier: ma_verification_status
kind: derived
type: one of
options: [not_required, complete, pending, past_due, pending_reasonable_opportunity, reasonable_opportunity_expired]
scope: person-month
program: Medicaid
role: outcome
meaning: "Where this person's Medical Assistance verification stands: none required; complete; pending within the time allowed; past the time allowed with documentation other than status outstanding; only citizenship, identity or immigration status outstanding within the reasonable opportunity period (benefits are furnished meanwhile to an otherwise eligible person); or the reasonable opportunity period expired with status unverified."
precision: past_due and reasonable_opportunity_expired state that the time allowed has run; the termination itself (within 30 days, with notice) is processing outside this item. A good-faith extension of the reasonable opportunity period is not modeled (OQ-316).
derived: [case, [["=", ma_required_verification_count, 0], not_required], [["=", ma_pending_verification_count, 0], complete], [[all, [">", ["-", ma_pending_verification_count, ma_pending_status_verification_count], 0], [">", [det_date], ma_verification_due_date]], past_due], [[all, [">", ma_pending_status_verification_count, 0], [">", [det_date], ma_reasonable_opportunity_period_end_date]], reasonable_opportunity_expired], [[">", ["-", ma_pending_verification_count, ma_pending_status_verification_count], 0], pending], [else, pending_reasonable_opportunity]]
sources: [S840, S841, S853, S859, S864, S901]
implemented: engine
tags: [verification, ma]
open: [OQ-303, OQ-316]
rationale: No existing item reports a person's Medical Assistance verification standing; reasonable-opportunity coverage is a distinct state neither eligible-verified nor pending denial.
tests:
  - {id: CO-1415-T1, month: "2026-10", as_of: "2026-10-01", given: {ma_required_verification_count: 0}, expect: not_required}
  - {id: CO-1415-T2, month: "2026-10", as_of: "2026-10-01", given: {ma_required_verification_count: 2, ma_pending_verification_count: 0}, expect: complete}
  - {id: CO-1415-T3, month: "2026-10", as_of: "2026-10-01", given: {determination_date: "2026-11-15", ma_required_verification_count: 2, ma_pending_verification_count: 1, ma_pending_status_verification_count: 0, ma_verification_due_date: "2026-10-31"}, expect: past_due}
  - {id: CO-1415-T4, month: "2026-10", as_of: "2026-10-01", given: {determination_date: "2027-01-10", ma_required_verification_count: 2, ma_pending_verification_count: 1, ma_pending_status_verification_count: 1, ma_verification_due_date: "2026-10-31", ma_reasonable_opportunity_period_end_date: "2027-01-04"}, expect: reasonable_opportunity_expired}
  - {id: CO-1415-T5, month: "2026-10", as_of: "2026-10-01", given: {determination_date: "2026-10-10", ma_required_verification_count: 3, ma_pending_verification_count: 2, ma_pending_status_verification_count: 1, ma_verification_due_date: "2026-10-31", ma_reasonable_opportunity_period_end_date: "2027-01-04"}, expect: pending}
  - {id: CO-1415-T6, month: "2026-10", as_of: "2026-10-01", given: {determination_date: "2026-11-10", ma_required_verification_count: 3, ma_pending_verification_count: 1, ma_pending_status_verification_count: 1, ma_verification_due_date: "2026-10-31", ma_reasonable_opportunity_period_end_date: "2027-01-04"}, expect: pending_reasonable_opportunity}
