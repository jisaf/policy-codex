id: CO-2232
name: Transfer penalty apportioned between spouses
identifier: ma_transfer_penalty_is_apportioned_with_spouse
kind: derived
type: yes/no
scope: person
program: Medicaid
meaning: "Whether the period of ineligibility from a transfer of assets is apportioned equally between this person and the person's spouse because the spouse became institutionalized and is otherwise eligible for Medical Assistance (10 CCR 2505-10 § 8.100.7.F.8.a): a spouse of the case who, in the determination month, is institutionalized, meets every Long-Term Care requirement apart from the transfer penalty (ma_ltc_unmet_requirement none) and the institutional setting's level of care and status; a spouse outside the case so found; or an apportionment whose spouse's remaining months have since been assigned to this person (F.8.b)."
precision: "Otherwise eligible is read apart from the transfer penalty, which the rule determines after the other requirements, so the spouse's own share of the penalty does not decide whether the penalty is shared (no cycle). Once the spouse dies or leaves the institution, the apportionment of this person's own share stands and ma_transfer_penalty_months_assigned_from_spouse (CO-2233) adds the months remaining in the spouse's share; the months the spouse already served are history the case states there."
derived: [any, [">", [otherwise, ma_transfer_penalty_months_assigned_from_spouse, 0], 0], [exists, [filter, [persons], [otherwise, [rel, [spouse], [P]], false]], [all, [at, [of, [P], ma_is_institutionalized], [det_month]], [at, ["=", [of, [P], ma_ltc_unmet_requirement], none], [det_month]], [of, [P], meets_nursing_facility_level_of_care], [of, [P], ma_meets_citizenship_requirement]]], [otherwise, ma_spouse_outside_case_is_institutionalized_and_otherwise_eligible, false]]
sources: [S1507]
implemented: engine
tags: [ma, ltc, legal]
rationale: "OQ-94: § 8.100.7.F.8 splits the penalty period between institutionalized spouses. Dual-entry audit 1.7: the apportionment restated the spouse's situation on this person; it is now derived from the spouse's own institutionalization and Long-Term Care requirements apart from the penalty (CO-3310), which breaks the cycle with the rule's own order of determination (the penalty is determined after the other requirements). A spouse outside the case is read from CO-3311."
tests:
  - {id: CO-2232-T1, title: "Spouse at home (community spouse)", as_of: "2026-10-01", given: {ma_transfer_penalty_months_assigned_from_spouse: 0}, others: {p2: {ma_is_institutionalized: false}}, relationships: [[spouse, p2]], expect: false}
  - {id: CO-2232-T2, title: "Spouse institutionalized and otherwise eligible", as_of: "2026-10-01", given: {ma_transfer_penalty_months_assigned_from_spouse: 0}, others: {p2: {ma_is_institutionalized: true, ma_ltc_unmet_requirement: none, meets_nursing_facility_level_of_care: true, ma_meets_citizenship_requirement: true}}, relationships: [[spouse, p2]], expect: true}
  - {id: CO-2232-T3, title: "Spouse institutionalized but over the resource standard", as_of: "2026-10-01", given: {ma_transfer_penalty_months_assigned_from_spouse: 0}, others: {p2: {ma_is_institutionalized: true, ma_ltc_unmet_requirement: ineligible_resources, meets_nursing_facility_level_of_care: true, ma_meets_citizenship_requirement: true}}, relationships: [[spouse, p2]], expect: false}
  - {id: CO-2232-T4, title: "F.8.b: the spouse's remaining months were assigned to this person", as_of: "2026-10-01", given: {ma_transfer_penalty_months_assigned_from_spouse: 4}, relationships: [], expect: true}
  - {id: CO-2232-T5, title: "Spouse on another case, found institutionalized and otherwise eligible", as_of: "2026-10-01", given: {ma_transfer_penalty_months_assigned_from_spouse: 0, ma_spouse_outside_case_is_institutionalized_and_otherwise_eligible: true}, relationships: [], expect: true}
