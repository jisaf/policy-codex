id: CO-1963
name: "Medicaid community engagement: is an excluded family caregiver"
identifier: ma_is_family_caregiver_for_community_engagement
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether the person is a family caregiver excluded from community engagement under 42 CFR 435.554(c)(3)(i): the person provides regular, not solely incidental, care to a dependent child or disabled individual (ma_persons_cared_for) and (A) primarily resides with that person (lives_with), (B) is that person's relative, or (C) provides at least ma_community_engagement_nonrelative_care_min_hours (80) hours of such assistance in the month."
precision: "Relatives (B) are read from the case's relationship edges: parent, child, grandparent, grandchild, spouse, caretaker or dependent edges and siblings (persons sharing a parent). The uncles, aunts, first cousins, nephews and nieces 435.554(a) also names have no edge of their own in this volume, so such a caregiver living elsewhere qualifies only by criterion (C) (OQ-396, OQ-413). An adult family member who is listed in lives_with is read as primarily residing there. Same-word audit SW-5, OQ-413 (2) resolved: a relative is by blood, adoption or marriage (S1207): parent, child, stepparent, stepchild, grandparent, grandchild, spouse, sibling, step-sibling, or other_relative (aunt, uncle, cousin, niece, nephew and the rest); a person with primary responsibility who is not a relative no longer counts as one. Half siblings are counted (siblings, CO-2609); 435.554 leaves half-blood relatives to the State, which has published no election (OQ-412)."
derived: [exists, ma_persons_cared_for, [all, [of, [P], ma_community_engagement_is_care_recipient], [any, [in_group, [P], lives_with], [rel, [parent, child, stepparent, stepchild, grandparent, grandchild, spouse, other_relative], [P]], [in_group, [P], siblings], [in_group, [P], step_siblings], [">=", [lookup, ma_care_hours_by_person, [P]], ma_community_engagement_nonrelative_care_min_hours]]]]
sources: [S1207, S1208]
implemented: engine
tags: [ma, magi]
rationale: "OQ-65: the family caregiver exclusion has three alternative criteria the relationship edges alone cannot state."
tests:
  - {id: CO-1963-T1, month: "2027-02", as_of: "2027-03-01", given: {ma_persons_cared_for: [p2], lives_with: [p1, p2]}, title: "(A) lives with a disabled adult she cares for", others: {p2: {date_of_birth: "1960-01-01", has_disability_under_ada: true}}, relationships: [], expect: true}
  - {id: CO-1963-T2, month: "2027-02", as_of: "2027-03-01", given: {ma_persons_cared_for: [p2], lives_with: [p1]}, title: "(B) the disabled person's daughter, living elsewhere", others: {p2: {date_of_birth: "1950-01-01", has_disability_under_ada: true}}, relationships: [[child, p2]], expect: true}
  - {id: CO-1963-T3, month: "2027-02", as_of: "2027-03-01", given: {ma_persons_cared_for: [p2], lives_with: [p1], ma_care_hours_by_person: {p2: 60}}, title: "(C) a neighbour, 60 hours in the month - not excluded", others: {p2: {date_of_birth: "1950-01-01", has_disability_under_ada: true}}, relationships: [], expect: false}
  - {id: CO-1963-T4, month: "2027-02", as_of: "2027-03-01", given: {ma_persons_cared_for: [p2], lives_with: [p1], ma_care_hours_by_person: {p2: 85}}, title: "(C) a neighbour, 85 hours in the month", others: {p2: {date_of_birth: "1950-01-01", has_disability_under_ada: true}}, relationships: [], expect: true}
  - {id: CO-1963-T5, month: "2027-02", as_of: "2027-03-01", given: {ma_persons_cared_for: []}, title: "Cares for no one", relationships: [], expect: false}
