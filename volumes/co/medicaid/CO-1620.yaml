id: CO-1620
name: "Medical Assistance: citizenship verification is pending"
identifier: ma_citizenship_verification_is_pending
kind: derived
type: yes/no
scope: person-month
program: Medicaid
role: outcome
meaning: Whether Medical Assistance (and CHP+, which reads this item) requires verification of the person's citizenship, by an SSA match or satisfactory documentary evidence and it has not been provided.
derived: [all, ma_requires_verification_of_citizenship, [not, [any, citizenship_verified_by_electronic_data_source, [all, citizenship_verification_document_received, ma_citizenship_document_is_acceptable]]]]
sources: [S840, S853, S859]
implemented: engine
tags: [verification, ma]
rationale: "Review U-1: the count items held this test as an anonymous arm, so no outcome told a worker which document was outstanding and for whom; the count now sums this item."
tests:
  - {id: CO-1620-T1, month: "2026-10", as_of: "2026-10-01", given: {ma_requires_verification_of_citizenship: true, citizenship_verified_by_electronic_data_source: false, citizenship_verification_document_received: false}, expect: true}
  - {id: CO-1620-T2, month: "2026-10", as_of: "2026-10-01", given: {ma_requires_verification_of_citizenship: true, citizenship_verified_by_electronic_data_source: true}, expect: false}
