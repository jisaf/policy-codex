id: CO-1399
name: "Medicaid: identity document is acceptable"
identifier: ma_identity_document_is_acceptable
kind: derived
type: yes/no
scope: person
program: Medicaid
meaning: "Whether the identity document provided is acceptable for Medical Assistance: a state driver's license or government identification, school, military, dependent or merchant mariner card, tribal document, corroborating documents, a governmental finding of identity, a facility director's or third party's affidavit, or for a child under 19 a clinic, doctor, hospital or school record or a parent's affidavit."
derived: [any, [in, identity_verification_document_type, [colorado_drivers_license_or_id, other_state_drivers_license_or_id, school_id_card, us_military_card, draft_record, military_dependent_id_card, government_issued_id_card, merchant_mariner_card, tribal_document, corroborating_documents, facility_director_affidavit, agency_identity_finding, third_party_identity_affidavit]], [all, [in, identity_verification_document_type, [child_medical_or_school_record, parent_affidavit_for_child]], ["<", age, ma_magi_child_age_limit]]]
sources: [S848, S857, S858]
implemented: engine
tags: [verification, ma]
open: [OQ-304]
rationale: No existing item reads the identity document type against the Medical Assistance lists.
tests:
  - {id: CO-1399-T1, as_of: "2026-10-01", given: {identity_verification_document_type: colorado_drivers_license_or_id}, expect: true}
  - {id: CO-1399-T2, as_of: "2026-10-01", given: {identity_verification_document_type: child_medical_or_school_record, date_of_birth: "2015-05-01"}, expect: true}
  - {id: CO-1399-T3, as_of: "2026-10-01", given: {identity_verification_document_type: child_medical_or_school_record, date_of_birth: "1990-05-01"}, expect: false}
  - {id: CO-1399-T4, as_of: "2026-10-01", given: {identity_verification_document_type: other_document}, expect: false}
