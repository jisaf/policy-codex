  - {id: CO-549-T2, month: "2026-10", as_of: "2026-10-01", given: {date_of_birth: "2005-01-01", ma_age_at_foster_care_exit: 18, was_enrolled_in_medicaid_at_foster_care_exit: false}, expect: false}
