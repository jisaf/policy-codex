  - {id: CO-549-T7, month: "2026-12", as_of: "2026-12-01", title: "F3-3: the month after the 26th birthday month", given: {date_of_birth: "2000-11-03", ma_age_at_foster_care_exit: 18, was_enrolled_in_medicaid_at_foster_care_exit: true}, expect: false}
