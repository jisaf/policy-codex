  - {id: CO-549-T91, month: "2026-10", as_of: "2026-10-01", given: {date_of_birth: "2006-03-01", ma_age_at_foster_care_exit: 18, was_enrolled_in_medicaid_at_foster_care_exit: true, ma_foster_care_was_in_another_state: true}, title: "HCPF fix round (C-9): youth of 20 from Arizona's foster care, 18 in March 2024", expect: true}
  - {id: CO-549-T92, month: "2026-10", as_of: "2026-10-01", given: {date_of_birth: "2002-03-01", ma_age_at_foster_care_exit: 18, was_enrolled_in_medicaid_at_foster_care_exit: true, ma_foster_care_was_in_another_state: true}, title: "HCPF fix round (C-9): youth of 24 from another state's foster care, 18 in 2020", expect: false}
