id: CO-549
name: "Medicaid: meets the Former Foster Care Children category"
identifier: ma_is_former_foster_care_category
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: Whether the person meets the Former Foster Care Children Medical Assistance category under 42 CFR 435.150(b) and 10 CCR 2505-10 8.100.4.H.2.a - under ma_former_foster_care_age_limit or in the month of that birthday (H.2, "until the end of the month of the individual's 26th birthday"), exited foster care at an age from ma_former_foster_care_exit_min_age (CO-3025) through ma_former_foster_care_exit_age_max, and was enrolled in Medicaid at the point their foster care assistance ended. It does not apply to a youth receiving subsidized adoption payments (8.100.4.H.2.a.i); a youth who was in another state's foster care at 18 and enrolled in that state's Medicaid qualifies if the birthday at that minimum age fell on or after ma_former_foster_care_out_of_state_start_date (H.2.a.iii).
precision: "Coverage runs \"until the end of the month of the individual's 26th birthday\" (H.2): the age is taken on the last day of the month before the month evaluated (ma_age_before_month, CO-4790), so a youth whose 26th birthday falls in the month is in the category for all of it, and one whose birthday fell in an earlier month is not (final verification pass 3, F3-3; the same idiom as ma_is_under_child_age_or_turns_nineteen_this_month, CO-564). Not subject to an income or resource test, per 8.100.4.H.2.b - this item's own test does not read income at all, and no income test is added downstream for a person in this category. The exit-age test now reads ma_age_at_foster_care_exit (CO-095) against the range [18, ma_former_foster_care_exit_age_max], replacing was_foster_youth_at_eighteen's single age-18 test, per 8.100.4.H.2.a's own text ('on their 18th, 19th, 20th or up to their 21st birthday'), which Colorado's extended foster care program makes a real population, not an edge case. H.2.a.ii's exclusion of youth \"enrolled in mandatory Medical Assistance\" is carried by ma_magi_category's order (CO-551), which tests the Children's, Pregnant and Parent/Caretaker groups before former foster care. H.2.c (the youth's newborn is a needy newborn) needs no rule here: the mother is enrolled in Medical Assistance at the birth, so ma_is_needy_newborn (CO-550) already applies."
derived: [all, ["<", ma_age_before_month, ma_former_foster_care_age_limit], was_enrolled_in_medicaid_at_foster_care_exit, [">=", ma_age_at_foster_care_exit, ma_former_foster_care_exit_min_age], ["<=", ma_age_at_foster_care_exit, ma_former_foster_care_exit_age_max], [not, [otherwise, ma_receives_subsidized_adoption_payments, false]], [any, [not, [otherwise, ma_foster_care_was_in_another_state, false]], ["<", [years_between, date_of_birth, [days_after, -1, ma_former_foster_care_out_of_state_start_date]], ma_former_foster_care_exit_min_age]]]
sources: [S1718, S214]
implemented: engine
tags: [ma, magi, age]
rationale: "Final verification pass 3, F3-3 (2026-11-22): the age test was age < 26 on the determination date, with no birthday-month rule. No existing item states the Former Foster Care category test. ma_magi_category (CO-551) needs it, listed after Parents/Caretaker Relatives and before Adults per the phase-3 brief's mandatory-group ordering (matching 435.150(b)(2)'s condition that a person not otherwise be eligible for mandatory coverage under 435.110-435.145, which this volume reaches by listing this category before Adults but after the other mandatory groups in the case expression). Fix round (C-9): replaced was_foster_youth_at_eighteen (which only ever tested exit at exactly 18) with ma_age_at_foster_care_exit (CO-095) compared against the 18-21 band 8.100.4.H.2.a states, plus the new parameter ma_former_foster_care_exit_age_max (CO-225, value 21), per the phase-3 review's finding that the item's own identifier name was the policy error (was_foster_youth_at_eighteen cannot represent an exit at 19 or 20 at all). History moved from the precision note (HCPF review S-14): Fix round (C-9): the exit-age test now reads ma_age_at_foster_care_exit (CO-095) against the range [18, ma_former_foster_care_exit_age_max], replacing was_foster_youth_at_eighteen's single age-18 test, per 8.100.4.H.2.a's own text ('on their 18th, 19th, 20th or up to their 21st birthday'), which Colorado's extended foster care program makes a real population, not an edge case. HCPF fix round (C-9): H.2.a.ii's exclusion of youth \"enrolled in mandatory Medical Assistance\" is carried by ma_magi_category's order (CO-551), which tests the Children's, Pregnant and Parent/Caretaker groups before former foster care. H.2.c (the youth's newborn is a needy newborn) needs no rule here: the mother is enrolled in Medical Assistance at the birth, so ma_is_needy_newborn (CO-550) already applies."
