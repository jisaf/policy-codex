id: CO-7505
name: "Medicaid: persons living with the person in the month, for the SSI method"
identifier: ma_ssi_lives_with_in_month
kind: derived
type: group of persons
scope: person-month
program: Medicaid
meaning: "The persons of the case who live in the same household as this person in the month, for the SSI method's couple, deeming and allocations (10 CCR 2505-10 § 8.100.5.H.1.a \"spouses living together\", H.2.a \"living in the same household with a parent\", H.3.a.i \"each ineligible child in the home\"; 20 CFR 416.1163, 416.1165): those who live in this person's home (lives_with, CO-1925), and a spouse, parent, stepparent, child or stepchild who lives elsewhere on the determination date through the month the two ceased to live together (§ 8.100.7.C.2.b; § 8.100.7.A.1; 20 CFR 416.1165(g)(4), 416.1167(a)(1)); a person who died is a member through the month of death and not after (20 CFR 416.1163(f)(4), 416.1165(g)(3))."
precision: "Pattern sweep, non-MAGI Medicaid (docs/reviews/pattern-sweep-nonmagi.md, P1 and P3). The date the two ceased to live together is, where one of them lives in a facility (residence_setting_type other than private_dwelling), that one's institution_entry_date; otherwise, for spouses (or persons held out as spouses), ceased_living_with_spouse_date (CO-7352), and for a parent or child, ceased_living_with_parent_or_child_date (CO-7506), stated on either of the two. For spouses the order is the one ma_ssi_couple_members (CO-3626) used since coverage pass 6 F6-1. With the two apart and no date it cannot be determined (decision 4). Living together is read from lives_with as stated, required where read (decision 4; convention rule 17): no text on file says the persons of one application live together unless it says otherwise; 20 CFR 416.1163(a) and 416.1165 deem only from a spouse or parent who lives in the same household. A person who died states date_of_death (CO-2868, which is not stated for a living person). For a parent or a child, a stay in a medical institution the person returns from keeps the home's dwelling_id and the person a member (a temporary absence, 20 CFR 416.1167(a), S5120; duplicate-paths D-M4), and one who lives in the facility is a member through the month of entry and not after (§ 8.100.7.A.1, S3406). For a couple, ma_ssi_couple_members (CO-3626) applies the spouses' institution rules (ma_excluded_from_ssi_household, CO-661; ma_is_institutionalized_spouse_in_institution, CO-5200) beside this group."
derived: [filter, [persons], [all, [any, [in_group, [P], lives_with], [all, [rel, [spouse, holds_out_as_spouse_with, parent, stepparent, child, stepchild], [P]], ["<=", [month], [month_of, [case, [[rel, [spouse, holds_out_as_spouse_with], [P]], [otherwise, ceased_living_with_spouse_date, [otherwise, [of, [P], ceased_living_with_spouse_date], [case, [[not, ["=", residence_setting_type, private_dwelling]], institution_entry_date], [[not, ["=", [of, [P], residence_setting_type], private_dwelling]], [of, [P], institution_entry_date]]]]]], [[not, ["=", residence_setting_type, private_dwelling]], institution_entry_date], [[not, ["=", [of, [P], residence_setting_type], private_dwelling]], [of, [P], institution_entry_date]], [else, [otherwise, ceased_living_with_parent_or_child_date, [of, [P], ceased_living_with_parent_or_child_date]]]]]]]], [any, [unknown, [of, [P], date_of_death]], ["<=", [month], [month_of, [of, [P], date_of_death]]]]]]
sources: [S1746, S1506, S1759, S3406, S5120, S5121, S5122]
implemented: engine
tags: [ma, non_magi, household]
rationale: "Pattern sweep P1 and P3: the SSI couple (CO-3626) dated a couple's separation, but the deeming parents (CO-4624), the deeming children (CO-4625) and the ineligible child allocations (CO-2277, CO-4633) read lives_with, the homes of the determination date, in every month, with a fallback that read a case with no homes stated as one home; none dropped a spouse or parent who died. One group serves all of them, so each reads the same household for the month."
nearest: [CO-1925, CO-3626]
tests:
  # Spouses in one home: both.
  - {id: CO-7505-T1, month: "2026-11", as_of: "2026-11-20", title: "Spouses in one home", given: {dwelling_id: h1, residence_setting_type: private_dwelling}, others: {p2: {dwelling_id: h1, residence_setting_type: private_dwelling}}, relationships: [[spouse, p2]], expect: [p1, p2]}
  # Separated 2026-06-15 (8.100.7.C.2.b, S1759: alone "Beginning the first month following the month the couple ceases to live together"): June both; July p1 alone.
  - {id: CO-7505-T2, month: "2026-06", as_of: "2026-11-20", title: "Spouses apart since 2026-06-15: together through June", given: {dwelling_id: h2, residence_setting_type: private_dwelling, ceased_living_with_spouse_date: "2026-06-15"}, others: {p2: {dwelling_id: h1, residence_setting_type: private_dwelling}}, relationships: [[spouse, p2]], expect: [p1, p2]}
  - {id: CO-7505-T3, month: "2026-07", as_of: "2026-11-20", title: "Spouses apart since 2026-06-15: alone from July", given: {dwelling_id: h2, residence_setting_type: private_dwelling, ceased_living_with_spouse_date: "2026-06-15"}, others: {p2: {dwelling_id: h1, residence_setting_type: private_dwelling}}, relationships: [[spouse, p2]], expect: [p1]}
  # A child (p1) in a hospital since 2026-09-10, the parent (p2) at home (8.100.7.A.1, S3406; 416.1165(g)(4), S5122): September both; October the child alone.
  - {id: CO-7505-T4, month: "2026-09", as_of: "2026-11-20", title: "A child in a hospital since September: with the parent through September", given: {dwelling_id: hosp1, residence_setting_type: hospital, institution_entry_date: "2026-09-10"}, others: {p2: {dwelling_id: h1, residence_setting_type: private_dwelling}}, relationships: [[child, p2]], expect: [p1, p2]}
  - {id: CO-7505-T5, month: "2026-10", as_of: "2026-11-20", title: "A child in a hospital since September: alone from October", given: {dwelling_id: hosp1, residence_setting_type: hospital, institution_entry_date: "2026-09-10"}, others: {p2: {dwelling_id: h1, residence_setting_type: private_dwelling}}, relationships: [[child, p2]], expect: [p1]}
  # A parent (p2) who died 2026-09-05, still a person of the case (416.1165(g)(3), S5122: not deemed "beginning with the month following the month of death"): September both; October p1 alone.
  - {id: CO-7505-T6, month: "2026-09", as_of: "2026-11-20", title: "A parent who died in September: a member through September", given: {dwelling_id: h1, residence_setting_type: private_dwelling}, others: {p2: {dwelling_id: h1, residence_setting_type: private_dwelling, date_of_death: "2026-09-05"}}, relationships: [[child, p2]], expect: [p1, p2]}
  - {id: CO-7505-T7, month: "2026-10", as_of: "2026-11-20", title: "A parent who died in September: not a member from October", given: {dwelling_id: h1, residence_setting_type: private_dwelling}, others: {p2: {dwelling_id: h1, residence_setting_type: private_dwelling, date_of_death: "2026-09-05"}}, relationships: [[child, p2]], expect: [p1]}
  # A parent and child in two private homes: the date is needed (decision 4); stated 2026-08-20: August both, September p1 alone.
  - {id: CO-7505-T8, month: "2026-08", as_of: "2026-11-20", title: "Parent and child in two homes with no date stated: cannot determine (decision 4)", given: {dwelling_id: h1, residence_setting_type: private_dwelling}, others: {p2: {dwelling_id: h2, residence_setting_type: private_dwelling}}, relationships: [[child, p2]], expect: unknown}
  - {id: CO-7505-T9, month: "2026-08", as_of: "2026-11-20", title: "The parent moved out 2026-08-20: together through August", given: {dwelling_id: h1, residence_setting_type: private_dwelling, ceased_living_with_parent_or_child_date: "2026-08-20"}, others: {p2: {dwelling_id: h2, residence_setting_type: private_dwelling}}, relationships: [[child, p2]], expect: [p1, p2]}
  - {id: CO-7505-T10, month: "2026-09", as_of: "2026-11-20", title: "The parent moved out 2026-08-20: apart from September", given: {dwelling_id: h1, residence_setting_type: private_dwelling, ceased_living_with_parent_or_child_date: "2026-08-20"}, others: {p2: {dwelling_id: h2, residence_setting_type: private_dwelling}}, relationships: [[child, p2]], expect: [p1]}
  # An unrelated person in another home is not a member; no date is asked.
  - {id: CO-7505-T11, month: "2026-11", as_of: "2026-11-20", title: "An unrelated person in another home", given: {dwelling_id: h1, residence_setting_type: private_dwelling}, others: {p2: {dwelling_id: h2, residence_setting_type: private_dwelling}}, relationships: [], expect: [p1]}
  # No home stated: cannot determine (decision 4; convention rule 17).
  - {id: CO-7505-T12, month: "2026-11", as_of: "2026-11-20", title: "No home stated for the person: cannot determine (decision 4)", given: {residence_setting_type: private_dwelling}, others: {p2: {dwelling_id: h1, residence_setting_type: private_dwelling}}, relationships: [[spouse, p2]], expect: unknown}
