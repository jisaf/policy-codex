  - {id: CO-4622-T2, as_of: "2026-11-01", title: "nursing facility, intent to return documented in writing: exempt (v)", given: {home_equity: 240000, residence_setting_type: nursing_facility, resides_in_medical_institution: true, ma_spouse_or_dependent_relative_lives_in_home: false, intends_to_return_home: true, intent_to_return_home_is_documented_in_writing: true}, expect: false}
  - {id: CO-4622-T3, as_of: "2026-11-01", title: "intends to return but nothing in writing: counted", given: {home_equity: 240000, residence_setting_type: nursing_facility, resides_in_medical_institution: true, ma_spouse_or_dependent_relative_lives_in_home: false, intends_to_return_home: true}, expect: true}
  - {id: CO-4622-T4, as_of: "2026-11-01", title: "spouse still lives in the home: exempt (ix)", given: {home_equity: 240000, residence_setting_type: nursing_facility, resides_in_medical_institution: true, ma_spouse_or_dependent_relative_lives_in_home: true}, expect: false}
  - {id: CO-4622-T5, as_of: "2026-11-01", title: "lives at home: exempt", given: {home_equity: 240000, residence_setting_type: private_dwelling, ma_spouse_or_dependent_relative_lives_in_home: false}, expect: false}
  - {id: CO-4622-T6, as_of: "2026-11-01", title: "76, lives at home with a recorded beneficiary deed: counted (xiv)", given: {date_of_birth: "1950-03-01", home_equity: 240000, residence_setting_type: private_dwelling, ma_spouse_or_dependent_relative_lives_in_home: false, home_has_recorded_beneficiary_deed: true}, expect: true}
