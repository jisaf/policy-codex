id: CO-4622
name: "Medicaid: the home is a countable resource"
identifier: ma_home_is_countable_resource
kind: derived
type: yes/no
scope: person
program: Medicaid
meaning: "Whether the person's home (home_equity) is a countable resource for the aged, blind and disabled groups (10 CCR 2505-10 § 8.100.5.M.2.a, M.3.e): when a beneficiary deed on it has been executed and recorded (xiv); for a person in a long-term care institution, receiving HCBS or enrolled in PACE, when it has been transferred to a trust or other entity (xiii); or when the person no longer lives in it and neither a spouse nor a dependent relative lives there (ix), unless the person intends to return and, for a person living in an institution or facility, the intent is documented in writing (iv, v, vii, viii, xii). A home outside Colorado that the person intends to return to is not counted here: the person fails residency instead (iii)."
precision: "Whether the person lives in the home is lives_in_owned_home (CO-4610), read from residence_setting_type when not stated; an institution, assisted living residence or other facility is read as living away (v, xii). A spouse or dependent relative in the home is ma_spouse_or_dependent_relative_lives_in_home (CO-4880): a person the person or the spouse claims as a tax dependent (§ 8.100.1's definition, S3616), or a spouse or a child under 21 or blind or disabled (CO-889, the 42 U.S.C. 1396p(f)(2) relatives, which alone govern the equity-limit exception of CO-650). A home the person has left for a private dwelling elsewhere, with intent to return, stays exempt without a written statement: § 8.100.5.M.2.a.v asks for the writing only of an institutionalized person, and the SSI rule (20 CFR 416.1212(c)), which 42 CFR 435.601(b) does not let the state make stricter, asks none (coverage pass 2, N2-6). The equity limit of M.2.a.ii and vi is ma_home_equity_disqualifies (CO-650), read for long-term care only (OQ-820); this item does not test it. Long-term care for xiii is a medical institution, an HCBS waiver designation or PACE enrollment. The month after the home stops being the principal residence (x) is not separated: the determination date's facts decide. The arms other than the beneficiary deed are ma_home_is_countable_resource_without_beneficiary_deed (CO-5204). A beneficiary deed (xiv) counts the home only when it \"is subject to estate recovery\" (ma_home_is_subject_to_estate_recovery, CO-5203: 55 or older, or in a medical institution, 42 U.S.C. 1396p(b)(1)); the Medicare Savings Program tests leave such a home out (ma_msp_countable_resources, CO-5206; OQ-900)."
derived: [any, ma_home_is_countable_resource_without_beneficiary_deed, [all, [">", [otherwise, home_equity, 0], 0], [otherwise, home_has_recorded_beneficiary_deed, false], ma_home_is_subject_to_estate_recovery]]
sources: [S3403, S3616, S3751]
open: [OQ-820, OQ-900]
implemented: engine
tags: [ma, non_magi, resources, ltc]
rationale: "Coverage review NM-5: the volume read the home only against the equity limit (CO-650), so a home the person had left for good, or held in a trust, or under a recorded beneficiary deed, was never a countable resource. Stored CO-139 had a $240,000 home with no stated intent to return. Coverage pass 2, N2-4: the spouse-or-dependent-relative arm read CO-889 alone, which leaves out a dependent parent, sibling or adult child; it now reads CO-4880 (stored CO-214). Coverage pass 3 C3-5: the precision had read every home as subject to estate recovery, which drops the condition xiv states; a beneficiary deed now counts the home only for a person from whose estate 1396p(b)(1) allows recovery, and the other arms moved to CO-5204 unchanged."
tests:
