id: CO-4622
name: "Medicaid: the home is a countable resource"
identifier: ma_home_is_countable_resource
kind: derived
type: yes/no
scope: person
program: Medicaid
meaning: "Whether the person's home (home_equity) is a countable resource for the aged, blind and disabled groups (10 CCR 2505-10 § 8.100.5.M.2.a, M.3.e): when a beneficiary deed on it has been executed and recorded (xiv); for a person in a long-term care institution, receiving HCBS or enrolled in PACE, when it has been transferred to a trust or other entity (xiii); or when the person no longer lives in it and neither a spouse nor a dependent relative lives there (ix), unless the person intends to return and, for a person living in an institution or facility, the intent is documented in writing (iv, v, vii, viii, xii). A home outside Colorado that the person intends to return to is not counted here: the person fails residency instead (iii)."
precision: "Whether the person lives in the home is lives_in_owned_home (CO-4610), read from residence_setting_type when not stated; an institution, assisted living residence or other facility is read as living away (v, xii). A spouse or dependent relative in the home is ma_spouse_or_qualifying_child_lives_in_home (CO-889: a spouse, or a child under 21 or blind or disabled), the relatives 42 U.S.C. 1396p(f)(2) names. The equity limit of M.2.a.ii and vi is ma_home_equity_disqualifies (CO-650), read for long-term care only (OQ-820); this item does not test it. Long-term care for xiii is a medical institution, an HCBS waiver designation or PACE enrollment. The month after the home stops being the principal residence (x) is not separated: the determination date's facts decide. Every home is read as subject to estate recovery (xiv)."
derived: [all, [">", [otherwise, home_equity, 0], 0], [any, [otherwise, home_has_recorded_beneficiary_deed, false], [all, [otherwise, home_is_held_in_trust_or_entity, false], [any, [otherwise, resides_in_medical_institution, false], [not, ["=", [otherwise, meets_hcbs_waiver_target_group, none], none]], [otherwise, is_enrolled_in_pace, false]]], [all, [not, [otherwise, lives_in_owned_home, ["=", residence_setting_type, private_dwelling]]], [not, ma_spouse_or_qualifying_child_lives_in_home], [not, [all, [otherwise, intends_to_return_home, false], [any, [otherwise, intent_to_return_home_is_documented_in_writing, false], [otherwise, home_is_outside_colorado, false], ["=", residence_setting_type, private_dwelling]]]]]]]
sources: [S3403]
open: [OQ-820]
implemented: engine
tags: [ma, non_magi, resources, ltc]
rationale: "Coverage review NM-5: the volume read the home only against the equity limit (CO-650), so a home the person had left for good, or held in a trust, or under a recorded beneficiary deed, was never a countable resource. Stored CO-139 had a $240,000 home with no stated intent to return."
tests:
  - {id: CO-4622-T1, as_of: "2026-11-01", title: "nursing facility, no intent to return, no one at home: counted", given: {home_equity: 240000, residence_setting_type: nursing_facility, resides_in_medical_institution: true, ma_spouse_or_qualifying_child_lives_in_home: false}, expect: true}
  - {id: CO-4622-T2, as_of: "2026-11-01", title: "nursing facility, intent to return documented in writing: exempt (v)", given: {home_equity: 240000, residence_setting_type: nursing_facility, resides_in_medical_institution: true, ma_spouse_or_qualifying_child_lives_in_home: false, intends_to_return_home: true, intent_to_return_home_is_documented_in_writing: true}, expect: false}
  - {id: CO-4622-T3, as_of: "2026-11-01", title: "intends to return but nothing in writing: counted", given: {home_equity: 240000, residence_setting_type: nursing_facility, resides_in_medical_institution: true, ma_spouse_or_qualifying_child_lives_in_home: false, intends_to_return_home: true}, expect: true}
  - {id: CO-4622-T4, as_of: "2026-11-01", title: "spouse still lives in the home: exempt (ix)", given: {home_equity: 240000, residence_setting_type: nursing_facility, resides_in_medical_institution: true, ma_spouse_or_qualifying_child_lives_in_home: true}, expect: false}
  - {id: CO-4622-T5, as_of: "2026-11-01", title: "lives at home: exempt", given: {home_equity: 240000, residence_setting_type: private_dwelling, ma_spouse_or_qualifying_child_lives_in_home: false}, expect: false}
  - {id: CO-4622-T6, as_of: "2026-11-01", title: "lives at home with a recorded beneficiary deed: counted (xiv)", given: {home_equity: 240000, residence_setting_type: private_dwelling, ma_spouse_or_qualifying_child_lives_in_home: false, home_has_recorded_beneficiary_deed: true}, expect: true}
  - {id: CO-4622-T7, as_of: "2026-11-01", title: "HCBS designee whose home is in a trust: counted (xiii)", given: {home_equity: 240000, residence_setting_type: private_dwelling, resides_in_medical_institution: false, meets_hcbs_waiver_target_group: ebd, ma_spouse_or_qualifying_child_lives_in_home: false, home_is_held_in_trust_or_entity: true}, expect: true}
  - {id: CO-4622-T8, as_of: "2026-11-01", title: "no home", given: {residence_setting_type: nursing_facility, ma_spouse_or_qualifying_child_lives_in_home: false}, expect: false}
