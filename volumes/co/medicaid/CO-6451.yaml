id: CO-6451
name: "Medicaid: has self-employment, seasonal or commission earnings, for annualized income"
identifier: ma_has_annualizable_earnings
kind: derived
type: yes/no
scope: person
program: Medicaid
meaning: "Whether the person has earned income from self-employment, seasonal employment or commission-based employment, the earnings 10 CCR 2505-10 8.100.4.C.4.a annualizes: yes where the person's earnings records state a business or a farm (a record the MAGI earnings table counts net for tax: self_employment_receipts, farm_self_employment_receipts); no where the person's earnings list is stated and empty; otherwise the person's statement (has_self_employment_seasonal_or_commission_earnings, CO-4557), which is the only statement of seasonal or commission employment."
precision: "Coverage pass 4, C4-05 (2026-11-23): the self-employment half is read from the records, so a person whose records state a business is self-employed although the supplied fact is not stated or says otherwise (the records are the one statement of a business; design decision D1). A record of any month counts: C.4.a turns on the household having such income, which is what annualizing a year means. Where the person has pay that is not a business and the supplied fact is not stated, it is unknown (decision 4), and C.4.a cannot be applied; the monthly figure still decides every test it passes (ma_magi_monthly_household_income_pct_fpl, CO-6452). Before, ma_annualized_household_income (CO-4559) read the supplied fact alone, as false where not stated."
derived: [case, [[">", [sum_receipts, earnings, ["=", [lookup, ma_magi_earnings_treatment_table, [receipt, kind]], counted_net_for_tax], 1], 0], true], [["=", [sum_receipts, earnings, true, 1], 0], false], [else, has_self_employment_seasonal_or_commission_earnings]]
sources: [S3356, S166]
implemented: engine
tags: [ma, magi, income]
open: [OQ-810]
rationale: "Coverage pass 4, C4-05: C.4.a's self-employment test was a supplied fact read as false where not stated, while the person's earnings records already say whether there is a business; the two could disagree, and a self-employed applicant over the monthly standard was not annualized."
tests:
  - {id: CO-6451-T1, as_of: "2026-11-10", given: {earnings: [{kind: self_employment_receipts, amount: 4000, net_for_tax: 3000, month: "2026-11"}]}, title: "Coverage pass 4, C4-05 (B-SE-noflag): a business record, the supplied fact not stated: self-employed", expect: true}
  - {id: CO-6451-T2, as_of: "2026-11-10", given: {earnings: [{kind: farm_self_employment_receipts, amount: 900, net_for_tax: 200}], has_self_employment_seasonal_or_commission_earnings: false}, title: "A farm record wins over a statement of no such earnings", expect: true}
  - {id: CO-6451-T3, as_of: "2026-11-10", given: {earnings: []}, title: "No earnings at all: no such earnings", expect: false}
  - {id: CO-6451-T4, as_of: "2026-11-10", given: {earnings: [{kind: wages, amount: 2000}], has_self_employment_seasonal_or_commission_earnings: true}, title: "Wages stated as commission-based: yes", expect: true}
  - {id: CO-6451-T5, as_of: "2026-11-10", given: {earnings: [{kind: wages, amount: 2000}]}, title: "Wages, the supplied fact not stated: cannot determine (decision 4)", expect: unknown}
  - {id: CO-6451-T6, as_of: "2026-11-10", given: {earnings: [{kind: wages, amount: 2000}], has_self_employment_seasonal_or_commission_earnings: false}, title: "Steady wages, stated as not seasonal or commission: no", expect: false}
