id: CO-6451
name: "Medicaid: has self-employment, seasonal or commission earnings, for annualized income"
identifier: ma_has_annualizable_earnings
kind: derived
type: yes/no
scope: person
program: Medicaid
meaning: "Whether the person has earned income from self-employment, seasonal employment or commission-based employment, the earnings 10 CCR 2505-10 8.100.4.C.4.a annualizes, as the person's earnings records state it: a business or a farm (a record the MAGI earnings table counts net for tax: self_employment_receipts, farm_self_employment_receipts), or pay stated as seasonal or commission-based (the record's seasonal_or_commission, CO-5100)."
precision: "Coverage pass 4, C4-05 (2026-11-23): before, a supplied fact (has_self_employment_seasonal_or_commission_earnings, CO-4557) said it, read as false where not stated, a default no rule gave, so a person whose own records stated a business was not annualized unless the fact was also stated, and the two statements could disagree. The records are now the one statement: a business record is self-employment, and seasonal or commission pay is a property of the pay (seasonal_or_commission; a person with a steady job and a seasonal one states the seasonal pay as its own record). A record of any month counts: C.4.a turns on the household having such income, which annualizing the year presumes. Earnings not stated: unknown (decision 4). Annualizing still needs the member's expected annual income, which has no default (ma_annualized_household_income, CO-4559). Coverage pass 5, C5-08 (2026-11-23): seasonal_or_commission is required where read (it had default false, which withheld C.4.a from seasonal and commission pay that was not marked, a default no rule gives; design decision D3 gives a field a default only where the rule does). It is read on the records MAGI counts as pay (the earnings table's counted, counted_no_rule_excludes and counted_unless_employer_convenience rows), not on a business's receipts (self-employment already), its costs, boarder payments or excluded pay; and only where the annualized figure is read, which is where the month's figure fails a standard (CO-4975, CO-6452), so a household eligible on the month is determined without it. A pay record that does not state it there cannot be determined (SEASONAL-UNSTATED: wages 3,000, 225.6% on the month; with the flag stated true and an expected year of 16,000, 16,000 / 12 / 1,330 = 100.3%, eligible). A business record decides the answer by itself (the first test), so a person with a business is annualized whether or not a pay record states the field."
derived: [any, [">", [sum_receipts, earnings, ["=", [lookup, ma_magi_earnings_treatment_table, [receipt, kind]], counted_net_for_tax], 1], 0], [">", [sum_receipts, earnings, [all, [in, [lookup, ma_magi_earnings_treatment_table, [receipt, kind]], [counted, counted_no_rule_excludes, counted_unless_employer_convenience]], [receipt, seasonal_or_commission]], 1], 0]]
sources: [S3356, S166]
implemented: engine
tags: [ma, magi, income]
open: [OQ-810]
rationale: "Coverage pass 4, C4-05: C.4.a's self-employment test was a supplied fact read as false where not stated, while the person's earnings records already say whether there is a business; the records are the one statement, and seasonal or commission pay a field of the pay."

tests:
  - {id: CO-6451-T1, as_of: "2026-11-10", given: {earnings: [{kind: self_employment_receipts, amount: 4000, net_for_tax: 3000, month: "2026-11"}]}, title: "Coverage pass 4, C4-05 (B-SE-noflag): a business record: self-employed, with no other statement", expect: true}
  - {id: CO-6451-T2, as_of: "2026-11-10", given: {earnings: [{kind: wages, amount: 1500}, {kind: farm_self_employment_receipts, amount: 900, net_for_tax: 200}]}, title: "Wages and a farm: yes (the farm decides it; the wages need not state seasonal_or_commission)", expect: true}
  - {id: CO-6451-T3, as_of: "2026-11-10", given: {earnings: []}, title: "No earnings at all: no", expect: false}
  - {id: CO-6451-T4, as_of: "2026-11-10", given: {earnings: [{kind: wages, amount: 2000, seasonal_or_commission: true}]}, title: "Commission-based wages: yes", expect: true}
  - {id: CO-6451-T5, as_of: "2026-11-10", given: {earnings: [{kind: wages, amount: 2000}]}, title: "C5-08 (SEASONAL-UNSTATED): wages that do not say whether they are seasonal or commission-based: cannot determine (was false, a default no rule gives)", expect: unknown}
  - {id: CO-6451-T6, as_of: "2026-11-10", given: {}, title: "Earnings not stated: cannot determine (decision 4)", expect: unknown}
  - {"id": "CO-6451-T7", "as_of": "2026-11-10", "title": "C5-08: wages stated as neither seasonal nor commission-based: no", "given": {"earnings": [{"kind": "wages", "amount": 2000, "seasonal_or_commission": false}]}, "expect": false}
  - {"id": "CO-6451-T8", "as_of": "2026-11-10", "title": "C5-08 (SEASONAL-STATED): seasonal wages of 3,000 in November: yes", "given": {"earnings": [{"kind": "wages", "amount": 3000, "month": "2026-11", "seasonal_or_commission": true}]}, "expect": true}
  - {"id": "CO-6451-T9", "as_of": "2026-11-10", "title": "C5-08: a boarder's payments and their costs are not pay of a job: the field is not read there, no", "given": {"earnings": [{"kind": "boarder_payments", "amount": 900, "boarders": 1, "provides": "room_and_board"}, {"kind": "business_cost_boarder_provision", "amount": 200}]}, "expect": false}
