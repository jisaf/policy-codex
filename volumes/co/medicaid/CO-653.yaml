id: CO-653
name: "Medicaid: is HCBS waiver eligible"
identifier: ma_hcbs_waiver_eligible
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether this person is eligible for a Home and Community-Based Services waiver for the month - a Colorado resident who is aged, blind or disabled, meets the citizenship and immigration status requirement (or, as a child, pregnant or postpartum person, Cover All Coloradans), is designated for a waiver's target group within its age criteria, meets the level of care that waiver requires, and is eligible through the special income group, SSI eligibility, or the Working Adults with Disabilities Buy-In (for the EBD, CMHS, BI, CIH, SLS and DD waivers) - per 10 CCR 2505-10 §§ 8.100.3.F.1.g, 8.100.3.G.1, 8.100.7.B.1, 8.7100.C and 8.7100.D."
precision: "Phase 7 - the designated waiver's age criteria (ma_hcbs_waiver_age_criteria_met, CO-1164, § 8.7101) are tested, and the Buy-In waiver list names the Complementary and Integrative Health waiver (CIH), the current name of the former Spinal Cord Injury waiver, as § 8.7101.H and its eligibility-group list state. § 8.100.7.B.1.c's Buy-In route is not gated on ma_ltc_financially_eligible (which requires the special income group and the LTC resource standard) because § 8.100.6.P.1.c states Buy-In resources are not counted and its income test is 450% FPL, not 300% of the SSI benefit rate; it is limited instead to the waivers § 8.100.7.B.1.c.i names. Phase 7 fix round: residency, aged/blind/disabled (§ 8.100.3.F.1.g) and status are tested (B-3), status through ma_meets_status_for_cover_all_coloradans_categories (CO-1174) because § 8.100.3.G.1.g.ix.1.b reaches the Long-Term Care waivers except PACE; and the level of care is the designated waiver's (ma_meets_designated_waiver_level_of_care, CO-1178: ICF/IID for CES, SLS, DD and CHRP's developmental disability route, nursing facility or hospital for CwCHN and CIH), not nursing facility level of care for every waiver (S-4, D-75 § 8.7101). The SSI-related route is open to every waiver although § 8.7101.C.3 lists CHRP's served groups as foster care children and 42 CFR 435.217 only (N-4); CHRP's population is children, for whom the special income group route gives the same result."
derived: [all, is_colorado_resident, ma_is_aged_blind_or_disabled, ma_meets_status_for_cover_all_coloradans_categories, [not, [=, meets_hcbs_waiver_target_group, "none"]], ma_hcbs_waiver_age_criteria_met, ma_meets_designated_waiver_level_of_care, [any, ma_ltc_financially_eligible, ma_is_ssi_related_eligible, [all, ma_wawd_eligible, [in, meets_hcbs_waiver_target_group, [ebd, cmhs, bi, cih, sls, dd]]]]]
sources: [S353, S375, S628, S660, S661, S607, S662, S663, S664]
open: [OQ-127, OQ-210, OQ-214]
implemented: engine
tags: [ma, ltc, hcbs]
rationale: "No existing item combines the target group, level of care and financial tests for HCBS waiver eligibility. ma_ltc_eligibility_status (CO-652) needs it. Widened per the phase-4 review's C-4 finding: § 8.100.7.B.1 gives two routes into HCBS besides the special income group - SSI/OAP eligibility (1.a) and the Working Adults with Disabilities Buy-In for named waivers (1.c) - that the special-income/resource-only gate excluded."
