rationale: "No existing item combines the target group, level of care and financial tests for HCBS waiver eligibility. ma_ltc_eligibility_status (CO-652) needs it. Widened per the phase-4 review's C-4 finding: § 8.100.7.B.1 gives two routes into HCBS besides the special income group - SSI/OAP eligibility (1.a) and the Working Adults with Disabilities Buy-In for named waivers (1.c) - that the special-income/resource-only gate excluded. History moved from the precision note (HCPF review S-14): Phase 7 fix round: residency, aged/blind/disabled (§ 8.100.3.F.1.g) and status are tested (B-3), status through ma_meets_status_for_cover_all_coloradans_categories (CO-1174) because § 8.100.3.G.1.g.ix.1.b reaches the Long-Term Care waivers except PACE; and the level of care is the designated waiver's (ma_meets_designated_waiver_level_of_care, CO-1178: ICF/IID for CES, SLS, DD and CHRP's developmental disability route, nursing facility or hospital for CwCHN and CIH), not nursing facility level of care for every waiver (S-4, D-75 § 8.7101). The SSI-related route is open to every waiver although § 8.7101.C.3 lists CHRP's served groups as foster care children and 42 CFR 435.217 only (N-4); CHRP's population is children, for whom the special income group route gives the same result. Needs-fact sweep: the designated waiver's diagnoses, settings and BI's injury before 65 are tested (ma_meets_hcbs_waiver_condition_criteria, CO-2270; OQ-210, resolved). A person in a Medicaid Buy-In program has no spousal impoverishment computation (ma_ltc_couple, CO-643; OQ-127, resolved). HCPF review note C-14: eligible means eligible, not enrolled; HCBS waivers have enrollment limits and waiting lists (§ 8.7100, D-75), and whether a slot is open is not a test here. Precision history (moved from precision, engineering follow-up pass task 5): Phase 7."
