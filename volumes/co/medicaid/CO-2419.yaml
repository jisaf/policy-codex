id: CO-2419
name: "Medicaid: needy persons under 21 category"
identifier: ma_needy_young_person_category
kind: derived
type: one of
options: [psych_under_21, alternatives_to_foster_care, foster_care_or_adoption, none]
scope: person-month
program: Medicaid
role: outcome
meaning: "The needy-persons-under-21 group of 10 CCR 2505-10 § 8.100.4.H.1 the person is covered under this month, or none: Psych <21 (a: in a long-term care institution or a psychiatric facility, household income below the MAGI needs standard, under ma_needy_person_age_limit, or under ma_psych_inpatient_extended_age_limit if still inpatient at the first); Alternatives to Foster Care (d: income below the same standard); or foster care and adoption (b, c, e, f, g: no income test in the text; under ma_needy_person_age_limit, and for g not receiving subsidized adoption payments from ma_foster_care_age_at_responsibility, CO-3028). The person must be a Colorado resident and meet the citizenship and immigration status requirement - for Psych <21, the requirement of a Cover All Coloradans category (§ 8.100.3.G.1.g.ix.1.a lists Psych <21)."
precision: "\"The MAGI needs standard for his/her family size\" (a, d) is not defined in § 8.100; it is read as the highest MAGI income standard among the groups whose demographic criteria the person meets (ma_magi_highest_income_standard_pct, CO-539), compared with the MAGI household income, strictly below as the text says \"less than\" (OQ-512). The Department of Human Services' assumption of responsibility, and for g the foster care maintenance or subsidized adoption payments before 18, are part of the supplied basis. Coverage review 2, N-02 sweep: the under-21 and under-22 limits read ma_age_before_month (CO-4790), so a person in the month of the 21st (or, in inpatient treatment, the 22nd) birthday stays in the group for that month (§ 8.100.4.G.1); the test of 18 at the time of responsibility is a lower limit and reads age on the determination date."
derived: [case, [["=", [otherwise, ma_needy_young_person_basis, none], none], none], [[not, ma_meets_residency], none], [[all, ["=", ma_needy_young_person_basis, psych_or_long_term_care_institution], [any, ["<", ma_age_before_month, ma_needy_person_age_limit], [all, ["<", ma_age_before_month, ma_psych_inpatient_extended_age_limit], [otherwise, ma_is_in_inpatient_treatment_at_twenty_one, false]]], ma_meets_status_for_cover_all_coloradans_categories, ["<", ma_magi_household_income_pct_fpl, ma_magi_highest_income_standard_pct]], psych_under_21], [[all, ["=", ma_needy_young_person_basis, alternatives_to_foster_care], ["<", ma_age_before_month, ma_needy_person_age_limit], ma_meets_citizenship_requirement, ["<", ma_magi_household_income_pct_fpl, ma_magi_highest_income_standard_pct]], alternatives_to_foster_care], [[all, [in, ma_needy_young_person_basis, [foster_care, independent_living_after_foster_care, county_custody_foster_home, subsidized_adoption, human_services_responsibility_at_eighteen]], ["<", ma_age_before_month, ma_needy_person_age_limit], [not, [all, ["=", ma_needy_young_person_basis, human_services_responsibility_at_eighteen], [">=", age, ma_foster_care_age_at_responsibility], [otherwise, ma_receives_subsidized_adoption_payments, false]]], ma_meets_citizenship_requirement], foster_care_or_adoption], [else, none]]
sources: [S1717, S607, S655]
implemented: engine
tags: [ma, age, household]
open: [OQ-512]
rationale: "C-3 of the HCPF review: the 42 CFR 435.145 mandatory group and Colorado's needy-persons groups had no item; the only foster care item was former foster care (CO-549). Not a MAGI category in ma_magi_category (CO-551): § 8.100.4.H is a separate section of needy persons, so it is its own outcome, read by ma_has_full_coverage_category (CO-1176)."
