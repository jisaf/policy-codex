  - {id: CO-2419-T4, month: "2026-10", as_of: "2026-10-01", given: {is_colorado_resident: true, ma_needy_young_person_basis: psych_or_long_term_care_institution, date_of_birth: "2006-01-15", ma_meets_status_for_cover_all_coloradans_categories: true, ma_magi_household_income_pct_fpl: 0.5, ma_magi_highest_income_standard_pct: 1.33}, title: "Psychiatric inpatient of 20 below the income standard", expect: psych_under_21}
  - {id: CO-2419-T5, month: "2026-10", as_of: "2026-10-01", given: {is_colorado_resident: true, ma_needy_young_person_basis: psych_or_long_term_care_institution, date_of_birth: "2005-03-15", ma_is_in_inpatient_treatment_at_twenty_one: true, ma_meets_status_for_cover_all_coloradans_categories: true, ma_magi_household_income_pct_fpl: 0.5, ma_magi_highest_income_standard_pct: 1.33}, title: "Psychiatric inpatient of 21, still inpatient at 21: to age 22", expect: psych_under_21}
