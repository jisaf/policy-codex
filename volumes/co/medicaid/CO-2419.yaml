rationale: "C-3 of the HCPF review: the 42 CFR 435.145 mandatory group and Colorado's needy-persons groups had no item; the only foster care item was former foster care (CO-549). Not a MAGI category in ma_magi_category (CO-551): § 8.100.4.H is a separate section of needy persons, so it is its own outcome, read by ma_has_full_coverage_category (CO-1176). T-9 hand check A-10, settled (2026-11-23): 'eligible to age 22' (S1717) is read as before the 22nd birthday, as 42 CFR 441.151(a)(3)(ii) (S4344) covers inpatient psychiatric services for one receiving them just before 21 'before ... The date the individual reaches 22' (CO-2419-T9)."
