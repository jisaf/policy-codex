id: CO-4630
name: "Medicaid: reaches HCBS or PACE without the special income group"
identifier: ma_reaches_hcbs_without_special_income_group
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether the person requests HCBS or PACE and is eligible for it through a route other than the 300% special income group (10 CCR 2505-10 § 8.100.7.B.1): SSI, including 1619(b), or OAP Medicaid (B.1.a: SSI-related eligibility, continued SSI status without payment, or OAP SISC B), or the Buy-In Program for Working Adults with Disabilities for a waiver B.1.c.i names (B.1.c); such a person is not held to the special income group's income test or the long-term care resource test (§ 8.100.6.P.1.c for the Buy-In)."
precision: "The setting requested is ma_ltc_setting_requested (CO-2411); PACE is read with HCBS because B.1 names both. The Buy-In waivers are EBD, CMHS, BI, CIH (the former SCI), SLS and DD, as in ma_hcbs_waiver_eligible (CO-653). Institutional care always takes the special income group (§ 8.100.7.A.1). Coverage pass 4, non-MAGI N4-13 (decision 4 of 2026-11-23: missing information is cannot determine unless the rule says otherwise; readers do not invent defaults): whether the person keeps SSI status without payment (1619(b)) is read as stated, no longer as no when unstated. Pattern sweep, non-MAGI Medicaid (docs/reviews/pattern-sweep-nonmagi.md, P1): SSI status without payment (1619(b)) is read in the month (ma_retains_ssi_status_in_month, CO-7504: for a month before the determination month, not before the month of the SSI award's eligibility date). Before, the status of the determination date was read in every month."
derived: [all, [in, [otherwise, ma_ltc_setting_requested, none], [hcbs, pace]], [any, ma_is_ssi_related_eligible, ma_retains_ssi_status_in_month, ma_oap_sisc_b_eligible, [all, ["=", [otherwise, ma_ltc_setting_requested, none], hcbs], ma_wawd_eligible, [in, [otherwise, meets_hcbs_waiver_target_group, none], [ebd, cmhs, bi, cih, sls, dd]]]]]
sources: [S3408, S5030]
implemented: engine
tags: [ma, ltc, hcbs]
open: [OQ-1415]
rationale: "Coverage review NM-12 and NM-22: ma_hcbs_waiver_eligible (CO-653) let the Buy-In route bypass the 300% and resource tests, but ma_ltc_unmet_requirement (CO-3310) tested them for every applicant, so a Buy-In worker above 300% of the FBR was reported ineligible_income; and B.1.a's 1619(b) and OAP routes were missing. ma_ltc_unmet_requirement and ma_hcbs_waiver_eligible read this item."
tests:
  - {id: CO-4630-T1, as_of: "2026-10-12", month: "2026-10", title: "X-WAWDHCBS: Buy-In worker designated for EBD", given: {ma_ltc_setting_requested: hcbs, ma_is_ssi_related_eligible: false, retains_ssi_status_without_payment: false, ma_oap_sisc_b_eligible: false, ma_wawd_eligible: true, meets_hcbs_waiver_target_group: ebd}, expect: true}
  - {id: CO-4630-T2, as_of: "2026-10-12", month: "2026-10", title: "1619(b)", given: {ma_ltc_setting_requested: hcbs, ma_is_ssi_related_eligible: false, retains_ssi_status_without_payment: true}, expect: true}
  - {id: CO-4630-T3, as_of: "2026-10-12", month: "2026-10", title: "institutional care: the special income group", given: {ma_ltc_setting_requested: institutional, ma_is_ssi_related_eligible: true}, expect: false}
  - {id: CO-4630-T4, as_of: "2026-10-12", month: "2026-10", title: "Buy-In worker designated for a waiver B.1.c.i does not name", given: {ma_ltc_setting_requested: hcbs, ma_is_ssi_related_eligible: false, retains_ssi_status_without_payment: false, ma_oap_sisc_b_eligible: false, ma_wawd_eligible: true, meets_hcbs_waiver_target_group: ces}, expect: false}
  # Pattern sweep P1: requests HCBS; 1619(b) status, SSI eligible from 2026-10-01; not otherwise SSI-related, OAP or Buy-In; determined 2026-11-12. August: no route: false. October: the 1619(b) route: true.
  - {id: CO-4630-T5, month: "2026-08", as_of: "2026-11-12", title: "Pattern sweep: a retroactive month before the SSI eligibility date", given: {ma_ltc_setting_requested: hcbs, ma_is_ssi_related_eligible: false, retains_ssi_status_without_payment: true, ssi_eligibility_date: "2026-10-01", ma_oap_sisc_b_eligible: false, ma_wawd_eligible: false}, expect: false}
  - {id: CO-4630-T6, month: "2026-10", as_of: "2026-11-12", title: "Pattern sweep: the month of the SSI eligibility date", given: {ma_ltc_setting_requested: hcbs, ma_is_ssi_related_eligible: false, retains_ssi_status_without_payment: true, ssi_eligibility_date: "2026-10-01", ma_oap_sisc_b_eligible: false, ma_wawd_eligible: false}, expect: true}
