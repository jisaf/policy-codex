id: CO-2430
name: "Medicaid: is eligible for Transitional Medical Assistance"
identifier: ma_is_eligible_for_transitional_medical_assistance
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether the person is eligible for Transitional Medical Assistance this month under 10 CCR 2505-10 § 8.100.4.I.1-3: either the person is a parent or caretaker relative who lost the Parent/Caretaker Relative category to earnings and is in the twelve months (ma_tma_parent_caretaker_is_in_transitional_period, CO-4205: three of the six months before, still an employed parent or caretaker in the household, the household still includes a dependent child), or the person is a dependent child or a Parent/Caretaker Relative of a dependent child, or received Medical Assistance in the month before the determination month, and is in the household of such a parent or caretaker (I.2, I.2.a-b: \"the family's remaining months\"); and the person is a Colorado resident meeting the status requirement of a Cover All Coloradans category (§ 8.100.3.G.1.g.ix.1.a lists Transitional Medical Assistance)."
precision: "The family's remaining months are the months in which a member of the person's TMA household (ma_tma_household_members, CO-4204) is in the transitional period this month, read from that member's own record of the first month of ineligibility and enrollment history; nothing is restated on the child or the joining member. I.2 names \"any dependent child or Parent/Caretaker Relative who was or becomes part of the Medical Assistance household\"; I.2.b adds \"an individual in the household who received Medical Assistance, but is no longer eligible ... based on a redetermination\", read as enrolled in any Medical Assistance (ma_prior_enrollment_category other than none) in the month before the determination month. ma_magi_category (CO-551) tests TMA after the other groups, so a member who still qualifies in the Children's or another group is reported there. The dependent child is ma_is_dependent_child (CO-544); \"parent or caretaker relative\" is ma_caretaker_relative_of (CO-2606). Final verification pass 3, F3-4: the item had required the person to be the parent or caretaker of a dependent child, so a dependent child of the family could never be eligible, and its precision had a joining member restate the parent's month of ineligibility and history. Pattern sweep, MAGI (2026-11-24, PS-01, PS-02): status and the Cover All Coloradans population are read for the month evaluated (ma_meets_citizenship_requirement_in_month, CO-7551; ma_is_cover_all_coloradans_person_in_month, CO-7552; ma_meets_status_for_cover_all_coloradans_categories_in_month, CO-7553), not on the determination date: 8.100.4.G.1 (S3351), 8.100.3.E.1 (S217), 8 U.S.C. 1613(a) (S176), ix.1's 'current month' (S607)."
derived: [all, ma_meets_residency_in_month, ma_meets_status_for_cover_all_coloradans_categories_in_month, [any, ma_tma_parent_caretaker_is_in_transitional_period, [all, [any, ma_is_dependent_child_in_month, [exists, ma_caretaker_relative_of, [of, [P], ma_is_dependent_child_in_month]], [not, ["=", [otherwise, [at, ma_prior_enrollment_category, [month_before, [det_month]]], none], none]]], [exists, ma_tma_household_members, [of, [P], ma_tma_parent_caretaker_is_in_transitional_period]]]]]
sources: [S1719, S3004, S607, S3351, S217, S176]
implemented: engine
tags: [ma, magi, income]
rationale: "Final verification pass 3, F3-4 (2026-11-22): the parent's own test moved to ma_tma_parent_caretaker_is_in_transitional_period (CO-4205); this item adds the family's remaining months for a dependent child, a Parent/Caretaker Relative or another member who received Medical Assistance (I.2, I.2.a-b). C-4 of the HCPF review: Transitional Medical Assistance was mentioned only inside the Cover All Coloradans category list (CO-1174, CO-1175). No existing item states it."
