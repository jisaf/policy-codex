id: CO-2430
name: "Medicaid: is eligible for Transitional Medical Assistance"
identifier: ma_is_eligible_for_transitional_medical_assistance
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether the person is eligible for Transitional Medical Assistance this month under 10 CCR 2505-10 § 8.100.4.I.1-3: the person lost the Parent/Caretaker Relative category because of new or increased earnings, was in that category in at least three of the six months before the first month of ineligibility, this month is one of the twelve months beginning with that month, a parent or caretaker relative in the household is still employed, the household still includes a dependent child, and the person is a Colorado resident meeting the status requirement of a Cover All Coloradans category (§ 8.100.3.G.1.g.ix.1.a lists Transitional Medical Assistance)."
precision: "A dependent child or parent who joins the household after TMA began, or who loses continuous eligibility at a redetermination, takes the family's remaining months (§ 8.100.4.I.2): such a person's ma_first_month_of_ineligibility and history are those of the family member whose TMA they join. The dependent child is the 42 CFR 435.4 dependent child ma_is_dependent_child (CO-544) states. Same-word audit SW-1/SW-3 (engineering follow-up pass, OQ-396): \"parent or caretaker relative\" is ma_caretaker_relative_of (CO-2606), Medicaid's own reading of the neutral parent, stepparent and has_primary_responsibility_for roles."
derived: [all, [not, [unknown, ma_first_month_of_ineligibility]], ["=", ma_ineligibility_reason, increased_earnings], [">=", [month], ma_first_month_of_ineligibility], ["<=", [month], [months_after, ["-", ma_transitional_medical_assistance_months, 1], ma_first_month_of_ineligibility]], [">=", [count_months, [months_ending, ma_extension_lookback_months, [month_before, ma_first_month_of_ineligibility]], ["=", ma_prior_enrollment_category, parent_caretaker]], ma_extension_prior_months_required], ma_household_has_employed_parent_caretaker, [exists, ma_caretaker_relative_of, [of, [P], ma_is_dependent_child]], ma_meets_residency, ma_meets_status_for_cover_all_coloradans_categories]
sources: [S1719, S607]
implemented: engine
tags: [ma, magi, income]
rationale: "C-4 of the HCPF review: Transitional Medical Assistance was mentioned only inside the Cover All Coloradans category list (CO-1174, CO-1175). No existing item states it."
tests:
  - {id: CO-2430-T1, month: "2026-11", as_of: "2026-11-01", given: {ma_first_month_of_ineligibility: "2026-10", ma_ineligibility_reason: increased_earnings, ma_prior_enrollment_category: {"2026-04": parent_caretaker, "2026-05": parent_caretaker, "2026-06": parent_caretaker, "2026-07": parent_caretaker, "2026-08": parent_caretaker, "2026-09": parent_caretaker}, ma_household_has_employed_parent_caretaker: true, is_colorado_resident: true, ma_meets_status_for_cover_all_coloradans_categories: true}, title: "Parent lost the category in October on a raise after six months enrolled; still employed", others: {p2: {date_of_birth: "2018-01-01"}}, relationships: [[parent, p2]], expect: true}
  - {id: CO-2430-T2, month: "2026-11", as_of: "2026-11-01", given: {ma_first_month_of_ineligibility: "2026-10", ma_ineligibility_reason: increased_earnings, ma_prior_enrollment_category: {"2026-04": none, "2026-05": none, "2026-06": none, "2026-07": none, "2026-08": parent_caretaker, "2026-09": parent_caretaker}, ma_household_has_employed_parent_caretaker: true, is_colorado_resident: true, ma_meets_status_for_cover_all_coloradans_categories: true}, title: "Only two of the six months enrolled", others: {p2: {date_of_birth: "2018-01-01"}}, relationships: [[parent, p2]], expect: false}
  - {id: CO-2430-T3, month: "2027-10", as_of: "2027-10-01", given: {ma_first_month_of_ineligibility: "2026-10", ma_ineligibility_reason: increased_earnings, ma_prior_enrollment_category: {"2026-04": parent_caretaker, "2026-05": parent_caretaker, "2026-06": parent_caretaker, "2026-07": parent_caretaker, "2026-08": parent_caretaker, "2026-09": parent_caretaker}, ma_household_has_employed_parent_caretaker: true, is_colorado_resident: true, ma_meets_status_for_cover_all_coloradans_categories: true}, title: "Thirteenth month: TMA has ended", others: {p2: {date_of_birth: "2018-01-01"}}, relationships: [[parent, p2]], expect: false}
