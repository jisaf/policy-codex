id: CO-545
name: "Medicaid: meets the Children MAGI category"
identifier: ma_is_child_category
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: Whether the person meets the Children's MAGI Medical Assistance category under 10 CCR 2505-10 8.100.4.G.2 - under ma_magi_child_age_limit (19), with household income at or below ma_magi_income_standard_child, applying the 5% income disregard of 42 CFR 435.603(d)(4) and 8.100.4.D as the last step only if income above the plain standard would otherwise make the person ineligible.
precision: The disregard test subtracts ma_magi_income_disregard_pct (a percentage of the poverty guideline) from ma_magi_household_income_pct_fpl and compares the result to the same standard, per 8.100.4.D.1.a's "as the last step to determine eligibility"; it is not applied when income already meets the plain standard, per 8.100.4.D.1.b.
derived: [all, [<, age, ma_magi_child_age_limit], [any, ["<=", ma_magi_household_income_pct_fpl, ma_magi_income_standard_child], ["<=", ["-", ma_magi_household_income_pct_fpl, ma_magi_income_disregard_pct], ma_magi_income_standard_child]]]
sources: [S201, S165, S168]
implemented: engine
tags: [ma, magi, income, age]
rationale: "No existing item states the Children's-category test. ma_magi_category (CO-551) needs it, listed first per the phase-3 brief's mandatory-group ordering after needy newborn. The same disregard pattern is reused on ma_is_pregnant_category (CO-546), ma_is_parent_caretaker_category (CO-547), and ma_is_adult_category (CO-548) because 8.100.4.D.1.a applies the 5% disregard 'for each qualifying MAGI program,' not only the Children's category, even though the phase-3 brief's own text illustrates it on this item."
tests:
  - {id: CO-545-T1, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "2009-04-08", ma_magi_household_income_pct_fpl: 1.20}, expect: true}
  - {id: CO-545-T2, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "2009-04-08", ma_magi_household_income_pct_fpl: 1.36}, expect: true}
  - {id: CO-545-T3, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "2009-04-08", ma_magi_household_income_pct_fpl: 1.50}, expect: false}
  - {id: CO-545-T4, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "2000-04-08", ma_magi_household_income_pct_fpl: 0.80}, expect: false}
