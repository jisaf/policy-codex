id: CO-545
name: "Medicaid: meets the Children MAGI category"
identifier: ma_is_child_category
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: Whether the person meets the Children's MAGI Medical Assistance category under 10 CCR 2505-10 8.100.4.G.2 - under ma_magi_child_age_limit (19), with household income at or below ma_magi_income_standard_child, applying the 5% income disregard of 42 CFR 435.603(d)(4) and 8.100.4.D as the last step only if income above the plain standard would otherwise make the person ineligible.
precision: "The disregard test subtracts ma_magi_income_disregard_pct (a percentage of the poverty guideline) from ma_magi_household_income_pct_fpl and compares the result to the same standard, per 8.100.4.D.1.a's \"as the last step to determine eligibility\"; it is not applied when income already meets the plain standard, per 8.100.4.D.1.b. Per 42 CFR 435.603(d)(4), which permits the disregard \"only ... for the eligibility group with the highest income standard ... but not to determine eligibility for a particular eligibility group,\" the disregard disjunct here is further gated on ma_magi_income_standard_child actually being this person's highest standard (ma_magi_highest_income_standard_pct, CO-539, fix round) - the phase-3 review's C-2 finding."
derived: [all, ma_is_under_child_age_or_turns_nineteen_this_month, [any, ["<=", ma_magi_household_income_pct_fpl, ma_magi_income_standard_child], [all, [=, ma_magi_income_standard_child, ma_magi_highest_income_standard_pct], ["<=", ["-", ma_magi_household_income_pct_fpl, ma_magi_income_disregard_pct], ma_magi_income_standard_child]]]]
sources: [S201, S165, S168, S175]
open: [OQ-63]
implemented: engine
tags: [ma, magi, income, age]
rationale: "No existing item states the Children's-category test. ma_magi_category (CO-551) needs it, listed first per the phase-3 brief's mandatory-group ordering after needy newborn. The same disregard pattern is reused on ma_is_pregnant_category (CO-546), ma_is_parent_caretaker_category (CO-547), and ma_is_adult_category (CO-548) because 8.100.4.D.1.a applies the 5% disregard 'for each qualifying MAGI program,' not only the Children's category, even though the phase-3 brief's own text illustrates it on this item. Fix round: gated the disregard disjunct on ma_magi_highest_income_standard_pct (CO-539) per the phase-3 review's C-2 finding, so the disregard is available here only when the Children's standard is this person's highest (it is, for every non-pregnant child, since no lower-standard group's age range overlaps a child's). Fix round (C-8): replaced the plain [<, age, ma_magi_child_age_limit] test with ma_is_under_child_age_or_turns_nineteen_this_month (CO-564), per the phase-3 review's finding that 8.100.4.G.2.a extends the category 'through the end of the month in which they turn 19 years old.'"
tests:
  - {id: CO-545-T6, as_of: "2026-10-01", month: "2026-10", title: "Fix round (C-8): 19th birthday on 2007-10-20, determination on 2026-10-01 - still under the extended age test for October", given: {date_of_birth: "2007-10-20", ma_magi_household_income_pct_fpl: 1.20, ma_magi_highest_income_standard_pct: 1.42}, expect: true}
  - {id: CO-545-T7, as_of: "2026-11-01", month: "2026-11", title: "Fix round (C-8): same person the following month - the age extension no longer applies", given: {date_of_birth: "2007-10-20", ma_magi_household_income_pct_fpl: 1.20, ma_magi_highest_income_standard_pct: 1.42}, expect: false}
  - {id: CO-545-T1, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "2009-04-08", ma_magi_household_income_pct_fpl: 1.20, ma_magi_highest_income_standard_pct: 1.42}, expect: true}
  - {id: CO-545-T2, as_of: "2026-10-01", month: "2026-10", title: "Fix round (OQ-63): income above the pre-chart 133% but within the chart's 142% standard - eligible on the plain test, no disregard needed", given: {date_of_birth: "2009-04-08", ma_magi_household_income_pct_fpl: 1.36, ma_magi_highest_income_standard_pct: 1.42}, expect: true}
  - {id: CO-545-T3, as_of: "2026-10-01", month: "2026-10", title: "Fix round (OQ-63): income above the chart's 142% standard even with the disregard applied", given: {date_of_birth: "2009-04-08", ma_magi_household_income_pct_fpl: 1.50, ma_magi_highest_income_standard_pct: 1.42}, expect: false}
  - {id: CO-545-T4, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "2000-04-08", ma_magi_household_income_pct_fpl: 0.80, ma_magi_highest_income_standard_pct: 1.42}, expect: false}
  - {id: CO-545-T5, as_of: "2026-10-01", month: "2026-10", title: "Fix round (OQ-63): pregnant 17-year-old above the Children's chart standard (142%) - highest standard is the pregnant 195%, so the disregard is not available at the Children's 142% standard", given: {date_of_birth: "2009-04-08", is_pregnant: true, ma_magi_household_income_pct_fpl: 1.50, ma_magi_highest_income_standard_pct: 1.95}, expect: false}
