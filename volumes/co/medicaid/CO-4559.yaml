id: CO-4559
name: "Medicaid: annualized MAGI household income"
identifier: ma_annualized_household_income
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "This person's MAGI household income for the month with the self-employment, seasonal and commission income of each counted member who has such earnings (ma_has_annualizable_earnings, CO-6451) annualized: that member's month income from such work (ma_annualizable_earnings_in_month, CO-7404) replaced by one twelfth of the member's expected income for the year from it (expected_annual_self_employment_seasonal_commission_income, CO-7403), the member's other income kept as the month's; the annualized figure 10 CCR 2505-10 § 8.100.4.C.4.a applies to an applicant found ineligible on monthly income whose household has such earnings."
precision: "C.4.a annualizes \"self-employment, seasonal employment, and commission-based employment income\" (S3356): coverage pass 6, C6-07 (2026-11-24), only that income is annualized; the member's other income, a lump sum among it (C.1.d.i: \"counted as income only in the month received\"), stays the month's. Before, the member's whole income was replaced by a twelfth of the year's expected income (expected_annual_income), which spread a lump sum over the year (SE-LUMP: a business netting $1,000 a month, a taxable lump sum of $6,000 in November, $18,000 expected for 2026: 18,000 / 12 = 1,500, 112.8%, eligible; now 7,000 - 1,000 + 12,000 / 12 = 7,000, 526.3%). Coverage pass 4, C4-05 (2026-11-23): a member with such earnings whose expected year from them is not stated, or a member whose earnings are not stated, makes the figure unknown (decision 4); every other member keeps the month's income, so the figure equals ma_magi_household_income (CO-503) when nothing is annualized; it includes the lottery spread and sponsor income CO-503 adds for this person. The year is the calendar year of the determination (OQ-810, now only the period). Not rounded (coverage pass 4, C4-13). ma_magi_household_income_pct_fpl (CO-504, through CO-4567) takes the lower of the monthly and annualized figures, which is C.4.a's order: the annualized figure is reached only when the monthly one is ineligible."
derived: [+, ma_magi_household_income, [sum, [filter, ma_magi_household_income_members, [of, [P], ma_has_annualizable_earnings]], ["-", ["/", [of, [P], expected_annual_self_employment_seasonal_commission_income], 12], [of, [P], ma_annualizable_earnings_in_month]]]]
sources: [S3356, S166]
implemented: engine
tags: [ma, magi, income]
open: [OQ-810]
rationale: "Coverage review F-04 (2026-11-22): no item annualized income, so a self-employed adult with one high month was ineligible in that month though the year's income is within the standard (RV-SE). No existing item states an annual income."
tests:
  - {id: CO-4559-T1, month: "2026-11", as_of: "2026-11-10", title: "Coverage review F-04 (RV-SE): $3,000 net in November, $11,998 for the year - a twelfth, 11,998 / 12 = 999.83, not rounded since coverage pass 4 (C4-13; it was rounded to $1,000)", given: {ma_magi_household_income: 3000, ma_magi_household_income_members: [p1], ma_has_annualizable_earnings: true, expected_annual_self_employment_seasonal_commission_income: 11998, ma_annualizable_earnings_in_month: 3000}, expect: 999.8333333333335}
  - {id: CO-4559-T2, month: "2026-11", as_of: "2026-11-10", title: "A wage-earning spouse's income stays monthly; the self-employed member is annualized", given: {ma_magi_household_income: 5000, ma_magi_household_income_members: [p1, p2], ma_has_annualizable_earnings: true, expected_annual_self_employment_seasonal_commission_income: 12000, ma_annualizable_earnings_in_month: 3000}, others: {p2: {ma_has_annualizable_earnings: false, ma_person_magi_income: 2000}}, expect: 3000}
  - {id: CO-4559-T3, month: "2026-11", as_of: "2026-11-10", title: "Coverage pass 4, C4-05: no such earnings: the monthly figure", given: {ma_magi_household_income: 2400, ma_magi_household_income_members: [p1], ma_has_annualizable_earnings: false, ma_person_magi_income: 2400}, expect: 2400}
  - {id: CO-4559-T4, month: "2026-11", as_of: "2026-11-10", title: "Coverage pass 4, C4-05 (B-SE-noannual): self-employed with no annual figure stated: cannot determine (decision 4; was the monthly figure)", given: {ma_magi_household_income: 2400, ma_magi_household_income_members: [p1], ma_has_annualizable_earnings: true, ma_annualizable_earnings_in_month: 2400}, expect: unknown}
  - {id: CO-4559-T5, month: "2026-11", as_of: "2026-11-10", title: "Coverage pass 4, C4-05: earnings not stated: whether the member has such earnings cannot be determined, so neither can the annualized figure (decision 4)", given: {ma_magi_household_income: 2400, ma_magi_household_income_members: [p1], ma_person_magi_income: 2400}, expect: unknown}
  - {"id": "CO-4559-T6", "month": "2026-11", "as_of": "2026-11-10", "title": "C5-08 (SEASONAL-STATED): single adult, seasonal wages 3,000 in November, expecting 16,000 for 2026: 3,000 + (16,000 / 12 - 3,000) = 1,333.33 (16,000 / 12 / 1,330 = 100.3%, within the 133% Adults standard)", "given": {"ma_magi_household_income": 3000, "ma_magi_household_income_members": ["p1"], "ma_person_magi_income": 3000, "ma_has_annualizable_earnings": true, "expected_annual_self_employment_seasonal_commission_income": 16000, "ma_annualizable_earnings_in_month": 3000}, "expect": 1333.3333333333333}
  - {id: CO-4559-T7, month: "2026-11", as_of: "2026-11-10", title: "C6-07 (SE-LUMP): a business netting $1,000 a month and a taxable lump sum of $6,000 received in November: the month's income 7,000, of which 1,000 is self-employment; $12,000 of self-employment income expected for 2026: 7,000 - 1,000 + 12,000 / 12 = 7,000 (was 18,000 / 12 = 1,500, the whole year's income)", given: {ma_magi_household_income: 7000, ma_magi_household_income_members: [p1], ma_has_annualizable_earnings: true, ma_annualizable_earnings_in_month: 1000, expected_annual_self_employment_seasonal_commission_income: 12000}, expect: 7000}
  - {id: CO-4559-T8, month: "2026-11", as_of: "2026-11-10", title: "C6-07: steady wages of 2,000 and commission pay of 1,500 this month, $9,000 of commission pay expected for the year: 3,500 - 1,500 + 9,000 / 12 = 2,750", given: {ma_magi_household_income: 3500, ma_magi_household_income_members: [p1], ma_has_annualizable_earnings: true, ma_annualizable_earnings_in_month: 1500, expected_annual_self_employment_seasonal_commission_income: 9000}, expect: 2750}
  - {id: CO-4559-T9, month: "2026-11", as_of: "2026-11-10", title: "C6-07: self-employed, the year's expected self-employment income not stated: cannot determine (decision 4)", given: {ma_magi_household_income: 2400, ma_magi_household_income_members: [p1], ma_has_annualizable_earnings: true, ma_annualizable_earnings_in_month: 2400, expected_annual_income: 28800}, expect: unknown}
