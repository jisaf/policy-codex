id: CO-2246
name: "Medicaid: requires verification of efforts to sell real property"
identifier: ma_requires_verification_of_sale_efforts
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether an aged, blind or disabled person must verify continuing efforts to sell real property: the person's excess real property is left out of countable resources while reasonable efforts to sell it are unsuccessful, and the client must submit verification of these efforts each quarter (10 CCR 2505-10 § 8.100.5.M.2.b.v). Read from the person's real property holdings records (holdings, CO-5300) held in the month: true when one states the eligibility site's finding that the efforts to sell it have been unsuccessful (ma_sale_efforts_unsuccessful); false when every one states it is not so, or the person states no real property."
precision: "Records E2/H2 leftovers (docs/reviews/records-e2-h2.md, section 5): read from the holdings, no longer from the person fact ma_excess_real_property_is_for_sale (CO-2242, retired). The records read are the ones the M.2.b exclusion reads (ma_excluded_real_property_value, CO-4620): the kinds Medicaid's holdings table counts less the real property exclusions (ma_ssi_holding_treatment_table, CO-5303: real_property; the home is not excess property), valued in the month and still held at its first moment (a disposed_date in the month or later, or none). M.2.b (S1514): \"Excess property will not be included in countable resources as long as reasonable efforts to sell it have been unsuccessful\"; v: \"The client must continue reasonable efforts to sell and must submit verification of these efforts to the Eligibility Site on a quarterly basis.\" The verification is of the efforts to sell property the exclusion leaves out, so it is required when a record states the finding, and a record that leaves the finding out is cannot determine here (decision 4 of 2026-11-23: no rule says what an unstated finding is for the verification; the resource readers give it the meaning 8.100.5.E.3 gives, not shown, through `otherwise`). One record stating the finding settles it whatever the others leave out (the first sum reads the stated findings only); otherwise the second sum is unknown while any record leaves it out. A person whose holdings state no real property has no excess property, so nothing is left out and there are no efforts to verify: false, not 'not applicable', since the item answers whether the verification is required, and for that person it is not. An unstated holdings list is cannot determine."
derived: [all, ma_is_aged_blind_or_disabled, [any, [">", [sum_receipts, holdings, [all, ["=", [lookup, ma_ssi_holding_treatment_table, [receipt, kind]], counted_less_real_property_exclusions], [received_in, [month]], [any, [unknown, [receipt, disposed_date]], [">=", [month_of, [receipt, disposed_date]], [month]]], [otherwise, [receipt, ma_sale_efforts_unsuccessful], false]], 1], 0], [">", [sum_receipts, holdings, [all, ["=", [lookup, ma_ssi_holding_treatment_table, [receipt, kind]], counted_less_real_property_exclusions], [received_in, [month]], [any, [unknown, [receipt, disposed_date]], [">=", [month_of, [receipt, disposed_date]], [month]]], [receipt, ma_sale_efforts_unsuccessful]], 1], 0]]]
sources: [S1514]
implemented: engine
tags: [ma, resources, verification]
rationale: "OQ-379: the quarterly verification of efforts to sell real property was not modeled."
tests:
  # Records E2/H2 leftovers: hand-derived from 10 CCR 2505-10 8.100.5.M.2.b and M.2.b.v (S1514), quoted in the precision.
  - {id: CO-2246-T1, as_of: "2026-10-01", month: "2026-10", title: "A lot whose sale efforts the eligibility site found unsuccessful: left out by M.2.b, so the efforts are verified each quarter (v): true", given: {ma_is_aged_blind_or_disabled: true, holdings: [{kind: bank_account}, {kind: real_property, value: 50000, amount_owed: 0, listed_for_sale: true, ma_sale_efforts_unsuccessful: true}]}, expect: true}
  - {id: CO-2246-T2, as_of: "2026-10-01", month: "2026-10", title: "A lot with no such finding: nothing is left out under M.2.b, no efforts to verify: false", given: {ma_is_aged_blind_or_disabled: true, holdings: [{kind: bank_account}, {kind: real_property, value: 50000, amount_owed: 0, ma_sale_efforts_unsuccessful: false}]}, expect: false}
  - {id: CO-2246-T3, as_of: "2026-10-01", month: "2026-10", given: {ma_is_aged_blind_or_disabled: false}, expect: false}
  - {id: CO-2246-T4, as_of: "2026-10-01", month: "2026-10", title: "Only a bank account: no excess property, nothing M.2.b leaves out, so no efforts to sell to verify: false (before, a person fact stated the finding beside no real property and this test expected true; that finding is about no property)", given: {ma_is_aged_blind_or_disabled: true, holdings: [{kind: bank_account}]}, expect: false}
  - {id: CO-2246-T5, as_of: "2026-10-01", month: "2026-10", title: "A lot whose record does not state the finding: whether the person relies on M.2.b is not stated, cannot determine (decision 4)", given: {ma_is_aged_blind_or_disabled: true, holdings: [{kind: bank_account}, {kind: real_property, value: 50000, amount_owed: 0}]}, expect: unknown}
  - {id: CO-2246-T6, as_of: "2026-10-01", month: "2026-10", title: "One lot with the finding and another that does not state it: the first already requires the verification: true", given: {ma_is_aged_blind_or_disabled: true, holdings: [{kind: real_property, value: 50000, amount_owed: 0, ma_sale_efforts_unsuccessful: true}, {kind: real_property, value: 8000, amount_owed: 0}]}, expect: true}
  - {id: CO-2246-T7, as_of: "2026-10-01", month: "2026-10", title: "The lot with the finding was sold in September: not held in October, nothing left out: false", given: {ma_is_aged_blind_or_disabled: true, holdings: [{kind: real_property, value: 50000, amount_owed: 0, ma_sale_efforts_unsuccessful: true, disposed_date: "2026-09-20"}]}, expect: false}
  - {id: CO-2246-T8, as_of: "2026-10-01", month: "2026-10", title: "The home is not excess property, whatever its record states: false", given: {ma_is_aged_blind_or_disabled: true, holdings: [{kind: home, value: 150000, amount_owed: 0, lives_in: true}]}, expect: false}
  - {id: CO-2246-T9, as_of: "2026-10-01", month: "2026-10", title: "Holdings not stated: cannot determine", given: {ma_is_aged_blind_or_disabled: true}, expect: unknown}
