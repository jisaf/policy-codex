id: CO-642
name: "Medicaid: meets the 300% special income group"
identifier: ma_meets_special_income_group
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: Whether this person's gross income meets the ma_special_income_group_pct Institutionalized Special Income standard - gross income at or below ma_special_income_group_pct of the individual SSI federal benefit rate, or, for a person in a Long-Term Care institution (excluding a hospital) whose income exceeds that level, has established a qualifying income trust - per 10 CCR 2505-10 §§ 8.100.6.K.5 and 8.100.7.A.2.e.
precision: "OQ-99 resolved pending verification: with an income trust, gross income must also be below the average private-pay rate of the region in which the person resides and intends to remain (§ 8.100.7.G.6.a.i.a), ma_income_trust_gross_income_limit, CO-1985). The regional rates are unverified figures supplied by the product owner from HCPF OM 25-073 (S1230). The income trust route excludes a hospital patient (§ 8.100.7.A.2.e, 'in a Long-Term Care institution (excluding hospital)'); it is open in HCBS under § 8.100.7.E.6.a.i (coverage review NM-32). T-9 hand check A-2 (receipts migration phase 2), settled by the governing text: the eligibility rule says \"gross income that does not exceed 300% of the current individual SSI benefit level\" (§ 8.100.7.A.2.e, S351, S3422), as does the federal limit, \"does not exceed 300 percent of the SSI benefit amount\" (42 CFR 435.1005, S378); § 8.100.6.K.5's \"whose income is under 300% of the SSI benefit level\" (S352) introduces the group and is read as the same standard. Income equal to 300% meets it (CO-642-T5). Blocked (OQ-1061): with an income trust, the regional ceiling (CO-1985, CO-3022) rests on S1230, which is not a quotation. HCPF Operational Memo OM 25-073 (D-125), the only document that states them, could not be fetched on 2026-11-23 (hcpf.colorado.gov refused, HTTP 403; medicaid.gov, sos.state.co.us, ecfr.gov, law.cornell.edu, govinfo.gov and federalregister.gov answered but state no Colorado figure), so the item stays Draft until the memo is stored and the excerpt replaced by its quotation. Coverage pass 4, non-MAGI N4-13 (decision 4 of 2026-11-23: missing information is cannot determine unless the rule says otherwise; readers do not invent defaults): the setting that decides whether an income trust is excluded (8.100.7.A.2.d-e: not in a hospital) is read as stated, no longer as a private dwelling when unstated."
derived: [any, ["<=", ma_ltc_gross_income, ["*", ssi_federal_benefit_rate_individual, ma_special_income_group_pct]], [all, has_income_trust, [not, ["=", residence_setting_type, hospital]], ["<", ma_ltc_gross_income, ma_income_trust_gross_income_limit]]]
sources: [S351, S352, S378, S1229, S1230, S3422]
implemented: engine
tags: [ma, ltc, income]
open: [OQ-99, OQ-1061]
rationale: "No existing item states the 300% special income group test. ma_ltc_financially_eligible (CO-651) and ma_ltc_eligibility_status (CO-652) need it. The target household's p1 (2030 <= 994 x 3 = 2982) is the worked example in the batch report. T-9 threshold hand check A-2 (2026-11-23): \"under\" (K.5) against \"does not exceed\" (A.2.e and 42 CFR 435.1005) settled by the eligibility rule and the federal limit; the comparison was already at or under, so no decision changes."
tests:
  - {id: CO-642-T1, month: "2026-10", as_of: "2026-10-01", given: {ma_ltc_gross_income: 2030, has_income_trust: false}, expect: true}
  - {id: CO-642-T2, month: "2026-10", as_of: "2026-10-01", given: {ma_ltc_gross_income: 3200, has_income_trust: false}, expect: false}
  - {id: CO-642-T3, month: "2026-10", as_of: "2026-10-01", given: {residence_setting_type: private_dwelling, ma_ltc_gross_income: 3200, has_income_trust: true, county_of_residence: denver}, expect: true}
  - {id: CO-642-T4, month: "2026-10", as_of: "2026-10-01", given: {ma_ltc_gross_income: 10000, has_income_trust: true, county_of_residence: pueblo}, title: "OQ-99: income trust but gross income above the Region III rate of 9780.17", expect: false}
  - {id: CO-642-T5, month: "2026-10", as_of: "2026-10-01", given: {ma_ltc_gross_income: 2982, has_income_trust: false}, title: "T-9: ma_ltc_gross_income equal to [\"*\",\"ssi_federal_benefit_rate_individual\",\"ma_special_income_group_pct\"] (ma_ltc_gross_income at or under [\"*\",\"ssi_federal_benefit_rate_individual\",\"ma_special_income_group_pct\"])", expect: true}
  - {id: CO-642-T6, month: "2026-10", as_of: "2026-10-01", given: {ma_ltc_gross_income: 11522.44, has_income_trust: true, county_of_residence: denver}, title: "T-9: ma_ltc_gross_income equal to ma_income_trust_gross_income_limit (ma_ltc_gross_income under ma_income_trust_gross_income_limit)", expect: false}
  - {id: CO-642-T7, month: "2026-11", as_of: "2026-11-20", given: {ma_ltc_gross_income: 3200, has_income_trust: true}, title: "N4-13 (decision 4): with an income trust, the setting not stated: cannot determine (was read as a private dwelling)", expect: unknown}
