id: CO-540
name: "Medicaid: MAGI Children category income standard"
identifier: ma_magi_income_standard_child
kind: derived
type: rate
scope: global
program: Medicaid
meaning: The income standard, as a decimal fraction of the federal poverty level (MAGI-equivalent), that governs the Children's MAGI Medical Assistance category - the greater of the federal minimum floor 42 CFR 435.118(c)(1)(i) sets and Colorado's own percentage stated at 10 CCR 2505-10 8.100.4.G.2.
precision: Both the federal floor and Colorado's percentage are 133% FPL, so this rule is not binding for this batch's household, but it is modeled as a comparison (not a restatement) so a future federal floor increase above Colorado's own percentage would be caught.
derived: [max, ma_federal_magi_floor_pct, ma_income_limit_child_pct]
sources: [S201, S202]
implemented: engine
tags: [ma, magi, income, state_election]
rationale: "No existing item states the Children's-category income standard. ma_is_child_category (CO-545) needs it. Written as the greater of the federal floor and Colorado's percentage, per the phase-3 brief's direction to model Colorado's rule against the federal minimum floor and cite both, rather than as a bare reference to ma_income_limit_child_pct (CO-191), which would trip governance's derived.alias check."
tests:
  - {id: CO-540-T1, as_of: "2026-10-01", given: {}, expect: 1.33}
