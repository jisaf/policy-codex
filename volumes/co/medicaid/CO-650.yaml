id: CO-650
name: "Medicaid: home equity disqualifies"
identifier: ma_home_equity_disqualifies
kind: derived
type: yes/no
scope: person
program: Medicaid
meaning: "Whether this person's equity interest in the home exceeds the current home equity limit, disqualifying them from nursing facility or other Long-Term Care assistance, unless a spouse is lawfully residing in the home, per 42 U.S.C. 1396p(f) and 10 CCR 2505-10 § 8.100.5.M.3: the person's ownership interest in the home at the determination month (ma_home_equity_interest_in_month, CO-5327; § 8.100.5.M.2.a.ii, \"The individual’s ownership interest in the home must have an equity value that\")."
precision: "Reads ma_spouse_or_qualifying_child_lives_in_home (CO-889), not ma_ltc_couple - 1396p(f)(2) excuses the disqualification when the spouse, or a child under 21, or a blind or permanently disabled child of any age, \"is lawfully residing in the individual's home,\" which is a question about who lives in the home, not whether a community spouse exists apart from the institution. This also resolves OQ-92's dependent-child gap, since the new fact's meaning already covers the child branch. Equity equal to the limit disqualifies (\">=\"), because § 8.100.5.M.2.a.ii exempts equity that \"Is less than\" the indexed amount; 42 U.S.C. 1396p(f)(1)(A)'s \"exceeds\" sets the federal floor of the disqualification, and the state text is the more restrictive reading at the single boundary value. The limit is read for long-term care only (OQ-820): § 8.100.5.M.2.a.ii, vi and M.3.f state it in the general ABD resource rules, but 42 U.S.C. 1396p(f) is a long-term care rule; the other § 8.100.5.M.2.a rules on the home are ma_home_is_countable_resource (CO-4622). Resource records, Medicaid track H1 (docs/reviews/records-holdings-medicaid.md): the equity is the person's share of the home holdings record's equity (CO-5300), not the whole home's: a couple's home is one joint holding stated on each spouse with each one's share (the twelve stored couples that stated the home's equity on each spouse are restated so), as 1396p(f)(1)(A) tests \"the individual's equity interest\" and M.2.a.ii \"The individual’s ownership interest\". A stated holdings list with no home record: no equity, not disqualified."
derived: [all, [">=", [at, ma_home_equity_interest_in_month, [det_month]], ma_home_equity_limit], [not, ma_spouse_or_qualifying_child_lives_in_home]]
sources: [S645, S369, S370, S4665]
open: [OQ-820]
implemented: engine
tags: [ma, ltc, resources, legal]
rationale: "No existing item tests the home equity disqualification. ma_ltc_financially_eligible (CO-651) and ma_ltc_eligibility_status (CO-652) need it. The target household's p1 (home equity 210000, well under any plausible limit, and a community spouse living there) is the worked example in the batch report. History moved from the precision note (HCPF review S-14): Phase 7 fix round (N-2): equity equal to the limit disqualifies (\">=\"), because § 8.100.5.M.2.a.ii exempts equity that \"Is less than\" the indexed amount; 42 U.S.C. 1396p(f)(1)(A)'s \"exceeds\" sets the federal floor of the disqualification, and the state text is the more restrictive reading at the single boundary value. Precision history (moved from precision, engineering follow-up pass task 5): per the phase-4 review's C-20 finding."
tests:
  - {id: CO-650-T1, as_of: "2026-10-01", given: {home_equity: 900000, ma_spouse_or_qualifying_child_lives_in_home: false, holdings: [{kind: bank_account}, {kind: home, value: 900000, amount_owed: 0}]}, expect: true}
  - {id: CO-650-T2, as_of: "2026-10-01", given: {home_equity: 900000, ma_spouse_or_qualifying_child_lives_in_home: true, holdings: [{kind: bank_account}, {kind: home, value: 900000, amount_owed: 0}]}, expect: false}
  - {id: CO-650-T3, as_of: "2026-10-01", given: {home_equity: 210000, ma_spouse_or_qualifying_child_lives_in_home: false, holdings: [{kind: bank_account}, {kind: home, value: 210000, amount_owed: 0}]}, expect: false}
  - {id: CO-650-T4, as_of: "2026-10-01", title: "Phase 7 fix round (N-2): equity exactly at the 2026 limit of 752,000", given: {home_equity: 752000, ma_spouse_or_qualifying_child_lives_in_home: false, holdings: [{kind: bank_account}, {kind: home, value: 752000, amount_owed: 0}]}, expect: true}
  # Resource records, Medicaid track H1: hand-computed from 8.100.5.M.2.a.ii (S4665): the individual's ownership interest; the 2026 limit is 752,000 (CO-650-T4).
  - {id: CO-650-T5, as_of: "2026-10-01", title: "a 900,000 home owned with the spouse, half each: the interest 0.5 x 900,000 = 450,000 is under 752,000", given: {ma_spouse_or_qualifying_child_lives_in_home: false, holdings: [{kind: home, value: 900000, amount_owed: 0, share: 0.5, co_owners: spouse, holding_id: home}]}, expect: false}
  - {id: CO-650-T6, as_of: "2026-10-01", title: "a 1,000,000 home owing 200,000, owned alone: 800,000 is over 752,000", given: {ma_spouse_or_qualifying_child_lives_in_home: false, holdings: [{kind: home, value: 1000000, amount_owed: 200000}]}, expect: true}
