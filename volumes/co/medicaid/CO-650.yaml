id: CO-650
name: "Medicaid: home equity disqualifies"
identifier: ma_home_equity_disqualifies
kind: derived
type: yes/no
scope: person
program: Medicaid
meaning: Whether this person's home equity exceeds the current home equity limit, disqualifying them from nursing facility or other Long-Term Care assistance, unless a spouse is lawfully residing in the home, per 42 U.S.C. 1396p(f) and 10 CCR 2505-10 § 8.100.5.M.3.
precision: "Reads ma_spouse_or_qualifying_child_lives_in_home (CO-889), not ma_ltc_couple - 1396p(f)(2) excuses the disqualification when the spouse, or a child under 21, or a blind or permanently disabled child of any age, \"is lawfully residing in the individual's home,\" which is a question about who lives in the home, not whether a community spouse exists apart from the institution. This also resolves OQ-92's dependent-child gap, since the new fact's meaning already covers the child branch. Equity equal to the limit disqualifies (\">=\"), because § 8.100.5.M.2.a.ii exempts equity that \"Is less than\" the indexed amount; 42 U.S.C. 1396p(f)(1)(A)'s \"exceeds\" sets the federal floor of the disqualification, and the state text is the more restrictive reading at the single boundary value. The limit is read for long-term care only (OQ-820): § 8.100.5.M.2.a.ii, vi and M.3.f state it in the general ABD resource rules, but 42 U.S.C. 1396p(f) is a long-term care rule; the other § 8.100.5.M.2.a rules on the home are ma_home_is_countable_resource (CO-4622)."
derived: [all, [">=", home_equity, ma_home_equity_limit], [not, ma_spouse_or_qualifying_child_lives_in_home]]
sources: [S645, S369, S370]
open: [OQ-820]
implemented: engine
tags: [ma, ltc, resources, legal]
rationale: "No existing item tests the home equity disqualification. ma_ltc_financially_eligible (CO-651) and ma_ltc_eligibility_status (CO-652) need it. The target household's p1 (home equity 210000, well under any plausible limit, and a community spouse living there) is the worked example in the batch report. History moved from the precision note (HCPF review S-14): Phase 7 fix round (N-2): equity equal to the limit disqualifies (\">=\"), because § 8.100.5.M.2.a.ii exempts equity that \"Is less than\" the indexed amount; 42 U.S.C. 1396p(f)(1)(A)'s \"exceeds\" sets the federal floor of the disqualification, and the state text is the more restrictive reading at the single boundary value. Precision history (moved from precision, engineering follow-up pass task 5): per the phase-4 review's C-20 finding."
tests:
  - {id: CO-650-T1, as_of: "2026-10-01", given: {home_equity: 900000, ma_spouse_or_qualifying_child_lives_in_home: false}, expect: true}
  - {id: CO-650-T2, as_of: "2026-10-01", given: {home_equity: 900000, ma_spouse_or_qualifying_child_lives_in_home: true}, expect: false}
  - {id: CO-650-T3, as_of: "2026-10-01", given: {home_equity: 210000, ma_spouse_or_qualifying_child_lives_in_home: false}, expect: false}
  - {id: CO-650-T4, as_of: "2026-10-01", title: "Phase 7 fix round (N-2): equity exactly at the 2026 limit of 752,000", given: {home_equity: 752000, ma_spouse_or_qualifying_child_lives_in_home: false}, expect: true}
