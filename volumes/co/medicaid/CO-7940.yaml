id: CO-7940
name: "Medicaid: the Social Security the disabled widow(er) test disregards"
identifier: ma_disabled_widow_disregarded_social_security_receipts
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The person's current Social Security of the month that the disabled widow(er) group's SSI test disregards (10 CCR 2505-10 § 8.100.6.I, S625; 42 U.S.C. 1383c(d)(2) (S3416) deems the group SSI recipients 'for so long as such person (i) would be eligible for such supplemental security income benefits ... in the absence of benefits described in paragraph (1)(A)', and (1)(A) describes benefits 'under subsection (e) or (f) of section 402 of this title (or under any other subsection of section 402 of this title if such person is also eligible for benefits under such subsection (e) or (f))'): each receipt of kind social_security other than a retroactive payment, counted as the SSI method counts the current benefit (ma_ssi_counted_social_security_receipts, CO-6250: its amount less a plan-for-self-support set-aside, placed by its month, date or stream dates), whose title_ii_benefit_type (a field of the receipt, CO-5000) is a benefit under 42 U.S.C. 402: retirement_or_survivor, disabled_adult_child or disabled_widow (S5361). A disability insurance benefit on the person's own record (own_disability) is a benefit under 42 U.S.C. 423 (S5362), not one (1)(A) describes, and stays counted."
precision: "NM-KL-2 (2026-11-24; docs/reviews/known-limits.md; coverage pass 7, non-MAGI F7-10): the group read ma_dac_countable_income (CO-1160), which disregards every current Social Security receipt, the Disabled Adult Child test's reading of § 8.100.6.J.1.c.i ('the current OASDI income', S626). A widow(er) in the group is eligible for widow(er)'s benefits under 402(e) or (f), so (1)(A)'s parenthetical reaches every benefit she receives under another subsection of 402 too; it does not reach section 423. The field is read only for a Social Security receipt and only here, after the group's other conditions (ma_disabled_widow_eligible, CO-1162, then ma_disabled_widow_meets_ssi_income_test, CO-7943, only when the SSI income test is not met without it), so it is required where read (decision 4 of 2026-11-23) and asked of no other person."
derived: [sum_receipts, receipts, [all, [received_in, [month]], [any, [not, [unknown, [receipt, month]]], [all, [any, [unknown, [receipt, start_date]], ["<=", [month_of, [receipt, start_date]], [month]]], [any, [unknown, [receipt, end_date]], [">=", [month_of, [receipt, end_date]], [month]]]]], ["=", [receipt, kind], social_security], [not, [receipt, retroactive]], [not, ["=", [receipt, title_ii_benefit_type], own_disability]]], [max, 0, ["-", [receipt, amount], [receipt, pass_set_aside]]]]
sources: [S3416, S5361, S5362, S625, S3404, S4940]
implemented: engine
tags: [ma, non_magi, income]
nearest: [CO-6250]
rationale: "NM-KL-2 (F7-10): the disabled widow(er) test disregarded the person's own disability insurance benefit with the widow(er)'s benefit; a widow of 58 with her own benefit of 1,100 and a widow's benefit of 300 was eligible (countable 0) where the statute gives 1,100 - 20 = 1,080 > 994. The receipt's own benefit type states which benefit each payment is."
tests:
  # NM-KL-2, hand-computed from 42 U.S.C. 1383c(d)(1)(A), (2) (S3416), 402 (S5361) and 423 (S5362).
  - {id: CO-7940-T1, month: "2026-11", as_of: "2026-11-12", title: "NM-KL-2: her own disability benefit 1,100 (423) and a widow's benefit 300 (402(e)): 300", given: {receipts: [{kind: social_security, amount: 1100, title_ii_benefit_type: own_disability}, {kind: social_security, amount: 300, title_ii_benefit_type: disabled_widow}]}, expect: 300}
  - {id: CO-7940-T2, month: "2026-11", as_of: "2026-11-12", title: "NM-KL-2: a widow's benefit 900 with 100 set aside under a PASS, and a 2,400 retroactive widow's payment in the month: 900 - 100 = 800 (the retroactive payment is not current, F.6.c)", given: {receipts: [{kind: social_security, amount: 900, pass_set_aside: 100, title_ii_benefit_type: disabled_widow}, {kind: social_security, amount: 2400, frequency: once, retroactive: true, month: "2026-11", title_ii_benefit_type: disabled_widow}]}, expect: 800}
  - {id: CO-7940-T3, month: "2026-11", as_of: "2026-11-12", title: "NM-KL-2: a childhood disability benefit 500 (402(d)) and a widow's benefit 400: both are 402 benefits of a person eligible under 402(e), 900", given: {receipts: [{kind: social_security, amount: 500, title_ii_benefit_type: disabled_adult_child}, {kind: social_security, amount: 400, title_ii_benefit_type: disabled_widow}]}, expect: 900}
  - {id: CO-7940-T4, month: "2026-11", as_of: "2026-11-12", title: "NM-KL-2: a Social Security receipt that does not state its benefit type: cannot determine (required where read, decision 4)", given: {receipts: [{kind: social_security, amount: 1100}]}, expect: unknown}
  - {id: CO-7940-T5, month: "2026-11", as_of: "2026-11-12", title: "NM-KL-2: a pension 700 and no Social Security: 0 (the field is read only for Social Security)", given: {receipts: [{kind: pension, amount: 700}]}, expect: 0}
