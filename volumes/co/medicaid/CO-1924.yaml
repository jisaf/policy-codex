id: CO-1924
name: Is the court-appointed guardian of a dependent child or disabled individual
identifier: ma_is_guardian_of_dependent_child_or_disabled_individual
kind: derived
type: yes/no
scope: person
program: Medicaid
meaning: "Whether the person is a guardian as 42 CFR 435.554(a) defines it: an adult appointed by a court, under Colorado law, to care for and make personal decisions for a dependent child (13 or under, relying on another for care) or a disabled individual (ADA definition) who cannot care for themselves."
precision: "Same-word audit SW-4 (OQ-396): read from the legal_guardian role (a court-appointed guardian), toward a person who is a care recipient as 435.554(a) defines it (ma_community_engagement_is_care_recipient: a dependent child or a disabled individual). Before this pass it was a yes/no the case stated with no ward."
derived: [exists_related, [legal_guardian], [of, [P], ma_community_engagement_is_care_recipient]]
sources: [S1207, S1208]
implemented: engine
tags: [ma, magi]
rationale: "OQ-65: 435.554(c)(3) excludes a guardian. Same-word audit SW-4: now derived from the neutral legal_guardian role, which LEAP and CCCAP read too."
tests:
  - {id: CO-1924-T1, title: "Guardian of a 10-year-old", as_of: "2027-03-01", given: {}, others: {p2: {ma_community_engagement_is_care_recipient: true}}, relationships: [[legal_guardian, p1, p2]], expect: true}
  - {id: CO-1924-T2, title: "Aunt caring for a child, not appointed by a court", as_of: "2027-03-01", given: {}, others: {p2: {ma_community_engagement_is_care_recipient: true}}, relationships: [[other_relative, p1, p2], [has_primary_responsibility_for, p1, p2]], expect: false}
