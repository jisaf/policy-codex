id: CO-546
name: "Medicaid: meets the Pregnant Women MAGI category"
identifier: ma_is_pregnant_category
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether the person meets the Pregnant Women MAGI Medical Assistance category under 10 CCR 2505-10 8.100.4.G.5 - pregnant in the month, with household income at or below ma_magi_income_standard_pregnant, applying the ma_magi_income_disregard_pct income disregard of 42 CFR 435.603(d)(4) and 8.100.4.D as the last step only if income above the plain standard would otherwise make the person ineligible."
precision: "Reads ma_is_pregnant_in_month (CO-3601), so a month before the application in which the person was pregnant (a retroactive month, 10 CCR 2505-10 § 8.100.3.E) is tested as a pregnant month even when the pregnancy has ended by the application; this item does not itself extend coverage through the postpartum period (see ma_postpartum_coverage_end_month, CO-560, and 8.100.4.G.5's coverage-period sentence). Per 42 CFR 435.603(d)(4), the disregard disjunct is gated on ma_magi_income_standard_pregnant being this person's highest standard (ma_magi_highest_income_standard_pct, CO-539); in practice this is always true for a pregnant person, since 185% exceeds every other group's standard, but the gate is stated so the rule does not silently rely on that being permanently true."
derived: [all, ma_is_pregnant_in_month, [any, ["<=", ma_magi_household_income_pct_fpl, ma_magi_income_standard_pregnant], [all, ["=", ma_magi_income_standard_pregnant, ma_magi_highest_income_standard_pct], ["<=", ["-", ma_magi_household_income_pct_fpl, ma_magi_income_disregard_pct], ma_magi_income_standard_pregnant]]]]
sources: [S640, S165, S168]
implemented: engine
tags: [ma, magi, income]
rationale: "No existing item states the Pregnant-Women-category test. ma_magi_category (CO-551) needs it, listed after the Children's category per the phase-3 brief's mandatory-group ordering. Fix round: gated the disregard disjunct on ma_magi_highest_income_standard_pct (CO-539) per the phase-3 review's C-2 finding. Precision history (moved from precision, engineering follow-up pass task 5): (ma_magi_highest_income_standard_pct, CO-539, fix round); the phase-3 review's C-2 finding. Final verification F-1 (2026-11-22): reads ma_is_pregnant_in_month (CO-3601) in place of the current-status is_pregnant, so a retroactive month before a birth or other end of pregnancy is a pregnant month (§ 8.100.3.E.1-2, S1503, S2411; 42 U.S.C. 1396a(e)(16), S224)."
tests:
  - {id: CO-546-T1, as_of: "2026-10-01", month: "2026-10", given: {is_pregnant: true, ma_magi_household_income_pct_fpl: 1.90, ma_magi_highest_income_standard_pct: 1.95}, expect: true}
  - {id: CO-546-T2, as_of: "2026-10-01", month: "2026-10", given: {is_pregnant: true, ma_magi_household_income_pct_fpl: 1.99, ma_magi_highest_income_standard_pct: 1.95}, expect: true}
  - {id: CO-546-T3, as_of: "2026-10-01", month: "2026-10", given: {is_pregnant: true, ma_magi_household_income_pct_fpl: 2.05, ma_magi_highest_income_standard_pct: 1.95}, expect: false}
  - {id: CO-546-T4, as_of: "2026-10-01", month: "2026-10", given: {is_pregnant: false, ma_magi_household_income_pct_fpl: 0.50, ma_magi_highest_income_standard_pct: 1.95}, expect: false}
