id: CO-1185
name: "Medicaid: months over which lottery or gambling winnings are spread"
identifier: ma_lottery_winnings_spread_months
kind: derived
type: whole number
scope: person-month
program: Medicaid
meaning: "The number of months over which the lottery or gambling winnings the person received this month are divided equally and counted as MAGI income - 42 U.S.C. 1396a(e)(14)(K)(i) and 10 CCR 2505-10 § 8.100.4.C.1.b.xiv.1-3: one month (the month received) for winnings less than ma_lottery_winnings_spread_floor ($80,000); two months from it up to the next ma_lottery_winnings_spread_increment ($90,000); and one more month for each further whole ma_lottery_winnings_spread_increment, at most ma_lottery_winnings_spread_max_months. Read [at] the month of each receipt (CO-1187)."
precision: "Computed as 2 plus the number of whole $10,000 increments in the amount above $80,000 (the floor written -ceil(-x)): under $80,000 one month; $80,000 to $89,999.99 two; $90,000 to $99,999.99 three; $100,000 to $109,999.99 four (\"3 months plus 1 additional month for each increment of $10,000\", (K)(i)(IV)); $1,260,000 or more 120. Colorado's \"over $79,999 but less than $89,999\" and \"For every additional $10,000 over $89,999\" (S669) agree with the federal bands at whole dollars; between them (for example $89,999.50, \"over $89,999\" in Colorado's words and under $90,000 in the statute's) the statute governs (statute_override). Time audit T-4: the rule had compared with $79,999 and counted each started $10,000 above it, which matched only at whole dollars, so $79,999.50 was spread over two months and $89,999.50 over three (CO-535). OQ-216."
statute_override: "Federal law overrides 10 CCR 2505-10 § 8.100.4.C.1.b.xiv.1-3 in two ways. The band edges are the statute's $80,000, $90,000 and $100,000 with \"less than\" (42 U.S.C. 1396a(e)(14)(K)(i)(I)-(IV)), not Colorado's $79,999 and $89,999, so winnings between a Colorado figure and the next whole thousand (for example $89,999.50) fall in the lower federal band. And Colorado adds a month for every further $10,000 without limit, while (K)(i)(IV), in force for lotteries from January 1, 2018, ends the period at 120 months, which winnings of $1,260,000 or more reach (OQ-216, time audit T-4)."
derived: [case, [["<", lottery_gambling_winnings_received, ma_lottery_winnings_spread_floor], 1], [else, [min, ma_lottery_winnings_spread_max_months, ["-", 2, [ceil, [/, ["-", ma_lottery_winnings_spread_floor, lottery_gambling_winnings_received], ma_lottery_winnings_spread_increment]]]]]]
sources: [S669, S1234]
implemented: engine
tags: [ma, magi, income, legal]
rationale: "S-9 of the phase 7 review: the current § 8.100.4.C.1.b.xiv spreads large winnings over months, which ma_person_magi_income (CO-502) did not reflect (its precision counted every lump sum in the month received). No existing item states the number of months. Legal UX walkthrough L3 (audit fix round 4): the departure from the rule text now carries its statute_override note. Tagged legal."
