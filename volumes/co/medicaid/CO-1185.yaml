id: CO-1185
name: "Medicaid: months over which lottery or gambling winnings are spread"
identifier: ma_lottery_winnings_spread_months
kind: derived
type: whole number
scope: person
program: Medicaid
meaning: "The number of months over which the person's lottery or gambling winnings are divided equally and counted as MAGI income - 10 CCR 2505-10 § 8.100.4.C.1.b.xiv.1-3: one month (the month received) for winnings of ma_lottery_winnings_spread_floor or less; two months for winnings over ma_lottery_winnings_spread_floor up to $89,999; and one more month for each further ma_lottery_winnings_spread_increment or part of it."
precision: "Computed as 1 + the number of $10,000 increments (a part increment counting as one) by which the winnings exceed $79,999: $80,000 to $89,999 gives 2 months, $90,000 to $99,999 gives 3, $100,000 to $109,999 gives 4. § 8.100.4.C.1.b.xiv.3's 'for every additional $10,000 over $89,999' is read as each started $10,000 band above $89,999, which matches the federal rule's $10,000 increments; a reading that adds a month only for each full $10,000 over $89,999 would give 2 months up to $99,999 (OQ-216). OQ-216 sweep: the federal thresholds are $80,000, $90,000 and $100,000 with one more month for each $10,000 increment (42 U.S.C. 1396a(e)(14)(K)(i), S1234), which this reading matches at every boundary ($79,999 is one month, $89,999 two, $99,999 three, $100,000 four); Colorado's text states no upper limit, but the statute caps the period at 120 months (ma_lottery_winnings_spread_max_months, reached at $1,260,000)."
derived: [case, [["<=", lottery_gambling_winnings_amount, ma_lottery_winnings_spread_floor], 1], [else, [min, ma_lottery_winnings_spread_max_months, [+, 1, [ceil, [/, ["-", lottery_gambling_winnings_amount, ma_lottery_winnings_spread_floor], ma_lottery_winnings_spread_increment]]]]]]
sources: [S669, S1234]
open: [OQ-216]
implemented: engine
tags: [ma, magi, income]
rationale: "S-9 of the phase 7 review: the current § 8.100.4.C.1.b.xiv spreads large winnings over months, which ma_person_magi_income (CO-502) did not reflect (its precision counted every lump sum in the month received). No existing item states the number of months."
tests:
  - {id: CO-1185-T1, as_of: "2026-10-01", given: {lottery_gambling_winnings_amount: 5000}, expect: 1}
  - {id: CO-1185-T2, as_of: "2026-10-01", given: {lottery_gambling_winnings_amount: 85000}, expect: 2}
  - {id: CO-1185-T3, as_of: "2026-10-01", given: {lottery_gambling_winnings_amount: 89999}, expect: 2}
  - {id: CO-1185-T4, as_of: "2026-10-01", given: {lottery_gambling_winnings_amount: 90000}, expect: 3}
  - {id: CO-1185-T5, as_of: "2026-10-01", given: {lottery_gambling_winnings_amount: 125000}, expect: 6}
  - {id: CO-1185-T6, as_of: "2026-10-01", given: {lottery_gambling_winnings_amount: 79999}, expect: 1}
  - {id: CO-1185-T7, as_of: "2026-10-01", title: "OQ-216: $1,260,000 reaches the 120-month cap", given: {lottery_gambling_winnings_amount: 1260000}, expect: 120}
  - {id: CO-1185-T8, as_of: "2026-10-01", title: "OQ-216: $3,000,000 stays at 120 months", given: {lottery_gambling_winnings_amount: 3000000}, expect: 120}
  - {id: CO-1185-T9, as_of: "2026-10-01", given: {lottery_gambling_winnings_amount: 100000}, expect: 4}
