id: CO-7723
name: "Medicaid: an SSI infant is eligible from the date of birth"
identifier: ma_ssi_infant_eligible_from_birth
kind: derived
type: yes/no
scope: person
program: Medicaid
meaning: "Whether the special provision for infants of 10 CCR 2505-10 § 8.100.6.C.10.a.i makes the person's SSI Medicaid effective from the date of birth: the person receives SSI (receives_ssi, CO-012), the date of birth is within three months of the date the person became eligible for SSI (ssi_eligibility_date, CO-7350: on or before the same day of the third month after the birth), the person was born in a hospital (born_in_hospital, CO-7721), and the disability onset date SSA reports (disability_onset_date, CO-4887) fell in the hospital stay that began at birth: on or after the date of birth, and on or before the discharge (birth_hospital_discharge_date, CO-7722), or the infant is still in that stay (residence_setting_type hospital, entered on the date of birth)."
precision: "C.10.a.i's three conditions, in the order they are read: (3) first, so a person whose birth is not within three months of the SSI eligibility date (every older person) is not asked the place of birth or the stay. 'Within three (3) months of the date on which the infant became eligible for SSI' is read as the eligibility date falling no later than the same day of the third calendar month after the birth month (a birth on the 31st reaches the last day of a shorter third month): the eligibility month before the third month after the birth month, or that month on a day not later than the birth's day of the month. 'Occurred during the infant's hospital stay' is the stay that began at birth, from the date of birth through the discharge date, both days included. The effect, read by ma_receives_ssi_in_month (CO-7351), is an SSI month from the birth month (§ 8.100.5.C.1: effective the first day of the month the person becomes eligible) before the month of the SSI eligibility date."
derived: [all, receives_ssi, [any, ["<", [month_of, ssi_eligibility_date], [months_after, 3, [month_of, date_of_birth]]], [all, ["=", [month_of, ssi_eligibility_date], [months_after, 3, [month_of, date_of_birth]]], ["<=", [days_between, [first_day, [month_of, ssi_eligibility_date]], ssi_eligibility_date], [days_between, [first_day, [month_of, date_of_birth]], date_of_birth]]]], born_in_hospital, [">=", disability_onset_date, date_of_birth], [any, [all, ["=", residence_setting_type, hospital], ["=", institution_entry_date, date_of_birth]], ["<=", disability_onset_date, birth_hospital_discharge_date]]]
sources: [S5245, S5030, S3900]
implemented: engine
tags: [ma, non_magi, disability]
rationale: "Coverage pass 7, non-MAGI F7-7 (INFANT-SSI, stored household CO-1107): no item read § 8.100.6.C.10.a, so an infant born in a hospital with the onset during the stay was an SSI recipient only from the month of the SSI eligibility date, and the birth month fell to the SSI-related tests with the parents' income deemed."
tests:
  # Coverage pass 7 F7-7, hand-computed from § 8.100.6.C.10.a.i (S5245). Born 2026-08-10 in a hospital, SSA's onset 2026-08-10, discharged 2026-08-25, SSI eligible from 2026-09-01: 2026-09 is before 2026-11 (three months after August): within three months; onset 2026-08-10 is in 2026-08-10 to 2026-08-25: true.
  - {id: CO-7723-T1, as_of: "2026-11-12", title: "F7-7: all three conditions: true", given: {receives_ssi: true, date_of_birth: "2026-08-10", ssi_eligibility_date: "2026-09-01", born_in_hospital: true, disability_onset_date: "2026-08-10", birth_hospital_discharge_date: "2026-08-25", residence_setting_type: private_dwelling}, expect: true}
  - {id: CO-7723-T2, as_of: "2026-11-12", title: "F7-7: onset 2026-08-30, after the discharge on 2026-08-25: false", given: {receives_ssi: true, date_of_birth: "2026-08-10", ssi_eligibility_date: "2026-09-01", born_in_hospital: true, disability_onset_date: "2026-08-30", birth_hospital_discharge_date: "2026-08-25", residence_setting_type: private_dwelling}, expect: false}
  - {id: CO-7723-T3, as_of: "2026-11-12", title: "F7-7: born at home: false", given: {receives_ssi: true, date_of_birth: "2026-08-10", ssi_eligibility_date: "2026-09-01", born_in_hospital: false, disability_onset_date: "2026-08-10", residence_setting_type: private_dwelling}, expect: false}
  # Condition 3 at its boundary: born 2026-08-10, three months later is 2026-11-10. Eligible 2026-11-10: same month, day 10 <= 10: within; 2026-11-11: day 11 > 10: not; 2026-12-01: after the month: not.
  - {id: CO-7723-T4, as_of: "2026-12-15", title: "F7-7: SSI eligible on 2026-11-10, exactly three months after the birth: true", given: {receives_ssi: true, date_of_birth: "2026-08-10", ssi_eligibility_date: "2026-11-10", born_in_hospital: true, disability_onset_date: "2026-08-12", birth_hospital_discharge_date: "2026-08-25", residence_setting_type: private_dwelling}, expect: true}
  - {id: CO-7723-T5, as_of: "2026-12-15", title: "F7-7: SSI eligible on 2026-11-11, a day past three months: false, and the place of birth is not asked", given: {receives_ssi: true, date_of_birth: "2026-08-10", ssi_eligibility_date: "2026-11-11"}, expect: false}
  - {id: CO-7723-T6, as_of: "2026-12-15", title: "F7-7: SSI eligible from 2026-12-01: false", given: {receives_ssi: true, date_of_birth: "2026-08-10", ssi_eligibility_date: "2026-12-01"}, expect: false}
  # Still in the hospital stay that began at birth (in a hospital since the date of birth), no discharge date: the onset 2026-09-20 is during the stay.
  - {id: CO-7723-T7, as_of: "2026-11-12", title: "F7-7: still in the birth hospital stay, onset 2026-09-20: true", given: {receives_ssi: true, date_of_birth: "2026-08-10", ssi_eligibility_date: "2026-10-01", born_in_hospital: true, disability_onset_date: "2026-09-20", residence_setting_type: hospital, institution_entry_date: "2026-08-10"}, expect: true}
  - {id: CO-7723-T8, as_of: "2026-11-12", title: "F7-7: discharged, the date not stated: cannot determine (decision 4)", given: {receives_ssi: true, date_of_birth: "2026-08-10", ssi_eligibility_date: "2026-10-01", born_in_hospital: true, disability_onset_date: "2026-09-20", residence_setting_type: private_dwelling}, expect: unknown}
  - {id: CO-7723-T9, as_of: "2026-11-12", title: "F7-7: a 40-year-old SSI recipient: condition 3 fails, nothing else asked", given: {receives_ssi: true, date_of_birth: "1986-03-12", ssi_eligibility_date: "2026-10-01"}, expect: false}
