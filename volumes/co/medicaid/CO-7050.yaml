id: CO-7050
name: "Medicaid: children a pregnant member is expected to deliver, counted in the month"
identifier: ma_expected_children_in_month
kind: derived
type: whole number
scope: person-month
program: Medicaid
meaning: "For a person pregnant at some time in the month (ma_is_pregnant_in_month, CO-3601), the number of children 10 CCR 2505-10 § 8.100.4.E.2 and 42 CFR 435.603(b) add to her in a MAGI family size for that month: the children she is expected to deliver in that pregnancy (expected_number_of_children), less the children she gave birth to in the month who are persons of the case, since each of them is counted in the household as a person from the month of birth; never below 0. 0 in a month she is not pregnant."
precision: "Coverage pass 5, C5-02 (2026-11-23). E.2 counts a pregnant woman as \"herself plus the number of children she is expected to deliver\"; the size is taken for each month (C4-08), so the pregnancy is the month's: a retroactive month in which she was pregnant counts her expected children although the pregnancy has ended by the determination, and a retroactive month before the pregnancy began counts none. In the month of a birth she was pregnant on some day of it (§ 8.100.4.G.1, S3351: eligibility on any day of a month is eligibility for the whole month), and the child born that month is also a person of the case: on a day before the birth the family is herself plus the expected child, on a day after it herself plus the child, so the child is counted once, as itself. A child she gave birth to is read by the gave_birth_to relationship (the fact of birth a newborn's case states); a delivered child who is not a person of the case is not subtracted. The relationships not stated: unknown (decision 4)."
derived: [case, [[not, ma_is_pregnant_in_month], 0], [else, [max, 0, ["-", expected_number_of_children, [count, [filter, [persons], [all, [rel, [gave_birth_to], [P]], ["=", [month_of, [of, [P], date_of_birth]], [month]]]]]]]]]
sources: [S170, S161, S3351, S640]
implemented: engine
tags: [ma, magi, household]
nearest: [CO-501, CO-3601]
rationale: "Coverage pass 5, C5-02 (docs/reviews/coverage5-medicaid-magi-chp.md): ma_magi_household_size (CO-501) added a pregnant member's expected children by is_pregnant, the pregnancy on the determination date, in every month, so a woman whose pregnancy ended before she applied was a family of one in the retroactive months she was pregnant (PG-RETRO-ENDED: 225.6%, ineligible_income, where 166.4% for two makes her eligible), and one who became pregnant after them was a family of two in months before the pregnancy (PG-RETRO-LATER). Reading the month's pregnancy needs the birth month handled, or a child born that month who is a person of the case would be counted twice."
tests:
  - {id: CO-7050-T1, as_of: "2026-11-10", month: "2026-09", title: "C5-02 (PG-RETRO-ENDED): pregnant in September, one child expected, the pregnancy ended 2026-09-20 with no child in the case: 1", given: {ma_is_pregnant_in_month: {"2026-09": true}, expected_number_of_children: 1}, relationships: [], expect: 1}
  - {id: CO-7050-T2, as_of: "2026-11-10", month: "2026-08", title: "C5-02 (PG-RETRO-LATER): not pregnant in August (the pregnancy began 2026-10-01): 0", given: {ma_is_pregnant_in_month: {"2026-08": false}, expected_number_of_children: 1}, relationships: [], expect: 0}
  - {id: CO-7050-T3, as_of: "2026-11-10", month: "2026-10", title: "C5-02: the birth month: one child expected, born 2026-10-15 and a person of the case: 1 - 1 = 0 (the child counts as itself)", given: {ma_is_pregnant_in_month: {"2026-10": true}, expected_number_of_children: 1}, others: {p2: {date_of_birth: "2026-10-15"}}, relationships: [[gave_birth_to, p1, p2]], expect: 0}
  - {id: CO-7050-T4, as_of: "2026-11-10", month: "2026-09", title: "C5-02: the month before the birth: the child, born 2026-10-15, is not born yet: 1 - 0 = 1", given: {ma_is_pregnant_in_month: {"2026-09": true}, expected_number_of_children: 1}, others: {p2: {date_of_birth: "2026-10-15"}}, relationships: [[gave_birth_to, p1, p2]], expect: 1}
  - {id: CO-7050-T5, as_of: "2026-11-10", month: "2026-10", title: "C5-02: twins expected, one born 2026-10-15 in the case: 2 - 1 = 1", given: {ma_is_pregnant_in_month: {"2026-10": true}, expected_number_of_children: 2}, others: {p2: {date_of_birth: "2026-10-15"}}, relationships: [[gave_birth_to, p1, p2]], expect: 1}
  - {id: CO-7050-T6, as_of: "2026-11-10", month: "2026-10", title: "C5-02: pregnant in the month but the expected number not stated: unknown (decision 4)", given: {ma_is_pregnant_in_month: {"2026-10": true}}, relationships: [], expect: unknown}
