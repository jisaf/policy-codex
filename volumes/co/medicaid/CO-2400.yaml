id: CO-2400
name: "Medicaid: is in a status category for which federal payment is available from October 2026"
identifier: ma_is_in_federal_payment_status_category
kind: derived
type: yes/no
scope: person
program: Medicaid
meaning: "Whether the person is one of the individuals for whom 42 U.S.C. 1396b(v)(5)(B) (Pub. L. 119-21 sec. 71109(a)) allows federal payment for full Medical Assistance from October 1, 2026: a citizen or national of the United States (i), a lawful permanent resident (ii), a Cuban and Haitian entrant (iii), or a Compact of Free Association migrant (iv). Refugees, asylees, parolees, trafficking victims and the other qualified non-citizens who are not lawful permanent residents are not in it (CMS SHO #26-001)."
precision: "The rule is in force from October 1, 2026 (its effective range); on an earlier determination date it states nothing, and ma_meets_citizenship_requirement (CO-509) does not read it. Residence in a State, 1396b(v)(5)(A), is tested separately by ma_meets_residency. The paragraph (2) emergency services and paragraph (4) lawfully residing children and pregnant women exceptions are not part of this test: CO-509 keeps its 8.100.3.G.1.g.vii arm for (4), and emergency Medicaid (CO-510, CO-1151) reads the failure of CO-509 for (2)."
derived: [any, is_us_citizen_or_national, [in, citizenship_status, [lawful_permanent_resident, cuban_haitian_entrant, compact_of_free_association_migrant]]]
sources: [S1700, S1702, S1703]
effective: {from: "2026-10-01", to: present}
implemented: engine
tags: [ma, immigration, legal]
open: [OQ-510, OQ-518]
rationale: B-1 of the HCPF review. No existing item names the four 1396b(v)(5)(B) categories; is_qualified_non_citizen (CO-506) is the wider 8 U.S.C. 1641(b) list, and the SNAP list under the amended 7 U.S.C. 2015(f) (snap_is_eligible_non_citizen, CO-308) is another program's rule, so it is not reused (vocabulary review rule 3). A refugee or asylee who has adjusted to lawful permanent residence is recorded as lawful_permanent_resident in citizenship_status (CO-002) and is in the category.
