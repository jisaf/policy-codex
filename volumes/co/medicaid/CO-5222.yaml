id: CO-5222
name: "Medicaid: parental income deemed to a Pickle child"
identifier: ma_pickle_parental_income_deemed
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: "The income of this child's ineligible parents deemed to the child for the Pickle test (10 CCR 2505-10 §§ 8.100.6.D-E; 20 CFR 416.1165(d)-(e)), as ma_ssi_parental_income_deemed (CO-4626) deems it but from the Pickle parental income to be deemed (ma_pickle_parental_income_to_be_deemed: the parents' countable income with their OASDI cost-of-living increases since the child lost SSI disregarded, § 8.100.6.E.3, less the Ineligible Parent(s) Allocation), divided among the blind or disabled children sharing it so that no child is deemed more than reduces its SSI benefit to zero (416.1165(e)(2)-(3)): this child, if its share would reduce its benefit to zero (ma_pickle_deeming_share_zeroes_benefit), is deemed its Pickle limit (ma_pickle_deeming_benefit_zero_amount); otherwise what is left after each other child whose limit binds is given its limit is divided equally among this child and the other children whose limit does not bind. Zero when no parent's income is deemed."
precision: "Duplicate-paths audit D-M3 (P1, fixed): before, this item kept the equal division CO-4626 made before the 416.1165(e)(3) fill-up of 2026-11-23, so a Pickle child sharing deemed income with another disabled child was deemed its equal share even where the other child's share reduced that child's benefit to zero and passed the rest on. Each other child's limit is its SSI-related one (CO-5902); this child's is its Pickle limit, figured from its own Pickle income (CO-6056, CO-6057), so only this child's income is read with the Pickle disregard. Whether another child's limit binds is read from that child's own sum at its limit (ma_ssi_deeming_limit_sum, CO-6059) with this child's term changed from its SSI-related limit to its Pickle limit. This child is told from the other children as the one member of its own SSI household (ma_ssi_couple_members: a child to whom parental income is deemed is unmarried, 20 CFR 416.1856), as CO-4626 reads this child among the children."
derived: [case, [["=", [count, ma_ssi_deeming_parents], 0], 0], [ma_pickle_deeming_share_zeroes_benefit, ma_pickle_deeming_benefit_zero_amount], [else, ["/", ["-", ma_pickle_parental_income_to_be_deemed, [sum, [filter, ma_ssi_deeming_children, [all, [not, [in_group, [P], ma_ssi_couple_members]], ["<", ["+", ["-", [of, [P], ma_ssi_deeming_limit_sum], [min, ma_ssi_deeming_benefit_zero_amount, [of, [P], ma_ssi_deeming_benefit_zero_amount]]], [min, ma_pickle_deeming_benefit_zero_amount, [of, [P], ma_ssi_deeming_benefit_zero_amount]]], ma_pickle_parental_income_to_be_deemed]]], [of, [P], ma_ssi_deeming_benefit_zero_amount]]], [max, 1, [count, [filter, ma_ssi_deeming_children, [any, [in_group, [P], ma_ssi_couple_members], [not, ["<", ["+", ["-", [of, [P], ma_ssi_deeming_limit_sum], [min, ma_ssi_deeming_benefit_zero_amount, [of, [P], ma_ssi_deeming_benefit_zero_amount]]], [min, ma_pickle_deeming_benefit_zero_amount, [of, [P], ma_ssi_deeming_benefit_zero_amount]]], ma_pickle_parental_income_to_be_deemed]]]]]]]]]
sources: [S3405, S3413, S3415, S666]
implemented: engine
tags: [ma, non_magi, income, household]
rationale: "Coverage review NM-17 (parent half) and the Pickle child under 18 with ineligible parents, deferred P2s (fix round 2026-11-23): added to the Pickle countable income (CO-1158), which had counted no deemed parental income for a child. Duplicate-paths audit D-M3 (P1): the fill-up carried to the Pickle copy, as the handoff of 2026-11-23 asked once the Pickle income was split into own and deemed parts (CO-6056, CO-6057): two disabled children sharing 2,000 of deemed parental income, one child's benefit reaching zero at 300, are deemed 300 and 1,014 (each its limit), where the equal division gave 1,000 each."
nearest: [CO-4626]
siblings: [{id: CO-4626, reason: "the same 416.1165(e)(2)-(3) division over the Pickle parental income (CO-6060), this child's limit its Pickle limit (CO-6058); every other term must stay the same"}]
tests:
  - {id: CO-5222-T1, as_of: "2026-10-12", month: "2026-10", title: "One parent, 2,207.5 countable less the individual FBR 994: 1,213.5", given: {ma_ssi_deeming_parents: [p2], ma_pickle_deeming_parents_countable_income: 2207.5, ma_ssi_deeming_children: [p1]}, others: {}, relationships: [], expect: 1213.5}
  - {id: CO-5222-T2, as_of: "2026-10-12", month: "2026-10", title: "Duplicate-paths audit D-M3 (household MA-pickle-fill-up), p1: 2,994 - 994 = 2,000 to deem; limits 300 (p1) and 1,014 (p3); 300 + 300 < 2,000, so p1 is deemed its limit, 300 (the equal division gave 1,000)", given: {ma_ssi_deeming_parents: [p2], ma_ssi_deeming_children: [p1, p3], is_blind: false, meets_ssa_disability_criteria: true, ma_ssi_parental_income_to_be_deemed: 2000, ma_ssi_deeming_benefit_zero_amount: 300, ma_pickle_deeming_benefit_zero_amount: 300, ma_pickle_deeming_parents_countable_income: 2994}, others: {p2: {}, p3: {ma_ssi_deeming_parents: [p2], ma_ssi_deeming_children: [p1, p3], is_blind: false, meets_ssa_disability_criteria: true, ma_ssi_parental_income_to_be_deemed: 2000, ma_ssi_deeming_benefit_zero_amount: 1014, ma_pickle_deeming_benefit_zero_amount: 1014, ma_pickle_deeming_parents_countable_income: 2994}}, relationships: [[parent, p2, p1], [parent, p2, p3]], expect: 300}
  - {id: CO-5222-T3, as_of: "2026-10-12", month: "2026-10", title: "Duplicate-paths audit D-M3, p3: min(300, 1,014) + 1,014 = 1,314 < 2,000, so p3 is deemed its limit, 1,014 (the equal division gave 1,000); as the SSI-related division (CO-4626)", given: {ma_ssi_deeming_parents: [p2], ma_ssi_deeming_children: [p1, p3], is_blind: false, meets_ssa_disability_criteria: true, ma_ssi_parental_income_to_be_deemed: 2000, ma_ssi_deeming_benefit_zero_amount: 1014, ma_pickle_deeming_benefit_zero_amount: 1014, ma_pickle_deeming_parents_countable_income: 2994}, others: {p2: {}, p3: {ma_ssi_deeming_parents: [p2], ma_ssi_deeming_children: [p1, p3], is_blind: false, meets_ssa_disability_criteria: true, ma_ssi_parental_income_to_be_deemed: 2000, ma_ssi_deeming_benefit_zero_amount: 300, ma_pickle_deeming_benefit_zero_amount: 300, ma_pickle_deeming_parents_countable_income: 2994}}, relationships: [[parent, p2, p1], [parent, p2, p3]], expect: 1014}
  - {id: CO-5222-T4, as_of: "2026-10-12", month: "2026-10", title: "Duplicate-paths audit D-M3: 1,000 to deem (1,994 - 994): p1's limit binds (300 + 300 = 600 < 1,000), p3's does not (300 + 1,014 = 1,314): p3 is deemed (1,000 - 300) / 1 = 700", given: {ma_ssi_deeming_parents: [p2], ma_ssi_deeming_children: [p1, p3], is_blind: false, meets_ssa_disability_criteria: true, ma_ssi_parental_income_to_be_deemed: 2000, ma_ssi_deeming_benefit_zero_amount: 1014, ma_pickle_deeming_benefit_zero_amount: 1014, ma_pickle_deeming_parents_countable_income: 1994}, others: {p2: {}, p3: {ma_ssi_deeming_parents: [p2], ma_ssi_deeming_children: [p1, p3], is_blind: false, meets_ssa_disability_criteria: true, ma_ssi_parental_income_to_be_deemed: 2000, ma_ssi_deeming_benefit_zero_amount: 300, ma_pickle_deeming_benefit_zero_amount: 300, ma_pickle_deeming_parents_countable_income: 1994}}, relationships: [[parent, p2, p1], [parent, p2, p3]], expect: 700}
