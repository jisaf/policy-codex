id: CO-1408
name: "Medicaid: requires verification of age"
identifier: ma_requires_verification_of_age
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether the person's age must be verified for Medical Assistance: age may be declared unless questionable, and not where documentation is not reasonably available (the case-by-case special-circumstances exception)."
derived: [all, ma_verification_is_applicable, age_attestation_is_questionable, [not, documentation_not_reasonably_available]]
sources: [S2103, S842, S863, S839]
implemented: engine
tags: [verification, ma, age]
rationale: "No existing item states this Medical Assistance verification requirement; the phase-9 chapter needs one item per element so the person's pending counts and status can be derived. Heavier-definitions audit H-13 (audit fix round 4): applies only to a person for whom coverage is requested (ma_verification_is_applicable, CO-3157); a member who only appears on the application owes no age document."
tests:
  - {id: CO-1408-T1, month: "2026-10", as_of: "2026-10-01", given: {is_requesting_health_coverage: true, age_attestation_is_questionable: true, documentation_not_reasonably_available: false}, expect: true}
  - {id: CO-1408-T2, month: "2026-10", as_of: "2026-10-01", given: {age_attestation_is_questionable: false}, expect: false}
  - {id: CO-1408-T9, month: "2026-10", as_of: "2026-10-01", title: "H-13: a parent on the application who requests no coverage for herself", given: {is_requesting_health_coverage: false, age_attestation_is_questionable: true, documentation_not_reasonably_available: false}, expect: false}
