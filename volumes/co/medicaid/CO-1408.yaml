id: CO-1408
name: "Medicaid: requires verification of age"
identifier: ma_requires_verification_of_age
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether the person's age must be verified for Medical Assistance: age may be declared unless questionable, and not where documentation is not reasonably available (the case-by-case special-circumstances exception)."
derived: [all, age_attestation_is_questionable, [not, documentation_not_reasonably_available]]
sources: [S842, S863, S839]
implemented: engine
tags: [verification, ma, age]
rationale: No existing item states this Medical Assistance verification requirement; the phase-9 chapter needs one item per element so the person's pending counts and status can be derived.
tests:
  - {id: CO-1408-T1, month: "2026-10", as_of: "2026-10-01", given: {age_attestation_is_questionable: true, documentation_not_reasonably_available: false}, expect: true}
  - {id: CO-1408-T2, month: "2026-10", as_of: "2026-10-01", given: {age_attestation_is_questionable: false}, expect: false}
