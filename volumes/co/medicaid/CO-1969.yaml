id: CO-1969
name: "Medicaid community engagement: mandatory exception for the month"
identifier: ma_meets_community_engagement_mandatory_exception
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether the person is deemed to have demonstrated community engagement for the month under 42 CFR 435.553: for part or all of the month the person was under ma_community_engagement_child_age_limit (CO-3027), entitled to or enrolled in Medicare, described in a mandatory group of 1902(a)(10)(A)(i)(I)-(VII), or a specified excluded individual; or at any point in the ma_community_engagement_inmate_lookback_months before the month the person was an inmate of a public institution."
precision: "Under the age limit for part of the month: the person is under it on the first day of the month. The inmate period is read as the whole months before the month; an inmate in the month itself is a specified excluded individual (435.554(c)(9))."
derived: [any, ["<", [years_between, date_of_birth, [first_day, [month]]], ma_community_engagement_child_age_limit], is_medicare_entitled_or_enrolled, ma_is_described_in_mandatory_group_i_to_vii, ma_is_specified_excluded_individual, [some_month, [months_ending, ma_community_engagement_inmate_lookback_months, [month_before, [month]]], is_inmate_of_public_institution]]
sources: [S1206]
implemented: engine
tags: [ma, magi, age]
rationale: "OQ-65: the mandatory exceptions apply month by month within the look-back."
tests:
  - {id: CO-1969-T1, month: "2027-02", as_of: "2027-03-01", given: {date_of_birth: "2008-02-10"}, title: "Turned 19 on 2027-02-10: under 19 for part of the month", expect: true}
  - {id: CO-1969-T2, month: "2027-02", as_of: "2027-03-01", given: {date_of_birth: "1990-01-01", is_medicare_entitled_or_enrolled: false, ma_is_described_in_mandatory_group_i_to_vii: false, ma_is_specified_excluded_individual: false, is_inmate_of_public_institution: {"2026-11": true, "2026-12": true, "2027-01": false}}, title: "Released from jail in December", expect: true}
  - {id: CO-1969-T3, month: "2027-02", as_of: "2027-03-01", given: {date_of_birth: "1990-01-01", is_medicare_entitled_or_enrolled: false, ma_is_described_in_mandatory_group_i_to_vii: false, ma_is_specified_excluded_individual: false, is_inmate_of_public_institution: {"2026-11": false, "2026-12": false, "2027-01": false}}, title: "No exception", expect: false}
