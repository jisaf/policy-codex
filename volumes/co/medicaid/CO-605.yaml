id: CO-605
name: "Medicaid: SSI-related countable earned income"
identifier: ma_ssi_countable_earned_income
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: This person's (and, if living together, their spouse's) combined gross earned income for the month, after the ssi_earned_income_exclusion earned income exclusion, the unused portion of the ssi_general_income_exclusion general income exclusion carried over from unearned income, and the one-half remainder disregard of 20 CFR 416.1112(c), 416.1124(c)(12) and 10 CCR 2505-10 8.100.5.H.4.b.
precision: "Combines wages_gross across ma_ssi_household_size's spouse-living-together group (8.100.5.H.1.a's \"mutually available\" rule) before applying one ssi_earned_income_exclusion exclusion, plus any part of the combined group's ssi_general_income_exclusion general exclusion not already used against unearned income (20 CFR 416.1124(c)(12), \"If you have less than $20 of unearned income in a month and you have earned income in that month, we will use the rest of the $20 exclusion to reduce the amount of your countable earned income\"), and one one-half disregard, to the combined total. The unearned-income sum recomputed here to find the unused ssi_general_income_exclusion is the same group sum ma_ssi_countable_unearned_income (CO-606) uses. The Ineligible Child Allocation is deducted first, from an ineligible spouse's unearned income and then from that spouse's earned income (ma_ssi_child_allocation_from_spouse_earned, CO-2279), and the unused ssi_general_income_exclusion is measured on the unearned income after that allocation (ma_ssi_household_unearned_income_counted, CO-2281). Earned income includes net earnings from self-employment (ma_self_employment_net_earnings, CO-1704), which 8.100.5's earned income list names; it had read wages only. The couple is ma_ssi_couple_members (CO-3626), which reads resides_in_medical_institution (CO-1742) through ma_excluded_from_ssi_household and ma_is_institutionalized_spouse_in_institution, not SNAP's majority-of-meals institution fact. Earned income 20 CFR 416.1112 excludes is subtracted for each member before the exclusions (ma_ssi_excluded_earned_income, CO-2471, read as 0 when not stated). Coverage review NM-7, NM-8: the 20 CFR 416.1112(c) exclusions § 8.100.5.H.4.e incorporates are taken in their order: impairment-related work expenses of a disabled member who is not blind after the $65 and before the one half ((c)(6), ma_ssi_impairment_related_work_expenses, CO-4628), and blind work expenses and earned income set aside under an approved plan to achieve self-support after it ((c)(8)-(9), ma_ssi_earned_income_excluded_after_half, CO-4629). Deeming of a parent's income to an applicant child is ma_ssi_parental_income_deemed (CO-4626), added to unearned income in CO-2281 (OQ-83, resolved)."
derived: [max, 0, ["-", ["*", [max, 0, ["-", [max, 0, ["-", ["-", [sum, ma_ssi_couple_members, [max, 0, ["-", [of, [P], ma_ssi_gross_earned_income], [otherwise, [of, [P], ma_ssi_excluded_earned_income], 0]]]], ma_ssi_child_allocation_from_spouse_earned], ["+", ssi_earned_income_exclusion, [max, 0, ["-", ssi_general_income_exclusion, ma_ssi_household_unearned_income_counted]]]]], ma_ssi_impairment_related_work_expenses]], ssi_earned_income_disregard_rate], ma_ssi_earned_income_excluded_after_half]]
sources: [S308, S309, S310, S1506, S1955, S3412]
implemented: engine
tags: [ma, non_magi, income]
siblings:
  - {id: CO-5901, reason: "the copy with no part of the $20 general exclusion carried to earned income, from which the 416.1165(e)(3) deeming limit works back; every other term must stay the same"}
rationale: "No existing item applies the $65-plus-one-half SSI earned income disregard. ma_ssi_countable_income (CO-607) needs it. Carries the unused part of the $20 general exclusion to earned income per 20 CFR 416.1124(c)(12) (S310), which CO-230's own precision already stated but neither this item nor CO-606 implemented - the phase-4 review's C-9 finding. History moved from the precision note (HCPF review S-14): Vocabulary fix round (R-1): earned income includes net earnings from self-employment (ma_self_employment_net_earnings, CO-1704), which 8.100.5's earned income list names; it had read wages only. Vocabulary fix round (docs/reviews/vocabulary-reuse.md, R-8): reads resides_in_medical_institution (CO-1742), not SNAP's majority-of-meals institution fact. HCPF fix round (OQ-390): earned income 20 CFR 416.1112 excludes is subtracted for each member before the exclusions (ma_ssi_excluded_earned_income, CO-2471, read as 0 when not stated). Same-word audit SW-6: the SSI method treats as spouses two unrelated persons living together who lead people to believe they are married (20 CFR 416.1806(a)(3), S1955), so the holds_out_as_spouse_with role is read beside the legal spouse. Coverage pass 3 C3-1: sums over ma_ssi_couple_members (CO-3626), which keeps a newly admitted spouse in the couple through the admission month (§ 8.100.7.C.2.b) except for the institutionalized spouse's own test (42 U.S.C. 1396r-5(b)(1)); it had filtered on resides_in_medical_institution, which split the couple's incomes from the admission day while the size and resources still read them together. Earned-income records, step E1 (Medicaid and CHP+): earned income is the earnings records the SSI method's counting table counts (ma_ssi_gross_earned_income, CO-5171), replacing wages_gross plus ma_self_employment_net_earnings."
