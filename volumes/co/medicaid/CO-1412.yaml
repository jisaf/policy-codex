id: CO-1412
name: "Medicaid: required verification count"
identifier: ma_required_verification_count
kind: derived
type: whole number
scope: person-month
program: Medicaid
meaning: "The number of verification elements Medical Assistance requires for this person, verified or not: citizenship, identity, every declared immigration status, SSN, income, resources, pregnancy, residency, age, household composition and, for a long-term care applicant, the institutional stay, asset transfers, trust and annuity."
derived: ["+", [case, [ma_requires_verification_of_citizenship, 1], [else, 0]], [case, [ma_requires_verification_of_identity, 1], [else, 0]], [case, [claims_lawful_immigration_status, 1], [else, 0]], [case, [ma_requires_verification_of_ssn, 1], [else, 0]], [case, [ma_requires_verification_of_earned_income, 1], [else, 0]], [case, [ma_requires_verification_of_unearned_income, 1], [else, 0]], [case, [ma_requires_verification_of_resources, 1], [else, 0]], [case, [ma_requires_verification_of_pregnancy, 1], [else, 0]], [case, [ma_requires_verification_of_residency, 1], [else, 0]], [case, [ma_requires_verification_of_age, 1], [else, 0]], [case, [ma_requires_verification_of_household_composition, 1], [else, 0]], [case, [ma_requires_verification_of_institutional_stay, 1], [else, 0]], [case, [ma_is_long_term_care_applicant, 1], [else, 0]], [case, [ma_requires_verification_of_trust, 1], [else, 0]], [case, [ma_requires_verification_of_annuity, 1], [else, 0]]]
sources: [S851, S1085, S1086, S1087]
implemented: engine
tags: [verification, ma]
rationale: ma_verification_status needs to know whether any verification is required at all.
tests:
  - {id: CO-1412-T1, month: "2026-10", as_of: "2026-10-01", given: {ma_requires_verification_of_citizenship: false, ma_requires_verification_of_identity: false, ma_requires_verification_of_ssn: true, ma_requires_verification_of_earned_income: false, ma_requires_verification_of_unearned_income: false, ma_requires_verification_of_resources: false, ma_requires_verification_of_pregnancy: false, ma_requires_verification_of_residency: false, ma_requires_verification_of_age: false, ma_requires_verification_of_household_composition: false, ma_requires_verification_of_institutional_stay: false, ma_is_long_term_care_applicant: false, ma_requires_verification_of_trust: false, ma_requires_verification_of_annuity: false, citizenship_status: lawful_permanent_resident}, expect: 2}
  - {id: CO-1412-T2, month: "2026-10", as_of: "2026-10-01", given: {ma_requires_verification_of_citizenship: true, ma_requires_verification_of_identity: false, ma_requires_verification_of_ssn: false, ma_requires_verification_of_earned_income: false, ma_requires_verification_of_unearned_income: false, ma_requires_verification_of_resources: false, ma_requires_verification_of_pregnancy: false, ma_requires_verification_of_residency: false, ma_requires_verification_of_age: false, ma_requires_verification_of_household_composition: false, ma_requires_verification_of_institutional_stay: true, ma_is_long_term_care_applicant: true, ma_requires_verification_of_trust: false, ma_requires_verification_of_annuity: false, citizenship_status: citizen}, expect: 3}
