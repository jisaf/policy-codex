id: CO-1158
name: "Medicaid: Pickle countable income"
identifier: ma_pickle_countable_income
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: The person's SSI-related countable income after the Pickle disregard - the cumulative OASDI increases since SSI or OAP was lost (current OASDI less the OASDI that caused the loss) are subtracted (10 CCR 2505-10 §§ 8.100.6.D.1, 8.100.6.E.1.d-e).
precision: "OQ-207 resolved: the Pickle disregard comes off the OASDI benefit first (42 CFR 435.135(a)(3): deducted from current OASDI benefits; § 8.100.6.E.1.e: subtract the disregard from the current OASDI income to get the countable OASDI income), and the SSI exclusions then apply to the reduced income: the household's unearned income less the disregard, less the $20 general exclusion, with any unused part of the $20 and the $65 earned exclusion and one-half disregard applied to earned income as in ma_ssi_countable_earned_income (CO-605). The cost-of-living increases of a financially responsible spouse or parent (435.135(b)) are not separately disregarded. Read as monthly dollars."
derived: [+, [max, 0, ["-", [max, 0, ["-", ma_ssi_household_unearned_income_sum, [max, 0, ["-", social_security_income, social_security_income_when_ssi_or_oap_lost]]]], ssi_general_income_exclusion]], ["*", [max, 0, ["-", [sum, [reachable, [spouse, holds_out_as_spouse_with], [all, [not, resides_in_medical_institution], [not, [of, [P], resides_in_medical_institution]]]], [+, [of, [P], wages_gross], [of, [P], ma_self_employment_net_earnings]]], ["+", ssi_earned_income_exclusion, [max, 0, ["-", ssi_general_income_exclusion, [max, 0, ["-", ma_ssi_household_unearned_income_sum, [max, 0, ["-", social_security_income, social_security_income_when_ssi_or_oap_lost]]]]]]]]], ssi_earned_income_disregard_rate]]
sources: [S623, S624, S1233, S1955]
implemented: engine
tags: [ma, non_magi, income]
rationale: "No existing item applies the Pickle disregard. ma_pickle_eligible (CO-1159) needs the resulting countable income. Same-word audit SW-6: the SSI method treats as spouses two unrelated persons living together who lead people to believe they are married (20 CFR 416.1806(a)(3), S1955), so the holds_out_as_spouse_with role is read beside the legal spouse."
tests:
  - {id: CO-1158-T1, as_of: "2026-10-01", month: "2026-10", title: "1100 OASDI now, 950 when SSI was lost: disregard 150, then the $20: 930", given: {ma_ssi_household_unearned_income_sum: 1100, social_security_income: 1100, social_security_income_when_ssi_or_oap_lost: 950, resides_in_medical_institution: false, wages_gross: 0, ma_self_employment_net_earnings: 0}, relationships: [], expect: 930}
  - {id: CO-1158-T2, as_of: "2026-10-01", month: "2026-10", title: "OQ-207: the disregard uses up the unearned income, so the whole $20 goes to earnings: (500 - 85) / 2 = 207.5 (the old order gave 197.5)", given: {ma_ssi_household_unearned_income_sum: 100, social_security_income: 100, social_security_income_when_ssi_or_oap_lost: 0, resides_in_medical_institution: false, wages_gross: 500, ma_self_employment_net_earnings: 0}, relationships: [], expect: 207.5}
  - {id: CO-1158-T3, as_of: "2026-10-01", month: "2026-10", title: "OASDI lower now than at the loss: no disregard", given: {ma_ssi_household_unearned_income_sum: 1000, social_security_income: 900, social_security_income_when_ssi_or_oap_lost: 950, resides_in_medical_institution: false, wages_gross: 0, ma_self_employment_net_earnings: 0}, relationships: [], expect: 980}
