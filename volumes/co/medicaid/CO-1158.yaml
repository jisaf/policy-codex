id: CO-1158
name: "Medicaid: Pickle countable income"
identifier: ma_pickle_countable_income
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: The person's SSI-related countable income after the Pickle disregard - the cumulative OASDI increases since SSI or OAP was lost (current OASDI less the OASDI that caused the loss) are subtracted (10 CCR 2505-10 §§ 8.100.6.D.1, 8.100.6.E.1.d-e).
precision: "OQ-207 resolved: the Pickle disregard comes off the OASDI benefit first (42 CFR 435.135(a)(3): deducted from current OASDI benefits; § 8.100.6.E.1.e: subtract the disregard from the current OASDI income to get the countable OASDI income), and the SSI exclusions then apply to the reduced income: the household's unearned income less the disregard, less the ssi_general_income_exclusion general exclusion, with any unused part of the ssi_general_income_exclusion and the ssi_earned_income_exclusion earned exclusion and one-half disregard applied to earned income as in ma_ssi_countable_earned_income (CO-605). The cost-of-living increases of a financially responsible spouse or parent (435.135(b)) are not separately disregarded. Read as monthly dollars. Coverage review NM-17: the disregard also takes the cost-of-living increases of a spouse living with the person whose income is counted (§ 8.100.6.E.3): the spouse's current OASDI less the spouse's OASDI when the person lost SSI or OAP (social_security_income_when_spouse_lost_ssi_or_oap, CO-4635; no increase when not stated). A parent's increases have nothing to come off: the Pickle income is the person's and the spouse's (OQ-207)."
derived: [+, [max, 0, ["-", [max, 0, ["-", ma_ssi_household_unearned_income_sum, [+, [max, 0, ["-", social_security_income, social_security_income_when_ssi_or_oap_lost]], [sum, [filter, [reachable, [spouse, holds_out_as_spouse_with], [all, [not, resides_in_medical_institution], [not, [of, [P], resides_in_medical_institution]]]], [otherwise, [rel, [spouse, holds_out_as_spouse_with], [P]], false]], [max, 0, ["-", [of, [P], social_security_income], [otherwise, [of, [P], social_security_income_when_spouse_lost_ssi_or_oap], [of, [P], social_security_income]]]]]]]], ssi_general_income_exclusion]], ["*", [max, 0, ["-", [sum, [reachable, [spouse, holds_out_as_spouse_with], [all, [not, resides_in_medical_institution], [not, [of, [P], resides_in_medical_institution]]]], [+, [of, [P], wages_gross], [of, [P], ma_self_employment_net_earnings]]], ["+", ssi_earned_income_exclusion, [max, 0, ["-", ssi_general_income_exclusion, [max, 0, ["-", ma_ssi_household_unearned_income_sum, [+, [max, 0, ["-", social_security_income, social_security_income_when_ssi_or_oap_lost]], [sum, [filter, [reachable, [spouse, holds_out_as_spouse_with], [all, [not, resides_in_medical_institution], [not, [of, [P], resides_in_medical_institution]]]], [otherwise, [rel, [spouse, holds_out_as_spouse_with], [P]], false]], [max, 0, ["-", [of, [P], social_security_income], [otherwise, [of, [P], social_security_income_when_spouse_lost_ssi_or_oap], [of, [P], social_security_income]]]]]]]]]]]]], ssi_earned_income_disregard_rate]]
sources: [S623, S624, S1233, S1955, S666]
implemented: engine
tags: [ma, non_magi, income]
rationale: "No existing item applies the Pickle disregard. ma_pickle_eligible (CO-1159) needs the resulting countable income. Same-word audit SW-6: the SSI method treats as spouses two unrelated persons living together who lead people to believe they are married (20 CFR 416.1806(a)(3), S1955), so the holds_out_as_spouse_with role is read beside the legal spouse."
