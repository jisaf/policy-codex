id: CO-1158
name: "Medicaid: Pickle countable income"
identifier: ma_pickle_countable_income
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: The person's SSI-related countable income after the Pickle disregard - the cumulative OASDI increases since SSI or OAP was lost (current OASDI less the OASDI that caused the loss) are subtracted (10 CCR 2505-10 §§ 8.100.6.D.1, 8.100.6.E.1.d-e).
precision: "OQ-207 resolved: the Pickle disregard comes off the OASDI benefit first (42 CFR 435.135(a)(3): deducted from current OASDI benefits; § 8.100.6.E.1.e: subtract the disregard from the current OASDI income to get the countable OASDI income), and the SSI method then applies to the countable income (E.2: \"If the countable OASDI income and all other countable income is less than the current SSI or OAP standard\"). Duplicate-paths audit D-M1, D-M3 (P1, fixed): the figure is the SSI-related countable income (CO-605, CO-606, CO-2281) with the countable OASDI in place of the current OASDI, read from the same pieces: the household's own unearned income with the person's Pickle Disregard (CO-6052) and a living-together spouse's OASDI increases (§ 8.100.6.E.3, NM-17; CO-6053) subtracted, the Ineligible Child Allocation taken from the ineligible spouse's countable unearned income first (CO-6054) and the rest from the spouse's earned income (CO-6055), the one-third child support reduction for a child (ma_pickle_household_unearned_income_before_deeming, CO-6056), the parental income deemed to a child with the parents' increases disregarded and the 416.1165(e)(3) fill-up (ma_pickle_parental_income_deemed, CO-5222), the $20 general exclusion with any unused part carried to earned income, and the couple's earned income after the exclusions of earnings (CO-6051), the $65, impairment-related work expenses, one half and the exclusions after it. Before, this item copied the SSI formula without the Ineligible Child Allocation or the child support reduction: an aged applicant (OASDI unchanged since the loss) whose ineligible spouse earned 3,300 with their child of 10 at home had Pickle income 1,607.50 where the SSI method gives 1,359, and failed the couple FBR of 1,491. The earned arithmetic is CO-605's (registered siblings). Read as monthly dollars."
derived: ["+", [max, 0, ["-", ["+", ma_pickle_household_unearned_income_before_deeming, ma_pickle_parental_income_deemed], ssi_general_income_exclusion]], [max, 0, ["-", ["*", [max, 0, ["-", [max, 0, ["-", ["-", ma_ssi_couple_earned_income_after_exclusions, ma_pickle_child_allocation_from_spouse_earned], ["+", ssi_earned_income_exclusion, [max, 0, ["-", ssi_general_income_exclusion, ["+", ma_pickle_household_unearned_income_before_deeming, ma_pickle_parental_income_deemed]]]]]], ma_ssi_impairment_related_work_expenses]], ssi_earned_income_disregard_rate], ma_ssi_earned_income_excluded_after_half]]]
sources: [S623, S624, S1233, S1955, S666]
implemented: engine
tags: [ma, non_magi, income]
siblings:
  - {id: CO-605, reason: "the Pickle countable income repeats this earned arithmetic over its own unearned income and allocation (8.100.6.E.2); every other term must stay the same"}
rationale: "No existing item applies the Pickle disregard. ma_pickle_eligible (CO-1159) needs the resulting countable income. Same-word audit SW-6: the SSI method treats as spouses two unrelated persons living together who lead people to believe they are married (20 CFR 416.1806(a)(3), S1955), so the holds_out_as_spouse_with role is read beside the legal spouse. Coverage pass 3 C3-1: sums over ma_ssi_couple_members (CO-3626), which keeps a newly admitted spouse in the couple through the admission month (§ 8.100.7.C.2.b) except for the institutionalized spouse's own test (42 U.S.C. 1396r-5(b)(1)); it had filtered on resides_in_medical_institution, which split the couple's incomes from the admission day while the size and resources still read them together. Coverage pass 3 C3-3: the earned side now takes the 20 CFR 416.1112(c) exclusions § 8.100.5.H.4.e incorporates, as ma_ssi_countable_earned_income (CO-605) does: ma_ssi_excluded_earned_income (CO-2471) from each member before the $65, impairment-related work expenses (CO-4628) before the one half, and blind work expenses and PASS (CO-4629) after it. Coverage review NM-17 (parent half) and the Pickle child under 18 with ineligible parents, deferred P2s (fix round 2026-11-23): deemed parental income, with the parents' increases disregarded, is added for a child. Receipt records, migration phase 2: the current OASDI is ma_social_security_receipts (CO-5515), the person's and a spouse's. Earned-income records, step E1 (Medicaid and CHP+): earned income is the earnings records the SSI method's counting table counts (ma_ssi_gross_earned_income, CO-5171), replacing wages_gross plus ma_self_employment_net_earnings. Duplicate-paths audit D-M1, D-M3 (P1): the Pickle income is the SSI-related income with the countable OASDI, from the same pieces (CO-6051 to CO-6056, CO-5222)."
