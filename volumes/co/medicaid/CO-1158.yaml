  - {id: CO-1158-T3, as_of: "2026-10-01", month: "2026-10", title: "OASDI lower now than at the loss: no disregard", given: {ma_ssi_household_unearned_income_sum: 1000, social_security_income: 900, social_security_income_when_ssi_or_oap_lost: 950, resides_in_medical_institution: false, wages_gross: 0, ma_self_employment_net_earnings: 0}, relationships: [], expect: 980}
