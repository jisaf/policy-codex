id: CO-1158
name: "Medicaid: Pickle countable income"
identifier: ma_pickle_countable_income
kind: derived
type: money
scope: person-month
program: Medicaid
meaning: The person's SSI-related countable income after the Pickle disregard - the cumulative OASDI increases since SSI or OAP was lost (current OASDI less the OASDI that caused the loss) are subtracted (10 CCR 2505-10 §§ 8.100.6.D.1, 8.100.6.E.1.d-e).
precision: "OQ-207 resolved: the Pickle disregard comes off the OASDI benefit first (42 CFR 435.135(a)(3): deducted from current OASDI benefits; § 8.100.6.E.1.e: subtract the disregard from the current OASDI income to get the countable OASDI income), and the SSI exclusions then apply to the reduced income: the household's unearned income less the disregard, less the ssi_general_income_exclusion general exclusion, with any unused part of the ssi_general_income_exclusion and the ssi_earned_income_exclusion earned exclusion and one-half disregard applied to earned income as in ma_ssi_countable_earned_income (CO-605). The cost-of-living increases of a financially responsible spouse or parent (435.135(b)) are not separately disregarded. Read as monthly dollars. Coverage review NM-17: the disregard also takes the cost-of-living increases of a spouse living with the person whose income is counted (§ 8.100.6.E.3): the spouse's current OASDI less the spouse's OASDI when the person lost SSI or OAP (social_security_income_when_spouse_lost_ssi_or_oap, CO-4635; no increase when not stated). For a child under 18 living with ineligible parents, the parents' income deemed to the child is added to the unearned income (ma_pickle_parental_income_deemed, CO-5222), with the parents' own OASDI cost-of-living increases since the child lost SSI disregarded (§ 8.100.6.E.3's parent half; CO-5221, CO-5220)."
