sources: [S623, S624, S1233, S1955, S666]
implemented: engine
tags: [ma, non_magi, income]
rationale: "No existing item applies the Pickle disregard. ma_pickle_eligible (CO-1159) needs the resulting countable income. Same-word audit SW-6: the SSI method treats as spouses two unrelated persons living together who lead people to believe they are married (20 CFR 416.1806(a)(3), S1955), so the holds_out_as_spouse_with role is read beside the legal spouse. Coverage pass 3 C3-1: sums over ma_ssi_couple_members (CO-3626), which keeps a newly admitted spouse in the couple through the admission month (§ 8.100.7.C.2.b) except for the institutionalized spouse's own test (42 U.S.C. 1396r-5(b)(1)); it had filtered on resides_in_medical_institution, which split the couple's incomes from the admission day while the size and resources still read them together. Coverage pass 3 C3-3: the earned side now takes the 20 CFR 416.1112(c) exclusions § 8.100.5.H.4.e incorporates, as ma_ssi_countable_earned_income (CO-605) does: ma_ssi_excluded_earned_income (CO-2471) from each member before the $65, impairment-related work expenses (CO-4628) before the one half, and blind work expenses and PASS (CO-4629) after it. Coverage review NM-17 (parent half) and the Pickle child under 18 with ineligible parents, deferred P2s (fix round 2026-11-23): deemed parental income, with the parents' increases disregarded, is added for a child."
