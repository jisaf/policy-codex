id: CO-1159
name: "Medicaid: is Pickle eligible"
identifier: ma_pickle_eligible
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether the person is eligible under the Pickle Amendment (10 CCR 2505-10 §§ 8.100.3.F.1.e, 8.100.6.D-E) - an aged, blind or disabled Colorado resident meeting status who lost SSI or OAP because of OASDI benefits, or who lost SSI, a State supplement or OAP for any reason after April 1977 while receiving it with OASDI (42 CFR 435.135(a)), whose countable income after the Pickle disregard is less than the current SSI or OAP standard and who meets the SSI resource standard."
statute_override: "Federal regulation overrides 10 CCR 2505-10 § 8.100.6.D.2, which applies the Pickle disregard only to a person who lost SSI or OAP because of OASDI: 42 CFR 435.135(a) requires Medicaid for every person receiving OASDI who \"Were eligible for and receiving SSI or State supplements but became ineligible for those payments after April 1977\", for any reason, and would still be eligible with the OASDI cost-of-living increases since the last month of that receipt deducted, so such a person is tested for the Pickle group too (coverage pass 6, 2026-11-24)."
precision: "'Less than the current SSI or OAP standard' (§ 8.100.6.E.2) is read as less than either: the SSI federal benefit rate for the SSI household size, or, for a person of Old Age Pension age (af_is_oap_age, CO-940: 60 or older), the OAP grant standard (af_oap_grant_standard, CO-289) where it is higher - the OAP standard can only be met by a person who could receive OAP, which § 8.100.6.D.2.c's 'would be eligible for OAP and/or SSI' requires. Strictly less than. 'Meets all other eligibility criteria' is read as residency, status, aged/blind/disabled and the SSI resource standard. § 8.100.6.E.3's disregard of a parent's or spouse's OASDI cost of living increases is not applied (OQ-207). A child in a continuous eligibility period that began in Pickle (§ 8.100.3.Q.2.e) stays eligible for the period. Coverage pass 6, non-MAGI F6-6 (docs/reviews/coverage6-medicaid-nonmagi.md): where no income of an ineligible spouse is deemed (ma_ssi_ineligible_spouse_income_is_not_deemed, CO-7353; 20 CFR 416.1163(d)(1), S5031: 'we subtract only your own countable income from the Federal benefit rate for an individual'), the person's own Pickle income (ma_pickle_own_countable_income, CO-7356) is compared with the individual rate. Coverage pass 6, non-MAGI F6-8 (docs/reviews/coverage6-medicaid-nonmagi.md): the loss is a loss caused by OASDI (lost_ssi_or_oap_due_to_social_security_benefits, CO-1108; § 8.100.6.D.2, S623) or any loss of SSI, a State supplement or OAP after April 1977 while it was received with OASDI (lost_ssi_or_oap_received_with_social_security, CO-7358; 42 CFR 435.135(a)(2), S1233), and the disregard is measured from the OASDI of the last month of that concurrent receipt (social_security_income_when_ssi_or_oap_lost, CO-1109; 435.135(a)(3)). D.1 itself names no cause (\"Medical Assistance must be provided to an individual if their countable income is below the current years SSI standard after a cost of living adjustment (COLA) disregard is applied to their OASDI\"); D.2's list is narrower than the mandatory federal group, which a State plan must cover (statute_override). Before, a person who lost SSI when a pension began was never Pickle (PICKLE-PENSION, CO-910). Pattern sweep, non-MAGI Medicaid (docs/reviews/pattern-sweep-nonmagi.md, P1): aged, blind or disabled is read in the month with the disability onset gate (ma_is_aged_blind_or_disabled_in_month, CO-5201; 10 CCR 2505-10 § 8.100.5.C.4.b, S3623: disability approved, or 'a disability onset date determined on or prior to the date of a medical service'; § 8.100.3.E.1, S1503), as the SSI-related groups (CO-611) and OAP SISC B (CO-1177) already read it. Before, it read ma_is_aged_blind_or_disabled (CO-603), which has no onset gate, so a retroactive month before the onset of a disability was a disabled month."
derived: [any, [all, ma_meets_residency_in_month, ma_meets_citizenship_requirement_in_month, ma_is_aged_blind_or_disabled_in_month, [any, lost_ssi_or_oap_due_to_social_security_benefits, lost_ssi_or_oap_received_with_social_security], ma_meets_ssi_resource_standard, ["<", [case, [ma_ssi_ineligible_spouse_income_is_not_deemed, ma_pickle_own_countable_income], [else, ma_pickle_countable_income]], [case, [af_is_oap_age, [max, [case, [[all, ["=", ma_ssi_household_size, 2], [not, ma_ssi_ineligible_spouse_income_is_not_deemed]], ma_ssi_federal_benefit_rate_couple], [else, ssi_federal_benefit_rate_individual]], af_oap_grant_standard]], [else, [case, [[all, ["=", ma_ssi_household_size, 2], [not, ma_ssi_ineligible_spouse_income_is_not_deemed]], ma_ssi_federal_benefit_rate_couple], [else, ssi_federal_benefit_rate_individual]]]]]], [all, ma_child_is_in_non_magi_continuous_eligibility_period, ["=", ma_continuous_eligibility_program, pickle]]]
sources: [S623, S624, S666, S1724, S5031, S1233, S3623, S1503]
implemented: engine
tags: [ma, non_magi, income]
accepts_from:
  - {from: af_is_oap_age, class: adopted_method, source: S623}
rationale: "No existing item states the Pickle group. ma_protected_group_category (CO-1163) needs it. Vocabulary fix round (governance read.cross_program): accepts_from lists the other programs' items this rule reads on purpose. The Medicaid rule names the other program's result (OAP receipt, CHP+ eligibility). History moved from the precision note (HCPF review S-14): HCPF fix round (C-7): a child in a continuous eligibility period that began in Pickle (§ 8.100.3.Q.2.e) stays eligible for the period. Precision history (moved from precision, engineering follow-up pass task 5): (phase 7 fix round, S-6)."
