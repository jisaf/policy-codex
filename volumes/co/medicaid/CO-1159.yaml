  - {id: CO-1159-T2, as_of: "2026-10-01", month: "2026-10", title: "At or above the 994 federal benefit rate", given: {is_colorado_resident: true, ma_meets_citizenship_requirement: true, ma_is_aged_blind_or_disabled: true, lost_ssi_or_oap_due_to_social_security_benefits: true, ma_meets_ssi_resource_standard: true, ma_pickle_countable_income: 994, ma_ssi_household_size: 1, af_is_oap_age: false}, expect: false}
  - {id: CO-1159-T3, as_of: "2026-10-01", month: "2026-10", given: {is_colorado_resident: true, ma_meets_citizenship_requirement: true, ma_is_aged_blind_or_disabled: true, lost_ssi_or_oap_due_to_social_security_benefits: false}, expect: false}
  - {id: CO-1159-T4, as_of: "2026-10-01", month: "2026-10", title: "Phase 7 fix round (S-6): aged 62, lost OAP, countable income 1010 - over the 994 rate, under the 1032 OAP standard", given: {is_colorado_resident: true, ma_meets_citizenship_requirement: true, ma_is_aged_blind_or_disabled: true, lost_ssi_or_oap_due_to_social_security_benefits: true, ma_meets_ssi_resource_standard: true, ma_pickle_countable_income: 1010, ma_ssi_household_size: 1, af_is_oap_age: true}, expect: true}
