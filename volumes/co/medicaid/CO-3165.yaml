id: CO-3165
name: "Medicaid community engagement: last day to make a satisfactory showing"
identifier: ma_community_engagement_response_period_end_date
kind: derived
type: calendar date
scope: person
program: Medicaid
meaning: "The last day of the period the person has, after a notice of noncompliance, to show that the community engagement requirement was met or does not apply: ma_community_engagement_response_days calendar days beginning on the day the notice is received, which is the day the person shows (ma_community_engagement_notice_received_date) or else ma_community_engagement_notice_receipt_days days after the date on the notice (42 CFR 435.558(a)(2), (c)(4))."
precision: "A period of 30 calendar days beginning on the day of receipt ends 29 days after it (a notice dated March 3 is received March 8, and the period runs through April 6). Unknown when no notice has been sent."
derived: [days_after, ["-", ma_community_engagement_response_days, 1], [otherwise, ma_community_engagement_notice_received_date, [days_after, ma_community_engagement_notice_receipt_days, ma_community_engagement_noncompliance_notice_date]]]
sources: [S2109, S2108]
implemented: engine
tags: [ma, magi]
rationale: "OQ-413 part (4), audit fix round 4: the community engagement status (CO-1974) and the Adults group condition (CO-1975) need the end of the showing period; no existing item states it."
tests:
  - {id: CO-3165-T1, as_of: "2027-03-15", title: "Notice dated March 3, 2027: received March 8, period through April 6", given: {ma_community_engagement_noncompliance_notice_date: "2027-03-03"}, expect: "2027-04-06"}
  - {id: CO-3165-T2, as_of: "2027-03-15", title: "The person shows the notice arrived on March 12", given: {ma_community_engagement_noncompliance_notice_date: "2027-03-03", ma_community_engagement_notice_received_date: "2027-03-12"}, expect: "2027-04-10"}
