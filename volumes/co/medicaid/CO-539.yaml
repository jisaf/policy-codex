id: CO-539
name: "Medicaid: highest MAGI income standard the person could qualify under"
identifier: ma_magi_highest_income_standard_pct
kind: derived
type: rate
scope: person-month
program: Medicaid
meaning: The greatest MAGI income standard, as a decimal fraction of FPL, among the covered groups whose non-income (demographic) criteria this person meets this month - the standard 42 CFR 435.603(d)(4) means by "the eligibility group with the highest income standard" for the 5% disregard.
precision: "Tests each of the four income-tested groups' own non-income criteria directly (not their full category rules, which already fold in the income test the disregard would otherwise be deciding), and takes the greatest of the standards for the groups the person could qualify under, 0 for the rest, via P40 (the greater of two numbers, nested). The Former Foster Care and Needy Newborn groups take no income test at all (8.100.4.H.2.b, 8.100.4.G.7) and so never bound the disregard; they are not inputs to this item. Same-word audit SW-1/SW-3 (engineering follow-up pass, OQ-396): \"parent or caretaker relative\" is ma_caretaker_relative_of (CO-2606), Medicaid's own reading of the neutral parent, stepparent and has_primary_responsibility_for roles. The children's arm reads ma_is_under_child_age_or_turns_nineteen_this_month (CO-564), the Children's group's own age condition (through the end of the month of the 19th birthday, § 8.100.4.G.2.a), so a person in the month of the 19th birthday has the children's standard for the disregard (final verification pass 3, F3-3). Coverage review F-06: the adult arm's upper age reads CO-4550 (through the end of the 65th-birthday month), as CO-548 does. Coverage review 2, N-01: the adult arm also tests § 8.100.4.G.4.a's condition that every child under ma_magi_child_age_limit of whom the person is a parent or caretaker relative has minimum essential coverage, as CO-548 and CO-552 do. Without it a parent whose child lacks coverage had the Adults group's 133% as her highest standard though the group is closed to her, and so had the disregard in neither group. The parent and caretaker arm reads the dependent child through ma_is_dependent_child_in_month (CO-4791), the child's 18th-birthday month included (§ 8.100.4.G.1). Time audit T-1 (2026-11-23): the Adults group's lower limit (19) reads ma_age_on_last_day_of_month (CO-5402) and the bar for a parent of a child under 19 without coverage reads the child's age on the last day of the month, so each is met if it is met on any day of the month (§ 8.100.4.G.1); it read age (CO-300), the age on the determination date, in every month."
derived: [max, [max, [case, [ma_is_under_child_age_or_turns_nineteen_this_month, ma_magi_income_standard_child], [else, 0]], [case, [ma_is_pregnant_in_month, ma_magi_income_standard_pregnant], [else, 0]]], [max, [case, [[exists, ma_caretaker_relative_of, [of, [P], ma_is_dependent_child_in_month]], ma_income_limit_parent_caretaker_pct], [else, 0]], [case, [[all, [">=", ma_age_on_last_day_of_month, ma_magi_child_age_limit], ma_is_under_adult_upper_age_through_birthday_month, [not, ma_is_pregnant_in_month], [not, is_medicare_entitled_or_enrolled], [not, [exists, ma_caretaker_relative_of, [all, [<, [of, [P], ma_age_on_last_day_of_month], ma_magi_child_age_limit], [not, [of, [P], dependent_child_has_minimum_essential_coverage]]]]]], ma_magi_income_standard_adult], [else, 0]]]]
sources: [S165, S638, S639, S207, S640, S3350, S3351, S1732]
implemented: engine
tags: [ma, magi, income]
rationale: "No existing item states the highest MAGI income standard a person could qualify under; the phase-3 review's C-2 finding is that CO-545/546/547/548 each apply 42 CFR 435.603(d)(4)'s 5% disregard at their own category's standard rather than only at this highest one, which changes the reported covered group (a parent between 60% and 65% of FPL is placed in the Adults group, not Parents/Caretaker, once the disregard is gated correctly). CO-545/546/547/548 are all edited by this fix round to gate their own disregard disjunct on [=, <their own standard>, ma_magi_highest_income_standard_pct]. Uses [case, [cond, standard], [else, 0]] (P33's enumerated-outcome pattern specialized to a two-branch numeric choice) rather than the category rules themselves (ma_is_child_category and siblings) to avoid a circular reference, since those rules are exactly what this item's output feeds. Final verification F-1 (2026-11-22): reads ma_is_pregnant_in_month (CO-3601) in place of the current-status is_pregnant, so a retroactive month before a birth or other end of pregnancy is a pregnant month (§ 8.100.3.E.1-2, S1503, S2411; 42 U.S.C. 1396a(e)(16), S224)."
tests:
  - {id: CO-539-T1, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "1990-01-01", is_pregnant: false, is_medicare_entitled_or_enrolled: false}, relationships: [], expect: 1.33}
  - {id: CO-539-T2, as_of: "2026-10-01", month: "2026-10", given: {dwelling_id: h1, date_of_birth: "1958-01-01", is_pregnant: false, is_medicare_entitled_or_enrolled: true}, others: {p2: {dwelling_id: h1, date_of_birth: "2015-01-01", is_full_time_secondary_student_finishing_before_nineteen: false}}, relationships: [[parent, p2]], expect: 0.68}
