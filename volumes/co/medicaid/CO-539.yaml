id: CO-539
name: "Medicaid: highest MAGI income standard the person could qualify under"
identifier: ma_magi_highest_income_standard_pct
kind: derived
type: rate
scope: person-month
program: Medicaid
meaning: The greatest MAGI income standard, as a decimal fraction of FPL, among the covered groups whose non-income (demographic) criteria this person meets this month - the standard 42 CFR 435.603(d)(4) means by "the eligibility group with the highest income standard" for the 5% disregard.
precision: "Tests each of the four income-tested groups' own non-income criteria directly (not their full category rules, which already fold in the income test the disregard would otherwise be deciding), and takes the greatest of the standards for the groups the person could qualify under, 0 for the rest, via P40 (the greater of two numbers, nested). The Former Foster Care and Needy Newborn groups take no income test at all (8.100.4.H.2.b, 8.100.4.G.7) and so never bound the disregard; they are not inputs to this item. Same-word audit SW-1/SW-3 (engineering follow-up pass, OQ-396): \"parent or caretaker relative\" is ma_caretaker_relative_of (CO-2606), Medicaid's own reading of the neutral parent, stepparent and has_primary_responsibility_for roles."
derived: [max, [max, [case, [[<, age, ma_magi_child_age_limit], ma_magi_income_standard_child], [else, 0]], [case, [ma_is_pregnant_in_month, ma_magi_income_standard_pregnant], [else, 0]]], [max, [case, [[exists, ma_caretaker_relative_of, [of, [P], ma_is_dependent_child]], ma_income_limit_parent_caretaker_pct], [else, 0]], [case, [[all, [">=", age, ma_magi_child_age_limit], [<, age, ma_adult_upper_age_limit], [not, ma_is_pregnant_in_month], [not, is_medicare_entitled_or_enrolled]], ma_magi_income_standard_adult], [else, 0]]]]
sources: [S165, S638, S639, S207, S640]
implemented: engine
tags: [ma, magi, income]
rationale: "No existing item states the highest MAGI income standard a person could qualify under; the phase-3 review's C-2 finding is that CO-545/546/547/548 each apply 42 CFR 435.603(d)(4)'s 5% disregard at their own category's standard rather than only at this highest one, which changes the reported covered group (a parent between 60% and 65% of FPL is placed in the Adults group, not Parents/Caretaker, once the disregard is gated correctly). CO-545/546/547/548 are all edited by this fix round to gate their own disregard disjunct on [=, <their own standard>, ma_magi_highest_income_standard_pct]. Uses [case, [cond, standard], [else, 0]] (P33's enumerated-outcome pattern specialized to a two-branch numeric choice) rather than the category rules themselves (ma_is_child_category and siblings) to avoid a circular reference, since those rules are exactly what this item's output feeds. Final verification F-1 (2026-11-22): reads ma_is_pregnant_in_month (CO-3601) in place of the current-status is_pregnant, so a retroactive month before a birth or other end of pregnancy is a pregnant month (§ 8.100.3.E.1-2, S1503, S2411; 42 U.S.C. 1396a(e)(16), S224)."
tests:
  - {id: CO-539-T1, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "1990-01-01", is_pregnant: false, is_medicare_entitled_or_enrolled: false}, relationships: [], expect: 1.33}
  - {id: CO-539-T2, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "1958-01-01", is_pregnant: false, is_medicare_entitled_or_enrolled: true}, others: {p2: {date_of_birth: "2015-01-01", is_full_time_secondary_student_finishing_before_nineteen: false}}, relationships: [[parent, p2]], expect: 0.68}
  - {id: CO-539-T3, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "1990-01-01", is_pregnant: false, is_medicare_entitled_or_enrolled: false}, others: {p2: {date_of_birth: "2015-01-01", is_full_time_secondary_student_finishing_before_nineteen: false}}, relationships: [[parent, p2]], expect: 1.33}
  - {id: CO-539-T4, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "1990-01-01", is_pregnant: true, is_medicare_entitled_or_enrolled: false}, relationships: [], expect: 1.95}
