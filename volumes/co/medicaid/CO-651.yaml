id: CO-651
name: "Medicaid: is financially eligible for LTC"
identifier: ma_ltc_financially_eligible
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether this person meets every financial condition for Long-Term Care assistance for the month - the special income group income test, the LTC resource standard, no disqualifying home equity, and no current transfer-of-assets penalty - per 10 CCR 2505-10 § 8.100.7."
precision: "Reads ma_transfer_penalty_applies (CO-660), which bounds the penalty to its calendar span, rather than the raw ma_transfer_penalty_months figure; the between-spouses apportionment of § 8.100.7.F.8 is in ma_transfer_penalty_months (OQ-94, resolved). Blocked (OQ-1060, OQ-1061): the income-trust ceiling (through CO-642) rests on S1230 and the transfer-penalty divisor (through CO-660) on S1228, neither a quotation. HCPF Operational Memo OM 25-073 (D-125), the only document that states them, could not be fetched on 2026-11-23 (hcpf.colorado.gov refused, HTTP 403; medicaid.gov, sos.state.co.us, ecfr.gov, law.cornell.edu, govinfo.gov and federalregister.gov answered but state no Colorado figure), so the item stays Draft until the memo is stored and the excerpt replaced by its quotation."
open: [OQ-1060, OQ-1061]
derived: [all, ma_meets_special_income_group, ma_meets_ltc_resource_standard, [not, ma_home_equity_disqualifies], [not, ma_transfer_penalty_applies]]
sources: [S1753]
implemented: engine
tags: [ma, ltc, income, resources, legal]
rationale: "No existing item combines the special income group, resource, home equity and transfer-penalty tests into one financial-eligibility gate. ma_hcbs_waiver_eligible (CO-653), ma_pace_eligible (CO-654) and ma_ltc_eligibility_status (CO-652) need it. Precision history (moved from precision, engineering follow-up pass task 5): per the phase-4 review's C-7 finding."
tests:
  - {id: CO-651-T1, as_of: "2026-10-01", month: "2026-10", given: {ma_meets_special_income_group: true, ma_meets_ltc_resource_standard: true, ma_home_equity_disqualifies: false, ma_transfer_penalty_applies: false}, expect: true}
  - {id: CO-651-T2, as_of: "2026-10-01", month: "2026-10", given: {ma_meets_special_income_group: true, ma_meets_ltc_resource_standard: true, ma_home_equity_disqualifies: false, ma_transfer_penalty_applies: true}, expect: false}
  - {id: CO-651-T3, as_of: "2026-10-01", month: "2026-10", given: {ma_meets_special_income_group: false, ma_meets_ltc_resource_standard: true, ma_home_equity_disqualifies: false, ma_transfer_penalty_applies: false}, expect: false}
