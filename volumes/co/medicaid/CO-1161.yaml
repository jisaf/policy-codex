id: CO-1161
name: "Medicaid: is Disabled Adult Child eligible"
identifier: ma_dac_eligible
kind: derived
type: yes/no
scope: person-month
program: Medicaid
meaning: Whether the person is eligible as a Disabled Adult Child (10 CCR 2505-10 §§ 8.100.3.F.1.h, 8.100.6.J) - a Colorado resident meeting status, aged 18 or older, who lost SSI because of OASDI drawn on a parent's Social Security number, currently receives OASDI as a Disabled Adult Child, and would continue to be eligible for SSI with that OASDI disregarded (resources within the SSI limit and other countable income below the current SSI federal benefit rate).
precision: The federal benefit rate is the individual or couple rate by SSI household size; "below" is strictly less than.
derived: [all, ma_meets_residency, ma_meets_citizenship_requirement, [">=", age, ma_dac_min_age], receives_oasdi_as_disabled_adult_child, lost_ssi_or_oap_due_to_social_security_benefits, ma_meets_ssi_resource_standard, [<, ma_dac_countable_income, [case, [[=, ma_ssi_household_size, 2], ma_ssi_federal_benefit_rate_couple], [else, ma_ssi_federal_benefit_rate_individual]]]]
sources: [S626]
implemented: engine
tags: [ma, non_magi, disability]
nearest: [CO-1159]
rationale: "No existing item states the DAC group. ma_protected_group_category (CO-1163) needs it."
tests:
  - {id: CO-1161-T1, as_of: "2026-10-01", month: "2026-10", given: {ma_meets_residency: true, ma_meets_citizenship_requirement: true, date_of_birth: "1990-03-01", receives_oasdi_as_disabled_adult_child: true, lost_ssi_or_oap_due_to_social_security_benefits: true, ma_meets_ssi_resource_standard: true, ma_dac_countable_income: 100, ma_ssi_household_size: 1}, expect: true}
  - {id: CO-1161-T2, as_of: "2026-10-01", month: "2026-10", title: "Age 16", given: {ma_meets_residency: true, ma_meets_citizenship_requirement: true, date_of_birth: "2010-03-01"}, expect: false}
  - {id: CO-1161-T3, as_of: "2026-10-01", month: "2026-10", given: {ma_meets_residency: true, ma_meets_citizenship_requirement: true, date_of_birth: "1990-03-01", receives_oasdi_as_disabled_adult_child: false}, expect: false}
  - {id: CO-1161-T4, as_of: "2026-10-01", month: "2026-10", title: "Other countable income above the rate", given: {ma_meets_residency: true, ma_meets_citizenship_requirement: true, date_of_birth: "1990-03-01", receives_oasdi_as_disabled_adult_child: true, lost_ssi_or_oap_due_to_social_security_benefits: true, ma_meets_ssi_resource_standard: true, ma_dac_countable_income: 1000, ma_ssi_household_size: 1}, expect: false}
