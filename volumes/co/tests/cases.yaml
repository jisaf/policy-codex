# Household-level cases for the Colorado volume. The first case in this file is
# the target household every program phase must handle: three generations, five
# people, mixed immigration status, a minor parent, and a grandparent entering
# nursing facility care. Its `expect` blocks are filled in as each program's
# rules land; an outcome listed as `unknown` is one the rules do not yet decide.
#
# Conventions follow volumes/mwr/tests/cases.yaml: dates are quoted ISO strings;
# per-month facts are under months/<YYYY-MM> or month_defaults; anything not
# stated is unknown. Case-level relationships are [role, from, to] and the
# engine adds the inverse (parent/child, spouse/spouse, grandparent/grandchild,
# caretaker/dependent, tax_filer/tax_dependent, buys_prepares_with/same).

