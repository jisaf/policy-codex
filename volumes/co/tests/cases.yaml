  # Filled in per phase. Left empty in the skeleton so the case is a target,
  # not a claim; the review for each phase adds the outcomes it decides.
  # SNAP (phase 2). The grandmother p1 is an institution resident and so not a
  # household member; her own unit is empty. The unit is p2, p3, p4, p5 with p3
  # an ineligible non-citizen whose income counts pro rata (2380 x 3/4 = 1785).
  # Gross 1180 + 1785 = 2965 (expanded categorical eligibility: at or below 200%
  # FPL for 3); earned income deduction 20% of 1785 = 357; standard deduction 209;
  # adjusted income 2399; shelter 1400 less half of 2399 = 200.50 excess shelter
  # (uncapped, elderly member); net 2198.50, rounded to 2199 per 7 CFR 273.10(e)(1)(ii)(A) (S102); maximum allotment 785 less 30% of
  # net rounded up (660) = 125.
  # Phase 8 (FY2027 and the derived SUA): standard deduction 217 (S731/S741), so adjusted income 2391;
  # p2 states heat plus three other utilities, so the HCUA of 616 applies (S743) and shelter is 1400 + 616 = 2016;
  # excess shelter 2016 - 1195.50 = 820.50; net 1570.50, rounded to 1571; maximum allotment 808 (S730) less
  # 30% of net (471.30, unrounded per 4.207.3.A, S737) = 336.70, rounded down to 336.
  # Phase 8, other programs: the LEAP heating costs (900), statewide adjustment rate (0.2) and program-year
  # minimum and maximum benefit (100, 1000) are illustrative - the rule leaves them to annual State figures
  # (OQ-253); the family buys heat in common, so it is one LEAP household (phase-8 fix round, C-2: p3 excluded for
  # status, her income counted, 5,590 = 203% FPL for four), which in November gets 900 x (1 - 0.2 - 0.3) = 450.
  # CCCAP parent fee for p3's household (size 3, income 2380, one eligible child,
  # quality-rated provider, illustrative): 1% x 2380 + 14% x (2380 - 2276.67) = 38.27, x 0.8 = 30.61, 30.
  # SUN Bucks: p4 (17, in an NSLP school, SNAP household) is categorically eligible for 120. No one is
  # eligible for HCA (no functional scores), burial (no decedent) or diversion (needs ongoing assistance).
  # MAGI Medicaid and CHP+ (phase 3). p1 and p2 file jointly: household of two,
  # income 3210 (178% FPL), no MAGI category (Medicare-entitled adults over 64).
  # p3 files with an ITIN claiming p4 and p5: household of three, income 2380
  # (104.5% FPL for 3); undocumented and not pregnant, so emergency-only, while
  # her income sits within the adult standard (category adult). p4 is claimed
  # by her parent, so her household is p3's: child category, eligible, with
  # 12-month continuous eligibility. p5 is claimed by a grandparent, so the
  # non-filer rules apply: household p4 and p5, income 0, child, eligible. Both
  # children are Medicaid-eligible and so not CHP+ eligible.
  # Non-MAGI Medicaid (phase 4). p1 is institutionalized from 2026-10-01 with
  # gross income 2030, within the special income group (3 x 994 = 2982). The
  # couple's resources are 46000; with the CMS 2026 spousal standards (CSRA
  # maximum 162660, CO-828, a parameter since phase 7; the case once stated an
  # illustrative 150000), the fix-round C-1 fix (10 CCR 2505-10 8.100.7.M.1.a: CSRA
  # = total resources capped at the maximum standard, no spousal-share or
  # minimum-standard term - see OQ-126) gives ma_csra = min(162660, 46000) =
  # 46000, so all of the couple's resources are attributed to the community
  # spouse and p1's own countable resources are 0, at or below the 2000
  # limit: resource eligible. p1 also meets the nursing facility level of
  # care and is otherwise financially eligible, so ma_pace_eligible (CO-654)
  # is true; CO-652's case order tests PACE before institutional (an
  # authoring choice per OQ-100, not itself a fix-round item), so the status
  # is eligible_pace rather than eligible_institutional even though p1's
  # actual application is for nursing facility care - a consequence of C-1
  # making her resource-eligible that this fix round surfaces but does not
  # correct (OQ-100/C-18 is next round's problem). MMMNA = 2600 + (1100
  # shelter - 30% of 2600) = 2920, the spouse allowance 2920 - 1180 = 1740,
  # and (per C-3, gated on eligibility, which p1 now has) the patient payment
  # 2030 - 75 - 1740 = 215. p2 (community spouse, income 1180, individual
  # resources 44100 over the illustrative MSP limit 10000) is in no MSP,
  # SSI-related or Buy-In group, is not institutionalized, and (per C-3) has
  # no patient payment.
