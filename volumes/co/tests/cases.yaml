  # Filled in per phase. Left empty in the skeleton so the case is a target,
  # not a claim; the review for each phase adds the outcomes it decides.
  # SNAP (phase 2). The grandmother p1 is an institution resident and so not a
  # household member; her own unit is empty. The unit is p2, p3, p4, p5 with p3
  # an ineligible non-citizen whose income counts pro rata (2380 x 3/4 = 1785).
  # Gross 1180 + 1785 = 2965 (expanded categorical eligibility: at or below 200%
  # FPL for 3); earned income deduction 20% of 1785 = 357; standard deduction 209;
  # adjusted income 2399; shelter 1400 less half of 2399 = 200.50 excess shelter
  # (uncapped, elderly member); net 2198.50, rounded to 2199 per 7 CFR 273.10(e)(1)(ii)(A) (S102); maximum allotment 785 less 30% of
  # net rounded up (660) = 125.
  # MAGI Medicaid and CHP+ (phase 3). p1 and p2 file jointly: household of two,
  # income 3210 (178% FPL), no MAGI category (Medicare-entitled adults over 64).
  # p3 files with an ITIN claiming p4 and p5: household of three, income 2380
  # (104.5% FPL for 3); undocumented and not pregnant, so emergency-only, while
  # her income sits within the adult standard (category adult). p4 is claimed
  # by her parent, so her household is p3's: child category, eligible, with
  # 12-month continuous eligibility. p5 is claimed by a grandparent, so the
  # non-filer rules apply: household p4 and p5, income 0, child, eligible. Both
  # children are Medicaid-eligible and so not CHP+ eligible.
  expect:
    p1:
      ma_magi_household_members: [p1, p2]
      ma_magi_household_size: 2
      ma_magi_household_income: {"2026-10": 3210}
      ma_meets_citizenship_requirement: true
