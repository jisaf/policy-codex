  # an ineligible non-citizen whose income counts pro rata (2380 x 3/4 = 1785).
  # Gross 1180 + 1785 = 2965 (expanded categorical eligibility: at or below 200%
  # FPL for 3); earned income deduction 20% of 1785 = 357; standard deduction 209;
  # adjusted income 2399; shelter 1400 less half of 2399 = 200.50 excess shelter
  # (uncapped, elderly member); net 2198.50, rounded to 2199 per 7 CFR 273.10(e)(1)(ii)(A) (S102); maximum allotment 785 less 30% of
