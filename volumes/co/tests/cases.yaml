        self_employment_net_income: 0
        social_security_income: 0
        pension_income: 0
        unemployment_income: 0
        child_support_received: 0
        cash_assistance_income: 0
        other_unearned_income: 0
    p6:
      # Hector, 45, Rosa's brother, undocumented, lives in the dwelling and earns $1,500 a month.
      facts:
        date_of_birth: "1981-09-05"
        sex: male
        citizenship_status: undocumented
        lawful_presence_status: not_lawfully_present
        state_of_residence: "CO"
        is_enrolled_in_school: false
        is_in_job_search_activity: false
        has_additional_care_needs: false
        is_protective_services_child_care_case: false
        is_emancipated_minor: false
        is_homeless: false
        in_medical_institution: false
        is_responsible_for_heating_costs: true
        has_primary_heating_source: true
        cccap_entry_income_limit_pct_fpl: 1.85
        cw_eligibility_status: ineligible_income
        cw_grant_amount: 0
        countable_liquid_resources: 0
        countable_nonliquid_resources_snap: 0
      month_defaults:
        earned_income: 1500
        hours_worked: 160
        self_employment_net_income: 0
        social_security_income: 0
        pension_income: 0
        unemployment_income: 0
        child_support_received: 0
        cash_assistance_income: 0
        other_unearned_income: 0
  expect:
    p1:
      cccap_household_members: [p1, p2, p3, p4]
      cccap_household_size: 4
      # $2,600 (p1's earnings only): C-4's fix keys the earnings exclusion to cccap_is_household_child
      # (3.103.GGG), so p4's $400 in wages is excluded even though she is not a cccap_is_eligible_child -
      # matching 3.111.J.1 as written, unlike the review's own pre-fix arithmetic (which the review itself
      # flagged would change from $3,000 to $2,600 once C-4 landed).
      cccap_household_income: {"2026-12": 2600}
      cccap_eligibility_status: {"2026-12": eligible_low_income}
      # p4 (18) joins via the case's own shares_heating_fuel_with: true, not 3.751.2.D's unconditional
      # under-18 join; p6 does not join (see the case-level comment above on OQ-132's engine limitation).
      leap_household_members: [p1, p2, p3, p4]
      # $3,000 = p1 $2,600 + p4 $400 (18, so 3.752.23.Q's under-18 earnings zeroing does not reach her).
      leap_household_income: {"2026-12": 3000}
      leap_is_eligible: {"2026-12": true}
    p2:
      cccap_household_members: [p1, p2, p3, p4]
      cccap_household_size: 4
      cccap_household_income: {"2026-12": 2600}
      cccap_eligibility_status: {"2026-12": eligible_low_income}
      leap_household_members: [p1, p2, p3, p4]
      leap_household_income: {"2026-12": 3000}
      leap_is_eligible: {"2026-12": true}
    p3:
      cccap_is_eligible_child: true
      cccap_household_members: [p1, p2, p3, p4]
      cccap_household_size: 4
      cccap_eligibility_status: {"2026-12": eligible_low_income}
      leap_household_members: [p1, p2, p3, p4]
      leap_is_eligible: {"2026-12": true}
    p4:
      cccap_is_eligible_child: false
      cccap_household_members: [p1, p2, p3, p4]
      cccap_household_size: 4
      cccap_eligibility_status: {"2026-12": eligible_low_income}
      leap_household_members: [p1, p2, p3, p4]
      leap_household_income: {"2026-12": 3000}
      leap_is_eligible: {"2026-12": true}
    p6:
      # His own one-person household on both programs, per the case-level comment above: no LEAP or CCCAP
      # closure crosses buys_prepares_with, and his citizenship_status (undocumented) then filters him out
      # of even his own solo leap_household_members (3.753.17), so leap_household_members is empty rather
      # than [p6] - this differs from the review's hand-derived answer, which assumed a shares-heat edge to
      # p1's household that this batch's engine has no relationship role to express (OQ-132).
      cccap_household_members: [p6]
      cccap_household_size: 1
      cccap_household_income: {"2026-12": 1500}
      cccap_eligibility_status: {"2026-12": ineligible_child}
      leap_household_members: []
      leap_household_income: {"2026-12": 1500}
      leap_is_eligible: {"2026-12": false}
