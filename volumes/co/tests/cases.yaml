- id: CO-13
  title: "Phase 8: a widow on OAP with Home Care Allowance and her husband's burial; a sanctioned Colorado Works daughter whose school-age son gets SUN Bucks"
  # Designed for phase 8 (current 9 CCR 2503-5, 2503-6 and 7 CFR 292). Two households under one case,
  # with no relationship edge between them, so the Colorado Works unit is p3 and p4 only.
  # p1 (Ruth, 76) is an OAP client: countable income 700 - 20 = 680 against the $1,032 standard (S700) gives a
  # $352 grant, above the $189 floor. Her CMA scores her at capacity 24, need 30 (tier 2, S714); she is
  # financially eligible for HCA only through the grandfathered OAP-and-HCA route (3.570.13.B.3), and the
  # CMA authorizes $900, which the $977 HCA floor raises (S713).
  # Phase-8 fix round (C-1): Ruth was born 1950-03-02, so she was 63 on 2013-12-31 and could have been on OAP and
  # HCA then (3.570.13.B.3 now also checks the age, CO-1215); phase 8 had 1960-03-02, which made her 53 then.
  # Every figure is unchanged. (C-4) At 76 with $700 of income and $1,000 of resources she must apply for SSI
  # (3.520.71.B.4, D); her application is pending (has_applied_for_ssi), so no SSI is counted yet - an SSI award
  # would make her OAP countable income 994 (B-2) and her HCA route B.1. Her p2 burial figures sit on the N-1
  # boundary (OQ-355). She pays her own shelter (no ISM), lives at home, is not incarcerated and is not on
  # Colorado Works; Walter was not a Colorado Works client, so no death reimbursement (3.606.7).
  # p2 (Walter) died this month while receiving OAP: providers' charges $2,800 including a $600 prepaid plot
  # that is excluded from the $2,500 limit (3.570.43.A.4.a), so $2,200 counts; insurance $300 and estate $200
  # are applied, and Ruth (the widow, individual $2,000 limit) has $1,000 in resources, so nothing more;
  # $2,300 remains and the benefit is the $1,500 maximum (S720, S721).
  # p3 (Ana, 35) heads a Colorado Works unit with her son p4 (8): no income, one caretaker and one child, grant
  # standard $488; she is serving a second-level sanction (3.608.4.C.1, S760), so 25% ($122) comes off: $366.
  # p4 is school aged, enrolled in an NSLP school and in a TANF household: SUN Bucks categorical, $120 (S796).
