- id: CO-05
  title: Former foster care youth over every MAGI standard; 17-year-old sibling in a continuous eligibility period after an income change; grandmother caretaker on Social Security; retroactive coverage
  # Adapted from the phase-3 review's designed cases CO-07/CO-08 (docs/reviews/magi-chp-phase-3.md
  # S3.4), merged into one case with three stated months now that continuous_eligibility_period_start
  # month (CO-094) anchors ma_child_continuous_eligibility_end_month on application_date rather than
  # the determination month (C-4c) - the review's own reason the two cases could not previously be
  # merged. This harness pins the determination date (and so `age`) to the case's single as_of
  # (2026-04-10, the date of the application that opens Tasha's continuous eligibility period); it
  # does not advance with the later months, so Marcus's turning 24 between April 2026 and January
  # 2027 (the point of the review's original CO-07/CO-08 split) is not separately exercised here - he
  # is 23 in every month tested, which CO-549-T4's rule-level test already covers for an exit at 20.
  # A sibling relationship for Marcus and Tasha cannot be stated at all: P43 derives siblings only
  # from a shared parent edge, and no parent is a person in this case (both are raised by their
  # grandmother) - the chapter has no `sibling` role, so it is left unexpressed rather than forced.
  as_of: "2026-04-10"
  relationships:
    - [grandparent, p1, p2]
    - [grandparent, p1, p3]
    - [caretaker, p1, p3]
    - [tax_filer, p1, p3]
  persons:
    p1:
      # Rose, 68, citizen, Medicare-entitled, Social Security $1,850/month, claims her granddaughter
      # p3 as a tax dependent and is her caretaker relative.
      facts:
        date_of_birth: "1957-11-08"
        sex: female
        citizenship_status: citizen
        state_of_residence: CO
        is_tax_filer: true
        expects_to_be_claimed_as_dependent: false
        is_required_to_file_tax_return: true
        files_jointly_with_spouse: false
        is_pregnant: false
        expected_number_of_children: 0
        is_medicare_entitled_or_enrolled: true
        is_veteran_or_active_duty: false
        was_foster_youth_at_eighteen: false
        was_enrolled_in_medicaid_at_foster_care_exit: false
        age_at_foster_care_exit: 0
        mother_was_enrolled_in_medicaid_at_birth: false
        has_other_creditable_health_coverage: false
        application_date: "2026-04-10"
        attested_household_income_pct_fpl: 1.03
        is_blind: false
        is_disabled_ssa: false
        receives_ssi: false
      month_defaults:
        social_security_income: 1850
        earned_income: 0
        pension_income: 0
        unemployment_income: 0
        self_employment_net_income: 0
        other_taxable_income: 0
        other_unearned_income: 0
        tax_exempt_interest: 0
        foreign_earned_income_excluded: 0
        pretax_deductions: 0
        child_support_received: 0
        cash_assistance_income: 0
    p2:
      # Marcus, 23 (was in Colorado's extended foster care through age 20; enrolled in Medicaid at
      # exit), citizen, earns $4,200/month throughout.
      facts:
        date_of_birth: "2002-05-20"
        citizenship_status: citizen
        state_of_residence: CO
        is_tax_filer: true
        expects_to_be_claimed_as_dependent: false
        is_required_to_file_tax_return: true
        files_jointly_with_spouse: false
        is_pregnant: false
        expected_number_of_children: 0
        is_medicare_entitled_or_enrolled: false
        is_veteran_or_active_duty: false
        age_at_foster_care_exit: 20
        was_foster_youth_at_eighteen: true
        was_enrolled_in_medicaid_at_foster_care_exit: true
        mother_was_enrolled_in_medicaid_at_birth: false
        has_other_creditable_health_coverage: false
        application_date: "2026-04-10"
        attested_household_income_pct_fpl: 3.16
        is_blind: false
        is_disabled_ssa: false
        receives_ssi: false
      month_defaults:
        earned_income: 4200
        social_security_income: 0
        pension_income: 0
        unemployment_income: 0
        self_employment_net_income: 0
        other_taxable_income: 0
        other_unearned_income: 0
        tax_exempt_interest: 0
        foreign_earned_income_excluded: 0
        pretax_deductions: 0
        child_support_received: 0
        cash_assistance_income: 0
    p3:
      # Tasha, 16, citizen, in school, claimed by her grandmother p1 (not her parent, so the
      # 435.603(f)(2)(i) exception routes her to the non-filer household rules: herself alone, since
      # no parent is a person in this case). Earns nothing in April 2026; earns $1,850/month from
      # January 2027 on - well above a dependent's filing threshold, so is_required_to_file_tax_return
      # is stated true for the whole case (this fact is not month-keyed in this chapter's interface).
      # This also matters for a rule finding recorded in this case's arithmetic comment below: CO-503
      # (ma_magi_household_income) applies the 8.100.4.C.1.f/435.603(d)(2)(ii) "claimed by someone
      # other than a spouse or parent" exclusion to a member's OWN summing household as readily as to
      # someone else's, so a not-required-to-file child claimed by a non-parent with no parent in her
      # own household (exactly 8.100.4.C.1.f.iii's population, whose income should "always count
      # towards the determination of their own eligibility") would otherwise see her own income
      # zeroed out of her own household total. Stating her as required to file sidesteps that defect
      # here (its top-level condition is "not required to file"); the case comment below documents it.
      facts:
        date_of_birth: "2010-03-02"
        citizenship_status: citizen
        state_of_residence: CO
        is_tax_filer: false
        expects_to_be_claimed_as_dependent: true
        is_required_to_file_tax_return: true
        is_enrolled_in_school: true
        is_pregnant: false
        expected_number_of_children: 0
        is_medicare_entitled_or_enrolled: false
        was_foster_youth_at_eighteen: false
        was_enrolled_in_medicaid_at_foster_care_exit: false
        age_at_foster_care_exit: 0
        mother_was_enrolled_in_medicaid_at_birth: false
        dependent_child_has_minimum_essential_coverage: true
        has_other_creditable_health_coverage: false
        application_date: "2026-04-10"
        attested_household_income_pct_fpl: 0.00
        is_blind: false
        is_disabled_ssa: false
        receives_ssi: false
      month_defaults:
        earned_income: 0
        social_security_income: 0
        pension_income: 0
        unemployment_income: 0
        self_employment_net_income: 0
        other_taxable_income: 0
        other_unearned_income: 0
        tax_exempt_interest: 0
        foreign_earned_income_excluded: 0
        pretax_deductions: 0
        child_support_received: 0
        cash_assistance_income: 0
      months:
        "2027-01": {earned_income: 1850}
        "2027-04": {earned_income: 1850}
  # Hand arithmetic, 2026 FPL monthly guidelines: size1 1,330.00; size2 1,803.33 (the only FPL version
  # CO-181 carries reaches 2027 too - see 3.3/3.4's C-5 note on the missing 2027 version).
  #
  # p1. Filer, not claimed, claims p3: household [p1,p3], size 2. Income: her Social Security counts
  #   in full (8.100.4.C.1.b.xi/c.iii). p3's income counts too (or not) by 8.100.4.C.1.f.ii/435.603
  #   (d)(2)(ii): the exclusion for a tax dependent claimed by someone other than a spouse or parent
  #   applies only when the dependent is NOT required to file - p3 is stated as required to file once
  #   her own earnings reach $1,850/month (see her facts), so her income is EXCLUDED from p1's
  #   household in April 2026 (p3 not yet over the filing threshold in substance, though the fact is
  #   stated for the whole case - see her facts comment) and COUNTED from January 2027 on.
  #   April 2026: household income 1,850 (p1 only). Ratio 1,850/1,803.33 = 1.0259.
  #   January/April 2027: household income 1,850 (p1) + 1,850 (p3) = 3,700. Ratio 3,700/1,803.33 =
  #   2.0518. Not a child/pregnant/former-foster-care/needy-newborn in any month; parent/caretaker:
  #   p1 is p3's caretaker relative (435.4's list includes grandparent) and p3 (16) is a dependent
  #   child (CO-544) -> demographics met every month; her highest MAGI standard is the Parents/
  #   Caretaker 60% itself, because the Adults group is closed to her (68, Medicare-entitled -
  #   435.119(b)(1),(3)) -> the 5% disregard IS available (C-2's own worked example) -> even in April
  #   2026, 1.0259 - 0.05 = 0.9759, still > 0.60 -> parent_caretaker false every month. Not an Adult
  #   (68 is over the 65 upper age limit). Category none every month; demographics met (parent/
  #   caretaker) -> status ineligible_income every month. Her real basis would be SSI-related/MSP,
  #   outside this chapter's phase-3 scope (435.603(j)(2)). CHP+: not a child, not pregnant ->
  #   ineligible every month.
  #
  # Rule finding recorded here rather than fixed (per this batch's instructions not to edit rules):
  #   CO-503 (ma_magi_household_income) tests ma_is_dependent_claimed_by_non_parent (CO-563) against
  #   EVERY member of the household being summed, including the household's only member evaluating
  #   their own total. For p3 alone in [p3] with is_required_to_file_tax_return stated false, this
  #   would zero out her OWN income out of her OWN household total - the opposite of 8.100.4.C.1.f.iii
  #   ("[t]he income of a child or tax dependent who does not live with their natural, adopted, or
  #   step parent will always count towards the determination of their own eligibility, even if [it]
  #   is below the tax filing threshold," S167), which is written exactly for a child with no parent
  #   in her household. This case avoids the defect by stating p3 as required to file (a realistic
  #   fact once her own earnings reach $1,850/month), which independently satisfies f.iii by making
  #   the exclusion's own "not required to file" precondition false - but the underlying CO-503 gap
  #   remains for a child with no parent in the case who is genuinely not required to file, and is a
  #   review question this batch flags rather than resolves.
  #
  # p2 (every month, income unchanged). Filer alone: household [p2], size 1, income 4,200, ratio
  #   4,200/1,330.00 = 3.1579. Not needy newborn/child/pregnant; parent/caretaker: no dependent-child
  #   relation -> false; former foster care: under 26, exited Colorado's extended foster care at 20
  #   (within the 18-21 band 8.100.4.H.2.a states, CO-095/C-9) and was enrolled in Medicaid at exit ->
  #   true. 8.100.4.H.2.b/435.150(b) take no income test at all, so the category holds despite 316% of
  #   FPL -> category former_foster_care, status eligible (proves CO-551's mandatory-group order is
  #   not income-ranked and CO-549 takes no income test). CHP+: not a child, not pregnant -> ineligible.
  #
  # p3, April 2026 (the determination that opens her continuous eligibility period). Claimed by her
  #   grandmother (not her parent) -> non-filer household rules: herself, her spouse (none), her own
  #   children (none), and (being under 19) her parents and siblings under 19 living with her - no
  #   parent is a person in this case, so neither term adds anyone. Household [p3], size 1, income 0
  #   (her own), ratio 0.0000. Category child (16 < 19, 0 <= 1.33); continuous eligibility applies
  #   (under 19, child category, CO resident) -> status eligible. End month: continuous_eligibility_
  #   period_start_month is unstated, so ma_child_continuous_eligibility_end_month falls back to the
  #   application month (2026-04) and adds 11 -> 2027-03 (a 12-month period inclusive of its start
  #   month, C-4b). Retroactive coverage start month: 3 months before April -> 2026-01 (this chapter
  #   does not track whether she actually received services or met every requirement in that specific
  #   retroactive month - OQ-55 - so this is the earliest month the 3-month rule alone reaches).
  #   CHP+: Medicaid-eligible -> ineligible_medicaid_eligible.
  #
  # p3, January 2027 (same continuous eligibility period; her own earnings rise to $1,850/month).
  #   Household still [p3] (her own household is unaffected by whether her income counts toward
  #   someone ELSE's household - only p1's household total changes, above), size 1, income 1,850,
  #   ratio 1,850/1,330.00 = 1.3910 (2026 FPL table, the only version this chapter carries). On the
  #   plain test alone: 1.3910 > 1.33, and the 5% disregard (1.3410) still exceeds 1.33 -> she would
  #   fail the Children's category and CHP+'s floor (which requires > 1.42) alike - eligible for
  #   nothing, the coverage gap C-5 raises. But she was found eligible for the Children's category in
  #   April 2026, is still under 19, and her continuous eligibility period (April 2026 through March
  #   2027) has not ended: 42 CFR 435.926(d)/8.100.3.Q.1.a protect her "without regard to changes in
  #   income" -> category still child, status still eligible, notwithstanding her own income now
  #   exceeding the standard. CHP+ ineligible_medicaid_eligible (she remains Medicaid-eligible under
  #   the CE period).
  #
  # p3, April 2027 (one month after the continuous eligibility period ends 2027-03). Household still
  #   [p3], size 1, income unchanged at 1,850, ratio 1.3910 (age is pinned to the case's single
  #   determination date, 2026-04-10, so she is still evaluated as 16 here even though she would
  #   actually be 17 by April 2027 - see the case comment above). The continuous eligibility period
  #   has ended (April 2027 is after 2027-03), so it no longer protects her: on the plain test,
  #   1.3910 > 1.33 and the disregard (1.3410) still exceeds 1.33 -> Medicaid category none, status
  #   ineligible_income. CHP+: 1.3910 does not exceed the 142% floor (nor does 1.3910 - 0.05 = 1.3410)
  #   -> chp_income_within_limit false -> status ineligible_income too. This is C-5's coverage gap
  #   (a child between 133% and 142% of FPL eligible for neither program), demonstrated on a real
  #   household rather than resolved - C-5 is not among the fixes this round made, and the review's
  #   note that the chapter needs the HCPF MAGI-Medicaid income guidelines chart 8.100.4.G.2
  #   incorporates by reference (or a blocking OQ) still stands. The values below are the engine's
  #   actual output under the currently-implemented 133% (CCR text, CO-540/CO-191) reading, recorded
  #   as-is per the review's own C-5 finding rather than corrected here.
  expect:
    p1:
      ma_magi_household_members: [p1, p3]
      ma_magi_household_size: 2
      ma_magi_household_income: {"2026-04": 1850, "2027-01": 3700, "2027-04": 3700}
      ma_meets_citizenship_requirement: true
      ma_is_emergency_medicaid_only: {"2026-04": false, "2027-01": false, "2027-04": false}
      ma_magi_category: {"2026-04": none, "2027-01": none, "2027-04": none}
      ma_magi_eligibility_status: {"2026-04": ineligible_income, "2027-01": ineligible_income, "2027-04": ineligible_income}
      ma_continuous_eligibility_applies: {"2026-04": false, "2027-01": false, "2027-04": false}
      chp_eligibility_status: {"2026-04": ineligible, "2027-01": ineligible, "2027-04": ineligible}
    p2:
      ma_magi_household_members: [p2]
      ma_magi_household_size: 1
      ma_magi_household_income: {"2026-04": 4200, "2027-01": 4200, "2027-04": 4200}
      ma_meets_citizenship_requirement: true
      ma_is_emergency_medicaid_only: {"2026-04": false, "2027-01": false, "2027-04": false}
      ma_magi_category: {"2026-04": former_foster_care, "2027-01": former_foster_care, "2027-04": former_foster_care}
      ma_magi_eligibility_status: {"2026-04": eligible, "2027-01": eligible, "2027-04": eligible}
      ma_continuous_eligibility_applies: {"2026-04": false, "2027-01": false, "2027-04": false}
      chp_eligibility_status: {"2026-04": ineligible, "2027-01": ineligible, "2027-04": ineligible}
    p3:
      ma_magi_household_members: [p3]
      ma_magi_household_size: 1
      ma_magi_household_income: {"2026-04": 0, "2027-01": 1850, "2027-04": 1850}
      ma_meets_citizenship_requirement: true
      ma_is_emergency_medicaid_only: {"2026-04": false, "2027-01": false, "2027-04": false}
      ma_magi_category: {"2026-04": child, "2027-01": child, "2027-04": none}
      ma_magi_eligibility_status: {"2026-04": eligible, "2027-01": eligible, "2027-04": ineligible_income}
      ma_continuous_eligibility_applies: {"2026-04": true, "2027-01": false, "2027-04": false}
      ma_child_continuous_eligibility_end_month: "2027-03"
      ma_retroactive_coverage_start_month: "2026-01"
      chp_eligibility_status: {"2026-04": ineligible_medicaid_eligible, "2027-01": ineligible_medicaid_eligible, "2027-04": ineligible_income}
- id: CO-06
  title: Nursing facility admission with a transfer penalty; community spouse on QMB below the MMMNA; working disabled adult son on the Buy-In
  # Designed by the phase-4 non-MAGI/LTC review (docs/reviews/non-magi-ltc-phase-4.md S3),
  # added by the fix round that implemented C-9..C-14 and the minor/completeness findings.
  # Expectations are what the FIXED items compute, not always what the review derived by hand,
  # because two fixes this round change figures the review worked out under the unfixed rules:
  #   - p3 ma_ssi_countable_income is 1157.5, not the review's 1167.5. C-9 (CO-605) now carries
  #     the unused part of the $20 general income exclusion to earned income, per 20 CFR
  #     416.1124(c)(12) (S310): p3 has no unearned income, so the full $20 (not just $65) is
  #     subtracted from his $2,400 earnings before the one-half disregard: (2400 - 65 - 20) x
  #     0.5 = 1157.5. This does not change ma_wawd_eligible/ma_wawd_premium, which read WAwD's
  #     own applicant-only income computation (8.100.6.P.1.b), not ma_ssi_countable_income.
  #   - p1's CSRA and attributed resources use the C-13 fix's snapshot fact
  #     (countable_resources_couple_at_snapshot), not the current-month countable_resources_couple;
  #     both are supplied as 180000 here (no spend-down since the snapshot), so the figures the
  #     review derived (ma_csra 157920, attributed resources 22080) are unchanged.
  #   - p1's home equity exception is read through spouse_or_dependent_child_resides_in_home
  #     (C-20), supplied true because Linda (p2) lives in the home; this does not change the
  #     outcome here since home_equity (240000) is under home_equity_limit (730000) either way.
  as_of: "2026-11-01"
  relationships:
    - [spouse, p1, p2]
    - [parent, p1, p3]
    - [parent, p2, p3]
  persons:
    p1:
      # Robert, 74, citizen, entered a nursing facility 2026-10-05, expects to remain; gave a nephew
      # $54,000 in 2025-06, inside the 60-month look-back (CO-252), no exception applies.
      facts:
        date_of_birth: "1952-04-18"
        sex: male
        citizenship_status: citizen
        lawful_presence_status: lawfully_present
        state_of_residence: CO
        is_pregnant: false
        is_veteran_or_active_duty: false
        is_blind: false
        is_disabled_ssa: false
        receives_ssi: false
        is_medicare_entitled_or_enrolled: true
        receives_medicare_part_a: true
        is_entitled_to_medicare_part_a_on_basis_of_disability: false
        is_employed: false
        is_disabled_for_buy_in: false
