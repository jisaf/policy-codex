  # SNAP (fix-round case, C-10/group 10). Both are U.S. citizens living together as spouses, so the
  # unit is [p1, p2] under 273.1(a)-(b)(1); both are 60+ (snap_elderly_age), so
  # snap_household_has_elderly_or_disabled_member is true for the unit and the gross income test
  # (7 CFR 273.10(e)(2)(i)(B), S103) does not apply to them at all.
  # No member receives SSI/TANF/state cash assistance, so not BCE. Gross income = 1650 + 900 = 2550,
  # at or below 200% FPL for household size 2 ($3,408, CO-122) -> Expanded Categorical Eligibility
  # (category: expanded_categorical). Categorically eligible households are deemed to meet the gross,
  # net, and resource tests (10 CCR 2506-1 4.401,A,2 and 4.408,A), so the resource test does not bite
  # here even though countable resources (4200) are under the elderly/disabled limit (4500) anyway.
  # Deductions: no earned income, so no earned income deduction. Standard deduction (size 2) = 209.
  # Excess medical deduction: only p1's $180 counts (p1 is elderly); 180 - 35 threshold = 145.
  # Adjusted income before shelter = 2550 - 209 - 145 = 2196.
  # Shelter: rent 1100 (utility allowance 0, no SUA rule yet - OQ-36); shelter costs = 1100.
  # Household has an elderly member, so the shelter deduction is uncapped:
  # excess shelter = max(0, 1100 - 0.5*2196) = max(0, 1100 - 1098) = 2.
  # Net income = max(0, 2196 - 2) = 2194 (already a whole dollar, no rounding adjustment).
  # Maximum allotment (size 2) = 546; benefit reduction = ceil(0.3 * 2194) = ceil(658.2) = 659.
  # Maximum-allotment-less-reduction = max(0, 546 - 659) = 0. Household size 2 is at or below the
  # minimum-allotment limit (2) and passes every applicable test (deemed via categorical eligibility),
  # so the minimum allotment floor applies: allotment = max(0, 24) = 24.
  # Eligible (categorically eligible, allotment > 0). Both are over snap_abawd_max_age (64), so
  # not_subject to the ABAWD time limit; both are over snap_work_registration_max_age (59), so not
  # work registrants.
  expect:
    p1:
      snap_household_members: [p1, p2]
      snap_eligible_household_members: [p1, p2]
      snap_household_size: 2
      snap_is_ineligible_member: false
      snap_meets_citizenship_requirement: true
      snap_eligibility_category: expanded_categorical
      snap_household_gross_income: {"2026-10": 2550}
      snap_household_net_income: {"2026-10": 2194}
      snap_allotment: {"2026-10": 24}
      snap_eligibility_status: {"2026-10": eligible}
      snap_abawd_time_limit_status: {"2026-10": not_subject}
      snap_is_work_registrant: false
    p2:
      snap_household_members: [p1, p2]
      snap_eligible_household_members: [p1, p2]
      snap_household_size: 2
      snap_is_ineligible_member: false
      snap_meets_citizenship_requirement: true
      snap_eligibility_category: expanded_categorical
      snap_household_gross_income: {"2026-10": 2550}
      snap_household_net_income: {"2026-10": 2194}
      snap_allotment: {"2026-10": 24}
