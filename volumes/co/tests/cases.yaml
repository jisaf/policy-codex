- id: CO-71
  title: Undocumented pregnant mother on CHP+ prenatal with a CHP+ son; her LPR mother in breast cancer treatment; her LPR grandfather inside the five-year bar on OAP health care
  # Phase 7 complex case (Medicaid and CHP+ completion). Three generations, one month (2026-10).
  # p1 Lucia, 29, undocumented, pregnant with one, files taxes (ITIN) claiming her son p4, earns
  # $5,200/month. Cover All Coloradans covers a pregnant person regardless of status in MAGI
  # Pregnant and CHP+ (8.100.3.G.1.g.ix.1.a, 10 CCR 2505-3 110.1.B.5.o), so with CHP+ prenatal she
  # is not emergency-only; but it does not reach limited family planning (phase 7 fix round, S-2,
  # OQ-214), whose status test (8.100.4.G.8) she fails, so her family planning route is the state
  # reproductive health-care program. MAGI household [p1, p4] plus her expected child: size 3, monthly FPL
  # 27320/12 = 2276.67, ratio 5200/2276.67 = 2.284; less the 5% disregard 2.234, over the 195%
  # pregnant standard -> Medicaid ineligible_income; CHP+ prenatal band (195%, 260%] -> eligible.
  # p4 Mateo, 6, citizen, same household and ratio: over the 142% children's standard, inside
  # CHP+'s (142%, 260%] band, uninsured -> CHP+ eligible_child.
  # p2 Rosa, 58, Lucia's mother, LPR since 2010 (past the bar), non-filer, earns $2,600/month,
  # uninsured, screened by a CWCCI Qualified Entity and found in need of breast cancer treatment.
  # Own household [p2], ratio 2600/1330 = 1.955 (1.905 after the disregard) over the 133% adult
  # standard -> no full-coverage category -> BCCP eligible. Her limited family planning household
  # counts her as two (8.100.4.E.3): 2600/1803.33 = 1.442, inside (133%, 260%] -> limited family
  # planning by income, but BCCP is itself full State Plan coverage (8.715.7.A), so limited family
  # planning (for those not eligible for a full-coverage category, 8.100.4.G.8) does not apply:
  # full_coverage (phase 7 fix round, S-1).
  # p3 Tomas, 72, Rosa's father, LPR since 2023-03-01 (inside the five-year bar), no income, $500 in
  # resources, no Medicare. OAP has no five-year bar (3.520.67.E), so he receives OAP-A; Medicaid's
