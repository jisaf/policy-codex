  # Hand arithmetic, 2026 FPL monthly guidelines (annual/12): size2 1,803.33; size4 2,750.00.
  #
  # October 2026 (household income $2,200 = p1 $1,600 + p2 $600).
  # p1: filer + spouse + tax dependent p3 = [p1,p2,p3]; p4 is claimed by p5, not p1, so excluded.
  #   Size 3 members + 1 for p1's own pregnancy = 4. Income: p1+p2 count, p3 excluded (claimed
  #   dependent, not required to file, her parent p1 is in the summing household) = 2,200.
  #   Ratio 2,200/2,750.00 = 0.8000. Not needy newborn/child/parent-caretaker/former-foster-care;
  #   pregnant: 0.80 <= 1.85 -> category pregnant (also locked in from October itself under
  #   ma_is_in_pregnancy_coverage_period, since the coverage period's start month equals the
  #   application month). Citizenship: LPR since 2023-06-15, 3 years < 5-year bar, not a veteran ->
  #   fails the qualified-non-citizen arm; but pregnant -> Cover All Coloradans (8.100.3.G.1.g.viii.1)
  #   protects her regardless of status -> ma_meets_citizenship_requirement true, not emergency-only,
  #   status eligible. Retroactive start month: 3 months before October -> 2026-07. CHP+: Medicaid-
  #   eligible -> ineligible_medicaid_eligible.
  # p2: household [p1,p2,p3] (joint filer with p1, no dependents of his own), size 4 (p1's pregnancy
  #   counts for every household member, 8.100.4.E.2), income 2,200, ratio 0.8000. Not pregnant/child;
  #   parent/caretaker: stepfather of p3 (18, in school -> a dependent child, CO-544) and p4 -
  #   demographics met, but his highest MAGI standard is the Adults' 1.33 (not 0.60), since he also
  #   qualifies demographically as an Adult -> the 5% disregard is not available at 60% (CO-539/C-2)
  #   -> 0.80 > 0.60 -> parent_caretaker false. Adult: 34, not pregnant, no Medicare, not already a
  #   higher category, dependent children (p3, p4) have MEC -> demographics met; 0.80 <= 1.33 ->
  #   category adult. Citizenship: qualified non-citizen inside the bar, not a veteran, not under 19,
  #   not pregnant/postpartum -> ma_meets_citizenship_requirement false; resident with a real category
  #   -> ma_is_emergency_medicaid_only true (C-11: he otherwise qualifies for the Adults category) ->
  #   status emergency_only. CHP+: not a child, not pregnant -> ineligible.
  # p3: claimed by her own parent p1 -> 435.603(f)(2) basic rule -> household = p1's = [p1,p2,p3],
  #   size 4, income 2,200, ratio 0.8000. Under 19, 0.80 <= 1.33 -> category child, status eligible.
  #   Continuous eligibility applies (under 19, child category, CO resident) -> end month = 11 months
  #   after the application month (2026-10) = 2027-09. CHP+ ineligible_medicaid_eligible.
  # p4: claimed by his non-custodial father p5, who this chapter cannot mark as living apart (OQ-42,
  #   see case comment) -> ma_magi_household_members treats this exactly like an ordinary claimed-
  #   dependent case: household = p5's filer household = [p4,p5], size 2. Income: p5 counts ($5,000);
  #   p4 is excluded (claimed dependent, not required to file, and his parent p5 IS a member of the
  #   summing household) -> income 5,000. Ratio 5,000/1,803.33 = 2.7727, over every standard including
  #   CHP+'s 260% ceiling. Category none, ma_meets_some_category_demographics true (under 19) ->
  #   status ineligible_income. CHP+: income ratio 2.7727 exceeds the 260% upper bound even with the
  #   5% disregard (2.7227) -> chp_income_within_limit false -> status ineligible_income (not
  #   eligible_child - the review's prose for the unfixed-C-12 case says eligible_child here, but that
  #   is inconsistent with its own 2.7727 ratio against CHP+'s 260% ceiling; the engine's arithmetic,
  #   confirmed by hand, is the value recorded below).
  # p5: filer + tax dependent p4 = [p4,p5], size 2 (same group p4 computes, since neither has any
  #   other filer/spouse edge), income 5,000 (p4 excluded, his own parent p5 is in the household),
  #   ratio 2.7727. Parent/caretaker demographics: the stated parent edge to p4 is read as living
  #   together (this volume's convention, no lives_with fact exists - see CO-547's own note that this
  #   route is not one the statute licenses for a non-custodial parent), but 2.7727 > 0.60 and the
  #   disregard is not available (his highest standard is the Adults' 1.33) -> parent_caretaker false.
  #   Adult: demographics met (MEC on p4 stated true) but 2.7727 - 0.05 = 2.7227 > 1.33 -> false.
  #   Category none, demographics true (parent/caretaker) -> status ineligible_income. CHP+: not a
  #   child, not pregnant -> ineligible.
  #
  # November 2026 (p1's earnings rise to $5,000; household income $5,600).
  # p1: household [p1,p2,p3], size 4, income 5,600, ratio 5,600/2,750.00 = 2.0364. Still pregnant and
  #   her pregnancy coverage period (locked in from October, ma_is_in_pregnancy_coverage_period) runs
  #   "regardless of changes in the woman's financial circumstances" (8.100.4.G.5, C-13) -> category
  #   still pregnant, status still eligible, despite 2.0364 being over even the 185% pregnant standard.
  #   Citizenship still protected (pregnant). CHP+: Medicaid-eligible -> ineligible_medicaid_eligible.
  # p2: household [p1,p2,p3], income 5,600, ratio 2.0364. Parent/caretaker: over 0.60 by far, no
  #   disregard rescue -> false. Adult: 2.0364 - 0.05 = 1.9864 > 1.33 -> false. Category none.
  #   Citizenship still false (inside the bar); ma_is_emergency_medicaid_only requires a category other
  #   than none, so it is false this month (C-11) -> status ineligible_income, not emergency_only.
  #   CHP+ ineligible (not a child/pregnant).
  # p3: household [p1,p2,p3], ratio 2.0364, over the child standard even with the disregard (1.9864 >
  #   1.33) on the plain test - but she was found in the Children's category in October and is still
  #   under 19 and a CO resident, so 42 CFR 435.926(d)/8.100.3.Q.1.a's continuous-eligibility period
  #   (opened 2026-10, running through 2027-09, C-4) protects her "without regard to changes in
  #   income": category still child, status still eligible. CHP+ ineligible_medicaid_eligible.
  # p4/p5: p5's own earnings are unchanged, so p4's household income is still $5,000/ratio 2.7727 in
  #   November (p4 never had ma_is_child_category true in October, so no continuous eligibility period
  #   ever opened for him) - both persons' values are unchanged from October.
  expect:
    p1:
      ma_magi_household_members: [p1, p2, p3]
      ma_magi_household_size: 4
      ma_magi_household_income: {"2026-10": 2200, "2026-11": 5600}
