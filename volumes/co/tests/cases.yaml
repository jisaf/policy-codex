  # now 1.42 and the gap above is closed. Tasha's 1.3910 is within 142% in January and April 2027:
  # category child and status eligible in both months on the plain test, and continuous eligibility
  # applies in both (under 19, child category, resident) - in April 2027 it opens a new period.
