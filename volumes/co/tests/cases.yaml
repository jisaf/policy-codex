- id: CO-08
  title: Two caretakers (one employed, one in job search); a 14-year-old with additional care needs; an 18-year-old in high school with earnings; an undocumented adult relative in the home; heat included in rent
  # Designed in the phase-6 review (docs/reviews/cccap-leap-phase-6.md S3.3), renumbered from CO-06 to CO-08
  # (CO-06/CO-07 taken by concurrent medicaid/cash fix rounds). Expectations below are what this batch's
  # FIXED rules actually produce (verified with npx vite-node scripts/eval-case.ts co CO-08 ... against a
  # scratch copy of this file, then restored), not the review's hand-derived pre-fix numbers - see the
  # per-person comments below for the two places the two differ and why.
  # p6 is an undocumented adult relative living in the dwelling. shares_heating_fuel_with (CO-895) is the
  # per-person fact that extends the LEAP closure's spouse/parent/child edges to an over-age child or an
  # affirmatively-stated economic-unit member (OQ-132); it cannot join two people with no relationship edge
  # between them at all, and p6 has none to p1-p4 (only a buys_prepares_with co-residence edge, added so the
  # engine registers him as a graph node at all - it is not one of the roles the CCCAP/LEAP closures cross).
  # So p6 is his own one-person LEAP/CCCAP household on this batch's facts, per OQ-132's own limitation, not
  # the single five/six-person household 3.751.1's "living together as one economic unit" text would produce
  # if the engine could register a symmetric relationship role for it.
  as_of: "2026-12-01"
  relationships:
    - [spouse, p1, p2]
    - [parent, p1, p3]
    - [parent, p1, p4]
    - [parent, p2, p3]
    - [parent, p2, p4]        # step-parent; adult caretaker under 3.103.C
    - [buys_prepares_with, p1, p6]
  persons:
    p1:
      # Rosa, 34, citizen, works 150 hours a month for $2,600; mother of p3 and p4.
      facts:
        date_of_birth: "1992-06-11"
        sex: female
        citizenship_status: citizen
        lawful_presence_status: lawfully_present
        state_of_residence: "CO"
        is_enrolled_in_school: false
        is_in_job_search_activity: false
        has_additional_care_needs: false
        is_protective_services_child_care_case: false
        is_emancipated_minor: false
        is_homeless: false
        in_medical_institution: false
        is_responsible_for_heating_costs: true      # heat included in rent, non-subsidized (3.752.25.A.2)
        has_primary_heating_source: true            # building furnace (3.751.1 "Primary Heating Source")
        cccap_entry_income_limit_pct_fpl: 1.85       # 3.111.H.1.a's stated floor (185% FPL)
        cw_eligibility_status: ineligible_income
        cw_grant_amount: 0
        countable_liquid_resources: 0                # 3.111.H.4.c self-declaration, well under the $1M limit
        countable_nonliquid_resources_snap: 0
      month_defaults:
        earned_income: 2600
        hours_worked: 150
        self_employment_net_income: 0
        social_security_income: 0
        pension_income: 0
        unemployment_income: 0
        child_support_received: 0
        cash_assistance_income: 0
        other_unearned_income: 0
    p2:
      # Andre, 36, citizen, laid off in November and in the job search activity (3.111.G.3); no earnings.
      facts:
        date_of_birth: "1990-02-27"
        sex: male
        citizenship_status: citizen
        lawful_presence_status: lawfully_present
        state_of_residence: "CO"
        is_enrolled_in_school: false
        is_in_job_search_activity: true
        has_additional_care_needs: false
        is_protective_services_child_care_case: false
        is_emancipated_minor: false
        is_homeless: false
        in_medical_institution: false
        is_responsible_for_heating_costs: true
        has_primary_heating_source: true
        cccap_entry_income_limit_pct_fpl: 1.85
        cw_eligibility_status: ineligible_income
        cw_grant_amount: 0
        countable_liquid_resources: 0
        countable_nonliquid_resources_snap: 0
      month_defaults:
        earned_income: 0
        hours_worked: 0
        self_employment_net_income: 0
        social_security_income: 0
        pension_income: 0
        unemployment_income: 0
        child_support_received: 0
        cash_assistance_income: 0
        other_unearned_income: 0
    p3:
      # Mateo, 14, citizen, verified additional care needs (IEP): an eligible child only through the
      # second arm of 3.111.F (under 19 with additional care needs). No income.
      facts:
        date_of_birth: "2012-05-20"
        sex: male
        citizenship_status: citizen
        lawful_presence_status: lawfully_present
        state_of_residence: "CO"
        is_enrolled_in_school: true
        is_in_job_search_activity: false
        has_additional_care_needs: true
        is_protective_services_child_care_case: false
        is_emancipated_minor: false
        is_homeless: false
