  # No member receives SSI/TANF/state cash assistance, so not BCE. Gross income = 1650 + 900 = 2550,
  # at or below 200% FPL for household size 2 ($3,408, CO-122) -> Expanded Categorical Eligibility
  # (category: expanded_categorical). Categorically eligible households are deemed to meet the gross,
  # net, and resource tests (10 CCR 2506-1 4.401,A,2 and 4.408,A), so the resource test does not bite
  # here even though countable resources (4200) are under the elderly/disabled limit (4500) anyway.
