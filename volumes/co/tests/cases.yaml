  expect:
    p1:
      cw_assistance_unit_members: [p1, p2, p4]
      cw_unit_size: 3
      cw_countable_income: {"2026-10": 310}
      cw_need_standard: 439          # C-5 fixed: Two Caretakers/1 child row (D-61.md:955); matches the review's own derivation
      cw_grant_standard: 649         # C-5 fixed: Two Caretakers/1 child row
      cw_grant_amount: {"2026-10": 517}   # C-1 fixed: 649 - (400 x 0.33 = 132) = 517; matches the review's own derivation
      # C-2/C-3 fixed: cw_eligibility_status is "eligible", not "time_limit_reached" as the review derived.
      # Under the OLD rules the review reviewed, p2's own 61 months (read person-by-person) drove the unit
      # to time_limit_reached with no unit-wide effect from p1's extension. C-2/C-3 make both the sixty-month
      # test AND the extension unit-level (3.606.6.C, "an assistance unit containing an individual ... shall
      # not be eligible ... unless granted an extension"; the extension itself is granted "for" the unit,
      # D-61.md:1179, :1183). p1's approved domestic-violence extension (has_domestic_violence_extension_approved)
      # is therefore an extension of THIS unit, which now also covers p2's 61 months - the unit is not
      # time_limit_reached, it is extended. The review's derivation predates the C-3(a) fix that made the
      # extension read over cw_assistance_unit_members rather than the person asked.
      cw_eligibility_status: {"2026-10": eligible}
      cw_time_limit_reached: false
      cw_is_work_eligible_individual: {"2026-10": true}
      cw_meets_work_participation: {"2026-10": false}
      af_category: {"2026-10": none}
      af_oap_grant: {"2026-10": 0}
      af_and_grant: {"2026-10": 0}
    p2:
      cw_assistance_unit_members: [p1, p2, p4]
      cw_unit_size: 3
      cw_countable_income: {"2026-10": 310}
      cw_grant_amount: {"2026-10": 517}
      cw_eligibility_status: {"2026-10": eligible}    # C-2/C-3 fixed: the unit's extension (p1's) now covers p2 too - see p1's comment
      cw_time_limit_reached: false
      cw_is_work_eligible_individual: {"2026-10": true}
      cw_meets_work_participation: {"2026-10": false}   # K-2: no Colorado Works sanction item exists, so his work-program noncompliance (is_disqualified_for_work_requirement_noncompliance, a SNAP-chapter fact) does not reduce cw_grant_amount - OQ-141
      af_category: {"2026-10": none}
      af_oap_grant: {"2026-10": 0}
      af_and_grant: {"2026-10": 0}
    p3:
      cw_assistance_unit_members: []
      cw_unit_size: 0
      cw_countable_income: {"2026-10": 0}
      cw_eligibility_status: {"2026-10": ineligible_no_dependent_child}
      cw_time_limit_reached: false
      af_category: {"2026-10": and_cs}    # C-4/K-6 fixed: eligible - ssi_income $700 < the $994 federal benefit rate (ma_ssi_federal_benefit_rate_individual, CO-235), so she is "not receiving the full SSI benefit standard" (3.546)
      af_oap_grant: {"2026-10": 0}
      # af_and_grant is still the full $967 standard, not standard-minus-700 as a hand reading of 3.546 might
      # suggest. af_countable_income (CO-946) does not read ssi_income at all (it sums social_security_income,
      # pension_income, unemployment_income, cash_assistance_income, child_support_received, and
      # other_unearned_income - none of which carries the SSI amount) and 3.549.A.2.b's subtract-SSI-then-add-
      # back step is unmodeled (OQ-115, OQ before this fix round and still open after it). K-6 closes the
      # AND-CS *eligibility* gate (3.546's "not receiving the full SSI benefit standard") but not the AND-CS
      # *payment* computation, which OQ-115 already recorded as a gap this round does not close.
      af_and_grant: {"2026-10": 967}
    p4:
      cw_assistance_unit_members: [p1, p2, p4]
      cw_unit_size: 3
      cw_countable_income: {"2026-10": 310}
      cw_grant_amount: {"2026-10": 517}
      cw_eligibility_status: {"2026-10": eligible}    # C-2/C-3 fixed: same unit-level extension as p1/p2
      cw_time_limit_reached: false
      cw_is_work_eligible_individual: {"2026-10": false}
      af_category: {"2026-10": none}
      af_oap_grant: {"2026-10": 0}
      af_and_grant: {"2026-10": 0}
    p5:
