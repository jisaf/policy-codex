    # 2026-12-02, but that has passed, as has the 10-day due date (2026-11-12). Only the child support and
    # dependent care expenses are unverified (2), so the household is certified without those deductions
    # (273.2(f)(3)(ii), 4.502.A.3). Residency is not required of a homeless household.
    # Medicaid: p1's citizenship (no SSA match, no document) is the only pending element; the DMV match
    # verified his identity. The reasonable opportunity period ran from receipt of the notice
    # (2026-11-07) for 90 days to 2027-02-05, so it has expired. p2's birth certificate plus a school
    # record (acceptable identity for a child under 19) complete hers. CHP+ reads the same elements.
    # Colorado Works (unit p1, p2): p1's citizenship and residency (no homeless exception in 3.604.3.B.2.f)
    # are 2 outstanding, past the 11-day due date. CCCAP: p1's residency and child support paid (job
    # search activity verified), past the 15-day period. LEAP: only SSNs required (no heating costs), complete.
    # Fix round (docs/reviews/verification-phase-9.md): CHP+ cannot reach p1 (34, not pregnant) and Adult
    # Financial cannot either (under the OAP age, no disability basis): not_applicable for both. Colorado
    # Works: p1's DMV identity match is not a produced lawful-presence document (3.604.3.I.4.a), so 3 are
    # pending; residency (11 days) is past due. CCCAP: p1's child support affects only the deduction
    # (3.111.K), so the eligibility count is 1 (residency) and the deduction count 1; still past_due. LEAP:
    # a household reporting no income has its zero income verified (3.755.21.H), outstanding for p1, so
