id: CO-1298
name: "Summer EBT (SUN Bucks): eligibility status"
identifier: sebt_eligibility_status
kind: derived
type: one of
options: [eligible_categorical, eligible_income, ineligible]
scope: person-month
program: SunBucks
role: outcome
meaning: Whether the child is eligible for Summer EBT (Colorado's SUN Bucks) and on which ground - categorically eligible (a member of a household receiving SNAP or TANF, or another categorical ground) and either school aged or enrolled in an NSLP/SBP school; or enrolled in an NSLP/SBP school with household income at or below the reduced-price meal guideline - per 7 CFR 292.2, 292.5 and 292.6.
precision: "SNAP and TANF receipt is read from the receipt records of the members of the child's household, the persons living with the child as one economic unit (sebt_household_child_receives_snap_or_tanf, CO-2708; 7 CFR 292.2; OQ-552, resolved). A child for whom any categorical prong is unknown and the income test is not met is unknown. The period of eligibility spans the preceding school year through the summer (292.7); coverage review C-6: SNAP and TANF receipt is read for every month of the period up to the month evaluated (CO-2708; 292.6, \"at any time during the period of eligibility\"), and, coverage review 2 N-3, Colorado Works receipt also from the month's tanf_cash_income and the other categorical grounds at any time in the period up to the determination date: foster care and homelessness that ended in the period (foster_care_exit_date, homelessness_ended_date, read by CO-4527), FDPIR receipt that ended in the period (fdpir_participation_ended_date, CO-4528), and migrant, runaway, Head Start and the other documented grounds as identifications stated for the period (CO-2848 to CO-2850, CO-2852). School age is derived from Colorado's compulsory attendance ages (sebt_is_school_aged, CO-1292, C.R.S. 22-33-104(1)(a)). Colorado's choices among the optional streamlined-certification sources (Medicaid and other means-tested programs, 292.12(d)(2)) are not in any published Colorado text: there is no Colorado Summer EBT rule (OQ-255). CDHS review C-10: the month evaluated lies in the period of eligibility of the summer sebt_summer_year (CO-2581) names, so SNAP or TANF participation in that month, or in an earlier month of the same period, establishes eligibility for that summer (292.7(a)); the benefit is keyed to the same summer. Coverage review 2 N-7: a household that refuses to cooperate with verification has its eligibility terminated (292.14(f)(5), S1093; sebt_household_refused_verification, CO-4854, read as false when not stated), so the child is ineligible. Coverage review 3 F3-3: the termination for refusing to cooperate (292.14(f)(5)) applies to a household required to verify (sebt_requires_verification_of_income, CO-1699), so a household 292.14(f)(1) excepts, such as a SNAP household, is not terminated by a refusal stated for it."
derived: [case, [[all, [otherwise, sebt_household_refused_verification, false], sebt_requires_verification_of_income], ineligible], [[all, [any, sebt_is_school_aged, is_enrolled_in_nslp_school], [any, sebt_household_child_receives_snap_or_tanf, sebt_other_categorical_basis]], eligible_categorical], [[all, is_enrolled_in_nslp_school, [<=, school_meal_household_income, sebt_income_eligibility_limit]], eligible_income], [else, ineligible]]
sources: [S790, S791, S792, S793, S1821, S1093]
open: [OQ-255]
implemented: engine
tags: [sebt, income]
rationale: "No existing item determines Summer EBT eligibility; SunBucks is a new program in the volume. Declared as an outcome. Vocabulary fix round (governance read.cross_program): accepts_from lists the other programs' items this rule reads on purpose. Summer EBT streamlined certification names SNAP receipt (7 CFR 292, S790). Heavier-definitions audit H-1 and dual-entry audit 4.2 (audit fix round): SNAP and TANF receipt is read from the receipt records for any child of the household (sebt_household_child_receives_snap_or_tanf, CO-2708), not from this volume's SNAP eligibility; 292.2 says the children \"are receiving\" assistance."
tests:
  - {id: CO-1298-T1, title: "School-aged child in a SNAP household - categorical, no school enrollment needed", as_of: "2026-10-01", month: "2026-10", given: {is_enrolled_in_nslp_school: false, sebt_household_child_receives_snap_or_tanf: true, sebt_is_school_aged: true}, expect: eligible_categorical}
  - {id: CO-1298-T2, title: "Enrolled, no categorical ground, income under the limit", as_of: "2026-10-01", month: "2026-10", given: {is_enrolled_in_nslp_school: true, sebt_household_child_receives_snap_or_tanf: false, sebt_other_categorical_basis: false, school_meal_household_income: 4000, sebt_income_eligibility_limit: 5088, sebt_is_school_aged: true}, expect: eligible_income}
  - {id: CO-1298-T3, title: "Enrolled, income over the limit", as_of: "2026-10-01", month: "2026-10", given: {is_enrolled_in_nslp_school: true, sebt_household_child_receives_snap_or_tanf: false, sebt_other_categorical_basis: false, school_meal_household_income: 6000, sebt_income_eligibility_limit: 5088, sebt_is_school_aged: true}, expect: ineligible}
  - {id: CO-1298-T4, title: "Not school aged and not enrolled - ineligible even in a SNAP household", as_of: "2026-10-01", month: "2026-10", given: {is_enrolled_in_nslp_school: false, sebt_household_child_receives_snap_or_tanf: true, sebt_is_school_aged: false}, expect: ineligible}
  - {id: CO-1298-T5, title: "Coverage review C-6 (probe RV-S1): a 10-year-old in an NSLP school, household income above the limit, SNAP through December 2026: still categorically eligible in March 2027", as_of: "2027-03-01", month: "2027-03", given: {sebt_household_child_receives_snap_or_tanf: true, sebt_other_categorical_basis: false, sebt_is_school_aged: true, is_enrolled_in_nslp_school: true, school_meal_household_income: 6000, sebt_income_eligibility_limit: 3337}, expect: eligible_categorical}
  - {id: CO-1298-T6, title: "Coverage review 2 N-7: a child eligible by income whose household, selected for verification, refused to cooperate: eligibility terminated (292.14(f)(5))", as_of: "2027-03-01", month: "2027-03", given: {sebt_household_refused_verification: true, sebt_requires_verification_of_income: true, sebt_household_child_receives_snap_or_tanf: false, sebt_other_categorical_basis: false, sebt_is_school_aged: true, is_enrolled_in_nslp_school: true, school_meal_household_income: 3000, sebt_income_eligibility_limit: 3337}, expect: ineligible}
  - {id: CO-1298-T7, title: "Coverage review 3 F3-3: the child of a SNAP household, which is not required to verify (292.14(f)(1)), stated as refusing: still categorically eligible", as_of: "2027-03-01", month: "2027-03", given: {sebt_household_refused_verification: true, sebt_requires_verification_of_income: false, sebt_household_child_receives_snap_or_tanf: true, sebt_other_categorical_basis: false, sebt_is_school_aged: true, is_enrolled_in_nslp_school: true, school_meal_household_income: 6000, sebt_income_eligibility_limit: 3337}, expect: eligible_categorical}
