kind: derived
type: yes/no
scope: person-month
program: SunBucks
role: outcome
meaning: Whether the child's household must verify income for Summer EBT and neither direct verification nor the household's documentation has confirmed eligibility.
derived: [all, sebt_requires_verification_of_income, [not, [any, sebt_eligibility_directly_verified, school_meal_household_income_verification_received]]]
