id: CO-1695
name: "SUN Bucks: income verification is pending"
identifier: sebt_income_verification_is_pending
kind: derived
type: yes/no
scope: person-month
program: SunBucks
role: outcome
meaning: Whether the child's household must verify income for Summer EBT and neither direct verification nor the household's documentation has confirmed eligibility.
precision: "False where SUN Bucks verification does not apply to the person (sebt_verification_is_applicable, CO-2587; case worker review B2). Due by: none stated: Colorado's Summer EBT response period is in the Plan for Operations and Management, which was not fetched (OQ-377)."
derived: [all, sebt_verification_is_applicable, [all, sebt_requires_verification_of_income, [not, [any, sebt_eligibility_directly_verified, school_meal_household_income_verification_received]]]]
sources: [S1091, S1093, S1094]
implemented: engine
tags: [verification, sebt]
rationale: "Review U-1: the count items held this test as an anonymous arm, so no outcome told a worker which document was outstanding and for whom; the count now sums this item."
tests:
  - {id: CO-1695-T1, month: "2026-10", as_of: "2026-10-01", given: {sebt_verification_is_applicable: true, sebt_requires_verification_of_income: true, sebt_eligibility_directly_verified: false, school_meal_household_income_verification_received: false}, expect: true}
  - {id: CO-1695-T2, month: "2026-10", as_of: "2026-10-01", given: {sebt_verification_is_applicable: true, sebt_requires_verification_of_income: true, sebt_eligibility_directly_verified: true}, expect: false}
  - {id: CO-1695-TNA, title: "B2: not pending where SUN Bucks verification does not apply", as_of: "2026-10-01", month: "2026-10", given: {sebt_verification_is_applicable: false}, expect: false}
