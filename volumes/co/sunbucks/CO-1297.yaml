id: CO-1297
name: "Summer EBT: monthly income eligibility limit"
identifier: sebt_income_eligibility_limit
kind: derived
type: money
scope: person
program: SunBucks
meaning: "The monthly reduced-price school meal income guideline for the child's school meal household size - the annual HHS poverty guideline for that size times sebt_reduced_price_income_pct (CO-1291), rounded up to the next whole dollar, divided by twelve and rounded up again - per 7 CFR 292.5(a) and the annual Income Eligibility Guidelines notice."
precision: "Uses the HHS poverty guideline in force on the most recent July 1 on or before the determination date (federal_poverty_guideline_annual_table and its each-additional step, CO-181 and CO-182, as of the first day of the most recent month numbered sebt_income_guideline_start_month, CO-3015), since the guidelines change on July 1 and those in effect on the date of application are used (292.5(b)); a January-June determination reads the guideline adopted the July before, not the new calendar year's. Hard-coded numbers audit D-1: the item read guideline-year copies of the HHS figures (CO-1519, CO-1520), now retired; a determination from July 2025 to June 2026 now reads the 2025 guideline instead of being unknown."
derived: [ceil, ["/", [ceil, ["*", sebt_reduced_price_income_pct, [lookup_extended, [as_of, federal_poverty_guideline_annual_table, [first_day, [latest_month_of_year, sebt_income_guideline_start_month, [det_month]]]], school_meal_household_size, [as_of, federal_poverty_guideline_annual_each_additional, [first_day, [latest_month_of_year, sebt_income_guideline_start_month, [det_month]]]]]]], 12]]
sources: [S55, S1710, S791, S798, S799]
implemented: engine
tags: [sebt, income]
rationale: "Phase-8 fix round (S-4): the guideline year, not the HHS calendar year. The guideline chart in the fetched notice is an image (D-90), so the monthly figure is derived by the method the notice's text states rather than transcribed. Hard-coded numbers audit D-1 and S-1: one federal table read as of the guideline year's July 1, and its last row read by lookup_extended (P51), not restated as 8."
tests:
  - {id: CO-1297-T1, title: "Household of 4 - 33,000 x 1.85 = 61,050; / 12 = 5,087.50, rounded up to 5,088", as_of: "2026-10-01", given: {school_meal_household_size: 4}, expect: 5088}
  - {id: CO-1297-T2, title: "Household of 1 - 15,960 x 1.85 = 29,526; / 12 = 2,460.50, rounded up to 2,461", as_of: "2026-10-01", given: {school_meal_household_size: 1}, expect: 2461}
  - {id: CO-1297-T3, title: "S-4 - a determination dated 2027-03-01 still uses the July 2026 - June 2027 guidelines (2026 poverty figures)", as_of: "2027-03-01", given: {school_meal_household_size: 4}, expect: 5088}
  - {id: CO-1297-T4, title: "S-4 - household of 10 - (55,720 + 2 x 5,680) x 1.85 = 124,098; / 12 = 10,341.50, rounded up", as_of: "2026-10-01", given: {school_meal_household_size: 10}, expect: 10342}
  - {id: CO-1297-T5, title: "D-1 - a determination dated 2026-03-01 uses the July 2025 - June 2026 guidelines (2025 poverty figures): 32,150 x 1.85 = 59,477.50, rounded up 59,478; / 12 = 4,956.50, rounded up 4,957", as_of: "2026-03-01", given: {school_meal_household_size: 4}, expect: 4957}
