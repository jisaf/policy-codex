id: CO-1297
name: "Summer EBT: monthly income eligibility limit"
identifier: sebt_income_eligibility_limit
kind: derived
type: money
scope: person
program: SunBucks
meaning: The monthly reduced-price school meal income guideline for the child's school meal household size - the annual HHS poverty guideline for that size times 1.85, rounded up to the next whole dollar, divided by twelve and rounded up again - per 7 CFR 292.5(a) and the Income Eligibility Guidelines notice for July 1, 2026 through June 30, 2027.
precision: "Uses the poverty guideline of the school meal guideline year in effect on the determination date (sebt_poverty_guideline_table, CO-1519, versioned from July 1), since the guidelines change on July 1 and those in effect on the date of application are used (292.5(b)). Phase-8 fix round (S-4): the item read the HHS calendar-year table (CO-181), which a January-June determination would read a year early."
derived: [ceil, ["/", [ceil, ["*", sebt_reduced_price_income_pct, [+, [lookup, sebt_poverty_guideline_table, [min, school_meal_household_size, 8]], ["*", sebt_poverty_guideline_each_additional, [max, 0, ["-", school_meal_household_size, 8]]]]]], 12]]
sources: [S55, S791, S798, S799]
implemented: engine
tags: [sebt, income]
rationale: "Phase-8 fix round (S-4): reads the guideline-year tables CO-1519/CO-1520. The guideline chart in the fetched notice is an image (D-90), so the monthly figure is derived by the method the notice's text states rather than transcribed. The poverty figures are the 2026 HHS guidelines the Medicaid chapter carries, restated by guideline year."
tests:
  - {id: CO-1297-T1, title: "Household of 4 - 33,000 x 1.85 = 61,050; / 12 = 5,087.50, rounded up to 5,088", as_of: "2026-10-01", given: {school_meal_household_size: 4}, expect: 5088}
  - {id: CO-1297-T2, title: "Household of 1 - 15,960 x 1.85 = 29,526; / 12 = 2,460.50, rounded up to 2,461", as_of: "2026-10-01", given: {school_meal_household_size: 1}, expect: 2461}
  - {id: CO-1297-T3, title: "S-4 - a determination dated 2027-03-01 still uses the July 2026 - June 2027 guidelines (2026 poverty figures)", as_of: "2027-03-01", given: {school_meal_household_size: 4}, expect: 5088}
  - {id: CO-1297-T4, title: "S-4 - household of 10 - (55,720 + 2 x 5,680) x 1.85 = 124,098; / 12 = 10,341.50, rounded up", as_of: "2026-10-01", given: {school_meal_household_size: 10}, expect: 10342}
