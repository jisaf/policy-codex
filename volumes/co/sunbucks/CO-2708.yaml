  - {id: CO-2708-T2, month: "2026-10", as_of: "2026-10-01", given: {receives_snap: false, receives_tanf_cash: true}, title: "The child receives TANF", expect: true}
  - {id: CO-2708-T3, month: "2026-10", as_of: "2026-10-01", given: {receives_snap: false, receives_tanf_cash: false}, title: "Neither, and no one else in the economic unit", relationships: [], month_defaults: {receives_snap: false}, expect: false}
  - {id: CO-2708-T4, month: "2026-10", as_of: "2026-10-01", given: {receives_snap: false, receives_tanf_cash: false}, title: "OQ-552: a cousin in the same economic unit receives SNAP", others: {p2: {date_of_birth: "2015-04-01", receives_snap: true, receives_tanf_cash: false}}, relationships: [[lives_as_one_economic_unit_with, p1, p2], [other_relative, p1, p2]], expect: true}
  - {id: CO-2708-T5, month: "2026-10", as_of: "2026-10-01", given: {receives_snap: false, receives_tanf_cash: false}, title: "OQ-552: a sibling who lives elsewhere receives SNAP: not the child's household", others: {p2: {receives_snap: true, receives_tanf_cash: false}, p3: {receives_snap: false, receives_tanf_cash: false}}, relationships: [[parent, p3, p1], [parent, p3, p2]], month_defaults: {receives_snap: false}, expect: false}
  - {id: CO-2708-T6, month: "2026-10", as_of: "2026-10-01", given: {receives_snap: false, receives_tanf_cash: false}, title: "OQ-552: the unit reaches a member through another (child, parent, parent's partner)", others: {p2: {receives_snap: false, receives_tanf_cash: false}, p3: {date_of_birth: "2012-09-01", receives_snap: false, receives_tanf_cash: true}}, relationships: [[lives_as_one_economic_unit_with, p1, p2], [lives_as_one_economic_unit_with, p2, p3]], expect: true}
