id: CO-2708
name: "SUN Bucks: a child in the household receives SNAP or TANF"
identifier: sebt_household_child_receives_snap_or_tanf
kind: derived
type: yes/no
scope: person-month
program: SunBucks
meaning: "Whether, in some month of the period of eligibility up to this month, this child or another child of the child's household (a member under eighteen) is receiving SNAP or Colorado Works (TANF) assistance: the receipt that makes a child categorically eligible for Summer EBT (7 CFR 292.2, \"one or more children in that household are receiving assistance under SNAP, TANF, or FDPIR\") and that streamlined certification reads from SNAP and TANF records (292.12(d)). The household is 292.2's: the persons living with the child as one economic unit (lives_as_one_economic_unit_with), related or not."
precision: "Receipt is the record, not this volume's own SNAP or Colorado Works determination: receives_snap (CO-1936, the person is a member of a SNAP household receiving benefits) and receives_tanf_cash (CO-013). The household is every person joined to the child by a chain of lives_as_one_economic_unit_with edges (S2301), so a cousin, a step-sibling or a foster child living in the economic unit is read and a sibling who lives elsewhere is not (OQ-552, resolved). Final pass F-13: receipt is read for the child and for the unit's other children only, the members younger than sebt_adult_min_age (CO-3933, eighteen, the 292.2 \"adult\" boundary): 292.2 asks whether \"one or more children in that household are receiving assistance\", and 7 CFR 245.6(b)(7) (S2720), the school-meals rule it follows, extends eligibility when \"any child is identified as a member of a household receiving assistance under SNAP, FDPIR, or TANF\". An adult who receives SNAP as a separate SNAP household (an elderly grandparent, 7 CFR 273.1(b)(2)) while sharing the school-meals economic unit makes no child categorically eligible; the child is then tested on income. A case that states no relationships for the child leaves the household unknown. FDPIR receipt is within sebt_other_categorical_basis (CO-1296). Coverage review C-6: 7 CFR 292.6 makes eligible the children who \"at any time during the period of eligibility\" are categorically eligible (S790), and 292.14(e)(2) (S3317) needs eligibility shown only \"at a single point in time during the period of eligibility\"; the months read are those from the first month of the instructional year (sebt_instructional_year_start_month, CO-3014: July, the start of the period of eligibility of the summer sebt_summer_year names) through the month evaluated, so receipt that ended earlier in the period still counts, and 292.7(b)'s no-change-reporting rule keeps it. A month of the period not stated is read from the case's month defaults. Coverage review 2 N-3: receives_tanf_cash is a fact about the current Colorado Works case and holds one value, so Colorado Works receipt in a past month of the period is read from the month's tanf_cash_income (CO-029, paid in that month for the member's needs; read as 0 when not stated), as SNAP is read from the month's receives_snap; either the record or a payment in the month is receipt."
derived: [some_month, [months_from_to, [latest_month_of_year, sebt_instructional_year_start_month, [month]], [month]], [any, receives_snap, receives_tanf_cash, [">", [otherwise, tanf_cash_income, 0], 0], [exists, [reachable, [lives_as_one_economic_unit_with]], [all, ["<", [of, [P], age], sebt_adult_min_age], [any, [of, [P], receives_snap], [of, [P], receives_tanf_cash], [">", [otherwise, [of, [P], tanf_cash_income], 0], 0]]]]]]
sources: [S792, S2301, S790, S1095, S2720, S2721, S1821, S3317]
implemented: engine
tags: [sebt]
rationale: "Heavier-definitions audit H-1 and dual-entry audit 4.2: SUN Bucks read this volume's SNAP eligibility (snap_is_eligible, CO-386) for the child alone, which reaches some 88 SNAP facts, is unknown or false for a household that receives SNAP but has not applied in this case, and missed a sibling's receipt. 292.2 says \"are receiving\", a record. No existing item states receipt for the household's children. OQ-552: 292.2 defines the household as persons living as one economic unit (S2301); the economic-unit role replaces the siblings reading."
tests:
