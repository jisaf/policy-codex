id: CO-2708
name: "SUN Bucks: a child in the household receives SNAP or TANF"
identifier: sebt_household_child_receives_snap_or_tanf
kind: derived
type: yes/no
scope: person-month
program: SunBucks
meaning: "Whether, this month, this child or another member of the child's household is receiving SNAP or Colorado Works (TANF) assistance: the receipt that makes a child categorically eligible for Summer EBT (7 CFR 292.2, \"one or more children in that household are receiving assistance under SNAP, TANF, or FDPIR\") and that streamlined certification reads from SNAP and TANF records (292.12(d)). The household is 292.2's: the persons living with the child as one economic unit (lives_as_one_economic_unit_with), related or not."
precision: "Receipt is the record, not this volume's own SNAP or Colorado Works determination: receives_snap (CO-1936, the person is a member of a SNAP household receiving benefits) and receives_tanf_cash (CO-013). The household is every person joined to the child by a chain of lives_as_one_economic_unit_with edges (S2301), so a cousin, a step-sibling or a foster child living in the economic unit is read and a sibling who lives elsewhere is not (OQ-552, resolved). Receipt is read for every member of that unit: SNAP and TANF benefits are paid to a SNAP household or an assistance unit, which holds the unit's children with the adults who receive. A case that states no relationships for the child leaves the household unknown. FDPIR receipt is within sebt_other_categorical_basis (CO-1296)."
derived: [any, receives_snap, receives_tanf_cash, [exists, [reachable, [lives_as_one_economic_unit_with]], [any, [of, [P], receives_snap], [of, [P], receives_tanf_cash]]]]
sources: [S792, S2301, S790, S1095]
implemented: engine
tags: [sebt]
rationale: "Heavier-definitions audit H-1 and dual-entry audit 4.2: SUN Bucks read this volume's SNAP eligibility (snap_is_eligible, CO-386) for the child alone, which reaches some 88 SNAP facts, is unknown or false for a household that receives SNAP but has not applied in this case, and missed a sibling's receipt. 292.2 says \"are receiving\", a record. No existing item states receipt for the household's children. OQ-552: 292.2 defines the household as persons living as one economic unit (S2301); the economic-unit role replaces the siblings reading."
tests:
  - {id: CO-2708-T1, as_of: "2026-10-01", month: "2026-10", title: "The child's household receives SNAP", given: {receives_snap: true}, expect: true}
  - {id: CO-2708-T2, as_of: "2026-10-01", month: "2026-10", title: "The child receives TANF", given: {receives_snap: false, receives_tanf_cash: true}, expect: true}
  - {id: CO-2708-T3, as_of: "2026-10-01", month: "2026-10", title: "Neither, and no one else in the economic unit", given: {receives_snap: false, receives_tanf_cash: false}, relationships: [], expect: false}
  - {id: CO-2708-T4, as_of: "2026-10-01", month: "2026-10", title: "OQ-552: a cousin in the same economic unit receives SNAP", given: {receives_snap: false, receives_tanf_cash: false}, others: {p2: {receives_snap: true, receives_tanf_cash: false}}, relationships: [[lives_as_one_economic_unit_with, p1, p2], [other_relative, p1, p2]], expect: true}
  - {id: CO-2708-T5, as_of: "2026-10-01", month: "2026-10", title: "OQ-552: a sibling who lives elsewhere receives SNAP: not the child's household", given: {receives_snap: false, receives_tanf_cash: false}, others: {p2: {receives_snap: true, receives_tanf_cash: false}, p3: {receives_snap: false, receives_tanf_cash: false}}, relationships: [[parent, p3, p1], [parent, p3, p2]], expect: false}
  - {id: CO-2708-T6, as_of: "2026-10-01", month: "2026-10", title: "OQ-552: the unit reaches a member through another (child, parent, parent's partner)", given: {receives_snap: false, receives_tanf_cash: false}, others: {p2: {receives_snap: false, receives_tanf_cash: false}, p3: {receives_snap: false, receives_tanf_cash: true}}, relationships: [[lives_as_one_economic_unit_with, p1, p2], [lives_as_one_economic_unit_with, p2, p3]], expect: true}
