id: CO-1699
name: "SUN Bucks: requires verification of income"
identifier: sebt_requires_verification_of_income
kind: derived
type: yes/no
scope: person-month
program: SunBucks
meaning: "Whether the child's household must verify income for Summer EBT: an application selected for verification (sample or for cause), unless the child is categorically eligible through SNAP, TANF or another approved program, or is homeless."
precision: "292.14(f)(1) excepts a household whose children are all determined eligible from SNAP, FDPIR, TANF or another approved means-tested program's documentation, or are all foster, homeless, migrant or runaway children. SNAP and TANF are read from snap_is_eligible and receives_tanf_cash; FDPIR, another approved program and the foster, migrant and runaway grounds are within sebt_other_categorical_basis (CO-1296), and homelessness is is_homeless. sebt_other_categorical_basis also carries Head Start and individual free or reduced-price certification, which (f)(1) does not list, so such a child is excepted here too; and the item tests the child, not every child in the household (OQ-377)."
derived: [all, sebt_application_is_selected_for_verification, [not, [any, [any, snap_is_eligible, receives_tanf_cash, sebt_other_categorical_basis], is_homeless]]]
sources: [S1090, S1092, S1094]
implemented: engine
tags: [verification, sebt]
accepts_from: [snap_is_eligible]
open: [OQ-377]
rationale: "Review K-5: 7 CFR 292.14 states Summer EBT verification; the chapter had no SUN Bucks item. Vocabulary fix round (governance read.cross_program): accepts_from lists the other programs' items this rule reads on purpose. Summer EBT streamlined certification names SNAP receipt (7 CFR 292, S790)."
tests:
  - {id: CO-1699-T1, month: "2026-10", as_of: "2026-10-01", given: {sebt_application_is_selected_for_verification: true, snap_is_eligible: false, receives_tanf_cash: false, sebt_other_categorical_basis: false, is_homeless: false}, expect: true}
  - {id: CO-1699-T2, month: "2026-10", as_of: "2026-10-01", given: {sebt_application_is_selected_for_verification: true, snap_is_eligible: true}, expect: false}
  - {id: CO-1699-T3, month: "2026-10", as_of: "2026-10-01", given: {sebt_application_is_selected_for_verification: false}, expect: false}
