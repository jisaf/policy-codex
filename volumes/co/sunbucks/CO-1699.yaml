id: CO-1699
name: "SUN Bucks: requires verification of income"
identifier: sebt_requires_verification_of_income
kind: derived
type: yes/no
scope: person-month
program: SunBucks
meaning: "Whether the child's household must verify income for Summer EBT: an application selected for verification (sample or for cause), unless all children in the household are determined eligible through SNAP, FDPIR, TANF or another approved means-tested program, or all are foster, homeless, migrant or runaway children (7 CFR 292.14(f)(1))."
precision: "292.14(f)(1) excepts a household whose children are all determined eligible from SNAP, FDPIR, TANF or another approved means-tested program's documentation, or are all foster, homeless, migrant or runaway children. SNAP and TANF are read from the receipt records of the household's children (sebt_household_child_receives_snap_or_tanf, CO-2708); FDPIR, another approved program and the foster, homeless, migrant and runaway grounds are sebt_child_verification_exception_ground (CO-4072). Second-pass review N-9 (was F-21): the exception now reads sebt_child_verification_exception_ground (CO-4072), which leaves out Head Start and individual certification, and tests every child of the household (the persons living with the child as one economic unit, lives_as_one_economic_unit_with, under sebt_adult_min_age): SNAP or TANF receipt by one child makes all the household's children eligible (292.2, CO-2708), and otherwise each child needs a ground of their own. Coverage review C-21: the two \"all\" clauses are tested separately, as (f)(1) states them: every child eligible through FDPIR or another approved program (sebt_child_has_fdpir_or_approved_program_basis, CO-4528), or every child a foster, homeless, migrant or runaway child (sebt_child_is_foster_homeless_migrant_or_runaway, CO-4527); a household with one child from each group is not excepted. Three-pattern sweep T-9 (docs/reviews/pattern-sweep-snap-ce.md): a member is a child of the household when under sebt_adult_min_age on the first day of the month evaluated, as sebt_household_child_receives_snap_or_tanf (CO-2708) reads another member's age since coverage pass 5 (S5-2); before, the age was read on the determination date (age, CO-300), so a member who turned 18 between an application in the spring and the summer month was still a child whose documentation the household had to verify (probe CO-949)."
derived: [all, sebt_application_is_selected_for_verification, [not, sebt_household_child_receives_snap_or_tanf], [exists, [filter, [reachable, [lives_as_one_economic_unit_with]], ["<", [years_between, [of, [P], date_of_birth], [first_day, [month]]], sebt_adult_min_age]], [not, [of, [P], sebt_child_has_fdpir_or_approved_program_basis]]], [exists, [filter, [reachable, [lives_as_one_economic_unit_with]], ["<", [years_between, [of, [P], date_of_birth], [first_day, [month]]], sebt_adult_min_age]], [not, [of, [P], sebt_child_is_foster_homeless_migrant_or_runaway]]]]
sources: [S1090, S1092, S1094, S2301]
implemented: engine
tags: [verification, sebt]
open: [OQ-377]
rationale: "Review K-5: 7 CFR 292.14 states Summer EBT verification; the chapter had no SUN Bucks item. Vocabulary fix round (governance read.cross_program): accepts_from lists the other programs' items this rule reads on purpose. Summer EBT streamlined certification names SNAP receipt (7 CFR 292, S790). Heavier-definitions audit H-1 and dual-entry audit 4.2 (audit fix round): SNAP and TANF receipt is read from the receipt records for any child of the household (sebt_household_child_receives_snap_or_tanf, CO-2708), not from this volume's SNAP eligibility; 292.2 says the children \"are receiving\" assistance."
