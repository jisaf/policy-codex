id: CO-1299
name: "Summer EBT (SUN Bucks): summer benefit amount"
identifier: sebt_benefit_amount
kind: derived
type: money
scope: person-month
program: SunBucks
role: outcome
meaning: The total Summer EBT benefit for an eligible child for the summer the determination is for (sebt_summer_year, CO-2581) - that summer's monthly benefit level times the three summer months - or zero for a child who is not eligible, per 7 CFR 292.15(d)-(e) and the benefit levels notice ($40 a month, $120 a summer in the 48 States and the District of Columbia for 2024 through 2026).
precision: "The benefit is issued in full for the summer regardless of the date of application (292.15(f)(2)(iii)). CDHS review C-10: the level is that of the summer the determination is for, so a determination from July 2026 on is for summer 2027 and is unknown until FNS publishes the 2027 levels."
derived: [case, [[in, sebt_eligibility_status, [eligible_categorical, eligible_income]], ["*", [lookup, sebt_monthly_benefit_table, sebt_summer_year], 3]], [else, 0]]
sources: [S794, S795, S796, S797, S1821]
implemented: engine
tags: [sebt, income]
open: [OQ-535]
rationale: No existing item computes the Summer EBT benefit; it is the program's benefit outcome.
tests:
  - {id: CO-1299-T1, as_of: "2026-10-01", month: "2026-10", given: {sebt_summer_year: 2026, sebt_eligibility_status: eligible_income}, expect: 120}
  - {id: CO-1299-T2, as_of: "2026-10-01", month: "2026-10", given: {sebt_summer_year: 2026, sebt_eligibility_status: ineligible}, expect: 0}
