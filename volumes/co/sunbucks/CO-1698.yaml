id: CO-1698
name: "SUN Bucks: verification status"
identifier: sebt_verification_status
kind: derived
type: one of
options: [not_applicable, not_required, complete, pending]
scope: person-month
program: SunBucks
role: outcome
meaning: "Where the child's Summer EBT verification stands: not applicable (not school-aged and not in an NSLP or SBP school); no verification required (streamlined certification, or an application not selected); complete; or pending, in which case benefits are not issued until it is complete."
precision: "292.14 sets no fixed period: the household answers by the date the agency sets, after at least two follow-up attempts, and verification for cause is completed within 30 days of receipt; so there is no past-due state (OQ-377)."
derived: [case, [[not, sebt_verification_is_applicable], not_applicable], [[all, [not, sebt_requires_verification_of_income], [not, sebt_requires_verification_of_school_enrollment]], not_required], [["=", sebt_pending_verification_count, 0], complete], [else, pending]]
sources: [S1090, S1094, S1095]
implemented: engine
tags: [verification, sebt]
open: [OQ-377]
rationale: "Review K-5: the chapter had no SUN Bucks verification outcome."
tests:
  - {id: CO-1698-T1, month: "2026-10", as_of: "2026-10-01", given: {sebt_is_school_aged: false, is_enrolled_in_nslp_school: false}, expect: not_applicable}
  - {id: CO-1698-T2, month: "2026-10", as_of: "2026-10-01", given: {sebt_is_school_aged: true, sebt_requires_verification_of_income: false, sebt_requires_verification_of_school_enrollment: false}, expect: not_required}
  - {id: CO-1698-T3, month: "2026-10", as_of: "2026-10-01", given: {sebt_is_school_aged: true, sebt_requires_verification_of_income: true, sebt_requires_verification_of_school_enrollment: false, sebt_pending_verification_count: 0}, expect: complete}
  - {id: CO-1698-T4, month: "2026-10", as_of: "2026-10-01", given: {sebt_is_school_aged: true, sebt_requires_verification_of_income: true, sebt_requires_verification_of_school_enrollment: false, sebt_pending_verification_count: 1}, expect: pending}
