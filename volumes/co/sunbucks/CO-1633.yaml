id: CO-1633
name: "SUN Bucks: requires verification of school enrollment"
identifier: sebt_requires_verification_of_school_enrollment
kind: derived
type: yes/no
scope: person-month
program: SunBucks
meaning: "Whether the child's enrollment in an NSLP or SBP school in the preceding instructional year must be confirmed: for a child enrolled by Summer EBT application rather than streamlined certification."
derived: [all, is_enrolled_in_nslp_school, [not, [any, sebt_household_child_receives_snap_or_tanf, sebt_other_categorical_basis]]]
sources: [S1095]
implemented: engine
tags: [verification, sebt]
rationale: "Review K-5: 292.12(e)(2) requires the confirmation for application-based children and (d)(3) exempts streamlined certification. Vocabulary fix round (governance read.cross_program): accepts_from lists the other programs' items this rule reads on purpose. Summer EBT streamlined certification names SNAP receipt (7 CFR 292, S790). Heavier-definitions audit H-1 and dual-entry audit 4.2 (audit fix round): SNAP and TANF receipt is read from the receipt records for any child of the household (sebt_household_child_receives_snap_or_tanf, CO-2708), not from this volume's SNAP eligibility; 292.2 says the children \"are receiving\" assistance."
tests:
  - {id: CO-1633-T1, month: "2026-10", as_of: "2026-10-01", given: {is_enrolled_in_nslp_school: true, sebt_household_child_receives_snap_or_tanf: false, sebt_other_categorical_basis: false}, expect: true}
  - {id: CO-1633-T2, month: "2026-10", as_of: "2026-10-01", given: {is_enrolled_in_nslp_school: true, sebt_household_child_receives_snap_or_tanf: true}, expect: false}
