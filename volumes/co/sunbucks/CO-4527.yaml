id: CO-4527
name: "SUN Bucks: a foster, homeless, migrant or runaway child"
identifier: sebt_child_is_foster_homeless_migrant_or_runaway
kind: derived
type: yes/no
scope: person
program: SunBucks
meaning: "Whether the child is a foster, homeless, migrant or runaway child as 7 CFR 245.2 defines them: the second group whose members, when all the children of a household belong to it, except the household from verification (7 CFR 292.14(f)(1))."
precision: "Foster care is the foster_child role, or a foster care payment or IV-B service in the child welfare record, as in sebt_other_categorical_basis (CO-1296); homeless is sebt_is_homeless_child; migrant and runaway are positive identifications, their absence read as no such ground. Coverage review 2 N-3: 7 CFR 292.6 (S790) makes eligible the children who \"at any time during the period of eligibility\" are categorically eligible, and 292.12(d)(1) certifies those who \"during the period of eligibility were\" foster, homeless, migrant or runaway children. The role, the child welfare payment and nighttime_residence_type state the present, so a child whose foster care ended (foster_care_exit_date, CO-2853) or who stopped being homeless (homelessness_ended_date, CO-4851) on or after the first day of the period of eligibility (the month numbered sebt_instructional_year_start_month, CO-3014, on or before the determination month) is in the group too; either date not stated is read as no earlier ground. is_migrant_child and is_runaway_child are identifications at any time in the period (CO-2848, CO-2849)."
derived: [any, sebt_is_homeless_child, [otherwise, [">=", homelessness_ended_date, [first_day, [latest_month_of_year, sebt_instructional_year_start_month, [det_month]]]], false], [otherwise, [exists_related, [foster_child], true], false], [in, child_welfare_payment_type, [title_iv_e_foster_care, state_funded_foster_care, title_iv_b_services_only]], [otherwise, [">=", foster_care_exit_date, [first_day, [latest_month_of_year, sebt_instructional_year_start_month, [det_month]]]], false], [otherwise, is_migrant_child, false], [otherwise, is_runaway_child, false]]
sources: [S1092, S1952, S790]
implemented: engine
tags: [sebt, verification]
rationale: "Coverage review C-21: 292.14(f)(1) excepts a household when all its children are eligible through SNAP, FDPIR, TANF or an approved program, or when all are foster, homeless, migrant or runaway children; sebt_requires_verification_of_income (CO-1699) tested one combined ground, so a household with one child of each group was excepted. The two groups are now separate items; sebt_child_verification_exception_ground (CO-4072) is their union."
tests:
  - {id: CO-4527-T1, title: "A child placed in foster care", as_of: "2026-11-01", given: {nighttime_residence_type: fixed_regular_adequate, child_welfare_payment_type: title_iv_e_foster_care}, others: {p2: {}}, relationships: [[foster_child, p1, p2]], expect: true}
  - {id: CO-4527-T2, title: "A child in an FDPIR household only: not this group", as_of: "2026-11-01", given: {nighttime_residence_type: fixed_regular_adequate, child_welfare_payment_type: none, receives_fdpir: true}, relationships: [], expect: false}
  - {id: CO-4527-T3, title: "Coverage review 2 N-3: Title IV-E foster care that ended December 15, 2026; determined March 1, 2027, in the period that began July 2026", as_of: "2027-03-01", given: {nighttime_residence_type: fixed_regular_adequate, child_welfare_payment_type: none, foster_care_exit_date: "2026-12-15"}, relationships: [], expect: true}
  - {id: CO-4527-T4, title: "N-3: homeless until October 2026, housed since: in the group for summer 2027", as_of: "2027-03-01", given: {nighttime_residence_type: fixed_regular_adequate, child_welfare_payment_type: none, homelessness_ended_date: "2026-10-20"}, relationships: [], expect: true}
  - {id: CO-4527-T5, title: "N-3: foster care that ended in May 2026, before the period of eligibility began in July", as_of: "2027-03-01", given: {nighttime_residence_type: fixed_regular_adequate, child_welfare_payment_type: none, foster_care_exit_date: "2026-05-31"}, relationships: [], expect: false}
