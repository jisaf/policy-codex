id: CO-1643
name: "CHP+: earned income verification is pending"
identifier: chp_earned_income_verification_is_pending
kind: derived
type: yes/no
scope: person-month
program: CHP+
role: outcome
meaning: Whether CHP+ requires documentation of the person's earned income and it has not been provided.
derived: [all, chp_requires_verification_of_earned_income, [not, earned_income_verification_document_received]]
sources: [S869, S861]
implemented: engine
tags: [verification, chp, income]
rationale: "Review U-1: the count items held this test as an anonymous arm, so no outcome told a worker which document was outstanding and for whom; the count now sums this item."
tests:
  - {id: CO-1643-T1, month: "2026-10", as_of: "2026-10-01", given: {chp_requires_verification_of_earned_income: true, earned_income_verification_document_received: false}, expect: true}
  - {id: CO-1643-T2, month: "2026-10", as_of: "2026-10-01", given: {chp_requires_verification_of_earned_income: false}, expect: false}
