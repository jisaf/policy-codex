id: CO-2707
name: "CHP+: meets the citizenship and immigration status requirement"
identifier: chp_meets_status_requirement
kind: derived
type: yes/no
scope: person-month
program: CHP+
meaning: "Whether the person meets CHP+'s citizenship and immigration requirement for the month: a qualifying status under 10 CCR 2505-3 § 110.1.B.1-5 (chp_has_qualifying_immigration_status, CO-2706), or the exception of 110.1.B.5.o for a person under ma_magi_child_age_limit or reaching that age in the current month, who is pregnant, or who is within 12 months of the beginning of the postpartum period, who meets the criteria of a CHP+ program but is not a citizen or qualified non-citizen."
precision: "The exception's population is the same as Medicaid's Cover All Coloradans population (10 CCR 2505-10 § 8.100.3.G.1.g.ix.1, S607), stated in the same words, so it is read from Medicaid's population for the month, ma_is_cover_all_coloradans_person_in_month (CO-7552; pattern sweep, MAGI, PS-02, 2026-11-24: § 110.1.B.5.o names 'the current month', and the item was person-scope, reading the population on the determination date in every month). CHP+ status does not read the Medicaid five-year rule or the 42 U.S.C. 1396b(v)(5) limit; federal financial participation for CHIP (section 2107(e)(1)(R) of the Social Security Act, S1702) is a funding question, not a status test in 110.1.B. Read by chp_child_is_eligible (CO-705), chp_prenatal_is_eligible (CO-706), chp_eligibility_status (CO-707) and chp_express_lane_child_meets_requirements (CO-4792), each for the month."
derived: [any, chp_has_qualifying_immigration_status, ma_is_cover_all_coloradans_person_in_month]
sources: [S606, S1906, S1907, S1908]
implemented: engine
tags: [chp, immigration]
accepts_from:
  - {from: ma_is_cover_all_coloradans_person_in_month, class: adopted_method, source: S606}
rationale: "OQ-44 fix (docs/reviews/audit-dual-entry.md 3.1): CHP+ read Medicaid's ma_meets_status_for_cover_all_coloradans_categories (CO-1174), whose status half is Medicaid's list. This item states CHP+'s own requirement (110.1.B and its exception o); no existing item does."
tests:
  - {id: CO-2707-T1, as_of: "2026-10-01", month: "2026-10", title: "Qualifying status", given: {chp_has_qualifying_immigration_status: true, ma_is_cover_all_coloradans_person_in_month: false}, expect: true}
  - {id: CO-2707-T2, as_of: "2026-10-01", month: "2026-10", title: "Undocumented child of 8: the 110.1.B.5.o exception", given: {immigration_status: undocumented, date_of_birth: "2018-04-01", is_pregnant: false}, expect: true}
  - {id: CO-2707-T3, as_of: "2026-10-01", month: "2026-10", title: "Neither", given: {chp_has_qualifying_immigration_status: false, ma_is_cover_all_coloradans_person_in_month: false}, expect: false}
  - {id: CO-2707-T4, as_of: "2026-11-10", month: "2026-09", title: "Pattern sweep PS-02: undocumented, born 2007-09-20, September 2026 (the 19th birthday in the current month), determined in November", given: {immigration_status: undocumented, date_of_birth: "2007-09-20", is_pregnant: false, sex: female}, expect: true}
  - {id: CO-2707-T5, as_of: "2026-11-10", month: "2026-10", title: "Pattern sweep PS-02: the same, October 2026", given: {immigration_status: undocumented, date_of_birth: "2007-09-20", is_pregnant: false, sex: female}, expect: false}
