id: CO-1416
name: "CHP+: required verification count"
identifier: chp_required_verification_count
kind: derived
type: whole number
scope: person-month
program: CHP+
meaning: "The number of verification elements CHP+ requires for this person: the Medical Assistance minimal verification elements (citizenship, identity, every declared immigration status, SSN), earned income judged against the CHP+ standard and questionable unearned income for each member of the person's MAGI household (the person included, CHP+ applying the MAGI household and income rules), and the elements verified only when questionable (pregnancy, residency, age, household composition), without the aged, blind, disabled and long-term care elements."
derived: ["+", [case, [ma_requires_verification_of_citizenship, 1], [else, 0]], [case, [ma_requires_verification_of_identity, 1], [else, 0]], [case, [claims_lawful_immigration_status, 1], [else, 0]], [case, [ma_requires_verification_of_ssn, 1], [else, 0]], [sum, ma_magi_household_members, ["+", [case, [[of, [P], chp_requires_verification_of_earned_income], 1], [else, 0]], [case, [[of, [P], chp_requires_verification_of_unearned_income], 1], [else, 0]]]], [case, [ma_requires_verification_of_pregnancy, 1], [else, 0]], [case, [ma_requires_verification_of_residency, 1], [else, 0]], [case, [ma_requires_verification_of_age, 1], [else, 0]], [case, [ma_requires_verification_of_household_composition, 1], [else, 0]]]
sources: [S869, S868, S870, S1085]
implemented: engine
tags: [verification, chp]
accepts_from: [ma_magi_household_members, ma_requires_verification_of_age, ma_requires_verification_of_citizenship, ma_requires_verification_of_household_composition, ma_requires_verification_of_identity, ma_requires_verification_of_pregnancy, ma_requires_verification_of_residency, ma_requires_verification_of_ssn]
rationale: "10 CCR 2505-3 130.1 (S869) applies Medical Assistance's minimal verification to CHP+, so CHP+ reads the Medical Assistance requirement items but leaves out the ABD unearned-income and resource requirements that have no CHP+ counterpart. Vocabulary fix round (governance read.cross_program): accepts_from lists the other programs' items this rule reads on purpose. CHP+ applies the MAGI household, income and verification rules and Medicaid's status and age tests by reference (10 CCR 2505-3 110, 120, 42 CFR 457.380), and excludes a person eligible for Medicaid. Final verification V-3 and V-8 (2026-11-22): the household members' income elements, and questionable unearned income (10 CCR 2505-10 § 8.100.4.B.1.d, B.2, read through § 130.1), are now counted."
tests:
  - {id: CO-1416-T1, month: "2026-10", as_of: "2026-10-01", given: {ma_magi_household_members: [p1], chp_requires_verification_of_unearned_income: false, ma_requires_verification_of_citizenship: false, ma_requires_verification_of_identity: false, ma_requires_verification_of_ssn: true, chp_requires_verification_of_earned_income: false, ma_requires_verification_of_pregnancy: false, ma_requires_verification_of_residency: false, ma_requires_verification_of_age: false, ma_requires_verification_of_household_composition: false, immigration_status: lawful_permanent_resident}, expect: 2}
  - {id: CO-1416-T2, month: "2026-10", as_of: "2026-10-01", given: {ma_magi_household_members: [p1], chp_requires_verification_of_unearned_income: false, ma_requires_verification_of_citizenship: false, ma_requires_verification_of_identity: false, ma_requires_verification_of_ssn: false, chp_requires_verification_of_earned_income: false, ma_requires_verification_of_pregnancy: false, ma_requires_verification_of_residency: false, ma_requires_verification_of_age: false, ma_requires_verification_of_household_composition: false, immigration_status: us_citizen}, expect: 0}
