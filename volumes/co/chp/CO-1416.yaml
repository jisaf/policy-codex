id: CO-1416
name: "CHP+: required verification count"
identifier: chp_required_verification_count
kind: derived
type: whole number
scope: person-month
program: CHP+
meaning: "The number of verification elements CHP+ requires for this person: the Medical Assistance minimal verification elements (citizenship, identity, immigration status, SSN, earned income) and the elements verified only when questionable (pregnancy, residency, age, household composition), without the aged, blind and disabled elements."
derived: ["+", [case, [ma_requires_verification_of_citizenship, 1], [else, 0]], [case, [ma_requires_verification_of_identity, 1], [else, 0]], [case, [ma_requires_verification_of_immigration_status, 1], [else, 0]], [case, [ma_requires_verification_of_ssn, 1], [else, 0]], [case, [ma_requires_verification_of_earned_income, 1], [else, 0]], [case, [ma_requires_verification_of_pregnancy, 1], [else, 0]], [case, [ma_requires_verification_of_residency, 1], [else, 0]], [case, [ma_requires_verification_of_age, 1], [else, 0]], [case, [ma_requires_verification_of_household_composition, 1], [else, 0]]]
sources: [S869, S868, S870]
implemented: engine
tags: [verification, chp]
open: [OQ-322]
rationale: 10 CCR 2505-3 130.1 (S869) applies Medical Assistance's minimal verification to CHP+, so CHP+ reads the Medical Assistance requirement items but leaves out the ABD unearned-income and resource requirements that have no CHP+ counterpart.
tests:
  - {id: CO-1416-T1, month: "2026-10", as_of: "2026-10-01", given: {ma_requires_verification_of_citizenship: true, ma_requires_verification_of_identity: false, ma_requires_verification_of_immigration_status: false, ma_requires_verification_of_ssn: true, ma_requires_verification_of_earned_income: false, ma_requires_verification_of_pregnancy: false, ma_requires_verification_of_residency: false, ma_requires_verification_of_age: false, ma_requires_verification_of_household_composition: false}, expect: 2}
  - {id: CO-1416-T2, month: "2026-10", as_of: "2026-10-01", given: {ma_requires_verification_of_citizenship: false, ma_requires_verification_of_identity: false, ma_requires_verification_of_immigration_status: false, ma_requires_verification_of_ssn: false, ma_requires_verification_of_earned_income: false, ma_requires_verification_of_pregnancy: false, ma_requires_verification_of_residency: false, ma_requires_verification_of_age: false, ma_requires_verification_of_household_composition: false}, expect: 0}
