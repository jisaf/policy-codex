id: CO-708
name: "CHP+: presumptive eligibility"
identifier: chp_presumptive_eligibility
kind: derived
type: yes/no
scope: person
program: CHP+
meaning: "Whether the person qualifies for immediate, temporary presumptive Children's Basic Health Plan coverage under 10 CCR 2505-3 § 170: a child under 19 or a pregnant applicant whose declared household income falls within the applicable CHP+ income band (170.1.A-B), who does not already receive another medical assistance program (170.5) and has not received presumptive eligibility in the last 12 months or, if pregnant, during this pregnancy (170.6). Informational: no rule reads it and it is not a declared outcome; it reports presumptive CHP+ coverage beside chp_eligibility_status."
precision: "170.1.C's status requirement (a citizen or a lawfully residing immigrant as defined in Section 110, or the exceptions of 110.1.C.3.a) is met by every person this item reaches: a child under 19 and a pregnant applicant are in the exception population that CHP+'s own status test reads (chp_meets_status_requirement, CO-2707, through ma_is_cover_all_coloradans_person), so the term decided nothing and only pulled the immigration facts into a declaration-based determination; it is not tested (heavier-definitions audit H-11). Uses declared_household_income_pct_fpl (CO-3151), the applicant's declared figure at the presumptive eligibility site, not ma_magi_household_income_pct_fpl (CO-504), because 170.1.A-B key presumptive eligibility on a declaration made before the verified MAGI computation exists. \"Another medical assistance program\" (170.5) is read as enrollment in Medical Assistance (is_enrolled_in_medical_assistance, CO-2435)."
derived: [all, [any, ma_is_under_child_age_or_turns_nineteen_this_month, is_pregnant], [not, is_enrolled_in_medical_assistance], [case, [is_pregnant, [not, received_presumptive_eligibility_this_pregnancy]], [else, [not, received_presumptive_eligibility_in_last_twelve_months]]], [case, [ma_is_under_child_age_or_turns_nineteen_this_month, [all, [">", declared_household_income_pct_fpl, ma_income_limit_child_pct], ["<=", declared_household_income_pct_fpl, chp_income_limit_pct_upper]]], [is_pregnant, [all, [">", declared_household_income_pct_fpl, ma_income_limit_pregnant_pct], ["<=", declared_household_income_pct_fpl, chp_income_limit_pct_upper]]], [else, false]]]
sources: [S1743, S1745, S246]
implemented: engine
tags: [chp, magi, income, immigration]
accepts_from: [ma_is_under_child_age_or_turns_nineteen_this_month]
open: [OQ-62]
rationale: "Heavier-definitions audit H-11 and L-1 (audit fix round 4): the status conjunct is dropped (it decided nothing), and the bars of § 170.5 (already receiving another medical assistance program) and § 170.6 (once every 12 months, once every pregnancy) are tested. No existing item states CHP+ presumptive eligibility. Distinct from chp_child_is_eligible/chp_prenatal_is_eligible (CO-705/CO-706) because 170.1 tests a declared/attested income figure at a presumptive eligibility site rather than the verified MAGI computation, and (per 170.1's own text) does not itself test 'not eligible for Medicaid' or 'no other creditable coverage' the way the full determination does. Vocabulary fix round (governance read.cross_program): accepts_from lists the other programs' items this rule reads on purpose. CHP+ applies the MAGI household, income and verification rules and Medicaid's status and age tests by reference (10 CCR 2505-3 110, 120, 42 CFR 457.380), and excludes a person eligible for Medicaid. Precision history (moved from precision, engineering follow-up pass task 5): (CO-1174; phase 7 fix round, S-2). OQ-44 fix (docs/reviews/audit-dual-entry.md 3.1): status reads CHP+'s own chp_meets_status_requirement (CO-2707) in place of Medicaid's ma_meets_status_for_cover_all_coloradans_categories (CO-1174); no CHP+ answer changes, since the 110.1.B.5.o exception reaches every child and pregnant person either way."
tests:
  - {id: CO-708-T1, as_of: "2026-10-01", given: {date_of_birth: "2015-01-01", is_pregnant: false, is_enrolled_in_medical_assistance: false, received_presumptive_eligibility_in_last_twelve_months: false, declared_household_income_pct_fpl: 2.00}, expect: true}
  - {id: CO-708-T2, as_of: "2026-10-01", given: {date_of_birth: "2015-01-01", is_pregnant: false, is_enrolled_in_medical_assistance: false, received_presumptive_eligibility_in_last_twelve_months: false, declared_household_income_pct_fpl: 1.00}, expect: false}
  - {id: CO-708-T3, as_of: "2026-10-01", given: {date_of_birth: "1998-06-01", is_pregnant: true, is_enrolled_in_medical_assistance: false, received_presumptive_eligibility_this_pregnancy: false, declared_household_income_pct_fpl: 2.10}, expect: true}
  - {id: CO-708-T4, as_of: "2026-10-01", title: "L-1: already enrolled in Medical Assistance (170.5)", given: {date_of_birth: "2015-01-01", is_pregnant: false, is_enrolled_in_medical_assistance: true, declared_household_income_pct_fpl: 2.00}, expect: false}
  - {id: CO-708-T5, as_of: "2026-10-01", title: "L-1: presumptive eligibility in the last 12 months (170.6)", given: {date_of_birth: "2015-01-01", is_pregnant: false, is_enrolled_in_medical_assistance: false, received_presumptive_eligibility_in_last_twelve_months: true, declared_household_income_pct_fpl: 2.00}, expect: false}
  - {id: CO-708-T6, as_of: "2026-10-01", title: "L-1: pregnant, presumptive eligibility last year but not this pregnancy (170.6)", given: {date_of_birth: "1998-06-01", is_pregnant: true, is_enrolled_in_medical_assistance: false, received_presumptive_eligibility_in_last_twelve_months: true, received_presumptive_eligibility_this_pregnancy: false, declared_household_income_pct_fpl: 2.10}, expect: true}
  - {id: CO-708-T7, as_of: "2026-10-01", title: "H-11: an undocumented child at 200% FPL; no immigration fact is needed", given: {date_of_birth: "2015-01-01", is_pregnant: false, is_enrolled_in_medical_assistance: false, received_presumptive_eligibility_in_last_twelve_months: false, declared_household_income_pct_fpl: 2.00}, expect: true}
