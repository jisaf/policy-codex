id: CO-708
name: "CHP+: presumptive eligibility"
identifier: chp_presumptive_eligibility
kind: derived
type: yes/no
scope: person
program: CHP+
meaning: Whether the person qualifies for immediate, temporary presumptive Children's Basic Health Plan coverage under 10 CCR 2505-3-170.1 - a child under 19 or a pregnant applicant, meeting the citizenship requirement, whose declared or attested household income falls within the applicable CHP+ income band.
precision: "170.1.C's 'United States citizen or a documented immigrant as defined in Section 110' is read as ma_meets_status_for_cover_all_coloradans_categories (CO-1174; phase 7 fix round, S-2), the same reading chp_child_is_eligible (CO-705) and chp_prenatal_is_eligible (CO-706) take of 110.1.B, for the reason stated on CO-705 (Cover All Coloradans reaches every child and pregnant applicant, which is 170.1's whole population). Uses attested_household_income_pct_fpl (CO-092), the applicant's declared/attested figure at the presumptive eligibility site, not ma_magi_household_income_pct_fpl (CO-504), because 170.1.A-B key presumptive eligibility on a declaration made before the verified MAGI computation exists."
derived: [all, [any, ma_is_under_child_age_or_turns_nineteen_this_month, is_pregnant], ma_meets_status_for_cover_all_coloradans_categories, [case, [ma_is_under_child_age_or_turns_nineteen_this_month, [all, [">", attested_household_income_pct_fpl, ma_income_limit_child_pct], ["<=", attested_household_income_pct_fpl, chp_income_limit_pct_upper]]], [is_pregnant, [all, [">", attested_household_income_pct_fpl, ma_income_limit_pregnant_pct], ["<=", attested_household_income_pct_fpl, chp_income_limit_pct_upper]]], [else, false]]]
sources: [S241, S246]
implemented: engine
tags: [chp, magi, income, immigration]
accepts_from: [ma_is_under_child_age_or_turns_nineteen_this_month, ma_meets_status_for_cover_all_coloradans_categories]
rationale: "No existing item states CHP+ presumptive eligibility. Distinct from chp_child_is_eligible/chp_prenatal_is_eligible (CO-705/CO-706) because 170.1 tests a declared/attested income figure at a presumptive eligibility site rather than the verified MAGI computation, and (per 170.1's own text) does not itself test 'not eligible for Medicaid' or 'no other creditable coverage' the way the full determination does. Vocabulary fix round (governance read.cross_program): accepts_from lists the other programs' items this rule reads on purpose. CHP+ applies the MAGI household, income and verification rules and Medicaid's status and age tests by reference (10 CCR 2505-3 110, 120, 42 CFR 457.380), and excludes a person eligible for Medicaid."
tests:
  - {id: CO-708-T1, as_of: "2026-10-01", given: {date_of_birth: "2015-01-01", is_pregnant: false, citizenship_status: citizen, attested_household_income_pct_fpl: 2.00}, expect: true}
  - {id: CO-708-T2, as_of: "2026-10-01", given: {date_of_birth: "2015-01-01", is_pregnant: false, citizenship_status: citizen, attested_household_income_pct_fpl: 1.00}, expect: false}
  - {id: CO-708-T3, as_of: "2026-10-01", given: {date_of_birth: "1998-06-01", is_pregnant: true, citizenship_status: citizen, attested_household_income_pct_fpl: 2.10}, expect: true}
