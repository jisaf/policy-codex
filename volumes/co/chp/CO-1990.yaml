program: CHP+
meaning: "Whether a CHP+ enrollee is exempt from all CHP+ cost-sharing requirements under 10 CCR 2505-3 § 330: an American Indian or Alaska Native (§ 330.1) or a Prenatal Care Program client (§ 330.4)."
precision: "This item states only who pays no cost sharing at all. § 330.3's exemption of preventive services is per service, in chp_scheduled_copayment (CO-2230), and the § 330.2 5% yearly limit is applied by chp_copayment (CO-2231), which reads this item (OQ-60, resolved)."
