accepts_from:
  - {from: ma_has_full_coverage_category, class: rule_required, source: S653}
  - {from: ma_is_under_child_age_or_turns_nineteen_this_month, class: adopted_method, source: S606}
rationale: "Final verification pass 3, F3-2 (2026-11-22): the Title XIX exclusion reads ma_has_full_coverage_category (CO-1176) in place of ma_magi_is_fully_eligible. Rewired in the phase 3 coordinator pass to read ma_magi_is_fully_eligible (CO-562, fix round; formerly ma_magi_is_eligible, CO-553, per the phase-3 review's C-10 finding) in place of the supplied placeholder (OQ-61). No existing item reports a single CHP+ eligibility outcome; this is the fact a caseworker or the engine's outcome view needs, and the phase-3 brief proposes it with role: outcome. Ordered so a person who is both a Medicaid-eligible child and, hypothetically, over the CHP+ income band is reported as ineligible_medicaid_eligible (the target household's p4 and p5) rather than ineligible_income, matching 10 CCR 2505-3-120.1.B's plain exclusion of anyone eligible for Medicaid before any of CHP+'s own income or coverage tests are reached. Fix round (C-14): added the ineligible_residency and ineligible_status branches (and options), reading is_colorado_resident (CO-501) and ma_meets_citizenship_requirement (CO-509, both cross-program Medicaid reads already established elsewhere in this chapter) ahead of the income catch-all, per the phase-3 review's finding that the prior case order made 'ineligible_income' a catch-all misreporting residency and citizenship failures - the review's own example (a Wyoming resident child at 200% FPL) is CO-707-T7 below. Vocabulary fix round (governance read.cross_program): accepts_from lists the other programs' items this rule reads on purpose. CHP+ applies the MAGI household, income and verification rules and Medicaid's status and age tests by reference (10 CCR 2505-3 110, 120, 42 CFR 457.380), and excludes a person eligible for Medicaid. History moved from the precision note (HCPF review S-14): Fix round (C-14): residency and citizenship/status are checked immediately after the eligible and Medicaid-eligible branches and before the income and coverage tests, so a child or pregnant applicant who fails residency or citizenship is reported ineligible_residency or ineligible_status rather than falling through to the income catch-all - Phase 7 (OQ-58): a child or pregnant applicant who passes every other test, including income, but is an inmate of a public institution or a patient in an institution for mental diseases (10 CCR 2505-3 § 120.1.C) is reported ineligible_institution; income is tested explicitly before it so an income failure keeps its own reason - matching this volume's ma_magi_eligibility_status (CO-554) convention of checking residency before income, and correcting the prior ordering, which the phase-3 review's C-14 finding found reported every residency or citizenship failure as ineligible_income regardless of the actual reason. HCPF fix round (B-2): a child in a CHP+ continuous eligibility period (chp_child_is_in_continuous_eligibility_period, CO-2404) stays eligible_child whatever the month's income (§ 430.2.A), and a pregnant woman in her enrollment span (chp_is_in_prenatal_coverage_period, CO-2407) stays eligible_prenatal through the twelfth month after the birth (§ 430.3); both are tested after the Medicaid-eligible branch, since a child whose income falls moves to Medicaid with a new period (§ 430.2.A.i). A newborn of a CHP+ mother is eligible_newborn for its first year (§ 430.5) unless Medicaid covers it. Precision history (moved from precision, engineering follow-up pass task 5): the phase-3 review's C-14 finding. OQ-44 fix (docs/reviews/audit-dual-entry.md 3.1): status reads CHP+'s own chp_meets_status_requirement (CO-2707) in place of Medicaid's ma_meets_status_for_cover_all_coloradans_categories (CO-1174); no CHP+ answer changes, since the 110.1.B.5.o exception reaches every child and pregnant person either way."
