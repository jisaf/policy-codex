id: CO-707
name: "CHP+: eligibility status"
identifier: chp_eligibility_status
kind: derived
type: one of
options: [eligible_child, eligible_prenatal, ineligible_medicaid_eligible, ineligible_income, ineligible_coverage, ineligible]
scope: person-month
program: CHP+
role: outcome
meaning: The single CHP+ eligibility outcome for the month - eligible as a child, eligible as a pregnant (prenatal) applicant, or one of three specific ineligibility reasons (Medicaid-eligible instead per 10 CCR 2505-3-120.1.B, income outside the CHP+ band per 110.1.E-F, or other creditable coverage per 120.1.A), or ineligible for a reason this batch does not distinguish further (for example not a child and not pregnant, or failing residency/citizenship).
precision: Evaluated in the order the branches are listed - eligible outcomes first, then the specific ineligibility reasons in the order 10 CCR 2505-3-120 lists its exclusions (Medicaid eligibility, then other coverage), matching this volume's ma_magi_eligibility_status (batch 6) convention of a single ordered case over the component yes/no rules rather than a separate outcome fact per requirement.
derived: [case, [chp_child_is_eligible, "eligible_child"], [chp_prenatal_is_eligible, "eligible_prenatal"], [[all, [any, chp_is_child, is_pregnant], is_eligible_for_medicaid], "ineligible_medicaid_eligible"], [[all, [any, chp_is_child, is_pregnant], has_other_creditable_health_coverage], "ineligible_coverage"], [[any, chp_is_child, is_pregnant], "ineligible_income"], [else, "ineligible"]]
sources: [S242, S243, S244]
open: [OQ-58, OQ-61]
implemented: engine
tags: [chp, magi, income, immigration, age]
rationale: "No existing item reports a single CHP+ eligibility outcome; this is the fact a caseworker or the engine's outcome view needs, and the phase-3 brief proposes it with role: outcome. Ordered so a person who is both a Medicaid-eligible child and, hypothetically, over the CHP+ income band is reported as ineligible_medicaid_eligible (the target household's p4 and p5) rather than ineligible_income, matching 10 CCR 2505-3-120.1.B's plain exclusion of anyone eligible for Medicaid before any of CHP+'s own income or coverage tests are reached."
tests:
  - {id: CO-707-T1, as_of: "2026-10-01", month: "2026-10", title: "CO-01 p4: 17-year-old, household size 3, income 2380 (about 105% FPL), Medicaid-eligible child", given: {date_of_birth: "2009-04-08", is_pregnant: false, state_of_residence: "CO", citizenship_status: citizen, lawful_presence_status: unknown, ma_magi_household_income_pct_fpl: 1.0454, is_eligible_for_medicaid: true, has_other_creditable_health_coverage: false}, expect: ineligible_medicaid_eligible}
  - {id: CO-707-T2, as_of: "2026-10-01", month: "2026-10", title: "CO-01 p5: 8-month-old, household size 2, income 0, Medicaid-eligible child", given: {date_of_birth: "2026-02-03", is_pregnant: false, state_of_residence: "CO", citizenship_status: citizen, lawful_presence_status: unknown, ma_magi_household_income_pct_fpl: 0.0, is_eligible_for_medicaid: true, has_other_creditable_health_coverage: false}, expect: ineligible_medicaid_eligible}
  - {id: CO-707-T3, as_of: "2026-10-01", month: "2026-10", title: "Child at about 200% FPL, not Medicaid-eligible, no other coverage: CHP+ eligible", given: {date_of_birth: "2015-06-01", is_pregnant: false, state_of_residence: "CO", citizenship_status: citizen, lawful_presence_status: unknown, ma_magi_household_income_pct_fpl: 2.00, is_eligible_for_medicaid: false, has_other_creditable_health_coverage: false}, expect: eligible_child}
  - {id: CO-707-T4, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "2015-06-01", is_pregnant: false, state_of_residence: "CO", citizenship_status: citizen, lawful_presence_status: unknown, ma_magi_household_income_pct_fpl: 2.00, is_eligible_for_medicaid: false, has_other_creditable_health_coverage: true}, expect: ineligible_coverage}
  - {id: CO-707-T5, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "2015-06-01", is_pregnant: false, state_of_residence: "CO", citizenship_status: citizen, lawful_presence_status: unknown, ma_magi_household_income_pct_fpl: 1.00, is_eligible_for_medicaid: false, has_other_creditable_health_coverage: false}, expect: ineligible_income}
  - {id: CO-707-T6, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "1985-01-01", is_pregnant: false, state_of_residence: "CO", citizenship_status: citizen, lawful_presence_status: unknown, ma_magi_household_income_pct_fpl: 2.00, is_eligible_for_medicaid: false, has_other_creditable_health_coverage: false}, expect: ineligible}
