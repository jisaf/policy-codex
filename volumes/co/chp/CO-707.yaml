id: CO-707
name: "CHP+: eligibility status"
identifier: chp_eligibility_status
kind: derived
type: one of
options: [eligible_child, eligible_prenatal, ineligible_medicaid_eligible, ineligible_income, ineligible_coverage, ineligible_residency, ineligible_status, ineligible_institution, ineligible]
scope: person-month
program: CHP+
role: outcome
meaning: The single CHP+ eligibility outcome for the month - eligible as a child, eligible as a pregnant (prenatal) applicant, or one of six specific ineligibility reasons (Medicaid-eligible instead per 10 CCR 2505-3-120.1.B, income outside the CHP+ band per 110.1.E-F, other creditable coverage per 120.1.A, failing residency per 110.1.D, failing citizenship/immigration status per 110.1.B, or an inmate of a public institution or a patient in an institution for mental diseases per 120.1.C), or ineligible for a reason this batch does not distinguish further (for example not a child and not pregnant).
precision: "Evaluated in the order the branches are listed - eligible outcomes first, then the specific ineligibility reasons. Fix round (C-14): residency and citizenship/status are checked immediately after the eligible and Medicaid-eligible branches and before the income and coverage tests, so a child or pregnant applicant who fails residency or citizenship is reported ineligible_residency or ineligible_status rather than falling through to the income catch-all - Phase 7 (OQ-58): a child or pregnant applicant who passes every other test, including income, but is an inmate of a public institution or a patient in an institution for mental diseases (10 CCR 2505-3 § 120.1.C) is reported ineligible_institution; income is tested explicitly before it so an income failure keeps its own reason - matching this volume's ma_magi_eligibility_status (CO-554) convention of checking residency before income, and correcting the prior ordering, which the phase-3 review's C-14 finding found reported every residency or citizenship failure as ineligible_income regardless of the actual reason."
derived: [case, [chp_child_is_eligible, "eligible_child"], [chp_prenatal_is_eligible, "eligible_prenatal"], [[all, [any, ma_is_under_child_age_or_turns_nineteen_this_month, is_pregnant], ma_magi_is_fully_eligible], "ineligible_medicaid_eligible"], [[all, [any, ma_is_under_child_age_or_turns_nineteen_this_month, is_pregnant], [not, is_colorado_resident]], "ineligible_residency"], [[all, [any, ma_is_under_child_age_or_turns_nineteen_this_month, is_pregnant], [not, ma_meets_status_for_cover_all_coloradans_categories]], "ineligible_status"], [[all, [any, ma_is_under_child_age_or_turns_nineteen_this_month, is_pregnant], chp_has_other_health_coverage], "ineligible_coverage"], [[all, [any, ma_is_under_child_age_or_turns_nineteen_this_month, is_pregnant], [not, chp_income_within_limit]], "ineligible_income"], [[any, ma_is_under_child_age_or_turns_nineteen_this_month, is_pregnant], "ineligible_institution"], [else, "ineligible"]]
sources: [S242, S243, S244, S653]
open: [OQ-61]
implemented: engine
tags: [chp, magi, income, immigration, age]
accepts_from: [ma_is_under_child_age_or_turns_nineteen_this_month, ma_magi_is_fully_eligible, ma_meets_status_for_cover_all_coloradans_categories]
rationale: "Rewired in the phase 3 coordinator pass to read ma_magi_is_fully_eligible (CO-562, fix round; formerly ma_magi_is_eligible, CO-553, per the phase-3 review's C-10 finding) in place of the supplied placeholder (OQ-61). No existing item reports a single CHP+ eligibility outcome; this is the fact a caseworker or the engine's outcome view needs, and the phase-3 brief proposes it with role: outcome. Ordered so a person who is both a Medicaid-eligible child and, hypothetically, over the CHP+ income band is reported as ineligible_medicaid_eligible (the target household's p4 and p5) rather than ineligible_income, matching 10 CCR 2505-3-120.1.B's plain exclusion of anyone eligible for Medicaid before any of CHP+'s own income or coverage tests are reached. Fix round (C-14): added the ineligible_residency and ineligible_status branches (and options), reading is_colorado_resident (CO-501) and ma_meets_citizenship_requirement (CO-509, both cross-program Medicaid reads already established elsewhere in this chapter) ahead of the income catch-all, per the phase-3 review's finding that the prior case order made 'ineligible_income' a catch-all misreporting residency and citizenship failures - the review's own example (a Wyoming resident child at 200% FPL) is CO-707-T7 below. Vocabulary fix round (governance read.cross_program): accepts_from lists the other programs' items this rule reads on purpose. CHP+ applies the MAGI household, income and verification rules and Medicaid's status and age tests by reference (10 CCR 2505-3 110, 120, 42 CFR 457.380), and excludes a person eligible for Medicaid."
tests:
  - {id: CO-707-T1, as_of: "2026-10-01", month: "2026-10", title: "CO-01 p4: 17-year-old, household size 3, income 2380 (about 105% FPL), Medicaid-eligible child", given: {date_of_birth: "2009-04-08", is_pregnant: false, state_of_residence: "CO", citizenship_status: citizen, lawful_presence_status: unknown, ma_magi_household_income_pct_fpl: 1.0454, ma_magi_is_fully_eligible: true, chp_has_other_health_coverage: false}, expect: ineligible_medicaid_eligible}
  - {id: CO-707-T2, as_of: "2026-10-01", month: "2026-10", title: "CO-01 p5: 8-month-old, household size 2, income 0, Medicaid-eligible child", given: {date_of_birth: "2026-02-03", is_pregnant: false, state_of_residence: "CO", citizenship_status: citizen, lawful_presence_status: unknown, ma_magi_household_income_pct_fpl: 0.0, ma_magi_is_fully_eligible: true, chp_has_other_health_coverage: false}, expect: ineligible_medicaid_eligible}
  - {id: CO-707-T3, as_of: "2026-10-01", month: "2026-10", title: "Child at about 200% FPL, not Medicaid-eligible, no other coverage: CHP+ eligible", given: {date_of_birth: "2015-06-01", is_pregnant: false, state_of_residence: "CO", citizenship_status: citizen, lawful_presence_status: unknown, ma_magi_household_income_pct_fpl: 2.00, ma_magi_is_fully_eligible: false, chp_has_other_health_coverage: false, is_inmate_of_public_institution: false, is_patient_in_institution_for_mental_diseases: false}, expect: eligible_child}
  - {id: CO-707-T4, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "2015-06-01", is_pregnant: false, state_of_residence: "CO", citizenship_status: citizen, lawful_presence_status: unknown, ma_magi_household_income_pct_fpl: 2.00, ma_magi_is_fully_eligible: false, chp_has_other_health_coverage: true}, expect: ineligible_coverage}
  - {id: CO-707-T5, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "2015-06-01", is_pregnant: false, state_of_residence: "CO", citizenship_status: citizen, lawful_presence_status: unknown, ma_magi_household_income_pct_fpl: 1.00, ma_magi_is_fully_eligible: false, chp_has_other_health_coverage: false}, expect: ineligible_income}
  - {id: CO-707-T6, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "1985-01-01", is_pregnant: false, state_of_residence: "CO", citizenship_status: citizen, lawful_presence_status: unknown, ma_magi_household_income_pct_fpl: 2.00, ma_magi_is_fully_eligible: false, chp_has_other_health_coverage: false}, expect: ineligible}
  - {id: CO-707-T7, as_of: "2026-10-01", month: "2026-10", title: "Fix round (C-14): a Wyoming-resident child at 200% FPL fails residency, not income", given: {date_of_birth: "2015-06-01", is_pregnant: false, state_of_residence: "WY", citizenship_status: citizen, lawful_presence_status: unknown, ma_magi_household_income_pct_fpl: 2.00, ma_magi_is_fully_eligible: false, chp_has_other_health_coverage: false}, expect: ineligible_residency}
  - {id: CO-707-T8, as_of: "2026-10-01", month: "2026-10", title: "Fix round (C-14): an undocumented child (not under 19-or-pregnant-protected, hypothetically) fails citizenship/status, not income", given: {date_of_birth: "2015-06-01", is_pregnant: false, state_of_residence: "CO", citizenship_status: undocumented, lawful_presence_status: not_lawfully_present, ma_magi_household_income_pct_fpl: 2.00, ma_magi_is_fully_eligible: false, chp_has_other_health_coverage: false, ma_meets_citizenship_requirement: false, ma_is_cover_all_coloradans_person: false}, expect: ineligible_status}
  - {id: CO-707-T9, as_of: "2026-10-01", month: "2026-10", title: "Phase 7 (OQ-58): child at about 200% FPL who is a patient in an institution for mental diseases", given: {date_of_birth: "2015-06-01", is_pregnant: false, state_of_residence: "CO", citizenship_status: citizen, lawful_presence_status: unknown, ma_magi_household_income_pct_fpl: 2.00, ma_magi_is_fully_eligible: false, chp_has_other_health_coverage: false, is_inmate_of_public_institution: false, is_patient_in_institution_for_mental_diseases: true}, expect: ineligible_institution}
