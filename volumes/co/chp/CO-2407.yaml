id: CO-2407
name: "CHP+: is in the prenatal coverage period"
identifier: chp_is_in_prenatal_coverage_period
kind: derived
type: yes/no
scope: person-month
program: CHP+
meaning: "Whether this month falls in a pregnant woman's CHP+ enrollment span under 10 CCR 2505-3 § 430.3, which ends 'on the last day of the month 12 months after the birth of the child or termination of the pregnancy' for which she enrolled: a span recorded by an earlier determination (chp_eligibility_period_start_month) that began on or before this month, in a month she was prenatal-eligible or on or before the month her pregnancy ended, for a pregnancy whose recorded end reaches this month (no pregnancy ended after the span began and more than chp_postpartum_coverage_months before this month) or that continues; or, where none is recorded, a span that begins (chp_prenatal_span_begins_in_month, CO-7777: prenatal-eligible, for a pregnancy with a recorded end on or after the month or that continues) in a month from chp_prenatal_span_search_start_month (CO-7776: the application month, or after the last pregnancy whose span ended before this month) through the determination month and no later than this month. Coverage continues \"regardless of changes in the woman's financial circumstances\". With no application date and no recorded span: false for a person the case records as never pregnant or whose last pregnancy's span ended before the month (not pregnant now), otherwise unknown."
precision: "Coverage pass 7 (2026-11-24): C7-02, the span ran while she was pregnant on the determination date, so a span opened for a first pregnancy continued through a second (PG-SECOND-CHP: span recorded from 2025-03, birth 2025-09-10, pregnant again from 2026-10-05, $7,000: October 2026 eligible_prenatal; by hand the span ended with September 2026 (2025-09 + 12), and October is size 3, 7,000 / 2,276.67 = 307.5%, ineligible_income). Each span now ends with its own pregnancy's month 12 months after the end, and a later pregnancy begins its own span (CO-7776, CO-7777). C7-05: with no application date and no span recorded the span was read as closed (false); now it cannot be determined, unless the case records no pregnancy at all or her last pregnancy's span ended before the month and she is not pregnant now (decision 4 of 2026-11-23). The reasonable-compatibility exception of § 430.3.A.i is not tested: it is a verification failure the volume's verification items report (chp_verification_status). Prenatal eligibility in the span's first month reads that month's pregnancy (chp_is_pregnant_in_month, CO-7051, through chp_prenatal_is_eligible): a woman who applied while pregnant and delivered before the determination opens the span on the application month's eligibility (coverage pass 5, C5-03; before, chp_prenatal_is_eligible read is_pregnant, the pregnancy on the determination date, and the span never opened for her). A CHP+ span recorded (chp_eligibility_period_start_month) as beginning on or before the month the pregnancy ended is also read as the prenatal span § 430.3 continues, for a span an earlier determination opened. Coverage pass 6 (2026-11-24): C6-02, § 430.3 makes the enrollment 'effective as of the first of the month of the date of application or the first day of the month the pregnant woman becomes eligible': where no span is recorded, the span opens in the first month from the application month through the determination month in which she is prenatal-eligible (CHP-LATER-ELIG: applied 2026-09-28, September 5,000 / 1,803.33 = 277.3% > 260%, October 4,200 / 1,803.33 = 232.9%: the span from October through October 2027; before, only September was tested and nothing opened); a month after the determination month opens nothing in this determination. C6-03: the end of the pregnancy is read from most_recent_pregnancy_end_date (CO-7400); a person not pregnant now who states a pregnancy_start_date with no end and no birth recorded cannot be determined after the span's first month."
derived: [case, [[not, [unknown, chp_eligibility_period_start_month]], [all, [">=", [month], chp_eligibility_period_start_month], [any, [at, chp_prenatal_is_eligible, chp_eligibility_period_start_month], [at, pregnancy_ended_on_or_after_month, chp_eligibility_period_start_month]], [any, [not, [at, pregnancy_ended_before_month, [months_before, chp_postpartum_coverage_months, [month]]]], [">", chp_eligibility_period_start_month, [month_of, [at, latest_pregnancy_end_date_before_month, [months_before, chp_postpartum_coverage_months, [month]]]]]], [case, [[at, pregnancy_ended_on_or_after_month, chp_eligibility_period_start_month], true], [is_pregnant, true]]]], [[unknown, ma_application_date], [case, [[all, [not, is_pregnant], [any, [all, [unknown, pregnancy_start_date], [unknown, most_recent_pregnancy_end_date]], [">", [month], chp_prenatal_coverage_end_month]]], false]]], [else, [some_month, [months_from_to, chp_prenatal_span_search_start_month, [case, [[">", [month], [det_month]], [det_month]], [else, [month]]]], chp_prenatal_span_begins_in_month]]]
sources: [S1715]
implemented: engine
tags: [chp]
open: [OQ-813]
accepts_from:
  - {from: ma_application_date, class: primitive, source: S1715}
rationale: "B-2 of the HCPF review: a CHP+ prenatal member was dropped at birth. No CHP+ item kept the span open; ma_is_in_pregnancy_coverage_period (CO-566) is the Medicaid span."
tests:
  - {id: CO-2407-T1, month: "2027-02", as_of: "2027-02-01", given: {chp_eligibility_period_start_month: "2026-10", chp_prenatal_is_eligible: {"2026-10": true, "2027-02": false}, is_pregnant: false, pregnancy_end_date: "2026-12-03"}, title: "Enrolled in CHP+ prenatal in October; gave birth in December; February is in the span", expect: true}
  - {id: CO-2407-T2, month: "2028-01", as_of: "2028-01-01", given: {chp_eligibility_period_start_month: "2026-10", chp_prenatal_is_eligible: {"2026-10": true}, is_pregnant: false, pregnancy_end_date: "2026-12-03"}, title: "Thirteen months after the birth: past the span", expect: false}
  - {id: CO-2407-T3, month: "2026-11", as_of: "2026-11-01", given: {chp_eligibility_period_start_month: "2026-10", chp_prenatal_is_eligible: {"2026-10": true, "2026-11": false}, is_pregnant: true}, title: "Still pregnant; income rose in November", expect: true}
  - {id: CO-2407-T4, month: "2026-11", as_of: "2026-11-01", given: {chp_eligibility_period_start_month: "2026-10", chp_prenatal_is_eligible: {"2026-10": false}, is_pregnant: true}, title: "Not eligible in the first month", expect: false}
  - {id: CO-2407-T5, month: "2027-02", as_of: "2027-02-01", given: {chp_eligibility_period_start_month: "2026-10", chp_prenatal_is_eligible: {"2026-10": false, "2027-02": false}, is_pregnant: false, pregnancy_end_date: "2026-12-03"}, title: "After the birth: a CHP+ span recorded from October, pregnancy ended in December", expect: true}
  - {id: CO-2407-T8, month: "2026-11", as_of: "2026-11-10", given: {ma_application_date: "2026-10-05", chp_prenatal_is_eligible: {"2026-10": true}, is_pregnant: false, pregnancy_end_date: "2026-10-20"}, title: "C5-03 (CHP-PG-DELIVERED): applied 2026-10-05 while pregnant, prenatal-eligible in October (232.9% in the 195% to 260% band), delivered 2026-10-20, no span recorded: the span opens in the application month and November is in it", expect: true}
  - {id: CO-2407-T9, month: "2027-10", as_of: "2026-11-10", given: {ma_application_date: "2026-10-05", chp_prenatal_is_eligible: {"2026-10": true}, is_pregnant: false, pregnancy_end_date: "2026-10-20"}, title: "C5-03: the same; October 2027 is the month 12 months after the birth, the span's last month (430.3)", expect: true}
  - {id: CO-2407-T10, month: "2027-11", as_of: "2026-11-10", given: {ma_application_date: "2026-10-05", chp_prenatal_is_eligible: {"2026-10": true}, is_pregnant: false, pregnancy_end_date: "2026-10-20"}, title: "C5-03: the same; November 2027 is after the span", expect: false}
  - {id: CO-2407-T11, month: "2026-11", as_of: "2026-11-10", given: {ma_application_date: "2026-09-28", chp_prenatal_is_eligible: {"2026-09": false, "2026-10": true}, is_pregnant: false, pregnancy_end_date: "2026-10-20"}, title: "C6-02 (CHP-LATER-ELIG): applied 2026-09-28; September 277.3% > 260% not eligible, October 232.9% eligible (195% to 260%); delivered 2026-10-20: the span opened in October, November is in it (was false)", expect: true}
  - {id: CO-2407-T12, month: "2027-10", as_of: "2026-11-10", given: {ma_application_date: "2026-09-28", chp_prenatal_is_eligible: {"2026-09": false, "2026-10": true}, is_pregnant: false, pregnancy_end_date: "2026-10-20"}, title: "C6-02: the same; October 2027 is the month 12 months after the birth, the span's last month", expect: true}
  - {id: CO-2407-T13, month: "2027-11", as_of: "2026-11-10", given: {ma_application_date: "2026-09-28", chp_prenatal_is_eligible: {"2026-09": false, "2026-10": true}, is_pregnant: false, pregnancy_end_date: "2026-10-20"}, title: "C6-02: the same; November 2027 is after the span", expect: false}
  - {id: CO-2407-T14, month: "2026-09", as_of: "2026-11-10", given: {ma_application_date: "2026-09-28", chp_prenatal_is_eligible: {"2026-09": false, "2026-10": true}, is_pregnant: false, pregnancy_end_date: "2026-10-20"}, title: "C6-02: the same; September, before the month she became eligible, is not in the span", expect: false}
  - {id: CO-2407-T15, month: "2026-11", as_of: "2026-11-10", given: {ma_application_date: "2026-10-05", chp_prenatal_is_eligible: {"2026-10": true}, is_pregnant: false, pregnancy_start_date: "2026-02-10"}, others: {p2: {date_of_birth: "2026-10-20"}}, relationships: [[gave_birth_to, p1, p2]], title: "C6-03 (CO-814 without pregnancy_end_date): the birth of p2 on 2026-10-20 recorded by the child: November is in the span (through October 2027)", expect: true}
  # Coverage pass 7, C7-02 (PG-SECOND-CHP): a CHP+ prenatal span recorded from 2025-03 (chp_eligibility_period_start_month); she gave birth to p2 on 2025-09-10 (span end 2025-09 + 12 = 2026-09); pregnant again from 2026-10-05 (is_pregnant true); determined 2026-11-10.
  - {id: CO-2407-T90, month: "2026-09", as_of: "2026-11-10", title: "C7-02: September 2026 is the 12th month after the 2025-09-10 birth: still in the recorded span", given: {chp_eligibility_period_start_month: "2025-03", ma_application_date: "2025-03-01", is_pregnant: true, chp_prenatal_is_eligible: {"2025-03": true}}, others: {p2: {date_of_birth: "2025-09-10"}}, relationships: [[gave_birth_to, p1, p2]], expect: true}
  - {id: CO-2407-T91, month: "2026-10", as_of: "2026-11-10", title: "C7-02 (was true): October 2026 - 12 = 2025-10; the 2025-09-10 birth, the first end after the span began, is before it: the recorded span ended with September 2026, though she is pregnant again", given: {chp_eligibility_period_start_month: "2025-03", ma_application_date: "2025-03-01", is_pregnant: true, chp_prenatal_is_eligible: {"2025-03": true}}, others: {p2: {date_of_birth: "2025-09-10"}}, relationships: [[gave_birth_to, p1, p2]], expect: false}
  - {id: CO-2407-T92, month: "2026-11", as_of: "2026-11-10", title: "C7-02: no span recorded, application 2025-03-01; for November 2026 the search starts at 2025-10 (CO-7776), and October 2026 begins a span for the second pregnancy (prenatal-eligible, pregnant now): in the span", given: {ma_application_date: "2025-03-01", is_pregnant: true, chp_prenatal_is_eligible: {"2025-10": false, "2025-11": false, "2025-12": false, "2026-01": false, "2026-02": false, "2026-03": false, "2026-04": false, "2026-05": false, "2026-06": false, "2026-07": false, "2026-08": false, "2026-09": false, "2026-10": true}}, others: {p2: {date_of_birth: "2025-09-10"}}, relationships: [[gave_birth_to, p1, p2]], expect: true}
  - {id: CO-2407-T93, month: "2026-11", as_of: "2026-11-10", title: "C7-05 (CO-923 without ma_application_date; was false): no span recorded, no application date, not pregnant now, she gave birth to p2 on 2026-10-15 (span end 2027-10): cannot be determined", given: {is_pregnant: false}, others: {p2: {date_of_birth: "2026-10-15"}}, relationships: [[gave_birth_to, p1, p2]], expect: unknown}
