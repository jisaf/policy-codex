id: CO-4792
name: "CHP+: Express Lane child meets the eligibility requirements"
identifier: chp_express_lane_child_meets_requirements
kind: derived
type: yes/no
scope: person-month
program: CHP+
meaning: "Whether a child referred through Express Lane meets the CHP+ eligibility requirements of 10 CCR 2505-3 § 180, judged on the income declared on the source application (§ 180.1.A.5, § 180.2.A.4): under ma_magi_child_age_limit or turning 19 this month, a Colorado resident, meeting the CHP+ status requirement, with declared household income above the children's Medicaid standard and within the CHP+ upper limit (each tested plainly or after the ma_magi_income_disregard_pct disregard, § 150.2, as CO-704 tests the MAGI income), not meeting the Medicaid Express Lane requirements (§ 120.1.B), with no other health coverage (§ 120.1.A), and not excluded as an inmate, an institution for mental diseases patient or a public agency employee's family (§ 120.1.C)."
precision: "The income is the source application's declared household income and size (declared_household_income_pct_fpl, CO-3151), as for Medicaid's Express Lane (CO-3156): § 180.1.A.5 and § 180.2.A.4 make the declared income the basis. The other requirements are CHP+'s own (§ 180.2.A.1: \"as outlined throughout sections 100 through 180\"), read as chp_child_is_eligible (CO-705) reads them; § 180.1.A.4 and § 180.2.A.3 have any further verification requested before enrollment, so a requirement the referral does not state (other coverage, for one) is unknown until it is supplied. A child who meets Medicaid's Express Lane requirements is enrolled in Medicaid (§ 120.1.B), so this item is false for that child."
derived: [all, ma_is_under_child_age_or_turns_nineteen_this_month, is_colorado_resident, chp_meets_status_requirement, [not, ma_express_lane_child_meets_requirements], [any, [all, [">", declared_household_income_pct_fpl, ma_income_limit_child_pct], ["<=", declared_household_income_pct_fpl, chp_income_limit_pct_upper]], [all, [">", ["-", declared_household_income_pct_fpl, ma_magi_income_disregard_pct], ma_income_limit_child_pct], ["<=", ["-", declared_household_income_pct_fpl, ma_magi_income_disregard_pct], chp_income_limit_pct_upper]]], [not, chp_has_other_health_coverage], [not, [all, is_inmate_of_public_institution, [not, chp_is_in_reentry_period]]], [not, is_patient_in_institution_for_mental_diseases], [not, chp_is_excluded_as_public_agency_employee_family]]
sources: [S3550, S243, S643]
implemented: engine
tags: [chp, income, age]
accepts_from:
  - {from: ma_express_lane_child_meets_requirements, class: rule_required, source: S3550}
  - {from: ma_is_under_child_age_or_turns_nineteen_this_month, class: adopted_method, source: S606}
nearest: [CO-3156, CO-705]
rationale: "Coverage review 2, N-05 (2026-11-22): 10 CCR 2505-3 § 180 gives CHP+ its own Express Lane, enrolling a referred child who meets CHP+'s requirements (§§ 100 to 180) on the declared income. CO-3156 tests only the Medicaid children's standard, so a referred child with declared income in the CHP+ band was sent to the Single Streamlined Application. CO-705 reads the MAGI household income, which the source application does not collect."
tests:
  - {id: CO-4792-T1, month: "2026-11", as_of: "2026-11-10", title: "Coverage review 2, N-05 (RV2-ELE): declared 200% FPL, no other coverage - meets the CHP+ requirements", given: {date_of_birth: "2016-05-01", is_colorado_resident: true, chp_meets_status_requirement: true, ma_express_lane_child_meets_requirements: false, declared_household_income_pct_fpl: 2.0, chp_has_other_health_coverage: false, is_inmate_of_public_institution: false, is_patient_in_institution_for_mental_diseases: false, chp_is_excluded_as_public_agency_employee_family: false}, expect: true}
  - {id: CO-4792-T2, month: "2026-11", as_of: "2026-11-10", title: "Declared 300% FPL, over 260% plus the disregard", given: {date_of_birth: "2016-05-01", is_colorado_resident: true, chp_meets_status_requirement: true, ma_express_lane_child_meets_requirements: false, declared_household_income_pct_fpl: 3.0, chp_has_other_health_coverage: false, is_inmate_of_public_institution: false, is_patient_in_institution_for_mental_diseases: false, chp_is_excluded_as_public_agency_employee_family: false}, expect: false}
  - {id: CO-4792-T3, month: "2026-11", as_of: "2026-11-10", title: "Declared 200% FPL with employer coverage (§ 120.1.A)", given: {date_of_birth: "2016-05-01", is_colorado_resident: true, chp_meets_status_requirement: true, ma_express_lane_child_meets_requirements: false, declared_household_income_pct_fpl: 2.0, chp_has_other_health_coverage: true, is_inmate_of_public_institution: false, is_patient_in_institution_for_mental_diseases: false, chp_is_excluded_as_public_agency_employee_family: false}, expect: false}
  - {id: CO-4792-T4, month: "2026-11", as_of: "2026-11-10", title: "Declared 263% FPL: within 260% after the disregard (§ 150.2)", given: {date_of_birth: "2016-05-01", is_colorado_resident: true, chp_meets_status_requirement: true, ma_express_lane_child_meets_requirements: false, declared_household_income_pct_fpl: 2.63, chp_has_other_health_coverage: false, is_inmate_of_public_institution: false, is_patient_in_institution_for_mental_diseases: false, chp_is_excluded_as_public_agency_employee_family: false}, expect: true}
