id: CO-2230
name: "CHP+: scheduled copayment"
identifier: chp_scheduled_copayment
kind: derived
type: money
scope: person
program: CHP+
meaning: "The copayment 10 CCR 2505-3 § 320.1 schedules for the service (chp_service_type) at the family's income band (chp_copayment_income_band), before the exemptions and the yearly limit: none for a preventive service (§ 330.3), for COVID-19 laboratory testing (§ 320.1.C.3) or for emergency care when the enrollee is admitted to the hospital; in band A, $3 per use of emergency care and $1 per use of urgent or after-hours care and nothing else; in bands B, C and D, the amounts each band lists, and nothing for a service the band does not list (band B lists no laboratory or imaging copayment)."
derived: [case, [[in, chp_service_type, [preventive, covid_19_laboratory_testing, emergency_care_with_admission]], 0], [["=", chp_copayment_income_band, band_a], [case, [["=", chp_service_type, emergency_care], 3], [["=", chp_service_type, urgent_care], 1], [else, 0]]], [["=", chp_copayment_income_band, band_b], [case, [[in, chp_service_type, [office_visit, behavioral_health_visit, therapy_visit, vision_visit, emergency_transport, inpatient_hospital, inpatient_physician, outpatient_hospital]], 2], [[in, chp_service_type, [generic_prescription, brand_name_prescription, urgent_care]], 1], [["=", chp_service_type, emergency_care], 3], [else, 0]]], [["=", chp_copayment_income_band, band_c], [case, [[in, chp_service_type, [office_visit, behavioral_health_visit, therapy_visit, vision_visit, laboratory_or_imaging, inpatient_physician, outpatient_hospital]], 5], [["=", chp_service_type, generic_prescription], 3], [["=", chp_service_type, brand_name_prescription], 10], [["=", chp_service_type, emergency_care], 30], [[in, chp_service_type, [urgent_care, inpatient_hospital]], 20], [["=", chp_service_type, emergency_transport], 15], [else, 0]]], [else, [case, [[in, chp_service_type, [office_visit, behavioral_health_visit, therapy_visit, vision_visit, laboratory_or_imaging, inpatient_physician, outpatient_hospital]], 10], [["=", chp_service_type, generic_prescription], 5], [["=", chp_service_type, brand_name_prescription], 15], [[in, chp_service_type, [emergency_care, inpatient_hospital]], 50], [["=", chp_service_type, urgent_care], 30], [["=", chp_service_type, emergency_transport], 25], [else, 0]]]]
sources: [S1504, S1505]
implemented: engine
tags: [chp]
rationale: "OQ-60: the § 320.1 schedule was not modeled. The dollar amounts are stated in the rule (effective July 1, 2012) and written into the case expression as the rule lists them."
tests:
  - {id: CO-2230-T1, as_of: "2026-10-01", title: "Band A urgent care", given: {chp_service_type: urgent_care, chp_copayment_income_band: band_a}, expect: 1}
  - {id: CO-2230-T2, as_of: "2026-10-01", title: "Band A office visit waived", given: {chp_service_type: office_visit, chp_copayment_income_band: band_a}, expect: 0}
  - {id: CO-2230-T3, as_of: "2026-10-01", title: "Band B brand name prescription", given: {chp_service_type: brand_name_prescription, chp_copayment_income_band: band_b}, expect: 1}
  - {id: CO-2230-T4, as_of: "2026-10-01", title: "Band B laboratory: not listed", given: {chp_service_type: laboratory_or_imaging, chp_copayment_income_band: band_b}, expect: 0}
  - {id: CO-2230-T5, as_of: "2026-10-01", title: "Band C emergency care", given: {chp_service_type: emergency_care, chp_copayment_income_band: band_c}, expect: 30}
  - {id: CO-2230-T6, as_of: "2026-10-01", title: "Band C inpatient hospital", given: {chp_service_type: inpatient_hospital, chp_copayment_income_band: band_c}, expect: 20}
  - {id: CO-2230-T7, as_of: "2026-10-01", title: "Band D brand name prescription", given: {chp_service_type: brand_name_prescription, chp_copayment_income_band: band_d}, expect: 15}
  - {id: CO-2230-T8, as_of: "2026-10-01", title: "Band D emergency care with admission: waived", given: {chp_service_type: emergency_care_with_admission, chp_copayment_income_band: band_d}, expect: 0}
  - {id: CO-2230-T9, as_of: "2026-10-01", title: "Preventive service", given: {chp_service_type: preventive, chp_copayment_income_band: band_d}, expect: 0}
  - {id: CO-2230-T10, as_of: "2026-10-01", title: "Band D ambulance", given: {chp_service_type: emergency_transport, chp_copayment_income_band: band_d}, expect: 25}
