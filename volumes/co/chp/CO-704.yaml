id: CO-704
name: "CHP+: household income is within the CHP+ limit"
identifier: chp_income_within_limit
kind: derived
type: yes/no
scope: person-month
program: CHP+
meaning: Whether this person's chp_household_income, as a percentage of the poverty guideline, falls within the band 10 CCR 2505-3-110.1.E states for a child (greater than ma_income_limit_child_pct, not exceeding chp_income_limit_pct_upper of FPL) or 110.1.F states for a pregnant woman (greater than ma_income_limit_pregnant_pct, not exceeding chp_income_limit_pct_upper of FPL), applying the 42 CFR 435.603(d)(4)/10 CCR 2505-10 8.100.4.D ma_magi_income_disregard_pct disregard only when it makes the difference for CHP+, the highest MAGI income standard a child or pregnant person in this band could qualify under.
precision: "The ma_magi_income_disregard_pct disregard (ma_magi_income_disregard_pct) is tested as an alternative to the plain ratio, not always subtracted, because subtracting it unconditionally could push a household that already qualifies without it below the lower bound (a household at 142.5% of FPL, for example, would fail the ma_income_limit_child_pct floor once 5 points are subtracted, which is not what the disregard is for). This item is therefore true when either the plain ma_magi_household_income_pct_fpl falls in the band, or the ratio less the disregard does; both compare against the same lower/upper parameters for the person's category (child or pregnant). Coverage pass 4, C4-05: the month's figure (ma_magi_monthly_household_income_pct_fpl, CO-6452) is tested first, and the budget figure of C.4.a and C.5 only where it fails, so an applicant eligible on the month is determined where the annualized figure cannot be. Coverage pass 5, C5-03 (2026-11-23): pregnancy is read for the month evaluated (chp_is_pregnant_in_month, CO-7051), not on the determination date (is_pregnant), so a woman who applied while pregnant and delivered before the determination is a pregnant woman in the months she was pregnant."
derived: [case, [ma_is_under_child_age_or_turns_nineteen_this_month, [any, [all, [all, [">", ma_magi_monthly_household_income_pct_fpl, ma_income_limit_child_pct], [">", ma_magi_household_income_pct_fpl, ma_income_limit_child_pct]], [any, ["<=", ma_magi_monthly_household_income_pct_fpl, chp_income_limit_pct_upper], ["<=", ma_magi_household_income_pct_fpl, chp_income_limit_pct_upper]]], [all, [all, [">", ["-", ma_magi_monthly_household_income_pct_fpl, ma_magi_income_disregard_pct], ma_income_limit_child_pct], [">", ["-", ma_magi_household_income_pct_fpl, ma_magi_income_disregard_pct], ma_income_limit_child_pct]], [any, ["<=", ["-", ma_magi_monthly_household_income_pct_fpl, ma_magi_income_disregard_pct], chp_income_limit_pct_upper], ["<=", ["-", ma_magi_household_income_pct_fpl, ma_magi_income_disregard_pct], chp_income_limit_pct_upper]]]]], [chp_is_pregnant_in_month, [any, [all, [all, [">", ma_magi_monthly_household_income_pct_fpl, ma_income_limit_pregnant_pct], [">", ma_magi_household_income_pct_fpl, ma_income_limit_pregnant_pct]], [any, ["<=", ma_magi_monthly_household_income_pct_fpl, chp_income_limit_pct_upper], ["<=", ma_magi_household_income_pct_fpl, chp_income_limit_pct_upper]]], [all, [all, [">", ["-", ma_magi_monthly_household_income_pct_fpl, ma_magi_income_disregard_pct], ma_income_limit_pregnant_pct], [">", ["-", ma_magi_household_income_pct_fpl, ma_magi_income_disregard_pct], ma_income_limit_pregnant_pct]], [any, ["<=", ["-", ma_magi_monthly_household_income_pct_fpl, ma_magi_income_disregard_pct], chp_income_limit_pct_upper], ["<=", ["-", ma_magi_household_income_pct_fpl, ma_magi_income_disregard_pct], chp_income_limit_pct_upper]]]]], [else, false]]
sources: [S243, S643, S246, S245]
implemented: engine
tags: [chp, magi, income]
open: [OQ-62]
accepts_from:
  - {from: ma_is_under_child_age_or_turns_nineteen_this_month, class: adopted_method, source: S606}
  - {from: ma_magi_household_income_pct_fpl, class: adopted_method, source: S245}
  - {from: ma_magi_monthly_household_income_pct_fpl, class: adopted_method, source: S245}
rationale: "No existing item tests CHP+'s income band. chp_child_is_eligible (CO-705), chp_prenatal_is_eligible (CO-706) and chp_eligibility_status (CO-707) need this single yes/no rather than each re-deriving the child/pregnant band selection and the disregard's benefit-only application. Not the same test as any Medicaid income-standard rule (batch 6's ma_is_child_category and siblings), because CHP+'s band has both a floor and a ceiling (110.1.E-F), where Medicaid's MAGI standards are ceilings only. Vocabulary fix round (governance read.cross_program): accepts_from lists the other programs' items this rule reads on purpose. CHP+ applies the MAGI household, income and verification rules and Medicaid's status and age tests by reference (10 CCR 2505-3 110, 120, 42 CFR 457.380), and excludes a person eligible for Medicaid. Receipt records, migration phase 2 (2026-11-23): the MAGI household income CHP+ reads counts the receipts through Medicaid's MAGI counting table (ma_magi_receipt_treatment_table, CO-5500); CHP+ keeps no table of its own, because 10 CCR 2505-3 150.1 (S245) adopts Medicaid's MAGI income calculation by reference (\"Calculation of income for the Children's Basic Health Plan shall be determined as required in 10 CCR 2505-10-8.100.4.C\"). The adopted-method link now cites that adoption."
tests:
  - {id: CO-704-T1, month: "2026-10", as_of: "2026-10-01", given: {date_of_birth: "2009-04-08", is_pregnant: false, ma_magi_household_income_pct_fpl: 2, ma_magi_monthly_household_income_pct_fpl: 2}, expect: true}
  - {id: CO-704-T2, month: "2026-10", as_of: "2026-10-01", given: {date_of_birth: "2009-04-08", is_pregnant: false, ma_magi_household_income_pct_fpl: 1.045, ma_magi_monthly_household_income_pct_fpl: 1.045}, expect: false}
  - {id: CO-704-T3, month: "2026-10", as_of: "2026-10-01", given: {date_of_birth: "1990-01-01", is_pregnant: true, ma_magi_household_income_pct_fpl: 2.1, ma_magi_monthly_household_income_pct_fpl: 2.1}, expect: true}
  - {id: CO-704-T4, month: "2026-10", as_of: "2026-10-01", given: {date_of_birth: "2009-04-08", is_pregnant: false, ma_magi_household_income_pct_fpl: 1.43, ma_magi_monthly_household_income_pct_fpl: 1.43}, expect: true}
  - {id: CO-704-T5, month: "2026-10", as_of: "2026-10-01", given: {date_of_birth: "2009-04-08", is_pregnant: false, ma_magi_household_income_pct_fpl: 2.63, ma_magi_monthly_household_income_pct_fpl: 2.63}, expect: true}
  - {id: CO-704-T6, month: "2026-10", as_of: "2026-10-01", given: {date_of_birth: "2009-04-08", is_pregnant: false, ma_magi_household_income_pct_fpl: 2.7, ma_magi_monthly_household_income_pct_fpl: 2.7}, expect: false}
  - {id: CO-704-T7, month: "2026-10", as_of: "2026-10-01", given: {date_of_birth: "2009-04-08", is_pregnant: false, ma_magi_household_income_pct_fpl: 1.42, ma_magi_monthly_household_income_pct_fpl: 1.42}, title: "T-9: ma_magi_household_income_pct_fpl equal to ma_income_limit_child_pct (ma_magi_household_income_pct_fpl over ma_income_limit_child_pct)", expect: false}
  - {id: CO-704-T8, month: "2026-10", as_of: "2026-10-01", given: {date_of_birth: "1990-01-01", is_pregnant: true, ma_magi_household_income_pct_fpl: 1.95, ma_magi_monthly_household_income_pct_fpl: 1.95}, title: "T-9: ma_magi_household_income_pct_fpl equal to ma_income_limit_pregnant_pct (ma_magi_household_income_pct_fpl over ma_income_limit_pregnant_pct)", expect: false}
