id: CO-705
name: "CHP+: child is eligible"
identifier: chp_child_is_eligible
kind: derived
type: yes/no
scope: person-month
program: CHP+
meaning: Whether a child (under 19) meets every Children's Basic Health Plan eligibility requirement this batch models under 10 CCR 2505-3-110 and -120 - being a child, a Colorado resident, meeting the citizenship/immigration requirement, having household income within the CHP+ band, not being eligible for Medicaid, and not having other creditable health coverage.
precision: "Citizenship/immigration status (110.1.B) reads ma_meets_citizenship_requirement (CO-509) rather than restating 110.1.B's own long list of specific immigration categories, because 110.1.B.5.p's Cover All Coloradans exception - which CO-509 already models - reaches every person under 19 regardless of status; for CHP+'s population (children and pregnant women only), the two tests are equivalent in outcome even though 110.1.B's list and 8.100.3.G.1.g's list are not worded identically. 10 CCR 2505-3-120.1.C's exclusion of an inmate of a public institution or a patient in an institution for mental diseases is not modeled in this batch: this volume's existing in_medical_institution supplied fact (batch 1, shared with SNAP and long-term care Medicaid) means something different (a nursing-facility or similar level-of-care institutionalization), not '120.1.C's narrower categories, and no supplied fact distinguishes them - see OQ-58."
derived: [all, chp_is_child, ma_meets_residency, ma_meets_citizenship_requirement, chp_income_within_limit, [not, ma_magi_is_fully_eligible], [not, has_other_creditable_health_coverage]]
sources: [S242, S243, S244, S248]
open: [OQ-58, OQ-61]
implemented: engine
tags: [chp, magi, income, immigration, age]
rationale: "Rewired in the phase 3 coordinator pass to read ma_magi_is_fully_eligible (CO-562, fix round; formerly ma_magi_is_eligible, CO-553, per the phase-3 review's C-10 finding) in place of the supplied placeholder (OQ-61). No existing item states CHP+ child eligibility. chp_eligibility_status (CO-707) needs this as its first branch. Reads ma_meets_residency (CO-505) and ma_meets_citizenship_requirement (CO-509) cross-program rather than restating Colorado residency/citizenship, because 10 CCR 2505-3-110.1.D's residency text and 110.1.B.5.p's Cover All Coloradans exception are the same tests the Medicaid chapter already derives from 8.100.3.B and 8.100.3.G.1.g.viii.1; per the phase-3 brief, cross-program reads of ma_ items are expected for CHP+."
