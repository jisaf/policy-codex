id: CO-705
name: "CHP+: child is eligible"
identifier: chp_child_is_eligible
kind: derived
type: yes/no
scope: person-month
program: CHP+
meaning: Whether a child (under 19) meets every Children's Basic Health Plan eligibility requirement this batch models under 10 CCR 2505-3-110 and -120 - being a child, a Colorado resident, meeting the citizenship/immigration requirement, having household income within the CHP+ band, not being eligible for Medicaid, and not having other creditable health coverage.
precision: "Citizenship/immigration status (110.1.B) reads ma_meets_status_for_cover_all_coloradans_categories (CO-1174: the Medicaid status test, CO-509, or the Cover All Coloradans population, CO-1173) rather than restating 110.1.B's own long list of specific immigration categories, because 110.1.B.5.o's Cover All Coloradans exception reaches every person under 19 regardless of status (phase 7 fix round: CO-509 no longer carries that exception itself, S-2); for CHP+'s population (children and pregnant women only), the two tests are equivalent in outcome even though 110.1.B's list and 8.100.3.G.1.g's list are not worded identically. 10 CCR 2505-3-120.1.C's exclusion of an inmate of a public institution or a patient in an institution for mental diseases reads is_inmate_of_public_institution (CO-1105) and is_patient_in_institution_for_mental_diseases (CO-1104), added in phase 7 (OQ-58, resolved), not snap_resides_in_institution_providing_meals, which means a nursing-facility or similar long-term care admission; the 90-days-before-release reentry services § 120.1.C carves out are a benefit, not eligibility, and are not modeled. Vocabulary fix round (docs/reviews/vocabulary-reuse.md, R-14): the inmate exclusion reads plain incarceration (CO-1105) and CHP+'s own reentry carve-out (chp_is_in_reentry_period, CO-1749)."
derived: [all, ma_is_under_child_age_or_turns_nineteen_this_month, is_colorado_resident, ma_meets_status_for_cover_all_coloradans_categories, chp_income_within_limit, [not, ma_magi_is_fully_eligible], [not, chp_has_other_health_coverage], [not, [all, is_inmate_of_public_institution, [not, chp_is_in_reentry_period]]], [not, is_patient_in_institution_for_mental_diseases]]
sources: [S242, S243, S244, S248, S606, S643, S653]
open: [OQ-61]
implemented: engine
tags: [chp, magi, income, immigration, age]
accepts_from: [ma_is_under_child_age_or_turns_nineteen_this_month, ma_magi_is_fully_eligible, ma_meets_status_for_cover_all_coloradans_categories]
rationale: "Rewired in the phase 3 coordinator pass to read ma_magi_is_fully_eligible (CO-562, fix round; formerly ma_magi_is_eligible, CO-553, per the phase-3 review's C-10 finding) in place of the supplied placeholder (OQ-61). No existing item states CHP+ child eligibility. chp_eligibility_status (CO-707) needs this as its first branch. Reads is_colorado_resident (CO-505) and ma_meets_citizenship_requirement (CO-509) cross-program rather than restating Colorado residency/citizenship, because 10 CCR 2505-3-110.1.D's residency text and 110.1.B.5.p's Cover All Coloradans exception are the same tests the Medicaid chapter already derives from 8.100.3.B and 8.100.3.G.1.g.viii.1; per the phase-3 brief, cross-program reads of ma_ items are expected for CHP+. Vocabulary fix round (governance read.cross_program): accepts_from lists the other programs' items this rule reads on purpose. CHP+ applies the MAGI household, income and verification rules and Medicaid's status and age tests by reference (10 CCR 2505-3 110, 120, 42 CFR 457.380), and excludes a person eligible for Medicaid."
