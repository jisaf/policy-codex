id: CO-2706
name: "CHP+: has a qualifying citizenship or immigration status"
identifier: chp_has_qualifying_immigration_status
kind: derived
type: yes/no
scope: person
program: CHP+
meaning: "Whether the person falls into one of the citizenship and immigration categories of 10 CCR 2505-3 § 110.1.B.1-5 for the Children's Basic Health Plan: a citizen or national (B.1); a lawfully admitted non-citizen who entered before August 22, 1996 (B.2); a lawful permanent resident, a parolee for at least one year, a conditional entrant or a battered non-citizen (B.3, with no waiting period); a lawfully residing veteran or person on active duty or the spouse or dependent child of one, an asylee, a refugee, a person whose deportation is withheld, a Cuban or Haitian entrant, an American Indian born in Canada or tribal member, an Iraqi or Afghan special immigrant admitted on or after December 26, 2007, or a Compact of Free Association migrant (B.4, any date of arrival); or a lawfully residing non-citizen in one of the CHIPRA 214 categories of B.5.a-n."
precision: "Reads immigration_status (CO-002). An Amerasian immigrant (B.4.h) and a Hmong or Highland Lao veteran (B.4.i) are lawful permanent residents, already in B.3.a. B.2's \"lawfully admitted\" is read as any declared status (claims_lawful_immigration_status, CO-1359) with us_entry_date before qualified_non_citizen_entry_cutoff_date (CO-279). A lawfully residing veteran (B.4.a-b) is a person with a declared status and has_military_connection (CO-005). An Afghan or Ukrainian humanitarian parolee is read as paroled for at least one year (B.3.b; OQ-550). A pending Special Immigrant Juvenile applicant who is not a child and DACA are not on 110.1.B's list; a trafficking victim is not either, but is accepted as a refugee is, by statute (statute_override); the Cover All Coloradans exception (110.1.B.5.o) reaches every CHP+ child and pregnant person regardless (chp_meets_status_requirement, CO-2707)."
statute_override: "Federal law adds to 10 CCR 2505-3 § 110.1.B's list: 22 U.S.C. 7105(b)(1)(A) makes a victim of a severe form of trafficking in persons (a person under 18, or one certified by HHS) and a T-2 to T-5 nonimmigrant eligible for benefits under any program funded or administered by HHS \"to the same extent as an alien who is admitted to the United States as a refugee\", and CHP+ (Title XXI) is such a program, so a trafficking victim is accepted as a refugee is (OQ-550)."
derived: [any, is_us_citizen_or_national, [in, immigration_status, [lawful_permanent_resident, parolee_one_year_or_more, afghan_humanitarian_parolee, ukrainian_humanitarian_parolee, conditional_entrant, battered_non_citizen, asylee, refugee, trafficking_victim, deportation_withheld, cuban_haitian_entrant, compact_of_free_association_migrant, temporary_resident, temporary_protected_status, employment_authorized_under_274a12c, family_unity, deferred_enforced_departure, deferred_action, administrative_stay_of_removal, pending_adjustment_with_approved_petition, asylum_or_withholding_applicant_with_employment_authorization, asylum_or_withholding_applicant_under_14_pending_180_days, cat_withholding_granted, american_samoa_lawfully_present, nonimmigrant, parolee_less_than_one_year, special_immigrant_juvenile_applicant]], [all, ["=", immigration_status, iraqi_afghan_special_immigrant], [">=", us_entry_date, iraqi_afghan_special_immigrant_entry_start_date]], [otherwise, is_american_indian_born_in_canada_or_tribal_member, false], [all, claims_lawful_immigration_status, has_military_connection], [all, claims_lawful_immigration_status, ["<", us_entry_date, qualified_non_citizen_entry_cutoff_date]]]
sources: [S1906, S1907, S1908, S2414, S2415]
open: [OQ-550]
implemented: engine
tags: [chp, immigration]
rationale: "OQ-44 fix (product-owner decision of 2026-11-21: each program's meaning of immigration status lives in its own derived item; docs/reviews/audit-dual-entry.md 3.1). CHP+ read Medicaid's status test (ma_meets_status_for_cover_all_coloradans_categories, CO-1174, through ma_meets_citizenship_requirement, CO-509), whose lists differ from 110.1.B: Medicaid applies a five-year rule and, from October 1, 2026, the 42 U.S.C. 1396b(v)(5) limit to qualified non-citizens, and lists trafficking victims and Ukrainian parolees, while 110.1.B.3 states no waiting period and names neither. No existing item states CHP+'s own list. Final verification P2-2 (2026-11-22, OQ-550's CHP+ part): 22 U.S.C. 7105 (D-222) is now fetched and treats a trafficking victim as a refugee for HHS-funded programs; the item accepts one. CHP+ eligibility itself changes for no one, since the Cover All Coloradans exception (110.1.B.5.o, CO-2707) already reaches every CHP+ child and pregnant person."
tests:
  - {id: CO-2706-T1, as_of: "2026-10-01", title: "Citizen (B.1)", given: {immigration_status: us_citizen}, expect: true}
  - {id: CO-2706-T2, as_of: "2026-10-01", title: "LPR who entered in 2024 (B.3.a, no waiting period)", given: {immigration_status: lawful_permanent_resident}, expect: true}
  - {id: CO-2706-T3, as_of: "2026-10-01", title: "Temporary Protected Status (B.5.b)", given: {immigration_status: temporary_protected_status}, expect: true}
  - {id: CO-2706-T4, as_of: "2026-10-01", title: "Afghan special immigrant admitted 2021 (B.4.k)", given: {immigration_status: iraqi_afghan_special_immigrant, us_entry_date: "2021-09-01"}, expect: true}
  - {id: CO-2706-T5, as_of: "2026-10-01", title: "P2-2: trafficking victim who entered in 2020, no military connection: not on 110.1.B's list, accepted as a refugee by 22 U.S.C. 7105(b)(1)(A)", given: {immigration_status: trafficking_victim, us_entry_date: "2020-01-01", has_military_connection: false}, expect: true}
  - {id: CO-2706-T6, as_of: "2026-10-01", title: "Trafficking victim who entered in 1995: B.2", given: {immigration_status: trafficking_victim, us_entry_date: "1995-01-01", has_military_connection: false}, expect: true}
  - {id: CO-2706-T7, as_of: "2026-10-01", title: "Undocumented", given: {immigration_status: undocumented}, expect: false}
  - {id: CO-2706-T8, as_of: "2026-10-01", title: "American Indian born in Canada (B.4.g)", given: {immigration_status: undocumented, is_american_indian_born_in_canada_or_tribal_member: true}, expect: true}
  - {id: CO-2706-T9, as_of: "2026-10-01", title: "Trafficking victim, spouse of an active-duty member (B.4.b)", given: {immigration_status: trafficking_victim, has_military_connection: true}, expect: true}
