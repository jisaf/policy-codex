id: CO-1642
name: "CHP+: requires verification of earned income"
identifier: chp_requires_verification_of_earned_income
kind: derived
type: yes/no
scope: person-month
program: CHP+
meaning: "Whether the person must document earned income for CHP+: wages an electronic data source could not verify or that are questionable; earnings the data reports when the household's figures are not reasonably compatible against the CHP+ standard (for an adult, or a person attesting earnings); and self-employment income only when the ledger is questionable; unless documentation is not reasonably available."
derived: [all, [not, documentation_not_reasonably_available], [any, [all, [">", wages_gross, 0], [any, [not, earned_income_verified_by_electronic_data_source], earned_income_attestation_is_questionable]], [all, [">", ma_electronic_data_source_household_income_pct_fpl, 0], [not, chp_income_is_reasonably_compatible], [any, [">", wages_gross, 0], [">=", age, ma_magi_child_age_limit]]], [all, [">", self_employment_gross_receipts, 0], earned_income_attestation_is_questionable]]]
sources: [S869, S861, S864, S865, S839]
implemented: engine
tags: [verification, chp, income]
accepts_from: [documentation_not_reasonably_available, ma_electronic_data_source_household_income_pct_fpl]
rationale: "Review C-6: CHP+ read the Medicaid earned-income item, which tests compatibility against the Medicaid standard. Vocabulary fix round (governance read.cross_program): accepts_from lists the other programs' items this rule reads on purpose. CHP+ applies the MAGI household, income and verification rules and Medicaid's status and age tests by reference (10 CCR 2505-3 110, 120, 42 CFR 457.380), and excludes a person eligible for Medicaid."
nearest: [CO-1403]
