  - {id: CO-7776-T2, month: "2026-09", as_of: "2026-11-10", title: "C7-02: September 2026 - 12 = 2025-09; the birth (2025-09-10) is not before 2025-09-01: the application month, 2025-03", given: {ma_application_date: "2025-03-01"}, others: {p2: {date_of_birth: "2025-09-10"}}, relationships: [[gave_birth_to, p1, p2]], expect: "2025-03"}
