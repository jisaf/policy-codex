id: CO-1641
name: "CHP+: income is reasonably compatible"
identifier: chp_income_is_reasonably_compatible
kind: derived
type: yes/no
scope: person-month
program: CHP+
meaning: "Whether the attested household income is reasonably compatible with the electronic data source's for CHP+, judged against the CHP+ upper income limit: both at or below it, both above it, or the attested figure at or below it and the data no more than 20% above the attested figure."
derived: [any, [all, ["<=", ma_magi_household_income_pct_fpl, chp_income_limit_pct_upper], ["<=", electronic_data_source_household_income_pct_fpl, chp_income_limit_pct_upper]], [all, [">", ma_magi_household_income_pct_fpl, chp_income_limit_pct_upper], [">", electronic_data_source_household_income_pct_fpl, chp_income_limit_pct_upper]], [all, ["<=", ma_magi_household_income_pct_fpl, chp_income_limit_pct_upper], ["<=", electronic_data_source_household_income_pct_fpl, ["*", ma_magi_household_income_pct_fpl, ["+", 1, ma_reasonable_compatibility_threshold_pct]]]]]
sources: [S869, S864, S838]
implemented: engine
tags: [verification, chp, income]
accepts_from: [ma_magi_household_income_pct_fpl]
open: [OQ-302]
rationale: "Review C-6: a child attesting 140% FPL with data at 180% is not reasonably compatible against the Medicaid standard, but both figures are within the CHP+ standard, so CHP+ accepts the attestation. Vocabulary fix round (governance read.cross_program): accepts_from lists the other programs' items this rule reads on purpose. CHP+ applies the MAGI household, income and verification rules and Medicaid's status and age tests by reference (10 CCR 2505-3 110, 120, 42 CFR 457.380), and excludes a person eligible for Medicaid."
nearest: [CO-1402]
tests:
  - {id: CO-1641-T1, month: "2026-10", as_of: "2026-10-01", given: {ma_magi_household_income_pct_fpl: 1.4, electronic_data_source_household_income_pct_fpl: 1.8}, expect: true}
  - {id: CO-1641-T2, month: "2026-10", as_of: "2026-10-01", given: {ma_magi_household_income_pct_fpl: 2.0, electronic_data_source_household_income_pct_fpl: 2.9}, expect: false}
