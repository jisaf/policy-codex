id: CO-1417
name: "CHP+: pending verification count"
identifier: chp_pending_verification_count
kind: derived
type: whole number
scope: person-month
program: CHP+
role: outcome
meaning: "The number of CHP+ verification elements for this person not yet verified: the pending status elements plus SSN, earned income (against the CHP+ standard), pregnancy, residency, age and household composition."
derived: ["+", ma_pending_status_verification_count, [case, [ma_ssn_verification_is_pending, 1], [else, 0]], [case, [chp_earned_income_verification_is_pending, 1], [else, 0]], [case, [ma_pregnancy_verification_is_pending, 1], [else, 0]], [case, [ma_residency_verification_is_pending, 1], [else, 0]], [case, [ma_age_verification_is_pending, 1], [else, 0]], [case, [ma_household_composition_verification_is_pending, 1], [else, 0]]]
sources: [S869, S868]
implemented: engine
tags: [verification, chp]
rationale: No existing item counts a person's outstanding CHP+ verifications.
tests:
  - {id: CO-1417-T1, month: "2026-10", as_of: "2026-10-01", given: {ma_ssn_verification_is_pending: false, chp_earned_income_verification_is_pending: true, ma_pregnancy_verification_is_pending: false, ma_residency_verification_is_pending: false, ma_age_verification_is_pending: false, ma_household_composition_verification_is_pending: false, ma_pending_status_verification_count: 1}, expect: 2}
  - {id: CO-1417-T2, month: "2026-10", as_of: "2026-10-01", given: {ma_ssn_verification_is_pending: false, chp_earned_income_verification_is_pending: false, ma_pregnancy_verification_is_pending: false, ma_residency_verification_is_pending: false, ma_age_verification_is_pending: false, ma_household_composition_verification_is_pending: false, ma_pending_status_verification_count: 0}, expect: 0}
