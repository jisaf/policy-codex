id: CO-7051
name: "CHP+: is pregnant in the month"
identifier: chp_is_pregnant_in_month
kind: derived
type: yes/no
scope: person-month
program: CHP+
meaning: "Whether the person was a pregnant woman (10 CCR 2505-3 § 110.1.A.2) at some time in the month, for a month from the month of application on, the only months CHP+ can cover (§ 430.1). Never a month before the month the pregnancy began, where pregnancy_start_date is stated. Otherwise: a person pregnant now (is_pregnant) in the determination month and later months and in the months from the application month on; for a pregnancy that has ended (most_recent_pregnancy_end_date, CO-7400: the stated end, or the date of birth of the child of the case she gave birth to), the month it ended and the months from the month it began through it; and, for a person not pregnant now who states the start of a pregnancy but no end, the months from its start cannot be determined."
precision: "Coverage pass 5, C5-03 (2026-11-23). CHP+ coverage is by the month (§ 430.1, \"the first day of the month of application\"; § 430.3, a pregnant woman's enrollment \"effective as of the first of the month of the date of application\"), so a month in which she was pregnant on any day is a pregnant month: the month of the birth is one. A woman who applied while pregnant and delivered before the determination was pregnant in the application month, which opens the § 430.3 enrollment span (chp_is_in_prenatal_coverage_period, CO-2407). For a pregnancy that has ended, the start date is read for the months before its end; not stated, such a month is unknown (decision 4). A month before the application month is never covered by CHP+ (chp_month_is_before_coverage_period, CO-4565; § 430.1), so a pregnancy that has ended is not read in it: such a month is false here, and the CHP+ verification items that read this item (CO-1417, CO-1418) ask nothing for it. CHP+'s own reading of the neutral pregnancy facts, as Medicaid's ma_is_pregnant_in_month (CO-3601) is Medicaid's: CHP+ has no retroactive months, so it reads no month before the application by the dates of a current pregnancy. Coverage pass 6 (2026-11-24): C6-06, a stated pregnancy_start_date governs the months before it whatever is_pregnant says (a pregnancy that began after the application month is not read in it); C6-03, an ended pregnancy is read from most_recent_pregnancy_end_date (CO-7400), so a birth recorded by the child's date of birth and the gave_birth_to relationship ends the pregnancy (CO-814 without pregnancy_end_date: October was not pregnant, ineligible; it is a pregnant month, 4,200 / 1,803.33 = 232.9%, eligible_prenatal, the span through October 2027), the month a pregnancy ended is a pregnant month whether or not its start is stated, and a person not pregnant now who states a start and no end, with no birth recorded, cannot be determined for the months from its start; with no start, no end and no birth she has no ended pregnancy, the reading pregnancy_end_date (CO-089) states."
