  - {id: CO-7051-T2, as_of: "2026-11-10", month: "2026-11", title: "C5-03: the same in November, after the birth: not pregnant", given: {is_pregnant: false, pregnancy_start_date: "2026-02-10", pregnancy_end_date: "2026-10-20", ma_application_date: "2026-10-05"}, expect: false}
  - {id: CO-7051-T3, as_of: "2026-11-10", month: "2026-12", title: "Pregnant now: a later month is a pregnant month", given: {is_pregnant: true, ma_application_date: "2026-11-02"}, expect: true}
