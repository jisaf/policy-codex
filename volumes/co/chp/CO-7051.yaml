rationale: "Coverage pass 5, C5-03 (docs/reviews/coverage5-medicaid-magi-chp.md): every CHP+ prenatal test (chp_income_within_limit CO-704, chp_prenatal_is_eligible CO-706, chp_eligibility_status CO-707, and through CO-706 the § 430.3 span CO-2407) read is_pregnant, the pregnancy on the determination date, in every month, so a woman who applied pregnant on 2026-10-05 and delivered on 2026-10-20, determined 2026-11-10, was never prenatal-eligible and the span never opened (CHP-PG-DELIVERED: ineligible in every month; by hand, October 232.9% is in the 195% to 260% band, eligible_prenatal, the span through October 2027)."
