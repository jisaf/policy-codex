id: CO-706
name: "CHP+: pregnant person is eligible (prenatal)"
identifier: chp_prenatal_is_eligible
kind: derived
type: yes/no
scope: person-month
program: CHP+
meaning: Whether a pregnant person meets every Children's Basic Health Plan prenatal eligibility requirement this batch models under 10 CCR 2505-3-110 and -120 - being pregnant, a Colorado resident, meeting the citizenship/immigration requirement, having household income within the CHP+ prenatal income band, not being eligible for Medicaid, and not having other creditable health coverage.
precision: Parallel to chp_child_is_eligible (CO-705) with is_pregnant in place of ma_is_under_child_age_or_turns_nineteen_this_month and the pregnant-woman income band (chp_income_within_limit already selects the correct band for a pregnant person); the same 120.1.C institution exclusion gap noted on CO-705 applies here (OQ-58).
derived: [all, is_pregnant, ma_meets_residency, ma_meets_citizenship_requirement, chp_income_within_limit, [not, ma_magi_is_fully_eligible], [not, has_other_creditable_health_coverage]]
sources: [S242, S243, S244, S248]
open: [OQ-58, OQ-61]
implemented: engine
tags: [chp, magi, income, immigration]
rationale: "Rewired in the phase 3 coordinator pass to read ma_magi_is_fully_eligible (CO-562, fix round; formerly ma_magi_is_eligible, CO-553, per the phase-3 review's C-10 finding) in place of the supplied placeholder (OQ-61). No existing item states CHP+ prenatal eligibility. chp_eligibility_status (CO-707) needs this as its second branch, distinct from chp_child_is_eligible (CO-705) because a pregnant applicant who is also 19 or older is not a 'child' under 50.3/110.1.A.1 but is still eligible for CHP+ prenatal coverage under 110.1.A.2 and F."
tests:
  - {id: CO-706-T1, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "1998-06-01", is_pregnant: true, state_of_residence: "CO", citizenship_status: citizen, lawful_presence_status: unknown, ma_magi_household_income_pct_fpl: 2.10, ma_magi_is_fully_eligible: false, has_other_creditable_health_coverage: false}, expect: true}
  - {id: CO-706-T2, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "1998-06-01", is_pregnant: true, state_of_residence: "CO", citizenship_status: citizen, lawful_presence_status: unknown, ma_magi_household_income_pct_fpl: 1.80, ma_magi_is_fully_eligible: false, has_other_creditable_health_coverage: false}, expect: false}
