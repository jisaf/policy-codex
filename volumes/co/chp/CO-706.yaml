id: CO-706
name: "CHP+: pregnant person is eligible (prenatal)"
identifier: chp_prenatal_is_eligible
kind: derived
type: yes/no
scope: person-month
program: CHP+
meaning: Whether a pregnant person meets every Children's Basic Health Plan prenatal eligibility requirement this batch models under 10 CCR 2505-3-110 and -120 - being pregnant, a Colorado resident, meeting the citizenship/immigration requirement, having household income within the CHP+ prenatal income band, not being eligible for Medicaid, and not having other creditable health coverage.
precision: "Coverage pass 4, C4-15 (2026-11-23): there is no age test. 10 CCR 2505-3 § 50.19 defines \"Woman\" as \"a female who is 19 years in age or older\", and § 110.1.A reaches a person under 19 as a child (A.1) and a pregnant woman as such (A.2); a pregnant applicant under 19 is tested as a child first (chp_eligibility_status, CO-707, reads chp_child_is_eligible first, and chp_income_within_limit, CO-704, takes the child's band), but this item also reads her as a Prenatal Care Program client, which exempts her from cost sharing (§ 330.4, CO-1990) and gives her the § 430.3 postpartum span (CO-2407). That reading is OQ-1232's. Parallel to chp_child_is_eligible (CO-705) with is_pregnant in place of ma_is_under_child_age_or_turns_nineteen_this_month and the pregnant-woman income band (chp_income_within_limit already selects the correct band for a pregnant person). Status reads chp_meets_status_requirement (CO-2707), CHP+'s own list or the 110.1.B.5.o exception. The 120.1.C exclusion of an inmate of a public institution or a patient in an institution for mental diseases is modeled (is_inmate_of_public_institution, CO-1105; is_patient_in_institution_for_mental_diseases, CO-1104), as on CO-705 (OQ-58). The inmate exclusion reads plain incarceration (CO-1105) and CHP+'s own reentry carve-out (chp_is_in_reentry_period, CO-1749). Final verification pass 3, F3-2: 10 CCR 2505-3 § 120.1.B excludes a person \"eligible to receive assistance under Title XIX\"; the test reads ma_has_full_coverage_category (CO-1176: full MAGI, SSI-related, OAP SISC B, a protected group, a Buy-In program, long-term care, or a needy person under 21), not only full MAGI eligibility (ma_magi_is_fully_eligible), so an SSI child or a Children with Disabilities Buy-In child is not CHP+ eligible. Emergency-only Medicaid is still not read as Title XIX eligibility (CO-562's reasoning), and CO-1176 reads no CHP+ eligibility item, so no cycle."
derived: [all, is_pregnant, is_colorado_resident, chp_meets_status_requirement, chp_income_within_limit, [not, ma_has_full_coverage_category], [not, chp_has_other_health_coverage], [not, [all, is_inmate_of_public_institution, [not, chp_is_in_reentry_period]]], [not, is_patient_in_institution_for_mental_diseases], [not, chp_is_excluded_as_public_agency_employee_family]]
sources: [S242, S243, S244, S248, S606, S643, S653, S1223, S1224, S1225]
open: [OQ-1232, OQ-62]
implemented: engine
tags: [chp, magi, income, immigration]
accepts_from:
  - {from: ma_has_full_coverage_category, class: rule_required, source: S653}
rationale: "Final verification pass 3, F3-2 (2026-11-22): the Title XIX exclusion reads ma_has_full_coverage_category (CO-1176) in place of ma_magi_is_fully_eligible. Rewired in the phase 3 coordinator pass to read ma_magi_is_fully_eligible (CO-562, fix round; formerly ma_magi_is_eligible, CO-553, per the phase-3 review's C-10 finding) in place of the supplied placeholder (OQ-61). No existing item states CHP+ prenatal eligibility. chp_eligibility_status (CO-707) needs this as its second branch, distinct from chp_child_is_eligible (CO-705) because a pregnant applicant who is also 19 or older is not a 'child' under 50.3/110.1.A.1 but is still eligible for CHP+ prenatal coverage under 110.1.A.2 and F. Vocabulary fix round (governance read.cross_program): accepts_from lists the other programs' items this rule reads on purpose. CHP+ applies the MAGI household, income and verification rules and Medicaid's status and age tests by reference (10 CCR 2505-3 110, 120, 42 CFR 457.380), and excludes a person eligible for Medicaid. History moved from the precision note (HCPF review S-14): Vocabulary fix round (docs/reviews/vocabulary-reuse.md, R-14): the inmate exclusion reads plain incarceration (CO-1105) and CHP+'s own reentry carve-out (chp_is_in_reentry_period, CO-1749). Precision history (moved from precision, engineering follow-up pass task 5): (OQ-58, resolved in phase 7). OQ-44 fix (docs/reviews/audit-dual-entry.md 3.1): status reads CHP+'s own chp_meets_status_requirement (CO-2707) in place of Medicaid's ma_meets_status_for_cover_all_coloradans_categories (CO-1174); no CHP+ answer changes, since the 110.1.B.5.o exception reaches every child and pregnant person either way."
