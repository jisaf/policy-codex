id: CO-4793
name: "CHP+: Express Lane status"
identifier: chp_express_lane_status
kind: derived
type: one of
options: [not_applicable, medicaid_express_lane, enrolled, enrolled_pending_citizenship_verification, verification_period_expired, refer_to_single_streamlined_application]
scope: person-month
program: CHP+
role: outcome
meaning: "The CHP+ Express Lane outcome for a child under 10 CCR 2505-3 § 180: not applicable (no forwarded Free/Reduced Lunch, SNAP or Colorado Works referral, or the family did not opt in, § 180.1.A.1, § 180.1.B, § 180.2.A); Medicaid Express Lane (the child meets Medicaid's Express Lane requirements, ma_express_lane_child_meets_requirements, CO-3156, and is enrolled in Medicaid instead, § 120.1.B); enrolled in CHP+ (the child meets the CHP+ requirements on the declared income, chp_express_lane_child_meets_requirements, CO-4792, § 180.1.A.2, § 180.2.A.1); enrolled pending citizenship or identity verification (the same, with that verification outstanding: 90 days of eligibility, § 180.1.A.3, § 180.2.A.2); the 90 days ended with citizenship or identity still unverified (after ma_express_lane_verification_period_end_date, CO-2445); or referred to the Single Streamlined Application (§ 180.1.A.6, § 180.2.A.5)."
precision: "The citizenship and identity verification states and the 90-day end date are Medicaid's (CO-1395 to CO-1399 through ma_citizenship_verification_is_pending and ma_identity_verification_is_pending; CO-2445): 10 CCR 2505-3 § 130.1 applies § 8.100.4.B's verification to CHP+, and the referral and its enrollment date are the same. What follows the end of the 90 days (termination with notice) is processing outside this item, as for ma_express_lane_status (CO-2442)."
derived: [case, [[not, [in, [otherwise, ma_express_lane_source, none], [free_reduced_lunch_application, snap_or_colorado_works_application]]], not_applicable], [[not, ma_express_lane_family_opted_in], not_applicable], [ma_express_lane_child_meets_requirements, medicaid_express_lane], [[all, chp_express_lane_child_meets_requirements, [any, ma_citizenship_verification_is_pending, ma_identity_verification_is_pending], [">", [det_date], ma_express_lane_verification_period_end_date]], verification_period_expired], [[all, chp_express_lane_child_meets_requirements, [any, ma_citizenship_verification_is_pending, ma_identity_verification_is_pending]], enrolled_pending_citizenship_verification], [chp_express_lane_child_meets_requirements, enrolled], [else, refer_to_single_streamlined_application]]
sources: [S3550, S1723]
implemented: engine
tags: [chp, verification]
accepts_from:
  - {from: ma_citizenship_verification_is_pending, class: adopted_method, source: S869}
  - {from: ma_express_lane_child_meets_requirements, class: rule_required, source: S3550}
  - {from: ma_express_lane_family_opted_in, class: primitive, source: S3550}
  - {from: ma_express_lane_source, class: primitive, source: S3550}
  - {from: ma_express_lane_verification_period_end_date, class: adopted_method, source: S3550}
  - {from: ma_identity_verification_is_pending, class: adopted_method, source: S869}
nearest: [CO-2442]
rationale: "Coverage review 2, N-05 (2026-11-22): 10 CCR 2505-3 § 180 (S3550) is CHP+'s own Express Lane; no item cited it, and ma_express_lane_status (CO-2442) answers for Medicaid only, so a referred child with declared income in the CHP+ band was referred to the Single Streamlined Application rather than enrolled in CHP+. A separate CHP+ outcome keeps each program's answer in its own item: CO-2442 still reports the Medicaid referral (§ 8.100.4.J.1.a.vi), and this item reports the CHP+ enrollment."
tests:
  - {id: CO-4793-T1, month: "2026-11", as_of: "2026-11-10", title: "Coverage review 2, N-05 (RV2-ELE): lunch application, opted in, declared 200% - enrolled in CHP+", given: {ma_express_lane_source: free_reduced_lunch_application, ma_express_lane_family_opted_in: true, ma_express_lane_child_meets_requirements: false, chp_express_lane_child_meets_requirements: true, ma_citizenship_verification_is_pending: false, ma_identity_verification_is_pending: false}, expect: enrolled}
  - {id: CO-4793-T2, month: "2026-11", as_of: "2026-11-10", title: "Meets Medicaid's Express Lane requirements", given: {ma_express_lane_source: snap_or_colorado_works_application, ma_express_lane_family_opted_in: true, ma_express_lane_child_meets_requirements: true}, expect: medicaid_express_lane}
  - {id: CO-4793-T3, month: "2026-11", as_of: "2026-11-10", title: "Citizenship verification outstanding within the 90 days", given: {ma_express_lane_source: free_reduced_lunch_application, ma_express_lane_family_opted_in: true, ma_express_lane_child_meets_requirements: false, chp_express_lane_child_meets_requirements: true, ma_citizenship_verification_is_pending: true, ma_express_lane_verification_period_end_date: "2026-12-20"}, expect: enrolled_pending_citizenship_verification}
  - {id: CO-4793-T4, month: "2026-12", as_of: "2026-12-28", title: "Day 98 with citizenship still unverified", given: {ma_express_lane_source: free_reduced_lunch_application, ma_express_lane_family_opted_in: true, ma_express_lane_child_meets_requirements: false, chp_express_lane_child_meets_requirements: true, ma_citizenship_verification_is_pending: true, ma_express_lane_verification_period_end_date: "2026-12-20"}, expect: verification_period_expired}
  - {id: CO-4793-T5, month: "2026-11", as_of: "2026-11-10", title: "Meets neither program's requirements: the Single Streamlined Application", given: {ma_express_lane_source: free_reduced_lunch_application, ma_express_lane_family_opted_in: true, ma_express_lane_child_meets_requirements: false, chp_express_lane_child_meets_requirements: false}, expect: refer_to_single_streamlined_application}
  - {id: CO-4793-T6, month: "2026-11", as_of: "2026-11-10", title: "Automatic lunch enrollment is not forwarded (§ 180.1.B.1)", given: {ma_express_lane_source: free_reduced_lunch_automatic}, expect: not_applicable}
  - {id: CO-4793-T7, month: "2026-11", as_of: "2026-11-10", title: "Family did not opt in", given: {ma_express_lane_source: free_reduced_lunch_application, ma_express_lane_family_opted_in: false}, expect: not_applicable}
