id: CO-2267
name: Resides in an HCBS-SLS setting
identifier: ma_resides_in_sls_setting
kind: supplied
type: yes/no
scope: person
program: Medicaid
meaning: "Whether the person resides in an eligible HCBS-SLS setting: a living arrangement the person owns, rents or leases in the person's own name; the home of the person's family or legal guardian; or a living arrangement of no more than three persons receiving HCBS waiver services unless all are members of the same family (10 CCR 2505-10 § 8.7101.I.2.e)."
supplied_by: The Case Management Agency's assessment of the residence.
sources: [S1513]
tags: [ma, hcbs]
rationale: "OQ-210: the HCBS-SLS setting had no fact."
