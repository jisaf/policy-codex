id: CO-2006
name: "Adult Financial: resides in a psychiatric facility for thirty consecutive days"
identifier: af_resides_in_psychiatric_facility_thirty_consecutive_days
kind: supplied
type: yes/no
scope: person-month
program: AdultFinancial
meaning: "Whether, for the whole of the month, this person is and has been for at least thirty consecutive days a resident of a psychiatric facility - the facility 9 CCR 2503-5 3.532.D.3 adds to the Old Age Pension personal needs allowance list for a client sixty-five or older. False for a month the stay covers only in part."
precision: "Stated apart from resides_in_care_facility_thirty_consecutive_days (CO-1510) because only OAP's list names a psychiatric facility, and only at 65 and older; the AND-SO and AND-CS lists (3.543.D, 3.548.D) do not."
supplied_by: Facility admission record (CBMS living arrangement).
sources: [S1008, S1318]
tags: [cash, oap]
rationale: "No existing fact states a psychiatric facility stay; af_oap_grant (CO-951) needs it for 3.532.D.3 (OQ-352)."
