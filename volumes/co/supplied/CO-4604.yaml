id: CO-4604
name: "Interest left to accumulate in revocable burial funds"
identifier: burial_funds_accrued_interest
kind: supplied
type: money
scope: person
program: All
meaning: "Of the person's revocable burial funds (revocable_burial_trust_value, CO-3855, and revocable_prepaid_burial_contract_value, CO-3856), the interest earned on them and left to accumulate in the burial fund."
precision: "Part of those two facts, not added to them. As of the determination date. If not stated, every program reads it as 0."
supplied_by: "The trust or contract statements."
sources: [S3400]
tags: [resources]
rationale: "Coverage review NM-1: 10 CCR 2505-10 § 8.100.5.M.2.j excludes interest on burial funds left to accumulate, beside the $1,500; the two burial facts include interest, so the interest is stated apart."
nearest: [CO-3855, CO-3856]
