id: CO-4444
name: "Expenses offset against an unearned income receipt"
identifier: unearned_income_offsetting_expenses
kind: supplied
type: money
scope: person-month
program: All
meaning: "The expenses the person paid in the month that are tied to an unearned income receipt stated in the unearned income facts (other_unearned_income_taxable, other_unearned_income_nontaxable, lump_sum_received): for rental property the person does not actively manage, its maintenance, taxes, management fees, mortgage interest and utilities (not the purchase of the property or payments on a loan's principal); for workers' compensation, the medical, legal or related expenses of the claim; for life insurance proceeds, the insured person's last illness and burial not covered by other benefits; for health insurance or personal injury proceeds, the medical care they are to pay for; for veterans' or military education benefits conditional on school attendance, the expenses necessary to attend school."
precision: "Stated for each source only up to the receipt it offsets, so a source whose expenses exceed it adds nothing and no other income is reduced. If not stated, Adult Financial reads this as 0."
supplied_by: "Applicant statement with receipts, the award or settlement papers, or the property's records, as the county establishes them."
sources: [S3212]
tags: [income]
rationale: "Coverage review F-11 (confirmed with the engine on probe PR-RENT): 9 CCR 2503-5 3.520.785.B.9, B.14-16 and B.20 (S3212) count workers' compensation, insurance and lawsuit proceeds, G.I. Bill benefits and rental income only beyond named expenses; the unearned income facts state gross receipts and no fact stated the expenses."
