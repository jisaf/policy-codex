id: CO-078
name: Is required to file a tax return
identifier: is_required_to_file_tax_return
kind: supplied
type: yes/no
scope: person
program: All
meaning: Whether the person is expected to be required to file a federal tax return under 26 U.S.C. 6012(a)(1) for the taxable year in which the Medicaid eligibility determination or renewal is being made.
precision: "Determined by the filing thresholds of 26 U.S.C. 6012(a)(1) (income, filing status, age, and dependency), which this volume treats as an external fact rather than a derived tax-law computation. Fix round: the dependent/child earned- and unearned-income filing-threshold dollar figures are now carried as their own versioned parameters, ma_dependent_tax_filing_threshold_earned (CO-1013) and ma_dependent_tax_filing_threshold_unearned (CO-1014), sourced to the HCPF MAGI Medicaid income guidelines chart (D-68/D-70, S565/S567) rather than left unstated - the chart states them directly ('Tax Filing Thresholds for a Tax Dependent or Child'). This item is not rewired to derive from them: doing so would need a numeric comparison against the dependent's own earned and unearned income (which this chapter does not currently isolate as separate per-person facts, only as combined MAGI income) and the 8.100.4.C.1.f.1 Social Security/Railroad-benefit exclusion from that comparison (see K-9, phase-3 review) - a larger restructuring than this fix round's scope, and one that risks changing every case that currently supplies this fact directly. Left as a supplied yes/no, with the new parameters available for that future derivation; the gap is recorded at OQ-171."
supplied_by: Applicant statement (CBMS/PEAK), cross-checked against IRS filing-threshold guidance by the eligibility worker.
sources: []
open: [OQ-171]
tags: [ma, magi, household, income]
rationale: "No existing item carries this fact. 42 CFR 435.603(d)(2) and 10 CCR 2505-10 8.100.4.C.1.f exclude a child's or tax dependent's income from household income unless the child or dependent is required to file; ma_magi_household_income (CO-503) reads this fact directly rather than re-deriving the IRS filing thresholds, which are out of this volume's scope."
