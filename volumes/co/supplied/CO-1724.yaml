id: CO-1724
name: "Five-year bar exempt category not carried by citizenship status"
identifier: federal_five_year_bar_exempt_category
kind: supplied
type: one of
options: [none, refugee_or_asylee_adjusted_to_lpr, deportation_withheld, amerasian_immigrant]
scope: person
program: All
meaning: "Which of the 8 U.S.C. 1613(b)(1) exceptions to the five-year bar that citizenship_status (CO-002) does not already carry applies to this qualified non-citizen, or none. refugee_or_asylee_adjusted_to_lpr: a lawful permanent resident who was admitted as a refugee or granted asylum (1613(b)(1)(A)-(B)); deportation_withheld: deportation is being withheld under INA 243(h) or 241(b)(3) (1613(b)(1)(C)); amerasian_immigrant: admitted as an Amerasian immigrant (1613(b)(1)(E))."
precision: "A person who still holds refugee, asylee or Cuban and Haitian entrant status is recorded in citizenship_status instead. The veteran and active-duty exception is has_military_connection (CO-005); citizens of the freely associated states are citizenship_status compact_of_free_association_migrant."
supplied_by: "SAVE response, immigration documents (Form I-551 class of admission, I-94, immigration judge order)."
sources: [S1150]
tags: [immigration]
rationale: "Vocabulary fix round (docs/reviews/vocabulary-reuse.md, R-4): Colorado Works read SNAP's waiting-period exemption (under 18, military, born before 1931) for the 8 U.S.C. 1613(b) categories, and Aid to the Needy Disabled read none. citizenship_status lacks the withholding and Amerasian categories and cannot say that a lawful permanent resident was admitted as a refugee; widening its closed option list would change what every program's status rule must handle, so this federal fact carries them, as ma_five_year_bar_exempt_category (CO-1170) does for Medicaid's own list."
