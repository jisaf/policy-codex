id: CO-2471
name: "Medicaid: earned income excluded under the SSI rules"
identifier: ma_ssi_excluded_earned_income
kind: supplied
type: money
scope: person-month
program: Medicaid
meaning: The part of the person's gross earned income for the month that 20 CFR 416.1112 excludes for the SSI-related Medical Assistance groups (for example the student earned income exclusion of 416.1112(c)(3)). If not stated, Medicaid reads it as 0.
supplied_by: Income verification and the eligibility site's application of 20 CFR 416.1112.
sources: [S308, S309]
tags: [ma, non_magi, income]
rationale: OQ-390 (resolved for Medicaid in the HCPF fix round).
