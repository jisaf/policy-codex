id: CO-036
name: Utility allowance amount
identifier: utility_allowance_amount
kind: supplied
type: money
scope: person
program: SNAP
meaning: The CDHS standard utility allowance (heating/cooling, basic, or telephone-only) that applies to the person's unit, stated on the head of household.
supplied_by: CBMS, applying the CDHS standard utility allowance table for the utility expense the unit incurs.
sources: []
tags: [income, state_election]
rationale: "A fact the case must supply; no existing item in the Colorado volume carries it (the volume began empty in phase 1, and the mwr volume's facts are not shared across volumes). It is reserved for the SNAP income, deduction, work registration and ABAWD rules of later batches, which read it by this identifier."
