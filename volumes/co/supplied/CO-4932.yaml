id: CO-4932
name: "Excluded government payments held"
identifier: excluded_government_payments_held_value
kind: supplied
type: money
scope: person
program: All
meaning: "The part of the person's liquid resources (liquid_resources_value, CO-3390) on the determination date that is money the person received as one of these government payments and still holds: payments a federal statute excludes from income and resources and that are stated, in the month received, as receipts of kind federally_excluded_payment (receipts, CO-5000) - major disaster and emergency assistance, and government payments designated for restoring a home damaged in a disaster that the household must use as intended; Uniform Relocation Act reimbursements; Civil Liberties Act payments to persons of Japanese ancestry and to Aleuts; Agent Orange Settlement Fund payments; Radiation Exposure Compensation Trust Fund payments; payments to victims of Nazi persecution; allowances to children of Vietnam veterans born with spina bifida; youth incentive and youth employment program payments under the Youth Employment and Demonstration Projects Act - and federal energy assistance (receipts of kind energy_assistance_federal), crime victim compensation (kind crime_victim_compensation), and HUD rental refunds under the Underwood v. Harris settlements held in the month received or the following month only."
precision: "Part of liquid_resources_value, not added to it; the person's own holding or share of a jointly held one. Each payment is one the person's receipt facts state in the month it was received; this fact states what is left of it on the determination date. If not stated, SNAP reads it as 0 (nothing held is excluded); no other program reads it yet. Federal tax refunds and the EITC (4.410.J.12, J.17) have their own facts (federal_tax_refunds_held_value, snap_eitc_held_while_participating_value) and are not part of this one. WIC and child nutrition benefits (J.1, J.5, J.10) are in-kind and never held as money; mandatory military pay deductions for education (J.8) are not money the person holds."
supplied_by: "Applicant statement; award letters and bank records showing the deposit."
sources: [S3650]
tags: [resources]
rationale: "Coverage pass 3 C3-5: 10 CCR 2506-1 4.410.J (S3650) excludes these government payments as a resource, but liquid_resources_value (CO-3390) holds them and snap_countable_liquid_resources (CO-4176) subtracted only tax refunds, the EITC, education accounts, inaccessible funds, prorated income and ABLE accounts, so a household holding disaster or federal-statute money was counted over the limit. The receipt facts (federally_excluded_payments_received, energy_assistance_received, crime_victim_compensation_received) say what was received in a month, not what is still held on the determination date, so the held amount is its own part of liquid_resources_value, in the pattern of federal_tax_refunds_held_value (CO-4172)."
