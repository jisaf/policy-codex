id: CO-3844
name: "Has agreed to treatment for addiction"
identifier: has_agreed_to_addiction_treatment
kind: supplied
type: yes/no
scope: person
program: All
meaning: "The person has agreed to treatment for addiction to alcohol or a controlled substance and to a defined treatment program with an assessment and treatment agency licensed by the State."
precision: "Read by Adult Financial only for a client whose AND-SO certification identifies substance abuse; asked then."
supplied_by: "Applicant statement and the treatment agency's record."
sources: [S2616, S2617]
tags: [cash, and]
rationale: "Final cash review FC-7: 9 CCR 2503-5 3.541.3 (S2616) and C.R.S. 26-2-111(4)(e)-(f) (S2617) limit AND-SO for a client whose primary diagnosis is alcoholism or controlled substance addiction to twelve cumulative months in a lifetime, on condition of treatment and of not testing positive twice in any three-month period, and nothing in the volume stated it. The agreement is a fact about the person, program-neutral."
