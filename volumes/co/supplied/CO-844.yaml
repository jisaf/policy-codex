id: CO-844
name: Marital status
identifier: marital_status
kind: supplied
type: one of
options: [single, married, widowed, legally_separated, other]
scope: person
program: All
meaning: "The person's legal marital status: single (never married, or divorced), married, widowed, legally separated (married, living apart under a decree of legal separation), or other: in a civil union, \"a legally binding partnership between two individuals without the legal recognition of these individuals as spouses\" (10 CCR 2506-1 4.000.1, S5320), with a person who is not a person of the case (a partner who is a person of the case is the civil_union_partner edge). Where the spouse is a person of the case the marriage is the spouse edge; married here states a spouse who is not a person of the case, and is_married (CO-930) reads both. npm run check warns when a person with a spouse edge is stated single or widowed."
precision: "A program whose rule needs the spouse's own facts cannot determine it from married alone: Medicaid's long-term care spousal rules (ma_ltc_couple, CO-643; coverage pass 6, non-MAGI F6-7) need the spouse stated as a person of the case. Coverage pass 7, non-MAGI F7-4 (docs/reviews/coverage7-medicaid-nonmagi.md): legally_separated is its own option (it was an example of other). A legally separated person is still married: Medicaid's long-term care spousal rules read it as married (ma_ltc_couple, CO-643; 10 CCR 2505-10 § 8.100.7.L, S3419: \"There are no exceptions for legal separation\"), and the Children's Extensive Support waiver's \"unmarried\" (ma_hcbs_meets_age_criteria, CO-1164) does not include it. Every other reader compares with single, married or widowed and reads legally_separated as it read other before (is_married, CO-930, reads married only); no stored household or test stated other for a legal separation. Coverage verification 7, V7-10 (docs/reviews/verify-coverage7-fixes.md): once legally_separated was split out, other had no stated meaning; it is a civil union, the one legal relationship status the four options do not name (the volume's relationship roles already state one between persons of the case, civil_union_partner, which LEAP reads, 9 CCR 2503-7 3.751.2.D.3). Every reader compares with single, married, widowed or legally_separated and reads other as none of them, as before. Adult Financial's \"Marriage\" includes a civil union (9 CCR 2503-5 3.510, S5321): af_is_married (CO-7308) reads other as married, and af_spouses_in_month (CO-7603) a civil_union_partner edge as a spouse of the case (KL-CASH-3, closed 2026-11-24, docs/reviews/known-limits.md); every other program's reader is unchanged. The three stored households that stated other with no civil union in their story (CO-07, CO-71, CO-72: a 62-, a 72- and a 70-year-old) state single, which every reader reads as it read other for them."
supplied_by: "The applicant's statement on the application, or the case record; where a program's verification rule requires it (Adult Financial: verified when questionable), the county worker's verification (heavier-definitions audit H-15: the fact is the person's circumstance as stated; documents belong to the *_verification_document_received facts and the verification items, which ask for them only where a program's rule requires it)."
sources: [S411, S3419, S5320, S5321]
rationale: "No existing fact in this volume's interface carries marital status; cw_minor_parent_living_arrangement_met (CO-906) needs it. Vocabulary fix round (docs/reviews/vocabulary-reuse.md, C-1): the meaning states the status only (it had described the Colorado Works minor-parent rule), and widowed is an option, replacing is_widow_or_widower (CO-1111, retired)."
