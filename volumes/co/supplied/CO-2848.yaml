id: CO-2848
name: "Migrant child"
identifier: is_migrant_child
kind: supplied
type: yes/no
scope: person
program: All
meaning: "The child has been identified, at any time in the Summer EBT period of eligibility up to the determination date (7 CFR 292.6, S790, \"at any time during the period of eligibility\"), as meeting the definition of migrant in section 1309 of the Elementary and Secondary Education Act (20 U.S.C. 6399) by the State or local Migrant Education Program coordinator or the local educational liaison (7 CFR 245.2, S1952). If not stated, SUN Bucks reads this as false."
supplied_by: "The Migrant Education Program coordinator's or liaison's identification."
sources: [S790, S792, S1952]
tags: [sebt]
rationale: "Dual-entry audit 3.27: sebt_other_categorical_basis (CO-1296) bundled this ground with homelessness and foster care, which other facts state; it is now derived, and this is the one ground no other fact states."
