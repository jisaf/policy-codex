id: CO-4402
name: "Temporary absence is outside the United States"
identifier: temporary_absence_is_outside_united_states
kind: supplied
type: yes/no
scope: person
program: All
meaning: "The person's temporary absence from Colorado that began on temporarily_out_of_state_start_date (CO-3806) is a stay outside the United States."
precision: "Stated with temporarily_out_of_state_start_date. If not stated, Adult Financial reads this as false (the absence is in another State)."
supplied_by: "Applicant statement, as the county establishes it."
sources: [S3201]
tags: [cash, household]
rationale: "Coverage review F-1: 9 CCR 2503-5 3.520.64.E.1 (S3201) presumes non-residence after thirty consecutive days out of the country, sooner than the ninety days out of the State of E.2; no fact stated where the person went."
nearest: [CO-3806]
