id: CO-3856
name: "Paid-up value of revocable prepaid burial contracts"
identifier: revocable_prepaid_burial_contract_value
kind: supplied
type: money
scope: person
program: All
meaning: "The paid-up amount (not the face value) of the revocable prepaid funeral or burial contracts the person holds, with interest."
precision: "If not stated, Adult Financial reads it as 0, and so does SNAP, which counts the paid-up amount above $1,500 (snap_countable_nonliquid_resources, CO-074; final verification pass 2 N-8)."
supplied_by: "The contracts."
sources: [S2619]
tags: [cash, resources]
rationale: "Final cash review FC-8: af_person_countable_resources (CO-3400) counted the whole cash surrender value of life insurance over $1,500 face value, though 9 CCR 2503-5 3.520.75.E-F (S2618) exempt it for an OAP client whose policies are more than forty-eight months old, and it never counted revocable burial funds or excess burial spaces, which 3.520.72.B.8-9 (S2619) count. 3.520.72.B.8 and 3.520.77.H.2 (S2619) count the paid-up amount of a revocable prepaid burial contract over $1,500; no fact stated it."
