id: CO-3845
name: "Was terminated from addiction treatment"
identifier: was_terminated_from_addiction_treatment
kind: supplied
type: yes/no
scope: person
program: All
meaning: "The licensed treatment agency has terminated the person from addiction treatment because the person failed to comply with it."
precision: "If not stated, Adult Financial reads this as false."
supplied_by: "The treatment agency's notice to the county department."
sources: [S2616]
tags: [cash, and]
rationale: "Final cash review FC-7: 9 CCR 2503-5 3.541.3 (S2616) and C.R.S. 26-2-111(4)(e)-(f) (S2617) limit AND-SO for a client whose primary diagnosis is alcoholism or controlled substance addiction to twelve cumulative months in a lifetime, on condition of treatment and of not testing positive twice in any three-month period, and nothing in the volume stated it. Termination from treatment is a fact about the person, program-neutral."
