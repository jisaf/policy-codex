id: CO-4453
name: "Early childhood research study payments received"
identifier: early_childhood_research_study_payments_received
kind: supplied
type: money
scope: person-month
program: All
meaning: "Money the person received in the month for taking part in a grant-funded research study on early childhood development."
precision: "Part of the person's gross unearned income for the month as the unearned income facts state it (other_unearned_income_taxable or other_unearned_income_nontaxable, or the fact that names the source), not added to it. If not stated, every program reads it as 0."
supplied_by: "Applicant statement, the study's payment record."
sources: [S3257]
tags: [income]
rationale: "Coverage round (docs/reviews/coverage-cccap.md, F-25): 8 CCR 1403-1 3.111.J.29 (S3257) excludes \"Income received for participation in grant funded research studies on early childhood development\". No fact stated it, so a case stated it in other unearned income and CCCAP counted it."
