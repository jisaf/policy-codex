id: CO-050
name: Is Indian or urban Indian
identifier: is_indian_or_urban_indian
kind: supplied
type: yes/no
scope: person
program: SNAP
meaning: The person is a member of a federally recognized tribe, an Alaska Native, or an urban Indian eligible for the ABAWD exemption for Indians and urban Indians.
supplied_by: Tribal enrollment verification, applicant statement.
sources: []
tags: [abawd]
rationale: "A fact the case must supply; no existing item in the Colorado volume carries it (the volume began empty in phase 1, and the mwr volume's facts are not shared across volumes). It is reserved for the SNAP income, deduction, work registration and ABAWD rules of later batches, which read it by this identifier."
