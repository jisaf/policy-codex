id: CO-016
name: VA finding of aid and attendance, housebound, or a disabled survivor
identifier: has_va_aid_attendance_housebound_or_survivor_finding
kind: supplied
type: yes/no
scope: person
program: All
meaning: "The VA has found that the person is a veteran in need of regular aid and attendance or permanently housebound; or a veteran's surviving spouse in need of regular aid and attendance or permanently housebound; or a veteran's surviving child permanently incapable of self-support; or a veteran's surviving spouse or child entitled to compensation for a service-connected death or a pension for a non-service-connected death who has a disability considered permanent under section 221(i) of the Social Security Act (7 CFR 271.2, \"Elderly or disabled member\" (7)-(9), S1951). A VA disability rating is va_disability_rating_type."
supplied_by: VA award letter.
sources: [S6, S1951]
tags: [disability]
rationale: "A fact the case must supply; it is read by SNAP: is a disabled member. Same-word audit SW-14 and dual-entry 3.13: the VA rating prong moved to va_disability_rating_type (CO-2823), so this fact states only the VA findings 271.2 (7)-(9) name; the identifier was receives_va_disability_benefits."
