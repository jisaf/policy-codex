rationale: "OQ-99: the income-trust ceiling of § 8.100.7.G.6.a.i.a) depends on the region of the county in which the person resides; no county fact exists. CCCAP's county residence (OQ-159, OQ-393, 8 CCR 1403-1 3.111.A) reads the same fact; the CCCAP sweep's text-valued duplicate CO-2105 was retired in its favour at merge."
