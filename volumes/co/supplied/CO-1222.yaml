id: CO-1222
name: Burial plot cost excluded from the burial cost limit
identifier: burial_plot_cost_excluded_from_limit
kind: supplied
type: money
scope: person
program: AdultFinancial
meaning: The part of burial_services_total_cost that is the cost of a burial plot excluded from the $2,500 maximum cost limit because the decedent had a prepaid plot valued at $2,000 or less at purchase or the plot was purchased by someone else and donated, per 9 CCR 2503-5 3.570.43.A.4.a-b; zero otherwise.
supplied_by: County department review of the plot purchase or donation record.
sources: [S719]
tags: [cash]
rationale: No existing fact carries the plot exclusion; af_burial_eligible (CO-1231) needs it to apply the cost limit.
