id: CO-071
name: Adequate child care is available
identifier: adequate_child_care_available
kind: supplied
type: yes/no
scope: person
program: SNAP
meaning: Adequate child care is available to enable the person to attend class and satisfy the student employment or work-study requirement, for a dependent household member age 6 through 11.
supplied_by: County eligibility technician's determination (10 CCR 2506-1 4.306.1.E).
sources: []
tags: [student]
rationale: The 6-to-12 dependent-care student exemption (7 U.S.C. 2015(e)(5)(B); 10 CCR 2506-1 4.306.1.E, S133, S135) applies only when adequate child care is not available, a county determination this volume has no other fact for.
