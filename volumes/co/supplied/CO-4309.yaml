id: CO-4309
name: "Energy assistance from a nonprofit or energy supplier received"
identifier: energy_assistance_from_nonprofit_or_supplier_received
kind: supplied
type: money
scope: person-month
program: All
meaning: "The part of energy_assistance_received (CO-3364) for the month that came from a nonprofit organization or an energy supplier, not under federal law."
precision: "Part of energy_assistance_received, not added to it. If not stated, SNAP reads it as 0."
supplied_by: "Applicant statement; the organization's or supplier's notice."
sources: [S3104, S3109]
tags: [snap, income]
rationale: "Coverage review snap-financial CF-1: SNAP excludes energy assistance under federal law (4.405.2.A.7) but counts other energy cash (4.405.H.7, S3104), except a nonprofit's need-based donation within the $300 quarterly charitable exclusion (A.10, S3109); energy_assistance_received states both."
