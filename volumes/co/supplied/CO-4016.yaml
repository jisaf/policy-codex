id: CO-4016
name: "AmeriCorps payments received"
identifier: americorps_payments_received
kind: supplied
type: money
scope: person-month
program: All
meaning: "Cash payments the person received in the month as an AmeriCorps State and National or AmeriCorps National Civilian Community Corps participant, or paid on the person's behalf as one (living, food, shelter and clothing allowances included)."
precision: "Part of the person's gross unearned income for the month as the unearned income facts state it (other_unearned_income_taxable or other_unearned_income_nontaxable), not added to it, and not part of federally_excluded_payments_received. If not stated, every program reads it as 0."
supplied_by: "Application (income and expenses), the program's payment statement."
sources: [S2803]
implemented: engine
tags: [income]
rationale: "Final cash review 2, N-4: 20 CFR 416.1124(c)(23), which 9 CCR 2503-5 3.520.786.K incorporates, excludes AmeriCorps State and National and NCCC payments (S2803); federally_excluded_payments_received (CO-3366) names Domestic Volunteer Service Act payments, not AmeriCorps State and National, so no fact stated them."
