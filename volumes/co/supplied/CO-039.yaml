id: CO-039
name: "SNAP: is serving an intentional program violation disqualification"
identifier: snap_is_serving_ipv_disqualification
kind: supplied
type: yes/no
scope: person
program: SNAP
meaning: The person is currently serving a disqualification period for an intentional Program violation under 7 CFR 273.16, including a disqualification imposed on a conviction for fraud in a federal, state or local court (10 CCR 2506-1 4.803.3; 4.206.C.3.a.1 names a member "serving a disqualification for an IPV or a fraud conviction", S3478; coverage pass 2 N2-P2-5).
supplied_by: Administrative disqualification hearing or waiver record.
sources: [S3478]
rationale: "A fact the case must supply; no existing item in the Colorado volume carries it (the volume began empty in phase 1, and the mwr volume's facts are not shared across volumes). It is read by SNAP: is an ineligible member. Vocabulary fix round (R-6): renamed from is_disqualified_for_intentional_program_violation; read only by SNAP. Colorado Works reads its own cw_is_serving_ipv_disqualification (CO-1730)."
