id: CO-4307
name: "Child support received transferred to the child support agency"
identifier: child_support_received_transferred_to_child_support_agency
kind: supplied
type: money
scope: person-month
program: All
meaning: "The part of child_support_received for the month that the person must turn over to the child support enforcement (Title IV-D) agency to keep the person's Colorado Works (Title IV-A) eligibility."
precision: "Part of child_support_received, not added to it. If not stated, SNAP reads it as 0."
supplied_by: "Colorado Works case record; the child support assignment."
sources: [S3102]
tags: [snap, income]
rationale: "Coverage review snap-financial CF-1: 4.405.D.2 (S3102) excludes child support a Title IV-A participant must transfer to the IV-D agency; no fact stated it."
