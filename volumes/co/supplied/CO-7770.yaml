id: CO-7770
name: First qualified status date
identifier: first_qualified_status_date
kind: supplied
type: calendar date
scope: person
program: All
meaning: "The date the person first obtained a qualified non-citizen status (8 U.S.C. 1641(b)) or entered the United States in one, whatever status the person holds now: for a person who held another qualified status before the one held now (a parolee of a year or more, a battered non-citizen or a conditional entrant who later became a lawful permanent resident), the date of that earlier status; for a person whose only qualified status is the one held now, the same date as qualified_status_date (CO-003). A later change of qualified status does not change it."
precision: "Coverage pass 7, C7-04 (2026-11-24). 8 U.S.C. 1613(a) (S176) bars a qualified alien 'for a period of 5 years beginning on the date of the alien's entry into the United States with a status within the meaning of the term \"qualified alien\"', and 10 CCR 2506-1 4.305.B.3.a (S12): 'The five (5) year waiting period begins on the date the non-citizen obtains status as a qualified non-citizen or enters the U.S. in a qualifying status': the five years run from the first qualified status, and a later adjustment does not restart them. qualified_status_date dates the status held now, which Medicaid's month-by-month status reads (CO-7652); this fact dates the first. Required where read (decision 4 of 2026-11-23): Medicaid's five-year count (ma_has_held_qualified_status_five_years_in_month, CO-7550) reads it for a qualified non-citizen inside five years of the status held now, other than a lawful permanent resident admitted directly (status_before_lpr_adjustment none), whose first qualified status is the one held now. SNAP's and the cash programs' readers of the five years (has_held_qualified_status_five_years, CO-508) do not read it yet: docs/reviews/known-limits.md lists them."
supplied_by: "SAVE response (class of admission and its date, the earlier status's dates), Form I-94 (the parole), I-551 and the adjustment record."
sources: [S176, S12, S1900]
tags: [immigration]
rationale: "Coverage pass 7, C7-04 (docs/reviews/coverage7-medicaid-magi-chp.md): the five years were counted from qualified_status_date, the date of the status held now, so a parolee or battered non-citizen who later became a lawful permanent resident restarted them at the adjustment (LPR-EX-PAROLEE: paroled 2019-05-01, a qualified alien from that day under 1641(b)(4); LPR 2023-03-01; wages $1,000: November 2026 emergency_only, though the five years ended 2024-04-30 and she is eligible as an adult at 75.2%). The case had no fact for the first qualified status, so the answer could not be stated correctly. A neutral date of the person, the same for every program."
