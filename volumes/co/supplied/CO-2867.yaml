id: CO-2867
name: Surviving spouse of a veteran
identifier: is_surviving_spouse_of_veteran
kind: supplied
type: yes/no
scope: person
program: All
meaning: "The person is the surviving spouse of a deceased veteran or person on active duty described in 8 U.S.C. 1612(b)(2)(C) and 1613(b)(2) who has not remarried. If not stated, read as false."
supplied_by: The application; a death certificate and military record.
sources: [S1150]
tags: [immigration]
rationale: "Dual-entry audit 1.11: the deceased veteran is not a person of the case, so the surviving spouse's connection is the one part of has_military_connection the edges cannot show."
