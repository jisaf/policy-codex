id: CO-4367
name: Refugee resettlement payments received
identifier: refugee_resettlement_payments_received
kind: supplied
type: money
scope: person-month
program: All
meaning: "Money the person received in the month as refugee resettlement funds or reception and placement money (from a resettlement agency), or as the Interim Cash Payment of the Colorado Refugee Services Program. Not Refugee Cash Assistance."
precision: "Part of the person's gross unearned income for the month as the unearned income facts state it (other_unearned_income_nontaxable), not added to it. If not stated, Colorado Works reads it as 0."
supplied_by: Resettlement agency or Colorado Refugee Services Program statement.
sources: [S3163]
tags: [income, immigration]
rationale: "Coverage review CW-14 (P1): 9 CCR 2503-6 3.605.4.B.28-29 (S3163) exempt these payments, but no fact stated them (federally_excluded_payments_received, CO-3366, lists federal-statute exclusions), so they were counted when stated in the unearned income facts. Program-neutral; cw_unearned_income_deductions (CO-4369) subtracts it."
