id: CO-4306
name: "Overpayment recoupment for an intentional violation withheld"
identifier: overpayment_recoupment_for_intentional_violation_withheld
kind: supplied
type: money
scope: person-month
program: All
meaning: "The part of overpayment_recoupment_withheld (CO-4305) for the month that a federal, state or local means-tested program (Colorado Works or the Old Age Pension, for example) withholds to recover an overpayment that resulted from the person's or household's intentional failure to comply with that program's requirements."
precision: "Part of overpayment_recoupment_withheld, not added to it. If not stated, SNAP reads it as 0."
supplied_by: "The program's overpayment or intentional program violation notice."
sources: [S3102]
tags: [snap, income]
rationale: "Coverage review snap-financial CF-1: 4.405.D.1 (S3102) does not exclude a means-tested program's recoupment of an overpayment caused by an intentional failure to comply; the gross income is then counted."
