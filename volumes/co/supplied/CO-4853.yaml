id: CO-4853
name: "AmeriCorps service hours"
identifier: americorps_service_hours
kind: supplied
type: hours
scope: person-month
program: All
meaning: "The hours the person served in the month as an AmeriCorps State and National or AmeriCorps National Civilian Community Corps participant, the service for which americorps_payments_received (CO-4016) was paid, as the program's service record shows them."
precision: "If not stated, a program that compares the payments with the hours served cannot make the comparison and counts the payments as its rule otherwise does; LEAP reads it so (leap_excluded_unearned_income, CO-4511)."
supplied_by: "The AmeriCorps program's service hours record; applicant statement."
sources: [S3595]
tags: [income]
nearest: [CO-4016, CO-1916, CO-1915]
rationale: "Coverage review 2 N-5 (docs/reviews/coverage2-leap-sunbucks.md): 9 CCR 2503-7 3.752.23.F (S3595) excludes AmeriCorps payments \"when the value of all such payments adjusted to reflect the number of hours such volunteers are serving is not equivalent to or greater than the minimum wage\". The volume stated the payments (CO-4016) but not the hours served; community_service_hours (CO-1916) is unpaid service and unpaid_or_in_kind_work_hours (CO-1915) unpaid or in-kind work, neither a paid AmeriCorps term."
