id: CO-2372
name: "Colorado Works: application date"
identifier: cw_application_date
kind: supplied
type: calendar date
scope: case
program: ColoradoWorks
meaning: "The date the client's Colorado Works application was received by the county department (9 CCR 2503-6 3.602.1), from which the forty-five-day processing standard and the good-cause verification period run."
precision: "One value for the case: the assistance unit's one application. On a combined PEAK application it is usually the same date as the other programs' application dates."
supplied_by: "CBMS application record."
sources: [S1629]
tags: [cash, tanf, verification]
rationale: "OQ-316: the good-cause period of 3.602.1.I.2 (S1629) runs from the date of application; no Colorado Works application date was stated (snap_application_date, ma_application_date and leap_application_date are the other programs'). Dual-entry audit 1.13-1.17 and 5.9 (OQ-541, same-word SW-9): a fact about the application or the home has one value per case (convention rule 18), stated once in the case's case_facts instead of on each member."
