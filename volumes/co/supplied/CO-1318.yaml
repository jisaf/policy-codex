id: CO-1318
name: Unearned income verified by electronic data source
identifier: unearned_income_verified_by_electronic_data_source
kind: supplied
type: yes/no
scope: person
program: All
meaning: "Whether an electronic data source has verified the person's unearned income for this application: an interface match the agency treats as verification (SSA benefit data through SDX or BENDEX, unemployment insurance data, public assistance or child support system records), so no document is needed for that element."
supplied_by: CBMS interface results (IEVS, SSA/SOLQ/SVES, SAVE/VLP, DMV, FDSH, The Work Number, Asset Verification Program) as recorded in the case.
sources: [S820, S836, S875, S880]
tags: [verification, income]
rationale: No existing item in the volume carries this fact; the phase-9 verification chapter (design amended 2026-11-21) needs it, and it is program-neutral so every program's verification rules read the same value.
