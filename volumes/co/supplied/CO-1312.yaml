id: CO-1312
name: SSN exception applies
identifier: ssn_exception_applies
kind: supplied
type: yes/no
scope: person
program: All
meaning: "Whether the person is excepted from furnishing a Social Security number: not eligible to receive one, eligible only for a non-work SSN, or refusing one on a well-established religious objection (42 CFR 435.910(h), 10 CCR 2505-10 8.100.3.I.1.b)."
supplied_by: Applicant statement and worker determination recorded in CBMS.
sources: [S843, S860]
tags: [verification]
rationale: No existing item in the volume carries this fact; the phase-9 verification chapter (design amended 2026-11-21) needs it, and it is program-neutral so every program's verification rules read the same value.
