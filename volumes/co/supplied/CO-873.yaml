id: CO-873
name: Open Protective Services child care referral
identifier: is_protective_services_child_care_case
kind: supplied
type: yes/no
scope: person
program: CCCAP
meaning: Whether this household has an open child welfare case with the child(ren) placed by the county in foster home care, kinship foster home care, or non-certified kinship care, and a Protective Services Child Care Referral Form on file, per 8 CCR 1403-1 3.118.A, E.
supplied_by: County Child Welfare worker's Protective Services Child Care Referral Form.
sources: [S488]
tags: [household]
rationale: "3.118-3.119 describe a distinct Protective Services Child Care eligibility track (household of one, no low-income eligible activity or residency-verification requirement) that this volume has no fact to identify; cccap_eligibility_status (CO-989) needs it to branch to eligible_protective_services ahead of the low-income determination."
