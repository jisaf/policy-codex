id: CO-2863
name: "Surviving spouse of a VA pensioner"
identifier: is_surviving_spouse_of_va_pensioner
kind: supplied
type: yes/no
scope: person
program: All
meaning: "Whether the person is the surviving spouse of a person who received a non-service-connected disability pension from the U.S. Department of Veterans Affairs. If not stated, Medicaid reads this as false."
supplied_by: VA award letter.
sources: [S1737, S1231]
tags: [ma, ltc]
rationale: "Dual-entry audit 2.11: ma_qualifies_for_veterans_personal_needs_allowance (CO-1986) restated whether the person has a spouse or dependent child, which the relationship edges state, beside the VA pension; the pension is the fact of its own."
