id: CO-4454
name: "In-kind compensation for employment"
identifier: in_kind_employment_compensation_value
kind: supplied
type: money
scope: person-month
program: All
meaning: "The cost or fair market value of the goods, services or housing (meals, clothing, public or employer housing, produce and the like) the person received in the month from an employer as compensation for employment, in place of money. Cash pay is wages_gross (CO-023), not this fact."
precision: "Not part of the wages, self-employment or unearned income facts. If not stated, every program reads it as 0."
supplied_by: "Applicant or employer statement, with the cost or fair market value as the county establishes it."
sources: [S3255]
tags: [income]
rationale: "Coverage round (docs/reviews/coverage-cccap.md, F-08): 8 CCR 1403-1 3.111.I.4 (S3255) counts \"An in-kind benefit ... received ... as compensation for employment, which is not in the form of money\" at \"the cost or fair market value\". wages_gross states cash wages and no fact stated in-kind compensation, so CCCAP could not count it."
