id: CO-2866
name: Has qualifying military service
identifier: has_qualifying_military_service
kind: supplied
type: yes/no
scope: person
program: All
meaning: "The person's own service: on active duty (other than active duty for training) in the U.S. Armed Forces, or a veteran honorably discharged not on account of alienage who fulfills the minimum active-duty service requirements (8 U.S.C. 1612(b)(2)(C), 1613(b)(2))."
supplied_by: DD-214 or military record; the application.
sources: [S1150, S16]
tags: [immigration]
rationale: "Dual-entry audit 1.11: has_military_connection (CO-005) bundled the veteran's own service with the spouse's and children's derivative connection, so the veteran's fact was entered on each relative."
