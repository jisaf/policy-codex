id: CO-2568
name: Is an elementary or secondary school student
identifier: is_elementary_or_secondary_student
kind: supplied
type: yes/no
scope: person
program: All
meaning: The person attends elementary or secondary school, attends classes toward a General Equivalency Diploma that the state or local school district recognizes, operates or supervises, or attends elementary or secondary classes through a home-school program the district recognizes or supervises, including a temporary interruption for a semester or vacation break when enrollment will resume.
precision: If not stated, SNAP reads this as false (snap_student_earnings_are_excluded, CO-2569).
supplied_by: Applicant statement or school record.
sources: [S1817]
tags: [income, age]
rationale: "CDHS review C-2: no fact stated elementary or secondary enrollment as 7 CFR 273.9(c)(7) defines it; is_attending_high_school (grades 9-12) and snap_is_enrolled_half_time_in_school_or_training (higher education and training) are narrower or different."
nearest: [CO-1292]
