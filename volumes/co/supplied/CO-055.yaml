id: CO-055
name: Is a destitute migrant or seasonal farmworker
identifier: is_destitute_migrant_or_seasonal_farmworker
kind: supplied
type: yes/no
scope: case
program: SNAP
meaning: "The person's household is a migrant or seasonal farm worker household destitute of income for the month under 10 CCR 2506-1 4.406 (7 CFR 273.10(e)(3)) - its only income for the month of application was received from a terminated source before the date of application, or is more than $25 from a new source that will not be received by the tenth calendar day after filing (or after the normal issuance cycle at recertification), or a combination of the two; considered only for the first month of each certification period, with the grower as the source of income."
precision: "Phase-8 fix round (OQ-14 resolved): 10 CCR 2506-1 4.406.A-C (S1018) states the definition. The fact stays supplied - deriving it would need three income-source facts (terminated source, new source over $25, received by the tenth day) that no other rule reads - with the definition in its meaning. One value for the case: the month of application is the first month of the certification period, the only month the definition is considered (4.406). Final verification pass 2 N-6: snap_is_destitute_application_month (CO-4168) also reads it, for the income of the month of application (4.406.1.A); read as false when not stated."
supplied_by: County eligibility technician determination under 10 CCR 2506-1 4.406 (7 CFR 273.10(e)(3)).
rationale: "snap_is_entitled_to_expedited_service (CO-347) needs the third, migrant/seasonal-farmworker ground for expedited service stated at 7 CFR 273.2(i)(1)(ii) (S58); no existing supplied fact captures destitute migrant/seasonal farmworker status, and the governing destitution test itself (273.10(e)(3)) is outside this volume's fetched document set (OQ-14). Dual-entry audit 1.13-1.17 and 5.9 (OQ-541, same-word SW-9): a fact about the application or the home has one value per case (convention rule 18), stated once in the case's case_facts instead of on each member."
sources: [S58, S1018]
tags: [income]
