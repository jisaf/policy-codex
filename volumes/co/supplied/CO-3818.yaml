id: CO-3818
name: "Wages from short-term employment"
identifier: short_term_employment_wages
kind: supplied
type: money
scope: person-month
program: All
meaning: "The part of the person's wages for the month earned in short-term employment: a temporary job of ninety days or less."
precision: "Part of the person's gross earned income for the month as wages_gross states it, not added to it. If not stated, every program reads it as 0."
supplied_by: "Applicant statement, the employer's record."
sources: [S2604]
tags: [cash, income]
rationale: "Final cash review FC-2 and FC-3: Colorado Works' and Adult Financial's exclusion items (CO-2340 to CO-2343) summed a closed list of neutral receipt facts, so income the current exempt-income lists name could not be excluded and was counted. 9 CCR 2503-6 3.605.2.C (S2604) does not consider income from short-term employment such as temporary employment of ninety days or less to determine eligibility, as long as the client was not terminated, and did not quit, through the client's own fault. The fact states the receipt, program-neutrally (convention rule 13); each program's exclusion item decides whether its list exempts it."
