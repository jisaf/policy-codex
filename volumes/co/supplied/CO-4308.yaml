id: CO-4308
name: "Need-based charitable cash received"
identifier: charitable_need_based_cash_received
kind: supplied
type: money
scope: person-month
program: All
meaning: "Cash the person received in the month as a donation, based on need, from one or more private, nonprofit charitable organizations."
precision: "Part of the person's gross unearned income for the month as the unearned income facts state it (other_unearned_income_nontaxable, or energy_assistance_received where the donation is home energy assistance from a nonprofit), not added to it. If not stated, SNAP reads it as 0."
supplied_by: "Applicant statement; a letter from the organization."
sources: [S3109]
tags: [snap, income]
rationale: "Coverage review snap-financial CF-1: 4.405.2.A.10 (S3109) excludes need-based cash donations from private nonprofit charities up to $300 a fiscal quarter; no fact stated them, and energy_assistance_received excluded a nonprofit's energy cash in full."
