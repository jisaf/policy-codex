id: CO-020
name: "SNAP: enrolled at least half time in a school or training program"
identifier: snap_is_enrolled_half_time_in_school_or_training
kind: supplied
type: yes/no
scope: person
program: SNAP
meaning: "The person is enrolled at least half time, as the school or program defines it, in a recognized school (elementary or secondary, or equivalent) or training program, for the 7 CFR 273.7(b)(1)(viii) work registration exemption. Enrollment at least half time in an institution of higher education is is_enrolled_higher_education_half_time (whose exemption also needs the 273.5 student rules), not this fact."
supplied_by: Applicant statement, school enrollment record.
sources: [S125, S126]
tags: [snap, work_registration, student]
rationale: "Phase 2 SNAP fact. Vocabulary fix round (docs/reviews/vocabulary-reuse.md, R-2): renamed from is_enrolled_in_school and confined to SNAP; it had been read by Medicaid and Colorado Works for a full-time secondary student and by CCCAP for high school attendance and for education activities, four different definitions. Those readers now read is_full_time_secondary_student_finishing_before_nineteen (CO-1720), is_attending_high_school (CO-1721) and cccap_is_in_education_or_training_activity (CO-1722)."
