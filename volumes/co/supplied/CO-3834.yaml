id: CO-3834
name: "Date of a transfer of a resource for less than its value"
identifier: resource_transfer_date
kind: supplied
type: calendar date
scope: person
program: All
meaning: "The date the person (or the person's spouse) last gave away, sold, traded or otherwise transferred ownership of a resource for less than its fair value: cash or property given away or spent down, a financial instrument transferred, or another person's name added as an owner. Not stated when the person made no such transfer."
precision: "If not stated, Adult Financial reads it as no transfer. Where several transfers were made, the case states the first, with the total uncompensated value in resource_transfer_uncompensated_value (af_twfc_penalty_months, CO-3840, states what follows)."
supplied_by: "Applicant statement, deeds, account and sale records, as the county establishes them."
sources: [S2614]
tags: [cash, resources]
rationale: "Final cash review FC-6: 9 CCR 2503-5 3.520.76 (S2614) and C.R.S. 26-2-111(1)(c) (S2615) make a transfer without fair consideration within thirty-six months before the application, or while receiving, a ground of ineligibility for a period set by the uncompensated value, and nothing in the volume stated it, so a client in a penalty period was found eligible. The Medicaid transfer facts (uncompensated_transfer_value_in_lookback, CO-824; transfer_penalty_period_start_date, CO-886) state the Medicaid sixty-month look-back value and the Eligibility Site's penalty start, not the date of the transfer, so Adult Financial's thirty-six months cannot be read from them."
