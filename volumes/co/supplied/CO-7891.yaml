id: CO-7891
name: Persons lived apart from throughout the months evaluated
identifier: persons_lived_apart_from_throughout_months_evaluated
kind: supplied
type: group of persons
scope: person
program: All
meaning: "The persons of the case, each living on the determination date in a different home (dwelling_id) from this person, from whom this person has lived apart throughout the months the case is evaluated for: on no day since the first day of the first month the case is evaluated for has this person lived in one home with that person (the father of a child who has never lived with the child; a relative who left the home before that month), whoever else either of them lived with in those months. A person named here on either of two persons means the two lived apart in every month the case is evaluated for, and no date they ceased to live together is stated for them. An empty list names no one."
precision: "Close-out verification F3 (KL-SNAP-5, docs/reviews/known-limits.md; 2026-11-24): has_lived_apart_throughout_months_evaluated (CO-7860) is a fact of the person, true only where the person has lived apart from every person of the case in another home, so a person who lived in an evaluated month with one person of the case who has since moved out, and never with another, could not state it, and the pair who never lived together had no separation date (probe G4: a father who lived with his son until 2026-10-25 and a daughter who lived with a housemate until the same day, never with each other: October was cannot determine). This list states the fact for each pair: it names the persons the person has lived apart from throughout, and a separation from anyone else is dated as before (ceased_living_with_spouse_date CO-7352, ceased_living_with_parent_or_child_date CO-7506, ceased_living_with_housemate_date CO-7670). Stated on either of the two persons (it need not be stated on both). If not stated, every reader reads it as naming no one (convention rule 12), and the date the two ceased to live together, or a facility's institution_entry_date, is then required where read (decision 4 of 2026-11-23), unless CO-7860 is true on either. Read by SNAP's household of the month (snap_lives_with_in_month, CO-7672: a month before the determination month, 7 CFR 273.10(a)(1)(i), S5091) and the SSI method's (ma_ssi_lives_with_in_month, CO-7505: 20 CFR 416.1163, 416.1165)."
supplied_by: "The applicant's statement on the application (who lives at the address, and since when; who has never lived there), or the case record."
sources: [S5091, S1]
tags: [household]
rationale: "KL-SNAP-5 (close-out verification F3, docs/reviews/verify-closeout-fixes.md, probe G4): has_lived_apart_throughout_months_evaluated (CO-7860), a yes/no of the person, cannot describe a pair who never lived together when either of them lived in an evaluated month with someone else of the case who has since moved; a list on the person names the pair, so the household of the month is settled without a made-up date."
nearest: [CO-7860, CO-7352, CO-7506, CO-7670]
