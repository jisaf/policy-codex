id: CO-4425
name: "Equity of property producing goods for the household's own use"
identifier: home_use_production_property_equity_value
kind: supplied
type: money
scope: person
program: All
meaning: "The equity value of the person's non-business real and personal property used to produce goods only for the household's own consumption: land used to raise vegetables or livestock for the household, and the personal property needed to do it (a garden tractor, a boat used for subsistence fishing), not vehicles or boats used for leisure."
precision: "As of the determination date; the person's own holding or share. Not part of real_property_other_than_home_equity or vehicles_equity_value. If not stated, Adult Financial reads it as 0."
supplied_by: "Applicant statement, as the county establishes it."
sources: [S3207]
tags: [resources]
rationale: "Coverage review F-7: 9 CCR 2503-5 3.520.77.D.3 (S3207) exempts $6,000 of the equity of such property and counts the rest; no fact stated it."
