id: CO-843
name: Is an emancipated minor
identifier: is_emancipated_minor
kind: supplied
type: yes/no
scope: person
program: All
meaning: "The person is under 18 and legally emancipated under Colorado law. If not stated, LEAP, Colorado Works, SNAP, Adult Financial and Medicaid read this as false. Every program that asks whether a minor is emancipated reads this one fact (same-word audit SW-16)."
supplied_by: "The applicant's statement on the application, or the case record; where a program's verification rule requires it, the court order of emancipation (heavier-definitions audit H-15: the fact is the person's circumstance as stated; documents belong to the *_verification_document_received facts and the verification items, which ask for them only where a program's rule requires it)."
precision: "Required where Colorado Works or Adult Financial (cw_minor_parent_is_assisted_as_adult CO-4352, af_deemed_relative_income CO-2384, af_burial_legally_responsible_persons CO-3312) reads it (coverage pass 6 CA6-7, docs/reviews/coverage6-cash.md; decision 4 of 2026-11-23): not stated is cannot determine."
sources: [S411]
rationale: "No existing fact in this volume's interface carries emancipation status; cw_minor_parent_living_arrangement_met (CO-906) needs it. Vocabulary fix round (docs/reviews/vocabulary-reuse.md, C-1, C-4): the meaning states the fact, not the Colorado Works consequence, and says how an unstated value is read."
