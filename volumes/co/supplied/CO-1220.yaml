id: CO-1220
name: Died while receiving Adult Financial or Medicaid assistance
identifier: died_while_receiving_af_or_medicaid
kind: supplied
type: yes/no
scope: person
program: AdultFinancial
meaning: The person has died and, at the time of death, was receiving Old Age Pension, Aid to the Needy Disabled (AND-SO or AND-CS), Home Care Allowance, or Colorado Medicaid assistance, per 9 CCR 2503-5 3.570.43.A.1. False for a living person.
supplied_by: Burial benefit application and the statewide automated system's benefit record as of the date of death.
sources: [S719]
tags: [cash]
rationale: No existing fact records death or the programs a decedent was receiving; af_burial_eligible (CO-1231) needs it.
