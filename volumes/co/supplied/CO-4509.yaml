id: CO-4509
name: Insurance and injury proceeds spent on the costs they cover, in the thirty days before the application
identifier: insurance_proceeds_spent_on_covered_costs_prior_thirty_days
kind: supplied
type: money
scope: person
program: All
meaning: "Of the life insurance, health insurance or personal injury lawsuit proceeds within lump_sum_received_prior_thirty_days (CO-4066), the amount the person spent, or is to spend or is required to spend, on the insured person's last illness and burial not covered by other benefits (life insurance proceeds), or on medical care (health insurance or personal injury proceeds)."
precision: "Part of lump_sum_received_prior_thirty_days, not added to it, and never more than the proceeds themselves. If not stated, a program reads it as 0."
supplied_by: "Bills, receipts or the settlement statement showing the costs paid or owed."
sources: [S3303, S2712]
tags: [income]
rationale: "Coverage review C-1: 9 CCR 2503-7 3.752.21.C-D (S3303) counts life insurance proceeds \"to the extent that they exceed the amount expended ... for the purpose of the insured recipient's last illness or burial\" and health insurance or personal injury proceeds \"to the extent that they exceed the amount to be expended or required to be expended for medical care\". No fact stated those amounts, so LEAP counted the whole proceeds. The part is stated for the same thirty days as the lump sum it belongs to, as the retroactive benefit parts are (CO-4067, CO-4068)."
nearest: [CO-4066]
