id: CO-021
name: Is enrolled at least half-time in higher education
identifier: is_enrolled_higher_education_half_time
kind: supplied
type: yes/no
scope: person
program: All
meaning: The person is enrolled at least half-time in an institution of higher education.
supplied_by: "The applicant's statement on the application, or the case record; where a program's verification rule requires it, the school's enrollment verification (heavier-definitions audit H-15: the fact is the person's circumstance as stated; documents belong to the *_verification_document_received facts and the verification items, which ask for them only where a program's rule requires it)."
sources: []
tags: [student]
rationale: "A fact the case must supply; no existing item in the Colorado volume carries it (the volume began empty in phase 1, and the mwr volume's facts are not shared across volumes). It is reserved for the SNAP income, deduction, work registration and ABAWD rules of later batches, which read it by this identifier."
