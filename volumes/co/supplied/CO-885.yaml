id: CO-885
name: Is enrolled in PACE
identifier: is_enrolled_in_pace
kind: supplied
type: yes/no
scope: person
program: All
meaning: Whether this person is currently enrolled as a Medical Assistance client in the Program of All-Inclusive Care for the Elderly, per 10 CCR 2505-10 § 8.100.7.K.2.b.
precision: Distinct from meets_hcbs_waiver_target_group (CO-821), which states which HCBS waiver's target group a person meets rather than PACE enrollment, and from ma_pace_eligible (CO-654), which is a derived eligibility test rather than a record of actual enrollment.
supplied_by: Case Management Agency's PACE enrollment record.
sources: [S354]
tags: [ma, ltc]
rationale: "No existing item states whether a person is actually enrolled in PACE (meets_hcbs_waiver_target_group, CO-821, covers HCBS waivers only and has no PACE option; ma_pace_eligible, CO-654, tests eligibility, not enrollment). ma_is_institutionalized_spouse (CO-644) needs it to reach § 8.100.7.K.2.b's PACE-enrollment route into spousal protection, alongside the medical-institution route (in_medical_institution) and the HCBS route (meets_hcbs_waiver_target_group not none)."
