id: CO-033
name: Child support paid, legally obligated
identifier: child_support_paid_legally_obligated
kind: supplied
type: money
scope: person-month
program: All
meaning: The monthly amount of legally obligated child support the person pays to or for a person living outside the household.
supplied_by: Court order, payment record.
sources: []
tags: [income]
rationale: "A fact the case must supply; no existing item in the Colorado volume carries it (the volume began empty in phase 1, and the mwr volume's facts are not shared across volumes). It is reserved for the SNAP income, deduction, work registration and ABAWD rules of later batches, which read it by this identifier."
