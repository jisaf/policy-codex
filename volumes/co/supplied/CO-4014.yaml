id: CO-4014
name: "Uniformed services special pay received"
identifier: uniformed_services_special_pay_received
kind: supplied
type: money
scope: person-month
program: All
meaning: "Special pay the person received in the month from one of the uniformed services under 37 U.S.C. 310 (hostile fire or imminent danger pay)."
precision: "Part of the person's gross unearned income for the month as the unearned income facts state it (other_unearned_income_taxable or other_unearned_income_nontaxable), not added to wages or to it. If not stated, every program reads it as 0."
supplied_by: "Application (income and expenses), the Leave and Earnings Statement."
sources: [S2803]
implemented: engine
tags: [income]
rationale: "Final cash review 2, N-4: 20 CFR 416.1124(c)(19), which 9 CCR 2503-5 3.520.786.K incorporates, excludes \"Special pay received from one of the uniformed services pursuant to 37 U.S.C. 310\" (S2803); no fact stated it."
