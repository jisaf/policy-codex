id: CO-4326
name: "Annual contract wages received"
identifier: annual_contract_wages_received
kind: supplied
type: money
scope: person-month
program: All
meaning: "The part of the person's wages for the month (wages_gross) paid under the annually renewable contract annual_contract_pay (CO-4325) states."
precision: "Part of wages_gross, not added to it. If not stated, SNAP reads it as 0."
supplied_by: "Pay stubs."
sources: [S3115]
tags: [snap, income]
rationale: "Coverage review snap-financial CF-3: to replace the contract pay received in a month by its twelve-month average (4.403.3.D, S3115), SNAP needs the part of the month's wages the contract paid."
