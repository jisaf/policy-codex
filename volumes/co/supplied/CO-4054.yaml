id: CO-4054
name: "CCCAP: parent fees unpaid and not resolved"
identifier: cccap_parent_fee_nonpayment_unresolved
kind: supplied
type: yes/no
scope: case
program: CCCAP
meaning: "The household's adult caretaker(s) or teen parent(s) did not pay the parent fees owed during the twelve-month eligibility period, made no acceptable payment arrangement with the provider or did not follow through with it (8 CCR 1403-1 3.114.B.2, 3.124.N), and since then none of the three things 3.124.N.1-3 names has happened: the delinquent fees paid in full, an adequate payment arrangement signed by the caretaker and the provider to whom the fees are owed, or a county determination of verified good-faith efforts to pay a provider the caretaker could not locate."
precision: "One value for the case: the county's finding from the providers' reports of nonpayment (3.124.N). Read at a redetermination (3.114.B.2: \"at re-determination only\"; for Colorado Works Child Care, the end of its twelve-month period) and at a new application, since a household terminated for nonpayment \"will remain ineligible until\" N.1-3 (cccap_eligibility_status, CO-989). If not stated, CCCAP reads this as false."
supplied_by: "The CCCAP case record (CHATS): the providers' nonpayment reports and the county's finding."
sources: [S2854, S2855]
tags: [household]
rationale: "Second-pass review N-4: 3.114.B.2 and 3.124.N make unpaid parent fees an eligibility reason at redetermination and keep the household ineligible until they are resolved; no item read them, so such a household was found eligible."
