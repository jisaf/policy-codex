id: CO-022
name: Hours worked
identifier: hours_worked
kind: supplied
type: hours
scope: person-month
program: All
meaning: The number of hours the person worked for pay in the month, including hours of self-employment. Does not include hours of participation in a SNAP Employment and Training work program, workfare, or similar unpaid work activity; those are counted separately under work_program_hours (CO-048) and workfare_hours (CO-049).
supplied_by: Employer verification, pay stubs, applicant statement.
sources: []
rationale: "A fact the case must supply; no existing item in the Colorado volume carries it (the volume began empty in phase 1, and the mwr volume's facts are not shared across volumes). It is reserved for the SNAP income, deduction, work registration and ABAWD rules of later batches, which read it by this identifier. Fix-round (C-2): narrowed the meaning to paid employment hours only. The prior meaning ('for pay or in a work program') caused snap_meets_abawd_work_requirement (CO-415) to double count a person's work-program hours, once inside hours_worked and once again via work_program_hours, when a reporter followed the stated meaning literally. Every rule reading hours_worked (snap_weekly_hours_worked CO-402, the work-registration employment exemption CO-404, the student employment exemption via CO-402, and CO-415) already treats it as paid work; only the meaning text was wrong, so no other item's derivation changes. Reviewed with Data steward sign-off pending (this is a supplied-fact meaning change, per the review's note)."
