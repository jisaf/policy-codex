id: CO-4457
name: "Rental income received"
identifier: rental_income_received
kind: supplied
type: money
scope: person-month
program: All
meaning: "The rents the person received in the month, before expenses, from a house, apartment, store, land or other property the person rents to others and does not actively manage as a business."
precision: "Part of other_unearned_income_taxable (CO-1714), not added to it. Rents from property the person actively manages as a business are self-employment gross receipts (CO-1700), not this fact. If not stated, every program reads it as 0."
supplied_by: "Applicant statement, leases or rent receipts."
sources: [S3256]
tags: [income]
nearest: [CO-1714]
rationale: "Coverage round (docs/reviews/coverage-cccap.md, F-10): 8 CCR 1403-1 3.111.I.12 and I.17 (S3256) count \"Net rental income\"; other_unearned_income_taxable states rents gross, together with other income, so CCCAP could neither find the rents nor net them. This part-of fact and rental_property_expenses_paid (CO-4458) let CCCAP count the net rent."
