id: CO-3921
name: How often the person is paid wages
identifier: wages_pay_frequency
kind: supplied
type: one of
options: [weekly, biweekly, semimonthly, monthly]
scope: person
program: All
meaning: "How often the person's employer pays the wages the person earns as an employee: every week, every two weeks, twice a month, or once a month."
precision: "A person with no wages needs no value. A person paid by two employers on different schedules states the schedule of the job that pays the most; the case then states the thirty days' receipts as well (wages_gross_received_prior_thirty_days), which LEAP reads when a job began or ended. If not stated, LEAP reads the person's wages as those received in the thirty days before the application (leap_person_wages, CO-3925)."
supplied_by: Pay stubs or the employer's statement.
sources: [S2713]
tags: [income]
rationale: "Final pass F-09 (SW-35): LEAP converts ongoing pay to a month by the pay schedule, adding four weekly amounts, two bi-weekly amounts or two semi-monthly amounts (9 CCR 2503-7 3.752.22.C.1-2, S2713). No fact stated how often a person is paid, so the conversion could not be made."
