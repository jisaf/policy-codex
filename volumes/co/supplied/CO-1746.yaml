id: CO-1746
name: "SNAP: application date"
identifier: snap_application_date
kind: supplied
type: calendar date
scope: case
program: SNAP
meaning: "The date the household's SNAP application was filed with the State agency (7 CFR 273.2(c)), from which the expedited service, postponed verification and documentation periods run."
precision: "On a combined PEAK application for SNAP and Medical Assistance it is the same date as ma_application_date (CO-088); the two differ when the household applies for the programs on different days. One value for the case (the household's one application); not stated on each member."
supplied_by: "CBMS application record (date of filing)."
sources: [S835, S1097]
tags: [snap, verification]
rationale: "Vocabulary fix round (docs/reviews/vocabulary-reuse.md, R-13): snap_expedited_postponement_end_date (CO-1393) and the SNAP documentation due dates (CO-1617, CO-1618) read the Medical Assistance application date. Dual-entry audit 1.13-1.17 and 5.9 (OQ-541, same-word SW-9): a fact about the application or the home has one value per case (convention rule 18), stated once in the case's case_facts instead of on each member."
