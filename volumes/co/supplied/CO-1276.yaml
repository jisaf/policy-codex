id: CO-1276
name: LEAP minimum benefit for the program year
identifier: leap_benefit_minimum
kind: supplied
type: money
scope: person
program: LEAP
meaning: The minimum Heating Fuel Assistance benefit the Department establishes for the LEAP program year, per 9 CCR 2503-7 3.758.47 Step G. Stated on the household head.
precision: "CDHS review C-6: this is a program-year figure, the same for every household, that belongs in a dated global parameter; it stays a supplied fact only because the 2026-2027 figure is not published on an allowed host. It is in the State's annual notification to county departments and the LEAP training manual (3.758.48); cdhs.colorado.gov refused this session, and neither the rule effective November 1, 2025 (D-86) nor the amendments effective November 1, 2026 (D-173) states it (OQ-532). A parameter must state a value (constraints), so the item becomes one when the figure is fetched. Household cases do not state it: CO-01 and CO-02 stated illustrative values until this round, so their LEAP benefit is now unknown."
supplied_by: Department's annual LEAP program-year benefit levels.
sources: [S772]
open: [OQ-253, OQ-532]
tags: [income]
rationale: The rule does not state the figure (OQ-253); leap_benefit_amount (CO-1281) needs it.
