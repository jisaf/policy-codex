id: CO-044
name: Agency finds the person obviously unfit
identifier: agency_finds_obviously_unfit
kind: supplied
type: yes/no
scope: person
program: SNAP
meaning: The eligibility technician determines the person is obviously mentally or physically unfit for employment, without requiring a medical statement.
supplied_by: County worker determination.
sources: []
tags: [work_registration]
rationale: "A fact the case must supply; no existing item in the Colorado volume carries it (the volume began empty in phase 1, and the mwr volume's facts are not shared across volumes). It is reserved for the SNAP income, deduction, work registration and ABAWD rules of later batches, which read it by this identifier."
