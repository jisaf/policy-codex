id: CO-044
name: Agency finds the person obviously unfit
identifier: agency_finds_obviously_unfit
kind: supplied
type: yes/no
scope: person
program: SNAP
meaning: "The eligibility technician determines the person is obviously mentally or physically unfit for employment, without requiring a medical statement. Colorado lists examples the technician weighs, which \"can include but are not limited to\" (10 CCR 2506-1 4.310.3.C, S3065): a person experiencing homelessness; a person recently released from an institution; a person with a self-declared temporary condition that would prevent successful participation in work activities, participating in vocational rehabilitation, or applying for or appealing SSI; a person unable to maintain employment; and a person impacted by domestic violence. A person receiving temporary or permanent disability benefits is unfit without this finding (receives_temporary_or_permanent_disability_benefits, CO-4263)."
supplied_by: County worker determination.
sources: [S3065, S126]
tags: [work_registration]
rationale: "A fact the case must supply; no existing item in the Colorado volume carries it (the volume began empty in phase 1, and the mwr volume's facts are not shared across volumes). It is reserved for the SNAP income, deduction, work registration and ABAWD rules of later batches, which read it by this identifier. Coverage review P2-2: the meaning names Colorado's examples of unfitness (4.310.3.C, S3065), which reach the work registration, student and ABAWD exemptions through snap_is_unfit_for_employment (CO-400); they are examples for the finding (\"can include\"), not findings in themselves."
