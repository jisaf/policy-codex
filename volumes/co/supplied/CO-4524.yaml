id: CO-4524
name: "Gifts received"
identifier: gifts_received
kind: supplied
type: money
scope: person-month
program: All
meaning: "Money the person received in the month as a gift or contribution from someone outside the household, with no obligation to repay it and not in exchange for work."
precision: "Part of the person's gross unearned income for the month as the unearned income facts state it (other_unearned_income_nontaxable, CO-030, names gifts and contributions), not added to it. A loan is loan_proceeds_received (CO-3362) and a gift for a life-threatening condition from a charity is charitable_gifts_for_life_threatening_condition_received (CO-4015). If not stated, every program reads it as 0."
supplied_by: "Applicant statement."
sources: [S3313]
tags: [income]
rationale: "Coverage review C-9: 9 CCR 2503-7 3.755.21.K (S3313) reads \"Gift income shall be considered verified with applicant declaration\", and no fact separated gifts from the rest of the unearned income, so LEAP held a declared gift pending documents. The fact states the receipt, program-neutrally (convention rule 13)."
nearest: [CO-030, CO-4015]
