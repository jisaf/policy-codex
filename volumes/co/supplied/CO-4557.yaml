id: CO-4557
name: Has self-employment, seasonal or commission earnings
identifier: has_self_employment_seasonal_or_commission_earnings
kind: supplied
type: yes/no
scope: person
program: All
meaning: "Whether some of the person's earned income is from self-employment, from seasonal employment, or from commission-based employment, so that the monthly amount varies over the year."
precision: "A statement of the kind of work, not of any program's treatment of it. Coverage pass 4, C4-05 (2026-11-23): no item reads it. Medical Assistance reads whether a person has such earnings from the earnings records (ma_has_annualizable_earnings, CO-6451: a business record, or pay stated seasonal_or_commission, CO-5100), which are the one statement of a person's pay; before, it read this fact, as false where not stated, a default no rule gave, beside the records, and the two could disagree. Kept, with the households that state it, for the final cleanup that retires facts left without a reader."
supplied_by: The application's employment and self-employment questions.
sources: [S3356]
tags: [income]
rationale: "Coverage review F-04 (2026-11-22): § 8.100.4.C.4.a turns on whether the household has earned income from self-employment, seasonal employment or commission-based employment; self-employment is visible in the monthly facts, but seasonal and commission wages are within wages_gross (CO-023), so no fact said which earners the rule reaches."
