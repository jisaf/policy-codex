id: CO-2339
name: "SNAP: excluded unearned income"
identifier: snap_excluded_unearned_income
kind: supplied
type: money
scope: person-month
program: SNAP
meaning: "The part of this person's gross unearned income for the month, as stated in the unearned income facts, that 10 CCR 2506-1 4.405 (and 7 CFR 273.9(c)) excludes from SNAP income."
precision: "If not stated, SNAP reads this as 0 (no excluded unearned income). It cannot exceed the gross amount it is taken from; the income item never falls below zero."
supplied_by: "Eligibility technician's application of the program's exclusion list to the income reported."
sources: [S1620]
tags: [snap, income]
rationale: "OQ-390: supplied income facts state the gross amount received before any program's exclusions (vocabulary review R-1), and each program's exclusion list (S1620) differs, so a case with excluded income could not be right for two programs at once; this program's own excluded amount lets snap_person_unearned_income (CO-331) subtract it."
