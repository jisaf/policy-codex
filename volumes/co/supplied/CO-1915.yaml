id: CO-1915
name: Unpaid or in-kind work hours
identifier: ma_unpaid_or_in_kind_work_hours
kind: supplied
type: hours
scope: person-month
program: Medicaid
meaning: The hours in the month the person worked in exchange for goods or services ("in-kind" work) or worked unpaid, other than community service, within the definition of work in 42 CFR 435.552(b). Hours worked for money, self-employment included, are hours_worked (CO-022). If not stated, Medicaid reads this as zero.
supplied_by: The applicant's or beneficiary's statement, verified as 42 CFR 435.557 requires (reliable information available to the State first).
sources: [S1203]
tags: [ma, magi]
rationale: "OQ-65: hours_worked (CO-022) counts paid work only; 435.552(b) also counts in-kind and unpaid work toward the 80 hours."
