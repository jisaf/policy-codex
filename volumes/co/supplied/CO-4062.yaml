id: CO-4062
name: Self-employment costs verified by documents other than receipts
identifier: self_employment_costs_verified_by_other_documents
kind: supplied
type: yes/no
scope: person-month
program: All
meaning: "Whether the agency has received documents, other than receipts (self_employment_cost_receipts_received, CO-3927), that verify the business costs of the person's self-employment stated for the month (the operating, interest and business vehicle costs, CO-3370 to CO-3375): such as bank or credit card statements showing the payments, a mileage log, or the business's tax return schedule."
precision: "Each program decides which documents verify a cost: LEAP takes only receipts (9 CCR 2503-7 3.755.21.I.2-3) and does not read this fact; CCCAP takes any verification the county obtains (8 CCR 1403-1 3.111.G.2.a), receipts or these documents. If not stated, CCCAP reads it as false."
supplied_by: The documents the applicant provides.
sources: [S1637]
tags: [income, verification]
rationale: "Second-pass review N-5 (was F-17): 3.111.G.2.a (S1637) says \"The county shall obtain verification of all expenses from the adult caretaker(s) or teen parent(s) or they will not be considered\", and I.2 counts \"declared gross income minus verified business expenses\"; CCCAP deducted the costs with no verification at all. The receipts fact (CO-3927) carries LEAP's narrower rule that a bank or credit card statement is not a receipt, so the other documents CCCAP accepts are their own fact rather than a second reading of it."
nearest: [CO-3927]
