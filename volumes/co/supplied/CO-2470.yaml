id: CO-2470
name: "Medicaid: unearned income excluded under the SSI rules"
identifier: ma_ssi_excluded_unearned_income
kind: supplied
type: money
scope: person-month
program: Medicaid
meaning: The part of the person's gross unearned income for the month that 20 CFR 416.1124 excludes for the SSI-related Medical Assistance groups (for example interest on countable resources, which 416.1124(c)(22) excludes). If not stated, Medicaid reads it as 0.
supplied_by: Income verification and the eligibility site's application of 20 CFR 416.1124.
sources: [S308, S310]
tags: [ma, non_magi, income]
rationale: "OQ-390 (resolved for Medicaid in the HCPF fix round), as the other programs did in the phase-10 sweep: an explicit excluded-income input citing the program's own exclusion list."
