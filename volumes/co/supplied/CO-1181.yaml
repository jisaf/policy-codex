id: CO-1181
name: Lottery and gambling winnings received
identifier: lottery_gambling_winnings_received
kind: supplied
type: money
scope: person-month
program: All
meaning: "The lottery or gambling winnings the person received in the month, every receipt of the month added together, or 0 if none. Gross winnings as reported for federal income tax, before any spreading: each program's own rule decides in which months it counts them (for Medical Assistance, 10 CCR 2505-10 § 8.100.4.C.1.b.xiv spreads each month's receipt over the months its amount calls for, ma_lottery_winnings_countable_for_recipient, CO-1187)."
precision: "Stated per month, so a person with winnings in several months states each month's receipt, and a receipt's spread can overlap a later one's (OQ-216, resolved). Receipts in the same month are stated together and spread as one amount (OQ-592). Medical Assistance looks back ma_lottery_winnings_spread_max_months months, the longest spread, so the months back to then are read; a case states 0 for them, usually as a month default. Not part of the unearned income facts or of lump_sum_received (CO-3367). If not stated, CCCAP and LEAP read it as 0 (final pass F-11: both count prizes, 8 CCR 1403-1 3.111.I.20 and 9 CCR 2503-7 3.752.21.A, and neither read this fact). SNAP reads it as 0 when not stated, and as one prize where lottery_gambling_largest_single_game_winnings_received (CO-4150) is not stated (snap_has_substantial_lottery_winnings, CO-4151; final verification pass 2 N-1)."
supplied_by: Applicant statement, IRS Form W-2G, or the Colorado Lottery or gaming establishment's payout record.
sources: [S669, S1234]
tags: [income]
open: [OQ-592]
rationale: "Phase 7: no existing item carried lottery or gambling winnings. OQ-216 (audit fix round 4, fixed in full at the product owner's direction): renamed from lottery_gambling_winnings_amount through a change set that keeps the ID and made a per-month fact; lottery_gambling_winnings_month (CO-1182), which dated the single receipt, is retired, since the month a receipt was received is the month it is stated for."
