id: CO-1181
name: Lottery or gambling winnings amount
identifier: lottery_gambling_winnings_amount
kind: supplied
type: money
scope: person
program: All
meaning: "The amount of the person's most recent lottery or gambling winnings received in a single month, or 0 if the person has received none that still count (for Medical Assistance, none within the months over which 10 CCR 2505-10 § 8.100.4.C.1.b.xiv spreads them). The month received is lottery_gambling_winnings_month (CO-1182)."
precision: "One receipt per person: a person with overlapping winnings from two different months is stated as the most recent receipt only (OQ-216). Gross winnings as reported for federal income tax, before any spreading."
supplied_by: Applicant statement, IRS Form W-2G, or the Colorado Lottery or gaming establishment's payout record.
sources: [S669]
open: [OQ-216]
tags: [income]
rationale: "S-9 of the phase 7 review: § 8.100.4.C.1.b.xiv counts lottery and gambling winnings as MAGI income and spreads winnings over $79,999 across months; no existing income fact carries the amount and the month received, which the spreading needs. Program-neutral because the amount is a plain fact about the person; the spreading is Medicaid's (CO-1185 to CO-1187)."
