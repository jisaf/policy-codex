id: CO-4303
name: "Domestic Volunteer Service Act Title I payments received"
identifier: dvsa_title_i_volunteer_payments_received
kind: supplied
type: money
scope: person-month
program: All
meaning: "Payments the person received in the month as a volunteer under Title I of the Domestic Volunteer Service Act of 1973: AmeriCorps Volunteers in Service to America (VISTA), University Year for Action or the Urban Crime Prevention Program."
precision: "Part of federally_excluded_payments_received (CO-3366), which states volunteer payments below the minimum wage, not added to it; a Title I payment at or above the minimum wage is not a federally excluded payment and is stated in wages_gross. If not stated, SNAP reads it as 0."
supplied_by: "Applicant statement; the volunteer service agreement."
sources: [S3105, S3106]
tags: [snap, income]
rationale: "Coverage review snap-financial CF-1: federally_excluded_payments_received states Domestic Volunteer Service Act payments of Titles I to III together, and SNAP excluded all of them; 4.405.2.A.3 (S3105) excludes Title I (VISTA) payments only for a person receiving SNAP or public assistance on joining, and 4.403.A.2 and C (S3106) count them otherwise as earned income."
