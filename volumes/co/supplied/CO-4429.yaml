id: CO-4429
name: "Taxes due on withdrawing retirement accounts"
identifier: retirement_accounts_taxes_due
kind: supplied
type: money
scope: person
program: All
meaning: "The income taxes the person would owe on withdrawing the value retirement_accounts_value states, as the person documents them."
precision: "Stated only when the person provides the figure. If not stated, Adult Financial deducts af_retirement_account_default_tax_rate (20%) of the gross value instead (9 CCR 2503-5 3.520.73.B.1.b)."
supplied_by: "The person's documentation (the plan's statement of withholding, a tax computation), as the county establishes it."
sources: [S3208]
tags: [resources]
rationale: "Coverage review F-8: 9 CCR 2503-5 3.520.73.B.1 (S3208) counts \"The gross value of the account, less any taxes due\", or the gross value less 20% when the client cannot give the taxes; retirement_accounts_value is the value before taxes."
