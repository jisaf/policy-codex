id: CO-3350
name: Dwelling
identifier: dwelling_id
kind: supplied
type: text
scope: person
program: All
meaning: "A label for the home the person lives in (any text the case chooses, such as h1), the same for every person of the case who lives in the same home: the home the person usually lives in and intends to return to, a temporary absence from it notwithstanding (temporary_absence_reason says why the person is away). A person living in a facility (residence_setting_type other than private_dwelling) has the facility as the person's home."
precision: "Persons with the same label live together; lives_with (CO-1925) is derived from it. Where a case states no label, the items that ask whether persons live together read a stated relationship edge as living together (convention rule 17's fallback, each item's precision says so); a case where any persons of it live apart states the label for every person."
supplied_by: "The application's household roster (who lives at the address)."
sources: [S163, S408, S481, S1400, S2]
implemented: engine
tags: [household]
rationale: "Same-word audit SW-7 and dual-entry audit 3.6: living together was read from relationship edges by every household, caretaker and custody item, while Medicaid read a separate lives_with list stated on one person; the two disagreed in CO-04, and lives_with could be stated on p1 and not on p2. Each person states the home they live in once; lives_with is derived, symmetric, and every item that asks whether persons live together reads it (convention rule 17)."
