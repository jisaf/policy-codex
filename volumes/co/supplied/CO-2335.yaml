id: CO-2335
name: "SNAP: battered non-citizen exemption from sponsor deeming applies"
identifier: snap_battered_non_citizen_sponsor_exemption_applies
kind: supplied
type: yes/no
scope: person
program: SNAP
meaning: "This sponsored non-citizen is exempt from sponsor deeming as a battered non-citizen spouse, parent of a battered child or child of a battered non-citizen (or the child of a battered parent): within twelve months of the local office's finding that the battery is substantially connected to the need for benefits, or later where a court or the immigration service has recognized it, and the non-citizen does not live with the batterer (10 CCR 2506-1 4.305.2.E.5)."
precision: "If not stated, SNAP reads this as false."
supplied_by: "County determination and court or USCIS records."
sources: [S1619]
tags: [snap, immigration]
rationale: "OQ-380: 4.305.2.E (S1619) lists the non-citizens to whom the sponsor's income and resources are not deemed; no fact stated this exemption, so snap_requires_verification_of_sponsor (CO-1616) asked every sponsored member for the sponsor's information."
