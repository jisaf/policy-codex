id: CO-4508
name: Refugee resettlement grant received in the thirty days before the application
identifier: refugee_resettlement_grant_received_prior_thirty_days
kind: supplied
type: money
scope: person
program: All
meaning: "The part of lump_sum_received_prior_thirty_days (CO-4066) that is a one-time resettlement grant the person received under the refugee admissions program in the thirty days before the application date."
precision: "Part of lump_sum_received_prior_thirty_days, not added to it. If not stated, a program reads it as 0."
supplied_by: "The resettlement agency's record of the payment."
sources: [S3302, S2712]
tags: [income]
rationale: "Coverage review C-1: 9 CCR 2503-7 3.752.23.AA (S3302) excludes \"A one-time resettlement grant received under the refugee admissions program\". The grant is a one-time receipt, which LEAP counts in the income verification period (CO-4069), so it was counted. The part is stated for the same thirty days as the lump sum it belongs to, as the retroactive benefit parts are (CO-4067, CO-4068)."
nearest: [CO-4066]
