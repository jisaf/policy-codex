id: CO-1926
name: Persons cared for
identifier: ma_persons_cared_for
kind: supplied
type: group of persons
scope: person
program: Medicaid
meaning: "The persons in the case to whom this person, as an adult family member or other individual with a significant relationship to them, provides care within a broad range of assistance on a regular basis that is not solely incidental: the family caregiver relationships of 42 CFR 435.554(a) and (c)(3)(i)."
supplied_by: The applicant's or beneficiary's statement, verified as 42 CFR 435.557 requires (reliable information available to the State first).
sources: [S1207, S1208]
tags: [ma, magi]
rationale: "OQ-65: the family caregiver exclusion needs the persons cared for."
