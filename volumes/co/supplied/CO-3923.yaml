id: CO-3923
name: A job began or ended in the thirty days before the application
identifier: employment_began_or_ended_prior_thirty_days
kind: supplied
type: yes/no
scope: person
program: All
meaning: "Whether, in the thirty days before the application date, the person started a job that pays wages, or a job ended so that the person is no longer paid wages from it."
precision: "If not stated, LEAP reads it as false (the person's wages are ongoing)."
supplied_by: Applicant statement, with the employer's start or separation date.
sources: [S2713]
tags: [income]
rationale: "Final pass F-09 (SW-35): LEAP counts the actual wages received in the income verification period, not four weeks of ongoing pay, when a household member's income \"is terminated as of the application date\" or the member \"has a new source of earned income as of the application date\" (9 CCR 2503-7 3.752.22.C.3.a-b, S2713). No fact said whether a job began or ended."
