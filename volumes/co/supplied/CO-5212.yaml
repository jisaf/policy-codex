id: CO-5212
name: "Difficulty of Care: younger qualified foster individuals (under 19)"
identifier: difficulty_of_care_younger_foster_individuals
kind: supplied
type: whole number
scope: person
program: All
meaning: "The number of qualified foster individuals under the age of 19 for whose care the person's Difficulty of Care payments (earnings of kind difficulty_of_care_payment, CO-5100) are paid; 0 when the payments are for the care of someone who is not a foster individual."
supplied_by: "The payer's records; applicant statement."
sources: [S3754]
tags: [income]
rationale: "Coverage review (MAGI and CHP+) F-18, deferred P2 (fix round 2026-11-23): § 8.100.3.K.7.c's exception counts the qualified foster individuals the payments are for, by age."
