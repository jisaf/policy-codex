id: CO-3820
name: "Reverse mortgage payments received"
identifier: reverse_mortgage_payments_received
kind: supplied
type: money
scope: person-month
program: All
meaning: "Money the person received in the month as payments under a reverse mortgage loan secured by the person's home."
precision: "Part of the person's gross unearned income for the month as the unearned income facts state it (other_unearned_income_taxable or other_unearned_income_nontaxable, or the fact that names the source), not added to it. If not stated, every program reads it as 0."
supplied_by: "Applicant statement, the lender's statement."
sources: [S2608, S2606]
tags: [cash, income]
rationale: "Final cash review FC-2 and FC-3: Colorado Works' and Adult Financial's exclusion items (CO-2340 to CO-2343) summed a closed list of neutral receipt facts, so income the current exempt-income lists name could not be excluded and was counted. 9 CCR 2503-5 3.520.786.L (S2608) exempts reverse mortgage loan payments; loan_proceeds_received (CO-3362) leaves reverse mortgages out. Colorado Works reads a reverse mortgage as a bona fide loan, repayable under its agreement (3.605.4.B.1, S2606). The fact states the receipt, program-neutrally (convention rule 13); each program's exclusion item decides whether its list exempts it."
