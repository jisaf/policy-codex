id: CO-1333
name: Disability verification document received
identifier: disability_verification_document_received
kind: supplied
type: yes/no
scope: person
program: All
meaning: Whether the agency has received documentary evidence (or an acceptable collateral contact) verifying the person's disability for this application, such as an award letter for disability benefits, a VA rating statement, or a physician's statement.
supplied_by: Date-stamped document receipt and collateral-contact entries in the CBMS case file.
sources: [S807]
tags: [verification, disability]
rationale: No existing item in the volume carries this fact; the phase-9 verification chapter (design amended 2026-11-21) needs it, and it is program-neutral so every program's verification rules read the same value.
