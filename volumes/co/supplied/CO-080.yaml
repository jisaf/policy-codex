id: CO-080
name: Pretax deductions
identifier: pretax_deductions
kind: supplied
type: money
scope: person-month
program: All
meaning: The person's monthly above-the-line deductions under 26 U.S.C. 62 (for example student loan interest, an IRA deduction, or the deductible part of self-employment tax) that 10 CCR 2505-10 8.100.4.C.1.e allows to be subtracted from taxable gross income to reach Adjusted Gross Income.
precision: Monthly amount for the month in context; the specific deduction categories are 26 U.S.C. 62, incorporated by reference in 8.100.4.C.1.e, which this volume treats as an external fact rather than a derived tax-law computation.
supplied_by: Applicant statement (CBMS/PEAK), verified through documentation where questionable.
sources: []
tags: [ma, magi, income]
rationale: "No existing item carries above-the-line deductions. ma_person_magi_income (CO-502) needs a single subtraction fact for 42 CFR 435.603(e)'s 'financial methodologies used to determine modified adjusted gross income' and 8.100.4.C.1.e's allowable deductions, rather than modeling each of 26 U.S.C. 62's dozen deduction categories as its own item."
