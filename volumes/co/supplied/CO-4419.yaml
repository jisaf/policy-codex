id: CO-4419
name: "Date the replacement proceeds were received"
identifier: replacement_proceeds_received_date
kind: supplied
type: calendar date
scope: person
program: All
meaning: "The date the person received the proceeds replacement_proceeds_held_value (CO-4417) states."
precision: "Stated with replacement_proceeds_held_value; where proceeds came in more than one payment, the date of the first."
supplied_by: "The insurer's, purchaser's or agency's payment record."
sources: [S3206]
tags: [resources]
rationale: "Coverage review F-6: the periods of 9 CCR 2503-5 3.520.77.E and F (S3206) run \"from the date the client receives such sums\"."
