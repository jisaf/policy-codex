id: CO-2232
name: Transfer penalty apportioned between spouses
identifier: ma_transfer_penalty_is_apportioned_with_spouse
kind: supplied
type: yes/no
scope: person
program: Medicaid
meaning: "Whether the period of ineligibility from a transfer of assets is apportioned equally between this person and the person's spouse because the spouse became institutionalized and is otherwise eligible for Medical Assistance (10 CCR 2505-10 § 8.100.7.F.8.a)."
supplied_by: The Eligibility Site's transfer-of-assets penalty determination (CBMS).
sources: [S1507]
tags: [ma, ltc, legal]
rationale: "OQ-94: § 8.100.7.F.8 splits the penalty period between institutionalized spouses; no fact stated it."
