id: CO-1504
name: Deceased Colorado Works client
identifier: is_deceased_colorado_works_client
kind: supplied
type: yes/no
scope: person
program: ColoradoWorks
meaning: The person has died and is a deceased Colorado Works client - one who received Colorado Works while alive and whose case was active in the county at death - so that a death reimbursement benefit may be paid toward the funeral, burial or cremation, per 9 CCR 2503-6 3.606.7.A.1, B.1 and F ("The county department in which the deceased client's case is active"). False for a living person.
supplied_by: County department's application for funeral/burial/cremation assistance and the statewide automated system's Colorado Works case record.
sources: [S1005, S1006]
tags: [cash, tanf]
rationale: "No existing fact states this (phase-8 review K-1). died_while_receiving_af_or_medicaid (CO-1220) names the Adult Financial burial program's decedents (OAP, AND, HCA, Medicaid) and does not cover a Colorado Works client who was not on one of them; the two programs' benefits are separate (3.570.43 and 3.606.7), so a separate fact keeps each meaning exact."
nearest: [CO-1220]
