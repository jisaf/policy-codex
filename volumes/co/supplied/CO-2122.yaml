id: CO-2122
name: LEAP application date
identifier: leap_application_date
kind: supplied
type: calendar date
scope: case
program: LEAP
meaning: "The date the household's LEAP application was made for the program year (9 CCR 2503-7 3.751.1 \"Point in Time\": eligibility is determined from the household's circumstances on this date)."
precision: "One value for the case; LEAP reads no default."
supplied_by: "Date the county received the LEAP application (PEAK, mail or in person)."
sources: [S776]
tags: [household]
rationale: "OQ-137: LEAP is decided once per program year from the application-date circumstances; no fact named that date. leap_is_eligible (CO-1007) and leap_benefit_amount (CO-1281) read it. Dual-entry audit 1.13-1.17 and 5.9 (OQ-541, same-word SW-9): a fact about the application or the home has one value per case (convention rule 18), stated once in the case's case_facts instead of on each member."
