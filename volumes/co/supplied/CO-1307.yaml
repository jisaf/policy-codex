id: CO-1307
name: Citizenship attestation is questionable
identifier: citizenship_attestation_is_questionable
kind: supplied
type: yes/no
scope: person
program: All
meaning: "Whether the agency has found the person's statement about U.S. citizenship questionable: inconsistent with the person's other statements, the application, earlier applications, documents provided, or information from another source, as the agency documents in the case record."
precision: The programs' guidelines forbid finding a claim questionable on surname, accent, appearance or limited English (4.505.51.B, 3.520.67.D, 3.753.111); the supplier applies them.
supplied_by: Eligibility worker's documented determination in CBMS case comments.
sources: [S827, S886, S895]
tags: [verification, immigration]
rationale: No existing item in the volume carries this fact; the phase-9 verification chapter (design amended 2026-11-21) needs it, and it is program-neutral so every program's verification rules read the same value.
