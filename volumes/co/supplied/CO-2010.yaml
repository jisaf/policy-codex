id: CO-2010
name: "Home Care Allowance: lives in a temporary setting"
identifier: af_resides_in_temporary_setting
kind: supplied
type: yes/no
scope: person-month
program: AdultFinancial
meaning: "Whether, in the month, the person lives in a temporary setting other than a homeless shelter (a shelter is is_homeless), which 9 CCR 2503-5 3.570.12 excludes from \"home\" for the Home Care Allowance: \"A home cannot include a homeless shelter or other temporary setting.\" If not stated, Adult Financial reads this as false."
supplied_by: County department living-arrangement record (CBMS).
sources: [S718]
tags: [cash]
rationale: "No existing fact states another temporary setting; af_hca_eligibility_status (CO-1217) read only a facility stay and a homeless shelter (OQ-250)."
