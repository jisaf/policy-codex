id: CO-4319
name: "Prorated income held value"
identifier: prorated_income_held_value
kind: supplied
type: money
scope: person
program: All
meaning: "The part of the person's liquid resources (liquid_resources_value) that is income received for a period it is meant to cover - self-employment receipts that are the household's support for the year, pay under an annually renewable contract paid over part of the year, or a term's educational assistance - and still held during that period."
precision: "Part of liquid_resources_value, not added to it. As of the determination date. If not stated, SNAP reads it as 0."
supplied_by: "Applicant statement; bank statements and the records of the income."
sources: [S3130, S3113]
tags: [snap, resources]
rationale: "Coverage review snap-financial CF-3 (matrix 4.410.C): once SNAP averages self-employment and contract income over the period it covers (CO-4324, CO-1702), 10 CCR 2506-1 4.410.C (S3130) exempts as a resource the money so prorated while a portion is still counted as income; liquid_resources_value counts it."
