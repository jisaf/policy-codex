id: CO-1744
name: "CCCAP: caretaker is incapacitated"
identifier: cccap_caretaker_is_incapacitated
kind: supplied
type: yes/no
scope: person
program: CCCAP
meaning: "In a two-caretaker household, this adult caretaker or teen parent is incapacitated, as verified by a physician or other medical verification, so that 8 CCR 1403-1 3.111.D.1.c.3 excuses the caretaker from being in an eligible activity."
precision: "A finding about the caretaker's capacity, not SNAP's 'unfit for employment' statement (has_medical_statement_of_unfitness, CO-043). If not stated, CCCAP reads this as false (not incapacitated)."
supplied_by: "Physician's statement or other medical verification."
sources: [S497]
tags: [household, medical]
rationale: "Vocabulary fix round (docs/reviews/vocabulary-reuse.md, R-12): cccap_household_caretakers_in_eligible_activity (CO-991) read SNAP's medical statement of unfitness for employment for a caretaker 'incapacitated' under 3.111.D.1.c.3; fitness for employment and capacity to care for a child are different medical findings."
