id: CO-4418
name: "Kind of property the proceeds are to restore or replace"
identifier: replacement_proceeds_property_type
kind: supplied
type: one of
scope: person
program: All
options: [personal_property, real_property]
meaning: "The kind of property replacement_proceeds_held_value (CO-4417) is to restore or replace: personal_property (a vehicle, household goods or other personal property) or real_property (the home or other real property; home-sale, relocation and condemnation proceeds are always real_property)."
precision: "Stated with replacement_proceeds_held_value."
supplied_by: "The insurer's or purchaser's record, as the county establishes it."
sources: [S3206]
tags: [resources]
rationale: "Coverage review F-6: 9 CCR 2503-5 3.520.77.E (S3206) allows three months for personal property and six for real property."
