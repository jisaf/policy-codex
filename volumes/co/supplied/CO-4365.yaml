id: CO-4365
name: Lump sum amounts spent or designated for costs
identifier: lump_sum_amounts_spent_or_designated
kind: supplied
type: money
scope: person-month
program: All
meaning: "Of the insurance proceeds, personal-injury award or other lump sum the person received in the month (stated in lump_sum_received and the unearned income facts), the amount spent, to be spent, designated or legally obligated for: the insured person's last illness and burial, where not covered by other benefits (life insurance proceeds); medical care (health insurance proceeds or a personal-injury award); or legal fees related to obtaining the payment, medical bills, funeral and burial expenses, or income taxes on it (any lump sum). 0 if none."
precision: "Part of the amounts the unearned income facts state, not added to them. If not stated, Colorado Works reads it as 0."
supplied_by: Applicant statement, with the bills, the fee agreement or the settlement statement.
sources: [S3157, S3163]
tags: [income]
rationale: "Coverage review CW-14 (P1): 9 CCR 2503-6 3.605.3.A.5-6 and 3.605.4.B.33 (S3157, S3163) count insurance and injury proceeds, and lump sums, only beyond the amounts spent or designated for these costs; the unearned income facts are gross and no fact stated the costs. Program-neutral: it states the costs of the receipt; cw_unearned_income_deductions (CO-4369) subtracts it."
