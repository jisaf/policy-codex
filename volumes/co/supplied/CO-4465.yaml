id: CO-4465
name: "Self-employment is a farm operation"
identifier: self_employment_is_farm_operation
kind: supplied
type: yes/no
scope: person
program: All
meaning: "The person's self-employment is the operation of a farm on the person's own account, as an owner, renter or tenant farmer."
precision: "Stated for a self-employed person; if not stated, every program reads it as false (non-farm self-employment). The farm's receipts and costs are stated in the ordinary self-employment facts (self_employment_gross_receipts, CO-1700; self_employment_operating_costs, CO-3370; self_employment_interest_costs, CO-3371)."
supplied_by: "Applicant statement, tax schedule F or farm records."
sources: [S3263]
tags: [income]
rationale: "Coverage round (docs/reviews/coverage-cccap.md, F-20): 8 CCR 1403-1 3.111.I.3 (S3263) counts farm self-employment as gross receipts minus operating expenses, which include \"Interest on farm mortgages\", where non-farm self-employment (I.2) lists no interest. No fact said whether the self-employment is a farm, so CCCAP could not tell the two apart."
