id: CO-2379
name: "CCCAP: redetermination date"
identifier: cccap_redetermination_date
kind: supplied
type: calendar date
scope: case
program: CCCAP
meaning: "The date of the CCCAP redetermination of eligibility being processed for the household (8 CCR 1403-1 3.111.H.5.e.2, 3.111.K.2.c); not stated at an initial application."
precision: "One value for the case. Stated only when cccap_determination_type (CO-3307) is redetermination."
supplied_by: "CHATS redetermination record."
sources: [S1631]
tags: [verification]
rationale: "OQ-373: at redetermination unreturned verification closes the case rather than denying an application (3.111.H.5.e.2, S1631), and court-ordered child support is verified again at each redetermination (K.2.c); no fact said a CCCAP determination was a redetermination or when. Dual-entry audit 1.13-1.17 and 5.9 (OQ-541, same-word SW-9): a fact about the application or the home has one value per case (convention rule 18), stated once in the case's case_facts instead of on each member."
