id: CO-1239
name: Incurs heating or cooling costs
identifier: incurs_heating_cooling_cost
kind: supplied
type: yes/no
scope: person
program: SNAP
meaning: The person's household incurs or anticipates heating or cooling costs separate and apart from its rent or mortgage - including a private-rental household billed by its landlord on individual usage or charged a flat rate separately from rent for heating and cooling, a household sharing a residence that incurs at least a portion of the heating or cooling cost, and a public-housing household responsible for excess heating or cooling costs - per 10 CCR 2506-1 4.407.31.A.1.a, c, d, e. A space heater, electric blanket, heat lamp, cooking stove or similar supplemental heating source does not count (A.3); fans are not a cooling cost (A.1). A household incurring these costs on an irregular basis keeps the allowance between billing periods (A.2). Stated on any member; snap_utility_allowance_amount (CO-1500) takes the highest tier any member's utility facts reach.
supplied_by: Applicant statement; client statement is acceptable unless questionable.
sources: [S743]
tags: [income, snap]
rationale: No existing fact states whether a SNAP household incurs heating or cooling costs (is_responsible_for_heating_costs, CO-876, is LEAP's narrower heating-only test); snap_entitled_to_heating_cooling_allowance (CO-1243) needs it.
nearest: [CO-876]
