id: CO-1330
name: Household composition verification document received
identifier: household_composition_verification_document_received
kind: supplied
type: yes/no
scope: person
program: All
meaning: Whether the agency has received documentary evidence (or an acceptable collateral contact) verifying the person's household composition or relationships for this application, such as a birth certificate, court order, school or medical record naming the caretaker, or a collateral contact.
supplied_by: Date-stamped document receipt and collateral-contact entries in the CBMS case file.
sources: [S808, S863, S872]
tags: [verification, household]
rationale: No existing item in the volume carries this fact; the phase-9 verification chapter (design amended 2026-11-21) needs it, and it is program-neutral so every program's verification rules read the same value.
