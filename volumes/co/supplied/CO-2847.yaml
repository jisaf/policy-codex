id: CO-2847
name: Child welfare payment type
identifier: child_welfare_payment_type
kind: supplied
type: one of
scope: person
program: All
options: [none, title_iv_e_foster_care, state_funded_foster_care, title_iv_b_services_only, title_iv_e_adoption_assistance, state_subsidized_adoption, title_iv_e_kinship_guardianship, state_kinship_guardianship]
meaning: "The child welfare payment or service the person (a child) receives this month, as the child welfare record shows it: none; title_iv_e_foster_care (Title IV-E foster care maintenance payments); state_funded_foster_care (foster care paid by the State or county outside Title IV-E); title_iv_b_services_only (a child in foster care receiving Title IV-B child welfare services without IV-E payments); title_iv_e_adoption_assistance; state_subsidized_adoption (a subsidized adoption paid outside Title IV-E); title_iv_e_kinship_guardianship (Title IV-E kinship guardianship assistance); state_kinship_guardianship."
supplied_by: The child welfare (Trails) case record.
sources: [S409, S844, S854, S1717, S1952]
tags: [household]
rationale: "Same-word audit SW-8 and dual-entry audit 3.21: one child welfare record was stated by three overlapping facts (CO-841 for Colorado Works, CO-1587 for Medicaid verification, CO-2415 for the Medicaid needy-person groups) that could disagree. Each is now derived from this one statement."
