id: CO-1989
name: Is an American Indian or Alaska Native (CHP+ § 330.1)
identifier: chp_is_american_indian_or_alaska_native
kind: supplied
type: yes/no
scope: person
program: CHP+
meaning: "Whether the person is an American Indian or Alaska Native as 10 CCR 2505-3 § 330.1 defines American Indian for the CHP+ cost-sharing exemption: a member of a federally recognized Indian tribe, band, or group, or a descendant in the first or second degree of any such member."
supplied_by: The application's tribal membership or descent question.
sources: [S1236]
tags: [chp]
rationale: "OQ-64: § 330.1's definition (tribal member or first or second degree descendant) is neither SNAP's (snap_is_indian_or_urban_indian, CO-050) nor 42 CFR 447.51's (ma_is_indian, CO-1938)."
