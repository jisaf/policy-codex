id: CO-4503
name: "Kinship care payments received"
identifier: kinship_care_payments_received
kind: supplied
type: money
scope: person-month
program: All
meaning: "Money the person received in the month from a child welfare agency for the care of a child living with the person under a kinship arrangement: kinship guardianship assistance, or a kinship foster care or kinship care payment for a relative's or kin's child placed in the person's home."
precision: "Part of the person's gross unearned income for the month as the unearned income facts state it (other_unearned_income_taxable or other_unearned_income_nontaxable), not added to it. A foster care payment for a non-kin placement is foster_care_provider_payments_received (CO-3821), not this fact. If not stated, every program reads it as 0."
supplied_by: "The child welfare (Trails) payment record."
sources: [S3300]
tags: [income]
rationale: "Coverage review C-1: 9 CCR 2503-7 3.752.23.U (S3300) excludes \"Payment received as foster care/kinship income\". foster_care_provider_payments_received (CO-3821) states foster care payments; nothing stated a kinship payment, so LEAP counted it. The fact states the receipt, program-neutrally (convention rule 13)."
nearest: [CO-3821]
