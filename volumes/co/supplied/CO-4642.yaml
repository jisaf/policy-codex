id: CO-4642
name: "Personal property held as an investment"
identifier: investment_personal_property_value
kind: supplied
type: money
scope: person
program: All
meaning: "The current market value of personal property the person acquired or holds for its value or as an investment: gems, jewelry not worn or held for family significance, collectibles and the like. Not part of any other resource fact."
precision: "As of the determination date. If not stated, every program reads it as 0."
supplied_by: "Application (resources), with appraisals."
sources: [S3421]
tags: [resources]
rationale: "Coverage review NM-27: 10 CCR 2505-10 § 8.100.5.M.3.j counts personal effects held as an investment; no fact stated them, so they were never counted."
