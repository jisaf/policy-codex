id: CO-1512
name: Adult Financial in-kind support and maintenance amount
identifier: af_in_kind_support_and_maintenance
kind: supplied
type: money
scope: person-month
program: AdultFinancial
meaning: The In-Kind Support and Maintenance (ISM) amount the county determines for this person for the month under 9 CCR 2503-5 3.520.79 - zero for a client who owns and lives in the residence, receives subsidized housing, is homeless, pays a fair share of market-value shelter costs, or pays shelter costs at least the maximum ISM (B.1-5); otherwise the maximum ISM less what the client pays, or the lesser of the fair share and the maximum less what the client pays, or the full maximum when all shelter is provided (C.1-3); and the matching amount when the Social Security Administration charges an SSI client an ISM (B.6).
precision: The county's valuation enters as stated; af_countable_income (CO-946) caps it at af_ism_maximum (CO-1513) and counts it only for an OAP-age or AND-CS client, the two programs 3.520.79 names. Not the same figure as ssi_in_kind_support_and_maintenance (CO-802), the SSI-methodology valuation the Medicaid chapter reads.
supplied_by: County eligibility worker's Adult Financial shelter-cost and ISM determination (CBMS), from the client's statement of shelter costs (3.520.79.A).
sources: [S1012]
tags: [cash, oap, and, income]
rationale: "No existing fact states the Adult Financial ISM (phase-8 review K-4). ssi_in_kind_support_and_maintenance (CO-802) is the nearest fact, but it is the SSI presumed-maximum-value figure under 20 CFR 416.1130-416.1140 that the Medicaid SSI-related budget reads; 3.520.79 values the Adult Financial ISM by its own fair-share and market-value steps and its own maximum, so reusing CO-802 would give the two programs one number with two meanings."
nearest: [CO-802]
