id: CO-801
name: "SSI-method countable resources, couple"
identifier: ssi_countable_resources_couple
kind: supplied
type: money
scope: person
program: All
meaning: The combined countable resources of this person and a spouse living together as of the current month, after the 20 CFR 416.1210 and 8.100.5.M.2 exclusions - the figure 8.100.5.M.1's $3,000 couple resource limit, and § 8.100.7.O.1's ongoing CSRA-plus-$2,000 test, are compared against. Stated once, on one spouse; readers take it through ssi_countable_resources_of_couple (CO-2861). Not stated for an unmarried person.
supplied_by: "The attested value of the couple's resources, as the case record holds it, valued under the 20 CFR 416.1210 and 8.100.5.M.2 exclusions and redetermined each review; it is the attested value until a resources verification element requires documents (ma_requires_verification_of_resources, CO-1405; a Medicare Savings Program applicant's non-liquid resources are taken on attestation, 42 CFR 435.952(e)(2)(i)), and then the county worker's determination from both spouses' account statements and property records (heavier-definitions audit H-15: the fact is the person's circumstance as stated; documents belong to the *_verification_document_received facts and the verification items, which ask for them only where a program's rule requires it)."
sources: [S301]
tags: [non_magi, resources]
rationale: "The case already states this fact for CO-01's p1 and p2 (46000), but no item in this volume carries it yet; the phase-4 brief's interface fixes this identifier and directs creating it in this batch. ma_ssi_countable_resources (CO-608) needs it for a married applicant whose spouse is living with them; ma_institutionalized_spouse_countable_resources (CO-647) reads it for the ongoing § 8.100.7.O.1 test. It is the current-month figure, distinct from ma_spousal_resources_at_snapshot (CO-888), the § 8.100.7.L intake assessment ma_csra (CO-646) reads - the phase-4 review's C-13 finding: the two can differ once the couple spends down. Vocabulary fix round (docs/reviews/vocabulary-reuse.md, C-2): renamed so the name says the figure is countable under the SSI method (20 CFR 416.1210), not under every program's rule. Adult Financial reads it on the stated assumption that 3.520.72's resources are the same figure (af_countable_resources, CO-947)."
