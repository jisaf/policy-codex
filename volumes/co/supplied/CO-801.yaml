id: CO-801
name: Countable resources (couple)
identifier: countable_resources_couple
kind: supplied
type: money
scope: person
program: All
meaning: The combined countable resources of this person and a spouse living together as of the current month, after the 20 CFR 416.1210 and 8.100.5.M.2 exclusions - the figure 8.100.5.M.1's $3,000 couple resource limit, and § 8.100.7.O.1's ongoing CSRA-plus-$2,000 test, are compared against.
supplied_by: County eligibility worker's resource determination (CBMS resource screen), from verified account statements and property records for both spouses, redetermined each review.
sources: [S301]
tags: [non_magi, resources]
rationale: "The case already states this fact for CO-01's p1 and p2 (46000), but no item in this volume carries it yet; the phase-4 brief's interface fixes this identifier and directs creating it in this batch. ma_ssi_countable_resources (CO-608) needs it for a married applicant whose spouse is living with them; ma_institutionalized_spouse_countable_resources (CO-647) reads it for the ongoing § 8.100.7.O.1 test. It is the current-month figure, distinct from countable_resources_couple_at_snapshot (CO-888), the § 8.100.7.L intake assessment ma_csra (CO-646) reads - the phase-4 review's C-13 finding: the two can differ once the couple spends down."
