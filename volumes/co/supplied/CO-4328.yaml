id: CO-4328
name: "Self-employment start date"
identifier: self_employment_start_date
kind: supplied
type: calendar date
scope: person
program: All
meaning: "The date the person's self-employment enterprise began operating."
precision: "If not stated, SNAP reads the enterprise as in operation for at least the twelve months it averages."
supplied_by: "Applicant statement; business registration or first receipts."
sources: [S3114]
tags: [snap, income]
rationale: "Coverage review snap-financial CF-3: an enterprise in business less than a year is averaged over the period it has operated (4.403.12.D, S3114)."
