id: CO-4364
name: Rental property expenses paid
identifier: rental_property_expenses_paid
kind: supplied
type: money
scope: person-month
program: All
meaning: "The expenses the person paid in the month on rental property whose rent is stated in the person's unearned income facts (property the person does not actively manage): maintenance, property taxes, management fees, interest on a mortgage on the property, and utilities. Not the purchase of the property or payments on the principal of a loan for it. 0 if none."
precision: "If not stated, Colorado Works reads it as 0. The rent itself stays in other_unearned_income_taxable (CO-1714) as the gross amount received."
supplied_by: Applicant statement, with receipts, tax bills, the mortgage statement and utility bills.
sources: [S3157]
tags: [income]
rationale: "Coverage review CW-14 (P1): 9 CCR 2503-6 3.605.3.A.2 (S3157) counts rental income \"to the extent it exceeds allowable expenses\", but the unearned income facts are gross and no fact stated the expenses. Program-neutral: it states what the person paid; cw_unearned_income_deductions (CO-4369) subtracts it."
