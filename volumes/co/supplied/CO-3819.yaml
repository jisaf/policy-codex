id: CO-3819
name: "Short-term employment ended through the person's own fault"
identifier: short_term_employment_ended_through_own_fault
kind: supplied
type: yes/no
scope: person-month
program: All
meaning: "The person's short-term employment (short_term_employment_wages) ended because the person was terminated, or quit, through the person's own fault."
precision: "If not stated, Colorado Works reads this as false."
supplied_by: "Applicant statement, the employer's record, as the county establishes it."
sources: [S2604]
tags: [cash, income]
rationale: "Final cash review FC-2 and FC-3: Colorado Works' and Adult Financial's exclusion items (CO-2340 to CO-2343) summed a closed list of neutral receipt facts, so income the current exempt-income lists name could not be excluded and was counted. 3.605.2.C (S2604) leaves short-term wages out \"as long as the client has not been terminated or has terminated the employment due to a fault of their own\"; no fact stated that condition."
