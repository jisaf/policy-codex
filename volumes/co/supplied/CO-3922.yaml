id: CO-3922
name: Gross wages per pay period
identifier: wages_gross_per_pay_period
kind: supplied
type: money
scope: person
program: All
meaning: "The gross wages the person is paid for one pay period of the schedule wages_pay_frequency (CO-3921) states, before anything withheld: the regular gross pay; when the pay varies, the average gross pay of the pay periods paid in the eight weeks before the application date."
precision: "Work-study earnings are not included. Stated with wages_pay_frequency; a person with no wages needs no value."
supplied_by: Pay stubs or the employer's statement for the eight weeks before the application.
sources: [S2713]
tags: [income]
open: [OQ-681]
rationale: "Final pass F-09 (SW-35): LEAP's earned ongoing income is \"the countable gross income in any four (4) weeks of the eight (8) weeks prior to the application date\", made monthly by adding four weekly, two bi-weekly or two semi-monthly gross amounts (9 CCR 2503-7 3.752.22.B-C, S2713). The amount of one pay is the neutral fact; the number of pays each program adds is the program's own."
nearest: [CO-023]
