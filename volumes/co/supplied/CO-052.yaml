id: CO-052
name: Lived in an ABAWD waiver area for the month
identifier: abawd_waiver_area_month
kind: supplied
type: yes/no
scope: person-month
program: SNAP
meaning: The person lived, for the month, in a Colorado area covered by an FNS-approved ABAWD time-limit waiver.
supplied_by: FNS-approved waiver determination, mapped to the person's county of residence for the month.
sources: []
tags: [abawd, state_election]
rationale: "A fact the case must supply; no existing item in the Colorado volume carries it (the volume began empty in phase 1, and the mwr volume's facts are not shared across volumes). It is reserved for the SNAP income, deduction, work registration and ABAWD rules of later batches, which read it by this identifier."
