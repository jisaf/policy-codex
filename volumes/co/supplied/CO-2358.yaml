id: CO-2358
name: "Sponsor's spouse unearned income"
identifier: sponsor_spouse_unearned_income
kind: supplied
type: money
scope: person-month
program: All
meaning: "The gross unearned income for the month of the spouse of this non-citizen's sponsor."
precision: "If not stated, a program reads this as 0."
supplied_by: "Sponsor's income documents, as provided by the sponsored non-citizen."
sources: [S1627]
tags: [income, immigration]
rationale: "OQ-103: 3.605.1.A.5 (S1627) deems the net income of a sponsor and the sponsor's spouse to a sponsored non-citizen in the assistance unit; no fact stated the sponsor's income. The fact is stated on the sponsored non-citizen, since the sponsor seldom lives in the home, and is neutral so that every program's sponsor rule can read it."
