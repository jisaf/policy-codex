id: CO-899
name: Medicare Part D premium paid
identifier: medicare_part_d_premium_paid
kind: supplied
type: money
scope: person-month
program: Medicaid
meaning: This institutionalized person's monthly Medicare Part D premium, deductible from the patient payment as an ongoing deduction, per 10 CCR 2505-10 § 8.100.7.V.3.b.ii.8)b).
supplied_by: Eligibility Site's verification of the Medicare Part D premium amount (plan premium billing), 0 when not applicable.
sources: [S542]
tags: [ma, ltc, income]
rationale: "No existing item states the institutionalized person's Medicare Part D premium as a patient-payment deduction; unlike Part B (8)a)), 8)b) makes this an ongoing deduction with no first-two-months limitation. The premium figure is plan-specific and not in any fetched document, so it is a supplied fact. ma_medicare_part_d_ltc_deduction (CO-669) reads it."
nearest: [CO-835, CO-894]
