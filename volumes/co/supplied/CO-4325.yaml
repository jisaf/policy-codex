id: CO-4325
name: "Annual contract pay"
identifier: annual_contract_pay
kind: supplied
type: money
scope: person
program: All
meaning: "The pay for one year under the person's employment contract that is renewable each year (a school employee's annual salary, for example, whether the contract is renewed in writing, automatically or by tenure), when the contract pays other than by the hour or by the piece; 0 when the person has no such contract."
precision: "If not stated, SNAP reads it as 0 and counts the wages as received (annual_contract_wages_received, CO-4326, gives the part of each month's wages paid under the contract)."
supplied_by: "The employment contract."
sources: [S3115, S3113]
tags: [snap, income]
rationale: "Coverage review snap-financial CF-3: SNAP averages annual contract income over twelve months (4.403.3, S3115; 4.402.2.A.2, S3113); no fact stated the year's contract pay."
