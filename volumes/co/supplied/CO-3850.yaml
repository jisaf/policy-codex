id: CO-3850
name: "Purchase date of the newest life insurance policy"
identifier: life_insurance_newest_policy_purchase_date
kind: supplied
type: calendar date
scope: person
program: All
meaning: "The date the person bought the most recently purchased of the life insurance policies the person owns."
precision: "Stated with life_insurance_cash_surrender_value (CO-3396) for a person who owns a policy with a cash value; read by Adult Financial for an OAP client whose policies' total face value is over $1,500."
supplied_by: "Applicant statement, the policies."
sources: [S2618]
tags: [cash, oap, resources]
rationale: "Final cash review FC-8: af_person_countable_resources (CO-3400) counted the whole cash surrender value of life insurance over $1,500 face value, though 9 CCR 2503-5 3.520.75.E-F (S2618) exempt it for an OAP client whose policies are more than forty-eight months old, and it never counted revocable burial funds or excess burial spaces, which 3.520.72.B.8-9 (S2619) count. No fact stated when a policy was bought."
