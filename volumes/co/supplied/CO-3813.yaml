id: CO-3813
name: "Crime victim compensation received"
identifier: crime_victim_compensation_received
kind: supplied
type: money
scope: person-month
program: All
meaning: "Money the person received in the month as compensation under the Colorado Crime Victim Compensation Act (C.R.S. title 24, article 4.1) or from another State's fund to aid victims of crime."
precision: "Part of the person's gross unearned income for the month as the unearned income facts state it (other_unearned_income_taxable or other_unearned_income_nontaxable, or the fact that names the source), not added to it. If not stated, every program reads it as 0."
supplied_by: "Applicant statement, crime victim compensation award."
sources: [S2605, S2608, S2609]
tags: [cash, income]
rationale: "Final cash review FC-2 and FC-3: Colorado Works' and Adult Financial's exclusion items (CO-2340 to CO-2343) summed a closed list of neutral receipt facts, so income the current exempt-income lists name could not be excluded and was counted. 3.605.4.A.8 (S2605) and 3.520.786.J (S2608) exempt crime victim compensation; 20 CFR 416.1124(c)(17) (S2609) also excludes it. The fact states the receipt, program-neutrally (convention rule 13); each program's exclusion item decides whether its list exempts it."
