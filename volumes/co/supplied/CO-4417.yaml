id: CO-4417
name: "Proceeds held to restore or replace property"
identifier: replacement_proceeds_held_value
kind: supplied
type: money
scope: person
program: All
meaning: "The part of the person's liquid resources (liquid_resources_value) that is proceeds the person holds and has stated in writing will be used to restore or replace property the person owned and lived in or used (proceeds of fire or casualty insurance on the property; or proceeds of the sale of the person's home, a relocation payment or a governmental condemnation award, net of encumbrances and sales expenses), less what has been paid or contracted in writing for the restoration or replacement."
precision: "Part of liquid_resources_value, not added to it; as of the determination date. Stated with replacement_proceeds_property_type (CO-4418) and replacement_proceeds_received_date (CO-4419). If not stated, Adult Financial reads it as 0."
supplied_by: "The insurer's, purchaser's or agency's payment record and the person's signed statement of use, as the county establishes them."
sources: [S3206]
tags: [resources]
rationale: "Coverage review F-6: 9 CCR 2503-5 3.520.77.E and F (S3206) exempt insurance proceeds used to restore or replace an exempt resource, for three months (personal property) or six (real property), and home-sale, relocation and condemnation proceeds used for a replacement home, for six months, from the date received; no fact stated such proceeds."
