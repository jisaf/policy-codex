id: CO-1342
name: Heating costs verification document received
identifier: heating_costs_verification_document_received
kind: supplied
type: yes/no
scope: person
program: All
meaning: Whether the agency has received documentary evidence (or an acceptable collateral contact) verifying the person's estimated home heating costs and vulnerability to them for this application, such as a fuel vendor's billing history or a rental agreement showing heat costs.
supplied_by: Date-stamped document receipt and collateral-contact entries in the CBMS case file.
sources: [S897]
tags: [verification]
rationale: No existing item in the volume carries this fact; the phase-9 verification chapter (design amended 2026-11-21) needs it, and it is program-neutral so every program's verification rules read the same value.
