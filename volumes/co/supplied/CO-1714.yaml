id: CO-1714
name: "Other unearned income, federally taxable"
identifier: other_unearned_income_taxable
kind: supplied
type: money
scope: person-month
program: All
meaning: "The person's unearned income received for the month that no other income fact names and that is federally taxable: interest (other than tax-exempt interest), dividends, rents and royalties from property the person does not actively manage, alimony under a divorce or separation executed before 2019, and income from an estate or trust. Stated as the gross amount received for the month, before any deduction withheld and before any program's exclusions or disregards; each program's own rule decides what it counts."
precision: "MAGI-based income reads it (10 CCR 2505-10 8.100.4.C.1.b); so does every other program's unearned income, together with other_unearned_income_nontaxable (CO-030). Taxable items that are not income received in cash (capital gains, cancelled debt, a partnership share) are other_taxable_income (CO-079), read by MAGI only."
supplied_by: "Applicant statement, bank and brokerage statements, Form 1099."
sources: [S166, S42]
tags: [income]
rationale: "Vocabulary fix round (docs/reviews/vocabulary-reuse.md, R-1): split from other_unearned_income so MAGI counts only the taxable part."
