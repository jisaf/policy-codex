id: CO-008
name: Institution entry date
identifier: institution_entry_date
kind: supplied
type: calendar date
scope: person
program: All
meaning: "The date the person entered the institution where the person now lives (a hospital, nursing facility or other medical institution, or another institution that provides the person's meals). Each program decides whether that institution is one its rule names."
supplied_by: Institution admission record.
sources: [S3, S354]
tags: [household]
rationale: "A fact the case must supply; no existing item in the Colorado volume carries it (the volume began empty in phase 1, and the mwr volume's facts are not shared across volumes). It is read by SNAP: is a household member (not excluded as an institution resident). Same-word audit SW-20 and SW-38: the meaning named SNAP's institution fact while Medicaid read it for a medical institution; it now states the entry date neutrally, with the excerpts each reader cites."
