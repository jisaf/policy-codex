id: CO-1111
name: Is a widow or widower
identifier: is_widow_or_widower
kind: supplied
type: yes/no
scope: person
program: All
meaning: Whether the person is a widow or widower (10 CCR 2505-10 § 8.100.6.I.1.a).
precision: marital_status (CO-844) carries only single, married and other, so a widowed person is "other" there; this fact separates widowhood without changing the options the cash chapter reads.
supplied_by: Applicant statement on the application, verified against SSA survivor benefit records where the person receives widow(er)'s benefits.
sources: [S625]
tags: [ma, non_magi]
rationale: "marital_status (CO-844) lumps widowed persons into \"other\", and changing its options would change what the Colorado Works and Adult Financial rules read. ma_disabled_widow_eligible (CO-1162) needs widowhood itself."
