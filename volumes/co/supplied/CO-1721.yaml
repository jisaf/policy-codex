id: CO-1721
name: "Is attending high school"
identifier: is_attending_high_school
kind: supplied
type: yes/no
scope: person
program: All
meaning: "The person is still in high school (enrolled in grades 9 through 12, or the equivalent secondary program) and has not graduated or left."
precision: "No minimum course load. If not stated, a reader that needs it is unknown."
supplied_by: "School enrollment record or applicant statement."
sources: [S496]
tags: [household]
rationale: "Vocabulary fix round (docs/reviews/vocabulary-reuse.md, R-2): cccap_is_household_child (CO-990) reads 3.103.GGG's 'still in high school' for an 18-year-old; the shared is_enrolled_in_school it had read meant half-time secondary enrollment, a different test."
