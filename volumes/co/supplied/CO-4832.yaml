id: CO-4832
name: "Board-only payments received"
identifier: board_only_payments_received
kind: supplied
type: money
scope: person-month
program: All
meaning: "The payments the person received in the month from persons who pay to take regular meals in the person's home without lodging there (meals only). Not payments for room and meals (room_and_board_payments_received, CO-4161) or for a room only (room_only_payments_received, CO-4830); not the receipts of a commercial food business the person operates, which are self-employment gross receipts. 0 if none."
precision: "Part of other_unearned_income_taxable (CO-1714), not added to it; a program that counts it differently takes it out of that fact. If not stated, every program reads it as 0."
supplied_by: "Applicant statement, receipts, as the county establishes them."
sources: [S3159]
tags: [income]
nearest: [CO-4161, CO-1714]
rationale: "Coverage pass 3 CW3-1: 9 CCR 2503-6 3.605.2.E.4.c (S3159) counts a board-only payment as earned income above the one-person Food Assistance allotment per boarder and the documented costs of providing board. room_and_board_payments_received (CO-4161) states payments for room and meals together, which SNAP reads as boarder income (CO-4165), so a meals-only payment had no fact."
