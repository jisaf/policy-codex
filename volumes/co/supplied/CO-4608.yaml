id: CO-4608
name: "Income-producing property is used in a trade or business"
identifier: income_producing_property_is_used_in_trade_or_business
kind: supplied
type: yes/no
scope: person
program: All
meaning: "Whether the property income_producing_property_equity_value states is used in a trade or business the person runs, rather than held to produce rents or goods or services for the person's own use."
precision: "If not stated, Medicaid reads it as false."
supplied_by: "Application, with the business's books."
sources: [S3402]
tags: [resources]
rationale: "Coverage review NM-4: 10 CCR 2505-10 § 8.100.5.J.3 sets a return test for trade or business property that J.2 does not set for non-business property."
nearest: [CO-4607]
