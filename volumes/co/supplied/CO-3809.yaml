id: CO-3809
name: "Colorado Works: refused to assign child support rights"
identifier: cw_has_refused_child_support_assignment
kind: supplied
type: yes/no
scope: person
program: ColoradoWorks
meaning: "The client did not sign and date the Colorado Works application form, to avoid assigning to the State the rights to child support on the client's own behalf or on behalf of another member of the assistance unit (9 CCR 2503-6 3.604.4.A)."
precision: "If not stated, Colorado Works reads this as false: the signed application form carries the assignment."
supplied_by: "County department case record (the signed and dated application form)."
sources: [S2603]
tags: [cash, tanf, household]
rationale: "Final cash review FC-1: 3.604.4.A (S2603) says a client's failure to sign and date the application form to avoid assignment of support rights \"precludes eligibility for the assistance unit\". No fact stated it. The finding is the county's on the Colorado Works application, so it carries the program's prefix (convention rule 13 (i))."
