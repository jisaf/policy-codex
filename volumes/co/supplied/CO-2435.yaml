id: CO-2435
name: "Is enrolled in Medical Assistance"
identifier: is_enrolled_in_medical_assistance
kind: supplied
type: yes/no
scope: person
program: All
meaning: "Whether the person is enrolled in (receiving) Medical Assistance (Health First Colorado) at the determination date, as the CBMS / MMIS enrollment record shows: a fact about the person's Medicaid case, not this volume's own Medicaid determination. Read by Medicaid's presumptive eligibility bar (§ 8.100.3.R.8, \"already are in receipt of another medical assistance program\"), Colorado Works' lawful presence exemption for an eighteen-year-old who continues to be eligible for medical assistance (9 CCR 2503-6 3.604.3.I.4.b.6), and Adult Financial deeming from a spouse or parent \"receiving ... Medicaid assistance\" (3.534.C, 3.544.F, 3.549.F)."
precision: "If not stated, Adult Financial reads this as false (a relative not shown as enrolled); presumptive eligibility and Colorado Works read it as stated. Enrollment in the program the determination is itself renewing (a BCCP enrollee at her BCCP renewal) is not stated here: the fact records enrollment in another Medical Assistance program, as § 8.100.3.R.8's \"another medical assistance program\" says."
supplied_by: CBMS / MMIS enrollment record.
sources: [S1722, S1065, S1632, S1633, S1634, S610]
tags: [ma, cash]
rationale: "C-5 of the HCPF review. Heavier-definitions audit H-4 and dual-entry audit 3.16 (audit fix round): renamed from is_enrolled_in_medical_assistance through a change set that keeps the ID, made program All and widened beyond the presumptive eligibility bar; is_enrolled_in_medical_assistance (CO-2393), the same enrollment record stated for Adult Financial, is retired into it."
