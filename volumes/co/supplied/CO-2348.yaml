id: CO-2348
name: "Colorado Works: failed to apply for a Social Security number"
identifier: cw_has_failed_to_apply_for_ssn
kind: supplied
type: yes/no
scope: person
program: ColoradoWorks
meaning: "The county has found that this required assistance-unit member failed to apply for a Social Security number without a federally allowable reason under 20 CFR 422.107 for not attempting to obtain one, and has not since taken action to apply (9 CCR 2503-6 3.604.2.M.4)."
precision: "If not stated, Colorado Works reads this as false."
supplied_by: "County SSN enumeration record."
sources: [S1004]
tags: [cash, tanf, household]
rationale: "OQ-143: 3.604.2.M.4 (S1004) disqualifies a member who fails to apply for an SSN; no fact stated it, so cw_is_disqualified_member (CO-928) could not read it."
