id: CO-3814
name: "Child support arrears received"
identifier: child_support_arrears_received
kind: supplied
type: money
scope: person-month
program: All
meaning: "The part of child_support_received for the month that is a payment toward past-due support (arrears) rather than current support (stated on the child for whom it is paid)."
precision: "Part of child_support_received (CO-028), not added to it; at most child_support_received. If not stated, every program reads it as 0 (all of the support is current support)."
supplied_by: "Child support payment record (Child Support Services), applicant statement."
sources: [S2607, S2608]
tags: [cash, income]
rationale: "Final cash review FC-2 and FC-3: Colorado Works' and Adult Financial's exclusion items (CO-2340 to CO-2343) summed a closed list of neutral receipt facts, so income the current exempt-income lists name could not be excluded and was counted. 9 CCR 2503-6 3.605.5.D (S2607) says child support arrears are exempt and are not used for eligibility or the grant, and 9 CCR 2503-5 3.520.786.P (S2608) exempts arrears payments received for the client; child_support_received (CO-028) does not separate arrears from current support, so cw_counted_child_support (CO-2553) could not leave them out. The fact states the receipt, program-neutrally (convention rule 13); each program's exclusion item decides whether its list exempts it."
