id: CO-1226
name: Legally responsible persons are a couple
identifier: burial_responsible_persons_are_couple
kind: supplied
type: yes/no
scope: person
program: AdultFinancial
meaning: The decedent's legally responsible persons are a couple (for example both parents of an unemancipated minor), so the SSI couple resource limit applies; false when there is one legally responsible person, including a widow or widower, to whom the individual limit applies, per 9 CCR 2503-5 3.570.43.D.3.b.
supplied_by: County department determination.
sources: [S721]
tags: [cash, resources]
rationale: No existing fact distinguishes this; af_burial_responsible_person_excess_resources (CO-1229) needs it to pick the limit.
