id: CO-1705
name: "Colorado Works: cost of doing business for self-employment"
identifier: cw_self_employment_business_costs
kind: supplied
type: money
scope: person-month
program: ColoradoWorks
meaning: "The person's cost of doing business for the month that 9 CCR 2503-6 3.605.2.E.1 allows (rent of business premises or the room used at home, wholesale cost of merchandise, utilities, interest, taxes, labor, upkeep of necessary equipment; or, for a licensed child care provider, $55 for the first child and $22 for each additional child unless documented costs are higher), without depreciation of equipment, payments on the principal of loans for capital assets, or personal expenses."
precision: "Read only when self_employment_gross_receipts is more than zero."
supplied_by: "Self-employment ledger, receipts, profit and loss statement."
sources: [S1155]
tags: [cash, tanf, income]
rationale: "Vocabulary fix round (docs/reviews/vocabulary-reuse.md, R-1): each program's rule lists its own allowable costs of doing business, so the cost figure is the program's own fact; the gross receipts are shared (CO-1700)."
