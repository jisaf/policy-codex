id: CO-2387
name: "Sponsor's dependents"
identifier: sponsor_dependent_count
kind: supplied
type: whole number
scope: person
program: All
meaning: "Stated on a sponsor: the number of persons who are dependents of the sponsor (9 CCR 2503-5 3.534.D.2.C, 3.544.G.2.c, 3.549.G.2.c), other than the non-citizens the sponsor sponsors and their spouses, whether or not they are persons of the case."
precision: "Where a sponsor and a co-sponsor spouse both signed, it is stated on one of them only. If not stated, Adult Financial reads it as 0. A non-citizen the same sponsor sponsors is counted by Adult Financial from the sponsor edges, as a dependent of the sponsor other than the client (af_deemed_sponsor_income, CO-2386; OQ-553)."
supplied_by: "The sponsor's tax return or statement."
sources: [S1632]
open: [OQ-553]
tags: [immigration]
rationale: "OQ-114: Adult Financial deducts half the SSI benefit standard for each of the sponsor's dependents before deeming (S1632); no fact stated them.  Dual-entry audit 1.5 (audit fix round): the sponsor is a person of the case, joined to the non-citizen by the sponsor / sponsored_by relationship (volume.yaml), and the sponsor's income and resources are read from the sponsor's own facts, so two non-citizens with one sponsor read one set of facts. Stated on the sponsor, not on each non-citizen."
