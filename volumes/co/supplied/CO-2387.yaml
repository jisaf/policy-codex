id: CO-2387
name: "Sponsor's dependents"
identifier: sponsor_dependent_count
kind: supplied
type: whole number
scope: person
program: All
meaning: "Stated on a sponsor: the number of the sponsor's dependent children, the children the sponsor (or a co-sponsor spouse) claims as dependents on income tax (9 CCR 2503-5 3.534.D.2.C, 3.544.G.2.c, 3.549.G.2.c, which cross-refer to 3.520.68.B.2.b.1), other than the non-citizens the sponsor sponsors and their spouses, whether or not they are persons of the case."
precision: "Where a sponsor and a co-sponsor spouse both signed, it is stated on one of them only. Required where Adult Financial (af_deemed_sponsor_income, CO-2386) reads it (coverage pass 6 CA6-7, docs/reviews/coverage6-cash.md; decision 4 of 2026-11-23): not stated is cannot determine; before, Adult Financial read an unstated value as 0. A non-citizen the same sponsor sponsors is counted by Adult Financial from the sponsor and tax_filer edges: a dependent only when the sponsor claims that person on income tax (af_deemed_sponsor_income, CO-2386; OQ-553 resolved by the archived 3.520.68.B.2.b.1, S3200). Not tax_dependents_claimed_or_claimable_count (CO-3705), SNAP's count of every person the sponsor or spouse claims or could claim."
supplied_by: "The sponsor's tax return or statement."
sources: [S1632, S3200]
tags: [immigration]
rationale: "OQ-114: Adult Financial deducts half the SSI benefit standard for each of the sponsor's dependents before deeming (S1632); no fact stated them.  Dual-entry audit 1.5 (audit fix round): the sponsor is a person of the case, joined to the non-citizen by the sponsor / sponsored_by relationship (volume.yaml), and the sponsor's income and resources are read from the sponsor's own facts, so two non-citizens with one sponsor read one set of facts. Stated on the sponsor, not on each non-citizen."
