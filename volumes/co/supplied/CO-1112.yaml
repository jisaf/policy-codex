id: CO-1112
name: Retains SSI recipient status without an SSI payment
identifier: retains_ssi_status_without_payment
kind: supplied
type: yes/no
scope: person
program: Medicaid
meaning: Whether SSA continues to treat the person as an SSI recipient although no SSI payment is made - including section 1619(b) status (SSI eligibility continued after the person returns to work and loses the SSI cash payment because of earned income), payments withheld to recover an overpayment, and checks undeliverable because of a change of address or representative payee (10 CCR 2505-10 §§ 8.100.1 "1619b", 8.100.6.C.8).
supplied_by: SSA SDX record of the person's SSI payment status code, as read by the eligibility site.
sources: [S627]
tags: [ma, non_magi, disability]
rationale: "receives_ssi (CO-012) records receipt of an SSI payment; § 8.100.6.C.8 also covers SSI recipients with no payment, of whom section 1619(b) is the working-disabled case. ma_protected_group_category (CO-1163) needs it."
