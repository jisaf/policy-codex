id: CO-4415
name: "ABLE account"
identifier: able_account_value
kind: supplied
type: money
scope: person
program: All
meaning: "The value of the person's Achieving a Better Life Experience (ABLE) account under 26 U.S.C. 529A that is part of the person's liquid resources (liquid_resources_value)."
precision: "Part of liquid_resources_value, not added to it; as of the determination date. If not stated, Adult Financial reads it as 0."
supplied_by: "The account statement."
sources: [S3206]
tags: [resources]
rationale: "Merged with CO-4641 (the non-MAGI Medicaid coverage round added the same fact under the same identifier; Medicaid reads this one too, and applies its own sale conditions in its derived items where they differ). Coverage review F-6: 9 CCR 2503-5 3.520.77.M (S3206) exempts \"Monies specifically placed in an Achieving a Better Life Experience (ABLE) Account\"; no fact stated one."
