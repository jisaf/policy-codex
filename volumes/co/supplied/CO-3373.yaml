id: CO-3373
name: "Self-employment costs of the home used for business"
identifier: self_employment_home_business_space_costs
kind: supplied
type: money
scope: person-month
program: All
meaning: "The part of the rent, mortgage and utilities of the person's own residence attributable to the room or space used for the business in the month."
precision: "If not stated, every program reads it as 0. Each program's allowable cost is its own derived item."
supplied_by: "Application (income and expenses), verified as each program requires."
sources: [S1155, S1084]
implemented: engine
tags: [income]
rationale: "Same-word audit SW-28, dual-entry audit 3.24 and 3.25: each program's excluded income and allowable business costs were program-prefixed supplied amounts, so one receipt or one set of business costs was entered once per program. The neutral fact describes the receipt or the cost; each program's exclusion or allowable cost is its own derived item citing its list (product-owner decision, convention rule 13)."
