id: CO-001
name: Date of birth
identifier: date_of_birth
kind: supplied
type: calendar date
scope: person
program: All
meaning: The calendar date on which the person was born.
supplied_by: "The applicant's statement on the application, or the case record; where a program's verification rule requires it (age questionable, or a program that verifies age), vital records, SSA or immigration records (heavier-definitions audit H-15: the fact is the person's circumstance as stated; documents belong to the *_verification_document_received facts and the verification items, which ask for them only where a program's rule requires it)."
sources: []
tags: [age]
rationale: "A fact the case must supply; no existing item in the Colorado volume carries it (the volume began empty in phase 1, and the mwr volume's facts are not shared across volumes). It is read by SNAP: is exempt from the non-citizen waiting period, SNAP: age."
