id: CO-4501
name: "G.I. Bill housing and food allowances received"
identifier: gi_bill_housing_and_food_allowances_received
kind: supplied
type: money
scope: person-month
program: All
meaning: "Money the person received in the month under a G.I. Bill veterans' educational assistance program as a monthly housing allowance, a food or subsistence allowance, or another living allowance paid while the person is in school, as distinct from the part paid for tuition, fees and books."
precision: "Part of the person's gross unearned income for the month as the unearned income facts state it (other_unearned_income_taxable or other_unearned_income_nontaxable), not added to it. The tuition, fees and books part is educational_assistance_received (CO-3360), not this fact. If not stated, every program reads it as 0."
supplied_by: "Department of Veterans Affairs award letter or payment history."
sources: [S3300]
tags: [income]
rationale: "Coverage review C-1: 9 CCR 2503-7 3.752.23.Z (S3300) excludes \"G.I. Bill educational allowances, including housing and food allowances\". educational_assistance_received (CO-3360) carries only money \"specifically for educational expenses\", so the housing and food allowances were counted. The fact states the receipt, program-neutrally (convention rule 13); each program's exclusion item decides whether its list exempts it."
nearest: [CO-3360]
