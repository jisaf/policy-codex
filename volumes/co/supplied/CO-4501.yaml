id: CO-4501
name: "G.I. Bill housing and food allowances received"
identifier: gi_bill_housing_and_food_allowances_received
kind: supplied
type: money
scope: person-month
program: All
meaning: "Money the person received in the month under a G.I. Bill veterans' educational assistance program as a monthly housing allowance, a food or subsistence allowance, or another living allowance paid while the person is in school or in on-the-job training, as distinct from the part paid for tuition, fees and books."
precision: "Part of the person's gross unearned income for the month as the unearned income facts state it (other_unearned_income_taxable or other_unearned_income_nontaxable), not added to it. The tuition, fees and books part is educational_assistance_received (CO-3360), not this fact. If not stated, every program reads it as 0. Coverage pass 3 C3-5 (dual-entry): the one G.I. Bill living-allowance fact. gi_bill_subsistence_allowance_received (CO-4456), which placed the same receipt inside educational_assistance_received, is retired into it. CCCAP counts the allowance (8 CCR 1403-1 3.111.I.7.c) as part of the unearned income it already reads (unearned_income_prior_thirty_days, CO-3913, takes out only educational_assistance_received), so it adds nothing for this fact; LEAP excludes it (leap_excluded_unearned_income, CO-4511)."
supplied_by: "Department of Veterans Affairs award letter or payment history."
sources: [S3300, S3256]
tags: [income]
rationale: "Coverage review C-1: 9 CCR 2503-7 3.752.23.Z (S3300) excludes \"G.I. Bill educational allowances, including housing and food allowances\". educational_assistance_received (CO-3360) carries only money \"specifically for educational expenses\", so the housing and food allowances were counted. The fact states the receipt, program-neutrally (convention rule 13); each program's exclusion item decides whether its list exempts it. Coverage pass 3 C3-5: 8 CCR 1403-1 3.111.I.7.c (S3256) counts \"Subsistence allowances paid to veterans through the GI bill for education and on-the-job training\"; with two facts placing the receipt differently, a case that answered both counted it twice for CCCAP (probe Y-4)."
nearest: [CO-3360]
