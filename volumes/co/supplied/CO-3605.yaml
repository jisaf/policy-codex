id: CO-3605
name: "Garnishment repaying a federal assistance overpayment"
identifier: garnishment_repaying_federal_assistance_overpayment
kind: supplied
type: money
scope: person-month
program: All
meaning: "The amount withheld or garnished from the person's income for the month, by law or order, to repay an overpayment of a federal assistance program (for example a Social Security, SSI or veterans benefit overpayment recovered from the benefit). If not stated, Medicaid reads it as 0."
supplied_by: "Benefit statement or garnishment order showing the recovery."
sources: [S2401]
tags: [ma, ltc, income]
rationale: "Final verification F-3 (docs/reviews/final-medicaid-chp.md): ma_patient_payment (CO-658) deducted only the personal needs allowance, the community spouse and family allowances and every health insurance premium, in every month; 10 CCR 2505-10 § 8.100.7.V.3.b-i (S2400-S2405) lists further deductions and adds Long-Term Care insurance payments, and limits the Part B premium to the first two months. No fact stated a garnishment."
