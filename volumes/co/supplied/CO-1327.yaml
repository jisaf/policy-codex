id: CO-1327
name: Dependent care verification document received
identifier: dependent_care_verification_document_received
kind: supplied
type: yes/no
scope: person
program: All
meaning: Whether the agency has received documentary evidence (or an acceptable collateral contact) verifying the person's dependent care expenses for this application, such as a provider's statement or receipts.
supplied_by: Date-stamped document receipt and collateral-contact entries in the CBMS case file.
sources: [S832]
tags: [verification, income]
rationale: No existing item in the volume carries this fact; the phase-9 verification chapter (design amended 2026-11-21) needs it, and it is program-neutral so every program's verification rules read the same value.
