id: CO-3307
name: "CCCAP: determination type"
identifier: cccap_determination_type
kind: supplied
type: one of
options: [application, redetermination, change_during_eligibility_period]
scope: case
program: CCCAP
meaning: "Which CCCAP determination the case is: an application to enter the program; a redetermination of eligibility for a household already receiving assistance (8 CCR 1403-1 3.111.K.2.c); or a change the receiving household reported during its eligibility period (3.111.H.1.b)."
precision: "One value for the case; CCCAP reads no default. cccap_redetermination_date (CO-2379) is stated with redetermination."
supplied_by: "CCCAP case record (CHATS)."
sources: [S1413]
implemented: engine
tags: [household]
rationale: "Dual-entry audit 3.22 (CCCAP half): whether the household already receives assistance was stated twice, as cccap_is_receiving_assistance on every member and implicitly by stating a redetermination date. One case record states the determination type, as ma_determination_type (CO-2831) does for Medicaid; cccap_is_receiving_assistance (CO-2103) is derived from it."
