id: CO-1321
name: Resources verified by electronic data source
identifier: resources_verified_by_electronic_data_source
kind: supplied
type: yes/no
scope: person
program: All
meaning: "Whether an electronic data source has verified the person's resources for this application: an interface match the agency treats as verification (the Asset Verification Program or an SSI determination returned through SVES), so no document is needed for that element."
supplied_by: CBMS interface results (IEVS, SSA/SOLQ/SVES, SAVE/VLP, DMV, FDSH, The Work Number, Asset Verification Program) as recorded in the case.
sources: [S866, S888]
tags: [verification, resources]
rationale: No existing item in the volume carries this fact; the phase-9 verification chapter (design amended 2026-11-21) needs it, and it is program-neutral so every program's verification rules read the same value.
