id: CO-2577
name: "CCCAP: is in a homelessness stabilization period"
identifier: cccap_is_in_homelessness_stabilization_period
kind: supplied
type: yes/no
scope: person-month
program: CCCAP
meaning: This household meets the definition of families experiencing homelessness (8 CCR 1403-1 3.103(YY)) and the month falls within its stabilization period - at least sixty consecutive days within a twelve-month period, longer under an approved county plan (3.121.B) - during which it has no parent fee (3.124.I.5). Stated on each member of the household.
precision: If not stated, CCCAP reads this as false.
supplied_by: County determination recorded in CHATS.
sources: [S784, S1823]
tags: [household]
rationale: "CDHS review C-7: the homelessness stabilization exception (3.124.I.5) was not modeled."
nearest: [CO-2575]
