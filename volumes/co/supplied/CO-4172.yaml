id: CO-4172
name: "Federal income tax refunds still held"
identifier: federal_tax_refunds_held_value
kind: supplied
type: money
scope: person
program: All
meaning: "The part of the person's liquid resources (liquid_resources_value) that is a federal income tax refund the person received in the twelve months before the determination date and still holds, the federal earned income tax credit and other refundable federal credits paid with the refund included."
precision: "Part of liquid_resources_value, not added to it; as of the determination date. Money from a refund that has been spent is no longer held and is not stated. If not stated, SNAP reads it as 0."
supplied_by: "Applicant statement, the IRS refund deposit on the account statement, or the tax return, as the county establishes them."
sources: [S2966]
tags: [resources]
rationale: "Final verification pass 2 N-8 (docs/reviews/final2-snap.md): 10 CCR 2506-1 4.410.J.17 (S2966) disregards federal income tax refunds as a resource for twelve months from receipt, and J.12 a federal earned income tax credit, but SNAP counted liquid_resources_value (CO-3390) in full. tax_refunds_and_credits_received (CO-3365) states the month's receipt as income, not what is still held."
nearest: [CO-3390]
