id: CO-3815
name: "Workforce training program payments received"
identifier: workforce_program_payments_received
kind: supplied
type: money
scope: person-month
program: All
meaning: "Money the person received in the month as a training allowance or training scholarship from the Workforce Innovation and Opportunity Act (WIOA) or another program to enable participation in a training program, as other income or supportive services through WIOA, or as a payment from a youth employment and training project under the Youth Employment and Demonstration Projects Act (YIEPP, YCCIP, YETP). Wages paid for work are wages_gross, not this fact."
precision: "Part of the person's gross unearned income for the month as the unearned income facts state it (other_unearned_income_taxable or other_unearned_income_nontaxable, or the fact that names the source), not added to it. If not stated, every program reads it as 0."
supplied_by: "Applicant statement, workforce center record."
sources: [S2606]
tags: [cash, income]
rationale: "Final cash review FC-2 and FC-3: Colorado Works' and Adult Financial's exclusion items (CO-2340 to CO-2343) summed a closed list of neutral receipt facts, so income the current exempt-income lists name could not be excluded and was counted. 9 CCR 2503-6 3.605.4.B.13, B.14 and B.16 (S2606) exempt training allowances, youth employment project payments and WIOA income. The fact states the receipt, program-neutrally (convention rule 13); each program's exclusion item decides whether its list exempts it."
