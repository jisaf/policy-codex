id: CO-088
name: "Medicaid: application date"
identifier: ma_application_date
kind: supplied
type: calendar date
scope: person
program: Medicaid
meaning: The date the person's (or their household's) Medical Assistance application was filed, the date 10 CCR 2505-10 8.100.3.E.1 and 42 CFR 435.915(a) measure the three-month retroactive coverage period backward from.
precision: "The date recorded when the Single Streamlined Application is filed (CBMS/PEAK), not the date of a later eligibility determination. Coverage review F-14: a redetermination form and the requested information returned during the 90-day reconsideration period after a termination (10 CCR 2505-10 § 8.100.3.P.5; 10 CCR 2505-3 § 140.2.B) is stated as the application date, since P.5.b makes coverage effective on the first day of the month the form was returned, with up to three months of retroactive coverage on request (ma_retroactive_coverage_requested, CO-4100); keeping coverage while a timely renewal is processed (P.3.f-g) is procedure (docs/colorado-notes.md)."
supplied_by: Single Streamlined Application filing date (CBMS/PEAK).
sources: []
tags: [ma, magi]
rationale: "No existing item carries the application date. ma_retroactive_coverage_start_month (CO-557) needs it as the anchor 8.100.3.E.1 and 435.915(a) both measure 'the three months preceding the date of application' from. Vocabulary fix round (docs/reviews/vocabulary-reuse.md, R-13): renamed from application_date and confined to Medicaid; SNAP's postponed-verification and due-date rules read snap_application_date (CO-1746), since a household can apply for SNAP on a different day."
