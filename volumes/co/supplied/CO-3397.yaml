id: CO-3397
name: "Life insurance face value"
identifier: life_insurance_face_value
kind: supplied
type: money
scope: person
program: All
meaning: "The total face value of the life insurance policies the person owns."
precision: "As of the determination date; the person's own holding, or the person's share of a jointly held one. If not stated, every program reads it as 0. For Medicaid (10 CCR 2505-10 § 8.100.5.M.2.f, 'on any person') the face value is that of the policies the person owns, which is the face value on the person's life except for a policy the person owns on another's life (coverage review NM-33)."
supplied_by: "Application (resources), verified by statements as each program requires."
sources: [S2214, S2215]
implemented: engine
tags: [resources]
rationale: "Same-word audit SW-31: every program's countable resources were a supplied, already-counted figure, so each program's resource rules lived outside the ledger, and Adult Financial fell back silently to the SSI figure when its own was unstated (OQ-392). The person's holdings are stated once by asset type; each program derives its countable resources by its own exclusions."
