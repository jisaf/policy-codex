id: CO-094
name: Continuous eligibility period start month
identifier: continuous_eligibility_period_start_month
kind: supplied
type: month
scope: person
program: Medicaid
meaning: "The month a child's current 12-month continuous eligibility period under 10 CCR 2505-10 8.100.3.Q.2 and 42 CFR 435.926(c)(2) began, as CBMS records it: the month of the determination, redetermination or renewal that opened the period. Stated only when CBMS records an open period; a recorded period stands as recorded, because the determination that opened it found the child eligible (heavier-definitions audit H-5), and Medicaid does not re-derive the start month's category from income facts."
precision: "Left unstated (unknown) when no period is recorded, as for a child whose period, if any, would be opened by the application being determined: ma_child_is_in_continuous_eligibility_period (CO-561) then computes whether the application month opens one, and ma_child_continuous_eligibility_end_month (CO-556) falls back to [month_of, ma_application_date] (P4, \"otherwise\"), per 8.100.3.Q.2's \"first day of the month the application is received, or from the date all criteria are met.\" If not stated, Medicaid reads the period as not recorded and starting in the application month."
supplied_by: CBMS's own tracking of the most recent determination or redetermination that opened the person's current continuous eligibility period.
sources: [S215, S216]
tags: [ma, magi]
rationale: "No existing item carries a continuous-eligibility period's start month distinct from ma_application_date. Fix-round item, added to resolve the phase-3 review's C-4(c) finding that ma_child_continuous_eligibility_end_month (CO-556) was anchored to [det_month] rather than to 8.100.3.Q.2's application-received/all-criteria-met anchor: this fact lets the period's start be tested (as in the review's designed case CO-08, where a period opened in April 2026 is tested again in January 2027) without re-anchoring on a later ma_application_date that would not have opened a new period."
