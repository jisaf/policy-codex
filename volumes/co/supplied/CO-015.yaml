id: CO-015
name: "SNAP: receives disability or blindness payments under the Social Security Act"
identifier: snap_receives_disability_or_blindness_payment
kind: supplied
type: yes/no
scope: person
program: SNAP
meaning: The person receives disability payments under title I, II, X, XIV, or XVI of the Social Security Act, or federally or state-administered supplemental benefits based on those disability or blindness criteria.
supplied_by: SSA benefit record.
sources: [S6]
tags: [snap, disability]
rationale: "A fact the case must supply; no existing item in the Colorado volume carries it (the volume began empty in phase 1, and the mwr volume's facts are not shared across volumes). It is read by SNAP: is a disabled member. Vocabulary fix round (R-5): renamed from receives_social_security_disability and confined to SNAP, whose 7 CFR 271.2 prongs (2)-(3) it states. Adult Financial and Medicaid citizenship verification read it as 'receives SSDI', which under this meaning was also true for an SSI or state supplement recipient; they now read receives_ssdi (CO-1727)."
