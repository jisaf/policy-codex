id: CO-015
name: Receives Social Security disability benefits
identifier: receives_social_security_disability
kind: supplied
type: yes/no
scope: person
program: All
meaning: The person receives disability payments under title I, II, X, XIV, or XVI of the Social Security Act, or federally or state-administered supplemental benefits based on those disability or blindness criteria.
supplied_by: SSA benefit record.
sources: [S6]
tags: [disability]
rationale: "A fact the case must supply; no existing item in the Colorado volume carries it (the volume began empty in phase 1, and the mwr volume's facts are not shared across volumes). It is read by SNAP: is a disabled member."
