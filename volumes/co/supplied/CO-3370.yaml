id: CO-3370
name: "Self-employment operating costs"
identifier: self_employment_operating_costs
kind: supplied
type: money
scope: person-month
program: All
meaning: "The person's actual costs in the month of producing self-employment income, other than the items the facts below state: rent of business premises, wholesale cost of merchandise, stock, raw material, seed and fertilizer, utilities of the business premises, labor, upkeep of necessary equipment, and insurance premiums and taxes on income-producing property. Not depreciation, payments on loan principal, interest, costs of a home used for the business, business vehicle costs, income taxes, retirement savings or personal expenses."
precision: "If not stated, every program reads it as 0. Each program's allowable cost is its own derived item."
supplied_by: "Application (income and expenses), verified as each program requires."
sources: [S1152, S1153, S1154, S1155, S1156, S1157, S1084]
implemented: engine
tags: [income]
rationale: "Same-word audit SW-28, dual-entry audit 3.24 and 3.25: each program's excluded income and allowable business costs were program-prefixed supplied amounts, so one receipt or one set of business costs was entered once per program. The neutral fact describes the receipt or the cost; each program's exclusion or allowable cost is its own derived item citing its list (product-owner decision, convention rule 13)."
