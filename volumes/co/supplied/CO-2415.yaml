id: CO-2415
name: "Medicaid: receives subsidized adoption payments"
identifier: ma_receives_subsidized_adoption_payments
kind: supplied
type: yes/no
scope: person
program: Medicaid
meaning: Whether the person receives subsidized adoption payments (10 CCR 2505-10 § 8.100.4.H.1.g, H.2.a.i). If not stated, Medicaid reads it as false.
supplied_by: County child welfare subsidized adoption record, through CBMS.
sources: [S1717, S1718]
tags: [ma, age]
rationale: "C-3 and C-9 of the HCPF review: H.1.g ends the extension to 21 and H.2.a.i excludes former foster care youth for a person receiving subsidized adoption payments; no fact stated it."
