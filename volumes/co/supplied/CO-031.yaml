id: CO-031
name: "SNAP: countable liquid resources"
identifier: snap_countable_liquid_resources
kind: supplied
type: money
scope: person
program: SNAP
meaning: The person's own countable liquid resources (cash, bank accounts, and similar) under 7 CFR 273.8, before combining with other household members' resources.
supplied_by: Bank statements, applicant statement.
sources: []
tags: [resources]
rationale: "A fact the case must supply; no existing item in the Colorado volume carries it (the volume began empty in phase 1, and the mwr volume's facts are not shared across volumes). It is reserved for the SNAP income, deduction, work registration and ABAWD rules of later batches, which read it by this identifier. Vocabulary fix round (docs/reviews/vocabulary-reuse.md, C-2, R-11): renamed from countable_liquid_resources and program SNAP, since the amount is net of 7 CFR 273.8's exclusions. CCCAP's $1M declaration reads cccap_declared_assets (CO-1741); Medicaid's MSP-only verification reads the SSI-method resources."
