id: CO-031
name: Countable liquid resources
identifier: countable_liquid_resources
kind: supplied
type: money
scope: person
program: All
meaning: The person's own countable liquid resources (cash, bank accounts, and similar) under 7 CFR 273.8, before combining with other household members' resources.
supplied_by: Bank statements, applicant statement.
sources: []
tags: [resources]
rationale: "A fact the case must supply; no existing item in the Colorado volume carries it (the volume began empty in phase 1, and the mwr volume's facts are not shared across volumes). It is reserved for the SNAP income, deduction, work registration and ABAWD rules of later batches, which read it by this identifier."
