id: CO-3835
name: "Uncompensated value of a transfer of a resource"
identifier: resource_transfer_uncompensated_value
kind: supplied
type: money
scope: person-month
program: All
meaning: "The uncompensated value of the resource the person (or the person's spouse) transferred in the month for less than its fair value: the actual value of the resource less encumbrances, less what the person received for it, and less any part of it since returned to the person when the whole resource has not been returned. Where more than one resource was transferred in the same month, their uncompensated values added together. Not stated for a month with no such transfer."
precision: "Stated with resource_transfer_date (CO-3834) for the same month. A resource returned in whole is stated at its uncompensated value before the return, with the date of the return in resource_transfer_returned_date (CO-4009), since 3.520.76.D.6 ends the period by the month of the return rather than cancelling it. SNAP reads it only for a person whose transfers the county found were made knowingly to qualify (snap_resource_transfer_was_to_qualify, CO-4155; final verification pass 2 N-4), for the months from the month in which 10 CCR 2506-1 4.408.2's three months before the date of application begin through the determination month (snap_resource_transfer_is_disqualifying, CO-4159)."
supplied_by: "Applicant statement, appraisals and sale records, as the county establishes them."
sources: [S2614, S2806]
tags: [cash, resources]
rationale: "Final cash review FC-6: 9 CCR 2503-5 3.520.76 (S2614) and C.R.S. 26-2-111(1)(c) (S2615) make a transfer without fair consideration within thirty-six months before the application, or while receiving, a ground of ineligibility for a period set by the uncompensated value, and nothing in the volume stated it, so a client in a penalty period was found eligible. Final cash review 2, N-5 and P2-4: the fact was the total value of all the transfers, divided and rounded down once, and a transfer whose whole resource had been returned was not stated at all; it is now stated for each month in which a transfer was made, and a returned resource keeps its value with the date of the return (3.520.76.D.3-6, E; S2806)."
