id: CO-898
name: "CCCAP: caretaker involuntarily out of the home"
identifier: cccap_caretaker_is_involuntarily_absent
kind: supplied
type: yes/no
scope: person
program: CCCAP
meaning: "In a two-caretaker household, this adult caretaker or teen parent is involuntarily out of the home, so that 8 CCR 1403-1 3.111.D.1.b treats the household as one with a single caretaker and the absent caretaker need not be in an eligible activity. A caretaker who is voluntarily out of the home temporarily (for an eligible activity, uniformed service or medical treatment, with intent to return) is still a household caretaker (D.1.a) and must be in an eligible activity (D.1.c.2); that absence is not this fact."
precision: "If not stated, CCCAP reads this as false (not involuntarily absent), which keeps the absent caretaker's activity requirement in force. No verification standard is modeled (3.111.D.1.b states none)."
supplied_by: Applicant statement or county verification of a caretaker's absence from the home.
sources: [S497, S1409]
tags: [household]
rationale: "No existing item carries 3.111.D.1.b's involuntarily absent caretaker (review docs/reviews/cccap-leap-phase-6.md, C-7). Phase-10 sweep (OQ-136): renamed from is_absent_from_home, which lumped D.1.b with D.1.c.2's voluntary absence; c.2 keeps both caretakers' activity requirement, so only involuntary absence exempts. cccap_household_caretakers_in_eligible_activity (CO-991) reads it."
