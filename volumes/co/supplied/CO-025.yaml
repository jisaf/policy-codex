id: CO-025
name: Social Security income
identifier: social_security_income
kind: supplied
type: money
scope: person-month
program: All
meaning: "The person's monthly Social Security benefit (retirement, survivors, or disability) under Title II of the Social Security Act. Stated as the gross amount received for the month, before any deduction withheld and before any program's exclusions or disregards; each program's own rule decides what it counts. The benefit is the amount before any Medicare premium is deducted."
supplied_by: SSA benefit record.
sources: []
tags: [income]
rationale: "A fact the case must supply; no existing item in the Colorado volume carries it (the volume began empty in phase 1, and the mwr volume's facts are not shared across volumes). It is reserved for the SNAP income, deduction, work registration and ABAWD rules of later batches, which read it by this identifier."
