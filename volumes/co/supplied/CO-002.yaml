id: CO-002
name: Immigration status
identifier: immigration_status
kind: supplied
type: one of
options: [us_citizen, us_national, lawful_permanent_resident, refugee, asylee, deportation_withheld, parolee_one_year_or_more, conditional_entrant, cuban_haitian_entrant, compact_of_free_association_migrant, battered_non_citizen, trafficking_victim, iraqi_afghan_special_immigrant, afghan_humanitarian_parolee, ukrainian_humanitarian_parolee, temporary_resident, temporary_protected_status, employment_authorized_under_274a12c, family_unity, deferred_enforced_departure, deferred_action, daca, administrative_stay_of_removal, pending_adjustment_with_approved_petition, asylum_or_withholding_applicant_with_employment_authorization, asylum_or_withholding_applicant_under_14_pending_180_days, cat_withholding_granted, special_immigrant_juvenile_applicant, american_samoa_lawfully_present, nonimmigrant, parolee_less_than_one_year, undocumented]
scope: person
program: All
meaning: "The person's citizenship or immigration status, as declared and, once verified, as SAVE or the citizenship documents establish it: the category only, with each program deciding in its own derived items which categories it accepts. One option per person, the most specific that applies. us_citizen: a citizen of the United States (including the District of Columbia, Puerto Rico, Guam, the Virgin Islands and the Northern Mariana Islands); us_national: a non-citizen national (American Samoa, Swains Island); lawful_permanent_resident: lawfully admitted for permanent residence under the INA (the status held before adjustment is status_before_lpr_adjustment, CO-2700); refugee: admitted under INA 207; asylee: granted asylum under INA 208; deportation_withheld: deportation withheld under INA 243(h) or removal withheld under 241(b)(3); parolee_one_year_or_more: paroled under INA 212(d)(5) for at least one year, other than the two humanitarian parole programs below; conditional_entrant: granted conditional entry under INA 203(a)(7) before April 1, 1980; cuban_haitian_entrant: as defined in section 501(e) of the Refugee Education Assistance Act of 1980; compact_of_free_association_migrant: lawfully residing under a Compact of Free Association (Micronesia, the Marshall Islands, Palau); battered_non_citizen: a spouse, child or parent the agency has found battered or subjected to extreme cruelty in the circumstances 8 U.S.C. 1641(c)(1)-(3) describe, with an approved or prima facie petition, while the batterer does not live in the household; trafficking_victim: a victim of a severe form of trafficking in persons (TVPA sec. 103) certified by HHS, or granted or applying with a prima facie case for T nonimmigrant status; iraqi_afghan_special_immigrant: an Iraqi or Afghan special immigrant under INA 101(a)(27) who has not adjusted to lawful permanent residence; afghan_humanitarian_parolee: an Afghan humanitarian parolee under section 2502 of the Extending Government Funding and Delivering Emergency Assistance Act; ukrainian_humanitarian_parolee: a Ukrainian parolee under section 401 of the Additional Ukraine Supplemental Appropriations Act; temporary_resident: temporary resident status under 8 U.S.C. 1160 or 1255a; temporary_protected_status: Temporary Protected Status, or a pending TPS application with employment authorization; employment_authorized_under_274a12c: employment authorization under 8 CFR 274a.12(c) with no status named elsewhere in this list; family_unity: a Family Unity beneficiary; deferred_enforced_departure: Deferred Enforced Departure; deferred_action: deferred action other than DACA; daca: Deferred Action for Childhood Arrivals; administrative_stay_of_removal: an administrative stay of removal under 8 CFR 241.6; pending_adjustment_with_approved_petition: the beneficiary of an approved visa petition with a pending application for adjustment of status; asylum_or_withholding_applicant_with_employment_authorization and asylum_or_withholding_applicant_under_14_pending_180_days: a pending application for asylum, withholding of removal or protection under the Convention Against Torture, by a person granted employment authorization, or by a child under 14 whose application has been pending at least 180 days; cat_withholding_granted: withholding of removal granted under the Convention Against Torture; special_immigrant_juvenile_applicant: a child with a pending application for Special Immigrant Juvenile status; american_samoa_lawfully_present: lawfully present in American Samoa under its immigration laws; nonimmigrant: a valid nonimmigrant status under 8 U.S.C. 1101(a)(15) or (17) (a visitor, student, temporary worker); parolee_less_than_one_year: paroled under INA 212(d)(5) for less than one year, other than for prosecution, deferred inspection or pending removal proceedings; undocumented: no lawful immigration status, or a status none of these options names (a pending application other than those listed, parole for prosecution, deferred inspection or pending removal proceedings)."
precision: "Reflects the person's status as of the determination date; a status change is a new fact, not a correction of this one. The options are the union of the categories the volume's governing texts name: 8 U.S.C. 1641(b)-(c) (S1900, S1901), 10 CCR 2505-10 § 8.100.3.G.1.g.i-viii (S174, S655-S658, S1902-S1905), 10 CCR 2505-3 § 110.1.B (S1906-S1908), 9 CCR 2503-7 3.753.16-17 (S1909), 7 U.S.C. 2015(f) (S8) and 42 U.S.C. 1396b(v)(5) (S1700). They were not checked against the USCIS SAVE status list: uscis.gov refused the fetch on 2026-11-21 (Access Denied), so the list is OQ-550's to confirm. The history SAVE reports beside the status is in its own facts: status_before_lpr_adjustment (CO-2700), is_american_indian_born_in_canada_or_tribal_member (CO-2701), is_hmong_or_highland_lao_veteran (CO-2702), parole_end_date (CO-2703), qualified_status_date (CO-003), us_entry_date (CO-1726) and has_military_connection (CO-005)."
supplied_by: SAVE (Systematic Alien Verification for Entitlements) through the Verify Lawful Presence interface, citizenship or immigration documents, or the applicant's declaration.
sources: [S1900, S1901, S174, S655, S656, S657, S658, S1902, S1903, S1904, S1905, S1906, S1907, S1908, S1909, S8, S1700]
tags: [immigration]
open: [OQ-550]
rationale: "A fact the case must supply. OQ-44 fix (product-owner decision of 2026-11-21; docs/reviews/audit-dual-entry.md 3.1; same-word audit SW-18): renamed from citizenship_status through a change set that keeps the ID, and widened from ten options to the full documented category set, so one fact states the person's status and each program's acceptance lives in its own derived items. It replaces lawful_presence_status (CO-084, the Medicaid lawfully residing flag), federal_five_year_bar_exempt_category (CO-1724) and ma_five_year_bar_exempt_category (CO-1170), which are retired: deportation withheld and trafficking victim became options here, and the remaining history went to status_before_lpr_adjustment (CO-2700), is_american_indian_born_in_canada_or_tribal_member (CO-2701) and is_hmong_or_highland_lao_veteran (CO-2702). Option renames: citizen is us_citizen; other_qualified_non_citizen is split into parolee_one_year_or_more, deportation_withheld, conditional_entrant and battered_non_citizen; other_lawfully_present_non_citizen is split into the 8.100.3.G.1.g.vii categories. Earlier history: vocabulary fix round (docs/reviews/vocabulary-reuse.md, C-1, R-10) removed the tie to SNAP."
