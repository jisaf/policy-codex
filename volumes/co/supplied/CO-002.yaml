id: CO-002
name: Citizenship status
identifier: citizenship_status
kind: supplied
type: one of
options: [citizen, us_national, lawful_permanent_resident, refugee, asylee, cuban_haitian_entrant, compact_of_free_association_migrant, other_qualified_non_citizen, undocumented, other_non_qualified_non_citizen]
scope: person
program: All
meaning: The person's citizenship or immigration status category, as those categories are used to determine SNAP eligibility.
precision: Reflects the person's status as of the determination date; a status change is a new fact, not a correction of this one.
supplied_by: SAVE (Systematic Alien Verification for Entitlements), immigration documents, or applicant statement.
sources: []
tags: [immigration]
rationale: "A fact the case must supply; no existing item in the Colorado volume carries it (the volume began empty in phase 1, and the mwr volume's facts are not shared across volumes). It is read by SNAP: is an eligible non-citizen, SNAP: meets the citizenship requirement."
