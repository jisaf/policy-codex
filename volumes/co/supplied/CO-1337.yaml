id: CO-1337
name: Age verification document received
identifier: age_verification_document_received
kind: supplied
type: yes/no
scope: person
program: All
meaning: Whether the agency has received documentary evidence (or an acceptable collateral contact) verifying the person's age or date of birth for this application, such as a birth certificate, an identification card, immigration papers, or school, church or census records.
supplied_by: Date-stamped document receipt and collateral-contact entries in the CBMS case file.
sources: [S882, S863]
tags: [verification, age]
rationale: No existing item in the volume carries this fact; the phase-9 verification chapter (design amended 2026-11-21) needs it, and it is program-neutral so every program's verification rules read the same value.
