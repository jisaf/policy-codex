id: CO-1224
name: Decedent's available estate
identifier: decedent_estate_value
kind: supplied
type: money
scope: person
program: AdultFinancial
meaning: The value, as of the date of death, of the decedent's available estate - cash or property of any kind the decedent owned, or a proportionate share of jointly held resources - applied second against the full burial costs, per 9 CCR 2503-5 3.570.43.A.2 and D.2.
supplied_by: County department estate review.
sources: [S719, S721]
tags: [cash, resources]
rationale: No existing fact states a decedent's estate; af_burial_unmet_cost (CO-1230) needs it.
