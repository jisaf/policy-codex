id: CO-007
name: "SNAP: resides in an institution that provides the majority of meals"
identifier: snap_resides_in_institution_providing_meals
kind: supplied
type: yes/no
scope: person
program: SNAP
meaning: The person resides in a hospital, nursing facility, or other medical institution that provides the person with the majority of their meals as part of the institution's normal services.
supplied_by: Case record, institution admission record.
sources: [S3]
tags: [snap, household]
rationale: "A fact the case must supply; no existing item in the Colorado volume carries it (the volume began empty in phase 1, and the mwr volume's facts are not shared across volumes). It is read by SNAP: is a household member (not excluded as an institution resident). Vocabulary fix round (docs/reviews/vocabulary-reuse.md, R-8): renamed from in_medical_institution and confined to SNAP, whose 7 CFR 273.1(b)(7)(vi) majority-of-meals test it states. Medicaid and the Home Care Allowance read resides_in_medical_institution (CO-1742); LEAP reads its own living arrangement."
