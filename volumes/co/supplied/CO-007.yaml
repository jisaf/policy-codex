id: CO-007
name: In medical institution
identifier: in_medical_institution
kind: supplied
type: yes/no
scope: person
program: All
meaning: The person resides in a hospital, nursing facility, or other medical institution that provides the person with the majority of their meals as part of the institution's normal services.
supplied_by: Case record, institution admission record.
sources: [S3]
tags: [household]
rationale: "A fact the case must supply; no existing item in the Colorado volume carries it (the volume began empty in phase 1, and the mwr volume's facts are not shared across volumes). It is read by SNAP: is a household member (not excluded as an institution resident)."
