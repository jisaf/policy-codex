id: CO-2272
name: Is regularly attending school or training
identifier: ma_is_regularly_attending_school_or_training
kind: supplied
type: yes/no
scope: person
program: Medicaid
meaning: "Whether the person is regularly attending a school, college or university, or receiving technical training designed to prepare the person for gainful employment (10 CCR 2505-10 § 8.100.5.H.2.a.ii)."
supplied_by: The school or training enrollment reported on the application.
sources: [S1506]
tags: [ma, non_magi, age]
rationale: "OQ-83: an unemancipated child includes a child under 21 who regularly attends school or training; no Medicaid fact stated it (the SNAP and Colorado Works enrollment facts carry those programs' own definitions)."
