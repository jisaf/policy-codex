id: CO-2314
name: "SNAP: work requirement violation number"
identifier: snap_work_requirement_violation_number
kind: supplied
type: whole number
scope: person
program: SNAP
meaning: "Which time this person has failed without good cause to comply with the SNAP general work requirements, counting the voluntary quit stated in snap_voluntary_quit_date (CO-2313): 1 the first time, 2 the second, 3 the third or a later time (10 CCR 2506-1 4.310.8.A.1-3)."
precision: "A number above 3 reads as 3, since the third and every later time carry the same period."
supplied_by: "County SNAP work requirement sanction history."
sources: [S1612]
tags: [snap, work_registration]
rationale: "OQ-38 (P-8): the length of a voluntary-quit disqualification depends on the number of the violation (4.310.8.A, S1612); no fact stated it."
