id: CO-2242
name: Excess real property excluded while for sale
identifier: ma_excess_real_property_is_for_sale
kind: supplied
type: yes/no
scope: person-month
program: Medicaid
meaning: "Whether the person has real property beyond the exempt home that is left out of countable resources because reasonable efforts to sell it have been unsuccessful (10 CCR 2505-10 § 8.100.5.M.2.b): listed with a professional at current market value, or owner-listed, advertised and shown at current market value, with any reasonable offer accepted."
supplied_by: The resource assessment in the case file (listing agreement, advertising).
sources: [S1514]
tags: [ma, resources, verification]
rationale: "OQ-379: the exclusion requires quarterly verification of the efforts to sell; no fact stated that the person relies on it."
