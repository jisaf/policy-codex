id: CO-4010
name: "Infrequent or irregular earned income received"
identifier: infrequent_or_irregular_earned_income_received
kind: supplied
type: money
scope: person-month
program: All
meaning: "The part of the person's earned income for the month received infrequently (only once in the calendar quarter from a single source, not received in the month before or after) or irregularly (earnings the person could not reasonably expect to receive), such as pay for a single odd job."
precision: "Part of the person's gross earned income for the month as the earned income facts state it (wages_gross, or self-employment receipts), not added to it. If not stated, every program reads it as 0."
supplied_by: "Applicant statement, verified as each program requires."
sources: [S2608]
implemented: engine
tags: [income]
rationale: "Final cash review 2, P2-3: 9 CCR 2503-5 3.520.786.O exempts \"Infrequent or irregular income of less than $60 in a calendar quarter\", not unearned income only, and infrequent_or_irregular_income_received (CO-3822) states unearned income; no fact stated infrequent earnings."
