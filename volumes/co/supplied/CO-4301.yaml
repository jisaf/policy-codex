id: CO-4301
name: "WIOA on-the-job training wages"
identifier: wioa_on_the_job_training_wages
kind: supplied
type: money
scope: person-month
program: All
meaning: "The part of the person's wages for the month (wages_gross) earned in on-the-job training under the Workforce Innovation and Opportunity Act, whether paid by WIOA or by the employer."
precision: "Part of wages_gross, not added to it. Wages from a summer youth employment and training program are summer_youth_employment_wages (CO-4302), not this fact. If not stated, SNAP reads it as 0."
supplied_by: "Pay stubs; the WIOA training agreement."
sources: [S3108]
tags: [snap, income]
rationale: "Coverage review snap-financial CF-1: 4.405.2.A.6 and 4.403.B.2 (S3108) exclude WIOA on-the-job training earnings of a member under nineteen under the parental control of an adult member and count them for everyone else; subsidized_employment_wages (CO-3817) covers every subsidized program, so it could not carry the WIOA test."
