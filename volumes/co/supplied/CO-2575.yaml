id: CO-2575
name: "CCCAP: teen-parent hardship fee waiver granted"
identifier: cccap_teen_parent_fee_waiver_granted
kind: supplied
type: yes/no
scope: person
program: CCCAP
meaning: The county has waived the parent fee for this one- or two-teen-parent household in middle or junior high school, high school, GED or vocational or technical training, because paying it produces a hardship (8 CCR 1403-1 3.124.I.1), reviewed at each redetermination. Stated on each member of the household.
precision: "If not stated, CCCAP reads this as false: the waiver is a county decision documented in the case file."
supplied_by: County decision recorded in CHATS.
sources: [S784]
tags: [household]
rationale: "CDHS review C-7: the teen-parent hardship waiver (3.124.I.1) was not modeled."
