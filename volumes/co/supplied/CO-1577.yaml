id: CO-1577
name: Has trust interest
identifier: has_trust_interest
kind: supplied
type: yes/no
scope: person
program: Medicaid
meaning: "Whether the person (not the spouse: a spouse who is a person of the case states their own) has transferred assets into a trust or is a beneficiary of a trust."
precision: An income (Miller) trust is has_income_trust (CO-823); either requires the trust documents.
supplied_by: Resources section of the application as recorded in CBMS.
sources: [S1741]
tags: [verification, ltc, resources]
rationale: "No existing fact in the volume states this; the phase-9 verification review (K-3: 8.100.7.A.2.i) needs it as a supplied fact. Dual-entry audit 1.6: the person's own interest; Medicaid reads a spouse's across the spouse edge, so the spouse's interest is not stated twice."
