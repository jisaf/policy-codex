id: CO-3859
name: "Received financial assistance from another State this month"
identifier: received_financial_assistance_from_another_state_this_month
kind: supplied
type: yes/no
scope: person
program: All
meaning: "Another State made a payment of financial assistance (cash public assistance of any program) to the person for the month at issue."
precision: "If not stated, Adult Financial reads this as false. A payment of TANF by another State is also received_tanf_from_another_state_this_month (CO-842), the narrower fact Colorado Works reads."
supplied_by: "Applicant statement, PARIS match (9 CCR 2503-5 3.520.5.C), as the county establishes it."
sources: [S2620]
tags: [cash]
rationale: "Final cash review FC-9: 9 CCR 2503-5 3.520.64.B.2 (S2620) makes a person who receives financial assistance from another State ineligible for Adult Financial programs in any month the other State pays; received_tanf_from_another_state_this_month (CO-842) names TANF only, and no fact stated the broader payment."
