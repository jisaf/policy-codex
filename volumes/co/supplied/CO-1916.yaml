id: CO-1916
name: Community service hours
identifier: ma_community_service_hours
kind: supplied
type: hours
scope: person-month
program: Medicaid
meaning: "The hours of community service the person completed in the month as 42 CFR 435.552(b) defines it: unpaid work, voluntary or court-ordered, with a structured program for the direct benefit of the community under the auspices of a public or nonprofit organization that oversees and tracks it. If not stated, Medicaid reads this as zero."
supplied_by: The applicant's or beneficiary's statement, verified as 42 CFR 435.557 requires (reliable information available to the State first).
sources: [S1203]
tags: [ma, magi]
rationale: "OQ-65: no fact states community service hours."
