id: CO-029
name: Cash assistance income
identifier: cash_assistance_income
kind: supplied
type: money
scope: person-month
program: All
meaning: The person's monthly cash assistance income (for example TANF or Adult Financial) counted as unearned income for another program's budget.
supplied_by: CBMS cash assistance case record.
sources: []
tags: [income]
rationale: "A fact the case must supply; no existing item in the Colorado volume carries it (the volume began empty in phase 1, and the mwr volume's facts are not shared across volumes). It is reserved for the SNAP income, deduction, work registration and ABAWD rules of later batches, which read it by this identifier."
