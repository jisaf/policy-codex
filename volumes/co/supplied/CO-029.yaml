id: CO-029
name: "Colorado Works cash assistance received"
identifier: tanf_cash_income
kind: supplied
type: money
scope: person-month
program: All
meaning: "The Colorado Works (TANF) basic cash assistance received for the month that is paid for this person's needs; a unit's grant is stated across the members it supports, a child's share on the child. Stated as the gross amount received for the month, before any deduction withheld and before any program's exclusions or disregards; each program's own rule decides what it counts."
precision: "Not the Adult Financial grants (adult_financial_cash_income, CO-1713) and not SSI (ssi_income, CO-849). Colorado Works does not read it: a program does not count its own grant as income against itself."
supplied_by: CBMS cash assistance case record.
sources: []
tags: [income]
rationale: "A fact the case must supply; no existing item in the Colorado volume carries it (the volume began empty in phase 1, and the mwr volume's facts are not shared across volumes). It is reserved for the SNAP income, deduction, work registration and ABAWD rules of later batches, which read it by this identifier. Vocabulary fix round (docs/reviews/vocabulary-reuse.md, R-1): renamed from cash_assistance_income and narrowed to TANF. The fact had meant any cash assistance, so Colorado Works and Adult Financial each counted their own grant as income, and SSI had no home in SNAP's unearned income."
