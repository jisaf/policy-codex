id: CO-4163
name: "Costs of providing room and board"
identifier: room_and_board_provision_costs
kind: supplied
type: money
scope: person-month
program: All
meaning: "The documented costs, for the month, that are separate and identifiable costs of providing the room and meals to the boarders whose payments room_and_board_payments_received states (the boarders' food, for example), not the home's shelter costs as a whole. 0 if none are documented."
precision: "If not stated, SNAP reads it as 0, so that the maximum allotment for the number of boarders is the cost of doing business."
supplied_by: "Receipts and records of the costs, as the county establishes them."
sources: [S2963]
tags: [income, snap]
rationale: "Final verification pass 2 N-5: 4.403.2.B.2 (S2963) allows \"the actual documented cost of providing room and meals if the actual cost exceeds the appropriate maximum allotment\", only \"separate and identifiable costs\"; no fact stated them."
nearest: [CO-4161]
