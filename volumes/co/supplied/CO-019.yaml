id: CO-019
name: Is elderly or disabled and unable to prepare meals
identifier: is_elderly_disabled_unable_to_prepare_meals
kind: supplied
type: yes/no
scope: person
program: All
meaning: The person is unable to purchase and prepare their own meals because of a permanent disability, for purposes of the 273.1(b)(2) separate-household election for elderly or disabled members.
supplied_by: Applicant statement, medical verification.
sources: []
tags: [disability, household]
rationale: "A fact the case must supply; no existing item in the Colorado volume carries it (the volume began empty in phase 1, and the mwr volume's facts are not shared across volumes). It is reserved for the SNAP income, deduction, work registration and ABAWD rules of later batches, which read it by this identifier."
