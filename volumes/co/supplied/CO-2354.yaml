id: CO-2354
name: "Colorado Works: payments to tax dependents outside the home"
identifier: cw_support_paid_to_tax_dependents_outside_home
kind: supplied
type: money
scope: person-month
program: ColoradoWorks
meaning: "The amount this stepparent or non-participant parent of a minor parent actually paid in the month to individuals not living in the home whom the person could claim as dependents for federal income tax purposes (9 CCR 2503-6 3.605.1.A.4.a)."
precision: "Colorado Works requires it where read (coverage pass 4 CA4-16, decision 4 of 2026-11-23: missing information is cannot determine unless the rule says otherwise); before, it was read as 0 when not stated."
supplied_by: "Applicant statement with proof of payment."
sources: [S1307]
tags: [cash, tanf, income]
rationale: "OQ-140: the 3.605.1.A.4.a deeming (S1307) deducts these payments as well as court-ordered support (child_support_paid_legally_obligated); no fact stated them."
