id: CO-037
name: Is homeless
identifier: is_homeless
kind: supplied
type: yes/no
scope: person
program: All
meaning: The person does not have a fixed and regular nighttime residence, or has a primary nighttime residence that is a shelter or place not designed for regular sleeping accommodation.
supplied_by: Applicant statement.
sources: []
rationale: "A fact the case must supply; no existing item in the Colorado volume carries it (the volume began empty in phase 1, and the mwr volume's facts are not shared across volumes). It is reserved for the SNAP income, deduction, work registration and ABAWD rules of later batches, which read it by this identifier."
