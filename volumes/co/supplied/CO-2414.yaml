id: CO-2414
name: "Medicaid: basis for the needy persons under 21 groups"
identifier: ma_needy_young_person_basis
kind: supplied
type: one of
options: [none, psych_or_long_term_care_institution, foster_care, independent_living_after_foster_care, alternatives_to_foster_care, county_custody_foster_home, subsidized_adoption, human_services_responsibility_at_eighteen]
scope: person-month
program: Medicaid
meaning: "Which of the needy-persons-under-21 situations of 10 CCR 2505-10 § 8.100.4.H.1 the person is in this month: receiving care in a long-term care institution or active inpatient treatment in a psychiatric facility (a, psych_or_long_term_care_institution); in foster care, a private institution or a subsidized adoptive home for which the Department of Human Services is assuming financial responsibility (b, foster_care); in independent living after foster care (c); served by the Alternatives to Foster Care Program (d); removed from home into county custody and residing in a county approved foster home (e, county_custody_foster_home); receiving services under the subsidized adoption program with a Medical Assistance clause (f, subsidized_adoption); under Department of Human Services responsibility on the 18th birthday or at emancipation after foster care maintenance or subsidized adoption payments (g, human_services_responsibility_at_eighteen); or none. If not stated, Medicaid reads it as none."
supplied_by: County child welfare (Trails) placement record and the institution's admission record, through CBMS.
sources: [S1717]
tags: [ma, age, household]
rationale: "C-3 of the HCPF review: § 8.100.4.H.1.a-g had no item. ma_is_in_title_iv_foster_care_or_adoption_assistance (a verification fact) and cw_receives_title_iv_foster_adoption_kinship_payment state Title IV-E receipt, which is narrower than the State responsibility H.1 names."
