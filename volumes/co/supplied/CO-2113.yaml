id: CO-2113
name: "CCCAP: self-employment in its launch period"
identifier: cccap_self_employment_in_launch_period
kind: supplied
type: yes/no
scope: person-month
program: CCCAP
meaning: "Whether this caretaker's self-employment is in the launch period of 8 CCR 1403-1 3.111.G.2.e - an endeavor less than twelve months old, for six months or until the next redetermination, whichever is longer - during which income is projected at the federal minimum wage times the declared hours."
precision: "Stated for a caretaker whose self-employment is less than twelve months old. If not stated, CCCAP reads it as false (not in a launch period). Coverage round F-11: read by cccap_self_employment_net_earnings (CO-1710), which projects the launch period's income, and by cccap_caretaker_in_eligible_activity (CO-984), which waives the minimum-wage test."
supplied_by: Self-employment start date and redetermination date in the CCCAP case record.
sources: [S1410]
tags: [household, income]
rationale: "Review K-6 and OQ-162: the minimum-wage test of 3.111.G.1.b and G.2.d is waived by G.2.e's launch period; no fact states it. cccap_caretaker_in_eligible_activity (CO-984) reads it."
