id: CO-4302
name: "Summer youth employment wages"
identifier: summer_youth_employment_wages
kind: supplied
type: money
scope: person-month
program: All
meaning: "The part of the person's wages for the month (wages_gross) paid for on-the-job training under a summer youth employment and training program."
precision: "Part of wages_gross, not added to it, and not part of wioa_on_the_job_training_wages. If not stated, SNAP reads it as 0."
supplied_by: "Pay stubs; the program's enrollment record."
sources: [S3108]
tags: [snap, income]
rationale: "Coverage review snap-financial CF-1: 4.405.2.A.6 (S3108) excludes on-the-job training payments under the Summer Youth Employment and Training Program whatever the person's age; no fact stated them."
