id: CO-4452
name: "Colorado Works supportive service payments received"
identifier: tanf_supportive_service_payments_received
kind: supplied
type: money
scope: person-month
program: All
meaning: "Money the person received in the month from Colorado Works as a supportive service payment (help with transportation, work clothing or tools, or other costs of taking part in a work activity or of employment), apart from the basic cash assistance grant (tanf_cash_income, CO-029) and any diversion payment."
precision: "Part of the person's gross unearned income for the month as the unearned income facts state it (other_unearned_income_taxable or other_unearned_income_nontaxable, or the fact that names the source), not added to it. If not stated, every program reads it as 0."
supplied_by: "Applicant statement, the Colorado Works case record."
sources: [S3257]
tags: [income, tanf]
rationale: "Coverage round (docs/reviews/coverage-cccap.md, F-25): 8 CCR 1403-1 3.111.J.23 (S3257) excludes \"Supportive service payments under the Colorado Works Program\". No fact stated them, so a case stated them in other unearned income and CCCAP counted them."
