id: CO-4616
name: "Impairment-related work expenses paid"
identifier: impairment_related_work_expenses_paid
kind: supplied
type: money
scope: person-month
program: All
meaning: "The amount the person paid in the month for items and services the person needs, because of an impairment, in order to work (attendant care, medical devices, prosthetics, work-related equipment, residential modifications, transportation and the like, as 20 CFR 416.976 describes them), not reimbursed by another source."
precision: "If not stated, every program reads it as 0."
supplied_by: "Receipts and the person's statement."
sources: [S3412]
tags: [income, disability]
rationale: "Coverage review NM-8: 20 CFR 416.1112(c)(6), incorporated by 10 CCR 2505-10 § 8.100.5.H.4.e, excludes earned income used to pay impairment-related work expenses; no fact stated them."
nearest: [CO-4617]
