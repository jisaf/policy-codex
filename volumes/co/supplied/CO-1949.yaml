id: CO-1949
name: Institutionalized spouse refuses the income allowance
identifier: ma_institutionalized_spouse_refuses_income_allowance
kind: supplied
type: yes/no
scope: person
program: Medicaid
meaning: "Whether the institutionalized spouse refuses, or fails, to make the monthly income allowance available to the community spouse: it bars an increased CSRA (10 CCR 2505-10 § 8.100.7.S.1.e), and the allowance is then not deducted in the patient payment, the income going to the cost of care (§ 8.100.7.T.1.b, T.1.e)."
supplied_by: The applicant's statement.
sources: [S1221, S3410]
tags: [ma, ltc, resources]
rationale: "OQ-126: § 8.100.7.S.1.e conditions the increased CSRA on the income allowance being made available."
