id: CO-4833
name: "Number of persons paying for meals only"
identifier: board_only_payers_count
kind: supplied
type: whole number
scope: person-month
program: All
meaning: "The number of persons whose meals-only payments the person's receipts of kind board_only_payment (receipts, CO-5000) state for the month."
precision: "Stated with the board_only_payment receipts; read only where those payments are more than 0."
supplied_by: "Applicant statement on the household's arrangements."
sources: [S3159]
tags: [income]
nearest: [CO-4162]
rationale: "Coverage pass 3 CW3-1: E.4.c (S3159) deducts the one-person Food Assistance allotment \"per boarder\"; the payers need not be persons of the case, so the number is stated with the payments, as room_and_board_payers_count (CO-4162) is for room and board."
