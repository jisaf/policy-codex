id: CO-2862
name: "Receives a VA non-service-connected pension"
identifier: receives_va_non_service_connected_pension
kind: supplied
type: yes/no
scope: person
program: All
meaning: "Whether the person receives a non-service-connected disability pension from the U.S. Department of Veterans Affairs."
precision: "If not stated, SNAP reads this as false (snap_is_disabled_member, CO-302)."
supplied_by: VA award letter.
sources: [S1737, S1231]
tags: [ma, ltc]
rationale: "Dual-entry audit 2.11: ma_qualifies_for_veterans_personal_needs_allowance (CO-1986) restated whether the person has a spouse or dependent child, which the relationship edges state, beside the VA pension; the pension is the fact of its own."
