id: CO-014
name: "Receives disability-based general assistance"
identifier: receives_disability_based_general_assistance
kind: supplied
type: yes/no
scope: person
program: All
meaning: "The person receives state general assistance benefits based on disability or blindness criteria from a program other than Colorado's Adult Financial programs (a county's general assistance, or another state's): Aid to the Needy Disabled and Aid to the Blind are recorded once, by adult_financial_program_received (CO-2710), and not restated here."
precision: "SNAP's disabled member (CO-302) reads this beside the Adult Financial record (and_so, and_cs, ab), so an AND or AB client is not stated twice."
supplied_by: CBMS Adult Financial case record.
sources: [S1951]
tags: [disability]
rationale: "A fact the case must supply; no existing item in the Colorado volume carries it (the volume began empty in phase 1, and the mwr volume's facts are not shared across volumes). It is read by SNAP: is a disabled member. Vocabulary fix round (docs/reviews/vocabulary-reuse.md, C-1): renamed from receives_general_assistance; the name said general assistance while the meaning is the disability-based kind only. Dual-entry audit 3.8 (the CO-014 overlap): AND-SO, AND-CS and AB are state disability- or blindness-based assistance, so this fact and the Adult Financial case record overlapped for every AND client; the fact now covers only assistance the Adult Financial record does not."
