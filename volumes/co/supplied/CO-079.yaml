id: CO-079
name: Other taxable income
identifier: other_taxable_income
kind: supplied
type: money
scope: person-month
program: All
meaning: "Income in 10 CCR 2505-10 § 8.100.4.C.1's Modified Adjusted Gross Income list that is taxable but is not unearned income received in the month, and that no other income fact names: capital gains (§ 8.100.4.C.1.b.xiii), income from discharge of indebtedness other than student loan debt, income in respect of a decedent, and a distributive share of partnership gross income. Interest, dividends, rents, royalties and pre-2019 alimony received are other_unearned_income_taxable (CO-1714); lottery and gambling winnings (CO-1181) and discharged student loan debt (CO-1188) have their own facts."
precision: "Monthly amount for the month in context, as it is figured for federal income tax. Capital gains are stated gross; capital losses are pretax_deductions (CO-080). Read by MAGI only."
supplied_by: Applicant statement (CBMS/PEAK), verified through an electronic data source or documentation per 10 CCR 2505-10 8.100.4.B.1.d.
sources: [S669, S670]
tags: [ma, magi, income]
rationale: "No existing item carries a catch-all for the 8.100.4.C.1.b-c unearned/additional income categories this volume does not already name individually (social_security_income, pension_income, unemployment_income, tanf_cash_income, child_support_received, other_unearned_income_nontaxable are all shared batch-1 SNAP facts); ma_person_magi_income (CO-502) needs a MAGI-specific catch-all so a rent or dividend amount is not forced into a SNAP-shaped fact whose meaning does not match. Vocabulary fix round (docs/reviews/vocabulary-reuse.md, R-1, C-2): narrowed so that it no longer overlaps the unearned income other programs count (a dividend could be entered here and in other_unearned_income and counted twice); the 'countable, already net of exclusions' precision is withdrawn with the volume's post-exclusion convention."
