id: CO-1340
name: Eligible activity verification document received
identifier: cccap_eligible_activity_verification_document_received
kind: supplied
type: yes/no
scope: person
program: CCCAP
meaning: Whether the agency has received documentary evidence (or an acceptable collateral contact) verifying the person's CCCAP low-income eligible activity (employment, job search, education or training) for this application, such as an employer letter, an enrollment verification, or job-search documentation.
supplied_by: Date-stamped document receipt and collateral-contact entries in the CBMS case file.
sources: [S890]
tags: [verification]
rationale: "No existing item in the volume carries this fact; the phase-9 verification chapter (design amended 2026-11-21) needs it, and it is program-neutral so every program's verification rules read the same value. Same-word audit SW-37: renamed from eligible_activity_verification_document_received so the identifier carries the prefix of the program (or method) whose meaning it states."
