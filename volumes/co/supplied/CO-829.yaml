id: CO-829
name: MMMNA standard
identifier: mmmna_standard
kind: supplied
type: money
scope: person-month
program: Medicaid
meaning: The current minimum monthly maintenance needs allowance before any excess shelter allowance - 150% of the federal poverty level for a family of two per 42 U.S.C. 1396r-5(d)(3)(A)(i)/(B)(iii) and 10 CCR 2505-10 § 8.100.7.Q.1.a, revised each July.
precision: Not a fetched-document figure for the case's as-of date; the case states the HHS-poverty-guideline-derived figure the Department publishes each July. See OQ-91.
supplied_by: HCPF's published minimum monthly maintenance needs allowance, derived from the HHS poverty guidelines and loaded in CBMS.
sources: [S358, S372]
open: [OQ-91]
tags: [ma, ltc, income, legal]
rationale: "No fetched document states the 2026 (July 2026-effective) MMMNA dollar figure; 1396r-5(d)(3) states only the 150%-of-poverty-line formula (S372) and 8.100.7.Q.1.a restates the percentage without a dollar figure (S358). ma_mmmna (CO-655) and ma_family_allowance (CO-657) need the current standard as a supplied fact rather than a parameter computed from a poverty guideline table this batch does not build."
