id: CO-3824
name: "In-home care allowance received"
identifier: in_home_care_allowance_received
kind: supplied
type: money
scope: person-month
program: All
meaning: "Money the person received in the month as a personal care or home care allowance from a federal, State or local government program to purchase in-home supportive services (attendant, chore, housekeeping) for the person."
precision: "Part of the person's gross unearned income for the month as the unearned income facts state it (other_unearned_income_taxable or other_unearned_income_nontaxable, or the fact that names the source), not added to it. An attendant's pay for providing the services is the attendant's wages, not this fact. If not stated, every program reads it as 0."
supplied_by: "Applicant statement, the program's payment record."
sources: [S2605, S2608]
tags: [cash, income]
rationale: "Final cash review FC-2 and FC-3: Colorado Works' and Adult Financial's exclusion items (CO-2340 to CO-2343) summed a closed list of neutral receipt facts, so income the current exempt-income lists name could not be excluded and was counted. 9 CCR 2503-6 3.605.4.A.5 (S2605) and 9 CCR 2503-5 3.520.786.E (S2608) exempt personal care and home care allowances paid to the person; no fact separated them. The fact states the receipt, program-neutrally (convention rule 13); each program's exclusion item decides whether its list exempts it."
