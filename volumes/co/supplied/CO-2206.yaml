id: CO-2206
name: Date the person became eligible for Medical Assistance
identifier: ma_eligibility_start_date
kind: supplied
type: calendar date
scope: person
program: Medicaid
meaning: "The date the person became eligible for Medical Assistance (10 CCR 2505-10 § 8.100.3.E.1): the earliest date from which the person has met every applicable eligibility requirement without a break up to the application. A person who met them throughout the three months before the application month may be stated with any date on or before the first day of that period."
supplied_by: The eligibility site's retroactive-month determination (CBMS), from the facts of each month before the application.
sources: [S1503, S217]
tags: [ma]
rationale: "OQ-55: retroactive coverage begins at the later of the three months before the application and the date the person became eligible; no fact stated the second date."
