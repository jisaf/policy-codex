id: CO-7890
name: Has held an earlier qualified status
identifier: has_held_earlier_qualified_status
kind: supplied
type: yes/no
scope: person
program: All
meaning: "For a qualified non-citizen who is not a lawful permanent resident, whether the person held a qualified non-citizen status (8 U.S.C. 1641(b) or (c)) before the qualified status held now (qualified_status_date, CO-003): an earlier parole of at least a year, conditional entry, refugee or asylee status, a Cuban and Haitian entrant's status or a battered non-citizen's status. False where the status held now is the person's first qualified status, whatever status the person entered the United States in or held before (no status, a visitor, student or work visa, or a status that is not a qualified status): for example, a person who entered the United States in no status and was later found a battered non-citizen. True where an earlier qualified status preceded it; its date is then first_qualified_status_date (CO-7770). For a lawful permanent resident the status held before permanent residence is status_before_lpr_adjustment (CO-2700), and this fact is not read."
precision: "Close-out verification F1, the arm left (KL-SNAP-3, docs/reviews/known-limits.md; 2026-11-24). 8 U.S.C. 1613(a) (S176) runs the five years 'beginning on the date of the alien's entry into the United States with a status within the meaning of the term \"qualified alien\"', and 10 CCR 2506-1 4.305.B.3.a (S12) 'on the date the non-citizen obtains status as a qualified non-citizen or enters the U.S. in a qualifying status': where the status held now is the first, they begin on qualified_status_date. The start of the waiting period (qualified_non_citizen_waiting_period_start_date, CO-7820) reads this fact for a person who is not a lawful permanent resident, where the case does not state first_qualified_status_date and does not show the status held now is the first by the entry (us_entry_date on or after qualified_status_date): false gives qualified_status_date, true asks first_qualified_status_date. For a lawful permanent resident, status_before_lpr_adjustment none or non_qualified_status says the same. Not stated, and neither the first date nor a shortcut stated, the start is cannot determine (decision 4 of 2026-11-23); its readers also count from qualified_status_date, so a status held now that has itself lasted the five years needs neither."
supplied_by: "SAVE response (the class of admission and the earlier statuses it reports), Form I-94, the agency's finding (a battered non-citizen) and the person's statement of the statuses held since entry."
sources: [S176, S12, S1900, S1901]
tags: [immigration]
rationale: "KL-SNAP-3 (close-out verification F1, docs/reviews/verify-closeout-fixes.md, probe A7): a non-citizen who is not a lawful permanent resident and whose only qualified status began after she entered the United States in no status (a battered non-citizen since 2022-06-01 who entered in 2018) had no fact saying the status held now is the first, so the five years (CO-7820, read by SNAP's CO-307, CO-3713, CO-3736, CO-3738, the cash programs' CO-508 and Medicaid's CO-7550) were cannot determine unless the case stated first_qualified_status_date again with the same date. A neutral fact of the person's immigration history, the same for every program."
nearest: [CO-7770, CO-2700]
