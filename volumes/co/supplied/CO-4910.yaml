id: CO-4910
name: "CCCAP: caretaker joined the household during the eligibility period"
identifier: cccap_caretaker_joined_during_eligibility_period
kind: supplied
type: yes/no
scope: person
program: CCCAP
meaning: "This adult caretaker or teen parent joined the CCCAP household after its most recent eligibility determination (its application, redetermination or transition), during the current twelve-month eligibility period: a caretaker the case record did not have at that determination, such as a new spouse or stepparent who moved in."
precision: "A fact of the CCCAP case record (CHATS), the caretakers' counterpart of cccap_child_was_authorized_at_last_determination (CO-4462). Read only at a change reported during the eligibility period (cccap_determination_type, CO-3307). If not stated, CCCAP reads it as false, which tests the caretaker's activity as at any determination."
supplied_by: "The county's CCCAP case record (CHATS) of the household's caretakers at the last determination."
sources: [S3635, S3252]
open: [OQ-871]
tags: [household]
rationale: "Coverage pass 3 C3-1 (docs/reviews/coverage3-cccap.md): 8 CCR 1403-1 3.125.EE.1 (S3635) acts at once on a change in household composition only when an additional child requests care, and EE.2 holds every other change until the redetermination; 3.125.Q.2 (S3252) discontinues care before the redetermination only when a caretaker \"is no longer in a qualifying low-income eligible activity\", which a caretaker who was not in the household at the determination never was. No fact said which caretakers were in the household at the last determination, so a new spouse with no activity ended the household's care at a change."
