id: CO-4336
name: "Land for a permanent home value"
identifier: land_for_permanent_home_value
kind: supplied
type: money
scope: person
program: All
meaning: "The part of real_property_other_than_home_equity (CO-3393) in property the person owns or is buying, when the person's household owns no home, on which the person intends to build or is building a permanent home."
precision: "Part of real_property_other_than_home_equity, not added to it; equity value, as of the determination date. If not stated, SNAP reads it as 0."
supplied_by: "Applicant statement; deed or purchase contract; building plans or permit."
sources: [S3118]
tags: [snap, resources]
rationale: "Coverage review snap-financial CF-7: 4.410.B (S3118) exempts the lot on which a household without a home intends to build; SNAP counted it."
