id: CO-023
name: "Gross wages"
identifier: wages_gross
kind: supplied
type: money
scope: person-month
program: All
meaning: "The person's gross wages, salaries, tips, commissions and bonuses received as an employee for the month, before taxes, insurance premiums, retirement contributions or any other amount withheld. Self-employment income is not included (self_employment_gross_receipts, CO-1700). Stated as the gross amount received for the month, before any deduction withheld and before any program's exclusions or disregards; each program's own rule decides what it counts."
supplied_by: Pay stubs, the Work Number, employer verification.
sources: []
tags: [income]
rationale: "A fact the case must supply; no existing item in the Colorado volume carries it (the volume began empty in phase 1, and the mwr volume's facts are not shared across volumes). It is reserved for the SNAP income, deduction, work registration and ABAWD rules of later batches, which read it by this identifier. Vocabulary fix round (docs/reviews/vocabulary-reuse.md, R-1): renamed from wages_gross. The name read as all earned income, and five programs (Colorado Works, Adult Financial, SSI-related Medicaid, the Buy-In and the spousal family allowance) read it that way, leaving self-employment out of their tests. The phase 2 note that the supplied income facts are countable, post-exclusion amounts no longer holds: every supplied income fact is gross."
