id: CO-2344
name: "CCCAP: excluded income"
identifier: cccap_excluded_income
kind: supplied
type: money
scope: person-month
program: CCCAP
meaning: "The part of this person's gross earned and unearned income for the month, as stated in the income facts, that 8 CCR 1403-1 3.111.J excludes, other than the earnings of a household child who is not a teen parent, which cccap_household_income already leaves out (3.111.J.1)."
precision: "If not stated, CCCAP reads this as 0 (no excluded income). The member's counted income never falls below zero."
supplied_by: "Eligibility technician's application of the program's exclusion list to the income reported."
sources: [S1623]
tags: [income]
rationale: "OQ-390: supplied income facts state the gross amount received before any program's exclusions (vocabulary review R-1), and 8 CCR 1403-1 3.111.J (S1623) has its own exclusion list; cccap_household_income (CO-985) subtracts this program's own excluded amount."
