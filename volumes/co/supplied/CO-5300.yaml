open: [OQ-1200, OQ-1201]
rationale: "Product-owner decision of 2026-11-23 (earned income and resources move to records) and design decisions D3, D5, D8 and D9 (docs/design-earned-and-resource-records.md 7): one list of records of the same record type as receipts and earnings, read by the same operators (P55-P57) and by P58 largest for the one vehicle the rules exclude, so a holding is stated once whatever program reads it, a joint holding is stated with its share on each owner's list, money a rule treats by its source is traced in its own record, and one transfer is one record every program's look-back reads. Replaces, from step H1, the scalar resource facts the design's inventory (1.2) lists."
