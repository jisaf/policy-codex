id: CO-032
name: Dependent care expense
identifier: dependent_care_expense
kind: supplied
type: money
scope: person-month
program: All
meaning: The monthly out-of-pocket dependent care expense billed to or paid by this person, necessary for a household member to work, look for work, or attend training or education; zero for a person who is billed for and pays none.
precision: "Stated for every member of the household, a disqualified member or an ineligible student included, since SNAP counts a member's billed expense according to that member's status (snap_counted_dependent_care_expense_of_member, CO-2301; 10 CCR 2506-1 4.407.4.A). An unstated value is unknown, not zero."
supplied_by: Provider receipts, applicant statement.
sources: [S1601]
tags: [income]
rationale: "A fact the case must supply; no existing item in the Colorado volume carries it (the volume began empty in phase 1, and the mwr volume's facts are not shared across volumes). It is reserved for the SNAP income, deduction, work registration and ABAWD rules of later batches, which read it by this identifier."
