id: CO-032
name: Dependent care expense
identifier: dependent_care_expense
kind: supplied
type: money
scope: person-month
program: All
meaning: The person's monthly out-of-pocket dependent care expense necessary for a household member to work, look for work, or attend training or education.
supplied_by: Provider receipts, applicant statement.
sources: []
tags: [income]
rationale: "A fact the case must supply; no existing item in the Colorado volume carries it (the volume began empty in phase 1, and the mwr volume's facts are not shared across volumes). It is reserved for the SNAP income, deduction, work registration and ABAWD rules of later batches, which read it by this identifier."
