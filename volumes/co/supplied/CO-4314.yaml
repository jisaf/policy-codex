id: CO-4314
name: "Income received for a person living elsewhere"
identifier: income_received_for_person_living_elsewhere
kind: supplied
type: money
scope: person-month
program: All
meaning: "Money the person received in the month that is intended and used for the care and maintenance of another person who does not live with the person (a benefit or support payment the person receives as payee for that other person): the identifiable portion of a payment meant for that person and others, or, where it cannot be identified, the lesser of that person's even share of the payment and the amount actually used for that person's care."
precision: "Part of the person's gross unearned income for the month as the unearned income facts state it, not added to it. If not stated, SNAP reads it as 0."
supplied_by: "Applicant statement; the payment notice naming the beneficiaries."
sources: [S3100]
tags: [snap, income]
rationale: "Coverage review snap-financial CF-1: 4.405.B (S3100) excludes money received and used for a third-party beneficiary who is not a household member, pro rata where not identifiable; no fact stated it."
