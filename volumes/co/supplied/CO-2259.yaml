id: CO-2259
name: Meets the HCBS-CES setting and member criteria
identifier: ma_meets_ces_setting_and_member_criteria
kind: supplied
type: yes/no
scope: person
program: Medicaid
meaning: "Whether the person meets the HCBS-CES target group criteria other than age, developmental disability and level of care (10 CCR 2505-10 § 8.7101.B.2.b, d): requires long term services and supports to remain in the family home; resides with a biological or adoptive parent or legal guardian, or in an out-of-home placement from which the child can return home with the waiver's services under an approved transition plan; meets the disability definition of 42 U.S.C. 423(d); and has a behavior or medical condition requiring direct human intervention at least once every two hours during the day and on average once every three hours at night, beyond what is age appropriate, from a significant pattern of self-endangering or aggressive behavior or constant vocalizations."
supplied_by: The Case Management Agency's assessment.
sources: [S1511]
tags: [ma, hcbs, disability]
rationale: "OQ-210: the CES setting and member criteria were folded into the designation; no fact stated them."
