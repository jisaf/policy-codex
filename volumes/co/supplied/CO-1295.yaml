id: CO-1295
name: School meal household monthly income
identifier: school_meal_household_income
kind: supplied
type: money
scope: case
program: SunBucks
meaning: "The current monthly gross income of the child's school meal household, as reported on an NSLP/SBP or Summer EBT application, per 7 CFR 292.5 and the Income Eligibility Guidelines."
precision: "One value for the case: the one school meal or Summer EBT application."
supplied_by: NSLP/SBP or Summer EBT application.
sources: [S791, S799]
tags: [sebt, income]
rationale: "As for school_meal_household_size (CO-1294), the school-meal household's income is stated, not derived; sebt_eligibility_status (CO-1298) needs it. Dual-entry audit 1.13-1.17 and 5.9 (OQ-541, same-word SW-9): a fact about the application or the home has one value per case (convention rule 18), stated once in the case's case_facts instead of on each member."
nearest: [CO-1294]
