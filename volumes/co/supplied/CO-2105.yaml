id: CO-2105
name: County of residence
identifier: county_of_residence
kind: supplied
type: text
scope: person
program: All
meaning: "The Colorado county in which the person resides, by its name (for example \"Denver\"); empty or not stated for a person who does not reside in Colorado."
supplied_by: "Applicant's address on the application, verified as the program requires."
sources: [S1408]
tags: [household]
rationale: "OQ-159 and OQ-393: no fact states a person's county; 8 CCR 1403-1 3.111.A makes CCCAP a county residency test. Neutral (program All): the county a person lives in is a plain fact any program may read. cccap_meets_county_residency (CO-2107) reads it."
