id: CO-4662
name: "School attendance expenses paid"
identifier: school_attendance_expenses_paid
kind: supplied
type: money
scope: person-month
program: All
meaning: "The expenses necessary for the person's school attendance that the person paid or owes for the month: tuition, fees, books, and the supplies, equipment and transportation the attendance requires."
precision: "Colorado Works and Adult Financial read it with no default (decision 4; coverage pass 4 CA4-16)."
supplied_by: "Applicant statement with the school's bill, receipts or the award's cost of attendance, as the county establishes them."
sources: [S3451]
implemented: engine
tags: [income]
rationale: "Coverage pass 2 (CW2-4): 9 CCR 2503-6 3.605.3.A.4 (S3451) counts benefits conditional upon school attendance only \"to the extent that they exceed expenses necessary for school attendance\"; no fact stated those expenses. unearned_income_offsetting_expenses (CO-4444) is one total across rental, workers' compensation, insurance and education receipts, so it cannot cap the school-attendance part alone."
