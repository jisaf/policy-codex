id: CO-1319
name: Unearned income verification document received
identifier: unearned_income_verification_document_received
kind: supplied
type: yes/no
scope: person
program: All
meaning: Whether the agency has received documentary evidence (or an acceptable collateral contact) verifying the person's unearned income for this application, such as an award or cost-of-living letter showing the gross amount, or a statement from the payer.
supplied_by: Date-stamped document receipt and collateral-contact entries in the CBMS case file.
sources: [S866, S898]
tags: [verification, income]
rationale: No existing item in the volume carries this fact; the phase-9 verification chapter (design amended 2026-11-21) needs it, and it is program-neutral so every program's verification rules read the same value.
