id: CO-1700
name: "Self-employment gross receipts"
identifier: self_employment_gross_receipts
kind: supplied
type: money
scope: person-month
program: All
meaning: "The person's gross receipts from self-employment (a trade or business the person operates as a sole proprietor, independent contractor, partner or consultant) for the month, before any cost of doing business is deducted. Stated as the gross amount received for the month, before any deduction withheld and before any program's exclusions or disregards; each program's own rule decides what it counts."
precision: "Each program nets it with its own allowable costs: snap_self_employment_income (CO-1702), ma_self_employment_net_earnings (CO-1704), cw_self_employment_net_profit (CO-1706), af_self_employment_net_profit (CO-1708), cccap_self_employment_net_earnings (CO-1710), leap_self_employment_income (CO-1712). MAGI reads the federal tax figure, self_employment_net_earnings_for_tax (CO-024). Zero when the person has no self-employment, and then no program needs its cost fact."
supplied_by: "Self-employment ledger, profit and loss statement, receipts or tax return."
sources: [S41, S1152, S1154, S1155, S1156, S1157, S1084]
tags: [income]
rationale: "Vocabulary fix round (docs/reviews/vocabulary-reuse.md, R-1): every program that counts self-employment nets gross receipts by its own list of allowable costs; one shared 'net' figure could not be right for all of them."
