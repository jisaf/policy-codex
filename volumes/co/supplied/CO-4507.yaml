id: CO-4507
name: Money from selling or cashing in the person's own resources in the thirty days before the application
identifier: resource_liquidation_proceeds_received_prior_thirty_days
kind: supplied
type: money
scope: person
program: All
meaning: "The part of lump_sum_received_prior_thirty_days (CO-4066) that is money the person obtained in the thirty days before the application date by selling, cashing in or otherwise converting the person's own resources (a vehicle, property, savings bonds, a certificate of deposit or other holdings) to cash."
precision: "Part of lump_sum_received_prior_thirty_days, not added to it. If not stated, a program reads it as 0."
supplied_by: "The applicant's statement and the record of the sale or withdrawal."
sources: [S3302, S2712]
tags: [income]
rationale: "Coverage review C-1: 9 CCR 2503-7 3.752.23.GG (S3302) excludes \"Money obtained from the liquidation of personal resources\". Such money is stated as a one-time receipt, and LEAP counts the one-time receipts of the income verification period (leap_person_one_time_income, CO-4069), so it was counted. The part is stated for the same thirty days as the lump sum it belongs to, as the retroactive benefit parts are (CO-4067, CO-4068)."
nearest: [CO-4066]
