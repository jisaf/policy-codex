id: CO-1301
name: Identity verification document received
identifier: identity_verification_document_received
kind: supplied
type: yes/no
scope: person
program: All
meaning: Whether the agency has received documentary evidence (or an acceptable collateral contact) verifying the person's identity for this application, such as a driver's license or identification card, a work or school identification, or another identity document.
supplied_by: Date-stamped document receipt and collateral-contact entries in the CBMS case file.
sources: [S806, S848]
tags: [verification]
rationale: No existing item in the volume carries this fact; the phase-9 verification chapter (design amended 2026-11-21) needs it, and it is program-neutral so every program's verification rules read the same value.
