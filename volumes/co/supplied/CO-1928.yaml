id: CO-1928
name: Is a veteran rated totally disabled
identifier: is_veteran_rated_totally_disabled
kind: supplied
type: yes/no
scope: person
program: All
meaning: Whether the person is a veteran with a temporary or permanent disability rated by the Department of Veterans Affairs as 100 percent (total) under 38 U.S.C. 1155.
supplied_by: The applicant's or beneficiary's statement, verified as 42 CFR 435.557 requires (reliable information available to the State first).
sources: [S1209]
tags: [ma, disability]
rationale: "OQ-65: receives_va_disability_benefits (CO-016) is broader (any VA disability compensation or pension, aid and attendance, housebound); 42 CFR 435.554(c)(4) excludes only the 100 percent rating."
