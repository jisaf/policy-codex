id: CO-2398
name: "CCCAP: activity schedule received"
identifier: cccap_activity_schedule_received
kind: supplied
type: yes/no
scope: person
program: CCCAP
meaning: "The county has received this caretaker's work or low-income activity schedule (8 CCR 1403-1 3.111.C.2.e) or, for a self-employed caretaker, the expected weekly employment schedule with approximate hours and the documentation of income and work-related expenses (3.111.G.2.a-b)."
supplied_by: "Schedule and expense documents."
sources: [S1637]
tags: [verification]
rationale: "OQ-378: 3.111.C.2 and the paragraphs it points to (S1637) require this verification; no fact stated it, so the worker carried it outside the volume."
