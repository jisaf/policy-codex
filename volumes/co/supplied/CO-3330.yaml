id: CO-3330
name: Residence setting type
identifier: residence_setting_type
kind: supplied
type: one of
options: [private_dwelling, hospital, nursing_facility, icf_iid, psychiatric_hospital, tuberculosis_hospital, assisted_living_residence, group_home, host_home, other_long_term_care_facility, substance_use_treatment_facility, child_care_institution, correctional_facility, educational_or_vocational_institution, room_and_board, hotel, commercial_property, other_institution]
scope: person
program: All
meaning: "The kind of place the person lives in on the determination date, described as a fact and in the terms of 42 CFR 435.1010, not as any program's classification: private_dwelling (a house, apartment or mobile home, the person's own or another household's, a foster family's home, or no fixed dwelling at all: a shelter, a temporary stay, a place not meant for sleeping; nighttime_residence_type says which); hospital; nursing_facility; icf_iid (an intermediate care facility for individuals with intellectual disabilities); psychiatric_hospital; tuberculosis_hospital; assisted_living_residence; group_home; host_home; other_long_term_care_facility; substance_use_treatment_facility (a residential drug or alcohol treatment and rehabilitation facility); child_care_institution (a residential child care facility); correctional_facility (a jail, prison, holding or juvenile detention facility); educational_or_vocational_institution (a dormitory, fraternity or sorority house, or a residential school or training institution); room_and_board (room and board, or a bed and breakfast); hotel; commercial_property (a commercial property that is also the person's dwelling); other_institution (any other establishment furnishing food, shelter and some treatment or services to four or more unrelated persons)."
precision: "One value per person. A resident of a setting other than a private dwelling also states institution_entry_date (CO-008) and the setting's facts a reader asks for (CO-3331 to CO-3336); nighttime_residence_type's institution option is a setting here other than private_dwelling. Each program's test is its own derived item: resides_in_medical_institution (CO-1742), snap_resides_in_institution_providing_meals (CO-007), is_patient_in_institution_for_mental_diseases (CO-1104), ma_oap_is_patient_in_tb_or_mental_health_institution (CO-1748), is_inmate_of_public_institution (CO-1105), af_is_inmate_of_correctional_institution (CO-3343), leap_living_arrangement (CO-1283), the Adult Financial facility tests (CO-1510, CO-2006, CO-2007) and ma_resides_in_sls_setting (CO-2267)."
supplied_by: "Application (living arrangement), the facility's admission record."
sources: [S2201, S2202, S2200, S3, S774, S1008, S1318]
implemented: engine
tags: [household]
rationale: "Same-word audit SW-20 and SW-21, dual-entry audit 2.10 and 3.20: where a person lives was stated by thirteen facts, each one program's classification (SNAP's meals institution, Medicaid's medical institution and IMD, the OAP Health Care exclusion, Adult Financial's three facility lists, LEAP's living arrangements, the inmate fact), which could contradict one another. One neutral description of the setting, in the terms of 42 CFR 435.1010 (S2201, S2202), is stated once; each program's test is a derived item."
