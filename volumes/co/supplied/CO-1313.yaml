id: CO-1313
name: Residency verification document received
identifier: residency_verification_document_received
kind: supplied
type: yes/no
scope: person
program: All
meaning: Whether the agency has received documentary evidence (or an acceptable collateral contact) verifying the person's Colorado (or county) residence for this application, such as a lease or rent receipt, a utility bill, a driver's license with a Colorado address, or a landlord's collateral statement.
supplied_by: Date-stamped document receipt and collateral-contact entries in the CBMS case file.
sources: [S805, S824, S890]
tags: [verification]
rationale: No existing item in the volume carries this fact; the phase-9 verification chapter (design amended 2026-11-21) needs it, and it is program-neutral so every program's verification rules read the same value.
