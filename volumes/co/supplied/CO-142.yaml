id: CO-142
name: "Colorado Works: sanction level this month"
identifier: work_sanction_level_this_month
kind: supplied
type: whole number
scope: person-month
program: All
meaning: The Workforce Development sanction level (0 = none, 1-3 = first through third level, 4 = fourth level) the county has imposed on this person for this month under 9 CCR 2503-6 3.608.4, after completing the re-engagement process of 3.608.3 without good cause.
precision: "A figure the county's re-engagement and sanctioning process determines, not one this volume derives: 3.608.3's good-cause determination, the re-engagement appointment process, and 3.608.4.C.1's progression from one level to the next (whether the client re-engaged by the end of the month the prior sanction was served) are all county case-management steps this volume does not model (see OQ-141) - the level itself, as of the month being determined, is the fact this volume needs. Program-neutral per this volume's convention that a bespoke county-determined input is a supplied fact regardless of which program's rule reads it (docs/governance.md's supplied-facts-are-program-neutral rule), even though only Colorado Works items read it today."
supplied_by: The county's Workforce Development sanction determination, entered in the Statewide Automated System per 3.608.3.I.1 and 3.608.4, for this person for this month.
sources: [S551, S552, S556]
open: [OQ-141]
tags: [cash, tanf]
rationale: "No existing item carries a Colorado Works sanction level; the nearest same-shape item is months_of_assistance_received (CO-840), a supplied county-tracked monthly count read by a Colorado Works rule, acknowledged here, but that item counts months toward the federal time limit and carries no sanction-level semantics. cw_unit_sanction_level (CO-931, new) needs a per-person per-month figure for how far a client has progressed through 3.608.4.C's four sanction levels; the level itself (unlike the 25%/100% reduction rates, which 3.608.4.C states as fixed percentages, now cw_sanction_reduction_rate_levels_one_to_three/cw_sanction_reduction_rate_level_four) is not stated by any formula in the fetched text - it depends on the county's own re-engagement and progression history (3.608.3, 3.608.4.C.1, 3.608.4.G), which this volume does not model end to end (OQ-141)."
