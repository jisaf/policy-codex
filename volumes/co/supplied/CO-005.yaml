id: CO-005
name: "Has a military connection"
identifier: has_military_connection
kind: supplied
type: yes/no
scope: person
program: All
meaning: The person is on active duty (other than training) in the U.S. Armed Forces, or is an honorably discharged veteran, or is the spouse, surviving spouse, or unmarried dependent child of such a person, within the military-connection category.
supplied_by: DD Form 214 or other military service verification, applicant statement.
sources: [S16, S1150]
tags: [immigration]
rationale: "A fact the case must supply; no existing item in the Colorado volume carries it (the volume began empty in phase 1, and the mwr volume's facts are not shared across volumes). It is read by SNAP: is exempt from the non-citizen waiting period. Vocabulary fix round (C-1): renamed from is_veteran_or_active_duty, whose name hid the spouse, surviving spouse and dependent child; read by SNAP (CO-306), Medicaid (CO-1172) and the shared 8 U.S.C. 1613(b) exemption (CO-1725)."
