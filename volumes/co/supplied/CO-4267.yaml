id: CO-4267
name: "SNAP: household refused to cooperate"
identifier: snap_household_refused_to_cooperate
kind: supplied
type: yes/no
scope: case
program: SNAP
meaning: "The household refused - not merely failed or was unable - to cooperate in providing information to the State agency necessary to determine its eligibility, or to complete a later review of its eligibility, including a review generated by a reported change, a recertification or a quality control review (7 U.S.C. 2015(c); 10 CCR 2506-1 4.500.E)."
precision: "One value for the case. If not stated, SNAP reads this as false. The household is ineligible while it refuses (snap_is_eligible, CO-386); a household that has not provided verification within the time allowed is past_due (snap_verification_status, CO-1394), which is not a refusal."
supplied_by: "The county's finding, recorded in the case with the information refused."
sources: [S3070, S3072]
tags: [snap, verification, application_wide]
rationale: "Coverage review P2-8 (docs/reviews/coverage-snap-nonfinancial.md): 2015(c) (S3070) and 4.500.E (S3072) bar a household that refuses to cooperate, and the volume had no fact and no recorded scope decision for it. No existing fact states a refusal."
