id: CO-4887
name: Disability onset date
identifier: disability_onset_date
kind: supplied
type: calendar date
scope: person
program: All
meaning: "The date on which the person's disability began, as the Social Security Administration (or, for Medical Assistance, the state's disability determination contractor) determined it with the finding that the person meets the SSA definition of disability (meets_ssa_disability_criteria)."
precision: "Stated only for a person found disabled whose onset date is in the record. If not stated, no program reads a month as before the onset."
supplied_by: "The SSA award letter or the disability determination."
sources: [S3623]
tags: [ma, non_magi, disability]
rationale: "Coverage pass 2 (first pass NM-30, deferred): 10 CCR 2505-10 § 8.100.5.C.4.b (S3623) grants a retroactive month to a disabled applicant only with a disability onset date on or before the date of the medical service, and meets_ssa_disability_criteria (CO-011) is undated. Read by ma_month_is_before_disability_onset (CO-4888)."
