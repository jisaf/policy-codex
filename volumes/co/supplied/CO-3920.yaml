id: CO-3920
name: Retroactive SSI or public assistance lump sum received
identifier: retroactive_ssi_or_public_assistance_lump_sum_received
kind: supplied
type: money
scope: person-month
program: All
meaning: "Of the nonrecurring lump sum the person received in the month (lump_sum_received, CO-3367), the part that is a retroactive lump-sum payment of Supplemental Security Income or of public cash assistance (Colorado Works, Old Age Pension, Aid to the Needy Disabled, Aid to the Blind) for months before the month received."
precision: "Part of lump_sum_received, not added to it. If not stated, every program reads it as 0."
supplied_by: "The award or payment notice of the Social Security Administration or the county."
sources: [S2208, S2706]
tags: [income]
rationale: "Final pass F-11: LEAP excludes retroactive lump-sum SSI and public assistance payments (9 CCR 2503-7 3.752.23.EE, S2208) and CCCAP excludes SSI and public cash assistance grants (8 CCR 1403-1 3.111.J.2, J.26, S2706); lump_sum_received did not say which part of a lump sum is such a payment."
nearest: [CO-3367, CO-3919]
