id: CO-1938
name: Is an Indian (42 CFR 447.51)
identifier: ma_is_indian
kind: supplied
type: yes/no
scope: person
program: Medicaid
meaning: "Whether the person meets the definition of Indian at 42 CFR 447.51: a member of a federally recognized tribe; an urban Indian who meets one of the four criteria there (including a first or second degree descendant of a tribal member, and an Eskimo, Aleut or other Alaska Native); a person the Secretary of the Interior considers an Indian for any purpose; or a person the Secretary of HHS considers an Indian for Indian health care services."
supplied_by: The applicant's or beneficiary's statement, verified as 42 CFR 435.557 requires (reliable information available to the State first).
sources: [S1208, S1214]
tags: [ma, magi, legal]
rationale: "OQ-65: snap_is_indian_or_urban_indian (CO-050) carries SNAP's definition; 42 CFR 435.554(c)(2) adopts 447.51."
