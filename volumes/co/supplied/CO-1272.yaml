id: CO-1272
name: LEAP statewide adjustment rate
identifier: leap_statewide_adjustment_rate
kind: supplied
type: rate
scope: person
program: LEAP
meaning: The percentage of a household's estimated home heating costs the State LEAP office sets at the start of the program year, from the projected number of applications and the estimated funding, to adjust benefit levels (3.758.47 Step B), expressed as a fraction. Not appealable (3.758.48). Stated on the household head.
precision: "CDHS review C-6: this is a program-year figure, the same for every household, that belongs in a dated global parameter; it stays a supplied fact only because the 2026-2027 figure is not published on an allowed host. It is in the State's annual notification to county departments and the LEAP training manual (3.758.48); cdhs.colorado.gov refused this session, and neither the rule effective November 1, 2025 (D-86) nor the amendments effective November 1, 2026 (D-173) states it (OQ-532). A parameter must state a value (constraints), so the item becomes one when the figure is fetched. Household cases do not state it: CO-01 and CO-02 stated illustrative values until this round, so their LEAP benefit is now unknown."
supplied_by: State LEAP office's annual benefit-level notice to county departments (3.758.48).
sources: [S770]
open: [OQ-253, OQ-532]
tags: [income]
rationale: The rule does not state the annual figure (OQ-123), so it enters as a supplied fact; leap_benefit_amount (CO-1281) needs it.
