id: CO-1315
name: Earned income verified by electronic data source
identifier: earned_income_verified_by_electronic_data_source
kind: supplied
type: yes/no
scope: person
program: All
meaning: "Whether an electronic data source has verified the person's wages for this application: an interface match the agency treats as verification (a wage match through IEVS, the Federal Data Services Hub or The Work Number), so no document is needed for that element."
precision: SNAP, Colorado Works and Adult Financial do not treat Department of Labor wage data as verified upon receipt (4.504.61.B.3, 3.604.3.H.1.b, 3.520.5.A.2), so only Medical Assistance reads this fact. SSA self-employment data, which the cash programs do accept, is self_employment_income_verified_by_electronic_data_source.
supplied_by: CBMS interface results (IEVS, SSA/SOLQ/SVES, SAVE/VLP, DMV, FDSH, The Work Number, Asset Verification Program) as recorded in the case.
sources: [S861, S867]
tags: [verification, income]
rationale: No existing item in the volume carries this fact; the phase-9 verification chapter (design amended 2026-11-21) needs it, and it is program-neutral so every program's verification rules read the same value.
