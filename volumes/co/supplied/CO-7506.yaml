id: CO-7506
name: Ceased living with parent or child date
identifier: ceased_living_with_parent_or_child_date
kind: supplied
type: calendar date
scope: person
program: All
meaning: "For a person who, on the determination date, lives in a different home (dwelling_id) from a parent, stepparent, child or stepchild of the person who is a person of the case, the date the two ceased to live together: the day one of them moved out of the home they shared. Where they live apart because one of them entered a facility (residence_setting_type other than private_dwelling), that one's institution_entry_date is the date and this fact need not be stated. It may be stated on either of the two."
precision: "Required where read: a program that counts a parent's income for a child, or a child in the parent's household, only while they live together reads it for a month after they stopped (the SSI method from the month after the month one of them leaves the household, 20 CFR 416.1165(g)(4), S5122; 416.1167(a)(1), S5120), and not stated, with no facility entry to date it, it cannot be determined (decision 4 of 2026-11-23). Persons who live together state no date. The parent and child version of ceased_living_with_spouse_date (CO-7352); a neutral fact of the household's history. SNAP reads it too (coverage pass 7, C7-1: snap_lives_with_in_month, CO-7672): required for a month before the determination month (7 CFR 273.10(a)(1)(i), S5091), the two living together in a month that began before the date; if not stated, SNAP reads two persons who live apart on the determination date as apart in the determination month and after, the homes of the determination date (OQ-1450)."
supplied_by: "The applicant's statement on the application (who lives at the address, and since when), or the case record."
sources: [S5122, S5120]
tags: [household]
rationale: "Pattern sweep, non-MAGI Medicaid (P3; docs/reviews/pattern-sweep-nonmagi.md): the SSI method's deeming parents and ineligible children (CO-4624, CO-4625, CO-4633, CO-2277) were read from the homes of the determination date in every month, so a parent who moved out in September was not deemed in a retroactive August in which he still lived with the child. ceased_living_with_spouse_date (CO-7352) dates a couple's separation only."
