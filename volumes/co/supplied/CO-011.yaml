id: CO-011
name: "Meets SSA disability criteria"
identifier: meets_ssa_disability_criteria
kind: supplied
type: yes/no
scope: person
program: All
meaning: "SSA, or the state disability determination service applying SSA's rules, has determined the person disabled under the Social Security Act definition (title II and title XVI). It says nothing about whether a benefit is paid."
supplied_by: SSA determination, medical verification.
sources: []
tags: [disability]
rationale: "A fact the case must supply; no existing item in the Colorado volume carries it (the volume began empty in phase 1, and the mwr volume's facts are not shared across volumes). It is read by SNAP: is a disabled member. Vocabulary fix round (R-5, C-1): renamed from is_disabled_ssa, whose meaning had taken the wording of one 7 CFR 271.2 prong. Readers: the SSI-related Medicaid groups and AND-CS. AND-SO reads af_has_total_disability_six_months (CO-1728) and SNAP reads its 271.2 benefit-receipt prongs instead."
