id: CO-2719
name: Battery recognized by a court or the immigration service
identifier: battery_is_recognized_by_court_or_immigration_service
kind: supplied
type: yes/no
scope: person
program: All
meaning: "Whether a court or the immigration service (USCIS) has recognized the battery or extreme cruelty the person (or the person's parent or child) suffered (10 CCR 2506-1 4.305.2.E.5)."
precision: "If not stated, SNAP reads this as false."
supplied_by: "Court order or USCIS notice (for example an approved or prima facie VAWA self-petition)."
sources: [S1619]
tags: [immigration]
rationale: "SW-18: after twelve months SNAP's exemption continues only where \"the battery is recognized by a court or the INS\" (S1619); the recognition was inside the SNAP yes/no fact. Same-word audit SW-18 and dual-entry audit 3.1 (audit fix round): the battery finding is stated once, neutrally (is_victim_of_battery_or_extreme_cruelty, CO-2363, with the finding's date and the living arrangement), and SNAP's exemption (snap_battered_non_citizen_sponsor_exemption_applies, CO-2335) is derived from it."
