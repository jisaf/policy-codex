meaning: The county's assessment finds that the Colorado Works client needs long-term cash assistance or basic cash assistance (a recurrent payment to meet ongoing needs), rather than help with a specific crisis, per 9 CCR 2503-6 3.601 ("Basic cash assistance") and 3.606.8.A.1.
