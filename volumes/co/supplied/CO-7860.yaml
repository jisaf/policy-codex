id: CO-7860
name: Has lived apart throughout the months evaluated
identifier: has_lived_apart_throughout_months_evaluated
kind: supplied
type: yes/no
scope: person
program: All
meaning: "For a person who, on the determination date, lives in a different home (dwelling_id) from one or more other persons of the case, whether the person has lived apart from every one of them throughout the months the case is evaluated for: on no day since the first day of the first month the case is evaluated for has the person lived in one home with any of them, or the person never has (the parent of a child who has never lived with the child or the child's other parent; a relative who left the home before that month). True on either of two persons who live apart means the two lived apart in every month the case is evaluated for, and no date they ceased to live together is stated for them."
precision: "Coverage verification 7, V7-1 (docs/reviews/verify-coverage7-fixes.md): the separation dates (ceased_living_with_spouse_date CO-7352, ceased_living_with_parent_or_child_date CO-7506, ceased_living_with_housemate_date CO-7670) date the day two persons who shared a home ceased to; a pair who never shared one, or who parted before the months evaluated, had no date to state, so the household of a month before the determination month could not be determined (S1-M: a daughter's father listed in the case who has never lived with her). A neutral fact of the household's history, stated where it is so, as moved_into_home_date (CO-7671) is stated only for a person who moved in: if not stated, every reader reads it as false (convention rule 12), and the date the two ceased to live together, or a facility's institution_entry_date, is then required where read (decision 4 of 2026-11-23). A person who shared a home with one of the persons in another home within the months evaluated states it false or leaves it unstated, and states the date of that separation. Read by SNAP's household of the month (snap_lives_with_in_month, CO-7672: a month before the determination month, 7 CFR 273.10(a)(1)(i), S5091) and the SSI method's (ma_ssi_lives_with_in_month, CO-7505: 20 CFR 416.1163, 416.1165): two persons joined by a household edge who live apart on the determination date, one of whom states it true, live apart in every month."
supplied_by: "The applicant's statement on the application (who lives at the address, and since when), or the case record."
sources: [S5091, S1]
tags: [household]
rationale: "Coverage verification 7, V7-1 (P1, rare): SNAP's household of an application month before the determination month (CO-7672) needs, for two persons joined by a household edge who live apart on the determination date, the date they ceased to live together, and a pair who never lived together has none, so the month was cannot determine whatever the case stated, unless it stated a date the facts do not support (S1-N: the child's date of birth). A yes/no of the person states the case without a made-up date."
nearest: [CO-7352, CO-7506, CO-7670, CO-7671]
