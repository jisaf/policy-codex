id: CO-841
name: Receives Title IV foster care, adoption subsidy, or kinship payment
identifier: receives_title_iv_foster_adoption_kinship_payment
kind: supplied
type: yes/no
scope: person
program: All
meaning: "The person receives a foster care, adoption assistance or kinship care payment under title IV of the Social Security Act for the month."
supplied_by: CBMS cross-program benefit record (Colorado's child welfare and adoption assistance systems).
sources: [S409]
rationale: "No existing fact in this volume's interface captures this exclusion; cw_assistance_unit_members (CO-900) needs it to correctly exclude a foster or kinship child from the assistance unit. Vocabulary fix round (docs/reviews/vocabulary-reuse.md, C-1): the meaning states the payment only; Colorado Works exempts it and Medicaid reads it for the citizenship-verification exemption."
