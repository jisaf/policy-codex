id: CO-4368
name: Insurance cash value withdrawn
identifier: insurance_cash_value_withdrawn
kind: supplied
type: money
scope: person-month
program: All
meaning: "Money the person received in the month by taking cash value out of a life or disability insurance policy the person owns (a withdrawal, a policy loan or a surrender of the cash value)."
precision: "Part of the person's gross unearned income for the month as the unearned income facts state it (or lump_sum_received), not added to it; what is still held on the determination date is a resource. If not stated, Colorado Works reads it as 0."
supplied_by: Insurer's statement.
sources: [S3163]
tags: [income]
rationale: "Coverage review CW-14 (P1): 9 CCR 2503-6 3.605.4.B.30 (S3163) exempts \"Life or disability insurance policies that may have a cash value taken\"; no fact stated the cash taken (life_insurance_cash_surrender_value is the value held, a resource). Program-neutral; cw_unearned_income_deductions (CO-4369) subtracts it."
