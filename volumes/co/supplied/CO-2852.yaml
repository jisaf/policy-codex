id: CO-2852
name: "SUN Bucks: other documented categorical basis"
identifier: sebt_other_documented_categorical_basis
kind: supplied
type: yes/no
scope: person
program: SunBucks
meaning: "The child is categorically eligible for Summer EBT on a documented ground other than SNAP, TANF, FDPIR, foster, homeless, migrant, runaway or Head Start status: a member of a household receiving another means-tested program the Secretary has approved for the Summer EBT agency (7 CFR 292.2, 292.6, 292.12(d), 292.14(f)(1)). Individual certification for free or reduced price meals is is_individually_certified_for_free_or_reduced_price_meals (CO-4071), not this fact. If not stated, SUN Bucks reads this as false."
supplied_by: "The school food authority's or the Summer EBT agency's record."
sources: [S790, S792, S1952, S1092]
tags: [sebt]
rationale: "Dual-entry audit 3.27: sebt_other_categorical_basis (CO-1296) bundled this ground with homelessness and foster care, which other facts state; it is now derived, and this is the one ground no other fact states. Second-pass review N-9: individual certification is split out (CO-4071), since 292.14(f)(1) excepts an approved program from verification and not individual certification."
