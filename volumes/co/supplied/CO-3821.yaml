id: CO-3821
name: "Foster care payments received for providing care"
identifier: foster_care_provider_payments_received
kind: supplied
type: money
scope: person-month
program: All
meaning: "Money the person received in the month as payment for providing foster care to a child placed in the person's home by a public or private child placement agency, to the extent the payment is intended for the child's care."
precision: "Part of the person's gross unearned income for the month as the unearned income facts state it (other_unearned_income_taxable or other_unearned_income_nontaxable, or the fact that names the source), not added to it. An amount paid to the provider beyond the foster care payment and not intended for the child's care is not part of this fact. If not stated, every program reads it as 0."
supplied_by: "Applicant statement, the placing agency's payment record."
sources: [S2608, S2609, S2606]
tags: [cash, income]
rationale: "Final cash review FC-2 and FC-3: Colorado Works' and Adult Financial's exclusion items (CO-2340 to CO-2343) summed a closed list of neutral receipt facts, so income the current exempt-income lists name could not be excluded and was counted. 9 CCR 2503-5 3.520.786.M (S2608) exempts payments received for providing foster care, and 20 CFR 416.1124(c)(8) (S2609) excludes them; 9 CCR 2503-6 3.605.4.B.11 (S2606) exempts the foster child's Title IV funds, which the provider receives. The fact states the receipt, program-neutrally (convention rule 13); each program's exclusion item decides whether its list exempts it."
