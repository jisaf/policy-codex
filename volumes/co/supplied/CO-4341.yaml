id: CO-4341
name: "Wages from an owned LLC or S corporation"
identifier: wages_from_owned_llc_or_s_corporation
kind: supplied
type: money
scope: person-month
program: All
meaning: "The part of the person's wages for the month (wages_gross) the person receives as an owner of a limited liability company or S corporation: a salary, or a draw counted as the business's income less all its expenses, or both."
precision: "Part of wages_gross, not added to it. If not stated, SNAP reads it as 0."
supplied_by: "Applicant statement; pay stubs, bank records or the owner's Form 1040."
sources: [S3121]
tags: [snap, income, verification]
rationale: "Coverage review snap-financial CF-10: 4.403.F (S3121) treats an LLC or S-corporation owner's income as wages and accepts the owner's statement of it unless questionable; no fact distinguished it from other wages."
