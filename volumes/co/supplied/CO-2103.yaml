id: CO-2103
name: "CCCAP: already receiving Low-Income Child Care"
identifier: cccap_is_receiving_assistance
kind: supplied
type: yes/no
scope: person
program: CCCAP
meaning: "Whether this person's household already receives Low-Income Child Care assistance - a redetermination, or a change reported during the eligibility period - rather than applying to enter the program, so that 8 CCR 1403-1 3.111.H.1.b's exit income eligibility (85% of state median income) applies instead of H.1.a's entry eligibility."
precision: "Stated for every person in a CCCAP case; CCCAP reads no default."
supplied_by: "The county's CCCAP case record (an open case at redetermination or reporting a change)."
sources: [S1413]
tags: [income]
rationale: "OQ-133 and review C-5: no existing fact says whether a household is entering CCCAP or continuing in it, so the exit limit (CO-993) was never read. cccap_meets_income_guidelines (CO-2104) reads it."
