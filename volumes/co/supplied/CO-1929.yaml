id: CO-1929
name: Condition significantly impairs community engagement
identifier: ma_condition_significantly_impairs_community_engagement
kind: supplied
type: yes/no
scope: person
program: Medicaid
meaning: "Whether the person's physical, mental, or other behavioral health condition significantly impairs the person's ability to comply with the community engagement requirement: the first half of the definition of medically frail in 42 CFR 435.554(c)(5)(i)."
supplied_by: The State's list of diseases, diagnoses, disorders and health conditions (435.554(c)(5)(ii)), claims and encounter data, or the person's request for consideration (435.557(f)).
sources: [S1209]
tags: [ma, magi, medical]
rationale: "OQ-65: the medically frail exclusion requires the impairment together with one of five conditions."
