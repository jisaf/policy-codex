id: CO-4013
name: "Real property or food tax refunds received"
identifier: property_or_food_tax_refund_received
kind: supplied
type: money
scope: person-month
program: All
meaning: "A refund of taxes on real property or on food that a public agency (a county treasurer, a city or the State) paid the person in the month, other than an income tax refund, rebate or credit (tax_refunds_and_credits_received, which includes Colorado's Property Tax/Rent/Heat credit)."
precision: "Part of the person's gross unearned income for the month as the unearned income facts state it (other_unearned_income_taxable or other_unearned_income_nontaxable), not added to it. If not stated, every program reads it as 0."
supplied_by: "Application (income and expenses), the refund notice."
sources: [S2803]
implemented: engine
tags: [income]
rationale: "Final cash review 2, N-4: 9 CCR 2503-5 3.520.786.K incorporates the SSI unearned income exclusions of 20 CFR 416.1124, and (c)(1) excludes \"Any public agency's refund of taxes on real property or food\" (S2803); no fact stated such a refund apart from income tax refunds. A neutral receipt fact, as the other exclusions are stated (convention rule 13)."
