id: CO-4017
name: "State veteran's annuity received"
identifier: state_veteran_annuity_received
kind: supplied
type: money
scope: person-month
program: All
meaning: "An annuity a State paid the person in the month because the State determined that the person, or the person's spouse, is a veteran (as 38 U.S.C. 101 defines one) and is blind, disabled or aged."
precision: "Part of the person's gross unearned income for the month as the unearned income facts state it (other_unearned_income_taxable or other_unearned_income_nontaxable), not added to it. If not stated, every program reads it as 0."
supplied_by: "Application (income and expenses), the State's award letter."
sources: [S2803]
implemented: engine
tags: [income]
rationale: "Final cash review 2, N-4: 20 CFR 416.1124(c)(24), which 9 CCR 2503-5 3.520.786.K incorporates, excludes such an annuity (S2803); no fact stated it."
