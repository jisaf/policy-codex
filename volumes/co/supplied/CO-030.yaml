id: CO-030
name: "Other unearned income, not federally taxable"
identifier: other_unearned_income_nontaxable
kind: supplied
type: money
scope: person-month
program: All
meaning: "The person's unearned income for the month that no other income fact names and that is not federally taxable: for example gifts and contributions from someone outside the household, veterans' benefits, workers' compensation, alimony under a divorce or separation executed after 2018, and general assistance. Tax-exempt interest is tax_exempt_interest (CO-081). Stated as the gross amount received for the month, before any deduction withheld and before any program's exclusions or disregards; each program's own rule decides what it counts."
supplied_by: Applicant statement, verification of the specific income source.
precision: "MAGI-based income (ma_person_magi_income, CO-502) does not read it: 10 CCR 2505-10 8.100.4.C.1.d excludes workers' compensation and veterans' benefits, and gifts and post-2018 alimony are not in the 8.100.4.C.1 list. Every other program's unearned income reads it together with other_unearned_income_taxable (CO-1714). Lottery and gambling winnings and discharged student loan debt have their own facts (CO-1181, CO-1188)."
sources: [S166]
tags: [income]
rationale: "A fact the case must supply; no existing item in the Colorado volume carries it (the volume began empty in phase 1, and the mwr volume's facts are not shared across volumes). It is reserved for the SNAP income, deduction, work registration and ABAWD rules of later batches, which read it by this identifier. Vocabulary fix round (docs/reviews/vocabulary-reuse.md, R-1): renamed from other_unearned_income and split from the taxable part (other_unearned_income_taxable, CO-1714). MAGI added the whole fact, which mixed interest and dividends (taxable) with gifts and contributions (not MAGI income)."
