id: CO-2009
name: "Home Care Allowance: within the transition to HCBS after reassessment"
identifier: af_hca_is_in_hcbs_transition_period
kind: supplied
type: yes/no
scope: person-month
program: AdultFinancial
meaning: "Whether, in the month, the person is a Home Care Allowance client found functionally eligible for Home and Community Based Services at a reassessment (not at application), whose transition to HCBS is delayed for reasons not within the client's control, and the month is within three months of that reassessment - the stay 9 CCR 2503-5 3.570.11.A.2.b allows. If not stated, Adult Financial reads this as false (no transition stay)."
supplied_by: Case Management Agency reassessment record (reassessment date, HCBS transition status).
sources: [S712]
tags: [cash, hcbs]
rationale: "No existing fact states the transition stay; af_hca_eligibility_status (CO-1217) denied HCA on functional HCBS eligibility at any time (OQ-250)."
