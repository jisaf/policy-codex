id: CO-4456
name: "GI Bill subsistence allowance received"
identifier: gi_bill_subsistence_allowance_received
kind: supplied
type: money
scope: person-month
program: All
meaning: "The part of the money the person received in the month through the GI Bill as a veteran that is a subsistence or housing allowance for education or on-the-job training (for example the monthly housing allowance), rather than payment of tuition, fees or books."
precision: "Part of educational_assistance_received (CO-3360), not added to it. If not stated, every program reads it as 0."
supplied_by: "Applicant statement, the Department of Veterans Affairs award letter."
sources: [S3256]
tags: [income]
nearest: [CO-3360]
rationale: "Coverage round (docs/reviews/coverage-cccap.md, F-09): 8 CCR 1403-1 3.111.I.7.c (S3256) counts \"Subsistence allowances paid to veterans through the GI bill for education and on-the-job training\"; educational_assistance_received (CO-3360) includes veterans' educational benefits, which CCCAP excludes as educational aid (J.16, J.19), so a GI Bill housing allowance was excluded. The part-of fact lets CCCAP count it back without changing CO-3360's meaning for the other programs."
