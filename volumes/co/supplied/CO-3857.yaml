id: CO-3857
name: "Value of burial spaces beyond the family's needs"
identifier: burial_spaces_value_beyond_family_needs
kind: supplied
type: money
scope: person
program: All
meaning: "The value of the burial spaces the person owns (plots, gravesites, crypts, mausoleums, caskets, urns, niches and the like) beyond those intended for the person, the person's immediate family, and the brothers, sisters and spouses of those persons."
precision: "If not stated, Adult Financial reads it as 0."
supplied_by: "Applicant statement, deeds and contracts."
sources: [S2619]
tags: [cash, resources]
rationale: "Final cash review FC-8: af_person_countable_resources (CO-3400) counted the whole cash surrender value of life insurance over $1,500 face value, though 9 CCR 2503-5 3.520.75.E-F (S2618) exempt it for an OAP client whose policies are more than forty-eight months old, and it never counted revocable burial funds or excess burial spaces, which 3.520.72.B.8-9 (S2619) count. 3.520.72.B.9 (S2619) counts the value of burial space beyond the immediate family's needs (3.520.77.I); no fact stated it."
