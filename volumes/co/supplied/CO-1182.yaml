id: CO-1182
name: Lottery or gambling winnings month
identifier: lottery_gambling_winnings_month
kind: supplied
type: month
scope: person
program: All
meaning: The calendar month in which the person received the lottery or gambling winnings stated by lottery_gambling_winnings_amount (CO-1181).
precision: Not read when lottery_gambling_winnings_amount is 0, so it may be left unstated for a person with no winnings.
supplied_by: Applicant statement, IRS Form W-2G, or the payout record.
sources: [S669]
tags: [income]
rationale: "S-9 of the phase 7 review: the spreading of § 8.100.4.C.1.b.xiv runs from the month the winnings are received. No existing fact carries that month."
