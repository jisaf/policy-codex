id: CO-837
name: VA Aid and Attendance amount
identifier: va_aid_and_attendance_amount
kind: supplied
type: money
scope: person-month
program: Medicaid
meaning: The dollar amount of this person's VA pension attributable to Aid and Attendance or Unusual Medical Expenses, as determined by the VA, per 10 CCR 2505-10 § 8.100.5.K - excluded from income when determining eligibility, and not used as patient payment (K.1), except for a veteran or surviving spouse of a veteran with no dependents in a State Veterans Home, for whom it is used as patient payment (K.2).
precision: Zero for a person who does not receive an A&A/UME VA pension portion (receives_va_aid_and_attendance false).
supplied_by: VA pension award letter, verified by the Eligibility Site.
sources: [S2900, S1738]
tags: [ma, ltc, income]
rationale: "Companion figure to receives_va_aid_and_attendance (CO-836), needed as the dollar amount ma_ltc_gross_income (CO-641) excludes. Final verification pass 2, F2-2: cited as § 8.100.6.C.1; the rule is § 8.100.5.K (S2900). ma_patient_payment (CO-658) adds it under K.2."
