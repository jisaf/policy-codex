id: CO-4371
name: Retroactive Colorado Works lump sum received
identifier: retroactive_colorado_works_lump_sum_received
kind: supplied
type: money
scope: person-month
program: All
meaning: "Of the retroactive lump-sum public assistance payment the person received in the month (retroactive_ssi_or_public_assistance_lump_sum_received, CO-3920), the part that is a retroactive payment of Colorado Works (Colorado TANF) basic cash assistance for months before the month received, such as the correction of an underpayment (9 CCR 2503-6 3.609.2.G). Another State's TANF is not part of it."
precision: "Part of retroactive_ssi_or_public_assistance_lump_sum_received (CO-3920), and so of lump_sum_received and the unearned income facts, not added to them. If not stated, Colorado Works reads it as 0."
supplied_by: CBMS payment record (underpayment correction).
sources: [S3167, S1621]
tags: [income]
rationale: "Coverage review CW-23 (P2): a retroactive Colorado Works payment is part of CO-3920 and so of the unearned income facts, so Colorado Works counted its own grant as income although cw_countable_unearned_income (CO-908) says the unit's own grant is not income to it. CO-3920 joins SSI and several programs' payments; no fact split out the TANF part. Program-neutral; cw_unearned_income_deductions (CO-4369) subtracts it."
