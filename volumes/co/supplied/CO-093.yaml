id: CO-093
name: CHP+ annual enrollment fee
identifier: chp_annual_enrollment_fee
kind: supplied
type: money
scope: person
program: CHP+
meaning: The annual enrollment fee CBMS assesses for the enrollee's family under 10 CCR 2505-3-300's fee schedule, which varies by the family's income as a percentage of the Federal Poverty Level and by the number of children enrolled.
precision: "This volume's phase-3 brief asks for chp_annual_enrollment_fee to be modeled as a derived rule - a `case` over ma_magi_household_income_pct_fpl bands, with the band boundaries and dollar amounts as parameters read from 10 CCR 2505-3-300. That section's page was fetched (documents/D-42.md, retrieved 2026-09-18) but rendered no substantive text under the '10 CCR 2505-3-300' heading - only the amendment-history 'Notes' block that follows every section of this regulation - so no band boundary or dollar figure for the enrollment fee is available from any document this volume has fetched. Per this volume's provenance rule (no number is stated from memory), this item is modeled as a supplied fact naming CBMS's own determination, in the same way utility_allowance_amount (CO-036, SNAP chapter) stands in for a state-published table this volume's fetched documents do not state. See OQ-57, which asks a future batch to re-fetch 10 CCR 2505-3-300's substantive text and replace this item with the derived case-over-FPL-bands rule the brief describes."
supplied_by: HCPF Children's Basic Health Plan enrollment fee schedule (10 CCR 2505-3-300), as loaded in CBMS.
sources: []
open: [OQ-57]
tags: [chp, income]
rationale: "No existing item carries the CHP+ enrollment fee. Kept as a supplied fact rather than the derived case-over-FPL-bands rule the phase-3 brief describes, because 10 CCR 2505-3-300's dollar table did not render in this volume's fetched copy of the regulation (see precision) and this volume's provenance rule forbids inventing the band boundaries or dollar amounts. Distinct from the 320 copayment amounts (S-cited but not modeled as items in this batch, see OQ-60), which are per-visit charges rather than the single annual per-family fee 300 states exists."
