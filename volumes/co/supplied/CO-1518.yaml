id: CO-1518
name: Participates in workforce training or post-secondary education
identifier: is_in_workforce_training_or_post_secondary_education
kind: supplied
type: yes/no
scope: person
program: CCCAP
meaning: Whether, for the period care is requested, this person participates in workforce training (vocational, technical or job skills training resulting in a diploma, license or certificate) or post-secondary education - the activities that make a parent under twenty-one an adult caretaker rather than a teen parent under 8 CCR 1403-1 3.103.EEEEE and 3.111.G.4.a.1-2.
supplied_by: Applicant statement with the school's or training program's enrollment verification.
sources: [S1016]
tags: [household, age]
rationale: "No existing fact separates workforce training and post-secondary education from secondary school (phase-8 review K-7, OQ-124). is_enrolled_in_school (CO-020) is the shared secondary-school fact the vocabulary review proposes to split; is_enrolled_higher_education_half_time (CO-021) is SNAP's student test, which does not include vocational or job skills training. cccap_is_teen_parent (CO-981) and cccap_is_adult_caretaker (CO-992) need it for the current teen-parent definition."
nearest: [CO-020, CO-021]
