id: CO-4639
name: "Unspent retroactive SSI or Social Security payment"
identifier: retroactive_benefit_payment_unspent_value
kind: supplied
type: money
scope: person
program: All
meaning: "Of liquid_resources_value (CO-3390), the unspent part of a retroactive lump-sum payment of SSI or Social Security (Title II) benefits the person received."
precision: "Part of liquid_resources_value, not added to it. As of the determination date. If not stated, every program reads it as 0."
supplied_by: "The award notice and the account statements."
sources: [S3404]
tags: [resources, income]
rationale: "Coverage review NM-6, NM-23: 10 CCR 2505-10 § 8.100.5.F.6.c exempts a retroactive SSI or Title II lump sum for nine months following receipt and counts the remainder as a resource thereafter; no fact separated it from the person's liquid resources."
nearest: [CO-3919, CO-4640]
