id: CO-3315
name: "Burial assistance: resources of responsible persons outside the case"
identifier: af_burial_responsible_persons_outside_case_resources
kind: supplied
type: money
scope: person
program: AdultFinancial
meaning: "The countable resources of the decedent's legally responsible persons who are not persons of this case, excluding any Social Security lump-sum death benefit (9 CCR 2503-5 3.570.43.D.3.a). Stated on the decedent."
precision: "Required where Adult Financial (af_burial_responsible_person_resources, CO-1225) reads it (coverage pass 6 CA6-7, docs/reviews/coverage6-cash.md; decision 4 of 2026-11-23): not stated is cannot determine; before, Adult Financial read an unstated value as 0."
supplied_by: "Legally responsible person's statement and verification."
sources: [S721, S722]
implemented: engine
tags: [cash, resources]
rationale: "Dual-entry audit 1.9: the resources of the decedent's spouse or parents, and whether they are a couple, were entered on the decedent, restating the decedent's spouse and parent relationships. The legally responsible persons are now read from the relationships (3.570.42, S722) and their own countable resources; only responsible persons outside the case are stated."
