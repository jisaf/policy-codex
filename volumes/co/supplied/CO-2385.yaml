id: CO-2385
name: "Adult Financial: medical payments for dependents"
identifier: af_medical_payments_for_dependents
kind: supplied
type: money
scope: person-month
program: AdultFinancial
meaning: "The medical care payments this person (an OAP client's spouse) made in the month for his or her dependents who are not covered by Medicare, Medicaid or other health programs (9 CCR 2503-5 3.534.B.4)."
precision: "If not stated, Adult Financial reads this as 0."
supplied_by: "Receipts, applicant statement."
sources: [S1632]
tags: [cash, income]
rationale: "OQ-114: 3.534.B.4 (S1632) deducts these payments from the spouse's unearned income before deeming; no fact stated them."
