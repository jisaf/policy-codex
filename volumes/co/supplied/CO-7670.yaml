id: CO-7670
name: Ceased living with housemate date
identifier: ceased_living_with_housemate_date
kind: supplied
type: calendar date
scope: person
program: All
meaning: "For a person who, on the determination date, lives in a different home (dwelling_id) from another person of the case who is not the person's spouse, a person held out as the person's spouse, a parent, stepparent, child or stepchild (a person the two buy and prepare meals with, or a child in the person's care or guardianship), the date the two ceased to live together: the day one of them moved out of the home they shared. Where they live apart because one of them entered a facility (residence_setting_type other than private_dwelling), that one's institution_entry_date is the date and this fact need not be stated. It may be stated on either of the two."
precision: "Required where read: a program that builds a month's household from the persons who live together reads it for a month before the determination month (SNAP's household of the month, snap_lives_with_in_month CO-7672: 7 CFR 273.10(a)(1)(i), S5091, the application month on \"the household's circumstances for the entire month of application\"), and not stated, with no facility entry to date the separation, it cannot be determined (decision 4 of 2026-11-23). Persons who live together state no date. The version, for any other two persons of the case, of ceased_living_with_spouse_date (CO-7352) and ceased_living_with_parent_or_child_date (CO-7506); a neutral fact of the household's history, which programs count the two apart in which months being each program's own rule."
supplied_by: "The applicant's statement on the application (who lives at the address, and since when), or the case record."
sources: [S5091, S1]
tags: [household]
rationale: "Coverage pass 7 for SNAP, C7-1 (docs/reviews/coverage7-snap.md): SNAP built every month's household from the homes of the determination date, so a member who moved out between the application month and the determination was left out of the application month he lived in. The spouse and parent-or-child separation dates (CO-7352, CO-7506) date two of the household's edges; nothing dated the separation of a roommate who bought and prepared meals with the household, or of a child in a caretaker's care."
nearest: [CO-7352, CO-7506]
