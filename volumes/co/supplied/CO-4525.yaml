id: CO-4525
name: "Has court evidence of domestic violence or takes part in the Address Confidentiality Program"
identifier: has_domestic_violence_court_evidence_or_acp_participation
kind: supplied
type: yes/no
scope: person
program: All
meaning: "The person has provided evidence from a court of domestic violence as C.R.S. 18-6-800.3(1) defines it, or takes part in the State's Address Confidentiality Program under C.R.S. 24-30-2104."
precision: "A statement of the evidence the person has given, not a finding of any program. If not stated, every program reads it as false."
supplied_by: "A court order or record, or the Address Confidentiality Program's participation card."
sources: [S3313]
tags: [verification]
rationale: "Coverage review C-9: 9 CCR 2503-7 3.755.21.B.4 (S3313) makes an exception to the documents for child support \"in cases of domestic violence ... when the applicant provides evidence from a court or participation in the state's Address Confidentiality Program\": \"Client declaration shall be sufficient in such cases.\" No fact stated it, so LEAP held such child support pending. has_domestic_violence_extension_approved is a Colorado Works time-limit finding and does not state this evidence."
