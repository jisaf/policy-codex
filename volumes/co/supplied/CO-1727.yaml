id: CO-1727
name: "Receives Social Security Disability Insurance"
identifier: receives_ssdi
kind: supplied
type: yes/no
scope: person
program: All
meaning: "The person is entitled to and receives Social Security Disability Insurance: title II benefits paid on the basis of the person's own disability (including disabled adult child and disabled widow(er) benefits), not SSI or a state supplement."
precision: "If not stated, a reader that needs it is unknown."
supplied_by: "SSA benefit record (BENDEX/SVES)."
sources: [S442, S705, S849]
tags: [disability]
rationale: "Vocabulary fix round (docs/reviews/vocabulary-reuse.md, R-5): Adult Financial (26-2-111(4)(a) and 3.540: 'determined to be disabled and eligible for social security disability insurance benefits'; 'not been approved for ... SSDI') and Medicaid citizenship verification (the SSDI exemption) read receives_social_security_disability, whose meaning is SNAP's 271.2 list of disability and blindness payments under titles I, II, X, XIV and XVI."
