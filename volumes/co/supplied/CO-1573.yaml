id: CO-1573
name: Is a sponsored non-citizen
identifier: is_sponsored_non_citizen
kind: supplied
type: yes/no
scope: person
program: All
meaning: Whether the person is a non-citizen whose sponsor executed a legally binding affidavit of support (Form I-864 or I-864A under section 213A of the Immigration and Nationality Act, on or after December 19, 1997), so the sponsor's income and resources may be deemed to the person. A sponsorship on an earlier or non-binding affidavit (Form I-134), or an entry in a classification that did not require Form I-864, is stated false.
precision: "States only that an affidavit of support was executed; whether deeming applies is each program's rule: for SNAP snap_sponsor_deeming_applies (CO-2337) applies the exemptions of 10 CCR 2506-1 4.305.2.E (phase-10 sweep, OQ-380), and for Colorado Works cw_sponsor_deeming_applies (CO-2364) those of 9 CCR 2503-6 3.605.1.A.5.c (OQ-103). Both rules reach only an I-864 affidavit (4.305.2.A; 3.605.1.A.5.c.3, 7)."
supplied_by: Immigration documents and SAVE response as recorded in CBMS.
sources: [S1061, S1062, S1063, S1619, S1627]
tags: [verification, immigration]
rationale: "No existing fact in the volume states this; the phase-9 verification review (K-2: SNAP, Colorado Works and Adult Financial each require the sponsor's information) needs it as a supplied fact."
