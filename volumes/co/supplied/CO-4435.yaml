id: CO-4435
name: "Intends to return home"
identifier: intends_to_return_home
kind: supplied
type: yes/no
scope: person
program: All
meaning: "The person, living in a hospital, nursing facility or other long-term care setting, or away for long-term medical care, intends to return to the home the person (or the person's spouse) lived in before (home_equity's home) or to a replacement home, as a written statement of the person, the spouse, a legal fiduciary, a doctor or an authorized representative says."
precision: "Stated for a person who does not live in the home. If not stated, Adult Financial reads this as true (the home stays exempt)."
supplied_by: "The written statement in the case file."
sources: [S3218]
tags: [resources]
rationale: "Merged with CO-4611 (the non-MAGI Medicaid coverage round added the same fact under the same identifier; Medicaid reads this one too, and applies its own sale conditions in its derived items where they differ). Coverage review P2-5: 9 CCR 2503-5 3.520.77.C.2-3 and C.5 (S3218) keep the home exempt during a long-term care stay while the client intends to return, and count its equity once it is no longer the principal place of residence; no fact stated the intent."
