id: CO-4327
name: "Self-employment is the household's annual support"
identifier: self_employment_is_annual_support
kind: supplied
type: yes/no
scope: person
program: All
meaning: "The person's self-employment enterprise provides the support of the person's household for the year: its receipts, even when received in a short period or alongside other income, are what the household lives on through the year (a farmer's crop receipts, or a business paid monthly all year)."
precision: "If not stated, SNAP reads it as false and counts each month's receipts and costs as stated. Self-employment that is only part of the year's support (10 CCR 2506-1 4.403.12.B) is stated by month, each self-employment month's receipts and costs already averaged over the season."
supplied_by: "Applicant statement; tax returns and business records."
sources: [S3114, S3113]
tags: [snap, income]
rationale: "Coverage review snap-financial CF-3: SNAP averages self-employment income that is a household's annual support over twelve months (4.402.2.A.1, S3113; 4.403.12.A and C, S3114); no fact said which enterprises are averaged."
