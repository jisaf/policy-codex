id: CO-808
name: Medicare Savings Program resource limit (couple)
identifier: msp_resource_limit_couple
kind: supplied
type: money
scope: person
program: All
meaning: The current-year QMB/SLMB/QI resource limit for a married individual living with a spouse and no other dependents, published annually by CMS as an indexation of the $13,020 base 10 CCR 2505-10 8.100.5.M.1 states effective January 1, 2011.
precision: Not a fetched-document figure for the case's as-of date; see OQ-81.
supplied_by: CMS annual Medicare Savings Program resource limit publication (Medicare & You / QMB fact sheet), as loaded in CBMS.
sources: [S301]
open: [OQ-81]
tags: [non_magi, msp, resources]
rationale: "Companion figure to msp_resource_limit_individual (CO-807), for the same reason (OQ-81). ma_qmb_eligible, ma_slmb_eligible and ma_qi_eligible (CO-613-CO-615) need it for an applicant living with a spouse."
