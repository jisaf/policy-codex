id: CO-4506
name: "Value of in-kind pay received for work"
identifier: in_kind_compensation_value
kind: supplied
type: money
scope: person-month
program: All
meaning: "The value of the goods, services, shelter or housing (not money) the person received in the month in place of cash as compensation for work the person performed, as an employee or in self-employment (for example rent-free housing for managing a building, meals, clothing or produce from an employer, goods bartered for babysitting): the value of the item as the payer supplies it or the person declares it, or its current market value where none is given; for regular, necessary services the person performs in exchange (services someone would otherwise have to be hired to perform), the going rate in the community for those services."
precision: "Not part of wages_gross (CO-023), which states cash pay, or of the self-employment facts, and not added to them by any program that does not count it. Hours of in-kind work are unpaid_or_in_kind_work_hours (CO-1915); this fact states their value. If not stated, every program reads it as 0. Coverage pass 3 C3-4 (dual-entry): the one in-kind pay fact. in_kind_earned_compensation_value (CO-4360, Colorado Works), in_kind_earned_income_value (CO-4437, Adult Financial) and in_kind_employment_compensation_value (CO-4454, CCCAP) stated the same receipt and are retired into it; Colorado Works (cw_gross_earned_income CO-1716, cw_excluded_earned_income CO-2340), Adult Financial (CO-3830), LEAP (CO-3925) and CCCAP (cccap_other_countable_receipts, CO-4464) each read this fact once. Each program's rule decides whether and how it counts it (SNAP excludes in-kind benefits); one stated value serves every program's valuation wording (LEAP's declared value, CCCAP's cost or fair market value, Colorado Works' and Adult Financial's value supplied or market value)."
supplied_by: "The person's declaration, with the employer's or other party's statement of the value, the market value or the community going rate, as the county establishes it."
sources: [S3305, S3159, S3211, S3255]
tags: [income]
rationale: "Coverage review C-12: 9 CCR 2503-7 3.752.22.C.4 (S3305) counts in-kind income received in exchange for employment as earned income at \"the declared value of the item or service provided\". wages_gross states cash wages and CO-1915 states hours, not value, so LEAP counted none. The fact states the receipt, program-neutrally (convention rule 13); each program's earned income item decides whether it counts it. Coverage pass 3 C3-4: 9 CCR 2503-6 3.605.2.A, F, G (S3159), 9 CCR 2503-5 3.520.782.B (S3211) and 8 CCR 1403-1 3.111.I.4 (S3255) count the same receipt; their three facts are folded into this one, so a case states in-kind pay once and every program reads it (probes Y-3, Y-3b)."
nearest: [CO-1915]
