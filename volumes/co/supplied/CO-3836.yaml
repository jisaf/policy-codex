id: CO-3836
name: "Adult Financial: the transfer is found not to be a transfer without fair consideration"
identifier: af_transfer_found_not_twfc
kind: supplied
type: yes/no
scope: person-month
program: AdultFinancial
meaning: "The county department has found that the transfer the person made in the month (resource_transfer_date, resource_transfer_uncompensated_value) is not a transfer without fair consideration under 9 CCR 2503-5 3.520.76: the client disproved the presumption that it was made to qualify for assistance (A.4.b), accepted less than fair value because of a hardship just before the transaction (B), or the transfer was involuntary - a loss through fraud with every reasonable effort to recover it, a judgment, foreclosure or tax sale, or another involuntary transfer the county finds reasonable (C)."
precision: "If not stated, Adult Financial reads this as false: a transfer within the period is presumed made to qualify (A.4.a). Final cash review 2, N-5: stated for the month of the transfer it is about, as the transfer facts now are."
supplied_by: "County department finding on the evidence the client provides."
sources: [S2614, S2615]
tags: [cash, resources]
rationale: "Final cash review FC-6: 9 CCR 2503-5 3.520.76 (S2614) and C.R.S. 26-2-111(1)(c) (S2615) make a transfer without fair consideration within thirty-six months before the application, or while receiving, a ground of ineligibility for a period set by the uncompensated value, and nothing in the volume stated it, so a client in a penalty period was found eligible. The presumption, the hardship and the involuntary-transfer exceptions are the county's findings under the prudent person principle, so the finding carries the program's prefix (convention rule 13 (i))."
