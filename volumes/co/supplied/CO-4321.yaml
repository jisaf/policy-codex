id: CO-4321
name: "Rental property costs"
identifier: rental_property_costs
kind: supplied
type: money
scope: person-month
program: All
meaning: "The person's costs in the month of producing the rent rental_income_received (CO-4320) states: for the rented property, the costs of the kinds self_employment_operating_costs, self_employment_interest_costs and self_employment_capital_principal_payments (CO-3370 to CO-3372) describe."
precision: "If not stated, SNAP reads it as 0. Each program's allowable cost is its own derived item."
supplied_by: "Receipts; Schedule E."
sources: [S3111]
tags: [snap, income]
rationale: "Coverage review snap-financial CF-2: the cost of doing business subtracted from passive rental income (4.404.D, S3111) had no fact; the self-employment cost facts are read only with self-employment receipts."
