id: CO-4455
name: "Employer payments to third parties as compensation"
identifier: employer_vendor_payments_received
kind: supplied
type: money
scope: person-month
program: All
meaning: "Money an employer paid in the month to a third party for an expense of the person's household (rent, utilities, a loan or other bill), as part of the person's compensation for employment, from funds the employer would otherwise pay to the person."
precision: "Not part of the wages, self-employment or unearned income facts. If not stated, every program reads it as 0."
supplied_by: "Applicant or employer statement."
sources: [S3255]
tags: [income]
rationale: "Coverage round (docs/reviews/coverage-cccap.md, F-08): 8 CCR 1403-1 3.111.I.5 (S3255) counts vendor payments \"paid to a third party for a household expense\" by a payer \"using funds that otherwise would need to be paid to the adult caretaker(s) or teen parent(s) and are part of the compensation for employment\". No fact stated them, so CCCAP could not count them."
