id: CO-4505
name: "Employer health insurance subsidy received"
identifier: employer_health_insurance_subsidy_received
kind: supplied
type: money
scope: person-month
program: All
meaning: "Money the person's employer paid directly to the person in the month, recurring or not, to help the person buy private health insurance."
precision: "Part of the person's gross wages for the month as wages_gross (CO-023) states it, and of wages_gross_per_pay_period (CO-3922) when it is paid with each pay, not added to them. A premium the employer pays to the insurer is not a payment to the person and is not this fact. If not stated, every program reads it as 0."
supplied_by: "Pay stubs or the employer's statement."
sources: [S3301]
tags: [income]
rationale: "Coverage review C-1: 9 CCR 2503-7 3.752.23.HH (S3301) excludes \"Any recurring or non-recurring health insurance subsidies paid directly to an employee by an employer\". The payment is part of wages and no fact separated it, so LEAP counted it. The fact states the receipt, program-neutrally (convention rule 13)."
nearest: [CO-023]
