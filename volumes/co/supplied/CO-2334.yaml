id: CO-2334
name: "SNAP: is an indigent non-citizen"
identifier: snap_is_indigent_non_citizen
kind: supplied
type: yes/no
scope: person
program: SNAP
meaning: "The local office has determined, within the last twelve months, that this sponsored non-citizen is indigent: unable to obtain food and shelter amounting to 130% of the federal poverty level after the non-citizen's own income and the cash and in-kind help of the sponsor and others (10 CCR 2506-1 4.000.1 \"Indigent non-citizen\"; 4.305.2.E.4). Only the amount the sponsor actually provides is then counted."
precision: "If not stated, SNAP reads this as false. A determination lasts twelve months and may be renewed."
supplied_by: "County indigence determination recorded in CBMS."
sources: [S1619]
tags: [snap, immigration]
rationale: "OQ-380: 4.305.2.E (S1619) lists the non-citizens to whom the sponsor's income and resources are not deemed; no fact stated this exemption, so snap_requires_verification_of_sponsor (CO-1616) asked every sponsored member for the sponsor's information."
