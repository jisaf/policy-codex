id: CO-040
name: Is disqualified for work-requirement noncompliance
identifier: is_disqualified_for_work_requirement_noncompliance
kind: supplied
type: yes/no
scope: person
program: SNAP
meaning: The person is currently serving a disqualification period for failing to comply with the SNAP work requirements of 7 CFR 273.7, other than one for a voluntary quit.
precision: "A voluntary quit is stated through snap_voluntary_quit_date (CO-2313) and its disqualification computed by snap_is_disqualified_for_voluntary_quit (CO-2318); state this fact false for a voluntary quit alone."
supplied_by: Case record.
sources: []
rationale: "A fact the case must supply; no existing item in the Colorado volume carries it (the volume began empty in phase 1, and the mwr volume's facts are not shared across volumes). It is read by SNAP: is an ineligible member."
