id: CO-040
name: Is disqualified for work-requirement noncompliance
identifier: snap_is_disqualified_for_work_requirement_noncompliance
kind: supplied
type: yes/no
scope: person
program: SNAP
meaning: The person is currently serving a disqualification period for failing to comply with the SNAP work requirements of 7 CFR 273.7, other than one for a voluntary quit.
precision: "A voluntary quit is stated through snap_voluntary_quit_date (CO-2313) and its disqualification computed by snap_is_disqualified_for_voluntary_quit (CO-2318); state this fact false for a voluntary quit alone. A member who becomes exempt from the work requirements during the period is no longer serving it (10 CCR 2506-1 4.310.8.C-D, S3058; coverage review C-8): state this fact false from the date the exemption information was provided."
supplied_by: Case record.
sources: [S3058]
rationale: "A fact the case must supply; no existing item in the Colorado volume carries it (the volume began empty in phase 1, and the mwr volume's facts are not shared across volumes). It is read by SNAP: is an ineligible member. Same-word audit SW-37: renamed from snap_is_disqualified_for_work_requirement_noncompliance so the identifier carries the prefix of the program (or method) whose meaning it states."
