id: CO-2233
name: Transfer penalty months assigned from the spouse
identifier: ma_transfer_penalty_months_assigned_from_spouse
kind: supplied
type: whole number
scope: person
program: Medicaid
meaning: "The months remaining in the spouse's share of an apportioned period of ineligibility that are assigned to this person because the spouse died or is no longer institutionalized (10 CCR 2505-10 § 8.100.7.F.8.b), or 0. If not stated, Medicaid reads it as 0: a rule-given default, since months are assigned only on the event of § 8.100.7.F.8.b (S1507: 'If one spouse dies or is no longer institutionalized, any months remaining in the period of ineligibility shall be assigned to the spouse who remains institutionalized') to a penalty period already apportioned, which the case record shows; with none recorded there is none."
precision: "Stays supplied (dual-entry audit 1.7): the months remaining in the spouse's share depend on the months the spouse already served, a penalty history the case does not state. 0 when no months were reassigned."
supplied_by: The Eligibility Site's transfer-of-assets penalty determination (CBMS).
sources: [S1507]
tags: [ma, ltc, legal]
rationale: "OQ-94: § 8.100.7.F.8.b reassigns the remaining months to the spouse who stays institutionalized; no fact stated them."
