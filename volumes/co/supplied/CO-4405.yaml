id: CO-4405
name: "Adult Financial: presumption of non-residence rebutted"
identifier: af_nonresidence_presumption_rebutted
kind: supplied
type: yes/no
scope: person
program: AdultFinancial
meaning: "The county department finds that the client came forward with enough information to prove that, despite the absence from Colorado, the client is still a resident (9 CCR 2503-5 3.520.64.E: \"unless the client comes forward with enough information to prove otherwise\")."
precision: "Stated only for a client whose absence creates a presumption (af_is_presumed_nonresident_by_absence, CO-4401). If not stated, Adult Financial reads this as false."
supplied_by: "County department finding on the client's information, using the prudent person principle (3.520.64.F)."
sources: [S3201]
tags: [cash, household]
rationale: "Coverage review F-1: each presumption of 3.520.64.E.1-4 (S3201) is rebuttable; no fact stated the rebuttal."
