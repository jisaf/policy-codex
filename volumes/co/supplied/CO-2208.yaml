id: CO-2208
name: Receives OAP-C
identifier: receives_oap_c
kind: supplied
type: yes/no
scope: person
program: All
meaning: "Whether the person receives Old Age Pension financial assistance under OAP-C, the program for a person sixty or older committed to the Colorado Mental Health Institute or to a Regional Center by order of the district or probate court (9 CCR 2503-5 3.530.1; 10 CCR 2505-10 § 8.941.2.F)."
supplied_by: The Old Age Pension case record (CBMS).
sources: [S701, S1510]
tags: [ma, oap]
rationale: "OQ-206: § 8.941.3.B excludes OAP-C recipients from the Old Age Pension Health Care Program, and af_category (CO-953) has no OAP-C option, so receipt is a supplied fact, as receives_ssi is."
