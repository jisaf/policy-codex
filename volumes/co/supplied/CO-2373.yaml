program: ColoradoWorks
meaning: "The date until which the county, at the applicant's request, extended the time to obtain necessary verification beyond the forty-five-day processing maximum (9 CCR 2503-6 3.604.3.B.4), as documented in the statewide automated system."
precision: "Not stated when no extension was granted; Colorado Works then reads the ordinary due date."
