id: CO-035
name: Shelter cost, monthly
identifier: shelter_cost_monthly
kind: supplied
type: money
scope: person-month
program: All
meaning: "Monthly rent or mortgage, property tax and home insurance for the dwelling, entered once per SNAP household on the SNAP head of household (snap_is_head_of_household, CO-067) and zero on the other members."
supplied_by: Lease, mortgage statement, applicant statement.
sources: [S137]
tags: [income]
rationale: "A fact the case must supply; no existing item in the Colorado volume carries it (the volume began empty in phase 1, and the mwr volume's facts are not shared across volumes). It is reserved for the SNAP income, deduction, work registration and ABAWD rules of later batches, which read it by this identifier. Fix-round (P-3): added the internet-fee exclusion sec. 10104 requires, so a worker stating this fact knows not to include it; see OQ-36. Vocabulary fix round (docs/reviews/vocabulary-reuse.md, C-1, C-6): the meaning says which person carries the household's figure."
