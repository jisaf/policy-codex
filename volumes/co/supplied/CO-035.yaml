id: CO-035
name: Shelter cost, monthly
identifier: shelter_cost_monthly
kind: supplied
type: money
scope: person-month
program: All
meaning: The monthly rent or mortgage payment, plus property taxes and insurance, for the home the person's unit occupies. Stated once per unit, carried on the head of household. Does not include any internet connection service fee, which Pub. L. 119-21 sec. 10104 (S137) bars from the excess shelter expense computation.
supplied_by: Lease, mortgage statement, applicant statement.
sources: [S137]
tags: [income]
rationale: "A fact the case must supply; no existing item in the Colorado volume carries it (the volume began empty in phase 1, and the mwr volume's facts are not shared across volumes). It is reserved for the SNAP income, deduction, work registration and ABAWD rules of later batches, which read it by this identifier. Fix-round (P-3): added the internet-fee exclusion sec. 10104 requires, so a worker stating this fact knows not to include it; see OQ-36."
