id: CO-4312
name: "Military retirement paid to a former spouse"
identifier: military_retirement_paid_to_former_spouse
kind: supplied
type: money
scope: person-month
program: All
meaning: "The part of the person's military retirement pay for the month that goes to a former spouse under a divorce decree property settlement (Uniformed Services Former Spouses' Protection Act)."
precision: "Part of pension_income, not added to it. If not stated, SNAP reads it as 0."
supplied_by: "Retirement pay statement; the divorce decree."
sources: [S3109]
tags: [snap, income]
rationale: "Coverage review snap-financial CF-1: 4.405.2.A.11 (S3109) does not count the former spouse's portion as the retiree's income; no fact stated it."
