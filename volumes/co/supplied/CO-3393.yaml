id: CO-3393
name: "Real property other than the home"
identifier: real_property_other_than_home_equity
kind: supplied
type: money
scope: person
program: All
meaning: "The equity value (fair market value less encumbrances) of the person's real property that is not the home the person lives in and is not used to produce income; mortgages and promissory notes the person holds included. The home is home_equity (CO-826)."
precision: "As of the determination date; the person's own holding, or the person's share of a jointly held one. If not stated, every program reads it as 0."
supplied_by: "Application (resources), verified by statements as each program requires."
sources: [S2213, S2216]
implemented: engine
tags: [resources]
rationale: "Same-word audit SW-31: every program's countable resources were a supplied, already-counted figure, so each program's resource rules lived outside the ledger, and Adult Financial fell back silently to the SSI figure when its own was unstated (OQ-392). The person's holdings are stated once by asset type; each program derives its countable resources by its own exclusions."
