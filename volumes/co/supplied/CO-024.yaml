id: CO-024
name: "Net earnings from self-employment for federal income tax"
identifier: self_employment_net_earnings_for_tax
kind: supplied
type: money
scope: person-month
program: All
meaning: "The person's net earnings from self-employment for the month as figured for federal income tax: gross receipts less the deductions the Internal Revenue Code allows for the trade or business (the Schedule C or F profit or loss, including the person's share of a partnership's profit or loss), monthly share. May be negative."
precision: "The tax-basis figure MAGI-based income uses (42 CFR 435.603(e), 10 CCR 2505-10 8.100.4.C.1.a.ii and 8.100.3.K.9.b.i.1, which allow equipment depreciation for MAGI only). Programs that net self-employment income by their own list of allowable costs read self_employment_gross_receipts (CO-1700) less their own cost fact instead."
supplied_by: Applicant-provided business records, tax records.
sources: [S165, S166, S1154]
tags: [income]
rationale: "A fact the case must supply; no existing item in the Colorado volume carries it (the volume began empty in phase 1, and the mwr volume's facts are not shared across volumes). It is reserved for the SNAP income, deduction, work registration and ABAWD rules of later batches, which read it by this identifier. Vocabulary fix round (docs/reviews/vocabulary-reuse.md, R-1): renamed from self_employment_net_income. One 'net' figure served every program although each program's rule lists different allowable costs (SNAP allows principal payments and disallows depreciation; Medicaid, Colorado Works, Adult Financial and CCCAP disallow both depreciation and principal; MAGI follows the tax return). The tax figure is read by MAGI only; every other program reads its own net."
