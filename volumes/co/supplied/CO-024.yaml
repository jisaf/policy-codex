id: CO-024
name: Self-employment net income
identifier: self_employment_net_income
kind: supplied
type: money
scope: person-month
program: All
meaning: The person's net income from self-employment for the month, gross proceeds less the cost of producing the income.
supplied_by: Applicant-provided business records, tax records.
sources: []
tags: [income]
rationale: "A fact the case must supply; no existing item in the Colorado volume carries it (the volume began empty in phase 1, and the mwr volume's facts are not shared across volumes). It is reserved for the SNAP income, deduction, work registration and ABAWD rules of later batches, which read it by this identifier."
