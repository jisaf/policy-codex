id: CO-012
name: Receives Supplemental Security Income
identifier: receives_ssi
kind: supplied
type: yes/no
scope: person
program: All
meaning: "The person receives supplemental security income benefits under Title XVI of the Social Security Act. A fact about SSA's award as of the determination date (the person is an SSI recipient), not this volume's own determination; the amount paid for the month is ssi_income (CO-849). A recipient with a payment should have ssi_income above zero; an SSI recipient in 1619(b) status with no payment is retains_ssi_status_without_payment (CO-1112)."
supplied_by: SSA benefit record, CBMS interface.
sources: [S6]
tags: [disability]
rationale: "A fact the case must supply; no existing item in the Colorado volume carries it (the volume began empty in phase 1, and the mwr volume's facts are not shared across volumes). It is read by SNAP: is a disabled member. Vocabulary fix round (D-6): kept as the receipt fact beside the amount rather than derived from it: SSI status (an award, including 1619(b) status) and the month's payment are different facts. The meaning now says which is which."
