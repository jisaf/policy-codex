id: CO-4458
name: "Rental property expenses paid"
identifier: rental_property_expenses_paid
kind: supplied
type: money
scope: person-month
program: All
meaning: "The expenses the person paid in the month for rental property the person does not actively manage, whose rents are the person's receipts of kind rental_income, or of kind other_taxable where a rent was stated in the other unearned income before receipt records (receipts, CO-5000): property taxes, insurance, interest on the property's mortgage, repairs and maintenance, utilities the owner pays and management fees. Not payments on the mortgage principal and not depreciation."
precision: "If not stated, Colorado Works reads it as 0 (cw_unearned_income_deductions, CO-4369); Medicaid's SSI method reads it only for a month with rents and cannot determine without it (decision 4; coverage pass 4, non-MAGI N4-13)."
supplied_by: "Applicant statement with receipts, as the county establishes them."
sources: [S3256]
tags: [income]
rationale: "Merged with CO-4364 (the Colorado Works coverage round added the same fact under the same identifier; one fact, read by Colorado Works CO-4369 and CCCAP CO-4463). Coverage round (docs/reviews/coverage-cccap.md, F-10): 8 CCR 1403-1 3.111.I.12 and I.17 (S3256) count rental income net. No fact stated the landlord's expenses, so a landlord with $1,500 of rent and $1,000 of expenses was counted at $1,500."
