id: CO-4150
name: "Largest single-game lottery or gambling prize received"
identifier: lottery_gambling_largest_single_game_winnings_received
kind: supplied
type: money
scope: person-month
program: All
meaning: "The largest cash prize, among the lottery or gambling winnings the person received in the month, that was won in a single game, drawing, hand or bet, before taxes or other amounts were withheld; where several people shared in the purchase of the ticket, hand or bet, only the person's own portion. 0 if none."
precision: "One prize, not a total: two prizes in the month are not added here (the month's total is lottery_gambling_winnings_received, CO-1181, of which this is part). If not stated, SNAP reads the month's total, lottery_gambling_winnings_received, as one prize (most months with winnings have one), and 0 when neither is stated; a case states this fact when the month's winnings came from more than one game. Not part of the unearned income facts."
supplied_by: "IRS Form W-2G, the Colorado Lottery's or the gaming establishment's payout record, or the applicant's statement of a shared ticket or bet."
sources: [S2950, S2953]
tags: [income, snap]
rationale: "Final verification pass 2 N-1 (docs/reviews/final2-snap.md): SNAP's substantial winnings are \"a cash prize won in a single game, before taxes\" (10 CCR 2506-1 4.000.1, S2950; 7 CFR 273.11(r)(2)(i), S2953), the member's portion of a shared ticket. lottery_gambling_winnings_received (CO-1181) states the month's receipts added together, which would be lighter than the rule (two prizes under the limit would read as one over it), so the single prize is its own neutral fact, read in place of the total only where a case states it."
nearest: [CO-1181]
