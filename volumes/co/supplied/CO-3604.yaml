id: CO-3604
name: "Mandatory income tax withheld"
identifier: mandatory_income_tax_withheld
kind: supplied
type: money
scope: person-month
program: All
meaning: "The federal, state and local income taxes withheld from the person's earned or unearned income for the month that the payer is required to withhold (including a federal pension's mandated withholding), as verified. Not withholding the person chose, such as extra withholding for a larger refund or a pension's withholding that stops once the payer is told of the institutional care. If not stated, Medicaid reads it as 0."
supplied_by: "Pay stubs, pension or benefit statements showing the mandatory withholding."
sources: [S2401, S2402]
tags: [ma, ltc, income]
rationale: "Final verification F-3 (docs/reviews/final-medicaid-chp.md): ma_patient_payment (CO-658) deducted only the personal needs allowance, the community spouse and family allowances and every health insurance premium, in every month; 10 CCR 2505-10 § 8.100.7.V.3.b-i (S2400-S2405) lists further deductions and adds Long-Term Care insurance payments, and limits the Part B premium to the first two months. ma_payroll_taxes_withheld (CO-2466) is the community spouse's FICA and Medicare tax under § 8.100.7.R.2, not income tax; no fact stated mandatory income tax withholding."
