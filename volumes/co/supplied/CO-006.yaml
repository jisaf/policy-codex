id: CO-006
name: State of residence
identifier: state_of_residence
kind: supplied
type: text
scope: person
program: All
meaning: "The U.S. state in which the person lives and intends to remain, as a two-letter code. Program-specific residency rules are separate items."
supplied_by: Applicant statement, case record.
sources: []
rationale: "A fact the case must supply; no existing item in the Colorado volume carries it (the volume began empty in phase 1, and the mwr volume's facts are not shared across volumes). It is reserved for the SNAP income, deduction, work registration and ABAWD rules of later batches, which read it by this identifier. Vocabulary fix round (docs/reviews/vocabulary-reuse.md, C-1): the meaning no longer says 'for purposes of SNAP administration'; no SNAP item reads it, and Medicaid, Colorado Works and Adult Financial do through is_colorado_resident (CO-505)."
