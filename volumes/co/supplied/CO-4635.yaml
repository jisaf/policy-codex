id: CO-4635
name: "OASDI when the spouse lost SSI or OAP"
identifier: social_security_income_when_spouse_lost_ssi_or_oap
kind: supplied
type: money
scope: person
program: All
meaning: "This person's monthly OASDI (Social Security) benefit in the month the person's spouse lost SSI or OAP because of OASDI: the base from which the cost-of-living increases since then are measured."
precision: "Required where read: not stated, it cannot be determined (decision 4 of 2026-11-23; coverage pass 4, non-MAGI N4-13, which removed the reader's default). A case with no increase states the current benefit."
supplied_by: "SSA benefit records."
sources: [S666]
tags: [ma, non_magi, income]
rationale: "Coverage review NM-17 (OQ-207): 10 CCR 2505-10 § 8.100.6.E.3 applies the Pickle disregard to the OASDI cost-of-living increases of a financially responsible spouse whose income is considered; no fact stated the spouse's benefit at the time of the loss, so the increases were never disregarded."
nearest: [CO-1109]
