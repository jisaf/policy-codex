id: CO-2393
name: "Receives Medicaid"
identifier: receives_medicaid
kind: supplied
type: yes/no
scope: person
program: All
meaning: "The person is receiving Medical Assistance (Health First Colorado) for the month, as a case fact about the person's enrollment, not this volume's own Medicaid determination."
precision: "If not stated, Adult Financial reads this as false."
supplied_by: "CBMS Medical Assistance enrollment."
sources: [S1632, S1633, S1634]
tags: [cash]
rationale: "OQ-114: Adult Financial does not deem the income of a spouse (or of an AND-CS child's parent) who is \"receiving Adult Financial grant payments, SSI benefits, or Medicaid assistance\" with income within the limit (3.534.C, 3.544.F, 3.549.F); no fact stated Medicaid receipt."
