id: CO-2846
name: "CCCAP: unrelated adult caretaker's verification received"
identifier: cccap_unrelated_caretaker_verification_received
kind: supplied
type: yes/no
scope: person
program: CCCAP
meaning: "Whether this person, acting as the primary adult caretaker of a child to whom the person is not related, has provided the verification from the child's biological or adoptive parent, legal guardian, or a court order identifying the person as the child's adult caretaker (8 CCR 1403-1 3.111.D.5). If not stated, CCCAP reads this as false."
supplied_by: The county's record of the verification received.
sources: [S1637]
tags: [verification, household]
rationale: "Same-word audit SW-5: cccap_unrelated_caretaker_verification_is_outstanding (CO-2396) bundled whether the caretaker is related to the child, which the relationship roles state, with whether the verification arrived. Only the verification is a fact of its own."
