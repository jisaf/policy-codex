id: CO-2389
name: "Adult Financial: countable resources of the client and spouse"
identifier: af_client_and_spouse_countable_resources
kind: supplied
type: money
scope: person
program: AdultFinancial
meaning: "The countable resources of this Adult Financial client and the client's spouse, counted and exempted under 9 CCR 2503-5 3.520.72 to 3.520.77 (Adult Financial's own list and exemptions)."
precision: "If not stated, Adult Financial reads the SSI-method figure for the client (the couple figure when married), the approximation the volume used before; state it whenever the Adult Financial count differs."
supplied_by: "County resource assessment under 3.520.72-77."
sources: [S1636]
tags: [cash, resources]
rationale: "OQ-392: af_countable_resources (CO-947) read the SSI-method figures of 20 CFR 416.1210 (ssi_countable_resources_individual and _couple), which approximate but are not Adult Financial's own count (3.520.72-77); this fact states Adult Financial's figure."
