id: CO-4065
name: Lottery or gambling winnings received in the thirty days before the application
identifier: lottery_gambling_winnings_received_prior_thirty_days
kind: supplied
type: money
scope: person
program: All
meaning: "The lottery or gambling winnings the person received in the thirty days before the application date (the date the application, or the redetermination, the case decides was made): the receipts lottery_gambling_winnings_received (CO-1181) states for a calendar month, counted by the day received over these thirty days instead."
precision: "The thirty days end the day before the application date, as for unearned_income_received_prior_thirty_days (CO-3911). Stated by the case when a receipt falls near the application; if not stated, a program that reads it takes it as 0 when the calendar-month fact for the month of the application and for the month before both state no receipt, and otherwise as unknown, since the month's figure cannot place a receipt inside or outside the thirty days. Read by LEAP (9 CCR 2503-7 3.752.21.A, 3.752.22.A)."
supplied_by: "The applicant's statement and the payer's records, by date received."
sources: [S2712, S2713, S2714]
tags: [income]
rationale: "Second-pass review N-8 (F-11 residual): 9 CCR 2503-7 3.752.22.A counts \"the countable gross unearned income received in the income verification period\", and LEAP read one-time receipts for the calendar month of the application instead (RV-S4: a $5,000 prize received on October 20 for an application of November 5 was left out). Monthly facts cannot place a receipt within thirty days that straddle two months, so the thirty-day receipt is its own fact, as wages and recurring unearned income already are (CO-3910, CO-3911)."
nearest: [CO-1181]
