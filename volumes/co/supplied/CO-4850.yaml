id: CO-4850
name: "Colorado Works diversion payment received"
identifier: tanf_diversion_payment_received
kind: supplied
type: money
scope: person-month
program: All
meaning: "Money the person received in the month as a Colorado Works diversion payment (diversion grant) paid in cash to address a specific crisis need (9 CCR 2503-6 3.606.8.A), as the Colorado Works case record shows it: not basic cash assistance (tanf_cash_income, CO-029) and not a supportive service payment (tanf_supportive_service_payments_received, CO-4452). A diversion paid to a vendor or given in kind is not the person's receipt."
precision: "Part of the person's gross unearned income for the month as the unearned income facts state it (other_unearned_income_taxable or other_unearned_income_nontaxable), not added to it. Not this volume's own diversion figure (cw_diversion_payment, CO-2560, from the county's agreed amount, CO-2559): this is the receipt, for programs that read the person's income. If not stated, every program reads it as 0."
supplied_by: "Applicant statement, the Colorado Works case record."
sources: [S762, S3595]
tags: [income, tanf]
nearest: [CO-4452, CO-2559, CO-3931]
rationale: "Coverage review 2 N-1 (docs/reviews/coverage2-leap-sunbucks.md): 9 CCR 2503-7 3.752.23.W (S3595) excludes \"State/county diversion payments\" from LEAP income, but no fact stated a diversion receipt in money. tanf_cash_income (CO-029) leaves it out, cw_county_approved_diversion_amount (CO-2559) is the county's month-scope agreement figure for Colorado Works' own determination and receives_tanf_diversion_payment (CO-3931) is a yes/no case record, so a case stated the cash in other_unearned_income_nontaxable and LEAP counted it. Program-neutral; leap_excluded_unearned_income (CO-4511) subtracts it."
