id: CO-1283
name: LEAP living arrangement
identifier: leap_living_arrangement
kind: supplied
type: one of
options: [traditional_dwelling, institutional_group_care, room_and_board, correctional_facility, dormitory, subsidized_without_heat_meter, commercial_property, hotel_without_thirty_days]
scope: person
program: LEAP
meaning: The household's living arrangement for the LEAP vulnerability test of 9 CCR 2503-7 3.752.25.B - an ordinary dwelling, or one of the arrangements that is not vulnerable - room and board or bed and breakfast (B.2), a correctional facility (B.3), a dormitory, fraternity or sorority house (B.4), subsidized housing without an individual check meter for heat or other evidence of responsibility for heating surcharges (B.5), a commercial account or property that is also the dwelling (B.7), or a hotel without proof of thirty days' continuous residence with heat in rent (B.8). Institutional group care (B.1) and homelessness or a non-traditional dwelling (B.6) are read from snap_resides_in_institution_providing_meals and is_homeless.
supplied_by: LEAP application and vulnerability verification (3.752.25.D, 3.755.41).
sources: [S774, S775]
tags: [household]
rationale: "OQ-158 recorded that six of the eight non-vulnerable arrangements had no fact; leap_is_vulnerable_to_heating_cost (CO-1004) now reads this one. Vocabulary fix round (docs/reviews/vocabulary-reuse.md, R-8): institutional group care (3.752.25.B.1) is an option here instead of SNAP's majority-of-meals institution fact, which leap_is_vulnerable_to_heating_cost (CO-1004) had read."
