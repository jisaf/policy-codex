id: CO-3822
name: "Infrequent or irregular unearned income received"
identifier: infrequent_or_irregular_income_received
kind: supplied
type: money
scope: person-month
program: All
meaning: "The part of the person's unearned income for the month received infrequently (only once in the calendar quarter from a single source, not received in the month before or after) or irregularly (income the person could not reasonably expect to receive)."
precision: "Part of the person's gross unearned income for the month as the unearned income facts state it (other_unearned_income_taxable or other_unearned_income_nontaxable, or the fact that names the source), not added to it. If not stated, every program reads it as 0."
supplied_by: "Applicant statement."
sources: [S2608, S2609]
tags: [cash, income]
rationale: "Final cash review FC-2 and FC-3: Colorado Works' and Adult Financial's exclusion items (CO-2340 to CO-2343) summed a closed list of neutral receipt facts, so income the current exempt-income lists name could not be excluded and was counted. 9 CCR 2503-5 3.520.786.O (S2608) exempts infrequent or irregular income of less than $60 in a calendar quarter; 20 CFR 416.1124(c)(6) (S2609) states what infrequent and irregular mean. The fact states the receipt, program-neutrally (convention rule 13); each program's exclusion item decides whether its list exempts it."
