id: CO-1269
name: In a diversion period of ineligibility
identifier: in_diversion_period_of_ineligibility
kind: supplied
type: yes/no
scope: person-month
program: ColoradoWorks
meaning: The month falls within a period of ineligibility (POI) the client agreed to when receiving an earlier diversion payment, which the issuing county set and has not ended early for good cause, per 9 CCR 2503-6 3.606.8.A.4-5.
supplied_by: Statewide automated system diversion payment record.
sources: [S762]
tags: [cash, tanf]
rationale: No existing fact states it; cw_diversion_eligible (CO-1270) needs it.
