id: CO-2810
name: Nighttime residence type
identifier: nighttime_residence_type
kind: supplied
type: one of
scope: person
program: All
options: [fixed_regular_adequate, imminently_losing_residence, shared_housing_due_to_loss_or_hardship, shared_housing_other_temporary, motel_or_hotel_for_lack_of_alternative, trailer_park_or_campground_for_lack_of_alternative, emergency_or_transitional_shelter, halfway_house, abandoned_in_hospital, place_not_designed_for_sleeping, substandard_housing, institution]
meaning: "Where the person sleeps, as a statement of fact and not any program's finding: fixed_regular_adequate (a fixed, regular and adequate home of the person's own household); imminently_losing_residence (such a home the person will imminently lose); shared_housing_due_to_loss_or_hardship (staying in another person's home because of the loss of housing, economic hardship or a similar reason); shared_housing_other_temporary (a temporary stay in another person's home for another reason); motel_or_hotel_for_lack_of_alternative and trailer_park_or_campground_for_lack_of_alternative (for lack of alternative adequate accommodations); emergency_or_transitional_shelter (a supervised shelter giving temporary accommodation, a welfare hotel, a congregate or transitional shelter); halfway_house (a halfway house or similar institution giving temporary residence to persons intended to be institutionalized); abandoned_in_hospital; place_not_designed_for_sleeping (a car, park, public space, abandoned building, bus or train station, hallway, lobby or similar place); substandard_housing (a fixed and regular home that is not adequate); institution (a hospital, nursing facility, correctional facility or other institution where the person lives)."
precision: "One value per person, the primary nighttime residence on the determination date. Each program's homelessness is its own derived item over this fact (same-word audit SW-11): snap_is_homeless (CO-037), sebt_is_homeless_child (CO-2813), cccap_is_family_experiencing_homelessness (CO-2814), leap_is_homeless_or_in_non_traditional_dwelling (CO-2815) and af_hca_lives_in_shelter_or_temporary_setting (CO-2010)."
supplied_by: The application's living situation question; a shelter's or the local educational agency liaison's statement.
sources: [S1950, S1953, S1954]
tags: [household]
rationale: "Same-word audit SW-11: snap_is_homeless (CO-037) had no source and carried one meaning close to SNAP's 7 CFR 271.2 definition while SUN Bucks (McKinney-Vento through 7 CFR 245.2), CCCAP (3.103.CCC), the Home Care Allowance (a homeless shelter or temporary setting) and LEAP read it. The options are the union of the situations those definitions name, so each program's test is a list of options."
