id: CO-2333
name: "Sponsor is an organization"
identifier: sponsor_is_organization
kind: supplied
type: yes/no
scope: person
program: All
meaning: "This non-citizen's affidavit of support was executed by an organization or group rather than an individual."
precision: "If not stated, a program reads this as false (an individual sponsor)."
supplied_by: "Affidavit of support as recorded in CBMS."
sources: [S1619]
tags: [immigration]
rationale: "OQ-380: 4.305.2.E (S1619) lists the non-citizens to whom the sponsor's income and resources are not deemed; no fact stated this exemption, so snap_requires_verification_of_sponsor (CO-1616) asked every sponsored member for the sponsor's information."
