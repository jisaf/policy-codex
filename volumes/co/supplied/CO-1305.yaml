id: CO-1305
name: Citizenship verification document received
identifier: citizenship_verification_document_received
kind: supplied
type: yes/no
scope: person
program: All
meaning: Whether the agency has received documentary evidence (or an acceptable collateral contact) verifying the person's U.S. citizenship or nationality for this application, such as a U.S. passport, birth certificate or certificate of naturalization.
supplied_by: Date-stamped document receipt and collateral-contact entries in the CBMS case file.
sources: [S845, S826]
tags: [verification, immigration]
rationale: No existing item in the volume carries this fact; the phase-9 verification chapter (design amended 2026-11-21) needs it, and it is program-neutral so every program's verification rules read the same value.
