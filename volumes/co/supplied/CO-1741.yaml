id: CO-1741
name: "CCCAP: declares assets within the limit"
identifier: cccap_declares_assets_within_limit
kind: supplied
type: yes/no
scope: person
program: CCCAP
meaning: "Whether the adult caretaker or teen parent self-declares on the application that their liquid and non-liquid assets do not exceed cccap_asset_limit (8 CCR 1403-1 3.111.H.4.c, H.5.c: \"shall self-declare that their liquid and non-liquid assets do not exceed one million dollars. If assets exceed one million dollars the household is ineligible for CCCAP\"), assets as 3.103.K defines them: liquid resources (cash, checking and savings, certificates, stocks, bonds, lump sums) and non-liquid resources (any tangible property, every vehicle including motorcycles, trailers and recreational vehicles, and real property), excluding only the primary home and the automobile of the primary caretakers. No other program's exclusions apply."
precision: "The declaration itself, per caretaker, as 3.111.H.4.c states it; the application asks for the declaration, not a dollar figure, so no amount is supplied (heavier-definitions audit H-12). The ceiling the declaration names is cccap_asset_limit (CO-1809)."
supplied_by: "Adult caretaker or teen parent self-declaration on the application."
sources: [S515, S891, S1414]
tags: [resources]
rationale: "Vocabulary fix round (docs/reviews/vocabulary-reuse.md, R-11): CCCAP had read the SNAP countable liquid and non-liquid resource facts, which are net of SNAP's exclusions (home, most vehicles, retirement accounts). Heavier-definitions audit H-12 (audit fix round 4): renamed from cccap_declared_assets through a change set that keeps the ID and restated as the yes/no the rule asks for; the supplier no longer invents an amount the application does not collect. cccap_meets_asset_limit (CO-996), which compared the amount with the limit, is retired; cccap_low_income_child_care_eligible (CO-987) reads this declaration."
