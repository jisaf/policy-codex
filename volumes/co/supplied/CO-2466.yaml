id: CO-2466
name: "Medicaid: mandatory payroll taxes withheld"
identifier: ma_payroll_taxes_withheld
kind: supplied
type: money
scope: person-month
program: Medicaid
meaning: The mandatory FICA and Medicare taxes withheld from the person's wages for the month, which 10 CCR 2505-10 § 8.100.7.R.2 deducts from the community spouse's gross income.
precision: "Coverage pass 6, non-MAGI F6-10 (decision 4 of 2026-11-23: each supplied fact states once whether it is required or what its rule-given default is; readers do not invent defaults): required where read: no rule gives a default for the community spouse's withheld FICA and Medicare taxes (§ 8.100.7.R.2), and an unstated amount read as 0 raised the community spouse's income and lowered the income allowance; not stated, it cannot be determined."
supplied_by: Pay stubs or the employer's wage report.
sources: [S1756]
tags: [ma, ltc, income]
rationale: "OQ-97 resolution: the community spouse's income is now read from the spouse's own income facts across the spouse edge (ma_community_spouse_income, CO-2467); the withholding is the one deduction those facts do not carry."
