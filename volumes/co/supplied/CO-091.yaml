id: CO-091
name: Is eligible for Medicaid
identifier: is_eligible_for_medicaid
kind: supplied
type: yes/no
scope: person-month
program: CHP+
meaning: Whether CBMS's integrated eligibility determination has found the person eligible to receive Medical Assistance (Health First Colorado), for purposes of the 10 CCR 2505-3-120.1.B / 42 CFR 457.310(b)(2)(i) rule that a person eligible for Medicaid is not a targeted low-income child or pregnant woman for CHP+.
precision: "This is a placeholder interface fact, not a policy figure: the phase-3 brief directs CHP+ (batch 7) to create it because the Medicaid chapter's own category/eligibility outcome (ma_magi_is_eligible, ma_magi_category) is owned by a different, concurrently-authored batch (batch 6) and does not exist yet when this batch is written. Once ma_magi_is_eligible lands, chp_child_is_eligible (CO-705) and chp_prenatal_is_eligible (CO-706) should read it directly (for example [not, ma_magi_is_eligible] for the month in context) in place of this supplied fact, and CBMS's own determination becomes the supplied_by for ma_magi_is_eligible instead. See OQ-61."
supplied_by: CBMS's Medicaid (MAGI) eligibility determination for the same household and month, pending the engine-computed ma_magi_is_eligible.
sources: [S244, S248]
open: [OQ-61]
tags: [chp, ma]
rationale: "No existing item lets a CHP+ rule test 'not eligible for Medicaid' without a Medicaid category/eligibility outcome to read, because that outcome (ma_magi_is_eligible, ma_magi_category) belongs to batch 6, which lands concurrently with this batch and has not yet been committed. Modeled as a supplied fact, per the phase-3 brief's explicit instruction for batch 7, so chp_child_is_eligible and chp_prenatal_is_eligible can be authored and tested now; the coordinator rewires it to a read of ma_magi_is_eligible once batch 6 lands."
tests:
  - {id: CO-091-T1, as_of: "2026-10-01", month: "2026-10", given: {is_eligible_for_medicaid: true}, expect: true}
  - {id: CO-091-T2, as_of: "2026-10-01", month: "2026-10", given: {is_eligible_for_medicaid: false}, expect: false}
