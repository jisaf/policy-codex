id: CO-4343
name: "Joint real property: other owners' share"
identifier: joint_real_property_other_owners_share_value
kind: supplied
type: money
scope: person
program: All
meaning: "The equity value of the shares of the person's jointly owned real property, other than the home the person lives in and property used to produce income, that belong to joint owners who do not live with the person, to the extent the person can get at them (the property can be divided or sold without a joint owner's refusal)."
precision: "Not part of real_property_other_than_home_equity, which states the person's own share; added to it. As of the determination date. If not stated, SNAP reads it as 0."
supplied_by: "Deed naming the joint owners; applicant statement."
sources: [S2968, S3129]
tags: [snap, resources]
rationale: "Coverage review snap-financial CF-8: as for liquid resources (CO-4340), 4.409.C (S2968) counts jointly owned non-liquid resources in their entirety."
