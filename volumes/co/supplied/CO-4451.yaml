id: CO-4451
name: "Adoption subsidy or kinship care payments received"
identifier: adoption_or_kinship_subsidy_received
kind: supplied
type: money
scope: person-month
program: All
meaning: "Money the person received in the month from the county or the State as an adoption subsidy (adoption assistance, under Title IV-E or State-funded) for a child the person adopted, or as a kinship care or kinship guardianship assistance payment for a relative child in the person's care. A foster care payment for a child placed in the person's home is foster_care_provider_payments_received (CO-3821), not this fact."
precision: "Part of the person's gross unearned income for the month as the unearned income facts state it (other_unearned_income_taxable or other_unearned_income_nontaxable, or the fact that names the source), not added to it. If not stated, every program reads it as 0."
supplied_by: "Applicant statement, the county's or State's payment record."
sources: [S3257]
tags: [income]
nearest: [CO-3821, CO-2847]
rationale: "Coverage round (docs/reviews/coverage-cccap.md, F-07): 8 CCR 1403-1 3.111.J.10 (S3257) excludes \"Payments received from the county or state for providing foster care, kinship care, or for an adoption subsidy\". foster_care_provider_payments_received (CO-3821) states the foster care payment, but no fact stated an adoption subsidy or a kinship payment, so CCCAP counted it as other unearned income. child_welfare_payment_type (CO-2847) names the child's payment type, not the amount the caretaker receives."
