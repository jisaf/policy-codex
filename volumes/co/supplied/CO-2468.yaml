id: CO-2468
name: "Medicaid: resides with the community spouse"
identifier: ma_resides_with_community_spouse
kind: supplied
type: yes/no
scope: person
program: Medicaid
meaning: Whether the person resides with the community spouse of a long-term care couple (10 CCR 2505-10 § 8.100.7.T.1.c.ii). If not stated, Medicaid reads it as false.
supplied_by: The application's household members and addresses.
sources: [S1736]
tags: [ma, ltc, household]
rationale: "OQ-95 (resolved in the HCPF fix round): the family allowance group is now derived (ma_family_allowance_members, CO-2469); residence with the community spouse is the one condition the relationship edges do not state."
