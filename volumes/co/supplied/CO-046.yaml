id: CO-046
name: Receives unemployment compensation or has applied
identifier: receives_unemployment_compensation_or_applied
kind: supplied
type: yes/no
scope: person
program: SNAP
meaning: The person receives unemployment compensation, or has registered for work as part of applying for or receiving unemployment compensation.
supplied_by: State unemployment insurance record.
sources: []
tags: [work_registration]
rationale: "A fact the case must supply; no existing item in the Colorado volume carries it (the volume began empty in phase 1, and the mwr volume's facts are not shared across volumes). It is reserved for the SNAP income, deduction, work registration and ABAWD rules of later batches, which read it by this identifier."
