id: CO-1933
name: Has a disability that significantly impairs activities of daily living
identifier: ma_has_disability_impairing_activities_of_daily_living
kind: supplied
type: yes/no
scope: person
program: Medicaid
meaning: Whether the person has a physical, intellectual, or developmental disability that significantly impairs their ability to perform one or more activities of daily living (42 CFR 435.554(c)(5)(i)(D)).
supplied_by: The State's list of diseases, diagnoses, disorders and health conditions (435.554(c)(5)(ii)), claims and encounter data, or the person's request for consideration (435.557(f)).
sources: [S1209]
tags: [ma, magi, medical]
rationale: "OQ-65: one of the five conditions of the medically frail exclusion; no fact states it."
