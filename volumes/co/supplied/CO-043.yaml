id: CO-043
name: Has a medical statement of unfitness for employment
identifier: has_medical_statement_of_unfitness
kind: supplied
type: yes/no
scope: person
program: SNAP
meaning: A physician, physician's assistant, nurse practitioner, or other sufficiently qualified professional has certified that the person is mentally or physically unfit for employment.
supplied_by: Medical statement.
sources: []
tags: [work_registration]
rationale: "A fact the case must supply; no existing item in the Colorado volume carries it (the volume began empty in phase 1, and the mwr volume's facts are not shared across volumes). It is reserved for the SNAP income, deduction, work registration and ABAWD rules of later batches, which read it by this identifier."
