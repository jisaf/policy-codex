id: CO-807
name: Medicare Savings Program resource limit (individual)
identifier: msp_resource_limit_individual
kind: supplied
type: money
scope: person
program: All
meaning: The current-year QMB/SLMB/QI resource limit for a single individual, published annually by CMS as an indexation (by the change in the September consumer price index) of the $8,180 base 10 CCR 2505-10 8.100.5.M.1 states effective January 1, 2011.
precision: Not a fetched-document figure for the case's as-of date; see OQ-81. A worker or reviewer states the CMS-published current-year figure.
supplied_by: CMS annual Medicare Savings Program resource limit publication (Medicare & You / QMB fact sheet), as loaded in CBMS.
sources: [S301]
open: [OQ-81]
tags: [non_magi, msp, resources]
rationale: "8.100.5.M.1 (S301) states the base figure and the CPI-indexing rule but not a current-year dollar amount, and no CMS 2026 MSP resource limit publication could be fetched (OQ-81). Modeled as a supplied fact per the phase-4 brief's direction for a policy figure no fetched document states. ma_qmb_eligible, ma_slmb_eligible and ma_qi_eligible (CO-613-CO-615) need it."
