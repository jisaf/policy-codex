id: CO-4500
name: "Housing utility allowance received"
identifier: housing_utility_allowance_received
kind: supplied
type: money
scope: person-month
program: All
meaning: "Money the person received in the month from a subsidized housing program (public housing, a Housing Choice Voucher or another rental assistance program) as an allowance or reimbursement toward the dwelling's utility costs, paid to the tenant rather than to the landlord or the utility."
precision: "Part of the person's gross unearned income for the month as the unearned income facts state it (other_unearned_income_taxable or other_unearned_income_nontaxable), not added to it. A utility allowance that only lowers the rent the tenant pays is not a receipt and is not this fact. If not stated, every program reads it as 0."
supplied_by: "Housing authority's utility allowance notice or payment record."
sources: [S3300]
tags: [income]
rationale: "Coverage review C-1 (docs/reviews/coverage-leap-sunbucks.md): 9 CCR 2503-7 3.752.23.Y (S3300) excludes \"Subsidized housing utility allowances\", and no fact stated the receipt, so LEAP counted it in other unearned income. The fact states the receipt, program-neutrally (convention rule 13); LEAP's exclusion item (leap_excluded_unearned_income, CO-4511) decides that its list exempts it."
nearest: [CO-3812]
