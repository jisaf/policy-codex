id: CO-2408
name: "CHP+: mother was enrolled in CHP+ at the child's birth"
identifier: chp_mother_was_enrolled_at_birth
kind: supplied
type: yes/no
scope: person
program: CHP+
meaning: Whether the child's mother was enrolled in the Children's Basic Health Plan (CHP+) at the time of the child's birth (10 CCR 2505-3 § 430.5). If not stated, CHP+ reads it as false.
supplied_by: "CBMS: the mother's CHP+ enrollment on the reported date of birth (§ 430.5.A requires the birth to be reported)."
sources: [S1716]
tags: [chp, age]
rationale: B-2 of the HCPF review. mother_was_enrolled_in_medicaid_at_birth (the needy-newborn fact) states Medicaid enrollment, not CHP+.
