id: CO-1322
name: Resources verification document received
identifier: resources_verification_document_received
kind: supplied
type: yes/no
scope: person
program: All
meaning: Whether the agency has received documentary evidence (or an acceptable collateral contact) verifying the person's resources and their values for this application, such as bank statements, a vehicle title and valuation, or an insurance policy statement.
supplied_by: Date-stamped document receipt and collateral-contact entries in the CBMS case file.
sources: [S866, S888]
tags: [verification, resources]
rationale: No existing item in the volume carries this fact; the phase-9 verification chapter (design amended 2026-11-21) needs it, and it is program-neutral so every program's verification rules read the same value.
