id: CO-4440
name: "Donated work is regular, necessary work someone would be hired for"
identifier: donated_work_meets_paid_work_tests
kind: supplied
type: yes/no
scope: person
program: All
meaning: "The unpaid work donated_work_hours_in_month (CO-4438) states is regular and scheduled, is a necessary service, and would have to be done by someone hired if the person (or the person's spouse or sponsor) did not do it."
precision: "Adult Financial requires it where read (coverage pass 4 CA4-16, decision 4 of 2026-11-23: missing information is cannot determine unless the rule says otherwise), for donated work over five hours a week; before, it was read as false when not stated."
supplied_by: "Applicant statement and the statement of the business or person served, as the county establishes them."
sources: [S3211]
tags: [income]
rationale: "Coverage review F-10: the tests of 9 CCR 2503-5 3.520.784.A.1-3 (S3211)."
