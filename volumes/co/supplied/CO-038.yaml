id: CO-038
name: "Is a fleeing felon"
identifier: is_fleeing_felon
kind: supplied
type: yes/no
scope: person
program: All
meaning: "The person is fleeing to avoid prosecution, or custody or confinement after conviction, for a crime (or attempt) that is a felony under the law of the place from which the person flees."
supplied_by: Law enforcement notice, county worker determination.
sources: [S19]
rationale: "A fact the case must supply; no existing item in the Colorado volume carries it (the volume began empty in phase 1, and the mwr volume's facts are not shared across volumes). It is read by SNAP: is an ineligible member. Vocabulary fix round (R-6): renamed from is_fleeing_felon_or_probation_violator and narrowed to the fleeing-felon condition; the probation or parole violation SNAP joins to it is is_probation_or_parole_violator (CO-1732). Adult Financial (3.520.61.B) and Colorado Works (3.604.2.L.1) name only fleeing felons."
