rationale: "Dual-entry audit 3.17 and same-word audit SW-24: SNAP's is_complying_with_tanf_work_requirements (CO-066, retired) restated the Colorado Works compliance that complies_with_tanf_work_requirements (CO-1935) states, plus the refugee work program. The refugee program is the part no other fact states."
