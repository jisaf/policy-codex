id: CO-3843
name: "Adult Financial: AND-SO months received for substance abuse"
identifier: af_and_so_substance_abuse_months_received
kind: supplied
type: whole number
scope: person
program: AdultFinancial
meaning: "The number of months, in the client's lifetime, for which the client received AND-SO on a medical certification that identified substance abuse, before the month being determined: the initial partial month of the first approval is not counted; a partial month after a re-approval counts as a full month (9 CCR 2503-5 3.541.3.A, G)."
precision: "If not stated, Adult Financial reads this as 0."
supplied_by: "County department case history (the statewide automated system)."
sources: [S2616, S2617]
tags: [cash, and, disability]
rationale: "Final cash review FC-7: 9 CCR 2503-5 3.541.3 (S2616) and C.R.S. 26-2-111(4)(e)-(f) (S2617) limit AND-SO for a client whose primary diagnosis is alcoholism or controlled substance addiction to twelve cumulative months in a lifetime, on condition of treatment and of not testing positive twice in any three-month period, and nothing in the volume stated it. Months of AND-SO received are a record of the program's own case, as months_of_assistance_received is for Colorado Works."
