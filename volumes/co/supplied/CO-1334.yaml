id: CO-1334
name: Pregnancy verification document received
identifier: pregnancy_verification_document_received
kind: supplied
type: yes/no
scope: person
program: All
meaning: Whether the agency has received documentary evidence (or an acceptable collateral contact) verifying the person's pregnancy for this application, such as a medical provider's statement.
supplied_by: Date-stamped document receipt and collateral-contact entries in the CBMS case file.
sources: [S842, S874]
tags: [verification]
rationale: No existing item in the volume carries this fact; the phase-9 verification chapter (design amended 2026-11-21) needs it, and it is program-neutral so every program's verification rules read the same value.
