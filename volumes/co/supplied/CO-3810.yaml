id: CO-3810
name: "Colorado Works: failed to cooperate with Child Support Services"
identifier: cw_has_failed_child_support_cooperation
kind: supplied
type: yes/no
scope: person
program: ColoradoWorks
meaning: "Child Support Services or the county department has found that the client failed to cooperate with Child Support Services, at application or while receiving basic cash assistance, without good cause (9 CCR 2503-6 3.604.4.A). A client whose good-cause claim was found valid (3.604.4.A.1-3), or for whom a Family Violence Option waiver of child support services is in effect (3.604.5.A.1.c), has not failed."
precision: "If not stated, Colorado Works reads this as false."
supplied_by: "County department or Child Support Services non-cooperation finding."
sources: [S2603]
tags: [cash, tanf, household]
rationale: "Final cash review FC-1: 3.604.4.A (S2603) says failure to cooperate with Child Support Services without good cause \"will result in the termination or discontinuation of the Colorado Works basic cash assistance\". No fact stated it. The finding is Child Support Services' or the county's, so it carries the program's prefix (convention rule 13 (i))."
