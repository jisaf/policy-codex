id: CO-2332
name: "SNAP: lives in the sponsor's SNAP household"
identifier: snap_lives_in_sponsor_household
kind: supplied
type: yes/no
scope: person
program: SNAP
meaning: "This sponsored non-citizen is a member of the sponsor's own SNAP household (10 CCR 2506-1 4.305.2.E.1), so the sponsor's income and resources count as household income and resources, not by deeming."
precision: "If not stated, SNAP reads this as false."
supplied_by: "Applicant statement and the CBMS household."
sources: [S1619]
tags: [snap, immigration]
rationale: "OQ-380: 4.305.2.E (S1619) lists the non-citizens to whom the sponsor's income and resources are not deemed; no fact stated this exemption, so snap_requires_verification_of_sponsor (CO-1616) asked every sponsored member for the sponsor's information."
