id: CO-2342
name: "Adult Financial: excluded earned income"
identifier: af_excluded_earned_income
kind: supplied
type: money
scope: person-month
program: AdultFinancial
meaning: "The part of this person's gross earned income for the month, as stated in wages_gross and the self-employment profit, that 9 CCR 2503-5 3.520.786 excludes from Adult Financial income."
precision: "If not stated, Adult Financial reads this as 0 (no excluded earned income). It cannot exceed the gross amount it is taken from; the income item never falls below zero."
supplied_by: "Eligibility technician's application of the program's exclusion list to the income reported."
sources: [S1622]
tags: [cash, income]
rationale: "OQ-390: supplied income facts state the gross amount received before any program's exclusions (vocabulary review R-1), and each program's exclusion list (S1622) differs, so a case with excluded income could not be right for two programs at once; this program's own excluded amount lets af_countable_income (CO-946) subtract it."
