id: CO-1241
name: Number of non-heating utility costs incurred
identifier: non_heating_utility_cost_count
kind: supplied
type: whole number
scope: person
program: SNAP
meaning: The number of distinct non-heating, non-cooling utility costs the person's household incurs - electricity, water, sewer, trash, cooking fuel, telephone - counting the telephone (one telephone, or telephone service associated with a specific device, including VOIP but not internet or cable fees) as one, per 10 CCR 2506-1 4.407.3.E.4-5 and 4.407.31.B-D. Stated once per unit, carried on the head of household.
supplied_by: Applicant statement.
sources: [S744, S745, S746, S753]
tags: [income, snap]
rationale: No existing fact counts utility costs; snap_utility_allowance_amount (CO-036) needs it to choose among the BUA, OUA and telephone allowance.
