id: CO-013
name: Receives TANF cash assistance
identifier: receives_tanf_cash
kind: supplied
type: yes/no
scope: person
program: All
meaning: "The person receives, or is authorized to receive, a cash grant under a state program funded under part A of title IV of the Social Security Act (Colorado Works). A fact about the person's current Colorado Works case (the unit is receiving basic cash assistance), not this volume's own determination of Colorado Works eligibility (cw_eligibility_status, CO-921); the amount paid for the month is a receipt of kind colorado_works_cash (receipts, CO-5000)."
precision: "True only for a member of the Colorado Works assistance unit, a person whose needs the grant includes. A payee or caretaker relative outside the unit (a grandmother who receives a child-only grant for her grandson) does not receive it; the grandson does. Coverage pass 2 C2-3: cccap_eligibility_status (CO-989) reads it as unit membership (8 CCR 1403-1 3.115.C, S3253)."
supplied_by: CBMS Colorado Works case record.
sources: [S47]
rationale: "A fact the case must supply; no existing item in the Colorado volume carries it (the volume began empty in phase 1, and the mwr volume's facts are not shared across volumes). It is reserved for the SNAP income, deduction, work registration and ABAWD rules of later batches, which read it by this identifier. Vocabulary fix round (D-6): kept as the case-status fact beside the amount (tanf_cash_income); the meaning now says which is which. Dual-entry audit 4.3 (audit fix round): SNAP's Basic Categorical Eligibility covers members who \"receive, or are authorized to receive\" Colorado Works (10 CCR 2506-1 4.206.C.1.a, S47). Authorization is the county's act on the Colorado Works case (an approved grant not yet paid), a record like receipt, so the meaning names it and BCE (CO-336) keeps reading the record rather than this volume's own Colorado Works determination; receives_state_cash_assistance (CO-073) already says the same for Adult Financial."
