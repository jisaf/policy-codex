id: CO-013
name: Receives TANF cash assistance
identifier: receives_tanf_cash
kind: supplied
type: yes/no
scope: person
program: All
meaning: "The person receives a cash grant under a state program funded under part A of title IV of the Social Security Act (Colorado Works). A fact about the person's current Colorado Works case (the unit is receiving basic cash assistance), not this volume's own determination of Colorado Works eligibility (cw_eligibility_status, CO-921); the amount paid for the month is tanf_cash_income (CO-029)."
supplied_by: CBMS Colorado Works case record.
sources: []
rationale: "A fact the case must supply; no existing item in the Colorado volume carries it (the volume began empty in phase 1, and the mwr volume's facts are not shared across volumes). It is reserved for the SNAP income, deduction, work registration and ABAWD rules of later batches, which read it by this identifier. Vocabulary fix round (D-6): kept as the case-status fact beside the amount (tanf_cash_income); the meaning now says which is which."
