id: CO-4340
name: "Joint liquid resources: other owners' share"
identifier: joint_liquid_resources_other_owners_share_value
kind: supplied
type: money
scope: person
program: All
meaning: "The value of the shares of the person's jointly owned cash and convertible assets that belong to joint owners who do not live with the person, to the extent the person can get at them (withdraw or use them without a joint owner's refusal)."
precision: "Not part of liquid_resources_value, which states the person's own share; added to it. As of the determination date. If not stated, SNAP reads it as 0."
supplied_by: "Bank statements naming the joint owners; applicant statement."
sources: [S2968, S3129]
tags: [snap, resources]
rationale: "Coverage review snap-financial CF-8: SNAP counts a resource owned jointly by separate households in its entirety to each, less what the household shows it cannot reach (4.409.C, S2968; 7 CFR 273.8(d), S3129); liquid_resources_value states only the person's share."
