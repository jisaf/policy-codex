id: CO-2700
name: Status before lawful permanent residence
identifier: status_before_lpr_adjustment
kind: supplied
type: one of
options: [none, refugee, asylee, deportation_withheld, cuban_haitian_entrant, amerasian_immigrant, iraqi_afghan_special_immigrant, other]
scope: person
program: All
meaning: "For a lawful permanent resident (immigration_status lawful_permanent_resident), the status the person held before adjusting to permanent residence, or the special class under which the person was admitted for permanent residence: refugee (INA 207), asylee (INA 208), deportation_withheld (INA 243(h) or 241(b)(3)), cuban_haitian_entrant, amerasian_immigrant (admitted under section 584 of the Foreign Operations, Export Financing, and Related Programs Appropriations Act, 1988), iraqi_afghan_special_immigrant (an Iraqi or Afghan special immigrant under INA 101(a)(27)); other for any other prior status; none for a person admitted directly as a lawful permanent resident in no special class."
precision: "Read only for a lawful permanent resident. If not stated, programs read this as none: a lawful permanent resident whose earlier status the case does not state is treated as admitted directly (the exemptions it opens are then not applied). Colorado Works' and Adult Financial's sponsor deeming (cw_sponsor_deeming_applies CO-2364, af_sponsor_deeming_applies CO-4400) require it where read (coverage pass 6 CA6-7, docs/reviews/coverage6-cash.md; decision 4 of 2026-11-23): not stated is cannot determine there; the other readers are as their items state."
supplied_by: "SAVE response (class of admission), Form I-551, I-94 or the adjustment record."
sources: [S1150, S656, S1904, S1627]
tags: [immigration]
rationale: "OQ-44 fix (docs/reviews/audit-dual-entry.md 3.1): the history a status rule reads beside immigration_status (CO-002). It replaces the options refugee_or_asylee_adjusted_to_lpr and amerasian_immigrant of federal_five_year_bar_exempt_category (CO-1724) and iraqi_or_afghan_special_immigrant_adjusted_to_lpr of ma_five_year_bar_exempt_category (CO-1170), both retired. Read by is_exempt_from_five_year_bar (CO-1725, 8 U.S.C. 1613(b)(1)), ma_is_five_year_bar_exempt (CO-1172, § 8.100.3.G.1.g.iv.7-8) and cw_sponsor_deeming_applies (CO-2364, 3.605.1.A.5.c)."
