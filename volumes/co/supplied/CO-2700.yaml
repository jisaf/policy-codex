id: CO-2700
name: Status before lawful permanent residence
identifier: status_before_lpr_adjustment
kind: supplied
type: one of
options: [none, refugee, asylee, deportation_withheld, cuban_haitian_entrant, amerasian_immigrant, iraqi_afghan_special_immigrant, non_qualified_status, other]
scope: person
program: All
meaning: "For a lawful permanent resident (immigration_status lawful_permanent_resident), the status the person held before adjusting to permanent residence, or the special class under which the person was admitted for permanent residence: refugee (INA 207), asylee (INA 208), deportation_withheld (INA 243(h) or 241(b)(3)), cuban_haitian_entrant, amerasian_immigrant (admitted under section 584 of the Foreign Operations, Export Financing, and Related Programs Appropriations Act, 1988), iraqi_afghan_special_immigrant (an Iraqi or Afghan special immigrant under INA 101(a)(27)); non_qualified_status for a prior status in which the person was not a qualified alien (8 U.S.C. 1641(b), (c)): a nonimmigrant admission such as a work, student or fiance visa, or no lawful status, so the permanent residence is the person's first qualified status; other for any other prior status (a parole of at least a year, a conditional entry, a battered non-citizen's status under 1641(c)); none for a person admitted directly as a lawful permanent resident in no special class."
precision: "Read only for a lawful permanent resident. If not stated, programs read this as none: a lawful permanent resident whose earlier status the case does not state is treated as admitted directly (the exemptions it opens are then not applied). Colorado Works' and Adult Financial's sponsor deeming (cw_sponsor_deeming_applies CO-2364, af_sponsor_deeming_applies CO-4400) require it where read (coverage pass 6 CA6-7, docs/reviews/coverage6-cash.md; decision 4 of 2026-11-23): not stated is cannot determine there; Medicaid requires it where read too (coverage pass 7, C7-09, 2026-11-24: ma_is_five_year_bar_exempt CO-1172, ma_meets_citizenship_requirement_before_qualified_status CO-7652, ma_has_held_qualified_status_five_years_in_month CO-7550): SAVE reports the class of admission, so it is always available; the start of the five-year waiting period read by SNAP and the cash programs requires it where read too (qualified_non_citizen_waiting_period_start_date CO-7820, for a lawful permanent resident who did not enter the United States in that status; KL-SNAP-2, KL-CASH-2, 2026-11-24); the other readers are as their items state. Coverage verification 7, V7-8 (docs/reviews/verify-coverage7-fixes.md): non_qualified_status is split out of other, so Medicaid's five-year count (CO-7550) reads the date of the permanent residence as the first qualified status for it, as for none, without asking first_qualified_status_date (CO-7770) to state the same date again; every other reader names only the special classes and reads non_qualified_status as it read other. The start of the waiting period (qualified_non_citizen_waiting_period_start_date, CO-7820, read by SNAP and the cash programs) reads non_qualified_status as Medicaid does, as for none (2026-11-24): the date of the permanent residence, with no first_qualified_status_date asked; before, it read none alone that way and asked first_qualified_status_date for non_qualified_status."
supplied_by: "SAVE response (class of admission), Form I-551, I-94 or the adjustment record."
sources: [S1150, S656, S1904, S1627]
tags: [immigration]
rationale: "OQ-44 fix (docs/reviews/audit-dual-entry.md 3.1): the history a status rule reads beside immigration_status (CO-002). It replaces the options refugee_or_asylee_adjusted_to_lpr and amerasian_immigrant of federal_five_year_bar_exempt_category (CO-1724) and iraqi_or_afghan_special_immigrant_adjusted_to_lpr of ma_five_year_bar_exempt_category (CO-1170), both retired. Read by is_exempt_from_five_year_bar (CO-1725, 8 U.S.C. 1613(b)(1)), ma_is_five_year_bar_exempt (CO-1172, § 8.100.3.G.1.g.iv.7-8) and cw_sponsor_deeming_applies (CO-2364, 3.605.1.A.5.c)."
