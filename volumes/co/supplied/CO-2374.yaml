id: CO-2374
name: "Colorado Works: earned income from a new source"
identifier: cw_new_source_earned_income
kind: supplied
type: money
scope: person-month
program: ColoradoWorks
meaning: "The part of this person's gross earned income for the month that comes from a new source of earned income - one that began while the assistance unit was receiving basic cash assistance - in the first certification period that the income impacts (9 CCR 2503-6 3.606.2.A.2.a), when the person also has earnings from a current source (A.2.b) in the same month."
precision: "Not stated when the month has one kind of source only; cw_is_new_earned_income_source then says which. When stated it is part of cw_gross_earned_income and cannot exceed it. Earned-income records, step E1 Colorado Works (docs/reviews/records-earnings-cash.md): no item reads it; the translator restates it as a wages record with the job's start date (job_start_date, the first of the month), which cw_new_source_earnings (CO-5141) reads, and it is retired with the other scalar earned facts in step E2."
supplied_by: "CBMS income record, from the change report."
sources: [S1000]
tags: [cash, tanf, income]
rationale: "OQ-350: wages_gross is one figure per person-month and cw_is_new_earned_income_source (CO-1502) one yes/no, so a month with both a continuing and a new job could not be stated; this amount splits the month so each part gets its own disregard."
