id: CO-3812
name: "General or one-time emergency assistance received"
identifier: general_or_emergency_assistance_received
kind: supplied
type: money
scope: person-month
program: All
meaning: "Money the person received in the month as General Assistance granted by a county department (before or as a supplement to other assistance, recurring or not), or as emergency assistance received on a one-time basis from a county department or another agency or organization, other than home energy assistance and major disaster or emergency assistance."
precision: "Part of the person's gross unearned income for the month as the unearned income facts state it (other_unearned_income_taxable or other_unearned_income_nontaxable, or the fact that names the source), not added to it. If not stated, every program reads it as 0."
supplied_by: "Applicant statement, county General Assistance record."
sources: [S2605, S2608, S2609]
tags: [cash, income]
rationale: "Final cash review FC-2 and FC-3: Colorado Works' and Adult Financial's exclusion items (CO-2340 to CO-2343) summed a closed list of neutral receipt facts, so income the current exempt-income lists name could not be excluded and was counted. 9 CCR 2503-6 3.605.4.A.3 and A.7 (S2605) exempt one-time emergency assistance and county General Assistance; 9 CCR 2503-5 3.520.786.D (S2608) exempts emergency or general assistance received once, and K incorporates 20 CFR 416.1124(c)(2) (S2609), which excludes assistance based on need wholly funded by a State or its political subdivisions. other_unearned_income_nontaxable (CO-030) names general assistance among its examples but cannot separate it. The fact states the receipt, program-neutrally (convention rule 13); each program's exclusion item decides whether its list exempts it."
