id: CO-845
name: County-approved living arrangement (minor parent)
identifier: county_approved_living_arrangement
kind: supplied
type: yes/no
scope: person
program: ColoradoWorks
meaning: The county department has determined, per 9 CCR 2503-6 3.604.2.N.1-3, that an unmarried minor parent who does not reside with another adult caretaker or with the minor's own parent is nonetheless in an appropriate, county-approved setting.
supplied_by: County department living-arrangement determination (case record).
sources: [S411]
rationale: No existing fact carries this county determination, which is the residual path 3.604.2.N provides when a minor parent lives with neither an adult relative nor her own parent; cw_minor_parent_living_arrangement_met (CO-906) needs it.
