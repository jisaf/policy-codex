id: CO-2222
name: Lottery winnings hardship exemption granted
identifier: ma_lottery_winnings_hardship_exemption_granted
kind: supplied
type: yes/no
scope: person
program: Medicaid
meaning: "Whether a hardship exemption has been granted to the person after a denial or termination caused by the person's lottery or gambling winnings: the person showed a severe medical or financial hardship and made a written request with documentation to the County Department of Human Services within 30 calendar days of the denial or termination notice (10 CCR 2505-10 § 8.100.4.C.1.b.xiv.5), so the person continues to be eligible (42 U.S.C. 1396a(e)(14)(K)(iii))."
supplied_by: The county's or the Department's hardship decision recorded in the case.
sources: [S1519, S1520]
tags: [ma, magi, income]
rationale: "OQ-216: the hardship exemption had no fact; ma_lottery_winnings_countable_for_recipient (CO-1187) reads it."
