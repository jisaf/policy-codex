id: CO-1316
name: Earned income verification document received
identifier: earned_income_verification_document_received
kind: supplied
type: yes/no
scope: person
program: All
meaning: Whether the agency has received documentary evidence (or an acceptable collateral contact) verifying the person's earned income (wages or self-employment) for this application, such as wage stubs, an employer's statement, tax documents or a self-employment ledger, or a collateral contact with the employer.
precision: "One fact for every program: it cannot say whether the documents cover the period a program wants (LEAP four of the eight weeks before application, 3.755.21.D; CCCAP the prior thirty days, up to twelve months, 3.111.H.5.a; Medical Assistance a recent stub, 8.100.4.B.1.c). A case states it true only when the documents meet the program under determination."
supplied_by: Date-stamped document receipt and collateral-contact entries in the CBMS case file.
sources: [S801, S861, S891, S898]
tags: [verification, income]
rationale: No existing item in the volume carries this fact; the phase-9 verification chapter (design amended 2026-11-21) needs it, and it is program-neutral so every program's verification rules read the same value.
