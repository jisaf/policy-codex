id: CO-1934
name: Has a serious or complex medical condition
identifier: ma_has_serious_or_complex_medical_condition
kind: supplied
type: yes/no
scope: person
program: Medicaid
meaning: Whether the person has a serious or complex medical condition as 42 CFR 435.554(c)(5)(i)(E) defines it (life threatening, seriously disabling, causing significant pain that interrupts life activities, requiring major caregiver commitment, frequent monitoring, coordination of multiple specialties, and the other listed features).
supplied_by: The State's list of diseases, diagnoses, disorders and health conditions (435.554(c)(5)(ii)), claims and encounter data, or the person's request for consideration (435.557(f)).
sources: [S1209]
tags: [ma, magi, medical]
rationale: "OQ-65: one of the five conditions of the medically frail exclusion; no fact states it."
