id: CO-4370
name: Medicare premium refund received
identifier: medicare_premium_refund_received
kind: supplied
type: money
scope: person-month
program: All
meaning: "A lump-sum refund of Medicare Part B (Supplementary Medical Insurance) premiums the person received in the month, such as the refund paid when the State's buy-in begins paying the premium for past months."
precision: "Part of the person's gross unearned income for the month as the unearned income facts state it (social_security_income or other_unearned_income_nontaxable), not added to it. If not stated, Colorado Works reads it as 0."
supplied_by: Social Security Administration notice or payment record.
sources: [S3166]
tags: [income]
rationale: "Coverage review CW-22 (P2): 9 CCR 2503-6 3.605.3.B.9 (S3166) counts the full Social Security award but exempts \"The lump sum SMIB refund received by the 'buy-in' recipient\"; no fact stated the refund. Program-neutral; cw_unearned_income_deductions (CO-4369) subtracts it."
