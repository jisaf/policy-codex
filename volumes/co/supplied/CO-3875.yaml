id: CO-3875
name: "Adult Financial: disaster assistance already paid for the disaster"
identifier: af_disaster_assistance_paid_for_disaster
kind: supplied
type: money
scope: person
program: AdultFinancial
meaning: "The disaster assistance payments already made to the client for the same disaster."
precision: "If not stated, Adult Financial reads it as 0."
supplied_by: "County department payment record."
sources: [S2624]
tags: [cash]
rationale: "Final cash review FC-10: 9 CCR 2503-5 3.570.5 (S2624) provides a disaster assistance payment of up to $2,000 per client per disaster to a client approved for or receiving an Adult Financial grant during a declared disaster, and it had no item, outcome or open question. It is modeled as Colorado Works diversion is: eligibility, and the amount the county approves within the maximum. The $2,000 is per client, per disaster (3.570.51.A)."
