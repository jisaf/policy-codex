id: CO-888
name: "Medicaid: spouses' countable resources at the spousal impoverishment snapshot"
identifier: ma_spousal_resources_at_snapshot
kind: supplied
type: money
scope: person
program: Medicaid
meaning: "The couple's total countable resources as assessed at the time of the initial Medical Assistance application (10 CCR 2505-10 § 8.100.7.L, M.1: \"based on the total resources owned by the couple as of the time of Medical Assistance application\"), the figure the CSRA is computed from and \"established at intake only.\""
precision: "Coverage review NM-18: the meaning had dated the assessment at the start of the first continuous period of institutionalization, the date of 42 U.S.C. 1396r-5(c)(1)(A); Colorado's CSRA is the couple's resources up to the maximum (OQ-126), which 1396r-5(c)(2) attributes at the time of application, so the application date governs here."
supplied_by: County eligibility worker's Resource Assessment (CBMS resource screen completed at the § 8.100.7.L assessment), from verified account statements and property records for both spouses as of the snapshot date.
sources: [S652, S1220, S3419]
tags: [ma, ltc, resources]
rationale: "ssi_countable_resources_couple (CO-801) is read both as the § 8.100.7.L intake snapshot (by ma_csra, CO-646) and as the current-month figure § 8.100.7.O.1 tests each month (by ma_institutionalized_spouse_countable_resources, CO-647), so the two can never differ and spend-down cannot be expressed - the phase-4 review's C-13 finding. This item is the snapshot only; CO-801 becomes the current-month figure CO-647 subtracts the CSRA from. ma_csra (CO-646) needs it. Vocabulary fix round (docs/reviews/vocabulary-reuse.md, C-2): renamed from countable_resources_couple_at_snapshot; Medicaid's spousal impoverishment rule defines it."
