id: CO-835
name: Health insurance premiums paid
identifier: health_insurance_premiums_paid
kind: supplied
type: money
scope: person-month
program: All
meaning: "The health insurance premiums the person pays for the month: Medicare, long-term care insurance and other health and hospitalization insurance. Each program decides which it allows (10 CCR 2505-10 §§ 8.100.7.Q.2.b and 8.100.7.V.3.b for Medicaid's patient payment; 7 CFR 273.9(d)(3) for SNAP's medical deduction)."
precision: For the institutionalized spouse this deducts from ma_patient_payment (CO-658); for the community spouse it deducts from the community spouse's minimum monthly needs under § 8.100.7.Q.2.b (not separately modeled - see rationale).
supplied_by: Eligibility Site's verification of premium payments (Medicare premium statements, insurance bills).
sources: [S1756, S87, S91]
tags: [ma, ltc, income]
rationale: "The phase-4 brief's interface fixes this identifier and directs creating it in this batch. ma_patient_payment (CO-658) needs the institutionalized person's own premiums as a deduction; this batch does not separately add the community spouse's premiums to ma_mmmna (CO-655), since § 8.100.7.Q.2 describes them as an additional amount 'approved' rather than part of the MMMNA formula itself. Same-word audit SW-34: the one statement of premiums, read by Medicaid's patient payment and, beside other medical expenses, by SNAP's medical deduction."
