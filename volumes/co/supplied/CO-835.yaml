id: CO-835
name: Health insurance premiums paid
identifier: health_insurance_premiums_paid
kind: supplied
type: money
scope: person-month
program: All
meaning: "The health insurance premiums the person pays for the month: Medicare, long-term care insurance and other health and hospitalization insurance. Each program decides which it allows (10 CCR 2505-10 §§ 8.100.7.Q.2.b and 8.100.7.V.3.b for Medicaid's patient payment; 7 CFR 273.9(d)(3) for SNAP's medical deduction)."
precision: "Medicaid reads it for the community spouse and dependent family members, whose premiums are added to the community spouse's minimum monthly needs under § 8.100.7.Q.2.b (ma_community_spouse_medical_needs, CO-3619). The institutionalized person's patient payment (ma_patient_payment, CO-658) deducts only the Medicare Part B premium (first two months) and Part D premium of § 8.100.7.V.3.b.ii.8, stated apart in medicare_part_b_premium_paid and medicare_part_d_premium_paid, which this total includes."
supplied_by: Eligibility Site's verification of premium payments (Medicare premium statements, insurance bills).
sources: [S1756, S87, S91]
tags: [ma, ltc, income]
rationale: "The phase-4 brief's interface fixes this identifier and directs creating it in this batch. ma_patient_payment (CO-658) needs the institutionalized person's own premiums as a deduction; this batch does not separately add the community spouse's premiums to ma_mmmna (CO-655), since § 8.100.7.Q.2 describes them as an additional amount 'approved' rather than part of the MMMNA formula itself. Same-word audit SW-34: the one statement of premiums, read by Medicaid's patient payment and, beside other medical expenses, by SNAP's medical deduction. Final verification F-3 and F-4 (2026-11-22): the patient payment deducted this total in every month, while § 8.100.7.V.3.b.ii.8 allows only Part B (the first two months, not under the Buy-In) and Part D; and the community spouse's premiums, which § 8.100.7.Q.2.b adds to her needs, were not read. The Part B and Part D premiums are now stated apart (CO-3602, CO-3603), and Medicaid reads this total for the community spouse."
