id: CO-4403
name: "Days out of the State in the calendar year"
identifier: days_out_of_state_in_calendar_year
kind: supplied
type: whole number
scope: person
program: All
meaning: "The number of days the person has spent outside Colorado in the calendar year of the determination date, through the determination date, consecutive or not, the days of a current absence included."
precision: "Adult Financial requires it where read (coverage pass 4 CA4-16, decision 4 of 2026-11-23: missing information is cannot determine unless the rule says otherwise): a client who has not left Colorado states 0; before, it was read as 0 when not stated."
supplied_by: "Applicant statement, as the county establishes it."
sources: [S3201]
tags: [cash, household]
rationale: "Coverage review F-1: 9 CCR 2503-5 3.520.64.E.3 (S3201) presumes non-residence for a client away \"more than one hundred eighty (180) days in any calendar year, even if that time has not been consecutive\"; temporarily_out_of_state_start_date (CO-3806) gives only the current absence."
