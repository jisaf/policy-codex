id: CO-4346
name: "Former farm property value"
identifier: former_farm_property_value
kind: supplied
type: money
scope: person
program: All
meaning: "The part of real_property_other_than_home_equity (CO-3393) in property that was essential to the person's self-employment in farming (land, machinery, equipment and supplies), which the person stopped on farming_self_employment_end_date (CO-4347)."
precision: "Part of real_property_other_than_home_equity, not added to it; equity value, as of the determination date. If not stated, SNAP reads it as 0."
supplied_by: "Applicant statement; farm records."
sources: [S3118]
tags: [snap, resources]
rationale: "Coverage review snap-financial CF-7 (matrix 4.410.E.4): farm property is exempt for one year after the member stops farming (S3118); real_property_other_than_home_equity counts it once it no longer produces income."
