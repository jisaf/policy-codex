id: CO-800
name: "SSI-method countable resources, individual"
identifier: ssi_countable_resources_individual
kind: supplied
type: money
scope: person
program: All
meaning: This person's own countable resources after the exclusions 20 CFR 416.1210 and 10 CCR 2505-10 8.100.5.M.2 describe, as an individual (not combined with a spouse's resources) - the figure 10 CCR 2505-10 8.100.5.M.1's $2,000 individual resource limit is compared against.
supplied_by: "The applicant's attested value of their resources, as the case record holds it, valued under the 20 CFR 416.1210 and 8.100.5.M.2 exclusions; it is the attested value until a resources verification element requires documents (ma_requires_verification_of_resources, CO-1405; a Medicare Savings Program applicant's non-liquid resources are taken on attestation, 42 CFR 435.952(e)(2)(i)), and then the county worker's determination from the account statements and property records (heavier-definitions audit H-15: the fact is the person's circumstance as stated; documents belong to the *_verification_document_received facts and the verification items, which ask for them only where a program's rule requires it)."
sources: [S301]
tags: [non_magi, resources]
rationale: "The case already states this fact for CO-01's p1 (1900), but no item in this volume carries it yet; the phase-4 brief's interface fixes this identifier and directs creating it in this batch. ma_ssi_countable_resources (CO-608) and ma_meets_ssi_resource_standard (CO-610) need it for a person not treated as part of a couple for SSI-related resource purposes. Vocabulary fix round (docs/reviews/vocabulary-reuse.md, C-2): renamed so the name says the figure is countable under the SSI method (20 CFR 416.1210), not under every program's rule. Adult Financial reads it on the stated assumption that 3.520.72's resources are the same figure (af_countable_resources, CO-947)."
