id: CO-1105
name: Is an inmate of a public institution
identifier: is_inmate_of_public_institution
kind: supplied
type: yes/no
scope: person-month
program: All
meaning: Whether, this month, the person is an inmate of a public institution (a correctional or juvenile-justice facility) within the meaning of 10 CCR 2505-3 § 120.1.C's CHP+ exclusion, outside the 90-days-before-release Reentry Demonstration Initiative Services the same section carves out.
precision: Distinct from snap_resides_in_institution_providing_meals (CO-007) and from is_patient_in_institution_for_mental_diseases (CO-1104).
supplied_by: Eligibility site's record of incarceration status (CBMS interface with corrections data).
sources: [S653]
tags: [chp, ma]
rationale: "OQ-58: no existing fact represents incarceration. chp_child_is_eligible (CO-705) and chp_prenatal_is_eligible (CO-706) need it for § 120.1.C."
