id: CO-1105
name: Is an inmate of a public institution
identifier: is_inmate_of_public_institution
kind: supplied
type: yes/no
scope: person-month
program: All
meaning: "Whether, this month, the person is an inmate of a public institution: held in a correctional or juvenile-justice facility operated by a city, county, state or federal government."
precision: "Plain incarceration. CHP+'s carve-out for the 90 days before release under the Reentry Demonstration Initiative is chp_is_in_reentry_period (CO-1749), read by the CHP+ rules; Adult Financial's 3.520.61.B inmate bar has no carve-out."
supplied_by: Eligibility site's record of incarceration status (CBMS interface with corrections data).
sources: [S653]
tags: [chp, ma]
rationale: "OQ-58: no existing fact represents incarceration. chp_child_is_eligible (CO-705) and chp_prenatal_is_eligible (CO-706) need it for § 120.1.C. Vocabulary fix round (docs/reviews/vocabulary-reuse.md, R-14): the meaning had built in the CHP+ reentry carve-out, so Adult Financial's inmate bar (af_meets_residency, CO-942) under-barred a person in that period."
