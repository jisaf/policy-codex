id: CO-887
name: Personal needs allowance, institutional (non-veteran)
identifier: ma_personal_needs_allowance_institutional
kind: supplied
type: money
scope: person
program: Medicaid
meaning: The base personal needs allowance deducted first from a Long-Term Care institution resident's income before computing patient payment, per 10 CCR 2505-10 § 8.100.7.V.3.d.i and 42 CFR 435.725(c)(1).
supplied_by: HCPF's published annual personal needs allowance figure (25.5-6-202(9)(b)(I) adjustment notice).
precision: "§ 8.100.7.V.3.d.i.2 (S361) states the base was $75 effective January 1, 2015 and 'will be adjusted annually at the same rate as the statewide average of the nursing facility per diem rate net of patient payment ... Each yearly adjustment will set a new base amount.' Because the base resets every year and no fetched document states the 2026 figure, this is a supplied fact under OQ-91, like csra_minimum_standard, ma_mmmna_standard and home_equity_limit, rather than a parameter frozen at the 2015 value - the phase-4 review's C-11 finding. The federal floor is $30/month for an individual (42 CFR 435.725(c)(1)(i)); Colorado's $75 base (and any indexed successor) exceeds it."
sources: [S361, S374]
open: [OQ-91]
tags: [ma, ltc, income]
rationale: "The previous item (CO-251, withdrawn) modeled this figure as a parameter pinned at the 2015 base ($75), but § 8.100.7.V.3.d.i.2's own text requires a new base amount every year and no fetched document states the 2026 figure - the same 'text states the formula/adjustment but not the current indexed value' shape as csra_maximum_standard (CO-828) and mmmna_cap (CO-830), which are already supplied facts under OQ-91. ma_patient_payment (CO-658) needs it."
