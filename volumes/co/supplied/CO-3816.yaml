id: CO-3816
name: "Savings account distributions received"
identifier: savings_account_distributions_received
kind: supplied
type: money
scope: person-month
program: All
meaning: "Money the person withdrew or received in the month as a distribution from a retirement savings account (an IRA, a 401(k) or another defined-contribution retirement account), a health savings account, an individual development account (IDA) or an educational savings account. A pension or annuity paid by a plan is pension_income, not this fact."
precision: "Part of the person's gross unearned income for the month as the unearned income facts state it (pension_income or the other unearned income facts), not added to it. If not stated, every program reads it as 0."
supplied_by: "Applicant statement, account statements."
sources: [S2606]
tags: [cash, income]
rationale: "Final cash review FC-2 and FC-3: Colorado Works' and Adult Financial's exclusion items (CO-2340 to CO-2343) summed a closed list of neutral receipt facts, so income the current exempt-income lists name could not be excluded and was counted. 9 CCR 2503-6 3.605.4.B.20-22 and B.25 (S2606) exempt individual development accounts, distributions from retirement savings and health care savings accounts, and educational savings accounts. The fact states the receipt, program-neutrally (convention rule 13); each program's exclusion item decides whether its list exempts it."
