id: CO-1104
name: Is a patient in an institution for mental diseases
identifier: is_patient_in_institution_for_mental_diseases
kind: supplied
type: yes/no
scope: person-month
program: All
meaning: "Whether, this month, the person is a patient in an institution for mental diseases: a hospital, nursing facility or other institution of more than 16 beds primarily engaged in providing diagnosis, treatment or care of persons with mental diseases (42 CFR 435.1010), the exclusion 10 CCR 2505-3 § 120.1.C states for CHP+ and the Medicaid IMD exclusion reads."
precision: "A nursing facility resident is not an IMD patient for this fact unless the facility is itself an IMD. The Old Age Pension Health Care Program's broader exclusion (tuberculosis or behavioral or mental health institutions) is ma_oap_is_patient_in_tb_or_mental_health_institution (CO-1748)."
supplied_by: Eligibility site's record of the person's living arrangement and facility type (CBMS).
sources: [S653, S659]
tags: [chp, ma, disability]
rationale: "OQ-58 recorded that snap_resides_in_institution_providing_meals means a long-term care admission, not an IMD stay, so neither CHP+ nor the OAP health care program could test this exclusion. chp_child_is_eligible (CO-705), chp_prenatal_is_eligible (CO-706) and ma_oap_health_care_status (CO-1156) need it. Vocabulary fix round (docs/reviews/vocabulary-reuse.md, R-14): the meaning stated two definitions; the OAP Health Care Program's is now its own fact."
