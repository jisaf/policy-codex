id: CO-875
name: LEAP income limit, 60 percent state median income, monthly
identifier: leap_income_limit_monthly
kind: supplied
type: money
scope: person
program: LEAP
meaning: The monthly income ceiling for this person's LEAP household size - 60% of the HHS state median income figure for federal fiscal year 2023 (or the current year's adjusted figure), per 9 CCR 2503-7 3.752.22.D.
supplied_by: HHS LIHEAP Information Memorandum state median income table for the household size, as loaded in the LEAP system/CBMS for the current program year.
sources: [S491]
open: [OQ-122]
tags: [income, household]
rationale: "3.752.22.D sets the test at 60% of a state median income figure published in a 45 C.F.R. 96.85 table and a LIHEAP Information Memorandum, neither of which is in this volume's document library. Modeled as a supplied fact carrying the already-computed monthly dollar ceiling for the household's size, the same treatment phase 2 gave the SNAP standard utility allowance, with an OQ recording the SMI table to replace it with once fetched. leap_income_within_limit (CO-1003) reads it."
