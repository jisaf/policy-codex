id: CO-4606
name: "Real property co-owned with a person who lives in it"
identifier: real_property_co_owned_with_resident_value
kind: supplied
type: money
scope: person
program: All
meaning: "Of real_property_other_than_home_equity (CO-3393), the equity value of the person's share of real property the person owns jointly with another person who lives in it as that person's principal place of residence."
precision: "Part of real_property_other_than_home_equity, not added to it. As of the determination date. If not stated, Medicaid reads the whole of real_property_other_than_home_equity as this property when its finding (ma_excess_real_property_is_for_sale or ma_claims_co_owner_hardship_for_real_property) is true, and every other program reads it as 0."
supplied_by: "The deed or title, and the co-owner's statement."
sources: [S1515]
tags: [resources]
rationale: "Coverage review NM-2: ma_claims_co_owner_hardship_for_real_property (CO-2244) states the hardship allegation of 10 CCR 2505-10 § 8.100.5.M.3.h, but no fact stated the value of the co-owned property, so no resource item could leave it out."
nearest: [CO-3393, CO-2244]
