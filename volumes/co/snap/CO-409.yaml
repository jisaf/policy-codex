id: CO-409
name: "SNAP: is a single parent enrolled full time exempt as a student"
identifier: snap_is_single_parent_full_time_student_exemption
kind: derived
type: yes/no
scope: person-month
program: SNAP
meaning: "The student is enrolled full time in an institution of higher education, has no spouse in the household, and is either a single parent responsible for the care of a dependent child under snap_student_older_child_age or, where no natural, adoptive or stepparent of such a child is in the household, has parental control of the child (10 CCR 2506-1 4.306.1.D; 7 CFR 273.5(b)(10)(i)-(ii))."
precision: "Final verification F-5: the non-parent arm reads parental control as a has_primary_responsibility_for or legal_guardian edge to the child (the edges snap_is_under_parental_control_of_household_member, CO-018, reads), and no member of the household is the child's parent or stepparent; 4.306.1.D's last sentence does not repeat the no-parent condition, which 273.5(b)(10)(ii) (S2507) states and which binds the exemption the State applies. Single parent is read as the text states it, by counting parents: no other parent of this person's children is in the SNAP household (P43 with child: the persons who share a child with this person), and this person has no spouse in the household (a spouse who is not the child's parent is a stepparent, whom 4.306.1.D counts). OQ-34 resolved. The count is per person rather than per child: a student with two children under 12, one of whose other parent is in the household, is not treated as a single parent of the other. Coverage pass 4 for SNAP S4-11 (OQ-1263 resolved): the child's age is taken in the month evaluated, since prospective budgeting reads \"anticipated income and circumstances during the issuance month\" (10 CCR 2506-1 4.402.1.A, S4734), and a child is under 12 when under it on the first day of the month (the age on the first day of the month; OQ-1262). Before, the age on the determination date in every month."
derived: [all, is_enrolled_higher_education_full_time, [not, [exists, snap_household_members, [rel, [spouse, holds_out_as_spouse_with], [P]]]], [any, [all, [exists, snap_household_members, [all, [rel, [parent], [P]], ["<", [years_between, [of, [P], date_of_birth], [first_day, [month]]], snap_student_older_child_age]]], [not, [exists, snap_household_members, [in_group, [P], [shared_relative, child]]]]], [exists, snap_household_members, [all, [rel, [has_primary_responsibility_for, legal_guardian], [P]], ["<", [years_between, [of, [P], date_of_birth], [first_day, [month]]], snap_student_older_child_age], [not, [of, [P], snap_has_parent_in_household]]]]]]
statute_override: "Federal regulation overrides 10 CCR 2506-1 4.306.1.D (its last sentence), which exempts a full-time student with parental control of a child under 12 without a condition on the child's parents: 7 CFR 273.5(b)(10)(ii) allows the exemption to a non-parent only where no natural, adoptive or stepparent of the child is in the household, so a full-time student who has parental control of a child whose parent lives in the household is not exempt on that ground."
sources: [S133, S135, S2507, S4734]
implemented: engine
tags: [student, household, age]
open: [OQ-1262]
rationale: "7 U.S.C. 2015(e)(8) and 10 CCR 2506-1 4.306.1.D (S133, S135) state a distinct student exemption for full-time enrollment plus single-parent status, separate from the part-time-enrollment dependent-care exemptions in snap_has_care_responsibility_for_student_exemption (CO-408), because it requires full-time enrollment and does not condition on child care availability. Same-word audit SW-6: SNAP's spouses include persons living together who are free to marry and represent themselves as spouses (7 CFR 273.1(b)(1)(i), S4 B), so the holds_out_as_spouse_with role is read beside the legal spouse."
