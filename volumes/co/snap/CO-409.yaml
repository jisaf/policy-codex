id: CO-409
name: "SNAP: is a single parent enrolled full time exempt as a student"
identifier: snap_is_single_parent_full_time_student_exemption
kind: derived
type: yes/no
scope: person
program: SNAP
meaning: The student is enrolled full time in an institution of higher education and is a single parent responsible for the care of a dependent child under snap_student_older_child_age (12).
precision: Single parent is modeled as having no spouse relationship recorded, because this volume's relationships do not let a rule count how many parents of the child are in the household directly (see OQ-34).
assumption: Approximates 7 U.S.C. 2015(e)(8) and 10 CCR 2506-1 4.306.1.D's "only one ... parent ... in the same SNAP household as the child" as "this person has no spouse in the household," rather than counting other parents of the specific child.
derived: [all, is_enrolled_higher_education_full_time, [exists, snap_household_members, [all, [rel, [parent], [P]], ["<", [of, [P], snap_age], snap_student_older_child_age]]], [not, [exists, snap_household_members, [rel, [spouse], [P]]]]]
sources: [S133, S135]
open: [OQ-34]
implemented: engine
tags: [student, household, age]
rationale: 7 U.S.C. 2015(e)(8) and 10 CCR 2506-1 4.306.1.D (S133, S135) state a distinct student exemption for full-time enrollment plus single-parent status, separate from the part-time-enrollment dependent-care exemptions in snap_has_care_responsibility_for_student_exemption (CO-408), because it requires full-time enrollment and does not condition on child care availability.
tests:
  - {id: CO-409-T1, as_of: "2026-10-01", given: {date_of_birth: "1990-01-01", in_medical_institution: false, is_enrolled_higher_education_full_time: true}, others: {p2: {date_of_birth: "2018-01-01", in_medical_institution: false}}, relationships: [[parent, p1, p2]], expect: true}
  - {id: CO-409-T2, as_of: "2026-10-01", given: {date_of_birth: "1990-01-01", in_medical_institution: false, is_enrolled_higher_education_full_time: false}, others: {p2: {date_of_birth: "2018-01-01", in_medical_institution: false}}, relationships: [[parent, p1, p2]], expect: false}
  - {id: CO-409-T3, as_of: "2026-10-01", given: {date_of_birth: "1990-01-01", in_medical_institution: false, is_enrolled_higher_education_full_time: true}, others: {p2: {date_of_birth: "2018-01-01", in_medical_institution: false}, p3: {date_of_birth: "1988-01-01", in_medical_institution: false}}, relationships: [[parent, p1, p2], [spouse, p1, p3]], expect: false}
