id: CO-409
name: "SNAP: is a single parent enrolled full time exempt as a student"
identifier: snap_is_single_parent_full_time_student_exemption
kind: derived
type: yes/no
scope: person
program: SNAP
meaning: The student is enrolled full time in an institution of higher education and is a single parent responsible for the care of a dependent child under snap_student_older_child_age (12).
precision: "Single parent is read as the text states it, by counting parents: no other parent of this person's children is in the SNAP household (P43 with child: the persons who share a child with this person), and this person has no spouse in the household (a spouse who is not the child's parent is a stepparent, whom 4.306.1.D counts). OQ-34 resolved. The count is per person rather than per child: a student with two children under 12, one of whose other parent is in the household, is not treated as a single parent of the other."
derived: [all, is_enrolled_higher_education_full_time, [exists, snap_household_members, [all, [rel, [parent], [P]], ["<", [of, [P], age], snap_student_older_child_age]]], [not, [exists, snap_household_members, [in_group, [P], [shared_relative, child]]]], [not, [exists, snap_household_members, [rel, [spouse], [P]]]]]
sources: [S133, S135]
implemented: engine
tags: [student, household, age]
rationale: 7 U.S.C. 2015(e)(8) and 10 CCR 2506-1 4.306.1.D (S133, S135) state a distinct student exemption for full-time enrollment plus single-parent status, separate from the part-time-enrollment dependent-care exemptions in snap_has_care_responsibility_for_student_exemption (CO-408), because it requires full-time enrollment and does not condition on child care availability.
tests:
  - {id: CO-409-T1, as_of: "2026-10-01", given: {date_of_birth: "1990-01-01", snap_resides_in_institution_providing_meals: false, is_enrolled_higher_education_full_time: true}, others: {p2: {date_of_birth: "2018-01-01", snap_resides_in_institution_providing_meals: false}}, relationships: [[parent, p1, p2]], expect: true}
  - {id: CO-409-T2, as_of: "2026-10-01", given: {date_of_birth: "1990-01-01", snap_resides_in_institution_providing_meals: false, is_enrolled_higher_education_full_time: false}, others: {p2: {date_of_birth: "2018-01-01", snap_resides_in_institution_providing_meals: false}}, relationships: [[parent, p1, p2]], expect: false}
  - {id: CO-409-T3, as_of: "2026-10-01", given: {date_of_birth: "1990-01-01", snap_resides_in_institution_providing_meals: false, is_enrolled_higher_education_full_time: true}, others: {p2: {date_of_birth: "2018-01-01", snap_resides_in_institution_providing_meals: false}, p3: {date_of_birth: "1988-01-01", snap_resides_in_institution_providing_meals: false}}, relationships: [[parent, p1, p2], [spouse, p1, p3]], expect: false}
  - {id: CO-409-T4, title: "OQ-34: the child's other parent is in the household though not this person's spouse - not a single parent", as_of: "2026-10-01", given: {date_of_birth: "1990-01-01", snap_resides_in_institution_providing_meals: false, is_enrolled_higher_education_full_time: true}, others: {p2: {date_of_birth: "2018-01-01", snap_resides_in_institution_providing_meals: false}, p3: {date_of_birth: "1988-01-01", snap_resides_in_institution_providing_meals: false}}, relationships: [[parent, p1, p2], [parent, p3, p2]], expect: false}
