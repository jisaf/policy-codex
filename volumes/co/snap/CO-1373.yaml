id: CO-1373
name: "SNAP: requires verification of immigration status"
identifier: snap_requires_verification_of_immigration_status
kind: derived
type: yes/no
scope: person-month
program: SNAP
meaning: "Whether the person's declared immigration status must be verified for SNAP, through SAVE: every household member who declares a lawful status."
precision: An undocumented member who does not claim an eligible status participates as an ineligible member and no documentation is pursued (4.505.6.J, S902).
derived: [all, snap_is_household_member, claims_lawful_immigration_status]
sources: [S802, S817, S828]
implemented: engine
tags: [verification, snap, immigration]
rationale: No existing item states this verification requirement; the phase-9 chapter needs one requirement item per element so the household's pending count and status can be derived.
tests:
  - {id: CO-1373-T1, month: "2026-10", as_of: "2026-10-01", given: {in_medical_institution: false, citizenship_status: lawful_permanent_resident}, expect: true}
  - {id: CO-1373-T2, month: "2026-10", as_of: "2026-10-01", given: {in_medical_institution: false, citizenship_status: undocumented}, expect: false}
