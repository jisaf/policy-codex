id: CO-4250
name: "SNAP: lives in the same home as a child under the ABAWD dependent-child age"
identifier: snap_lives_with_child_under_abawd_dependent_child_age
kind: derived
type: yes/no
scope: person-month
program: SNAP
meaning: "Someone who lives in the same home as the person (lives_with, CO-1925) is under snap_abawd_dependent_child_age (14) on the first day of the month, whether or not that child is a member of the person's SNAP household or is eligible: the ABAWD exception for an individual \"Residing in the same physical household with an individual who is under the age of eighteen (18). The minor individual does not have to be included in the same SNAP household\" (10 CCR 2506-1 4.311.A.4; 7 CFR 273.24(c)(4)), with the age the amended statute sets."
precision: "Read from lives_with (one home, from dwelling_id). Where a case states no dwelling_id the person's SNAP household (snap_household_members, CO-305) stands in, as CO-305 reads an edge as living together when no home is stated (convention rule 17). The person need not be the child's parent or caretaker: that is the separate (c)(3) parent exception, snap_has_responsibility_for_abawd_dependent_child (CO-413). Age is computed for the first day of the month in context, as CO-412 and CO-413 do. Coverage pass 2 N2-P2-1: the physical-household reading is Colorado's (4.311.A.4); the statute and 7 CFR 273.24(c)(4) speak of a member of the SNAP household. Which governs is OQ-835 (needs Legal); the assumption is Colorado's reading. Three-pattern sweep D-1 (docs/reviews/pattern-sweep-snap-ce.md): lives_with (CO-1925) is read as stated, required where read: no text on file says that persons related on the application live together unless it says otherwise (7 CFR 273.1(a): a household is individuals who live together and customarily purchase and prepare meals together, S1), so a stated relationship is no longer read as living together where no dwelling_id is stated (decision 4; docs/conventions.md rule 17, as MAGI's readers since coverage pass 6, C6-10); a case with persons related across the edge states dwelling_id for each of them. Before, an unstated home read the SNAP household (snap_household_members) in its place."
statute_override: "Federal law overrides 10 CCR 2506-1 4.311.A.4, which still names a child under eighteen: Pub. L. 119-21 sec. 10102 (July 4, 2025) narrowed the exception for an individual residing with a child to a child under 14 (7 U.S.C. 2015(o)(3)(C)); FNS's proposed 7 CFR 273.24(c)(4) (91 FR 72439) reads \"residing in a household where a household member is under age 14\". No CDHS implementing communication was available to this volume (OQ-533)."
derived: [exists, lives_with, ["<", [years_between, [of, [P], date_of_birth], [first_day, [month]]], snap_abawd_dependent_child_age]]
sources: [S749, S3050, S127, S128]
effective: {from: "2025-07-04", to: present}
implemented: engine
tags: [abawd, age, household, legal]
open: [OQ-533, OQ-835]
nearest: [CO-413]
rationale: "Coverage review C-1 (docs/reviews/coverage-snap-nonfinancial.md): 7 CFR 273.24 states two separate exceptions, (c)(3) for a parent of a member under the age and (c)(4) for anyone residing in a household with a member under it (S3050), and Colorado's 4.311.A.4 (S749) states the second for the physical household. CO-413 carries only the parent or caretaker, so a 58-year-old brother living with his sister's 10-year-old was held to the time limit. No existing item tests co-residence with a child; snap_is_exempt_from_abawd_time_limit (CO-414) reads this one."
