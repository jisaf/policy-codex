id: CO-341
name: "SNAP: eligibility category"
identifier: snap_eligibility_category
kind: derived
type: one of
options: [basic_categorical, expanded_categorical, standard]
scope: person
program: SNAP
meaning: Which of Colorado's three categories of eligibility (10 CCR 2506-1 4.206,A) this person's SNAP household is determined under - Basic Categorical Eligibility, Expanded Categorical Eligibility, or Standard Eligibility - tested in that order, matching 4.206,C,1,d and C,2,d's "ineligible under BCE/ECE, then determined under the next category" structure.
precision: "Final verification F-14 (OQ-640): the tests run BCE first, the order 4.206.C.1.d and C.2.d state; the 4.000.1 definition of BCE (S2518) would put ECE first for a household that meets both, which changes only which verification relief applies. Final verification pass 2 N-1: a household certified for the first time after losing eligibility for substantial lottery or gambling winnings is considered under Standard Eligibility (4.206.E, S2950; snap_is_first_certification_after_lottery_disqualification, CO-4153, read as false when not stated), so it meets the resource and income tests 7 U.S.C. 2015(s)(2) requires before it regains eligibility."
derived: [case, [[otherwise, snap_is_first_certification_after_lottery_disqualification, false], standard], [snap_meets_bce_eligibility, basic_categorical], [snap_meets_ece_eligibility, expanded_categorical], [else, standard]]
sources: [S47, S48, S2518, S2950, S2952]
implemented: engine
tags: [income, state_election]
open: [OQ-640]
rationale: 10 CCR 2506-1 4.206,A and C,1,d/C,2,d (S47, S48) require every household to be assigned exactly one of BCE, ECE, or SE, tested in that order; no existing item states the single enumerated outcome snap_is_categorically_eligible and later batches' income/resource/deduction rules need to branch on.
tests:
  - {id: CO-341-T1, as_of: "2026-10-01", given: {snap_resides_in_institution_providing_meals: false, receives_ssi: true, receives_tanf_cash: false, receives_disability_based_general_assistance: false, receives_state_cash_assistance: false, snap_is_serving_ipv_disqualification: false, snap_is_disqualified_drug_felony: false, snap_has_drug_felony_involving_snap_benefits: false}, others: {}, relationships: [], expect: basic_categorical}
  - {id: CO-341-T2, month: "2026-10", as_of: "2026-10-01", given: {snap_is_ineligible_abawd: false, state_of_residence: CO, is_enrolled_higher_education_half_time: false, snap_resides_in_institution_providing_meals: false, receives_ssi: false, receives_tanf_cash: false, receives_disability_based_general_assistance: false, receives_state_cash_assistance: false, snap_is_serving_ipv_disqualification: false, snap_is_disqualified_drug_felony: false, snap_has_drug_felony_involving_snap_benefits: false, immigration_status: us_citizen, wages_gross: 1000, child_support_paid_legally_obligated: 0, self_employment_gross_receipts: 0, self_employment_net_earnings_for_tax: 0, is_fleeing_felon: false, is_probation_or_parole_violator: false, snap_is_disqualified_for_work_requirement_noncompliance: false, receipts: []}, others: {}, relationships: [], expect: expanded_categorical}
  - {id: CO-341-T3, month: "2026-10", as_of: "2026-10-01", given: {snap_is_ineligible_abawd: false, state_of_residence: CO, is_enrolled_higher_education_half_time: false, snap_resides_in_institution_providing_meals: false, receives_ssi: false, receives_tanf_cash: false, receives_disability_based_general_assistance: false, receives_state_cash_assistance: false, snap_is_serving_ipv_disqualification: false, snap_is_disqualified_drug_felony: false, snap_has_drug_felony_involving_snap_benefits: false, immigration_status: us_citizen, wages_gross: 4000, child_support_paid_legally_obligated: 0, self_employment_gross_receipts: 0, self_employment_net_earnings_for_tax: 0, is_fleeing_felon: false, is_probation_or_parole_violator: false, snap_is_disqualified_for_work_requirement_noncompliance: false, receipts: []}, others: {}, relationships: [], expect: standard}
