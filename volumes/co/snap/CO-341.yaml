id: CO-341
name: "SNAP: eligibility category"
identifier: snap_eligibility_category
kind: derived
type: one of
options: [basic_categorical, expanded_categorical, standard]
scope: person
program: SNAP
meaning: Which of Colorado's three categories of eligibility (10 CCR 2506-1 4.206,A) this person's SNAP household is determined under - Basic Categorical Eligibility, Expanded Categorical Eligibility, or Standard Eligibility - tested in that order, matching 4.206,C,1,d and C,2,d's "ineligible under BCE/ECE, then determined under the next category" structure.
derived: [case, [snap_meets_bce_eligibility, "basic_categorical"], [snap_meets_ece_eligibility, "expanded_categorical"], [else, "standard"]]
sources: [S47, S48]
implemented: engine
tags: [income, state_election]
rationale: 10 CCR 2506-1 4.206,A and C,1,d/C,2,d (S47, S48) require every household to be assigned exactly one of BCE, ECE, or SE, tested in that order; no existing item states the single enumerated outcome snap_is_categorically_eligible and later batches' income/resource/deduction rules need to branch on.
tests:
  - {id: CO-341-T1, as_of: "2026-10-01", given: {in_medical_institution: false, receives_ssi: true, receives_tanf_cash: false, receives_general_assistance: false, is_disqualified_for_intentional_program_violation: false, is_disqualified_drug_felony: false}, others: {}, relationships: [], expect: basic_categorical}
  - {id: CO-341-T2, as_of: "2026-10-01", month: "2026-10", given: {is_enrolled_higher_education_half_time: false, in_medical_institution: false, receives_ssi: false, receives_tanf_cash: false, receives_general_assistance: false, is_disqualified_for_intentional_program_violation: false, is_disqualified_drug_felony: false, citizenship_status: citizen, earned_income: 1000, self_employment_net_income: 0, social_security_income: 0, pension_income: 0, unemployment_income: 0, child_support_received: 0, cash_assistance_income: 0, other_unearned_income: 0, is_fleeing_felon_or_probation_violator: false, is_disqualified_for_work_requirement_noncompliance: false}, others: {}, relationships: [], expect: expanded_categorical}
  - {id: CO-341-T3, as_of: "2026-10-01", month: "2026-10", given: {is_enrolled_higher_education_half_time: false, in_medical_institution: false, receives_ssi: false, receives_tanf_cash: false, receives_general_assistance: false, is_disqualified_for_intentional_program_violation: false, is_disqualified_drug_felony: false, citizenship_status: citizen, earned_income: 4000, self_employment_net_income: 0, social_security_income: 0, pension_income: 0, unemployment_income: 0, child_support_received: 0, cash_assistance_income: 0, other_unearned_income: 0, is_fleeing_felon_or_probation_violator: false, is_disqualified_for_work_requirement_noncompliance: false}, others: {}, relationships: [], expect: standard}
