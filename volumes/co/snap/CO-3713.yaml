id: CO-3713
name: "SNAP: is exempt from the non-citizen waiting period other than by a military connection"
identifier: snap_is_exempt_from_waiting_period_other_than_military
kind: derived
type: yes/no
scope: person
program: SNAP
meaning: "A lawful permanent resident is exempt from the five-year waiting period for a reason other than a military connection: under 18; blind or a person with a disability receiving benefits for it; born on or before August 22, 1931 and in qualified status on August 22, 1996; admitted for permanent residence after holding, or under, a status the five-year bar never reached - refugee, asylee, deportation withheld, Cuban or Haitian entrant, Amerasian immigrant (8 U.S.C. 1612(a)(2)(A), 1613(b)(1); 7 CFR 273.4(a)(6)(ii)(B)-(F), (iv)); an American Indian born in Canada or a member of an Indian tribe (1612(a)(2)(G); 273.4(a)(3)); or a Hmong or Highland Lao veteran, or the veteran's spouse, unremarried surviving spouse or dependent child (1612(a)(2)(K); 273.4(a)(4))."
precision: "The earlier status is status_before_lpr_adjustment (CO-2700), read as none when not stated. 1612(a)(2)(A) lifts the bar for seven years from admission or grant of the earlier status and (L) lifts it after five years in qualified status, which the earlier status counts toward, so the two together leave no gap: \"Each category of eligible alien status stands alone ... Subsequent adjustment to a more limited status does not override eligibility based on an earlier less rigorous status\" (273.4(a)(6)(iv)); no time limit is modeled. The Indian and Hmong facts (CO-2701, CO-2702, CO-3715) are read as false when not stated; a spouse in the case who is the veteran is read from the spouse edge, and the spouse arm is false when the person's relationships are not stated. \"Lawfully residing\" for the Hmong exception is met by the lawful permanent residence 7 U.S.C. 2015(f) already requires. The other arms are as snap_is_exempt_from_immigrant_waiting_period (CO-306) described them before this item took them over."
derived: [any, ["<", age, snap_immigrant_child_exemption_age], snap_is_disabled_member, [all, ["<=", date_of_birth, snap_elderly_non_citizen_birth_date_cutoff], ["<=", qualified_status_date, qualified_non_citizen_entry_cutoff_date]], [in, [otherwise, status_before_lpr_adjustment, none], [refugee, asylee, deportation_withheld, cuban_haitian_entrant, amerasian_immigrant]], [otherwise, is_american_indian_born_in_canada_or_tribal_member, false], [otherwise, is_hmong_or_highland_lao_veteran, false], [otherwise, is_spouse_or_dependent_child_of_hmong_or_highland_lao_veteran, false], [otherwise, [exists_related, [spouse], [otherwise, [of, [P], is_hmong_or_highland_lao_veteran], false]], false]]
sources: [S24, S14, S15, S1305, S1306, S2505, S2506, S1150]
implemented: engine
tags: [immigration, legal]
rationale: "Final verification F-3 (docs/reviews/final-snap.md): the exceptions CO-306 read were under 18, disability, military, and the 1931 elderly arm, so a refugee or asylee who had adjusted to permanent residence, an LPR Indian born in Canada or tribal member, and a Hmong veteran's family were ineligible for the first five years, although 8 U.S.C. 1612(a)(2), which Pub. L. 119-21 did not amend, excepts each of them. The arms other than the military connection are kept apart so that the military connection is verified only where eligibility rests on it (snap_requires_verification_of_military_connection, CO-3734; final verification V-4)."
tests:
  - {id: CO-3713-T1, title: "Under 18", as_of: "2026-10-01", given: {date_of_birth: "2015-01-01", qualified_status_date: "2024-01-01"}, expect: true}
  - {id: CO-3713-T2, title: "F-3: a former refugee admitted in 2023 who adjusted to permanent residence in 2024", as_of: "2026-10-01", given: {date_of_birth: "1985-01-22", qualified_status_date: "2023-05-01", snap_is_disabled_member: false, status_before_lpr_adjustment: refugee}, expect: true}
  - {id: CO-3713-T3, title: "F-3: an American Indian born in Canada", as_of: "2026-10-01", given: {date_of_birth: "1985-01-22", qualified_status_date: "2024-05-01", snap_is_disabled_member: false, is_american_indian_born_in_canada_or_tribal_member: true}, expect: true}
  - {id: CO-3713-T4, title: "F-3: the wife of a Hmong veteran who is in the case", as_of: "2026-10-01", given: {date_of_birth: "1960-01-22", qualified_status_date: "2024-05-01", snap_is_disabled_member: false}, others: {p2: {is_hmong_or_highland_lao_veteran: true}}, relationships: [[spouse, p1, p2]], expect: true}
