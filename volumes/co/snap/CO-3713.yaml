id: CO-3713
name: "SNAP: is exempt from the non-citizen waiting period other than by a military connection"
identifier: snap_is_exempt_from_waiting_period_other_than_military
kind: derived
type: yes/no
scope: person-month
program: SNAP
meaning: "A lawful permanent resident is exempt from the five-year waiting period for a reason other than a military connection: under 18; blind or a person with a disability receiving benefits for it; born on or before August 22, 1931 and in qualified status on August 22, 1996; admitted for permanent residence after holding, or under, a status the five-year bar never reached - refugee, asylee, deportation withheld, Cuban or Haitian entrant, Amerasian immigrant (8 U.S.C. 1612(a)(2)(A), 1613(b)(1); 7 CFR 273.4(a)(6)(ii)(B)-(F), (iv)); an American Indian born in Canada or a member of an Indian tribe (1612(a)(2)(G); 273.4(a)(3)); or a Hmong or Highland Lao veteran, or the veteran's spouse, unremarried surviving spouse or dependent child (1612(a)(2)(K); 273.4(a)(4))."
precision: "The earlier status is status_before_lpr_adjustment (CO-2700), read as none when not stated. 1612(a)(2)(A) lifts the bar for seven years from admission or grant of the earlier status and (L) lifts it after five years in qualified status, which the earlier status counts toward, so the two together leave no gap: \"Each category of eligible alien status stands alone ... Subsequent adjustment to a more limited status does not override eligibility based on an earlier less rigorous status\" (273.4(a)(6)(iv)); no time limit is modeled. The Indian and Hmong facts (CO-2701, CO-2702, CO-3715) are read as false when not stated; a spouse in the case who is the veteran is read from the spouse edge, and the spouse arm is false when the person's relationships are not stated. \"Lawfully residing\" for the Hmong exception is met by the lawful permanent residence 7 U.S.C. 2015(f) already requires. The other arms are as snap_is_exempt_from_immigrant_waiting_period (CO-306) described them before this item took them over. Coverage pass 4 S4-14 (decision 4 of 2026-11-23): status_before_lpr_adjustment is read with no default where this rule reads it (only for a lawful permanent resident none of the earlier exemptions reaches; the exemption turns on the status held before adjustment, and no rule gives one); before, it was read as none when not stated. Coverage pass 4 for SNAP S4-11 (OQ-1263 resolved): the under-18 exception is read in the month evaluated, since prospective budgeting reads \"anticipated income and circumstances during the issuance month\" (10 CCR 2506-1 4.402.1.A, S4734), and met when the person is under 18 on the first day of the month (the age on the first day of the month; OQ-1262). Before, the age on the determination date in every month."
