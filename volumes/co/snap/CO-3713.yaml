  - {id: CO-3713-T6, title: "An adult admitted directly as a permanent resident in 2024, none of the exceptions", as_of: "2026-10-01", given: {date_of_birth: "1985-01-22", qualified_status_date: "2024-05-01", snap_is_disabled_member: false}, relationships: [], expect: false}
