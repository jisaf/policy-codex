rationale: "Final verification F-3 (docs/reviews/final-snap.md): the exceptions CO-306 read were under 18, disability, military, and the 1931 elderly arm, so a refugee or asylee who had adjusted to permanent residence, an LPR Indian born in Canada or tribal member, and a Hmong veteran's family were ineligible for the first five years, although 8 U.S.C. 1612(a)(2), which Pub. L. 119-21 did not amend, excepts each of them. The arms other than the military connection are kept apart so that the military connection is verified only where eligibility rests on it (snap_requires_verification_of_military_connection, CO-3734; final verification V-4)."
