id: CO-2301
name: "SNAP: counted dependent care expense of a member"
identifier: snap_counted_dependent_care_expense_of_member
kind: derived
type: money
scope: person-month
program: SNAP
meaning: "The part of the dependent care expense billed to or paid by this household member (dependent_care_expense) that counts toward the household's dependent care deduction: all of it for an eligible member and for a member disqualified for IPV or fraud, a work-requirement sanction (a voluntary quit included) or as a fleeing felon or probation or parole violator; for a member disqualified as an ineligible non-citizen, the expense divided equally among every household member, the disqualified member included, less the disqualified member's own share; nothing for an ineligible student or any other ineligible member."
precision: "Same arms and the same n as snap_counted_shelter_cost_of_member (CO-2300). Unknown when this member's dependent_care_expense is unstated."
derived: [case, [[not, snap_is_ineligible_member], dependent_care_expense], [snap_is_disqualified_member_counted_in_full, dependent_care_expense], [snap_is_ineligible_member_prorated, ["*", dependent_care_expense, ["/", ["-", [count, snap_household_members], 1], [count, snap_household_members]]]], [else, 0]]
sources: [S1601, S1602, S1603]
nearest: [CO-2300, CO-333]
implemented: engine
tags: [snap, income]
rationale: "OQ-28: 4.407.4.A (S1601) allows dependent care \"as billed to a household member or as paid by or billed to a person disqualified for being an ineligible non-citizen or failure to provide or apply for a SSN\", divided equally among all members with the disqualified member's share left out, and in full for IPV or fraud; snap_dependent_care_deduction (CO-374) summed every member's expense in full."
tests:
  - {id: CO-2301-T1, as_of: "2026-10-01", month: "2026-10", given: {dependent_care_expense: 300, snap_is_ineligible_member: false}, expect: 300}
  - {id: CO-2301-T2, title: "4.407.4.A - billed to an ineligible non-citizen in a household of three, two thirds count", as_of: "2026-10-01", month: "2026-10", given: {dependent_care_expense: 300, snap_is_ineligible_member: true, snap_is_disqualified_member_counted_in_full: false, snap_is_ineligible_member_prorated: true, snap_household_members: [p1, p2, p3]}, expect: 200}
  - {id: CO-2301-T3, title: "Billed to a member disqualified for IPV - in its entirety", as_of: "2026-10-01", month: "2026-10", given: {dependent_care_expense: 300, snap_is_ineligible_member: true, snap_is_disqualified_member_counted_in_full: true, snap_household_members: [p1, p2, p3]}, expect: 300}
  - {id: CO-2301-T4, title: "Paid by an ineligible student - not the household's", as_of: "2026-10-01", month: "2026-10", given: {dependent_care_expense: 300, snap_is_ineligible_member: true, snap_is_disqualified_member_counted_in_full: false, snap_is_ineligible_member_prorated: false, snap_household_members: [p1, p2, p3]}, expect: 0}
