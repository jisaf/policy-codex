id: CO-2301
name: "SNAP: counted dependent care expense of a member"
identifier: snap_counted_dependent_care_expense_of_member
kind: derived
type: money
scope: person-month
program: SNAP
meaning: "The part of the dependent care expense billed to or paid by this household member (dependent_care_expense) that counts toward the household's dependent care deduction: all of it for an eligible member and for a member disqualified for IPV or fraud, a work-requirement sanction (a voluntary quit included) or as a fleeing felon or probation or parole violator; for a member whose income is prorated (an ineligible non-citizen, an SSN refusal, an ABAWD at the time limit), the expense divided equally among every household member, the ineligible members included, less the shares of the members whose income is prorated (7 CFR 273.11(c)(2)(iii); snap_prorated_member_share_counted_rate, CO-7250); nothing for an ineligible student or any other ineligible member."
precision: "Same arms and the same n as snap_counted_shelter_cost_of_member (CO-2300). Unknown when this member's dependent_care_expense is unstated. Engineering follow-up 5: a prorated member with no household (snap_household_members empty, as for a person who is not a household member) has nothing counted to any household, so the share is 0 rather than a division by zero. Final verification F-10 (V-5): once the expense verification period has ended (snap_expense_verification_period_has_ended, CO-3739) with this member's dependent care expense still required to be verified and unverified (snap_dependent_care_verification_is_pending, CO-1614), nothing counts: 4.502.A.3 (S818) and 7 CFR 273.2(f)(3)(ii) (S812) determine eligibility and benefit \"without providing a deduction ... for the unverified expense\". Final verification F-6: n counts the members other than an ineligible student (snap_household_members_other_than_ineligible_students, CO-3714), whom 4.411.2.C (S2508) treats as a non-household member not considered in the allotment. Coverage pass 6 for SNAP, C6-1 (docs/reviews/coverage6-snap.md): with two or more prorated members in the household, every prorated member's share is left out, not only this member's own: the fraction counted is snap_prorated_member_share_counted_rate (CO-7250), (n - k) / n with k the prorated members, as 7 CFR 273.11(c)(2)(ii)-(iii) (S4970) says (\"All but the ineligible members' share is counted\"). Before, (n - 1) / n was counted whatever k was."
derived: [case, [[all, snap_dependent_care_verification_is_pending, snap_expense_verification_period_has_ended], 0], [[not, snap_is_ineligible_member], dependent_care_expense], [snap_is_disqualified_member_counted_in_full, dependent_care_expense], [snap_is_ineligible_member_prorated, [case, [["=", snap_prorated_member_share_counted_rate, 0], 0], [else, ["*", dependent_care_expense, snap_prorated_member_share_counted_rate]]]], [else, 0]]
sources: [S818, S812, S1601, S1602, S1603, S4970]
nearest: [CO-2300, CO-333]
implemented: engine
tags: [snap, income]
rationale: "OQ-28: 4.407.4.A (S1601) allows dependent care \"as billed to a household member or as paid by or billed to a person disqualified for being an ineligible non-citizen or failure to provide or apply for a SSN\", divided equally among all members with the disqualified member's share left out, and in full for IPV or fraud; snap_dependent_care_deduction (CO-374) summed every member's expense in full."
tests:
  - {id: CO-2301-T1, as_of: "2026-10-01", month: "2026-10", given: {snap_expense_verification_period_has_ended: false, dependent_care_expense: 300, snap_is_ineligible_member: false}, expect: 300}
  - {id: CO-2301-T2, title: "4.407.4.A - billed to an ineligible non-citizen in a household of three, two thirds count", as_of: "2026-10-01", month: "2026-10", given: {snap_prorated_member_share_counted_rate: 0.6666666666666666, snap_expense_verification_period_has_ended: false, dependent_care_expense: 300, snap_is_ineligible_member: true, snap_is_disqualified_member_counted_in_full: false, snap_is_ineligible_member_prorated: true, snap_household_members_other_than_ineligible_students: [p1, p2, p3]}, expect: 200}
  - {id: CO-2301-T3, title: "Billed to a member disqualified for IPV - in its entirety", as_of: "2026-10-01", month: "2026-10", given: {snap_expense_verification_period_has_ended: false, dependent_care_expense: 300, snap_is_ineligible_member: true, snap_is_disqualified_member_counted_in_full: true, snap_household_members: [p1, p2, p3]}, expect: 300}
  - {id: CO-2301-T4, title: "Paid by an ineligible student - not the household's", as_of: "2026-10-01", month: "2026-10", given: {snap_expense_verification_period_has_ended: false, dependent_care_expense: 300, snap_is_ineligible_member: true, snap_is_disqualified_member_counted_in_full: false, snap_is_ineligible_member_prorated: false, snap_household_members: [p1, p2, p3]}, expect: 0}
  - {id: CO-2301-T5, title: "Engineering follow-up 5: a prorated member with no household has nothing counted", as_of: "2026-10-01", month: "2026-10", given: {snap_expense_verification_period_has_ended: false, snap_is_ineligible_member: true, snap_is_disqualified_member_counted_in_full: false, snap_is_ineligible_member_prorated: true, dependent_care_expense: 900, snap_household_members_other_than_ineligible_students: []}, expect: 0}
  - {id: CO-2301-T6, title: "Final verification F-10: still unverified after the thirtieth day - no deduction", as_of: "2026-11-05", month: "2026-11", given: {snap_dependent_care_verification_is_pending: true, snap_expense_verification_period_has_ended: true, dependent_care_expense: 300, snap_is_ineligible_member: false}, expect: 0}
  - {id: CO-2301-T7, title: "Coverage pass 6 C6-1: child care of $400 paid by a prorated member, four members of whom two are prorated: 400 x (4 - 2) / 4 = 200 (7 CFR 273.11(c)(2)(iii))", as_of: "2026-11-01", month: "2026-11", given: {snap_dependent_care_verification_is_pending: false, snap_expense_verification_period_has_ended: false, dependent_care_expense: 400, snap_is_ineligible_member: true, snap_is_disqualified_member_counted_in_full: false, snap_is_ineligible_member_prorated: true, snap_household_members_other_than_ineligible_students: [p1, p2, p3, p4]}, others: {p2: {snap_is_ineligible_member_prorated: false}, p3: {snap_is_ineligible_member_prorated: true}, p4: {snap_is_ineligible_member_prorated: false}}, expect: 200}
