id: CO-4182
name: "SNAP: allotment cap for excluded disqualified members"
identifier: snap_allotment_cap_for_disqualified_members
kind: derived
type: money
scope: person-month
program: SNAP
meaning: "The largest full-month allotment this person's SNAP household may receive so that leaving members disqualified under 7 CFR 273.11(c)(1) out of its size does not increase it (273.11(c)(1)(ii)): the allotment for the size with those members counted (snap_household_size_with_disqualified_members) - the maximum allotment for that size less snap_benefit_reduction_rate of snap_net_income_with_disqualified_members, rounded down and not below zero, raised to snap_minimum_allotment for a household of that size of snap_minimum_allotment_household_size_limit or fewer that meets the net income test. With no such member, the household's maximum allotment, which never binds."
precision: "The maximum allotment for the larger size is read as snap_maximum_allotment (CO-383) reads it for the household's size. The net income test is the household's own (snap_meets_net_income_test, CO-382). snap_full_month_allotment (CO-2307) takes the lesser of its own computation and this cap."
derived: [case, [["=", snap_household_size_with_disqualified_members, snap_eligible_household_size], snap_maximum_allotment], [[all, [<=, snap_household_size_with_disqualified_members, snap_minimum_allotment_household_size_limit], snap_meets_net_income_test], [max, [max, 0, ["-", 0, [ceil, ["-", ["*", snap_benefit_reduction_rate, snap_net_income_with_disqualified_members], [case, [[all, [">=", snap_household_size_with_disqualified_members, snap_maximum_allotment_large_household_size], [not, [unknown, snap_maximum_allotment_large_household]]], snap_maximum_allotment_large_household], [else, [lookup_extended, snap_maximum_allotment_table, snap_household_size_with_disqualified_members, snap_maximum_allotment_each_additional]]]]]]], snap_minimum_allotment]], [else, [max, 0, ["-", 0, [ceil, ["-", ["*", snap_benefit_reduction_rate, snap_net_income_with_disqualified_members], [case, [[all, [">=", snap_household_size_with_disqualified_members, snap_maximum_allotment_large_household_size], [not, [unknown, snap_maximum_allotment_large_household]]], snap_maximum_allotment_large_household], [else, [lookup_extended, snap_maximum_allotment_table, snap_household_size_with_disqualified_members, snap_maximum_allotment_each_additional]]]]]]]]]
statute_override: "Federal regulation overrides 10 CCR 2506-1 4.411.1.B.1.b, which leaves a disqualified member out of the household size and is silent on the allotment: 7 CFR 273.11(c)(1)(ii) requires that no household's allotment be increased by the exclusion, so the household receives no more than it would with the member counted."
sources: [S2965, S1813]
implemented: engine
tags: [snap, income]
rationale: "Final verification pass 2 N-7: the reviewer's ZZ-9 and ZZ-10 (CO-83, Expanded Categorical, $3,600 of wages, no shelter cost) received 9 with all three members counted and 25 with one work-sanctioned member left out, because the two-person minimum allotment applied; the exclusion raised the allotment, which 273.11(c)(1)(ii) forbids."
tests:
  - {id: CO-4182-T1, title: "ZZ-10: size 2, 3 with the sanctioned member; net 2,663: 808 - ceil(798.9) = 9", as_of: "2026-10-01", month: "2026-10", given: {snap_household_size_with_disqualified_members: 3, snap_eligible_household_size: 2, snap_net_income_with_disqualified_members: 2663, snap_meets_net_income_test: true}, expect: 9}
  - {id: CO-4182-T2, title: "No disqualified member: the maximum allotment, which never binds", as_of: "2026-10-01", month: "2026-10", given: {snap_household_size_with_disqualified_members: 2, snap_eligible_household_size: 2, snap_maximum_allotment: 562}, expect: 562}
  - {id: CO-4182-T3, title: "One member and one sanctioned member: size 2 with the member, minimum allotment $25", as_of: "2026-10-01", month: "2026-10", given: {snap_household_size_with_disqualified_members: 2, snap_eligible_household_size: 1, snap_net_income_with_disqualified_members: 1900, snap_meets_net_income_test: true}, expect: 25}
