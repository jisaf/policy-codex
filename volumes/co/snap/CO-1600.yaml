id: CO-1600
name: "SNAP: citizenship verification is pending"
identifier: snap_citizenship_verification_is_pending
kind: derived
type: yes/no
scope: person-month
program: SNAP
role: outcome
meaning: Whether SNAP requires verification of the person's questionable citizenship and it has not been provided.
derived: [all, snap_requires_verification_of_citizenship, [not, [any, citizenship_verified_by_electronic_data_source, [all, citizenship_verification_document_received, snap_citizenship_document_is_acceptable]]]]
sources: [S811, S826, S827]
implemented: engine
tags: [verification, snap]
rationale: "Review U-1: the count items held this test as an anonymous arm, so no outcome told a worker which document was outstanding and for whom; the count now sums this item."
tests:
  - {id: CO-1600-T1, month: "2026-10", as_of: "2026-10-01", given: {snap_requires_verification_of_citizenship: true, citizenship_verified_by_electronic_data_source: false, citizenship_verification_document_received: false}, expect: true}
  - {id: CO-1600-T2, month: "2026-10", as_of: "2026-10-01", given: {snap_requires_verification_of_citizenship: true, citizenship_verified_by_electronic_data_source: false, citizenship_verification_document_received: true, citizenship_verification_document_type: us_passport}, expect: false}
  - {id: CO-1600-T3, month: "2026-10", as_of: "2026-10-01", given: {snap_requires_verification_of_citizenship: false}, expect: false}
