id: CO-401
name: "SNAP: has a care responsibility that exempts from work registration"
identifier: snap_has_care_responsibility_for_work_registration_exemption
kind: derived
type: yes/no
scope: person
program: SNAP
meaning: The person is a parent or caretaker of a household member under snap_work_registration_child_age (6), or is responsible for the care of an incapacitated person.
precision: Evaluated as of the determination date, matching the other work-registration items' scope; a household member's age is tested as of the same date via age.
derived: [any, [exists, snap_household_members, [all, ["<", [of, [P], age], snap_work_registration_child_age], [any, [rel, [parent], [P]], [in_group, [P], persons_cared_for]]]], has_responsibility_for_incapacitated_person]
sources: [S121, S124, S126]
implemented: engine
tags: [work_registration, age]
rationale: 7 U.S.C. 2015(d)(2)(B) and 7 CFR 273.7(b)(1)(iv) (S121, S124) state one exemption covering both a dependent child under 6 and an incapacitated person; this item combines both branches as the single fact snap_is_exempt_from_work_registration reads, following the same P36/P37 exists-over-household-members shape as the mwr volume's WR-303.
tests:
  - {id: CO-401-T1, as_of: "2026-10-01", given: {date_of_birth: "1985-01-22", in_medical_institution: false, has_responsibility_for_incapacitated_person: false}, others: {p2: {date_of_birth: "2023-01-01", in_medical_institution: false}}, relationships: [[parent, p1, p2]], expect: true}
  - {id: CO-401-T2, as_of: "2026-10-01", given: {date_of_birth: "1985-01-22", in_medical_institution: false, has_responsibility_for_incapacitated_person: false}, others: {}, relationships: [], expect: false}
  - {id: CO-401-T3, as_of: "2026-10-01", given: {date_of_birth: "1985-01-22", in_medical_institution: false, has_responsibility_for_incapacitated_person: true}, others: {}, relationships: [], expect: true}
