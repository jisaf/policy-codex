  - {id: CO-401-T4, month: "2026-11", as_of: "2026-11-20", title: "S4-11: a son who turns 6 on November 15 is under 6 on November 1: exempt in November", given: {dwelling_id: h1, date_of_birth: "1985-01-22", snap_resides_in_institution_providing_meals: false, snap_has_responsibility_for_incapacitated_person: false}, others: {p2: {dwelling_id: h1, date_of_birth: "2020-11-15", snap_resides_in_institution_providing_meals: false}}, relationships: [[parent, p1, p2]], expect: true}
