id: CO-7672
name: "SNAP: persons living with the person in the month"
identifier: snap_lives_with_in_month
kind: derived
type: group of persons
scope: person-month
program: SNAP
meaning: "The persons of the case who live with this person in the month, for SNAP's household of the month (7 CFR 273.1(a), S1: a household is individuals who \"live together\"; 273.10(a)(1)(i), S5091: the application month is determined on \"the household's circumstances for the entire month of application\"; 10 CCR 2506-1 4.402.1.A, S4734: each issuance month on its own circumstances): in the determination month and after, the persons who live in this person's home on the determination date (lives_with, CO-1925); in a month before the determination month, those of them who already lived there in the month (neither of the two moved in after it, moved_into_home_date CO-7671), and a person joined to this person by a household edge (spouse or person held out as a spouse, parent, stepparent, child, stepchild, a person the two buy and prepare meals with, a child in this person's care or guardianship, or the caretaker or guardian) who lives elsewhere on the determination date but lived with this person on the month's first day. In any month, a person who lives elsewhere on the determination date and whose separation the case dates lives with this person in a month that began before the date the two ceased to live together. Two persons who have lived apart throughout the months evaluated (has_lived_apart_throughout_months_evaluated, CO-7860, true on either) live apart in every month."
precision: "Coverage pass 7 for SNAP, C7-1 (docs/reviews/coverage7-snap.md). The date the two ceased to live together is, for spouses or persons held out as spouses, ceased_living_with_spouse_date (CO-7352); for a parent, stepparent, child or stepchild, ceased_living_with_parent_or_child_date (CO-7506); for any other two persons, ceased_living_with_housemate_date (CO-7670); each stated on either of the two, and where one of them lives in a facility (residence_setting_type other than private_dwelling) and no date is stated, that one's institution_entry_date, as the SSI method reads the same dates (ma_ssi_lives_with_in_month, CO-7505). The day is OQ-1405's: a change that takes a person out counts only for a month on every day of which it holds, so the two live together in a month whose first day is before the date they ceased to (a husband who moved out on November 2 is a member of November); a change that brings a person in counts for the month if it holds on any day of it, so a person who moved in during a month lives in the home that month. The dates are required where read (decision 4): in a month before the determination month, two persons joined by a household edge who live apart on the determination date and state no separation date cannot be determined. In the determination month and after, the homes of the determination date are read, and a stated separation date dates a separation made during the determination month (OQ-1405's day); with none stated, the two live apart in the determination month, the determination month being read on the determination date as every status SNAP reads for it (OQ-1450). A person who moved in states moved_into_home_date; one who does not state it lived in the home before the first month evaluated (CO-7671's meaning). Persons of the case not joined by a household edge who live apart on the determination date are not asked for a date: SNAP's household is reached only along those edges (snap_household_members, CO-305). Death and institution status are read by CO-305 and snap_is_household_member (CO-304), not here. Coverage verification 7 (docs/reviews/verify-coverage7-fixes.md): V7-1, a pair who never lived together, or who parted before the first month evaluated, has no separation date to state; has_lived_apart_throughout_months_evaluated (CO-7860), true on either of the two, places them apart in a month before the determination month without a date (S1-M: a daughter's father who has never lived with her, October {p1, p3}, $217, was cannot determine). V7-5, one move of a stepparent is read from either date: for a stepparent and stepchild with no parent-or-child date stated, the date the stepparent ceased to live with his spouse (ceased_living_with_spouse_date, stated on the stepparent or on a spouse of the stepparent); for spouses with no spouse date stated, the parent-or-child date of the one who is a stepparent (S1-B: the husband's move stated only as his spouse date, October $280, was cannot determine). A stepparent who left the spouse's home left the spouse's children who lived there with it; a stepchild who lives elsewhere from the stepparent's spouse states the parent-or-child date."
