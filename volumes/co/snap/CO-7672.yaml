g_with_spouse_date]], [exists_related, [child], [all, [has_relative_in, [spouse, holds_out_as_spouse_with], [filter, [persons], [rel, [stepchild], [P]]]], ["<", [first_day, [month]], [of, [P], ceased_living_with_spouse_date]]]]]], [else, ["<", [first_day, [month]], ceased_living_with_parent_or_child_date]]]]], [else, ["<", [first_day, [month]], [otherwise, ceased_living_with_housemate_date, [otherwise, [of, [P], ceased_living_with_housemate_date], [case, [[not, ["=", residence_setting_type, private_dwelling]], institution_entry_date], [[not, ["=", [of, [P], residence_setting_type], private_dwelling]], [of, [P], institution_entry_date]], [else, ceased_living_with_housemate_date]]]]]]]], false]], [[not, [rel, [spouse, holds_out_as_spouse_with, parent, stepparent, child, stepchild, buys_prepares_with, has_primary_responsibility_for, in_primary_care_of, legal_guardian, ward], [P]]], false], [else, [all, [not, [otherwise, has_lived_apart_throughout_months_evaluated, false]], [not, [otherwise, [of, [P], has_lived_apart_throughout_months_evaluated], false]], [case, [[rel, [spouse, holds_out_as_spouse_with], [P]], [otherwise, ["<", [first_day, [month]], [otherwise, ceased_living_with_spouse_date, [otherwise, [of, [P], ceased_living_with_spouse_date], [case, [[not, ["=", residence_setting_type, private_dwelling]], institution_entry_date], [[not, ["=", [of, [P], residence_setting_type], private_dwelling]], [of, [P], institution_entry_date]], [else, ceased_living_with_spouse_date]]]]], ["<", [first_day, [month]], [otherwise, [case, [[exists_related, [stepparent], true], ceased_living_with_parent_or_child_date]], [otherwise, [case, [[has_relative_in, [stepparent], [persons]], [of, [P], ceased_living_with_parent_or_child_date]]], ceased_living_with_spouse_date]]]]], [[rel, [parent, stepparent, child, stepchild], [P]], [otherwise, ["<", [first_day, [month]], [otherwise, ceased_living_with_parent_or_child_date, [otherwise, [of, [P], ceased_living_with_parent_or_child_date], [case, [[not, ["=", residence_setting_type, private_dwelling]], institution_entry_date], [[not, ["=", [of, [P], residence_setting_type], private_dwelling]], [of, [P], institution_entry_date]], [else, ceased_living_with_parent_or_child_date]]]]], [case, [[rel, [stepparent], [P]], [otherwise, ["<", [first_day, [month]], ceased_living_with_spouse_date], [exists_related, [spouse, holds_out_as_spouse_with], ["<", [first_day, [month]], [of, [P], ceased_living_with_spouse_date]]]]], [[rel, [stepchild], [P]], [otherwise, ["<", [first_day, [month]], [of, [P], ceased_living_with_spouse_date]], [exists_related, [child], [all, [has_relative_in, [spouse, holds_out_as_spouse_with], [filter, [persons], [rel, [stepchild], [P]]]], ["<", [first_day, [month]], [of, [P], ceased_living_with_spouse_date]]]]]], [else, ["<", [first_day, [month]], ceased_living_with_parent_or_child_date]]]]], [else, ["<", [first_day, [month]], [otherwise, ceased_living_with_housemate_date, [otherwise, [of, [P], ceased_living_with_housemate_date], [case, [[not, ["=", residence_setting_type, private_dwelling]], institution_entry_date], [[not, ["=", [of, [P], residence_setting_type], private_dwelling]], [of, [P], institution_entry_date]], [else, ceased_living_with_housemate_date]]]]]]]]]]]
sources: [S1, S5091, S4734]
implemented: engine
tags: [household]
open: [OQ-1405, OQ-1450]
rationale: "Coverage pass 7 for SNAP, C7-1: SNAP's household (CO-305) and the SNAP items that ask whether a person lives with a parent or child (CO-2569, CO-4250, CO-4690, CO-5112) read lives_with, the homes of the determination date, in every month, so an application month before the determination month lost a member who moved out in between (probe MOVE1: October $217 where 273.10(a)(1)(i) gives $280) and kept one who moved in. One group serves them all, so each reads the same household of the month; it reads the separation dates the SSI method reads (CO-7505), with SNAP's own day (OQ-1405)."
nearest: [CO-1925, CO-7505]
tests:
  # MOVE1 (docs/reviews/coverage7-snap.md, C7-1): determined 2026-11-05; the husband p2 moved out on 2026-11-02 (h2).
  # October (before the determination month): 2026-10-01 < 2026-11-02, so they lived together: both.
  - {id: CO-7672-T1, month: "2026-10", as_of: "2026-11-05", title: "C7-1: a husband who moved out on 2026-11-02 lived with his wife in October", given: {dwelling_id: h1, residence_setting_type: private_dwelling}, others: {p2: {dwelling_id: h2, residence_setting_type: private_dwelling, ceased_living_with_spouse_date: "2026-11-02"}}, relationships: [[spouse, p2]], expect: [p1, p2]}
  # November, the determination month: 2026-11-01 < 2026-11-02, lived together on November 1 (OQ-1405: out only for a month on every day of which it holds).
  - {id: CO-7672-T2, month: "2026-11", as_of: "2026-11-05", title: "C7-1: and on November 1, so in November too (OQ-1405)", given: {dwelling_id: h1, residence_setting_type: private_dwelling}, others: {p2: {dwelling_id: h2, residence_setting_type: private_dwelling, ceased_living_with_spouse_date: "2026-11-02"}}, relationships: [[spouse, p2]], expect: [p1, p2]}
  # December: 2026-12-01 is after 2026-11-02: apart.
  - {id: CO-7672-T3, month: "2026-12", as_of: "2026-11-05", title: "C7-1: apart from December", given: {dwelling_id: h1, residence_setting_type: private_dwelling}, others: {p2: {dwelling_id: h2, residence_setting_type: private_dwelling, ceased_living_with_spouse_date: "2026-11-02"}}, relationships: [[spouse, p2]], expect: [p1]}
  # The same spouses apart with no date: October cannot be determined (decision 4); November, the determination month, is read on the determination date's homes: apart.
  - {id: CO-7672-T4, month: "2026-10", as_of: "2026-11-05", title: "C7-1: spouses apart on the determination date, no date stated: October cannot be determined (decision 4)", given: {dwelling_id: h1, residence_setting_type: private_dwelling}, others: {p2: {dwelling_id: h2, residence_setting_type: private_dwelling}}, relationships: [[spouse, p2]], expect: unknown}
  - {id: CO-7672-T5, month: "2026-11", as_of: "2026-11-05", title: "C7-1: the same in the determination month: the determination date's homes, apart", given: {dwelling_id: h1, residence_setting_type: private_dwelling}, others: {p2: {dwelling_id: h2, residence_setting_type: private_dwelling}}, relationships: [[spouse, p2]], expect: [p1]}
  # A roommate p2 who bought and prepared meals with p1 and moved out on 2026-10-25 (ceased_living_with_housemate_date): October 1 is before October 25, so October both.
  - {id: CO-7672-T6, month: "2026-10", as_of: "2026-11-05", title: "C7-1: a roommate who moved out on 2026-10-25 lived with p1 in October", given: {dwelling_id: h1, residence_setting_type: private_dwelling}, others: {p2: {dwelling_id: h2, residence_setting_type: private_dwelling, ceased_living_with_housemate_date: "2026-10-25"}}, relationships: [[buys_prepares_with, p2]], expect: [p1, p2]}
  # A sister p2 who moved in on 2026-11-03 (moved_into_home_date): October is before her move (month of 2026-11-03 is after October): p1 alone; November: both.
  - {id: CO-7672-T7, month: "2026-10", as_of: "2026-11-05", title: "C7-1: a person who moved in on 2026-11-03 did not live in the home in October", given: {dwelling_id: h1, residence_setting_type: private_dwelling}, others: {p2: {dwelling_id: h1, residence_setting_type: private_dwelling, moved_into_home_date: "2026-11-03"}}, relationships: [[buys_prepares_with, p2]], expect: [p1]}
  - {id: CO-7672-T8, month: "2026-11", as_of: "2026-11-05", title: "C7-1: and lives there in November (any day of the month, OQ-1405)", given: {dwelling_id: h1, residence_setting_type: private_dwelling}, others: {p2: {dwelling_id: h1, residence_setting_type: private_dwelling, moved_into_home_date: "2026-11-03"}}, relationships: [[buys_prepares_with, p2]], expect: [p1, p2]}
  # A person of the case in another home with no household edge: no date asked, not with p1.
  - {id: CO-7672-T9, month: "2026-10", as_of: "2026-11-05", title: "C7-1: an unrelated person of the case in another home: no date asked", given: {dwelling_id: h1, residence_setting_type: private_dwelling}, others: {p2: {dwelling_id: h2, residence_setting_type: private_dwelling}}, relationships: [], expect: [p1]}
  # A wife p2 who entered a nursing facility on 2026-10-20, no separation date: the entry dates it; October 1 is before October 20, so October both; December apart.
  - {id: CO-7672-T10, month: "2026-10", as_of: "2026-11-05", title: "C7-1: a spouse who entered a nursing facility on 2026-10-20 lived with p1 in October", given: {dwelling_id: h1, residence_setting_type: private_dwelling}, others: {p2: {dwelling_id: nf1, residence_setting_type: nursing_facility, institution_entry_date: "2026-10-20"}}, relationships: [[spouse, p2]], expect: [p1, p2]}
  - {id: CO-7672-T11, month: "2026-12", as_of: "2026-11-05", title: "C7-1: and apart from December", given: {dwelling_id: h1, residence_setting_type: private_dwelling}, others: {p2: {dwelling_id: nf1, residence_setting_type: nursing_facility, institution_entry_date: "2026-10-20"}}, relationships: [[spouse, p2]], expect: [p1]}
  # Coverage verification 7, V7-1 (S1-M): a daughter p1 (h1) and her father p2 (h2), who has never lived with her; determined 2026-11-05.
  # October is before the determination month; the two are joined by a parent edge and live apart; no separation date exists.
  # Stated true on either of them, they lived apart throughout: October p1 alone (the family's allotment, stored CO-1160: 562 x 12/31 = 217.5, $217).
  - {id: CO-7672-T12, month: "2026-10", as_of: "2026-11-05", title: "V7-1: a father who has never lived with his daughter (has_lived_apart_throughout_months_evaluated on him): apart in October", given: {dwelling_id: h1, residence_setting_type: private_dwelling}, others: {p2: {dwelling_id: h2, residence_setting_type: private_dwelling, has_lived_apart_throughout_months_evaluated: true}}, relationships: [[parent, p2, p1]], expect: [p1]}
  - {id: CO-7672-T13, month: "2026-10", as_of: "2026-11-05", title: "V7-1: the same stated on the daughter: apart in October", given: {dwelling_id: h1, residence_setting_type: private_dwelling, has_lived_apart_throughout_months_evaluated: true}, others: {p2: {dwelling_id: h2, residence_setting_type: private_dwelling}}, relationships: [[parent, p2, p1]], expect: [p1]}
  # Neither the flag nor a date: October cannot be determined (decision 4), as CO-7672-T4.
  - {id: CO-7672-T14, month: "2026-10", as_of: "2026-11-05", title: "V7-1: neither stated: October cannot be determined (decision 4)", given: {dwelling_id: h1, residence_setting_type: private_dwelling}, others: {p2: {dwelling_id: h2, residence_setting_type: private_dwelling}}, relationships: [[parent, p2, p1]], expect: unknown}
  # V7-5 (S1-B): a girl p1 (h1) with her mother p3 (h1) and her stepfather p2, who moved out on 2026-11-02 (h2), the move stated once.
  # Stated as the stepfather's ceased_living_with_spouse_date 2026-11-02 only (no parent-or-child date): the step edge reads it;
  # 2026-10-01 is before 2026-11-02, so October p1, p2, p3 (the mother lives with p1).
  - {id: CO-7672-T15, month: "2026-10", as_of: "2026-11-05", title: "V7-5: a stepfather's move stated only as his spouse date dates the step edge: together in October", given: {dwelling_id: h1, residence_setting_type: private_dwelling}, others: {p2: {dwelling_id: h2, residence_setting_type: private_dwelling, ceased_living_with_spouse_date: "2026-11-02"}, p3: {dwelling_id: h1, residence_setting_type: private_dwelling}}, relationships: [[parent, p3, p1], [stepparent, p2, p1], [spouse, p2, p3]], expect: [p1, p2, p3]}
  # The same date stated on the mother p3 (the spouse date "may be stated on either of the two"): read through the stepfather's spouse edge.
  - {id: CO-7672-T16, month: "2026-10", as_of: "2026-11-05", title: "V7-5: the spouse date stated on the mother only: together in October", given: {dwelling_id: h1, residence_setting_type: private_dwelling}, others: {p2: {dwelling_id: h2, residence_setting_type: private_dwelling}, p3: {dwelling_id: h1, residence_setting_type: private_dwelling, ceased_living_with_spouse_date: "2026-11-02"}}, relationships: [[parent, p3, p1], [stepparent, p2, p1], [spouse, p2, p3]], expect: [p1, p2, p3]}
  # December (after the determination month): 2026-12-01 is not before 2026-11-02: apart.
  - {id: CO-7672-T17, month: "2026-12", as_of: "2026-11-05", title: "V7-5: and apart from December", given: {dwelling_id: h1, residence_setting_type: private_dwelling}, others: {p2: {dwelling_id: h2, residence_setting_type: private_dwelling, ceased_living_with_spouse_date: "2026-11-02"}, p3: {dwelling_id: h1, residence_setting_type: private_dwelling}}, relationships: [[parent, p3, p1], [stepparent, p2, p1], [spouse, p2, p3]], expect: [p1, p3]}
  # The mirror: the wife p1 (h1), her daughter p3 (h1) and the husband p2 (h2), stepfather of p3, whose move is stated only as
  # his ceased_living_with_parent_or_child_date 2026-11-02: the spouse edge reads the stepparent's date: October p1, p2, p3.
  - {id: CO-7672-T18, month: "2026-10", as_of: "2026-11-05", title: "V7-5: a husband's move stated only as his stepparent date dates the spouse edge: together in October", given: {dwelling_id: h1, residence_setting_type: private_dwelling}, others: {p2: {dwelling_id: h2, residence_setting_type: private_dwelling, ceased_living_with_parent_or_child_date: "2026-11-02"}, p3: {dwelling_id: h1, residence_setting_type: private_dwelling}}, relationships: [[spouse, p1, p2], [parent, p1, p3], [stepparent, p2, p3]], expect: [p1, p2, p3]}
