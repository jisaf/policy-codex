id: CO-037
name: "SNAP: homeless individual"
identifier: snap_is_homeless
kind: derived
type: yes/no
scope: person-month
program: SNAP
meaning: "Whether the person is a homeless individual for SNAP under 7 CFR 271.2 (S1950): lacks a fixed and regular nighttime residence, including one who will imminently lose it; or has as primary nighttime residence a supervised shelter giving temporary accommodations, a halfway house or similar institution for persons intended to be institutionalized, a temporary accommodation of not more than 90 days in the residence of another individual, or a public or private place not designed for, or ordinarily used as, a regular sleeping accommodation."
sources: [S1950, S4734]
precision: "A motel or hotel, trailer park or campground stay for lack of alternative accommodations, and an abandonment in a hospital, are a lack of a fixed and regular nighttime residence (271.2 (1)). Substandard housing is fixed and regular, so it is not homelessness for SNAP. A stay in another's home, for any reason, is homeless for not more than snap_homeless_temporary_accommodation_max_days (90) days from temporary_residence_start_date; beyond that it is not (2)(iii). Three-pattern sweep T-4 (docs/reviews/pattern-sweep-snap-ce.md): per month, the days counted to the first day of the month evaluated, since prospective budgeting reads the circumstances of the issuance month (10 CCR 2506-1 4.402.1.A, S4734) and a status that gives the household a deduction is met for the month if it is met on any day of it (the day SNAP reads its ages and dated changes on, OQ-1262, OQ-1405). Before, the item was per person and counted to the determination date, so a household still within the ninety days in the determination month kept the homeless shelter deduction in every later month of the certification (probe CO-943)."
derived: [case, [[in, nighttime_residence_type, [imminently_losing_residence, motel_or_hotel_for_lack_of_alternative, trailer_park_for_lack_of_alternative, campground_for_lack_of_alternative, emergency_or_transitional_shelter, halfway_house, abandoned_in_hospital, place_not_designed_for_sleeping]], true], [[in, nighttime_residence_type, [shared_housing_due_to_loss_or_hardship, shared_housing_other_temporary]], [<=, [days_between, temporary_residence_start_date, [first_day, [month]]], snap_homeless_temporary_accommodation_max_days]], [else, false]]
open: [OQ-1405]
implemented: engine
rationale: "Same-word audit SW-11: the supplied is_homeless had no source and four programs read it under four definitions. It becomes SNAP's own derived item, SNAP being the program whose definition it was closest to; the other programs read their own items over nighttime_residence_type (CO-2810)."
nearest: [CO-2010, CO-2813, CO-2814, CO-2815]
tests:
  - {id: CO-037-T1, title: "Family in an emergency shelter", month: "2026-11", as_of: "2026-11-01", given: {nighttime_residence_type: emergency_or_transitional_shelter}, expect: true}
  - {id: CO-037-T2, title: "Staying with friends for 60 days after an eviction", month: "2026-11", as_of: "2026-11-01", given: {nighttime_residence_type: shared_housing_due_to_loss_or_hardship, temporary_residence_start_date: "2026-09-02"}, expect: true}
  - {id: CO-037-T3, title: "Staying with friends for 120 days", month: "2026-11", as_of: "2026-11-01", given: {nighttime_residence_type: shared_housing_other_temporary, temporary_residence_start_date: "2026-07-04"}, expect: false}
  - {id: CO-037-T4, title: "Substandard housing is fixed and regular for SNAP", month: "2026-11", as_of: "2026-11-01", given: {nighttime_residence_type: substandard_housing}, expect: false}
  - {id: CO-037-T5, title: "Own home", month: "2026-11", as_of: "2026-11-01", given: {nighttime_residence_type: fixed_regular_adequate}, expect: false}
  - {id: CO-037-T6, title: "Three-pattern sweep T-4 (CO-943): staying with friends since 2026-09-20, determined 2026-10-20: on December 1 the stay is 72 days, still homeless", month: "2026-12", as_of: "2026-10-20", given: {nighttime_residence_type: shared_housing_due_to_loss_or_hardship, temporary_residence_start_date: "2026-09-20"}, expect: true}
  - {id: CO-037-T7, title: "Three-pattern sweep T-4 (CO-943): the same stay on January 1, 2027 is 103 days, beyond 90: not homeless in January", month: "2027-01", as_of: "2026-10-20", given: {nighttime_residence_type: shared_housing_due_to_loss_or_hardship, temporary_residence_start_date: "2026-09-20"}, expect: false}
