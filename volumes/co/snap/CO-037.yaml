id: CO-037
name: "SNAP: homeless individual"
identifier: snap_is_homeless
kind: derived
type: yes/no
scope: person
program: SNAP
meaning: "Whether the person is a homeless individual for SNAP under 7 CFR 271.2 (S1950): lacks a fixed and regular nighttime residence, including one who will imminently lose it; or has as primary nighttime residence a supervised shelter giving temporary accommodations, a halfway house or similar institution for persons intended to be institutionalized, a temporary accommodation of not more than 90 days in the residence of another individual, or a public or private place not designed for, or ordinarily used as, a regular sleeping accommodation."
sources: [S1950]
precision: "A motel or hotel, trailer park or campground stay for lack of alternative accommodations, and an abandonment in a hospital, are a lack of a fixed and regular nighttime residence (271.2 (1)). Substandard housing is fixed and regular, so it is not homelessness for SNAP. A stay in another's home, for any reason, is homeless for not more than snap_homeless_temporary_accommodation_max_days (90) days from temporary_residence_start_date; beyond that it is not (2)(iii)."
derived: [case, [[in, nighttime_residence_type, [imminently_losing_residence, motel_or_hotel_for_lack_of_alternative, trailer_park_or_campground_for_lack_of_alternative, emergency_or_transitional_shelter, halfway_house, abandoned_in_hospital, place_not_designed_for_sleeping]], true], [[in, nighttime_residence_type, [shared_housing_due_to_loss_or_hardship, shared_housing_other_temporary]], [<=, [days_between, temporary_residence_start_date, [det_date]], snap_homeless_temporary_accommodation_max_days]], [else, false]]
implemented: engine
rationale: "Same-word audit SW-11: the supplied is_homeless had no source and four programs read it under four definitions. It becomes SNAP's own derived item, SNAP being the program whose definition it was closest to; the other programs read their own items over nighttime_residence_type (CO-2810)."
nearest: [CO-2010, CO-2813, CO-2814, CO-2815]
tests:
  - {id: CO-037-T1, title: "Family in an emergency shelter", as_of: "2026-11-01", given: {nighttime_residence_type: emergency_or_transitional_shelter}, expect: true}
  - {id: CO-037-T2, title: "Staying with friends for 60 days after an eviction", as_of: "2026-11-01", given: {nighttime_residence_type: shared_housing_due_to_loss_or_hardship, temporary_residence_start_date: "2026-09-02"}, expect: true}
  - {id: CO-037-T3, title: "Staying with friends for 120 days", as_of: "2026-11-01", given: {nighttime_residence_type: shared_housing_other_temporary, temporary_residence_start_date: "2026-07-04"}, expect: false}
  - {id: CO-037-T4, title: "Substandard housing is fixed and regular for SNAP", as_of: "2026-11-01", given: {nighttime_residence_type: substandard_housing}, expect: false}
  - {id: CO-037-T5, title: "Own home", as_of: "2026-11-01", given: {nighttime_residence_type: fixed_regular_adequate}, expect: false}
