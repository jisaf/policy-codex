id: CO-020
name: "SNAP: enrolled at least half time in a school or training program"
identifier: snap_is_enrolled_half_time_in_school_or_training
kind: derived
type: yes/no
scope: person
program: SNAP
meaning: "The person is enrolled at least half time, as the school or program defines it, in a recognized school (elementary or secondary, or equivalent) or training program, for the 7 CFR 273.7(b)(1)(viii) work registration exemption. Enrollment at least half time in an institution of higher education is is_enrolled_higher_education_half_time (whose exemption also needs the 273.5 student rules), not this fact."
derived: [all, [in, education_program_type, [elementary, secondary, secondary_career_and_technical, high_school_equivalency, home_school_recognized, workforce_training, basic_education, teen_parent_education, other_training]], [in, education_enrollment_intensity, [full_time, half_time]]]
sources: [S125, S126]
implemented: engine
tags: [snap, work_registration, student]
rationale: "Phase 2 SNAP fact. Vocabulary fix round (docs/reviews/vocabulary-reuse.md, R-2): renamed from is_enrolled_in_school and confined to SNAP; it had been read by Medicaid and Colorado Works for a full-time secondary student and by CCCAP for high school attendance and for education activities, four different definitions. Those readers now read is_full_time_secondary_student_finishing_before_nineteen (CO-1720), cccap_is_attending_high_school (CO-1721) and cccap_is_in_education_or_training_activity (CO-1722). Same-word audit SW-12 and dual-entry audit 3.18: one real fact (where the person is enrolled and how much) was entered as up to nine program-defined facts that could disagree; each program's definition is now derived from education_program_type, education_enrollment_intensity and expected_program_completion_date (CO-2880 to CO-2882)."
tests:
  - {id: CO-020-T11, title: "High school, full time", as_of: "2026-11-01", given: {education_program_type: secondary, education_enrollment_intensity: full_time}, expect: true}
  - {id: CO-020-T12, title: "College is the higher education fact, not this one", as_of: "2026-11-01", given: {education_program_type: higher_education, education_enrollment_intensity: full_time}, expect: false}
  - {id: CO-020-T13, title: "Less than half time", as_of: "2026-11-01", given: {education_program_type: workforce_training, education_enrollment_intensity: less_than_half_time}, expect: false}
