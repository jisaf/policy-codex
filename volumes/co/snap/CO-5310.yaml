id: CO-5310
name: "SNAP: real property not exempt"
identifier: snap_real_property_not_exempt
kind: derived
type: money
scope: person
program: SNAP
meaning: "The equity of the person's real property, and of the mortgages and promissory notes the person holds, that SNAP does not exempt (7 CFR 273.8; 10 CCR 2506-1 4.409.B-C, 4.410): every holdings record (holdings, CO-5300) whose row in snap_holding_treatment_table (CO-5301) is counted_less_real_property_exclusions (real_property) or counted_with_real_property (loan_receivable), valued in the determination month and still held, at its value less what is owed on it (4.409.B: \"the fair market value minus the verified amount owed\"), times the person's share, or all of it where it is owned with someone outside the case (4.409.C: jointly owned resources are \"available in their entirety to each household\"); leaving out a record the person cannot reach (accessible; 4.409.C, 4.410.F.1), real property the person is making a good faith effort to sell (listed_for_sale; 4.410.F.1), a lot on which a household with no home intends to build (lot_for_future_home; 4.410.B), property producing income (income_producing; 4.410.E.1), and property essential to farming within a year of the day the person stopped farming (farm_ended_date; 4.410.E.4)."
precision: "Decision 4 of 2026-11-23: whether real property is for sale, a lot for a future home or producing income is required where read (the holdings schema), so a real property record that states none of them, and is not left out by another, is cannot determine; before step H1 each part was read as 0 when not stated, so property not stated as for sale was read as not for sale. A record with no farm_ended_date is not property essential to farming. A mortgage or note the person holds (loan_receivable) passes the real property tests as it did inside real_property_other_than_home_equity (CO-3393; the row counted_with_real_property, for the SNAP owner's signature, OQ-1202). Installment contracts producing income consistent with their value (installment_contract, excluded, 4.410.E.2), the home (excluded, 4.410.B) and every vehicle (excluded, 4.410.A) are not read. A record valued in another month (its month) or disposed of (disposed_date) is not held in the determination month."
derived: ["sum_receipts", "holdings", ["all", ["all", ["received_in", ["det_month"]], ["unknown", ["receipt", "disposed_date"]]], ["receipt", "accessible"], ["in", ["lookup", "snap_holding_treatment_table", ["receipt", "kind"]], ["counted_less_real_property_exclusions", "counted_with_real_property"]], ["any", ["=", ["lookup", "snap_holding_treatment_table", ["receipt", "kind"]], "counted_with_real_property"], ["all", ["not", ["receipt", "listed_for_sale"]], ["not", ["receipt", "lot_for_future_home"]], ["not", ["receipt", "income_producing"]], ["not", ["all", ["not", ["unknown", ["receipt", "farm_ended_date"]]], ["<", ["years_between", ["receipt", "farm_ended_date"], ["det_date"]], "snap_former_farm_property_exclusion_years"]]]]]], ["case", [["all", ["not", ["unknown", ["receipt", "co_owners"]]], ["=", ["receipt", "co_owners"], "outside_case"]], ["-", ["receipt", "value"], ["receipt", "amount_owed"]]], ["else", ["*", ["-", ["receipt", "value"], ["receipt", "amount_owed"]], ["otherwise", ["receipt", "share"], 1]]]]]
sources: [S2216, S2968, S3118, S3129, S3477, S4690]
implemented: engine
tags: [snap, resources]
rationale: "Resource records, step H1 SNAP (docs/reviews/records-holdings-snap-af.md): SNAP reads the person's resources from the holdings records (holdings, CO-5300) through its counting table (snap_holding_treatment_table, CO-5301), never from the scalar resource facts. The real property part of snap_countable_nonliquid_resources (CO-074), which subtracted the parts of real_property_other_than_home_equity one by one."
tests:
  # Hand-computed from 10 CCR 2506-1 4.409.B-C (S4690, S2968) and 4.410.B, E.1, E.4, F.1 (S3118, S3477, S2968).
  - {id: CO-5310-T1, title: "A rental-free cabin worth $15,000 owing $3,000: 15,000 - 3,000 = 12,000", as_of: "2027-02-10", given: {holdings: [{kind: real_property, value: 15000, amount_owed: 3000, listed_for_sale: false, lot_for_future_home: false, income_producing: false}]}, expect: 12000}
  - {id: CO-5310-T2, title: "$2,000 of land, a $3,000 parcel for sale and a $15,000 lot for a home: only the 2,000 (F.1, B)", as_of: "2027-02-10", given: {holdings: [{kind: real_property, value: 2000, amount_owed: 0, listed_for_sale: false, lot_for_future_home: false, income_producing: false}, {kind: real_property, value: 3000, amount_owed: 0, listed_for_sale: true, lot_for_future_home: false, income_producing: false}, {kind: real_property, value: 15000, amount_owed: 0, listed_for_sale: false, lot_for_future_home: true, income_producing: false}]}, expect: 2000}
  - {id: CO-5310-T3, title: "A $6,000 lot owned half with a brother who lives elsewhere: all 6,000 (4.409.C); half with the spouse in the case: 6,000 x 0.5 = 3,000", as_of: "2027-02-10", given: {holdings: [{kind: real_property, value: 6000, amount_owed: 0, listed_for_sale: false, lot_for_future_home: false, income_producing: false, share: 0.5, co_owners: outside_case, holding_id: lot-a}, {kind: real_property, value: 6000, amount_owed: 0, listed_for_sale: false, lot_for_future_home: false, income_producing: false, share: 0.5, co_owners: spouse, holding_id: lot-b}]}, expect: 9000}
  - {id: CO-5310-T4, title: "Farm land worth $9,000, farming ended on 2026-06-10, eight months before: excluded (E.4); a $40,000 rental house producing income: excluded (E.1)", as_of: "2027-02-10", given: {holdings: [{kind: real_property, value: 9000, amount_owed: 0, listed_for_sale: false, lot_for_future_home: false, income_producing: false, farm_ended_date: "2026-06-10"}, {kind: real_property, value: 40000, amount_owed: 0, listed_for_sale: false, lot_for_future_home: false, income_producing: true}]}, expect: 0}
  - {id: CO-5310-T5, title: "Decision 4: land that does not say whether it is for sale - cannot determine", as_of: "2027-02-10", given: {holdings: [{kind: real_property, value: 5000, amount_owed: 0, lot_for_future_home: false, income_producing: false}]}, expect: unknown}
  - {id: CO-5310-T6, title: "Land the co-owner will not agree to sell and that cannot be divided is inaccessible (4.409.C)", as_of: "2027-02-10", given: {holdings: [{kind: real_property, value: 5000, amount_owed: 0, listed_for_sale: false, lot_for_future_home: false, income_producing: false, accessible: false}]}, expect: 0}
