rationale: "Resource records, step H1 SNAP (docs/reviews/records-holdings-snap-af.md): SNAP reads the person's resources from the holdings records (holdings, CO-5300) through its counting table (snap_holding_treatment_table, CO-5301), never from the scalar resource facts. The real property part of snap_countable_nonliquid_resources (CO-074), which subtracted the parts of real_property_other_than_home_equity one by one."
