id: CO-1500
name: "SNAP: standard utility allowance"
identifier: snap_utility_allowance_amount
kind: derived
type: money
scope: person
program: SNAP
meaning: The one standard utility allowance Colorado's four-tiered mandatory SUA gives the person's SNAP household - the Heating and Cooling Utility Allowance when the household is entitled to it; otherwise the Basic Utility Allowance for at least two non-heating, non-cooling utility costs; otherwise the One Utility Allowance for one such cost other than a telephone; otherwise the telephone allowance when the telephone is the only utility cost; otherwise nothing - per 10 CCR 2506-1 4.407.31. A household receives only one of the four allowances and cannot claim actual utility expenses. Internet connection fees never enter it (4.407.3.E.5; Pub. L. 119-21 sec. 10104).
precision: "Household-level: the utility facts (snap_entitled_to_heating_cooling_allowance, non_heating_utility_cost_count, incurs_telephone_cost) are household facts stated on one member, usually the head; the allowance is the highest tier any member of snap_household_members states, so stating the same utilities on two members still gives one allowance (4.407.31, 'only entitled to one (1) of the four (4) utility allowances'). A member whose facts are unstated contributes nothing (P4 defaults of false and zero, the same device OQ-29 records for shelter costs); a household where no member states them gets no allowance. Every member of the household evaluates to the same figure, which snap_shelter_costs (CO-377) adds once. A case may still state this amount directly on a person, which the engine uses for that person in place of the rule. A household sharing utility costs with another SNAP household receives the full allowance (4.407.31.A.1.d, B.2, C.2, D.1), which needs no separate term."
derived: [case, [[exists, snap_household_members, [otherwise, [of, [P], snap_entitled_to_heating_cooling_allowance], false]], snap_sua_heating_cooling], [[exists, snap_household_members, [">=", [otherwise, [of, [P], non_heating_utility_cost_count], 0], 2]], snap_sua_basic], [[exists, snap_household_members, [all, [=, [otherwise, [of, [P], non_heating_utility_cost_count], 0], 1], [not, [of, [P], incurs_telephone_cost]]]], snap_sua_one_utility], [[exists, snap_household_members, [=, [otherwise, [of, [P], non_heating_utility_cost_count], 0], 1]], snap_sua_telephone], [else, 0]]
sources: [S136, S137, S743, S744, S745, S746, S747, S753]
implemented: engine
tags: [income, snap, state_election]
rationale: "Phase-8 fix round (S-6, S-3): replaces CO-036, which phase 8 had reused for this derived rule after deleting the supplied utility_allowance_amount that carried the ID; IDs are never reused (docs/conventions.md), so the derived rule takes a new ID and CO-036 is retired. The identifier keeps phase 8's rename to snap_utility_allowance_amount (governance name.prefix for a derived SNAP rule), so its readers are unchanged. The derivation is now household-level: phase 8 computed it per member and snap_shelter_costs summed it over every member whose value was known, so two members stating heating costs gave two allowances, contrary to 4.407.31 (S743). The four tiers, their conditions and amounts are unchanged (S743-S747, parameters CO-1235-CO-1238)."
