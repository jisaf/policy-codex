id: CO-1500
name: "SNAP: standard utility allowance"
identifier: snap_utility_allowance_amount
kind: derived
type: money
scope: person-month
program: SNAP
meaning: The one standard utility allowance Colorado's four-tiered mandatory SUA gives the person's SNAP household - the Heating and Cooling Utility Allowance when the household is entitled to it; otherwise the Basic Utility Allowance for at least snap_bua_min_utility_cost_count (CO-3042) non-heating, non-cooling utility costs; otherwise the One Utility Allowance for one such cost other than a telephone; otherwise the telephone allowance when the telephone is the only utility cost; otherwise nothing - per 10 CCR 2506-1 4.407.31. A household receives only one of the four allowances and cannot claim actual utility expenses. Internet connection fees never enter it (4.407.3.E.5; Pub. L. 119-21 sec. 10104).
precision: "Household-level, once for the case: the utility facts are neutral facts about the home (CO-3300 to CO-3306, CO-1242, CO-1240), stated once in the case's case_facts, so every member of the household evaluates to the same figure, which snap_shelter_costs (CO-377) adds once. A heating arrangement or a utility the case does not state is read as not incurred (rule 12: unstated utility facts read as none, as before), so a case stating none gets no allowance. A case may still state this amount directly on a person, which the engine uses for that person in place of the rule. A household sharing utility costs with another SNAP household receives the full allowance (4.407.31.A.1.d, B.2, C.2, D.1), which needs no separate term. Time audit T-3: per month, so the figure is the one in force in the month evaluated (docs/operators.md, Resolution step 2); as a per-person item it gave the determination date's figure in every month. Coverage pass 4 S4-14 (decision 4 checked): the home's utility costs not stated are read as not incurred, the rule giving that reading: a deduction is given only for an expense the household claims and shows, and an expense not shown is left out (10 CCR 2506-1 4.502.A.3, S818: \"the household's eligibility and benefit level will be determined without providing a deduction or exclusion for the claimed but unverified expense\"; 7 CFR 273.2(f)(3)(ii), S812), so a utility cost not claimed gives no utility allowance."
derived: [case, [[otherwise, snap_entitled_to_heating_cooling_allowance, false], snap_sua_heating_cooling], [[">=", snap_non_heating_utility_cost_count, snap_bua_min_utility_cost_count], snap_sua_basic], [[all, [">", snap_non_heating_utility_cost_count, 0], [not, [all, ["=", snap_non_heating_utility_cost_count, 1], [otherwise, home_incurs_telephone_cost, false]]]], snap_sua_one_utility], [["=", snap_non_heating_utility_cost_count, 1], snap_sua_telephone], [else, 0]]
sources: [S136, S137, S743, S744, S745, S746, S747, S753, S818, S812]
implemented: engine
tags: [income, snap, state_election]
rationale: "Phase-8 fix round (S-6, S-3): replaces CO-036, which phase 8 had reused for this derived rule after deleting the supplied utility_allowance_amount that carried the ID; IDs are never reused (docs/conventions.md), so the derived rule takes a new ID and CO-036 is retired. The identifier keeps phase 8's rename to snap_utility_allowance_amount (governance name.prefix for a derived SNAP rule), so its readers are unchanged. The derivation is now household-level: phase 8 computed it per member and snap_shelter_costs summed it over every member whose value was known, so two members stating heating costs gave two allowances, contrary to 4.407.31 (S743). The four tiers, their conditions and amounts are unchanged (S743-S747, parameters CO-1235-CO-1238). Dual-entry audit 1.13 and 2.8: the utility facts are one value per case, so the rule reads them directly instead of taking the highest tier any member states; the count is derived from one fact per utility (CO-1241), and the telephone-only test is the count of one with the telephone incurred."
tests:
