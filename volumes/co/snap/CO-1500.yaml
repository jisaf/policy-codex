  - {id: CO-1500-T2, month: "2026-09", title: "FY2026 heating and cooling allowance (FNS table)", as_of: "2026-09-01", given: {snap_entitled_to_heating_cooling_allowance: true, home_incurs_electricity_cost: true}, expect: 594}
  - {id: CO-1500-T3, month: "2026-10", as_of: "2026-10-01", given: {snap_entitled_to_heating_cooling_allowance: false, home_incurs_electricity_cost: true, home_incurs_telephone_cost: true}, expect: 390}
  - {id: CO-1500-T4, month: "2026-10", as_of: "2026-10-01", given: {snap_entitled_to_heating_cooling_allowance: false, home_incurs_water_cost: true}, expect: 73}
  - {id: CO-1500-T5, month: "2026-10", title: "Telephone is the only utility cost", as_of: "2026-10-01", given: {snap_entitled_to_heating_cooling_allowance: false, home_incurs_telephone_cost: true}, expect: 100}
  - {id: CO-1500-T6, month: "2026-10", as_of: "2026-10-01", given: {snap_entitled_to_heating_cooling_allowance: false}, expect: 0}
  - {id: CO-1500-T7, month: "2026-10", title: "Dual-entry 1.13: the home's facts are the case's, whichever person a test gives them on", as_of: "2026-10-01", given: {snap_entitled_to_heating_cooling_allowance: false}, others: {p2: {home_incurs_electricity_cost: true, home_incurs_water_cost: true}}, expect: 390}
