id: CO-3701
name: "SNAP: sponsor income deemed"
identifier: snap_sponsor_deemed_income
kind: derived
type: money
scope: person-month
program: SNAP
meaning: "The unearned income SNAP counts to this person for the month from the person's sponsor (10 CCR 2506-1 4.305.2.C-D; 7 CFR 273.4(c)(2)): for an eligible non-citizen whose sponsor's income is deemed, this person's share of the sponsor's income after the deeming reductions (snap_sponsor_income_after_reductions divided by snap_sponsor_deeming_divisor), or the money the sponsor paid the person in the month if that is more (4.305.2.D.4); for anyone else, the money a sponsor paid the person, which is ordinary unearned income."
precision: "Deeming applies only to an eligible non-citizen (4.305.2.C, snap_is_eligible_non_citizen, CO-308) to whom no exemption applies (snap_sponsor_deeming_applies, CO-2337); an ineligible non-citizen's counted income excludes it (273.4(c)(5)). Money paid in excess of the deemed share is added, so the person's income from the sponsor is the greater of the two. The money is this person's own receipt and is not divided. A citizen is out at the first test, so nothing about a sponsor is read. Final verification pass 2 N-2: a member who is ineligible until the sponsor information or the status verification is provided (snap_is_ineligible_pending_non_citizen_verification, CO-4154) is an ineligible non-citizen, and 4.505.7.C (S2954) counts that member's income and resources \"excluding the attributed income and resources of the non-citizen's sponsor\". Coverage pass 3 N3-2: the test is [not, snap_is_ineligible_non_citizen] (CO-310), the one list of the grounds on which a non-citizen member is ineligible (status not verified by the due date, sponsor information outstanding, and a member the household declines to document, declines_to_provide_immigration_documentation, CO-4687; 4.505.6.J, S902), so a ground added to CO-310 stops deeming here too (4.305.2.C: \"Only when a sponsored non-citizen is an eligible non-citizen\"). Receipt records, migration phase 1: the money the sponsor paid is the month's receipts of the kind sponsor_payment (snap_receipt_treatment_table: sponsor_deeming), 0 when the receipts are not stated."
derived: [case, [[all, snap_is_eligible_non_citizen, [not, snap_is_ineligible_non_citizen], snap_sponsor_deeming_applies], [max, [otherwise, [sum_receipts, receipts, [all, ["=", [lookup, snap_receipt_treatment_table, [receipt, kind]], sponsor_deeming], [received_in, [month]]], [receipt, amount]], 0], ["/", snap_sponsor_income_after_reductions, snap_sponsor_deeming_divisor]]], [else, [otherwise, [sum_receipts, receipts, [all, ["=", [lookup, snap_receipt_treatment_table, [receipt, kind]], sponsor_deeming], [received_in, [month]]], [receipt, amount]], 0]]]
sources: [S902, S2502, S2503, S1619, S2954]
implemented: engine
tags: [snap, immigration, income]
rationale: "Final verification F-2 (docs/reviews/final-snap.md): no item deemed a sponsor's income, so an eligible sponsored lawful permanent resident's household was budgeted without it. snap_person_gross_income (CO-332) adds this amount as unearned income."
tests:
  - {id: CO-3701-T1, month: "2026-10", as_of: "2026-10-01", given: {snap_is_eligible_non_citizen: true, snap_is_ineligible_non_citizen: false, snap_sponsor_deeming_applies: true, snap_sponsor_income_after_reductions: 2955, snap_sponsor_deeming_divisor: 2}, title: "Deeming applies: $2,955 shared by 2 = $1,477.50", expect: 1477.5}
  - {id: CO-3701-T2, month: "2026-10", as_of: "2026-10-01", given: {snap_is_eligible_non_citizen: true, snap_is_ineligible_non_citizen: false, snap_sponsor_deeming_applies: true, snap_sponsor_income_after_reductions: 2955, snap_sponsor_deeming_divisor: 2, receipts: [{kind: social_security}, {kind: ssi}, {kind: pension}, {kind: unemployment_compensation}, {kind: child_support}, {kind: colorado_works_cash}, {kind: adult_financial_cash}, {kind: tax_exempt_interest}, {kind: sponsor_payment, amount: 1600}, {kind: other_taxable}, {kind: other_nontaxable}]}, title: "The sponsor pays $1,600, more than the $1,477.50 share: $1,600", expect: 1600}
  - {id: CO-3701-T3, month: "2026-10", as_of: "2026-10-01", given: {snap_is_eligible_non_citizen: true, snap_is_ineligible_non_citizen: false, snap_sponsor_deeming_applies: false, receipts: [{kind: social_security}, {kind: ssi}, {kind: pension}, {kind: unemployment_compensation}, {kind: child_support}, {kind: colorado_works_cash}, {kind: adult_financial_cash}, {kind: tax_exempt_interest}, {kind: sponsor_payment, amount: 200}, {kind: other_taxable}, {kind: other_nontaxable}]}, title: "Indigent non-citizen (no deeming): only the $200 the sponsor actually pays", expect: 200}
  - {id: CO-3701-T4, month: "2026-10", as_of: "2026-10-01", given: {snap_is_eligible_non_citizen: false}, title: "A citizen: nothing", expect: 0}
  - {id: CO-3701-T5, month: "2026-10", as_of: "2026-10-01", given: {snap_is_eligible_non_citizen: true, snap_is_ineligible_non_citizen: true, snap_sponsor_deeming_applies: true, snap_sponsor_income_after_reductions: 2955, snap_sponsor_deeming_divisor: 2, receipts: [{kind: social_security}, {kind: ssi}, {kind: pension}, {kind: unemployment_compensation}, {kind: child_support}, {kind: colorado_works_cash}, {kind: adult_financial_cash}, {kind: tax_exempt_interest}, {kind: other_taxable}, {kind: other_nontaxable}]}, title: "N-2: sponsor information outstanding - only what the sponsor actually paid", expect: 0}
  - {id: CO-3701-T6, month: "2026-10", as_of: "2026-10-01", given: {snap_is_eligible_non_citizen: true, declines_to_provide_immigration_documentation: true, snap_meets_citizenship_requirement: true, snap_is_ineligible_pending_non_citizen_verification: false, snap_sponsor_deeming_applies: true, snap_sponsor_income_after_reductions: 2955, snap_sponsor_deeming_divisor: 2, receipts: [{kind: social_security}, {kind: ssi}, {kind: pension}, {kind: unemployment_compensation}, {kind: child_support}, {kind: colorado_works_cash}, {kind: adult_financial_cash}, {kind: tax_exempt_interest}, {kind: other_taxable}, {kind: other_nontaxable}]}, title: "Coverage pass 3 N3-2: the household declines to document her status - she is an ineligible non-citizen and only what the sponsor paid counts", expect: 0}
