id: CO-5111
name: "SNAP: irregular earnings of the month are excluded"
identifier: snap_irregular_earnings_are_excluded
kind: derived
type: yes/no
scope: person-month
program: SNAP
meaning: "The person's earnings records received in the month include infrequent or irregular income (a record marked irregular, of a kind that is not a cost of doing business) and the quarter's infrequent or irregular income is within the limit (snap_irregular_income_is_within_quarterly_limit, CO-5110), so SNAP excludes the month's irregular earnings (10 CCR 2506-1 4.405.A; 7 CFR 273.9(c)(2)); false in a month with no irregular earnings."
precision: "A month with no irregular earnings has nothing to exclude, so the quarter is not read (the receipts of the quarter may then be unstated). The pay it excludes is read by snap_person_counted_wages (CO-5113), and the business receipts by snap_self_employment_gross_receipts (CO-5114) and snap_farm_gross_receipts (CO-5115). A meals-only or room-only boarder record is left out, as in CO-5110."
derived: ["case",[["=",["sum_receipts","earnings",["all",["receipt","irregular"],["received_in",["month"]],["not",["in",["lookup","snap_earnings_treatment_table",["receipt","kind"]],["deducted","deducted_from_boarder_payments","not_deducted","not_deducted_no_rule_found"]]],["not",["all",["=",["lookup","snap_earnings_treatment_table",["receipt","kind"]],"counted_above_boarder_allowance"],["in",["receipt","provides"],["board_only","room_only"]]]]],["receipt","amount"]],0],false],["else","snap_irregular_income_is_within_quarterly_limit"]]
sources: [S3100, S3128]
implemented: engine
tags: [snap, income]
rationale: "Earned-income records, step E1 (SNAP; docs/reviews/records-earnings-snap.md): SNAP reads earned income from the earnings records (CO-5100) through its counting table (snap_earnings_treatment_table, CO-5101) instead of the scalar earned-income facts and their parts. Replaces the irregular-earnings term of snap_excluded_earned_income (CO-2338), which read infrequent_or_irregular_earned_income_received (CO-4010)."
tests:
  - {id: CO-5111-T1, month: "2026-11", as_of: "2026-11-15", given: {earnings: [{kind: wages, amount: 1000}]}, title: "No irregular earnings in the month: false, whatever the quarter (receipts not stated)", expect: false}
  - {id: CO-5111-T2, month: "2026-11", as_of: "2026-11-15", given: {receipts: [], earnings: [{kind: wages, amount: 1000}, {kind: wages, amount: 20, irregular: true, month: "2026-11"}]}, title: "$20 of odd-job pay, the only irregular income in the quarter: excluded", expect: true}
  - {id: CO-5111-T3, month: "2026-11", as_of: "2026-11-15", given: {receipts: [{kind: other_nontaxable, amount: 25, irregular: true, month: "2026-10"}], earnings: [{kind: wages, amount: 20, irregular: true, month: "2026-11"}]}, title: "$20 of odd-job pay and $25 of irregular unearned income in October: $45, counted", expect: false}
