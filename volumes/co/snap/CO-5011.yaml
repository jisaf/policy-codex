  - {id: CO-4324, reason: "Both convert each record by 4.402.A.2 and place it by its regular date, its interval and its source's dates with the same expression (coverage pass 4 for SNAP, S4-1 to S4-3): snap_person_wages for pay, this item for receipts; a change to one is a change to the other."}
rationale: "Receipt records, migration phase 1: SNAP's recurring unearned income read from the receipts through its counting table, with the earmarks and the frequency of each receipt."
tests:
  - {id: CO-5011-T1, month: "2026-10", as_of: "2026-10-15", given: {receipts: [{kind: social_security, amount: 1420}, {kind: pension, amount: 610}, {kind: educational_assistance, amount: 300}]}, title: "Social Security and a pension counted; educational assistance excluded (4.405.1)", expect: 2030}
  - {id: CO-5011-T2, month: "2027-02", as_of: "2027-02-15", given: {receipts: [{kind: unemployment_compensation, amount: 500, month: "2027-02", frequency: weekly, per_payment: 100}, {kind: interest_and_dividends, amount: 300, month: "2027-02", frequency: quarterly, per_payment: 300}]}, title: "Receipt spike family F3: two incomes paid other than monthly, each converted (4.402.A.2)", expect: 529.9999}
  - {id: CO-5011-T3, month: "2026-11", as_of: "2026-11-15", given: {receipts: [{kind: pension, amount: 300, recouped: 100, recouped_for_intentional_violation: 40}, {kind: child_support, amount: 300, transferred_to_child_support_agency: 100}]}, title: "Recoupment other than for an intentional violation (D.1) and IV-D child support (D.2) left out", expect: 440}
  - {id: CO-5011-T4, month: "2026-11", as_of: "2026-11-15", given: {receipts: [{kind: other_nontaxable, amount: 3000, frequency: once, month: "2026-11"}]}, title: "A nonrecurring lump sum is excluded (4.405.E)", expect: 0}
  - {id: CO-5011-T5, month: "2026-11", as_of: "2026-11-15", given: {}, title: "Receipts not stated: cannot determine", expect: unknown}
  # Coverage pass 4 for SNAP (docs/reviews/coverage4-snap.md), S4-1, S4-2, S4-3, S4-5, S4-6, S4-7: expected values from 10 CCR 2506-1 4.402.A.2 (S3112), 4.402.B.2 (S4720), 4.402.1.B (S4722), 4.405.E (S3476), 4.402.2 (S4724) and 7 CFR 273.9(b)(2)(ii), (c)(11)(i), (c)(15) (S4725, S4726).
  - {"id": "CO-5011-T6", "title": "S4-1 (DW1): unemployment of $300 paid on the four Fridays of February 2027 (dated, weekly): 4 x (300 x 4.3 / 4) = 1,290, the stream's figure", "month": "2027-02", "as_of": "2027-02-15", "given": {"receipts": [{"kind": "unemployment_compensation", "amount": 300, "frequency": "weekly", "date": "2027-02-05"}, {"kind": "unemployment_compensation", "amount": 300, "frequency": "weekly", "date": "2027-02-12"}, {"kind": "unemployment_compensation", "amount": 300, "frequency": "weekly", "date": "2027-02-19"}, {"kind": "unemployment_compensation", "amount": 300, "frequency": "weekly", "date": "2027-02-26"}]}, "expect": 1290}
  - {"id": "CO-5011-T7", "title": "S4-1 (DQ1): quarterly dividends of $900 paid 2026-11-15 and 2027-02-15, read in January 2027 (the November payment's interval): 900 x 0.333333 = 299.9997", "month": "2027-01", "as_of": "2027-01-15", "given": {"receipts": [{"kind": "interest_and_dividends", "amount": 900, "frequency": "quarterly", "date": "2026-11-15"}, {"kind": "interest_and_dividends", "amount": 900, "frequency": "quarterly", "date": "2027-02-15"}]}, "expect": 299.9997}
  - {"id": "CO-5011-T8", "title": "S4-2 (B2): SSI of $994 paid on the 1st; May 2027's payment came April 30 (regular_date 2027-05-01): April = 994, not 1,988 (4.402.B.2)", "month": "2027-04", "as_of": "2027-04-15", "given": {"receipts": [{"kind": "ssi", "amount": 994, "frequency": "monthly", "date": "2027-04-01"}, {"kind": "ssi", "amount": 994, "frequency": "monthly", "date": "2027-04-30", "regular_date": "2027-05-01"}]}, "expect": 994}
  - {"id": "CO-5011-T9", "title": "S4-2 (B2): the same payments in May: the April 30 payment is May's = 994", "month": "2027-05", "as_of": "2027-05-15", "given": {"receipts": [{"kind": "ssi", "amount": 994, "frequency": "monthly", "date": "2027-04-01"}, {"kind": "ssi", "amount": 994, "frequency": "monthly", "date": "2027-04-30", "regular_date": "2027-05-01"}]}, "expect": 994}
  - {"id": "CO-5011-T10", "title": "S4-3: weekly unemployment ($300 a week) as a stream that ended 2027-01-20, read in February: 0", "month": "2027-02", "as_of": "2027-02-15", "given": {"receipts": [{"kind": "unemployment_compensation", "amount": 900, "frequency": "weekly", "per_payment": 300, "end_date": "2027-01-20"}]}, "expect": 0}
  - {"id": "CO-5011-T11", "title": "S4-1: the same stream in January, the month it ends: no full month, the month's $900 as received", "month": "2027-01", "as_of": "2027-01-15", "given": {"receipts": [{"kind": "unemployment_compensation", "amount": 900, "frequency": "weekly", "per_payment": 300, "end_date": "2027-01-20"}]}, "expect": 900}
  - {"id": "CO-5011-T12", "title": "S4-5 (DIV): a $1,200 State diversion paid once in February 2027 for expenses from February 1 to May 31 (120 days, more than 90): 1,200 / 4 months = 300 in March (4.405.E, 4.402.2)", "month": "2027-03", "as_of": "2027-03-15", "given": {"receipts": [{"kind": "colorado_works_diversion", "amount": 1200, "frequency": "once", "month": "2027-02", "covers_from": "2027-02-01", "covers_through": "2027-05-31", "recurs_within_twelve_months": false}]}, "expect": 300}
  - {"id": "CO-5011-T13", "title": "S4-5: a $600 diversion paid once for February 1 to April 1 (60 days), not expected again within twelve months: a non-recurring lump sum, excluded: 0", "month": "2027-02", "as_of": "2027-02-15", "given": {"receipts": [{"kind": "colorado_works_diversion", "amount": 600, "frequency": "once", "month": "2027-02", "covers_from": "2027-02-01", "covers_through": "2027-04-01", "recurs_within_twelve_months": false}]}, "expect": 0}
  - {"id": "CO-5011-T14", "title": "S4-5: the same 60-day diversion expected again within twelve months: not excluded; 600 / 3 months (February to April) = 200", "month": "2027-02", "as_of": "2027-02-15", "given": {"receipts": [{"kind": "colorado_works_diversion", "amount": 600, "frequency": "once", "month": "2027-02", "covers_from": "2027-02-01", "covers_through": "2027-04-01", "recurs_within_twelve_months": true}]}, "expect": 200}
