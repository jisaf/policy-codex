id: CO-5011
name: "SNAP: a person's counted recurring receipts"
identifier: snap_counted_recurring_receipts
kind: derived
type: money
scope: person-month
program: SNAP
meaning: "The person's recurring receipts of the month that SNAP's counting table counts (counted, counted because no rule excludes it, counted beyond the quarterly limit, a recurring Colorado Works diversion), each at its monthly amount: a receipt paid weekly, every two weeks, twice a month or less often than monthly converted by the 4.402.A.2 multiplier (snap_income_conversion_rate_table; 7 CFR 273.10(c)(2)(i)), any other at the amount received in the month; less the parts of it 4.405 leaves out: an overpayment recouped from the same source other than for an intentional failure to comply (D.1), child support turned over to the IV-D agency (D.2), a former spouse's share of military retirement (A.11), money received for a person living elsewhere (B) and income set aside under a PASS (A.22). Plus foster care payments when a foster individual placed with the person is a member of the household (snap_foster_care_payments_are_counted; 7 CFR 273.9(b)(2)(ii), (c)(15)), and a Colorado Works diversion paid once that covers more than snap_diversion_lump_sum_max_days (90) days of expenses or is expected again within twelve months, averaged over the months it covers (4.405.E, 4.402.2)."
precision: "A receipt paid once is a nonrecurring lump sum, excluded (4.405.E), except a Colorado Works diversion that covers more than ninety days of expenses or is expected to occur again in a twelve-month period (4.405.E, second paragraph, S3476; coverage pass 2 C2-5, whose condition lived in the retired lump-sum fact CO-3367; coverage pass 4 S4-5): it is not a nonrecurring lump sum, and it is \"income intended to cover a specific period of time ... divided by the number of months the income is intended to cover\" (4.402.2, S4724), so its amount is divided by the months from the month of covers_from through the month of covers_through and counted in each of them. A diversion of ninety days or less not expected again is excluded; its period's dates and whether it recurs are required where read (decision 4 of 2026-11-23). Coverage pass 4 for SNAP (docs/reviews/coverage4-snap.md, S4-1 to S4-4): a record is placed in the month of its regular_date when it states one, since pay or a benefit that came early or late because of a holiday, a weekend, a changed pay date, a mailing cycle or the employee's request is counted by its regular schedule (10 CCR 2506-1 4.402.B.1-3, S4720; 4.403.A.3, S4721), else in the month it came in; a stream (a record with no month and no date) recurs only from the month its job or source began through the month it ended (job_start_date and job_end_date; start_date and end_date on a receipt), since pay after a job ends or before it begins is not anticipated with reasonable certainty (4.402.1.B, S4722); a pay or receipt of a schedule paid less often than monthly (every other month, quarterly, twice a year, annually) that states its month or its date is one payment of the schedule, counted at its amount times the 4.402.A.2 multiplier in each month of its interval, from its (regular) month through the month before the next payment is due, so a quarterly payment is a third of itself in each of three months, not a third in one month (S4-1); a dated weekly or biweekly pay or receipt is its amount times the multiplier divided by the paydays its schedule has in the month, counted from its regular date. Each receipt is converted as snap_person_wages (CO-4324) converts a pay (registered siblings). A receipt with no date that states its month is converted by its per_payment (coverage pass 3 C3-4, CF-3); a dated weekly or biweekly receipt needs no per_payment. A stream whose start_date or end_date falls in the month is read at its amount (\"When a full month's income is anticipated\", 4.402.A.2). Foster care payments (S4-6): 273.9(c)(15) (S4725) excludes \"Governmental foster care payments received by households with foster care individuals who are considered to be boarders\", and 273.9(b)(2)(ii) counts them for \"children or adults who are considered members of the household\"; the membership test is read only when the person states such a payment. Replaces the periodic-income facts (CO-4330 to CO-4332: one such income per person); a receipt's frequency and per_payment now state it for each receipt. In a destitute household's month of application a record dated after the date of application is not counted (4.406.1.A, S2964; coverage pass 4 S4-14). Field sweep fix round (FS-SNAP-2): 10 CCR 2506-1 4.405.E (S3476): \"Money received in the form of non-recurring lump sum payments, includes ... retroactive lump-sum Social Security, SSI, public assistance, railroad retirement benefits or other payments\". A receipt marked retroactive is such a lump sum whatever its frequency states, so it is read as a receipt paid once (frequency once) is: not recurring income (it is a resource from the month received, 4.405.E last paragraph, S4691). Before, only frequency once was tested, and a retroactive payment stated with its month and no frequency (an undated record's frequency is monthly) was counted as the month's income."
