id: CO-1389
name: "SNAP: person's pending eligibility verification count"
identifier: snap_person_pending_verification_count
kind: derived
type: whole number
scope: person-month
program: SNAP
role: outcome
meaning: "The number of eligibility factors (everything except deductible expenses) SNAP requires for this person that are not yet verified: the sum of the person's pending identity, citizenship, immigration status, SSN, residency, income, resources, household composition, disability, age, work hours and sponsor items."
derived: ["+", [case, [snap_identity_verification_is_pending, 1], [else, 0]], [case, [snap_citizenship_verification_is_pending, 1], [else, 0]], [case, [snap_immigration_status_verification_is_pending, 1], [else, 0]], [case, [snap_ssn_verification_is_pending, 1], [else, 0]], [case, [snap_residency_verification_is_pending, 1], [else, 0]], [case, [snap_earned_income_verification_is_pending, 1], [else, 0]], [case, [snap_unearned_income_verification_is_pending, 1], [else, 0]], [case, [snap_resources_verification_is_pending, 1], [else, 0]], [case, [snap_household_composition_verification_is_pending, 1], [else, 0]], [case, [snap_disability_verification_is_pending, 1], [else, 0]], [case, [snap_age_verification_is_pending, 1], [else, 0]], [case, [snap_work_hours_verification_is_pending, 1], [else, 0]], [case, [snap_sponsor_verification_is_pending, 1], [else, 0]]]
sources: [S800, S801, S811, S817]
implemented: engine
tags: [verification, snap]
rationale: "A missing eligibility verification can deny the application (273.2(g)(3), 4.205.2.B), while a missing expense only loses a deduction; the status needs the two counts separately. Review U-1: the count sums the named per-element items, so a worker can trace it to the outstanding document."
tests:
  - {id: CO-1389-T1, month: "2026-10", as_of: "2026-10-01", given: {snap_citizenship_verification_is_pending: false, snap_immigration_status_verification_is_pending: false, snap_ssn_verification_is_pending: false, snap_residency_verification_is_pending: false, snap_earned_income_verification_is_pending: true, snap_unearned_income_verification_is_pending: false, snap_resources_verification_is_pending: false, snap_household_composition_verification_is_pending: false, snap_disability_verification_is_pending: false, snap_age_verification_is_pending: false, snap_work_hours_verification_is_pending: false, snap_sponsor_verification_is_pending: false, snap_identity_verification_is_pending: true}, expect: 2}
  - {id: CO-1389-T2, month: "2026-10", as_of: "2026-10-01", given: {snap_citizenship_verification_is_pending: false, snap_immigration_status_verification_is_pending: false, snap_ssn_verification_is_pending: false, snap_residency_verification_is_pending: false, snap_earned_income_verification_is_pending: false, snap_unearned_income_verification_is_pending: false, snap_resources_verification_is_pending: false, snap_household_composition_verification_is_pending: false, snap_disability_verification_is_pending: false, snap_age_verification_is_pending: false, snap_work_hours_verification_is_pending: false, snap_sponsor_verification_is_pending: false, snap_identity_verification_is_pending: false}, expect: 0}
  - {id: CO-1389-T3, month: "2026-10", as_of: "2026-10-01", given: {snap_citizenship_verification_is_pending: false, snap_immigration_status_verification_is_pending: true, snap_ssn_verification_is_pending: false, snap_residency_verification_is_pending: false, snap_earned_income_verification_is_pending: false, snap_unearned_income_verification_is_pending: false, snap_resources_verification_is_pending: false, snap_household_composition_verification_is_pending: false, snap_disability_verification_is_pending: false, snap_age_verification_is_pending: false, snap_work_hours_verification_is_pending: false, snap_sponsor_verification_is_pending: false, snap_identity_verification_is_pending: false}, expect: 1}
