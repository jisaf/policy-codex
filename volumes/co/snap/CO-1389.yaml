id: CO-1389
name: "SNAP: person's pending eligibility verification count"
identifier: snap_person_pending_verification_count
kind: derived
type: whole number
scope: person-month
program: SNAP
meaning: The number of eligibility factors (everything except deductible expenses) SNAP requires for this person that are not yet verified.
derived: ["+", [case, [snap_identity_verification_is_pending, 1], [else, 0]], [case, [[all, snap_requires_verification_of_citizenship, [not, [any, citizenship_verified_by_electronic_data_source, [all, citizenship_verification_document_received, snap_citizenship_document_is_acceptable]]]], 1], [else, 0]], [case, [[all, snap_requires_verification_of_immigration_status, [not, immigration_status_is_verified_or_submitted]], 1], [else, 0]], [case, [[all, snap_requires_verification_of_ssn, [not, ssn_is_verified]], 1], [else, 0]], [case, [[all, snap_requires_verification_of_residency, [not, residency_verification_document_received]], 1], [else, 0]], [case, [[all, snap_requires_verification_of_earned_income, [not, earned_income_verification_document_received]], 1], [else, 0]], [case, [[all, snap_requires_verification_of_unearned_income, [not, unearned_income_is_verified]], 1], [else, 0]], [case, [[all, snap_requires_verification_of_resources, [not, resources_are_verified]], 1], [else, 0]], [case, [[all, snap_requires_verification_of_household_composition, [not, household_composition_verification_document_received]], 1], [else, 0]], [case, [[all, snap_requires_verification_of_disability, [not, disability_is_verified]], 1], [else, 0]], [case, [[all, snap_requires_verification_of_age, [not, age_is_verified]], 1], [else, 0]], [case, [[all, snap_requires_verification_of_work_hours, [not, work_hours_verification_document_received]], 1], [else, 0]]]
sources: [S800, S801, S811, S817]
implemented: engine
tags: [verification, snap]
rationale: A missing eligibility verification can deny the application (273.2(g)(3), 4.205.2.B), while a missing expense only loses a deduction; the status needs the two counts separately.
tests:
  - {id: CO-1389-T1, month: "2026-10", as_of: "2026-10-01", given: {snap_requires_verification_of_citizenship: false, snap_requires_verification_of_immigration_status: false, snap_requires_verification_of_ssn: false, snap_requires_verification_of_residency: false, snap_requires_verification_of_earned_income: true, snap_requires_verification_of_unearned_income: false, snap_requires_verification_of_resources: false, snap_requires_verification_of_household_composition: false, snap_requires_verification_of_disability: false, snap_requires_verification_of_age: false, snap_requires_verification_of_work_hours: false, snap_identity_verification_is_pending: true, earned_income_verification_document_received: false}, expect: 2}
  - {id: CO-1389-T2, month: "2026-10", as_of: "2026-10-01", given: {snap_requires_verification_of_citizenship: true, snap_requires_verification_of_immigration_status: false, snap_requires_verification_of_ssn: false, snap_requires_verification_of_residency: false, snap_requires_verification_of_earned_income: false, snap_requires_verification_of_unearned_income: false, snap_requires_verification_of_resources: false, snap_requires_verification_of_household_composition: false, snap_requires_verification_of_disability: false, snap_requires_verification_of_age: false, snap_requires_verification_of_work_hours: false, snap_identity_verification_is_pending: false, citizenship_verified_by_electronic_data_source: false, citizenship_verification_document_received: true, citizenship_verification_document_type: us_passport}, expect: 0}
  - {id: CO-1389-T3, month: "2026-10", as_of: "2026-10-01", given: {snap_requires_verification_of_citizenship: false, snap_requires_verification_of_immigration_status: true, snap_requires_verification_of_ssn: false, snap_requires_verification_of_residency: false, snap_requires_verification_of_earned_income: false, snap_requires_verification_of_unearned_income: false, snap_requires_verification_of_resources: false, snap_requires_verification_of_household_composition: false, snap_requires_verification_of_disability: false, snap_requires_verification_of_age: false, snap_requires_verification_of_work_hours: false, snap_identity_verification_is_pending: false, immigration_status_verified_by_electronic_data_source: false, immigration_status_verification_document_received: false}, expect: 1}
