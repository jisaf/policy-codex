id: CO-2318
name: "SNAP: is disqualified for a voluntary quit"
identifier: snap_is_disqualified_for_voluntary_quit
kind: derived
type: yes/no
scope: person-month
program: SNAP
meaning: "The person is serving a SNAP disqualification for a voluntary quit in the month evaluated: the quit without good cause (snap_voluntary_quit_date) occurred within sixty days before the date of application or any time after it (4.308.B), and the month evaluated falls in the disqualification period, which begins in snap_voluntary_quit_disqualification_start_month and lasts one month the first time, three the second and six the third or a later time (4.310.8.A-B). The person is then a disqualified member (4.310.8.A). A person who becomes exempt from the work requirements during the period is eligible again (4.310.8.C-D; 7 CFR 273.7(j)(4)): the disqualification is not served while the person is exempt from work registration (snap_is_exempt_from_work_registration, CO-405)."
precision: "False when no voluntary quit is stated. The sixty days count back from snap_application_date (CO-1746). Coverage pass 4 for SNAP S4-11 (OQ-1263 resolved): read for the month evaluated, since prospective budgeting reads \"anticipated income and circumstances during the issuance month\" (10 CCR 2506-1 4.402.1.A, S4734), so each month of the period is a month of disqualification and a month outside it is not; before, the determination month's answer was read in every month, since the disqualified-member items it feeds (snap_is_ineligible_member, CO-311) were stated per person. Coverage review C-8: the exemption is read as of the determination, not from \"the date exemption information was provided to the local office\" (4.310.8.D, S3058); a determination made after the member becomes exempt and reports it is the one that ends the disqualification. Coverage pass 3 N3-P2-2: a person 15 or younger or 60 or older is exempt from work registration (4.310.3.A, S126), so a disqualification is not served once the person turns 60 (4.310.8.C-D); the age range is read here (snap_work_registration_min_age, snap_work_registration_max_age, as CO-406 reads it), since snap_is_exempt_from_work_registration (CO-405) carries only the other exemptions and is also read by CO-414 and Medicaid. Coverage pass 4 S4-11: the age exemptions are read in the month and met on any day of it (OQ-1262; docs/operators.md, Ages in a month): younger than 16 on the first day (the age on the first day of the month), 60 or older on the last day (the age on the last day of the month); before, the age on the determination date."
derived: [case, [[unknown, snap_voluntary_quit_date], false], [else, [all, [">=", snap_voluntary_quit_date, [days_after, ["-", 0, snap_voluntary_quit_lookback_days], snap_application_date]], ["<=", snap_voluntary_quit_disqualification_start_month, [month]], ["<", [month], [months_after, [case, [["=", snap_work_requirement_violation_number, 1], snap_level_sanction_first_months], [["=", snap_work_requirement_violation_number, 2], snap_level_sanction_second_months], [else, snap_level_sanction_third_months]], snap_voluntary_quit_disqualification_start_month]], [not, snap_is_exempt_from_work_registration], [not, [otherwise, [any, ["<", [years_between, date_of_birth, [first_day, [month]]], snap_work_registration_min_age], [">", [years_between, date_of_birth, [days_after, -1, [first_day, [month_after, [month]]]]], snap_work_registration_max_age]], false]]]]]
sources: [S1611, S1612, S3058, S3059, S4734]
implemented: engine
tags: [snap, work_registration, legal]
open: [OQ-1262]
rationale: "OQ-38 (P-8): 4.308.A (S1611) makes a voluntary quit without good cause an independent ground of SNAP ineligibility, and 4.310.8 (S1612) sets its period; no item computed it. snap_is_ineligible_member (CO-311) and snap_is_disqualified_member_counted_in_full (CO-2302) read it."
tests:
  - {id: CO-2318-T1, month: "2026-10", title: "No voluntary quit stated", as_of: "2026-10-01", given: {}, expect: false}
  - {id: CO-2318-T2, month: "2026-10", title: "First quit 30 days before applying; one month starting October", as_of: "2026-10-05", given: {snap_voluntary_quit_date: "2026-09-01", snap_application_date: "2026-10-01", snap_work_requirement_violation_number: 1, snap_voluntary_quit_disqualification_start_month: "2026-10", snap_is_exempt_from_work_registration: false}, expect: true}
  - {id: CO-2318-T3, month: "2026-11", title: "First quit - the one month has ended by November", as_of: "2026-11-05", given: {snap_voluntary_quit_date: "2026-09-01", snap_application_date: "2026-10-01", snap_work_requirement_violation_number: 1, snap_voluntary_quit_disqualification_start_month: "2026-10"}, expect: false}
  - {id: CO-2318-T4, month: "2026-12", title: "Second violation - three months, so December is still in the period", as_of: "2026-12-05", given: {snap_voluntary_quit_date: "2026-09-01", snap_application_date: "2026-10-01", snap_work_requirement_violation_number: 2, snap_voluntary_quit_disqualification_start_month: "2026-10", snap_is_exempt_from_work_registration: false}, expect: true}
  - {id: CO-2318-T5, month: "2027-03", title: "Fourth violation reads as the third - six months, so March 2027 is still in the period", as_of: "2027-03-05", given: {snap_voluntary_quit_date: "2026-09-01", snap_application_date: "2026-10-01", snap_work_requirement_violation_number: 4, snap_voluntary_quit_disqualification_start_month: "2026-10", snap_is_exempt_from_work_registration: false}, expect: true}
  - {id: CO-2318-T6, month: "2026-10", title: "4.308.B - a quit 61 days before the application is not sanctioned", as_of: "2026-10-05", given: {snap_voluntary_quit_date: "2026-07-31", snap_application_date: "2026-09-30", snap_work_requirement_violation_number: 1, snap_voluntary_quit_disqualification_start_month: "2026-10"}, expect: false}
  - {id: CO-2318-T7, month: "2026-10", title: "Before the period begins the person is not yet disqualified", as_of: "2026-10-05", given: {snap_voluntary_quit_date: "2026-09-20", snap_application_date: "2026-10-01", snap_work_requirement_violation_number: 1, snap_voluntary_quit_disqualification_start_month: "2026-11"}, expect: false}
  - {id: CO-2318-T8, month: "2026-12", title: "Coverage review C-8: the second violation's three months, but the member had a baby and now cares for a child under 6 - exempt, so not disqualified in December (4.310.8.D)", as_of: "2026-12-05", given: {snap_voluntary_quit_date: "2026-09-01", snap_application_date: "2026-10-01", snap_work_requirement_violation_number: 2, snap_voluntary_quit_disqualification_start_month: "2026-10", snap_is_exempt_from_work_registration: true}, expect: false}
  # Born 1966-12-05: 60 on December 31, so 60 or older in December (S4-11: the last day; restated from a stated age of 60).
  - {id: CO-2318-T9, title: "Coverage pass 3 N3-P2-2: a quit within the disqualification, but the person is now 60 - exempt, not served", month: "2026-12", as_of: "2026-12-10", given: {snap_voluntary_quit_date: "2026-10-01", snap_application_date: "2026-11-01", snap_voluntary_quit_disqualification_start_month: "2026-12", snap_work_requirement_violation_number: 1, snap_is_exempt_from_work_registration: false, date_of_birth: "1966-12-05"}, expect: false}
  # Coverage pass 4 S4-11 (OQ-1263 resolved): a second violation, three months from October 2026 (4.310.8.B, S1612); born 1966-11-10: 59 on
  # October 31, 60 on November 30 (exempt, 4.310.3.A, S126, so not served: 4.310.8.C-D, S3058). Determined 2026-11-20: October true (59 all
  # month, in the period), November false (60), December false. Before, the age on 2026-11-20 (60): false in October too.
  - {id: CO-2318-T10, month: "2026-10", title: "S4-11: October - 59 all month and in the period: disqualified", as_of: "2026-11-20", given: {snap_voluntary_quit_date: "2026-09-01", snap_application_date: "2026-10-01", snap_work_requirement_violation_number: 2, snap_voluntary_quit_disqualification_start_month: "2026-10", snap_is_exempt_from_work_registration: false, date_of_birth: "1966-11-10"}, expect: true}
  - {id: CO-2318-T11, month: "2026-11", title: "S4-11: November - 60 on November 30: exempt, the period not served", as_of: "2026-11-20", given: {snap_voluntary_quit_date: "2026-09-01", snap_application_date: "2026-10-01", snap_work_requirement_violation_number: 2, snap_voluntary_quit_disqualification_start_month: "2026-10", snap_is_exempt_from_work_registration: false, date_of_birth: "1966-11-10"}, expect: false}
  # The period read in the month evaluated: the first violation's one month is October; determined in November 2026, October is disqualified
  # and November is not (before, the determination month's answer, false, in October too).
  - {id: CO-2318-T12, month: "2026-10", title: "S4-11: a determination in November reads October in the period", as_of: "2026-11-05", given: {snap_voluntary_quit_date: "2026-09-01", snap_application_date: "2026-10-01", snap_work_requirement_violation_number: 1, snap_voluntary_quit_disqualification_start_month: "2026-10", snap_is_exempt_from_work_registration: false, date_of_birth: "1985-01-01"}, expect: true}
