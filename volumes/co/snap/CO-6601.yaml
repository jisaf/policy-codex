id: CO-6601
name: "SNAP: foster care payments are counted"
identifier: snap_foster_care_payments_are_counted
kind: derived
type: yes/no
scope: person
program: SNAP
meaning: "A foster individual placed in this person's home (the foster_parent role toward a person who lives with this person) buys food and prepares meals with this person, so the household providing the foster care has asked that the individual be a member and the governmental foster care payments it receives are counted as unearned income (7 CFR 273.9(b)(2)(ii), S4725: \"foster care payments for children or adults who are considered members of the household\"; 273.1(c)(4), S3651: foster care individuals \"may participate ... as members of the household providing the foster care services, only at the request of the household providing the foster care\"). False when no foster individual placed with the person is such a member: a foster individual who is not is a boarder, and the payments are excluded (273.9(c)(15), S4725: \"Governmental foster care payments received by households with foster care individuals who are considered to be boarders\"; 10 CCR 2506-1 4.304.3.B.1, S3475: a foster child not included \"will not have their income ... included\")."
precision: "Coverage pass 4 for SNAP, S4-6. Read only for a person who states a foster care payment (a receipt whose row in snap_receipt_treatment_table is counted_if_foster_individual_is_member) or a difficulty of care payment marked foster_care (snap_earnings_treatment_table: counted_unless_foster_care_boarder), so a person with no such payment is never asked for relationships. Membership is read from the buys_prepares_with role between the payee and the foster individual, the one edge by which a foster individual joins the foster household (snap_household_members, CO-305, never crosses a foster_parent edge); reading CO-305 itself would make a cycle (household, the separate elderly and disabled household's income test, gross income, this item). Living together is lives_with (CO-1925), read as true where no dwelling is stated (convention rule 17); a foster individual not declared in the case is not a member. A record does not say which foster individual a payment is for, so where one foster individual placed with the person is a member and another is not the payments are counted in full (OQ-1260). Relationships not stated: cannot determine."
derived: ["exists_related", ["foster_parent"], ["all", ["otherwise", ["in_group", ["P"], "lives_with"], true], ["rel", ["buys_prepares_with"], ["P"]]]]
sources: [S4725, S3651, S3475]
implemented: engine
tags: [snap, income]
open: [OQ-1260]
rationale: "Coverage pass 4 for SNAP (docs/reviews/coverage4-snap.md), S4-6: the receipt row counted every foster care payment, and the earnings row every difficulty of care payment, whatever the foster individual's membership; the LEAP and CCCAP rows were fixed for the same class in pass 4 (X4-2)."
