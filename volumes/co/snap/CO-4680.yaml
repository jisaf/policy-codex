id: CO-4680
name: "SNAP: household ineligibility ground"
identifier: snap_household_ineligibility_ground
kind: derived
type: one of
options: [none, no_eligible_members, fdpir_participation, refused_to_cooperate, substantial_lottery_winnings, resource_transfer_disqualification, striking_member, over_gross_income_limit, over_net_income_limit, over_resource_limit]
scope: person-month
program: SNAP
meaning: "The first ground on which this person's SNAP household is not eligible for the month, before the allotment is computed, or none: no eligible household member; a member's participation in the Food Distribution Program on Indian Reservations in the same period (10 CCR 2506-1 4.303.B); a refusal to cooperate in providing necessary information (7 U.S.C. 2015(c); 4.500.E); a member's substantial lottery or gambling winnings in the month (4.206.E; 7 U.S.C. 2015(s)); a disqualification period for a knowing transfer of resources (4.408.2); a striking member when the household was not eligible the day before the strike (7 CFR 273.1(e)); over the gross income limit, the net income limit or the resource limit (4.206.C.3.b, 4.401). 4.207.3.A computes the allotment \"After eligibility has been established\"."
precision: "The one list of the household's eligibility gates. snap_eligibility_status (CO-387) reports this ground when it is not none; snap_is_eligible (CO-386) requires none; snap_full_month_allotment (CO-2307) and snap_prorated_initial_month_allotment (CO-2308) are 0 unless it is none. A new household bar is added here once and reaches all four. Tested in this order; the first ground that applies is reported."
derived: [case, [[<, snap_eligible_household_size, 1], "no_eligible_members"], [snap_household_participates_in_fdpir, "fdpir_participation"], [[otherwise, snap_household_refused_to_cooperate, false], "refused_to_cooperate"], [snap_household_has_substantial_lottery_winnings, "substantial_lottery_winnings"], [snap_is_disqualified_for_resource_transfer, "resource_transfer_disqualification"], [[not, snap_household_meets_striker_condition], "striking_member"], [[not, snap_meets_gross_income_test], "over_gross_income_limit"], [[not, snap_meets_net_income_test], "over_net_income_limit"], [[not, snap_meets_resource_limit], "over_resource_limit"], [else, "none"]]
sources: [S1616, S103, S105, S737, S1816, S2950, S2952, S2961, S2962, S3057, S3070, S3072, S3122]
nearest: [CO-387]
implemented: engine
tags: [snap, income, resources]
rationale: "Coverage pass 2 N-1 (docs/reviews/coverage2-snap-nonfinancial.md): the FDPIR and refusal-to-cooperate bars were added to snap_is_eligible and snap_eligibility_status but not to the allotment items, which kept their own copy of the gates, so an ineligible household was paid in full (the earlier CF-9 finding was the same drift for the striker gate). No existing item states the gates once; this item does, and the status, the yes/no and both allotments read it, so they cannot drift again."
tests:
  - {id: CO-4680-T1, title: "Every gate passed", as_of: "2026-10-01", month: "2026-10", given: {snap_eligible_household_size: 2, snap_household_participates_in_fdpir: false, snap_household_refused_to_cooperate: false, snap_household_has_substantial_lottery_winnings: false, snap_is_disqualified_for_resource_transfer: false, snap_household_meets_striker_condition: true, snap_meets_gross_income_test: true, snap_meets_net_income_test: true, snap_meets_resource_limit: true}, expect: none}
  - {id: CO-4680-T2, title: "No eligible member", as_of: "2026-10-01", month: "2026-10", given: {snap_eligible_household_size: 0}, expect: no_eligible_members}
  - {id: CO-4680-T3, title: "N-1 (ZZ-F1): a member receives FDPIR in the period", as_of: "2026-10-01", month: "2026-10", given: {snap_eligible_household_size: 2, snap_household_participates_in_fdpir: true}, expect: fdpir_participation}
  - {id: CO-4680-T4, title: "N-1 (ZZ-F2): the household refused to cooperate", as_of: "2026-10-01", month: "2026-10", given: {snap_eligible_household_size: 2, snap_household_participates_in_fdpir: false, snap_household_refused_to_cooperate: true}, expect: refused_to_cooperate}
  - {id: CO-4680-T5, title: "Substantial winnings", as_of: "2026-10-01", month: "2026-10", given: {snap_eligible_household_size: 2, snap_household_participates_in_fdpir: false, snap_household_has_substantial_lottery_winnings: true}, expect: substantial_lottery_winnings}
  - {id: CO-4680-T6, title: "Transfer disqualification", as_of: "2026-10-01", month: "2026-10", given: {snap_eligible_household_size: 2, snap_household_participates_in_fdpir: false, snap_household_has_substantial_lottery_winnings: false, snap_is_disqualified_for_resource_transfer: true}, expect: resource_transfer_disqualification}
  - {id: CO-4680-T7, title: "Striking member", as_of: "2026-10-01", month: "2026-10", given: {snap_eligible_household_size: 2, snap_household_participates_in_fdpir: false, snap_household_has_substantial_lottery_winnings: false, snap_is_disqualified_for_resource_transfer: false, snap_household_meets_striker_condition: false}, expect: striking_member}
  - {id: CO-4680-T8, title: "Over the gross income limit", as_of: "2026-10-01", month: "2026-10", given: {snap_eligible_household_size: 2, snap_household_participates_in_fdpir: false, snap_household_has_substantial_lottery_winnings: false, snap_is_disqualified_for_resource_transfer: false, snap_household_meets_striker_condition: true, snap_meets_gross_income_test: false}, expect: over_gross_income_limit}
  - {id: CO-4680-T9, title: "Over the net income limit", as_of: "2026-10-01", month: "2026-10", given: {snap_eligible_household_size: 2, snap_household_participates_in_fdpir: false, snap_household_has_substantial_lottery_winnings: false, snap_is_disqualified_for_resource_transfer: false, snap_household_meets_striker_condition: true, snap_meets_gross_income_test: true, snap_meets_net_income_test: false}, expect: over_net_income_limit}
  - {id: CO-4680-T10, title: "Over the resource limit", as_of: "2026-10-01", month: "2026-10", given: {snap_eligible_household_size: 2, snap_household_participates_in_fdpir: false, snap_household_has_substantial_lottery_winnings: false, snap_is_disqualified_for_resource_transfer: false, snap_household_meets_striker_condition: true, snap_meets_gross_income_test: true, snap_meets_net_income_test: true, snap_meets_resource_limit: false}, expect: over_resource_limit}
