rationale: "Final verification pass 2 N-5: no item computed the cost of doing business of 4.403.2.B or carried board payments into SNAP income. snap_self_employment_income (CO-1702) nets gross receipts against the 273.11(b) costs, not against the maximum allotment, so boarder income is its own item. Earned-income records, step E1 (SNAP; docs/reviews/records-earnings-snap.md): reads the boarder records through CO-5117 and CO-5118."
