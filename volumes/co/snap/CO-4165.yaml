id: CO-4165
name: "SNAP: boarder income"
identifier: snap_boarder_income
kind: derived
type: money
scope: person-month
program: SNAP
meaning: "The net income SNAP counts to this person for the month from boarders, as self-employment income (10 CCR 2506-1 4.403.2): the room and board payments received less the cost of doing business, which is the maximum allotment for a household the size of the number of boarders or, if more, the documented separate costs of providing the room and meals, never more than the payments; nothing when the payments are foster care payments, which are disregarded in full."
precision: "The maximum allotment is read from snap_maximum_allotment_table for the number of boarders (room_and_board_payers_count), with snap_maximum_allotment_each_additional beyond the table's last row. The net is added to the person's earned income (snap_person_earned_income, CO-330), so the earned income deduction applies to it (4.403.2.C). The home's own shelter costs are deducted as usual, boarder contributions notwithstanding (4.403.2.D). A commercial boarding house's receipts are self-employment receipts and not read here. Coverage review snap-financial CF-21: for snap_maximum_allotment_large_household_size (18) boarders or more the single 18-or-more figure is read (snap_maximum_allotment_large_household, CO-3726), as snap_maximum_allotment (CO-383) reads it."
derived: [case, [["<=", [otherwise, room_and_board_payments_received, 0], 0], 0], [[otherwise, room_and_board_payments_are_foster_care, false], 0], [else, ["-", room_and_board_payments_received, [min, room_and_board_payments_received, [max, [case, [[all, [">=", room_and_board_payers_count, snap_maximum_allotment_large_household_size], [not, [unknown, snap_maximum_allotment_large_household]]], snap_maximum_allotment_large_household], [else, [lookup_extended, snap_maximum_allotment_table, room_and_board_payers_count, snap_maximum_allotment_each_additional]]], [otherwise, room_and_board_provision_costs, 0]]]]]]
sources: [S2963]
implemented: engine
tags: [snap, income]
rationale: "Final verification pass 2 N-5: no item computed the cost of doing business of 4.403.2.B or carried board payments into SNAP income. snap_self_employment_income (CO-1702) nets gross receipts against the 273.11(b) costs, not against the maximum allotment, so boarder income is its own item."
nearest: [CO-1702]
tests:
  - {id: CO-4165-T1, title: "One boarder pays $700; cost of doing business = max allotment for 1 ($306); $394 counted", as_of: "2026-10-01", month: "2026-10", given: {room_and_board_payments_received: 700, room_and_board_payers_count: 1}, expect: 394}
  - {id: CO-4165-T2, title: "Documented costs of $450 exceed the $306: $250 counted", as_of: "2026-10-01", month: "2026-10", given: {room_and_board_payments_received: 700, room_and_board_payers_count: 1, room_and_board_provision_costs: 450}, expect: 250}
  - {id: CO-4165-T3, title: "Two boarders pay $500: the $562 for two exceeds the payment; nothing counted", as_of: "2026-10-01", month: "2026-10", given: {room_and_board_payments_received: 500, room_and_board_payers_count: 2}, expect: 0}
  - {id: CO-4165-T4, title: "Foster care payments for a foster child: disregarded in full", as_of: "2026-10-01", month: "2026-10", given: {room_and_board_payments_received: 900, room_and_board_payers_count: 1, room_and_board_payments_are_foster_care: true}, expect: 0}
  - {id: CO-4165-T5, title: "No boarders", as_of: "2026-10-01", month: "2026-10", given: {}, expect: 0}
