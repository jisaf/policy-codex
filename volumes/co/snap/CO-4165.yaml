id: CO-4165
name: "SNAP: boarder income"
identifier: snap_boarder_income
kind: derived
type: money
scope: person-month
program: SNAP
meaning: "The net income SNAP counts to this person for the month from boarders, as self-employment income (10 CCR 2506-1 4.403.2): the room and board payments received (snap_room_and_board_payments, CO-5117) less the cost of doing business, which is the maximum allotment for a household the size of the number of boarders (snap_room_and_board_payers, CO-5118) or, if more, the documented separate costs of providing the room and meals (the cost records of kind business_cost_boarder_provision for room and board), never more than the payments; foster care payments are disregarded in full."
precision: "The maximum allotment is read from snap_maximum_allotment_table for the number of boarders, with snap_maximum_allotment_each_additional beyond the table's last row. The net is added to the person's earned income (snap_person_earned_income, CO-330), so the earned income deduction applies to it (4.403.2.C). The home's own shelter costs are deducted as usual, boarder contributions notwithstanding (4.403.2.D). A commercial boarding house's receipts are self-employment receipts and not read here. Coverage review snap-financial CF-21: for snap_maximum_allotment_large_household_size (18) boarders or more the single 18-or-more figure is read (snap_maximum_allotment_large_household, CO-3726), as snap_maximum_allotment (CO-383) reads it. Earned-income records, step E1 (SNAP; docs/reviews/records-earnings-snap.md): a boarder's payments are earnings records (boarder_payments, provides room_and_board), the foster care test is the record's own (foster_care), and a meals-only or room-only payment is read from the receipts while OQ-996 is open (CO-5101). Earnings not stated: cannot determine (before step E1 unstated payments were read as none); a stated list with no boarder is 0."
derived: ["case",[["<=","snap_room_and_board_payments",0],0],["else",["-","snap_room_and_board_payments",["min","snap_room_and_board_payments",["max",["case",[["all",[">=","snap_room_and_board_payers","snap_maximum_allotment_large_household_size"],["not",["unknown","snap_maximum_allotment_large_household"]]],"snap_maximum_allotment_large_household"],["else",["lookup_extended","snap_maximum_allotment_table","snap_room_and_board_payers","snap_maximum_allotment_each_additional"]]],["sum_receipts","earnings",["all",["=",["lookup","snap_earnings_treatment_table",["receipt","kind"]],"deducted_from_boarder_payments"],["=",["receipt","provides"],"room_and_board"],["received_in",["month"]]],["receipt","amount"]]]]]]]
sources: [S2963]
implemented: engine
tags: [snap, income]
rationale: "Final verification pass 2 N-5: no item computed the cost of doing business of 4.403.2.B or carried board payments into SNAP income. snap_self_employment_income (CO-1702) nets gross receipts against the 273.11(b) costs, not against the maximum allotment, so boarder income is its own item. Earned-income records, step E1 (SNAP; docs/reviews/records-earnings-snap.md): reads the boarder records through CO-5117 and CO-5118."
nearest: [CO-1702]
tests:
