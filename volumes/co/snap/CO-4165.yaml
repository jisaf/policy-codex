  - {id: CO-4165-T2, title: "Documented costs of $450 exceed the $306: $250 counted", as_of: "2026-10-01", month: "2026-10", given: {room_and_board_payments_received: 700, room_and_board_payers_count: 1, room_and_board_provision_costs: 450, earnings: [{kind: wages}, {kind: boarder_payments, amount: 700, provides: room_and_board, boarders: 1}, {kind: business_cost_boarder_provision, amount: 450, provides: room_and_board}, {kind: self_employment_receipts}]}, expect: 250}
  - {id: CO-4165-T3, title: "Two boarders pay $500: the $562 for two exceeds the payment; nothing counted", as_of: "2026-10-01", month: "2026-10", given: {room_and_board_payments_received: 500, room_and_board_payers_count: 2, earnings: [{kind: wages}, {kind: boarder_payments, amount: 500, provides: room_and_board, boarders: 2}, {kind: self_employment_receipts}]}, expect: 0}
  - {id: CO-4165-T4, title: "Foster care payments for a foster child: disregarded in full", as_of: "2026-10-01", month: "2026-10", given: {room_and_board_payments_received: 900, room_and_board_payers_count: 1, room_and_board_payments_are_foster_care: true, earnings: [{kind: wages}, {kind: boarder_payments, amount: 900, provides: room_and_board, boarders: 1, foster_care: true}, {kind: self_employment_receipts}]}, expect: 0}
  - {id: CO-4165-T5, title: "No boarders", as_of: "2026-10-01", month: "2026-10", given: {earnings: []}, expect: 0}
