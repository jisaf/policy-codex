id: CO-332
name: "SNAP: person gross income"
identifier: snap_person_gross_income
kind: derived
type: money
scope: person-month
program: SNAP
meaning: The person's total countable gross income for the month, earned plus unearned income plus the income deemed from a sponsor or paid by a sponsor (snap_sponsor_deemed_income, CO-3701). Never below zero. The legally obligated child support the person pays is excluded from the household's total (snap_counted_child_support_exclusion, CO-4333, in snap_household_gross_income, CO-334), not from this figure.
derived: [max, 0, ["+", snap_person_earned_income, snap_person_unearned_income, snap_sponsor_deemed_income]]
sources: [S41, S42, S99, S1314, S2502]
implemented: engine
tags: [income, state_election]
rationale: "7 CFR 273.9(b) (S41, S42) defines household income as earned plus unearned income, and 10 CCR 2506-1 4.407.5,A (S99) excludes legally obligated child support from countable gross income before any gross income test (Colorado's election under 7 U.S.C. 2014(e)(4)). Coverage review snap-financial CF-4: the exclusion was applied here, per person, and floored with the person's own income, so a payer whose own counted income was below the payment lost part of it; it is now taken from the household's total countable gross income (CO-4333, CO-334), with the prorated member's share of it taken as 4.411.1,B,2,c's deducting before prorating gives; this item is the per-person total snap_household_gross_income and snap_counted_income_of_ineligible_member aggregate, kept separate from the earned/unearned split so later deduction rules can read the split without recomputing it."
tests:
  - {id: CO-332-T1, month: "2026-10", given: {wages_gross: 2380, self_employment_gross_receipts: 0, self_employment_net_earnings_for_tax: 0, child_support_paid_legally_obligated: 0, snap_sponsor_deemed_income: 0, receipts: [], earnings: [{kind: wages, amount: 2380}]}, expect: 2380}
  - {id: CO-332-T2, month: "2026-10", given: {wages_gross: 0, self_employment_gross_receipts: 0, self_employment_net_earnings_for_tax: 0, child_support_paid_legally_obligated: 0, snap_sponsor_deemed_income: 0, receipts: [{kind: social_security, amount: 1180}], earnings: []}, expect: 1180}
  - {id: CO-332-T3, month: "2026-10", given: {snap_expense_verification_period_has_ended: false, wages_gross: 2000, self_employment_gross_receipts: 0, self_employment_net_earnings_for_tax: 0, child_support_paid_legally_obligated: 300, snap_sponsor_deemed_income: 0, receipts: [], earnings: [{kind: wages, amount: 2000}]}, expect: 2000}
