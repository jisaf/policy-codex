id: CO-405
name: "SNAP: is exempt from work registration"
identifier: snap_is_exempt_from_work_registration
kind: derived
type: yes/no
scope: person
program: SNAP
meaning: The person is exempt from general SNAP work registration because they are unfit for employment, complying with TANF work requirements, receiving or have applied for unemployment compensation, responsible for a dependent child under 6 or an incapacitated person, a regular participant in drug or alcohol treatment, meet the employment exemption, are enrolled at least half time in school or (as an eligible student) higher education, or are 16 or 17 and either not the head of household or attending school or training at least half time.
precision: The higher-education half-time arm requires the person not be an ineligible student (7 U.S.C. 2015(d)(2)(C) makes the exemption conditional on meeting subsection (e)); the 16-17 arm's literal age ceiling is 17 (a literal figure in the derivation, not a separate parameter, since the two-year window it names is fixed by the same subparagraph that supplies snap_work_registration_min_age as its floor).
derived: [any, snap_is_unfit_for_employment, is_complying_with_tanf_work_requirements, receives_unemployment_compensation_or_applied, snap_has_care_responsibility_for_work_registration_exemption, participates_in_drug_alcohol_treatment, snap_meets_work_registration_employment_exemption, [any, is_enrolled_in_school, [all, is_enrolled_higher_education_half_time, [not, snap_is_ineligible_student]]], [all, [">=", snap_age, snap_work_registration_min_age], ["<=", snap_age, 17], [any, [not, is_head_of_household], [any, is_enrolled_in_school, is_enrolled_higher_education_half_time]]]]
sources: [S121, S122, S123, S124, S125, S126]
implemented: engine
tags: [work_registration, legal]
rationale: No existing item in this volume states the full general work-registration exemption list; this is the single fact snap_is_work_registrant and, via subsection (d)(2)'s incorporation into the ABAWD exceptions, snap_is_exempt_from_abawd_time_limit both read, matching the eight-branch structure of 7 U.S.C. 2015(d)(2) and 7 CFR 273.7(b)(1) (S121-S125) and Colorado's parallel list at 10 CCR 2506-1 4.310.3 (S126).
