id: CO-411
name: "SNAP: is an ineligible student"
identifier: snap_is_ineligible_student
kind: derived
type: yes/no
scope: person
program: SNAP
meaning: "The person is age snap_student_min_age through 49, enrolled at least half time in an institution of higher education, and not exempt under snap_is_student_exempt, and so may not participate in SNAP as a member of any household under 7 U.S.C. 2015(e)."
derived: [all, [">=", age, snap_student_min_age], ["<=", age, snap_student_max_age], is_enrolled_higher_education_half_time, [not, snap_is_student_exempt]]
sources: [S133, S134, S135]
implemented: engine
tags: [student, legal]
rationale: No existing item states the ineligible-student outcome itself. snap_is_exempt_from_work_registration reads this item to condition the general work-registration student exemption on 7 U.S.C. 2015(e), and batch 1's snap_is_ineligible_member (CO-311) reads it as one of the reasons a household member is ineligible per the note left in that item's precision field.
