id: CO-411
name: "SNAP: is an ineligible student"
identifier: snap_is_ineligible_student
kind: derived
type: yes/no
scope: person-month
program: SNAP
meaning: "The person is age snap_student_min_age through 49, enrolled at least half time in an institution of higher education, and not exempt under snap_is_student_exempt, and so may not participate in SNAP as a member of any household under 7 U.S.C. 2015(e)."
precision: "Coverage pass 4 for SNAP S4-11 (OQ-1263 resolved): the ages are taken in the month evaluated (10 CCR 2506-1 4.402.1.A, S4734), on the day that makes the rule apply only when it applies on every day of the month (OQ-1262; docs/operators.md, Ages in a month): 18 or older on the first day (the age on the first day of the month) and 49 or younger on the last day (the age on the last day of the month). A student who turns 18 during a month is still \"seventeen (17) or under\" (4.306.B.1, S135) on its first day and is not an ineligible student that month; one who turns 50 during a month is \"fifty (50) or over\" (4.306.B.2) on its last day. These are the days snap_is_student_exempt (CO-410) reads for the same two exemptions, so the range and the exemptions agree. Before, the age on the determination date was read in every month: a student who turned 18 after the application month was ineligible in it."
derived: [all, [">=", [years_between, date_of_birth, [first_day, [month]]], snap_student_min_age], ["<=", [years_between, date_of_birth, [days_after, -1, [first_day, [month_after, [month]]]]], snap_student_max_age], is_enrolled_higher_education_half_time, [not, snap_is_student_exempt]]
sources: [S133, S134, S135, S4734]
implemented: engine
tags: [student, legal]
open: [OQ-1262]
rationale: No existing item states the ineligible-student outcome itself. snap_is_exempt_from_work_registration reads this item to condition the general work-registration student exemption on 7 U.S.C. 2015(e), and batch 1's snap_is_ineligible_member (CO-311) reads it as one of the reasons a household member is ineligible per the note left in that item's precision field.
