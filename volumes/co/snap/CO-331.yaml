id: CO-331
name: "SNAP: person unearned income"
identifier: snap_person_unearned_income
kind: derived
type: money
scope: person-month
program: SNAP
meaning: "The person's unearned income for the month for SNAP: Social Security, pension, unemployment, child support received, public assistance (Colorado Works, Adult Financial and SSI), and other unearned income, taxable or not, under 7 CFR 273.9(b)(2)."
precision: "Vocabulary fix round (R-1): SSI is counted (ssi_income, CO-849), as 273.9(b)(2)(i) lists it; it had no term. The supplied amounts are gross; the 273.9(c) exclusions of 4.405 are subtracted as snap_excluded_unearned_income (CO-2339; OQ-390 resolved). Income deemed from a sponsor is added in snap_person_gross_income (CO-332; final verification F-2), not here, so that a sponsor's own unearned income can be read through this item. Final verification pass 2 N-1: substantial lottery or gambling winnings (snap_has_substantial_lottery_winnings, CO-4151) are counted as unearned income in the month received (4.403.I, S2951), the single-game prize CO-4151 reads; the household is disqualified in that month anyway (CO-4152), so the amount shows in the month's income figures only. Other winnings are a nonrecurring lump sum, excluded as income and held as a resource (4.405.E). N-6: in a destitute household's month of application (snap_is_destitute_application_month, CO-4168) the unearned income received after the date of application (CO-4167) is left out (4.406.1.A, S2964)."
assumption: "The exclusions applied are those snap_excluded_unearned_income (CO-2339) names from 4.405; infrequent or irregular income of $30 or less in three months, which 4.405 also excludes but no receipt fact states, is assumed not to be in the stated amounts (final verification F-16: the earlier text said no exclusion was modeled)."
derived: [max, 0, ["-", ["-", ["+", social_security_income, pension_income, unemployment_income, child_support_received, tanf_cash_income, adult_financial_cash_income, ssi_income, other_unearned_income_taxable, other_unearned_income_nontaxable, tax_exempt_interest, [case, [snap_has_substantial_lottery_winnings, [otherwise, lottery_gambling_largest_single_game_winnings_received, [otherwise, lottery_gambling_winnings_received, 0]]], [else, 0]]], [otherwise, snap_excluded_unearned_income, 0]], [case, [snap_is_destitute_application_month, [otherwise, snap_unearned_income_received_after_application_date, 0]], [else, 0]]]]
sources: [S1620, S42, S2951, S2964]
implemented: engine
tags: [income]
rationale: 7 CFR 273.9(b)(2) (S42) defines unearned income to include assistance payments, benefits, and support payments; no existing item sums this volume's six unearned-income supplied facts into the single figure snap_person_gross_income needs.
tests:
  - {id: CO-331-T1, month: "2026-10", given: {social_security_income: 1180, pension_income: 0, unemployment_income: 0, child_support_received: 0, tanf_cash_income: 0, adult_financial_cash_income: 0, ssi_income: 0, other_unearned_income_nontaxable: 0, other_unearned_income_taxable: 0, tax_exempt_interest: 0}, expect: 1180}
  - {id: CO-331-T2, month: "2026-10", given: {social_security_income: 1420, pension_income: 610, unemployment_income: 0, child_support_received: 0, tanf_cash_income: 0, adult_financial_cash_income: 0, ssi_income: 0, other_unearned_income_nontaxable: 0, other_unearned_income_taxable: 0, tax_exempt_interest: 0}, expect: 2030}
  - {id: CO-331-T3, title: "Vocabulary fix round (R-1): SSI is unearned income (273.9(b)(2)(i))", month: "2026-10", given: {social_security_income: 0, pension_income: 0, unemployment_income: 0, child_support_received: 0, tanf_cash_income: 0, adult_financial_cash_income: 0, ssi_income: 700, other_unearned_income_nontaxable: 0, other_unearned_income_taxable: 0, tax_exempt_interest: 0}, expect: 700}
  # Phase-10 sweep (OQ-390): $180 of the unearned income is excluded under 4.405.
  - {id: CO-331-T4, month: "2026-10", given: {social_security_income: 1180, pension_income: 0, unemployment_income: 0, child_support_received: 0, tanf_cash_income: 0, adult_financial_cash_income: 0, ssi_income: 0, other_unearned_income_nontaxable: 180, other_unearned_income_taxable: 0, tax_exempt_interest: 0, snap_excluded_unearned_income: 180}, expect: 1180}
  - {id: CO-331-T5, title: "N-1: a $6,000 lottery prize is unearned income in the month received", month: "2026-10", as_of: "2026-10-01", given: {social_security_income: 1180, pension_income: 0, unemployment_income: 0, child_support_received: 0, tanf_cash_income: 0, adult_financial_cash_income: 0, ssi_income: 0, other_unearned_income_nontaxable: 0, other_unearned_income_taxable: 0, tax_exempt_interest: 0, lottery_gambling_largest_single_game_winnings_received: 6000}, expect: 7180}
  - {id: CO-331-T6, title: "N-1: a $500 prize is not substantial and is not income", month: "2026-10", as_of: "2026-10-01", given: {social_security_income: 1180, pension_income: 0, unemployment_income: 0, child_support_received: 0, tanf_cash_income: 0, adult_financial_cash_income: 0, ssi_income: 0, other_unearned_income_nontaxable: 0, other_unearned_income_taxable: 0, tax_exempt_interest: 0, lottery_gambling_winnings_received: 500}, expect: 1180}
  - {id: CO-331-T7, title: "N-6: destitute, applied on the 12th; $400 of unemployment arrives after the application date", month: "2026-10", as_of: "2026-10-12", given: {social_security_income: 0, pension_income: 0, unemployment_income: 800, child_support_received: 0, tanf_cash_income: 0, adult_financial_cash_income: 0, ssi_income: 0, other_unearned_income_nontaxable: 0, other_unearned_income_taxable: 0, tax_exempt_interest: 0, snap_is_destitute_application_month: true, snap_unearned_income_received_after_application_date: 400}, expect: 400}
