id: CO-331
name: "SNAP: person unearned income"
identifier: snap_person_unearned_income
kind: derived
type: money
scope: person-month
program: SNAP
meaning: "The person's unearned income for the month for SNAP (7 CFR 273.9(b)(2)): the counted recurring receipts (snap_counted_recurring_receipts), plus substantial gambling winnings of the month (4.403.I), plus rental income net of its costs (4.404.D, snap_rental_income), less the excluded infrequent or irregular receipts (4.405.A) and need-based charitable cash within the quarterly limit (A.10), less, in a destitute household's month of application, the unearned income received after the application date (4.406.1.A); not below zero."
precision: "Receipt records, migration phase 1 (docs/reviews/receipts-migration-1.md): read from the receipts (CO-5000) through snap_receipt_treatment_table, replacing the sum of the unearned income facts and snap_excluded_unearned_income (CO-2339). The exclusions are rows of the table; a nonrecurring lump sum is a receipt paid once (4.405.E), so a payment stated once is excluded once (before receipt records a one-time payment of an excluded source stated both as its source and as a lump sum was subtracted twice, the SNAP twin of LEAP coverage-3 F3-2). Income deemed from a sponsor is added in snap_person_gross_income (CO-332; final verification F-2), not here. The destitute-household figure (CO-4167) is still its own fact, read as 0 when not stated."
derived: [max, 0, ["-", ["-", ["+", snap_counted_recurring_receipts, snap_substantial_gambling_winnings, snap_rental_income], ["+", snap_excluded_irregular_receipts, snap_excluded_charitable_receipts]], [case, [snap_is_destitute_application_month, [otherwise, snap_unearned_income_received_after_application_date, 0]], [else, 0]]]]
sources: [S1620, S42, S2951, S2964, S3111, S3112, S3100]
implemented: engine
tags: [income]
rationale: 7 CFR 273.9(b)(2) (S42) defines unearned income to include assistance payments, benefits, and support payments; no existing item sums this volume's six unearned-income supplied facts into the single figure snap_person_gross_income needs.
