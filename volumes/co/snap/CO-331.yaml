  - {id: CO-331-T10, title: "CF-3: the same dividend in a month it is not paid still counts 299.9997", month: "2026-11", as_of: "2026-11-15", given: {social_security_income: 0, pension_income: 0, unemployment_income: 0, child_support_received: 0, tanf_cash_income: 0, adult_financial_cash_income: 0, ssi_income: 0, other_unearned_income_nontaxable: 0, other_unearned_income_taxable: 0, tax_exempt_interest: 0, periodic_unearned_income_frequency: quarterly, periodic_unearned_income_per_payment: 900}, expect: 299.9997}
