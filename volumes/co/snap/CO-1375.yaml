id: CO-1375
name: "SNAP: requires verification of residency"
identifier: snap_requires_verification_of_residency
kind: derived
type: yes/no
scope: person-month
program: SNAP
meaning: "Whether the household's residency must be verified, as a verification for the head of household: at application, except for a homeless household, a household (such as some migrant farmworker or newly arrived households) whose residency cannot reasonably be verified, and a basic categorically eligible household; at recertification, or for any of these households, only when questionable."
derived: [all, snap_is_head_of_household, snap_is_household_member, [not, is_homeless], [not, residency_verification_cannot_reasonably_be_accomplished], [any, [all, [not, ["=", snap_eligibility_category, basic_categorical]], [not, snap_determination_is_recertification]], residency_attestation_is_questionable, [otherwise, snap_residency_information_is_outdated, false]]]
sources: [S1618, S805, S817, S824, S819, S1056]
implemented: engine
tags: [verification, snap]
rationale: No existing item states this verification requirement; the phase-9 chapter needs one requirement item per element so the household's pending count and status can be derived.
tests:
  - {id: CO-1375-T1, month: "2026-10", as_of: "2026-10-01", given: {snap_is_head_of_household: true, snap_resides_in_institution_providing_meals: false, is_homeless: false, snap_eligibility_category: expanded_categorical, residency_verification_cannot_reasonably_be_accomplished: false, snap_determination_is_recertification: false}, expect: true}
  - {id: CO-1375-T2, month: "2026-10", as_of: "2026-10-01", given: {snap_is_head_of_household: true, snap_resides_in_institution_providing_meals: false, is_homeless: true, residency_verification_cannot_reasonably_be_accomplished: false, snap_determination_is_recertification: false}, expect: false}
  - {id: CO-1375-T3, month: "2026-10", as_of: "2026-10-01", given: {snap_is_head_of_household: true, snap_resides_in_institution_providing_meals: false, is_homeless: false, snap_eligibility_category: basic_categorical, residency_attestation_is_questionable: false, residency_verification_cannot_reasonably_be_accomplished: false, snap_determination_is_recertification: false}, expect: false}
  - {id: CO-1375-T4, month: "2026-10", as_of: "2026-10-01", given: {snap_is_head_of_household: false, snap_resides_in_institution_providing_meals: false, residency_verification_cannot_reasonably_be_accomplished: false, snap_determination_is_recertification: false}, expect: false}
  - {id: CO-1375-T5, month: "2026-10", as_of: "2026-10-01", given: {snap_is_head_of_household: true, snap_resides_in_institution_providing_meals: false, is_homeless: false, residency_verification_cannot_reasonably_be_accomplished: true}, expect: false}
  - {id: CO-1375-T6, month: "2026-10", as_of: "2026-10-01", given: {snap_is_head_of_household: true, snap_resides_in_institution_providing_meals: false, is_homeless: false, residency_verification_cannot_reasonably_be_accomplished: false, snap_eligibility_category: standard, snap_determination_is_recertification: true, residency_attestation_is_questionable: false}, expect: false}
  # Phase-10 sweep (OQ-371): outdated residency information is verified again at recertification (4.502.B.1).
  - {id: CO-1375-T7, month: "2026-10", as_of: "2026-10-01", given: {snap_is_head_of_household: true, snap_resides_in_institution_providing_meals: false, is_homeless: false, residency_verification_cannot_reasonably_be_accomplished: false, snap_eligibility_category: standard, snap_determination_is_recertification: true, residency_attestation_is_questionable: false, snap_residency_information_is_outdated: true}, expect: true}
