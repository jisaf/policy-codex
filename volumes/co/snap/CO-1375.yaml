id: CO-1375
name: "SNAP: requires verification of residency"
identifier: snap_requires_verification_of_residency
kind: derived
type: yes/no
scope: person-month
program: SNAP
meaning: "Whether the household's residency must be verified, as a verification for the head of household: required except for homeless households and, for basic categorically eligible households, unless questionable."
derived: [all, is_head_of_household, snap_is_household_member, [not, is_homeless], [any, [not, ["=", snap_eligibility_category, basic_categorical]], residency_attestation_is_questionable]]
sources: [S805, S817, S824, S819]
implemented: engine
tags: [verification, snap]
open: [OQ-310, OQ-311]
rationale: No existing item states this verification requirement; the phase-9 chapter needs one requirement item per element so the household's pending count and status can be derived.
