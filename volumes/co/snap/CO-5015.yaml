id: CO-5015
name: "SNAP: excluded need-based charitable cash"
identifier: snap_excluded_charitable_receipts
kind: derived
type: money
scope: person-month
program: SNAP
meaning: The month's need-based charitable cash receipts, up to what the earlier months of the calendar quarter left of snap_charitable_cash_quarterly_limit (10 CCR 2506-1 4.405.A.10).
precision: "The limit applies to the quarter's donations in the order received. Each earlier month's receipts are summed in that month (\"in that month\"), so a receipt is counted with the treatment table in force in the month it is received (docs/operators.md, Resolution step 2 and P57). Decision 4 of 2026-11-23 (docs/plan-colorado.md: missing information is cannot determine unless the rule says otherwise), applied as the reader-defaults round did (b49a7f2): receipts not stated are cannot determine (before, each earlier month was read as 0); 4.405.A.10 excludes donations \"not exceeding three hundred dollars ($300) in the aggregate, per fiscal quarter\" and gives no reading for donations not reported. The month's own sum already read the receipts with no default, so a person who states none was cannot determine before as well."
derived: [min, [sum_receipts, receipts, [all, ["=", [lookup, snap_receipt_treatment_table, [receipt, kind]], counted_beyond_quarterly_limit], [not, ["=", [receipt, frequency], once]], [received_in, [month]]], [receipt, amount]], [max, 0, ["-", snap_charitable_cash_quarterly_limit, [sum_months, snap_calendar_quarter_months_before, [at, [sum_receipts, receipts, [all, ["=", [lookup, snap_receipt_treatment_table, [receipt, kind]], counted_beyond_quarterly_limit], [not, ["=", [receipt, frequency], once]], [received_in, [month]]], [receipt, amount]], [that_month]]]]]]
sources: [S3109]
implemented: engine
tags: [snap, income]
rationale: "Receipt records, migration phase 1: the charitable-cash term of snap_excluded_unearned_income (CO-2339), read from the receipts. Decision 4 round (E1 SNAP): the otherwise 0 on each earlier month is removed."
tests:
  - {id: CO-5015-T1, month: "2026-11", as_of: "2026-11-15", given: {receipts: [{kind: charitable_need_based_cash, amount: 200, month: "2026-10"}, {kind: charitable_need_based_cash, amount: 200, month: "2026-11"}]}, title: "$300 a quarter: $200 in October leaves $100 of November's $200 excluded", expect: 100}
  - {id: CO-5015-T2, month: "2026-11", as_of: "2026-11-15", given: {}, title: "Receipts not stated: cannot determine (decision 4)", expect: unknown}
  - {id: CO-5015-T3, month: "2026-11", as_of: "2026-11-15", given: {receipts: [{kind: charitable_need_based_cash, amount: 400, month: "2026-11"}]}, title: "$400 in November, none earlier in the quarter: $300 excluded (4.405.A.10)", expect: 300}
