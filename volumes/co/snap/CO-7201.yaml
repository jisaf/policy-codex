id: CO-7201
name: "SNAP: the whole equity of the funeral agreement excluded for this person"
identifier: snap_funeral_agreement_excluded_for_member
kind: derived
type: money
scope: person-month
program: SNAP
meaning: "For a member of a SNAP household, the whole equity (its value (the paid-up amount)) of the largest funeral agreement held for this person in the month by a holder (snap_funeral_agreement_holders_for_member) whose resources the household counts: the one funeral agreement 7 CFR 273.8(e)(2) (S2216: \"the value of one funeral agreement per household member\"; the statute override on snap_countable_funeral_agreements, CO-5312) and 10 CCR 2506-1 4.410.D.4 (S2967) excludes for this person. A holder who is an ineligible student (not in snap_household_members_other_than_ineligible_students; 4.411.2.C) or who receives SSI or public assistance (Colorado Works cash, Old Age Pension, Aid to the Needy Disabled or Aid to the Blind; 7 CFR 273.8(e)(17)) is left out, since that member's resources are not the household's (snap_household_countable_resources, CO-343). 0 when no holder's counts."
precision: "Cross-list records round (docs/reviews/cross-list-records.md): one funeral agreement per household member is the household's, not each holder's, so the funeral agreement excluded for a member is chosen across the lists of every member who holds one for that member. The member is this person and the holder that person: a holder's funeral agreements for this person are read from that person's list ([of, [P], holdings]) and the record's for_person is compared with this person as the persons joined to this person by no edge ([reachable, [spouse], false], the person alone), the reading Adult Financial and Colorado Works use for a veterans benefit's dependent (CO-5017, CO-5651). The comparison is of whole equities, so a funeral agreement owned jointly by two members (on each list at its share, with one holding_id) is weighed once, at its whole equity, against one held by another member. With two of equal largest equity, which one is excluded does not change the household's total; snap_funeral_agreement_tie_share_for_member (CO-7202) shares the one exclusion among them. Whether a holder is an ineligible student or receives SSI or public assistance is read only here, where two or more members hold one for this person (a sole holder's is not asked for this). Not stated: cannot determine (decision 4)."
derived: [greatest, snap_funeral_agreement_holders_for_member, [case, [[any, [not, [in_group, [P], snap_household_members_other_than_ineligible_students]], [of, [P], receives_ssi], [of, [P], receives_tanf_cash], [of, [P], receives_state_cash_assistance]], 0], [else, [largest, [of, [P], holdings], [all, [all, [all, [received_in, [month]], [any, [unknown, [receipt, disposed_date]], [">", [receipt, disposed_date], [case, [["=", [month], [month_of, snap_application_date]], snap_application_date], [else, [first_day, [month]]]]]]], [receipt, accessible], ["=", [lookup, snap_holding_treatment_table, [receipt, kind]], counted_beyond_one_agreement_per_member]], [all, ["=", [receipt, burial_for], person_of_case], [in_group, [receipt, for_person], [reachable, [spouse], false]]], [not, [receipt, irrevocable]]], [receipt, value]]]]]
sources: [S2216, S2967, S4820, S4823]
implemented: engine
tags: [snap, resources]
rationale: "Coverage pass 4 for SNAP resources, SR-1 (docs/reviews/coverage4-snap-resources.md): snap_countable_funeral_agreements (CO-5312) excluded one funeral agreement per household member on each holder's list, so two members who each held one for the same third member each had one excluded; the holders are the persons the one exclusion for this person is chosen among. The greatest over the holders (P59, docs/operators.md) is the one funeral agreement excluded."
nearest: [CO-7200, CO-343]
