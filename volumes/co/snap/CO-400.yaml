id: CO-400
name: "SNAP: is unfit for employment"
identifier: snap_is_unfit_for_employment
kind: derived
type: yes/no
scope: person
program: SNAP
meaning: The person is medically certified as physically or mentally unfit for employment, whether by a medical statement, an obvious agency finding, by qualifying as a disabled member under 7 CFR 271.2, or by receiving temporary or permanent disability benefits issued by governmental or private sources (7 CFR 273.24(c)(2)(i); 10 CCR 2506-1 4.311.A.3.A, 4.310.3.C.3.b).
precision: "Reuses snap_is_disabled_member (batch 1) rather than re-testing the disability-benefit facts, since a person receiving SSI, Social Security disability, or a similar benefit is unfit for employment for this purpose as well as elderly-or-disabled for household purposes. Coverage review C-7: a temporary or private disability benefit (workers' compensation, disability insurance) is the further arm receives_temporary_or_permanent_disability_benefits (CO-4263), false when not stated. Colorado's other examples of unfitness (4.310.3.C, S3065: homelessness, recent release from an institution, a self-declared temporary condition, vocational rehabilitation, an SSI application or appeal, inability to keep employment, domestic violence) are examples for the agency's finding, agency_finds_obviously_unfit (CO-044; coverage review P2-2)."
derived: [any, has_medical_statement_of_unfitness, agency_finds_obviously_unfit, snap_is_disabled_member, [otherwise, receives_temporary_or_permanent_disability_benefits, false]]
sources: [S123, S126, S127, S3050, S3065, S749]
implemented: engine
tags: [disability, work_registration, abawd]
rationale: The medical-unfitness exemption is worded almost identically for general work registration (7 CFR 273.7(b)(1)(ii), S123; 10 CCR 2506-1 4.310.3.C, S126) and for the ABAWD time limit (7 U.S.C. 2015(o)(3)(B), S127); this item is the single shared fact both snap_is_exempt_from_work_registration and snap_is_exempt_from_abawd_time_limit read, instead of duplicating the same disjunction twice.
tests:
  - {id: CO-400-T1, as_of: "2026-10-01", given: {has_medical_statement_of_unfitness: true, cccap_caretaker_is_incapacitated: true, agency_finds_obviously_unfit: false, receives_ssi: false, snap_receives_disability_or_blindness_payment: false, snap_receives_permanent_disability_retirement_benefit: false, receives_disability_based_general_assistance: false, has_va_aid_attendance_housebound_or_survivor_finding: false, va_disability_rating_type: none, meets_ssa_disability_criteria: false, is_blind: false}, expect: true}
  - {id: CO-400-T2, as_of: "2026-10-01", given: {has_medical_statement_of_unfitness: false, cccap_caretaker_is_incapacitated: false, agency_finds_obviously_unfit: false, receives_ssi: false, snap_receives_disability_or_blindness_payment: false, snap_receives_permanent_disability_retirement_benefit: false, receives_disability_based_general_assistance: false, has_va_aid_attendance_housebound_or_survivor_finding: false, va_disability_rating_type: none, meets_ssa_disability_criteria: false, is_blind: false}, expect: false}
  - {id: CO-400-T3, title: "Coverage review C-7: a private long-term disability benefit makes the person unfit for employment", as_of: "2026-10-01", given: {has_medical_statement_of_unfitness: false, agency_finds_obviously_unfit: false, snap_is_disabled_member: false, receives_temporary_or_permanent_disability_benefits: true}, expect: true}
