id: CO-334
name: "SNAP: household gross income"
identifier: snap_household_gross_income
kind: derived
type: money
scope: person-month
program: SNAP
meaning: This person's SNAP household's total countable gross income for the month - the sum of each eligible member's own gross income plus the counted (full or pro rata) income of each ineligible member.
precision: Sums over this person's whole purchase-and-prepare unit (snap_household_members), splitting it into eligible and ineligible members rather than using snap_eligible_household_members alone, so an ineligible member's income is added through snap_counted_income_of_ineligible_member and not through their own full snap_person_gross_income.
derived: [round, [+, [sum, [filter, snap_household_members, [not, [of, [P], snap_is_ineligible_member]]], [of, [P], snap_person_gross_income]], [sum, [filter, snap_household_members, [of, [P], snap_is_ineligible_member]], [of, [P], snap_counted_income_of_ineligible_member]]]]
sources: [S44, S45, S46, S102]
implemented: engine
tags: [income, state_election]
rationale: "No existing item aggregates income to the household level; every income-limit and categorical-eligibility test in this batch (snap_meets_gross_income_test, snap_meets_ece_eligibility, snap_is_entitled_to_expedited_service) reads this single household total, built from snap_person_gross_income for eligible members and snap_counted_income_of_ineligible_member for ineligible ones per 10 CCR 2506-1 4.411.1 (S45, S46). Fix-round (C-3): wrapped in `round` per 7 CFR 273.10(e)(1)(ii)(A) (S102), which requires rounding 'each income and allotment calculation' to the nearest dollar (50 cents up); no Colorado document states a different rounding election, so this item follows the federal default of rounding at each calculation rather than once at the end."
