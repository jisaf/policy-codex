id: CO-2308
name: "SNAP: prorated initial month allotment"
identifier: snap_prorated_initial_month_allotment
kind: derived
type: money
scope: person-month
program: SNAP
meaning: "The household's benefit for its initial month before the test that issues nothing below snap_initial_month_minimum_issuance ($10; final verification F-1): the full month's benefit without the one- and two-person minimum (which applies \"Except for an initial month\", 4.207.3.C) and never more than the household would receive with its members disqualified under 7 CFR 273.11(c)(1) counted (snap_full_month_allotment_before_minimum, CO-6002), times the number of days from the date benefits begin (the date of application, or the later date a household-caused delay sets: snap_benefits_begin_date, CO-4269) through the end of the month, divided by the number of days in the month, rounded down to the lower whole dollar; $0 when the household fails the gross income, net income or resource test, or in a month it is disqualified for substantial winnings or a transfer of resources or has a striking member when it was not eligible the day before the strike."
precision: "Days from the application date to the first day of the next month equal 4.207.2.C's \"Number of days in month plus one\" less \"the date of application\". 4.207.2.C does not state the rounding; 7 CFR 273.10(a)(1)(iii)(C) rounds the product down, and the floor is written as the negated ceiling of the negated value. Final verification pass 2 N-2: a household with no eligible member has no allotment, as in the full month (CO-2307). Coverage review snap-financial CF-9: the full month (CO-2307) withheld the allotment for substantial winnings (N-1) and a transfer disqualification (N-4) but this item did not, so the initial month of a transfer disqualification (4.408.2.B: \"The period of disqualification shall begin in the month of application\", S2962) issued its prorated benefit; 4.207.3.A determines the allotment only \"After eligibility has been established\" (S3122). The striker condition (7 CFR 273.1(e), S1816) is gated here too. Coverage pass 2 N2-1: the eligibility gates are read from snap_household_ineligibility_ground (CO-4680), the one list that snap_is_eligible (CO-386), snap_eligibility_status (CO-387) and both allotment items share, so the FDPIR (4.303.B) and refusal-to-cooperate (7 U.S.C. 2015(c)) bars, added to the status alone in the coverage round, now give no allotment either, and a bar added later reaches all four."
derived: [case, [[not, ["=", snap_household_ineligibility_ground, "none"]], 0], [else, ["-", 0, [ceil, ["-", 0, ["/", ["*", snap_full_month_allotment_before_minimum, [days_between, snap_benefits_begin_date, [first_day, [month_after, [month]]]]], [days_between, [first_day, [month]], [first_day, [month_after, [month]]]]]]]]]]
sources: [S1615, S1616, S1617, S3122, S2950, S2962, S1816, S3063, S2965]
implemented: engine
tags: [snap, income]
rationale: "OQ-38 (P-4): 4.207.2.A and C (S1615) prorate the initial month's benefit from the date of application with the exact days of the month; no item computed it. Duplicate-paths audit D-S3 (docs/reviews/duplicate-paths-audit.md): the full month's figure it prorates is CO-6002, capped as the full month is (273.11(c)(1)(ii)); before, the cap was missed here."
tests:
  - {id: CO-2308-T1, title: "Applied October 12 for a $500 full month - 20 of 31 days, $322.58 rounded down", as_of: "2026-10-15", month: "2026-10", given: {snap_household_ineligibility_ground: none, snap_eligible_household_size: 1, snap_household_size_with_disqualified_members: 1, snap_meets_net_income_test: true, snap_maximum_allotment: 808, snap_benefit_reduction: 308, snap_application_date: "2026-10-12"}, expect: 322}
  - {id: CO-2308-T2, title: "Applied on the first - the whole month", as_of: "2026-10-15", month: "2026-10", given: {snap_household_ineligibility_ground: none, snap_eligible_household_size: 1, snap_household_size_with_disqualified_members: 1, snap_meets_net_income_test: true, snap_maximum_allotment: 808, snap_benefit_reduction: 308, snap_application_date: "2026-10-01"}, expect: 500}
  - {id: CO-2308-T3, title: "No minimum in the initial month - a one-person $15 benefit applied February 15 of a 28-day month gives $7", as_of: "2027-02-20", month: "2027-02", given: {snap_household_ineligibility_ground: none, snap_eligible_household_size: 1, snap_household_size_with_disqualified_members: 1, snap_meets_net_income_test: true, snap_maximum_allotment: 306, snap_benefit_reduction: 291, snap_application_date: "2027-02-15"}, expect: 7}
  - {id: CO-2308-T4, title: "Over the resource limit - nothing", as_of: "2026-10-15", month: "2026-10", given: {snap_household_ineligibility_ground: over_resource_limit, snap_meets_net_income_test: true, snap_application_date: "2026-10-12"}, expect: 0}
  - {id: CO-2308-T5, title: "CF-9: applied November 2 after a knowing transfer in October; the disqualification begins in the month of application - no prorated allotment", as_of: "2026-11-20", month: "2026-11", given: {snap_household_ineligibility_ground: resource_transfer_disqualification, snap_eligible_household_size: 2, snap_meets_net_income_test: true, snap_maximum_allotment: 562, snap_benefit_reduction: 175, snap_application_date: "2026-11-02"}, expect: 0}
  - {id: CO-2308-T6, title: "Coverage review C-13: applied October 12, verification provided November 20 by the household's fault - November prorated from the 20th, 11 of 30 days of $500, $183.33 rounded down", as_of: "2026-11-20", month: "2026-11", given: {snap_household_ineligibility_ground: none, snap_eligible_household_size: 1, snap_household_size_with_disqualified_members: 1, snap_meets_net_income_test: true, snap_maximum_allotment: 808, snap_benefit_reduction: 308, snap_application_date: "2026-10-12", snap_household_delay_benefits_begin_date: "2026-11-20"}, expect: 183}
  # Duplicate-paths audit D-S3: the household SNAP-prorated-cap (own allotment $546, the cap for its disqualified member $400).
  - {id: CO-2308-T7, title: "D-S3: initial month from October 1: the capped $400 x 31/31 = 400 (was 546)", as_of: "2026-10-15", month: "2026-10", given: {snap_household_ineligibility_ground: none, snap_maximum_allotment: 546, snap_benefit_reduction: 0, snap_allotment_cap_before_minimum: 400, snap_benefits_begin_date: "2026-10-01"}, expect: 400}
  - {id: CO-2308-T8, title: "D-S3: benefits from October 16: 16 of 31 days, 400 x 16 / 31 = 206.45, rounded down to 206 (was 546 x 16 / 31 = 281)", as_of: "2026-10-20", month: "2026-10", given: {snap_household_ineligibility_ground: none, snap_maximum_allotment: 546, snap_benefit_reduction: 0, snap_allotment_cap_before_minimum: 400, snap_benefits_begin_date: "2026-10-16"}, expect: 206}
  - {id: CO-2308-T9, title: "D-S3 from the figures: two members and a disqualified third, net income with the third $2,000: cap 808 - ceil(0.3 x 2,000) = 208; own 562 - 150 = 412; applied October 12, 20 of 31 days: 208 x 20 / 31 = 134.19, rounded down to 134", as_of: "2026-10-15", month: "2026-10", given: {snap_household_ineligibility_ground: none, snap_eligible_household_size: 2, snap_household_size_with_disqualified_members: 3, snap_net_income_with_disqualified_members: 2000, snap_maximum_allotment: 562, snap_benefit_reduction: 150, snap_benefits_begin_date: "2026-10-12"}, expect: 134}
