id: CO-2308
name: "SNAP: prorated initial month allotment"
identifier: snap_prorated_initial_month_allotment
kind: derived
type: money
scope: person-month
program: SNAP
meaning: "The household's benefit for its initial month before the test that issues nothing below snap_initial_month_minimum_issuance ($10; final verification F-1): the full month's benefit computed without the one- and two-person minimum (which applies \"Except for an initial month\", 4.207.3.C), times the number of days from the date benefits begin (the date of application, or the later date a household-caused delay sets: snap_benefits_begin_date, CO-4269) through the end of the month, divided by the number of days in the month, rounded down to the lower whole dollar; $0 when the household fails the gross income, net income or resource test, or in a month it is disqualified for substantial winnings or a transfer of resources or has a striking member when it was not eligible the day before the strike."
precision: "Days from the application date to the first day of the next month equal 4.207.2.C's \"Number of days in month plus one\" less \"the date of application\". 4.207.2.C does not state the rounding; 7 CFR 273.10(a)(1)(iii)(C) rounds the product down, and the floor is written as the negated ceiling of the negated value. Final verification pass 2 N-2: a household with no eligible member has no allotment, as in the full month (CO-2307). Coverage review snap-financial CF-9: the full month (CO-2307) withheld the allotment for substantial winnings (N-1) and a transfer disqualification (N-4) but this item did not, so the initial month of a transfer disqualification (4.408.2.B: \"The period of disqualification shall begin in the month of application\", S2962) issued its prorated benefit; 4.207.3.A determines the allotment only \"After eligibility has been established\" (S3122). The striker condition (7 CFR 273.1(e), S1816) is gated here too."
derived: [case, [[not, [all, [">=", snap_eligible_household_size, 1], snap_meets_gross_income_test, snap_meets_net_income_test, snap_meets_resource_limit, [not, snap_household_has_substantial_lottery_winnings], [not, snap_is_disqualified_for_resource_transfer], snap_household_meets_striker_condition]], 0], [else, ["-", 0, [ceil, ["-", 0, ["/", ["*", [max, 0, ["-", 0, [ceil, ["-", snap_benefit_reduction, snap_maximum_allotment]]]], [days_between, snap_benefits_begin_date, [first_day, [month_after, [month]]]]], [days_between, [first_day, [month]], [first_day, [month_after, [month]]]]]]]]]]
sources: [S1615, S1616, S1617, S3122, S2950, S2962, S1816, S3063]
implemented: engine
tags: [snap, income]
rationale: "OQ-38 (P-4): 4.207.2.A and C (S1615) prorate the initial month's benefit from the date of application with the exact days of the month; no item computed it."
