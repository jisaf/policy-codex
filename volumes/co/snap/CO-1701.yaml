id: CO-1701
name: "SNAP: self-employment costs"
identifier: snap_self_employment_costs
kind: derived
type: money
scope: person-month
program: SNAP
meaning: "The person's costs of producing self-employment income for the month that 7 CFR 273.11(b) and 10 CCR 2506-1 4.403.11 allow: the operating costs, payments on the principal of income-producing real estate and capital assets, and interest paid to purchase income-producing property; not depreciation, net losses from previous periods, income taxes, retirement savings or personal work expenses."
precision: "The sum of the neutral cost facts the program's rule allows (CO-3370 to CO-3375); an unstated cost is 0."
derived: [+, [+, [otherwise, self_employment_operating_costs, 0], [otherwise, self_employment_interest_costs, 0]], [otherwise, self_employment_capital_principal_payments, 0]]
sources: [S1152, S1153]
implemented: engine
tags: [snap, income]
rationale: "Same-word audit SW-28, dual-entry audit 3.24 and 3.25: each program's excluded income and allowable business costs were program-prefixed supplied amounts, so one receipt or one set of business costs was entered once per program. The neutral fact describes the receipt or the cost; each program's exclusion or allowable cost is its own derived item citing its list (product-owner decision, convention rule 13). The ID and identifier are kept; the amount is now derived."
tests:
  - {id: CO-1701-T1, month: "2026-10", as_of: "2026-10-01", given: {self_employment_operating_costs: 400, self_employment_interest_costs: 20, self_employment_capital_principal_payments: 100, self_employment_home_business_space_costs: 50, self_employment_business_vehicle_costs: 30}, expect: 520}
