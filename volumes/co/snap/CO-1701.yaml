id: CO-1701
name: "SNAP: self-employment costs"
identifier: snap_self_employment_costs
kind: derived
type: money
scope: person-month
program: SNAP
meaning: "The person's costs of producing self-employment income other than a farm's for the month that 7 CFR 273.11(b) and 10 CCR 2506-1 4.403.11 allow: the cost records not marked farm whose row in snap_earnings_treatment_table is deducted (operating costs, payments on the principal of income-producing real estate and capital assets, interest paid to purchase income-producing property); not depreciation, net losses from previous periods, income taxes, retirement savings or personal work expenses."
precision: "Earned-income records, step E1 (SNAP; docs/reviews/records-earnings-snap.md): the cost records of the earnings list, each kind decided by the table (D4: no deduction by silence); a farm's costs are snap_farm_costs (CO-5116). A cost not paid in the month is not a record of the month; earnings not stated: cannot determine (before step E1 an unstated cost fact was read as 0); a stated list with no cost is 0."
derived: ["sum_receipts","earnings",["all",["=",["lookup","snap_earnings_treatment_table",["receipt","kind"]],"deducted"],["not",["receipt","farm"]],["received_in",["month"]]],["receipt","amount"]]
sources: [S1152, S1153, S4102]
implemented: engine
tags: [snap, income]
rationale: "Same-word audit SW-28, dual-entry audit 3.24 and 3.25: each program's excluded income and allowable business costs were program-prefixed supplied amounts, so one receipt or one set of business costs was entered once per program. The neutral fact describes the receipt or the cost; each program's exclusion or allowable cost is its own derived item citing its list (product-owner decision, convention rule 13). The ID and identifier are kept; the amount is now derived. Earned-income records, step E1 (SNAP; docs/reviews/records-earnings-snap.md): replaces the cost facts CO-3370 to CO-3372 read with their defaults."
tests:
  - {id: CO-1701-T1, month: "2026-10", as_of: "2026-10-01", given: {self_employment_operating_costs: 400, self_employment_interest_costs: 20, self_employment_capital_principal_payments: 100, self_employment_home_business_space_costs: 50, self_employment_business_vehicle_costs: 30, earnings: [{kind: wages}, {kind: self_employment_receipts}, {kind: business_cost_operating, amount: 400}, {kind: business_cost_interest, amount: 20}, {kind: business_cost_capital_principal, amount: 100}, {kind: business_cost_home_space, amount: 50}, {kind: business_cost_vehicle, amount: 30}]}, expect: 520}
