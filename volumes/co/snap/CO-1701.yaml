id: CO-1701
name: "SNAP: self-employment costs"
identifier: snap_self_employment_costs
kind: derived
type: money
scope: person-month
program: SNAP
meaning: "The person's costs of producing self-employment income other than a farm's for the month that 7 CFR 273.11(b) and 10 CCR 2506-1 4.403.11 allow: the cost records not marked farm whose row in snap_earnings_treatment_table is deducted (operating costs, payments on the principal of income-producing real estate and capital assets, interest paid to purchase income-producing property); not depreciation, net losses from previous periods, income taxes, retirement savings or personal work expenses."
precision: "Earned-income records, step E1 (SNAP; docs/reviews/records-earnings-snap.md): the cost records of the earnings list, each kind decided by the table (D4: no deduction by silence); a farm's costs are snap_farm_costs (CO-5116). A cost not paid in the month is not a record of the month; earnings not stated: cannot determine (before step E1 an unstated cost fact was read as 0); a stated list with no cost is 0. Coverage pass 4 for SNAP (docs/reviews/coverage4-snap.md, S4-1 to S4-4): a record is placed in the month of its regular_date when it states one, since pay or a benefit that came early or late because of a holiday, a weekend, a changed pay date, a mailing cycle or the employee's request is counted by its regular schedule (10 CCR 2506-1 4.402.B.1-3, S4720; 4.403.A.3, S4721), else in the month it came in; a stream (a record with no month and no date) recurs only from the month its job or source began through the month it ended (job_start_date and job_end_date; start_date and end_date on a receipt), since pay after a job ends or before it begins is not anticipated with reasonable certainty (4.402.1.B, S4722)."
derived: ["sum_receipts", "earnings", ["all", ["=", ["lookup", "snap_earnings_treatment_table", ["receipt", "kind"]], "deducted"], ["not", ["receipt", "farm"]], ["case", [["not", ["unknown", ["receipt", "regular_date"]]], ["=", ["month_of", ["receipt", "regular_date"]], ["month"]]], ["else", ["all", ["received_in", ["month"]], ["any", ["not", ["unknown", ["receipt", "month"]]], ["all", ["any", ["unknown", ["receipt", "job_start_date"]], ["<=", ["month_of", ["receipt", "job_start_date"]], ["month"]]], ["any", ["unknown", ["receipt", "job_end_date"]], [">=", ["month_of", ["receipt", "job_end_date"]], ["month"]]]]]]]]], ["receipt", "amount"]]
sources: [S1152, S1153, S4102]
implemented: engine
tags: [snap, income]
rationale: "Same-word audit SW-28, dual-entry audit 3.24 and 3.25: each program's excluded income and allowable business costs were program-prefixed supplied amounts, so one receipt or one set of business costs was entered once per program. The neutral fact describes the receipt or the cost; each program's exclusion or allowable cost is its own derived item citing its list (product-owner decision, convention rule 13). The ID and identifier are kept; the amount is now derived. Earned-income records, step E1 (SNAP; docs/reviews/records-earnings-snap.md): replaces the cost facts CO-3370 to CO-3372 read with their defaults."
tests:
  # Coverage pass 4 S4-10: 400 operating + 20 interest + 100 principal + 30 business vehicle (4.403.11.B, S4729: "other similar items that are necessary costs of doing business"; C does not list it) = 550; the 50 of home space is not deducted (no rule found either way, the owner's row).
  - {id: CO-1701-T1, month: "2026-10", as_of: "2026-10-01", given: {self_employment_operating_costs: 400, self_employment_interest_costs: 20, self_employment_capital_principal_payments: 100, self_employment_home_business_space_costs: 50, self_employment_business_vehicle_costs: 30, earnings: [{kind: wages}, {kind: self_employment_receipts}, {kind: business_cost_operating, amount: 400}, {kind: business_cost_interest, amount: 20}, {kind: business_cost_capital_principal, amount: 100}, {kind: business_cost_home_space, amount: 50}, {kind: business_cost_vehicle, amount: 30}]}, expect: 550}
