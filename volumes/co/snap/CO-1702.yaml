id: CO-1702
name: "SNAP: self-employment income"
identifier: snap_self_employment_income
kind: derived
type: money
scope: person-month
program: SNAP
meaning: "The person's monthly net self-employment income for SNAP under 7 CFR 273.9(b)(1)(ii), 273.11(a)(2) and 10 CCR 2506-1 4.403.11: the gross receipts of the business (snap_self_employment_gross_receipts, CO-5114) less its allowable costs (snap_self_employment_costs, CO-1701), not below zero, plus the farm's gross receipts (snap_farm_gross_receipts, CO-5115) less the farm's costs (snap_farm_costs, CO-5116), not below zero; for self-employment that is the household's annual support (snap_self_employment_is_averaged, CO-4329), each net averaged over the averaging months (snap_self_employment_averaging_months, CO-4349) (10 CCR 2506-1 4.402.2.A.1, 4.403.11.A, 4.403.12)."
precision: "Capital gains from the sale of business equipment are counted in full under 273.11(a)(3); state them in the gross receipts. A farm loss is offset against the household's other income by snap_farm_self_employment_loss (CO-3722), snap_farm_loss_offset_against_self_employment (CO-3724) and snap_farm_loss_remaining (CO-3725) (final verification F-8; 273.11(a)(2)(ii)). Coverage review snap-financial CF-3: an enterprise that is the household's annual support is averaged over its past twelve months, or the months since it began (4.403.12.A, C, D; S3114), each month's receipts and costs read for that month; an averaged net loss gives 0 here, and a farmer's averaged loss is offset by CO-3722. Self-employment that is part support is read month by month, as stated. Earned-income records, step E1 (SNAP; docs/reviews/records-earnings-snap.md): the business and the farm are each their own receipts and costs (before, one business per person, a farm by a person fact); a loss of the business other than a farm is not offset against the farm's net or other income (273.11(a)(2)(ii) offsets a farm's loss only). Earnings not stated: cannot determine. Coverage pass 4 S4-17: for averaged self-employment, the capital gains received in the past months averaged are taken out of them (snap_self_employment_capital_gains, CO-6605) and the capital gains anticipated in the twelve months beginning with the application month are added at a twelfth (snap_anticipated_capital_gains, CO-6606; 4.403.11.D, S4730); a business that is not averaged counts a capital gain in the month it is received (4.403.11.D, last paragraph)."
derived: ["case", ["snap_self_employment_is_averaged", ["+", ["max", 0, ["+", ["avg", ["-", ["-", "snap_self_employment_gross_receipts", "snap_self_employment_capital_gains"], "snap_self_employment_costs"], "snap_self_employment_averaging_months"], "snap_anticipated_capital_gains"]], ["max", 0, ["avg", ["-", "snap_farm_gross_receipts", "snap_farm_costs"], "snap_self_employment_averaging_months"]]]], ["else", ["+", ["max", 0, ["-", "snap_self_employment_gross_receipts", "snap_self_employment_costs"]], ["max", 0, ["-", "snap_farm_gross_receipts", "snap_farm_costs"]]]]]
sources: [S1152, S1153, S3113, S3114, S4730]
implemented: engine
tags: [snap, income]
rationale: "Vocabulary fix round (docs/reviews/vocabulary-reuse.md, R-1): gives self-employment this program's own reading; before, the program read one shared net figure, or none. Earned-income records, step E1 (SNAP; docs/reviews/records-earnings-snap.md): reads the earnings records through CO-5114, CO-5115, CO-1701 and CO-5116."
tests:
  - {id: CO-1702-T1, as_of: "2026-10-01", month: "2026-10", given: {earnings: [{kind: self_employment_receipts, amount: 1500, annual_support: false}, {kind: business_cost_operating, amount: 400}]}, title: "Receipts $1,500, operating costs $400: 1,100", expect: 1100}
  - {id: CO-1702-T2, as_of: "2026-10-01", month: "2026-10", title: "No self-employment - costs not read", given: {earnings: [{kind: wages}]}, expect: 0}
  - {id: CO-1702-T3, as_of: "2026-10-01", month: "2026-10", title: "Costs above receipts", given: {earnings: [{kind: self_employment_receipts, amount: 300, annual_support: false}, {kind: business_cost_operating, amount: 450}]}, expect: 0}
  - {id: CO-1702-T5, title: "CF-3: a business that supports the household all year, paid $12,000 in September and nothing in October: averaged over the two months given, (12,000 + 0) / 2 = $6,000", month: "2026-10", as_of: "2026-11-10", given: {snap_application_date: "2026-11-10", snap_self_employment_is_averaged: true, snap_self_employment_averaging_months: ["2026-09", "2026-10"], earnings: [{kind: self_employment_receipts, amount: 12000, month: "2026-09"}, {kind: self_employment_receipts, amount: 0, month: "2026-10"}]}, expect: 6000}
  - {id: CO-1702-T6, title: "CF-3: not averaged, the month's receipts", month: "2026-10", as_of: "2026-11-10", given: {snap_self_employment_is_averaged: false, snap_self_employment_costs: 0, earnings: [{kind: wages}]}, expect: 0}
  - {id: CO-1702-T7, as_of: "2026-10-01", month: "2026-10", title: "A business netting $1,100 and a farm losing $500: 1,100 + 0 (the farm loss is offset by CO-3722, not here)", given: {earnings: [{kind: self_employment_receipts, amount: 1500, annual_support: false}, {kind: business_cost_operating, amount: 400}, {kind: farm_self_employment_receipts, amount: 200, annual_support: false}, {kind: business_cost_operating, amount: 700, farm: true}]}, expect: 1100}
  - {id: CO-1702-T8, as_of: "2026-10-01", month: "2026-10", title: "A business that does not say whether it is the household's annual support (4.403.12.A-B): cannot determine", given: {earnings: [{kind: self_employment_receipts, amount: 1500}]}, expect: unknown}
  - {id: CO-1702-T9, as_of: "2026-10-01", month: "2026-10", title: "Earnings not stated: cannot determine", given: {}, expect: unknown}
  # Coverage pass 4 for SNAP, S4-17: 10 CCR 2506-1 4.403.11.D (S4730).
  - {"id": "CO-1702-T10", "title": "S4-17: averaged over September and October 2026 (application 2026-11-10); September receipts of $12,000 include a $2,000 gain on sold equipment, and a $1,200 gain is anticipated in March 2027: (12,000 - 2,000 + 0) / 2 + 1,200 / 12 = 5,000 + 100 = 5,100 (4.403.11.D)", "month": "2026-10", "as_of": "2026-11-10", "given": {"snap_application_date": "2026-11-10", "snap_self_employment_is_averaged": true, "snap_self_employment_averaging_months": ["2026-09", "2026-10"], "earnings": [{"kind": "self_employment_receipts", "amount": 12000, "capital_gain": 2000, "month": "2026-09", "annual_support": true, "changed_substantially": false}, {"kind": "self_employment_receipts", "amount": 1200, "capital_gain": 1200, "month": "2027-03", "annual_support": true, "changed_substantially": false}]}, "expect": 5100}
