id: CO-4160
name: "SNAP: is disqualified for a transfer of resources"
identifier: snap_is_disqualified_for_resource_transfer
kind: derived
type: yes/no
scope: person-month
program: SNAP
meaning: "This person's SNAP household is disqualified in the month for knowingly transferring resources to qualify (10 CCR 2506-1 4.408.2): it is not categorically eligible, and the month is within the disqualification period - snap_resource_transfer_disqualification_months months beginning with the month of application for a transfer before the application, or with snap_resource_transfer_disqualification_effective_month for a transfer made after the household was determined eligible."
precision: "4.408.2 applies to \"households not eligible under expanded or basic categorical eligibility rules\" (snap_is_categorically_eligible, CO-342), which have no resource test. The period starts in the month of application where any member's disqualifying transfer was before the date of application (4.408.2.B, \"shall begin in the month of application\"), and otherwise at the month the notice of adverse action makes it effective (CO-4156). A household with no disqualifying transfer is false whatever the month, with only the members' findings read."
derived: [all, [">", snap_resource_transfer_disqualification_months, 0], [not, snap_is_categorically_eligible], [">=", [month], [case, [[exists, snap_household_members_other_than_ineligible_students, [all, [of, [P], snap_resource_transfer_is_disqualifying], ["<", [of, [P], resource_transfer_date], snap_application_date]]], [month_of, snap_application_date]], [else, snap_resource_transfer_disqualification_effective_month]]], ["<", [month], [months_after, snap_resource_transfer_disqualification_months, [case, [[exists, snap_household_members_other_than_ineligible_students, [all, [of, [P], snap_resource_transfer_is_disqualifying], ["<", [of, [P], resource_transfer_date], snap_application_date]]], [month_of, snap_application_date]], [else, snap_resource_transfer_disqualification_effective_month]]]]]
sources: [S2961, S2962]
implemented: engine
tags: [snap, resources]
rationale: "Final verification pass 2 N-4: no item applied the 4.408.2 disqualification, so a standard household that gave resources away to qualify was found eligible. snap_is_eligible (CO-386), snap_eligibility_status (CO-387) and snap_full_month_allotment (CO-2307) read this item."
tests:
  - {id: CO-4160-T1, title: "Applied October 12 after a July transfer; 6 months: October is disqualified", as_of: "2026-10-12", month: "2026-10", given: {snap_resource_transfer_disqualification_months: 6, snap_is_categorically_eligible: false, snap_household_members_other_than_ineligible_students: [p1], snap_resource_transfer_is_disqualifying: true, resource_transfer_date: "2026-07-20", snap_application_date: "2026-10-12"}, expect: true}
  - {id: CO-4160-T2, title: "The same household in March 2027, the sixth month", as_of: "2026-10-12", month: "2027-03", given: {snap_resource_transfer_disqualification_months: 6, snap_is_categorically_eligible: false, snap_household_members_other_than_ineligible_students: [p1], snap_resource_transfer_is_disqualifying: true, resource_transfer_date: "2026-07-20", snap_application_date: "2026-10-12"}, expect: true}
  - {id: CO-4160-T3, title: "April 2027: the period is over", as_of: "2026-10-12", month: "2027-04", given: {snap_resource_transfer_disqualification_months: 6, snap_is_categorically_eligible: false, snap_household_members_other_than_ineligible_students: [p1], snap_resource_transfer_is_disqualifying: true, resource_transfer_date: "2026-07-20", snap_application_date: "2026-10-12"}, expect: false}
  - {id: CO-4160-T4, title: "A categorically eligible household is not subject to 4.408.2", as_of: "2026-10-12", month: "2026-10", given: {snap_resource_transfer_disqualification_months: 6, snap_is_categorically_eligible: true}, expect: false}
  - {id: CO-4160-T5, title: "A transfer after certification: 3 months from the month the adverse action takes effect", as_of: "2027-01-20", month: "2027-02", given: {snap_resource_transfer_disqualification_months: 3, snap_is_categorically_eligible: false, snap_household_members_other_than_ineligible_students: [p1], snap_resource_transfer_is_disqualifying: true, resource_transfer_date: "2026-12-05", snap_application_date: "2026-10-12", snap_resource_transfer_disqualification_effective_month: "2027-02"}, expect: true}
  - {id: CO-4160-T6, title: "No disqualifying transfer", as_of: "2026-10-12", month: "2026-10", given: {snap_resource_transfer_disqualification_months: 0}, expect: false}
