id: CO-407
name: "SNAP: meets the student employment exemption"
identifier: snap_meets_student_employment_exemption
kind: derived
type: yes/no
scope: person
program: SNAP
meaning: "The student works at least snap_student_employment_hours_per_week hours a week on average, or at least snap_student_employment_hours_per_month (80) hours in the month (4.306.1.B, third paragraph), and is paid for that employment - a self-employed student also earning, after allowable business expenses, at least federal_minimum_wage times snap_student_employment_hours_per_week a week (10 CCR 2506-1 4.306.1.B; 7 CFR 273.5(b)(5)) - or is approved for a State or federally financed work-study program."
derived: ["any",["all",["any",[">=","snap_weekly_hours_worked","snap_student_employment_hours_per_week"],[">=",["otherwise",["at","hours_worked",["det_month"]],0],"snap_student_employment_hours_per_month"]],["any",["not",["all",[">",["at",["sum_receipts","earnings",["all",["in",["lookup","snap_earnings_treatment_table",["receipt","kind"]],["counted_less_costs","counted_loss_offset"]],["received_in",["month"]]],["receipt","amount"]],["det_month"]],0],["<=",["at","snap_person_pay_received",["det_month"]],0]]],[">=",["/",["at","snap_self_employment_income",["det_month"]],"snap_weeks_per_month"],["*","federal_minimum_wage","snap_student_employment_hours_per_week"]]]],"is_approved_for_work_study"]
precision: "Final verification F-5: the earnings condition of 4.306.1.B's second paragraph (S135; 7 CFR 273.5(b)(5), S2507) applies to a self-employed student, read as one with self-employment receipts and no wages in the month containing the determination date; a student with wages is employed and paid, whatever self-employment the student also has. Weekly earnings are SNAP's net self-employment income (snap_self_employment_income, CO-1702) divided by snap_weeks_per_month, as snap_weekly_hours_worked divides hours. Coverage pass 2 N2-2: 4.306.1.B lets the weekly hours be averaged over the month \"so long as the student is employed for eighty (80) hours per month\" (S135), so the hours worked in the month containing the determination date (hours_worked) meet the test at snap_student_employment_hours_per_month (CO-4681) whatever their weekly average; dividing by snap_weeks_per_month alone required 86. Earned-income records, step E1 (SNAP; docs/reviews/records-earnings-snap.md): the self-employment receipts are the earnings records whose row is counted_less_costs or counted_loss_offset, and the wages snap_person_pay_received (CO-5119), in place of self_employment_gross_receipts and wages_gross."
sources: [S133, S134, S135, S2507]
implemented: engine
tags: [student]
rationale: "7 U.S.C. 2015(e)(4), 7 CFR 273.5(b)(5)-(6), and 10 CCR 2506-1 4.306.1.B-C (S133, S134, S135) state the employment and work-study student exemptions together as alternative ways to satisfy the same 20-hour figure; combining them lets snap_is_student_exempt read one fact, reusing snap_weekly_hours_worked (CO-402) rather than re-deriving the hours conversion. Earned-income records, step E1 (SNAP; docs/reviews/records-earnings-snap.md): reads the earnings records."
tests:
  - {id: CO-407-T1, as_of: "2026-10-01", month: "2026-10", given: {hours_worked: 92, wages_gross: 900, self_employment_gross_receipts: 0, is_approved_for_work_study: false, earnings: [{kind: wages, amount: 900}]}, expect: true}
  - {id: CO-407-T2, as_of: "2026-10-01", month: "2026-10", given: {hours_worked: 0, is_approved_for_work_study: false}, expect: false}
  - {id: CO-407-T3, as_of: "2026-10-01", month: "2026-10", given: {hours_worked: 0, is_approved_for_work_study: true}, expect: true}
  # Final verification F-5: a self-employed student also needs weekly earnings of at least $7.25 x 20 = $145.
  - {id: CO-407-T4, title: "Self-employed 92 hours, net $500 a month: 500 / 4.3 = $116 a week, under $145 - not exempt", as_of: "2026-10-01", month: "2026-10", given: {hours_worked: 92, wages_gross: 0, self_employment_gross_receipts: 900, snap_self_employment_income: 500, is_approved_for_work_study: false, earnings: [{kind: self_employment_receipts, amount: 900}]}, expect: false}
  - {id: CO-407-T5, title: "Self-employed 92 hours, net $700 a month: $162.79 a week - exempt", as_of: "2026-10-01", month: "2026-10", given: {hours_worked: 92, wages_gross: 0, self_employment_gross_receipts: 1100, snap_self_employment_income: 700, is_approved_for_work_study: false, earnings: [{kind: self_employment_receipts, amount: 1100}]}, expect: true}
  - {id: CO-407-T6, title: "Coverage pass 2 N2-2 (ZZ-S1): 82 paid hours in the month (19.07 a week) - employed 80 hours, exempt", as_of: "2026-10-01", month: "2026-10", given: {hours_worked: 82, wages_gross: 1066, self_employment_gross_receipts: 0, is_approved_for_work_study: false, earnings: [{kind: wages, amount: 1066}]}, expect: true}
  - {id: CO-407-T7, title: "Coverage pass 2 N2-2: 79 paid hours in the month - not exempt", as_of: "2026-10-01", month: "2026-10", given: {hours_worked: 79, wages_gross: 1027, self_employment_gross_receipts: 0, is_approved_for_work_study: false, earnings: [{kind: wages, amount: 1027}]}, expect: false}
