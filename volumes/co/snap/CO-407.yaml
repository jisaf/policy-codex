id: CO-407
name: "SNAP: meets the student employment exemption"
identifier: snap_meets_student_employment_exemption
kind: derived
type: yes/no
scope: person-month
program: SNAP
meaning: "The student works at least snap_student_employment_hours_per_week hours a week on average, or at least snap_student_employment_hours_per_month (80) hours in the month (4.306.1.B, third paragraph), and is paid for that employment - a self-employed student also earning, after allowable business expenses, at least federal_minimum_wage times snap_student_employment_hours_per_week a week (10 CCR 2506-1 4.306.1.B; 7 CFR 273.5(b)(5)) - or is approved for a State or federally financed work-study program."
derived: ["any", ["all", ["any", [">=", "snap_weekly_hours_worked", "snap_student_employment_hours_per_week"], [">=", "snap_hours_worked_in_month", "snap_student_employment_hours_per_month"]], ["any", ["not", ["all", [">", ["sum_receipts", "earnings", ["all", ["in", ["lookup", "snap_earnings_treatment_table", ["receipt", "kind"]], ["counted_less_costs", "counted_loss_offset"]], ["case", [["not", ["unknown", ["receipt", "regular_date"]]], ["=", ["month_of", ["receipt", "regular_date"]], ["month"]]], ["else", ["all", ["received_in", ["month"]], ["any", ["not", ["unknown", ["receipt", "month"]]], ["all", ["any", ["unknown", ["receipt", "job_start_date"]], ["<=", ["month_of", ["receipt", "job_start_date"]], ["month"]]], ["any", ["unknown", ["receipt", "job_end_date"]], [">=", ["month_of", ["receipt", "job_end_date"]], ["month"]]]]]]]]], ["receipt", "amount"]], 0], ["<=", "snap_person_pay_received", 0]]], [">=", ["/", "snap_self_employment_income", "snap_weeks_per_month"], ["*", "federal_minimum_wage", "snap_student_employment_hours_per_week"]]]], "is_approved_for_work_study"]
precision: "Final verification F-5: the earnings condition of 4.306.1.B's second paragraph (S135; 7 CFR 273.5(b)(5), S2507) applies to a self-employed student, read as one with self-employment receipts and no wages in the month evaluated; a student with wages is employed and paid, whatever self-employment the student also has. Weekly earnings are SNAP's net self-employment income (snap_self_employment_income, CO-1702) divided by snap_weeks_per_month, as snap_weekly_hours_worked divides hours. Coverage pass 2 N2-2: 4.306.1.B lets the weekly hours be averaged over the month \"so long as the student is employed for eighty (80) hours per month\" (S135), so the hours worked in the month evaluated (hours_worked) meet the test at snap_student_employment_hours_per_month (CO-4681) whatever their weekly average; dividing by snap_weeks_per_month alone required 86. Earned-income records, step E1 (SNAP; docs/reviews/records-earnings-snap.md): the self-employment receipts are the earnings records whose row is counted_less_costs or counted_loss_offset, and the wages snap_person_pay_received (CO-5119), in place of self_employment_gross_receipts and wages_gross. Coverage pass 4 for SNAP (docs/reviews/coverage4-snap.md, S4-1 to S4-4): a record is placed in the month of its regular_date when it states one, since pay or a benefit that came early or late because of a holiday, a weekend, a changed pay date, a mailing cycle or the employee's request is counted by its regular schedule (10 CCR 2506-1 4.402.B.1-3, S4720; 4.403.A.3, S4721), else in the month it came in; a stream (a record with no month and no date) recurs only from the month its job or source began through the month it ended (job_start_date and job_end_date; start_date and end_date on a receipt), since pay after a job ends or before it begins is not anticipated with reasonable certainty (4.402.1.B, S4722). Coverage pass 4 S4-13 (decision 4): the month's hours are snap_hours_worked_in_month (CO-6604), cannot determine when the earnings records state pay and the hours are not stated. Coverage pass 6 for SNAP, C6-6 (docs/reviews/coverage6-snap.md): per month, since prospective budgeting reads \"anticipated income and circumstances during the issuance month\" (10 CCR 2506-1 4.402.1.A, S4734) and the readers (the student's eligibility, CO-410 and CO-411; the work registration exemption, CO-405) are per month since S4-11: the month's hours and pay are read in each month evaluated. Before, the item was per person and read the determination month in every month, so a student who began a 20-hour job after the determination month stayed an ineligible student in that month."
sources: [S133, S134, S135, S2507, S4734]
implemented: engine
tags: [student]
rationale: "7 U.S.C. 2015(e)(4), 7 CFR 273.5(b)(5)-(6), and 10 CCR 2506-1 4.306.1.B-C (S133, S134, S135) state the employment and work-study student exemptions together as alternative ways to satisfy the same 20-hour figure; combining them lets snap_is_student_exempt read one fact, reusing snap_weekly_hours_worked (CO-402) rather than re-deriving the hours conversion. Earned-income records, step E1 (SNAP; docs/reviews/records-earnings-snap.md): reads the earnings records."
tests:
  - {id: CO-407-T1, as_of: "2026-10-01", month: "2026-10", given: {hours_worked: 92, is_approved_for_work_study: false, earnings: [{kind: wages, amount: 900}]}, expect: true}
  - {id: CO-407-T2, as_of: "2026-10-01", month: "2026-10", given: {earnings: [], hours_worked: 0, is_approved_for_work_study: false}, expect: false}
  - {id: CO-407-T3, as_of: "2026-10-01", month: "2026-10", given: {hours_worked: 0, is_approved_for_work_study: true}, expect: true}
  # Final verification F-5: a self-employed student also needs weekly earnings of at least $7.25 x 20 = $145.
  - {id: CO-407-T4, title: "Self-employed 92 hours, net $500 a month: 500 / 4.3 = $116 a week, under $145 - not exempt", as_of: "2026-10-01", month: "2026-10", given: {hours_worked: 92, snap_self_employment_income: 500, is_approved_for_work_study: false, earnings: [{kind: self_employment_receipts, amount: 900}]}, expect: false}
  - {id: CO-407-T5, title: "Self-employed 92 hours, net $700 a month: $162.79 a week - exempt", as_of: "2026-10-01", month: "2026-10", given: {hours_worked: 92, snap_self_employment_income: 700, is_approved_for_work_study: false, earnings: [{kind: self_employment_receipts, amount: 1100}]}, expect: true}
  - {id: CO-407-T6, title: "Coverage pass 2 N2-2 (ZZ-S1): 82 paid hours in the month (19.07 a week) - employed 80 hours, exempt", as_of: "2026-10-01", month: "2026-10", given: {hours_worked: 82, is_approved_for_work_study: false, earnings: [{kind: wages, amount: 1066}]}, expect: true}
  - {id: CO-407-T7, title: "Coverage pass 2 N2-2: 79 paid hours in the month - not exempt", as_of: "2026-10-01", month: "2026-10", given: {hours_worked: 79, is_approved_for_work_study: false, earnings: [{kind: wages, amount: 1027}]}, expect: false}
  # Coverage pass 4 for SNAP, S4-13 (decision 4): hours worked are snap_hours_worked_in_month (CO-6604).
  - {"id": "CO-407-T8", "title": "S4-13 (STU): a student earning $1,500 in the month, hours not stated, not approved for work-study: cannot determine", "as_of": "2026-10-12", "month": "2026-10", "given": {"earnings": [{"kind": "wages", "amount": 1500}], "is_approved_for_work_study": false}, "expect": "unknown"}
  - {"id": "CO-407-T9", "title": "S4-13 (STU): the same student with 130 hours stated: 130 / 4.3 = 30.2 >= 20: true", "as_of": "2026-10-12", "month": "2026-10", "given": {"earnings": [{"kind": "wages", "amount": 1500}], "hours_worked": 130, "is_approved_for_work_study": false}, "expect": true}
  - {id: CO-407-T10, as_of: "2026-10-15", month: "2026-11", title: "Coverage pass 6 C6-6: determined in October; a student begins a paid job on November 1 and works 88 hours in November: in November she is employed and paid, 88 >= 80 hours (4.306.1.B), exempt in that month", given: {hours_worked: {"2026-10": 0, "2026-11": 88}, is_approved_for_work_study: false, earnings: [{kind: wages, amount: 1000, job_start_date: "2026-11-01"}]}, expect: true}
  - {id: CO-407-T11, as_of: "2026-10-15", month: "2026-10", title: "Coverage pass 6 C6-6: the same student in October, before the job began: no hours worked in the month, not exempt", given: {hours_worked: {"2026-10": 0, "2026-11": 88}, is_approved_for_work_study: false, earnings: [{kind: wages, amount: 1000, job_start_date: "2026-11-01"}]}, expect: false}
