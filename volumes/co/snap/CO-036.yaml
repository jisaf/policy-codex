id: CO-036
name: Utility allowance amount
identifier: snap_utility_allowance_amount
kind: derived
type: money
scope: person
program: SNAP
meaning: The standard utility allowance Colorado's four-tiered mandatory SUA gives the person's SNAP household - the Heating and Cooling Utility Allowance when the household is entitled to it; otherwise the Basic Utility Allowance for at least two non-heating, non-cooling utility costs; otherwise the One Utility Allowance for one such cost other than a telephone; otherwise the telephone allowance when the telephone is the only utility cost; otherwise nothing - per 10 CCR 2506-1 4.407.31. Households cannot claim actual utility expenses and receive only one of the four allowances. Internet connection fees never enter it (4.407.3.E.5; Pub. L. 119-21 sec. 10104).
precision: "Evaluated on the member whose utility facts are stated (the head of household, as for shelter_cost_monthly); for a member whose facts are unstated the value is unknown, and snap_shelter_costs (CO-377) sums only the members for whom it is known (OQ-29), so the allowance is counted once per household. A case may still state this amount directly, which the engine uses in place of the rule. A household sharing utility costs with another SNAP household receives the full allowance (4.407.31.A.1.d, B.2, C.2, D.1), which needs no separate term."
derived: [case, [snap_entitled_to_heating_cooling_allowance, snap_sua_heating_cooling], [[">=", non_heating_utility_cost_count, 2], snap_sua_basic], [[all, [=, non_heating_utility_cost_count, 1], [not, incurs_telephone_cost]], snap_sua_one_utility], [[=, non_heating_utility_cost_count, 1], snap_sua_telephone], [else, 0]]
sources: [S136, S137, S743, S744, S745, S746, S747, S753]
implemented: engine
tags: [income, snap, state_election]
rationale: "Phase 2 kept this a supplied fact because no fetched document stated Colorado's SUA amounts (OQ-36). 10 CCR 2506-1 effective 2026-10-01 (D-82) states the four tiers, their conditions and FY2027 amounts, and FNS's FY2026 table (D-85) the prior year's, so the identifier is now derived over parameters CO-1235-CO-1238 and the household's utility facts (CO-1239-CO-1242), renamed from utility_allowance_amount to snap_utility_allowance_amount because a derived SNAP rule carries the program prefix (governance name.prefix); snap_shelter_costs (CO-377), expedited service (CO-348) and the cases that stated the old supplied fact read the new name. OQ-36 resolved."
tests:
  - {id: CO-036-T1, as_of: "2026-10-01", given: {snap_entitled_to_heating_cooling_allowance: true, non_heating_utility_cost_count: 3, incurs_telephone_cost: true}, expect: 616}
  - {id: CO-036-T2, title: "FY2026 heating and cooling allowance (FNS table)", as_of: "2026-09-01", given: {snap_entitled_to_heating_cooling_allowance: true, non_heating_utility_cost_count: 3, incurs_telephone_cost: true}, expect: 594}
  - {id: CO-036-T3, as_of: "2026-10-01", given: {snap_entitled_to_heating_cooling_allowance: false, non_heating_utility_cost_count: 2, incurs_telephone_cost: true}, expect: 390}
  - {id: CO-036-T4, as_of: "2026-10-01", given: {snap_entitled_to_heating_cooling_allowance: false, non_heating_utility_cost_count: 1, incurs_telephone_cost: false}, expect: 73}
  - {id: CO-036-T5, title: "Telephone is the only utility cost", as_of: "2026-10-01", given: {snap_entitled_to_heating_cooling_allowance: false, non_heating_utility_cost_count: 1, incurs_telephone_cost: true}, expect: 100}
  - {id: CO-036-T6, as_of: "2026-10-01", given: {snap_entitled_to_heating_cooling_allowance: false, non_heating_utility_cost_count: 0, incurs_telephone_cost: false}, expect: 0}
