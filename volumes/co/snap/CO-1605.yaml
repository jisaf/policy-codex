id: CO-1605
name: "SNAP: unearned income verification is pending"
identifier: snap_unearned_income_verification_is_pending
kind: derived
type: yes/no
scope: person-month
program: SNAP
role: outcome
meaning: Whether SNAP requires verification of the person's unearned income and it has not been provided.
derived: [all, snap_requires_verification_of_unearned_income, [not, unearned_income_is_verified]]
sources: [S801, S820]
implemented: engine
tags: [verification, snap]
rationale: "Review U-1: the count items held this test as an anonymous arm, so no outcome told a worker which document was outstanding and for whom; the count now sums this item."
tests:
  - {id: CO-1605-T1, month: "2026-10", as_of: "2026-10-01", given: {snap_requires_verification_of_unearned_income: true, unearned_income_verified_by_electronic_data_source: false, unearned_income_verification_document_received: false}, expect: true}
  - {id: CO-1605-T2, month: "2026-10", as_of: "2026-10-01", given: {snap_requires_verification_of_unearned_income: true, unearned_income_verified_by_electronic_data_source: true}, expect: false}
