id: CO-2307
name: "SNAP: full month allotment"
identifier: snap_full_month_allotment
kind: derived
type: money
scope: person-month
program: SNAP
meaning: This person's SNAP household's allotment for a full month - the maximum allotment less the benefit reduction, rounded down to the nearest dollar (10 CCR 2506-1 4.207.3.A.3) and floored at $0, with a one- or two-person household that meets the net income test receiving at least the minimum allotment (4.207.3.C) - the benefit for every month except an initial month, and the full month's benefit an initial month is prorated from.
precision: "The minimum allotment floor applies only to a household of snap_minimum_allotment_household_size_limit (2) or fewer eligible members that passes every applicable eligibility test - the gross income test, the net income test, and the resource test - not the net income test alone; a household that fails any of those tests is not \"eligible\" within the meaning of S104's \"all eligible one-person and two-person households\" and gets $0, not the floor. A three-or-more-member household whose maximum-allotment-less-reduction is $0 (or negative, already floored at $0) simply receives $0; whether that household is denied depends on categorical eligibility (snap_eligibility_status, CO-387; OQ-26 resolved). Rounding down is written as the negated ceiling of the negated difference, the shape the volume uses for a floor."
derived: [case, [[not, [all, snap_meets_gross_income_test, snap_meets_net_income_test, snap_meets_resource_limit]], 0], [[all, [<=, snap_eligible_household_size, snap_minimum_allotment_household_size_limit], snap_meets_net_income_test], [max, [max, 0, ["-", 0, [ceil, ["-", snap_benefit_reduction, snap_maximum_allotment]]]], snap_minimum_allotment]], [else, [max, 0, ["-", 0, [ceil, ["-", snap_benefit_reduction, snap_maximum_allotment]]]]]]
sources: [S85, S104, S105, S737, S1616]
implemented: engine
tags: [income]
rationale: "OQ-38 (P-4): the computation snap_allotment (CO-385) carried until the phase-10 sweep, moved here unchanged so that CO-385 can prorate it in an initial month; snap_is_eligible (CO-386) and snap_eligibility_status (CO-387) read this full-month figure, because 4.207.3.B certifies a household entitled to no benefits in its initial month but to benefits in later months, and does not deny a household whose zero is due to proration."
tests:
  - {id: CO-2307-T1, as_of: "2026-10-01", month: "2026-10", given: {snap_eligible_household_size: 1, snap_meets_gross_income_test: true, snap_meets_net_income_test: true, snap_meets_resource_limit: true, snap_maximum_allotment: 306, snap_benefit_reduction: 306}, expect: 25}
  - {id: CO-2307-T2, title: "Rounded down after subtraction (4.207.3.A.3)", as_of: "2026-10-01", month: "2026-10", given: {snap_eligible_household_size: 3, snap_meets_gross_income_test: true, snap_meets_net_income_test: true, snap_meets_resource_limit: true, snap_maximum_allotment: 808, snap_benefit_reduction: 659.7}, expect: 148}
  - {id: CO-2307-T3, as_of: "2026-10-01", month: "2026-10", given: {snap_eligible_household_size: 2, snap_meets_gross_income_test: true, snap_meets_net_income_test: true, snap_meets_resource_limit: false, snap_maximum_allotment: 546, snap_benefit_reduction: 546}, expect: 0}
