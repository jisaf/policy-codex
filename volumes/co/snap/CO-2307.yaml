  - {id: CO-2307-T6, title: "N-4: a month of a transfer disqualification - no allotment", as_of: "2026-10-01", month: "2026-10", given: {snap_meets_gross_income_test: true, snap_meets_net_income_test: true, snap_meets_resource_limit: true, snap_household_has_substantial_lottery_winnings: false, snap_is_disqualified_for_resource_transfer: true}, expect: 0}
