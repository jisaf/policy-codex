id: CO-2307
name: "SNAP: full month allotment"
identifier: snap_full_month_allotment
kind: derived
type: money
scope: person-month
program: SNAP
meaning: This person's SNAP household's allotment for a full month - the maximum allotment less the benefit reduction, rounded down to the nearest dollar (10 CCR 2506-1 4.207.3.A.3) and floored at $0, with a one- or two-person household that meets the net income test receiving at least the minimum allotment (4.207.3.C), and never more than it would receive with its disqualified members counted in its size (7 CFR 273.11(c)(1)(ii)) - the benefit for every month except an initial month, and the full month's benefit an initial month is prorated from. Nothing in a month the household fails an eligibility gate (snap_household_ineligibility_ground, CO-4680) - no eligible member, FDPIR participation, a refusal to cooperate, substantial lottery or gambling winnings, a transfer of resources, a striking member when it was not eligible the day before the strike, or the gross income, net income or resource test.
precision: "The minimum allotment floor applies only to a household of snap_minimum_allotment_household_size_limit (2) or fewer eligible members that passes every applicable eligibility test - the gross income test, the net income test, and the resource test - not the net income test alone; a household that fails any of those tests is not \"eligible\" within the meaning of S104's \"all eligible one-person and two-person households\" and gets $0, not the floor. A three-or-more-member household whose maximum-allotment-less-reduction is $0 (or negative, already floored at $0) simply receives $0; whether that household is denied depends on categorical eligibility (snap_eligibility_status, CO-387; OQ-26 resolved). Rounding down is written as the negated ceiling of the negated difference, the shape the volume uses for a floor. Final verification pass 2: a month disqualified for substantial winnings (snap_household_has_substantial_lottery_winnings, CO-4152; N-1) or for a knowing transfer of resources (snap_is_disqualified_for_resource_transfer, CO-4160; N-4) has no allotment; the result is capped at snap_allotment_cap_for_disqualified_members (CO-4182; N-7), which is the household's maximum allotment, and so never binds, when no member is left out of the size as disqualified. A household with no eligible member has no allotment (it was cannot determine, since the tables have no row for a size of 0): N-2 makes such households, every member awaiting non-citizen verification, a case the volume now meets. Coverage review snap-financial CF-9: 4.207.3.A determines the allotment \"After eligibility has been established\" (S3122); the striker condition of 7 CFR 273.1(e) (snap_household_meets_striker_condition, CO-3504; S1816), which snap_is_eligible (CO-386) and snap_eligibility_status (CO-387) test, was missing here, so a striker's ineligible household was issued its computed allotment. Coverage pass 2 N2-1: the eligibility gates are read from snap_household_ineligibility_ground (CO-4680), the one list that snap_is_eligible (CO-386), snap_eligibility_status (CO-387) and both allotment items share, so the FDPIR (4.303.B) and refusal-to-cooperate (7 U.S.C. 2015(c)) bars, added to the status alone in the coverage round, now give no allotment either, and a bar added later reaches all four."
derived: [case, [[not, ["=", snap_household_ineligibility_ground, "none"]], 0], [[all, [<=, snap_eligible_household_size, snap_minimum_allotment_household_size_limit], snap_meets_net_income_test], [min, snap_allotment_cap_for_disqualified_members, [max, snap_allotment_before_minimum_and_cap, snap_minimum_allotment]]], [else, [min, snap_allotment_cap_for_disqualified_members, snap_allotment_before_minimum_and_cap]]]
sources: [S85, S104, S105, S737, S1616, S2965, S2950, S2962, S3122, S1816]
implemented: engine
tags: [income]
rationale: "OQ-38 (P-4): the computation snap_allotment (CO-385) carried until the phase-10 sweep, moved here unchanged so that CO-385 can prorate it in an initial month; snap_is_eligible (CO-386) and snap_eligibility_status (CO-387) read this full-month figure, because 4.207.3.B certifies a household entitled to no benefits in its initial month but to benefits in later months, and does not deny a household whose zero is due to proration. Duplicate-paths audit D-S3 (docs/reviews/duplicate-paths-audit.md): the household's own allotment is snap_allotment_before_minimum_and_cap (CO-6000), which the initial month reads too."
tests:
  - {id: CO-2307-T1, as_of: "2026-10-01", month: "2026-10", given: {snap_household_ineligibility_ground: none, snap_eligible_household_size: 1, snap_meets_net_income_test: true, snap_household_size_with_disqualified_members: 1, snap_maximum_allotment: 306, snap_benefit_reduction: 306}, expect: 25}
  - {id: CO-2307-T2, title: "Rounded down after subtraction (4.207.3.A.3)", as_of: "2026-10-01", month: "2026-10", given: {snap_household_ineligibility_ground: none, snap_eligible_household_size: 3, snap_meets_net_income_test: true, snap_household_size_with_disqualified_members: 3, snap_maximum_allotment: 808, snap_benefit_reduction: 659.7}, expect: 148}
  - {id: CO-2307-T3, as_of: "2026-10-01", month: "2026-10", given: {snap_household_ineligibility_ground: over_resource_limit, snap_eligible_household_size: 2, snap_meets_net_income_test: true, snap_maximum_allotment: 562, snap_benefit_reduction: 546}, expect: 0}
  - {id: CO-2307-T4, title: "N-7 (ZZ-10): two members and one work-sanctioned member; the two-person minimum of $25 would exceed the $9 for three", as_of: "2026-10-01", month: "2026-10", given: {snap_household_ineligibility_ground: none, snap_eligible_household_size: 2, snap_meets_net_income_test: true, snap_maximum_allotment: 562, snap_benefit_reduction: 798.9, snap_allotment_cap_for_disqualified_members: 9}, expect: 9}
  - {id: CO-2307-T5, title: "N-1: the month a member receives a $10,000 prize - no allotment", as_of: "2026-10-01", month: "2026-10", given: {snap_household_ineligibility_ground: substantial_lottery_winnings, snap_meets_net_income_test: true}, expect: 0}
  - {id: CO-2307-T6, title: "N-4: a month of a transfer disqualification - no allotment", as_of: "2026-10-01", month: "2026-10", given: {snap_household_ineligibility_ground: resource_transfer_disqualification, snap_meets_net_income_test: true}, expect: 0}
  - {id: CO-2307-T7, title: "CF-9: a striking member's household that was not eligible the day before the strike - no allotment", as_of: "2026-10-01", month: "2026-10", given: {snap_household_ineligibility_ground: striking_member, snap_eligible_household_size: 2, snap_meets_net_income_test: true, snap_maximum_allotment: 562, snap_benefit_reduction: 175}, expect: 0}
  # Time audit T-9: each comparison tested at its limit, with the two sides equal (the strict/inclusive flip of the comparison fails it).
  - {"id": "CO-2307-T8", "month": "2026-10", "as_of": "2026-10-01", "title": "T-9: snap_eligible_household_size equal to snap_minimum_allotment_household_size_limit (snap_eligible_household_size at or under snap_minimum_allotment_household_size_limit)", "given": {"snap_household_ineligibility_ground": "none", "snap_eligible_household_size": 2, "snap_meets_net_income_test": true, "snap_maximum_allotment": 562, "snap_benefit_reduction": 798.9, "snap_allotment_cap_for_disqualified_members": 9}, "expect": 9}
