id: CO-419
name: "SNAP: meets the elderly/disabled separate-household election"
identifier: snap_meets_elderly_disabled_separate_household_election
kind: derived
type: yes/no
scope: person-month
program: SNAP
meaning: An otherwise eligible member who is elderly or disabled and unable to purchase and prepare their own meals because of a permanent disability may elect, with their spouse, to be a SNAP household separate from the others they live with, unless the income of those others (excluding the elderly/disabled member and their spouse) exceeds 165 percent of the federal poverty line for the size of that "others" group.
precision: "The 'others' group is this person's physical residence-sharing group (everyone reachable by a chain of buys_prepares_with or spouse edges), minus this person and this person's spouse (if any); their combined snap_person_gross_income for the month, compared against snap_elderly_disabled_separate_household_income_limit_table (CO-114) keyed by the others' count (floored at 1, since the table has no size-0 entry). This item is a standalone eligibility flag: it is not yet wired into snap_household_members' (CO-305) mandatory-combination closure, because doing so without circularity (the closure would need to already know the answer to decide who is 'the others') needs a two-pass composition rule this batch does not build; see OQ-37."
derived: [all, is_elderly_disabled_unable_to_prepare_meals, ["<=", ["-", ["-", [sum, [reachable, [buys_prepares_with, spouse]], [of, [P], snap_person_gross_income]], snap_person_gross_income], [otherwise, [sum, [filter, [reachable, [buys_prepares_with, spouse]], [rel, [spouse], [P]]], [of, [P], snap_person_gross_income]], 0]], [lookup, snap_elderly_disabled_separate_household_income_limit_table, [max, 1, ["-", ["-", [count, [reachable, [buys_prepares_with, spouse]]], 1], [count, [filter, [reachable, [buys_prepares_with, spouse]], [rel, [spouse], [P]]]]]]]]]
sources: [S20]
open: [OQ-37]
implemented: engine
tags: [household, disability, income, age]
rationale: "P-5 (fix-round): 7 CFR 273.1(b)(2) (S20) lets an otherwise eligible elderly or disabled member unable to purchase and prepare their own meals be a separate household with their spouse, unless the others' income exceeds 165% of poverty; the parameters (CO-105, CO-114) and supplied fact (CO-019, is_elderly_disabled_unable_to_prepare_meals) already existed but were read by no item. This is exactly the couple the target household's own composition contemplates (p1 and p2, 79 and 81). Implements the income comparison directly from each person's own snap_person_gross_income rather than the already-composed snap_household_gross_income, to avoid a circular dependency on the very household membership this election would change."
tests:
  - {id: CO-419-T1, month: "2026-10", given: {is_elderly_disabled_unable_to_prepare_meals: true, earned_income: 0, self_employment_net_income: 0, social_security_income: 0, pension_income: 0, unemployment_income: 0, child_support_received: 0, cash_assistance_income: 0, other_unearned_income: 0, child_support_paid_legally_obligated: 0}, others: {p2: {earned_income: 500, self_employment_net_income: 0, social_security_income: 0, pension_income: 0, unemployment_income: 0, child_support_received: 0, cash_assistance_income: 0, other_unearned_income: 0, child_support_paid_legally_obligated: 0}}, relationships: [[buys_prepares_with, p1, p2]], expect: true}
  - {id: CO-419-T2, month: "2026-10", given: {is_elderly_disabled_unable_to_prepare_meals: true, earned_income: 0, self_employment_net_income: 0, social_security_income: 0, pension_income: 0, unemployment_income: 0, child_support_received: 0, cash_assistance_income: 0, other_unearned_income: 0, child_support_paid_legally_obligated: 0}, others: {p2: {earned_income: 5000, self_employment_net_income: 0, social_security_income: 0, pension_income: 0, unemployment_income: 0, child_support_received: 0, cash_assistance_income: 0, other_unearned_income: 0, child_support_paid_legally_obligated: 0}}, relationships: [[buys_prepares_with, p1, p2]], expect: false}
