id: CO-419
name: "SNAP: meets the elderly/disabled separate-household election"
identifier: snap_meets_elderly_disabled_separate_household_election
kind: derived
type: yes/no
scope: person-month
program: SNAP
meaning: An otherwise eligible member who is sixty or older and unable to purchase and prepare their own meals because of a permanent disability may elect, with their spouse, to be a SNAP household separate from the others they live with, unless the income of those others (excluding the elderly/disabled member and their spouse) exceeds 165 percent of the federal poverty line for the size of that "others" group.
precision: "The 'others' group is this person's physical residence-sharing group (everyone reachable by a chain of buys_prepares_with or spouse edges), minus this person and this person's spouse (if any); their combined own gross income for the month (snap_person_gross_income_before_sponsor_income, CO-3712: final verification F-2, without income deemed from a sponsor), compared against snap_elderly_disabled_separate_household_income_limit_table (CO-114) keyed by the others' count (floored at 1, since the table has no size-0 entry), with snap_elderly_disabled_separate_household_income_limit_each_additional (CO-3043) for each member beyond the table's last row (hard-coded numbers audit S-1). The person must ask for the separate household (snap_requests_elderly_disabled_separate_household, CO-2303, read as false when unstated) and be sixty or older (snap_is_elderly; 273.1(b)(2) and 4.304.3.A both say sixty or older). Phase-10 sweep (OQ-37): snap_household_members (CO-305) now reads this item through snap_is_in_elderly_disabled_separate_household (CO-2304); because the others are the physical residence group, not the composed household, there is no cycle. Colorado's 4.304.3.A.2 counts the spouse in the others' household when the spouse is the one purchasing and preparing meals; no fact says who purchases and prepares, so the spouse is always set aside, as 273.1(b)(2) states. Coverage pass 2 N2-P3-5 (first-pass P3-6): 4.304.1.C.2 and 4.304.3.A.2 set the spouse aside in the 165% test \"unless the spouse is the person purchasing and preparing meals\"; 7 CFR 273.1(b)(2) excludes \"the income of the elderly and disabled individual and his or her spouse\" (S20) without condition, and a State may not count income the federal test leaves out, so the spouse is always set aside here, as the federal text requires."
derived: [all, [otherwise, snap_requests_elderly_disabled_separate_household, false], is_elderly_disabled_unable_to_prepare_meals, snap_is_elderly, ["<=", ["-", ["-", [sum, [reachable, [buys_prepares_with, spouse, holds_out_as_spouse_with]], [of, [P], snap_person_gross_income_before_sponsor_income]], snap_person_gross_income_before_sponsor_income], [otherwise, [sum, [filter, [reachable, [buys_prepares_with, spouse, holds_out_as_spouse_with]], [rel, [spouse, holds_out_as_spouse_with], [P]]], [of, [P], snap_person_gross_income_before_sponsor_income]], 0]], [lookup_extended, snap_elderly_disabled_separate_household_income_limit_table, [max, 1, ["-", ["-", [count, [reachable, [buys_prepares_with, spouse, holds_out_as_spouse_with]]], 1], [count, [filter, [reachable, [buys_prepares_with, spouse, holds_out_as_spouse_with]], [rel, [spouse, holds_out_as_spouse_with], [P]]]]]], snap_elderly_disabled_separate_household_income_limit_each_additional]]]
sources: [S20, S1604, S1605]
implemented: engine
tags: [household, disability, income, age]
rationale: "P-5 (fix-round): 7 CFR 273.1(b)(2) (S20) lets an otherwise eligible elderly or disabled member unable to purchase and prepare their own meals be a separate household with their spouse, unless the others' income exceeds 165% of poverty; the parameters (CO-105, CO-114) and supplied fact (CO-019, is_elderly_disabled_unable_to_prepare_meals) already existed but were read by no item. This is exactly the couple the target household's own composition contemplates (p1 and p2, 79 and 81). Implements the income comparison directly from each person's own snap_person_gross_income rather than the already-composed snap_household_gross_income, to avoid a circular dependency on the very household membership this election would change. Same-word audit SW-6: SNAP's spouses include persons living together who are free to marry and represent themselves as spouses (7 CFR 273.1(b)(1)(i), S4 B), so the holds_out_as_spouse_with role is read beside the legal spouse."
