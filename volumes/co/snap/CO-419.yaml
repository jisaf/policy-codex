  - {id: CO-419-T4, month: "2026-10", given: {is_elderly_disabled_unable_to_prepare_meals: true, earned_income: 0, self_employment_net_income: 0, social_security_income: 0, pension_income: 0, unemployment_income: 0, child_support_received: 0, cash_assistance_income: 0, other_unearned_income: 0, child_support_paid_legally_obligated: 0}, others: {p2: {earned_income: 5000, self_employment_net_income: 0, social_security_income: 0, pension_income: 0, unemployment_income: 0, child_support_received: 0, cash_assistance_income: 0, other_unearned_income: 0, child_support_paid_legally_obligated: 0}}, relationships: [[buys_prepares_with, p1, p2], [spouse, p1, p2]], expect: true}
