id: CO-4689
name: "SNAP: household holds a foster child applying apart from the foster family"
identifier: snap_household_has_foster_child_outside_foster_household
kind: derived
type: yes/no
scope: person
program: SNAP
meaning: "A member of this person's SNAP household is a foster child under snap_parental_control_age (18) who lives with a foster parent who is not in this SNAP household: the foster parent chose not to include the child, and the foster child, with the child's own child or spouse, \"may not apply for benefits separately from the foster family unless they are over eighteen (18) and no longer under the parental control of the foster parents\" (10 CCR 2506-1 4.304.3.B.3), so every member of this household is an ineligible member."
precision: "The foster child is read from the foster_child role to a foster parent who lives with the child (lives_with, CO-1925; read as living together where no dwelling is stated). A foster child included by the foster parent is in the foster parent's SNAP household (CO-305) and is false here. The age is the age on the determination date; a foster child of 18 or older is read as no longer under the foster parents' parental control, the age at which parental control ends for SNAP (snap_parental_control_age). The household so found is reported as disqualified members (snap_person_participation_status, CO-2571), since the rule bars it from applying rather than naming a status. Coverage pass 3 N3-P2-1: 18 or older stands for Colorado's \"over eighteen (18) and no longer under the parental control of the foster parents\"; 7 CFR 273.1(c)(4) (S3651) has no age exception, and the choice between the two texts is OQ-875 (needs Legal)."
derived: [exists, snap_household_members, [all, ["<", [of, [P], age], snap_parental_control_age], [of, [P], snap_lives_apart_from_foster_parent_household]]]
sources: [S3475, S3651]
open: [OQ-875]
implemented: engine
tags: [snap, household]
rationale: "Coverage pass 2 N2-P3-4 (first-pass P3-5, deferred then): CO-305 crosses no foster edge, so a foster child the foster parent did not include formed a SNAP household of its own and could be found eligible, which 4.304.3.B.3 (S3475) forbids. No item tested it."
tests:
  - {id: CO-4689-T1, title: "A 12-year-old foster child alone in a SNAP unit while the foster parent is not in it", as_of: "2026-10-01", given: {snap_household_members: [p1], date_of_birth: "2014-05-01", snap_lives_apart_from_foster_parent_household: true}, expect: true}
  - {id: CO-4689-T2, title: "A foster child of 19 may apply separately", as_of: "2026-10-01", given: {snap_household_members: [p1], date_of_birth: "2007-05-01", snap_lives_apart_from_foster_parent_household: true}, expect: false}
  - {id: CO-4689-T3, title: "A foster child included in the foster parent's household", as_of: "2026-10-01", given: {snap_household_members: [p1], date_of_birth: "2014-05-01", snap_lives_apart_from_foster_parent_household: false}, expect: false}
