id: CO-4682
name: "SNAP: conversion factor of the month's regular wages"
identifier: snap_regular_wages_conversion_factor
kind: derived
type: rate
scope: person-month
program: SNAP
meaning: "The ratio of the regular wages SNAP counts for the month (snap_person_wages, CO-4324, less work-study and infrequent or irregular earnings) to the regular wages received in the month (wages_gross less the same two): 1 when the wages are the month's own receipts, 4.3 or 2.15 paydays over the month's 4 or 5 when they are converted from a weekly or biweekly schedule (10 CCR 2506-1 4.402.A.2), and the contract average over the month's receipt when they are averaged (4.403.3). 1 when the month has no regular wages."
precision: "snap_excluded_earned_income (CO-2338) multiplies the excluded parts of the month's regular pay by it, so an exclusion is converted as the pay it is part of is. It reads CO-4324 rather than repeating its schedule test, so the two cannot disagree on whether the month's wages were converted."
derived: [case, [[">", ["-", ["-", [otherwise, wages_gross, 0], [otherwise, work_study_earnings, 0]], [otherwise, infrequent_or_irregular_earned_income_received, 0]], 0], ["/", ["-", ["-", snap_person_wages, [otherwise, work_study_earnings, 0]], [otherwise, infrequent_or_irregular_earned_income_received, 0]], ["-", ["-", wages_gross, [otherwise, work_study_earnings, 0]], [otherwise, infrequent_or_irregular_earned_income_received, 0]]]], [else, 1]]
sources: [S3112, S3113]
implemented: engine
tags: [snap, income]
rationale: "Coverage pass 2 C2-1 (docs/reviews/coverage2-snap-financial.md): with a weekly, biweekly or semimonthly schedule CO-4324 converts the per-period pay, but CO-2338 subtracted the month's own excluded receipts, at the month's 4 or 5 paydays. No item gave the conversion as a ratio the exclusions could share."
tests:
  - {id: CO-4682-T1, title: "Five weekly paydays of $250 converted to 1,075", month: "2027-01", as_of: "2027-01-15", given: {wages_gross: 1250, snap_person_wages: 1075, earnings: [{kind: wages, amount: 1250}, {kind: self_employment_receipts}]}, expect: 0.86}
  - {id: CO-4682-T2, title: "Monthly pay: the month's own receipts", month: "2027-01", as_of: "2027-01-15", given: {wages_gross: 2000, snap_person_wages: 2000, earnings: [{kind: wages, amount: 2000}, {kind: self_employment_receipts}]}, expect: 1}
  - {id: CO-4682-T3, title: "No wages", month: "2027-01", as_of: "2027-01-15", given: {wages_gross: 0, earnings: [{kind: self_employment_receipts}]}, expect: 1}
