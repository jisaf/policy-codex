id: CO-1390
name: "SNAP: person's pending expense verification count"
identifier: snap_person_pending_expense_verification_count
kind: derived
type: whole number
scope: person-month
program: SNAP
meaning: The number of deductible expenses (shelter, medical, dependent care, child support) SNAP requires this person to verify that are not yet verified.
derived: ["+", [case, [[all, snap_requires_verification_of_shelter_costs, [not, shelter_costs_verification_document_received]], 1], [else, 0]], [case, [[all, snap_requires_verification_of_medical_expenses, [not, medical_expenses_verification_document_received]], 1], [else, 0]], [case, [[all, snap_requires_verification_of_dependent_care, [not, dependent_care_verification_document_received]], 1], [else, 0]], [case, [[all, snap_requires_verification_of_child_support_paid, [not, child_support_paid_is_verified]], 1], [else, 0]]]
sources: [S812, S818]
implemented: engine
tags: [verification, snap, income]
rationale: An unverified expense is left out of the deduction rather than denying the household (273.2(f)(3)(ii), 4.502.A.3); the status needs the count separately.
tests:
  - {id: CO-1390-T1, month: "2026-10", as_of: "2026-10-01", given: {snap_requires_verification_of_shelter_costs: false, snap_requires_verification_of_medical_expenses: false, snap_requires_verification_of_dependent_care: true, snap_requires_verification_of_child_support_paid: false, dependent_care_verification_document_received: false}, expect: 1}
  - {id: CO-1390-T2, month: "2026-10", as_of: "2026-10-01", given: {snap_requires_verification_of_shelter_costs: false, snap_requires_verification_of_medical_expenses: false, snap_requires_verification_of_dependent_care: false, snap_requires_verification_of_child_support_paid: false}, expect: 0}
