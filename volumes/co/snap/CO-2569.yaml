id: CO-2569
name: "SNAP: earnings are excluded as a child student's"
identifier: snap_student_earnings_are_excluded
kind: derived
type: yes/no
scope: person-month
program: SNAP
meaning: "This household member is an elementary or secondary school student at least half time who lives with a parent or is under the parental control of a household member other than a parent, and turned eighteen no earlier than in the month, so the person's earned income for the month is excluded from SNAP income (10 CCR 2506-1 4.405.C; 7 CFR 273.9(c)(7))."
precision: "A parent in the household is any parent this person has in the case (exists_related over the child role); 7 CFR 273.1(b)(1)(ii) makes a person under 22 living with a parent a member of the parent's household, so a parent in the case is a parent in the household. Reading snap_household_members instead made a dependency cycle (household -> elderly/disabled separate-household election -> gross income -> this item), fixed at the phase-12 merge; parental control by another member is snap_is_under_parental_control_of_household_member. Earnings that cannot be told apart from other members' (the proration in 273.9(c)(7)'s last sentence) are not modeled; a case states such a share in snap_excluded_earned_income. Same-word audit SW-1: a stepparent is read from the stepparent role (\"natural, adoptive, or stepparent\", S1817). Same-word audit SW-7 (convention rule 17): an edge joins persons who live together (lives_with, CO-1925, from dwelling_id); where a case states no dwelling_id the edge is read as living together, as before. Coverage review snap-financial CF-5: 4.405.C (S3101) excludes the income \"until the month following the month in which the student turns eighteen (18)\", in the month of application as in any month of the certification period, so the age is the age on the last day of the month before the month evaluated (under 18 then means the eighteenth birthday falls in the month or later), not the age on the determination date; the item is per month. Coverage pass 2 C2-3: 4.405.C and 7 CFR 273.9(c)(7) exclude the earnings of students \"at least half-time\" (S3101), so a child enrolled less_than_half_time (education_enrollment_intensity, CO-2881's fact) has the earnings counted; an elementary or secondary student whose intensity is not stated is read as at least half time, the ordinary school attendance. Coverage pass 4 S4-14 (decision 4 of 2026-11-23): education_enrollment_intensity is read with no default where this rule reads it (only for an elementary or secondary student; 4.405.C and 7 CFR 273.9(c)(7) exclude the earnings of students \"at least half-time\" and give no reading for an intensity not stated); before, it was read as at least half time when not stated."
derived: ["all", ["otherwise", "snap_is_elementary_or_secondary_student", false], ["in", "education_enrollment_intensity", ["full_time", "half_time"]], ["<", ["years_between", "date_of_birth", ["days_after", -1, ["first_day", ["month"]]]], "snap_parental_control_age"], ["any", ["exists_related", ["child", "stepchild"], ["otherwise", ["in_group", ["P"], "lives_with"], true]], ["otherwise", "snap_is_under_parental_control_of_household_member", false]]]
sources: [S1817, S3101]
implemented: engine
tags: [snap, income, age]
rationale: "CDHS review C-2: the student-earnings exclusion entered only as a supplied amount (snap_excluded_earned_income), though it is common enough to derive. Same-word SW-7: living with a parent is read from lives_with."
tests:
  - {id: CO-2569-T1, month: "2026-10", as_of: "2026-10-01", given: {education_enrollment_intensity: full_time, date_of_birth: "2010-03-01", snap_is_elementary_or_secondary_student: true, snap_household_members: [p1, p2]}, title: "A 16-year-old high school student living with her mother", others: {p2: {date_of_birth: "1985-01-01"}}, relationships: [[parent, p2, p1]], expect: true}
  - {id: CO-2569-T2, month: "2026-10", as_of: "2026-10-01", given: {date_of_birth: "2008-03-01", snap_is_elementary_or_secondary_student: true, snap_household_members: [p1, p2]}, title: "An 18-year-old student is not excluded", others: {p2: {date_of_birth: "1985-01-01"}}, relationships: [[parent, p2, p1]], expect: false}
  - {id: CO-2569-T3, month: "2026-10", as_of: "2026-10-01", given: {date_of_birth: "2010-03-01"}, title: "Not stated as a student", expect: false}
  - {id: CO-2569-T4, title: "CF-5: a student who turns 18 on February 15 is excluded in February", month: "2027-02", as_of: "2027-02-10", given: {education_enrollment_intensity: full_time, date_of_birth: "2009-02-15", snap_is_elementary_or_secondary_student: true}, others: {p2: {date_of_birth: "1985-01-01"}}, relationships: [[parent, p2, p1]], expect: true}
  - {id: CO-2569-T5, title: "CF-5: a student who turned 18 on February 5, evaluated after the birthday, is still excluded in February", month: "2027-02", as_of: "2027-02-10", given: {education_enrollment_intensity: full_time, date_of_birth: "2009-02-05", snap_is_elementary_or_secondary_student: true}, others: {p2: {date_of_birth: "1985-01-01"}}, relationships: [[parent, p2, p1]], expect: true}
  - {id: CO-2569-T6, title: "CF-5: the same student is counted from March, the month following the birthday month", month: "2027-03", as_of: "2027-02-10", given: {date_of_birth: "2009-02-05", snap_is_elementary_or_secondary_student: true}, others: {p2: {date_of_birth: "1985-01-01"}}, relationships: [[parent, p2, p1]], expect: false}
  - {id: CO-2569-T7, title: "CF-5: a birthday on the first of the month is in that month: excluded in March for a March 1 birthday", month: "2027-03", as_of: "2027-03-10", given: {education_enrollment_intensity: full_time, date_of_birth: "2009-03-01", snap_is_elementary_or_secondary_student: true}, others: {p2: {date_of_birth: "1985-01-01"}}, relationships: [[parent, p2, p1]], expect: true}
  - {id: CO-2569-T8, title: "Coverage pass 2 C2-3: a 16-year-old in high-school-equivalency classes less than half time - counted", month: "2027-02", as_of: "2027-02-10", given: {date_of_birth: "2010-06-01", snap_is_elementary_or_secondary_student: true, education_enrollment_intensity: less_than_half_time}, others: {p2: {date_of_birth: "1985-01-01"}}, relationships: [[parent, p2, p1]], expect: false}
  - {id: CO-2569-T9, title: "Coverage pass 2 C2-3: the same child half time - excluded", month: "2027-02", as_of: "2027-02-10", given: {date_of_birth: "2010-06-01", snap_is_elementary_or_secondary_student: true, education_enrollment_intensity: half_time}, others: {p2: {date_of_birth: "1985-01-01"}}, relationships: [[parent, p2, p1]], expect: true}
