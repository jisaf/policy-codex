id: CO-2569
name: "SNAP: earnings are excluded as a child student's"
identifier: snap_student_earnings_are_excluded
kind: derived
type: yes/no
scope: person
program: SNAP
meaning: This household member is under 18, an elementary or secondary school student, and lives with a parent or under the parental control of a household member other than a parent, so the person's earned income is excluded from SNAP income (7 CFR 273.9(c)(7)).
precision: A parent in the household is any parent this person has in the case (exists_related over the child role); 7 CFR 273.1(b)(1)(ii) makes a person under 22 living with a parent a member of the parent's household, so a parent in the case is a parent in the household. Reading snap_household_members instead made a dependency cycle (household -> elderly/disabled separate-household election -> gross income -> this item), fixed at the phase-12 merge; parental control by another member is is_under_parental_control_of_household_member. Earnings that cannot be told apart from other members' (the proration in 273.9(c)(7)'s last sentence) are not modeled; a case states such a share in snap_excluded_earned_income.
derived: [all, [otherwise, is_elementary_or_secondary_student, false], ["<", age, snap_parental_control_age], [any, [exists_related, [child], true], [otherwise, is_under_parental_control_of_household_member, false]]]
sources: [S1817]
implemented: engine
tags: [snap, income, age]
rationale: "CDHS review C-2: the student-earnings exclusion entered only as a supplied amount (snap_excluded_earned_income), though it is common enough to derive."
tests:
  - {id: CO-2569-T1, month: "2026-10", as_of: "2026-10-01", given: {date_of_birth: "2010-03-01", is_elementary_or_secondary_student: true, snap_household_members: [p1, p2]}, title: "A 16-year-old high school student living with her mother", others: {p2: {date_of_birth: "1985-01-01"}}, relationships: [[parent, p2, p1]], expect: true}
  - {id: CO-2569-T2, month: "2026-10", as_of: "2026-10-01", given: {date_of_birth: "2008-03-01", is_elementary_or_secondary_student: true, snap_household_members: [p1, p2]}, title: "An 18-year-old student is not excluded", others: {p2: {date_of_birth: "1985-01-01"}}, relationships: [[parent, p2, p1]], expect: false}
  - {id: CO-2569-T3, month: "2026-10", as_of: "2026-10-01", given: {date_of_birth: "2010-03-01"}, title: "Not stated as a student", expect: false}
