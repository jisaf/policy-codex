sources: [S1817, S3101, S5092]
implemented: engine
tags: [snap, income, age]
rationale: "CDHS review C-2: the student-earnings exclusion entered only as a supplied amount (snap_excluded_earned_income), though it is common enough to derive. Same-word SW-7: living with a parent is read from lives_with."
