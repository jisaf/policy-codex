  - {id: CO-2569-T7, title: "CF-5: a birthday on the first of the month is in that month: excluded in March for a March 1 birthday", month: "2027-03", as_of: "2027-03-10", given: {dwelling_id: h1, earnings: [{kind: wages, amount: 300}], education_enrollment_intensity: full_time, date_of_birth: "2009-03-01", snap_is_elementary_or_secondary_student: true}, others: {p2: {dwelling_id: h1, date_of_birth: "1985-01-01"}}, relationships: [[parent, p2, p1]], expect: true}
  - {id: CO-2569-T8, title: "Coverage pass 2 C2-3: a 16-year-old in high-school-equivalency classes less than half time - counted", month: "2027-02", as_of: "2027-02-10", given: {date_of_birth: "2010-06-01", snap_is_elementary_or_secondary_student: true, education_enrollment_intensity: less_than_half_time}, others: {p2: {date_of_birth: "1985-01-01"}}, relationships: [[parent, p2, p1]], expect: false}
  - {id: CO-2569-T9, title: "Coverage pass 2 C2-3: the same child half time - excluded", month: "2027-02", as_of: "2027-02-10", given: {dwelling_id: h1, earnings: [{kind: wages, amount: 300}], date_of_birth: "2010-06-01", snap_is_elementary_or_secondary_student: true, education_enrollment_intensity: half_time}, others: {p2: {dwelling_id: h1, date_of_birth: "1985-01-01"}}, relationships: [[parent, p2, p1]], expect: true}
