  - {id: CO-2569-T2, month: "2026-10", as_of: "2026-10-01", given: {date_of_birth: "2008-03-01", snap_is_elementary_or_secondary_student: true, snap_household_members: [p1, p2]}, title: "An 18-year-old student is not excluded", others: {p2: {date_of_birth: "1985-01-01"}}, relationships: [[parent, p2, p1]], expect: false}
