id: CO-6600
name: "SNAP: leave or bonus pay received in installments after the job ended"
identifier: snap_leave_pay_after_termination
kind: derived
type: money
scope: person-month
program: SNAP
meaning: "The person's sick pay, vacation pay and bonus pay received for the month in installments after the job it comes from ended, which 10 CCR 2506-1 4.404.F (S4723) counts as unearned income: \"If vacation pay, sick pay, or bonus pay is received in installment payments after a person has terminated employment, it is considered unearned income.\" Each earnings record of a pay row of snap_earnings_treatment_table that is marked leave_or_bonus_pay, is dated after its job_end_date and is not paid once, at its monthly amount as snap_person_wages (CO-4324) converts a pay (4.402.A.2), placed in the month of its regular date. snap_person_unearned_income (CO-331) adds it, so the earned income deduction does not apply to it."
precision: "Coverage pass 4 for SNAP, S4-4. While the person is still employed, sick, vacation and bonus pay are earned income (4.403.A.4, S4721: \"if the person was still employed while receiving the pay\"), counted by snap_person_wages. Such pay received once after the job ended is a lump sum, \"considered as a resource in the month received\" (4.404.F): neither this item nor snap_person_wages counts it as income, and what is left of it is a holding (resources). A last paycheck for hours worked before the job ended is not leave or bonus pay (leave_or_bonus_pay false) and is wages in the month received. Earnings not stated: cannot determine; a stated empty list is 0. In a destitute household's month of application a record dated after the date of application is not counted (4.406.1.A, S2964; coverage pass 4 S4-14)."
