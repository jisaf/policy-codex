id: CO-300
name: "SNAP: age"
identifier: snap_age
kind: derived
type: whole number
scope: person
program: SNAP
meaning: The person's whole number of completed years of age as of the determination date.
precision: Whole years only; a birthday on the determination date counts as reached.
derived: [years_between, date_of_birth, [det_date]]
sources: [S6]
implemented: engine
tags: [age]
rationale: Every age-based household and immigrant rule in this chapter (mandatory-member age, elderly age, the non-citizen additional-condition age tests) needs a single, shared whole-years-of-age fact rather than each rule recomputing years_between inline.
tests:
  - {id: CO-300-T1, as_of: "2026-10-01", given: {date_of_birth: "1947-03-12"}, expect: 79}
  - {id: CO-300-T2, as_of: "2026-10-01", given: {date_of_birth: "2026-02-03"}, expect: 0}
