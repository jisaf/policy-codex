id: CO-1603
name: "SNAP: residency verification is pending"
identifier: snap_residency_verification_is_pending
kind: derived
type: yes/no
scope: person-month
program: SNAP
role: outcome
meaning: Whether SNAP requires verification of the person's residency and it has not been provided.
derived: [all, snap_requires_verification_of_residency, [not, residency_verification_document_received]]
sources: [S805, S824]
implemented: engine
tags: [verification, snap]
rationale: "Review U-1: the count items held this test as an anonymous arm, so no outcome told a worker which document was outstanding and for whom; the count now sums this item."
tests:
  - {id: CO-1603-T1, month: "2026-10", as_of: "2026-10-01", given: {snap_requires_verification_of_residency: true, residency_verification_document_received: false}, expect: true}
  - {id: CO-1603-T2, month: "2026-10", as_of: "2026-10-01", given: {snap_requires_verification_of_residency: false}, expect: false}
