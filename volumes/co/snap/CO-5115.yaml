id: CO-5115
name: "SNAP: farm gross receipts"
identifier: snap_farm_gross_receipts
kind: derived
type: money
scope: person-month
program: SNAP
meaning: "The gross receipts of the person's farm that SNAP counts for the month: the earnings records whose row in snap_earnings_treatment_table is counted_loss_offset (farm_self_employment_receipts) received in the month (10 CCR 2506-1 4.403.12.E; 7 CFR 273.11(a)(2)), less those marked irregular when snap_irregular_earnings_are_excluded (4.405.A), and, in a destitute household's month of application, without the receipts dated after the date of application (4.406.1.A)."
precision: "The farm's costs are snap_farm_costs (CO-5116); snap_self_employment_income (CO-1702) counts the farm's net and snap_farm_self_employment_loss (CO-3722) its loss. Earnings not stated: cannot determine. Coverage pass 4 for SNAP (docs/reviews/coverage4-snap.md, S4-1 to S4-4): a record is placed in the month of its regular_date when it states one, since pay or a benefit that came early or late because of a holiday, a weekend, a changed pay date, a mailing cycle or the employee's request is counted by its regular schedule (10 CCR 2506-1 4.402.B.1-3, S4720; 4.403.A.3, S4721), else in the month it came in; a stream (a record with no month and no date) recurs only from the month its job or source began through the month it ended (job_start_date and job_end_date; start_date and end_date on a receipt), since pay after a job ends or before it begins is not anticipated with reasonable certainty (4.402.1.B, S4722)."
