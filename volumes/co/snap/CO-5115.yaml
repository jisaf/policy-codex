sources: [S2510, S2511, S3100, S2964]
implemented: engine
tags: [snap, income]
nearest: [CO-5114]
rationale: "Earned-income records, step E1 (SNAP; docs/reviews/records-earnings-snap.md): SNAP reads earned income from the earnings records (CO-5100) through its counting table (snap_earnings_treatment_table, CO-5101) instead of the scalar earned-income facts and their parts. The farm is told apart by its kind, not by a person fact (self_employment_is_farming, CO-3720), so a farmer with another business has both."
