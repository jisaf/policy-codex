id: CO-339
name: "SNAP: BBCE gross income limit"
identifier: snap_bbce_gross_income_limit
kind: derived
type: money
scope: person
program: SNAP
meaning: The monthly gross income limit, 200% of the federal poverty level, this person's SNAP household must be at or below to meet the income prong of Expanded Categorical Eligibility, for the household's size.
precision: Sizes above 8 add snap_bbce_gross_income_limit_each_additional per member above 8, using snap_household_size (eligible members only, 10 CCR 2506-1 4.401,B).
derived: [+, [lookup, snap_bbce_gross_income_limit_table, [min, snap_household_size, 8]], ["*", snap_bbce_gross_income_limit_each_additional, [max, 0, ["-", snap_household_size, 8]]]]
sources: [S48, S59]
nearest: [CO-345, CO-346]
rationale: 10 CCR 2506-1 4.206,C,2,a,1) (S48) sets the 200% ECE income prong; this item composes snap_bbce_gross_income_limit_table with its each-additional parameter the same way snap_gross_income_limit (CO-345, 130%) and snap_net_income_limit (CO-346, 100%) do for their own tables, and all three are needed because they test different statutory percentages that apply to different categories of eligibility.
implemented: engine
tags: [income, state_election]
tests:
  - {id: CO-339-T1, as_of: "2026-10-01", given: {in_medical_institution: false, citizenship_status: citizen, is_fleeing_felon_or_probation_violator: false, is_disqualified_for_intentional_program_violation: false, is_disqualified_for_work_requirement_noncompliance: false, is_disqualified_drug_felony: false}, others: {}, relationships: [], expect: 2510}
  - {id: CO-339-T2, as_of: "2026-10-01", given: {in_medical_institution: false, citizenship_status: citizen, is_fleeing_felon_or_probation_violator: false, is_disqualified_for_intentional_program_violation: false, is_disqualified_for_work_requirement_noncompliance: false, is_disqualified_drug_felony: false}, others: {p2: {in_medical_institution: false, citizenship_status: citizen, is_fleeing_felon_or_probation_violator: false, is_disqualified_for_intentional_program_violation: false, is_disqualified_for_work_requirement_noncompliance: false, is_disqualified_drug_felony: false}}, relationships: [[spouse, p1, p2]], expect: 3408}
