id: CO-1619
name: "SNAP: income changed since last certification"
identifier: snap_income_changed_since_last_certification
kind: derived
type: yes/no
scope: person-month
program: SNAP
meaning: "Whether, at a recertification, the person's income source has changed or the total monthly income has changed by more than snap_recertification_income_change_threshold from the amount last verified."
precision: "Coverage pass 2 C2-4: the income compared is the month's income as SNAP counts it - wages as converted or averaged (snap_person_wages, CO-4324) plus net self-employment income, less the excluded earnings (snap_excluded_earned_income, CO-2338), plus unearned income net of its exclusions - so a weekly earner's fifth payday is not a change, and snap_income_at_last_certification (CO-1568) is the same figure as last verified. Coverage pass 3 C3-2: the figure is now read from the income items themselves - snap_person_earned_income (CO-330) less the pre-strike difference it adds (snap_striker_income_above_current, CO-3503, which is not income received), plus snap_person_unearned_income (CO-331) - so training allowances, VISTA payments counted as earned income and net boarder income are compared as CO-1568 holds them, and any term later added to the income items is compared too."
derived: [any, snap_income_source_changed_since_last_certification, [">", ["-", ["+", [max, 0, ["-", snap_person_earned_income, snap_striker_income_above_current]], snap_person_unearned_income], snap_income_at_last_certification], snap_recertification_income_change_threshold], [">", ["-", snap_income_at_last_certification, ["+", [max, 0, ["-", snap_person_earned_income, snap_striker_income_above_current]], snap_person_unearned_income]], snap_recertification_income_change_threshold]]
sources: [S1055, S1056, S3064, S3112]
implemented: engine
tags: [verification, snap, income]
rationale: "Review K-1: the income requirement items need the recertification change test of 273.2(f)(8)(i)(A) and 4.502.B.2. Coverage review P2-9: a change of exactly $50 is not verified, since 273.2(f)(8)(i)(A) (S1055) says the State agency \"shall not verify income if ... the amount is unchanged or has changed by $50 or less\" and 4.506 (S3064) verifies income that \"has changed more than fifty dollars ($50)\" (OQ-371 resolved)."
tests:
  - {id: CO-1619-T1, month: "2026-10", as_of: "2026-10-01", given: {snap_income_source_changed_since_last_certification: false, wages_gross: 1260, self_employment_gross_receipts: 0, self_employment_net_earnings_for_tax: 0, snap_person_unearned_income: 0, snap_income_at_last_certification: 1200}, expect: true}
  - {id: CO-1619-T2, month: "2026-10", as_of: "2026-10-01", given: {snap_income_source_changed_since_last_certification: false, wages_gross: 1240, self_employment_gross_receipts: 0, self_employment_net_earnings_for_tax: 0, snap_person_unearned_income: 0, snap_income_at_last_certification: 1200}, expect: false}
  - {id: CO-1619-T3, month: "2026-10", as_of: "2026-10-01", given: {snap_income_source_changed_since_last_certification: true}, expect: true}
  - {id: CO-1619-T4, title: "Coverage pass 2 C2-4: recertification in a five-payday month, $250 weekly (1,250 received), last verified 1,075, same source - unchanged", month: "2027-01", as_of: "2027-01-15", given: {snap_income_source_changed_since_last_certification: false, wages_gross: 1250, wages_pay_frequency: weekly, wages_gross_per_pay_period: 250, snap_self_employment_income: 0, snap_excluded_earned_income: 0, snap_person_unearned_income: 0, snap_income_at_last_certification: 1075}, expect: false}
  - {id: CO-1619-T9, title: "Coverage pass 3 C3-2: wages of $1,000 and a $500 training allowance, $1,500 last verified, same source - no change", month: "2027-02", as_of: "2027-02-10", given: {snap_income_source_changed_since_last_certification: false, snap_person_earned_income: 1500, snap_striker_income_above_current: 0, snap_person_unearned_income: 0, snap_income_at_last_certification: 1500}, expect: false}
  - {id: CO-1619-T10, title: "Coverage pass 3 C3-2: a striker's counted pre-strike difference is not compared", month: "2027-02", as_of: "2027-02-10", given: {snap_income_source_changed_since_last_certification: false, snap_person_earned_income: 2000, snap_striker_income_above_current: 1000, snap_person_unearned_income: 0, snap_income_at_last_certification: 1000}, expect: false}
