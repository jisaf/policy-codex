id: CO-1243
name: "SNAP: entitled to the heating and cooling utility allowance"
identifier: snap_entitled_to_heating_cooling_allowance
kind: derived
type: yes/no
scope: person-month
program: SNAP
meaning: "Whether, in the month evaluated, the person's SNAP household is entitled to the Heating and Cooling Utility Allowance: it incurs or anticipates heating or cooling costs separate from rent or mortgage, or it received LEAP or E-EBT within the previous twelve months and contains an elderly or disabled member in the month (snap_household_has_elderly_or_disabled_member_in_month, CO-6603), per 10 CCR 2506-1 4.407.31.A.1 and Pub. L. 119-21 sec. 10103."
precision: "10 CCR 2506-1 4.407.31.A.1.b as of 2026-10-01 (S743) still grants the HCUA on prior LEAP or E-EBT receipt alone; Pub. L. 119-21 sec. 10103 (S136) limits the energy-assistance route to households with an elderly or disabled member. This item follows the amended statute, as the volume does wherever the rule manual has not caught up (OQ-1, OQ-32); see OQ-251. Coverage pass 6 for SNAP, C6-3 (docs/reviews/coverage6-snap.md): per month, reading the month's elderly or disabled member (CO-6603), as S4-11 made every other reader that turns on the month's household (CO-344, CO-379): prospective budgeting reads \"anticipated income and circumstances during the issuance month\" (10 CCR 2506-1 4.402.1.A, S4734). Before, the item was per person and read the determination month's member (CO-314) in every month, so a household whose member turned 60 after the determination month was denied the allowance in that member's months (probe HCUA60, stored CO-863). Three-pattern sweep T-10 (docs/reviews/pattern-sweep-snap-ce.md): the energy assistance counts in a month only while that month is within the twelve months after the month of the most recent payment (energy_assistance_last_payment_month, CO-7451), since the federal rule the State's \"within the previous twelve (12) month period\" implements counts a payment received \"in the current month or in the immediately preceding 12 months\" (7 CFR 273.9(d)(6)(iii)(D)(3), S5090), a test of each issuance month. Before, a payment within the twelve months before the determination gave the allowance in every month of the certification (probe CO-950). Coverage pass 7 for SNAP, C7-2 (docs/reviews/coverage7-snap.md): the window has its lower bound as well: a payment counts for a month only if it was received in that month or before it (273.9(d)(6)(iii)(D)(3), S5090: \"in the current month or in the immediately preceding 12 months\"; (iii): the agency documents \"the date and receipt of a payment ... to ensure the payment was received in the current month or the immediately preceding 12 months\"). Where the most recent payment (CO-7451) came after the month evaluated (an application month before a payment made between the application and the determination), the month is entitled only through an earlier payment received in it or in the twelve months before it, read from energy_assistance_earlier_payment_months (CO-7673), required there (decision 4). Before, a LEAP payment made in November gave an October application month the allowance (probe LIHEAP-LATE: October $312 where the text gives $280)."
statute_override: "Federal law overrides 10 CCR 2506-1 4.407.31.A.1.b: since Pub. L. 119-21 sec. 10103 took effect on enactment (July 4, 2025), LEAP or other energy assistance gives the Heating and Cooling Utility Allowance only to a household with an elderly or disabled member; no CDHS implementing communication was available to this volume (OQ-533)."
derived: [any, snap_incurs_heating_cooling_cost, [all, received_energy_assistance_within_twelve_months, [case, [["<=", energy_assistance_last_payment_month, [month]], ["<=", [month], [months_after, 12, energy_assistance_last_payment_month]]], [else, [">", [sum_months, energy_assistance_earlier_payment_months, [case, [[all, ["<=", [that_month], [month]], ["<=", [month], [months_after, 12, [that_month]]]], 1], [else, 0]]], 0]]], snap_household_has_elderly_or_disabled_member_in_month]]
sources: [S136, S743, S4734, S5090]
effective: {from: "2025-07-04", to: present}
open: [OQ-251, OQ-533]
implemented: engine
tags: [income, snap, legal]
rationale: No existing item decides SUA entitlement (OQ-36); snap_utility_allowance_amount (CO-1500) needs the HCUA test as its first tier.
tests:
  - {id: CO-1243-T1, month: "2026-10", as_of: "2026-10-01", given: {snap_incurs_heating_cooling_cost: true, received_energy_assistance_within_twelve_months: false, snap_household_has_elderly_or_disabled_member_in_month: false}, expect: true}
  - {id: CO-1243-T2, month: "2026-10", title: "LEAP within 12 months, no elderly or disabled member - not entitled under sec. 10103", as_of: "2026-10-01", given: {snap_incurs_heating_cooling_cost: false, received_energy_assistance_within_twelve_months: true, energy_assistance_last_payment_month: "2026-02", snap_household_has_elderly_or_disabled_member_in_month: false}, expect: false}
  - {id: CO-1243-T3, month: "2026-10", as_of: "2026-10-01", given: {snap_incurs_heating_cooling_cost: false, received_energy_assistance_within_twelve_months: true, energy_assistance_last_payment_month: "2026-02", snap_household_has_elderly_or_disabled_member_in_month: true}, expect: true}
  - {id: CO-1243-T4, month: "2026-12", as_of: "2026-10-15", title: "Coverage pass 6 C6-3 (HCUA60): LEAP within twelve months, no heating or cooling cost of its own, and a member who turns 60 in December: entitled in December, the month he is elderly", given: {snap_incurs_heating_cooling_cost: false, received_energy_assistance_within_twelve_months: true, energy_assistance_last_payment_month: "2026-02", snap_household_has_elderly_or_disabled_member_in_month: true}, expect: true}
  - {id: CO-1243-T5, month: "2026-11", as_of: "2026-10-15", title: "Coverage pass 6 C6-3 (HCUA60): the same household in November, before the birthday month: not entitled", given: {snap_incurs_heating_cooling_cost: false, received_energy_assistance_within_twelve_months: true, energy_assistance_last_payment_month: "2026-02", snap_household_has_elderly_or_disabled_member_in_month: false}, expect: false}
  - {id: CO-1243-T6, month: "2027-02", as_of: "2026-10-15", title: "Three-pattern sweep T-10 (CO-950): LEAP last paid in February 2026, an elderly member, no heating or cooling cost of its own: February 2027 is the twelfth month after the payment, entitled", given: {snap_incurs_heating_cooling_cost: false, received_energy_assistance_within_twelve_months: true, energy_assistance_last_payment_month: "2026-02", snap_household_has_elderly_or_disabled_member_in_month: true}, expect: true}
  - {id: CO-1243-T7, month: "2027-03", as_of: "2026-10-15", title: "Three-pattern sweep T-10 (CO-950): the same household in March 2027, more than twelve months after the payment: not entitled", given: {snap_incurs_heating_cooling_cost: false, received_energy_assistance_within_twelve_months: true, energy_assistance_last_payment_month: "2026-02", snap_household_has_elderly_or_disabled_member_in_month: true}, expect: false}
  - {id: CO-1243-T8, month: "2026-11", as_of: "2026-10-15", title: "Three-pattern sweep T-10: a payment received but its month not stated: cannot determine (decision 4)", given: {snap_incurs_heating_cooling_cost: false, received_energy_assistance_within_twelve_months: true, snap_household_has_elderly_or_disabled_member_in_month: true}, expect: unknown}
  # Coverage pass 7 C7-2 (LIHEAP-LATE): an elderly member, heat in the rent, LEAP paid in November 2026 (the most recent payment), no earlier payment ([]);
  # October is before the payment month, so (D)(3)'s "current month or ... immediately preceding 12 months" holds no payment for it: not entitled; November: entitled.
  - {id: CO-1243-T9, month: "2026-10", as_of: "2026-11-10", title: "C7-2: LEAP paid in November is not a payment of October or the twelve months before it: not entitled in October", given: {snap_incurs_heating_cooling_cost: false, received_energy_assistance_within_twelve_months: true, energy_assistance_last_payment_month: "2026-11", energy_assistance_earlier_payment_months: [], snap_household_has_elderly_or_disabled_member_in_month: true}, expect: false}
  - {id: CO-1243-T10, month: "2026-11", as_of: "2026-11-10", title: "C7-2: the same household in November, the payment month: entitled", given: {snap_incurs_heating_cooling_cost: false, received_energy_assistance_within_twelve_months: true, energy_assistance_last_payment_month: "2026-11", energy_assistance_earlier_payment_months: [], snap_household_has_elderly_or_disabled_member_in_month: true}, expect: true}
  # An earlier payment in February 2026: October 2026 is the eighth month after it (within twelve): entitled.
  - {id: CO-1243-T11, month: "2026-10", as_of: "2026-11-10", title: "C7-2: an earlier payment in February 2026 covers October (eight months after it)", given: {snap_incurs_heating_cooling_cost: false, received_energy_assistance_within_twelve_months: true, energy_assistance_last_payment_month: "2026-11", energy_assistance_earlier_payment_months: ["2026-02"], snap_household_has_elderly_or_disabled_member_in_month: true}, expect: true}
  # An earlier payment in September 2025: October 2026 is the thirteenth month after it: not entitled.
  - {id: CO-1243-T12, month: "2026-10", as_of: "2026-11-10", title: "C7-2: an earlier payment in September 2025 is more than twelve months before October 2026", given: {snap_incurs_heating_cooling_cost: false, received_energy_assistance_within_twelve_months: true, energy_assistance_last_payment_month: "2026-11", energy_assistance_earlier_payment_months: ["2025-09"], snap_household_has_elderly_or_disabled_member_in_month: true}, expect: false}
  # The earlier payments not stated, the most recent after the month: cannot determine (decision 4).
  - {id: CO-1243-T13, month: "2026-10", as_of: "2026-11-10", title: "C7-2: the most recent payment after the month and no earlier payments stated: cannot determine (decision 4)", given: {snap_incurs_heating_cooling_cost: false, received_energy_assistance_within_twelve_months: true, energy_assistance_last_payment_month: "2026-11", snap_household_has_elderly_or_disabled_member_in_month: true}, expect: unknown}
