id: CO-1243
name: "SNAP: entitled to the heating and cooling utility allowance"
identifier: snap_entitled_to_heating_cooling_allowance
kind: derived
type: yes/no
scope: person-month
program: SNAP
meaning: "Whether, in the month evaluated, the person's SNAP household is entitled to the Heating and Cooling Utility Allowance: it incurs or anticipates heating or cooling costs separate from rent or mortgage, or it received LEAP or E-EBT within the previous twelve months and contains an elderly or disabled member in the month (snap_household_has_elderly_or_disabled_member_in_month, CO-6603), per 10 CCR 2506-1 4.407.31.A.1 and Pub. L. 119-21 sec. 10103."
precision: "10 CCR 2506-1 4.407.31.A.1.b as of 2026-10-01 (S743) still grants the HCUA on prior LEAP or E-EBT receipt alone; Pub. L. 119-21 sec. 10103 (S136) limits the energy-assistance route to households with an elderly or disabled member. This item follows the amended statute, as the volume does wherever the rule manual has not caught up (OQ-1, OQ-32); see OQ-251. Coverage pass 6 for SNAP, C6-3 (docs/reviews/coverage6-snap.md): per month, reading the month's elderly or disabled member (CO-6603), as S4-11 made every other reader that turns on the month's household (CO-344, CO-379): prospective budgeting reads \"anticipated income and circumstances during the issuance month\" (10 CCR 2506-1 4.402.1.A, S4734). Before, the item was per person and read the determination month's member (CO-314) in every month, so a household whose member turned 60 after the determination month was denied the allowance in that member's months (probe HCUA60, stored CO-863)."
statute_override: "Federal law overrides 10 CCR 2506-1 4.407.31.A.1.b: since Pub. L. 119-21 sec. 10103 took effect on enactment (July 4, 2025), LEAP or other energy assistance gives the Heating and Cooling Utility Allowance only to a household with an elderly or disabled member; no CDHS implementing communication was available to this volume (OQ-533)."
derived: [any, snap_incurs_heating_cooling_cost, [all, received_energy_assistance_within_twelve_months, snap_household_has_elderly_or_disabled_member_in_month]]
sources: [S136, S743, S4734]
effective: {from: "2025-07-04", to: present}
open: [OQ-251, OQ-533]
implemented: engine
tags: [income, snap, legal]
rationale: No existing item decides SUA entitlement (OQ-36); snap_utility_allowance_amount (CO-1500) needs the HCUA test as its first tier.
tests:
  - {id: CO-1243-T1, month: "2026-10", as_of: "2026-10-01", given: {snap_incurs_heating_cooling_cost: true, received_energy_assistance_within_twelve_months: false, snap_household_has_elderly_or_disabled_member_in_month: false}, expect: true}
  - {id: CO-1243-T2, month: "2026-10", title: "LEAP within 12 months, no elderly or disabled member - not entitled under sec. 10103", as_of: "2026-10-01", given: {snap_incurs_heating_cooling_cost: false, received_energy_assistance_within_twelve_months: true, snap_household_has_elderly_or_disabled_member_in_month: false}, expect: false}
  - {id: CO-1243-T3, month: "2026-10", as_of: "2026-10-01", given: {snap_incurs_heating_cooling_cost: false, received_energy_assistance_within_twelve_months: true, snap_household_has_elderly_or_disabled_member_in_month: true}, expect: true}
  - {id: CO-1243-T4, month: "2026-12", as_of: "2026-10-15", title: "Coverage pass 6 C6-3 (HCUA60): LEAP within twelve months, no heating or cooling cost of its own, and a member who turns 60 in December: entitled in December, the month he is elderly", given: {snap_incurs_heating_cooling_cost: false, received_energy_assistance_within_twelve_months: true, snap_household_has_elderly_or_disabled_member_in_month: true}, expect: true}
  - {id: CO-1243-T5, month: "2026-11", as_of: "2026-10-15", title: "Coverage pass 6 C6-3 (HCUA60): the same household in November, before the birthday month: not entitled", given: {snap_incurs_heating_cooling_cost: false, received_energy_assistance_within_twelve_months: true, snap_household_has_elderly_or_disabled_member_in_month: false}, expect: false}
