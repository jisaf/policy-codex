  - {id: CO-3708-T2, title: "Two siblings in the case with one sponsor: 2", as_of: "2026-10-01", given: {sponsors: [p2], snap_household_members: [p1]}, others: {p2: {}, p3: {}}, relationships: [[sponsor, p2, p1], [sponsor, p2, p3]], expect: 2}
  - {id: CO-3708-T3, title: "The sponsor states four sponsored non-citizens, one in the case: 4", as_of: "2026-10-01", given: {sponsors: [p2], snap_household_members: [p1]}, others: {p2: {non_citizens_sponsored_count: 4}}, relationships: [[sponsor, p2, p1]], expect: 4}
  - {id: CO-3708-T4, title: "A sponsored mother with a citizen son of 6 in her household: 1 + 1 = 2", as_of: "2026-10-01", given: {sponsors: [p2], snap_household_members: [p1, p3]}, others: {p2: {}, p3: {date_of_birth: "2020-03-01", immigration_status: us_citizen}}, relationships: [[sponsor, p2, p1], [parent, p1, p3]], expect: 2}
