id: CO-3708
name: "SNAP: sponsor deeming divisor"
identifier: snap_sponsor_deeming_divisor
kind: derived
type: whole number
scope: person-month
program: SNAP
meaning: "The number among whom the income and resources of this non-citizen's sponsors are divided before they are deemed (10 CCR 2506-1 4.305.2.D.2.c; 7 CFR 273.4(c)(2)(v)): the non-citizens the sponsors have sponsored - the number stated on the sponsors (non_citizens_sponsored_count), or, when that is not stated or smaller, this non-citizen and the persons of the case who share a sponsor with this non-citizen - plus each citizen child under snap_sponsor_deeming_child_age_limit of this non-citizen in this non-citizen's SNAP household, whose share is excluded as (c)(2)(v) directs for a child exempt under (c)(3)(vii)."
precision: "A sponsored child under 18, exempt from deeming by 7 U.S.C. 2014(i)(2)(E) (final verification pass 2 N-3; formerly only under (c)(3)(vi)), is one of the sponsor's non-citizens and so already counted; its share is never deemed because deeming does not apply to it (CO-2337). Where a sponsor and a co-sponsor spouse both signed, the count is stated on one of them only, so the stated counts are added across the sponsors. Unknown when this person's relationships are unstated. Coverage pass 4 for SNAP S4-11 (OQ-1263 resolved): the household and the child's age are read in the month evaluated, since prospective budgeting reads \"anticipated income and circumstances during the issuance month\" (10 CCR 2506-1 4.402.1.A, S4734); a citizen child is under 18 when under it on the first day of the month (the age on the first day of the month; OQ-1262). Before, the age on the determination date in every month."
derived: ["+", [max, ["+", 1, [count, [shared_relative, sponsor]]], [sum, sponsors, [otherwise, [of, [P], non_citizens_sponsored_count], 0]]], [count, [filter, snap_household_members, [all, [rel, [parent], [P]], ["<", [years_between, [of, [P], date_of_birth], [first_day, [month]]], snap_sponsor_deeming_child_age_limit], [in, [of, [P], immigration_status], [us_citizen, us_national]]]]]]
sources: [S2502, S2503, S4734]
implemented: engine
tags: [snap, immigration]
open: [OQ-1262]
rationale: "Final verification F-2: no item divided the sponsor's deemed income and resources among the sponsor's non-citizens. The sponsored persons of the case are read from the sponsor edges (the shared sponsor); the stated count adds those outside the case (CO-3706)."
