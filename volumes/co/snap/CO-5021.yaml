meaning: "The three months of the calendar quarter (January-March, April-June, July-September, October-December) that contains the month, in order: the quarter 7 CFR 273.9(c)(2) and 10 CCR 2506-1 4.405.A read infrequent or irregular income \"in a quarter\" over, which is also the federal fiscal quarter."
