id: CO-1384
name: "SNAP: requires verification of disability"
identifier: snap_requires_verification_of_disability
kind: derived
type: yes/no
scope: person-month
program: SNAP
meaning: "Whether the person's disability must be verified for SNAP: whenever the person is treated as a disabled member, by proof of the disability-based benefit."
derived: [all, snap_is_household_member, snap_is_disabled_member]
sources: [S807]
implemented: engine
tags: [verification, snap, disability]
rationale: No existing item states this verification requirement; the phase-9 chapter needs one requirement item per element so the household's pending count and status can be derived.
tests:
  - {id: CO-1384-T1, month: "2026-10", as_of: "2026-10-01", given: {in_medical_institution: false, snap_is_disabled_member: true}, expect: true}
  - {id: CO-1384-T2, month: "2026-10", as_of: "2026-10-01", given: {in_medical_institution: false, snap_is_disabled_member: false}, expect: false}
