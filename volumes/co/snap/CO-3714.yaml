id: CO-3714
name: "SNAP: household members other than ineligible students"
identifier: snap_household_members_other_than_ineligible_students
kind: derived
type: group of persons
scope: person
program: SNAP
meaning: "The members of this person's SNAP purchase-and-prepare unit (snap_household_members) other than an ineligible student, whom 10 CCR 2506-1 4.411.2.C treats as a non-household member: the persons whose income and resources are available to the household and who are considered in determining its allotment."
precision: "An ineligible student who is also an ineligible non-citizen is prorated as an ineligible non-citizen (4.411.2.A, S2508) and so stays in this group. Unknown when any member's student status is unknown."
derived: [filter, snap_household_members, [any, [of, [P], snap_is_ineligible_non_citizen], [not, [of, [P], snap_is_ineligible_student]]]]
sources: [S2508]
implemented: engine
tags: [snap, household]
rationale: "Final verification F-6 (docs/reviews/final-snap.md): ineligible students stayed in snap_household_members, so their resources were counted (CO-343, CO-1740), they entered the pro rata divisor of an ineligible member's income and expenses (CO-333, CO-371, CO-2300, CO-2301) and the Basic Categorical Eligibility \"all members\" test (CO-336). The purchase-and-prepare unit itself is unchanged, since the student's own participation status reads it."
tests:
  - {id: CO-3714-T1, title: "A parent, a child and an ineligible student: the student is out", as_of: "2026-10-01", given: {snap_household_members: [p1, p2, p3], snap_is_ineligible_student: false, snap_is_ineligible_non_citizen: false}, others: {p2: {snap_is_ineligible_student: false, snap_is_ineligible_non_citizen: false}, p3: {snap_is_ineligible_student: true, snap_is_ineligible_non_citizen: false}}, expect: [p1, p2]}
  - {id: CO-3714-T2, title: "An ineligible student who is also an ineligible non-citizen stays (prorated as a non-citizen)", as_of: "2026-10-01", given: {snap_household_members: [p1, p2], snap_is_ineligible_student: false, snap_is_ineligible_non_citizen: false}, others: {p2: {snap_is_ineligible_student: true, snap_is_ineligible_non_citizen: true}}, expect: [p1, p2]}
