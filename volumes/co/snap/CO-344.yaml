id: CO-344
name: "SNAP: meets the resource limit"
identifier: snap_meets_resource_limit
kind: derived
type: yes/no
scope: person-month
program: SNAP
meaning: "This person's SNAP household meets the resource eligibility standard - exempt because it is categorically eligible, or its countable resources are at or below the resource limit that applies (the higher, elderly/disabled limit if the household has an elderly or disabled member, otherwise the standard limit). Coverage review snap-financial CF-13: at or below follows 7 CFR 273.8(b) (S3120) over the State's \"below\" (S49), as the statute override says."
precision: "Time audit T-3: per month, so the figure is the one in force in the month evaluated (docs/operators.md, Resolution step 2); as a per-person item it gave the determination date's figure in every month. Coverage pass 4 for SNAP resources (docs/reviews/coverage4-snap-resources.md), SR-9 (AGE60R): the limit that applies is read from the household's elderly or disabled member in the month evaluated (snap_household_has_elderly_or_disabled_member_in_month, CO-6603), as the income tests read it since S4-11 and as the household's countable resources (CO-343) now are per month; before, the determination month's member (CO-314) in every month, so a member who turns 60 after an application month gave that month the $4,750 limit."
statute_override: "Federal regulation overrides 10 CCR 2506-1 4.206.C.3.b, under which a standard eligibility household \"must have resources below the limit\": 7 CFR 273.8(b), in force throughout the volume's dates, sets the limit as what a household's resources \"shall not exceed\", so a household whose countable resources equal the limit meets the resource standard."
derived: [any, snap_is_categorically_eligible, ["<=", snap_household_countable_resources, [case, [snap_household_has_elderly_or_disabled_member_in_month, snap_resource_limit_elderly_disabled], [else, snap_resource_limit]]]]
sources: [S49, S57, S3120, S4734]
implemented: engine
tags: [resources, state_election]
rationale: 10 CCR 2506-1 4.408,A (S57) exempts categorically eligible households from the resource test entirely, and 4.206,C,3,b (S49) applies the resource test only to Standard Eligibility households, against whichever of the two 4.408,E limits fits the household; no existing item combines the categorical exemption with the elderly/disabled-dependent limit choice.
