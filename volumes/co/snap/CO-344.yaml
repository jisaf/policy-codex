id: CO-344
name: "SNAP: meets the resource limit"
identifier: snap_meets_resource_limit
kind: derived
type: yes/no
scope: person
program: SNAP
meaning: This person's SNAP household meets the resource eligibility standard - exempt because it is categorically eligible, or its countable resources are at or below the resource limit that applies (the higher, elderly/disabled limit if the household has an elderly or disabled member, otherwise the standard limit).
derived: [any, snap_is_categorically_eligible, [<=, snap_household_countable_resources, [case, [snap_household_has_elderly_or_disabled_member, snap_resource_limit_elderly_disabled], [else, snap_resource_limit]]]]
sources: [S49, S57]
implemented: engine
tags: [resources, state_election]
rationale: 10 CCR 2506-1 4.408,A (S57) exempts categorically eligible households from the resource test entirely, and 4.206,C,3,b (S49) applies the resource test only to Standard Eligibility households, against whichever of the two 4.408,E limits fits the household; no existing item combines the categorical exemption with the elderly/disabled-dependent limit choice.
tests:
  - {id: CO-344-T1, as_of: "2026-10-01", given: {in_medical_institution: false, receives_ssi: true, receives_tanf_cash: false, receives_general_assistance: false, is_disqualified_for_intentional_program_violation: false, is_disqualified_drug_felony: false, countable_liquid_resources: 50000}, others: {}, relationships: [], expect: true}
  - {id: CO-344-T2, as_of: "2026-10-01", month: "2026-10", given: {in_medical_institution: false, receives_ssi: false, receives_tanf_cash: false, receives_general_assistance: false, is_disqualified_for_intentional_program_violation: false, is_disqualified_drug_felony: false, citizenship_status: citizen, earned_income: 4000, self_employment_net_income: 0, social_security_income: 0, pension_income: 0, unemployment_income: 0, child_support_received: 0, cash_assistance_income: 0, other_unearned_income: 0, is_fleeing_felon_or_probation_violator: false, is_disqualified_for_work_requirement_noncompliance: false, countable_liquid_resources: 3500, date_of_birth: "1985-01-01", receives_social_security_disability: false, receives_va_disability_benefits: false, is_disabled_ssa: false, is_blind: false}, others: {}, relationships: [], expect: false}
