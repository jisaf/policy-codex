id: CO-7200
name: "SNAP: the members who hold a funeral agreement for this person"
identifier: snap_funeral_agreement_holders_for_member
kind: derived
type: group of persons
scope: person-month
program: SNAP
meaning: "The members of this person's SNAP household (snap_household_members) on whose holdings list a funeral agreement is held in the month for this person (burial_for person_of_case, for_person naming this person) and read by snap_countable_funeral_agreements (CO-5312): the holders among whom 7 CFR 273.8(e)(2) (S2216: \"the value of one funeral agreement per household member\"; the statute override on snap_countable_funeral_agreements, CO-5312) and 10 CCR 2506-1 4.410.D.4 (S2967) is applied for this person."
precision: "Cross-list records round (docs/reviews/cross-list-records.md): one funeral agreement per household member is the household's, not each holder's, so the funeral agreement excluded for a member is chosen across the lists of every member who holds one for that member. The member is this person and the holder that person: a holder's funeral agreements for this person are read from that person's list ([of, [P], holdings]) and the record's for_person is compared with this person as the persons joined to this person by no edge ([reachable, [spouse], false], the person alone), the reading Adult Financial and Colorado Works use for a veterans benefit's dependent (CO-5017, CO-5651). A holder's list not stated: cannot determine (decision 4). Which holders' resources the household counts is read only where two or more hold one (snap_funeral_agreement_excluded_for_member). Read by snap_countable_funeral_agreements (CO-5312) only when the holder holds one for a member."
derived: [filter, snap_household_members, [">", [largest, [of, [P], holdings], [all, [all, [all, [received_in, [month]], [any, [unknown, [receipt, disposed_date]], [">", [receipt, disposed_date], [case, [["=", [month], [month_of, snap_application_date]], snap_application_date], [else, [first_day, [month]]]]]]], [receipt, accessible], ["=", [lookup, snap_holding_treatment_table, [receipt, kind]], counted_beyond_one_agreement_per_member]], [all, ["=", [receipt, burial_for], person_of_case], [in_group, [receipt, for_person], [reachable, [spouse], false]]], [not, [receipt, irrevocable]]], [receipt, value]], 0]]
sources: [S2216, S2967, S4820, S4823]
implemented: engine
tags: [snap, resources]
rationale: "Coverage pass 4 for SNAP resources, SR-1 (docs/reviews/coverage4-snap-resources.md): snap_countable_funeral_agreements (CO-5312) excluded one funeral agreement per household member on each holder's list, so two members who each held one for the same third member each had one excluded; the holders are the persons the one exclusion for this person is chosen among."
nearest: [CO-3714, CO-5312]
