id: CO-1381
name: "SNAP: requires verification of dependent care"
identifier: snap_requires_verification_of_dependent_care
kind: derived
type: yes/no
scope: person-month
program: SNAP
meaning: "Whether the person's dependent care expenses must be verified for SNAP: verification is required to grant the deduction whenever the expense is claimed at application; at recertification only when it has changed by more than $25 since last verified."
derived: [all, snap_is_household_member, [">", dependent_care_expense, 0], [any, [not, snap_determination_is_recertification], [">", ["-", dependent_care_expense, snap_dependent_care_expense_at_last_certification], snap_recertification_expense_change_threshold], [">", ["-", snap_dependent_care_expense_at_last_certification, dependent_care_expense], snap_recertification_expense_change_threshold]]]
sources: [S832, S818, S1056]
implemented: engine
tags: [verification, snap, income]
rationale: No existing item states this verification requirement; the phase-9 chapter needs one requirement item per element so the household's pending count and status can be derived.
tests:
  - {id: CO-1381-T1, month: "2026-10", as_of: "2026-10-01", given: {snap_resides_in_institution_providing_meals: false, dependent_care_expense: 300, snap_determination_is_recertification: false}, expect: true}
  - {id: CO-1381-T2, month: "2026-10", as_of: "2026-10-01", given: {snap_resides_in_institution_providing_meals: false, dependent_care_expense: 0, snap_determination_is_recertification: false}, expect: false}
  - {id: CO-1381-T3, month: "2026-10", as_of: "2026-10-01", given: {snap_resides_in_institution_providing_meals: false, dependent_care_expense: 300, snap_determination_is_recertification: true, snap_dependent_care_expense_at_last_certification: 300}, expect: false}
