id: CO-1381
name: "SNAP: requires verification of dependent care"
identifier: snap_requires_verification_of_dependent_care
kind: derived
type: yes/no
scope: person-month
program: SNAP
meaning: "Whether the person's dependent care expenses must be verified for SNAP: verification is required to grant the deduction whenever the expense is claimed."
derived: [all, snap_is_household_member, [">", dependent_care_expense, 0]]
sources: [S832, S818]
implemented: engine
tags: [verification, snap, income]
rationale: No existing item states this verification requirement; the phase-9 chapter needs one requirement item per element so the household's pending count and status can be derived.
tests:
  - {id: CO-1381-T1, month: "2026-10", as_of: "2026-10-01", given: {in_medical_institution: false, dependent_care_expense: 300}, expect: true}
  - {id: CO-1381-T2, month: "2026-10", as_of: "2026-10-01", given: {in_medical_institution: false, dependent_care_expense: 0}, expect: false}
