id: CO-377
name: "SNAP: shelter costs"
identifier: snap_shelter_costs
kind: derived
type: money
scope: person-month
program: SNAP
meaning: This person's SNAP household's total monthly shelter costs - the rent or mortgage, taxes and insurance billed to or paid by its members, each counted as that member's eligibility or disqualification allows, plus the standard utility allowance - used to compute the excess shelter deduction.
precision: "Sums snap_counted_shelter_cost_of_member (CO-2300) over every member of snap_household_members (an eligible member's and a fully counted disqualified member's billed cost in full, an ineligible non-citizen's less that member's pro rata share, an ineligible student's none), so a member whose shelter_cost_monthly is unstated makes the total unknown; a member who pays nothing states 0 (phase-10 sweep, OQ-29: the former sum over members with a known value read an unasked member as zero). The standard utility allowance is added once and in full: snap_utility_allowance_amount (CO-1500) is a household-level figure, the same for every member, so it is read for the evaluated person rather than summed over members (phase-8 fix round, S-3; 4.407.31 allows a household one allowance), and 4.411.1.B.2.c does not prorate it."
derived: [+, [sum, snap_household_members, [of, [P], snap_counted_shelter_cost_of_member]], snap_utility_allowance_amount]
sources: [S96, S743, S1600, S1602]
implemented: engine
tags: [income]
rationale: 10 CCR 2506-1 4.407.3,A and E (S96) and 7 CFR 273.9(d)(6)(ii)-(iii) define allowable shelter costs, including the standard utility allowance, as a single household-level shelter cost figure; no existing item combines shelter_cost_monthly and snap_utility_allowance_amount into the total snap_excess_shelter_deduction and snap_is_entitled_to_expedited_service (CO-348, which reads the two facts separately) need as one sum.
tests:
  - {id: CO-377-T1, as_of: "2026-10-01", month: "2026-10", given: {snap_expense_verification_period_has_ended: false, snap_household_members: [p1, p2, p3], shelter_cost_monthly: 1400, snap_is_ineligible_member: false, snap_utility_allowance_amount: 0}, others: {p2: {snap_expense_verification_period_has_ended: false, shelter_cost_monthly: 0, snap_is_ineligible_member: false}, p3: {snap_expense_verification_period_has_ended: false, shelter_cost_monthly: 0, snap_is_ineligible_member: false}}, relationships: [], expect: 1400}
  - {id: CO-377-T2, as_of: "2026-10-01", month: "2026-10", given: {snap_household_members: [p1], shelter_cost_monthly: 0, snap_is_ineligible_member: false, snap_utility_allowance_amount: 0}, others: {}, relationships: [], expect: 0}
  - {id: CO-377-T3, title: "S-3 - two members both state heating costs - rent plus one $616 allowance, not two", as_of: "2026-10-01", month: "2026-10", given: {snap_expense_verification_period_has_ended: false, snap_household_members: [p1, p2], shelter_cost_monthly: 1400, snap_is_ineligible_member: false, snap_entitled_to_heating_cooling_allowance: true, snap_non_heating_utility_cost_count: 3, home_incurs_telephone_cost: true}, others: {p2: {snap_expense_verification_period_has_ended: false, snap_household_members: [p1, p2], shelter_cost_monthly: 0, snap_is_ineligible_member: false, snap_entitled_to_heating_cooling_allowance: true, snap_non_heating_utility_cost_count: 3, home_incurs_telephone_cost: true}}, relationships: [], expect: 2016}
  # Phase-10 sweep (OQ-28): rent billed to an ineligible non-citizen in a household of four counts three quarters; the $616 allowance is added in full (4.411.1.B.2.c).
  - {id: CO-377-T4, as_of: "2026-10-01", month: "2026-10", given: {snap_expense_verification_period_has_ended: false, snap_household_members: [p1, p2, p3, p4], shelter_cost_monthly: 0, snap_is_ineligible_member: false, snap_utility_allowance_amount: 616}, others: {p2: {snap_expense_verification_period_has_ended: false, shelter_cost_monthly: 1200, snap_is_ineligible_member: true, snap_is_disqualified_member_counted_in_full: false, snap_is_ineligible_non_citizen: true, snap_household_members: [p1, p2, p3, p4]}, p3: {snap_expense_verification_period_has_ended: false, shelter_cost_monthly: 0, snap_is_ineligible_member: false}, p4: {snap_expense_verification_period_has_ended: false, shelter_cost_monthly: 0, snap_is_ineligible_member: false}}, relationships: [], expect: 1516}
  # Phase-10 sweep (OQ-29): a member whose shelter cost is unstated makes the total unknown.
  - {id: CO-377-T5, as_of: "2026-10-01", month: "2026-10", given: {snap_household_members: [p1, p2], shelter_cost_monthly: 1400, snap_is_ineligible_member: false, snap_utility_allowance_amount: 0}, others: {p2: {snap_is_ineligible_member: false}}, relationships: [], expect: unknown}
