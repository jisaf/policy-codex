id: CO-1606
name: "SNAP: resources verification is pending"
identifier: snap_resources_verification_is_pending
kind: derived
type: yes/no
scope: person-month
program: SNAP
role: outcome
meaning: Whether SNAP requires verification of the person's questionable resources and it has not been provided.
derived: [all, snap_requires_verification_of_resources, [not, resources_are_verified]]
sources: [S811]
implemented: engine
tags: [verification, snap]
rationale: "Review U-1: the count items held this test as an anonymous arm, so no outcome told a worker which document was outstanding and for whom; the count now sums this item."
tests:
  - {id: CO-1606-T1, month: "2026-10", as_of: "2026-10-01", given: {snap_requires_verification_of_resources: true, resources_verified_by_electronic_data_source: false, resources_verification_document_received: false}, expect: true}
  - {id: CO-1606-T2, month: "2026-10", as_of: "2026-10-01", given: {snap_requires_verification_of_resources: false}, expect: false}
