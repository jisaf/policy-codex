id: CO-2304
name: "SNAP: is in an elderly and disabled separate household"
identifier: snap_is_in_elderly_disabled_separate_household
kind: derived
type: yes/no
scope: person-month
program: SNAP
meaning: "This person is, or is the spouse of, a person granted separate household status under 7 CFR 273.1(b)(2) in the month evaluated (snap_meets_elderly_disabled_separate_household_election), so the person's household is the electing person and spouse, apart from the others with whom they purchase and prepare food."
precision: "Coverage pass 4 for SNAP S4-11 (OQ-1263 resolved): read in the month evaluated, as snap_household_members (CO-305) now is, since prospective budgeting reads \"anticipated income and circumstances during the issuance month\" (10 CCR 2506-1 4.402.1.A, S4734); the election's 60 is snap_is_elderly's (CO-301, 60 on the last day of the month; OQ-1262). A member who turns 60 during the determination month is not a separate household in an application month before it. Before, the election was read for the determination month in every month, since CO-305 was stated per person."
derived: [any, snap_meets_elderly_disabled_separate_household_election, [exists_related, [spouse, holds_out_as_spouse_with], [of, [P], snap_meets_elderly_disabled_separate_household_election]]]
sources: [S1604, S1605, S4734]
implemented: engine
tags: [snap, household]
rationale: "OQ-37: snap_household_members (CO-305) needs to know, for each end of a purchase-and-prepare edge, whether the person belongs to a separate elderly and disabled household; the election itself (CO-419) is computed from the physical residence group, which does not depend on composition, so the composition rule can read it without a cycle. Same-word audit SW-6: SNAP's spouses include persons living together who are free to marry and represent themselves as spouses (7 CFR 273.1(b)(1)(i), S4 B), so the holds_out_as_spouse_with role is read beside the legal spouse."
tests:
