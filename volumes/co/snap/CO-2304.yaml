  - {id: CO-2304-T2, month: "2026-10", title: "The electing person's spouse", as_of: "2026-10-01", given: {snap_meets_elderly_disabled_separate_household_election: {"2026-10": false}}, others: {p2: {snap_meets_elderly_disabled_separate_household_election: {"2026-10": true}}}, relationships: [[spouse, p1, p2]], expect: true}
  - {id: CO-2304-T3, month: "2026-10", title: "Neither the person nor a spouse elects", as_of: "2026-10-01", given: {snap_meets_elderly_disabled_separate_household_election: {"2026-10": false}}, others: {p2: {snap_meets_elderly_disabled_separate_household_election: {"2026-10": false}}}, relationships: [[buys_prepares_with, p1, p2]], expect: false}
