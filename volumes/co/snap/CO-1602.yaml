id: CO-1602
name: "SNAP: ssn verification is pending"
identifier: snap_ssn_verification_is_pending
kind: derived
type: yes/no
scope: person-month
program: SNAP
role: outcome
meaning: Whether SNAP requires verification of the person's Social Security number and it has not been provided.
derived: [all, snap_requires_verification_of_ssn, [not, ssn_is_verified]]
sources: [S804, S823]
implemented: engine
tags: [verification, snap]
rationale: "Review U-1: the count items held this test as an anonymous arm, so no outcome told a worker which document was outstanding and for whom; the count now sums this item."
tests:
  - {id: CO-1602-T1, month: "2026-10", as_of: "2026-10-01", given: {snap_requires_verification_of_ssn: true, ssn_verified_by_electronic_data_source: false, ssn_furnished_or_application_shown: false}, expect: true}
  - {id: CO-1602-T2, month: "2026-10", as_of: "2026-10-01", given: {snap_requires_verification_of_ssn: true, ssn_verified_by_electronic_data_source: true}, expect: false}
