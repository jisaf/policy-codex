id: CO-403
name: "SNAP: weekly earnings"
identifier: snap_weekly_earnings_worked
kind: derived
type: money
scope: person
program: SNAP
meaning: "Earned income and self-employment net income in the month containing the determination date, converted to a weekly average by dividing by snap_weeks_per_month (CO-3041, the 7 CFR 273.10(c)(2) conversion). No reported income counts as 0."
precision: Reads wages_gross and self_employment_net_earnings_for_tax (person-month facts) for the determination date's month via the "at" pattern.
derived: ["/", [+, [otherwise, [at, wages_gross, [det_month]], 0], [otherwise, [at, snap_self_employment_income, [det_month]], 0]], snap_weeks_per_month]
sources: [S121, S123, S126, S2050]
implemented: engine
tags: [work_registration]
rationale: "The work-registration employment exemption's earnings-equivalent test (7 U.S.C. 2015(d)(1)(E); 7 CFR 273.7(b)(1)(vii), S121/S123/S126) needs weekly earnings, not monthly, to compare against the Federal minimum wage times 30 hours; no existing item converts wages_gross to a weekly figure. Fix-round (C-10): 7 CFR 273.7(b)(1)(vii) (S123) covers 'An employed or self-employed person working... or earning weekly wages at least equal to...'; this item omitted self_employment_net_earnings_for_tax, so a self-employed applicant with no W-2 wages failed the earnings prong. Now sums wages_gross and self_employment_net_earnings_for_tax the same way snap_person_earned_income (CO-330) does for income purposes."
tests:
  # Hard-coded numbers audit H-11: 942.5 / 4.3 = 219.1860465116 (was 942.5 x 12 / 52 = 217.5); T3 the same for 1,142.5 less 200 of costs.
  - {id: CO-403-T1, as_of: "2026-10-01", month: "2026-10", given: {wages_gross: 942.5, self_employment_gross_receipts: 0, self_employment_net_earnings_for_tax: 0, child_support_paid_legally_obligated: 0, earnings: [{kind: wages, amount: 942.5}]}, expect: 219.18604651162792}
  - {id: CO-403-T2, as_of: "2026-10-01", month: "2026-10", given: {wages_gross: 0, self_employment_gross_receipts: 0, self_employment_net_earnings_for_tax: 0, child_support_paid_legally_obligated: 0, earnings: []}, expect: 0}
  - {id: CO-403-T3, as_of: "2026-10-01", month: "2026-10", given: {wages_gross: 0, self_employment_gross_receipts: 1142.5, snap_self_employment_costs: 200, child_support_paid_legally_obligated: 0, earnings: [{kind: self_employment_receipts, amount: 1142.5}]}, expect: 219.18604651162792}
