id: CO-403
name: "SNAP: weekly earnings"
identifier: snap_weekly_earnings_worked
kind: derived
type: money
scope: person
program: SNAP
meaning: "Earned income and self-employment net income in the month containing the determination date, converted to a weekly average by dividing by snap_weeks_per_month (CO-3041, the 7 CFR 273.10(c)(2) conversion): the pay received in the month (snap_person_pay_received, CO-5119) and the net self-employment income (snap_self_employment_income, CO-1702)."
precision: "Earned-income records, step E1 (SNAP; docs/reviews/records-earnings-snap.md): the pay is the month's pay for work as an employee as received, read from the earnings records (snap_person_pay_received), in place of wages_gross. No reported income no longer counts as 0: earnings not stated cannot determine the weekly earnings (decision 4 of 2026-11-23); a stated empty list is 0."
derived: ["/",["+",["at","snap_person_pay_received",["det_month"]],["at","snap_self_employment_income",["det_month"]]],"snap_weeks_per_month"]
sources: [S121, S123, S126, S2050]
implemented: engine
tags: [work_registration]
rationale: "The work-registration employment exemption's earnings-equivalent test (7 U.S.C. 2015(d)(1)(E); 7 CFR 273.7(b)(1)(vii), S121/S123/S126) needs weekly earnings, not monthly, to compare against the Federal minimum wage times 30 hours; no existing item converts wages_gross to a weekly figure. Fix-round (C-10): 7 CFR 273.7(b)(1)(vii) (S123) covers 'An employed or self-employed person working... or earning weekly wages at least equal to...'; this item omitted self_employment_net_earnings_for_tax, so a self-employed applicant with no W-2 wages failed the earnings prong. Now sums wages_gross and self_employment_net_earnings_for_tax the same way snap_person_earned_income (CO-330) does for income purposes. Earned-income records, step E1 (SNAP; docs/reviews/records-earnings-snap.md): reads snap_person_pay_received (CO-5119); the reader defaults are removed."
tests:
