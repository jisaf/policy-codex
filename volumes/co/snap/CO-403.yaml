  - {id: CO-403-T2, as_of: "2026-10-01", month: "2026-10", given: {wages_gross: 0, self_employment_gross_receipts: 0, self_employment_net_earnings_for_tax: 0, child_support_paid_legally_obligated: 0, earnings: []}, expect: 0}
  - {id: CO-403-T3, as_of: "2026-10-01", month: "2026-10", given: {earnings: [{kind: self_employment_receipts, amount: 1142.5, annual_support: false}, {kind: business_cost_operating, amount: 200}]}, expect: 219.18604651162792}
  - {id: CO-403-T4, as_of: "2026-10-01", month: "2026-10", title: "Earnings not stated: cannot determine", given: {}, expect: unknown}
