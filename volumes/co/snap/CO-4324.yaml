id: CO-4324
name: "SNAP: person wages"
identifier: snap_person_wages
kind: derived
type: money
scope: person-month
program: SNAP
meaning: "The person's gross wages for the month as SNAP counts them (10 CCR 2506-1 4.402.A.2, 4.403.3): pay under an annually renewable contract averaged over twelve months (annual_contract_pay over snap_annual_averaging_months, in place of the contract pay received in the month); otherwise, for pay received weekly, every two weeks or twice a month, the gross pay per period times the 4.402.A.2 multiplier (snap_income_conversion_rate_table), with any work-study earnings and any infrequent or irregular earnings received in the month (neither is regular pay); otherwise the wages received in the month (wages_gross)."
precision: "Reads the pay schedule the case states for the person (wages_pay_frequency, CO-3921; wages_gross_per_pay_period, CO-3922, which leaves out work-study earnings, so they are added back here and excluded by snap_excluded_earned_income, CO-2338). 4.402.A.2 converts \"When a full month's income is anticipated\", using the cents of the weekly or biweekly pay; a month in which a job begins or ends has no full month's income, and a case evaluating such a month states no per-period pay, so the month's wages are read. Monthly pay needs no conversion. The parts of wages_gross that SNAP excludes (CO-2338) are the month's own amounts and are subtracted from this figure. 7 CFR 273.10(c)(2)(i) (S2050) also lets a State use the exact monthly figure; Colorado's rule requires the conversion (\"shall have income converted\", S3112). Coverage pass 2 C2-1: the per-period pay is the regular pay only, so the month's infrequent or irregular earnings (infrequent_or_irregular_earned_income_received, CO-4010), part of wages_gross, are added back with work-study, and snap_excluded_earned_income (CO-2338) subtracts each only when 4.405 excludes it; before, an excluded odd-job payment was subtracted from a figure that never held it, and a counted one was dropped. The excluded parts of the regular pay (SCSEP, combat pay, WIOA on-the-job training of a member under 19, summer youth wages, military education deductions) are converted at the same rate as the pay (snap_regular_wages_conversion_factor, CO-4682). Coverage pass 3 C3-8: contract income is not averaged for a migrant or seasonal farmworker household that is destitute (4.402.2.A.4, last paragraph: \"shall not be averaged or annualized for migrant households that are destitute of income\", S3113); its month's wages are read as received, as CO-4329 does for self-employment."
derived: [case, [[all, [">", [otherwise, annual_contract_pay, 0], 0], [not, [otherwise, is_destitute_migrant_or_seasonal_farmworker, false]]], ["+", ["-", wages_gross, [otherwise, annual_contract_wages_received, 0]], ["/", annual_contract_pay, snap_annual_averaging_months]]], [[all, [in, [otherwise, wages_pay_frequency, "monthly"], [weekly, biweekly, semimonthly]], [not, [unknown, wages_gross_per_pay_period]]], ["+", ["*", wages_gross_per_pay_period, [lookup, snap_income_conversion_rate_table, wages_pay_frequency]], [otherwise, work_study_earnings, 0], [otherwise, infrequent_or_irregular_earned_income_received, 0]]], [else, wages_gross]]
sources: [S3112, S3113, S3115, S2050]
implemented: engine
tags: [snap, income]
rationale: "Coverage review snap-financial CF-3: SNAP read wages_gross, the month's receipts, so a weekly earner's month with five paydays was counted at five weeks' pay instead of 4.3, and a school employee paid over nine months had no income in the summer. The pay schedule facts LEAP reads (CO-3921, CO-3922) give the conversion; the contract facts (CO-4325, CO-4326) give the twelve-month average."
tests:
  - {id: CO-4324-T1, title: "Paid $250 a week, five paydays in the month: 4.3 x 250 = $1,075", month: "2027-01", as_of: "2027-01-15", given: {wages_gross: 1250, wages_pay_frequency: weekly, wages_gross_per_pay_period: 250}, expect: 1075}
  - {id: CO-4324-T2, title: "Paid $600.50 every two weeks: 2.15 x 600.50 = $1,291.075, the cents kept", month: "2027-01", as_of: "2027-01-15", given: {wages_gross: 1801.5, wages_pay_frequency: biweekly, wages_gross_per_pay_period: 600.5}, expect: 1291.075}
  - {id: CO-4324-T3, title: "Paid monthly: the month's wages", month: "2027-01", as_of: "2027-01-15", given: {wages_gross: 2000, wages_pay_frequency: monthly, wages_gross_per_pay_period: 2000}, expect: 2000}
  - {id: CO-4324-T4, title: "No pay schedule stated: the month's wages", month: "2027-01", as_of: "2027-01-15", given: {wages_gross: 900}, expect: 900}
  - {id: CO-4324-T5, title: "A teacher with a $36,000 contract paid over ten months, nothing paid in July: $3,000 a month", month: "2027-07", as_of: "2027-07-15", given: {wages_gross: 0, annual_contract_pay: 36000, annual_contract_wages_received: 0}, expect: 3000}
  - {id: CO-4324-T6, title: "The same teacher in October, paid $3,600 under the contract plus $200 for coaching: $3,200", month: "2026-10", as_of: "2026-10-15", given: {wages_gross: 3800, annual_contract_pay: 36000, annual_contract_wages_received: 3600}, expect: 3200}
  - {id: CO-4324-T7, title: "Weekly pay of $250 and $100 of work-study in the month: 1,075 + 100", month: "2027-01", as_of: "2027-01-15", given: {wages_gross: 1350, wages_pay_frequency: weekly, wages_gross_per_pay_period: 250, work_study_earnings: 100}, expect: 1175}
  - {id: CO-4324-T8, title: "Coverage pass 2 C2-1: $250 weekly and a $20 odd job in February (wages_gross 1,020): 1,075 + 20", month: "2027-02", as_of: "2027-02-15", given: {wages_gross: 1020, wages_pay_frequency: weekly, wages_gross_per_pay_period: 250, infrequent_or_irregular_earned_income_received: 20}, expect: 1095}
  - {id: CO-4324-T9, title: "Coverage pass 3 C3-8: a destitute migrant farmworker under an annual contract - the month's $900 as received, not averaged", month: "2026-10", as_of: "2026-10-12", given: {annual_contract_pay: 24000, wages_gross: 900, is_destitute_migrant_or_seasonal_farmworker: true}, expect: 900}
