id: CO-4324
name: "SNAP: person wages"
identifier: snap_person_wages
kind: derived
type: money
scope: person-month
program: SNAP
meaning: "The person's pay for work as an employee for the month as SNAP counts it before its exclusions (10 CCR 2506-1 4.402.A.2, 4.403.3; 7 CFR 273.9(b)(1)(i), 273.10(c)(2)(i)): each earnings record whose row in snap_earnings_treatment_table is a pay row (counted, counted_no_rule_excludes, excluded, excluded_in_combat_zone, excluded_under_19_with_parent) received in the month, each at its own amount: infrequent or irregular pay as received; pay under an annually renewable contract (annual_contract_pay) averaged over snap_annual_averaging_months (4.403.3), except for a destitute migrant or seasonal farmworker household (4.402.2.A.4, last paragraph); a pay made weekly, every two weeks, twice a month or less often converted by the 4.402.A.2 multiplier for its frequency (snap_income_conversion_rate_table), the stream's per-pay amount times the multiplier, or, for a dated weekly or biweekly pay, its amount times the multiplier divided by the number of paydays of its schedule in the month, when a full month's income is anticipated (the job neither begins nor ends in the month); every other pay as received."
precision: "Earned-income records, step E1 (SNAP; docs/reviews/records-earnings-snap.md): each pay is converted by its own frequency (design 2.5: per-record conversion), so two jobs on different schedules are each converted, and a part of a pay that SNAP excludes is its own record converted by its own frequency, which retires snap_regular_wages_conversion_factor (CO-4682). The exclusions are left to snap_person_counted_wages (CO-5113; registered siblings: the same conversion), and snap_excluded_earned_income (CO-2338) is this figure less that one. 4.402.A.2 converts \"When a full month's income is anticipated\" and 7 CFR 273.10(c)(2)(i) (S2050) \"Whenever a full month's income is anticipated but is received on a weekly or biweekly basis\": a pay whose job begins or ends in the month (job_start_date, job_end_date) is read as received; a record that states neither date began before and continues through the month (CO-5100). A stream (no date) converts its per_payment, which is then required (a weekly stream with no per-pay amount cannot be determined: decision 4 of 2026-11-23); a dated weekly or biweekly pay is one of the paydays its schedule has in the month (7 or 14 days apart from its date, counted within the month), so the month's dated pays of one job average to the same multiple of the pay as the stream (design 4.4, ME-5): four dated weekly pays of x in a four-payday month or five in a five-payday month give 4.3x. A dated pay of another frequency is read in its month as received. Monthly pay needs no conversion. Contract pay is averaged whatever the month's receipt under the contract (4.403.3, S3115), so a contract record states annual_contract_pay in every month it covers, a month with no pay included (amount 0). Coverage pass 3 C3-8: contract income is not averaged for a migrant or seasonal farmworker household that is destitute (4.402.2.A.4, last paragraph: \"shall not be averaged or annualized for migrant households that are destitute of income\", S3113). Earnings not stated: cannot determine; a stated empty list is 0."
