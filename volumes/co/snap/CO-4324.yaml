sources: [S41, S3112, S3113, S3115, S2050]
implemented: engine
tags: [snap, income]
siblings:
  - {id: CO-5113, reason: "Both convert each pay by 4.402.A.2 (and average contract pay by 4.403.3) with the same expression: this item for the whole pay, snap_person_counted_wages for the part SNAP counts; a change to one is a change to the other."}
rationale: "Coverage review snap-financial CF-3: SNAP read wages_gross, the month's receipts, so a weekly earner's month with five paydays was counted at five weeks' pay instead of 4.3, and a school employee paid over nine months had no income in the summer. The pay schedule facts LEAP reads (CO-3921, CO-3922) give the conversion; the contract facts (CO-4325, CO-4326) give the twelve-month average. Earned-income records, step E1 (SNAP; docs/reviews/records-earnings-snap.md): the pay is the earnings records SNAP's table treats as pay, each converted by its own frequency; before, wages_gross with its parts added back and a conversion ratio for the excluded parts (CO-4682)."
tests:
  - {id: CO-4324-T1, title: "Paid $250 a week, five paydays in the month: 4.3 x 250 = $1,075", month: "2027-01", as_of: "2027-01-15", given: {wages_gross: 1250, wages_pay_frequency: weekly, wages_gross_per_pay_period: 250, earnings: [{kind: wages, amount: 1250, frequency: weekly, per_payment: 250}, {kind: self_employment_receipts}]}, expect: 1075}
  - {id: CO-4324-T2, title: "Paid $600.50 every two weeks: 2.15 x 600.50 = $1,291.075, the cents kept", month: "2027-01", as_of: "2027-01-15", given: {wages_gross: 1801.5, wages_pay_frequency: biweekly, wages_gross_per_pay_period: 600.5, earnings: [{kind: wages, amount: 1801.5, frequency: biweekly, per_payment: 600.5}, {kind: self_employment_receipts}]}, expect: 1291.075}
  - {id: CO-4324-T3, title: "Paid monthly: the month's wages", month: "2027-01", as_of: "2027-01-15", given: {wages_gross: 2000, wages_pay_frequency: monthly, wages_gross_per_pay_period: 2000, earnings: [{kind: wages, amount: 2000, frequency: monthly, per_payment: 2000}, {kind: self_employment_receipts}]}, expect: 2000}
  - {id: CO-4324-T4, title: "No pay schedule stated: the month's wages", month: "2027-01", as_of: "2027-01-15", given: {wages_gross: 900, earnings: [{kind: wages, amount: 900}, {kind: self_employment_receipts}]}, expect: 900}
  - {id: CO-4324-T5, title: "A teacher with a $36,000 contract paid over ten months, nothing paid in July: 36,000 / 12 = $3,000 a month", month: "2027-07", as_of: "2027-07-15", given: {earnings: [{kind: wages, amount: 0, month: "2027-07", annual_contract_pay: 36000}]}, expect: 3000}
  - {id: CO-4324-T6, title: "The same teacher in October, paid $3,600 under the contract plus $200 for coaching: $3,200", month: "2026-10", as_of: "2026-10-15", given: {wages_gross: 3800, annual_contract_pay: 36000, annual_contract_wages_received: 3600, earnings: [{kind: wages, amount: 200}, {kind: wages, amount: 3600, annual_contract_pay: 36000}, {kind: self_employment_receipts}]}, expect: 3200}
  - {id: CO-4324-T7, title: "Weekly pay of $250 and $100 of work-study in the month: 1,075 + 100", month: "2027-01", as_of: "2027-01-15", given: {wages_gross: 1350, wages_pay_frequency: weekly, wages_gross_per_pay_period: 250, work_study_earnings: 100, earnings: [{kind: wages, amount: 1250, frequency: weekly, per_payment: 250}, {kind: work_study, amount: 100}, {kind: self_employment_receipts}]}, expect: 1175}
  - {id: CO-4324-T8, title: "Coverage pass 2 C2-1: $250 weekly and a $20 odd job in February (wages_gross 1,020): 1,075 + 20", month: "2027-02", as_of: "2027-02-15", given: {wages_gross: 1020, wages_pay_frequency: weekly, wages_gross_per_pay_period: 250, infrequent_or_irregular_earned_income_received: 20, earnings: [{kind: wages, amount: 1000, frequency: weekly, per_payment: 250}, {kind: wages, irregular: true, amount: 20}, {kind: self_employment_receipts}]}, expect: 1095}
  - {id: CO-4324-T9, title: "Coverage pass 3 C3-8: a destitute migrant farmworker under an annual contract of $24,000 - the month's $900 as received, not averaged", month: "2026-10", as_of: "2026-10-12", given: {is_destitute_migrant_or_seasonal_farmworker: true, earnings: [{kind: wages, amount: 900, annual_contract_pay: 24000}]}, expect: 900}
  # Earned-income records, step E1: each pay converted by its own frequency (4.402.A.2).
  - {id: CO-4324-T10, title: "Two jobs: $250 a week and $600.50 every two weeks: 250 x 4.3 + 600.50 x 2.15 = 1,075 + 1,291.075 = 2,366.075", month: "2027-01", as_of: "2027-01-15", given: {earnings: [{kind: wages, amount: 1250, frequency: weekly, per_payment: 250}, {kind: wages, amount: 1201, frequency: biweekly, per_payment: 600.5}]}, expect: 2366.075}
