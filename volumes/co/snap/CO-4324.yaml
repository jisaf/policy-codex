  - {id: CO-4324-T14, title: "A weekly job begun January 13, 2027: no full month, the $750 of three pays as received", month: "2027-01", as_of: "2027-01-15", given: {earnings: [{kind: wages, amount: 750, frequency: weekly, per_payment: 250, job_start_date: "2027-01-13"}]}, expect: 750}
