id: CO-1386
name: "SNAP: requires verification of work hours"
identifier: snap_requires_verification_of_work_hours
kind: derived
type: yes/no
scope: person-month
program: SNAP
meaning: "Whether the person's work hours must be verified for SNAP: for an individual subject to the time limit who meets the work requirement by working."
derived: [all, snap_is_household_member, [not, snap_is_exempt_from_abawd_time_limit], [">", hours_worked, 0]]
sources: [S810]
implemented: engine
tags: [verification, snap, abawd]
rationale: No existing item states this verification requirement; the phase-9 chapter needs one requirement item per element so the household's pending count and status can be derived.
tests:
  - {id: CO-1386-T1, month: "2026-10", as_of: "2026-10-01", given: {in_medical_institution: false, snap_is_exempt_from_abawd_time_limit: false, hours_worked: 90}, expect: true}
  - {id: CO-1386-T2, month: "2026-10", as_of: "2026-10-01", given: {in_medical_institution: false, snap_is_exempt_from_abawd_time_limit: true, hours_worked: 90}, expect: false}
  - {id: CO-1386-T3, month: "2026-10", as_of: "2026-10-01", given: {in_medical_institution: false, snap_is_exempt_from_abawd_time_limit: false, hours_worked: 0}, expect: false}
