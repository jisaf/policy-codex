id: CO-1386
name: "SNAP: requires verification of work hours"
identifier: snap_requires_verification_of_work_hours
kind: derived
type: yes/no
scope: person-month
program: SNAP
meaning: "Whether the person's work hours must be verified for SNAP: for an individual subject to the time limit who meets the work requirement by working (for money, in exchange for goods or services, or without pay, 10 CCR 2506-1 4.311.B.1.a, community service included), by combining work and a work program, or by participating in a work or workfare program that the State agency does not operate or supervise (7 CFR 273.2(f)(1)(xiv)(A))."
precision: "Duplicate-paths audit D-S6 (docs/reviews/duplicate-paths-audit.md): the unpaid, in-kind and community service hours are read as snap_meets_abawd_work_requirement (CO-415) reads them (snap_abawd_unpaid_work_hours, CO-6003), so every hour that can meet the requirement by working is an hour this item asks to verify. 10 CCR 2506-1 4.311 accepts the client's statement for the ABAWD requirements \"unless questionable\" (D-82); 273.2(f)(1)(xiv)(A) requires the verification, which this item keeps."
derived: [all, snap_is_household_member, [not, snap_is_exempt_from_abawd_time_limit], [any, [">", hours_worked, 0], [">", snap_abawd_unpaid_work_hours, 0], [all, [">", work_program_hours, 0], [not, snap_work_program_is_operated_or_supervised_by_state_agency]]]]
sources: [S810, S132, S129]
implemented: engine
tags: [verification, snap, abawd]
rationale: "No existing item states this verification requirement; the phase-9 chapter needs one requirement item per element so the household's pending count and status can be derived. Heavier-definitions audit L-6 (audit fix round 4): the hours of a work or workfare program the State agency does not operate or supervise are verified too. Duplicate-paths audit D-S6 (docs/reviews/duplicate-paths-audit.md): reads CO-6003, so unpaid and community service work is verified as CO-415 counts it."
tests:
  - {id: CO-1386-T1, month: "2026-10", as_of: "2026-10-01", given: {snap_resides_in_institution_providing_meals: false, snap_is_exempt_from_abawd_time_limit: false, hours_worked: 90}, expect: true}
  - {id: CO-1386-T2, month: "2026-10", as_of: "2026-10-01", given: {snap_resides_in_institution_providing_meals: false, snap_is_exempt_from_abawd_time_limit: true, hours_worked: 90}, expect: false}
  - {id: CO-1386-T3, month: "2026-10", as_of: "2026-10-01", given: {snap_resides_in_institution_providing_meals: false, snap_is_exempt_from_abawd_time_limit: false, hours_worked: 0, work_program_hours: 0}, expect: false}
  - {id: CO-1386-T4, month: "2026-10", as_of: "2026-10-01", title: "L-6: no paid work; 80 hours in a nonprofit workfare program the State agency does not run", given: {snap_resides_in_institution_providing_meals: false, snap_is_exempt_from_abawd_time_limit: false, hours_worked: 0, work_program_hours: 80, snap_work_program_is_operated_or_supervised_by_state_agency: false}, expect: true}
  - {id: CO-1386-T5, month: "2026-10", as_of: "2026-10-01", title: "L-6: 80 hours in SNAP Employment and Training, which the State agency operates", given: {snap_resides_in_institution_providing_meals: false, snap_is_exempt_from_abawd_time_limit: false, hours_worked: 0, work_program_hours: 80, snap_work_program_is_operated_or_supervised_by_state_agency: true}, expect: false}
  # Duplicate-paths audit D-S6: the household SNAP-unpaid-work.
  - {id: CO-1386-T6, month: "2026-10", as_of: "2026-10-01", title: "D-S6: an ABAWD meeting the requirement with 85 hours of unpaid work and no paid hours: verified (was false)", given: {snap_is_household_member: true, snap_is_exempt_from_abawd_time_limit: false, hours_worked: 0, unpaid_or_in_kind_work_hours: 85, community_service_hours: 0, work_program_hours: 0}, expect: true}
  - {id: CO-1386-T7, month: "2026-10", as_of: "2026-10-01", title: "D-S6: 80 hours of community service only: verified", given: {snap_is_household_member: true, snap_is_exempt_from_abawd_time_limit: false, hours_worked: 0, community_service_hours: 80, work_program_hours: 0}, expect: true}
  - {id: CO-1386-T8, month: "2026-10", as_of: "2026-10-01", title: "No work of any kind: nothing to verify", given: {snap_is_household_member: true, snap_is_exempt_from_abawd_time_limit: false, hours_worked: 0, unpaid_or_in_kind_work_hours: 0, community_service_hours: 0, work_program_hours: 0}, expect: false}
