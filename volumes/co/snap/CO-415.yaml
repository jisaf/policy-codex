id: CO-415
name: "SNAP: meets the ABAWD work requirement for the month"
identifier: snap_meets_abawd_work_requirement
kind: derived
type: yes/no
scope: person-month
program: SNAP
meaning: "For the month the person worked - for money, in exchange for goods or services, or without pay (10 CCR 2506-1 4.311.B.1.a) - participated in a work program, or did a combination of these for at least snap_abawd_work_hours_per_month (80) hours, or participated in and complied with the Colorado Workfare program."
precision: "Final verification F-12: the hours are hours_worked (paid work, CO-022), unpaid_or_in_kind_work_hours (CO-1915) and community_service_hours (CO-1916), the last two being 4.311.B.1.a.ii-iii's in-kind and unpaid work; that unpaid work is verified by its provider is the work hours verification's concern (snap_requires_verification_of_work_hours, CO-1386). Each is read as zero when not stated. Coverage review C-9: hours of work, a work program or workfare missed for good cause while the absence is temporary and the person keeps the work (snap_abawd_work_hours_missed_for_good_cause, CO-4264; 4.311.3.B, 273.24(a)(2)) count with the hours done, read as zero when not stated. Coverage pass 4 S4-13 (decision 4): the paid hours are snap_hours_worked_in_month (CO-6604), the reading snap_requires_verification_of_work_hours (CO-1386) also takes, so the two agree; unstated hours of a person whose earnings records state pay are cannot determine, unless another way of meeting the requirement settles it. Coverage pass 4 S4-14: the work program, unpaid, community service and good-cause hours keep their reading of 0 when not stated, the rule giving it: the requirement is met by hours the person shows and verifies (4.311.B.1, S132; 7 CFR 273.2(f)(1)(xiv)(A), S810, \"the State agency shall verify the number of hours\"; good cause is shown under 4.311.3.B), so hours not shown are not counted toward it."
derived: ["any", [">=", "snap_hours_worked_in_month", "snap_abawd_work_hours_per_month"], [">=", ["+", "snap_hours_worked_in_month", "snap_abawd_unpaid_work_hours", ["otherwise", "work_program_hours", 0], ["otherwise", "snap_abawd_work_hours_missed_for_good_cause", 0]], "snap_abawd_work_hours_per_month"], "participates_in_workfare"]
sources: [S129, S132, S3060, S3061]
implemented: engine
tags: [abawd]
rationale: "7 CFR 273.24(a)(1) and 10 CCR 2506-1 4.311.B (S129, S132) state the 20-hours-a-week-averaged-monthly requirement as 80 hours combining work and work-program participation, or workfare participation; this item is the fact snap_abawd_countable_month reads, matching the structure of the mwr volume's WR-312. Fix-round (C-2): this item's addition of hours_worked and work_program_hours was double-counting work-program hours because hours_worked's own stated meaning included work-program participation. Fixed by narrowing hours_worked's meaning (CO-022) to paid employment only, so the two facts are now disjoint and the sum here is the 'any combination' the statute (S127) and regulation (S129) require, not a double count. Duplicate-paths audit D-S6 (docs/reviews/duplicate-paths-audit.md): the unpaid, in-kind and community service hours are snap_abawd_unpaid_work_hours (CO-6003), which the work hours verification (CO-1386) reads too."
tests:
  - {id: CO-415-T1, month: "2026-10", given: {earnings: [{kind: wages, amount: 1000}], hours_worked: 80, work_program_hours: 0, participates_in_workfare: false}, expect: true}
  - {id: CO-415-T2, month: "2026-10", given: {earnings: [{kind: wages, amount: 1000}], hours_worked: 40, work_program_hours: 30, participates_in_workfare: false}, expect: false}
  - {id: CO-415-T3, month: "2026-10", given: {hours_worked: 0, work_program_hours: 0, participates_in_workfare: true}, expect: true}
  # Final verification F-12: in-kind and unpaid work count (4.311.B.1.a.ii-iv).
  - {id: CO-415-T4, title: "50 paid hours and 35 hours of verified volunteer work: 85, met", as_of: "2026-10-01", month: "2026-10", given: {earnings: [{kind: wages, amount: 1000}], hours_worked: 50, unpaid_or_in_kind_work_hours: 35, work_program_hours: 0, participates_in_workfare: false}, expect: true}
  - {id: CO-415-T5, title: "Coverage review C-9: 60 hours worked and a week (20 hours) missed for illness, job kept", month: "2026-10", given: {earnings: [{kind: wages, amount: 1000}], hours_worked: 60, snap_abawd_work_hours_missed_for_good_cause: 20, participates_in_workfare: false}, expect: true}
  # Coverage pass 4 for SNAP, S4-13 (decision 4): hours worked are snap_hours_worked_in_month (CO-6604).
  - {"id": "CO-415-T6", "title": "S4-13: wages stated, hours not stated, no other hours: cannot determine", "month": "2026-10", "given": {"earnings": [{"kind": "wages", "amount": 1000}], "participates_in_workfare": false}, "expect": "unknown"}
  - {"id": "CO-415-T7", "title": "S4-13: 85 paid hours stated: met whatever the other hours (85 >= 80)", "month": "2026-10", "given": {"earnings": [{"kind": "wages", "amount": 1000}], "hours_worked": 85, "participates_in_workfare": false}, "expect": true}
