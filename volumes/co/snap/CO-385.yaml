id: CO-385
name: "SNAP: allotment"
identifier: snap_allotment
kind: derived
type: money
scope: person-month
program: SNAP
meaning: This person's SNAP household's allotment for the month - the full month allotment (snap_full_month_allotment), except in the household's initial month of application, when it is the prorated initial month allotment, or nothing if that is less than the minimum allotment (10 CCR 2506-1 4.207.2, 4.207.3.B).
precision: "Phase-10 sweep (OQ-38, P-4): the full-month computation, with its minimum-allotment floor for one- and two-person households and its zero for a household failing a test, moved unchanged to snap_full_month_allotment (CO-2307). In an initial month (snap_is_initial_month, CO-2305) the benefit is snap_prorated_initial_month_allotment (CO-2308), which takes no minimum, and 4.207.3.B issues no benefits when it is less than the federal minimum allotment (snap_minimum_allotment), whatever the household's size."
derived: [case, [snap_is_initial_month, [case, [["<", snap_prorated_initial_month_allotment, snap_minimum_allotment], 0], [else, snap_prorated_initial_month_allotment]]], [else, snap_full_month_allotment]]
sources: [S85, S104, S105, S737, S1615, S1616, S1617]
implemented: engine
tags: [income]
rationale: "7 CFR 273.10(e)(2)(ii)(A) and (C) (S104) state the maximum-allotment-less-reduction formula and the one-/two-person minimum allotment floor; no existing item combines snap_maximum_allotment, snap_benefit_reduction, and snap_minimum_allotment into the single dollar figure snap_is_eligible and snap_eligibility_status both read. Fix-round (C-4): added a leading arm that floors the allotment at 0 whenever the household fails the gross income, net income, or resource test, so a one- or two-person household that fails a test other than the net income test (for example, over the resource limit or over 130% gross income under Standard Eligibility) is not given the $24 minimum allotment. CO-386's [\">\", snap_allotment, 0] stays non-circular because this gate does not read snap_is_eligible or snap_eligibility_status. Phase-10 open-question sweep (OQ-38, P-4): an initial month is prorated from the date of application (4.207.2, S1615) and pays nothing below the minimum allotment (4.207.3.B, S1616); the full-month computation is snap_full_month_allotment (CO-2307)."
tests:
  - id: CO-385-T1
    # Worked target household (batch 3's household, per volumes/co/tests/cases.yaml CO-02's composition without p1):
    # p1 = grandfather (eligible, SS income 1180), p2 = daughter (ineligible non-citizen, earns 2380),
    # p3 = granddaughter (eligible), p4 = great-grandson (eligible). Eligible members: p1, p3, p4 (size 3).
    # Household gross income = 1180 (p1) + 1785 (p2's prorated 3/4 share of 2380) = 2965.
    # Earned income deduction base = 0 (no eligible member earns) + 1785 (p2's prorated earned share) = 1785;
    # earned income deduction = 1785 * 0.20 = 357. Standard deduction (size 3) = 209.
    # No dependent care, child support, or medical expenses. Adjusted income before shelter =
    # 2965 - 357 - 209 = 2399. Shelter given as 1400 (shelter_cost_monthly) + 0 (SUA) = 1400.
    # Household has an elderly member (p1, 81) so the shelter cap does not apply:
    # excess shelter deduction = max(0, 1400 - 0.5*2399) = max(0, 1400 - 1199.5) = 200.5.
    # No member is homeless, so the homeless shelter deduction is 0; net income =
    # max(0, 2399 - max(200.5, 0)) = 2198.5, rounded to 2199 per S102, at or below the size-3 net income limit of 2221.
    # Maximum allotment (size 3) = 785; benefit reduction = ceil(0.3 * 2199) = ceil(659.70) = 660.
    # Household size 3 is not <= the minimum-allotment limit of 2, so no minimum floor applies.
    # Allotment = max(0, 785 - 660) = 125.
    title: "FY2026 figures (785 - 659.70 = 125.30, rounded down to 125); a September 2026 allotment (phase-8 fix round N-6 - an October 2026 allotment uses the FY2027 maximum whatever the determination date)"
    as_of: "2026-09-30"
    month: "2026-09"
    given:
      snap_is_initial_month: false
      snap_household_members: [p1, p2, p3, p4]
      snap_eligible_household_size: 3
      snap_is_ineligible_member: false
      snap_is_elderly_or_disabled: true
      snap_household_has_elderly_or_disabled_member: true
      snap_is_categorically_eligible: false
      snap_household_gross_income: 2965
      snap_household_earned_income: 0
      snap_meets_gross_income_test: true
      snap_meets_net_income_test: true
      snap_meets_resource_limit: true
      shelter_cost_monthly: 1400
      snap_utility_allowance_amount: 0
      snap_is_homeless: false
      dependent_care_expense: 0
      child_support_paid_legally_obligated: 0
      medical_expenses_out_of_pocket: 0
    others:
      p2:
        shelter_cost_monthly: 0
        snap_household_members: [p1, p2, p3, p4]
        snap_is_ineligible_member: true
        snap_is_ineligible_non_citizen: true
        snap_is_elderly_or_disabled: false
        citizenship_status: undocumented
        wages_gross: 2380
        self_employment_net_earnings_for_tax: 0
        self_employment_gross_receipts: 0
        is_fleeing_felon: false
        is_probation_or_parole_violator: false
        snap_is_serving_ipv_disqualification: false
        is_disqualified_for_work_requirement_noncompliance: false
        dependent_care_expense: 0
        child_support_paid_legally_obligated: 0
        medical_expenses_out_of_pocket: 0
      p3:
        shelter_cost_monthly: 0
        snap_is_ineligible_member: false
        snap_is_elderly_or_disabled: false
        dependent_care_expense: 0
        child_support_paid_legally_obligated: 0
        medical_expenses_out_of_pocket: 0
      p4:
        shelter_cost_monthly: 0
        snap_is_ineligible_member: false
        snap_is_elderly_or_disabled: false
        dependent_care_expense: 0
        child_support_paid_legally_obligated: 0
        medical_expenses_out_of_pocket: 0
    relationships: []
    expect: 125
  - {id: CO-385-T2, as_of: "2026-10-01", month: "2026-10", given: {snap_is_initial_month: false, snap_eligible_household_size: 1, snap_meets_gross_income_test: true, snap_meets_net_income_test: true, snap_meets_resource_limit: true, snap_maximum_allotment: 306, snap_benefit_reduction: 306}, expect: 25}
  - {id: CO-385-T4, title: "Rounded down after subtraction (4.207.3.A.3)", as_of: "2026-10-01", month: "2026-10", given: {snap_is_initial_month: false, snap_eligible_household_size: 3, snap_meets_gross_income_test: true, snap_meets_net_income_test: true, snap_meets_resource_limit: true, snap_maximum_allotment: 808, snap_benefit_reduction: 659.7}, expect: 148}
  - {id: CO-385-T3, as_of: "2026-10-01", month: "2026-10", given: {snap_is_initial_month: false, snap_eligible_household_size: 2, snap_meets_gross_income_test: true, snap_meets_net_income_test: true, snap_meets_resource_limit: false, snap_maximum_allotment: 562, snap_benefit_reduction: 546}, expect: 0}
  # Phase-10 sweep (OQ-38, P-4): an initial month pays the prorated benefit; one below the minimum allotment pays nothing (4.207.3.B).
  - {id: CO-385-T5, as_of: "2026-10-15", month: "2026-10", given: {snap_is_initial_month: true, snap_prorated_initial_month_allotment: 322, snap_full_month_allotment: 500}, expect: 322}
  - {id: CO-385-T6, title: "A two-person household applying October 25 - $18 prorated is under the $25 minimum, so nothing for October", as_of: "2026-10-27", month: "2026-10", given: {snap_is_initial_month: true, snap_prorated_initial_month_allotment: 18, snap_full_month_allotment: 80}, expect: 0}
  - {id: CO-385-T7, title: "A later month pays the full month allotment", as_of: "2026-11-02", month: "2026-11", given: {snap_is_initial_month: false, snap_prorated_initial_month_allotment: 18, snap_full_month_allotment: 80}, expect: 80}
