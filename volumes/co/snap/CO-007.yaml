id: CO-007
name: "SNAP: resides in an institution that provides the majority of meals"
identifier: snap_resides_in_institution_providing_meals
kind: derived
type: yes/no
scope: person
program: SNAP
meaning: "The person is a resident of an institution under 7 CFR 273.1(b)(7)(vi): the institution provides the person with the majority of meals (over 50 percent of three meals daily) as part of its normal services, and the person is not among the exceptions (A)-(E) - a resident of a drug or alcohol treatment and rehabilitation facility operated by a governmental unit or a private nonprofit organization and certified (B), a disabled or blind resident of a group living arrangement that is public or private nonprofit, serves no more than snap_group_living_max_residents (16) residents and is certified (C) (7 CFR 271.2; 10 CCR 2506-1 4.309.3.A-B, 4.309.4.A: \"Individuals residing in a for-profit facility are considered residents of an institution\"); residents of federally subsidized housing for the elderly (A) and of battered women's or homeless shelters (D, E) live in a private dwelling or shelter, not an institution, for residence_setting_type."
precision: "Read from residence_setting_type (CO-3330) and residence_setting_provides_majority_of_meals (CO-3334). Coverage review C-3: the (B) and (C) exceptions also read who operates the setting (residence_setting_operated_by_government, CO-3331; residence_setting_is_nonprofit, CO-4255, read as false when not stated), its size (residence_setting_bed_count, CO-3332, for (C)) and its certification (residence_setting_is_licensed_or_certified, CO-3335: the OBH approval of 4.309.3.B for a center, the 1616(e) certification of 4.309.4.A for a group living arrangement). The FNS retailer authorization of the center (4.309.3.B, 4.309.42) is the facility's standing and is not separately stated. The (B) exception's children of a treatment resident live in the same setting and are not residents of an institution either. Coverage pass 2 N2-4: a student whose meal plan bought through an institution of higher education provides more than half of the student's meals is a resident of an institution whatever the residence setting (has_higher_education_meal_plan_providing_majority_of_meals, CO-4686; 4.304.4.D.3, S3472), \"unless the individual is otherwise exempt from the institution provisions as provided in Section 4.304.41\": the treatment-center (B) and group-living (C) exceptions, and a shelter (D, E: nighttime_residence_type emergency_or_transitional_shelter). Federally subsidized housing for the elderly (A) has no fact apart from private_dwelling; a student with a college meal plan living there is read as a resident of an institution. Coverage pass 4 S4-14 (decision 4 of 2026-11-23): residence_setting_is_nonprofit is read with no default where this rule reads it (only for a resident of a treatment center or a group living arrangement not operated by a government; 4.309.3-4.309.4 and 7 CFR 271.2 name public and private nonprofit settings and give no reading for an operator not stated); before, it was read as false, so a treatment-center resident was read as in a for-profit institution and in no SNAP household when not stated."
derived: ["any", ["all", ["not", ["in", "residence_setting_type", ["private_dwelling", "room_and_board", "hotel", "commercial_property"]]], ["not", ["all", ["=", "residence_setting_type", "substance_use_treatment_facility"], ["any", "residence_setting_operated_by_government", "residence_setting_is_nonprofit"], "residence_setting_is_licensed_or_certified"]], ["not", ["all", ["in", "residence_setting_type", ["group_home", "host_home", "assisted_living_residence"]], "snap_is_disabled_member", ["any", "residence_setting_operated_by_government", "residence_setting_is_nonprofit"], ["<=", "residence_setting_bed_count", "snap_group_living_max_residents"], "residence_setting_is_licensed_or_certified"]], "residence_setting_provides_majority_of_meals"], ["all", ["otherwise", "has_higher_education_meal_plan_providing_majority_of_meals", false], ["not", ["otherwise", ["=", "nighttime_residence_type", "emergency_or_transitional_shelter"], false]], ["not", ["all", ["=", "residence_setting_type", "substance_use_treatment_facility"], ["any", "residence_setting_operated_by_government", "residence_setting_is_nonprofit"], "residence_setting_is_licensed_or_certified"]], ["not", ["all", ["in", "residence_setting_type", ["group_home", "host_home", "assisted_living_residence"]], "snap_is_disabled_member", ["any", "residence_setting_operated_by_government", "residence_setting_is_nonprofit"], ["<=", "residence_setting_bed_count", "snap_group_living_max_residents"], "residence_setting_is_licensed_or_certified"]]]]
sources: [S3, S2200, S3052, S3053, S3472]
implemented: engine
tags: [snap, household]
rationale: "Same-word audit SW-20 and SW-21, dual-entry audit 2.10 and 3.20: where a person lives was stated by thirteen facts, each one program's classification (SNAP's meals institution, Medicaid's medical institution and IMD, the OAP Health Care exclusion, Adult Financial's three facility lists, LEAP's living arrangements, the inmate fact), which could contradict one another. One neutral description of the setting, in the terms of 42 CFR 435.1010 (S2201, S2202), is stated once; each program's test is a derived item. SNAP's test is its own derived item over the neutral facts."
tests:
  - {id: CO-007-T1, as_of: "2026-10-01", given: {residence_setting_type: nursing_facility, residence_setting_provides_majority_of_meals: true}, expect: true}
  - {id: CO-007-T2, title: "Exception (B): a residential drug or alcohol treatment facility", as_of: "2026-10-01", given: {residence_setting_type: substance_use_treatment_facility, residence_setting_provides_majority_of_meals: true, residence_setting_operated_by_government: false, residence_setting_is_nonprofit: true, residence_setting_is_licensed_or_certified: true}, expect: false}
  - {id: CO-007-T3, title: "Exception (C): a disabled resident of a group home", as_of: "2026-10-01", given: {residence_setting_type: group_home, residence_setting_provides_majority_of_meals: true, snap_is_disabled_member: true, residence_setting_operated_by_government: false, residence_setting_is_nonprofit: true, residence_setting_bed_count: 8, residence_setting_is_licensed_or_certified: true}, expect: false}
  - {id: CO-007-T4, title: "A jail that provides the meals", as_of: "2026-10-01", given: {residence_setting_type: correctional_facility, residence_setting_provides_majority_of_meals: true}, expect: true}
  - {id: CO-007-T5, as_of: "2026-10-01", given: {residence_setting_type: private_dwelling}, expect: false}
  - {id: CO-007-T6, title: "C-3: a disabled veteran in a for-profit 60-bed assisted living residence that provides her meals", as_of: "2026-10-01", given: {residence_setting_type: assisted_living_residence, residence_setting_provides_majority_of_meals: true, snap_is_disabled_member: true, residence_setting_operated_by_government: false, residence_setting_is_nonprofit: false, residence_setting_bed_count: 60, residence_setting_is_licensed_or_certified: true}, expect: true}
  - {id: CO-007-T7, title: "C-3: a for-profit residential treatment facility is an institution (4.309.3.A)", as_of: "2026-10-01", given: {residence_setting_type: substance_use_treatment_facility, residence_setting_provides_majority_of_meals: true, residence_setting_operated_by_government: false, residence_setting_is_nonprofit: false}, expect: true}
  - {id: CO-007-T8, title: "C-3: a nonprofit group home with 20 residents is not a group living arrangement", as_of: "2026-10-01", given: {residence_setting_type: group_home, residence_setting_provides_majority_of_meals: true, snap_is_disabled_member: true, residence_setting_operated_by_government: false, residence_setting_is_nonprofit: true, residence_setting_bed_count: 20, residence_setting_is_licensed_or_certified: true}, expect: true}
  - {id: CO-007-T9, title: "Coverage pass 2 N2-4: a student living at home with a college meal plan giving most meals", as_of: "2026-10-01", given: {residence_setting_type: private_dwelling, has_higher_education_meal_plan_providing_majority_of_meals: true, nighttime_residence_type: fixed_regular_adequate}, expect: true}
  - {id: CO-007-T10, title: "Coverage pass 2 N2-4: no meal plan, a private dwelling", as_of: "2026-10-01", given: {residence_setting_type: private_dwelling, has_higher_education_meal_plan_providing_majority_of_meals: false}, expect: false}
