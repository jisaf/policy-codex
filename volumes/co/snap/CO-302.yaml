id: CO-302
name: "SNAP: is a disabled member"
identifier: snap_is_disabled_member
kind: derived
type: yes/no
scope: person
program: SNAP
meaning: "The person meets one of the disability-based prongs of the 7 CFR 271.2 \"elderly or disabled member\" definition (SSI, disability or blindness payments under titles I, II, X, XIV or XVI or a disability-based state supplement, disability-based general assistance, VA disability, or a government disability retirement benefit for a permanent disability), independent of age."
precision: "Does not by itself test the age prong; combined with snap_is_elderly in snap_is_elderly_or_disabled. Vocabulary fix round (R-5): a bare SSA disability determination or blindness with no benefit no longer makes a member disabled; 271.2 lists benefit receipt only, and prong (5) is snap_receives_permanent_disability_retirement_benefit (CO-1729)."
derived: [any, receives_ssi, snap_receives_disability_or_blindness_payment, receives_general_assistance, receives_va_disability_benefits, snap_receives_permanent_disability_retirement_benefit]
sources: [S6]
implemented: engine
tags: [disability]
rationale: The 271.2 definition's disability prongs (2), (3), (5), (6) are receipt-of-benefit tests distinct from the age prong; this item isolates them so snap_is_elderly_or_disabled reads as "elderly OR disabled" per the definition's structure, and so other chapters that need "is this member disabled" (deductions, ABAWD exemptions) do not retest age.
tests:
  - {id: CO-302-T1, given: {receives_ssi: true, snap_receives_disability_or_blindness_payment: false, snap_receives_permanent_disability_retirement_benefit: false, receives_general_assistance: false, receives_va_disability_benefits: false}, expect: true}
  - {id: CO-302-T2, given: {receives_ssi: false, snap_receives_disability_or_blindness_payment: false, snap_receives_permanent_disability_retirement_benefit: false, receives_general_assistance: false, receives_va_disability_benefits: false}, expect: false}
  - {id: CO-302-T3, title: "Vocabulary fix round (R-5): an SSA disability finding or blindness with no benefit is not a 271.2 prong", given: {receives_ssi: false, snap_receives_disability_or_blindness_payment: false, snap_receives_permanent_disability_retirement_benefit: false, receives_general_assistance: false, receives_va_disability_benefits: false, meets_ssa_disability_criteria: true, is_blind: true}, expect: false}
  - {id: CO-302-T4, title: "Vocabulary fix round (R-5): government disability retirement for a permanent disability (271.2 prong 5)", given: {receives_ssi: false, snap_receives_disability_or_blindness_payment: false, snap_receives_permanent_disability_retirement_benefit: true}, expect: true}
