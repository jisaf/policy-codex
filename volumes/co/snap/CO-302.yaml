id: CO-302
name: "SNAP: is a disabled member"
identifier: snap_is_disabled_member
kind: derived
type: yes/no
scope: person
program: SNAP
meaning: "The person meets one of the disability-based prongs of the 7 CFR 271.2 \"elderly or disabled member\" definition and 10 CCR 2506-1 4.000.1 \"Person with disabilities\" (SSI, disability or blindness payments under titles I, II, X, XIV or XVI or a disability-based state supplement, disability-based general assistance or interim assistance pending SSI, VA disability or a VA pension for a non-service-connected disability, a government disability retirement benefit for a permanent disability, a Railroad Retirement disability annuity with Medicare eligibility or a title XVI disability finding, or disability-based Medical Assistance), independent of age."
precision: "Does not by itself test the age prong; combined with snap_is_elderly in snap_is_elderly_or_disabled. Vocabulary fix round (R-5): a bare SSA disability determination or blindness with no benefit no longer makes a member disabled; 271.2 lists benefit receipt only, and prong (5) is snap_receives_permanent_disability_retirement_benefit (CO-1729). Final verification F-7: Colorado's prongs 2, 7 and 8 (S2509; 271.2 (10)-(11), S1951) add a veteran receiving a pension for a non-service-connected disability (receives_va_non_service_connected_pension, CO-2862; the VA pays that pension only to a veteran 65 or older or permanently and totally disabled), a Railroad Retirement disability annuitant who qualifies for Medicare as the Board determines (is_medicare_entitled_or_enrolled, CO-017) or is disabled under the SSA's criteria (meets_ssa_disability_criteria, CO-011), and a recipient of disability-related Medical Assistance (receives_disability_based_medical_assistance, CO-3718); each new fact is read as false when not stated. Interim assistance pending SSI is Colorado's Aid to the Needy Disabled - State Only (and_so of adult_financial_program_received), already read."
derived: [any, receives_ssi, snap_receives_disability_or_blindness_payment, receives_disability_based_general_assistance, [otherwise, [in, adult_financial_program_received, [and_so, and_cs, ab]], false], [in, va_disability_rating_type, [total, partial_paid_as_total]], has_va_aid_attendance_housebound_or_survivor_finding, snap_receives_permanent_disability_retirement_benefit, [otherwise, receives_va_non_service_connected_pension, false], [all, [otherwise, receives_railroad_retirement_disability_annuity, false], [any, meets_ssa_disability_criteria, is_medicare_entitled_or_enrolled]], [otherwise, receives_disability_based_medical_assistance, false]]
sources: [S6, S1951, S2509]
implemented: engine
tags: [disability]
rationale: "The 271.2 definition's disability prongs (2), (3), (5), (6) are receipt-of-benefit tests distinct from the age prong; this item isolates them so snap_is_elderly_or_disabled reads as \"elderly OR disabled\" per the definition's structure, and so other chapters that need \"is this member disabled\" (deductions, ABAWD exemptions) do not retest age. Dual-entry audit 3.8: prong (11)'s disability-based State general assistance includes Colorado's Aid to the Needy Disabled and Aid to the Blind, read from the Adult Financial case record (CO-2710; unstated read as none) beside other state assistance (CO-014)."
tests:
  - {id: CO-302-T1, given: {receives_ssi: true, snap_receives_disability_or_blindness_payment: false, snap_receives_permanent_disability_retirement_benefit: false, receives_disability_based_general_assistance: false, has_va_aid_attendance_housebound_or_survivor_finding: false, va_disability_rating_type: none}, expect: true}
  - {id: CO-302-T2, given: {receives_ssi: false, snap_receives_disability_or_blindness_payment: false, snap_receives_permanent_disability_retirement_benefit: false, receives_disability_based_general_assistance: false, has_va_aid_attendance_housebound_or_survivor_finding: false, va_disability_rating_type: none}, expect: false}
  - {id: CO-302-T21, title: "Dual-entry 3.8: an Aid to the Needy Disabled client, read from the Adult Financial record (prong 11)", given: {receives_ssi: false, snap_receives_disability_or_blindness_payment: false, snap_receives_permanent_disability_retirement_benefit: false, receives_disability_based_general_assistance: false, has_va_aid_attendance_housebound_or_survivor_finding: false, va_disability_rating_type: none, adult_financial_program_received: and_so}, expect: true}
  - {id: CO-302-T3, title: "Vocabulary fix round (R-5): an SSA disability finding or blindness with no benefit is not a 271.2 prong", given: {receives_ssi: false, snap_receives_disability_or_blindness_payment: false, snap_receives_permanent_disability_retirement_benefit: false, receives_disability_based_general_assistance: false, has_va_aid_attendance_housebound_or_survivor_finding: false, va_disability_rating_type: none, meets_ssa_disability_criteria: true, is_blind: true}, expect: false}
  - {id: CO-302-T4, title: "Vocabulary fix round (R-5): government disability retirement for a permanent disability (271.2 prong 5)", given: {receives_ssi: false, snap_receives_disability_or_blindness_payment: false, snap_receives_permanent_disability_retirement_benefit: true}, expect: true}
  - {id: CO-302-T20, title: "SW-14: a veteran paid as totally disabled", as_of: "2026-11-01", given: {receives_ssi: false, snap_receives_disability_or_blindness_payment: false, receives_disability_based_general_assistance: false, va_disability_rating_type: partial_paid_as_total, has_va_aid_attendance_housebound_or_survivor_finding: false, snap_receives_permanent_disability_retirement_benefit: false}, expect: true}
  # Final verification F-7: Colorado prongs 2, 7 and 8 (S2509).
  - {id: CO-302-T22, title: "A veteran receiving a VA pension for a non-service-connected disability", as_of: "2026-10-01", given: {receives_ssi: false, snap_receives_disability_or_blindness_payment: false, receives_disability_based_general_assistance: false, adult_financial_program_received: none, va_disability_rating_type: none, has_va_aid_attendance_housebound_or_survivor_finding: false, snap_receives_permanent_disability_retirement_benefit: false, receives_va_non_service_connected_pension: true}, expect: true}
  - {id: CO-302-T23, title: "A Railroad Retirement disability annuitant the Board found eligible for Medicare", as_of: "2026-10-01", given: {receives_ssi: false, snap_receives_disability_or_blindness_payment: false, receives_disability_based_general_assistance: false, adult_financial_program_received: none, va_disability_rating_type: none, has_va_aid_attendance_housebound_or_survivor_finding: false, snap_receives_permanent_disability_retirement_benefit: false, receives_railroad_retirement_disability_annuity: true, meets_ssa_disability_criteria: false, is_medicare_entitled_or_enrolled: true}, expect: true}
  - {id: CO-302-T24, title: "A Medical Assistance member in a disability category", as_of: "2026-10-01", given: {receives_ssi: false, snap_receives_disability_or_blindness_payment: false, receives_disability_based_general_assistance: false, adult_financial_program_received: none, va_disability_rating_type: none, has_va_aid_attendance_housebound_or_survivor_finding: false, snap_receives_permanent_disability_retirement_benefit: false, receives_disability_based_medical_assistance: true}, expect: true}
  - {id: CO-302-T25, title: "A railroad annuitant with neither a Medicare nor an SSA disability finding is not disabled by that prong", as_of: "2026-10-01", given: {receives_ssi: false, snap_receives_disability_or_blindness_payment: false, receives_disability_based_general_assistance: false, adult_financial_program_received: none, va_disability_rating_type: none, has_va_aid_attendance_housebound_or_survivor_finding: false, snap_receives_permanent_disability_retirement_benefit: false, receives_railroad_retirement_disability_annuity: true, meets_ssa_disability_criteria: false, is_medicare_entitled_or_enrolled: false}, expect: false}
