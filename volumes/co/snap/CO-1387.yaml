id: CO-1387
name: "SNAP: identity verification is pending"
identifier: snap_identity_verification_is_pending
kind: derived
type: yes/no
scope: person-month
program: SNAP
role: outcome
meaning: Whether the person's identity must be verified for SNAP and has not been, by an electronic data source or any document that reasonably establishes it.
derived: [all, snap_requires_verification_of_identity, [not, [any, identity_verified_by_electronic_data_source, identity_verification_document_received]]]
sources: [S806, S822, S814]
implemented: engine
tags: [verification, snap, household]
rationale: Identity is the one verification expedited service never postpones (273.2(i)(4)(i)(A), S814); snap_verification_status needs it separately from the other pending elements.
tests:
  - {id: CO-1387-T1, month: "2026-10", as_of: "2026-10-01", given: {snap_requires_verification_of_identity: true, identity_verified_by_electronic_data_source: false, identity_verification_document_received: false}, expect: true}
  - {id: CO-1387-T2, month: "2026-10", as_of: "2026-10-01", given: {snap_requires_verification_of_identity: true, identity_verified_by_electronic_data_source: true}, expect: false}
  - {id: CO-1387-T3, month: "2026-10", as_of: "2026-10-01", given: {snap_requires_verification_of_identity: false}, expect: false}
