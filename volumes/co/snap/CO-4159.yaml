id: CO-4159
name: "SNAP: member's resource transfer is disqualifying"
identifier: snap_resource_transfer_is_disqualifying
kind: derived
type: yes/no
scope: person
program: SNAP
meaning: "This person transferred a resource knowingly to qualify for SNAP (snap_resource_transfer_was_to_qualify) within the three months immediately before the household's date of application, or after it, when the household had been determined eligible (10 CCR 2506-1 4.408.2): some month from the month in which the three months begin through the determination month has a transfer stated for it (resource_transfer_uncompensated_value more than 0) that falls within them and whose resource has not been returned in whole."
precision: "The three months run back from the date of application to the same day of the month three calendar months earlier (the transfer on that day included); a day the earlier month lacks runs into the next month (applied May 31, 2026: from March 3). The transfer facts are stated for each month in which a transfer was made (resource_transfer_date, CO-3834; resource_transfer_uncompensated_value, CO-3835): a transfer in a month after the month in which the three months begin is within them, one in that month is within them when made on their first day or later, and one in an earlier month is not; the date is read for that first month only. A transfer after the date of application, through the determination month, is read as made after the household was determined eligible; a month after the determination month is not read. A transfer whose resource has been returned in whole (resource_transfer_returned_date, CO-4009) is not read as a transfer: 4.408.2 does not address a return, the resource is again among the household's resources, and when the transfer facts were stated for the person such a transfer was not stated at all. Only the finding is read when it is not stated true."
derived: [all, [otherwise, snap_resource_transfer_was_to_qualify, false], [">", [sum_months, [months_from_to, [month_of, [days_after, [days_between, [first_day, [month_of, snap_application_date]], snap_application_date], [first_day, [months_before, 3, [month_of, snap_application_date]]]]], [det_month]], [case, [[all, [">", [otherwise, [at, resource_transfer_uncompensated_value, [that_month]], 0], 0], [unknown, [at, resource_transfer_returned_date, [that_month]]], [any, [">", [that_month], [month_of, [days_after, [days_between, [first_day, [month_of, snap_application_date]], snap_application_date], [first_day, [months_before, 3, [month_of, snap_application_date]]]]]], [">=", [at, resource_transfer_date, [that_month]], [days_after, [days_between, [first_day, [month_of, snap_application_date]], snap_application_date], [first_day, [months_before, 3, [month_of, snap_application_date]]]]]]], 1], [else, 0]]], 0]]
sources: [S2961]
implemented: engine
tags: [snap, resources]
rationale: "Final verification pass 2 N-4: the 4.408.2 window (S2961) had no item; snap_resource_transfer_disqualification_months (CO-4158) sums the value of the members' disqualifying transfers. Merge of the cash and SNAP fix tracks: resource_transfer_date and resource_transfer_uncompensated_value became month-scoped (final cash review 2, N-5) after this item was written against the first transfer and the total value; it now looks over the window's months for a stated transfer."
tests:
  - {id: CO-4159-T1, title: "Gave $4,000 to a cousin on July 20 to qualify; applied October 12", as_of: "2026-10-12", given: {snap_resource_transfer_was_to_qualify: true, resource_transfer_date: {"2026-07": "2026-07-20"}, resource_transfer_uncompensated_value: {"2026-07": 4000}, snap_application_date: "2026-10-12"}, expect: true}
  - {id: CO-4159-T2, title: "The transfer was on July 11, more than three months before - not disqualifying", as_of: "2026-10-12", given: {snap_resource_transfer_was_to_qualify: true, resource_transfer_date: {"2026-07": "2026-07-11"}, resource_transfer_uncompensated_value: {"2026-07": 4000}, snap_application_date: "2026-10-12"}, expect: false}
  - {id: CO-4159-T3, title: "Exactly three months before (July 12) - included", as_of: "2026-10-12", given: {snap_resource_transfer_was_to_qualify: true, resource_transfer_date: {"2026-07": "2026-07-12"}, resource_transfer_uncompensated_value: {"2026-07": 4000}, snap_application_date: "2026-10-12"}, expect: true}
  - {id: CO-4159-T4, title: "No finding that the transfer was to qualify", as_of: "2026-10-12", given: {resource_transfer_date: {"2026-09": "2026-09-01"}, resource_transfer_uncompensated_value: {"2026-09": 4000}, snap_application_date: "2026-10-12"}, expect: false}
  - {id: CO-4159-T5, title: "A transfer after certification", as_of: "2027-01-15", given: {snap_resource_transfer_was_to_qualify: true, resource_transfer_date: {"2026-12": "2026-12-05"}, resource_transfer_uncompensated_value: {"2026-12": 4000}, snap_application_date: "2026-10-12"}, expect: true}
  # Merge of the cash and SNAP fix tracks: the transfer facts are stated by month.
  - {id: CO-4159-T6, title: "Transfers in June and on July 5, both before the three months, and none within them", as_of: "2026-10-12", given: {snap_resource_transfer_was_to_qualify: true, resource_transfer_date: {"2026-06": "2026-06-15", "2026-07": "2026-07-05"}, resource_transfer_uncompensated_value: {"2026-06": 2000, "2026-07": 2000}, snap_application_date: "2026-10-12"}, expect: false}
  - {id: CO-4159-T7, title: "A June transfer before the three months and a September one within them", as_of: "2026-10-12", given: {snap_resource_transfer_was_to_qualify: true, resource_transfer_date: {"2026-06": "2026-06-15", "2026-09": "2026-09-03"}, resource_transfer_uncompensated_value: {"2026-06": 2000, "2026-09": 1500}, snap_application_date: "2026-10-12"}, expect: true}
  - {id: CO-4159-T8, title: "Applied May 31: the three months begin March 3, so a February 28 transfer is before them", as_of: "2026-05-31", given: {snap_resource_transfer_was_to_qualify: true, resource_transfer_date: {"2026-02": "2026-02-28"}, resource_transfer_uncompensated_value: {"2026-02": 4000}, snap_application_date: "2026-05-31"}, expect: false}
  - {id: CO-4159-T9, title: "Applied May 31: a March 2 transfer is before the three months", as_of: "2026-05-31", given: {snap_resource_transfer_was_to_qualify: true, resource_transfer_date: {"2026-03": "2026-03-02"}, resource_transfer_uncompensated_value: {"2026-03": 4000}, snap_application_date: "2026-05-31"}, expect: false}
  - {id: CO-4159-T10, title: "Applied May 31: a transfer on March 3, the three months' first day, is within them", as_of: "2026-05-31", given: {snap_resource_transfer_was_to_qualify: true, resource_transfer_date: {"2026-03": "2026-03-03"}, resource_transfer_uncompensated_value: {"2026-03": 4000}, snap_application_date: "2026-05-31"}, expect: true}
  - {id: CO-4159-T11, title: "The only transfer, on August 3, was returned in whole on August 20", as_of: "2026-10-12", given: {snap_resource_transfer_was_to_qualify: true, resource_transfer_date: {"2026-08": "2026-08-03"}, resource_transfer_uncompensated_value: {"2026-08": 4000}, resource_transfer_returned_date: {"2026-08": "2026-08-20"}, snap_application_date: "2026-10-12"}, expect: false}
