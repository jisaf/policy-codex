id: CO-4159
name: "SNAP: member's resource transfer is disqualifying"
identifier: snap_resource_transfer_is_disqualifying
kind: derived
type: yes/no
scope: person
program: SNAP
meaning: "This person transferred a resource knowingly to qualify for SNAP within the three months immediately before the household's date of application, or after it, when the household had been determined eligible (10 CCR 2506-1 4.408.2): the value of the person's disqualifying transfers (snap_disqualifying_transfer_value, CO-5314), read from the person's holdings records, is more than 0."
precision: "Resource records, step H1 SNAP (docs/reviews/records-holdings-snap-af.md): one transfer is one holdings record (holdings, CO-5300) with its disposed_date, what was received for it, its return and the county's finding (snap_transfer_to_qualify), read by CO-5314, in place of the month-scoped transfer facts (CO-3834, CO-3835, CO-4009) and the person's one finding for all of them (CO-4155). The window, the return, the finding not stated and the exempt transfers of 4.408.2.A.1-2 are as CO-5314 states them. A person whose holdings are not stated is cannot determine (decision 4 of 2026-11-23); before, a person with no finding stated was read as no whatever the transfers."
derived: [">", "snap_disqualifying_transfer_value", 0]
sources: [S2961, S2962]
implemented: engine
tags: [snap, resources]
rationale: "Final verification pass 2 N-4: the 4.408.2 window (S2961) had no item; snap_resource_transfer_disqualification_months (CO-4158) sums the value of the members' disqualifying transfers. Merge of the cash and SNAP fix tracks: resource_transfer_date and resource_transfer_uncompensated_value became month-scoped (final cash review 2, N-5) after this item was written against the first transfer and the total value; it now looks over the window's months for a stated transfer."
tests:
  - {id: CO-4159-T1, title: "Gave $4,000 to a cousin on July 20 to qualify; applied October 12", as_of: "2026-10-12", given: {snap_application_date: "2026-10-12", holdings: [{kind: other_resource, value: 4000, amount_owed: 0, compensation_received: 0, disposed_date: "2026-07-20", snap_transfer_to_qualify: true}]}, expect: true}
  - {id: CO-4159-T2, title: "The transfer was on July 11, more than three months before - not disqualifying", as_of: "2026-10-12", given: {snap_application_date: "2026-10-12", holdings: [{kind: other_resource, value: 4000, amount_owed: 0, compensation_received: 0, disposed_date: "2026-07-11", snap_transfer_to_qualify: true}]}, expect: false}
  - {id: CO-4159-T3, title: "Exactly three months before (July 12) - included", as_of: "2026-10-12", given: {snap_application_date: "2026-10-12", holdings: [{kind: other_resource, value: 4000, amount_owed: 0, compensation_received: 0, disposed_date: "2026-07-12", snap_transfer_to_qualify: true}]}, expect: true}
  - {id: CO-4159-T4, title: "No finding that the transfer was to qualify", as_of: "2026-10-12", given: {snap_application_date: "2026-10-12", holdings: [{kind: other_resource, value: 4000, amount_owed: 0, compensation_received: 0, disposed_date: "2026-09-01"}]}, expect: false}
  - {id: CO-4159-T5, title: "A transfer after certification", as_of: "2027-01-15", given: {snap_application_date: "2026-10-12", holdings: [{kind: other_resource, value: 4000, amount_owed: 0, compensation_received: 0, disposed_date: "2026-12-05", snap_transfer_to_qualify: true}]}, expect: true}
  # Merge of the cash and SNAP fix tracks: the transfer facts are stated by month.
  - {id: CO-4159-T6, title: "Transfers in June and on July 5, both before the three months, and none within them", as_of: "2026-10-12", given: {snap_application_date: "2026-10-12", holdings: [{kind: other_resource, value: 2000, amount_owed: 0, compensation_received: 0, disposed_date: "2026-06-15", snap_transfer_to_qualify: true}, {kind: other_resource, value: 2000, amount_owed: 0, compensation_received: 0, disposed_date: "2026-07-05", snap_transfer_to_qualify: true}]}, expect: false}
  - {id: CO-4159-T7, title: "A June transfer before the three months and a September one within them", as_of: "2026-10-12", given: {snap_application_date: "2026-10-12", holdings: [{kind: other_resource, value: 2000, amount_owed: 0, compensation_received: 0, disposed_date: "2026-06-15", snap_transfer_to_qualify: true}, {kind: other_resource, value: 1500, amount_owed: 0, compensation_received: 0, disposed_date: "2026-09-03", snap_transfer_to_qualify: true}]}, expect: true}
  - {id: CO-4159-T8, title: "Applied May 31: the three months begin March 3, so a February 28 transfer is before them", as_of: "2026-05-31", given: {snap_application_date: "2026-05-31", holdings: [{kind: other_resource, value: 4000, amount_owed: 0, compensation_received: 0, disposed_date: "2026-02-28", snap_transfer_to_qualify: true}]}, expect: false}
  - {id: CO-4159-T9, title: "Applied May 31: a March 2 transfer is before the three months", as_of: "2026-05-31", given: {snap_application_date: "2026-05-31", holdings: [{kind: other_resource, value: 4000, amount_owed: 0, compensation_received: 0, disposed_date: "2026-03-02", snap_transfer_to_qualify: true}]}, expect: false}
  - {id: CO-4159-T10, title: "Applied May 31: a transfer on March 3, the three months' first day, is within them", as_of: "2026-05-31", given: {snap_application_date: "2026-05-31", holdings: [{kind: other_resource, value: 4000, amount_owed: 0, compensation_received: 0, disposed_date: "2026-03-03", snap_transfer_to_qualify: true}]}, expect: true}
  - {id: CO-4159-T11, title: "The only transfer, on August 3, was returned in whole on August 20", as_of: "2026-10-12", given: {snap_application_date: "2026-10-12", holdings: [{kind: other_resource, value: 4000, amount_owed: 0, compensation_received: 0, disposed_date: "2026-08-03", returned_date: "2026-08-20", snap_transfer_to_qualify: true}]}, expect: false}
