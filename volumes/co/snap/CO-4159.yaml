id: CO-4159
name: "SNAP: member's resource transfer is disqualifying"
identifier: snap_resource_transfer_is_disqualifying
kind: derived
type: yes/no
scope: person
program: SNAP
meaning: "This person transferred a resource knowingly to qualify for SNAP (snap_resource_transfer_was_to_qualify) within the three months immediately before the household's date of application, or after it, when the household had been determined eligible (10 CCR 2506-1 4.408.2)."
precision: "The three months run back from the date of application to the same day of the month three calendar months earlier (the transfer on that day included); a day the earlier month lacks runs into the next month. A transfer after the date of application is read as made after the household was determined eligible. resource_transfer_date (CO-3834) is the first transfer when several were made; it is read only when the county's finding is stated true."
derived: [all, [otherwise, snap_resource_transfer_was_to_qualify, false], [">=", resource_transfer_date, [days_after, [days_between, [first_day, [month_of, snap_application_date]], snap_application_date], [first_day, [months_before, 3, [month_of, snap_application_date]]]]]]
sources: [S2961]
implemented: engine
tags: [snap, resources]
rationale: "Final verification pass 2 N-4: the 4.408.2 window (S2961) had no item; snap_resource_transfer_disqualification_months (CO-4158) sums the value of the members' disqualifying transfers."
tests:
  - {id: CO-4159-T1, title: "Gave $4,000 to a cousin on July 20 to qualify; applied October 12", as_of: "2026-10-12", given: {snap_resource_transfer_was_to_qualify: true, resource_transfer_date: "2026-07-20", snap_application_date: "2026-10-12"}, expect: true}
  - {id: CO-4159-T2, title: "The transfer was on July 11, more than three months before - not disqualifying", as_of: "2026-10-12", given: {snap_resource_transfer_was_to_qualify: true, resource_transfer_date: "2026-07-11", snap_application_date: "2026-10-12"}, expect: false}
  - {id: CO-4159-T3, title: "Exactly three months before (July 12) - included", as_of: "2026-10-12", given: {snap_resource_transfer_was_to_qualify: true, resource_transfer_date: "2026-07-12", snap_application_date: "2026-10-12"}, expect: true}
  - {id: CO-4159-T4, title: "No finding that the transfer was to qualify", as_of: "2026-10-12", given: {resource_transfer_date: "2026-09-01", snap_application_date: "2026-10-12"}, expect: false}
  - {id: CO-4159-T5, title: "A transfer after certification", as_of: "2027-01-15", given: {snap_resource_transfer_was_to_qualify: true, resource_transfer_date: "2026-12-05", snap_application_date: "2026-10-12"}, expect: true}
