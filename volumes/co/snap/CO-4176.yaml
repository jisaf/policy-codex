  - {id: CO-4176-T11, title: "Coverage pass 2 C2-2: $6,000 liquid, $2,000 of it in an ABLE account: $4,000", as_of: "2027-02-10", given: {holdings: [{kind: bank_account, value: 4000}, {kind: able_account, value: 2000}]}, expect: 4000}
