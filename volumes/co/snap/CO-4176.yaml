id: CO-4176
name: "SNAP: countable liquid resources"
identifier: snap_countable_liquid_resources
kind: derived
type: money
scope: person
program: SNAP
meaning: "The person's own liquid resources that SNAP counts (7 CFR 273.8(c)(1), 10 CCR 2506-1 4.409.A, 4.410), from the person's holdings records (holdings, CO-5300) valued in the determination month and still held, through snap_holding_treatment_table (CO-5301): cash, accounts, securities, business cash and the money still held from a retroactive benefit, a loan, insurance or a sale (rows counted and counted_no_rule_excludes); a federal income tax refund only from twelve months after the date it was received (J.17), a state or local refund always; an earned income tax credit only when neither J.12 exclusion applies (twelve months from receipt when the person was participating in SNAP when it was received and since; a federal credit in the month of receipt and the month after); each at its value times the person's share, or all of it where it is held jointly with someone outside the case and the person can reach it (4.409.C); never a holding the person cannot reach (4.409.C, 4.410.F: accessible), nor one the table excludes (retirement and education accounts, ABLE accounts, excluded government payments, prorated income still counted as income)."
precision: "Resource records, step H1 SNAP (docs/reviews/records-holdings-snap-af.md): the refunds, credits and payments SNAP excludes are their own records (held_income_tax_refund, held_eitc, held_excluded_payment, held_prorated_income), dated by source_date, never parts of one liquid figure subtracted with a default of 0; a federal refund or a credit whose date of receipt is not stated is cannot determine (decision 4 of 2026-11-23: the old facts said only that the money came within the twelve months, and the translator could not date it). The twelve months run from the date of receipt to the same day twelve months later (a day the later month lacks runs into the next month); the determination date is read against it. A federal refund received on 2026-07-01 is excluded through 2027-06-30 and counted from 2027-07-01. A state or local refund is counted, as before (J.17 names federal refunds). The value of a liquid holding is read as stated: 4.408.1.A values liquid resources at \"the current redemption rate less encumbrances\", and an encumbrance on an account is not read (no stored household or test states one; a request to the integration owner, docs/reviews/records-holdings-snap-af.md). Money other than these that 4.410 does not name is counted because no rule excludes it (rows counted_no_rule_excludes, for the SNAP owner's signature; OQ-1202). Commingled exempt money (4.409.D) is not read: OQ-1251."
