id: CO-4176
name: "SNAP: countable liquid resources"
identifier: snap_countable_liquid_resources
kind: derived
type: money
scope: person
program: SNAP
meaning: "The person's own liquid resources that SNAP counts (10 CCR 2506-1 4.409.A, 4.410): liquid_resources_value less the holdings within it that 4.409 and 4.410 exclude - federal income tax refunds held within twelve months of receipt (J.17), state or local earned income tax credits received while participating (J.12), tax-deferred education accounts (D.3), income prorated over the period it covers and still held while part of it is counted (C; prorated_income_held_value, CO-4319) and resources the person cannot reach (4.409.C, F, H) - never below zero; plus the shares of jointly owned cash and convertible assets that belong to joint owners outside the person's home and that the person can reach, which 4.409.C counts in their entirety (joint_liquid_resources_other_owners_share_value, CO-4340; coverage review snap-financial CF-8)."
precision: "Each excluded holding is read as 0 when not stated (CO-4172 to CO-4175), so a case that states none counts liquid_resources_value in full, as before. Other 4.410 exclusions (retirement accounts, D.2) are already outside liquid_resources_value (retirement_accounts_value, CO-3392); a lump sum still held is counted (4.409.A)."
derived: [max, 0, ["-", ["+", liquid_resources_value, [otherwise, joint_liquid_resources_other_owners_share_value, 0]], ["+", [otherwise, federal_tax_refunds_held_value, 0], [otherwise, snap_eitc_held_while_participating_value, 0], [otherwise, education_savings_accounts_value, 0], [otherwise, liquid_resources_inaccessible_value, 0], [otherwise, prorated_income_held_value, 0]]]]
sources: [S2966, S2967, S2968, S3129, S3130]
implemented: engine
tags: [snap, resources]
rationale: "Final verification pass 2 N-8: snap_household_countable_resources (CO-343), snap_household_liquid_resources (CO-1740) and snap_sponsor_deemed_resources (CO-3702) read liquid_resources_value in full, so a standard household with an elderly member, $3,000 of savings and a $2,500 federal refund received three months earlier counted $5,500 against the $4,750 limit and was found ineligible. This item is the person's liquid resources as SNAP counts them; the three read it."
nearest: [CO-074]
tests:
  - {id: CO-4176-T1, title: "N-8: $5,500 held, $2,500 of it a federal refund received three months ago - $3,000 counted", as_of: "2026-10-01", given: {liquid_resources_value: 5500, federal_tax_refunds_held_value: 2500}, expect: 3000}
  - {id: CO-4176-T2, title: "A 529 plan of $8,000 and a $1,000 joint account the co-owner will not release, among $10,000", as_of: "2026-10-01", given: {liquid_resources_value: 10000, education_savings_accounts_value: 8000, liquid_resources_inaccessible_value: 1000}, expect: 1000}
  - {id: CO-4176-T3, title: "A state EITC received while participating", as_of: "2026-10-01", given: {liquid_resources_value: 900, snap_eitc_held_while_participating_value: 600}, expect: 300}
  - {id: CO-4176-T4, title: "No excluded holdings stated", as_of: "2026-10-01", given: {liquid_resources_value: 1200}, expect: 1200}
  - {id: CO-4176-T9, title: "CF-8: a $6,000 account held with an adult child elsewhere: the $3,000 share plus the reachable $3,000 of the child's", as_of: "2027-02-10", given: {liquid_resources_value: 3000, joint_liquid_resources_other_owners_share_value: 3000}, expect: 6000}
  - {id: CO-4176-T10, title: "CF-3 (4.410.C): $8,000 in the bank, $6,000 of it a farmer's averaged crop receipts still being counted as income: $2,000", as_of: "2027-02-10", given: {liquid_resources_value: 8000, prorated_income_held_value: 6000}, expect: 2000}
