id: CO-1388
name: "SNAP: person's required verification count"
identifier: snap_person_required_verification_count
kind: derived
type: whole number
scope: person-month
program: SNAP
meaning: The number of verification elements SNAP requires for this person (identity, citizenship, immigration status, SSN, residency, earned and unearned income, resources, shelter, medical, dependent care and child support expenses, household composition, disability, age, work hours, sponsor information, and that the household provides the majority of the meals of a child already receiving SNAP elsewhere, 10 CCR 2506-1 4.505.4.C).
derived: ["+", [case, [snap_requires_verification_of_identity, 1], [else, 0]], [case, [snap_requires_verification_of_citizenship, 1], [else, 0]], [case, [snap_requires_verification_of_immigration_status, 1], [else, 0]], [case, [snap_requires_verification_of_ssn, 1], [else, 0]], [case, [snap_requires_verification_of_residency, 1], [else, 0]], [case, [snap_requires_verification_of_earned_income, 1], [else, 0]], [case, [snap_requires_verification_of_unearned_income, 1], [else, 0]], [case, [snap_requires_verification_of_resources, 1], [else, 0]], [case, [snap_requires_verification_of_household_composition, 1], [else, 0]], [case, [snap_requires_verification_of_disability, 1], [else, 0]], [case, [snap_requires_verification_of_age, 1], [else, 0]], [case, [snap_requires_verification_of_work_hours, 1], [else, 0]], [case, [snap_requires_verification_of_shelter_costs, 1], [else, 0]], [case, [snap_requires_verification_of_medical_expenses, 1], [else, 0]], [case, [snap_requires_verification_of_dependent_care, 1], [else, 0]], [case, [snap_requires_verification_of_child_support_paid, 1], [else, 0]], [case, [snap_requires_verification_of_sponsor, 1], [else, 0]], [case, [snap_requires_verification_of_child_majority_meals, 1], [else, 0]]]
sources: [S800, S817, S2969]
implemented: engine
tags: [verification, snap]
rationale: snap_verification_status needs to know whether the household has any verification requirement at all; no existing item counts them.
tests:
  - {id: CO-1388-T1, month: "2026-10", as_of: "2026-10-01", given: {snap_requires_verification_of_identity: true, snap_requires_verification_of_citizenship: false, snap_requires_verification_of_immigration_status: false, snap_requires_verification_of_ssn: true, snap_requires_verification_of_residency: false, snap_requires_verification_of_earned_income: false, snap_requires_verification_of_unearned_income: false, snap_requires_verification_of_resources: false, snap_requires_verification_of_household_composition: false, snap_requires_verification_of_disability: false, snap_requires_verification_of_age: false, snap_requires_verification_of_work_hours: false, snap_requires_verification_of_shelter_costs: false, snap_requires_verification_of_medical_expenses: false, snap_requires_verification_of_dependent_care: false, snap_requires_verification_of_child_support_paid: false, snap_requires_verification_of_sponsor: false}, expect: 2}
