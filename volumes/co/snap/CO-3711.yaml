id: CO-3711
name: "SNAP: sponsor income after the deeming reductions"
identifier: snap_sponsor_income_after_reductions
kind: derived
type: money
scope: person-month
program: SNAP
meaning: "The monthly income of this non-citizen's sponsors that is available for deeming before it is divided among the sponsor's non-citizens (10 CCR 2506-1 4.305.2.D.2.a-b; 7 CFR 273.4(c)(2)(i)): the total earned and unearned income of each sponsor, as SNAP counts it, less snap_sponsor_earned_income_reduction_rate of their earned income, less the SNAP gross income limit for snap_sponsor_deeming_household_size; never below zero."
precision: "Each sponsor's income is read from the sponsor's own facts as SNAP counts a person's income, with the 273.9(c) exclusions (snap_person_earned_income, CO-330; snap_person_unearned_income, CO-331), as 273.4(c)(2)(i) says. The sponsors are the persons who signed the affidavit (sponsors, CO-2713, a co-sponsor spouse included); a spouse who signed neither the I-864 nor an I-864A is not counted, since 4.305.2.C and 273.4(c)(2) deem the spouse's income only \"if they have executed USCIS Form I-864 or I-864A\" (a spouse who executed Form I-864A is stated with the sponsor relationship). 4.305.2.D.1 and 8 U.S.C. 1631(a)(2) read more widely: OQ-730 (final verification pass 2 P2-2). The gross income limit is the table for the size (snap_gross_income_limit_table, CO-110, with CO-111 beyond its last row)."
derived: [max, 0, ["-", ["-", [sum, sponsors, ["+", [of, [P], snap_person_earned_income], [of, [P], snap_person_unearned_income]]], ["*", snap_sponsor_earned_income_reduction_rate, [sum, sponsors, [of, [P], snap_person_earned_income]]]], [lookup_extended, snap_gross_income_limit_table, snap_sponsor_deeming_household_size, snap_gross_income_limit_each_additional]]]
sources: [S2502, S2503]
open: [OQ-730]
implemented: engine
tags: [snap, immigration, income]
rationale: "Final verification F-2: the sponsor deeming computation of 4.305.2.D (S2502) had no item; snap_sponsor_deeming_applies (CO-2337) fed only verification. The 2026-11-21 entry of OQ-380 recorded it as not in the ledger."
tests:
  - {id: CO-3711-T1, title: "Sponsor earns $3,200, household of 3 (FY2027 130% limit $2,960): 3,200 - 640 - 2,960 = 0", as_of: "2026-10-01", month: "2026-10", given: {sponsors: [p2], snap_sponsor_deeming_household_size: 3}, others: {p2: {snap_person_earned_income: 3200, snap_person_unearned_income: 0}}, expect: 0}
  - {id: CO-3711-T2, title: "Sponsor earns $6,000 and has $500 unearned, household of 2 ($2,345): 6,500 - 1,200 - 2,345 = 2,955", as_of: "2026-10-01", month: "2026-10", given: {sponsors: [p2], snap_sponsor_deeming_household_size: 2}, others: {p2: {snap_person_earned_income: 6000, snap_person_unearned_income: 500}}, expect: 2955}
  - {id: CO-3711-T3, title: "Sponsor and co-sponsor spouse, $4,000 and $2,000 earned, household of 4 ($3,575): 6,000 - 1,200 - 3,575 = 1,225", as_of: "2026-10-01", month: "2026-10", given: {sponsors: [p2, p3], snap_sponsor_deeming_household_size: 4}, others: {p2: {snap_person_earned_income: 4000, snap_person_unearned_income: 0}, p3: {snap_person_earned_income: 2000, snap_person_unearned_income: 0}}, expect: 1225}
