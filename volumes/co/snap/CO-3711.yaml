  - {id: CO-3711-T2, title: "Sponsor earns $6,000 and has $500 unearned, household of 2 ($2,345): 6,500 - 1,200 - 2,345 = 2,955", as_of: "2026-10-01", month: "2026-10", given: {sponsor_spouses_not_cosigning: [], sponsors: [p2], snap_sponsor_deeming_household_size: 2}, others: {p2: {snap_person_earned_income: 6000, snap_person_unearned_income: 500}}, expect: 2955}
  - {id: CO-3711-T3, title: "Sponsor and co-sponsor spouse, $4,000 and $2,000 earned, household of 4 ($3,575): 6,000 - 1,200 - 3,575 = 1,225", as_of: "2026-10-01", month: "2026-10", given: {sponsor_spouses_not_cosigning: [], sponsors: [p2, p3], snap_sponsor_deeming_household_size: 4}, others: {p2: {snap_person_earned_income: 4000, snap_person_unearned_income: 0}, p3: {snap_person_earned_income: 2000, snap_person_unearned_income: 0}}, expect: 1225}
  - {id: CO-3711-T4, title: "Coverage review C-14 (OQ-730 resolved): the sponsor earns $4,000 and her husband, who signed nothing, $2,000; household of 4 ($3,575): 6,000 - 1,200 - 3,575 = 1,225 (was 0: 4,000 - 800 - 3,575 below zero)", as_of: "2026-10-01", month: "2026-10", given: {sponsor_spouses_not_cosigning: [p3], sponsors: [p2], snap_sponsor_deeming_household_size: 4}, others: {p2: {snap_person_earned_income: 4000, snap_person_unearned_income: 0}, p3: {snap_person_earned_income: 2000, snap_person_unearned_income: 0}}, expect: 1225}
