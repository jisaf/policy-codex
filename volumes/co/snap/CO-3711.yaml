id: CO-3711
name: "SNAP: sponsor income after the deeming reductions"
identifier: snap_sponsor_income_after_reductions
kind: derived
type: money
scope: person-month
program: SNAP
meaning: "The monthly income of this non-citizen's sponsors that is available for deeming before it is divided among the sponsor's non-citizens (10 CCR 2506-1 4.305.2.D.2.a-b; 7 CFR 273.4(c)(2)(i)): the total earned and unearned income of each sponsor and each sponsor's spouse (8 U.S.C. 1631(a)(2)), as SNAP counts it, less snap_sponsor_earned_income_reduction_rate of their earned income, less the SNAP gross income limit for snap_sponsor_deeming_household_size; never below zero."
precision: "Each sponsor's income is read from the sponsor's own facts as SNAP counts a person's income, with the 273.9(c) exclusions (snap_person_earned_income, CO-330; snap_person_unearned_income, CO-331), as 273.4(c)(2)(i) says. The sponsors are the persons who signed the affidavit (sponsors, CO-2713, a co-sponsor spouse included), and their spouses who signed neither the I-864 nor an I-864A are counted with them (sponsor_spouses_not_cosigning, CO-2714, a spouse declared in the case being read as living with the sponsor): see the override (coverage review C-14; OQ-730 resolved). The gross income limit is the table for the size (snap_gross_income_limit_table, CO-110, with CO-111 beyond its last row)."
statute_override: "Federal law overrides 10 CCR 2506-1 4.305.2.C and 7 CFR 273.4(c)(2), which deem the income and resources of the sponsor's spouse only \"if they have executed USCIS Form I-864 or I-864A\": 8 U.S.C. 1631(a)(2) (Pub. L. 104-193, as amended; \"Notwithstanding any other provision of law\") deems \"the income and resources of the spouse (if any) of the person\" who executed the affidavit of support, and 7 U.S.C. 2014(i)(1) those of \"the sponsor's spouse if such spouse is living with the sponsor\", neither conditioned on a signature; 4.305.2.D.1 counts a spouse married after the agreement was signed. Every spouse of a sponsor declared in the case (who lives with the sponsor) is deemed (OQ-730, resolved)."
derived: [max, 0, ["-", ["-", ["+", [sum, sponsors, ["+", [of, [P], snap_person_earned_income], [of, [P], snap_person_unearned_income]]], [sum, sponsor_spouses_not_cosigning, ["+", [of, [P], snap_person_earned_income], [of, [P], snap_person_unearned_income]]]], ["*", snap_sponsor_earned_income_reduction_rate, ["+", [sum, sponsors, [of, [P], snap_person_earned_income]], [sum, sponsor_spouses_not_cosigning, [of, [P], snap_person_earned_income]]]]], [lookup_extended, snap_gross_income_limit_table, snap_sponsor_deeming_household_size, snap_gross_income_limit_each_additional]]]
sources: [S2502, S2503, S2970, S2971, S3071]
implemented: engine
tags: [snap, immigration, income]
rationale: "Final verification F-2: the sponsor deeming computation of 4.305.2.D (S2502) had no item; snap_sponsor_deeming_applies (CO-2337) fed only verification. The 2026-11-21 entry of OQ-380 recorded it as not in the ledger."
