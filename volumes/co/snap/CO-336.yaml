id: CO-336
name: "SNAP: household all members receive categorical assistance"
identifier: snap_household_all_members_receive_categorical_assistance
kind: derived
type: yes/no
scope: person-month
program: SNAP
meaning: "Every member of this person's SNAP household receives, or is authorized to receive, SSI, TANF cash assistance (Colorado Works), or a Colorado Adult Financial cash payment (Old Age Pension, Aid to the Needy Disabled, or Aid to the Blind) - the Basic Categorical Eligibility test - leaving out the persons 7 CFR 273.2(j)(2)(ix) does not include as members of a categorically eligible household: an ineligible non-citizen (A), an ineligible student (B), and a member ineligible for failing to comply with a work requirement of 273.7 (E)."
precision: "Tests every member of the household, including ineligible members, matching 4.206,C,1,a's \"all members\" wording rather than snap_eligible_household_members; an ineligible student, whom 4.411.2.C (S2508) treats as a non-household member, is not tested (final verification F-6: snap_household_members_other_than_ineligible_students, CO-3714). \"Receive, or are authorized to receive\" (S47) is read from the case records receives_ssi, receives_tanf_cash (CO-013) and receives_state_cash_assistance (CO-073), whose meanings include an approved grant not yet paid; this volume's own Colorado Works and Adult Financial determinations are not read (dual-entry audit 4.3). Coverage pass 4 for SNAP S4-11 (OQ-1263 resolved): per month, since prospective budgeting reads \"anticipated income and circumstances during the issuance month\" (10 CCR 2506-1 4.402.1.A, S4734): the household (CO-3714) is the month's. Before, the item was per person and read on the determination date in every month. Coverage pass 6 for SNAP, C6-5 (docs/reviews/coverage6-snap.md): 7 CFR 273.2(j)(2)(ix) (S4974), \"No person shall be included as a member in any household which is otherwise categorically eligible if that person is: (A) An ineligible alien ...; (B) Ineligible under the student provisions ...; (E) Ineligible because of failure to comply with a work requirement of § 273.7\". A member who does not meet the citizenship requirement (snap_meets_citizenship_requirement, CO-309, the test snap_household_members_other_than_ineligible_students, CO-3714, reads for the same reason: snap_is_ineligible_non_citizen reads the sponsor verification, which reads this item) and a member disqualified for the work requirements (CO-040) or for a voluntary quit (one of the work requirements of 273.7(a)(1), S4973) are not tested. (C) (an SSI recipient in a cash-out State under 273.20) is named by no Colorado SNAP rule on file (10 CCR 2506-1, D-82, has no cash-out), and a resident of a nonexempt institution ((D)) is not in snap_household_members. Before, a citizen family whose every member received Colorado Works beside an undocumented parent who did not was not BCE; it fell to ECE, which gives the same answer at gross income up to 200% of poverty and moves only the category and the verification relief that reads it (OQ-640)."
derived: [not, [exists, snap_household_members_other_than_ineligible_students, [all, [of, [P], snap_meets_citizenship_requirement], [not, [any, [of, [P], snap_is_disqualified_for_work_requirement_noncompliance], [of, [P], snap_is_disqualified_for_voluntary_quit]]], [not, [any, [of, [P], receives_ssi], [of, [P], receives_tanf_cash], [of, [P], receives_state_cash_assistance]]]]]]
sources: [S47, S2508, S4974, S4973]
implemented: engine
tags: [income, state_election]
rationale: "10 CCR 2506-1 4.206,C,1,a (S47) is the BCE test's 'all members' condition; no existing item tests a household-wide 'every member receives X' condition, which snap_meets_bce_eligibility needs isolated from the IPV/drug-felony exclusion of 4.206,C,1,c. Fix-round (C-6): previously read receives_disability_based_general_assistance as a stand-in for OAP/AND/AB, contradicting that fact's own meaning ('general assistance... based on disability or blindness criteria', which is what CO-302 needs and OAP is not - OAP is age-based). Now reads the new fact receives_state_cash_assistance (CO-073), which states the OAP/AND/AB prong 4.206,C,1,a actually names, leaving receives_disability_based_general_assistance to CO-302 alone. OQ-11 is amended accordingly."
