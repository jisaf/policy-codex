id: CO-336
name: "SNAP: household all members receive categorical assistance"
identifier: snap_household_all_members_receive_categorical_assistance
kind: derived
type: yes/no
scope: person
program: SNAP
meaning: Every member of this person's SNAP household receives, or is authorized to receive, SSI, TANF cash assistance (Colorado Works), or a Colorado Adult Financial cash payment (Old Age Pension, Aid to the Needy Disabled, or Aid to the Blind) - the Basic Categorical Eligibility test.
precision: Tests every member of snap_household_members, including ineligible members, matching 4.206,C,1,a's "all members" wording rather than snap_eligible_household_members.
derived: [not, [exists, snap_household_members, [not, [any, [of, [P], receives_ssi], [of, [P], receives_tanf_cash], [of, [P], receives_state_cash_assistance]]]]]
sources: [S47]
implemented: engine
tags: [income, state_election]
rationale: "10 CCR 2506-1 4.206,C,1,a (S47) is the BCE test's 'all members' condition; no existing item tests a household-wide 'every member receives X' condition, which snap_meets_bce_eligibility needs isolated from the IPV/drug-felony exclusion of 4.206,C,1,c. Fix-round (C-6): previously read receives_general_assistance as a stand-in for OAP/AND/AB, contradicting that fact's own meaning ('general assistance... based on disability or blindness criteria', which is what CO-302 needs and OAP is not - OAP is age-based). Now reads the new fact receives_state_cash_assistance (CO-073), which states the OAP/AND/AB prong 4.206,C,1,a actually names, leaving receives_general_assistance to CO-302 alone. OQ-11 is amended accordingly."
tests:
  - {id: CO-336-T1, as_of: "2026-10-01", given: {in_medical_institution: false, receives_ssi: true, receives_tanf_cash: false, receives_state_cash_assistance: false}, others: {p2: {in_medical_institution: false, receives_ssi: false, receives_tanf_cash: true, receives_state_cash_assistance: false}}, relationships: [[spouse, p1, p2]], expect: true}
  - {id: CO-336-T2, as_of: "2026-10-01", given: {in_medical_institution: false, receives_ssi: false, receives_tanf_cash: false, receives_state_cash_assistance: false}, others: {p2: {in_medical_institution: false, receives_ssi: false, receives_tanf_cash: true, receives_state_cash_assistance: false}}, relationships: [[spouse, p1, p2]], expect: false}
  - {id: CO-336-T3, as_of: "2026-10-01", given: {in_medical_institution: false, receives_ssi: false, receives_tanf_cash: false, receives_state_cash_assistance: true}, others: {p2: {in_medical_institution: false, receives_ssi: false, receives_tanf_cash: false, receives_state_cash_assistance: true}}, relationships: [[spouse, p1, p2]], expect: true}
