id: CO-4329
name: "SNAP: self-employment income is averaged"
identifier: snap_self_employment_is_averaged
kind: derived
type: yes/no
scope: person
program: SNAP
meaning: "SNAP averages this person's self-employment income over the months snap_self_employment_averaging_months (CO-4349) gives, instead of counting each month's receipts and costs (10 CCR 2506-1 4.402.2.A.1, 4.403.12.A, C, D): the person states business receipts (an earnings record whose row in snap_earnings_treatment_table is counted_less_costs or counted_loss_offset), and every such record states that the enterprise is the household's annual support (annual_support), that its business has not changed substantially (changed_substantially), and that it began before the month of application (job_start_date; a record that states none began before the months the case covers); the household is not a destitute migrant household."
precision: "An enterprise whose business has changed substantially is counted on anticipated earnings (4.403.12.A, C), and one that began in the month of application has no past months to average, so for both the month's figures, which are the anticipated amounts, are read. Self-employment that is only part of the year's support (4.403.12.B) is not averaged here; the case states each self-employment month already averaged over the season. Averaging does not apply to a migrant household destitute of income (4.402.2.A, last paragraph). Earned-income records, step E1 (SNAP; docs/reviews/records-earnings-snap.md): the business's own records say it: annual_support and changed_substantially are required where read (decision D3 of the earned-income design: no rule text gives them a value, CO-5100), so a business that does not say whether it is the household's annual support cannot be determined (before step E1 an unstated fact was read as no); changed_substantially is read only for a business that is annual support. A person with no business records is not averaged."
derived: ["all",["not",["otherwise","is_destitute_migrant_or_seasonal_farmworker",false]],[">",["sum_receipts","earnings",["in",["lookup","snap_earnings_treatment_table",["receipt","kind"]],["counted_less_costs","counted_loss_offset"]],1],0],["=",["sum_receipts","earnings",["in",["lookup","snap_earnings_treatment_table",["receipt","kind"]],["counted_less_costs","counted_loss_offset"]],1],["sum_receipts","earnings",["all",["in",["lookup","snap_earnings_treatment_table",["receipt","kind"]],["counted_less_costs","counted_loss_offset"]],["receipt","annual_support"],["not",["receipt","changed_substantially"]],["any",["unknown",["receipt","job_start_date"]],["<",["month_of",["receipt","job_start_date"]],["month_of","snap_application_date"]]]],1]]]
sources: [S3113, S3114]
implemented: engine
tags: [snap, income]
rationale: "Coverage review snap-financial CF-3: SNAP counted each month's self-employment receipts, so a farmer paid in one month had all the year's income in that month and none in the others, though 4.402.2.A.1 (S3113) and 4.403.12 (S3114) annualize it. Earned-income records, step E1 (SNAP; docs/reviews/records-earnings-snap.md): reads the business records' fields instead of CO-4327, CO-4342 and CO-4328."
tests:
  - {id: CO-4329-T1, title: "A business that supports the household all year, operating for years, not changed", as_of: "2026-11-10", given: {snap_application_date: "2026-11-02", earnings: [{kind: self_employment_receipts, amount: 1000, annual_support: true, changed_substantially: false}]}, expect: true}
  - {id: CO-4329-T2, title: "Self-employment that is only part support: not averaged here", as_of: "2026-11-10", given: {snap_application_date: "2026-11-02", earnings: [{kind: self_employment_receipts, amount: 1000, annual_support: false}]}, expect: false}
  - {id: CO-4329-T3, title: "A substantial change in business: anticipated earnings", as_of: "2026-11-10", given: {snap_application_date: "2026-11-02", earnings: [{kind: self_employment_receipts, amount: 1000, annual_support: true, changed_substantially: true}]}, expect: false}
  - {id: CO-4329-T4, title: "An enterprise that began in the month of application", as_of: "2026-11-10", given: {snap_application_date: "2026-11-02", earnings: [{kind: self_employment_receipts, amount: 1000, annual_support: true, changed_substantially: false, job_start_date: "2026-11-01"}]}, expect: false}
  - {id: CO-4329-T5, title: "No self-employment stated", as_of: "2026-11-10", given: {earnings: [{kind: wages, amount: 1000}]}, expect: false}
  - {id: CO-4329-T6, title: "A business that does not say whether it is the household's annual support: cannot determine", as_of: "2026-11-10", given: {snap_application_date: "2026-11-02", earnings: [{kind: self_employment_receipts, amount: 1000}]}, expect: unknown}
  - {id: CO-4329-T7, title: "A farm that is the household's annual support beside wages: averaged", as_of: "2026-11-10", given: {snap_application_date: "2026-11-02", earnings: [{kind: wages, amount: 500}, {kind: farm_self_employment_receipts, amount: 2000, annual_support: true, changed_substantially: false}]}, expect: true}
  - {id: CO-4329-T8, title: "Earnings not stated: cannot determine", as_of: "2026-11-10", given: {snap_application_date: "2026-11-02"}, expect: unknown}
