id: CO-5013
name: "SNAP: infrequent or irregular unearned receipts in the calendar quarter"
identifier: snap_irregular_unearned_receipts_in_quarter
kind: derived
type: money
scope: person-month
program: SNAP
meaning: "The person's receipts marked infrequent or irregular that SNAP counts as income (snap_receipt_treatment_table), not paid once, received in the months of the calendar quarter that contains the month (10 CCR 2506-1 4.405.A; 7 CFR 273.9(c)(2) \"in a quarter\")."
precision: "The calendar quarter is also the federal fiscal quarter. Each earlier month's receipts are summed in that month (\"in that month\"), so a receipt is counted with the treatment table in force in the month it is received (docs/operators.md, Resolution step 2 and P57). Decision 4 of 2026-11-23 (docs/plan-colorado.md: missing information is cannot determine unless the rule says otherwise), applied as the reader-defaults round did (b49a7f2): receipts not stated are cannot determine (before, each month of the quarter was read as 0, as infrequent_or_irregular_income_in_quarter, CO-4077, read the month's fact); 4.405.A and 273.9(c)(2) exclude income \"not in excess of $30 in a quarter\" and give no reading for income not reported. A stated empty list is no irregular receipts. Its readers ask for the quarter only in a month that has irregular income of their own list (CO-5111, CO-5014). Coverage pass 4 S4-12: the $30 is a limit on income (4.405.A, S3100: \"Any income ... not in excess of thirty dollars ($30) in three (3) months\"), so only receipts SNAP's counting table counts as income (counted, counted because no rule excludes it, counted beyond the quarterly limit, counted as earned, net of costs, a diversion) and that are not paid once are summed; a reimbursement, a loan, educational assistance or a nonrecurring lump sum is not income (4.405.E, F, I, 4.405.1) and is not held against the limit. A record is placed by its regular date and its source's dates (S4-2, S4-3). Field sweep fix round (FS-SNAP-2): 10 CCR 2506-1 4.405.E (S3476): \"Money received in the form of non-recurring lump sum payments, includes ... retroactive lump-sum Social Security, SSI, public assistance, railroad retirement benefits or other payments\". A receipt marked retroactive is such a lump sum whatever its frequency states, so it is read as a receipt paid once (frequency once) is: not recurring income (it is a resource from the month received, 4.405.E last paragraph, S4691). Before, only frequency once was tested, and a retroactive payment stated with its month and no frequency (an undated record's frequency is monthly) was counted as the month's income."
derived: ["sum_months", "snap_calendar_quarter_months", ["at", ["sum_receipts", "receipts", ["all", ["receipt", "irregular"], ["not", ["any", ["=", ["receipt", "frequency"], "once"], ["receipt", "retroactive"]]], ["case", [["not", ["unknown", ["receipt", "regular_date"]]], ["=", ["month_of", ["receipt", "regular_date"]], ["month"]]], ["else", ["all", ["received_in", ["month"]], ["any", ["not", ["unknown", ["receipt", "month"]]], ["all", ["any", ["unknown", ["receipt", "start_date"]], ["<=", ["month_of", ["receipt", "start_date"]], ["month"]]], ["any", ["unknown", ["receipt", "end_date"]], [">=", ["month_of", ["receipt", "end_date"]], ["month"]]]]]]]], ["in", ["lookup", "snap_receipt_treatment_table", ["receipt", "kind"]], ["counted", "counted_no_rule_excludes", "counted_beyond_quarterly_limit", "counted_as_earned", "net_of_costs", "counted_unless_short_lump_sum"]]], ["receipt", "amount"]], ["that_month"]]]
sources: [S3128, S3476]
implemented: engine
tags: [snap, income]
rationale: "Receipt records, migration phase 1: SNAP's own quarter sum of irregular receipts, replacing its read of the shared CO-4077. Earned-income records, step E1 (SNAP; docs/reviews/records-earnings-snap.md): a receipt of a kind SNAP now reads as earnings (uniformed_services_special_pay, the translator's transition copy of the earnings record) is left out, so snap_irregular_income_is_within_quarterly_limit (CO-5110), which adds the quarter's irregular earnings, counts it once. Decision 4 round (E1 SNAP): the otherwise 0 on each month is removed."
tests:
  - {id: CO-5013-T1, month: "2026-11", as_of: "2026-11-15", given: {receipts: [{kind: other_nontaxable, amount: 20, irregular: true, month: "2026-10"}, {kind: gift, amount: 15, irregular: true, month: "2026-12"}]}, title: "Irregular receipts in October and December, the quarter of November", expect: 35}
  - {id: CO-5013-T2, month: "2026-11", as_of: "2026-11-15", given: {}, title: "Receipts not stated: cannot determine (decision 4)", expect: unknown}
  - {id: CO-5013-T3, month: "2026-11", as_of: "2026-11-15", given: {receipts: []}, title: "Receipts stated empty: 0", expect: 0}
  # Field sweep fix round (FS-SNAP-2): hand-computed from 10 CCR 2506-1 4.405.E (S3476): a retroactive lump sum is a non-recurring lump sum, not income.
  - {"month": "2027-02", "as_of": "2027-02-15", "title": "A $25 irregular gift in February and $400 of retroactive unemployment marked irregular in January: the quarter's irregular income is the gift, 25", "given": {"receipts": [{"kind": "other_nontaxable", "amount": 25, "month": "2027-02", "irregular": true}, {"kind": "unemployment_compensation", "amount": 400, "month": "2027-01", "irregular": true, "retroactive": true}]}, "expect": 25, "id": "CO-5013-T4"}
