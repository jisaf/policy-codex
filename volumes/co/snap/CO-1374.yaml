id: CO-1374
name: "SNAP: requires verification of SSN"
identifier: snap_requires_verification_of_ssn
kind: derived
type: yes/no
scope: person-month
program: SNAP
meaning: "Whether the person's Social Security number must be furnished and verified for SNAP: every eligible household member, except in a basic categorically eligible household, whose conferring program verified the numbers (the local office accepts those numbers as verified). At recertification a number not verified before, or newly obtained, is verified the same way."
derived: [all, snap_is_household_member, [not, snap_is_ineligible_member], [not, ["=", snap_eligibility_category, basic_categorical]]]
sources: [S804, S817, S823, S819, S1055, S1056]
implemented: engine
tags: [verification, snap]
rationale: No existing item states this verification requirement; the phase-9 chapter needs one requirement item per element so the household's pending count and status can be derived.
tests:
  - {id: CO-1374-T1, month: "2026-10", as_of: "2026-10-01", given: {snap_resides_in_institution_providing_meals: false, snap_is_ineligible_member: false, snap_eligibility_category: standard}, expect: true}
  - {id: CO-1374-T2, month: "2026-10", as_of: "2026-10-01", given: {snap_resides_in_institution_providing_meals: false, snap_is_ineligible_member: true, snap_eligibility_category: standard}, expect: false}
  - {id: CO-1374-T3, month: "2026-10", as_of: "2026-10-01", given: {snap_resides_in_institution_providing_meals: false, snap_is_ineligible_member: false, snap_eligibility_category: basic_categorical}, expect: false}
