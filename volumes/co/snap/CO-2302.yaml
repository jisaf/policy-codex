id: CO-2302
name: "SNAP: is a disqualified member whose income and expenses count in full"
identifier: snap_is_disqualified_member_counted_in_full
kind: derived
type: yes/no
scope: person
program: SNAP
meaning: "The person is a household member disqualified for an intentional program violation or fraud, for a work-requirement sanction (a voluntary quit included), or as a fleeing felon or probation or parole violator: the disqualifications of 10 CCR 2506-1 4.411.1.B.1, whose income and resources count in their entirety and whose deductible expenses are allowed in their entirety."
derived: [any, snap_is_serving_ipv_disqualification, is_disqualified_for_work_requirement_noncompliance, snap_is_disqualified_for_voluntary_quit, is_fleeing_felon, is_probation_or_parole_violator]
sources: [S1602, S1611]
implemented: engine
tags: [snap, income]
rationale: "snap_counted_income_of_ineligible_member (CO-333), snap_counted_earned_income_of_ineligible_member (CO-371) and the new expense items (CO-2300, CO-2301) each test the same 4.411.1.B.1 grounds; one item now names the group, and it adds the voluntary-quit disqualification (snap_is_disqualified_for_voluntary_quit, CO-2318), which 4.310.8.A treats as a disqualified member and 4.308.E disqualifies \"in the same manner as individuals failing to comply with work registration or EF requirements\"."
tests:
  - {id: CO-2302-T1, as_of: "2026-10-01", given: {snap_is_serving_ipv_disqualification: true}, expect: true}
  - {id: CO-2302-T2, as_of: "2026-10-01", given: {snap_is_serving_ipv_disqualification: false, is_disqualified_for_work_requirement_noncompliance: false, snap_is_disqualified_for_voluntary_quit: false, is_fleeing_felon: false, is_probation_or_parole_violator: false}, expect: false}
  - {id: CO-2302-T3, title: "A voluntary quit disqualification counts in full", as_of: "2026-10-01", given: {snap_is_serving_ipv_disqualification: false, is_disqualified_for_work_requirement_noncompliance: false, is_fleeing_felon: false, is_probation_or_parole_violator: false, snap_is_disqualified_for_voluntary_quit: true}, expect: true}
