id: CO-2302
name: "SNAP: is a disqualified member whose income and expenses count in full"
identifier: snap_is_disqualified_member_counted_in_full
kind: derived
type: yes/no
scope: person-month
program: SNAP
meaning: "The person is a household member disqualified for an intentional program violation or fraud, for a work-requirement sanction (a voluntary quit included), as a fleeing felon or probation or parole violator, for a drug-related felony, or as a convicted felon under 7 CFR 273.11(s): the disqualifications of 10 CCR 2506-1 4.411.1.B.1 and 7 CFR 273.11(c)(1), whose income and resources count in their entirety and whose deductible expenses are allowed in their entirety."
precision: "CDHS review B-4: 4.411.1.B.1 names IPV, work sanctions and fleeing felons; 7 CFR 273.11(c)(1) (S1813) adds the felony drug conviction and the convicted felons of 273.11(s), which Colorado's list omits, so they count in full here as the federal rule requires (before this round a drug-felony member's income was not counted at all). Both read as false when not stated, as snap_is_ineligible_member (CO-311) already tests them. Coverage pass 2 N2-P2-2: the fleeing felon arm reads Colorado's four-part test (snap_is_fleeing_felon, CO-4683; 4.304.4.B, S3066) in place of the federal definition alone (is_fleeing_felon, CO-038). Coverage pass 4 for SNAP S4-11 (OQ-1263 resolved): per month, since prospective budgeting reads \"anticipated income and circumstances during the issuance month\" (10 CCR 2506-1 4.402.1.A, S4734): the voluntary quit (CO-2318) is the month's. Before, the item was per person and read on the determination date in every month."
derived: [any, snap_is_serving_ipv_disqualification, snap_is_disqualified_for_work_requirement_noncompliance, snap_is_disqualified_for_voluntary_quit, snap_is_fleeing_felon, snap_is_probation_or_parole_violator, [otherwise, snap_is_disqualified_drug_felony, false], [otherwise, snap_is_disqualified_convicted_felon, false]]
sources: [S1602, S1611, S1813, S3066]
implemented: engine
tags: [snap, income]
rationale: "snap_counted_income_of_ineligible_member (CO-333), snap_counted_earned_income_of_ineligible_member (CO-371) and the new expense items (CO-2300, CO-2301) each test the same 4.411.1.B.1 grounds; one item now names the group, and it adds the voluntary-quit disqualification (snap_is_disqualified_for_voluntary_quit, CO-2318), which 4.310.8.A treats as a disqualified member and 4.308.E disqualifies \"in the same manner as individuals failing to comply with work registration or EF requirements\". SNAP non-financial coverage P2-3, second half (fix round 2026-11-23): reads snap_is_probation_or_parole_violator (CO-5216), which applies 4.304.4.C's impartial-party finding and actively-seeking conditions, instead of the neutral fact."
tests:
  - {id: CO-2302-T1, month: "2026-10", as_of: "2026-10-01", given: {snap_is_serving_ipv_disqualification: true}, expect: true}
  - {id: CO-2302-T2, month: "2026-10", as_of: "2026-10-01", given: {snap_is_serving_ipv_disqualification: false, snap_is_disqualified_for_work_requirement_noncompliance: false, snap_is_disqualified_for_voluntary_quit: false, is_fleeing_felon: false, snap_is_probation_or_parole_violator: false}, expect: false}
  - {id: CO-2302-T3, month: "2026-10", title: "A voluntary quit disqualification counts in full", as_of: "2026-10-01", given: {snap_is_serving_ipv_disqualification: false, snap_is_disqualified_for_work_requirement_noncompliance: false, is_fleeing_felon: false, snap_is_probation_or_parole_violator: false, snap_is_disqualified_for_voluntary_quit: true}, expect: true}
  - {id: CO-2302-T4, month: "2026-10", title: "B-4: a post-2014 violent felony counts in full (273.11(c)(1), (s))", as_of: "2026-10-01", given: {snap_is_serving_ipv_disqualification: false, snap_is_disqualified_for_work_requirement_noncompliance: false, snap_is_disqualified_for_voluntary_quit: false, is_fleeing_felon: false, snap_is_probation_or_parole_violator: false, snap_is_disqualified_drug_felony: false, snap_is_disqualified_convicted_felon: true}, expect: true}
