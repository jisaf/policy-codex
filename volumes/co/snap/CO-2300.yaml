id: CO-2300
name: "SNAP: counted shelter cost of a member"
identifier: snap_counted_shelter_cost_of_member
kind: derived
type: money
scope: person-month
program: SNAP
meaning: "The part of the shelter costs billed to or paid by this household member (shelter_cost_monthly) that counts as a shelter cost of the household: all of it for an eligible member and for a member disqualified for IPV or fraud, a work-requirement sanction (a voluntary quit included) or as a fleeing felon or probation or parole violator; for a member whose income is prorated (an ineligible non-citizen, an SSN refusal, an ABAWD at the time limit), the cost divided evenly among every household member, the ineligible members included, less the shares of the members whose income is prorated (7 CFR 273.11(c)(2)(iii); snap_prorated_member_share_counted_rate, CO-7250); nothing for an ineligible student, who is not a household member, or for any other ineligible member."
precision: "n is the count of snap_household_members, the disqualified members included, as in snap_counted_income_of_ineligible_member (CO-333). Each prorated member's cost loses the shares of every prorated member, the reading CO-333 gives the income of 4.411.1.B.2.b. The standard utility allowance is not prorated (4.411.1.B.2.c); snap_shelter_costs (CO-377) adds it once in full. A drug-felony disqualification counts nothing, matching CO-333, which counts none of that member's income. Unknown when this member's shelter_cost_monthly is unstated. Engineering follow-up 5: a prorated member with no household (snap_household_members empty, as for a person who is not a household member) has nothing counted to any household, so the share is 0 rather than a division by zero. Final verification F-10 (V-5): once the expense verification period has ended (snap_expense_verification_period_has_ended, CO-3739) with this member's shelter costs still required to be verified and unverified (snap_shelter_costs_verification_is_pending, CO-1612, required only when questionable or for an unoccupied home), nothing counts: 4.502.A.3 (S818) and 7 CFR 273.2(f)(3)(ii) (S812) determine eligibility and benefit \"without providing a deduction ... for the unverified expense\". The standard utility allowance is not an expense to verify (4.407.31) and stays. Final verification F-6: n counts the members other than an ineligible student (snap_household_members_other_than_ineligible_students, CO-3714), whom 4.411.2.C (S2508) treats as a non-household member not considered in the allotment. Coverage review snap-financial CF-15: the other continuing charges 4.407.3.E.1-3 allows (condominium and association fees, mobile home loans, second mortgages and home equity loans, reverse mortgage repayments, disaster repairs; S3126) are added to the member's rent or mortgage, taxes and insurance (shelter_other_continuing_charges, CO-4345, read as 0 when not stated). Coverage pass 3 C3-3: the stated costs are read from snap_person_stated_shelter_costs (CO-4931), the sum the shelter-cost verification (CO-1379) also reads. Coverage pass 6 for SNAP, C6-1 (docs/reviews/coverage6-snap.md): with two or more prorated members in the household, every prorated member's share is left out, not only this member's own: the fraction counted is snap_prorated_member_share_counted_rate (CO-7250), (n - k) / n with k the prorated members, as 7 CFR 273.11(c)(2)(ii)-(iii) (S4970) says (\"All but the ineligible members' share is counted\"). Before, (n - 1) / n was counted whatever k was."
derived: [case, [[all, snap_shelter_costs_verification_is_pending, snap_expense_verification_period_has_ended], 0], [[not, snap_is_ineligible_member], snap_person_stated_shelter_costs], [snap_is_disqualified_member_counted_in_full, snap_person_stated_shelter_costs], [snap_is_ineligible_member_prorated, [case, [["=", snap_prorated_member_share_counted_rate, 0], 0], [else, ["*", snap_person_stated_shelter_costs, snap_prorated_member_share_counted_rate]]]], [else, 0]]
sources: [S818, S812, S1600, S1602, S1603, S4970]
nearest: [CO-333]
implemented: engine
tags: [snap, income]
rationale: "OQ-28: 4.407.3.A (S1600) allows shelter expenses \"as billed to a household member or as paid or billed to a disqualified individual\", in full for fraud and divided evenly among all members for an ineligible non-citizen, and 4.411.1.B.1.a and B.2.c (S1602) say the same for the other disqualifications; no item attributed a shelter cost to the member billed for it. shelter_cost_monthly (CO-035) now states each member's own billed or paid amount, and this item counts it the way the member's disqualification requires."
tests:
  - {id: CO-2300-T1, title: "An eligible member's billed rent counts in full", as_of: "2026-10-01", month: "2026-10", given: {snap_expense_verification_period_has_ended: false, shelter_cost_monthly: 1200, snap_is_ineligible_member: false}, expect: 1200}
  - {id: CO-2300-T2, title: "4.407.3.A - rent billed to an ineligible non-citizen in a household of four counts three quarters", as_of: "2026-10-01", month: "2026-10", given: {snap_prorated_member_share_counted_rate: 0.75, snap_expense_verification_period_has_ended: false, shelter_cost_monthly: 1200, snap_is_ineligible_member: true, snap_is_disqualified_member_counted_in_full: false, snap_is_ineligible_member_prorated: true, snap_household_members_other_than_ineligible_students: [p1, p2, p3, p4]}, expect: 900}
  - {id: CO-2300-T3, title: "4.411.1.B.1.a - rent billed to a member disqualified for IPV counts in full", as_of: "2026-10-01", month: "2026-10", given: {snap_expense_verification_period_has_ended: false, shelter_cost_monthly: 1200, snap_is_ineligible_member: true, snap_is_disqualified_member_counted_in_full: true, snap_household_members: [p1, p2, p3, p4]}, expect: 1200}
  - {id: CO-2300-T4, title: "4.411.2.A, C - rent paid by an ineligible student is not the household's", as_of: "2026-10-01", month: "2026-10", given: {snap_expense_verification_period_has_ended: false, shelter_cost_monthly: 1200, snap_is_ineligible_member: true, snap_is_disqualified_member_counted_in_full: false, snap_is_ineligible_member_prorated: false, snap_household_members: [p1, p2]}, expect: 0}
  - {id: CO-2300-T5, title: "An unstated shelter cost is unknown, not zero (OQ-29)", as_of: "2026-10-01", month: "2026-10", given: {snap_is_ineligible_member: false}, expect: unknown}
  - {id: CO-2300-T6, title: "Engineering follow-up 5: a prorated member with no household has nothing counted", as_of: "2026-10-01", month: "2026-10", given: {snap_expense_verification_period_has_ended: false, snap_is_ineligible_member: true, snap_is_disqualified_member_counted_in_full: false, snap_is_ineligible_member_prorated: true, shelter_cost_monthly: 900, snap_household_members_other_than_ineligible_students: []}, expect: 0}
  - {id: CO-2300-T7, title: "Final verification F-6 - an ineligible student is not in n: rent billed to an ineligible non-citizen in a unit of four, one an ineligible student, counts two thirds", as_of: "2026-10-01", month: "2026-10", given: {snap_prorated_member_share_counted_rate: 0.6666666666666666, snap_expense_verification_period_has_ended: false, shelter_cost_monthly: 1200, snap_is_ineligible_member: true, snap_is_disqualified_member_counted_in_full: false, snap_is_ineligible_member_prorated: true, snap_household_members_other_than_ineligible_students: [p1, p2, p3]}, expect: 800}
  - {id: CO-2300-T8, title: "Final verification F-10: questionable rent still unverified after the thirtieth day - not counted", as_of: "2026-11-05", month: "2026-11", given: {snap_shelter_costs_verification_is_pending: true, snap_expense_verification_period_has_ended: true, shelter_cost_monthly: 1200, snap_is_ineligible_member: false}, expect: 0}
  - {id: CO-2300-T9, title: "Coverage pass 6 C6-1: rent of $900 billed to a prorated member, three members of whom two are prorated: 900 x (3 - 2) / 3 = 300 (7 CFR 273.11(c)(2)(iii))", as_of: "2026-11-01", month: "2026-11", given: {snap_shelter_costs_verification_is_pending: false, snap_expense_verification_period_has_ended: false, snap_person_stated_shelter_costs: 900, snap_is_ineligible_member: true, snap_is_disqualified_member_counted_in_full: false, snap_is_ineligible_member_prorated: true, snap_household_members_other_than_ineligible_students: [p1, p2, p3]}, others: {p2: {snap_is_ineligible_member_prorated: true}, p3: {snap_is_ineligible_member_prorated: false}}, expect: 300}
