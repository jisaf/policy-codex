id: CO-6604
name: "SNAP: hours worked for pay in the month"
identifier: snap_hours_worked_in_month
kind: derived
type: hours
scope: person-month
program: SNAP
meaning: "The hours the person worked for pay, including self-employment, in the month as SNAP's work tests read them (the student's twenty hours, 10 CCR 2506-1 4.306.1.B; the work registration exemption, 4.310.3.E; the ABAWD work requirement, 4.311.B and its verification, 7 CFR 273.2(f)(1)(xiv)(A)): the hours stated (hours_worked, CO-022) when the person's earnings records state pay or business receipts in the month; 0 when they state none, since a person with no pay and no business receipts in the month worked no hours for pay in it."
precision: "Coverage pass 4 for SNAP (docs/reviews/coverage4-snap.md), S4-13, decision 4 of 2026-11-23 (\"readers do not invent defaults\"): before, every reader took unstated hours as 0 even when the person's own earnings records stated pay for the month, so a working student was an ineligible student (STU: CO-83's stepfather, a half-time student earning $1,500 with hours not stated, was out of the household, $362 in October) and an ABAWD with wages accrued a countable month, while the hours verification read the same fact with no default. No rule gives unstated hours a value, so where the records show pay or business receipts the hours are required and their absence is cannot determine, naming hours_worked. Where the records state no pay and no business receipts for the month (an empty list, or records of other months only) the hours worked for pay are 0 by the records' own statement, not by a default. The pay is snap_person_pay_received (CO-5119); the business receipts are the records whose row is counted_less_costs or counted_loss_offset, placed as the income items place them. Earnings not stated: cannot determine. One reading for every reader: snap_weekly_hours_worked (CO-402), snap_meets_student_employment_exemption (CO-407), snap_meets_abawd_work_requirement (CO-415) and snap_requires_verification_of_work_hours (CO-1386)."
derived: ["case", [["all", ["=", "snap_person_pay_received", 0], ["=", ["sum_receipts", "earnings", ["all", ["in", ["lookup", "snap_earnings_treatment_table", ["receipt", "kind"]], ["counted_less_costs", "counted_loss_offset"]], ["case", [["not", ["unknown", ["receipt", "regular_date"]]], ["=", ["month_of", ["receipt", "regular_date"]], ["month"]]], ["else", ["all", ["received_in", ["month"]], ["any", ["not", ["unknown", ["receipt", "month"]]], ["all", ["any", ["unknown", ["receipt", "job_start_date"]], ["<=", ["month_of", ["receipt", "job_start_date"]], ["month"]]], ["any", ["unknown", ["receipt", "job_end_date"]], [">=", ["month_of", ["receipt", "job_end_date"]], ["month"]]]]]]]]], ["receipt", "amount"]], 0]], ["otherwise", "hours_worked", 0]], ["else", "hours_worked"]]
sources: [S135, S132, S810, S121]
implemented: engine
tags: [snap, work]
rationale: "Coverage pass 4 for SNAP, S4-13: hours_worked was read as 0 when not stated by CO-402, CO-407 and CO-415, and with no default by CO-1386, so the two disagreed and the default contradicted the person's own earnings records."
