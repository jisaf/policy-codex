  - {"id": "CO-6604-T2", "title": "Wages of $1,500 and 130 hours stated: 130", "month": "2026-10", "as_of": "2026-10-12", "given": {"earnings": [{"kind": "wages", "amount": 1500}], "hours_worked": 130}, "expect": 130}
  - {"id": "CO-6604-T3", "title": "No earnings (stated empty), hours not stated: 0 hours worked for pay", "month": "2026-10", "as_of": "2026-10-12", "given": {"earnings": []}, "expect": 0}
  - {"id": "CO-6604-T4", "title": "A business with $800 of receipts in the month, hours not stated: cannot determine", "month": "2026-10", "as_of": "2026-10-12", "given": {"earnings": [{"kind": "self_employment_receipts", "amount": 800, "annual_support": false}]}, "expect": "unknown"}
