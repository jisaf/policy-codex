id: CO-1380
name: "SNAP: requires verification of medical expenses"
identifier: snap_requires_verification_of_medical_expenses
kind: derived
type: yes/no
scope: person-month
program: SNAP
meaning: "Whether the person's out-of-pocket medical expenses must be verified for SNAP: before initial certification when an elderly or disabled member claims them for the medical deduction; at recertification only when the total has changed by more than snap_recertification_expense_change_threshold since last verified."
derived: [all, snap_is_household_member, snap_is_elderly_or_disabled, [">", snap_medical_expenses, 0], [any, [not, snap_determination_is_recertification], snap_medical_expenses_source_changed_since_last_certification, [">", ["-", snap_medical_expenses, snap_medical_expenses_at_last_certification], snap_recertification_expense_change_threshold], [">", ["-", snap_medical_expenses_at_last_certification, snap_medical_expenses], snap_recertification_expense_change_threshold], [otherwise, snap_medical_expenses_information_is_outdated, false]]]
sources: [S1618, S803, S818, S833, S1055, S1056]
implemented: engine
tags: [verification, snap, income]
rationale: "No existing item states this verification requirement; the phase-9 chapter needs one requirement item per element so the household's pending count and status can be derived. Same-word audit SW-34: reads snap_medical_expenses (CO-2895), so premiums are counted from their one statement."
tests:
  - {id: CO-1380-T1, month: "2026-10", as_of: "2026-10-01", given: {snap_resides_in_institution_providing_meals: false, snap_is_elderly_or_disabled: true, snap_medical_expenses: 120, snap_determination_is_recertification: false}, expect: true}
  - {id: CO-1380-T2, month: "2026-10", as_of: "2026-10-01", given: {snap_resides_in_institution_providing_meals: false, snap_is_elderly_or_disabled: false, snap_medical_expenses: 120, snap_determination_is_recertification: false}, expect: false}
  - {id: CO-1380-T3, month: "2026-10", as_of: "2026-10-01", given: {snap_resides_in_institution_providing_meals: false, snap_is_elderly_or_disabled: true, snap_medical_expenses: 0, snap_determination_is_recertification: false}, expect: false}
  - {id: CO-1380-T4, month: "2026-10", as_of: "2026-10-01", given: {snap_resides_in_institution_providing_meals: false, snap_is_elderly_or_disabled: true, snap_medical_expenses: 120, snap_determination_is_recertification: true, snap_medical_expenses_at_last_certification: 110, snap_medical_expenses_source_changed_since_last_certification: false}, expect: false}
  - {id: CO-1380-T5, month: "2026-10", as_of: "2026-10-01", given: {snap_resides_in_institution_providing_meals: false, snap_is_elderly_or_disabled: true, snap_medical_expenses: 120, snap_determination_is_recertification: true, snap_medical_expenses_at_last_certification: 60}, expect: true}
  # Phase-10 sweep (OQ-371): 4.502.B.3 - a new provider at recertification is verified whatever the amount; 4.502.B.1 - outdated information is verified again.
  - {id: CO-1380-T6, month: "2026-10", as_of: "2026-10-01", given: {snap_resides_in_institution_providing_meals: false, snap_is_elderly_or_disabled: true, snap_medical_expenses: 120, snap_determination_is_recertification: true, snap_medical_expenses_at_last_certification: 110, snap_medical_expenses_source_changed_since_last_certification: true}, expect: true}
  - {id: CO-1380-T7, month: "2026-10", as_of: "2026-10-01", given: {snap_resides_in_institution_providing_meals: false, snap_is_elderly_or_disabled: true, snap_medical_expenses: 120, snap_determination_is_recertification: true, snap_medical_expenses_at_last_certification: 110, snap_medical_expenses_source_changed_since_last_certification: false, snap_medical_expenses_information_is_outdated: true}, expect: true}
