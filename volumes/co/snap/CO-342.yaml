id: CO-342
name: "SNAP: is categorically eligible"
identifier: snap_is_categorically_eligible
kind: derived
type: yes/no
scope: person
program: SNAP
meaning: This person's SNAP household is categorically eligible - under Basic or Expanded Categorical Eligibility - and so is exempt from the resource test and deemed to have met the gross and net income eligibility standards under 10 CCR 2506-1 4.401,A,2 and 4.408,A.
derived: [in, snap_eligibility_category, [basic_categorical, expanded_categorical]]
sources: [S47, S48, S50, S57]
implemented: engine
tags: [income, resources, state_election]
rationale: 10 CCR 2506-1 4.401,A,2 (S50) and 4.408,A (S57) both key their exemptions off "categorically eligible" as a single yes/no condition, not the three-way category; this item is that boolean, read by snap_meets_resource_limit and snap_meets_gross_income_test instead of each repeating the `in` test against snap_eligibility_category.
tests:
  - {id: CO-342-T1, as_of: "2026-10-01", given: {in_medical_institution: false, receives_ssi: true, receives_tanf_cash: false, receives_general_assistance: false, is_disqualified_for_intentional_program_violation: false, is_disqualified_drug_felony: false}, others: {}, relationships: [], expect: true}
  - {id: CO-342-T2, as_of: "2026-10-01", month: "2026-10", given: {is_enrolled_higher_education_half_time: false, in_medical_institution: false, receives_ssi: false, receives_tanf_cash: false, receives_general_assistance: false, is_disqualified_for_intentional_program_violation: false, is_disqualified_drug_felony: false, citizenship_status: citizen, earned_income: 4000, child_support_paid_legally_obligated: 0, self_employment_net_income: 0, social_security_income: 0, pension_income: 0, unemployment_income: 0, child_support_received: 0, cash_assistance_income: 0, other_unearned_income: 0, is_fleeing_felon_or_probation_violator: false, is_disqualified_for_work_requirement_noncompliance: false}, others: {}, relationships: [], expect: false}
