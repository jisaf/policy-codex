id: CO-4151
name: "SNAP: has substantial lottery or gambling winnings"
identifier: snap_has_substantial_lottery_winnings
kind: derived
type: yes/no
scope: person-month
program: SNAP
meaning: "This person received substantial lottery or gambling winnings in the month: a cash prize won in a single game, before taxes or withholding, the person's own portion of a shared ticket, hand or bet, equal to or greater than the resource limit for households with a member aged sixty or older or with a disability (snap_resource_limit_elderly_disabled), whatever the household's own resource limit (10 CCR 2506-1 4.000.1; 7 CFR 273.11(r)(2)(i))."
precision: "The prize is lottery_gambling_largest_single_game_winnings_received (CO-4150); where it is not stated, the month's winnings (lottery_gambling_winnings_received, CO-1181) are read as one prize, and a month with neither stated has none. The limit is the one in force in the month the winnings are received ($4,750 from October 1, 2026), which 273.11(r)(2)(ii) adjusts with the resource limit (read in the month evaluated, docs/operators.md, Resolution; time audit T-3)."
derived: [">=", [otherwise, lottery_gambling_largest_single_game_winnings_received, [otherwise, lottery_gambling_winnings_received, 0]], snap_resource_limit_elderly_disabled]
sources: [S2950, S2951, S2953]
implemented: engine
tags: [snap, income]
rationale: "Final verification pass 2 N-1: no SNAP item read lottery or gambling winnings, so a household whose member won $4,750 or more stayed eligible, and a categorically eligible household, which has no resource test, never met the disqualification. snap_household_has_substantial_lottery_winnings (CO-4152) applies it to the household; snap_person_unearned_income (CO-331) counts the prize as income (4.403.I)."
tests:
  - {id: CO-4151-T1, title: "A $5,000 scratch-off prize, October 2026", as_of: "2026-10-15", month: "2026-10", given: {lottery_gambling_largest_single_game_winnings_received: 5000}, expect: true}
  - {id: CO-4151-T2, title: "Exactly the limit - substantial (\"equal to or greater\")", as_of: "2026-10-15", month: "2026-10", given: {lottery_gambling_largest_single_game_winnings_received: 4750}, expect: true}
  - {id: CO-4151-T3, title: "Two prizes of $3,000 in the month - neither is substantial", as_of: "2026-10-15", month: "2026-10", given: {lottery_gambling_winnings_received: 6000, lottery_gambling_largest_single_game_winnings_received: 3000}, expect: false}
  - {id: CO-4151-T4, title: "Only the month's total stated: read as one prize", as_of: "2026-10-15", month: "2026-10", given: {lottery_gambling_winnings_received: 8000}, expect: true}
  - {id: CO-4151-T5, title: "Nothing stated - no winnings", as_of: "2026-10-15", month: "2026-10", given: {}, expect: false}
  - {id: CO-4151-T6, title: "FY 2026 limit: $4,600 was substantial against $4,500 in September 2026", as_of: "2026-09-15", month: "2026-09", given: {lottery_gambling_largest_single_game_winnings_received: 4600}, expect: true}
