id: CO-050
name: Is Indian or urban Indian
identifier: snap_is_indian_or_urban_indian
kind: derived
type: yes/no
scope: person
program: SNAP
meaning: "The person is a member of a federally recognized tribe, an Alaska Native, an urban Indian, or a California Indian described in 25 U.S.C. 1679(a), eligible for the ABAWD (able-bodied adult without dependents) exception for Indians, urban Indians and California Indians (7 U.S.C. 2015(o)(3)(F)-(G))."
precision: "The SNAP exemption for Indians (S128) is read as tribal membership, Alaska Native status or urban Indian status; a descendant who is none of these is not exempt, unless a California Indian (final verification F-13: is_california_indian_under_ihcia, CO-3728, read as false when not stated; 2015(o)(3)(G))."
derived: [any, is_member_of_federally_recognized_tribe, is_alaska_native, is_urban_indian_under_ihcia, [otherwise, is_california_indian_under_ihcia, false]]
sources: [S128, S127, S2515]
implemented: engine
tags: [abawd]
rationale: "A fact the case must supply; no existing item in the Colorado volume carries it (the volume began empty in phase 1, and the mwr volume's facts are not shared across volumes). It is reserved for the SNAP income, deduction, work registration and ABAWD rules of later batches, which read it by this identifier. Same-word audit SW-17 and dual-entry audit 3.19: tribal membership, Alaska Native status, descent and urban Indian status were stated by three program-defined facts that could disagree for one person; each program's definition is now derived from the neutral facts CO-2890 to CO-2894."
nearest: [CO-1938, CO-1989]
tests:
  - {id: CO-050-T1, title: "Tribal member", as_of: "2026-11-01", given: {is_member_of_federally_recognized_tribe: true}, expect: true}
  - {id: CO-050-T2, title: "Neither member, Alaska Native nor urban Indian", as_of: "2026-11-01", given: {is_member_of_federally_recognized_tribe: false, is_alaska_native: false, is_urban_indian_under_ihcia: false}, expect: false}
  - {id: CO-050-T3, title: "Final verification F-13: a California Indian descendant who is not an enrolled member", as_of: "2026-11-01", given: {is_member_of_federally_recognized_tribe: false, is_alaska_native: false, is_urban_indian_under_ihcia: false, is_california_indian_under_ihcia: true}, expect: true}
