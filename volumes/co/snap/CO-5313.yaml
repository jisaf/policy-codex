tags: [snap, resources]
open: [OQ-1310]
rationale: "Resource records, step H1 SNAP (docs/reviews/records-holdings-snap-af.md): SNAP reads the person's resources from the holdings records (holdings, CO-5300) through its counting table (snap_holding_treatment_table, CO-5301), never from the scalar resource facts. Finding H0-F3: 273.8(e)(2) and 4.410.D.1 exclude one burial plot per household member, and burial spaces beyond the family's needs (burial_spaces_value_beyond_family_needs, CO-3857) were read by Adult Financial only."
tests:
