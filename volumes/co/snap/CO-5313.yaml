rationale: "Resource records, step H1 SNAP (docs/reviews/records-holdings-snap-af.md): SNAP reads the person's resources from the holdings records (holdings, CO-5300) through its counting table (snap_holding_treatment_table, CO-5301), never from the scalar resource facts. Finding H0-F3: 273.8(e)(2) and 4.410.D.1 exclude one burial plot per household member, and burial spaces beyond the family's needs (burial_spaces_value_beyond_family_needs, CO-3857) were read by Adult Financial only."
tests:
  # Hand-computed from 7 CFR 273.8(e)(2) (S2216), 10 CCR 2506-1 4.410.D.1 (S4690), F.2 (S3119); coverage pass 4 SNAP resources SR-7, SR-11.
  - {"id": "CO-5313-T1", "month": "2027-02", "title": "H0-F3: a $2,000 crypt bought for an unrelated friend, nothing owed: 2,000 > 1,500, not a member's, counted, 2,000", "as_of": "2027-02-10", "given": {"snap_household_members": ["p1"], "holdings": [{"kind": "burial_space", "value": 2000, "amount_owed": 0, "burial_for": "outside_case"}]}, "expect": 2000}
  - {"id": "CO-5313-T2", "month": "2027-02", "title": "SR-11: a plot worth $800: 800 <= 1,500, inaccessible (F.2); what is owed and whom it is for are not read, 0", "as_of": "2027-02-10", "given": {"holdings": [{"kind": "burial_space", "value": 800}]}, "expect": 0}
  - {"id": "CO-5313-T3", "month": "2027-02", "title": "A $2,500 space owing $1,200: 2,500 - 1,200 = 1,300 <= 1,500, inaccessible, 0", "as_of": "2027-02-10", "given": {"holdings": [{"kind": "burial_space", "value": 2500, "amount_owed": 1200}]}, "expect": 0}
  - {"id": "CO-5313-T4", "month": "2027-02", "title": "The person's own $4,000 plot is the one plot of a member excluded; a $3,000 space for a friend counts: 7,000 - 4,000 = 3,000", "as_of": "2027-02-10", "given": {"snap_household_members": ["p1"], "holdings": [{"kind": "burial_space", "value": 4000, "amount_owed": 0, "burial_for": "person_of_case", "for_person": "p1"}, {"kind": "burial_space", "value": 3000, "amount_owed": 0, "burial_for": "outside_case"}]}, "expect": 3000}
  - {"id": "CO-5313-T5", "month": "2027-02", "title": "Decision 4: a $3,000 space that does not say what is owed on it - cannot determine", "as_of": "2027-02-10", "given": {"holdings": [{"kind": "burial_space", "value": 3000, "burial_for": "outside_case"}]}, "expect": "unknown"}
  - {"id": "CO-5313-T6", "month": "2027-02", "title": "SR-7 (PLOT): his own $1,800 plot and a $1,800 plot for his mother, who lives in another state and is not a member: 3,600 - 1,800 = 1,800", "as_of": "2027-02-10", "given": {"snap_household_members": ["p1"], "holdings": [{"kind": "burial_space", "value": 1800, "amount_owed": 0, "for_immediate_family": true, "burial_for": "person_of_case", "for_person": "p1"}, {"kind": "burial_space", "value": 1800, "amount_owed": 0, "for_immediate_family": true, "burial_for": "outside_case"}]}, "expect": 1800}
  - {"id": "CO-5313-T7", "month": "2027-02", "title": "SR-7 (BJ): half of a $2,000 crypt for a friend owned with the spouse (a member): the holding returns 2,000 > 1,500, his half counted, 2,000 x 0.5 = 1,000 (hers on her list: 2,000 for the household, once)", "as_of": "2027-02-10", "given": {"snap_household_members": ["p1", "p2"], "holdings": [{"kind": "burial_space", "value": 2000, "amount_owed": 0, "share": 0.5, "co_owners": "spouse", "holding_id": "crypt", "burial_for": "outside_case"}]}, "others": {"p2": {"holdings": [{"kind": "burial_space", "value": 2000, "amount_owed": 0, "share": 0.5, "co_owners": "spouse", "holding_id": "crypt", "burial_for": "outside_case"}]}}, "expect": 1000}
  - {"id": "CO-5313-T8", "month": "2027-02", "title": "Two plots for the person himself, $1,800 and $2,000: one plot per member, the larger excluded, 3,800 - 2,000 = 1,800", "as_of": "2027-02-10", "given": {"snap_household_members": ["p1"], "holdings": [{"kind": "burial_space", "value": 1800, "amount_owed": 0, "burial_for": "person_of_case", "for_person": "p1"}, {"kind": "burial_space", "value": 2000, "amount_owed": 0, "burial_for": "person_of_case", "for_person": "p1"}]}, "expect": 1800}
