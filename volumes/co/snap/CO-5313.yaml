  - {"id": "CO-5313-T1", "month": "2027-02", "title": "H0-F3: a $2,000 crypt bought for an unrelated friend, nothing owed: 2,000 > 1,500, not a member's, counted, 2,000", "as_of": "2027-02-10", "given": {"snap_household_members": ["p1"], "holdings": [{"kind": "burial_space", "value": 2000, "amount_owed": 0, "burial_for": "outside_case"}]}, "expect": 2000}
  - {"id": "CO-5313-T2", "month": "2027-02", "title": "SR-11: a plot worth $800: 800 <= 1,500, inaccessible (F.2); what is owed and whom it is for are not read, 0", "as_of": "2027-02-10", "given": {"holdings": [{"kind": "burial_space", "value": 800}]}, "expect": 0}
  - {"id": "CO-5313-T3", "month": "2027-02", "title": "A $2,500 space owing $1,200: 2,500 - 1,200 = 1,300 <= 1,500, inaccessible, 0", "as_of": "2027-02-10", "given": {"holdings": [{"kind": "burial_space", "value": 2500, "amount_owed": 1200}]}, "expect": 0}
