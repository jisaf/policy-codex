id: CO-5313
name: "SNAP: countable burial spaces"
identifier: snap_countable_burial_spaces
kind: derived
type: money
scope: person-month
program: SNAP
meaning: "The equity of the person's burial spaces that SNAP counts in the month (7 CFR 273.8(e)(2); 10 CCR 2506-1 4.410.D.1, F.2): the person's burial_space records (row counted_beyond_one_plot_per_member) valued in the month, held on the month's day and reachable, each at its equity times the person's share (all of it where owned with someone outside the case), leaving out a space whose value, or whose equity (value less what is owed on the whole space), is snap_low_return_resource_maximum ($1,500) or less (an inaccessible resource, F.2), less, for each member of the person's SNAP household (snap_household_members), the largest of those that is for that member (burial_for person_of_case, for_person naming the member): one burial plot per household member is excluded."
precision: "Coverage pass 4 for SNAP resources (docs/reviews/coverage4-snap-resources.md). SR-7: (a) the share: a space owned by two members is counted at each owner's share, so the household counts it once (before: at its whole equity on each list, twice); the $1,500 test reads the whole space's value and equity (the household's interest, as for real property, CO-5311). (b) A member's plot: the record names the person a space is for (burial_for, for_person), and the one plot excluded is a household member's, so a plot for a relative who is not a member (a parent in another state) is counted (OQ-1250 resolved by the text: \"one burial plot per household member\", 273.8(e)(2), 4.410.D.1); with two plots for one member the larger is excluded. for_immediate_family, the Adult Financial and SSI test, is not read. SR-11: a space of $1,500 or less is inaccessible without reading what is owed or whom it is for; one above it reads what is owed, then whom it is for. Per month (SR-9): the resources of the month evaluated, valued on its day, the application filing date in the month of application (snap_application_date; 4.408.1, S4823: \"The value of nonexempt household resources at the application filing date\") and the first day of any other month (4.408.B: \"as anticipated to be available in the issuance month\"; the day is OQ-1310's): a record valued in the month (its month, or every month), and a holding disposed of (disposed_date) is held in a month whose day is before the disposal; the refund and credit windows are read against the same day. Before, one figure per case, on the determination date and the determination month's records, in every month, and a holding with any disposed_date in no month. No space above $1,500 held: 0, the household not read."
