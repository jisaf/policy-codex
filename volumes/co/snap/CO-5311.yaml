id: CO-5311
name: "SNAP: countable real property"
identifier: snap_countable_real_property
kind: derived
type: money
scope: person
program: SNAP
meaning: "The person's real property SNAP counts: snap_real_property_not_exempt (CO-5310), or nothing when it is an inaccessible resource because it would have a net return of snap_low_return_resource_maximum ($1,500) or less if sold (10 CCR 2506-1 4.410.F.2, the equity) or no significant return after the estimated costs of selling it (4.410.G: \"a significant return ... is an amount that is estimated to be more than one thousand five hundred dollars ($1,500)\", after the costs of sale)."
precision: "As before step H1 (CO-074), the test is applied to the person's real property not exempt as one resource: a holding owned with someone outside the case is stated as the person's part and the outside owners' part (the translator's two records), so a test record by record would split one property in two (a request to the integration owner: one record with its share). When the equity of all the person's real property records, exempt or not, is $1,500 or less, or the property not exempt is, nothing is counted and nothing else is read (an exemption or a cost of sale only lowers it). Otherwise the estimated costs of sale of each record counted are read (costs_of_sale, required where read: decision 4; before step H1 a cost not stated was read as 0)."
derived: ["case", [["<=", ["sum_receipts", "holdings", ["all", ["all", ["received_in", ["det_month"]], ["unknown", ["receipt", "disposed_date"]]], ["receipt", "accessible"], ["in", ["lookup", "snap_holding_treatment_table", ["receipt", "kind"]], ["counted_less_real_property_exclusions", "counted_with_real_property"]]], ["case", [["all", ["not", ["unknown", ["receipt", "co_owners"]]], ["=", ["receipt", "co_owners"], "outside_case"]], ["-", ["receipt", "value"], ["receipt", "amount_owed"]]], ["else", ["*", ["-", ["receipt", "value"], ["receipt", "amount_owed"]], ["otherwise", ["receipt", "share"], 1]]]]], "snap_low_return_resource_maximum"], 0], [["<=", "snap_real_property_not_exempt", "snap_low_return_resource_maximum"], 0], [["<=", ["-", "snap_real_property_not_exempt", ["sum_receipts", "holdings", ["all", ["all", ["all", ["received_in", ["det_month"]], ["unknown", ["receipt", "disposed_date"]]], ["receipt", "accessible"], ["in", ["lookup", "snap_holding_treatment_table", ["receipt", "kind"]], ["counted_less_real_property_exclusions", "counted_with_real_property"]], ["any", ["=", ["lookup", "snap_holding_treatment_table", ["receipt", "kind"]], "counted_with_real_property"], ["all", ["not", ["receipt", "listed_for_sale"]], ["not", ["receipt", "lot_for_future_home"]], ["not", ["receipt", "income_producing"]], ["not", ["all", ["not", ["unknown", ["receipt", "farm_ended_date"]]], ["<", ["years_between", ["receipt", "farm_ended_date"], ["det_date"]], "snap_former_farm_property_exclusion_years"]]]]]], ["=", ["lookup", "snap_holding_treatment_table", ["receipt", "kind"]], "counted_less_real_property_exclusions"]], ["receipt", "costs_of_sale"]]], "snap_low_return_resource_maximum"], 0], ["else", "snap_real_property_not_exempt"]]
sources: [S3119, S4690]
implemented: engine
tags: [snap, resources]
rationale: "Resource records, step H1 SNAP (docs/reviews/records-holdings-snap-af.md): SNAP reads the person's resources from the holdings records (holdings, CO-5300) through its counting table (snap_holding_treatment_table, CO-5301), never from the scalar resource facts. The low-return test of snap_countable_nonliquid_resources (CO-074), on the records."
tests:
  # Hand-computed from 10 CCR 2506-1 4.410.F.2 and G (S3119): counted only when the return is more than $1,500.
  - {id: CO-5311-T1, title: "CF-7: land with $1,200 of equity is inaccessible: 1,200 <= 1,500 (nothing else read)", as_of: "2027-02-10", given: {holdings: [{kind: real_property, value: 1200, amount_owed: 0}]}, expect: 0}
  - {id: CO-5311-T2, title: "CF-7: $1,800 of equity, $400 of costs of sale: 1,800 - 400 = 1,400 <= 1,500, inaccessible", as_of: "2027-02-10", given: {holdings: [{kind: real_property, value: 1800, amount_owed: 0, listed_for_sale: false, lot_for_future_home: false, income_producing: false, costs_of_sale: 400}]}, expect: 0}
  - {id: CO-5311-T3, title: "$2,000 of equity, $300 of costs: 2,000 - 300 = 1,700 > 1,500, the 2,000 counts", as_of: "2027-02-10", given: {holdings: [{kind: real_property, value: 2000, amount_owed: 0, listed_for_sale: false, lot_for_future_home: false, income_producing: false, costs_of_sale: 300}]}, expect: 2000}
  - {id: CO-5311-T4, title: "Decision 4: $5,000 of land with no estimate of the costs of sale - cannot determine", as_of: "2027-02-10", given: {holdings: [{kind: real_property, value: 5000, amount_owed: 0, listed_for_sale: false, lot_for_future_home: false, income_producing: false}]}, expect: unknown}
  - {id: CO-5311-T5, title: "A $20,000 lot for a home and $1,000 of other land: 1,000 <= 1,500, nothing counted (no costs read)", as_of: "2027-02-10", given: {holdings: [{kind: real_property, value: 20000, amount_owed: 0, listed_for_sale: false, lot_for_future_home: true, income_producing: false}, {kind: real_property, value: 1000, amount_owed: 0, listed_for_sale: false, lot_for_future_home: false, income_producing: false}]}, expect: 0}
