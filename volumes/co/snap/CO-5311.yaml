tags: [snap, resources]
rationale: "Resource records, step H1 SNAP (docs/reviews/records-holdings-snap-af.md): SNAP reads the person's resources from the holdings records (holdings, CO-5300) through its counting table (snap_holding_treatment_table, CO-5301), never from the scalar resource facts. The low-return test of snap_countable_nonliquid_resources (CO-074), on the records."
tests:
  # Hand-computed from 10 CCR 2506-1 4.410.F.2 and G (S3119): counted only when the return is more than $1,500.
  - {id: CO-5311-T1, month: "2027-02", title: "CF-7: land with $1,200 of equity is inaccessible: 1,200 <= 1,500 (nothing else read)", as_of: "2027-02-10", given: {holdings: [{kind: real_property, value: 1200, amount_owed: 0}]}, expect: 0}
  - {id: CO-5311-T2, month: "2027-02", title: "CF-7: $1,800 of equity, $400 of costs of sale: 1,800 - 400 = 1,400 <= 1,500, inaccessible", as_of: "2027-02-10", given: {holdings: [{kind: real_property, value: 1800, amount_owed: 0, listed_for_sale: false, lot_for_future_home: false, income_producing: false, costs_of_sale: 400}]}, expect: 0}
  - {id: CO-5311-T3, month: "2027-02", title: "$2,000 of equity, $300 of costs: 2,000 - 300 = 1,700 > 1,500, the 2,000 counts", as_of: "2027-02-10", given: {holdings: [{kind: real_property, value: 2000, amount_owed: 0, listed_for_sale: false, lot_for_future_home: false, income_producing: false, costs_of_sale: 300}]}, expect: 2000}
  - {id: CO-5311-T4, month: "2027-02", title: "Decision 4: $5,000 of land with no estimate of the costs of sale - cannot determine", as_of: "2027-02-10", given: {holdings: [{kind: real_property, value: 5000, amount_owed: 0, listed_for_sale: false, lot_for_future_home: false, income_producing: false}]}, expect: unknown}
  - {id: CO-5311-T5, month: "2027-02", title: "A $20,000 lot for a home and $1,000 of other land: 1,000 <= 1,500, nothing counted (no costs read)", as_of: "2027-02-10", given: {holdings: [{kind: real_property, value: 20000, amount_owed: 0, listed_for_sale: false, lot_for_future_home: true, income_producing: false}, {kind: real_property, value: 1000, amount_owed: 0, listed_for_sale: false, lot_for_future_home: false, income_producing: false}]}, expect: 0}
  # Coverage pass 4 SNAP resources: hand-computed from 10 CCR 2506-1 4.410.F.2, G (S3119), 7 CFR 273.8(e)(18) (S4826), 4.409.C (S2968). Each holding is tested
  # at the household's interest, the whole holding (a member co-owner's part is the household's; a separate household's is counted in entirety, 4.409.C).
  - {"id": "CO-5311-T6", "month": "2027-02", "title": "SR-6 (LOTS): two lots worth $1,000 each (costs of sale $100 each): each returns 1,000 <= 1,500, inaccessible: 0", "as_of": "2027-02-10", "given": {"holdings": [{"kind": "real_property", "value": 1000, "amount_owed": 0, "listed_for_sale": false, "lot_for_future_home": false, "income_producing": false, "costs_of_sale": 100}, {"kind": "real_property", "value": 1000, "amount_owed": 0, "listed_for_sale": false, "lot_for_future_home": false, "income_producing": false, "costs_of_sale": 100}]}, "expect": 0}
  - {"id": "CO-5311-T7", "month": "2027-02", "title": "SR-6 (LJ): half of a $2,400 lot owned with the spouse, both members, costs of sale $100: the household's interest returns 2,400 - 100 = 2,300 > 1,500, his half counted, 2,400 x 0.5 = 1,200", "as_of": "2027-02-10", "given": {"snap_household_members": ["p1", "p2"], "holdings": [{"kind": "real_property", "value": 2400, "amount_owed": 0, "listed_for_sale": false, "lot_for_future_home": false, "income_producing": false, "share": 0.5, "co_owners": "spouse", "holding_id": "lot", "costs_of_sale": 100}]}, "others": {"p2": {"holdings": [{"kind": "real_property", "value": 2400, "amount_owed": 0, "listed_for_sale": false, "lot_for_future_home": false, "income_producing": false, "share": 0.5, "co_owners": "spouse", "holding_id": "lot", "costs_of_sale": 100}]}}, "relationships": [["spouse", "p1", "p2"]], "expect": 1200}
  - {"id": "CO-5311-T8", "month": "2027-02", "title": "SR-8: the same lot with the spouse in a nursing facility, outside his SNAP household: the whole, 1,200 + 1,200 = 2,400", "as_of": "2027-02-10", "given": {"snap_household_members": ["p1"], "holdings": [{"kind": "real_property", "value": 2400, "amount_owed": 0, "listed_for_sale": false, "lot_for_future_home": false, "income_producing": false, "share": 0.5, "co_owners": "spouse", "holding_id": "lot", "costs_of_sale": 100}]}, "others": {"p2": {"holdings": [{"kind": "real_property", "value": 2400, "amount_owed": 0, "listed_for_sale": false, "lot_for_future_home": false, "income_producing": false, "share": 0.5, "co_owners": "spouse", "holding_id": "lot", "costs_of_sale": 100}]}}, "relationships": [["spouse", "p1", "p2"]], "expect": 2400}
  - {"id": "CO-5311-T9", "month": "2027-02", "title": "OQ-1202 resolved: a $1,200 promissory note that is a negotiable instrument: G does not apply to negotiable financial instruments, counted, 1,200", "as_of": "2027-02-10", "given": {"holdings": [{"kind": "loan_receivable", "value": 1200, "amount_owed": 0, "negotiable_instrument": true}]}, "expect": 1200}
  - {"id": "CO-5311-T10", "month": "2027-02", "title": "OQ-1202: the same note, not negotiable: 1,200 <= 1,500, inaccessible (F.2), 0", "as_of": "2027-02-10", "given": {"holdings": [{"kind": "loan_receivable", "value": 1200, "amount_owed": 0, "negotiable_instrument": false}]}, "expect": 0}
  - {"id": "CO-5311-T11", "month": "2027-02", "title": "SR-4 (HOME2): a former home with $40,000 of equity and $3,000 of costs of sale: 37,000 > 1,500, 40,000", "as_of": "2027-02-10", "given": {"holdings": [{"kind": "home", "value": 60000, "amount_owed": 20000, "lives_in": false, "temporary_absence": "not_returning", "listed_for_sale": false, "lot_for_future_home": false, "income_producing": false, "costs_of_sale": 3000}]}, "expect": 40000}
