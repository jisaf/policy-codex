id: CO-338
name: "SNAP: meets Basic Categorical Eligibility"
identifier: snap_meets_bce_eligibility
kind: derived
type: yes/no
scope: person-month
program: SNAP
meaning: "This person's SNAP household qualifies for Basic Categorical Eligibility because it has at least one member, every member receives, or is authorized to receive, one of the qualifying cash-benefit programs or at least one member receives services from the Family Preservation Program (10 CCR 2506-1 4.206.C.1.a.1-2), and no member is disqualified for an IPV or a SNAP-related drug felony."
precision: "Requires at least one household member (count of snap_household_members) (10 CCR 2506-1 4.206,C,1,a presupposes a household of 'members'); otherwise the 'every member' test over an empty group is vacuously true and a person with no SNAP unit (e.g. an institution resident) would be reported categorically eligible (C-1). Final verification F-4: the second kind of BCE household of 4.206.C.1.a.2 (S47), one member receiving Family Preservation services (receives_family_preservation_services, CO-3716, read as false when not stated). Final verification pass 2 P2-3: the Family Preservation member is sought among the members other than an ineligible student (snap_household_members_other_than_ineligible_students, CO-3714), as the \"all members\" test is (CO-336): 4.411.2.C treats an ineligible student as a non-household member, who cannot confer the household's category. Coverage pass 4 for SNAP S4-11 (OQ-1263 resolved): per month, since prospective budgeting reads \"anticipated income and circumstances during the issuance month\" (10 CCR 2506-1 4.402.1.A, S4734): the household (CO-305, CO-3714) is the month's. Before, the item was per person and read on the determination date in every month."
derived: [all, [">=", [count, snap_household_members], 1], [any, snap_household_all_members_receive_categorical_assistance, [exists, snap_household_members_other_than_ineligible_students, [otherwise, [of, [P], receives_family_preservation_services], false]]], [not, snap_household_has_bce_ece_disqualifying_member]]
sources: [S47]
nearest: [CO-339]
rationale: "10 CCR 2506-1 4.206,C,1 (S47) states BCE as this two-part test (every member's assistance receipt, and no IPV/drug-felony exclusion); combines snap_household_all_members_receive_categorical_assistance and snap_household_has_bce_ece_disqualifying_member the way snap_meets_ece_eligibility (CO-340, similar shape, different income-based first condition) combines its own two prongs; both are needed because BCE and ECE are legally distinct categories of eligibility with different tests, per 4.206,A. Fix-round (C-1): added the count(snap_household_members) >= 1 guard so an empty unit is never categorically eligible."
implemented: engine
tags: [income, state_election]
