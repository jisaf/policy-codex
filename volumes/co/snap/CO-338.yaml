id: CO-338
name: "SNAP: meets Basic Categorical Eligibility"
identifier: snap_meets_bce_eligibility
kind: derived
type: yes/no
scope: person
program: SNAP
meaning: This person's SNAP household qualifies for Basic Categorical Eligibility because every member receives, or is authorized to receive, one of the qualifying cash-benefit programs and no member is disqualified for an IPV or a SNAP-related drug felony.
derived: [all, snap_household_all_members_receive_categorical_assistance, [not, snap_household_has_bce_ece_disqualifying_member]]
sources: [S47]
nearest: [CO-339]
rationale: 10 CCR 2506-1 4.206,C,1 (S47) states BCE as this two-part test (every member's assistance receipt, and no IPV/drug-felony exclusion); combines snap_household_all_members_receive_categorical_assistance and snap_household_has_bce_ece_disqualifying_member the way snap_meets_ece_eligibility (CO-340, similar shape, different income-based first condition) combines its own two prongs; both are needed because BCE and ECE are legally distinct categories of eligibility with different tests, per 4.206,A.
implemented: engine
tags: [income, state_election]
tests:
  - {id: CO-338-T1, as_of: "2026-10-01", given: {in_medical_institution: false, receives_ssi: true, receives_tanf_cash: false, receives_general_assistance: false, is_disqualified_for_intentional_program_violation: false, is_disqualified_drug_felony: false}, others: {}, relationships: [], expect: true}
  - {id: CO-338-T2, as_of: "2026-10-01", given: {in_medical_institution: false, receives_ssi: true, receives_tanf_cash: false, receives_general_assistance: false, is_disqualified_for_intentional_program_violation: true, is_disqualified_drug_felony: false}, others: {}, relationships: [], expect: false}
