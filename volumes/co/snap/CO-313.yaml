id: CO-313
name: "SNAP: number of eligible household members"
identifier: snap_eligible_household_size
kind: derived
type: whole number
scope: person
program: SNAP
meaning: The count of this person's SNAP household members who are eligible to participate, used to look up the maximum allotment, income limits, and deductions for the unit.
derived: [count, snap_eligible_household_members]
sources: [S19]
implemented: engine
tags: [household]
rationale: "The income-limit, allotment, and deduction tables in later batches are keyed by household size, which must be the count of eligible members (not every purchase-and-prepare member, since an ineligible non-citizen or disqualified member is not counted for benefit-level purposes under 7 CFR 273.11(c)); no existing item states this count. Vocabulary fix round (docs/reviews/vocabulary-reuse.md, C-3): renamed from snap_household_size; the name hid the unit or the counted group."
tests:
  - {id: CO-313-T1, as_of: "2026-10-01", given: {state_of_residence: CO, date_of_birth: "1985-01-22", snap_resides_in_institution_providing_meals: false, immigration_status: undocumented, is_fleeing_felon: false, is_probation_or_parole_violator: false, snap_is_serving_ipv_disqualification: false, is_disqualified_for_work_requirement_noncompliance: false, snap_is_disqualified_drug_felony: false, snap_has_drug_felony_involving_snap_benefits: false}, others: {p2: {state_of_residence: CO, date_of_birth: "2009-04-08", snap_resides_in_institution_providing_meals: false, immigration_status: us_citizen, is_fleeing_felon: false, is_probation_or_parole_violator: false, snap_is_serving_ipv_disqualification: false, is_disqualified_for_work_requirement_noncompliance: false, snap_is_disqualified_drug_felony: false, snap_has_drug_felony_involving_snap_benefits: false}}, relationships: [[parent, p1, p2]], expect: 1}
  - {id: CO-313-T2, as_of: "2026-10-01", given: {snap_is_ineligible_abawd: false, state_of_residence: CO, is_enrolled_higher_education_half_time: false, date_of_birth: "1985-01-22", snap_resides_in_institution_providing_meals: false, immigration_status: us_citizen, is_fleeing_felon: false, is_probation_or_parole_violator: false, snap_is_serving_ipv_disqualification: false, is_disqualified_for_work_requirement_noncompliance: false, snap_is_disqualified_drug_felony: false, snap_has_drug_felony_involving_snap_benefits: false}, others: {p2: {snap_is_ineligible_abawd: false, state_of_residence: CO, is_enrolled_higher_education_half_time: false, date_of_birth: "2009-04-08", snap_resides_in_institution_providing_meals: false, immigration_status: us_citizen, is_fleeing_felon: false, is_probation_or_parole_violator: false, snap_is_serving_ipv_disqualification: false, is_disqualified_for_work_requirement_noncompliance: false, snap_is_disqualified_drug_felony: false, snap_has_drug_felony_involving_snap_benefits: false}}, relationships: [[parent, p1, p2]], expect: 2}
