id: CO-313
name: "SNAP: number of eligible household members"
identifier: snap_eligible_household_size
kind: derived
type: whole number
scope: person-month
program: SNAP
meaning: The count of this person's SNAP household members who are eligible to participate, used to look up the maximum allotment, income limits, and deductions for the unit.
precision: "Coverage pass 4 for SNAP S4-11 (OQ-1263 resolved): per month, since prospective budgeting reads \"anticipated income and circumstances during the issuance month\" (10 CCR 2506-1 4.402.1.A, S4734): the eligible members (CO-312) are the month's. Before, the item was per person and read on the determination date in every month."
derived: [count, snap_eligible_household_members]
sources: [S19]
implemented: engine
tags: [household]
rationale: "The income-limit, allotment, and deduction tables in later batches are keyed by household size, which must be the count of eligible members (not every purchase-and-prepare member, since an ineligible non-citizen or disqualified member is not counted for benefit-level purposes under 7 CFR 273.11(c)); no existing item states this count. Vocabulary fix round (docs/reviews/vocabulary-reuse.md, C-3): renamed from snap_household_size; the name hid the unit or the counted group."
