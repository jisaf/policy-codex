id: CO-4158
name: "SNAP: transfer of resources disqualification months"
identifier: snap_resource_transfer_disqualification_months
kind: derived
type: whole number
scope: person
program: SNAP
meaning: "The length, in months, of this person's SNAP household's disqualification for knowingly transferring resources to qualify (10 CCR 2506-1 4.408.2.B-C): read from snap_resource_transfer_disqualification_months_table by the amount by which the value of the members' disqualifying transfers, added to the household's other countable resources, exceeds the household's resource limit; 0 when no member made a disqualifying transfer or the total does not exceed the limit (4.408.2.A.1)."
precision: "The transferred value is each member's resource_transfer_uncompensated_value (CO-3835) where snap_resource_transfer_is_disqualifying (CO-4159), over the members whose resources count to the household, ineligible non-citizens and disqualified members included (snap_household_members_other_than_ineligible_students, CO-3714). The other countable resources are snap_household_countable_resources (CO-343) on the determination date, and the limit is the one snap_meets_resource_limit (CO-344) applies: snap_resource_limit_elderly_disabled for a household with an elderly or disabled member, otherwise snap_resource_limit. Only a member's finding is read, so a household without one is 0 with nothing else read."
derived: [case, [[not, [exists, snap_household_members_other_than_ineligible_students, [of, [P], snap_resource_transfer_is_disqualifying]]], 0], [[<=, ["-", ["+", [sum, snap_household_members_other_than_ineligible_students, [case, [[of, [P], snap_resource_transfer_is_disqualifying], [of, [P], resource_transfer_uncompensated_value]], [else, 0]]], snap_household_countable_resources], [case, [snap_household_has_elderly_or_disabled_member, snap_resource_limit_elderly_disabled], [else, snap_resource_limit]]], 0], 0], [else, [band, snap_resource_transfer_disqualification_months_table, ["-", ["+", [sum, snap_household_members_other_than_ineligible_students, [case, [[of, [P], snap_resource_transfer_is_disqualifying], [of, [P], resource_transfer_uncompensated_value]], [else, 0]]], snap_household_countable_resources], [case, [snap_household_has_elderly_or_disabled_member, snap_resource_limit_elderly_disabled], [else, snap_resource_limit]]]]]]
sources: [S2961, S2962]
implemented: engine
tags: [snap, resources]
rationale: "Final verification pass 2 N-4: the length of the 4.408.2 disqualification had no item; snap_is_disqualified_for_resource_transfer (CO-4160) reads it."
tests:
  - {id: CO-4158-T1, title: "Gave away $4,000; $1,200 left; limit $3,000: $2,200 over - 6 months", as_of: "2026-10-12", given: {snap_household_members_other_than_ineligible_students: [p1], snap_resource_transfer_is_disqualifying: true, resource_transfer_uncompensated_value: 4000, snap_household_countable_resources: 1200, snap_household_has_elderly_or_disabled_member: false}, expect: 6}
  - {id: CO-4158-T2, title: "4.408.2.A.1: gave away $1,000 with $1,200 left - under the $3,000 limit, no disqualification", as_of: "2026-10-12", given: {snap_household_members_other_than_ineligible_students: [p1], snap_resource_transfer_is_disqualifying: true, resource_transfer_uncompensated_value: 1000, snap_household_countable_resources: 1200, snap_household_has_elderly_or_disabled_member: false}, expect: 0}
  - {id: CO-4158-T3, title: "$249 over - 1 month", as_of: "2026-10-12", given: {snap_household_members_other_than_ineligible_students: [p1], snap_resource_transfer_is_disqualifying: true, resource_transfer_uncompensated_value: 3249, snap_household_countable_resources: 0, snap_household_has_elderly_or_disabled_member: false}, expect: 1}
  - {id: CO-4158-T4, title: "$9,000 over - 12 months", as_of: "2026-10-12", given: {snap_household_members_other_than_ineligible_students: [p1], snap_resource_transfer_is_disqualifying: true, resource_transfer_uncompensated_value: 12000, snap_household_countable_resources: 0, snap_household_has_elderly_or_disabled_member: false}, expect: 12}
  - {id: CO-4158-T5, title: "Elderly member: limit $4,750; $5,000 transferred, nothing else - $250 over, 3 months", as_of: "2026-10-12", given: {snap_household_members_other_than_ineligible_students: [p1], snap_resource_transfer_is_disqualifying: true, resource_transfer_uncompensated_value: 5000, snap_household_countable_resources: 0, snap_household_has_elderly_or_disabled_member: true}, expect: 3}
  - {id: CO-4158-T6, title: "No disqualifying transfer", as_of: "2026-10-12", given: {snap_household_members_other_than_ineligible_students: [p1], snap_resource_transfer_is_disqualifying: false}, expect: 0}
