id: CO-4158
name: "SNAP: transfer of resources disqualification months"
identifier: snap_resource_transfer_disqualification_months
kind: derived
type: whole number
scope: person-month
program: SNAP
meaning: "The length, in months, of this person's SNAP household's disqualification for knowingly transferring resources to qualify (10 CCR 2506-1 4.408.2.B-C): read from snap_resource_transfer_disqualification_months_table by the amount by which the value of the members' disqualifying transfers, added to the household's other countable resources, exceeds the household's resource limit; 0 when no member made a disqualifying transfer or the total does not exceed the limit (4.408.2.A.1)."
precision: "Resource records, step H1 SNAP (docs/reviews/records-holdings-snap-af.md): the transferred value is, for each member for whom snap_resource_transfer_is_disqualifying (CO-4159), the value of the member's disqualifying transfers (snap_disqualifying_transfer_value, CO-5314): each transfer within the three months before the date of application or after it through the determination month, not returned in whole, at its uncompensated value, read from the member's holdings records in place of the month-scoped transfer facts. The members are those whose resources count to the household, ineligible non-citizens and disqualified members included (snap_household_members_other_than_ineligible_students, CO-3714). The other countable resources are snap_household_countable_resources (CO-343) on the determination date, and the limit is the one snap_meets_resource_limit (CO-344) applies: snap_resource_limit_elderly_disabled for a household with an elderly or disabled member, otherwise snap_resource_limit. Only a member's finding is read, so a household without one is 0 with nothing else read. Coverage pass 4 for SNAP S4-11 (OQ-1263 resolved): per month, since prospective budgeting reads \"anticipated income and circumstances during the issuance month\" (10 CCR 2506-1 4.402.1.A, S4734): the household, its countable resources and its elderly or disabled member (CO-6603) are those of the month evaluated, so the length is figured on the household of each month; before, on the determination date's household in every month."
derived: ["case", [["not", ["exists", "snap_household_members_other_than_ineligible_students", ["of", ["P"], "snap_resource_transfer_is_disqualifying"]]], 0], [["<=", ["-", ["+", ["sum", "snap_household_members_other_than_ineligible_students", ["case", [["of", ["P"], "snap_resource_transfer_is_disqualifying"], ["of", ["P"], "snap_disqualifying_transfer_value"]], ["else", 0]]], "snap_household_countable_resources"], ["case", ["snap_household_has_elderly_or_disabled_member_in_month", "snap_resource_limit_elderly_disabled"], ["else", "snap_resource_limit"]]], 0], 0], ["else", ["band", "snap_resource_transfer_disqualification_months_table", ["-", ["+", ["sum", "snap_household_members_other_than_ineligible_students", ["case", [["of", ["P"], "snap_resource_transfer_is_disqualifying"], ["of", ["P"], "snap_disqualifying_transfer_value"]], ["else", 0]]], "snap_household_countable_resources"], ["case", ["snap_household_has_elderly_or_disabled_member_in_month", "snap_resource_limit_elderly_disabled"], ["else", "snap_resource_limit"]]]]]]
sources: [S2961, S2962, S4734]
implemented: engine
tags: [snap, resources]
rationale: "Final verification pass 2 N-4: the length of the 4.408.2 disqualification had no item; snap_is_disqualified_for_resource_transfer (CO-4160) reads it. Merge of the cash and SNAP fix tracks: resource_transfer_uncompensated_value became month-scoped (final cash review 2, N-5) after this item was written against one total value per person; it now adds the months' values within 4.408.2's window."
tests:
