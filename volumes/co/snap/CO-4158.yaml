id: CO-4158
name: "SNAP: transfer of resources disqualification months"
identifier: snap_resource_transfer_disqualification_months
kind: derived
type: whole number
scope: person
program: SNAP
meaning: "The length, in months, of this person's SNAP household's disqualification for knowingly transferring resources to qualify (10 CCR 2506-1 4.408.2.B-C): read from snap_resource_transfer_disqualification_months_table by the amount by which the value of the members' disqualifying transfers, added to the household's other countable resources, exceeds the household's resource limit; 0 when no member made a disqualifying transfer or the total does not exceed the limit (4.408.2.A.1)."
precision: "The transferred value is, for each member for whom snap_resource_transfer_is_disqualifying (CO-4159), the sum of the member's resource_transfer_uncompensated_value (CO-3835) over the months that item reads - the month in which 4.408.2's three months before the date of application begin through the determination month - for each month whose transfer falls within the three months or after them (a transfer in their first month on or after their first day, by resource_transfer_date, CO-3834) and whose resource has not been returned in whole (resource_transfer_returned_date, CO-4009); a transfer in an earlier month is not added. The members are those whose resources count to the household whose resources count to the household, ineligible non-citizens and disqualified members included (snap_household_members_other_than_ineligible_students, CO-3714). The other countable resources are snap_household_countable_resources (CO-343) on the determination date, and the limit is the one snap_meets_resource_limit (CO-344) applies: snap_resource_limit_elderly_disabled for a household with an elderly or disabled member, otherwise snap_resource_limit. Only a member's finding is read, so a household without one is 0 with nothing else read."
derived: [case, [[not, [exists, snap_household_members_other_than_ineligible_students, [of, [P], snap_resource_transfer_is_disqualifying]]], 0], [[<=, ["-", ["+", [sum, snap_household_members_other_than_ineligible_students, [case, [[of, [P], snap_resource_transfer_is_disqualifying], [sum_months, [months_from_to, [month_of, [days_after, [days_between, [first_day, [month_of, snap_application_date]], snap_application_date], [first_day, [months_before, 3, [month_of, snap_application_date]]]]], [det_month]], [case, [[all, [">", [otherwise, [at, [of, [P], resource_transfer_uncompensated_value], [that_month]], 0], 0], [unknown, [at, [of, [P], resource_transfer_returned_date], [that_month]]], [any, [">", [that_month], [month_of, [days_after, [days_between, [first_day, [month_of, snap_application_date]], snap_application_date], [first_day, [months_before, 3, [month_of, snap_application_date]]]]]], [">=", [at, [of, [P], resource_transfer_date], [that_month]], [days_after, [days_between, [first_day, [month_of, snap_application_date]], snap_application_date], [first_day, [months_before, 3, [month_of, snap_application_date]]]]]]], [at, [of, [P], resource_transfer_uncompensated_value], [that_month]]], [else, 0]]]], [else, 0]]], snap_household_countable_resources], [case, [snap_household_has_elderly_or_disabled_member, snap_resource_limit_elderly_disabled], [else, snap_resource_limit]]], 0], 0], [else, [band, snap_resource_transfer_disqualification_months_table, ["-", ["+", [sum, snap_household_members_other_than_ineligible_students, [case, [[of, [P], snap_resource_transfer_is_disqualifying], [sum_months, [months_from_to, [month_of, [days_after, [days_between, [first_day, [month_of, snap_application_date]], snap_application_date], [first_day, [months_before, 3, [month_of, snap_application_date]]]]], [det_month]], [case, [[all, [">", [otherwise, [at, [of, [P], resource_transfer_uncompensated_value], [that_month]], 0], 0], [unknown, [at, [of, [P], resource_transfer_returned_date], [that_month]]], [any, [">", [that_month], [month_of, [days_after, [days_between, [first_day, [month_of, snap_application_date]], snap_application_date], [first_day, [months_before, 3, [month_of, snap_application_date]]]]]], [">=", [at, [of, [P], resource_transfer_date], [that_month]], [days_after, [days_between, [first_day, [month_of, snap_application_date]], snap_application_date], [first_day, [months_before, 3, [month_of, snap_application_date]]]]]]], [at, [of, [P], resource_transfer_uncompensated_value], [that_month]]], [else, 0]]]], [else, 0]]], snap_household_countable_resources], [case, [snap_household_has_elderly_or_disabled_member, snap_resource_limit_elderly_disabled], [else, snap_resource_limit]]]]]]
sources: [S2961, S2962]
implemented: engine
tags: [snap, resources]
rationale: "Final verification pass 2 N-4: the length of the 4.408.2 disqualification had no item; snap_is_disqualified_for_resource_transfer (CO-4160) reads it. Merge of the cash and SNAP fix tracks: resource_transfer_uncompensated_value became month-scoped (final cash review 2, N-5) after this item was written against one total value per person; it now adds the months' values within 4.408.2's window."
tests:
