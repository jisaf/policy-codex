id: CO-308
name: "SNAP: is an eligible non-citizen"
identifier: snap_is_eligible_non_citizen
kind: derived
type: yes/no
scope: person
program: SNAP
meaning: The person is a non-citizen who may participate in SNAP because they hold one of the categories 7 U.S.C. 2015(f), as amended by Pub. L. 119-21 sec. 10108, names as eligible (lawful permanent resident, Cuban/Haitian entrant, or Compact of Free Association migrant) and, for a lawful permanent resident, has cleared the five-year bar of 8 U.S.C. 1613 or one of its exceptions.
assumption: "The amended statute (S8, S9) controls over 10 CCR 2506-1 4.305 and 7 CFR 273.4, which still list refugees, asylees, and parolees; those categories are therefore not eligible under this draft. Cuban/Haitian entrants and Compact of Free Association migrants are eligible without a waiting period: the five-year limitation of 8 U.S.C. 1613(a) does not apply to a Cuban and Haitian entrant (1613(b)(1)(D)) or to a citizen of a freely associated state (1613(b)(3)) (S1150). The category list applies from the determination date; the date from which FNS applies sec. 10108 to current participants is OQ-1."
statute_override: "Federal law overrides 10 CCR 2506-1 4.305: since Pub. L. 119-21 sec. 10108 took effect on enactment (July 4, 2025), only citizens and nationals, lawful permanent residents, Cuban and Haitian entrants and Compact of Free Association residents can be eligible non-citizens, so refugees and asylees that 4.305 still lists are ineligible and COFA residents that 4.305 lists as ineligible are eligible; no CDHS implementing communication was available to this volume (OQ-533)."
derived: [any, [in, immigration_status, [cuban_haitian_entrant, compact_of_free_association_migrant]], [all, ["=", immigration_status, lawful_permanent_resident], snap_meets_immigrant_additional_condition]]
sources: [S8, S9, S21, S22, S1150, S751]
effective: {from: "2025-07-04", to: present}
open: [OQ-1, OQ-533]
implemented: engine
tags: [immigration, legal]
rationale: "No existing item in this volume states which non-citizen categories can participate in SNAP; this is that fact, kept separate from snap_meets_citizenship_requirement (which also covers citizens and nationals) so the non-citizen-specific eligibility question can be read, cited, and tested on its own.  OQ-44 fix (product-owner decision of 2026-11-21; docs/reviews/audit-dual-entry.md 3.1; same-word audit SW-18): reads the one immigration_status fact (CO-002), which replaced citizenship_status, lawful_presence_status (CO-084), federal_five_year_bar_exempt_category (CO-1724) and ma_five_year_bar_exempt_category (CO-1170). The SNAP list of 7 U.S.C. 2015(f) as amended (S8) names only lawful permanent residents, Cuban and Haitian entrants and COFA migrants; every other option of immigration_status, the qualified ones included, fails it."
tests:
  - {id: CO-308-T1, as_of: "2026-10-01", given: {immigration_status: lawful_permanent_resident, date_of_birth: "1945-07-30", has_military_connection: false, qualified_status_date: "1998-05-14", qualifying_quarters: 40}, expect: true}
  - {id: CO-308-T2, as_of: "2026-10-01", given: {immigration_status: undocumented}, expect: false}
  - {id: CO-308-T3, as_of: "2026-10-01", given: {immigration_status: cuban_haitian_entrant}, expect: true}
  - {id: CO-308-T4, as_of: "2026-10-01", given: {immigration_status: refugee}, expect: false}
  - {id: CO-308-T5, as_of: "2026-10-01", title: "Parolee for a year: a qualified alien, but not in 2015(f) as amended", given: {immigration_status: parolee_one_year_or_more}, expect: false}
  - {id: CO-308-T6, title: "Final verification F-3: an LPR who was admitted as a refugee in 2023, adjusted in 2024, no quarters - eligible (8 U.S.C. 1612(a)(2)(A); 7 CFR 273.4(a)(6)(iv))", as_of: "2026-10-01", given: {immigration_status: lawful_permanent_resident, date_of_birth: "1985-01-22", has_military_connection: false, qualified_status_date: "2023-05-01", qualifying_quarters: 0, snap_is_disabled_member: false, status_before_lpr_adjustment: refugee}, expect: true}
  - {id: CO-308-T7, title: "Final verification F-3: an LPR admitted directly in 2024 with no exception - not yet eligible", as_of: "2026-10-01", given: {immigration_status: lawful_permanent_resident, date_of_birth: "1985-01-22", has_military_connection: false, qualified_status_date: "2024-05-01", qualifying_quarters: 0, snap_is_disabled_member: false, status_before_lpr_adjustment: none}, relationships: [], expect: false}
