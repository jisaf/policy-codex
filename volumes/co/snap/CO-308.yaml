id: CO-308
name: "SNAP: is an eligible non-citizen"
identifier: snap_is_eligible_non_citizen
kind: derived
type: yes/no
scope: person
program: SNAP
meaning: The person is a non-citizen who may participate in SNAP because they hold one of the categories 7 U.S.C. 2015(f), as amended by Pub. L. 119-21 sec. 10108, names as eligible (lawful permanent resident, Cuban/Haitian entrant, or Compact of Free Association migrant) and, for a lawful permanent resident, has cleared the five-year bar of 8 U.S.C. 1613 or one of its exceptions.
assumption: The amended statute (S8, S9) controls over 10 CCR 2506-1 4.305 and 7 CFR 273.4, which still list refugees, asylees, and parolees; those categories are therefore not eligible under this draft (OQ-1). Cuban/Haitian entrants and Compact of Free Association migrants are modeled as eligible without a waiting period, because the amended 2015(f) lists them and the five-year bar of 8 U.S.C. 1613 applies to qualified aliens (Cuban/Haitian entrants are qualified aliens under 8 U.S.C. 1641(b)(7), which is not in this volume; OQ-1 records the point).
derived: [any, [in, citizenship_status, [cuban_haitian_entrant, compact_of_free_association_migrant]], [all, [=, citizenship_status, lawful_permanent_resident], snap_meets_immigrant_additional_condition]]
sources: [S8, S9, S21, S22]
open: [OQ-1]
implemented: engine
tags: [immigration, legal]
rationale: No existing item in this volume states which non-citizen categories can participate in SNAP; this is that fact, kept separate from snap_meets_citizenship_requirement (which also covers citizens and nationals) so the non-citizen-specific eligibility question can be read, cited, and tested on its own.
tests:
  - {id: CO-308-T1, as_of: "2026-10-01", given: {citizenship_status: lawful_permanent_resident, date_of_birth: "1945-07-30", is_veteran_or_active_duty: false, qualified_status_date: "1998-05-14", qualifying_quarters: 40}, expect: true}
  - {id: CO-308-T2, as_of: "2026-10-01", given: {citizenship_status: undocumented}, expect: false}
  - {id: CO-308-T3, as_of: "2026-10-01", given: {citizenship_status: cuban_haitian_entrant}, expect: true}
  - {id: CO-308-T4, as_of: "2026-10-01", given: {citizenship_status: refugee}, expect: false}
