id: CO-5315
name: "SNAP: value of the person's disqualifying transfers before the application"
identifier: snap_disqualifying_transfer_value_before_application
kind: derived
type: money
scope: person
program: SNAP
meaning: "The part of snap_disqualifying_transfer_value (CO-5314) transferred before the household's date of application (snap_application_date): the transfers 4.408.2.B disqualifies from the month of application, rather than from the month the notice of adverse action takes effect."
precision: "The three months run back from the date of application to the same day of the month three calendar months earlier, that day included (a day the earlier month lacks runs into the next month: applied May 31, 2026, from March 3), as before step H1 (CO-4159). A transfer after the date of application, through the determination month, is read as made after the household was determined eligible; one in a later month is not read. The county's finding (snap_transfer_to_qualify) not stated is read as no: 4.408.2.B applies \"In the event the local office establishes that an applicant household knowingly transferred resources for the purpose of qualifying\", so a transfer not established to be one does not disqualify (the rule's own reading, design decision D3; the person fact it replaces, CO-4155, was read the same way; a request to the integration owner to declare the default on the field). A transfer whose resource has been returned in whole (returned_date) is not read: the resource is again among the household's. A transferred holding whose row SNAP excludes outright (excluded, excluded_household_goods) is not read: 4.408.2.A.1 (S2961) leaves eligibility unaffected by \"resources consisting of excluded person property such as furniture\". The uncompensated value is the holding's value less what was owed on it, times the person's share, less what the person received for it (compensation_received), never below zero; 4.408.2.A.2 leaves a sale at or near fair market value unaffected, so a transfer that was fully compensated has no value to add."
derived: ["sum_receipts", "holdings", ["all", ["not", ["unknown", ["receipt", "disposed_date"]]], ["otherwise", ["receipt", "snap_transfer_to_qualify"], false], ["unknown", ["receipt", "returned_date"]], ["not", ["in", ["lookup", "snap_holding_treatment_table", ["receipt", "kind"]], ["excluded", "excluded_household_goods"]]], [">=", ["receipt", "disposed_date"], ["days_after", ["days_between", ["first_day", ["month_of", "snap_application_date"]], "snap_application_date"], ["first_day", ["months_before", 3, ["month_of", "snap_application_date"]]]]], ["<=", ["month_of", ["receipt", "disposed_date"]], ["det_month"]], ["<", ["receipt", "disposed_date"], "snap_application_date"]], ["max", 0, ["-", ["*", ["-", ["receipt", "value"], ["receipt", "amount_owed"]], ["otherwise", ["receipt", "share"], 1]], ["receipt", "compensation_received"]]]]
sources: [S2961, S2962]
implemented: engine
tags: [snap, resources]
rationale: "Resource records, step H1 SNAP (docs/reviews/records-holdings-snap-af.md): SNAP reads the person's resources from the holdings records (holdings, CO-5300) through its counting table (snap_holding_treatment_table, CO-5301), never from the scalar resource facts. Read by snap_is_disqualified_for_resource_transfer (CO-4160) for the start of the period, in place of the month-scoped transfer facts."
tests:
  # Hand-computed from 10 CCR 2506-1 4.408.2.B (S2962); applied October 12, 2026.
  - {id: CO-5315-T1, title: "$4,000 on July 20 (before) and $4,000 on October 20 (after the application): 4,000", as_of: "2026-10-25", given: {snap_application_date: "2026-10-12", holdings: [{kind: other_resource, value: 4000, amount_owed: 0, compensation_received: 0, disposed_date: "2026-07-20", snap_transfer_to_qualify: true}, {kind: other_resource, value: 4000, amount_owed: 0, compensation_received: 0, disposed_date: "2026-10-20", snap_transfer_to_qualify: true}]}, expect: 4000}
  - {id: CO-5315-T2, title: "Only the October 20 transfer, after the application: 0", as_of: "2026-10-25", given: {snap_application_date: "2026-10-12", holdings: [{kind: other_resource, value: 4000, amount_owed: 0, compensation_received: 0, disposed_date: "2026-10-20", snap_transfer_to_qualify: true}]}, expect: 0}
