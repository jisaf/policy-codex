id: CO-5315
name: "SNAP: value of the person's disqualifying transfers before the application"
identifier: snap_disqualifying_transfer_value_before_application
kind: derived
type: money
scope: person
program: SNAP
meaning: "The part of snap_disqualifying_transfer_value (CO-5314) transferred before the household's date of application (snap_application_date): the transfers 4.408.2.B disqualifies from the month of application, rather than from the month the notice of adverse action takes effect."
precision: "The three months run back from the date of application to the same day of the month three calendar months earlier, that day included (a day the earlier month lacks runs into the next month: applied May 31, 2026, from March 3), as before step H1 (CO-4159); the day is OQ-1309's. A transfer after the date of application, through the determination month, is read as made after the household was determined eligible; one in a later month is not read. The county's finding (snap_transfer_to_qualify) not stated is read as no: 4.408.2.B applies \"In the event the local office establishes that an applicant household knowingly transferred resources for the purpose of qualifying\", so a transfer not established to be one does not disqualify (the rule's own reading, design decision D3; the person fact it replaces, CO-4155, was read the same way; a request to the integration owner to declare the default on the field). A transfer whose resource has been returned in whole (returned_date) is not read: the resource is again among the household's. Coverage pass 4 for SNAP resources SR-14: the transfers 4.408.2.A exempts (excluded property, a sale near fair market value, a transfer between members, one for another reason) are the county's finding (snap_transfer_to_qualify: \"is not a transfer 10 CCR 2506-1 4.408.2.A exempts\"), so no row of the table is read beside it (before, a holding of a row excluded outright was left out whatever the finding, a second, narrower statement of A.1). SR-11: the uncompensated value is the holding's value, less what was owed on it for a non-liquid holding (4.408.1.A values liquid resources at their redemption value and nothing is owed on cash or an account, so amount_owed is not read for a liquid kind), times the person's share, less what the person received for it (compensation_received), never below zero; 4.408.2.A.2 leaves a sale at or near fair market value unaffected, so a transfer that was fully compensated has no value to add. Field sweep defaults list (2026-11-23): snap_transfer_to_qualify is read as the holdings record states it, its default false declared once on the schema (CO-5300) with the rule that gives it (10 CCR 2506-1 4.408.2.B (S2962): disqualification \"In the event the local office establishes that an applicant household knowingly transferred resources\"); before, this reader gave the default itself (otherwise false), which conventions rule 12 and decision 4 do not allow a reader. No value changes: the tests that leave the finding out read it as false, as before."
derived: ["sum_receipts", "holdings", ["all", ["not", ["unknown", ["receipt", "disposed_date"]]], ["receipt", "snap_transfer_to_qualify"], ["unknown", ["receipt", "returned_date"]], [">=", ["receipt", "disposed_date"], ["days_after", ["days_between", ["first_day", ["month_of", "snap_application_date"]], "snap_application_date"], ["first_day", ["months_before", 3, ["month_of", "snap_application_date"]]]]], ["<=", ["month_of", ["receipt", "disposed_date"]], ["det_month"]], ["<", ["receipt", "disposed_date"], "snap_application_date"]], ["max", 0, ["-", ["*", ["case", [["in", ["receipt", "kind"], ["cash", "bank_account", "securities", "retirement_account", "education_savings_account", "able_account", "business_cash_and_assets", "held_income_tax_refund", "held_eitc", "held_retroactive_ssa_benefit", "held_excluded_payment", "held_loan_proceeds", "held_replacement_proceeds", "held_prorated_income"]], ["receipt", "value"]], ["else", ["-", ["receipt", "value"], ["receipt", "amount_owed"]]]], ["otherwise", ["receipt", "share"], 1]], ["receipt", "compensation_received"]]]]
sources: [S2961, S2962, S4823]
open: [OQ-1309]
implemented: engine
tags: [snap, resources]
rationale: "Resource records, step H1 SNAP (docs/reviews/records-holdings-snap-af.md): SNAP reads the person's resources from the holdings records (holdings, CO-5300) through its counting table (snap_holding_treatment_table, CO-5301), never from the scalar resource facts. Read by snap_is_disqualified_for_resource_transfer (CO-4160) for the start of the period, in place of the month-scoped transfer facts."
tests:
  # Hand-computed from 10 CCR 2506-1 4.408.2.B (S2962); applied October 12, 2026.
  - {id: CO-5315-T1, title: "$4,000 on July 20 (before) and $4,000 on October 20 (after the application): 4,000", as_of: "2026-10-25", given: {snap_application_date: "2026-10-12", holdings: [{kind: other_resource, value: 4000, amount_owed: 0, compensation_received: 0, disposed_date: "2026-07-20", snap_transfer_to_qualify: true}, {kind: other_resource, value: 4000, amount_owed: 0, compensation_received: 0, disposed_date: "2026-10-20", snap_transfer_to_qualify: true}]}, expect: 4000}
  - {id: CO-5315-T2, title: "Only the October 20 transfer, after the application: 0", as_of: "2026-10-25", given: {snap_application_date: "2026-10-12", holdings: [{kind: other_resource, value: 4000, amount_owed: 0, compensation_received: 0, disposed_date: "2026-10-20", snap_transfer_to_qualify: true}]}, expect: 0}
  - {"id": "CO-5315-T3", "title": "SR-11: $4,000 of cash given away on 2027-01-20, before the 2027-02-01 application, to qualify: 4,000 (amount_owed not read)", "as_of": "2027-02-10", "given": {"snap_application_date": "2027-02-01", "holdings": [{"kind": "cash", "value": 4000, "disposed_date": "2027-01-20", "compensation_received": 0, "snap_transfer_to_qualify": true}]}, "expect": 4000}
