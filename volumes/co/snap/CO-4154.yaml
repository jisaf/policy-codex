  - {id: CO-4154-T2, month: "2026-10", title: "Sponsor information provided, status verified - eligible", as_of: "2026-10-01", given: {snap_is_eligible_non_citizen: true, snap_sponsor_verification_is_pending: false, snap_noncitizen_documentation_due_date: "2026-10-31", snap_immigration_status_verification_is_pending: false}, expect: false}
  - {id: CO-4154-T3, month: "2026-11", title: "F-18: status document still outstanding after the thirtieth day - ineligible", as_of: "2026-11-05", given: {snap_is_eligible_non_citizen: true, snap_sponsor_verification_is_pending: false, snap_noncitizen_documentation_due_date: "2026-10-31", snap_immigration_status_verification_is_pending: true}, expect: true}
  - {id: CO-4154-T4, month: "2026-10", title: "Status document outstanding within the reasonable opportunity - still eligible", as_of: "2026-10-20", given: {snap_is_eligible_non_citizen: true, snap_sponsor_verification_is_pending: false, snap_noncitizen_documentation_due_date: "2026-10-31", snap_immigration_status_verification_is_pending: true}, expect: false}
  - {id: CO-4154-T5, month: "2026-11", title: "A citizen - never", as_of: "2026-11-05", given: {snap_is_eligible_non_citizen: false}, expect: false}
