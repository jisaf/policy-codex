id: CO-4154
name: "SNAP: is ineligible while non-citizen verification is outstanding"
identifier: snap_is_ineligible_pending_non_citizen_verification
kind: derived
type: yes/no
scope: person-month
program: SNAP
meaning: "This household member is an eligible non-citizen by the facts stated, but is ineligible until a verification of that eligibility is provided, while the eligibility of the remaining members is determined (10 CCR 2506-1 4.505.7.B-C, 4.505.6.F, I, 4.505.61; 7 CFR 273.4(c)(5), 273.2(f)(1)(ii)(B)): either the sponsor's information is outstanding, at any date (snap_sponsor_verification_is_pending, CO-1611), or the eligible alien status itself - the status document, the forty qualifying quarters or the military connection the eligibility rests on - is still unverified after the reasonable opportunity to the non-citizen's documentation due date (snap_immigration_status_verification_is_pending, CO-1601, past snap_noncitizen_documentation_due_date, CO-1617)."
precision: "Read for the month containing the determination date, as household composition is. The status arm keeps the exceptions CO-1601 already applies: a document submitted to USCIS (4.505.6.F.1, immigration_status_is_verified_or_submitted) and the quarters while SSA reviews them (F.2). The sponsor arm keeps CO-1616's: deeming must apply (no child under 18 is asked), and a basic categorically eligible household's conferring program verified the sponsor. The member is an ineligible non-citizen (snap_is_ineligible_non_citizen, CO-310): income and resources count pro rata, as 273.4(c)(5) directs \"in accordance with § 273.11(c)\", and the sponsor's deemed income and resources are not attributed to the member (CO-3701, CO-3702; 4.505.7.C). Where one sponsor covers every member, every member is ineligible and so the household is (4.505.7.C last paragraph). A citizen or a non-citizen who is not eligible anyway is false here. Coverage pass 4 for SNAP S4-11 (OQ-1263 resolved): per month, since prospective budgeting reads \"anticipated income and circumstances during the issuance month\" (10 CCR 2506-1 4.402.1.A, S4734): the eligible non-citizen (CO-308) is the month's; the verifications stay those of the determination month. Before, the item was per person and read on the determination date in every month."
derived: [all, snap_is_eligible_non_citizen, [any, [at, snap_sponsor_verification_is_pending, [det_month]], [all, [">", [det_date], snap_noncitizen_documentation_due_date], [at, snap_immigration_status_verification_is_pending, [det_month]]]]]
sources: [S2954, S2955, S2956, S2957, S2516, S1061]
implemented: engine
tags: [snap, immigration, verification]
rationale: "Final verification pass 2 N-2 (docs/reviews/final2-snap.md): snap_verification_status (CO-1394) reported members_excluded for an unverified sponsor, and past_due for unverified status documents, quarters or military connection (final verification V-4, F-18), but no eligibility item applied either: the member stayed in the eligible size and the deemed sponsor income stayed in the budget. No existing item states this ineligibility; snap_is_ineligible_non_citizen (CO-310) reads it."
nearest: [CO-1611, CO-1601, CO-310]
tests:
