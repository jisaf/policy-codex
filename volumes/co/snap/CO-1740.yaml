id: CO-1740
name: "SNAP: household liquid resources"
identifier: snap_household_liquid_resources
kind: derived
type: money
scope: person-month
program: SNAP
meaning: "The total of the countable liquid resources (cash on hand, checking or savings accounts, savings certificates and lump sum payments) of every member of this person's SNAP household in the month, the figure 7 CFR 273.2(i)(1) compares with the expedited service ceiling, leaving out the resources of a member who receives SSI or public assistance (7 CFR 273.8(e)(17))."
precision: "Final verification pass 2 N-8: each member's liquid resources are read as SNAP counts them (snap_countable_liquid_resources, CO-4176), without the refunds, earned income tax credits, education accounts and unreachable funds 4.409 and 4.410 exclude: 273.2(i)(1) compares \"liquid resources\" with the ceiling, and an excluded holding is not a resource of the household. Coverage pass 4 for SNAP S4-11 (OQ-1263 resolved): per month, since prospective budgeting reads \"anticipated income and circumstances during the issuance month\" (10 CCR 2506-1 4.402.1.A, S4734): the household (CO-3714) is the month's. Before, the item was per person and read on the determination date in every month. Coverage pass 4 for SNAP resources (docs/reviews/coverage4-snap-resources.md): per month (SR-9); SR-2: the resources of a member who receives SSI or public assistance are left out (7 CFR 273.8(e)(17), S4821; the statute override; OQ-1306), read only for a member with liquid resources."
statute_override: "Federal regulation supplies an exclusion 10 CCR 2506-1 4.408.C and 4.410 omit: 7 CFR 273.8(e)(17), on file as in force on 2026-11-19 (D-191), excludes \"The resources of a household member who receives SSI or PA benefits\" in determining a household's resources, and the liquid resources 273.2(i)(1) compares with the expedited ceiling are the household's resources; a member who receives SSI, Colorado Works cash, Old Age Pension, Aid to the Needy Disabled or Aid to the Blind has no liquid resources counted to it (OQ-1306)."
derived: ["sum", "snap_household_members_other_than_ineligible_students", ["case", [["=", ["of", ["P"], "snap_countable_liquid_resources"], 0], 0], [["any", ["of", ["P"], "receives_ssi"], ["of", ["P"], "receives_tanf_cash"], ["of", ["P"], "receives_state_cash_assistance"]], 0], ["else", ["of", ["P"], "snap_countable_liquid_resources"]]]]
sources: [S2508, S58, S2966, S2967, S2968, S4823, S4821, S4820]
open: [OQ-1306]
implemented: engine
tags: [snap, resources]
rationale: "Vocabulary fix round (docs/reviews/vocabulary-reuse.md, R-11): snap_is_entitled_to_expedited_service (CO-348) compared the household's liquid and non-liquid countable resources with the $100 ceiling, but 273.2(i)(1) counts 'liquid resources' only, so a household with no cash and a countable vehicle was refused expedited service. Same-word SW-31: reads the neutral liquid_resources_value (CO-3390) directly; SNAP counts all of it (7 CFR 273.8(c)(1)), so liquid_resources_value (CO-031) is retired."
