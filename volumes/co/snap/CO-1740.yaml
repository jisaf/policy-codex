id: CO-1740
name: "SNAP: household liquid resources"
identifier: snap_household_liquid_resources
kind: derived
type: money
scope: person
program: SNAP
meaning: "The total of the countable liquid resources (cash on hand, checking or savings accounts, savings certificates and lump sum payments) of every member of this person's SNAP household, the figure 7 CFR 273.2(i)(1) compares with the expedited service ceiling."
precision: "Final verification pass 2 N-8: each member's liquid resources are read as SNAP counts them (snap_countable_liquid_resources, CO-4176), without the refunds, earned income tax credits, education accounts and unreachable funds 4.409 and 4.410 exclude: 273.2(i)(1) compares \"liquid resources\" with the ceiling, and an excluded holding is not a resource of the household."
derived: [sum, snap_household_members_other_than_ineligible_students, [of, [P], snap_countable_liquid_resources]]
sources: [S2508, S58, S2966, S2967, S2968]
implemented: engine
tags: [snap, resources]
rationale: "Vocabulary fix round (docs/reviews/vocabulary-reuse.md, R-11): snap_is_entitled_to_expedited_service (CO-348) compared the household's liquid and non-liquid countable resources with the $100 ceiling, but 273.2(i)(1) counts 'liquid resources' only, so a household with no cash and a countable vehicle was refused expedited service. Same-word SW-31: reads the neutral liquid_resources_value (CO-3390) directly; SNAP counts all of it (7 CFR 273.8(c)(1)), so liquid_resources_value (CO-031) is retired."
tests:
  - {id: CO-1740-T1, as_of: "2026-10-01", given: {snap_resides_in_institution_providing_meals: false, liquid_resources_value: 40, snap_countable_nonliquid_resources: 6000, snap_is_ineligible_student: false, holdings: [{kind: bank_account, value: 40}]}, others: {p2: {snap_resides_in_institution_providing_meals: false, liquid_resources_value: 30, snap_countable_nonliquid_resources: 0, snap_is_ineligible_student: false, holdings: [{kind: bank_account, value: 30}]}}, relationships: [[spouse, p1, p2]], expect: 70}
  - {id: CO-1740-T2, title: "Final verification F-6 - an ineligible student's $500 is not the household's (4.411.2.C)", as_of: "2026-10-01", given: {snap_resides_in_institution_providing_meals: false, liquid_resources_value: 40, snap_countable_nonliquid_resources: 0, snap_is_ineligible_student: false, holdings: [{kind: bank_account, value: 40}]}, others: {p2: {snap_resides_in_institution_providing_meals: false, liquid_resources_value: 500, snap_countable_nonliquid_resources: 0, snap_is_ineligible_student: true, snap_meets_citizenship_requirement: true, holdings: [{kind: bank_account, value: 500}]}}, relationships: [[spouse, p1, p2]], expect: 40}
  - {id: CO-1740-T3, title: "N-8: $90 cash and a $600 federal refund still in the account - $90 against the expedited ceiling", as_of: "2026-10-01", given: {snap_resides_in_institution_providing_meals: false, liquid_resources_value: 690, federal_tax_refunds_held_value: 600, snap_countable_nonliquid_resources: 0, snap_is_ineligible_student: false, holdings: [{kind: bank_account, value: 90}, {kind: held_income_tax_refund, paid_by: federal, value: 600}]}, others: {}, relationships: [], expect: 90}
