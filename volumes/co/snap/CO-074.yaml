id: CO-074
name: "SNAP: countable non-liquid resources"
identifier: snap_countable_nonliquid_resources
kind: derived
type: money
scope: person
program: SNAP
meaning: "The person's own countable non-liquid resources under 7 CFR 273.8 and 10 CCR 2506-1 4.410, before combining with other household members' resources: real property other than the home, with the joint owners' shares the person can reach (4.409.C), less the property the person is trying to sell (4.410.F.1), the lot for a permanent home (B), installment contracts producing a fair return (E.2) and farm property within a year of the end of farming (E.4), and nothing at all when what remains would return snap_low_return_resource_maximum ($1,500) or less after the costs of sale (F.2, G); plus the equity of a pre-purchased funeral agreement above snap_funeral_agreement_exclusion (4.410.D.4). Colorado excludes every vehicle (4.410.A); the cash value of life insurance and household goods (273.8(e)(2)) and retirement accounts (273.8(e)(2)(i)) are excluded."
precision: "Final verification pass 2 N-8: the funeral agreement is revocable_prepaid_burial_contract_value (CO-3856, the paid-up amount, read as 0 when not stated); an irrevocable agreement is inaccessible (4.410.F) and not counted. Coverage review snap-financial CF-7 and CF-8: the exempt and inaccessible parts of the person's real property are stated as parts of real_property_other_than_home_equity (CO-4335 to CO-4337, CO-4346) and subtracted; the shares of joint owners who live elsewhere that the person can reach are added (CO-4343; 4.409.C, S2968). The person's real property is one figure, so the $1,500 test of 4.410.F.2 and G (S3119) is applied to what remains of it as one resource, net of the estimated costs of selling it (real_property_costs_of_sale, CO-4338); a person with several separate parcels, one of them worth $1,500 or less, states that parcel as part of real_property_for_sale_value only if it is for sale, and otherwise the parcels are tested together."
assumption: "A person states one pre-purchased funeral agreement: where a person holds several, the paid-up amounts are stated together and the exclusion is applied once to their total, which counts less than one exclusion per agreement would only when the person holds more than one agreement (4.410.D.4 excludes \"one ... per household member\")."
derived: ["+", [case, [["<=", ["-", [max, 0, ["-", ["+", [otherwise, real_property_other_than_home_equity, 0], [otherwise, joint_real_property_other_owners_share_value, 0]], ["+", [otherwise, real_property_for_sale_value, 0], [otherwise, land_for_permanent_home_value, 0], [otherwise, installment_sale_contract_value, 0], [case, [[all, [not, [unknown, farming_self_employment_end_date]], ["<", [years_between, farming_self_employment_end_date, [det_date]], snap_former_farm_property_exclusion_years]], [otherwise, former_farm_property_value, 0]], [else, 0]]]]], [otherwise, real_property_costs_of_sale, 0]], snap_low_return_resource_maximum], 0], [else, [max, 0, ["-", ["+", [otherwise, real_property_other_than_home_equity, 0], [otherwise, joint_real_property_other_owners_share_value, 0]], ["+", [otherwise, real_property_for_sale_value, 0], [otherwise, land_for_permanent_home_value, 0], [otherwise, installment_sale_contract_value, 0], [case, [[all, [not, [unknown, farming_self_employment_end_date]], ["<", [years_between, farming_self_employment_end_date, [det_date]], snap_former_farm_property_exclusion_years]], [otherwise, former_farm_property_value, 0]], [else, 0]]]]]]], [max, 0, ["-", [otherwise, revocable_prepaid_burial_contract_value, 0], snap_funeral_agreement_exclusion]]]
sources: [S2216, S2967, S2968, S3118, S3119, S3129]
implemented: engine
tags: [snap, resources]
rationale: "Same-word audit SW-31: every program's countable resources were a supplied, already-counted figure, so each program's resource rules lived outside the ledger, and Adult Financial fell back silently to the SSI figure when its own was unstated (OQ-392). The person's holdings are stated once by asset type; each program derives its countable resources by its own exclusions. The ID and identifier are kept; the amount is now derived."
