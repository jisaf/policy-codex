id: CO-074
name: "SNAP: countable non-liquid resources"
identifier: snap_countable_nonliquid_resources
kind: derived
type: money
scope: person
program: SNAP
meaning: "The person's own countable non-liquid resources under 7 CFR 273.8 and 10 CCR 2506-1 4.409-4.410, before combining with other household members' resources: the person's countable real property (snap_countable_real_property, CO-5311: the equity not exempt, nothing when it would return $1,500 or less), the equity of pre-purchased funeral agreements over the one agreement 4.410.D.4 excludes (snap_countable_funeral_agreements, CO-5312), and burial spaces beyond the one plot per household member the text excludes (snap_countable_burial_spaces, CO-5313). Colorado excludes every vehicle (4.410.A); the cash value of life insurance and household goods (273.8(e)(2)) and retirement accounts (273.8(e)(2)(i)) are excluded."
precision: "Resource records, step H1 SNAP (docs/reviews/records-holdings-snap-af.md): each part is read from the person's holdings records (holdings, CO-5300) through snap_holding_treatment_table (CO-5301), each holding stated once, never from the scalar resource facts and their parts (real_property_other_than_home_equity and the parts subtracted from it, joint_real_property_other_owners_share_value, revocable_prepaid_burial_contract_value, each read as 0 when not stated). A person whose holdings are not stated is cannot determine (decision 4 of 2026-11-23); before, every part was 0. Finding H0-F3 fixed: a burial space beyond the burial needs of the immediate family is counted (CO-5313). Several funeral agreements: one is excluded, not $1,500 of their total (CO-5312; the item's assumption retired). Land used only to produce food for the household (produces_for_household_use) is counted as real property: 4.410.E.1 exempts property producing an annual income consistent with its value and D.1 livestock, and no paragraph exempts such land (before, it was not read: the H0 field-level reading for sign-off). Trusts, annuities, life estates, a revocable burial trust and personal property held as an investment are not read (rows not_counted_no_rule_found; OQ-1202)."
derived: ["+", "snap_countable_real_property", ["+", "snap_countable_funeral_agreements", "snap_countable_burial_spaces"]]
sources: [S2216, S2967, S2968, S3118, S3119, S3129, S4690]
implemented: engine
tags: [snap, resources]
rationale: "Same-word audit SW-31: every program's countable resources were a supplied, already-counted figure, so each program's resource rules lived outside the ledger, and Adult Financial fell back silently to the SSI figure when its own was unstated (OQ-392). The person's holdings are stated once by asset type; each program derives its countable resources by its own exclusions. The ID and identifier are kept; the amount is now derived."
