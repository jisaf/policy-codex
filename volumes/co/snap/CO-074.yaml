id: CO-074
name: "SNAP: countable non-liquid resources"
identifier: snap_countable_nonliquid_resources
kind: derived
type: money
scope: person-month
program: SNAP
meaning: "The person's own countable non-liquid resources in the month under 7 CFR 273.8 and 10 CCR 2506-1 4.409-4.410, before combining with other household members' resources: the person's countable real property (snap_countable_real_property, CO-5311: the equity not exempt, each holding returning more than $1,500), non-liquid personal property and installment contracts (snap_countable_other_nonliquid_resources, CO-6900), the equity of pre-purchased funeral agreements beyond the one per household member that 7 CFR 273.8(e)(2) excludes (snap_countable_funeral_agreements, CO-5312), and burial spaces beyond the one plot per household member the text excludes (snap_countable_burial_spaces, CO-5313). Colorado excludes every vehicle (4.410.A); the cash value of life insurance and household goods (273.8(e)(2)) and retirement accounts (273.8(e)(2)(i)) are excluded."
precision: "Coverage pass 4 for SNAP resources (docs/reviews/coverage4-snap-resources.md): per month (SR-9), each part read in the month evaluated; investment personal property and installment contracts not producing income consistent with their value are counted (SR-3, SR-5; CO-6900); one funeral agreement per member is excluded whatever its amount (SR-1, the statute override on CO-5312). Resource records, step H1 SNAP (docs/reviews/records-holdings-snap-af.md): each part is read from the person's holdings records (holdings, CO-5300) through snap_holding_treatment_table (CO-5301), each holding stated once, never from the scalar resource facts. A person whose holdings are not stated is cannot determine (decision 4 of 2026-11-23). Land used only to produce food for the household (produces_for_household_use) is counted as real property: 4.410.E.1 exempts property producing an annual income consistent with its value and D.1 livestock, and no paragraph exempts such land. Trusts and annuities are not read (OQ-1307); a life estate is not read (OQ-1202)."
derived: ["+", "snap_countable_real_property", ["+", "snap_countable_other_nonliquid_resources", ["+", "snap_countable_funeral_agreements", "snap_countable_burial_spaces"]]]
sources: [S2216, S2967, S2968, S3118, S3119, S3129, S4690, S4820]
open: [OQ-1202, OQ-1307]
implemented: engine
tags: [snap, resources]
rationale: "Same-word audit SW-31: every program's countable resources were a supplied, already-counted figure, so each program's resource rules lived outside the ledger, and Adult Financial fell back silently to the SSI figure when its own was unstated (OQ-392). The person's holdings are stated once by asset type; each program derives its countable resources by its own exclusions. The ID and identifier are kept; the amount is now derived."
