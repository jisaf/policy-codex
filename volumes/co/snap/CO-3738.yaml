id: CO-3738
name: "SNAP: requires verification of a military connection"
identifier: snap_requires_verification_of_military_connection
kind: derived
type: yes/no
scope: person-month
program: SNAP
meaning: "Whether the military connection of this household member must be verified for SNAP: a lawful permanent resident with a military connection whose eligibility rests on it - not five years in qualified status and no other exemption from the waiting period - at application, and at recertification when the immigration status information is outdated (7 CFR 273.2(f)(1)(ii)(A))."
precision: "The other exemptions are snap_is_exempt_from_waiting_period_other_than_military (CO-3713). Forty quarters do not take the military connection's place here: where both apply, the military connection, which needs no SSA record, is the one verified. The recertification arm is as for the quarters (CO-3736)."
derived: [all, snap_is_household_member, ["=", immigration_status, lawful_permanent_resident], snap_has_military_connection, [not, ["<=", "qualified_non_citizen_waiting_period_years", ["years_between", "qualified_status_date", ["days_after", -1, ["first_day", ["month_after", ["month"]]]]]]], [not, snap_is_exempt_from_waiting_period_other_than_military], [any, [not, snap_determination_is_recertification], [otherwise, snap_immigration_status_information_is_outdated, false]]]
sources: [S802]
implemented: engine
tags: [verification, snap, immigration]
rationale: "Final verification V-4: SNAP verified only the SAVE status, so an LPR eligible through a military connection was certified on the attested connection."
tests:
  - {id: CO-3738-T1, title: "An LPR spouse of a veteran, two years in status: verify the connection", as_of: "2026-10-01", month: "2026-10", given: {snap_is_household_member: true, immigration_status: lawful_permanent_resident, snap_has_military_connection: true, qualified_status_date: '2024-06-01', snap_is_exempt_from_waiting_period_other_than_military: false, snap_determination_is_recertification: false}, expect: true}
  - {id: CO-3738-T2, title: "Under 18 as well: the age exemption needs no military record", as_of: "2026-10-01", month: "2026-10", given: {snap_is_household_member: true, immigration_status: lawful_permanent_resident, snap_has_military_connection: true, qualified_status_date: '2024-06-01', snap_is_exempt_from_waiting_period_other_than_military: true}, expect: false}
