id: CO-3738
name: "SNAP: requires verification of a military connection"
identifier: snap_requires_verification_of_military_connection
kind: derived
type: yes/no
scope: person-month
program: SNAP
meaning: "Whether the military connection of this household member must be verified for SNAP: a lawful permanent resident with a military connection whose eligibility rests on it - not five years in qualified status and no other exemption from the waiting period - at application, and at recertification when the immigration status information is outdated (7 CFR 273.2(f)(1)(ii)(A))."
precision: "The other exemptions are snap_is_exempt_from_waiting_period_other_than_military (CO-3713). Forty quarters do not take the military connection's place here: where both apply, the military connection, which needs no SSA record, is the one verified. The recertification arm is as for the quarters (CO-3736). KL-SNAP-2 closed (2026-11-24; docs/reviews/known-limits.md): 'five years in qualified status' is counted as snap_meets_immigrant_additional_condition (CO-307) counts it, from the start of the waiting period (qualified_non_citizen_waiting_period_start_date, CO-7820: the first qualified status, 8 U.S.C. 1612(a)(2)(L), S22; 10 CCR 2506-1 4.305.B.3.a, S12) or from the status held now, to the last day of the month; before, from qualified_status_date only, so the military connection of a lawful permanent resident who had been paroled more than five years before was verified though eligibility rested on the five years."
derived: [all, snap_is_household_member, ["=", immigration_status, lawful_permanent_resident], snap_has_military_connection, [not, [any, ["<=", "qualified_non_citizen_waiting_period_years", ["years_between", "qualified_status_date", ["days_after", -1, ["first_day", ["month_after", ["month"]]]]]], ["<=", "qualified_non_citizen_waiting_period_years", ["years_between", "qualified_non_citizen_waiting_period_start_date", ["days_after", -1, ["first_day", ["month_after", ["month"]]]]]]]], [not, snap_is_exempt_from_waiting_period_other_than_military], [any, [not, snap_determination_is_recertification], [otherwise, snap_immigration_status_information_is_outdated, false]]]
sources: [S802, S22, S12]
implemented: engine
tags: [verification, snap, immigration]
rationale: "Final verification V-4: SNAP verified only the SAVE status, so an LPR eligible through a military connection was certified on the attested connection."
tests:
  - {id: CO-3738-T1, title: "An LPR spouse of a veteran, two years in status: verify the connection", as_of: "2026-10-01", month: "2026-10", given: {snap_is_household_member: true, immigration_status: lawful_permanent_resident, status_before_lpr_adjustment: none, snap_has_military_connection: true, qualified_status_date: '2024-06-01', snap_is_exempt_from_waiting_period_other_than_military: false, snap_determination_is_recertification: false}, expect: true}
  - {id: CO-3738-T2, title: "Under 18 as well: the age exemption needs no military record", as_of: "2026-10-01", month: "2026-10", given: {snap_is_household_member: true, immigration_status: lawful_permanent_resident, snap_has_military_connection: true, qualified_status_date: '2024-06-01', snap_is_exempt_from_waiting_period_other_than_military: true}, expect: false}
  # KL-SNAP-2 (2026-11-24): T1 states that he was admitted directly as a lawful permanent resident (status_before_lpr_adjustment none), as its story has it: the start of the five years reads it (CO-7820). No answer moved.
  # KL-SNAP-2 (LPR-EX-PAROLEE): paroled into the United States 2019-05-01, lawful permanent resident 2023-03-01 (status_before_lpr_adjustment other), the spouse of a veteran (a military connection), no other exemption, an application.
  - {id: CO-3738-T90, title: "KL-SNAP-2 (was true): November 2026, last day 2026-11-30: from the parole, 2019-05-01, 7 whole years >= 5: eligibility rests on the five years, not on the military connection: not verified", as_of: "2026-11-10", month: "2026-11", given: {snap_is_household_member: true, immigration_status: lawful_permanent_resident, snap_has_military_connection: true, qualified_status_date: "2023-03-01", us_entry_date: "2019-05-01", status_before_lpr_adjustment: other, first_qualified_status_date: "2019-05-01", snap_is_exempt_from_waiting_period_other_than_military: false, snap_determination_is_recertification: false}, expect: false}
  - {id: CO-3738-T91, title: "KL-SNAP-2: the same in April 2024, last day 2024-04-30: 2019-05-01 to 2024-04-30 is 4 whole years; from 2023-03-01, 1: eligibility rests on the military connection: verify it", as_of: "2024-04-10", month: "2024-04", given: {snap_is_household_member: true, immigration_status: lawful_permanent_resident, snap_has_military_connection: true, qualified_status_date: "2023-03-01", us_entry_date: "2019-05-01", status_before_lpr_adjustment: other, first_qualified_status_date: "2019-05-01", snap_is_exempt_from_waiting_period_other_than_military: false, snap_determination_is_recertification: false}, expect: true}
  - {id: CO-3738-T92, title: "KL-SNAP-2: November 2026 without the first date stated: whether eligibility rests on the connection cannot be told: cannot determine (required where read; was true)", as_of: "2026-11-10", month: "2026-11", given: {snap_is_household_member: true, immigration_status: lawful_permanent_resident, snap_has_military_connection: true, qualified_status_date: "2023-03-01", us_entry_date: "2019-05-01", status_before_lpr_adjustment: other, snap_is_exempt_from_waiting_period_other_than_military: false, snap_determination_is_recertification: false}, expect: unknown}
