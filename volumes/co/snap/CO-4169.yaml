id: CO-4169
name: "SNAP: household size with disqualified members counted"
identifier: snap_household_size_with_disqualified_members
kind: derived
type: whole number
scope: person-month
program: SNAP
meaning: "The size this person's SNAP household would have if the members left out of its size for an intentional program violation, a felony, fleeing, or a work-requirement sanction (snap_is_disqualified_member_counted_in_full; 7 CFR 273.11(c)(1)) were counted: snap_eligible_household_size plus those members. The size against which 273.11(c)(1)(ii) checks that the exclusion has not increased the allotment."
precision: "A disqualified member who is also ineligible for a reason that would leave them out of the size anyway - an ineligible non-citizen, an SSN refusal or the ABAWD time limit (snap_is_ineligible_member_prorated, CO-2565), or an ineligible student (CO-411) - is not added: the exclusion that the cap is about is not what leaves that member out. Equal to snap_eligible_household_size when no member is so disqualified. Coverage pass 4 for SNAP S4-11 (OQ-1263 resolved): per month, since prospective budgeting reads \"anticipated income and circumstances during the issuance month\" (10 CCR 2506-1 4.402.1.A, S4734): the household (CO-305) and its members' findings are the month's. Before, the item was per person and read on the determination date in every month."
derived: ["+", snap_eligible_household_size, [count, [filter, snap_household_members, [all, [of, [P], snap_is_disqualified_member_counted_in_full], [not, [of, [P], snap_is_ineligible_member_prorated]], [not, [of, [P], snap_is_ineligible_student]]]]]]
sources: [S2965, S1813]
implemented: engine
tags: [snap, household]
rationale: "Final verification pass 2 N-7 (docs/reviews/final2-snap.md): 273.11(c)(1)(ii) (S2965) leaves a disqualified member out of the size and requires that \"no household's coupon allotment is increased as a result of the exclusion\"; no item stated the size with the member counted, which the cap (snap_allotment_cap_for_disqualified_members, CO-4182) needs."
tests:
  - {id: CO-4169-T1, month: "2026-10", title: "Three members, one work-sanctioned: size 2, 3 with the member counted", as_of: "2026-10-01", given: {snap_eligible_household_size: 2, snap_household_members: [p1, p2, p3], snap_is_disqualified_member_counted_in_full: true, snap_is_ineligible_member_prorated: false, snap_is_ineligible_student: false}, others: {p2: {snap_is_disqualified_member_counted_in_full: false}, p3: {snap_is_disqualified_member_counted_in_full: false}}, expect: 3}
  - {id: CO-4169-T2, month: "2026-10", title: "No disqualified member", as_of: "2026-10-01", given: {snap_eligible_household_size: 2, snap_household_members: [p1, p2], snap_is_disqualified_member_counted_in_full: false}, others: {p2: {snap_is_disqualified_member_counted_in_full: false}}, expect: 2}
  - {id: CO-4169-T3, month: "2026-10", title: "A disqualified member who is also an ineligible non-citizen is not added", as_of: "2026-10-01", given: {snap_eligible_household_size: 1, snap_household_members: [p1, p2], snap_is_disqualified_member_counted_in_full: false}, others: {p2: {snap_is_disqualified_member_counted_in_full: true, snap_is_ineligible_member_prorated: true, snap_is_ineligible_student: false}}, expect: 1}
