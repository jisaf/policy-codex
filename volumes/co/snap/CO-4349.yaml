id: CO-4349
name: "SNAP: self-employment averaging months"
identifier: snap_self_employment_averaging_months
kind: derived
type: list of months
scope: person
program: SNAP
meaning: "The months over which SNAP averages this person's self-employment income when it is averaged (snap_self_employment_is_averaged, CO-4329): the snap_annual_averaging_months (twelve) months before the month of application (10 CCR 2506-1 4.403.12.A, C), or, for an enterprise that began operating within them, the months from the month it began through the month before the month of application (4.403.12.D)."
precision: "The months are the enterprise's past months: 4.403.12.A averages prior income and turns to anticipated earnings only when business has changed substantially, and D averages a new enterprise \"over the period of time the business has been in operation and the monthly amount projected for the coming year\". The month of application is the month of snap_application_date. Capital gains received in these months are part of the receipts and are averaged with them (4.403.11.D)."
derived: [case, [[all, [not, [unknown, self_employment_start_date]], [">", [month_of, self_employment_start_date], [months_before, snap_annual_averaging_months, [month_of, snap_application_date]]]], [months_from_to, [month_of, self_employment_start_date], [month_before, [month_of, snap_application_date]]]], [else, [months_ending, snap_annual_averaging_months, [month_before, [month_of, snap_application_date]]]]]
sources: [S3114, S3113]
implemented: engine
tags: [snap, income]
rationale: "Coverage review snap-financial CF-3: the averaging period of 4.403.12 (S3114) had no item."
tests:
  - {id: CO-4349-T1, title: "Applied in November 2026: November 2025 to October 2026", as_of: "2026-11-10", given: {snap_application_date: "2026-11-02"}, expect: ["2025-11", "2025-12", "2026-01", "2026-02", "2026-03", "2026-04", "2026-05", "2026-06", "2026-07", "2026-08", "2026-09", "2026-10"]}
  - {id: CO-4349-T2, title: "A business that opened in July 2026: July to October", as_of: "2026-11-10", given: {snap_application_date: "2026-11-02", self_employment_start_date: "2026-07-15", earnings: [{kind: wages}, {kind: self_employment_receipts, job_start_date: "2026-07-15"}]}, expect: ["2026-07", "2026-08", "2026-09", "2026-10"]}
  - {id: CO-4349-T3, title: "A business that opened in November 2025: the full twelve months", as_of: "2026-11-10", given: {snap_application_date: "2026-11-02", self_employment_start_date: "2025-11-20", earnings: [{kind: wages}, {kind: self_employment_receipts, job_start_date: "2025-11-20"}]}, expect: ["2025-11", "2025-12", "2026-01", "2026-02", "2026-03", "2026-04", "2026-05", "2026-06", "2026-07", "2026-08", "2026-09", "2026-10"]}
