id: CO-1394
name: "SNAP: verification status"
identifier: snap_verification_status
kind: derived
type: one of
options: [not_applicable, not_required, complete, postponed_expedited, pending, expenses_disallowed, past_due]
scope: person-month
program: SNAP
role: outcome
meaning: "Where this person's SNAP household stands on verification: not applicable (the person is not a member of a SNAP household); no verification required; complete; postponed under expedited service (identity verified, other verification outstanding, within the postponement period); pending within the time allowed (ten days from the request, to the thirtieth day after application when only a non-citizen's status document is outstanding, and to the thirtieth day after application when only deductible expenses are); past that time with only deductible expenses unverified (the deductions are disallowed); or past the time allowed with an eligibility factor unverified."
precision: "past_due states only that the time allowed has run with a required factor unverified; when the agency denies (on the thirtieth day, or after a notice of pending status) is application processing and outside this item: 7 CFR 273.2(h)(1)(i)(C) (S813) makes the delay the household's once at least 10 days from the request have passed (OQ-309 resolved). The due date and the household's request date are the evaluated person's."
derived: [case, [[not, snap_is_household_member], not_applicable], [["=", [sum, snap_household_members, [of, [P], snap_person_required_verification_count]], 0], not_required], [["=", snap_pending_verification_count, 0], complete], [[all, snap_is_entitled_to_expedited_service, ["=", [sum, snap_household_members, [case, [[of, [P], snap_identity_verification_is_pending], 1], [else, 0]]], 0], ["<=", [det_date], snap_expedited_postponement_end_date]], postponed_expedited], [["<=", [det_date], snap_verification_due_date], pending], [[all, [">", [sum, snap_household_members, [case, [[of, [P], snap_immigration_status_verification_is_pending], 1], [else, 0]]], 0], ["=", ["-", [sum, snap_household_members, [of, [P], snap_person_pending_verification_count]], [sum, snap_household_members, [case, [[of, [P], snap_immigration_status_verification_is_pending], 1], [else, 0]]]], 0], ["<=", [det_date], snap_noncitizen_documentation_due_date]], pending], [[all, ["=", [sum, snap_household_members, [of, [P], snap_person_pending_verification_count]], 0], ["<=", [det_date], snap_expense_verification_due_date]], pending], [["=", [sum, snap_household_members, [of, [P], snap_person_pending_verification_count]], 0], expenses_disallowed], [else, past_due]]
sources: [S800, S812, S813, S814, S816, S834, S835, S829, S1057, S1097, S818]
implemented: engine
tags: [verification, snap]
rationale: "No existing item reports a SNAP household's verification standing; the outcome lets a reviewer see whether a household awaits documents, has lost a deduction, or has failed to verify an eligibility factor. Fix round: a first not_applicable row (review C-4), the non-citizen's thirty days from application (C-2) and the thirty days to verify expenses (C-5)."
tests:
  - {id: CO-1394-T1, month: "2026-10", as_of: "2026-10-01", given: {snap_household_members: [p1], snap_person_required_verification_count: 0, snap_is_household_member: true}, expect: not_required}
  - {id: CO-1394-T2, month: "2026-10", as_of: "2026-10-01", given: {snap_household_members: [p1], snap_person_required_verification_count: 3, snap_pending_verification_count: 0, snap_is_household_member: true}, expect: complete}
  - {id: CO-1394-T3, month: "2026-10", as_of: "2026-10-01", given: {determination_date: "2026-10-05", snap_household_members: [p1], snap_person_required_verification_count: 3, snap_pending_verification_count: 2, snap_is_entitled_to_expedited_service: true, snap_identity_verification_is_pending: false, snap_expedited_postponement_end_date: "2026-10-31", snap_is_household_member: true}, expect: postponed_expedited}
  - {id: CO-1394-T4, month: "2026-10", as_of: "2026-10-01", given: {determination_date: "2026-10-05", snap_household_members: [p1], snap_person_required_verification_count: 3, snap_pending_verification_count: 2, snap_is_entitled_to_expedited_service: false, snap_verification_due_date: "2026-10-11", snap_is_household_member: true}, expect: pending}
  - {id: CO-1394-T5, month: "2026-10", as_of: "2026-10-01", given: {determination_date: "2026-11-05", snap_household_members: [p1], snap_person_required_verification_count: 3, snap_pending_verification_count: 1, snap_person_pending_verification_count: 0, snap_is_entitled_to_expedited_service: false, snap_verification_due_date: "2026-10-11", snap_is_household_member: true, snap_expense_verification_due_date: "2026-10-31", snap_immigration_status_verification_is_pending: false}, expect: expenses_disallowed}
  - {id: CO-1394-T6, month: "2026-10", as_of: "2026-10-01", given: {determination_date: "2026-10-20", snap_household_members: [p1], snap_person_required_verification_count: 3, snap_pending_verification_count: 1, snap_person_pending_verification_count: 1, snap_is_entitled_to_expedited_service: true, snap_identity_verification_is_pending: true, snap_verification_due_date: "2026-10-11", snap_is_household_member: true, snap_immigration_status_verification_is_pending: false}, expect: past_due}
  - {id: CO-1394-T7, month: "2026-10", as_of: "2026-10-01", given: {snap_is_household_member: false}, expect: not_applicable}
  - {id: CO-1394-T8, month: "2026-10", as_of: "2026-10-01", given: {determination_date: "2026-10-15", snap_is_household_member: true, snap_household_members: [p1], snap_person_required_verification_count: 2, snap_pending_verification_count: 1, snap_is_entitled_to_expedited_service: false, snap_verification_due_date: "2026-10-11", snap_person_pending_verification_count: 1, snap_immigration_status_verification_is_pending: true, snap_noncitizen_documentation_due_date: "2026-10-31"}, expect: pending}
  - {id: CO-1394-T9, month: "2026-10", as_of: "2026-10-01", given: {determination_date: "2026-11-02", snap_is_household_member: true, snap_household_members: [p1], snap_person_required_verification_count: 2, snap_pending_verification_count: 1, snap_is_entitled_to_expedited_service: false, snap_verification_due_date: "2026-10-11", snap_person_pending_verification_count: 1, snap_immigration_status_verification_is_pending: true, snap_noncitizen_documentation_due_date: "2026-10-31"}, expect: past_due}
  - {id: CO-1394-T10, month: "2026-10", as_of: "2026-10-01", given: {determination_date: "2026-10-20", snap_is_household_member: true, snap_household_members: [p1], snap_person_required_verification_count: 3, snap_pending_verification_count: 1, snap_is_entitled_to_expedited_service: false, snap_verification_due_date: "2026-10-11", snap_person_pending_verification_count: 0, snap_immigration_status_verification_is_pending: false, snap_expense_verification_due_date: "2026-10-31"}, expect: pending}
