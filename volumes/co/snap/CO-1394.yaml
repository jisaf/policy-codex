id: CO-1394
name: "SNAP: verification status"
identifier: snap_verification_status
kind: derived
type: one of
options: [not_applicable, not_required, complete, members_excluded, postponed_expedited, pending, expenses_disallowed, past_due]
scope: person-month
program: SNAP
role: outcome
meaning: "Where this person's SNAP household stands on verification: not applicable (the person is not a member of a SNAP household); no verification required; complete; complete except that a sponsored non-citizen's sponsor information is outstanding, or a non-citizen's status documents, forty quarters or military connection, or a questionable citizen's proof of citizenship (4.505.51.C; snap_is_ineligible_pending_citizenship_verification, CO-4251), are still outstanding after the documentation due date, so that member is ineligible until they are provided and the rest of the household is determined (members excluded, 4.505.7.B-C, 4.505.6.F, I; snap_is_ineligible_pending_non_citizen_verification, CO-4154); postponed under expedited service (identity verified, other verification outstanding, within the postponement period, and the verification postponed at the last expedited certification completed, 4.205.11.C; snap_prior_expedited_postponed_verification_incomplete, CO-4254); pending within the time allowed (ten days from the request, to the thirtieth day after application when only a non-citizen's status document is outstanding, and to the thirtieth day after application when only deductible expenses are); past that time with only deductible expenses unverified (the deductions are disallowed); or past the time allowed with an eligibility factor unverified."
precision: "past_due states only that the time allowed has run with a required factor unverified; when the agency denies (on the thirtieth day, or after a notice of pending status) is application processing and outside this item: 7 CFR 273.2(h)(1)(i)(C) (S813) makes the delay the household's once at least 10 days from the request have passed (OQ-309 resolved). The due date and the household's request date are the evaluated person's. Final verification pass 2 N-2 (F-18): an eligible alien status element still pending after the member's own documentation due date (snap_noncitizen_documentation_due_date, CO-1617) is counted with the sponsor element for members_excluded, since the member is then ineligible and the rest of the household is determined (4.505.6.I); before that date it is pending as before."
derived: [case, [[not, snap_is_household_member], not_applicable], [["=", [sum, snap_household_members, [of, [P], snap_person_required_verification_count]], 0], not_required], [["=", snap_pending_verification_count, 0], complete], [["=", [sum, snap_household_members, ["+", [case, [[of, [P], snap_sponsor_verification_is_pending], 1], [else, 0]], [case, [[all, [of, [P], snap_immigration_status_verification_is_pending], [">", [det_date], [of, [P], snap_noncitizen_documentation_due_date]]], 1], [else, 0]], [case, [[of, [P], snap_is_ineligible_pending_citizenship_verification], 1], [else, 0]]]], snap_pending_verification_count], members_excluded], [[all, snap_is_entitled_to_expedited_service, [not, [otherwise, snap_prior_expedited_postponed_verification_incomplete, false]], ["=", [sum, snap_household_members, [case, [[of, [P], snap_identity_verification_is_pending], 1], [else, 0]]], 0], ["<=", [det_date], snap_expedited_postponement_end_date]], postponed_expedited], [["<=", [det_date], snap_verification_due_date], pending], [[all, [">", [sum, snap_household_members, [case, [[of, [P], snap_immigration_status_verification_is_pending], 1], [else, 0]]], 0], ["=", ["-", [sum, snap_household_members, [of, [P], snap_person_pending_verification_count]], [sum, snap_household_members, [case, [[of, [P], snap_immigration_status_verification_is_pending], 1], [else, 0]]]], 0], ["<=", [det_date], snap_noncitizen_documentation_due_date]], pending], [[all, ["=", [sum, snap_household_members, [of, [P], snap_person_pending_verification_count]], 0], ["<=", [det_date], snap_expense_verification_due_date]], pending], [["=", [sum, snap_household_members, [of, [P], snap_person_pending_verification_count]], 0], expenses_disallowed], [else, past_due]]
sources: [S1619, S800, S812, S813, S814, S816, S834, S835, S829, S1057, S1097, S818, S2954, S2955, S2957, S3051, S3062]
implemented: engine
tags: [verification, snap]
rationale: "No existing item reports a SNAP household's verification standing; the outcome lets a reviewer see whether a household awaits documents, has lost a deduction, or has failed to verify an eligibility factor. Fix round: a first not_applicable row (review C-4), the non-citizen's thirty days from application (C-2) and the thirty days to verify expenses (C-5)."
tests:
  - {id: CO-1394-T1, month: "2026-10", as_of: "2026-10-01", given: {snap_household_members: [p1], snap_person_required_verification_count: 0, snap_is_household_member: true}, expect: not_required}
  - {id: CO-1394-T2, month: "2026-10", as_of: "2026-10-01", given: {snap_household_members: [p1], snap_person_required_verification_count: 3, snap_pending_verification_count: 0, snap_is_household_member: true}, expect: complete}
  - {id: CO-1394-T3, month: "2026-10", as_of: "2026-10-01", given: {snap_sponsor_verification_is_pending: false, snap_immigration_status_verification_is_pending: false, determination_date: "2026-10-05", snap_household_members: [p1], snap_person_required_verification_count: 3, snap_pending_verification_count: 2, snap_is_entitled_to_expedited_service: true, snap_identity_verification_is_pending: false, snap_expedited_postponement_end_date: "2026-10-31", snap_is_household_member: true}, expect: postponed_expedited}
  - {id: CO-1394-T4, month: "2026-10", as_of: "2026-10-01", given: {snap_sponsor_verification_is_pending: false, snap_immigration_status_verification_is_pending: false, determination_date: "2026-10-05", snap_household_members: [p1], snap_person_required_verification_count: 3, snap_pending_verification_count: 2, snap_is_entitled_to_expedited_service: false, snap_verification_due_date: "2026-10-11", snap_is_household_member: true}, expect: pending}
  - {id: CO-1394-T5, month: "2026-10", as_of: "2026-10-01", given: {snap_sponsor_verification_is_pending: false, determination_date: "2026-11-05", snap_household_members: [p1], snap_person_required_verification_count: 3, snap_pending_verification_count: 1, snap_person_pending_verification_count: 0, snap_is_entitled_to_expedited_service: false, snap_verification_due_date: "2026-10-11", snap_is_household_member: true, snap_expense_verification_due_date: "2026-10-31", snap_immigration_status_verification_is_pending: false}, expect: expenses_disallowed}
  - {id: CO-1394-T6, month: "2026-10", as_of: "2026-10-01", given: {snap_sponsor_verification_is_pending: false, determination_date: "2026-10-20", snap_household_members: [p1], snap_person_required_verification_count: 3, snap_pending_verification_count: 1, snap_person_pending_verification_count: 1, snap_is_entitled_to_expedited_service: true, snap_identity_verification_is_pending: true, snap_verification_due_date: "2026-10-11", snap_is_household_member: true, snap_immigration_status_verification_is_pending: false}, expect: past_due}
  - {id: CO-1394-T7, month: "2026-10", as_of: "2026-10-01", given: {snap_sponsor_verification_is_pending: false, snap_is_household_member: false}, expect: not_applicable}
  - {id: CO-1394-T8, month: "2026-10", as_of: "2026-10-01", given: {snap_sponsor_verification_is_pending: false, determination_date: "2026-10-15", snap_is_household_member: true, snap_household_members: [p1], snap_person_required_verification_count: 2, snap_pending_verification_count: 1, snap_is_entitled_to_expedited_service: false, snap_verification_due_date: "2026-10-11", snap_person_pending_verification_count: 1, snap_immigration_status_verification_is_pending: true, snap_noncitizen_documentation_due_date: "2026-10-31"}, expect: pending}
  # Final verification pass 2 N-2 (F-18): the status document is still outstanding after the thirtieth day, so the
  # member is ineligible until it is provided and the rest of the household is determined (4.505.6.F, I): was past_due.
  - {id: CO-1394-T9, month: "2026-10", as_of: "2026-10-01", given: {snap_sponsor_verification_is_pending: false, determination_date: "2026-11-02", snap_is_household_member: true, snap_household_members: [p1], snap_person_required_verification_count: 2, snap_pending_verification_count: 1, snap_is_entitled_to_expedited_service: false, snap_verification_due_date: "2026-10-11", snap_person_pending_verification_count: 1, snap_immigration_status_verification_is_pending: true, snap_noncitizen_documentation_due_date: "2026-10-31"}, expect: members_excluded}
  - {id: CO-1394-T10, month: "2026-10", as_of: "2026-10-01", given: {snap_sponsor_verification_is_pending: false, determination_date: "2026-10-20", snap_is_household_member: true, snap_household_members: [p1], snap_person_required_verification_count: 3, snap_pending_verification_count: 1, snap_is_entitled_to_expedited_service: false, snap_verification_due_date: "2026-10-11", snap_person_pending_verification_count: 0, snap_immigration_status_verification_is_pending: false, snap_expense_verification_due_date: "2026-10-31"}, expect: pending}
  # Phase-10 sweep (OQ-380): only the sponsor's information is outstanding - the sponsored member is ineligible until it is provided, and the household is determined without that member (4.505.7.B).
  - {id: CO-1394-T11, month: "2026-10", as_of: "2026-10-01", given: {determination_date: "2026-10-25", snap_household_members: [p1, p2], snap_person_required_verification_count: 2, snap_pending_verification_count: 1, snap_sponsor_verification_is_pending: false, snap_immigration_status_verification_is_pending: false, snap_is_household_member: true}, others: {p2: {snap_person_required_verification_count: 1, snap_sponsor_verification_is_pending: true, snap_immigration_status_verification_is_pending: false}}, expect: members_excluded}
  - {id: CO-1394-T13, title: "C-12: the last expedited certification's postponed verification was never completed - no postponement, pending to the due date", month: "2026-10", as_of: "2026-10-01", given: {snap_sponsor_verification_is_pending: false, snap_immigration_status_verification_is_pending: false, determination_date: "2026-10-05", snap_household_members: [p1], snap_person_required_verification_count: 3, snap_pending_verification_count: 2, snap_is_entitled_to_expedited_service: true, snap_identity_verification_is_pending: false, snap_expedited_postponement_end_date: "2026-10-31", snap_is_household_member: true, snap_prior_expedited_postponed_verification_incomplete: true, snap_verification_due_date: "2026-10-15"}, expect: pending}
  # Time audit T-9: each comparison tested at its limit, with the two sides equal (the strict/inclusive flip of the comparison fails it).
  - {"id": "CO-1394-T14", "month": "2026-10", "as_of": "2026-10-01", "title": "T-9: snap_expedited_postponement_end_date equal to [\"det_date\"] (det_date at or under snap_expedited_postponement_end_date)", "given": {"snap_sponsor_verification_is_pending": false, "snap_immigration_status_verification_is_pending": false, "determination_date": "2026-10-05", "snap_household_members": ["p1"], "snap_person_required_verification_count": 3, "snap_pending_verification_count": 2, "snap_is_entitled_to_expedited_service": true, "snap_identity_verification_is_pending": false, "snap_expedited_postponement_end_date": "2026-10-05", "snap_is_household_member": true}, "expect": "postponed_expedited"}
  - {"id": "CO-1394-T15", "month": "2026-10", "as_of": "2026-10-01", "title": "T-9: snap_verification_due_date equal to [\"det_date\"] (det_date at or under snap_verification_due_date)", "given": {"snap_sponsor_verification_is_pending": false, "snap_immigration_status_verification_is_pending": false, "determination_date": "2026-10-05", "snap_household_members": ["p1"], "snap_person_required_verification_count": 3, "snap_pending_verification_count": 2, "snap_is_entitled_to_expedited_service": false, "snap_verification_due_date": "2026-10-05", "snap_is_household_member": true}, "expect": "pending"}
  - {"id": "CO-1394-T16", "month": "2026-10", "as_of": "2026-10-01", "title": "T-9: snap_noncitizen_documentation_due_date equal to [\"det_date\"] (det_date at or under snap_noncitizen_documentation_due_date)", "given": {"snap_sponsor_verification_is_pending": false, "determination_date": "2026-10-15", "snap_is_household_member": true, "snap_household_members": ["p1"], "snap_person_required_verification_count": 2, "snap_pending_verification_count": 1, "snap_is_entitled_to_expedited_service": false, "snap_verification_due_date": "2026-10-11", "snap_person_pending_verification_count": 1, "snap_immigration_status_verification_is_pending": true, "snap_noncitizen_documentation_due_date": "2026-10-15"}, "expect": "pending"}
  - {"id": "CO-1394-T17", "month": "2026-10", "as_of": "2026-10-01", "title": "T-9: snap_expense_verification_due_date equal to [\"det_date\"] (det_date at or under snap_expense_verification_due_date)", "given": {"snap_sponsor_verification_is_pending": false, "determination_date": "2026-11-05", "snap_household_members": ["p1"], "snap_person_required_verification_count": 3, "snap_pending_verification_count": 1, "snap_person_pending_verification_count": 0, "snap_is_entitled_to_expedited_service": false, "snap_verification_due_date": "2026-10-11", "snap_is_household_member": true, "snap_expense_verification_due_date": "2026-11-05", "snap_immigration_status_verification_is_pending": false}, "expect": "pending"}
