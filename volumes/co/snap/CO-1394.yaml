id: CO-1394
name: "SNAP: verification status"
identifier: snap_verification_status
kind: derived
type: one of
options: [not_required, complete, postponed_expedited, pending, expenses_disallowed, past_due]
scope: person-month
program: SNAP
role: outcome
meaning: "Where this person's SNAP household stands on verification: no verification required; complete; postponed under expedited service (identity verified, other verification outstanding, within the postponement period); pending within the time allowed; past the time allowed with only deductible expenses unverified (the deductions are disallowed); or past the time allowed with an eligibility factor unverified."
precision: past_due states only that the time allowed has run with a required factor unverified; when the agency denies (on the thirtieth day, or after a notice of pending status) is application processing and outside this item (OQ-309). The due date and the household's request date are the evaluated person's.
derived: [case, [["=", [sum, snap_household_members, [of, [P], snap_person_required_verification_count]], 0], not_required], [["=", snap_pending_verification_count, 0], complete], [[all, snap_is_entitled_to_expedited_service, ["=", [sum, snap_household_members, [case, [[of, [P], snap_identity_verification_is_pending], 1], [else, 0]]], 0], ["<=", [det_date], snap_expedited_postponement_end_date]], postponed_expedited], [["<=", [det_date], snap_verification_due_date], pending], [["=", [sum, snap_household_members, [of, [P], snap_person_pending_verification_count]], 0], expenses_disallowed], [else, past_due]]
sources: [S800, S812, S813, S814, S816, S834, S835]
implemented: engine
tags: [verification, snap]
open: [OQ-309]
rationale: No existing item reports a SNAP household's verification standing; the outcome lets a reviewer see whether a household awaits documents, has lost a deduction, or has failed to verify an eligibility factor.
tests:
  - {id: CO-1394-T1, month: "2026-10", as_of: "2026-10-01", given: {snap_household_members: [p1], snap_person_required_verification_count: 0}, expect: not_required}
  - {id: CO-1394-T2, month: "2026-10", as_of: "2026-10-01", given: {snap_household_members: [p1], snap_person_required_verification_count: 3, snap_pending_verification_count: 0}, expect: complete}
  - {id: CO-1394-T3, month: "2026-10", as_of: "2026-10-01", given: {determination_date: "2026-10-05", snap_household_members: [p1], snap_person_required_verification_count: 3, snap_pending_verification_count: 2, snap_is_entitled_to_expedited_service: true, snap_identity_verification_is_pending: false, snap_expedited_postponement_end_date: "2026-10-31"}, expect: postponed_expedited}
  - {id: CO-1394-T4, month: "2026-10", as_of: "2026-10-01", given: {determination_date: "2026-10-05", snap_household_members: [p1], snap_person_required_verification_count: 3, snap_pending_verification_count: 2, snap_is_entitled_to_expedited_service: false, snap_verification_due_date: "2026-10-11"}, expect: pending}
  - {id: CO-1394-T5, month: "2026-10", as_of: "2026-10-01", given: {determination_date: "2026-10-20", snap_household_members: [p1], snap_person_required_verification_count: 3, snap_pending_verification_count: 1, snap_person_pending_verification_count: 0, snap_is_entitled_to_expedited_service: false, snap_verification_due_date: "2026-10-11"}, expect: expenses_disallowed}
  - {id: CO-1394-T6, month: "2026-10", as_of: "2026-10-01", given: {determination_date: "2026-10-20", snap_household_members: [p1], snap_person_required_verification_count: 3, snap_pending_verification_count: 1, snap_person_pending_verification_count: 1, snap_is_entitled_to_expedited_service: true, snap_identity_verification_is_pending: true, snap_verification_due_date: "2026-10-11"}, expect: past_due}
