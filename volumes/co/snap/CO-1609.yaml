identifier: snap_age_verification_is_pending
kind: derived
type: yes/no
scope: person-month
program: SNAP
role: outcome
meaning: Whether SNAP requires verification of the person's questionable age and it has not been provided.
derived: [all, snap_requires_verification_of_age, [not, age_is_verified]]
