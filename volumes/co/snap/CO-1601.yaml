id: CO-1601
name: "SNAP: immigration status verification is pending"
identifier: snap_immigration_status_verification_is_pending
kind: derived
type: yes/no
scope: person-month
program: SNAP
role: outcome
meaning: "Whether SNAP requires verification of the person's declared immigration status (SAVE, or a document submitted to USCIS) and it has not been provided; or, for a lawful permanent resident whose eligibility rests on forty qualifying quarters or a military connection, whether that factor must be verified (7 CFR 273.2(f)(1)(ii)(A); 10 CCR 2506-1 4.505.61) and has not been - the quarters not being pending while SSA reviews them, for snap_quarters_review_certification_months from its original determination (4.505.6.F.2)."
precision: "False where SNAP verification does not apply to the person (snap_is_household_member, CO-304; case worker review B2). Due by: snap_noncitizen_documentation_due_date (CO-1617: thirty days after application, or ten days from the request if later). Final verification V-4: the forty quarters (snap_requires_verification_of_qualifying_quarters, CO-3736; qualifying_quarters_verified, CO-3733) and the military connection (snap_requires_verification_of_military_connection, CO-3738; military_connection_verified, CO-3737) are factors of the person's eligible alien status (273.2(f)(1)(ii)(A), S802), so they share this element, its count and its documentation period (4.505.6.E, S2516). The SSA review runs in calendar months from the month of ssa_quarters_review_start_date (CO-3734), read as no review when not stated."
derived: [all, snap_is_household_member, [any, [all, snap_requires_verification_of_immigration_status, [not, immigration_status_is_verified_or_submitted]], [all, snap_requires_verification_of_qualifying_quarters, [not, qualifying_quarters_verified], [not, [otherwise, ["<", [det_month], [months_after, snap_quarters_review_certification_months, [month_of, ssa_quarters_review_start_date]]], false]]], [all, snap_requires_verification_of_military_connection, [not, military_connection_verified]]]]
sources: [S802, S828, S829, S2516]
implemented: engine
tags: [verification, snap]
rationale: "Review U-1: the count items held this test as an anonymous arm, so no outcome told a worker which document was outstanding and for whom; the count now sums this item."
tests:
  - {id: CO-1601-T1, month: "2026-10", as_of: "2026-10-01", given: {snap_is_household_member: true, snap_requires_verification_of_immigration_status: true, immigration_status_verified_by_electronic_data_source: false, immigration_status_verification_document_received: false}, expect: true}
  - {id: CO-1601-T2, month: "2026-10", as_of: "2026-10-01", given: {snap_is_household_member: true, snap_requires_verification_of_immigration_status: true, immigration_status_verified_by_electronic_data_source: true, snap_requires_verification_of_qualifying_quarters: false, snap_requires_verification_of_military_connection: false}, expect: false}
  # Final verification V-4: the forty quarters and the military connection (273.2(f)(1)(ii)(A); 4.505.61, 4.505.6.F.2).
  - {id: CO-1601-T3, title: "SAVE verified, the forty quarters not yet verified", month: "2026-10", as_of: "2026-10-01", given: {snap_is_household_member: true, snap_requires_verification_of_immigration_status: true, immigration_status_verified_by_electronic_data_source: true, snap_requires_verification_of_qualifying_quarters: true, qualifying_quarters_verified: false}, expect: true}
  - {id: CO-1601-T4, title: "SSA has the quarters under review since August 2026: certified through January 2027", month: "2026-10", as_of: "2026-10-01", given: {snap_is_household_member: true, snap_requires_verification_of_immigration_status: true, immigration_status_verified_by_electronic_data_source: true, snap_requires_verification_of_qualifying_quarters: true, qualifying_quarters_verified: false, ssa_quarters_review_start_date: "2026-08-10", snap_requires_verification_of_military_connection: false}, expect: false}
  - {id: CO-1601-T5, title: "The SSA review began in March 2026: past six months, pending again", month: "2026-10", as_of: "2026-10-01", given: {snap_is_household_member: true, snap_requires_verification_of_immigration_status: true, immigration_status_verified_by_electronic_data_source: true, snap_requires_verification_of_qualifying_quarters: true, qualifying_quarters_verified: false, ssa_quarters_review_start_date: "2026-03-10"}, expect: true}
  - {id: CO-1601-T6, title: "A military connection on which eligibility rests, not yet verified", month: "2026-10", as_of: "2026-10-01", given: {snap_is_household_member: true, snap_requires_verification_of_immigration_status: true, immigration_status_verified_by_electronic_data_source: true, snap_requires_verification_of_qualifying_quarters: false, snap_requires_verification_of_military_connection: true, military_connection_verified: false}, expect: true}
