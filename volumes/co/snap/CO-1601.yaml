id: CO-1601
name: "SNAP: immigration status verification is pending"
identifier: snap_immigration_status_verification_is_pending
kind: derived
type: yes/no
scope: person-month
program: SNAP
role: outcome
meaning: Whether SNAP requires verification of the person's declared immigration status (SAVE, or a document submitted to USCIS) and it has not been provided.
derived: [all, snap_requires_verification_of_immigration_status, [not, immigration_status_is_verified_or_submitted]]
sources: [S802, S828, S829]
implemented: engine
tags: [verification, snap]
rationale: "Review U-1: the count items held this test as an anonymous arm, so no outcome told a worker which document was outstanding and for whom; the count now sums this item."
tests:
  - {id: CO-1601-T1, month: "2026-10", as_of: "2026-10-01", given: {snap_requires_verification_of_immigration_status: true, immigration_status_verified_by_electronic_data_source: false, immigration_status_verification_document_received: false}, expect: true}
  - {id: CO-1601-T2, month: "2026-10", as_of: "2026-10-01", given: {snap_requires_verification_of_immigration_status: true, immigration_status_verified_by_electronic_data_source: true}, expect: false}
