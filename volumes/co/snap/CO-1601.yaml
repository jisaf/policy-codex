id: CO-1601
name: "SNAP: immigration status verification is pending"
identifier: snap_immigration_status_verification_is_pending
kind: derived
type: yes/no
scope: person-month
program: SNAP
role: outcome
meaning: Whether SNAP requires verification of the person's declared immigration status (SAVE, or a document submitted to USCIS) and it has not been provided.
precision: "False where SNAP verification does not apply to the person (snap_is_household_member, CO-304; case worker review B2). Due by: snap_noncitizen_documentation_due_date (CO-1617: thirty days after application, or ten days from the request if later)."
derived: [all, snap_is_household_member, [all, snap_requires_verification_of_immigration_status, [not, immigration_status_is_verified_or_submitted]]]
sources: [S802, S828, S829]
implemented: engine
tags: [verification, snap]
rationale: "Review U-1: the count items held this test as an anonymous arm, so no outcome told a worker which document was outstanding and for whom; the count now sums this item."
tests:
  - {id: CO-1601-T1, month: "2026-10", as_of: "2026-10-01", given: {snap_is_household_member: true, snap_requires_verification_of_immigration_status: true, immigration_status_verified_by_electronic_data_source: false, immigration_status_verification_document_received: false}, expect: true}
  - {id: CO-1601-T2, month: "2026-10", as_of: "2026-10-01", given: {snap_is_household_member: true, snap_requires_verification_of_immigration_status: true, immigration_status_verified_by_electronic_data_source: true}, expect: false}
