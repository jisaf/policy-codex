id: CO-343
name: "SNAP: household countable resources"
identifier: snap_household_countable_resources
kind: derived
type: money
scope: person
program: SNAP
meaning: This person's SNAP household's total countable resources under 7 CFR 273.8 (liquid and non-liquid), the sum of every household member's own countable resources, including ineligible or disqualified members but not an ineligible student, plus the resources deemed to a sponsored member from the member's sponsor (snap_sponsor_deemed_resources, CO-3702).
precision: "Sums liquid_resources_value plus snap_countable_nonliquid_resources over the whole purchase-and-prepare unit, not snap_eligible_household_members, because 10 CCR 2506-1 4.411.1,B,1,a and B,2,a (S45, S46) count a disqualified or ineligible member's resources in full to the household whenever the household must meet a resource standard. Final verification F-6: an ineligible student is a non-household member whose resources are not available to the household (4.411.2.C, S2508), so the sum runs over snap_household_members_other_than_ineligible_students (CO-3714). F-2: each member's deemed sponsor resources are added (4.305.2.C, D.6, S2502). Final verification pass 2 N-8: each member's liquid resources are read net of the 4.409 and 4.410 exclusions held in liquid form (snap_countable_liquid_resources, CO-4176): tax refunds and earned income tax credits within twelve months, tax-deferred education accounts, and resources the member cannot reach."
derived: [sum, snap_household_members_other_than_ineligible_students, [+, [of, [P], snap_countable_liquid_resources], [of, [P], snap_countable_nonliquid_resources], [of, [P], snap_sponsor_deemed_resources]]]
sources: [S45, S46, S56, S57, S2502, S2508, S2966, S2967, S2968]
implemented: engine
tags: [resources, state_election]
rationale: "No existing item aggregates resources to the household level; snap_meets_resource_limit and snap_is_entitled_to_expedited_service both need this single total, built by summing the person-level liquid_resources_value supplied fact over every household member per 4.411.1's full-inclusion rule. Fix-round (C-7): this item previously summed only liquid_resources_value, but the 273.8/4.408,E limits it feeds are limits on all countable resources, not only liquid ones (that fact's own meaning says 'liquid'). Now also sums the new snap_countable_nonliquid_resources (CO-074). snap_is_entitled_to_expedited_service (CO-348) is unaffected and correctly continues to read only the liquid-resources fact, per 7 CFR 273.2(i)(1) (S58). Same-word SW-31: reads the neutral liquid_resources_value (CO-3390) directly; SNAP counts all of it (7 CFR 273.8(c)(1)), so liquid_resources_value (CO-031) is retired."
tests:
  - {id: CO-343-T1, as_of: "2026-10-01", given: {snap_resides_in_institution_providing_meals: false, liquid_resources_value: 500, snap_countable_nonliquid_resources: 0, snap_is_ineligible_student: false, snap_sponsor_deemed_resources: 0}, others: {p2: {snap_resides_in_institution_providing_meals: false, liquid_resources_value: 300, snap_countable_nonliquid_resources: 0, snap_is_ineligible_student: false, snap_sponsor_deemed_resources: 0}}, relationships: [[spouse, p1, p2]], expect: 800}
  - {id: CO-343-T2, as_of: "2026-10-01", given: {snap_resides_in_institution_providing_meals: false, liquid_resources_value: 0, snap_countable_nonliquid_resources: 0, snap_is_ineligible_student: false, snap_sponsor_deemed_resources: 0}, others: {}, relationships: [], expect: 0}
  - {id: CO-343-T3, as_of: "2026-10-01", given: {snap_resides_in_institution_providing_meals: false, liquid_resources_value: 500, snap_countable_nonliquid_resources: 4000, snap_is_ineligible_student: false, snap_sponsor_deemed_resources: 0}, others: {}, relationships: [], expect: 4500}
  # Final verification F-6 and F-2.
  - {id: CO-343-T4, title: "An ineligible student's $2,000 savings are not counted (4.411.2.C)", as_of: "2026-10-01", given: {snap_resides_in_institution_providing_meals: false, liquid_resources_value: 500, snap_countable_nonliquid_resources: 0, snap_is_ineligible_student: false, snap_sponsor_deemed_resources: 0}, others: {p2: {snap_resides_in_institution_providing_meals: false, liquid_resources_value: 2000, snap_countable_nonliquid_resources: 0, snap_is_ineligible_student: true, snap_meets_citizenship_requirement: true, snap_sponsor_deemed_resources: 0}}, relationships: [[spouse, p1, p2]], expect: 500}
  - {id: CO-343-T5, title: "A sponsored member with $550 deemed from the sponsor: 500 + 550", as_of: "2026-10-01", given: {snap_resides_in_institution_providing_meals: false, liquid_resources_value: 500, snap_countable_nonliquid_resources: 0, snap_is_ineligible_student: false, snap_sponsor_deemed_resources: 550}, others: {}, relationships: [], expect: 1050}
  - {id: CO-343-T6, title: "N-8: $5,500 held, of which $2,500 is a federal refund received three months ago - $3,000 counted", as_of: "2026-10-01", given: {snap_resides_in_institution_providing_meals: false, liquid_resources_value: 5500, federal_tax_refunds_held_value: 2500, snap_countable_nonliquid_resources: 0, snap_is_ineligible_student: false, snap_sponsor_deemed_resources: 0}, others: {}, relationships: [], expect: 3000}
