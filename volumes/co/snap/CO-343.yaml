id: CO-343
name: "SNAP: household countable resources"
identifier: snap_household_countable_resources
kind: derived
type: money
scope: person
program: SNAP
meaning: This person's SNAP household's total countable resources under 7 CFR 273.8 (liquid and non-liquid), the sum of every household member's own countable resources, including ineligible or disqualified members.
precision: Sums liquid_resources_value plus snap_countable_nonliquid_resources over the whole purchase-and-prepare unit (snap_household_members), not snap_eligible_household_members, because 10 CCR 2506-1 4.411.1,B,1,a and B,2,a (S45, S46) count a disqualified or ineligible member's resources in full to the household whenever the household must meet a resource standard.
derived: [sum, snap_household_members, [+, [of, [P], liquid_resources_value], [of, [P], snap_countable_nonliquid_resources]]]
sources: [S45, S46, S56, S57]
implemented: engine
tags: [resources, state_election]
rationale: "No existing item aggregates resources to the household level; snap_meets_resource_limit and snap_is_entitled_to_expedited_service both need this single total, built by summing the person-level liquid_resources_value supplied fact over every household member per 4.411.1's full-inclusion rule. Fix-round (C-7): this item previously summed only liquid_resources_value, but the 273.8/4.408,E limits it feeds are limits on all countable resources, not only liquid ones (that fact's own meaning says 'liquid'). Now also sums the new snap_countable_nonliquid_resources (CO-074). snap_is_entitled_to_expedited_service (CO-348) is unaffected and correctly continues to read only the liquid-resources fact, per 7 CFR 273.2(i)(1) (S58). Same-word SW-31: reads the neutral liquid_resources_value (CO-3390) directly; SNAP counts all of it (7 CFR 273.8(c)(1)), so liquid_resources_value (CO-031) is retired."
tests:
  - {id: CO-343-T1, as_of: "2026-10-01", given: {snap_resides_in_institution_providing_meals: false, liquid_resources_value: 500, snap_countable_nonliquid_resources: 0}, others: {p2: {snap_resides_in_institution_providing_meals: false, liquid_resources_value: 300, snap_countable_nonliquid_resources: 0}}, relationships: [[spouse, p1, p2]], expect: 800}
  - {id: CO-343-T2, as_of: "2026-10-01", given: {snap_resides_in_institution_providing_meals: false, liquid_resources_value: 0, snap_countable_nonliquid_resources: 0}, others: {}, relationships: [], expect: 0}
  - {id: CO-343-T3, as_of: "2026-10-01", given: {snap_resides_in_institution_providing_meals: false, liquid_resources_value: 500, snap_countable_nonliquid_resources: 4000}, others: {}, relationships: [], expect: 4500}
