id: CO-343
name: "SNAP: household countable resources"
identifier: snap_household_countable_resources
kind: derived
type: money
scope: person-month
program: SNAP
meaning: "This person's SNAP household's total countable resources in the month under 7 CFR 273.8 (liquid and non-liquid), the sum of every household member's own countable resources, including ineligible or disqualified members but not an ineligible student, and leaving out the resources of a member who receives SSI or public assistance (Colorado Works cash, or Old Age Pension, Aid to the Needy Disabled or Aid to the Blind), plus the resources deemed to a sponsored member from the member's sponsor (snap_sponsor_deemed_resources, CO-3702)."
precision: "Sums each member's countable liquid and non-liquid resources (snap_countable_liquid_resources, CO-4176, and snap_countable_nonliquid_resources, CO-074) over the whole purchase-and-prepare unit, not snap_eligible_household_members, because 10 CCR 2506-1 4.411.1,B,1,a and B,2,a (S45, S46) count a disqualified or ineligible member's resources in full to the household whenever the household must meet a resource standard. Final verification F-6: an ineligible student is a non-household member whose resources are not available to the household (4.411.2.C, S2508), so the sum runs over snap_household_members_other_than_ineligible_students (CO-3714). F-2: each member's deemed sponsor resources are added (4.305.2.C, D.6, S2502). Final verification pass 2 N-8: each member's liquid resources are read net of the 4.409 and 4.410 exclusions held in liquid form (snap_countable_liquid_resources, CO-4176): tax refunds and earned income tax credits within twelve months, tax-deferred education accounts, and resources the member cannot reach. Resource records, step H1 SNAP (docs/reviews/records-holdings-snap-af.md): each member's resources are read from the member's holdings records through snap_countable_liquid_resources (CO-4176) and snap_countable_nonliquid_resources (CO-074), never from liquid_resources_value; a member whose holdings are not stated is cannot determine, as a member who did not state liquid_resources_value was. Coverage pass 4 for SNAP S4-11 (OQ-1263 resolved): per month, since prospective budgeting reads \"anticipated income and circumstances during the issuance month\" (10 CCR 2506-1 4.402.1.A, S4734): the household (CO-3714) and the deemed resources (CO-3702) are the month's. Before, the item was per person and read on the determination date in every month. Coverage pass 4 for SNAP resources (docs/reviews/coverage4-snap-resources.md): per month (SR-9): each member's resources are those of the month evaluated (snap_countable_liquid_resources, CO-4176; snap_countable_nonliquid_resources, CO-074), valued on the month's day. SR-2: 7 CFR 273.8(e)(17) (S4821; the statute override; OQ-1306): a member who receives SSI or public assistance (receives_ssi, receives_tanf_cash, receives_state_cash_assistance, the facts 4.206.C.1.a's basic categorical eligibility reads; a recipient whose benefits are authorized, suspended or recouped is a recipient by those facts' meanings) has no resources counted, read only for a member with resources: a member with none reads nothing more. The sponsor's deemed resources are added for every member, as before."
statute_override: "Federal regulation overrides 10 CCR 2506-1 4.410, which lists no exclusion for the resources of a household member who receives SSI or public assistance: 7 CFR 273.8(e)(17), on file as in force on 2026-11-19 (D-191), excludes \"The resources of a household member who receives SSI or PA benefits\", and 273.8(a) requires the State agency to apply the uniform national resource standards to all applicant households; a member who receives SSI, Colorado Works cash or Colorado's Old Age Pension, Aid to the Needy Disabled or Aid to the Blind (the public assistance of Colorado's basic categorical eligibility, 4.206.C.1.a) has no resources counted to the household (OQ-1306)."
derived: ["sum", "snap_household_members_other_than_ineligible_students", ["+", ["case", [["=", ["+", ["of", ["P"], "snap_countable_liquid_resources"], ["of", ["P"], "snap_countable_nonliquid_resources"]], 0], 0], [["any", ["of", ["P"], "receives_ssi"], ["of", ["P"], "receives_tanf_cash"], ["of", ["P"], "receives_state_cash_assistance"]], 0], ["else", ["+", ["of", ["P"], "snap_countable_liquid_resources"], ["of", ["P"], "snap_countable_nonliquid_resources"]]]], ["of", ["P"], "snap_sponsor_deemed_resources"]]]
sources: [S45, S46, S56, S57, S2502, S2508, S2966, S2967, S2968, S4823, S4821, S4820]
open: [OQ-1306, OQ-1310]
implemented: engine
tags: [resources, state_election]
rationale: "No existing item aggregates resources to the household level; snap_meets_resource_limit and snap_is_entitled_to_expedited_service both need this single total, built by summing the person-level liquid_resources_value supplied fact over every household member per 4.411.1's full-inclusion rule. Fix-round (C-7): this item previously summed only liquid_resources_value, but the 273.8/4.408,E limits it feeds are limits on all countable resources, not only liquid ones (that fact's own meaning says 'liquid'). Now also sums the new snap_countable_nonliquid_resources (CO-074). snap_is_entitled_to_expedited_service (CO-348) is unaffected and correctly continues to read only the liquid-resources fact, per 7 CFR 273.2(i)(1) (S58). Same-word SW-31: reads the neutral liquid_resources_value (CO-3390) directly; SNAP counts all of it (7 CFR 273.8(c)(1)), so liquid_resources_value (CO-031) is retired."
