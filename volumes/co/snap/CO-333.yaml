id: CO-333
name: "SNAP: counted income of an ineligible member"
identifier: snap_counted_income_of_ineligible_member
kind: derived
type: money
scope: person-month
program: SNAP
meaning: The amount of an ineligible household member's own gross income that is counted as income to the remaining, eligible household members - the full amount for an IPV, work-sanction, or fleeing-felon disqualification, and a pro rata share (all but the disqualified member's own share, dividing evenly by the number of household members) for an ineligible non-citizen. Zero for a member who is not an ineligible member.
precision: "The pro rata share divides the member's income evenly among every household member counted by snap_household_members (including the ineligible member), then counts all but that one share; n is the count of that person's whole purchase-and-prepare unit, not just the eligible members. Engineering follow-up 5: a prorated member with no household (snap_household_members empty, as for a person who is not a household member) has nothing counted to any household, so the share is 0 rather than a division by zero. Final verification F-6: n counts the members other than an ineligible student (snap_household_members_other_than_ineligible_students, CO-3714), whom 4.411.2.C (S2508) treats as a non-household member not considered in the allotment."
assumption: "Colorado's election at 10 CCR 2506-1 4.411.1,B,2,b (S46) to prorate the income of an ineligible non-citizen, a member who refused to provide an SSN and a time-limited ABAWD, rather than count it in full, is modeled here through snap_is_ineligible_member_prorated (CO-2565); the grounds of 4.411.1,B,1,a (S45) and 7 CFR 273.11(c)(1) (IPV, work-requirement sanction, a voluntary quit, fleeing felon, drug felony, a 273.11(s) felony) count income in full through snap_is_disqualified_member_counted_in_full (CO-2302). CDHS review B-4: the ABAWD and SSN grounds were not modeled before this round."
derived: [case, [snap_is_disqualified_member_counted_in_full, snap_person_gross_income], [snap_is_ineligible_member_prorated, [case, [["=", [count, snap_household_members_other_than_ineligible_students], 0], 0], [else, ["*", snap_person_gross_income, ["/", ["-", [count, snap_household_members_other_than_ineligible_students], 1], [count, snap_household_members_other_than_ineligible_students]]]]]], [else, 0]]
sources: [S45, S46, S1602, S1814]
implemented: engine
tags: [income, state_election]
rationale: 10 CCR 2506-1 4.411.1,B,1-2 (S45, S46) states two different treatments of a disqualified or ineligible member's income depending on the reason for exclusion; no existing item distinguishes full-count from pro rata treatment, and snap_household_gross_income needs this per-member figure to aggregate correctly.
