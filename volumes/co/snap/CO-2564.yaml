id: CO-2564
name: "SNAP: is ineligible under the ABAWD time limit"
identifier: snap_is_ineligible_abawd
kind: derived
type: yes/no
scope: person-month
program: SNAP
meaning: "This person is an ABAWD (able-bodied adult without dependents) who has used the three countable months of the thirty-six-month period and has neither regained eligibility nor entered the additional three months, so is ineligible to participate in SNAP while the household stays eligible (10 CCR 2506-1 4.304.4.A.5, 4.411.1.A; 7 CFR 273.11(c)(2)): snap_abawd_time_limit_status (CO-418) is limit_reached in the month evaluated."
precision: "Coverage pass 4 for SNAP S4-19 (OQ-1263 resolved): the time-limit status is read in the month evaluated, since countable months \"are accrued when an ABAWD received SNAP benefits for the full benefit month\" (4.311.3.A, S1014) and prospective budgeting reads the circumstances of the issuance month (4.402.1.A, S4734): an application month in which the member had not yet reached the limit is not read with the determination month's status. Before, household composition was stated once per determination, so the status was read for the month containing the determination date in every month. A member outside the ABAWD age range or exempt is not_subject and so not ineligible; a status that is unknown leaves this unknown."
derived: ["=", snap_abawd_time_limit_status, limit_reached]
sources: [S1810, S1812, S1814, S1014, S4734]
implemented: engine
tags: [snap, abawd]
rationale: "CDHS review B-4: snap_abawd_time_limit_status (CO-418) was computed but nothing read it, so a time-limited member stayed in the eligible household and in the allotment. snap_is_ineligible_member (CO-311) is per person and needs a per-person reading of the monthly status."
nearest: [CO-418]
tests:
  - {id: CO-2564-T1, month: "2026-10", as_of: "2026-10-01", title: "A 58-year-old who has used his three months", persons: {p1: {months: {"2026-10": {snap_abawd_time_limit_status: limit_reached}}}}, expect: true}
  - {id: CO-2564-T2, month: "2026-10", as_of: "2026-10-01", title: "Within the limit", persons: {p1: {months: {"2026-10": {snap_abawd_time_limit_status: within_limit}}}}, expect: false}
  - {id: CO-2564-T3, month: "2026-10", as_of: "2026-10-01", title: "Not subject (outside the age range or exempt)", persons: {p1: {months: {"2026-10": {snap_abawd_time_limit_status: not_subject}}}}, expect: false}
  # Coverage pass 4 S4-19: determined 2026-11-05; the member was within the limit in October and reached it in November (4.311.3.A).
  # Read in each month: October false, November true. Before, the determination month's limit_reached in both.
  - {id: CO-2564-T4, month: "2026-10", as_of: "2026-11-05", title: "S4-19: the application month, before the limit is reached: not ineligible", persons: {p1: {months: {"2026-10": {snap_abawd_time_limit_status: within_limit}, "2026-11": {snap_abawd_time_limit_status: limit_reached}}}}, expect: false}
  - {id: CO-2564-T5, month: "2026-11", as_of: "2026-11-05", title: "S4-19: the determination month, the limit reached: ineligible", persons: {p1: {months: {"2026-10": {snap_abawd_time_limit_status: within_limit}, "2026-11": {snap_abawd_time_limit_status: limit_reached}}}}, expect: true}
