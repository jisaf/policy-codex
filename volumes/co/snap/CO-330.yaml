id: CO-330
name: "SNAP: person earned income"
identifier: snap_person_earned_income
kind: derived
type: money
scope: person-month
program: SNAP
meaning: "The person's earned income for the month for SNAP: wages as SNAP counts them (snap_person_wages, CO-4324: converted from the pay schedule or averaged under a contract) plus net self-employment income (gross receipts less the allowable costs of producing it, snap_self_employment_income, CO-1702) plus net income from boarders (snap_boarder_income, CO-4165), which 10 CCR 2506-1 4.403.2 treats as self-employment income, plus training allowances other than WIOA (4.403.B.1) and Domestic Volunteer Service Act Title I (VISTA) payments to a person who was not receiving SNAP or public assistance on joining (4.403.A.2, C), less the earned income 4.405 excludes (snap_excluded_earned_income, CO-2338)."
precision: "Vocabulary fix round (R-1): reads gross wages (wages_gross, CO-023) and SNAP's own self-employment net (CO-1702). CDHS review C-2: the earnings of a child student (snap_student_earnings_are_excluded, CO-2569; 7 CFR 273.9(c)(7)) are excluded in full. For a striking member whose income before the strike was higher than the current income, the difference is added (snap_striker_income_above_current, CO-3503; 7 CFR 273.1(e)(2), S1816; OQ-534), so the member's counted income is the higher of the two. Final verification pass 2 N-5: boarder income net of the cost of doing business is added here, so the earned income deduction applies to it (4.403.2.C, S2963). N-6: in a destitute household's month of application (snap_is_destitute_application_month, CO-4168) the earned income received after the date of application (CO-4166) is left out (4.406.1.A, S2964). Coverage review snap-financial CF-1 and CF-3: the 4.405 exclusions of earned income are now derived from neutral receipt facts (CO-2338; OQ-390), the wages are SNAP's converted or averaged figure (CO-4324), and the training allowances and VISTA payments that the unearned income facts state but 4.403 counts as earned income are added here (they are left out of unearned income by CO-2339), so the earned income deduction applies to them. Coverage pass 3 C3-1: the wages, training allowances and VISTA payments, less the 4.405 exclusions and the destitute month's later receipts, are one item (snap_person_earned_income_other_than_self_employment, CO-4930) that the earned-income verification (CO-1376) also reads; the sum is unchanged."
derived: [case, [snap_student_earnings_are_excluded, 0], [else, ["+", [max, 0, ["+", snap_person_earned_income_other_than_self_employment, snap_self_employment_income, snap_boarder_income]], snap_striker_income_above_current]]]
sources: [S1620, S41, S1817, S1816, S2963, S2964, S3106, S3108, S3112]
implemented: engine
tags: [income]
rationale: 7 CFR 273.9(b)(1) (S41) defines earned income as wages/salaries plus self-employment net income; no existing item combines the two supplied income facts into the single countable earned-income figure snap_household_earned_income and snap_person_gross_income need.
tests:
  - {id: CO-330-T1, month: "2026-10", given: {receipts: [], wages_gross: 2380, child_support_paid_legally_obligated: 0, self_employment_gross_receipts: 0, self_employment_net_earnings_for_tax: 0, earnings: [{kind: wages, amount: 2380}]}, expect: 2380}
  - {id: CO-330-T2, month: "2026-10", given: {receipts: [], wages_gross: 500, child_support_paid_legally_obligated: 0, self_employment_gross_receipts: 300, snap_self_employment_costs: 0, earnings: [{kind: wages, amount: 500}, {kind: self_employment_receipts, amount: 300}]}, expect: 800}
  - {id: CO-330-T3, month: "2026-10", given: {receipts: [], wages_gross: 2380, self_employment_gross_receipts: 0, self_employment_net_earnings_for_tax: 0, snap_excluded_earned_income: 380, earnings: [{kind: wages, amount: 2380}]}, expect: 2000}
  - {id: CO-330-T4, month: "2026-10", as_of: "2026-10-01", given: {snap_student_earnings_are_excluded: true, wages_gross: 600, earnings: [{kind: wages, amount: 600}, {kind: self_employment_receipts}]}, title: "C-2: a 16-year-old student's $600 of wages are excluded", expect: 0}
  - {id: CO-330-T5, month: "2026-10", given: {receipts: [], snap_student_earnings_are_excluded: false, wages_gross: 0, self_employment_gross_receipts: 0, snap_self_employment_costs: 0, snap_striker_income_above_current: 2000, earnings: []}, title: "OQ-534: a striker with no current earnings counts the $2,000 by which the pre-strike income was higher", expect: 2000}
  - {id: CO-330-T6, month: "2026-10", as_of: "2026-10-01", given: {receipts: [], snap_student_earnings_are_excluded: false, wages_gross: 1000, self_employment_gross_receipts: 0, snap_striker_income_above_current: 0, room_and_board_payments_received: 700, room_and_board_payers_count: 1, earnings: [{kind: wages, amount: 1000}, {kind: boarder_payments, amount: 700, provides: room_and_board, boarders: 1}]}, title: "N-5: $1,000 wages and one boarder paying $700 ($394 net of the $306 cost of doing business)", expect: 1394}
  - {id: CO-330-T7, month: "2026-10", as_of: "2026-10-12", given: {receipts: [], snap_student_earnings_are_excluded: false, wages_gross: 1500, self_employment_gross_receipts: 0, snap_striker_income_above_current: 0, snap_is_destitute_application_month: true, snap_earned_income_received_after_application_date: 900, earnings: [{kind: wages, amount: 600}, {kind: wages, amount: 900, month: "2026-10"}]}, title: "N-6: destitute farmworker, applied on the 12th; $900 of the month's $1,500 wages paid after that date", expect: 600}
  - {id: CO-330-T8, month: "2026-11", as_of: "2026-11-15", given: {snap_student_earnings_are_excluded: false, wages_gross: 0, self_employment_gross_receipts: 0, snap_striker_income_above_current: 0, receipts: [{kind: social_security}, {kind: ssi}, {kind: pension}, {kind: unemployment_compensation}, {kind: child_support}, {kind: colorado_works_cash}, {kind: adult_financial_cash}, {kind: tax_exempt_interest}, {kind: vocational_training_allowance, amount: 400}, {kind: other_taxable}, {kind: other_nontaxable}], earnings: []}, title: "CF-1: $400 of a non-WIOA training allowance is earned income", expect: 400}
  - {id: CO-330-T9, month: "2026-11", as_of: "2026-11-15", given: {snap_student_earnings_are_excluded: false, wages_gross: 0, self_employment_gross_receipts: 0, snap_striker_income_above_current: 0, received_snap_or_public_assistance_when_joined_vista: false, receipts: [{kind: social_security}, {kind: ssi}, {kind: pension}, {kind: unemployment_compensation}, {kind: child_support}, {kind: colorado_works_cash}, {kind: adult_financial_cash}, {kind: tax_exempt_interest}, {kind: dvsa_title_i_volunteer_payment, amount: 600}, {kind: other_taxable}, {kind: other_nontaxable}], earnings: []}, title: "CF-1: $600 of VISTA payments to a volunteer who was not on SNAP when joining are earned income; to one who was, nothing", expect: 600}
  - {id: CO-330-T10, month: "2027-01", as_of: "2027-01-15", given: {receipts: [], snap_student_earnings_are_excluded: false, wages_gross: 1250, wages_pay_frequency: weekly, wages_gross_per_pay_period: 250, self_employment_gross_receipts: 0, snap_striker_income_above_current: 0, earnings: [{kind: wages, amount: 1250, frequency: weekly, per_payment: 250}]}, title: "CF-3: paid $250 weekly with five paydays in the month: 4.3 x 250 = 1,075", expect: 1075}
