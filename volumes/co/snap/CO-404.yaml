id: CO-404
name: "SNAP: meets the work registration employment exemption"
identifier: snap_meets_work_registration_employment_exemption
kind: derived
type: yes/no
scope: person-month
program: SNAP
meaning: "The person works at least snap_work_registration_hours_per_week hours a week on average, or earns weekly wages at least equal to the Federal minimum wage multiplied by snap_work_registration_hours_per_week hours; or is a migrant or seasonal farm worker under contract or a similar agreement with an employer or crew chief to begin employment within thirty days (10 CCR 2506-1 4.310.3.E.1; has_agreement_to_begin_farm_work_within_thirty_days, CO-4688)."
precision: "Reads the weekly hours and earnings of the month evaluated (CO-402, CO-403). Coverage pass 6 for SNAP, C6-6 (docs/reviews/coverage6-snap.md): per month, since prospective budgeting reads \"anticipated income and circumstances during the issuance month\" (10 CCR 2506-1 4.402.1.A, S4734) and the readers (the student's eligibility, CO-410 and CO-411; the work registration exemption, CO-405) are per month since S4-11: the month's hours and pay are read in each month evaluated. Before, the item was per person and read the determination month in every month, so a student who began a 20-hour job after the determination month stayed an ineligible student in that month."
derived: [any, [otherwise, has_agreement_to_begin_farm_work_within_thirty_days, false], [">=", snap_weekly_hours_worked, snap_work_registration_hours_per_week], [">=", snap_weekly_earnings_worked, ["*", federal_minimum_wage, snap_work_registration_hours_per_week]]]
sources: [S121, S123, S126, S3474, S4734]
implemented: engine
tags: [work_registration]
rationale: 7 U.S.C. 2015(d)(1)(E), 7 CFR 273.7(b)(1)(vii), and 10 CCR 2506-1 4.310.3.E (S121, S123, S126) state this exemption as a single either/or test; combining the two arms here, reading snap_weekly_hours_worked and snap_weekly_earnings_worked, lets snap_is_exempt_from_work_registration read one fact instead of repeating both comparisons.
tests:
  - {id: CO-404-T1, as_of: "2026-10-01", month: "2026-10", given: {hours_worked: 138, wages_gross: 0, self_employment_gross_receipts: 0, child_support_paid_legally_obligated: 0, earnings: []}, expect: true}
  - {id: CO-404-T2, as_of: "2026-10-01", month: "2026-10", given: {hours_worked: 100, wages_gross: 942.5, self_employment_gross_receipts: 0, child_support_paid_legally_obligated: 0, earnings: [{kind: wages, amount: 942.5}]}, expect: true}
  - {id: CO-404-T3, as_of: "2026-10-01", month: "2026-10", given: {hours_worked: 100, wages_gross: 900, self_employment_gross_receipts: 0, child_support_paid_legally_obligated: 0, earnings: [{kind: wages, amount: 900}]}, expect: false}
  - {id: CO-404-T4, title: "Coverage pass 2 N2-P3-6: a seasonal farm worker with no hours this month, under contract to start in two weeks", as_of: "2026-10-01", month: "2026-10", given: {has_agreement_to_begin_farm_work_within_thirty_days: true, hours_worked: 0, wages_gross: 0, self_employment_gross_receipts: 0, earnings: []}, expect: true}
