rationale: "Coverage pass 4 for SNAP resources, SR-3 and SR-5: personal property held as an investment and installment contracts not producing income consistent with their value are resources (273.8(c)(2), 4.408.1.B, 4.410.E.2) that no SNAP item counted. Nearest: snap_real_property_not_exempt and snap_countable_real_property (CO-5310, CO-5311), which test real property and the notes the person holds; this item tests the other non-liquid holdings, by the F.2 equity test alone."
