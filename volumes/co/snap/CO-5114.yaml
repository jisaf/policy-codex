sources: [S41, S1152, S3100, S2964]
implemented: engine
tags: [snap, income]
nearest: [CO-5115]
rationale: "Earned-income records, step E1 (SNAP; docs/reviews/records-earnings-snap.md): SNAP reads earned income from the earnings records (CO-5100) through its counting table (snap_earnings_treatment_table, CO-5101) instead of the scalar earned-income facts and their parts. Replaces self_employment_gross_receipts (CO-1700), which SNAP read for a farm and any other business alike."
tests:
