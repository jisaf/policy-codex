  - {id: CO-5114-T2, month: "2026-11", as_of: "2026-11-15", given: {snap_irregular_earnings_are_excluded: true, earnings: [{kind: self_employment_receipts, amount: 1500}, {kind: self_employment_receipts, amount: 25, irregular: true, month: "2026-11"}]}, title: "$25 for a one-off job as a contractor, within the $30 quarter: 1,500", expect: 1500}
