id: CO-5113
name: "SNAP: counted wages"
identifier: snap_person_counted_wages
kind: derived
type: money
scope: person-month
program: SNAP
meaning: "The person's pay for work as an employee that SNAP counts for the month (10 CCR 2506-1 4.402.A.2, 4.403, 4.405; 7 CFR 273.9(b)(1)(i)): each earnings record SNAP's counting table counts as pay (snap_earnings_treatment_table: counted or counted_no_rule_excludes; uniformed_services_special_pay not received in a combat zone; WIOA on-the-job training unless snap_wioa_ojt_earnings_are_excluded), at the amount snap_person_wages (CO-4324) gives it, less its mandatory military education deduction (4.405.2.A.13), less the month's infrequent or irregular pay when snap_irregular_earnings_are_excluded (4.405.A), and, in a destitute household's month of application, without the pay received after the date of application (4.406.1.A). Less the part of a pay set aside under a Plan for Achieving Self-Support (4.405.2.A.22)."
precision: "Each record's amount is converted as snap_person_wages converts it (registered siblings: a pay converted by 4.402.A.2 in one is converted the same way in the other, so the counted part of the pay and the whole of it cannot disagree). The rows SNAP excludes (work_study 4.405.1, summer_youth_employment and WIOA on-the-job training of a member under 19, 4.405.2.A.6, scsep_employment A.9, combat pay A.12, in_kind_pay 273.9(c)(1)) are left out. The education deduction is the month's amount withheld (the record's education_deduction), not converted. In a destitute household's month of application (is_destitute_migrant_or_seasonal_farmworker, the month of snap_application_date) each counted pay must state its date: one dated after the application date is not counted, and one with no date cannot be placed, so the figure cannot be determined (decision 4 of 2026-11-23; before step E1 the pay after the date was a separate fact read as 0 when not stated). Earnings not stated: cannot determine; a stated empty list is 0. Coverage pass 4 for SNAP (docs/reviews/coverage4-snap.md, S4-1 to S4-4): a record is placed in the month of its regular_date when it states one, since pay or a benefit that came early or late because of a holiday, a weekend, a changed pay date, a mailing cycle or the employee's request is counted by its regular schedule (10 CCR 2506-1 4.402.B.1-3, S4720; 4.403.A.3, S4721), else in the month it came in; a stream (a record with no month and no date) recurs only from the month its job or source began through the month it ended (job_start_date and job_end_date; start_date and end_date on a receipt), since pay after a job ends or before it begins is not anticipated with reasonable certainty (4.402.1.B, S4722); a pay or receipt of a schedule paid less often than monthly (every other month, quarterly, twice a year, annually) that states its month or its date is one payment of the schedule, counted at its amount times the 4.402.A.2 multiplier in each month of its interval, from its (regular) month through the month before the next payment is due, so a quarterly payment is a third of itself in each of three months, not a third in one month (S4-1); a dated weekly or biweekly pay or receipt is its amount times the multiplier divided by the paydays its schedule has in the month, counted from its regular date. Sick, vacation and bonus pay dated after the job ended is left out (4.404.F, S4723; snap_leave_pay_after_termination, CO-6600). Subsidized employment paid under a WIOA-funded program (wioa_funded) is excluded (10 CCR 2506-1 4.405.2.A.6, S3108: \"Payments, allowances and earnings under the Workforce Innovation and Opportunity Act (WIOA) are excluded as income\"; 7 CFR 273.9(c)(10)(v), S4727; S4-8). A difficulty of care payment marked foster_care is counted only when a foster individual placed with the person is a member of the household (snap_foster_care_payments_are_counted, CO-6601; 7 CFR 273.9(b)(2)(ii), (c)(15), S4725; S4-6), read only when the person states one. Field sweep fix round (FS-SNAP-1): 10 CCR 2506-1 4.405.2.A.22 (S3110) excludes \"Amounts necessary for the fulfillment of a Plan for Achieving Self-Support (PASS) under Title XVI of the Social Security Act\", whatever income they come from; the part of a pay or a business's receipts set aside under a PASS (the earnings record's pass_set_aside, the month's amount set aside, not converted) is left out, as the receipts' set-aside is (snap_counted_recurring_receipts, CO-5011). Before, only the receipts' field was read and a set-aside of earnings was counted."
