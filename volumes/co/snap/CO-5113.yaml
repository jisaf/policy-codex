sources: [S41, S3112, S2050, S3115, S3113, S1620, S2204, S3108, S3109, S3100, S3128, S2964]
implemented: engine
tags: [snap, income]
siblings:
  - {id: CO-4324, reason: "Both convert each pay by 4.402.A.2 (and average contract pay by 4.403.3) with the same expression: snap_person_wages for the whole pay, this item for the part SNAP counts; a change to one is a change to the other."}
rationale: "Earned-income records, step E1 (SNAP; docs/reviews/records-earnings-snap.md): SNAP reads earned income from the earnings records (CO-5100) through its counting table (snap_earnings_treatment_table, CO-5101) instead of the scalar earned-income facts and their parts. The counted part of the pay is summed directly, record by record, so an exclusion is never subtracted from a figure that does not hold it and is converted exactly as the pay it is part of (coverage pass 2 C2-1, which snap_regular_wages_conversion_factor, CO-4682, approximated by a ratio); CO-4682 is retired."
tests:
  - {id: CO-5113-T1, month: "2027-01", as_of: "2027-01-15", given: {earnings: [{kind: wages, amount: 1250, frequency: weekly, per_payment: 250}, {kind: scsep_employment, amount: 250}, {kind: work_study, amount: 100}]}, title: "Weekly pay of $250 (5 paydays), $250 of SCSEP pay and $100 of work-study: 250 x 4.3 = 1,075 counted; SCSEP (A.9) and work-study (4.405.1) excluded", expect: 1075}
  - {id: CO-5113-T2, month: "2026-11", as_of: "2026-11-15", given: {snap_wioa_ojt_earnings_are_excluded: true, earnings: [{kind: wages, amount: 1000}, {kind: wioa_on_the_job_training, amount: 400}]}, title: "WIOA on-the-job training pay of $400 of a member under 19 living with a parent: 1,000 counted", expect: 1000}
  - {id: CO-5113-T3, month: "2026-11", as_of: "2026-11-15", given: {snap_wioa_ojt_earnings_are_excluded: false, earnings: [{kind: wages, amount: 1000}, {kind: wioa_on_the_job_training, amount: 400}]}, title: "The same pay of an adult: 1,000 + 400 = 1,400 counted (4.405.2.A.6: \"Earnings paid for on-the-job training are still counted\")", expect: 1400}
  - {id: CO-5113-T4, month: "2026-11", as_of: "2026-11-15", given: {earnings: [{kind: wages, amount: 3000}, {kind: uniformed_services_special_pay, amount: 500, combat_zone: true}]}, title: "Basic pay of $3,000 and $500 of combat pay while deployed to a combat zone: 3,000 (4.405.2.A.12)", expect: 3000}
  - {id: CO-5113-T5, month: "2026-11", as_of: "2026-11-15", given: {earnings: [{kind: wages, amount: 3000}, {kind: uniformed_services_special_pay, amount: 500}]}, title: "The same $500 of special pay outside a combat zone: pay for service, 3,000 + 500 = 3,500 (273.9(b)(1)(i))", expect: 3500}
  - {id: CO-5113-T6, month: "2026-11", as_of: "2026-11-15", given: {snap_irregular_earnings_are_excluded: true, earnings: [{kind: wages, amount: 1000}, {kind: wages, amount: 20, irregular: true, month: "2026-11"}]}, title: "$20 of odd-job pay within the $30 quarter: 1,000 counted", expect: 1000}
  - {id: CO-5113-T7, month: "2026-11", as_of: "2026-11-15", given: {snap_irregular_earnings_are_excluded: false, earnings: [{kind: wages, amount: 1000}, {kind: wages, amount: 20, irregular: true, month: "2026-11"}]}, title: "The same odd job over the quarter limit: 1,000 + 20 = 1,020", expect: 1020}
  - {id: CO-5113-T8, month: "2026-11", as_of: "2026-11-15", given: {earnings: [{kind: wages, amount: 2000, education_deduction: 100}]}, title: "Military pay of $2,000 with $100 withheld for education (4.405.2.A.13): 2,000 - 100 = 1,900", expect: 1900}
  - {id: CO-5113-T9, month: "2026-10", as_of: "2026-10-12", given: {is_destitute_migrant_or_seasonal_farmworker: true, snap_application_date: "2026-10-12", earnings: [{kind: wages, amount: 600, date: "2026-10-05"}, {kind: wages, amount: 900, date: "2026-10-19"}]}, title: "Destitute farmworker applying October 12: $600 paid October 5 counted, $900 paid October 19 not (4.406.1.A): 600", expect: 600}
  - {id: CO-5113-T10, month: "2026-10", as_of: "2026-10-12", given: {is_destitute_migrant_or_seasonal_farmworker: true, snap_application_date: "2026-10-12", earnings: [{kind: wages, amount: 1500}]}, title: "The same household states $1,500 of October wages with no date: before or after the application date cannot be told, cannot determine", expect: unknown}
  - {id: CO-5113-T11, month: "2026-11", as_of: "2026-11-15", given: {earnings: [{kind: wages, amount: 1000}, {kind: in_kind_pay, amount: 300}]}, title: "Wages of $1,000 and housing worth $300 an employer provides as pay: 1,000 (in-kind benefits, 273.9(c)(1))", expect: 1000}
  - {id: CO-5113-T12, month: "2026-11", as_of: "2026-11-15", given: {}, title: "Earnings not stated: cannot determine", expect: unknown}
  - {id: CO-5113-T13, month: "2026-11", as_of: "2026-11-15", given: {earnings: []}, title: "Earnings stated empty: 0", expect: 0}
  # OQ-1021 resolved by 10 CCR 2506-1 4.405.H.4 (S4300): wages an employer diverts to a third party for a household expense are income.
  - {id: CO-5113-T14, month: "2026-11", as_of: "2026-11-15", given: {earnings: [{kind: wages, amount: 1000}, {kind: employer_vendor_payment, amount: 300}]}, title: "Wages of $1,000 paid to the member and $300 of the wages the employer pays to the landlord: 1,000 + 300 = 1,300", expect: 1300}
