id: CO-5113
name: "SNAP: counted wages"
identifier: snap_person_counted_wages
kind: derived
type: money
scope: person-month
program: SNAP
meaning: "The person's pay for work as an employee that SNAP counts for the month (10 CCR 2506-1 4.402.A.2, 4.403, 4.405; 7 CFR 273.9(b)(1)(i)): each earnings record SNAP's counting table counts as pay (snap_earnings_treatment_table: counted or counted_no_rule_excludes; uniformed_services_special_pay not received in a combat zone; WIOA on-the-job training unless snap_wioa_ojt_earnings_are_excluded), at the amount snap_person_wages (CO-4324) gives it, less its mandatory military education deduction (4.405.2.A.13), less the month's infrequent or irregular pay when snap_irregular_earnings_are_excluded (4.405.A), and, in a destitute household's month of application, without the pay received after the date of application (4.406.1.A)."
precision: "Each record's amount is converted as snap_person_wages converts it (registered siblings: a pay converted by 4.402.A.2 in one is converted the same way in the other, so the counted part of the pay and the whole of it cannot disagree). The rows SNAP excludes (work_study 4.405.1, summer_youth_employment and WIOA on-the-job training of a member under 19, 4.405.2.A.6, scsep_employment A.9, combat pay A.12, in_kind_pay 273.9(c)(1)) are left out. The education deduction is the month's amount withheld (the record's education_deduction), not converted. In a destitute household's month of application (is_destitute_migrant_or_seasonal_farmworker, the month of snap_application_date) each counted pay must state its date: one dated after the application date is not counted, and one with no date cannot be placed, so the figure cannot be determined (decision 4 of 2026-11-23; before step E1 the pay after the date was a separate fact read as 0 when not stated). Earnings not stated: cannot determine; a stated empty list is 0."
