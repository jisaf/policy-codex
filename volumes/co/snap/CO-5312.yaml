de_case"]], ["-", ["receipt", "value"], ["receipt", "amount_owed"]]], ["else", ["*", ["-", ["receipt", "value"], ["receipt", "amount_owed"]], ["otherwise", ["receipt", "share"], 1]]]]]]]]]]
