id: CO-5312
name: "SNAP: countable funeral agreements"
identifier: snap_countable_funeral_agreements
kind: derived
type: money
scope: person-month
program: SNAP
meaning: "The equity of the person's pre-purchased funeral agreements that SNAP counts in the month (7 CFR 273.8(e)(2); 10 CCR 2506-1 4.410.D.4): the equity (value less what is owed, times the person's share, or all of it where owned with someone outside the case; never below 0) of the person's prepaid_burial_contract records (row counted_beyond_one_agreement_per_member) valued in the month and held on the month's day that the person can reach and that are not irrevocable (an irrevocable agreement is inaccessible, 4.410.F.1), less, for each member of the person's SNAP household (snap_household_members), the largest of those that is for that member (burial_for person_of_case, for_person naming the member): the value of one funeral agreement per household member is excluded, whatever its amount."
precision: "Coverage pass 4 for SNAP resources (docs/reviews/coverage4-snap-resources.md). SR-1: (a) per member, not per holder: an agreement names the person it is for (burial_for, for_person, fields of the record), and one agreement per household member is excluded, so a parent who holds her own agreement and her child's has both excluded (FUN1); an agreement for someone who is not a member of the household (a relative elsewhere, a person of the case in another SNAP household) is counted; with two agreements for one member, the larger is excluded. Each holder's agreements are read for each member, so two members who each hold an agreement for the same third member would each have one excluded: the record cannot join two holders' agreements (no rule on file is about that case). (b) The $1,500 cap: the statute override (273.8(e)(2) over 4.410.D.4; OQ-1305). SR-12: equity value, as D.4 and 4.409.B value it (value less amount owed, times share), not the paid-up amount alone. SR-11: an agreement's irrevocable is read for every agreement the person can reach (one excluded or not), after whom it is for. A burial plot included in an agreement is stated as its own burial_space record (D.4: \"the burial plot portion will be exempted prior to determining the equity value\"; snap_countable_burial_spaces, CO-5313). Per month (SR-9): the resources of the month evaluated, valued on its day, the application filing date in the month of application (snap_application_date; 4.408.1, S4823: \"The value of nonexempt household resources at the application filing date\") and the first day of any other month (4.408.B: \"as anticipated to be available in the issuance month\"; the day is OQ-1310's): a record valued in the month (its month, or every month), and a holding disposed of (disposed_date) is held in a month whose day is before the disposal; the refund and credit windows are read against the same day. Before, one figure per case, on the determination date and the determination month's records, in every month, and a holding with any disposed_date in no month. No agreement held: 0, the household not read."
statute_override: "Federal regulation overrides 10 CCR 2506-1 4.410.D.4, under which one pre-purchased funeral agreement per household member is excluded only \"provided that the agreement does not exceed one thousand five hundred dollars ($1,500) in equity value; the equity value over one thousand five hundred dollars ($1,500) is counted as a resource\": 7 CFR 273.8(e)(2), on file as in force on 2026-11-19 (D-191) and as retrieved 2026-09-18 (D-12), excludes \"the value of one funeral agreement per household member\" with no limit, and 273.8(a) and (e) require the State agency to \"apply the uniform national resource standards\", under which \"only the following shall be excluded\"; the whole equity of one agreement per member is excluded (OQ-1305)."
