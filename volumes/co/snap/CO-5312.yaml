tags: [snap, resources]
rationale: "Resource records, step H1 SNAP (docs/reviews/records-holdings-snap-af.md): SNAP reads the person's resources from the holdings records (holdings, CO-5300) through its counting table (snap_holding_treatment_table, CO-5301), never from the scalar resource facts. The funeral agreement part of snap_countable_nonliquid_resources (CO-074), which read revocable_prepaid_burial_contract_value (CO-3856) as one total."
tests:
  # Coverage pass 4 SNAP resources, SR-1 and SR-12: hand-computed from 7 CFR 273.8(e)(2) (S2216, the statute override over 4.410.D.4, S2967), 273.8(a) (S4820).
  - {"id": "CO-5312-T1", "month": "2027-02", "title": "SR-1 (FUN2): one $3,000 agreement for the person himself: the value of one agreement per member is excluded with no limit (273.8(e)(2)): 3,000 - 3,000 = 0 (4.410.D.4 alone: 1,500)", "as_of": "2027-02-10", "given": {"snap_household_members": ["p1"], "holdings": [{"kind": "prepaid_burial_contract", "value": 3000, "amount_owed": 0, "irrevocable": false, "burial_for": "person_of_case", "for_person": "p1"}]}, "expect": 0}
  - {"id": "CO-5312-T2", "month": "2027-02", "title": "SR-1 (FUN1): the father holds two $1,500 agreements, his own and his daughter's, both members: one per member, 3,000 - 1,500 - 1,500 = 0", "as_of": "2027-02-10", "given": {"snap_household_members": ["p1", "p2"], "holdings": [{"kind": "prepaid_burial_contract", "value": 1500, "amount_owed": 0, "irrevocable": false, "burial_for": "person_of_case", "for_person": "p1"}, {"kind": "prepaid_burial_contract", "value": 1500, "amount_owed": 0, "irrevocable": false, "burial_for": "person_of_case", "for_person": "p2"}]}, "others": {"p2": {"holdings": []}}, "expect": 0}
  - {"id": "CO-5312-T3", "month": "2027-02", "title": "Two agreements for the person himself, $1,000 and $2,300: one per member, the larger excluded, 3,300 - 2,300 = 1,000", "as_of": "2027-02-10", "given": {"snap_household_members": ["p1"], "holdings": [{"kind": "prepaid_burial_contract", "value": 1000, "amount_owed": 0, "irrevocable": false, "burial_for": "person_of_case", "for_person": "p1"}, {"kind": "prepaid_burial_contract", "value": 2300, "amount_owed": 0, "irrevocable": false, "burial_for": "person_of_case", "for_person": "p1"}]}, "expect": 1000}
  - {"id": "CO-5312-T4", "month": "2027-02", "title": "A $2,300 agreement for his mother, who is not a person of the case: not a member's, counted, 2,300", "as_of": "2027-02-10", "given": {"snap_household_members": ["p1"], "holdings": [{"kind": "prepaid_burial_contract", "value": 2300, "amount_owed": 0, "irrevocable": false, "burial_for": "outside_case"}]}, "expect": 2300}
  - {"id": "CO-5312-T5", "month": "2027-02", "title": "An irrevocable $5,000 agreement for his mother is inaccessible (4.410.F.1): 0", "as_of": "2027-02-10", "given": {"snap_household_members": ["p1"], "holdings": [{"kind": "prepaid_burial_contract", "value": 5000, "amount_owed": 0, "irrevocable": true, "burial_for": "outside_case"}]}, "expect": 0}
  - {"id": "CO-5312-T6", "month": "2027-02", "title": "Decision 4: an agreement that does not say whom it is for - cannot determine", "as_of": "2027-02-10", "given": {"snap_household_members": ["p1"], "holdings": [{"kind": "prepaid_burial_contract", "value": 2300, "amount_owed": 0, "irrevocable": false}]}, "expect": "unknown"}
  - {"id": "CO-5312-T7", "month": "2027-02", "title": "SR-12: a $2,000 agreement for a friend owing $500, owned half with the spouse (a member): equity times share, (2,000 - 500) x 0.5 = 750", "as_of": "2027-02-10", "given": {"snap_household_members": ["p1", "p2"], "holdings": [{"kind": "prepaid_burial_contract", "value": 2000, "amount_owed": 500, "irrevocable": false, "share": 0.5, "co_owners": "spouse", "holding_id": "fa", "burial_for": "outside_case"}]}, "others": {"p2": {"holdings": [{"kind": "prepaid_burial_contract", "value": 2000, "amount_owed": 500, "irrevocable": false, "share": 0.5, "co_owners": "spouse", "holding_id": "fa", "burial_for": "outside_case"}]}}, "expect": 750}
  - {"id": "CO-5312-T8", "month": "2027-02", "title": "A $1,000 agreement for p2, a person of the case who is not a member of his SNAP household: counted, 1,000", "as_of": "2027-02-10", "given": {"snap_household_members": ["p1"], "holdings": [{"kind": "prepaid_burial_contract", "value": 1000, "amount_owed": 0, "irrevocable": false, "burial_for": "person_of_case", "for_person": "p2"}]}, "others": {"p2": {"holdings": []}}, "expect": 1000}
