  # T-9 hand check, givens made consistent: the threshold is no longer overridden (it was stated as $1,000, the table gives $2,660).
  # One person, wages of $2,660 a month paid monthly (no conversion, 4.402.A.2), no other income and no receipts: household gross income
  # 2,660 = snap_bbce_gross_income_limit_table["1"] from 2026-10-01 (S739: $2,660); S48 "at or below two hundred (200%)" (OQ-356): true.
