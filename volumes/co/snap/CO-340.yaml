id: CO-340
name: "SNAP: meets Expanded Categorical Eligibility"
identifier: snap_meets_ece_eligibility
kind: derived
type: yes/no
scope: person
program: SNAP
meaning: This person's SNAP household qualifies for Expanded Categorical Eligibility because it has at least one member, its combined gross income is at or below 200% of the federal poverty level, and no member is disqualified for an IPV or a SNAP-related drug felony.
precision: "Reads snap_household_gross_income (a per-person-month fact) for the determination month via `at`, since this item is person-scoped like the rest of the categorical-eligibility chain. Requires at least one household member (count of snap_household_members), matching CO-338 (C-1): otherwise a household with no members has gross income 0, which is vacuously at or below any limit. Final verification pass 2 N-2: also requires at least one eligible member (snap_eligible_household_size): the limit table has no row for a size of 0, and a household whose every member awaits non-citizen verification has no eligible member to be categorically eligible for."
assumption: "Treats every applicant as having been offered the non-cash TANF/MOE service notice 10 CCR 2506-1 4.206,C,2,a,2) (S48) requires (see OQ-12), so this item tests only the income and disqualification prongs. Watch: FNS's proposed rule of November 10, 2026 (91 FR 72454, S1308) would end categorical eligibility through non-cash TANF/MOE services, which would end ECE; it is a proposal and changes nothing today."
derived: [all, [">=", [count, snap_household_members], 1], [">=", snap_eligible_household_size, 1], ["<=", [at, snap_household_gross_income, [det_month]], snap_bbce_gross_income_limit], [not, snap_household_has_bce_ece_disqualifying_member]]
sources: [S48, S1308]
implemented: engine
tags: [income, state_election]
open: [OQ-12, OQ-356]
rationale: "10 CCR 2506-1 4.206,C,2 (S48) states ECE's income and disqualification prongs; combines snap_bbce_gross_income_limit and snap_household_has_bce_ece_disqualifying_member the way snap_meets_bce_eligibility (CO-338, same shape, different first condition) combines its own two prongs, needed separately because BCE and ECE are distinct categories with different first-prong tests. Fix-round (C-1): added the same count(snap_household_members) >= 1 guard as CO-338."
nearest: [CO-338]
tests:
