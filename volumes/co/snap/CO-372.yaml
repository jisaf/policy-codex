id: CO-372
name: "SNAP: household earned income for the earned income deduction"
identifier: snap_household_earned_income_for_deduction
kind: derived
type: money
scope: person-month
program: SNAP
meaning: This person's SNAP household's earned income base for the 20% earned income deduction - snap_household_earned_income (the eligible members' own earned income) plus the counted, prorated-or-full earned share attributed from each ineligible household member.
precision: "Sums snap_counted_earned_income_of_ineligible_member over the ineligible members of snap_household_members (mirroring snap_household_gross_income's split between eligible and ineligible members) and adds it to snap_household_earned_income, so an eligible member's earned income is never counted twice. Final verification F-8: less the farm loss offset against other self-employment income (snap_farm_loss_offset_against_self_employment, CO-3724; 7 CFR 273.11(a)(2)(ii)(A)), which nets the household's self-employment earnings."
derived: ["-", [+, snap_household_earned_income, [sum, [filter, snap_household_members, [of, [P], snap_is_ineligible_member]], [of, [P], snap_counted_earned_income_of_ineligible_member]]], snap_farm_loss_offset_against_self_employment]
sources: [S46, S107, S1312, S2511]
nearest: [CO-334]
rationale: 10 CCR 2506-1 4.411.1,B,2,c (S107) requires the earned income deduction's base to include the prorated earned share of a disqualified or ineligible member, which snap_household_earned_income (CO-335, batch 2, unavailable to edit) does not include by design; this item adds that share on top of CO-335's total using the same eligible/ineligible split snap_household_gross_income (CO-334) uses for the household's overall gross income, but applied to the earned-only components.
implemented: engine
tags: [income, state_election]
tests:
  - {id: CO-372-T1, as_of: "2026-10-01", month: "2026-10", given: {receipts: [], snap_household_members: [p1, p2, p3, p4], snap_household_earned_income: 0, snap_is_ineligible_member: false, snap_farm_loss_offset_against_self_employment: 0}, others: {p2: {receipts: [], snap_is_ineligible_member: true, immigration_status: undocumented, wages_gross: 2380, child_support_paid_legally_obligated: 0, self_employment_gross_receipts: 0, self_employment_net_earnings_for_tax: 0, is_fleeing_felon: false, is_probation_or_parole_violator: false, snap_is_serving_ipv_disqualification: false, snap_household_members: [p1, p2, p3, p4], snap_is_disqualified_for_work_requirement_noncompliance: false, earnings: [{kind: wages, amount: 2380}]}, p3: {snap_is_ineligible_member: false}, p4: {snap_is_ineligible_member: false}}, relationships: [], expect: 1785}
  - {id: CO-372-T2, as_of: "2026-10-01", month: "2026-10", given: {snap_household_members: [p1], snap_household_earned_income: 500, snap_is_ineligible_member: false, snap_farm_loss_offset_against_self_employment: 0}, others: {}, relationships: [], expect: 500}
  - {id: CO-372-T3, title: "Final verification F-8: $500 of a spouse's self-employment earnings offset by a farm loss", as_of: "2026-10-01", month: "2026-10", given: {snap_household_members: [p1], snap_household_earned_income: 1700, snap_is_ineligible_member: false, snap_farm_loss_offset_against_self_employment: 500}, others: {}, relationships: [], expect: 1200}
