id: CO-4690
name: "SNAP: foster child outside the foster parent's SNAP household"
identifier: snap_lives_apart_from_foster_parent_household
kind: derived
type: yes/no
scope: person-month
program: SNAP
meaning: "The person is a foster child (foster_child role) of someone who lives with the person and is not in the person's SNAP household: the foster parent chose not to include the child (10 CCR 2506-1 4.304.3.B.1)."
precision: "Read as false when the person has no foster parent in the case. Living together is lives_with (CO-1925), read as true where no dwelling is stated. Coverage pass 4 for SNAP S4-11 (OQ-1263 resolved): per month, since prospective budgeting reads \"anticipated income and circumstances during the issuance month\" (10 CCR 2506-1 4.402.1.A, S4734): the household (CO-305) is the month's. Before, the item was per person and read on the determination date in every month. Three-pattern sweep D-1 (docs/reviews/pattern-sweep-snap-ce.md): lives_with (CO-1925) is read as stated, required where read: no text on file says that persons related on the application live together unless it says otherwise (7 CFR 273.1(a): a household is individuals who live together and customarily purchase and prepare meals together, S1), so a stated relationship is no longer read as living together where no dwelling_id is stated (decision 4; docs/conventions.md rule 17, as MAGI's readers since coverage pass 6, C6-10); a case with persons related across the edge states dwelling_id for each of them."
derived: [exists_related, [foster_child], [all, [in_group, [P], snap_lives_with_in_month], [not, [in_group, [P], snap_household_members]]]]
sources: [S3475]
implemented: engine
tags: [snap, household]
rationale: "Coverage pass 2 N2-P3-4: the per-person half of snap_household_has_foster_child_outside_foster_household (CO-4689), which reads it for each member of the unit; no item said whether a foster child was left out of the foster family's SNAP household."
tests:
  - {id: CO-4690-T1, month: "2026-10", title: "Foster parent lives with the child and is not in the child's unit", as_of: "2026-10-01", given: {dwelling_id: h1, snap_household_members: [p1]}, others: {p2: {dwelling_id: h1, date_of_birth: "1980-01-01"}}, relationships: [[foster_parent, p2, p1]], expect: true}
  - {id: CO-4690-T2, month: "2026-10", title: "Foster parent in the child's unit", as_of: "2026-10-01", given: {snap_household_members: [p1, p2]}, others: {p2: {date_of_birth: "1980-01-01"}}, relationships: [[foster_parent, p2, p1]], expect: false}
