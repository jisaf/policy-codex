id: CO-4690
name: "SNAP: foster child outside the foster parent's SNAP household"
identifier: snap_lives_apart_from_foster_parent_household
kind: derived
type: yes/no
scope: person
program: SNAP
meaning: "The person is a foster child (foster_child role) of someone who lives with the person and is not in the person's SNAP household: the foster parent chose not to include the child (10 CCR 2506-1 4.304.3.B.1)."
precision: "Read as false when the person has no foster parent in the case. Living together is lives_with (CO-1925), read as true where no dwelling is stated."
derived: [exists_related, [foster_child], [all, [otherwise, [in_group, [P], lives_with], true], [not, [in_group, [P], snap_household_members]]]]
sources: [S3475]
implemented: engine
tags: [snap, household]
rationale: "Coverage pass 2 N2-P3-4: the per-person half of snap_household_has_foster_child_outside_foster_household (CO-4689), which reads it for each member of the unit; no item said whether a foster child was left out of the foster family's SNAP household."
tests:
  - {id: CO-4690-T1, title: "Foster parent lives with the child and is not in the child's unit", as_of: "2026-10-01", given: {snap_household_members: [p1]}, others: {p2: {date_of_birth: "1980-01-01"}}, relationships: [[foster_parent, p2, p1]], expect: true}
  - {id: CO-4690-T2, title: "Foster parent in the child's unit", as_of: "2026-10-01", given: {snap_household_members: [p1, p2]}, others: {p2: {date_of_birth: "1980-01-01"}}, relationships: [[foster_parent, p2, p1]], expect: false}
