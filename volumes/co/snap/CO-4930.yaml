id: CO-4930
name: "SNAP: earned income other than self-employment"
identifier: snap_person_earned_income_other_than_self_employment
kind: derived
type: money
scope: person-month
program: SNAP
meaning: "The part of the person's earned income for the month for SNAP that is not self-employment: the pay SNAP counts (snap_person_counted_wages, CO-5113: wages and the other pay the counting table counts, each converted by its frequency, less what 4.405 excludes and, in a destitute household's month of application, the pay received after the date of application, 4.406.1.A), training allowances other than WIOA (receipts of kind vocational_training_allowance, receipts CO-5000; 10 CCR 2506-1 4.403.B.1) and Domestic Volunteer Service Act Title I (VISTA) payments to a person who was not receiving SNAP or public assistance on joining (4.403.A.2, C). A child student's earnings are excluded in full (0)."
precision: "Not floored at 0: snap_person_earned_income (CO-330) adds net self-employment income (CO-1702) and net boarder income (CO-4165) to it and floors the sum, as before. Coverage pass 3 C3-1: this is the one list of the receipts SNAP counts as earned income other than self-employment, read both by snap_person_earned_income and by snap_requires_verification_of_earned_income (CO-1376), so the income counted and the income verified cannot drift apart again (4.506: \"Monthly, gross nonexempt income shall be verified prior to initial certification\", S830). Receipt records, migration phase 1: the training allowances and Title I payments are the month's receipts of the kinds vocational_training_allowance and dvsa_title_i_volunteer_payment (snap_receipt_treatment_table: counted as earned). Receipts not stated: cannot determine, unless the student exclusion applies first, since 4.403.A.2, B.1 and C count the payments received and give no reading for payments not reported (decision 4 of 2026-11-23 (docs/plan-colorado.md): missing information is cannot determine unless the rule says otherwise; the phase-1 default of 0 is removed); a stated empty list is no such payment. Earned-income records, step E1 (SNAP; docs/reviews/records-earnings-snap.md): the pay is read from the earnings records, counted record by record (CO-5113), so the excluded part (snap_excluded_earned_income, CO-2338) and the pay after a destitute household's application date (snap_earned_income_received_after_application_date, CO-4166, read as 0 when not stated) are no longer subtracted here; in that month each pay states its date, or the figure cannot be determined."
derived: [case, [snap_student_earnings_are_excluded, 0], [else, ["+", snap_person_counted_wages, [sum_receipts, receipts, [all, ["=", [receipt, kind], vocational_training_allowance], [not, ["=", [receipt, frequency], once]], [received_in, [month]]], [receipt, amount]], [case, [[otherwise, received_snap_or_public_assistance_when_joined_vista, false], 0], [else, [sum_receipts, receipts, [all, ["=", [receipt, kind], dvsa_title_i_volunteer_payment], [not, ["=", [receipt, frequency], once]], [received_in, [month]]], [receipt, amount]]]]]]]
sources: [S1620, S41, S2964, S3106, S3108, S3112, S830]
implemented: engine
tags: [income]
rationale: "Coverage pass 3 C3-1: snap_person_earned_income (CO-330) counted the training allowances and VISTA payments stated in the unearned income facts as earned income, but snap_requires_verification_of_earned_income (CO-1376) rebuilt its own figure from wages alone, so an allowance-only or VISTA-only member's counted income was never verified. The receipts are listed once here and read by both. Earned-income records, step E1 (SNAP; docs/reviews/records-earnings-snap.md): reads the counted pay (CO-5113)."
tests:
  - {id: CO-4930-T1, month: "2026-11", as_of: "2026-11-15", given: {receipts: [], snap_student_earnings_are_excluded: false, earnings: [{kind: wages, amount: 800}, {kind: scsep_employment, amount: 200}]}, title: "Pay of $1,000, $200 of it SCSEP pay (excluded, 4.405.2.A.9): 800", expect: 800}
  - {id: CO-4930-T2, month: "2026-11", as_of: "2026-11-15", given: {snap_student_earnings_are_excluded: false, earnings: [], receipts: [{kind: vocational_training_allowance, amount: 1000}]}, title: "C3-1: no wages and a $1,000 non-WIOA training allowance", expect: 1000}
  - {id: CO-4930-T3, month: "2026-11", as_of: "2026-11-15", given: {snap_student_earnings_are_excluded: false, received_snap_or_public_assistance_when_joined_vista: false, earnings: [], receipts: [{kind: dvsa_title_i_volunteer_payment, amount: 600}]}, title: "C3-1: $600 of VISTA payments to a volunteer not on SNAP or PA when joining; to one who was, nothing", expect: 600}
  - {id: CO-4930-T4, month: "2026-11", as_of: "2026-11-15", given: {snap_student_earnings_are_excluded: true, snap_person_wages: 600}, title: "A child student's earnings are excluded in full", expect: 0}
  # Coverage pass 4 L4-2: a pay stated with its date states its frequency (CO-5100); the two pays are two jobs paid monthly, read at their amounts as before.
  - {id: CO-4930-T5, month: "2026-10", as_of: "2026-10-12", given: {receipts: [], snap_student_earnings_are_excluded: false, is_destitute_migrant_or_seasonal_farmworker: true, snap_application_date: "2026-10-12", earnings: [{kind: wages, amount: 600, frequency: monthly, date: "2026-10-05"}, {kind: wages, amount: 900, frequency: monthly, date: "2026-10-20"}]}, title: "Destitute farmworker applying October 12: $900 of $1,500 wages received after the application date (October 20): 1,500 - 900 = 600", expect: 600}
  # Decision 4 of 2026-11-23: receipts not stated are cannot determine; a stated empty list is no allowance and no VISTA payment.
  - {id: CO-4930-T6, month: "2026-11", as_of: "2026-11-15", given: {snap_student_earnings_are_excluded: false, snap_person_counted_wages: 1000}, title: "Wages of $1,000, receipts not stated: whether a training allowance or VISTA payment is added is not known, cannot determine", expect: unknown}
  - {id: CO-4930-T7, month: "2026-11", as_of: "2026-11-15", given: {snap_student_earnings_are_excluded: false, snap_person_counted_wages: 1000, receipts: []}, title: "Wages of $1,000, receipts stated empty: $1,000", expect: 1000}
  - {id: CO-4930-T8, month: "2026-11", as_of: "2026-11-15", given: {snap_student_earnings_are_excluded: false, receipts: []}, title: "Earnings not stated: cannot determine", expect: unknown}
