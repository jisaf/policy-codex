id: CO-4930
name: "SNAP: earned income other than self-employment"
identifier: snap_person_earned_income_other_than_self_employment
kind: derived
type: money
scope: person-month
program: SNAP
meaning: "The part of the person's earned income for the month for SNAP that is not self-employment: wages as SNAP counts them (snap_person_wages, CO-4324), training allowances other than WIOA (vocational_training_allowance_received; 10 CCR 2506-1 4.403.B.1) and Domestic Volunteer Service Act Title I (VISTA) payments to a person who was not receiving SNAP or public assistance on joining (4.403.A.2, C), less the earnings 4.405 excludes (snap_excluded_earned_income, CO-2338) and, in a destitute household's month of application, the earned income received after the date of application (4.406.1.A). A child student's earnings are excluded in full (0)."
precision: "Not floored at 0: snap_person_earned_income (CO-330) adds net self-employment income (CO-1702) and net boarder income (CO-4165) to it and floors the sum, as before. Coverage pass 3 C3-1: this is the one list of the receipts SNAP counts as earned income other than self-employment, read both by snap_person_earned_income and by snap_requires_verification_of_earned_income (CO-1376), so the income counted and the income verified cannot drift apart again (4.506: \"Monthly, gross nonexempt income shall be verified prior to initial certification\", S830). Receipt records, migration phase 1: the training allowances and Title I payments are the month's receipts of the kinds vocational_training_allowance and dvsa_title_i_volunteer_payment (snap_receipt_treatment_table: counted as earned), each 0 when the receipts are not stated."
derived: [case, [snap_student_earnings_are_excluded, 0], [else, ["-", ["-", ["+", snap_person_wages, [otherwise, [sum_receipts, receipts, [all, ["=", [receipt, kind], vocational_training_allowance], [not, ["=", [receipt, frequency], once]], [received_in, [month]]], [receipt, amount]], 0], [case, [[otherwise, received_snap_or_public_assistance_when_joined_vista, false], 0], [else, [otherwise, [sum_receipts, receipts, [all, ["=", [receipt, kind], dvsa_title_i_volunteer_payment], [not, ["=", [receipt, frequency], once]], [received_in, [month]]], [receipt, amount]], 0]]]], [otherwise, snap_excluded_earned_income, 0]], [case, [snap_is_destitute_application_month, [otherwise, snap_earned_income_received_after_application_date, 0]], [else, 0]]]]]
sources: [S1620, S41, S2964, S3106, S3108, S3112, S830]
implemented: engine
tags: [income]
rationale: "Coverage pass 3 C3-1: snap_person_earned_income (CO-330) counted the training allowances and VISTA payments stated in the unearned income facts as earned income, but snap_requires_verification_of_earned_income (CO-1376) rebuilt its own figure from wages alone, so an allowance-only or VISTA-only member's counted income was never verified. The receipts are listed once here and read by both."
tests:
  - {id: CO-4930-T1, month: "2026-11", as_of: "2026-11-15", given: {snap_student_earnings_are_excluded: false, snap_person_wages: 1000, snap_excluded_earned_income: 200, snap_is_destitute_application_month: false}, title: "Wages of $1,000 with $200 excluded", expect: 800}
  - {id: CO-4930-T2, month: "2026-11", as_of: "2026-11-15", given: {snap_student_earnings_are_excluded: false, snap_person_wages: 0, snap_is_destitute_application_month: false, receipts: [{kind: social_security}, {kind: ssi}, {kind: pension}, {kind: unemployment_compensation}, {kind: child_support}, {kind: colorado_works_cash}, {kind: adult_financial_cash}, {kind: tax_exempt_interest}, {kind: vocational_training_allowance, amount: 1000}, {kind: other_taxable}, {kind: other_nontaxable}]}, title: "C3-1: no wages and a $1,000 non-WIOA training allowance", expect: 1000}
  - {id: CO-4930-T3, month: "2026-11", as_of: "2026-11-15", given: {snap_student_earnings_are_excluded: false, snap_person_wages: 0, received_snap_or_public_assistance_when_joined_vista: false, snap_is_destitute_application_month: false, receipts: [{kind: social_security}, {kind: ssi}, {kind: pension}, {kind: unemployment_compensation}, {kind: child_support}, {kind: colorado_works_cash}, {kind: adult_financial_cash}, {kind: tax_exempt_interest}, {kind: dvsa_title_i_volunteer_payment, amount: 600}, {kind: other_taxable}, {kind: other_nontaxable}]}, title: "C3-1: $600 of VISTA payments to a volunteer not on SNAP or PA when joining; to one who was, nothing", expect: 600}
  - {id: CO-4930-T4, month: "2026-11", as_of: "2026-11-15", given: {snap_student_earnings_are_excluded: true, snap_person_wages: 600}, title: "A child student's earnings are excluded in full", expect: 0}
  - {id: CO-4930-T5, month: "2026-10", as_of: "2026-10-12", given: {snap_student_earnings_are_excluded: false, snap_person_wages: 1500, snap_is_destitute_application_month: true, snap_earned_income_received_after_application_date: 900}, title: "Destitute farmworker: $900 of $1,500 wages received after the application date", expect: 600}
