id: CO-307
name: "SNAP: meets the non-citizen additional condition"
identifier: snap_meets_immigrant_additional_condition
kind: derived
type: yes/no
scope: person
program: SNAP
meaning: "A lawful permanent resident clears the five-year bar of 8 U.S.C. 1613(a) by having resided in the U.S. in a qualified status for five years (8 U.S.C. 1612(a)(2)(L)), by having federal_qualifying_quarters_threshold qualifying quarters (1612(a)(2)(B)), or by one of the exceptions in snap_is_exempt_from_immigrant_waiting_period. Colorado states the same tests at 10 CCR 2506-1 4.305,B,3."
assumption: "The amended 7 U.S.C. 2015(f) states no waiting period itself; the bar comes from 8 U.S.C. 1613(a), which Pub. L. 119-21 did not amend (S21). The 40-quarter exception's further condition (no Federal means-tested benefit during a post-1996 quarter) is applied by reading snap_creditable_qualifying_quarters (CO-4262), SSA's credited quarters less those 4.505.61.A-B removes (coverage review C-5)."
derived: [any, snap_is_exempt_from_immigrant_waiting_period, [">=", snap_creditable_qualifying_quarters, federal_qualifying_quarters_threshold], has_held_qualified_status_five_years]
sources: [S21, S22, S23, S11, S12, S13, S3056]
implemented: engine
tags: [immigration, legal]
rationale: Combines the three ways 10 CCR 2506-1 4.305,B,3 lets a qualified non-citizen subject to the additional condition satisfy it (five years, 40 quarters, or an exemption), so snap_is_eligible_non_citizen can read one fact for "LPR who has cleared the additional condition."
tests:
  - {id: CO-307-T1, as_of: "2026-10-01", given: {date_of_birth: "1945-07-30", snap_has_military_connection: false, qualified_status_date: "1998-05-14", qualifying_quarters: 40}, expect: true}
  - {id: CO-307-T2, as_of: "2026-10-01", given: {status_before_lpr_adjustment: none, qualifying_quarters_with_federal_means_tested_benefit: 0, date_of_birth: "1990-01-01", snap_has_military_connection: false, qualified_status_date: "2025-06-01", qualifying_quarters: 0, receives_ssi: false, snap_receives_disability_or_blindness_payment: false, receives_disability_based_general_assistance: false, has_va_aid_attendance_housebound_or_survivor_finding: false, va_disability_rating_type: none, snap_receives_permanent_disability_retirement_benefit: false}, expect: false}
  - {id: CO-307-T3, title: "Coverage review C-5: 40 SSA quarters, 6 of them in years the family received SNAP - 34 creditable, not eligible in year 3", as_of: "2026-10-01", given: {snap_is_exempt_from_immigrant_waiting_period: false, qualifying_quarters: 40, qualifying_quarters_with_federal_means_tested_benefit: 6, has_held_qualified_status_five_years: false}, expect: false}
