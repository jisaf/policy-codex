id: CO-307
name: "SNAP: meets the non-citizen additional condition"
identifier: snap_meets_immigrant_additional_condition
kind: derived
type: yes/no
scope: person-month
program: SNAP
meaning: "A lawful permanent resident clears the five-year bar of 8 U.S.C. 1613(a) by having resided in the U.S. in a qualified status for five years (8 U.S.C. 1612(a)(2)(L)), by having federal_qualifying_quarters_threshold qualifying quarters (1612(a)(2)(B)), or by one of the exceptions in snap_is_exempt_from_immigrant_waiting_period. Colorado states the same tests at 10 CCR 2506-1 4.305,B,3."
precision: "Coverage pass 4 for SNAP S4-11 (OQ-1263 resolved): per month, since prospective budgeting reads \"anticipated income and circumstances during the issuance month\" (10 CCR 2506-1 4.402.1.A, S4734): the exceptions (CO-306) read the ages in the month. Before, the item was per person and read on the determination date in every month. Three-pattern sweep T-1 (docs/reviews/pattern-sweep-snap-ce.md): the five years are read in the month too (the five years counted to the last day of the month, written inline here and in CO-3736 and CO-3738; the separate item CO-7450 the sweep proposed was removed at its merge), not on the determination date (CO-508), so a non-citizen whose fifth anniversary falls in a later month of the certification meets the condition from that month."
assumption: "The amended 7 U.S.C. 2015(f) states no waiting period itself; the bar comes from 8 U.S.C. 1613(a), which Pub. L. 119-21 did not amend (S21). The 40-quarter exception's further condition (no Federal means-tested benefit during a post-1996 quarter) is applied by reading snap_creditable_qualifying_quarters (CO-4262), SSA's credited quarters less those 4.505.61.A-B removes (coverage review C-5)."
derived: [any, snap_is_exempt_from_immigrant_waiting_period, [">=", snap_creditable_qualifying_quarters, federal_qualifying_quarters_threshold], ["<=", "qualified_non_citizen_waiting_period_years", ["years_between", "qualified_status_date", ["days_after", -1, ["first_day", ["month_after", ["month"]]]]]]]
sources: [S21, S22, S23, S11, S12, S13, S3056, S4734]
implemented: engine
tags: [immigration, legal]
rationale: Combines the three ways 10 CCR 2506-1 4.305,B,3 lets a qualified non-citizen subject to the additional condition satisfy it (five years, 40 quarters, or an exemption), so snap_is_eligible_non_citizen can read one fact for "LPR who has cleared the additional condition."
