id: CO-1377
name: "SNAP: requires verification of unearned income"
identifier: snap_requires_verification_of_unearned_income
kind: derived
type: yes/no
scope: person-month
program: SNAP
meaning: "Whether the person's unearned income must be verified for SNAP: always when received at application, as gross nonexempt income, except that a basic categorically eligible household is not asked again unless questionable; at recertification only income whose source or amount (by more than $50) has changed, or that is questionable."
derived: [all, snap_is_household_member, [">", snap_person_unearned_income, 0], [any, [not, ["=", snap_eligibility_category, basic_categorical]], unearned_income_attestation_is_questionable], [any, [not, snap_determination_is_recertification], snap_income_changed_since_last_certification, unearned_income_attestation_is_questionable, [otherwise, snap_income_information_is_outdated, false]]]
sources: [S1618, S801, S817, S819, S820, S1055, S1056]
implemented: engine
tags: [verification, snap, income]
rationale: No existing item states this verification requirement; the phase-9 chapter needs one requirement item per element so the household's pending count and status can be derived.
tests:
  - {id: CO-1377-T1, month: "2026-10", as_of: "2026-10-01", given: {snap_resides_in_institution_providing_meals: false, snap_person_unearned_income: 1180, snap_eligibility_category: expanded_categorical, snap_determination_is_recertification: false}, expect: true}
  - {id: CO-1377-T2, month: "2026-10", as_of: "2026-10-01", given: {snap_resides_in_institution_providing_meals: false, snap_person_unearned_income: 0, snap_determination_is_recertification: false}, expect: false}
  - {id: CO-1377-T3, month: "2026-10", as_of: "2026-10-01", given: {snap_resides_in_institution_providing_meals: false, snap_person_unearned_income: 900, snap_eligibility_category: basic_categorical, unearned_income_attestation_is_questionable: false, snap_determination_is_recertification: false}, expect: false}
  - {id: CO-1377-T4, month: "2026-10", as_of: "2026-10-01", given: {snap_resides_in_institution_providing_meals: false, snap_person_unearned_income: 1180, snap_eligibility_category: standard, snap_determination_is_recertification: true, snap_income_changed_since_last_certification: false, unearned_income_attestation_is_questionable: false}, expect: false}
