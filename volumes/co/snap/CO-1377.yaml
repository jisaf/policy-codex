id: CO-1377
name: "SNAP: requires verification of unearned income"
identifier: snap_requires_verification_of_unearned_income
kind: derived
type: yes/no
scope: person-month
program: SNAP
meaning: "Whether the person's unearned income must be verified for SNAP: always when received, as gross nonexempt income, except that a basic categorically eligible household is not asked again unless questionable."
derived: [all, snap_is_household_member, [">", snap_person_unearned_income, 0], [any, [not, ["=", snap_eligibility_category, basic_categorical]], unearned_income_attestation_is_questionable]]
sources: [S801, S817, S819, S820]
implemented: engine
tags: [verification, snap, income]
open: [OQ-311]
rationale: No existing item states this verification requirement; the phase-9 chapter needs one requirement item per element so the household's pending count and status can be derived.
