identifier: snap_room_and_board_payers
kind: derived
type: whole number
scope: person-month
program: SNAP
meaning: "The number of boarders whose payments SNAP counts for the month (snap_room_and_board_payments, CO-5117: room and meals, or meals only): the boarders each such record states."
