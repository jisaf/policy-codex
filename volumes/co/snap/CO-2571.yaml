id: CO-2571
name: "SNAP: this person's participation"
identifier: snap_person_participation_status
kind: derived
type: one of
options: [eligible_member, ineligible_member_non_citizen, ineligible_member_student, ineligible_member_ssn, ineligible_member_abawd_time_limit, ineligible_member_disqualified, not_in_household]
scope: person
program: SNAP
role: outcome
meaning: "Whether this person is an eligible member of a SNAP household, and if not, why: not in any SNAP household (a resident of an institution providing meals, or a boarder); an ineligible member - an ineligible non-citizen, an ineligible student, a member who refused to provide an SSN, an ABAWD (able-bodied adult without dependents) past the time limit, or a member disqualified for an intentional program violation, a work requirement, a voluntary quit, as a fleeing felon or probation or parole violator, or for a drug or post-2014 violent felony - who stays in the household and whose income still counts, in full or pro rata (10 CCR 2506-1 4.304.4, 4.411.1); otherwise an eligible member. Whether the household is eligible and its allotment are snap_eligibility_status (CO-387) and snap_allotment (CO-385), household results reported on every member."
precision: When more than one ground applies, the first in the list above is reported. Read for the determination as household composition is (snap_is_ineligible_member, CO-311).
derived: [case, [[not, snap_is_household_member], not_in_household], [snap_is_ineligible_non_citizen, ineligible_member_non_citizen], [snap_is_ineligible_student, ineligible_member_student], [[otherwise, snap_is_disqualified_for_ssn_refusal, false], ineligible_member_ssn], [snap_is_ineligible_abawd, ineligible_member_abawd_time_limit], [snap_is_ineligible_member, ineligible_member_disqualified], [else, eligible_member]]
sources: [S19, S1810, S1812]
implemented: engine
tags: [snap, household]
rationale: "County case worker review B1: snap_eligibility_status and snap_allotment are household results, so an ineligible member (CO-01's p3) read as approved. No existing item states each person's own SNAP participation."
nearest: [CO-311, CO-304]
tests:
  - {id: CO-2571-T1, month: "2026-10", as_of: "2026-10-01", given: {snap_is_household_member: false}, expect: not_in_household}
  - {id: CO-2571-T2, month: "2026-10", as_of: "2026-10-01", given: {snap_is_household_member: true, snap_is_ineligible_non_citizen: true}, title: "CO-01's p3, undocumented, income prorated", expect: ineligible_member_non_citizen}
  - {id: CO-2571-T3, month: "2026-10", as_of: "2026-10-01", given: {snap_is_household_member: true, snap_is_ineligible_non_citizen: false, snap_is_ineligible_student: false, snap_is_ineligible_abawd: true}, expect: ineligible_member_abawd_time_limit}
  - {id: CO-2571-T4, month: "2026-10", as_of: "2026-10-01", given: {snap_is_household_member: true, snap_is_ineligible_non_citizen: false, snap_is_ineligible_student: false, snap_is_ineligible_abawd: false, snap_is_ineligible_member: true}, expect: ineligible_member_disqualified}
  - {id: CO-2571-T5, month: "2026-10", as_of: "2026-10-01", given: {snap_is_household_member: true, snap_is_ineligible_non_citizen: false, snap_is_ineligible_student: false, snap_is_ineligible_abawd: false, snap_is_ineligible_member: false}, expect: eligible_member}
