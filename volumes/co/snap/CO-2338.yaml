id: CO-2338
name: "SNAP: excluded earned income"
identifier: snap_excluded_earned_income
kind: derived
type: money
scope: person-month
program: SNAP
meaning: "The part of this person's earned income for the month that SNAP does not count: all the earnings of an elementary or secondary student under the age of parental control (snap_student_earnings_are_excluded, CO-2569; 4.405.C, 273.9(c)(7)), pay and self-employment alike; otherwise the pay snap_person_wages (CO-4324) holds that snap_person_counted_wages (CO-5113) does not count: work-study (4.403.A.1, 4.405.1), WIOA on-the-job training earnings of a member under 19 who lives with a parent or is under parental control (4.405.2.A.6, 4.403.B.2), summer youth employment and training wages (A.6), Senior Community Service Employment Program pay (A.9), combat pay (A.12), mandatory military education deductions (A.13), in-kind pay (7 CFR 273.9(c)(1)), infrequent or irregular pay when the quarter's infrequent or irregular income is no more than snap_irregular_income_quarterly_limit (4.405.A), and, in a destitute household's month of application, the pay received after the date of application (4.406.1.A)."
precision: "Earned-income records, step E1 (SNAP; docs/reviews/records-earnings-snap.md): the excluded part is the whole pay less the counted pay, both summed record by record with the same conversion (CO-4324 and CO-5113 are registered siblings), so an exclusion is converted exactly as its pay is and is never subtracted from a figure that does not hold it. Irregular self-employment receipts within the quarter's limit are left out of the business's gross receipts (snap_self_employment_gross_receipts, CO-5114), not here. The Domestic Volunteer Service Act Title I (VISTA) payments and training allowances other than WIOA, which SNAP counts as earned income, are receipts (snap_receipt_treatment_table: counted_as_earned) that snap_person_earned_income_other_than_self_employment (CO-4930) adds (coverage review snap-financial CF-1). Earnings not stated: cannot determine; a stated empty list is 0."
derived: ["case",["snap_student_earnings_are_excluded",["+","snap_person_wages","snap_self_employment_income"]],["else",["-","snap_person_wages","snap_person_counted_wages"]]]
sources: [S1620, S2204, S3100, S3101, S3108, S3109, S3128, S4101, S2964]
implemented: engine
tags: [snap, income]
rationale: "Same-word audit SW-28, dual-entry audit 3.24 and 3.25: each program's excluded income and allowable business costs were program-prefixed supplied amounts, so one receipt or one set of business costs was entered once per program. The neutral fact describes the receipt or the cost; each program's exclusion or allowable cost is its own derived item citing its list (product-owner decision, convention rule 13). The ID and identifier are kept; the amount is now derived. Earned-income records, step E1 (SNAP; docs/reviews/records-earnings-snap.md): the whole pay less the counted pay, each summed over the earnings records."
tests:
  - {id: CO-2338-T1, month: "2026-10", as_of: "2026-10-01", given: {snap_student_earnings_are_excluded: false, earnings: []}, title: "No earnings: nothing excluded", expect: 0}
  - {id: CO-2338-T2, month: "2026-10", as_of: "2026-10-01", given: {snap_student_earnings_are_excluded: false, earnings: [{kind: work_study, amount: 50}]}, title: "$50 of work-study (4.405.1)", expect: 50}
  - {id: CO-2338-T3, month: "2026-10", as_of: "2026-10-01", given: {snap_student_earnings_are_excluded: true, wages_gross: 600, snap_self_employment_income: 0, earnings: [{kind: wages, amount: 600}, {kind: self_employment_receipts}]}, expect: 600}
  - {id: CO-2338-T4, month: "2026-11", as_of: "2026-11-15", given: {dwelling_id: h1, snap_student_earnings_are_excluded: false, date_of_birth: "2009-05-01", earnings: [{kind: wioa_on_the_job_training, amount: 500}]}, title: "CF-1: WIOA on-the-job training pay of $500 earned by a 17-year-old living with her mother is excluded", others: {p2: {dwelling_id: h1, date_of_birth: "1985-01-01"}}, relationships: [[parent, p2, p1]], expect: 500}
  - {id: CO-2338-T5, month: "2026-11", as_of: "2026-11-15", given: {snap_student_earnings_are_excluded: false, date_of_birth: "2001-05-01", earnings: [{kind: wioa_on_the_job_training, amount: 500}]}, title: "CF-1: the same pay earned by a 25-year-old is counted", expect: 0}
  - {id: CO-2338-T6, month: "2026-11", as_of: "2026-11-15", given: {snap_student_earnings_are_excluded: false, earnings: [{kind: uniformed_services_special_pay, combat_zone: true, amount: 300}, {kind: scsep_employment, amount: 100}]}, title: "CF-1: $300 of combat pay and $100 of SCSEP pay", expect: 400}
  - {id: CO-2338-T7, month: "2026-11", as_of: "2026-11-15", given: {snap_student_earnings_are_excluded: false, receipts: [], earnings: [{kind: wages, irregular: true, amount: 20, month: "2026-11"}]}, title: "CF-1: $20 of odd-job pay, the only irregular income in the quarter, is excluded ($30 or less)", expect: 20}
  - {id: CO-2338-T8, month: "2026-11", as_of: "2026-11-15", given: {snap_student_earnings_are_excluded: false, receipts: [{kind: other_nontaxable, amount: 25, irregular: true, month: "2026-10"}], earnings: [{kind: wages, irregular: true, amount: 20, month: "2026-11"}]}, title: "CF-1: $20 of odd-job pay with $25 of irregular unearned income in October: $45 in the quarter, counted", expect: 0}
  - {id: CO-2338-T9, month: "2027-01", as_of: "2027-01-15", given: {snap_student_earnings_are_excluded: false, earnings: [{kind: scsep_employment, amount: 1250, frequency: weekly, per_payment: 250}]}, title: "Coverage pass 2 C2-1: $250 weekly, all of it SCSEP pay, five paydays (1,250 received): converted as the pay is, 250 x 4.3 = 1,075 excluded", expect: 1075}
  - {id: CO-2338-T10, month: "2027-01", as_of: "2027-01-15", given: {snap_student_earnings_are_excluded: false, earnings: [{kind: wages, amount: 1000, frequency: weekly, per_payment: 200}, {kind: scsep_employment, amount: 250}]}, title: "C2-1, per record: $200 weekly wages (5 paydays) and $250 of SCSEP pay a month: only the SCSEP pay, as received, 250", expect: 250}
  - {id: CO-2338-T11, month: "2026-10", as_of: "2026-10-01", given: {snap_student_earnings_are_excluded: false}, title: "Earnings not stated: cannot determine", expect: unknown}
