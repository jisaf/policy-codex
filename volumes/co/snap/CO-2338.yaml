id: CO-2338
name: "SNAP: excluded earned income"
identifier: snap_excluded_earned_income
kind: derived
type: money
scope: person-month
program: SNAP
meaning: "The part of this person's earned income for the month that 10 CCR 2506-1 4.405 and 7 CFR 273.9(c) exclude from SNAP income: all the earnings of an elementary or secondary student under the age of parental control (snap_student_earnings_are_excluded, CO-2569; 4.405.C, 273.9(c)(7)); otherwise work-study (4.403.A.1, 4.405.1), WIOA on-the-job training earnings of a member under snap_wioa_ojt_exclusion_age_limit (19) who lives with a parent or is under the parental control of an adult member (4.405.2.A.6, 4.403.B.2), summer youth employment and training wages (A.6), Senior Community Service Employment Program funds (A.9), combat pay (A.12), mandatory military education deductions (A.13), and infrequent or irregular earnings when the infrequent or irregular income of the calendar quarter, earned (infrequent_or_irregular_earned_income_received, CO-4010) and unearned (infrequent_or_irregular_income_in_quarter, CO-4077) together, is no more than snap_irregular_income_quarterly_limit (4.405.A; 7 CFR 273.9(c)(2) says \"in a quarter\", S3128, and the calendar quarter is also the federal fiscal quarter)."
precision: "The sum of the neutral receipt facts the program's list names (each part of wages_gross, so the program's countable income subtracts it); an unstated receipt is 0. A child student's wages are read as SNAP counts them (snap_person_wages, CO-4324). The WIOA test reads the member's age on the first day of the month and the same living-with-a-parent or parental-control test as CO-2569. The Domestic Volunteer Service Act Title I (VISTA) payments and training allowances other than WIOA, which SNAP counts as earned income, are stated in the unearned income facts; snap_excluded_unearned_income (CO-2339) leaves them out of unearned income and snap_person_earned_income (CO-330) adds them (coverage review snap-financial CF-1). Coverage pass 2 C2-1: the excluded parts of the regular pay (WIOA on-the-job training, summer youth wages, SCSEP, combat pay, military education deductions) are the month's receipts converted at the rate the month's pay is (snap_regular_wages_conversion_factor, CO-4682): 4.3 or 2.15 paydays rather than the month's 4 or 5 when the wages are converted from the pay schedule (4.402.A.2), 1 otherwise. Work-study and infrequent or irregular earnings are not regular pay; snap_person_wages (CO-4324) adds them back in the converted case, so they are subtracted as received."
derived: [case, [snap_student_earnings_are_excluded, [+, snap_person_wages, snap_self_employment_income]], [else, [+, [otherwise, work_study_earnings, 0], ["*", snap_regular_wages_conversion_factor, [+, [case, [[">", [otherwise, wioa_on_the_job_training_wages, 0], 0], [case, [[all, ["<", [years_between, date_of_birth, [first_day, [month]]], snap_wioa_ojt_exclusion_age_limit], [any, [exists_related, [child, stepchild], [otherwise, [in_group, [P], lives_with], true]], [otherwise, snap_is_under_parental_control_of_household_member, false]]], wioa_on_the_job_training_wages], [else, 0]]], [else, 0]], [otherwise, summer_youth_employment_wages, 0], [otherwise, scsep_payments_received, 0], [otherwise, combat_zone_pay_received, 0], [otherwise, military_pay_education_deductions, 0]]], [case, [["<=", [+, infrequent_or_irregular_income_in_quarter, [sum_months, [months_from_to, [months_before, ["-", ["-", [month_of_year, [month]], 1], ["*", 3, ["-", 0, [ceil, ["-", 0, ["/", ["-", [month_of_year, [month]], 1], 3]]]]]], [month]], [months_after, ["-", 2, ["-", ["-", [month_of_year, [month]], 1], ["*", 3, ["-", 0, [ceil, ["-", 0, ["/", ["-", [month_of_year, [month]], 1], 3]]]]]]], [month]]], [at, [otherwise, infrequent_or_irregular_earned_income_received, 0], [that_month]]]], snap_irregular_income_quarterly_limit], [otherwise, infrequent_or_irregular_earned_income_received, 0]], [else, 0]]]]]
sources: [S1620, S2204, S3100, S3101, S3108, S3109, S3128]
implemented: engine
tags: [snap, income]
rationale: "Same-word audit SW-28, dual-entry audit 3.24 and 3.25: each program's excluded income and allowable business costs were program-prefixed supplied amounts, so one receipt or one set of business costs was entered once per program. The neutral fact describes the receipt or the cost; each program's exclusion or allowable cost is its own derived item citing its list (product-owner decision, convention rule 13). The ID and identifier are kept; the amount is now derived."
tests:
  - {id: CO-2338-T1, month: "2026-10", as_of: "2026-10-01", given: {snap_student_earnings_are_excluded: false}, expect: 0}
  - {id: CO-2338-T2, month: "2026-10", as_of: "2026-10-01", given: {snap_student_earnings_are_excluded: false, work_study_earnings: 50}, expect: 50}
  - {id: CO-2338-T3, month: "2026-10", as_of: "2026-10-01", given: {snap_student_earnings_are_excluded: true, wages_gross: 600, snap_self_employment_income: 0}, expect: 600}
  - {id: CO-2338-T4, title: "CF-1: WIOA on-the-job training pay of $500 earned by a 17-year-old living with her mother is excluded", month: "2026-11", as_of: "2026-11-15", given: {snap_student_earnings_are_excluded: false, date_of_birth: "2009-05-01", wioa_on_the_job_training_wages: 500}, others: {p2: {date_of_birth: "1985-01-01"}}, relationships: [[parent, p2, p1]], expect: 500}
  - {id: CO-2338-T5, title: "CF-1: the same pay earned by a 25-year-old is counted", month: "2026-11", as_of: "2026-11-15", given: {snap_student_earnings_are_excluded: false, date_of_birth: "2001-05-01", wioa_on_the_job_training_wages: 500}, expect: 0}
  - {id: CO-2338-T6, title: "CF-1: $300 of combat pay and $100 of SCSEP pay", month: "2026-11", as_of: "2026-11-15", given: {snap_student_earnings_are_excluded: false, combat_zone_pay_received: 300, scsep_payments_received: 100}, expect: 400}
  - {id: CO-2338-T7, title: "CF-1: $20 of odd-job pay, the only irregular income in the quarter, is excluded ($30 or less)", month: "2026-11", as_of: "2026-11-15", given: {snap_student_earnings_are_excluded: false, infrequent_or_irregular_earned_income_received: {"2026-11": 20}}, expect: 20}
  - {id: CO-2338-T8, title: "CF-1: $20 of odd-job pay with $25 of irregular unearned income in October: $45 in the quarter, counted", month: "2026-11", as_of: "2026-11-15", given: {snap_student_earnings_are_excluded: false, infrequent_or_irregular_earned_income_received: {"2026-11": 20}, infrequent_or_irregular_income_received: {"2026-10": 25}}, expect: 0}
  - {id: CO-2338-T9, title: "Coverage pass 2 C2-1: $250 weekly, all of it SCSEP pay, five paydays (1,250 received): 1,250 x 1,075/1,250 = 1,075 excluded, the whole converted pay", month: "2027-01", as_of: "2027-01-15", given: {snap_student_earnings_are_excluded: false, wages_gross: 1250, snap_person_wages: 1075, scsep_payments_received: 1250, infrequent_or_irregular_earned_income_received: 0, infrequent_or_irregular_income_in_quarter: 0}, expect: 1075}
