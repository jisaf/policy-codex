  - {id: CO-305-T3, as_of: "2026-10-01", given: {date_of_birth: "1990-01-01", snap_resides_in_institution_providing_meals: false}, others: {p2: {date_of_birth: "1965-01-01", snap_resides_in_institution_providing_meals: false}}, relationships: [[parent, p2, p1]], expect: [p1]}
