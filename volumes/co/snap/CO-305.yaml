id: CO-305
name: "SNAP: household members"
identifier: snap_household_members
kind: derived
type: group of persons
scope: person
program: SNAP
meaning: "The persons who make up this person's SNAP purchase-and-prepare unit under 7 CFR 273.1(a)-(b)(1) and 10 CCR 2506-1 4.304 - everyone reachable from this person by a chain of buys_prepares_with, spouse, mandatory-member parent/child, or mandatory-member caretaker/dependent edges, minus anyone excluded as an institution resident. A buys_prepares_with edge is not crossed into or out of a household of an elderly person with a disability and that person's spouse granted separate household status under 7 CFR 273.1(b)(2) (snap_is_in_elderly_disabled_separate_household, CO-2304). Each member's value of this item is the same set (their own unit); a person who is not a household member (an institution resident) has no unit, so the value is empty for them."
precision: "A parent/child edge is only crossed into the household when the child member of that pair is under snap_mandatory_child_age, matching the \"person under 22 ... living with parent\" mandatory-combination rule (7 CFR 273.1(b)(1)(ii); 10 CCR 2506-1 4.304.1.A.1). A caretaker/dependent edge is only crossed when the dependent is under snap_parental_control_age (18) and is_under_parental_control_of_household_member is true for the dependent, matching the separate \"child... under 18... under the parental control of a household member other than his or her parent\" mandatory combination (7 CFR 273.1(b)(1)(iii); 10 CCR 2506-1 4.304.1.A.2). A spouse edge always crosses, matching 273.1(b)(1)(i); a buys_prepares_with edge crosses (273.1(a)(3)) unless either end is in a separate elderly and disabled household (273.1(b)(2), 4.304.3.A; phase-10 sweep, OQ-37). The mandatory parent/child and caretaker edges still cross, since 4.304.1 keeps mandatory members together. CDHS review C-2: a buys_prepares_with edge is not crossed into or out of a roomer or live-in attendant (snap_is_roomer_or_live_in_attendant, CO-2566; 7 CFR 273.1(c)(5)-(6)), who may be a separate household; the mandatory spouse, parent and child edges still cross, since 273.1(b)(1) persons are never roomers or attendants. A boarder is left out through snap_is_household_member (CO-304). Strikers (273.1(e)) are not modeled (OQ-534). Same-word audit SW-1/SW-3/SW-8 (OQ-396): the parent edge is a legal parent or a stepparent (\"natural or adoptive parent(s) or step-parent(s)\", S2, S4); the parental-control edge is a household member with primary responsibility for the child or the child's legal guardian; a foster_parent edge is never crossed, since the combination is for \"a child (other than a foster child)\" (S2 iii)."
derived: [filter, [reachable, [buys_prepares_with, spouse, parent, child, stepparent, stepchild, has_primary_responsibility_for, in_primary_care_of, legal_guardian, ward], [any, [rel, [spouse], [P]], [all, [rel, [buys_prepares_with], [P]], [not, snap_is_in_elderly_disabled_separate_household], [not, [of, [P], snap_is_in_elderly_disabled_separate_household]], [not, [otherwise, snap_is_roomer_or_live_in_attendant, false]], [not, [otherwise, [of, [P], snap_is_roomer_or_live_in_attendant], false]]], [all, [rel, [parent, stepparent], [P]], ["<", [of, [P], age], snap_mandatory_child_age]], [all, [rel, [child, stepchild], [P]], ["<", age, snap_mandatory_child_age]], [all, [rel, [has_primary_responsibility_for, legal_guardian], [P]], ["<", [of, [P], age], snap_parental_control_age], [of, [P], is_under_parental_control_of_household_member]], [all, [rel, [in_primary_care_of, ward], [P]], ["<", age, snap_parental_control_age], is_under_parental_control_of_household_member]]], [all, snap_is_household_member, [of, [P], snap_is_household_member]]]
sources: [S1, S2, S4, S1604, S1605, S1815]
implemented: engine
tags: [household]
open: [OQ-534]
rationale: "No existing item in this volume builds the P36/P37 household-composition closure; this is the item every other SNAP rule (eligible members, size, income aggregation, allotment) reads as \"the unit\". Modeled as P36 conditional-closure-then-P37-filter exactly as docs/conventions.md's new patterns for this phase describe. Fix-round (P-6): added the caretaker/dependent mandatory-combination edge for 7 CFR 273.1(b)(1)(iii)/10 CCR 2506-1 4.304.1.A.2 (S2, S4), reading the previously-orphaned is_under_parental_control_of_household_member (CO-018) and the existing snap_parental_control_age (CO-102) parameter. This is exactly the three-generation-household case (a child under 18 living with a grandparent who is not the child's parent) the volume's own target household shape raises."
