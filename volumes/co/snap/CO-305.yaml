open: [OQ-1262, OQ-1405]
rationale: "No existing item in this volume builds the P36/P37 household-composition closure; this is the item every other SNAP rule (eligible members, size, income aggregation, allotment) reads as \"the unit\". Modeled as P36 conditional-closure-then-P37-filter exactly as docs/conventions.md's new patterns for this phase describe. Fix-round (P-6): added the caretaker/dependent mandatory-combination edge for 7 CFR 273.1(b)(1)(iii)/10 CCR 2506-1 4.304.1.A.2 (S2, S4), reading the previously-orphaned snap_is_under_parental_control_of_household_member (CO-018) and the existing snap_parental_control_age (CO-102) parameter. This is exactly the three-generation-household case (a child under 18 living with a grandparent who is not the child's parent) the volume's own target household shape raises. Same-word audit SW-6: SNAP's spouses include persons living together who are free to marry and represent themselves as spouses (7 CFR 273.1(b)(1)(i), S4 B), so the holds_out_as_spouse_with role is read beside the legal spouse. Same-word SW-7: living together is read from lives_with."
