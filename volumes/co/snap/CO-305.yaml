id: CO-305
name: "SNAP: household members"
identifier: snap_household_members
kind: derived
type: group of persons
scope: person-month
program: SNAP
meaning: "The persons who make up this person's SNAP purchase-and-prepare unit under 7 CFR 273.1(a)-(b)(1) and 10 CCR 2506-1 4.304 - everyone reachable from this person by a chain of buys_prepares_with, spouse, mandatory-member parent/child, or mandatory-member caretaker/dependent edges, minus anyone excluded as an institution resident. A buys_prepares_with edge is not crossed into or out of a household of an elderly person with a disability and that person's spouse granted separate household status under 7 CFR 273.1(b)(2) (snap_is_in_elderly_disabled_separate_household, CO-2304). Each member's value of this item is the same set (their own unit); a person who is not a household member (an institution resident) has no unit, so the value is empty for them."
precision: "A parent/child edge is only crossed into the household when the child member of that pair is under snap_mandatory_child_age in the month, matching the \"person under 22 ... living with parent\" mandatory-combination rule (7 CFR 273.1(b)(1)(ii); 10 CCR 2506-1 4.304.1.A.1). A caretaker/dependent edge is only crossed when the dependent is under snap_parental_control_age (18) and snap_is_under_parental_control_of_household_member is true for the dependent, matching the separate \"child... under 18... under the parental control of a household member other than his or her parent\" mandatory combination (7 CFR 273.1(b)(1)(iii); 10 CCR 2506-1 4.304.1.A.2). A spouse edge always crosses, matching 273.1(b)(1)(i); a buys_prepares_with edge crosses (273.1(a)(3)) unless either end is in a separate elderly and disabled household (273.1(b)(2), 4.304.3.A; phase-10 sweep, OQ-37). The mandatory parent/child and caretaker edges still cross, since 4.304.1 keeps mandatory members together. CDHS review C-2: a buys_prepares_with edge is not crossed into or out of a roomer or live-in attendant (snap_is_roomer_or_live_in_attendant, CO-2566; 7 CFR 273.1(c)(5)-(6)), who may be a separate household; the mandatory spouse, parent and child edges still cross, since 273.1(b)(1) persons are never roomers or attendants. A boarder is left out through snap_is_household_member (CO-304). A striking member stays in the household; 7 CFR 273.1(e) bars the household unless it was eligible the day before the strike (snap_household_meets_striker_condition, CO-3504) and counts the higher of the striker's pre-strike and current income (CO-3503; OQ-534, resolved). Same-word audit SW-1/SW-3/SW-8 (OQ-396): the parent edge is a legal parent or a stepparent (\"natural or adoptive parent(s) or step-parent(s)\", S2, S4); the parental-control edge is a household member with primary responsibility for the child or the child's legal guardian; a foster_parent edge is never crossed, since the combination is for \"a child (other than a foster child)\" (S2 iii). Same-word audit SW-7 (convention rule 17): an edge joins persons who live together (lives_with, CO-1925, from dwelling_id); where a case states no dwelling_id the edge is read as living together, as before. A SNAP household is persons who live together (7 CFR 273.1(a), S2), so no edge is crossed to a person who lives elsewhere. Coverage pass 4 for SNAP S4-11 (OQ-1263 resolved): the household is built for each month, and the ages of the mandatory combinations are taken in the month evaluated, since prospective budgeting reads \"anticipated income and circumstances during the issuance month\" (10 CCR 2506-1 4.402.1.A, S4734): a child is under 22 (or under 18 for parental control) when under it on the first day of the month (the age on the first day of the month), so a son who turns 22 during a month is a mandatory member for that month and not from the next (the day is OQ-1262's). The separate elderly and disabled household (CO-2304) is also read in the month. Before, the household was built once on the determination date's ages and every month read it. Three-pattern sweep T-7 (docs/reviews/pattern-sweep-snap-ce.md): a person of the case who died before the first day of the month (date_of_death, CO-2868), or who is not yet born on its last day (date_of_birth after it), is in no household that month, since a household is individuals who live together (7 CFR 273.1(a), S1) in the issuance month (4.402.1.A, S4734); the member who dies is counted in the month of death and the child born is counted in the month of birth, the day being OQ-1405's. A person whose date of death is not stated is living, and one whose date of birth is not stated is born (the persons a case names are persons; the test reads a stated date). Before, a stated death or a birth after the month changed no month's household (probes CO-945, CO-946). Three-pattern sweep D-1 (docs/reviews/pattern-sweep-snap-ce.md): lives_with (CO-1925) is read as stated, required where read: no text on file says that persons related on the application live together unless it says otherwise (7 CFR 273.1(a): a household is individuals who live together and customarily purchase and prepare meals together, S1), so a stated relationship is no longer read as living together where no dwelling_id is stated (decision 4; docs/conventions.md rule 17, as MAGI's readers since coverage pass 6, C6-10); a case with persons related across the edge states dwelling_id for each of them."
