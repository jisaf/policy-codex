  - {id: CO-305-T6, as_of: "2026-10-01", given: {date_of_birth: "2000-01-01", snap_resides_in_institution_providing_meals: false, is_under_parental_control_of_household_member: false}, others: {p2: {date_of_birth: "1960-01-01", snap_resides_in_institution_providing_meals: false}}, relationships: [[has_primary_responsibility_for, p2, p1]], expect: [p1]}
