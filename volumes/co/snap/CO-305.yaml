id: CO-305
name: "SNAP: household members"
identifier: snap_household_members
kind: derived
type: group of persons
scope: person
program: SNAP
meaning: "The persons who make up this person's SNAP purchase-and-prepare unit under 7 CFR 273.1(a)-(b)(1) and 10 CCR 2506-1 4.304 - everyone reachable from this person by a chain of buys_prepares_with, spouse, or mandatory-member parent/child edges, minus anyone excluded as an institution resident. Each member's value of this item is the same set (their own unit)."
precision: A parent/child edge is only crossed into the household when the child member of that pair is under snap_mandatory_child_age (22), matching the "person under 22 ... living with parent" mandatory-combination rule (7 CFR 273.1(b)(1)(ii); 10 CCR 2506-1 4.304.1.A.1); this volume does not yet model the separate under-18/non-parent "parental control" mandatory combination (273.1(b)(1)(iii)) as its own edge type because the case relationships in this batch express it through buys_prepares_with, not a distinct "parental control" relationship. A buys_prepares_with or spouse edge always crosses, matching 273.1(a)(3) and 273.1(b)(1)(i).
derived: [filter, [reachable, [buys_prepares_with, spouse, parent, child], [any, [rel, [buys_prepares_with, spouse], [P]], [all, [rel, [parent], [P]], ["<", [of, [P], snap_age], snap_mandatory_child_age]], [all, [rel, [child], [P]], ["<", snap_age, snap_mandatory_child_age]]]], [of, [P], snap_is_household_member]]
sources: [S1, S2, S4]
implemented: engine
tags: [household]
rationale: No existing item in this volume builds the P36/P37 household-composition closure; this is the item every other SNAP rule (eligible members, size, income aggregation, allotment) reads as "the unit". Modeled as P36 conditional-closure-then-P37-filter exactly as docs/conventions.md's new patterns for this phase describe.
tests:
  - {id: CO-305-T1, as_of: "2026-10-01", given: {date_of_birth: "1947-03-12", in_medical_institution: true, institution_entry_date: "2026-10-01"}, others: {p2: {date_of_birth: "1945-07-30", in_medical_institution: false}, p3: {date_of_birth: "1985-01-22", in_medical_institution: false}, p4: {date_of_birth: "2009-04-08", in_medical_institution: false}, p5: {date_of_birth: "2026-02-03", in_medical_institution: false}}, relationships: [[spouse, p1, p2], [parent, p2, p3], [parent, p3, p4], [parent, p4, p5], [buys_prepares_with, p1, p2], [buys_prepares_with, p2, p3], [buys_prepares_with, p3, p4], [buys_prepares_with, p4, p5]], expect: [p2, p3, p4, p5]}
  - {id: CO-305-T2, as_of: "2026-10-01", given: {date_of_birth: "2010-01-01", in_medical_institution: false}, others: {p2: {date_of_birth: "1980-01-01", in_medical_institution: false}}, relationships: [[parent, p2, p1]], expect: [p1, p2]}
  - {id: CO-305-T3, as_of: "2026-10-01", given: {date_of_birth: "1990-01-01", in_medical_institution: false}, others: {p2: {date_of_birth: "1965-01-01", in_medical_institution: false}}, relationships: [[parent, p2, p1]], expect: [p1]}
