id: CO-5014
name: "SNAP: excluded infrequent or irregular unearned receipts"
identifier: snap_excluded_irregular_receipts
kind: derived
type: money
scope: person-month
program: SNAP
meaning: "The month's recurring receipts marked infrequent or irregular that SNAP's counting table counts, when the calendar quarter's infrequent or irregular income, unearned and earned, is no more than snap_irregular_income_quarterly_limit (snap_irregular_income_is_within_quarterly_limit, CO-5110; 10 CCR 2506-1 4.405.A); otherwise 0, and 0 in a month with no such receipt."
precision: "Earned-income records, step E1 (SNAP; docs/reviews/records-earnings-snap.md): the quarter test is one item, read by this item and by snap_irregular_earnings_are_excluded (CO-5111) (duplicate-paths audit D-S4: it was written in both this item and snap_excluded_earned_income, CO-2338). A month with no irregular counted receipt has nothing to exclude, so the quarter is not read."
derived: [case, [["=", [sum_receipts, receipts, [all, [receipt, irregular], [not, ["=", [receipt, frequency], once]], [received_in, [month]], [in, [lookup, snap_receipt_treatment_table, [receipt, kind]], [counted, counted_no_rule_excludes, counted_beyond_quarterly_limit]]], [receipt, amount]], 0], 0], [snap_irregular_income_is_within_quarterly_limit, [sum_receipts, receipts, [all, [receipt, irregular], [not, ["=", [receipt, frequency], once]], [received_in, [month]], [in, [lookup, snap_receipt_treatment_table, [receipt, kind]], [counted, counted_no_rule_excludes, counted_beyond_quarterly_limit]]], [receipt, amount]]], [else, 0]]
sources: [S3100, S3128]
implemented: engine
tags: [snap, income]
rationale: "Receipt records, migration phase 1: the irregular-income term of snap_excluded_unearned_income (CO-2339), read from the receipts. Earned-income records, step E1 (SNAP; docs/reviews/records-earnings-snap.md): reads the shared quarter test (CO-5110), whose earned half is the earnings records."
tests:
  - {id: CO-5014-T1, month: "2026-11", as_of: "2026-11-15", given: {earnings: [], receipts: [{kind: other_nontaxable, amount: 10, irregular: true}]}, title: "$10 a month, $30 in the quarter: within the limit, excluded", expect: 10}
  - {id: CO-5014-T2, month: "2026-11", as_of: "2026-11-15", given: {earnings: [], receipts: [{kind: other_nontaxable, amount: 20, irregular: true}]}, title: "$20 a month, $60 in the quarter: over the limit, counted", expect: 0}
  - {id: CO-5014-T3, month: "2026-11", as_of: "2026-11-15", given: {receipts: [{kind: social_security, amount: 900}]}, title: "No irregular receipt in the month: 0, the quarter not read (earnings not stated)", expect: 0}
  - {id: CO-5014-T4, month: "2026-11", as_of: "2026-11-15", given: {receipts: [{kind: other_nontaxable, amount: 10, irregular: true, month: "2026-11"}], earnings: [{kind: wages, amount: 25, irregular: true, month: "2026-10"}]}, title: "$10 of irregular unearned income and $25 of odd-job pay in October: $35 in the quarter, counted", expect: 0}
