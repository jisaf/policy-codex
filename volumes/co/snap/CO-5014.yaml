id: CO-5014
name: "SNAP: excluded infrequent or irregular unearned receipts"
identifier: snap_excluded_irregular_receipts
kind: derived
type: money
scope: person-month
program: SNAP
meaning: "The month's recurring receipts marked infrequent or irregular that SNAP's counting table counts, when the calendar quarter's infrequent or irregular income, unearned and earned, is no more than snap_irregular_income_quarterly_limit (snap_irregular_income_is_within_quarterly_limit, CO-5110; 10 CCR 2506-1 4.405.A); otherwise 0, and 0 in a month with no such receipt."
precision: "Earned-income records, step E1 (SNAP; docs/reviews/records-earnings-snap.md): the quarter test is one item, read by this item and by snap_irregular_earnings_are_excluded (CO-5111) (duplicate-paths audit D-S4: it was written in both this item and snap_excluded_earned_income, CO-2338). A month with no irregular counted receipt has nothing to exclude, so the quarter is not read. Coverage pass 4 for SNAP (docs/reviews/coverage4-snap.md, S4-1 to S4-4): a record is placed in the month of its regular_date when it states one, since pay or a benefit that came early or late because of a holiday, a weekend, a changed pay date, a mailing cycle or the employee's request is counted by its regular schedule (10 CCR 2506-1 4.402.B.1-3, S4720; 4.403.A.3, S4721), else in the month it came in; a stream (a record with no month and no date) recurs only from the month its job or source began through the month it ended (job_start_date and job_end_date; start_date and end_date on a receipt), since pay after a job ends or before it begins is not anticipated with reasonable certainty (4.402.1.B, S4722). In a destitute household's month of application a record dated after the date of application is not counted (4.406.1.A, S2964; coverage pass 4 S4-14)."
