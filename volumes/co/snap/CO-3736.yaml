id: CO-3736
name: "SNAP: requires verification of qualifying quarters"
identifier: snap_requires_verification_of_qualifying_quarters
kind: derived
type: yes/no
scope: person-month
program: SNAP
meaning: "Whether the forty qualifying quarters of this household member must be verified for SNAP: a lawful permanent resident whose eligibility rests on them - not five years in qualified status, not exempt from the waiting period, and at least federal_qualifying_quarters_threshold quarters - at application, and at recertification when the immigration status information is outdated (10 CCR 2506-1 4.505.61; 7 CFR 273.2(f)(1)(ii)(A): \"The State agency must also verify these factors, if applicable to the alien's eligibility\")."
precision: "Where eligibility rests on another ground (five years, an exemption), the quarters are not applicable to it and are not verified. The recertification arm reads snap_immigration_status_information_is_outdated (CO-2322), read as false when not stated, as the status itself does (CO-1373). KL-SNAP-2 closed (2026-11-24; docs/reviews/known-limits.md): 'five years in qualified status' is counted as snap_meets_immigrant_additional_condition (CO-307) counts it, from the start of the waiting period (qualified_non_citizen_waiting_period_start_date, CO-7820: the first qualified status, 8 U.S.C. 1612(a)(2)(L), S22; 10 CCR 2506-1 4.305.B.3.a, S12) or from the status held now, to the last day of the month; before, from qualified_status_date only, so the quarters of a lawful permanent resident who had been paroled more than five years before were verified though eligibility rested on the five years."
derived: [all, snap_is_household_member, ["=", immigration_status, lawful_permanent_resident], [not, [any, ["<=", "qualified_non_citizen_waiting_period_years", ["years_between", "qualified_status_date", ["days_after", -1, ["first_day", ["month_after", ["month"]]]]]], ["<=", "qualified_non_citizen_waiting_period_years", ["years_between", "qualified_non_citizen_waiting_period_start_date", ["days_after", -1, ["first_day", ["month_after", ["month"]]]]]]]], [not, snap_is_exempt_from_immigrant_waiting_period], [">=", snap_creditable_qualifying_quarters, federal_qualifying_quarters_threshold], [any, [not, snap_determination_is_recertification], [otherwise, snap_immigration_status_information_is_outdated, false]]]
sources: [S2516, S802, S3056, S22, S12]
implemented: engine
tags: [verification, snap, immigration]
rationale: "Final verification V-4 (docs/reviews/final-verification.md): SNAP verified only the SAVE status, so an LPR eligible through forty quarters was certified on the attested count, which 4.505.61 forbids."
tests:
  - {id: CO-3736-T1, title: "An LPR of two years with 40 quarters, no exemption: verify the quarters", as_of: "2026-10-01", month: "2026-10", given: {qualifying_quarters_with_federal_means_tested_benefit: 0, snap_is_household_member: true, immigration_status: lawful_permanent_resident, status_before_lpr_adjustment: none, qualified_status_date: '2024-06-01', snap_is_exempt_from_immigrant_waiting_period: false, qualifying_quarters: 40, snap_determination_is_recertification: false}, expect: true}
  - {id: CO-3736-T2, title: "An LPR of six years: the quarters are not what eligibility rests on", as_of: "2026-10-01", month: "2026-10", given: {snap_is_household_member: true, immigration_status: lawful_permanent_resident, qualified_status_date: '2015-01-01'}, expect: false}
  - {id: CO-3736-T3, title: "A citizen", as_of: "2026-10-01", month: "2026-10", given: {snap_is_household_member: true, immigration_status: us_citizen}, expect: false}
  # KL-SNAP-2 (2026-11-24): T1 states that she was admitted directly as a lawful permanent resident (status_before_lpr_adjustment none), as its story has it: the start of the five years reads it (CO-7820). No answer moved.
  # KL-SNAP-2 (LPR-EX-PAROLEE): paroled into the United States 2019-05-01, lawful permanent resident 2023-03-01 (status_before_lpr_adjustment other), 40 creditable quarters (40 - 0), no exemption, an application.
  - {id: CO-3736-T90, title: "KL-SNAP-2 (was true): November 2026, last day 2026-11-30: from the parole, 2019-05-01, 7 whole years >= 5: eligibility rests on the five years, not on the quarters: not verified", as_of: "2026-11-10", month: "2026-11", given: {snap_is_household_member: true, immigration_status: lawful_permanent_resident, qualified_status_date: "2023-03-01", us_entry_date: "2019-05-01", status_before_lpr_adjustment: other, first_qualified_status_date: "2019-05-01", snap_is_exempt_from_immigrant_waiting_period: false, qualifying_quarters: 40, qualifying_quarters_with_federal_means_tested_benefit: 0, snap_determination_is_recertification: false}, expect: false}
  - {id: CO-3736-T91, title: "KL-SNAP-2: the same in April 2024, last day 2024-04-30: 2019-05-01 to 2024-04-30 is 4 whole years; from 2023-03-01, 1: eligibility rests on the 40 quarters: verify them", as_of: "2024-04-10", month: "2024-04", given: {snap_is_household_member: true, immigration_status: lawful_permanent_resident, qualified_status_date: "2023-03-01", us_entry_date: "2019-05-01", status_before_lpr_adjustment: other, first_qualified_status_date: "2019-05-01", snap_is_exempt_from_immigrant_waiting_period: false, qualifying_quarters: 40, qualifying_quarters_with_federal_means_tested_benefit: 0, snap_determination_is_recertification: false}, expect: true}
  - {id: CO-3736-T92, title: "KL-SNAP-2: November 2026 without the first date stated: whether eligibility rests on the quarters cannot be told: cannot determine (required where read; was true)", as_of: "2026-11-10", month: "2026-11", given: {snap_is_household_member: true, immigration_status: lawful_permanent_resident, qualified_status_date: "2023-03-01", us_entry_date: "2019-05-01", status_before_lpr_adjustment: other, snap_is_exempt_from_immigrant_waiting_period: false, qualifying_quarters: 40, qualifying_quarters_with_federal_means_tested_benefit: 0, snap_determination_is_recertification: false}, expect: unknown}
