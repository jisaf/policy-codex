id: CO-3702
name: "SNAP: sponsor resources deemed"
identifier: snap_sponsor_deemed_resources
kind: derived
type: money
scope: person
program: SNAP
meaning: "The resources SNAP counts to this eligible sponsored non-citizen from the person's sponsors (10 CCR 2506-1 4.305.2.C, D.6; 7 CFR 273.4(c)(2)(iv)-(v)): the total countable resources of the sponsors less snap_sponsor_resource_reduction, never below zero, divided by snap_sponsor_deeming_divisor; zero when deeming does not apply."
precision: "Each sponsor's resources are read from the sponsor's own facts as SNAP counts them (snap_countable_liquid_resources, CO-4176, and snap_countable_nonliquid_resources, CO-074; 273.4(c)(2)(iv): \"as determined in accordance with § 273.8\"); the sponsors are those who signed the affidavit (CO-2713), as for income (CO-3711). A citizen is out at the first test. Final verification pass 2 N-2: a member who is ineligible until the sponsor information or the status verification is provided (snap_is_ineligible_pending_non_citizen_verification, CO-4154) is an ineligible non-citizen, and 4.505.7.C (S2954) counts that member's resources \"excluding the attributed income and resources of the non-citizen's sponsor\". N-8: the sponsor's liquid resources are read net of the 4.410 exclusions (CO-4176), as the household's own are."
derived: [case, [[all, snap_is_eligible_non_citizen, [not, snap_is_ineligible_pending_non_citizen_verification], snap_sponsor_deeming_applies], ["/", [max, 0, ["-", [sum, sponsors, ["+", [of, [P], snap_countable_liquid_resources], [of, [P], snap_countable_nonliquid_resources]]], snap_sponsor_resource_reduction]], snap_sponsor_deeming_divisor]], [else, 0]]
sources: [S2502, S2503, S2954]
open: [OQ-730]
implemented: engine
tags: [snap, immigration, resources]
rationale: "Final verification F-2: no item deemed a sponsor's resources; snap_household_countable_resources (CO-343) adds this amount for each member."
tests:
  - {id: CO-3702-T1, title: "Sponsor with $2,600: 2,600 - 1,500 = 1,100, shared by 2 = 550", as_of: "2026-10-01", given: {snap_is_eligible_non_citizen: true, snap_is_ineligible_pending_non_citizen_verification: false, snap_sponsor_deeming_applies: true, sponsors: [p2], snap_sponsor_deeming_divisor: 2}, others: {p2: {liquid_resources_value: 2600, snap_countable_nonliquid_resources: 0}}, expect: 550}
  - {id: CO-3702-T2, title: "Sponsor with $1,200: below the $1,500 reduction, nothing", as_of: "2026-10-01", given: {snap_is_eligible_non_citizen: true, snap_is_ineligible_pending_non_citizen_verification: false, snap_sponsor_deeming_applies: true, sponsors: [p2], snap_sponsor_deeming_divisor: 1}, others: {p2: {liquid_resources_value: 1200, snap_countable_nonliquid_resources: 0}}, expect: 0}
  - {id: CO-3702-T3, as_of: "2026-10-01", given: {snap_is_eligible_non_citizen: false}, expect: 0}
  - {id: CO-3702-T4, title: "N-2: sponsor information outstanding - the member is ineligible and nothing is deemed", as_of: "2026-10-01", given: {snap_is_eligible_non_citizen: true, snap_is_ineligible_pending_non_citizen_verification: true, snap_sponsor_deeming_applies: true}, expect: 0}
