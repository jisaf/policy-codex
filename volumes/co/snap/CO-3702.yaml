id: CO-3702
name: "SNAP: sponsor resources deemed"
identifier: snap_sponsor_deemed_resources
kind: derived
type: money
scope: person
program: SNAP
meaning: "The resources SNAP counts to this eligible sponsored non-citizen from the person's sponsors (10 CCR 2506-1 4.305.2.C, D.6; 7 CFR 273.4(c)(2)(iv)-(v)): the total countable resources of the sponsors and their spouses (8 U.S.C. 1631(a)(2)) less snap_sponsor_resource_reduction, never below zero, divided by snap_sponsor_deeming_divisor; zero when deeming does not apply."
precision: "Each sponsor's resources are read from the sponsor's own facts as SNAP counts them (snap_countable_liquid_resources, CO-4176, and snap_countable_nonliquid_resources, CO-074; 273.4(c)(2)(iv): \"as determined in accordance with § 273.8\"); the sponsors are those who signed the affidavit (CO-2713), with their spouses who did not (CO-2714), as for income (CO-3711; coverage review C-14, OQ-730 resolved). A citizen is out at the first test. Final verification pass 2 N-2: a member who is ineligible until the sponsor information or the status verification is provided (snap_is_ineligible_pending_non_citizen_verification, CO-4154) is an ineligible non-citizen, and 4.505.7.C (S2954) counts that member's resources \"excluding the attributed income and resources of the non-citizen's sponsor\". N-8: the sponsor's liquid resources are read net of the 4.410 exclusions (CO-4176), as the household's own are. Coverage pass 3 N3-2: the test is [not, snap_is_ineligible_non_citizen] (CO-310), the one list of the grounds on which a non-citizen member is ineligible (status not verified by the due date, sponsor information outstanding, and a member the household declines to document, declines_to_provide_immigration_documentation, CO-4687; 4.505.6.J, S902), so a ground added to CO-310 stops deeming here too (4.305.2.C: \"Only when a sponsored non-citizen is an eligible non-citizen\")."
statute_override: "Federal law overrides 10 CCR 2506-1 4.305.2.C and 7 CFR 273.4(c)(2), which deem the income and resources of the sponsor's spouse only \"if they have executed USCIS Form I-864 or I-864A\": 8 U.S.C. 1631(a)(2) (Pub. L. 104-193, as amended; \"Notwithstanding any other provision of law\") deems \"the income and resources of the spouse (if any) of the person\" who executed the affidavit of support, and 7 U.S.C. 2014(i)(1) those of \"the sponsor's spouse if such spouse is living with the sponsor\", neither conditioned on a signature; 4.305.2.D.1 counts a spouse married after the agreement was signed. Every spouse of a sponsor declared in the case (who lives with the sponsor) is deemed (OQ-730, resolved)."
derived: [case, [[all, snap_is_eligible_non_citizen, [not, snap_is_ineligible_non_citizen], snap_sponsor_deeming_applies], ["/", [max, 0, ["-", ["+", [sum, sponsors, ["+", [of, [P], snap_countable_liquid_resources], [of, [P], snap_countable_nonliquid_resources]]], [sum, sponsor_spouses_not_cosigning, ["+", [of, [P], snap_countable_liquid_resources], [of, [P], snap_countable_nonliquid_resources]]]], snap_sponsor_resource_reduction]], snap_sponsor_deeming_divisor]], [else, 0]]
sources: [S902, S2502, S2503, S2954, S2970, S2971, S3071]
implemented: engine
tags: [snap, immigration, resources]
rationale: "Final verification F-2: no item deemed a sponsor's resources; snap_household_countable_resources (CO-343) adds this amount for each member."
tests:
  - {id: CO-3702-T1, title: "Sponsor with $2,600: 2,600 - 1,500 = 1,100, shared by 2 = 550", as_of: "2026-10-01", given: {snap_is_eligible_non_citizen: true, snap_is_ineligible_non_citizen: false, snap_sponsor_deeming_applies: true, sponsor_spouses_not_cosigning: [], sponsors: [p2], snap_sponsor_deeming_divisor: 2}, others: {p2: {liquid_resources_value: 2600, snap_countable_nonliquid_resources: 0}}, expect: 550}
  - {id: CO-3702-T2, title: "Sponsor with $1,200: below the $1,500 reduction, nothing", as_of: "2026-10-01", given: {snap_is_eligible_non_citizen: true, snap_is_ineligible_non_citizen: false, snap_sponsor_deeming_applies: true, sponsor_spouses_not_cosigning: [], sponsors: [p2], snap_sponsor_deeming_divisor: 1}, others: {p2: {liquid_resources_value: 1200, snap_countable_nonliquid_resources: 0}}, expect: 0}
  - {id: CO-3702-T3, as_of: "2026-10-01", given: {snap_is_eligible_non_citizen: false}, expect: 0}
  - {id: CO-3702-T4, title: "N-2: sponsor information outstanding - the member is ineligible and nothing is deemed", as_of: "2026-10-01", given: {snap_is_eligible_non_citizen: true, snap_is_ineligible_non_citizen: true, snap_sponsor_deeming_applies: true}, expect: 0}
  - {id: CO-3702-T5, title: "Coverage review C-14: a sponsor with $1,000 and her husband, who signed nothing, with $1,600: 2,600 - 1,500 = 1,100, shared by 2 = 550", as_of: "2026-10-01", given: {snap_is_eligible_non_citizen: true, snap_is_ineligible_non_citizen: false, snap_sponsor_deeming_applies: true, sponsor_spouses_not_cosigning: [p3], sponsors: [p2], snap_sponsor_deeming_divisor: 2}, others: {p2: {liquid_resources_value: 1000, snap_countable_nonliquid_resources: 0}, p3: {liquid_resources_value: 1600, snap_countable_nonliquid_resources: 0}}, expect: 550}
  - {id: CO-3702-T6, title: "Coverage pass 3 N3-2: the household declines to document her status - nothing is deemed", as_of: "2026-10-01", given: {snap_is_eligible_non_citizen: true, declines_to_provide_immigration_documentation: true, snap_meets_citizenship_requirement: true, snap_is_ineligible_pending_non_citizen_verification: false, snap_sponsor_deeming_applies: true}, expect: 0}
