rationale: "Coverage review C-4 (docs/reviews/coverage-snap-nonfinancial.md): SNAP read has_military_connection (CO-005), which confers the connection on any unmarried child of a veteran, of any age; a 41-year-old permanent resident inside the five-year bar was found eligible through her mother's service. SNAP's regulation and Colorado's rule define the dependent child (S3054, S3055). CO-005 is the shared item Medicaid (CO-1172, CO-509), Colorado Works, Adult Financial and CHP+ read under 8 U.S.C. 1612(b) and 1613(b), whose own rules this volume does not show defining the child; under convention rule 15 SNAP's definition is its own item, and CO-005 is left to those readers."
