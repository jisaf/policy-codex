id: CO-4260
name: "SNAP: has a military connection"
identifier: snap_has_military_connection
kind: derived
type: yes/no
scope: person-month
program: SNAP
meaning: "The person has a military connection for SNAP (7 CFR 273.4(a)(6)(ii)(G); 10 CCR 2506-1 4.305.B.3.f): the person is on active duty (other than training) or an honorably discharged veteran; the spouse or unremarried surviving spouse of such a person; or an unmarried dependent child of such a person, which is a child under snap_military_dependent_child_age_limit (18), a full-time student under snap_military_dependent_student_age_limit (22), or an adult child who was disabled and dependent on the parent before eighteen."
precision: "Read from the person's own service (has_qualifying_military_service, CO-2866), a spouse's or legal parent's service across the spouse and child edges, and surviving-spouse status (is_surviving_spouse_of_veteran, CO-2867), as has_military_connection (CO-005) reads them. \"Child\" is \"the legally adopted or biological child\" (S3054, S3055): the parent edge (natural or adoptive), never a stepparent. A child under 18, or a full-time student under 22, is read as dependent on the parent. A full-time student is one whose education_enrollment_intensity is full_time, read as not a student when not stated (that fact is not stated for a person in no program). The disabled adult child reads was_disabled_and_dependent_on_parent_before_eighteen (CO-4257), false when not stated. The child of a deceased veteran must have been dependent at the death (4.305.B.3.f.3.e); a deceased parent is read through the same edges, and that dependency is read as the age and student tests. Coverage pass 4 S4-14 (decision 4 of 2026-11-23): education_enrollment_intensity is read with no default where this rule reads it (only for an unmarried dependent child of a veteran or service member between the dependent child's and the student's age limits); before, it was read as not full time when not stated. Coverage pass 4 for SNAP S4-11 (OQ-1263 resolved): the dependent child's ages are read in the month evaluated, since prospective budgeting reads \"anticipated income and circumstances during the issuance month\" (10 CCR 2506-1 4.402.1.A, S4734), and met when the child is under 18 (or, a full-time student, under 22) on the first day of the month (the age on the first day of the month; OQ-1262). Before, the age on the determination date in every month."
