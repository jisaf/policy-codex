id: CO-311
name: "SNAP: is an ineligible member"
identifier: snap_is_ineligible_member
kind: derived
type: yes/no
scope: person
program: SNAP
meaning: A household member counted for household composition but excluded from the count of eligible members and from receiving benefits directly, because they are an ineligible non-citizen, an ineligible student, or are disqualified (fleeing felon or probation/parole violator, intentional program violation, work-requirement noncompliance, or a disqualifying drug felony).
precision: Batch 4 added the ineligible-student prong (snap_is_ineligible_student, 7 CFR 273.5, 7 U.S.C. 2015(e)) as a further "any" arm below, alongside the reasons batch 1 authored.
derived: [any, snap_is_ineligible_non_citizen, snap_is_ineligible_student, is_fleeing_felon_or_probation_violator, is_disqualified_for_intentional_program_violation, is_disqualified_for_work_requirement_noncompliance, is_disqualified_drug_felony]
sources: [S19, S133, S134, S135]
implemented: engine
tags: [immigration, legal]
rationale: 7 CFR 273.1(b)(7) and 273.11(c) (S19) list several independent reasons a household member is individually ineligible while remaining part of the household for composition and (per 273.11(c)) income-counting purposes; this item is the single fact the rest of the chapter reads as "count this member out of the eligible group." Batch 4's snap_is_ineligible_student (7 U.S.C. 2015(e); 7 CFR 273.5, S133/S134/S135) is one more independent reason of the same kind, so it joins the same "any" rather than needing a separate wrapper fact.
tests:
  - {id: CO-311-T1, as_of: "2026-10-01", given: {citizenship_status: undocumented, is_fleeing_felon_or_probation_violator: false, is_disqualified_for_intentional_program_violation: false, is_disqualified_for_work_requirement_noncompliance: false, is_disqualified_drug_felony: false, snap_is_ineligible_student: false}, expect: true}
  - {id: CO-311-T2, as_of: "2026-10-01", given: {citizenship_status: citizen, is_fleeing_felon_or_probation_violator: false, is_disqualified_for_intentional_program_violation: false, is_disqualified_for_work_requirement_noncompliance: false, is_disqualified_drug_felony: false, snap_is_ineligible_student: false}, expect: false}
  - {id: CO-311-T3, as_of: "2026-10-01", given: {citizenship_status: citizen, is_fleeing_felon_or_probation_violator: true, is_disqualified_for_intentional_program_violation: false, is_disqualified_for_work_requirement_noncompliance: false, is_disqualified_drug_felony: false, snap_is_ineligible_student: false}, expect: true}
  - {id: CO-311-T4, as_of: "2026-10-01", month: "2026-10", given: {snap_household_members: [], citizenship_status: citizen, is_fleeing_felon_or_probation_violator: false, is_disqualified_for_intentional_program_violation: false, is_disqualified_for_work_requirement_noncompliance: false, is_disqualified_drug_felony: false, date_of_birth: "2003-01-01", is_enrolled_higher_education_half_time: true, receives_tanf_cash: false, has_medical_statement_of_unfitness: false, agency_finds_obviously_unfit: false, receives_ssi: false, receives_social_security_disability: false, receives_general_assistance: false, receives_va_disability_benefits: false, is_disabled_ssa: false, is_blind: false, hours_worked: 0, is_approved_for_work_study: false, is_enrolled_higher_education_full_time: false, is_assigned_to_higher_education_through_et_program: false}, expect: true}
