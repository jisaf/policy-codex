id: CO-311
name: "SNAP: is an ineligible member"
identifier: snap_is_ineligible_member
kind: derived
type: yes/no
scope: person
program: SNAP
meaning: A household member counted for household composition but excluded from the count of eligible members and from receiving benefits directly, because they are an ineligible non-citizen, a member whose questionable citizenship is still unverified after the time allowed (10 CCR 2506-1 4.505.51.C), an ineligible student, or are disqualified (fleeing felon or probation/parole violator, intentional program violation, work-requirement noncompliance, a voluntary quit, a disqualifying drug felony, a refusal to provide or apply for a Social Security Number, a conviction for a violent or sexual felony for conduct after February 7, 2014), or are an ABAWD (able-bodied adult without dependents) who has reached the time limit.
precision: "Batch 4 added the ineligible-student prong (snap_is_ineligible_student, 7 CFR 273.5, 7 U.S.C. 2015(e)) as a further \"any\" arm below, alongside the reasons batch 1 authored. Phase-10 open-question sweep (OQ-38, P-8): a voluntary quit without good cause (snap_is_disqualified_for_voluntary_quit, CO-2318) is a further arm; 4.310.8.A (S1612) treats the person as a disqualified member. CDHS review B-4: 4.304.4.A.2, A.5 and A.6 (S1810) add three grounds this item did not test - an SSN refusal (snap_is_disqualified_for_ssn_refusal, CO-2562), a time-limited ABAWD (snap_is_ineligible_abawd, CO-2564, read for the determination month) and a post-2014 violent or sexual felony (snap_is_disqualified_convicted_felon, CO-2563); the two supplied grounds read as false when not stated. Coverage review C-2: a member whose questionable citizenship is still unverified after the time 4.505.6.E allows (snap_is_ineligible_pending_citizenship_verification, CO-4251; 4.505.51.C, S3051) is a further arm."
derived: [any, snap_is_ineligible_non_citizen, snap_is_ineligible_pending_citizenship_verification, snap_is_ineligible_student, is_fleeing_felon, is_probation_or_parole_violator, snap_is_serving_ipv_disqualification, snap_is_disqualified_for_work_requirement_noncompliance, snap_is_disqualified_for_voluntary_quit, snap_is_disqualified_drug_felony, [otherwise, snap_is_disqualified_for_ssn_refusal, false], [otherwise, snap_is_disqualified_convicted_felon, false], snap_is_ineligible_abawd]
sources: [S19, S133, S134, S135, S1611, S1612, S1810, S1811, S1812, S3051]
implemented: engine
tags: [immigration, legal]
rationale: 7 CFR 273.1(b)(7) and 273.11(c) (S19) list several independent reasons a household member is individually ineligible while remaining part of the household for composition and (per 273.11(c)) income-counting purposes; this item is the single fact the rest of the chapter reads as "count this member out of the eligible group." Batch 4's snap_is_ineligible_student (7 U.S.C. 2015(e); 7 CFR 273.5, S133/S134/S135) is one more independent reason of the same kind, so it joins the same "any" rather than needing a separate wrapper fact.
