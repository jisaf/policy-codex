  - {id: CO-311-T2, as_of: "2026-10-01", given: {snap_is_ineligible_pending_citizenship_verification: false, snap_is_ineligible_abawd: false, state_of_residence: CO, immigration_status: us_citizen, is_fleeing_felon: false, is_probation_or_parole_violator: false, snap_is_serving_ipv_disqualification: false, snap_is_disqualified_drug_felony: false, snap_has_drug_felony_involving_snap_benefits: false, snap_is_ineligible_student: false, snap_is_disqualified_for_work_requirement_noncompliance: false}, expect: false}
