id: CO-311
name: "SNAP: is an ineligible member"
identifier: snap_is_ineligible_member
kind: derived
type: yes/no
scope: person
program: SNAP
meaning: A household member counted for household composition but excluded from the count of eligible members and from receiving benefits directly, because they are an ineligible non-citizen or are disqualified (fleeing felon or probation/parole violator, intentional program violation, work-requirement noncompliance, or a disqualifying drug felony).
precision: Batch 1 does not yet include the ineligible-student prong (snap_is_ineligible_student, 7 CFR 273.5), which batch 4 authors; batch 4 adds it to this item's derivation with an "any" arm alongside the ones below, once it exists. Until then this item understates ineligibility for students, which is a known, documented gap rather than an oversight.
derived: [any, snap_is_ineligible_non_citizen, is_fleeing_felon_or_probation_violator, is_disqualified_for_intentional_program_violation, is_disqualified_for_work_requirement_noncompliance, is_disqualified_drug_felony]
sources: [S19]
implemented: engine
tags: [immigration, legal]
rationale: 7 CFR 273.1(b)(7) and 273.11(c) (S19) list several independent reasons a household member is individually ineligible while remaining part of the household for composition and (per 273.11(c)) income-counting purposes; this item is the single fact the rest of the chapter reads as "count this member out of the eligible group," reserving room for batch 4's student prong as documented above rather than blocking on it.
tests:
  - {id: CO-311-T1, as_of: "2026-10-01", given: {citizenship_status: undocumented, is_fleeing_felon_or_probation_violator: false, is_disqualified_for_intentional_program_violation: false, is_disqualified_for_work_requirement_noncompliance: false, is_disqualified_drug_felony: false}, expect: true}
  - {id: CO-311-T2, as_of: "2026-10-01", given: {citizenship_status: citizen, is_fleeing_felon_or_probation_violator: false, is_disqualified_for_intentional_program_violation: false, is_disqualified_for_work_requirement_noncompliance: false, is_disqualified_drug_felony: false}, expect: false}
  - {id: CO-311-T3, as_of: "2026-10-01", given: {citizenship_status: citizen, is_fleeing_felon_or_probation_violator: true, is_disqualified_for_intentional_program_violation: false, is_disqualified_for_work_requirement_noncompliance: false, is_disqualified_drug_felony: false}, expect: true}
