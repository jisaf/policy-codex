id: CO-376
name: "SNAP: excess medical deduction"
identifier: snap_excess_medical_deduction
kind: derived
type: money
scope: person-month
program: SNAP
meaning: The deduction for this person's SNAP household's out-of-pocket medical expenses incurred by its elderly or disabled members (summed across every elderly or disabled member) - nothing at $35 or less; above $35, Colorado's Standard Medical Expense Deduction of $165, or the actual expenses less $35 when that is more (10 CCR 2506-1 4.407.61.A).
precision: "Phase-8 fix round (K-5): 4.407.61.A uses the SMED when the expenses are over $35 and at most $165, and lets the household claim actual expenses when they exceed $165 after the first $35; expenses between $165 and $200 fall under neither sentence and are given the SMED, the greater of the two (OQ-353). Sums medical_expenses_out_of_pocket only over the members of snap_household_members who are themselves elderly or disabled (snap_is_elderly_or_disabled); a non-elderly, non-disabled member's own medical expenses are not deductible, matching 4.407.6's 'other household members ... cannot claim costs of their medical treatment.'"
derived: [case, [[">", [sum, [filter, snap_household_members, [of, [P], snap_is_elderly_or_disabled]], [of, [P], medical_expenses_out_of_pocket]], snap_medical_deduction_threshold], [max, snap_standard_medical_deduction, ["-", [sum, [filter, snap_household_members, [of, [P], snap_is_elderly_or_disabled]], [of, [P], medical_expenses_out_of_pocket]], snap_medical_deduction_threshold]]], [else, 0]]
sources: [S87, S91, S100, S1013]
open: [OQ-353]
implemented: engine
tags: [income, disability]
rationale: Phase-8 fix round (K-5) adds Colorado's SMED (snap_standard_medical_deduction, CO-1514; S1013). 7 U.S.C. 2014(e)(5)(A) (S87), 7 CFR 273.9(d)(3) (S91), and 10 CCR 2506-1 4.407.6 (S100) require this deduction only for elderly or disabled members' own expenses, floored at the $35 threshold; no existing item sums medical_expenses_out_of_pocket over the household's elderly/disabled subgroup and applies the floor.
tests:
  - {id: CO-376-T1, as_of: "2026-10-01", month: "2026-10", given: {snap_household_members: [p1], snap_is_elderly_or_disabled: true, medical_expenses_out_of_pocket: 120}, others: {}, relationships: [], expect: 165, title: "K-5 - $120 of expenses is over $35 and at most $165 - the SMED (was 85 before the SMED was modeled)"}
  - {id: CO-376-T2, as_of: "2026-10-01", month: "2026-10", given: {snap_household_members: [p1], snap_is_elderly_or_disabled: false, medical_expenses_out_of_pocket: 120}, others: {}, relationships: [], expect: 0}
  - {id: CO-376-T3, title: "K-5 - $100 of expenses - the $165 SMED, not $65", as_of: "2026-10-01", month: "2026-10", given: {snap_household_members: [p1], snap_is_elderly_or_disabled: true, medical_expenses_out_of_pocket: 100}, others: {}, relationships: [], expect: 165}
  - {id: CO-376-T4, title: "K-5 - $300 of expenses - actual expenses less $35 exceed the SMED", as_of: "2026-10-01", month: "2026-10", given: {snap_household_members: [p1], snap_is_elderly_or_disabled: true, medical_expenses_out_of_pocket: 300}, others: {}, relationships: [], expect: 265}
  - {id: CO-376-T5, title: "K-5 - $35 of expenses - no deduction", as_of: "2026-10-01", month: "2026-10", given: {snap_household_members: [p1], snap_is_elderly_or_disabled: true, medical_expenses_out_of_pocket: 35}, others: {}, relationships: [], expect: 0}
  - {id: CO-376-T6, title: "K-5 - $180 of expenses - between the two sentences of 4.407.61.A; the SMED (OQ-353)", as_of: "2026-10-01", month: "2026-10", given: {snap_household_members: [p1], snap_is_elderly_or_disabled: true, medical_expenses_out_of_pocket: 180}, others: {}, relationships: [], expect: 165}
