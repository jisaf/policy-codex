id: CO-304
name: "SNAP: is a household member (not excluded as an institution resident)"
identifier: snap_is_household_member
kind: derived
type: yes/no
scope: person-month
program: SNAP
meaning: The person is not excluded from every SNAP household as a resident of an institution that provides the majority of their meals (7 CFR 273.1(b)(7)(vi)) or as a boarder (273.1(c)(3)), and is not a child who already receives SNAP in another household and stays there because this household has not verified that it provides the majority of the child's meals (10 CCR 2506-1 4.505.4.C, 4.304.2.B.4). The other 273.1(b)(7) exclusions (disqualified for work-requirement noncompliance, intentional program violation, fleeing felon, drug felony) are folded into snap_is_ineligible_member instead, because those persons stay in the household for purposes of assembling the unit and counting income (273.11(c), S19) but are excluded only from the count of eligible members.
precision: "Three-pattern sweep T-6 (docs/reviews/pattern-sweep-snap-ce.md): per month, since prospective budgeting reads the circumstances anticipated during the issuance month (10 CCR 2506-1 4.402.1.A, S4734): a resident of an institution is out of the household in a month that begins on or after institution_entry_date, and is a member in the month of entry and the months before it, since a condition that takes a person out of the household holds for the month only if it holds on every day of it (OQ-1405, the day). Before, the item was per person: entry on or before the determination date excluded the person from every month the determination covers, the months before the entry included, and a later entry date excluded the person from none. Final verification pass 2 V-13: the duplicate child (receives_snap_in_another_household, CO-4178) joins this household once child_majority_of_meals_verified (CO-4179) is true; both are read as false when not stated, so the arm reads nothing more for any other person. Coverage pass 3 N3-1: the entry date is read only for a resident of a setting; a student whose college meal plan provides more than half of the student's meals (has_higher_education_meal_plan_providing_majority_of_meals, CO-4686, stated as of the determination date; 4.304.4.D.3, S3472) and who is a resident of an institution by that arm of CO-007 is excluded without it, since institution_entry_date (CO-008) is stated only for a setting other than a private dwelling."
derived: [all, [not, [all, snap_resides_in_institution_providing_meals, [any, [otherwise, has_higher_education_meal_plan_providing_majority_of_meals, false], ["<=", institution_entry_date, [first_day, [month]]]]]], [not, [otherwise, snap_is_boarder, false]], [not, [all, [otherwise, receives_snap_in_another_household, false], [not, [otherwise, child_majority_of_meals_verified, false]]]]]
sources: [S3, S5, S1815, S2969, S3472, S4734]
open: [OQ-1405]
implemented: engine
tags: [household]
rationale: 273.1(b)(7)(vi) (S3) and 10 CCR 2506-1 4.304.4.D (S5) remove institution residents from every household, including their own; this is the one 273.1(b)(7) exclusion that must apply before the P36/P37 closure builds snap_household_members (an institutionalized person cannot be a member of anyone's unit, including their own), so it is computed first and used as the P37 filter condition.
tests:
  - {id: CO-304-T1, month: "2026-10", as_of: "2026-10-01", given: {snap_resides_in_institution_providing_meals: true, institution_entry_date: "2026-10-01"}, expect: false}
  - {id: CO-304-T2, month: "2026-10", as_of: "2026-10-01", given: {snap_resides_in_institution_providing_meals: false, institution_entry_date: "2026-10-01"}, expect: true}
  - {id: CO-304-T3, month: "2026-09", as_of: "2026-09-15", given: {snap_resides_in_institution_providing_meals: true, institution_entry_date: "2026-10-01"}, expect: true}
  - {id: CO-304-T4, title: "C-2: a boarder is in no SNAP household", month: "2026-10", as_of: "2026-10-01", given: {snap_resides_in_institution_providing_meals: false, institution_entry_date: "2026-10-01", snap_is_boarder: true}, expect: false}
  - {id: CO-304-T5, title: "V-13: a child on the father's case, applied for by the mother, meals not yet verified - stays on the father's case", month: "2026-10", as_of: "2026-10-01", given: {snap_resides_in_institution_providing_meals: false, receives_snap_in_another_household: true}, expect: false}
  - {id: CO-304-T6, title: "V-13: the mother verifies that she provides the majority of meals - the child joins her household", month: "2026-10", as_of: "2026-10-01", given: {snap_resides_in_institution_providing_meals: false, receives_snap_in_another_household: true, child_majority_of_meals_verified: true}, expect: true}
  - {id: CO-304-T7, title: "Coverage pass 3 N3-1: a student living at home whose college meal plan provides most meals - no entry date is stated, and the student is in no household", month: "2026-10", as_of: "2026-10-01", given: {snap_resides_in_institution_providing_meals: true, has_higher_education_meal_plan_providing_majority_of_meals: true}, expect: false}
  - {id: CO-304-T8, title: "Coverage pass 3 N3-1: a resident of a setting still needs the entry date", month: "2026-10", as_of: "2026-10-01", given: {snap_resides_in_institution_providing_meals: true, has_higher_education_meal_plan_providing_majority_of_meals: false}, expect: unknown}
  - {id: CO-304-T9, title: "Three-pattern sweep T-6 (CO-944): a resident of a nursing facility from 2026-11-10, determination 2026-10-15: still a member in November, the month of entry", month: "2026-11", as_of: "2026-10-15", given: {snap_resides_in_institution_providing_meals: true, institution_entry_date: "2026-11-10"}, expect: true}
  - {id: CO-304-T10, title: "Three-pattern sweep T-6 (CO-944): the same person in December, the first month that begins after the entry: in no household", month: "2026-12", as_of: "2026-10-15", given: {snap_resides_in_institution_providing_meals: true, institution_entry_date: "2026-11-10"}, expect: false}
  - {id: CO-304-T11, title: "Three-pattern sweep T-6: entry on 2026-10-05, determination 2026-10-20: a member in October, the month of entry (before, out of every month)", month: "2026-10", as_of: "2026-10-20", given: {snap_resides_in_institution_providing_meals: true, institution_entry_date: "2026-10-05"}, expect: true}
