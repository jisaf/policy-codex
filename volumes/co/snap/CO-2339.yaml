id: CO-2339
name: "SNAP: excluded unearned income"
identifier: snap_excluded_unearned_income
kind: derived
type: money
scope: person-month
program: SNAP
meaning: "The part of this person's gross unearned income for the month that 10 CCR 2506-1 4.405 (and 7 CFR 273.9(c)) leaves out of SNAP unearned income: infrequent or irregular income when the calendar quarter's, earned and unearned together, is no more than snap_irregular_income_quarterly_limit (A; the same quarter sum as snap_excluded_earned_income, CO-2338); money received for a beneficiary who does not live with the person (B); an overpayment recouped from the same source, except a means-tested program's recoupment for an intentional failure to comply (D.1); child support turned over to the IV-D agency (D.2); a nonrecurring lump sum (E), which SNAP counts as a resource instead (CO-3391); loans, reverse mortgage payments included (F); reimbursements (I); education assistance (4.405.1); energy assistance under federal law (4.405.2.A.7); the earned income tax credit and tax refunds (A.20); payments other federal statutes exclude (A.2-A.4, A.14, A.18, A.23, A.26, A.28), AmeriCorps payments (A.4) and WIOA and youth project payments (A.6, A.8); need-based charitable cash up to snap_charitable_cash_quarterly_limit a quarter (A.10); a former spouse's share of military retirement (A.11); emergency assistance to a migrant farmworker in the job stream (A.15); PASS amounts (A.22); and crime victim compensation (A.27)."
precision: "The sum of the neutral receipt facts the program's list names (each part of the gross unearned income facts, so the program's countable income subtracts it); an unstated receipt is 0. Energy assistance from a nonprofit or an energy supplier is not federal energy assistance and is counted (4.405.H.7), except as need-based charitable cash within the quarterly limit. Two receipts SNAP counts as earned income rather than excludes are left out here and added by snap_person_earned_income (CO-330): Domestic Volunteer Service Act Title I (VISTA) payments to a person who was not receiving SNAP or public assistance on joining (part of federally_excluded_payments_received; 4.403.A.2, C, 4.405.2.A.3) and training allowances other than WIOA (part of workforce_program_payments_received; 4.403.B.1). The charitable limit applies to the quarter's donations in the order received: the month's donation is excluded up to what the earlier months of the calendar quarter (the federal fiscal quarter) left of the limit."
derived: [+, [otherwise, educational_assistance_received, 0], [otherwise, loan_proceeds_received, 0], [otherwise, expense_reimbursements_received, 0], ["-", [otherwise, energy_assistance_received, 0], [otherwise, energy_assistance_from_nonprofit_or_supplier_received, 0]], [otherwise, tax_refunds_and_credits_received, 0], [otherwise, federally_excluded_payments_received, 0], [otherwise, lump_sum_received, 0], [otherwise, crime_victim_compensation_received, 0], [otherwise, workforce_program_payments_received, 0], [otherwise, reverse_mortgage_payments_received, 0], [otherwise, pass_set_aside_income, 0], [otherwise, americorps_payments_received, 0], ["-", [otherwise, overpayment_recoupment_withheld, 0], [otherwise, overpayment_recoupment_for_intentional_violation_withheld, 0]], [otherwise, child_support_received_transferred_to_child_support_agency, 0], [otherwise, military_retirement_paid_to_former_spouse, 0], [otherwise, income_received_for_person_living_elsewhere, 0], [otherwise, migrant_farmworker_emergency_assistance_received, 0], [case, [["<=", [+, infrequent_or_irregular_income_in_quarter, [sum_months, [months_from_to, [months_before, ["-", ["-", [month_of_year, [month]], 1], ["*", 3, ["-", 0, [ceil, ["-", 0, ["/", ["-", [month_of_year, [month]], 1], 3]]]]]], [month]], [months_after, ["-", 2, ["-", ["-", [month_of_year, [month]], 1], ["*", 3, ["-", 0, [ceil, ["-", 0, ["/", ["-", [month_of_year, [month]], 1], 3]]]]]]], [month]]], [at, [otherwise, infrequent_or_irregular_earned_income_received, 0], [that_month]]]], snap_irregular_income_quarterly_limit], [otherwise, infrequent_or_irregular_income_received, 0]], [else, 0]], [min, [otherwise, charitable_need_based_cash_received, 0], [max, 0, ["-", snap_charitable_cash_quarterly_limit, [sum_months, [months_from_to, [months_before, ["-", ["-", [month_of_year, [month]], 1], ["*", 3, ["-", 0, [ceil, ["-", 0, ["/", ["-", [month_of_year, [month]], 1], 3]]]]]], [month]], [month_before, [month]]], [at, [otherwise, charitable_need_based_cash_received, 0], [that_month]]]]]]]
sources: [S1620, S2204, S1958, S3100, S3102, S3103, S3104, S3105, S3107, S3108, S3109, S3110, S3128]
implemented: engine
tags: [snap, income]
rationale: "Same-word audit SW-28, dual-entry audit 3.24 and 3.25: each program's excluded income and allowable business costs were program-prefixed supplied amounts, so one receipt or one set of business costs was entered once per program. The neutral fact describes the receipt or the cost; each program's exclusion or allowable cost is its own derived item citing its list (product-owner decision, convention rule 13). The ID and identifier are kept; the amount is now derived."
