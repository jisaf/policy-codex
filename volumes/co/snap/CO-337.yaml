id: CO-337
name: "SNAP: household has a BCE/ECE-disqualifying member"
identifier: snap_household_has_bce_ece_disqualifying_member
kind: derived
type: yes/no
scope: person-month
program: SNAP
meaning: "This person's SNAP household cannot be categorically eligible (Basic or Expanded Categorical Eligibility) because of a member: a member is disqualified for an intentional program violation or has been convicted of a drug-related felony involving SNAP benefits (10 CCR 2506-1 4.206.C.1.c, C.2.c); the head of household is disqualified for failing to comply with the work requirements of 7 CFR 273.7, a voluntary quit included (273.2(j)(2)(vii)(C)); or a member is ineligible for a drug-related felony, as a fleeing felon or a probation or parole violator, or under 273.11(s) for a conviction of certain crimes without compliance with the sentence (273.2(j)(2)(vii)(D))."
statute_override: "Federal regulation overrides 10 CCR 2506-1 4.206.C.1.c and C.2.c, which bar Basic and Expanded Categorical Eligibility only for a member disqualified for an IPV or convicted of a drug-related felony involving SNAP benefits: 7 CFR 273.2(j)(2)(vii), in force throughout the volume's dates, says that \"Under no circumstances shall any household be considered categorically eligible\" if the head of household is disqualified for the work requirements of 273.7 or a member is ineligible as a drug felon, a fleeing felon, a probation or parole violator or under 273.11(s), so such a household is held to the standard eligibility tests (4.206.C.3)."
precision: "Vocabulary fix round (R-6): the drug-felony arm reads snap_has_drug_felony_involving_snap_benefits (CO-1731), 4.206's narrower bar, not the member disqualification fact. Coverage pass 4 for SNAP S4-11 (OQ-1263 resolved): per month, since prospective budgeting reads \"anticipated income and circumstances during the issuance month\" (10 CCR 2506-1 4.402.1.A, S4734): the household (CO-305) is the month's. Before, the item was per person and read on the determination date in every month. Coverage pass 6 for SNAP, C6-2 (docs/reviews/coverage6-snap.md): 7 CFR 273.2(j)(2)(vii)(C)-(D) (S4972) bars categorical eligibility on grounds 4.206.C does not list. The head of household is snap_is_head_of_household (CO-067); a work-requirement disqualification is snap_is_disqualified_for_work_requirement_noncompliance (CO-040) or snap_is_disqualified_for_voluntary_quit, since not quitting a job without good cause is one of the work requirements of 273.7(a)(1) (S4973, (a)(1)(vii)). The (D) grounds are the member's ineligibility as Colorado finds it: snap_is_disqualified_drug_felony (CO-041, read as false when not stated, as snap_is_disqualified_member_counted_in_full, CO-2302, reads it), snap_is_fleeing_felon (CO-4683), snap_is_probation_or_parole_violator (CO-5216) and snap_is_disqualified_convicted_felon (CO-2563, read as false when not stated, as CO-2302 reads it). The workfare ground of (vii)(B) is a disqualification of the entire household, which is then not eligible on any test, so no categorical reading turns on it here. Repro: CE-WS and CE-PPV, the rule tests T3 and T4."
derived: [exists, snap_household_members, [any, [of, [P], snap_is_serving_ipv_disqualification], [of, [P], snap_has_drug_felony_involving_snap_benefits], [all, [of, [P], snap_is_head_of_household], [any, [of, [P], snap_is_disqualified_for_work_requirement_noncompliance], [of, [P], snap_is_disqualified_for_voluntary_quit]]], [otherwise, [of, [P], snap_is_disqualified_drug_felony], false], [of, [P], snap_is_fleeing_felon], [of, [P], snap_is_probation_or_parole_violator], [otherwise, [of, [P], snap_is_disqualified_convicted_felon], false]]]
sources: [S47, S48, S4972, S4973]
implemented: engine
tags: [income, state_election, legal]
rationale: 10 CCR 2506-1 4.206,C,1,c and 4.206,C,2,c (S47, S48) state the identical IPV/drug-felony exclusion for both BCE and ECE; this item is the single fact snap_meets_bce_eligibility and snap_meets_ece_eligibility both read, instead of repeating the exists/any test in each.
