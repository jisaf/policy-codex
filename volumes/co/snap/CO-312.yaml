id: CO-312
name: "SNAP: eligible household members"
identifier: snap_eligible_household_members
kind: derived
type: group of persons
scope: person-month
program: SNAP
meaning: The members of this person's SNAP household (snap_household_members) who are not ineligible members under snap_is_ineligible_member.
precision: "Coverage pass 4 for SNAP S4-11 (OQ-1263 resolved): per month, since prospective budgeting reads \"anticipated income and circumstances during the issuance month\" (10 CCR 2506-1 4.402.1.A, S4734): the household (CO-305) and its ineligible members (CO-311) are the month's. Before, the item was per person and read on the determination date in every month."
derived: [filter, snap_household_members, [not, [of, [P], snap_is_ineligible_member]]]
sources: [S19]
implemented: engine
tags: [household, immigration]
rationale: No existing item narrows snap_household_members to the members actually counted for eligibility and benefit purposes; snap_eligible_household_size and the income/deduction rules in later batches need this narrower group, not the full purchase-and-prepare unit.
tests:
  - {id: CO-312-T1, month: "2026-10", as_of: "2026-10-01", given: {state_of_residence: CO, date_of_birth: "1985-01-22", snap_resides_in_institution_providing_meals: false, immigration_status: undocumented, is_fleeing_felon: false, is_probation_or_parole_violator: false, snap_is_serving_ipv_disqualification: false, snap_is_disqualified_drug_felony: false, snap_has_drug_felony_involving_snap_benefits: false, snap_is_disqualified_for_work_requirement_noncompliance: false}, others: {p2: {state_of_residence: CO, date_of_birth: "2009-04-08", snap_resides_in_institution_providing_meals: false, immigration_status: us_citizen, is_fleeing_felon: false, is_probation_or_parole_violator: false, snap_is_serving_ipv_disqualification: false, snap_is_disqualified_drug_felony: false, snap_has_drug_felony_involving_snap_benefits: false, snap_is_disqualified_for_work_requirement_noncompliance: false}}, relationships: [[parent, p1, p2]], expect: [p2]}
