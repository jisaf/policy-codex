rationale: "KL-SNAP-4 (close-out verification F2, docs/reviews/verify-closeout-fixes.md, probe H2): CO-5011 took a VA dependent's part off only where the dependent lived elsewhere (snap_lives_with_in_month, CO-7672), because reading the household itself (CO-305) would cycle through the 165 percent test; a dependent who lives in the home but is not a member (the veteran's mother of 76 who buys and prepares food separately; a son of 22 or older who is a separate household) was counted, though 4.405.B excludes money for a non-household member ($185 where the text gives $320). SNAP membership reads income only through the separate household test, so membership without it is read here with no income."
nearest: [CO-305, CO-7672]
