  # stepchild p3 (under 22 on 2026-11-01: 12); purchase and prepare p1-p2, p1-p3. The mother: p4 is p1's parent, a mandatory edge only where the child
  # (p1, 44) is under 22 (7 CFR 273.1(b)(1)(ii), S2): not crossed; no purchase-and-prepare edge: not reached (273.1(a)(2), S1). [p1, p2, p3].
