id: CO-4322
name: "SNAP: rental income"
identifier: snap_rental_income
kind: derived
type: money
scope: person-month
program: SNAP
meaning: "The person's rental income for the month from property the person does not actively manage an average of at least twenty hours a week, as SNAP counts it (10 CCR 2506-1 4.404.D): the rent received (rental_income_received, CO-4457) less the cost of doing business (rental_property_costs, CO-4321), not below zero."
precision: "The costs allowed are those of 4.403.11.B-C, the kinds the self-employment cost facts describe, stated for the rented property. A loss is not offset against other income; only a farmer's self-employment loss is (4.403.12.E). The rent is unearned income: snap_person_unearned_income (CO-331) subtracts the gross rent, part of other_unearned_income_taxable, and adds this net figure."
derived: [max, 0, ["-", [otherwise, rental_income_received, 0], [otherwise, rental_property_costs, 0]]]
sources: [S3111]
implemented: engine
tags: [snap, income]
rationale: "Coverage review snap-financial CF-2: passive rents were counted gross as other_unearned_income_taxable, and stating them as self-employment receipts would have made them earned income with the 20% deduction, which 4.403.E.1 (S3111) allows only at twenty hours of management a week."
tests:
  - {id: CO-4322-T1, month: "2026-11", given: {rental_income_received: 1000, rental_property_costs: 600, receipts: [{kind: social_security}, {kind: ssi}, {kind: pension}, {kind: unemployment_compensation}, {kind: child_support}, {kind: colorado_works_cash}, {kind: adult_financial_cash}, {kind: tax_exempt_interest}, {kind: rental_income, amount: 1000}, {kind: other_taxable}, {kind: other_nontaxable}]}, title: "$1,000 of rent with $600 of costs: $400", expect: 400}
  - {id: CO-4322-T2, month: "2026-11", given: {rental_income_received: 300, rental_property_costs: 500, receipts: [{kind: social_security}, {kind: ssi}, {kind: pension}, {kind: unemployment_compensation}, {kind: child_support}, {kind: colorado_works_cash}, {kind: adult_financial_cash}, {kind: tax_exempt_interest}, {kind: rental_income, amount: 300}, {kind: other_taxable}, {kind: other_nontaxable}]}, title: "Costs above the rent: no income, and no loss", expect: 0}
  - {id: CO-4322-T3, month: "2026-11", given: {}, title: "No rent stated", expect: 0}
