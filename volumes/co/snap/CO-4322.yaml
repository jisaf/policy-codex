id: CO-4322
name: "SNAP: rental income"
identifier: snap_rental_income
kind: derived
type: money
scope: person-month
program: SNAP
meaning: "The person's rental income for the month from property the person does not actively manage an average of at least twenty hours a week, as SNAP counts it (10 CCR 2506-1 4.404.D): the month's rental receipts (receipts of the kind snap_receipt_treatment_table counts net of costs) less the cost of doing business (rental_property_costs, CO-4321), not below zero."
precision: "The costs allowed are those of 4.403.11.B-C, the kinds the self-employment cost facts describe, stated for the rented property. A loss is not offset against other income; only a farmer's self-employment loss is (4.403.12.E). Receipt records, migration phase 1: the rent is a receipt of kind rental_income, which snap_counted_recurring_receipts does not count (its row is net_of_costs); snap_person_unearned_income adds this net figure. Coverage pass 4 for SNAP (docs/reviews/coverage4-snap.md, S4-1 to S4-4): a record is placed in the month of its regular_date when it states one, since pay or a benefit that came early or late because of a holiday, a weekend, a changed pay date, a mailing cycle or the employee's request is counted by its regular schedule (10 CCR 2506-1 4.402.B.1-3, S4720; 4.403.A.3, S4721), else in the month it came in; a stream (a record with no month and no date) recurs only from the month its job or source began through the month it ended (job_start_date and job_end_date; start_date and end_date on a receipt), since pay after a job ends or before it begins is not anticipated with reasonable certainty (4.402.1.B, S4722). Coverage pass 4 S4-18: the rent is converted as snap_counted_recurring_receipts (CO-5011) converts a receipt (4.402.A.2, S3112)."
