tags: [snap, income]
rationale: "Coverage review snap-financial CF-2: passive rents were counted gross as other_unearned_income_taxable, and stating them as self-employment receipts would have made them earned income with the 20% deduction, which 4.403.E.1 (S3111) allows only at twenty hours of management a week."
