  - {id: CO-386-T2, as_of: "2026-10-01", month: "2026-10", given: {snap_household_participates_in_fdpir: false, snap_household_has_substantial_lottery_winnings: false, snap_is_disqualified_for_resource_transfer: false, snap_household_meets_striker_condition: true, snap_eligible_household_size: 3, snap_meets_gross_income_test: false, snap_meets_net_income_test: true, snap_meets_resource_limit: true, snap_full_month_allotment: 125}, expect: false}
