id: CO-386
name: "SNAP: is eligible"
identifier: snap_is_eligible
kind: derived
type: yes/no
scope: person-month
program: SNAP
meaning: This person's SNAP household is eligible for the month - it has at least one eligible member, no member receives the Food Distribution Program on Indian Reservations in the period (10 CCR 2506-1 4.303.B), it has not refused to cooperate in providing necessary information (7 U.S.C. 2015(c); 4.500.E), no member received substantial lottery or gambling winnings in the month (10 CCR 2506-1 4.206.E), it is not in a disqualification period for a knowing transfer of resources (4.408.2), has no striking member unless it was eligible the day before the strike, passes the gross income test, the net income test, and the resource test, and its computed allotment is greater than $0.
precision: "The allotment read is the full month allotment (snap_full_month_allotment, CO-2307), which already reflects the minimum-allotment floor for one- and two-person households; an initial month whose prorated benefit is $0 or under the minimum still certifies the household (4.207.3.B, S1616; phase-10 sweep, OQ-38). A household of three or more computed at $0 is denied unless it is categorically eligible (BCE or ECE), which Colorado certifies with zero benefits rather than denying (10 CCR 2506-1 4.207.3.B, S737; OQ-26 resolved). A household with a striking member is eligible only if it was eligible the day before the strike (snap_household_meets_striker_condition, CO-3504; 7 CFR 273.1(e), S1816; OQ-534)."
derived: [all, [">=", snap_eligible_household_size, 1], [not, snap_household_participates_in_fdpir], [not, [otherwise, snap_household_refused_to_cooperate, false]], [not, snap_household_has_substantial_lottery_winnings], [not, snap_is_disqualified_for_resource_transfer], snap_household_meets_striker_condition, snap_meets_gross_income_test, snap_meets_net_income_test, snap_meets_resource_limit, [any, [">", snap_full_month_allotment, 0], snap_is_categorically_eligible]]
sources: [S1616, S103, S104, S105, S737, S1816, S2950, S2952, S2961, S2962, S3057, S3070, S3072]
implemented: engine
tags: [income, resources]
rationale: No existing item combines the household-composition, income, resource, and allotment tests into the single eligibility outcome a determination must report; snap_eligibility_status (CO-387) reports the same outcome as an enumerated reason instead of a boolean, and both are proposed SNAP outcomes because a program administrator needs both the yes/no answer and, when the answer is no, the reason.
