id: CO-386
name: "SNAP: is eligible"
identifier: snap_is_eligible
kind: derived
type: yes/no
scope: person-month
program: SNAP
meaning: This person's SNAP household is eligible for the month - it has at least one eligible member, passes the gross income test, the net income test, and the resource test, and its computed allotment is greater than $0.
precision: "The allotment already reflects the minimum-allotment floor for one- and two-person households (snap_allotment, CO-385). A household of three or more computed at $0 is denied unless it is categorically eligible (BCE or ECE), which Colorado certifies with zero benefits rather than denying (10 CCR 2506-1 4.207.3.B, S737; OQ-26 resolved)."
derived: [all, [">=", snap_eligible_household_size, 1], snap_meets_gross_income_test, snap_meets_net_income_test, snap_meets_resource_limit, [any, [">", snap_allotment, 0], snap_is_categorically_eligible]]
sources: [S103, S104, S105, S737]
implemented: engine
tags: [income, resources]
rationale: No existing item combines the household-composition, income, resource, and allotment tests into the single eligibility outcome a determination must report; snap_eligibility_status (CO-387) reports the same outcome as an enumerated reason instead of a boolean, and both are proposed SNAP outcomes because a program administrator needs both the yes/no answer and, when the answer is no, the reason.
tests:
  - {id: CO-386-T1, as_of: "2026-10-01", month: "2026-10", given: {snap_eligible_household_size: 3, snap_meets_gross_income_test: true, snap_meets_net_income_test: true, snap_meets_resource_limit: true, snap_allotment: 125}, expect: true}
  - {id: CO-386-T2, as_of: "2026-10-01", month: "2026-10", given: {snap_eligible_household_size: 3, snap_meets_gross_income_test: false, snap_meets_net_income_test: true, snap_meets_resource_limit: true, snap_allotment: 125}, expect: false}
  - {id: CO-386-T3, as_of: "2026-10-01", month: "2026-10", given: {snap_eligible_household_size: 0, snap_meets_gross_income_test: true, snap_meets_net_income_test: true, snap_meets_resource_limit: true, snap_allotment: 0}, expect: false}
  - {id: CO-386-T4, title: "BCE household of three with a zero allotment is certified, not denied (4.207.3.B)", as_of: "2026-10-01", month: "2026-10", given: {snap_eligible_household_size: 3, snap_meets_gross_income_test: true, snap_meets_net_income_test: true, snap_meets_resource_limit: true, snap_allotment: 0, snap_is_categorically_eligible: true}, expect: true}
  - {id: CO-386-T5, as_of: "2026-10-01", month: "2026-10", given: {snap_eligible_household_size: 3, snap_meets_gross_income_test: true, snap_meets_net_income_test: true, snap_meets_resource_limit: true, snap_allotment: 0, snap_is_categorically_eligible: false}, expect: false}
