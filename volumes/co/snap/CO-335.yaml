id: CO-335
name: "SNAP: household earned income"
identifier: snap_household_earned_income
kind: derived
type: money
scope: person-month
program: SNAP
meaning: This person's SNAP household's total countable earned income for the month, the sum of each eligible member's own earned income.
precision: Sums snap_person_earned_income over snap_eligible_household_members only; an ineligible member's earned income is not added here (it reaches the household, if at all, prorated or in full, through snap_counted_income_of_ineligible_member and snap_household_gross_income, not through this item).
derived: [sum, snap_eligible_household_members, [of, [P], snap_person_earned_income]]
sources: [S41, S44]
implemented: engine
tags: [income]
rationale: The earned income deduction a later batch computes is a percentage of the household's earned income, not its total gross income; no existing item isolates the earned-income total at the household level the way snap_household_gross_income does for gross income.
tests:
  - {id: CO-335-T1, as_of: "2026-10-01", month: "2026-10", given: {citizenship_status: citizen, in_medical_institution: false, earned_income: 0, self_employment_net_income: 0, is_fleeing_felon_or_probation_violator: false, is_disqualified_for_intentional_program_violation: false, is_disqualified_for_work_requirement_noncompliance: false, is_disqualified_drug_felony: false}, others: {p2: {citizenship_status: citizen, in_medical_institution: false, earned_income: 2380, self_employment_net_income: 0, is_fleeing_felon_or_probation_violator: false, is_disqualified_for_intentional_program_violation: false, is_disqualified_for_work_requirement_noncompliance: false, is_disqualified_drug_felony: false}}, relationships: [[spouse, p1, p2]], expect: 2380}
  - {id: CO-335-T2, as_of: "2026-10-01", month: "2026-10", given: {citizenship_status: undocumented, in_medical_institution: false, earned_income: 2380, self_employment_net_income: 0}, others: {}, relationships: [], expect: 0}
