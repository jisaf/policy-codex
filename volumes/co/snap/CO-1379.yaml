id: CO-1379
name: "SNAP: requires verification of shelter costs"
identifier: snap_requires_verification_of_shelter_costs
kind: derived
type: yes/no
scope: person-month
program: SNAP
meaning: "Whether the person's claimed shelter costs must be verified for SNAP: the household's declaration is accepted unless questionable, except that a household claiming costs for a home it is temporarily not occupying verifies the actual utility costs. Colorado's mandatory standard utility allowance leaves no claim of actual utility costs above the standard to verify."
precision: An unverified expense does not deny the household; it is left out of the shelter deduction (273.2(f)(3)(ii), S812).
derived: [all, snap_is_household_member, [">", shelter_cost_monthly, 0], [any, shelter_costs_attestation_is_questionable, claims_shelter_costs_for_unoccupied_home]]
sources: [S832, S818, S812, S1058, S1059, S1060]
implemented: engine
tags: [verification, snap, income]
rationale: No existing item states this verification requirement; the phase-9 chapter needs one requirement item per element so the household's pending count and status can be derived.
tests:
  - {id: CO-1379-T1, month: "2026-10", as_of: "2026-10-01", given: {snap_resides_in_institution_providing_meals: false, shelter_cost_monthly: 1400, shelter_costs_attestation_is_questionable: true, claims_shelter_costs_for_unoccupied_home: false}, expect: true}
  - {id: CO-1379-T2, month: "2026-10", as_of: "2026-10-01", given: {snap_resides_in_institution_providing_meals: false, shelter_cost_monthly: 1400, shelter_costs_attestation_is_questionable: false, claims_shelter_costs_for_unoccupied_home: false}, expect: false}
