id: CO-1379
name: "SNAP: requires verification of shelter costs"
identifier: snap_requires_verification_of_shelter_costs
kind: derived
type: yes/no
scope: person-month
program: SNAP
meaning: "Whether the person's claimed shelter and utility costs must be verified for SNAP: the household's declaration is accepted unless questionable."
precision: An unverified expense does not deny the household; it is left out of the shelter deduction (273.2(f)(3)(ii), S812).
derived: [all, snap_is_household_member, [">", shelter_cost_monthly, 0], shelter_costs_attestation_is_questionable]
sources: [S832, S818, S812]
implemented: engine
tags: [verification, snap, income]
open: [OQ-312]
rationale: No existing item states this verification requirement; the phase-9 chapter needs one requirement item per element so the household's pending count and status can be derived.
