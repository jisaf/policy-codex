id: CO-4333
name: "SNAP: counted child support exclusion"
identifier: snap_counted_child_support_exclusion
kind: derived
type: money
scope: person-month
program: SNAP
meaning: "The part of this person's legally obligated child support exclusion (snap_child_support_exclusion, CO-2003) that comes off the SNAP household's total countable gross income (10 CCR 2506-1 4.407.5.A): all of it for an eligible member and for a member disqualified and counted in full (4.411.1.B.1.a); for a member whose income is prorated (an ineligible non-citizen, an SSN refusal, an ABAWD at the time limit), the same share snap_counted_income_of_ineligible_member (CO-333) counts of the member's income (all but the ineligible members' shares, 7 CFR 273.11(c)(2)(iii); snap_prorated_member_share_counted_rate, CO-7250), since the child support \"is deducted before prorating income\" (4.411.1.B.2.c); nothing for an ineligible student, who is not a household member."
precision: "The exclusion is taken from the household's total, not from the paying member's own income, so a member who pays more support than the member's own counted income (a spouse whose wages are the household's, or a minor whose earnings are exempt) still has the whole payment excluded, as 4.407.5.A says (\"Legally obligated child support paid by a household member under the age of eighteen (18) shall be an allowable exclusion, even if the income of the child is considered exempt\"). For a prorated member, deducting the support before prorating and taking the same share of the support from the household's total give the same figure, except that the household's total, not the member's, is floored at zero. n is the count of snap_household_members_other_than_ineligible_students, as in CO-333. Coverage pass 6 for SNAP, C6-1 (docs/reviews/coverage6-snap.md): with two or more prorated members in the household, every prorated member's share is left out, not only this member's own: the fraction counted is snap_prorated_member_share_counted_rate (CO-7250), (n - k) / n with k the prorated members, as 7 CFR 273.11(c)(2)(ii)-(iii) (S4970) says (\"All but the ineligible members' share is counted\"). Before, (n - 1) / n was counted whatever k was."
derived: [case, [[not, snap_is_ineligible_member], snap_child_support_exclusion], [snap_is_disqualified_member_counted_in_full, snap_child_support_exclusion], [snap_is_ineligible_member_prorated, [case, [["=", snap_prorated_member_share_counted_rate, 0], 0], [else, ["*", snap_child_support_exclusion, snap_prorated_member_share_counted_rate]]]], [else, 0]]
sources: [S99, S45, S46, S4970]
implemented: engine
tags: [snap, income, state_election]
rationale: "Coverage review snap-financial CF-4: snap_person_gross_income (CO-332) subtracted the exclusion from the paying member's own income and floored it at zero, so the household lost the exclusion when the payer's own counted income was below the payment (reproduced on CO-83: a no-income stepparent paying $300 gave a gross of 1,500 instead of 1,200)."
tests:
  - {id: CO-4333-T1, title: "An eligible member paying $300: all of it", month: "2026-11", as_of: "2026-11-15", given: {snap_is_ineligible_member: false, snap_child_support_exclusion: 300}, expect: 300}
  - {id: CO-4333-T2, title: "An IPV-disqualified member paying $300: all of it", month: "2026-11", as_of: "2026-11-15", given: {snap_is_ineligible_member: true, snap_is_disqualified_member_counted_in_full: true, snap_child_support_exclusion: 300}, expect: 300}
  - {id: CO-4333-T3, title: "An ineligible non-citizen in a household of four paying $400: three quarters, $300", month: "2026-11", as_of: "2026-11-15", given: {snap_prorated_member_share_counted_rate: 0.75, snap_is_ineligible_member: true, snap_is_disqualified_member_counted_in_full: false, snap_is_ineligible_member_prorated: true, snap_child_support_exclusion: 400, snap_household_members_other_than_ineligible_students: [p1, p2, p3, p4]}, others: {p2: {}, p3: {}, p4: {}}, expect: 300}
  - {id: CO-4333-T4, title: "An ineligible student: nothing", month: "2026-11", as_of: "2026-11-15", given: {snap_is_ineligible_member: true, snap_is_disqualified_member_counted_in_full: false, snap_is_ineligible_member_prorated: false, snap_child_support_exclusion: 200}, expect: 0}
  - {id: CO-4333-T5, title: "Coverage pass 6 C6-1: $300 of support paid by a prorated member, five members of whom two are prorated: 300 x (5 - 2) / 5 = 180 (7 CFR 273.11(c)(2)(iii))", month: "2026-11", as_of: "2026-11-15", given: {snap_is_ineligible_member: true, snap_is_disqualified_member_counted_in_full: false, snap_is_ineligible_member_prorated: true, snap_child_support_exclusion: 300, snap_household_members_other_than_ineligible_students: [p1, p2, p3, p4, p5]}, others: {p2: {snap_is_ineligible_member_prorated: true}, p3: {snap_is_ineligible_member_prorated: false}, p4: {snap_is_ineligible_member_prorated: false}, p5: {snap_is_ineligible_member_prorated: false}}, expect: 180}
