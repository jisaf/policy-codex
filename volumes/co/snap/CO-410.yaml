id: CO-410
name: "SNAP: is exempt from the ineligible-student rule"
identifier: snap_is_student_exempt
kind: derived
type: yes/no
scope: person
program: SNAP
meaning: "A person enrolled at least half time in an institution of higher education is exempt from the ineligible-student rule because they are under snap_student_min_age or 50 or older, unfit for employment, receiving TANF cash assistance, meet the student employment exemption, have a qualifying care responsibility, are a single parent enrolled full time, are placed in the institution through a qualifying employment and training program, or are participating in an on-the-job training program while an employer trains them (10 CCR 2506-1 4.306.1.H, 4.306.B.6; 7 CFR 273.5(b)(7))."
precision: "Coverage pass 2 N2-3: the employment and training placement (is_assigned_to_higher_education_through_et_program, CO-072) carries the 7 U.S.C. 2015(e)(3)(B) condition on a SNAP E&T placement in its meaning, a statute override of 4.306.1.G (S3470, S3471)."
derived: [any, ["<", age, snap_student_min_age], [">", age, snap_student_max_age], snap_is_unfit_for_employment, receives_tanf_cash, snap_meets_student_employment_exemption, snap_has_care_responsibility_for_student_exemption, snap_is_single_parent_full_time_student_exemption, is_assigned_to_higher_education_through_et_program, [otherwise, participates_in_on_the_job_training, false]]
sources: [S133, S134, S135, S3470, S3471]
implemented: engine
tags: [student, legal]
rationale: "7 U.S.C. 2015(e)(1)-(8), 7 CFR 273.5(b), and 10 CCR 2506-1 4.306.1 (S133, S134, S135) list eight student exemptions; this item is the single fact snap_is_ineligible_student reads, combining the age, unfitness, TANF, employment, care-responsibility, single-parent, and program-placement branches into one disjunction rather than repeating them inline. Coverage review C-10: the on-the-job training arm reads participates_in_on_the_job_training (CO-4265), false when not stated."
