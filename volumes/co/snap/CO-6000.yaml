id: CO-6000
name: "SNAP: allotment before the minimum and the cap"
identifier: snap_allotment_before_minimum_and_cap
kind: derived
type: money
scope: person-month
program: SNAP
meaning: "This person's SNAP household's allotment for a full month computed from its own size and income alone: the maximum allotment less the benefit reduction, rounded down to the nearest dollar (10 CCR 2506-1 4.207.3.A.3; 7 CFR 273.10(e)(2)(ii)(A)) and not below $0, before the one- and two-person minimum (4.207.3.C) and before the cap for members disqualified under 7 CFR 273.11(c)(1)(ii) (snap_allotment_cap_before_minimum, CO-6001)."
precision: "Rounding down is written as the negated ceiling of the negated difference. Read by the full month (snap_full_month_allotment, CO-2307), which applies the minimum and the cap, and by the initial month's full-month figure (snap_full_month_allotment_before_minimum, CO-6002), which applies the cap only."
derived: [max, 0, ["-", 0, [ceil, ["-", snap_benefit_reduction, snap_maximum_allotment]]]]
sources: [S85, S1616, S3122]
implemented: engine
tags: [snap, income]
nearest: [CO-6002]
rationale: "Duplicate-paths audit D-S3 (docs/reviews/duplicate-paths-audit.md): the prorated initial month (CO-2308) recomputed the allotment from the maximum allotment less the benefit reduction and never applied the cap of 7 CFR 273.11(c)(1)(ii) that the full month (CO-2307) applies through CO-4182, so a household with a member disqualified under 273.11(c)(1) received more in its initial month than the rule allows (the audit's household: $546 against a $400 cap; from the 16th of a 31-day month $281 where the cap gives $206). The pieces both months share are items each reads."
tests:
  - {id: CO-6000-T1, as_of: "2026-10-01", month: "2026-10", given: {snap_maximum_allotment: 808, snap_benefit_reduction: 659.7}, title: "808 - 659.70 = 148.30, rounded down to 148 (4.207.3.A.3)", expect: 148}
  - {id: CO-6000-T2, as_of: "2026-10-01", month: "2026-10", given: {snap_maximum_allotment: 306, snap_benefit_reduction: 320}, title: "A reduction above the maximum: not below 0", expect: 0}
