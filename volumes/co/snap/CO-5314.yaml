id: CO-5314
name: "SNAP: value of the person's disqualifying transfers"
identifier: snap_disqualifying_transfer_value
kind: derived
type: money
scope: person
program: SNAP
meaning: "The uncompensated value of the resources this person transferred knowingly to qualify or attempt to qualify for SNAP within the three months immediately before the household's date of application (snap_application_date), or after it through the determination month (10 CCR 2506-1 4.408.2): the holdings records (holdings, CO-5300) with a disposed_date on or after the same day of the month three calendar months before the date of application and in the determination month or earlier, for which the county has established that the transfer was to qualify (snap_transfer_to_qualify), not returned in whole and not of a kind SNAP excludes."
precision: "The three months run back from the date of application to the same day of the month three calendar months earlier, that day included (a day the earlier month lacks runs into the next month: applied May 31, 2026, from March 3), as before step H1 (CO-4159); the day is OQ-1309's. A transfer after the date of application, through the determination month, is read as made after the household was determined eligible; one in a later month is not read. The county's finding (snap_transfer_to_qualify) not stated is read as no: 4.408.2.B applies \"In the event the local office establishes that an applicant household knowingly transferred resources for the purpose of qualifying\", so a transfer not established to be one does not disqualify (the rule's own reading, design decision D3; the person fact it replaces, CO-4155, was read the same way; a request to the integration owner to declare the default on the field). A transfer whose resource has been returned in whole (returned_date) is not read: the resource is again among the household's. Coverage pass 4 for SNAP resources SR-14: the transfers 4.408.2.A exempts (excluded property, a sale near fair market value, a transfer between members, one for another reason) are the county's finding (snap_transfer_to_qualify: \"is not a transfer 10 CCR 2506-1 4.408.2.A exempts\"), so no row of the table is read beside it (before, a holding of a row excluded outright was left out whatever the finding, a second, narrower statement of A.1). SR-11: the uncompensated value is the holding's value, less what was owed on it for a non-liquid holding (4.408.1.A values liquid resources at their redemption value and nothing is owed on cash or an account, so amount_owed is not read for a liquid kind), times the person's share, less what the person received for it (compensation_received), never below zero; 4.408.2.A.2 leaves a sale at or near fair market value unaffected, so a transfer that was fully compensated has no value to add."
derived: ["sum_receipts", "holdings", ["all", ["not", ["unknown", ["receipt", "disposed_date"]]], ["otherwise", ["receipt", "snap_transfer_to_qualify"], false], ["unknown", ["receipt", "returned_date"]], [">=", ["receipt", "disposed_date"], ["days_after", ["days_between", ["first_day", ["month_of", "snap_application_date"]], "snap_application_date"], ["first_day", ["months_before", 3, ["month_of", "snap_application_date"]]]]], ["<=", ["month_of", ["receipt", "disposed_date"]], ["det_month"]]], ["max", 0, ["-", ["*", ["case", [["in", ["receipt", "kind"], ["cash", "bank_account", "securities", "retirement_account", "education_savings_account", "able_account", "business_cash_and_assets", "held_income_tax_refund", "held_eitc", "held_retroactive_ssa_benefit", "held_excluded_payment", "held_loan_proceeds", "held_replacement_proceeds", "held_prorated_income"]], ["receipt", "value"]], ["else", ["-", ["receipt", "value"], ["receipt", "amount_owed"]]]], ["otherwise", ["receipt", "share"], 1]], ["receipt", "compensation_received"]]]]
sources: [S2961, S2962, S4823]
open: [OQ-1309]
implemented: engine
tags: [snap, resources]
rationale: "Resource records, step H1 SNAP (docs/reviews/records-holdings-snap-af.md): SNAP reads the person's resources from the holdings records (holdings, CO-5300) through its counting table (snap_holding_treatment_table, CO-5301), never from the scalar resource facts. One transfer is one record, read by the SNAP, Adult Financial and Medicaid look-backs alike, in place of the month-scoped transfer facts (resource_transfer_date, resource_transfer_uncompensated_value, resource_transfer_returned_date) and the person's finding (snap_resource_transfer_was_to_qualify) that snap_resource_transfer_is_disqualifying (CO-4159) and the two items after it read month by month."
tests:
  # Hand-computed from 10 CCR 2506-1 4.408.2 and 4.408.2.A (S2961); applied October 12, 2026, the three months begin July 12.
  - {id: CO-5314-T1, title: "$4,000 given to a cousin on July 20 to qualify: 4,000", as_of: "2026-10-12", given: {snap_application_date: "2026-10-12", holdings: [{kind: bank_account, value: 300}, {kind: other_resource, value: 4000, amount_owed: 0, compensation_received: 0, disposed_date: "2026-07-20", snap_transfer_to_qualify: true}]}, expect: 4000}
  - {id: CO-5314-T2, title: "Shares worth $6,000 sold on August 3 for $2,500 to qualify: 6,000 - 2,500 = 3,500; one given on July 11, before the three months: not added", as_of: "2026-10-12", given: {snap_application_date: "2026-10-12", holdings: [{kind: securities, value: 6000, amount_owed: 0, compensation_received: 2500, disposed_date: "2026-08-03", snap_transfer_to_qualify: true}, {kind: other_resource, value: 4000, amount_owed: 0, compensation_received: 0, disposed_date: "2026-07-11", snap_transfer_to_qualify: true}]}, expect: 3500}
  - {"id": "CO-5314-T3", "title": "SR-14: furniture worth $5,000 given away on September 1, which the county did not find a transfer to qualify (4.408.2.A.1 exempts excluded personal property; the finding states it): 0", "as_of": "2026-10-12", "given": {"snap_application_date": "2026-10-12", "holdings": [{"kind": "personal_property", "value": 5000, "amount_owed": 0, "compensation_received": 0, "disposed_date": "2026-09-01", "snap_transfer_to_qualify": false}]}, "expect": 0}
  - {id: CO-5314-T4, title: "No finding that the September 1 transfer was to qualify: 0 (4.408.2.B)", as_of: "2026-10-12", given: {snap_application_date: "2026-10-12", holdings: [{kind: other_resource, value: 4000, amount_owed: 0, compensation_received: 0, disposed_date: "2026-09-01"}]}, expect: 0}
  - {id: CO-5314-T5, title: "Half of a $6,000 account (share 0.5) moved to a sister on September 1 to qualify: 6,000 x 0.5 = 3,000", as_of: "2026-10-12", given: {snap_application_date: "2026-10-12", holdings: [{kind: bank_account, value: 6000, amount_owed: 0, share: 0.5, co_owners: spouse, holding_id: acct, compensation_received: 0, disposed_date: "2026-09-01", snap_transfer_to_qualify: true}]}, expect: 3000}
  # Coverage pass 4 SNAP resources SR-11, SR-14: hand-computed from 10 CCR 2506-1 4.408.1.A (S4823), 4.408.2 (S2961, S2962).
  - {"id": "CO-5314-T6", "title": "SR-11 (XFER-CASH): $4,000 of cash given to a cousin on 2027-01-20, the county found to qualify, applied 2027-02-01; nothing can be owed on cash (4.408.1.A), amount_owed not read: 4,000", "as_of": "2027-02-10", "given": {"snap_application_date": "2027-02-01", "holdings": [{"kind": "bank_account", "value": 1000}, {"kind": "cash", "value": 4000, "disposed_date": "2027-01-20", "compensation_received": 0, "snap_transfer_to_qualify": true}]}, "expect": 4000}
  - {"id": "CO-5314-T7", "title": "SR-14 (XFER-EXCL): a $4,000 federal refund received 2027-01-05 and given away 2027-01-20, which the county found a transfer to qualify (its finding states that 4.408.2.A does not exempt it): 4,000", "as_of": "2027-02-10", "given": {"snap_application_date": "2027-02-01", "holdings": [{"kind": "bank_account", "value": 1000}, {"kind": "held_income_tax_refund", "paid_by": "federal", "value": 4000, "source_date": "2027-01-05", "disposed_date": "2027-01-20", "compensation_received": 0, "snap_transfer_to_qualify": true}]}, "expect": 4000}
