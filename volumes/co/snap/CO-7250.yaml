id: CO-7250
name: "SNAP: share of a prorated member's income and expenses counted"
identifier: snap_prorated_member_share_counted_rate
kind: derived
type: rate
scope: person-month
program: SNAP
meaning: "The fraction of a prorated member's income, and of the child support, shelter and dependent care expenses paid by or billed to that member, that is counted for the remaining household members: the income or expense is divided evenly among the members of this person's household other than ineligible students (snap_household_members_other_than_ineligible_students, CO-3714), the ineligible members included, and all but the ineligible members' shares are counted (7 CFR 273.11(c)(2)(ii)-(iii), S4970, applied to an ineligible non-citizen by (c)(3)(i), S4971; 10 CCR 2506-1 4.411.1.B.2.b-c, S46, S107). With n members and k of them members whose income is prorated (snap_is_ineligible_member_prorated, CO-2565), the fraction is (n - k) / n. Zero when this person has no such household."
precision: "Coverage pass 6 for SNAP, C6-1 (docs/reviews/coverage6-snap.md): each prorated member's share is left out of every prorated member's income and expenses, not only that member's own share. 273.11(c)(2)(ii) divides the income \"evenly among the household members, including the ineligible members\" and counts \"All but the ineligible members' share\"; (iii) does the same for the child support, shelter and dependent care expenses. Colorado's 4.411.1.B.2.b and c say \"All but the disqualified member's share\" for \"the disqualified and/or sanctioned member(s)\" and are read with the federal paragraph they carry out: with two prorated members, each one's income counts at (n - 2) / n. A member counted in full (snap_is_disqualified_member_counted_in_full, CO-2302) is not one of the k: 273.11(c)(1) counts that member's income in its entirety. Unknown when any member's prorated status is unknown. Read for the person whose income or expense is prorated, as their own household's figure."
derived: [case, [["=", [count, snap_household_members_other_than_ineligible_students], 0], 0], [else, ["/", ["-", [count, snap_household_members_other_than_ineligible_students], [count, [filter, snap_household_members_other_than_ineligible_students, [of, [P], snap_is_ineligible_member_prorated]]]], [count, snap_household_members_other_than_ineligible_students]]]]
sources: [S4970, S4971, S46, S107]
implemented: engine
tags: [snap, income, state_election]
rationale: "Coverage pass 6 for SNAP, C6-1: snap_counted_income_of_ineligible_member (CO-333), snap_counted_earned_income_of_ineligible_member (CO-371), snap_counted_shelter_cost_of_member (CO-2300), snap_counted_dependent_care_expense_of_member (CO-2301) and snap_counted_child_support_exclusion (CO-4333) each counted (n - 1) / n, which is the text's answer only when one member is prorated. One item states the fraction the five read."
nearest: [CO-333, CO-2565, CO-3714]
tests:
  - {id: CO-7250-T1, month: "2027-02", as_of: "2027-02-10", title: "Two undocumented parents of two citizen children: 4 members, 2 prorated: (4 - 2) / 4 = 0.5", given: {snap_household_members_other_than_ineligible_students: [p1, p2, p3, p4], snap_is_ineligible_member_prorated: true}, others: {p2: {snap_is_ineligible_member_prorated: false}, p3: {snap_is_ineligible_member_prorated: true}, p4: {snap_is_ineligible_member_prorated: false}}, expect: 0.5}
  - {id: CO-7250-T2, month: "2027-02", as_of: "2027-02-10", title: "One undocumented parent: 4 members, 1 prorated: (4 - 1) / 4 = 0.75", given: {snap_household_members_other_than_ineligible_students: [p1, p2, p3, p4], snap_is_ineligible_member_prorated: true}, others: {p2: {snap_is_ineligible_member_prorated: false}, p3: {snap_is_ineligible_member_prorated: false}, p4: {snap_is_ineligible_member_prorated: false}}, expect: 0.75}
  - {id: CO-7250-T3, month: "2027-02", as_of: "2027-02-10", title: "No household: 0", given: {snap_household_members_other_than_ineligible_students: [], snap_is_ineligible_member_prorated: true}, expect: 0}
  - {id: CO-7250-T4, month: "2027-02", as_of: "2027-02-10", title: "Three members, all three prorated (an SSN refusal, an ineligible non-citizen and an ABAWD at the limit): (3 - 3) / 3 = 0, nothing counted", given: {snap_household_members_other_than_ineligible_students: [p1, p2, p3], snap_is_ineligible_member_prorated: true}, others: {p2: {snap_is_ineligible_member_prorated: true}, p3: {snap_is_ineligible_member_prorated: true}}, expect: 0}
