id: CO-387
name: "SNAP: eligibility status"
identifier: snap_eligibility_status
kind: derived
type: one of
options: [eligible, no_eligible_members, fdpir_participation, refused_to_cooperate, substantial_lottery_winnings, resource_transfer_disqualification, striking_member, over_gross_income_limit, over_net_income_limit, over_resource_limit, zero_allotment]
scope: person-month
program: SNAP
role: outcome
meaning: The single reason this person's SNAP household is eligible or not for the month, tested in order - no eligible household member, a member's participation in the Food Distribution Program on Indian Reservations in the same period (10 CCR 2506-1 4.303.B), a refusal to cooperate in providing necessary information (7 U.S.C. 2015(c); 4.500.E), a member's substantial lottery or gambling winnings in the month (10 CCR 2506-1 4.206.E; 7 U.S.C. 2015(s)), a disqualification period for a knowing transfer of resources (4.408.2), a striking member when the household was not eligible the day before the strike (7 CFR 273.1(e)), over the gross income limit, over the net income limit, over the resource limit, a computed allotment of $0, or otherwise eligible.
precision: "The $0 allotment ground reads the full month allotment (snap_full_month_allotment, CO-2307): 4.207.3.B does not deny a household whose zero is due to initial-month proration or to an initial month under the minimum (phase-10 sweep, OQ-38). Tested in this order because a household can fail more than one ground at once (for example, over both the gross and net income limits); the first ground that applies is reported, matching the \"otherwise\" ordering pattern (P33) other eligibility-category items in this volume use."
derived: [case, [[<, snap_eligible_household_size, 1], "no_eligible_members"], [snap_household_participates_in_fdpir, "fdpir_participation"], [[otherwise, snap_household_refused_to_cooperate, false], "refused_to_cooperate"], [snap_household_has_substantial_lottery_winnings, "substantial_lottery_winnings"], [snap_is_disqualified_for_resource_transfer, "resource_transfer_disqualification"], [[not, snap_household_meets_striker_condition], "striking_member"], [[not, snap_meets_gross_income_test], "over_gross_income_limit"], [[not, snap_meets_net_income_test], "over_net_income_limit"], [[not, snap_meets_resource_limit], "over_resource_limit"], [[all, [<=, snap_full_month_allotment, 0], [not, snap_is_categorically_eligible]], "zero_allotment"], [else, "eligible"]]
sources: [S1616, S103, S104, S105, S737, S1816, S2950, S2952, S2961, S2962, S3057, S3070, S3072]
nearest: [CO-386]
rationale: 10 CCR 2506-1 4.206,A and 7 CFR 273.10(e)(2)(i)-(iii) each test a household against several distinct standards that can each independently bar eligibility; no existing item reports which single standard a household failed (or that it passed all of them) as one enumerated outcome. Needed alongside snap_is_eligible (CO-386, a plain yes/no) because a program administrator reviewing a denial needs the reason, not only the boolean.
implemented: engine
tags: [income, resources]
tests:
  - {id: CO-387-T1, as_of: "2026-10-01", month: "2026-10", given: {snap_household_participates_in_fdpir: false, snap_household_has_substantial_lottery_winnings: false, snap_is_disqualified_for_resource_transfer: false, snap_household_meets_striker_condition: true, snap_eligible_household_size: 3, snap_meets_gross_income_test: true, snap_meets_net_income_test: true, snap_meets_resource_limit: true, snap_full_month_allotment: 125}, expect: eligible}
  - {id: CO-387-T2, as_of: "2026-10-01", month: "2026-10", given: {snap_household_participates_in_fdpir: false, snap_household_has_substantial_lottery_winnings: false, snap_is_disqualified_for_resource_transfer: false, snap_household_meets_striker_condition: true, snap_eligible_household_size: 0, snap_meets_gross_income_test: true, snap_meets_net_income_test: true, snap_meets_resource_limit: true, snap_full_month_allotment: 0}, expect: no_eligible_members}
  - {id: CO-387-T3, as_of: "2026-10-01", month: "2026-10", given: {snap_household_participates_in_fdpir: false, snap_household_has_substantial_lottery_winnings: false, snap_is_disqualified_for_resource_transfer: false, snap_household_meets_striker_condition: true, snap_eligible_household_size: 3, snap_meets_gross_income_test: false, snap_meets_net_income_test: true, snap_meets_resource_limit: true, snap_full_month_allotment: 0}, expect: over_gross_income_limit}
  - {id: CO-387-T4, as_of: "2026-10-01", month: "2026-10", given: {snap_household_participates_in_fdpir: false, snap_household_has_substantial_lottery_winnings: false, snap_is_disqualified_for_resource_transfer: false, snap_household_meets_striker_condition: true, snap_eligible_household_size: 3, snap_meets_gross_income_test: true, snap_meets_net_income_test: false, snap_meets_resource_limit: true, snap_full_month_allotment: 0}, expect: over_net_income_limit}
  - {id: CO-387-T5, as_of: "2026-10-01", month: "2026-10", given: {snap_household_participates_in_fdpir: false, snap_household_has_substantial_lottery_winnings: false, snap_is_disqualified_for_resource_transfer: false, snap_household_meets_striker_condition: true, snap_eligible_household_size: 3, snap_meets_gross_income_test: true, snap_meets_net_income_test: true, snap_meets_resource_limit: false, snap_full_month_allotment: 0}, expect: over_resource_limit}
  - {id: CO-387-T6, as_of: "2026-10-01", month: "2026-10", given: {snap_household_participates_in_fdpir: false, snap_household_has_substantial_lottery_winnings: false, snap_is_disqualified_for_resource_transfer: false, snap_household_meets_striker_condition: true, snap_eligible_household_size: 3, snap_meets_gross_income_test: true, snap_meets_net_income_test: true, snap_meets_resource_limit: true, snap_full_month_allotment: 0, snap_is_categorically_eligible: false}, expect: zero_allotment}
  - {id: CO-387-T8, title: "ECE household with a zero allotment is eligible with zero benefits (4.207.3.B, OQ-26 resolved)", as_of: "2026-10-01", month: "2026-10", given: {snap_household_participates_in_fdpir: false, snap_household_has_substantial_lottery_winnings: false, snap_is_disqualified_for_resource_transfer: false, snap_household_meets_striker_condition: true, snap_eligible_household_size: 3, snap_meets_gross_income_test: true, snap_meets_net_income_test: true, snap_meets_resource_limit: true, snap_full_month_allotment: 0, snap_is_categorically_eligible: true}, expect: eligible}
  - {id: CO-387-T9, title: "OQ-534: a household with a striking member not eligible the day before the strike", as_of: "2026-10-01", month: "2026-10", given: {snap_household_participates_in_fdpir: false, snap_household_has_substantial_lottery_winnings: false, snap_is_disqualified_for_resource_transfer: false, snap_household_meets_striker_condition: false, snap_eligible_household_size: 3, snap_meets_gross_income_test: true, snap_meets_net_income_test: true, snap_meets_resource_limit: true, snap_full_month_allotment: 125}, expect: striking_member}
  - {id: CO-387-T10, title: "N-1: substantial winnings in the month", as_of: "2026-10-01", month: "2026-10", given: {snap_household_participates_in_fdpir: false, snap_household_has_substantial_lottery_winnings: true, snap_is_disqualified_for_resource_transfer: false, snap_household_meets_striker_condition: true, snap_eligible_household_size: 3, snap_meets_gross_income_test: true, snap_meets_net_income_test: true, snap_meets_resource_limit: true, snap_full_month_allotment: 0}, expect: substantial_lottery_winnings}
  - {id: CO-387-T11, title: "N-4: a transfer disqualification month", as_of: "2026-10-01", month: "2026-10", given: {snap_household_participates_in_fdpir: false, snap_household_has_substantial_lottery_winnings: false, snap_is_disqualified_for_resource_transfer: true, snap_household_meets_striker_condition: true, snap_eligible_household_size: 3, snap_meets_gross_income_test: true, snap_meets_net_income_test: true, snap_meets_resource_limit: true, snap_full_month_allotment: 0}, expect: resource_transfer_disqualification}
  - {id: CO-387-T12, title: "Coverage review C-11: a member receives FDPIR in the period", as_of: "2026-10-01", month: "2026-10", given: {snap_eligible_household_size: 3, snap_household_participates_in_fdpir: true}, expect: fdpir_participation}
