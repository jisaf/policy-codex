id: CO-306
name: "SNAP: is exempt from the non-citizen waiting period"
identifier: snap_is_exempt_from_immigrant_waiting_period
kind: derived
type: yes/no
scope: person
program: SNAP
meaning: "A qualified non-citizen subject to the additional condition (10 CCR 2506-1 4.305,B,3) is exempt from the five-year/40-quarter waiting period because they have a military connection or meet one of the other exceptions of 8 U.S.C. 1612(a)(2) that snap_is_exempt_from_waiting_period_other_than_military (CO-3713) states: under 18; blind or a person with a disability receiving benefits or assistance for that condition (whatever their entry date); born on or before August 22, 1931 and in qualifying status on or before August 22, 1996; a former refugee, asylee, person whose deportation was withheld, Cuban or Haitian entrant or Amerasian immigrant; an American Indian born in Canada or tribal member; or a Hmong or Highland Lao veteran or the veteran's family."
precision: "The \"born on or before August 22, 1931 and lawfully resided in the U.S. on August 22, 1996\" test (S15) is modeled as date_of_birth on or before snap_elderly_non_citizen_birth_date_cutoff (CO-2601, 1931-08-22) and qualified_status_date on or before qualified_non_citizen_entry_cutoff_date (CO-279, 1996-08-22) (qualified_status_date stands in for lawful residence on that date, a fact this volume does not separately collect). The blind or disabled exception (4.305.B.3.d, S1305; 8 U.S.C. 1612(a)(2)(F)(ii), S1306) reads snap_is_disabled_member (CO-302): \"receiving benefits or assistance for blindness or disability\" within the meaning of 7 U.S.C. 2012 is the benefit-receipt list of the 7 CFR 271.2 elderly-or-disabled definition, and it has no August 22, 1996 condition (OQ-2 resolved: the brief had merged this exception with the elderly one)."
assumption: Follows 8 U.S.C. 1612(a)(2)(C), (F)(ii), (I), (J) as Colorado restates them at 10 CCR 2506-1 4.305,B,3.c-f (S14, S15, S16, S1305), and (A), (G), (K) through snap_is_exempt_from_waiting_period_other_than_military (CO-3713; final verification F-3); the elderly exception (S24) is stated as "65 or older on August 22, 1996", which the draft models as born on or before 1931-08-22 and in qualified status by 1996-08-22.
derived: [any, snap_is_exempt_from_waiting_period_other_than_military, has_military_connection]
sources: [S24, S14, S15, S16, S1305, S1306, S2505, S2506]
implemented: engine
tags: [immigration, legal]
rationale: "Isolates the additional condition's exemptions (10 CCR 2506-1 4.305,B,3,c/e/f) as one fact so snap_meets_immigrant_additional_condition can read 'exempt, or meets the waiting period' as a single disjunction without repeating each exemption's text inline. Fix-round (C-8): reads the new parameter snap_immigrant_child_exemption_age (CO-177) instead of snap_parental_control_age (CO-102), which is an unrelated household-composition parameter that happened to share the value 18."
tests:
  - {id: CO-306-T1, as_of: "2026-10-01", given: {date_of_birth: "2015-01-01", has_military_connection: false, qualified_status_date: "2020-01-01"}, expect: true}
  - {id: CO-306-T2, as_of: "2026-10-01", given: {date_of_birth: "1985-01-22", has_military_connection: false, qualified_status_date: "2020-01-01", snap_is_disabled_member: false}, expect: false}
  - {id: CO-306-T3, title: "OQ-2: an LPR receiving SSI two years after obtaining status is exempt (4.305.B.3.d)", as_of: "2026-10-01", given: {date_of_birth: "1985-01-22", has_military_connection: false, qualified_status_date: "2024-10-01", receives_ssi: true}, expect: true}
  - {id: CO-306-T4, title: "OQ-2: blindness or disability without a benefit for it is not the exception", as_of: "2026-10-01", given: {date_of_birth: "1985-01-22", has_military_connection: false, qualified_status_date: "2024-10-01", receives_ssi: false, snap_receives_disability_or_blindness_payment: false, receives_disability_based_general_assistance: false, has_va_aid_attendance_housebound_or_survivor_finding: false, va_disability_rating_type: none, snap_receives_permanent_disability_retirement_benefit: false, meets_ssa_disability_criteria: true}, expect: false}
  # Final verification F-3: the 8 U.S.C. 1612(a)(2)(A), (G) and (K) exceptions (CO-3713).
  - {id: CO-306-T5, title: "A refugee admitted in 2023 who adjusted to permanent residence in 2024 is exempt", as_of: "2026-10-01", given: {date_of_birth: "1985-01-22", has_military_connection: false, qualified_status_date: "2023-05-01", snap_is_disabled_member: false, status_before_lpr_adjustment: refugee}, expect: true}
