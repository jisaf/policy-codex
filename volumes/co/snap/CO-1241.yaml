id: CO-1241
name: "SNAP: number of non-heating utility costs"
identifier: snap_non_heating_utility_cost_count
kind: derived
type: whole number
scope: case
program: SNAP
meaning: "The number of distinct non-heating, non-cooling utility costs the household incurs - electricity, water, sewer, trash, cooking fuel and the telephone, the telephone counted as one - per 10 CCR 2506-1 4.407.31.B-D and 4.407.3.E.4-5."
precision: "Each unstated utility fact is read as not incurred (rule 12), so a case that states no utility counts none, as before."
derived: [+, [+, [+, [case, [[otherwise, home_incurs_electricity_cost, false], 1], [else, 0]], [case, [[otherwise, home_incurs_water_cost, false], 1], [else, 0]]], [+, [case, [[otherwise, home_incurs_sewer_cost, false], 1], [else, 0]], [case, [[otherwise, home_incurs_trash_cost, false], 1], [else, 0]]]], [+, [case, [[otherwise, home_incurs_cooking_fuel_cost, false], 1], [else, 0]], [case, [[otherwise, home_incurs_telephone_cost, false], 1], [else, 0]]]]
sources: [S744, S745, S746, S753]
implemented: engine
tags: [snap, household]
rationale: "Dual-entry audit 2.8: the count was supplied beside a separate telephone fact, so a count of 0 with the telephone true could be stated. It is now counted from one neutral fact per utility (CO-3302 to CO-3306, CO-1242), stated once for the case. The ID is kept; the identifier takes the SNAP prefix."
tests:
  - {id: CO-1241-T1, as_of: "2026-10-01", given: {home_incurs_electricity_cost: true, home_incurs_water_cost: true, home_incurs_telephone_cost: true}, expect: 3}
  - {id: CO-1241-T2, title: "Nothing stated counts none", as_of: "2026-10-01", given: {}, expect: 0}
  - {id: CO-1241-T3, as_of: "2026-10-01", given: {home_incurs_sewer_cost: true, home_incurs_trash_cost: true, home_incurs_cooking_fuel_cost: true, home_incurs_electricity_cost: false}, expect: 3}
