id: CO-3722
name: "SNAP: farm self-employment loss"
identifier: snap_farm_self_employment_loss
kind: derived
type: money
scope: person-month
program: SNAP
meaning: "The monthly loss of a self-employed farmer - a person whose farm's gross proceeds are at least snap_self_employed_farmer_annual_gross_minimum a year - by which the farm's allowable costs (snap_farm_costs, CO-5116) exceed its gross receipts (snap_farm_gross_receipts, CO-5115) (10 CCR 2506-1 4.403.12.E; 7 CFR 273.11(a)(2)(ii)); zero for anyone else."
precision: "The receipts and costs are the month's figures, so the annual gross proceeds are twelve times the month's receipts. The person's own net from the farm (in CO-1702) is then 0, and this loss is offset against other income (CO-3724, CO-3725). Coverage review snap-financial CF-3: when SNAP averages the self-employment (snap_self_employment_is_averaged, CO-4329), the receipts and costs are averaged over the averaging months (CO-4349) and the annual gross proceeds are twelve times the average receipts; the loss is then the averaged loss, prorated over the period as 4.403.12.E.1 says. Earned-income records, step E1 (SNAP; docs/reviews/records-earnings-snap.md): the farm is its own records (farm_self_employment_receipts, and the cost records marked farm) rather than a person fact (self_employment_is_farming, CO-3720), so a person with no farm record has no farm loss. Earnings not stated: cannot determine."
derived: ["case",[["=",["sum_receipts","earnings",["=",["lookup","snap_earnings_treatment_table",["receipt","kind"]],"counted_loss_offset"],1],0],0],["snap_self_employment_is_averaged",["case",[[">=",["*",["avg","snap_farm_gross_receipts","snap_self_employment_averaging_months"],12],"snap_self_employed_farmer_annual_gross_minimum"],["max",0,["avg",["-","snap_farm_costs","snap_farm_gross_receipts"],"snap_self_employment_averaging_months"]]],["else",0]]],[[">=",["*","snap_farm_gross_receipts",12],"snap_self_employed_farmer_annual_gross_minimum"],["max",0,["-","snap_farm_costs","snap_farm_gross_receipts"]]],["else",0]]
sources: [S2510, S2511, S3114]
implemented: engine
tags: [income, snap]
rationale: "Final verification F-8: snap_self_employment_income (CO-1702) floors self-employment at zero and its precision recorded the farm loss offset as not modeled, with no open question; the loss is the first step of the offset. Earned-income records, step E1 (SNAP; docs/reviews/records-earnings-snap.md): reads the farm's records (CO-5115, CO-5116)."
tests:
  - {id: CO-3722-T1, title: "A farmer with $1,500 receipts and $2,300 costs in the month (12 x 1,500 = 18,000 a year, at least $1,000): loss 2,300 - 1,500 = $800", as_of: "2026-10-01", month: "2026-10", given: {earnings: [{kind: farm_self_employment_receipts, amount: 1500, annual_support: false}, {kind: business_cost_operating, amount: 2300, farm: true}]}, expect: 800}
  - {id: CO-3722-T2, title: "Receipts of $50 a month ($600 a year) are under $1,000: not a self-employed farmer", as_of: "2026-10-01", month: "2026-10", given: {earnings: [{kind: farm_self_employment_receipts, amount: 50, annual_support: false}, {kind: business_cost_operating, amount: 400, farm: true}]}, expect: 0}
  - {id: CO-3722-T3, title: "Not farming", as_of: "2026-10-01", month: "2026-10", given: {earnings: [{kind: wages, amount: 1000}]}, expect: 0}
  - {id: CO-3722-T4, title: "A farm with a profit has no loss", as_of: "2026-10-01", month: "2026-10", given: {earnings: [{kind: farm_self_employment_receipts, amount: 3000, annual_support: false}, {kind: business_cost_operating, amount: 2000, farm: true}]}, expect: 0}
  - {id: CO-3722-T5, title: "CF-3: an averaged farm with $6,000 receipts and $9,000 costs over two months: ((4,500 - 6,000) + (4,500 - 0)) / 2 = a $1,500 monthly loss; 12 x 3,000 = 36,000 a year", month: "2026-10", as_of: "2026-11-10", given: {snap_self_employment_is_averaged: true, snap_self_employment_averaging_months: ["2026-09", "2026-10"], earnings: [{kind: farm_self_employment_receipts, amount: 6000, month: "2026-09"}, {kind: farm_self_employment_receipts, amount: 0, month: "2026-10"}, {kind: business_cost_operating, amount: 4500, farm: true, month: "2026-09"}, {kind: business_cost_operating, amount: 4500, farm: true, month: "2026-10"}]}, expect: 1500}
  - {id: CO-3722-T6, title: "A farmer's $700 of operating costs against $200 of receipts, with $1,500 from another business: the farm alone, 12 x 200 = 2,400 a year, loss 700 - 200 = 500", as_of: "2026-10-01", month: "2026-10", given: {earnings: [{kind: self_employment_receipts, amount: 1500, annual_support: false}, {kind: farm_self_employment_receipts, amount: 200, annual_support: false}, {kind: business_cost_operating, amount: 700, farm: true}]}, expect: 500}
