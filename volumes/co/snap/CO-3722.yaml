id: CO-3722
name: "SNAP: farm self-employment loss"
identifier: snap_farm_self_employment_loss
kind: derived
type: money
scope: person-month
program: SNAP
meaning: "The monthly loss of a self-employed farmer - a person whose self-employment is farming and whose gross proceeds from it are at least snap_self_employed_farmer_annual_gross_minimum a year - by which the allowable costs of producing the farm income exceed the farm's gross receipts (10 CCR 2506-1 4.403.12.E; 7 CFR 273.11(a)(2)(ii)); zero for anyone else."
precision: "The receipts and costs are the month's figures, already averaged or prorated over the period as the case states them (snap_self_employment_costs, CO-1701), so the annual gross proceeds are twelve times the month's receipts. The person's own net self-employment income (CO-1702) is then 0, and this loss is offset against other income (CO-3724, CO-3725). Coverage review snap-financial CF-3: when SNAP averages the self-employment (snap_self_employment_is_averaged, CO-4329), the receipts and costs are averaged over the averaging months (CO-4349) and the annual gross proceeds are twelve times the average receipts; the loss is then the averaged loss, prorated over the period as 4.403.12.E.1 says."
derived: [case, [[not, [otherwise, self_employment_is_farming, false]], 0], [snap_self_employment_is_averaged, [case, [[">=", ["*", [avg, self_employment_gross_receipts, snap_self_employment_averaging_months], 12], snap_self_employed_farmer_annual_gross_minimum], [max, 0, [avg, ["-", snap_self_employment_costs, self_employment_gross_receipts], snap_self_employment_averaging_months]]], [else, 0]]], [[">=", ["*", self_employment_gross_receipts, 12], snap_self_employed_farmer_annual_gross_minimum], [max, 0, ["-", snap_self_employment_costs, self_employment_gross_receipts]]], [else, 0]]
sources: [S2510, S2511, S3114]
implemented: engine
tags: [income, snap]
rationale: "Final verification F-8: snap_self_employment_income (CO-1702) floors self-employment at zero and its precision recorded the farm loss offset as not modeled, with no open question; the loss is the first step of the offset."
tests:
  - {id: CO-3722-T1, title: "A farmer with $1,500 receipts and $2,300 costs in the month: loss $800", as_of: "2026-10-01", month: "2026-10", given: {self_employment_is_farming: true, self_employment_gross_receipts: 1500, snap_self_employment_costs: 2300}, expect: 800}
  - {id: CO-3722-T2, title: "Receipts of $50 a month ($600 a year) are under $1,000: not a self-employed farmer", as_of: "2026-10-01", month: "2026-10", given: {self_employment_is_farming: true, self_employment_gross_receipts: 50, snap_self_employment_costs: 400}, expect: 0}
  - {id: CO-3722-T3, title: "Not farming", as_of: "2026-10-01", month: "2026-10", given: {self_employment_is_farming: false}, expect: 0}
  - {id: CO-3722-T4, title: "A farm with a profit has no loss", as_of: "2026-10-01", month: "2026-10", given: {self_employment_is_farming: true, self_employment_gross_receipts: 3000, snap_self_employment_costs: 2000}, expect: 0}
  - {id: CO-3722-T5, title: "CF-3: an averaged farm with $6,000 receipts and $9,000 costs over two months: a $1,500 monthly loss", month: "2026-10", as_of: "2026-11-10", given: {self_employment_is_farming: true, snap_self_employment_is_averaged: true, snap_self_employment_averaging_months: ["2026-09", "2026-10"], self_employment_gross_receipts: {"2026-09": 6000, "2026-10": 0}, snap_self_employment_costs: {"2026-09": 4500, "2026-10": 4500}}, expect: 1500}
