th]]]]]]], [receipt, accessible], ["=", [lookup, snap_holding_treatment_table, [receipt, kind]], counted_beyond_one_plot_per_member]], [all, [">", [receipt, value], snap_low_return_resource_maximum], [">", ["-", [receipt, value], [receipt, amount_owed]], snap_low_return_resource_maximum]], [all, ["=", [receipt, burial_for], person_of_case], [in_group, [receipt, for_person], [reachable, [spouse], false]]]], ["-", [receipt, value], [receipt, amount_owed]]]]], [case, [[all, [not, [unknown, [receipt, co_owners]]], ["=", [receipt, co_owners], outside_case]], ["-", [receipt, value], [receipt, amount_owed]]], [else, ["*", ["-", [receipt, value], [receipt, amount_owed]], [otherwise, [receipt, share], 1]]]]], snap_burial_space_excluded_for_member]], [else, 0]]]
sources: [S2216, S3119, S4690, S4823]
implemented: engine
tags: [snap, resources]
rationale: "Coverage pass 4 for SNAP resources, SR-1 (docs/reviews/coverage4-snap-resources.md): snap_countable_burial_spaces (CO-5313) excluded one burial plot per household member on each holder's list, so two members who each held one for the same third member each had one excluded; the holders are the persons the one exclusion for this person is chosen among."
