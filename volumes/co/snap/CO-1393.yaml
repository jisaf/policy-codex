id: CO-1393
name: "SNAP: expedited postponement end date"
identifier: snap_expedited_postponement_end_date
kind: derived
type: calendar date
scope: person
program: SNAP
role: outcome
meaning: "The last day of the period in which a household certified under expedited service may complete postponed verification: the application date plus snap_expedited_postponed_verification_days; for a migrant household needing out-of-state verification, which the thirtieth-day termination does not reach, the end of the month of participation snap_expedited_postponement_months_early (CO-3037) names for an application on or before the day of snap_expedited_late_application_day (CO-3036), or snap_expedited_postponement_months_late (CO-3038) for one after it."
precision: "Colorado elects thirty days for households applying before and after the fifteenth alike (4.205.11.B.2.b, S835); the federal second and third months of 7 CFR 273.2(i)(4)(iii)(A)-(B) (S1310) are permissive outer limits (\"may be postponed\"), so the thirty days stand (OQ-323). Case worker review (OQ-323): a migrant household needing out-of-state verification (CO-2570) is not terminated on the thirtieth day (4.205.11.B.2.b); its period is read as the federal outer limit of 7 CFR 273.2(i)(4)(iii)(A)-(B), through the last day of the second month of participation (application on or before the fifteenth) or the third (after it), the application month being the first. Vocabulary fix round (docs/reviews/vocabulary-reuse.md, R-13): reads snap_application_date (CO-1746), not the Medical Assistance application date."
derived: [case, [[otherwise, snap_is_migrant_household_needing_out_of_state_verification, false], [days_after, -1, [first_day, [months_after, [case, [[">", snap_application_date, [days_after, ["-", snap_expedited_late_application_day, 1], [first_day, [month_of, snap_application_date]]]], snap_expedited_postponement_months_late], [else, snap_expedited_postponement_months_early]], [month_of, snap_application_date]]]]], [else, [days_after, snap_expedited_postponed_verification_days, snap_application_date]]]
sources: [S835, S1310, S1824]
open: [OQ-1100]
implemented: engine
tags: [verification, snap]
rationale: No existing item states how long expedited verification may be postponed.
nearest: [CO-1392, CO-1618]
tests:
  - {id: CO-1393-T1, as_of: "2026-10-01", given: {snap_application_date: "2026-10-01"}, expect: "2026-10-31"}
  - {id: CO-1393-T2, title: "OQ-323: a migrant household applying October 20 needing out-of-state verification - through December 31", as_of: "2026-10-20", given: {snap_application_date: "2026-10-20", snap_is_migrant_household_needing_out_of_state_verification: true}, expect: "2026-12-31"}
  - {id: CO-1393-T3, title: "OQ-323: the same household applying October 3 - through November 30", as_of: "2026-10-03", given: {snap_application_date: "2026-10-03", snap_is_migrant_household_needing_out_of_state_verification: true}, expect: "2026-11-30"}
