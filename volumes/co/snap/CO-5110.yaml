id: CO-5110
name: "SNAP: infrequent or irregular income of the quarter is within the limit"
identifier: snap_irregular_income_is_within_quarterly_limit
kind: derived
type: yes/no
scope: person-month
program: SNAP
meaning: "The person's income received too infrequently or irregularly to be reasonably anticipated in the calendar quarter that contains the month, unearned (receipts marked irregular, snap_irregular_unearned_receipts_in_quarter, CO-5013) and earned (earnings records marked irregular, of every kind that is not a cost of doing business), is no more than snap_irregular_income_quarterly_limit, so the irregular income is excluded (10 CCR 2506-1 4.405.A, S3100: \"$30 or less in three months\"; 7 CFR 273.9(c)(2), S3128: \"not in excess of $30 in a quarter\")."
precision: "One test for both readers (duplicate-paths audit D-S4: the test was written twice, in snap_excluded_earned_income, CO-2338, and snap_excluded_irregular_receipts, CO-5014): snap_irregular_earnings_are_excluded (CO-5111) and snap_excluded_irregular_receipts (CO-5014) read it, each only in a month that has irregular income of its own list. The calendar quarter is also the federal fiscal quarter (snap_calendar_quarter_months, CO-5021). Each month's earnings are summed in that month (\"in that month\"), so a record is read with the counting table in force in the month it was received. Earnings not stated: cannot determine (decision 4 of 2026-11-23); a stated empty list is no irregular earnings. Coverage pass 4 S4-12: only earnings SNAP counts are held against the limit (the pay and business rows, boarders other than foster care boarders, special pay outside a combat zone, subsidized employment not funded by WIOA, a difficulty of care payment not for foster care); work-study, summer youth employment, SCSEP pay, in-kind pay and costs are not income and are left out. Payments for meals only or a room only are boarder records SNAP reads (S4-9), so they are no longer left out."
derived: ["<=", ["+", "snap_irregular_unearned_receipts_in_quarter", ["sum_months", "snap_calendar_quarter_months", ["at", ["sum_receipts", "earnings", ["all", ["receipt", "irregular"], ["case", [["not", ["unknown", ["receipt", "regular_date"]]], ["=", ["month_of", ["receipt", "regular_date"]], ["month"]]], ["else", ["all", ["received_in", ["month"]], ["any", ["not", ["unknown", ["receipt", "month"]]], ["all", ["any", ["unknown", ["receipt", "job_start_date"]], ["<=", ["month_of", ["receipt", "job_start_date"]], ["month"]]], ["any", ["unknown", ["receipt", "job_end_date"]], [">=", ["month_of", ["receipt", "job_end_date"]], ["month"]]]]]]]], ["any", ["in", ["lookup", "snap_earnings_treatment_table", ["receipt", "kind"]], ["counted", "counted_no_rule_excludes", "counted_less_costs", "counted_loss_offset", "excluded_under_19_with_parent"]], ["all", ["=", ["lookup", "snap_earnings_treatment_table", ["receipt", "kind"]], "counted_above_boarder_allowance"], ["not", ["receipt", "foster_care"]]], ["all", ["=", ["lookup", "snap_earnings_treatment_table", ["receipt", "kind"]], "excluded_in_combat_zone"], ["not", ["receipt", "combat_zone"]]], ["all", ["=", ["lookup", "snap_earnings_treatment_table", ["receipt", "kind"]], "counted_unless_wioa_funded"], ["not", ["receipt", "wioa_funded"]]], ["all", ["=", ["lookup", "snap_earnings_treatment_table", ["receipt", "kind"]], "counted_unless_foster_care_boarder"], ["not", ["receipt", "foster_care"]]]]], ["receipt", "amount"]], ["that_month"]]]], "snap_irregular_income_quarterly_limit"]
sources: [S3100, S3128]
implemented: engine
tags: [snap, income]
rationale: "Earned-income records, step E1 (SNAP; docs/reviews/records-earnings-snap.md): SNAP reads earned income from the earnings records (CO-5100) through its counting table (snap_earnings_treatment_table, CO-5101) instead of the scalar earned-income facts and their parts. The quarter test of 4.405.A, shared by the earned and unearned exclusions (duplicate-paths audit D-S4)."
tests:
  - {id: CO-5110-T1, month: "2026-11", as_of: "2026-11-15", given: {receipts: [{kind: other_nontaxable, amount: 10, irregular: true, month: "2026-11"}], earnings: [{kind: wages, amount: 15, irregular: true, month: "2026-10"}]}, title: "Odd-job pay of $15 in October and $10 of irregular unearned income in November: 15 + 10 = $25 in the quarter, within $30", expect: true}
  - {id: CO-5110-T2, month: "2026-11", as_of: "2026-11-15", given: {receipts: [{kind: other_nontaxable, amount: 10, irregular: true, month: "2026-11"}], earnings: [{kind: wages, amount: 25, irregular: true, month: "2026-10"}]}, title: "$25 of odd-job pay and $10 of irregular unearned income: 25 + 10 = $35, over $30", expect: false}
  - {id: CO-5110-T3, month: "2026-11", as_of: "2026-11-15", given: {receipts: [], earnings: [{kind: wages, amount: 20, irregular: true, month: "2026-09"}, {kind: wages, amount: 20, irregular: true, month: "2027-01"}]}, title: "Irregular pay in September and January only: none in the October-December quarter, $0", expect: true}
  - {id: CO-5110-T4, month: "2026-11", as_of: "2026-11-15", given: {receipts: [{kind: board_only_payment, amount: 20, irregular: true, month: "2026-11"}], earnings: [{kind: boarder_payments, amount: 20, irregular: true, month: "2026-11", provides: board_only, boarders: 1}]}, title: "A $20 meals-only payment stated in both lists (the transition copy) is counted once: $20, within $30", expect: true}
  - {id: CO-5110-T5, month: "2026-11", as_of: "2026-11-15", given: {receipts: []}, title: "Earnings not stated: cannot determine", expect: unknown}
  # Coverage pass 4 for SNAP, S4-12: 10 CCR 2506-1 4.405.A (S3100): "Any income ... not in excess of thirty dollars ($30) in three (3) months"; a reimbursement and work-study are not income (4.405.I, 4.405.1).
  - {"id": "CO-5110-T6", "title": "S4-12 (IRR): a $25 odd job (irregular) and a $50 irregular reimbursement in February 2027: the reimbursement is not income (4.405.I), so the quarter's irregular income is 25, within $30: true", "month": "2027-02", "as_of": "2027-02-15", "given": {"earnings": [{"kind": "wages", "amount": 1000}, {"kind": "wages", "amount": 25, "irregular": true, "frequency": "once", "month": "2027-02"}], "receipts": [{"kind": "reimbursement", "amount": 50, "irregular": true, "frequency": "once", "month": "2027-02"}]}, "expect": true}
  - {"id": "CO-5110-T7", "title": "S4-12: $20 of irregular work-study pay (excluded, 4.405.1) and a $25 odd job: 25, within $30: true", "month": "2027-02", "as_of": "2027-02-15", "given": {"earnings": [{"kind": "wages", "amount": 25, "irregular": true, "frequency": "once", "month": "2027-02"}, {"kind": "work_study", "amount": 20, "irregular": true, "month": "2027-02"}], "receipts": []}, "expect": true}
  - {"id": "CO-5110-T8", "title": "S4-12: a $25 odd job and $10 of irregular cash gifts (counted because no rule excludes them): 35 > 30: false", "month": "2027-02", "as_of": "2027-02-15", "given": {"earnings": [{"kind": "wages", "amount": 25, "irregular": true, "frequency": "once", "month": "2027-02"}], "receipts": [{"kind": "gift", "amount": 10, "irregular": true, "month": "2027-02"}]}, "expect": false}
