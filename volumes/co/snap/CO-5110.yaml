id: CO-5110
name: "SNAP: infrequent or irregular income of the quarter is within the limit"
identifier: snap_irregular_income_is_within_quarterly_limit
kind: derived
type: yes/no
scope: person-month
program: SNAP
meaning: "The person's income received too infrequently or irregularly to be reasonably anticipated in the calendar quarter that contains the month, unearned (receipts marked irregular, snap_irregular_unearned_receipts_in_quarter, CO-5013) and earned (earnings records marked irregular, of every kind that is not a cost of doing business), is no more than snap_irregular_income_quarterly_limit, so the irregular income is excluded (10 CCR 2506-1 4.405.A, S3100: \"$30 or less in three months\"; 7 CFR 273.9(c)(2), S3128: \"not in excess of $30 in a quarter\")."
precision: "One test for both readers (duplicate-paths audit D-S4: the test was written twice, in snap_excluded_earned_income, CO-2338, and snap_excluded_irregular_receipts, CO-5014): snap_irregular_earnings_are_excluded (CO-5111) and snap_excluded_irregular_receipts (CO-5014) read it, each only in a month that has irregular income of its own list. The calendar quarter is also the federal fiscal quarter (snap_calendar_quarter_months, CO-5021). Each month's earnings are summed in that month (\"in that month\"), so a record is read with the counting table in force in the month it was received. A payment for meals only or a room only (a boarder record that provides board_only or room_only) is left out of the earnings half: SNAP reads that payment from the receipts while OQ-996 is open, and the earnings record is the translator's copy of it, so it is counted once. Earnings not stated: cannot determine (decision 4 of 2026-11-23); a stated empty list is no irregular earnings."
derived: ["<=",["+","snap_irregular_unearned_receipts_in_quarter",["sum_months","snap_calendar_quarter_months",["at",["sum_receipts","earnings",["all",["receipt","irregular"],["received_in",["month"]],["not",["in",["lookup","snap_earnings_treatment_table",["receipt","kind"]],["deducted","deducted_from_boarder_payments","not_deducted","not_deducted_no_rule_found"]]],["not",["all",["=",["lookup","snap_earnings_treatment_table",["receipt","kind"]],"counted_above_boarder_allowance"],["in",["receipt","provides"],["board_only","room_only"]]]]],["receipt","amount"]],["that_month"]]]],"snap_irregular_income_quarterly_limit"]
sources: [S3100, S3128]
implemented: engine
tags: [snap, income]
rationale: "Earned-income records, step E1 (SNAP; docs/reviews/records-earnings-snap.md): SNAP reads earned income from the earnings records (CO-5100) through its counting table (snap_earnings_treatment_table, CO-5101) instead of the scalar earned-income facts and their parts. The quarter test of 4.405.A, shared by the earned and unearned exclusions (duplicate-paths audit D-S4)."
tests:
  - {id: CO-5110-T1, month: "2026-11", as_of: "2026-11-15", given: {receipts: [{kind: other_nontaxable, amount: 10, irregular: true, month: "2026-11"}], earnings: [{kind: wages, amount: 15, irregular: true, month: "2026-10"}]}, title: "Odd-job pay of $15 in October and $10 of irregular unearned income in November: 15 + 10 = $25 in the quarter, within $30", expect: true}
  - {id: CO-5110-T2, month: "2026-11", as_of: "2026-11-15", given: {receipts: [{kind: other_nontaxable, amount: 10, irregular: true, month: "2026-11"}], earnings: [{kind: wages, amount: 25, irregular: true, month: "2026-10"}]}, title: "$25 of odd-job pay and $10 of irregular unearned income: 25 + 10 = $35, over $30", expect: false}
  - {id: CO-5110-T3, month: "2026-11", as_of: "2026-11-15", given: {receipts: [], earnings: [{kind: wages, amount: 20, irregular: true, month: "2026-09"}, {kind: wages, amount: 20, irregular: true, month: "2027-01"}]}, title: "Irregular pay in September and January only: none in the October-December quarter, $0", expect: true}
  - {id: CO-5110-T4, month: "2026-11", as_of: "2026-11-15", given: {receipts: [{kind: board_only_payment, amount: 20, irregular: true, month: "2026-11"}], earnings: [{kind: boarder_payments, amount: 20, irregular: true, month: "2026-11", provides: board_only, boarders: 1}]}, title: "A $20 meals-only payment stated in both lists (the transition copy) is counted once: $20, within $30", expect: true}
  - {id: CO-5110-T5, month: "2026-11", as_of: "2026-11-15", given: {receipts: []}, title: "Earnings not stated: cannot determine", expect: unknown}
