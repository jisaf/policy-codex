id: CO-2337
name: "SNAP: sponsor deeming applies"
identifier: snap_sponsor_deeming_applies
kind: derived
type: yes/no
scope: person
program: SNAP
meaning: "The sponsor's (and sponsor's spouse's) income and resources are deemed to this person for SNAP: the person is a sponsored non-citizen (an affidavit of support executed on or after December 19, 1997, is_sponsored_non_citizen) who is not a member of the sponsor's SNAP household, is not sponsored by an organization, is not indigent, is not exempt as a battered non-citizen, whose sponsor has not died, and who has not worked or been credited with forty quarters under Title II (10 CCR 2506-1 4.305.2.A, E), and who is not a sponsored child under snap_sponsor_deeming_child_age_limit of a sponsored non-citizen (7 CFR 273.4(c)(3)(vi))."
precision: "A non-citizen who needs no sponsor (a refugee, parolee, asylee or Cuban or Haitian entrant, E.3) or who has naturalized (E.6) has no affidavit of support in force and states is_sponsored_non_citizen false. The forty quarters are qualifying_quarters, which already includes quarters credited from a spouse or parent, against federal_qualifying_quarters_threshold (CO-3033). Only an eligible sponsored non-citizen has the sponsor's income deemed (4.305.2.C); snap_requires_verification_of_sponsor (CO-1616) reads this item for a household member. Final verification F-2: Colorado's list (4.305.2.E) omits the federal exemption of a sponsored child under 18 of a sponsored non-citizen (273.4(c)(3)(vi), S2503); the federal regulation binds the State agency and only narrows deeming, so the arm is applied. The citizen child of (c)(3)(vii) is never sponsored; its share is taken out by the division (snap_sponsor_deeming_divisor, CO-3708). The parent is read through the child's parent edge; the parent's is_sponsored_non_citizen is read as false when not stated."
derived: [all, is_sponsored_non_citizen, [not, [otherwise, snap_lives_in_sponsor_household, false]], [not, [otherwise, sponsor_is_organization, false]], [not, [otherwise, snap_is_indigent_non_citizen, false]], [not, [otherwise, snap_battered_non_citizen_sponsor_exemption_applies, false]], [not, [otherwise, sponsor_has_died, false]], ["<", qualifying_quarters, federal_qualifying_quarters_threshold], [not, [all, ["<", age, snap_sponsor_deeming_child_age_limit], [exists_related, [child], [otherwise, [of, [P], is_sponsored_non_citizen], false]]]]]
sources: [S1619, S1061, S2503]
implemented: engine
tags: [snap, immigration, verification]
rationale: "OQ-380: is_sponsored_non_citizen (CO-1573) had to be stated true only when deeming applied, because the exemptions of 4.305.2.E (S1619) had no facts; this item applies them, so the supplied fact means only that an affidavit of support was executed."
tests:
  - {id: CO-2337-T1, title: "A sponsored LPR with 12 quarters - deeming applies", as_of: "2026-10-01", given: {is_sponsored_non_citizen: true, qualifying_quarters: 12, date_of_birth: "1990-01-01"}, expect: true}
  - {id: CO-2337-T2, title: "E.8 - forty quarters", as_of: "2026-10-01", given: {is_sponsored_non_citizen: true, qualifying_quarters: 40}, expect: false}
  - {id: CO-2337-T3, title: "E.4 - indigent", as_of: "2026-10-01", given: {is_sponsored_non_citizen: true, qualifying_quarters: 12, snap_is_indigent_non_citizen: true}, expect: false}
  - {id: CO-2337-T4, title: "E.5 - battered non-citizen", as_of: "2026-10-01", given: {is_sponsored_non_citizen: true, qualifying_quarters: 12, snap_battered_non_citizen_sponsor_exemption_applies: true}, expect: false}
  - {id: CO-2337-T5, title: "E.7 - the sponsor has died", as_of: "2026-10-01", given: {is_sponsored_non_citizen: true, qualifying_quarters: 12, sponsor_has_died: true}, expect: false}
  - {id: CO-2337-T6, title: "E.1 - lives in the sponsor's SNAP household", as_of: "2026-10-01", given: {is_sponsored_non_citizen: true, qualifying_quarters: 12, snap_lives_in_sponsor_household: true}, expect: false}
  - {id: CO-2337-T7, title: "E.2 - sponsored by an organization", as_of: "2026-10-01", given: {is_sponsored_non_citizen: true, qualifying_quarters: 12, sponsor_is_organization: true}, expect: false}
  - {id: CO-2337-T8, title: "No affidavit of support", as_of: "2026-10-01", given: {is_sponsored_non_citizen: false}, expect: false}
  # Final verification F-2: 7 CFR 273.4(c)(3)(vi) - a sponsored child of a sponsored non-citizen is exempt.
  - {id: CO-2337-T9, title: "A sponsored girl of 10 whose mother is also sponsored - exempt", as_of: "2026-10-01", given: {is_sponsored_non_citizen: true, qualifying_quarters: 0, date_of_birth: "2016-04-01"}, others: {p2: {is_sponsored_non_citizen: true}}, relationships: [[parent, p2, p1]], expect: false}
  - {id: CO-2337-T10, title: "A sponsored boy of 12 whose parent is a citizen - deeming applies", as_of: "2026-10-01", given: {is_sponsored_non_citizen: true, qualifying_quarters: 0, date_of_birth: "2014-02-01"}, others: {p2: {is_sponsored_non_citizen: false}}, relationships: [[parent, p2, p1]], expect: true}
