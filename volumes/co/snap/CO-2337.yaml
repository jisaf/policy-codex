id: CO-2337
name: "SNAP: sponsor deeming applies"
identifier: snap_sponsor_deeming_applies
kind: derived
type: yes/no
scope: person
program: SNAP
meaning: "The sponsor's (and sponsor's spouse's) income and resources are deemed to this person for SNAP: the person is a sponsored non-citizen (an affidavit of support executed on or after December 19, 1997, is_sponsored_non_citizen) who is not a member of the sponsor's SNAP household, is not sponsored by an organization, is not indigent, is not exempt as a battered non-citizen, whose sponsor has not died, and who has not worked or been credited with forty quarters under Title II (10 CCR 2506-1 4.305.2.A, E), and who is not under snap_sponsor_deeming_child_age_limit (18): the sponsor deeming provisions do not apply \"to any alien who is under 18 years of age\" (7 U.S.C. 2014(i)(2)(E); 8 U.S.C. 1631(d)(3))."
precision: "A non-citizen who needs no sponsor (a refugee, parolee, asylee or Cuban or Haitian entrant, E.3) or who has naturalized (E.6) has no affidavit of support in force and states is_sponsored_non_citizen false. The forty quarters are qualifying_quarters, which already includes quarters credited from a spouse or parent, against federal_qualifying_quarters_threshold (CO-3033). Only an eligible sponsored non-citizen has the sponsor's income deemed (4.305.2.C); snap_requires_verification_of_sponsor (CO-1616) reads this item for a household member, so no sponsor verification is asked for a child under 18. The citizen child of 7 CFR 273.4(c)(3)(vii) is never sponsored; its share is taken out by the division (snap_sponsor_deeming_divisor, CO-3708), as is the share of a sponsored child exempt by age, who stays one of the sponsor's non-citizens in the divisor (273.4(c)(2)(v)). Final verification F-2 applied the narrower federal exemption of a sponsored child under 18 whose parent is also sponsored (273.4(c)(3)(vi), S2503); final verification pass 2 N-3: the statute exempts every child under 18 (S2958-S2960), so the parent test is dropped. Age is the age on the determination date, as for every person-scope item."
statute_override: "Federal law overrides 10 CCR 2506-1 4.305.2.E and 7 CFR 273.4(c)(3)(vi), which exempt from sponsor deeming only a sponsored child under 18 of a sponsored non-citizen: since October 1, 2003 (Pub. L. 107-171 sec. 4401(b)), 7 U.S.C. 2014(i)(2)(E) and 8 U.S.C. 1631(d)(3) exclude every non-citizen under 18 from sponsor deeming for SNAP, so no sponsor's income or resources are deemed to a child under 18."
derived: [all, is_sponsored_non_citizen, [not, [otherwise, snap_lives_in_sponsor_household, false]], [not, [otherwise, sponsor_is_organization, false]], [not, [otherwise, snap_is_indigent_non_citizen, false]], [not, [otherwise, snap_battered_non_citizen_sponsor_exemption_applies, false]], [not, [otherwise, sponsor_has_died, false]], ["<", snap_creditable_qualifying_quarters, federal_qualifying_quarters_threshold], [">=", age, snap_sponsor_deeming_child_age_limit]]
sources: [S1619, S1061, S2503, S2958, S2959, S2960, S3056]
implemented: engine
tags: [snap, immigration, verification]
rationale: "OQ-380: is_sponsored_non_citizen (CO-1573) had to be stated true only when deeming applied, because the exemptions of 4.305.2.E (S1619) had no facts; this item applies them, so the supplied fact means only that an affidavit of support was executed."
