id: CO-1382
name: "SNAP: requires verification of child support paid"
identifier: snap_requires_verification_of_child_support_paid
kind: derived
type: yes/no
scope: person-month
program: SNAP
meaning: "Whether the person's legally obligated child support payments must be verified for SNAP: the obligation and the payments are verified whenever the exclusion is claimed at application; at recertification when the obligation's source or the amount paid has changed at all since last verified, or the information is outdated."
precision: "Coverage review snap-financial CF-11: at recertification 4.502.B.3 (S1056) verifies child support when \"the amount has changed by more than twenty-five dollars ($25)\" and 4.507.D.5 (S3123) re-verifies the obligation and payments at every recertification; the federal rule (S1055) requires verifying any change and forbids verifying unchanged information unless it is incomplete, inaccurate, inconsistent or outdated, so a change of any amount is verified and an unchanged amount only when outdated (the statute override). snap_recertification_expense_change_threshold (CO-1597) is no longer read here."
statute_override: "Federal regulation overrides 10 CCR 2506-1 4.502.B.3 and 4.507.D.5 at recertification: 7 CFR 273.2(f)(8)(i)(A), in force throughout the volume's dates, requires the household to verify any change in the legal obligation to pay child support or in the amount paid, not only a change of more than $25 (4.502.B.3), and allows unchanged child support information to be verified only if it is incomplete, inaccurate, inconsistent or outdated, not at every recertification (4.507.D.5)."
derived: [all, snap_is_household_member, [">", child_support_paid_legally_obligated, 0], [any, [not, snap_determination_is_recertification], snap_child_support_paid_source_changed_since_last_certification, [not, ["=", child_support_paid_legally_obligated, snap_child_support_paid_at_last_certification]], [otherwise, snap_child_support_paid_information_is_outdated, false]]]
sources: [S1618, S809, S818, S833, S1055, S1056, S3123]
implemented: engine
tags: [verification, snap, income]
rationale: No existing item states this verification requirement; the phase-9 chapter needs one requirement item per element so the household's pending count and status can be derived.
tests:
  - {id: CO-1382-T1, month: "2026-10", as_of: "2026-10-01", given: {snap_resides_in_institution_providing_meals: false, child_support_paid_legally_obligated: 250, snap_determination_is_recertification: false}, expect: true}
  - {id: CO-1382-T2, month: "2026-10", as_of: "2026-10-01", given: {snap_resides_in_institution_providing_meals: false, child_support_paid_legally_obligated: 0, snap_determination_is_recertification: false}, expect: false}
  - {id: CO-1382-T3, month: "2026-10", as_of: "2026-10-01", given: {snap_resides_in_institution_providing_meals: false, child_support_paid_legally_obligated: 250, snap_determination_is_recertification: true, snap_child_support_paid_at_last_certification: 200}, expect: true}
  # Phase-10 sweep (OQ-371): a new obligation (a changed source) at an unchanged amount is verified at recertification (4.502.B.3).
  - {id: CO-1382-T4, month: "2026-10", as_of: "2026-10-01", given: {snap_resides_in_institution_providing_meals: false, child_support_paid_legally_obligated: 250, snap_determination_is_recertification: true, snap_child_support_paid_at_last_certification: 250, snap_child_support_paid_source_changed_since_last_certification: true}, expect: true}
  - {id: CO-1382-T5, month: "2026-10", as_of: "2026-10-01", given: {snap_resides_in_institution_providing_meals: false, child_support_paid_legally_obligated: 250, snap_determination_is_recertification: true, snap_child_support_paid_at_last_certification: 250, snap_child_support_paid_source_changed_since_last_certification: false}, expect: false}
  - {id: CO-1382-T6, title: "CF-11: support of $300 against $280 last verified, at recertification: verified (a change of $20)", month: "2027-02", as_of: "2027-02-10", given: {snap_is_household_member: true, child_support_paid_legally_obligated: 300, snap_determination_is_recertification: true, snap_child_support_paid_at_last_certification: 280, snap_child_support_paid_source_changed_since_last_certification: false}, expect: true}
