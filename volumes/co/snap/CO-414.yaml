id: CO-414
name: "SNAP: is exempt from the ABAWD time limit"
identifier: snap_is_exempt_from_abawd_time_limit
kind: derived
type: yes/no
scope: person-month
program: SNAP
meaning: For the month the person is outside the ABAWD (able-bodied adult without dependents) age range, unfit for employment, responsible for a dependent child under 14, otherwise exempt from general work registration, pregnant, or an Indian or Urban Indian.
precision: "Does not model the pre-2025 homeless, veteran or former-foster-youth exceptions still stated in 7 CFR 273.24(c)(7)-(9) and Colorado's 4.311.1.C-E: the amended statute struck them, and FNS's proposed rule (91 FR 72439, S1303) describes ending them as USDA's current implementation (OQ-32 resolved). The \"California Indian\" exception (7 U.S.C. 2015(o)(3)(G)) is read through snap_is_indian_or_urban_indian (CO-050; final verification F-13). Age is not a ground here: snap_is_exempt_from_work_registration (CO-405) carries no age arm other than 16-17 (already under 18), so a person aged 60 to 64 is not excepted by age alone, as the proposed rule's 273.24(c)(5) states (S1301)."
assumption: Reads 7 U.S.C. 2015(o)(3)(D)'s "otherwise exempt under subsection (d)(2)" as satisfied by snap_is_exempt_from_work_registration, which 10 CCR 2506-1 4.311.1.A (S750, "Exempt from the general work requirements") states directly (OQ-33 resolved).
statute_override: "Federal law overrides 10 CCR 2506-1 4.311.1: Pub. L. 119-21 sec. 10102 (July 4, 2025) removed the exceptions for persons experiencing homelessness, veterans and former foster youth that 4.311.1 still lists, and narrowed the exception for a person residing with a child to a child under 14; no CDHS implementing communication was available to this volume (OQ-533)."
derived: [any, [not, snap_is_in_abawd_age_range], snap_is_unfit_for_employment, snap_has_responsibility_for_abawd_dependent_child, snap_is_exempt_from_work_registration, is_pregnant, snap_is_indian_or_urban_indian]
sources: [S127, S128, S132, S750, S1301, S1303]
implemented: engine
tags: [abawd, legal]
open: [OQ-533]
rationale: No existing item states the ABAWD exemption test itself; snap_abawd_countable_month and snap_abawd_time_limit_status both read this fact, following the disjunctive structure of 7 U.S.C. 2015(o)(3) (S127, S128) as amended, which the mwr volume's WR-310 models for the pre-amendment exceptions this item deliberately does not reuse.
tests:
  - {id: CO-414-T1, month: "2026-10", given: {is_pregnant: true, snap_is_in_abawd_age_range: true, snap_is_unfit_for_employment: false, snap_has_responsibility_for_abawd_dependent_child: false, snap_is_exempt_from_work_registration: false, snap_is_indian_or_urban_indian: false}, expect: true}
  - {id: CO-414-T2, month: "2026-10", given: {is_pregnant: false, snap_is_in_abawd_age_range: true, snap_is_unfit_for_employment: false, snap_has_responsibility_for_abawd_dependent_child: false, snap_is_exempt_from_work_registration: false, snap_is_indian_or_urban_indian: false}, expect: false}
  - {id: CO-414-T3, month: "2026-10", given: {is_pregnant: false, snap_is_in_abawd_age_range: false, snap_is_unfit_for_employment: false, snap_has_responsibility_for_abawd_dependent_child: false, snap_is_exempt_from_work_registration: false, snap_is_indian_or_urban_indian: false}, expect: true}
