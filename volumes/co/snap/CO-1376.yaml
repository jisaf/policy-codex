id: CO-1376
name: "SNAP: requires verification of earned income"
identifier: snap_requires_verification_of_earned_income
kind: derived
type: yes/no
scope: person-month
program: SNAP
meaning: "Whether the person's earned income must be verified for SNAP: wages are always verified as gross nonexempt income; a self-employment statement is accepted unless questionable; a basic categorically eligible household is not asked again unless questionable."
precision: "Verification is satisfied only by documents or a collateral contact: Department of Labor wage data is not verified upon receipt (4.504.61.B.3, S821)."
derived: [all, snap_is_household_member, [any, [">", earned_income, 0], [all, [">", self_employment_net_income, 0], earned_income_attestation_is_questionable]], [any, [not, ["=", snap_eligibility_category, basic_categorical]], earned_income_attestation_is_questionable]]
sources: [S801, S817, S830, S831, S819]
implemented: engine
tags: [verification, snap, income]
open: [OQ-311]
rationale: No existing item states this verification requirement; the phase-9 chapter needs one requirement item per element so the household's pending count and status can be derived.
tests:
  - {id: CO-1376-T1, month: "2026-10", as_of: "2026-10-01", given: {in_medical_institution: false, earned_income: 2380, snap_eligibility_category: expanded_categorical}, expect: true}
  - {id: CO-1376-T2, month: "2026-10", as_of: "2026-10-01", given: {in_medical_institution: false, earned_income: 0, self_employment_net_income: 400, earned_income_attestation_is_questionable: false}, expect: false}
  - {id: CO-1376-T3, month: "2026-10", as_of: "2026-10-01", given: {in_medical_institution: false, earned_income: 0, self_employment_net_income: 400, earned_income_attestation_is_questionable: true, snap_eligibility_category: standard}, expect: true}
  - {id: CO-1376-T4, month: "2026-10", as_of: "2026-10-01", given: {in_medical_institution: false, earned_income: 500, snap_eligibility_category: basic_categorical, earned_income_attestation_is_questionable: false}, expect: false}
