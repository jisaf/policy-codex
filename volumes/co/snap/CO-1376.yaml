id: CO-1376
name: "SNAP: requires verification of earned income"
identifier: snap_requires_verification_of_earned_income
kind: derived
type: yes/no
scope: person-month
program: SNAP
meaning: "Whether the person's earned income must be verified for SNAP: wages SNAP counts (net of the earnings 4.405 excludes, snap_excluded_earned_income, CO-2338) are always verified at application as gross nonexempt income; a self-employment statement, and an LLC or S-corporation owner's statement of the owner's income (4.403.F), are accepted unless questionable; a basic categorically eligible household is not asked again unless questionable; at recertification only income whose source has changed or whose amount has changed by more than $50, or that is questionable."
precision: "Verification is satisfied only by documents or a collateral contact: Department of Labor wage data is not verified upon receipt (4.504.61.B.3, S821). Coverage review snap-financial CF-10: verification of exempt income \"is necessary only if the income is questionable\" (4.405.J) and 4.506 verifies gross nonexempt income, so wages SNAP excludes in full (a child student's earnings, work-study, the other 4.405 exclusions) do not require verification; and 4.403.F (S3121) accepts an LLC or S-corporation owner's statement of that income unless questionable, as 4.506.C does for self-employment (OQ-760 records the federal text both stand against). Coverage pass 3 C3-1: the income always verified is the earned income SNAP counts other than self-employment, read from snap_person_earned_income_other_than_self_employment (CO-4930), the same item snap_person_earned_income (CO-330) adds up, so a training allowance other than WIOA (4.403.B.1) and VISTA payments counted as earned income (4.403.A.2, C) are verified as wages are. C3-7: payments from boarders are self-employment income (4.403.2, S2963), accepted on the statement unless questionable (4.506.C) as other self-employment is. Earned-income records, step E1 (SNAP; docs/reviews/records-earnings-snap.md): the owner's pay is the month's pay records marked paid_as_business_owner, the self-employment receipts the records whose row is counted_less_costs or counted_loss_offset, and the boarders' payments snap_room_and_board_payments (CO-5117), in place of wages_from_owned_llc_or_s_corporation, self_employment_gross_receipts and room_and_board_payments_received, each of which was read as 0 when not stated; earnings not stated: cannot determine."
