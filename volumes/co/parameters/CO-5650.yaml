rationale: "Receipt records, migration phase 2 (product-owner decision of 2026-11-23): Colorado Works' one counting table, kind by kind, replacing cw_excluded_unearned_income (CO-2341), whose sources each named a part of the gross unearned income facts, and the parts of cw_unearned_income_deductions (CO-4369) that took a named receipt back out of them (refugee resettlement money, a retroactive Colorado Works payment, workers' compensation claim expenses). One table for the unit's members and every person whose income is deemed to it, so the deeming path cannot drift from the members' (as af_receipt_treatment_table, CO-5016)."
