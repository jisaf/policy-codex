id: CO-5650
name: "Colorado Works: how each kind of receipt is treated"
identifier: cw_receipt_treatment_table
kind: parameter
type: table keyed by option
options: [counted, counted_no_rule_excludes, counted_beyond_school_expenses, child_support, sponsor_contribution, not_income_to_unit, excluded, read_as_earnings, not_income]
scope: global
program: ColoradoWorks
meaning: "Colorado Works' counting table for unearned income (9 CCR 2503-6 3.605.3 countable, 3.605.4 exempt, 3.605.5 child support), one row per kind of receipt, the same for a member of the assistance unit and for a person whose income is deemed to it (a stepparent or other budgetary member, a minor parent's parent, a sponsor and the sponsor's spouse, 3.605.1.A.4-5, all through cw_countable_unearned_income). Counted, a paragraph of 3.605.3 naming it: social_security (A.20, B.8), pension (A.16, B.2, B.7), unemployment_compensation (A.19, B.6), interest_and_dividends and tax_exempt_interest (A.15), rental_income (A.2, to the extent it exceeds the allowable expenses cw_unearned_income_deductions takes off), workers_compensation (A.18, B.4, less the award's claim expenses), gambling_winnings, gift and charitable_gift_life_threatening_condition (A.14, gifts or prizes), va_aid_and_attendance (A.1, B.5, less the part used for uncovered medical care, 3.605.4.A.6), state_veteran_annuity (A.1, A.16). Counted because no rule excludes it (3.605.3: \"Unless otherwise specified, any unearned income is countable\", A: \"other payments from any source, which can be construed to be a gain or benefit to the client\", and no paragraph of 3.605.4 exempts it; the Colorado Works owner signs each of these rows): adult_financial_cash, property_or_food_tax_refund, kinship_care_payment (OQ-985), colorado_works_diversion and colorado_works_supportive_services (OQ-986), housing_utility_allowance, americorps (B.12 names Title I VISTA, which is dvsa_title_i_volunteer_payment, not national service), charitable_need_based_cash and migrant_farmworker_emergency_assistance (OQ-987), other_taxable, other_nontaxable. Special: gi_bill_housing_food_allowance is counted to the extent the benefits conditional on school attendance exceed the expenses of attendance (A.4); educational_assistance is exempt (3.605.4.B.26) except its part conditional on attendance, counted with the G.I. Bill allowance under A.4 (cw_school_attendance_benefits_counted); child_support is counted against the need standard at application and, if consistent and over $500 for the unit, at redetermination, and never in the grant (3.605.5.A-C; cw_counted_child_support); sponsor_payment is a gift (A.14) counted unless the sponsor's income is deemed (A.11, 3.605.1.A.5; cw_sponsor_contributions_counted); colorado_works_cash is the unit's own grant, never its income, a retroactive payment correcting an underpayment included (3.609.2.G; docs/conventions.md rule 6). Excluded, with its paragraph: child_support_arrears (3.605.5.D), ssi (3.605.4.B.27), income_tax_refund (A.1, B.34), energy_assistance_federal (B.31), energy_assistance_other (A.4), emergency_assistance (A.3), in_home_care_allowance and home_care_allowance (A.5, for every member, OQ-700), general_assistance (A.7), crime_victim_compensation (A.8), loan and reverse_mortgage (B.1, a bona fide loan), federally_excluded_payment (B.7, B.17, B.19, B.23 and the federal statutes that exclude such payments), foster_care_payment (B.11), dvsa_title_i_volunteer_payment (B.12), workforce_program_payment (B.13, B.14, B.16), vocational_training_allowance (B.13), reimbursement (B.18), refugee_resettlement (B.28, B.29). Receipt records, migration phase 3 (kinds that were parts of other receipts before, each taken off by cw_unearned_income_deductions until then): board_only_payment and room_only_payment are earned income (3.605.2.E.4.c, d; cw_boarder_income), never unearned; savings_account_distribution is excluded (3.605.4.B.20-22, B.25), medicare_premium_refund (3.605.3.B.9, the lump-sum SMIB refund to a buy-in recipient) and insurance_cash_value (3.605.4.B.30); military_allotment is counted (3.605.3.B.10), the part a non-recipient receives for persons not in the unit, its for_person_living_elsewhere, taken off up to their need standard by cw_unearned_income_deductions; school_attendance_conditional_benefit is counted to the extent it exceeds the expenses of attendance (A.4) with the G.I. Bill allowance, and educational_assistance, no longer holding it, is excluded (B.26); adoption_subsidy is excluded (3.605.4.B.32, S4040: \"A child receiving subsidized adoption funds shall be excluded from the assistance unit and his or her income shall be exempt\"; the subsidy is the child's income though paid to the adoptive parent; before receipt records it was counted as part of the other unearned income); early_childhood_research_payment is counted because no rule excludes it, as it was before as part of the other unearned income; the Colorado Works owner signs it. The parts of a one-time receipt spent on the costs it covers (spent_on_covered_costs, A.5, A.6) or designated for the costs of obtaining it (designated_for_lump_sum_costs, B.33) are fields of the receipt cw_counted_unearned_receipts leaves out. Earned-income records, step E0 (OQ-1020): uniformed_services_special_pay, board_only_payment and room_only_payment are earnings (docs/design-earned-and-resource-records.md 2.3); their rows here were kept, with the reading they had, until Colorado Works read its earnings table. Earned-income records, step E1 Colorado Works (docs/reviews/records-earnings-cash.md): Colorado Works reads them from the earnings list (cw_earnings_treatment_table, CO-5104), so their rows here are read_as_earnings (read from the earnings records, never counted as unearned income; a transition copy stated in both lists is counted once): board_only_payment and room_only_payment are boarder payments (3.605.2.E.4.c, d; cw_boarder_income, CO-4361), as their rows here already said, and uniformed_services_special_pay is pay for service counted as earned income because no rule excludes it (3.605.2.D.1), where it was counted here as unearned income for the same reason; the kinds leave receipts in E2. Coverage pass 4 C4-5: dvsa_title_i_payment_at_or_above_minimum_wage is counted because no paragraph of 3.605.4 on file excludes a Title I payment at or above the minimum wage; before the kind existed it was stated as other_taxable, counted the same way (a row for the owner's signature). Not income (not_income; coverage pass 4, CA4-3): resource_liquidation, money the person obtained by selling or converting a resource the person owned, which is no gain (3.601 \"Income\", S4795: \"any financial gain by means of money payment or in-kind payment\"; 3.605.1.A.2: \"Income, in general, is the receipt by a client of a gain or benefit\"); before, it was counted because no rule excludes it. NM-KL-3 and NM-KL-1 (2026-11-24): title_iv_or_bie_student_aid is excluded (3.605.4.B.26, as educational_assistance; and 20 U.S.C. 1087uu (S5243, S5364: 'Notwithstanding any other provision of law, student financial assistance received under this subchapter, Bureau of Indian Education student assistance programs, and employment and training programs under section 3174 of title 29 shall not be taken into account in determining the need or eligibility of any person for benefits or assistance, or the amount of such benefits or assistance, under any Federal, State, or local program financed in whole or in part with Federal funds')); wioa_adult_or_dislocated_worker_payment is excluded (B.13: 'Training allowances or training scholarships granted by Workforce Innovation and Opportunity (WIOA)'; B.16: 'Income received through the Workforce Innovation and Opportunity Act, including supportive services through that program', S2606). allowance_from_institutionalized_spouse is counted because no rule excludes it (3.605.3: 'Unless otherwise specified, any unearned income is countable', and no paragraph of 3.605.4 exempts it; the Colorado Works owner signs the row); where the paying spouse is a member of the same assistance unit, the unit's income holds the payer's income and the allowance both, OQ-1521."
precision: "Receipt records, migration phase 2 (docs/reviews/receipts-migration-2-cw.md). Every kind has a row, and the type check refuses a lookup in a table that lacks one, so no kind is counted or left out by default. A receipt is counted in the month received, whether it recurs or is paid once (3.605.1.A.1; A.9-10 and A.13 name one-time receipts). The parts of a receipt Colorado Works leaves out are fields of it: income set aside under a plan for self-support (3.605.4.B.15), the claim expenses of a workers' compensation award (3.605.3.B.4) and VA Aid and Attendance used for uncovered medical care (3.605.4.A.6). Money withheld by garnishment or recoupment stays counted (3.605.3.A.12). The rows counted because no rule excludes them are the kinds the ledger counted before receipt records by silence (they were part of the other unearned income facts and not among cw_excluded_unearned_income's sources, CO-2341) or, for adult_financial_cash, by a reading of the same silence (vocabulary fix round R-1). A retroactive receipt is treated by its kind: a retroactive Social Security award is counted in the month received, as the lump sum it was part of was; a retroactive SSI award is SSI (B.27), which the scalar facts could state only inside the other unearned income. These paragraphs are 3.605.3 to 3.605.5 of the rule version effective 2025-07-01 (D-81); 3.606 is certification and benefit calculation, and 3.607 workforce development."
