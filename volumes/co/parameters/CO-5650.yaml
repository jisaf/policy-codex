id: CO-5650
name: "Colorado Works: how each kind of receipt is treated"
identifier: cw_receipt_treatment_table
kind: parameter
type: table keyed by option
options: [counted, counted_no_rule_excludes, counted_beyond_school_expenses, excluded_except_school_conditional_part, child_support, sponsor_contribution, not_income_to_unit, excluded]
scope: global
program: ColoradoWorks
meaning: "Colorado Works' counting table for unearned income (9 CCR 2503-6 3.605.3 countable, 3.605.4 exempt, 3.605.5 child support), one row per kind of receipt, the same for a member of the assistance unit and for a person whose income is deemed to it (a stepparent or other budgetary member, a minor parent's parent, a sponsor and the sponsor's spouse, 3.605.1.A.4-5, all through cw_countable_unearned_income). Counted, a paragraph of 3.605.3 naming it: social_security (A.20, B.8), pension (A.16, B.2, B.7), unemployment_compensation (A.19, B.6), interest_and_dividends and tax_exempt_interest (A.15), rental_income (A.2, to the extent it exceeds the allowable expenses cw_unearned_income_deductions takes off), workers_compensation (A.18, B.4, less the award's claim expenses), gambling_winnings, gift and charitable_gift_life_threatening_condition (A.14, gifts or prizes), va_aid_and_attendance (A.1, B.5, less the part used for uncovered medical care, 3.605.4.A.6), state_veteran_annuity (A.1, A.16). Counted because no rule excludes it (3.605.3: \"Unless otherwise specified, any unearned income is countable\", A: \"other payments from any source, which can be construed to be a gain or benefit to the client\", and no paragraph of 3.605.4 exempts it; the Colorado Works owner signs each of these rows): adult_financial_cash, resource_liquidation, property_or_food_tax_refund, kinship_care_payment (OQ-985), colorado_works_diversion and colorado_works_supportive_services (OQ-986), housing_utility_allowance, americorps (B.12 names Title I VISTA, which is dvsa_title_i_volunteer_payment, not national service), uniformed_services_special_pay, charitable_need_based_cash and migrant_farmworker_emergency_assistance (OQ-987), other_taxable, other_nontaxable. Special: gi_bill_housing_food_allowance is counted to the extent the benefits conditional on school attendance exceed the expenses of attendance (A.4); educational_assistance is exempt (3.605.4.B.26) except its part conditional on attendance, counted with the G.I. Bill allowance under A.4 (cw_school_attendance_benefits_counted); child_support is counted against the need standard at application and, if consistent and over $500 for the unit, at redetermination, and never in the grant (3.605.5.A-C; cw_counted_child_support); sponsor_payment is a gift (A.14) counted unless the sponsor's income is deemed (A.11, 3.605.1.A.5; cw_sponsor_contributions_counted); colorado_works_cash is the unit's own grant, never its income, a retroactive payment correcting an underpayment included (3.609.2.G; docs/conventions.md rule 6). Excluded, with its paragraph: child_support_arrears (3.605.5.D), ssi (3.605.4.B.27), income_tax_refund (A.1, B.34), energy_assistance_federal (B.31), energy_assistance_other (A.4), emergency_assistance (A.3), in_home_care_allowance and home_care_allowance (A.5, for every member, OQ-700), general_assistance (A.7), crime_victim_compensation (A.8), loan and reverse_mortgage (B.1, a bona fide loan), federally_excluded_payment (B.7, B.17, B.19, B.23 and the federal statutes that exclude such payments), foster_care_payment (B.11), dvsa_title_i_volunteer_payment (B.12), workforce_program_payment (B.13, B.14, B.16), vocational_training_allowance (B.13), reimbursement (B.18), refugee_resettlement (B.28, B.29)."
precision: "Receipt records, migration phase 2 (docs/reviews/receipts-migration-2-cw.md). Every kind has a row, and the type check refuses a lookup in a table that lacks one, so no kind is counted or left out by default. A receipt is counted in the month received, whether it recurs or is paid once (3.605.1.A.1; A.9-10 and A.13 name one-time receipts). The parts of a receipt Colorado Works leaves out are fields of it: income set aside under a plan for self-support (3.605.4.B.15), the claim expenses of a workers' compensation award (3.605.3.B.4) and VA Aid and Attendance used for uncovered medical care (3.605.4.A.6). Money withheld by garnishment or recoupment stays counted (3.605.3.A.12). The rows counted because no rule excludes them are the kinds the ledger counted before receipt records by silence (they were part of the other unearned income facts and not among cw_excluded_unearned_income's sources, CO-2341) or, for adult_financial_cash, by a reading of the same silence (vocabulary fix round R-1). A retroactive receipt is treated by its kind: a retroactive Social Security award is counted in the month received, as the lump sum it was part of was; a retroactive SSI award is SSI (B.27), which the scalar facts could state only inside the other unearned income. These paragraphs are 3.605.3 to 3.605.5 of the rule version effective 2025-07-01 (D-81); 3.606 is certification and benefit calculation, and 3.607 workforce development."
