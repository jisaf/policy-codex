id: CO-130
name: SNAP maximum allotment by household size
identifier: snap_maximum_allotment_table
kind: parameter
type: table keyed by household size
scope: global
program: SNAP
meaning: The maximum monthly SNAP allotment (Thrifty Food Plan cost) for a household of the stated size, before the 30% net-income reduction, for household sizes 1 through 8.
precision: Sizes above 8 add snap_maximum_allotment_each_additional per additional member; see snap_maximum_allotment.
versions:
  - from: "2025-10-01"
    to: "2026-10-01"
    value: { "1": 298, "2": 546, "3": 785, "4": 994, "5": 1183, "6": 1421, "7": 1571, "8": 1789 }
    source: S82
  - from: "2026-10-01"
    to: "2027-10-01"
    value: { "1": 306, "2": 562, "3": 808, "4": 1023, "5": 1217, "6": 1463, "7": 1616, "8": 1841 }
    source: S730
rationale: "7 CFR 273.10(e)(2)(ii)(A) (S104) and 7 U.S.C. 2017 require an allotment computed against the maximum allotment for the household's size; D-20's Table 1 (S82) is the FY2026 FNS-published dollar table (48 states and D.C. column) no existing parameter states. Phase 8 adds the FY2027 version (D-83 Table 1, S730; 10 CCR 2506-1 4.207.3.D, S738), resolving OQ-21."
review_by: "2027-10-01"
sources: [S82, S730, S738]
