rationale: "No existing item states the AND-CS grant standard. af_grant_standard (CO-949) and af_and_grant (CO-952) need it. Fix round: adds a 2026-01-01 version per D-69 (CDHS's Adult Financial Programs page, an Internet Archive capture), which states \"$994, effective January 1, 2026\" - the year, which D-69's own top-of-document summary paragraph treats as ambiguous (\"effective January [2026 by context]\") because the sentence wraps mid-date in the extracted text, is in fact stated in full in the page body (S560); read in full it is unambiguous. See OQ-118."
