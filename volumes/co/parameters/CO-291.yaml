program: AdultFinancial
meaning: The total AND-CS grant standard, per 9 CCR 2503-5 3.546.A, before deducting a client's countable income.
precision: Adjustable within available appropriations with no appeal right (3.546.B); each adjustment the rule states is a new dated version (OQ-118, resolved). The 2026 figure is from D-80.
