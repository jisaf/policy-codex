id: CO-233
name: SSI-related resource limit, individual
identifier: ma_ssi_resource_limit_individual
kind: parameter
type: money
scope: global
program: Medicaid
meaning: The countable resource limit for a single SSI-related, OAP or Long-Term-Care applicant, per 42 U.S.C. 1382b, 20 CFR 416.1205(c) and 10 CCR 2505-10 8.100.5.M.1.
value: 2000
sources: [S301, S302]
tags: [ma, non_magi, resources]
rationale: "No existing item states the $2,000 individual SSI-related resource limit. ma_meets_ssi_resource_standard (CO-610) needs it, and QDWI's twice-the-limit test (ma_qdwi_eligible, CO-616) reads it directly rather than restating $4,000 as a second literal."
