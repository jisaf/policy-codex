id: CO-110
name: SNAP gross income limit by household size (130% FPL)
identifier: snap_gross_income_limit_table
kind: parameter
type: table keyed by household size
scope: global
program: SNAP
meaning: The monthly gross income limit (130% of the federal poverty level, 48 states and D.C.) for a Standard Eligibility household without an elderly or disabled member, by household size 1 through 8.
precision: Sizes above 8 add snap_gross_income_limit_each_additional per additional member; see snap_gross_income_limit (CO-344), which composes this table with that parameter.
versions:
  - from: "2025-10-01"
    value: { "1": 1696, "2": 2292, "3": 2888, "4": 3483, "5": 4079, "6": 4675, "7": 5271, "8": 5867 }
    source: S53
rationale: 10 CCR 2506-1 4.401,A,3,a (S50) and 7 CFR 273.9(a)(1) require SE households without an elderly or disabled member to meet a 130% gross income standard; no existing parameter states the dollar table households are actually compared against, and D-21 (S53) is the FY2026 FNS table for the 48 states and D.C.
sources: [S53]
tags: [income, snap]
