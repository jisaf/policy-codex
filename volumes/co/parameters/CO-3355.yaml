id: CO-3355
name: "Colorado Works: days of temporary absence with intent to return"
identifier: cw_temporary_absence_max_days
kind: parameter
type: whole number
scope: global
program: ColoradoWorks
meaning: "A parent or non-parent caretaker temporarily absent for less than this many calendar days who has established an intent to return is living in the home (9 CCR 2503-6 3.604.2.I.3); a child absent longer stays in the home only for the reasons G lists."
value: 45
sources: [S2203]
implemented: engine
tags: [cash, household]
rationale: "Same-word audit SW-7 and dual-entry audit 3.6: living together was read from relationship edges by every household, caretaker and custody item, while Medicaid read a separate lives_with list stated on one person; the two disagreed in CO-04, and lives_with could be stated on p1 and not on p2. Each person states the home they live in once; lives_with is derived, symmetric, and every item that asks whether persons live together reads it (convention rule 17). A figure the rule states is a parameter (OQ-82)."
