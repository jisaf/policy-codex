id: CO-1981
name: Income trust gross income limit, Region I
identifier: ma_income_trust_limit_region_i
kind: parameter
type: money
scope: global
program: Medicaid
meaning: "The average monthly private-pay cost of Long-Term Care institution care in Region I of 10 CCR 2505-10 § 8.100.7.G.6.a.i.a), which HCPF calculates each calendar year: the gross monthly income an individual with an income trust who resides in that region must be below."
precision: The figures come from HCPF Operational Memo OM 25-073, which could not be retrieved (hcpf.colorado.gov refuses automated requests); they were supplied by the product owner and are unverified (S1230).
