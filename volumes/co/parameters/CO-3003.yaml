id: CO-3003
name: CCCAP parent fee share for all-part-time care
identifier: cccap_part_time_care_fee_rate
kind: parameter
type: rate
scope: global
program: CCCAP
meaning: "The share of the calculated parent fee assessed when all children in a household are in part-time care (an average of less than thirteen full-time equivalent units of care per month), per 8 CCR 1403-1 3.124.U."
precision: The rule text states no effective date for the figure, so it has one value.
value: 0.55
sources: [S787]
tags: [income]
rationale: "Hard-coded numbers audit H-4: cccap_parent_fee (CO-1290) multiplied by a literal 0.55; no existing parameter states the share."
