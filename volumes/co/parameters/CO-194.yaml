id: CO-194
name: MAGI income limit, Pregnant Women category, percent of FPL
identifier: ma_income_limit_pregnant_pct
kind: parameter
type: rate
scope: global
program: Medicaid
meaning: Colorado's income limit for the Pregnant Women MAGI Medical Assistance category, expressed as a decimal fraction of the federal poverty level (MAGI-equivalent), under 10 CCR 2505-10 8.100.4.G.5.
precision: "A percentage-of-FPL figure (1.95 = 195%), compared directly against ma_magi_household_income_pct_fpl (CO-504). The current Secretary of State text of § 8.100.4.G.5 (D-65, S640) and CMS's eligibility levels table (D-73, S641) both state 195%, the same figure 10 CCR 2505-3 § 110.1.F uses as the CHP+ prenatal floor; the 185% this item held came from the out-of-date Cornell copy (D-40, S209). The § 8.100 version effective 04/14/2022 (D-78, S676) states the earlier figure and the version effective 06/30/2022 (D-77, S675) the current one, so the current figure runs from 2022-06-30; no earlier version was fetched, so the volume states no figure before 2022-04-14."
versions:
  - from: "2022-04-14"
    to: "2022-06-30"
    value: 1.85
    source: S676
  - from: "2022-06-30"
    value: 1.95
    source: S675
sources: [S675, S676, S640, S641]
tags: [ma, magi, income, state_election]
rationale: "No existing item carries Colorado's Pregnant-Women-category income percentage. ma_magi_income_standard_pregnant (CO-543) needs it as a parameter rather than an inline digit (governance name.digits). History moved from the precision note (HCPF review S-14): Phase 7: the current Secretary of State text of § 8.100.4.G.5 (D-65, S640) and CMS's eligibility levels table (D-73, S641) both state 195%, the same figure 10 CCR 2505-3 § 110.1.F uses as the CHP+ prenatal floor; the 185% this item held came from the out-of-date Cornell copy (D-40, S209). Versioned in the phase 7 fix round (S-12; OQ-211, resolved): the § 8.100 version effective 04/14/2022 (D-78, S676) states the earlier figure and the version effective 06/30/2022 (D-77, S675) the current one, so the current figure runs from 2022-06-30; no earlier version was fetched, so the volume states no figure before 2022-04-14. Precision history (moved from precision, engineering follow-up pass task 5): Versioned in the phase 7 fix round (S-12; OQ-211, resolved)."
