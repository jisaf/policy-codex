rationale: "No existing item carries Colorado's Pregnant-Women-category income percentage. ma_magi_income_standard_pregnant (CO-543) needs it as a parameter rather than an inline digit (governance name.digits). Fix round: versioned from the HCPF chart (D-68/D-70) on the same reasoning as ma_income_limit_child_pct (CO-191) and ma_income_limit_parent_caretaker_pct (CO-192, nearest same-shape items, acknowledged here). History begins at D-70's effective date (2025-04-01) for the same reason CO-191 does not carry an earlier version."
