id: CO-1513
name: Adult Financial maximum in-kind support and maintenance amount
identifier: af_ism_maximum
kind: parameter
type: money
scope: global
program: AdultFinancial
meaning: The maximum monthly In-Kind Support and Maintenance (ISM) amount for shelter costs that OAP and AND-CS count as unearned income for a client not paying a fair share of shelter costs, per 9 CCR 2503-5 3.520.79, 3.530.B and 3.546.D.
precision: 3.520.79.E.2 computes it as the SSI benefit standard times 33.33% plus $20, rounded to the nearest whole dollar; the rule states each year's figure, which is carried here as a version.
versions:
  - from: "2025-01-01"
    to: "2026-01-01"
    value: 342
    source: S1020
  - from: "2026-01-01"
    value: 351
    source: S700
sources: [S700, S707, S1012, S1020]
tags: [cash, oap, and, income]
rationale: "No existing parameter states the Adult Financial ISM maximum (phase-8 review K-4); af_countable_income (CO-946) caps the county's ISM amount at it. Not the SSI-methodology in-kind figure the Medicaid chapter's in_kind_support_and_maintenance (CO-802) carries, which is valued under 20 CFR 416.1130-416.1140 without the Adult Financial cap or valuation steps."
