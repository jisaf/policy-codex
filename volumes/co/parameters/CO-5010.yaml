id: CO-5010
name: "SNAP: how each kind of receipt is treated"
identifier: snap_receipt_treatment_table
kind: parameter
type: table keyed by option
options: [counted, counted_no_rule_excludes, counted_beyond_quarterly_limit, counted_if_substantial, net_of_costs, counted_as_earned, sponsor_deeming, read_from_earnings, excluded]
scope: global
program: SNAP
meaning: "SNAP's counting table for unearned income (7 CFR 273.9(b)(2), (c); 10 CCR 2506-1 4.403, 4.404, 4.405), one row per kind of receipt. Counted, 273.9(b)(2) naming it: social_security, ssi, pension, unemployment_compensation, workers_compensation, va_aid_and_attendance and state_veteran_annuity ((ii) annuities, pensions, retirement, veterans' or disability benefits, workers' or unemployment compensation, old-age, survivors and Social Security benefits), child_support and child_support_arrears ((iii) support payments), colorado_works_cash, adult_financial_cash and general_assistance ((i) assistance payments), tax_exempt_interest and interest_and_dividends (dividends and interest), energy_assistance_other (4.405.H.7: assistance not under federal law is counted). Counted because no rule excludes it (273.9(b) counts \"all income from whatever source\" unless (c) excludes it; the SNAP owner signs each of these rows): resource_liquidation, property_or_food_tax_refund, foster_care_payment, kinship_care_payment, colorado_works_diversion, colorado_works_supportive_services, housing_utility_allowance, gi_bill_housing_food_allowance, refugee_resettlement, emergency_assistance, in_home_care_allowance, home_care_allowance, charitable_gift_life_threatening_condition, gift, other_taxable, other_nontaxable. Special: rental_income counted net of its costs (4.404.D, snap_rental_income); charitable_need_based_cash counted beyond snap_charitable_cash_quarterly_limit a quarter (4.405.A.10); gambling_winnings counted only as substantial winnings of one game in the month received (4.403.I); dvsa_title_i_volunteer_payment and vocational_training_allowance are earned income (4.403.A.2, C; B.1), read by snap_person_earned_income_other_than_self_employment; sponsor_payment is read by snap_sponsor_deemed_income (4.305.2.D.4). Excluded, with the paragraph: educational_assistance (4.405.1), loan and reverse_mortgage (4.405.F), reimbursement (I), energy_assistance_federal (4.405.2.A.7), income_tax_refund (A.20), federally_excluded_payment (A.2-A.4, A.14, A.18, A.23, A.26, A.28), americorps (A.4), workforce_program_payment (A.6, A.8), migrant_farmworker_emergency_assistance (A.15), crime_victim_compensation (A.27). Whatever its row, a receipt paid once is a nonrecurring lump sum, excluded (4.405.E), except substantial gambling winnings. Receipt records, migration phase 3 (kinds that were parts of other receipts before): school_attendance_conditional_benefit is excluded with the educational assistance it was part of (4.405.1); military_allotment is counted because no rule excludes it, less the part received for persons who do not live with the person (its for_person_living_elsewhere, 4.405.B, which snap_counted_recurring_receipts leaves out of every receipt); adoption_subsidy, early_childhood_research_payment, savings_account_distribution, medicare_premium_refund and insurance_cash_value are counted because no rule excludes them; board_only_payment and room_only_payment are counted as unearned income because no rule excludes them: 4.408 treats a boarder's payment for room and meals as self-employment income (S2963; room_and_board_payments_received), and names no payment for meals only or a room only (OQ-996). Each was counted before as part of the other unearned income; the SNAP owner signs each. Earned-income records, step E0 (OQ-1020): uniformed_services_special_pay, board_only_payment and room_only_payment are earnings (docs/design-earned-and-resource-records.md 2.3); their rows here are kept, with the reading they have, until SNAP reads its earnings table (snap_earnings_treatment_table, CO-5101, which carries the same reading), and the kinds leave receipts in E2. Earned-income records, step E1 (SNAP): SNAP reads its earnings table; uniformed_services_special_pay is read_from_earnings, not read here (a receipt of the kind is the translator's transition copy of the earnings record, which SNAP counts as earned income: CO-5101, 7 CFR 273.9(b)(1)(i), S41; the combat-zone part excluded, 4.405.2.A.12, S3109), so no SNAP sum over the receipts reaches it; board_only_payment and room_only_payment keep their row while OQ-996 is open, and SNAP reads those payments here only (its earnings readers leave the transition copies out). Coverage pass 4 C4-5: dvsa_title_i_payment_at_or_above_minimum_wage counted as earned, as the Title I row is, since 4.403.A.2 and 4.405.2.A.3 (S3106, S3105) count VISTA payments as earned income, whatever their value, unless the volunteer received SNAP or public assistance when joining (snap_person_earned_income_other_than_self_employment, CO-4930, reads both kinds)."
precision: "Receipt records, migration phase 1 (docs/reviews/receipts-migration-1.md). Every kind has a row, and the type check refuses a lookup in a table that lacks one, so no kind is counted or left out by default. The rows counted because no rule excludes them are the kinds the ledger counted before receipt records by silence (they were part of the other unearned income facts and not among snap_excluded_unearned_income's sources, CO-2339). The parts of a receipt SNAP leaves out are fields of the receipt: an overpayment recouped from the same source other than for an intentional failure to comply (4.405.D.1), child support turned over to the IV-D agency (D.2), a former spouse's share of military retirement (A.11), money for a person living elsewhere (B), and income set aside under a PASS (A.22)."
