id: CO-832
name: Transfer penalty divisor
identifier: transfer_penalty_divisor
kind: parameter
type: money
scope: global
program: Medicaid
meaning: The average of the regions' monthly private-pay cost of Long-Term Care institution care in Colorado, calculated by HCPF each calendar year (10 CCR 2505-10 § 8.100.7.E), by which an uncompensated transfer's value is divided to give the number of penalty months (§ 8.100.7.F.2.c.i).
precision: § 8.100.7.F.2.c.i (D-65, S648) states only how the divisor is defined. The 2025 and 2026 figures come from HCPF Operational Memo OM 25-073, which could not be retrieved (hcpf.colorado.gov refuses automated requests); they were supplied by the product owner and are unverified (S1228). 
versions:
  - {from: "2025-01-01", to: "2026-01-01", value: 10475.11, source: S1228}
  - {from: "2026-01-01", value: 10814.64, source: S1228}
review_by: "2027-01-01"
sources: [S366, S648, S1228]
tags: [ma, ltc, legal]
open: [OQ-212]
rationale: "No fetched document states the current average private-pay rate; ma_transfer_penalty_months (CO-649) and ma_transfer_penalty_days (CO-659) need it. OQ-212: the product owner supplied the 2025 and 2026 figures, so it is a dated parameter rather than a per-case supplied fact. Precision history (moved from precision, engineering follow-up pass task 5): Moved from a supplied fact to a dated parameter in the open-question sweep (OQ-212)."
