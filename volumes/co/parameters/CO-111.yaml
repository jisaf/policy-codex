rationale: "7 CFR 273.9(a)(3)(i) requires the increment for households over 8 persons; D-21's table 2 (S53) states the FY2026 dollar increment, which snap_gross_income_limit_table alone does not carry. Phase 8 adds the FY2027 version (S735, S739)."
