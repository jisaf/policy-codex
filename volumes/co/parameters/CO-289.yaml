id: CO-289
name: Old Age Pension grant standard
identifier: af_oap_grant_standard
kind: parameter
type: money
scope: global
program: AdultFinancial
meaning: The total monthly OAP grant standard the State Board of Human Services sets, per 9 CCR 2503-5 3.530.A, before deducting a client's countable income.
precision: The State Board may adjust this figure to remain within available appropriations, with no appeal right (3.531.C); each adjustment the rule states is a new dated version (OQ-118, resolved). The 2026 figure is from the version of 9 CCR 2503-5 effective 2026-03-02 (D-80).
versions:
  - from: "2025-01-01"
    to: "2026-01-01"
    value: 1005
    source: S455
  - from: "2026-01-01"
    value: 1032
    source: S700
sources: [S455, S700, S702]
rationale: No existing item states the OAP grant standard. af_grant_standard (CO-949), af_oap_grant (CO-951), and af_category's income test (CO-953) need it. Versioned (not a bare value) because 3.530.A states an explicit effective date.
