id: CO-1171
name: "Medicaid: work quarters that exempt a Lawful Permanent Resident from the five-year rule"
identifier: ma_five_year_bar_exempt_work_quarters
kind: parameter
type: whole number
scope: global
program: Medicaid
meaning: "The number of work quarters a Lawful Permanent Resident must have worked to be exempt from the five-year rule for Medical Assistance - 10 CCR 2505-10 § 8.100.3.G.1.g.iv.1 (\"Has worked 40 work quarters (8 U.S.C. § 1612(b)(2)(B))\")."
value: 40
sources: [S656]
tags: [ma, immigration]
rationale: "B-2 of the phase 7 review: the 40-quarters exemption is new in the current § 8.100.3.G.1.g.iv (the Cornell copy had no such category). A policy number the text states, kept as a parameter so ma_is_five_year_bar_exempt (CO-1172) carries no digit. Not SNAP's figure reused, because SNAP's 40-quarter condition is a different statute's test (7 U.S.C. 2015(f)) read by different items."
