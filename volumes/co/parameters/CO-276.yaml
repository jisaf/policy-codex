id: CO-276
name: Colorado Works grant standard by number of children (one caretaker)
identifier: cw_grant_standard_table
kind: parameter
type: table keyed by household size
scope: global
program: ColoradoWorks
meaning: The maximum basic cash assistance grant for a unit of zero income under 9 CCR 2503-6 3.606.1.F's Colorado Works Standards of Assistance Chart, for the "One Caretaker" row, keyed the same way as cw_need_standard_table (CO-274) - by number of dependent children (0-10) - the amount 3.606.1.I and .K deduct net countable income from to compute the authorized grant.
precision: "Re-keyed from household size (1-11) to number of children (0-10) under the fix-round C-5 finding, the same change as cw_need_standard_table (CO-274); see that item's precision for why. CDHS review B-5: SB 26-181 (D-171, S1800, approved and in effect June 2, 2026, S1801) amended C.R.S. 26-2-709(1)(b) so that no cost-of-living adjustment is applied to basic cash assistance for the State fiscal years beginning July 1, 2026 and July 1, 2027, and the annual increase of at least 2% resumes July 1, 2028; CDHS's proposed SFY 2026-27 increase (eDocket 2026-00094) was terminated as moot (S1804) and the Secretary of State's current version of 9 CCR 2503-6 is still the one effective July 1, 2025 (S1803). The chart therefore carries a version for SFY 2026-27 and 2027-28 with the same figures, ending June 30, 2028; a determination from July 1, 2028 has no figure until the State publishes the SFY 2028-29 chart (OQ-530)."
