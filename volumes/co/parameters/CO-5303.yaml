id: CO-5303
name: "Medicaid, SSI method: how each kind of holding is treated"
identifier: ma_ssi_holding_treatment_table
kind: parameter
type: table keyed by option
options: [counted, counted_less_taxes, counted_no_rule_excludes, counted_less_real_property_exclusions, counted_less_one_transportation_vehicle, counted_cash_value_if_face_over_limit, counted_value_found_available, home_rules, burial_exclusion, excluded, excluded_household_goods, excluded_nine_months, excluded_federal_within_twelve_months, excluded_in_month_received_and_next, excluded_three_months_toward_real_property]
scope: global
program: Medicaid
meaning: "The SSI method's counting table for holdings, as Medical Assistance for the aged, blind and disabled and long-term care reads it (10 CCR 2505-10 8.100.5.J, M, N and 8.100.7.E-I, adopting 20 CFR 416 Subpart L), one row per kind of holdings record (holdings, CO-5300), read for the person, the spouse whose resources count (20 CFR 416.1202(a), S4503) and a deeming parent (416.1202(b), S3414). The Medicare Savings Program (OQ-1200), Adult Financial burial assistance (9 CCR 2503-5 3.570.43.D.3.b) and the Colorado Works death reimbursement (9 CCR 2503-6 3.606.7.F.2.c) read the SSI method by their cited links (decision D6), as they read ssi_countable_resources_individual (CO-800) today. Counted, a paragraph naming it: cash, bank_account, securities (8.100.5.M.3.a-c, S4505; 20 CFR 416.1201(b), S2420; a joint account presumed the applicant's, M.3.d, S4505, and 416.1208(c)(1), S4502), installment_contract and loan_receivable (416.1201(b), (c)(1), S2420: promissory notes and mortgages are liquid resources, loan agreements non-liquid), investment_personal_property (8.100.5.M.3.j, S3421). Counted less taxes: retirement_account (8.100.5.N.2, S3401: \"countable as a resource to the applicant\"; at \"The gross value of the account, less any taxes due\", or less 20% when the applicant is not able to provide them, N.5, S4667: taxes_on_withdrawal, ma_retirement_account_default_tax_rate, CO-6502; a living-with spouse's self-funded account is exempt for the applicant, N.3, and a deeming parent's pension funds are excluded, 416.1202(b)(1)(i), S3414: read outside the sum by person, as ma_ssi_countable_resources, CO-608, and ma_ssi_parental_resources_deemed, CO-4627, do; self_funded). Counted less real property exclusions: real_property (8.100.5.M.3.g, S3402: real property not the home and not excluded as income-producing; excluded while reasonable efforts to sell are unsuccessful, M.2.b, S1514 (ma_sale_efforts_unsuccessful); the share owned with a co-owner who would lose housing, M.3.h, S1515 (co_owner_lives_in_it, co_owner_would_lose_housing); income-producing property excluded up to $6,000, property used in a trade or business only with a 6% return, J.2-3, S3402 (income_producing, used_in_trade_or_business, net_annual_return)). Counted less one transportation vehicle: vehicle (8.100.5.M.2.c (S4504) and 20 CFR 416.1218(b)(1) (S2215): \"One automobile is totally excluded regardless of value if it is used for transportation\"; the equity of the others counted, M.3.k, S4505; used_for_transportation). Counted cash value if face over limit: life_insurance (20 CFR 416.1230(a), S2215, as 8.100.5.M.2.f restates it: the cash surrender value, unless the face value of all policies on the person is $1,500 or less; such a policy's face reduces the burial exclusion, M.2.j, S3400; face_value). Counted value found available: trust_interest, annuity, life_estate (8.100.7.E.4-5, H.2, I, S3423: the corpus from which payment could be made, a revocable or assignable annuity's principal and interest, a life estate on countable property; ma_found_available_value, the eligibility site's finding on the Department's determination, E.7.c). Home rules: home (8.100.5.M.2.a and M.3.e-f, S3403 and S369: excluded as the principal place of residence within the equity limit, with the intent-to-return, spouse or dependent relative, trust or entity and out-of-state rules, and counted when subject to a recorded beneficiary deed and estate recovery; lives_in, intends_to_return, intent_in_writing, outside_colorado, held_in_trust_or_entity, beneficiary_deed). Burial exclusion: burial_fund, prepaid_burial_contract (8.100.5.M.2.i-j, S3400: irrevocable burial funds excluded; up to $1,500 of revocable burial funds excluded, reduced by the irrevocable funds and the face of life insurance whose cash value is excluded; interest left to accumulate excluded; irrevocable, accrued_interest). Excluded, a paragraph naming it: able_account (8.100.5.M.2.k, S3421), burial_space (8.100.5.M.2.h, S4504: \"The total value of burial spaces for the applicant/recipient, his/her spouse and any other members of his/her immediate family is exempt\"). Excluded household goods: personal_property (8.100.5.M.2.d-e, S4504: household goods and personal effects; personal property such as a mobile home or trailer not exempt as the home or as income-producing is countable, M.3.i, S4505, and no fact states it today: the Medicaid owner signs the rest). Excluded nine months: held_retroactive_ssa_benefit (8.100.5.F.6.c, S3404: retroactive SSI or Title II payments exempt for nine months following receipt, the remainder countable thereafter; source_date). Counted, settled by the text (the Medicaid H1 track, from rows H0 marked counted_no_rule_excludes): education_savings_account (a 529 or Coverdell account the person owns and can withdraw), other_resource (any other property the person owns that can be converted to cash): \"Resources are defined as cash or other assets or any real or personal property that an individual or spouse owns\" (8.100.5.M.1, S301), available when the person has an ownership interest and the power to convert it to cash and is not legally restricted from using it (E.3, S4670; 20 CFR 416.1201(a), S4500), and neither the exempt resources of M.2 (S4504, S1514, S3400, S3421, S3403) nor the exemptions of F.6 (S4506, S4668, S3404) name either (F.6.aa-cc, S4674, name student grants and loans and vocational aid, not savings the person holds). Counted because no rule excludes it (counted_no_rule_excludes: the texts on file name no exclusion and do not settle the row; the Medicaid owner signs each row, OQ-1204 part (2)): business_cash_and_assets (8.100.5.J.3 (S3402) excludes \"Property used in a trade or business which is essential to self-support\" up to $6,000 with a 6% return, and M.1 defines resources as \"cash or other assets or any real or personal property\", naming cash apart from property: whether business cash is J.3 property is the owner's), held_prorated_income (8.100.5.E.1, S4673, calculates income \"on a monthly basis regardless of whether it is received annually, semi-annually, quarterly or weekly\", and no text on file says whether the part of such income held for the months it is meant to cover is a resource in those months). Excluded, the F.6 payments: held_excluded_payment (8.100.5.F.6, S4506, S4668: \"the following shall be exempt from consideration as either income or resources\" for the long-term care and aged, blind and disabled categories: relocation payments, f; major disaster and emergency assistance, k, as 20 CFR 416.1237(a), S4663; Civil Liberties Act payments, r; Agent Orange settlement payments, s; Radiation Exposure Compensation payments, v; Nazi persecution payments, x), held_loan_proceeds (F.6.a, S4506: \"A bona fide loan\"). Excluded federal within twelve months: held_income_tax_refund (26 U.S.C. 6409, S4664: a federal refund, the earned income tax credit paid with it included, \"shall not be taken into account as resources for a period of 12 months from receipt\" in a program financed in part with Federal funds; paid_by federal, source_date, ma_federal_tax_refund_resource_exclusion_months, CO-6500; a State or local refund is counted: no text on file excludes it). Excluded in month received and next: held_eitc (8.100.5.F.6.u, S4506: \"EIC shall also be exempt as resources for the month it is received and for the following month\"; source_date; whether F.6.u reaches a State or local credit is OQ-1242). Excluded three months toward real property: held_replacement_proceeds whose replacement_property is real_property (8.100.5.P.4, S4669: the proceeds of the sale of an exempt home used to purchase another home within three months; relocation payments toward a replacement dwelling for up to six months, F.6.f, S4506: three months is the window every source the kind names at least has, ma_replacement_proceeds_exclusion_months, CO-6501); proceeds toward personal property are counted (no Medical Assistance text on file excludes insurance proceeds; 20 CFR 416.1232(a), S4662, is not adopted by a text on file: OQ-1240)."
precision: "Resource records, step H0 (docs/reviews/holdings-h0.md; docs/design-earned-and-resource-records.md 3.3): every row is today's reading, what the program's items do now with the scalar resource fact the kind restates (cash, bank_account and securities: liquid_resources_value (CO-3390), less the parts below stated apart (the translator writes the remainder as one bank_account record: the old fact does not tell cash, accounts and securities apart); retirement_account: retirement_accounts_value (CO-3392) with retirement_accounts_taxes_due (CO-4429); education_savings_account: education_savings_accounts_value (CO-4174); able_account: able_account_value (CO-4415); business_cash_and_assets: business_cash_and_convertible_assets_value (CO-4416); home: home_equity (CO-826) with owns_and_lives_in_home, lives_in_owned_home and the home facts (CO-3401, CO-4610, CO-4435, CO-4612-CO-4615); real_property: real_property_other_than_home_equity (CO-3393) and its parts (CO-4335, CO-4336, CO-4346, CO-4606, CO-4431), the joint owners' shares (CO-4343), income-producing property (CO-4607-CO-4609, CO-4423, CO-4424) and home-use production property (CO-4425); installment_contract: installment_sale_contract_value (CO-4337, part of CO-3393); vehicle: vehicles_equity_value and transportation_vehicle_equity_value (CO-3394, CO-3395); personal_property: no fact (not stated today); investment_personal_property: investment_personal_property_value (CO-4642); life_insurance: CO-3396, CO-3397, CO-3850, CO-3851; burial_fund: irrevocable_burial_funds_value (CO-4603) and revocable_burial_trust_value (CO-3855) with burial_funds_accrued_interest (CO-4604); prepaid_burial_contract: revocable_prepaid_burial_contract_value (CO-3856); burial_space: burial_spaces_value_beyond_family_needs (CO-3857); trust_interest: has_trust_interest (CO-1577), trust_corpus_payable_to_person_value (CO-4432) and ma_trust_annuity_life_estate_value_available (CO-4643); annuity: owns_annuity (CO-1579) and CO-4643; life_estate: CO-4643; loan_receivable: within real_property_other_than_home_equity (CO-3393: \"mortgages and promissory notes the person holds included\"); held_income_tax_refund: federal_tax_refunds_held_value and state_tax_refunds_held_value (CO-4172, CO-4413); held_eitc: snap_eitc_held_while_participating_value (CO-4173); held_retroactive_ssa_benefit: retroactive_ssa_benefits_held_value (CO-4414) and retroactive_benefit_payment_unspent_value with its date (CO-4639, CO-4640); held_excluded_payment: excluded_government_payments_held_value (CO-4932); held_loan_proceeds: no holding fact (Adult Financial reads the loan receipt of the month, receipts CO-5000 kind loan); held_replacement_proceeds: CO-4417-CO-4419; held_prorated_income: prorated_income_held_value (CO-4319); other_resource: no fact), so the table changes no answer when the program's H1 track moves its readers onto it, except where a row's reading is a finding the track fixes as a cited difference. Rows marked for the owner's signature (counted_no_rule_excludes, not_counted_no_rule_found, and the findings not_counted_text_counts and counted_text_excludes, where today's reading differs from the text on file) are listed in docs/reviews/holdings-h0.md. The Medicaid H1 track (docs/reviews/records-holdings-medicaid.md) set the five rows H0 marked counted_text_excludes by the text (finding H0-F1, OQ-1204 part 1): held_income_tax_refund, held_eitc, held_excluded_payment, held_loan_proceeds, held_replacement_proceeds. A property of a holding (its share and co-owners, accessible, listed for sale, income producing, used for transportation, a held_ record's source_date, irrevocable, disposed_date) is a field the program's items read beside the row, not a row; a record with a disposed_date is read by the program's transfer rules, not counted as held. Every kind has a row, and the type check refuses a lookup in a table that lacks one, so no kind is counted or left out by default; a new kind is added to every holdings table at once by the integration owner (design 4.3, rule 2), and a track changes only its own table's cells. No rule read this table in step H0; from the Medicaid H1 track (docs/reviews/records-holdings-medicaid.md) the SSI method's readers read it: ma_ssi_holdings_countable_in_month (CO-5320, the figure ssi_countable_resources_individual, CO-800, states at the determination month), ma_ssi_excluded_automobile_equity_in_month (CO-5321), ma_excluded_real_property_value (CO-4620), ma_countable_income_producing_property_value (CO-4621), ma_home_equity_interest_in_month (CO-5327), the home rules (CO-4622, CO-5204) and ma_ssi_countable_resources_in_month (CO-5322)."
