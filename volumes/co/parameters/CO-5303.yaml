rationale: "Resource records, step H0 (product-owner decision of 2026-11-23, design decisions D3, D5 and D6): the SSI method's one holdings counting table, Medicaid's, adopted by the programs that name the SSI method by their cited links as phase 2 did for SSI income, so a kind of holding is never counted or excluded by silence; it replaces, from step H1, ssi_countable_resources_individual (CO-800, shared) and the adjustments ma_ssi_countable_resources_individual (CO-4623) and its readers make one fact at a time."
