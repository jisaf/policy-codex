meaning: "The gap, in years, between the end of a person's last period of Medical Assistance eligibility and a later application beyond which citizenship and identity documentation must be provided again when the site has not retained it - 10 CCR 2505-10 § 8.100.3.H.4.h.ii (\"a gap of more than five years\")."
