id: CO-4323
name: "SNAP income conversion rate by frequency"
identifier: snap_income_conversion_rate_table
kind: parameter
type: table keyed by option
scope: global
program: SNAP
meaning: "The multiplier 10 CCR 2506-1 4.402.A.2 applies to the average amount of income received at each frequency to convert it to a monthly amount, keyed by the options of wages_pay_frequency (CO-3921: weekly, biweekly, semimonthly) and periodic_unearned_income_frequency (CO-4330: every_other_month, quarterly, twice_a_year, annual)."
precision: "Monthly income needs no conversion and has no row; the readers use the month's amount for it."
versions:
  - {from: "2000-01-01", value: {weekly: 4.3, biweekly: 2.15, semimonthly: 2, every_other_month: 0.5, quarterly: 0.333333, twice_a_year: 0.166666, annual: 0.083}, source: S3112}
sources: [S3112, S2050]
tags: [snap, income]
rationale: "Coverage review snap-financial CF-3: SNAP read the month's receipts and did not convert pay received weekly, every two weeks or less often than monthly (4.402.A.2, S3112; 7 CFR 273.10(c)(2)(i), S2050)."
