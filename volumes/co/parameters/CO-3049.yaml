id: CO-3049
name: "Adult Financial unearned income disregard"
identifier: af_general_income_disregard
kind: parameter
type: money
scope: global
program: AdultFinancial
meaning: "The amount deducted from a client's gross unearned income other than SSI to determine Adult Financial countable unearned income: \"Deduct $20.00 from the remainder\" (9 CCR 2503-5 3.533.A.2.c), the amount whose unused part 3.549.D and 3.544.E.2 apply to a deemed relative's income."
value: 20
sources: [S457, S1633, S1634]
tags: [cash, income]
rationale: "Hard-coded numbers audit D-4: Adult Financial items read the SSI-method parameter, so a change of the SSI figure would have changed Adult Financial without an amendment of 9 CCR 2503-5. The rule states its own figure, as OQ-391 found for the AND-CS grant standard, so the program reads its own parameter (option (a) of the audit)."
