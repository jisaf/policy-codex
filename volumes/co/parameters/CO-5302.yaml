id: CO-5302
name: "Adult Financial: how each kind of holding is treated"
identifier: af_holding_treatment_table
kind: parameter
type: table keyed by option
options: [counted, counted_no_rule_excludes, counted_less_taxes, counted_less_self_support_and_unsaleable, counted_less_highest_transportation_vehicle, counted_life_insurance_rules, counted_above_burial_exemption, counted_beyond_family_needs, counted_corpus_available, excluded, excluded_home_rules, excluded_household_goods, excluded_within_twelve_months, excluded_within_nine_months, excluded_in_month_received, excluded_three_or_six_months, not_counted_no_rule_found, not_counted_text_counts]
scope: global
program: AdultFinancial
meaning: "Adult Financial's counting table for holdings (9 CCR 2503-5 3.520.72-3.520.77), one row per kind of holdings record (holdings, CO-5300), read for the client, the client's spouse (af_client_and_spouse_countable_resources, CO-2389) and each sponsor (CO-2390) alike (3.520.72.A, E, S1636). Counted, a paragraph naming it: cash, bank_account, securities (3.520.72.B.5, S2213: \"Cash and convertible assets including but not limited to: cash on hand, a savings or checking account, ... stocks, bonds, mutual fund shares\"), installment_contract and loan_receivable (3.520.72.B.6, S2213: \"Mortgages, promissory notes, and similar properties that can be converted to cash\"). Counted less taxes: retirement_account (3.520.73.B.1, S3208: the gross value less the taxes due, or less 20% when the client cannot give them; taxes_on_withdrawal). Counted less self-support and unsaleable: real_property (3.520.72.B.1, S2213: the equity of real property not the home and not exempt as income-producing; non-business income-producing property and property producing goods for the household have $6,000 of equity exempt each, income-producing property only with a 6% net return (3.520.77.D.3-4, S3207; income_producing, used_in_trade_or_business, net_annual_return, produces_for_household_use); property used in the client's trade or business is self-support property (3.520.77.D.1, S3206) and is not counted today; property the county exempts as unsaleable, for a co-owner's hardship or for a legal impediment is not counted (3.520.741.D, S3209; af_found_unsaleable)). Counted less highest transportation vehicle: vehicle (3.520.77.A, S2214: \"The vehicle with the highest value is exempt if it is used for the transportation of the client or a member of the household\"; the rest counted, 3.520.72.B.4, S2213). Counted under the life insurance rules: life_insurance (3.520.72.B.7 (S2213), 3.520.75.D-F (S2214, S2618): the cash surrender value of the client's and spouse's policies, exempt when their total face value is $1,500 or less, and for OAP under the forty-eight-month and $250,000 rules; counted apart from the other holdings, af_life_insurance_countable_value). Counted above burial exemption: burial_fund, prepaid_burial_contract (3.520.72.B.8, 3.520.77.G.3, H (S2619): a revocable burial trust or prepaid burial contract exempt up to $1,500 each, with its interest; the rest counted; an irrevocable contract exempt (H.1), and an irrevocable trust of which the client is both trustor and beneficiary counted above $1,500 (G.2.d)). Counted beyond family needs: burial_space (3.520.72.B.9, 3.520.77.I, S2619; for_immediate_family). Counted corpus available: trust_interest (3.520.72.B.13, S3210: trusts counted as resources according to the SSA guidelines; corpus_available_value). Excluded, a paragraph naming it: able_account (3.520.77.M, S3206), business_cash_and_assets (3.520.77.D.1.b, S3206: \"The cash and convertible assets considered necessary for use in the trade or business shall be excluded\"). Excluded under the home rules: home (3.520.77.C, S3218: exempt as the principal place of residence, and while the client in long-term care intends to return; lives_in, intends_to_return; the equity counts once the home is no longer excluded, C.5). Excluded household goods: personal_property (3.520.77.B, S4507: household goods and personal effects the client uses; other personal property no fact states today (equipment, livestock) is not counted, though 3.520.72.B.3-4 (S2213) counts personal property not exempt: the owner signs the rest). Excluded within twelve months: held_income_tax_refund (3.520.77.K, S3206: federal and State income tax refunds and the PTC rebate). Excluded within nine months: held_retroactive_ssa_benefit (3.520.77.J, S3206). Excluded in the month received: held_loan_proceeds (3.520.77.L, S3206; today read from the loan receipt of the determination month). Excluded for three or six months: held_replacement_proceeds (3.520.77.E-F, S3206: personal property three months, real property six, after the month received, or longer with the county's extension; replacement_property, source_date). Counted because no rule excludes it (counted_no_rule_excludes: \"Unless otherwise specified, a resource is countable\", 3.520.72.A, S1636; the Cash programs owner signs each row): education_savings_account, held_eitc (a state or local credit paid apart from a refund; 3.520.77.K names refunds and the PTC rebate), held_excluded_payment, held_prorated_income, other_resource. Not counted, no rule found either way (not_counted_no_rule_found: no Adult Financial item reads the fact the kind restates and no text on file names it; the owner signs each row): annuity, life_estate. Not counted though the text on file counts it (not_counted_text_counts, a finding for the Adult Financial H1 track): investment_personal_property (3.520.77.B, S4507: \"effects that the client holds because of the value or as an investment ... are countable as personal property\"; no Adult Financial item reads investment_personal_property_value, CO-4642)."
precision: "Resource records, step H0 (docs/reviews/holdings-h0.md; docs/design-earned-and-resource-records.md 3.3): every row is today's reading, what the program's items do now with the scalar resource fact the kind restates (cash, bank_account and securities: liquid_resources_value (CO-3390), less the parts below stated apart (the translator writes the remainder as one bank_account record: the old fact does not tell cash, accounts and securities apart); retirement_account: retirement_accounts_value (CO-3392) with retirement_accounts_taxes_due (CO-4429); education_savings_account: education_savings_accounts_value (CO-4174); able_account: able_account_value (CO-4415); business_cash_and_assets: business_cash_and_convertible_assets_value (CO-4416); home: home_equity (CO-826) with owns_and_lives_in_home, lives_in_owned_home and the home facts (CO-3401, CO-4610, CO-4435, CO-4612-CO-4615); real_property: real_property_other_than_home_equity (CO-3393) and its parts (CO-4335, CO-4336, CO-4346, CO-4606, CO-4431), the joint owners' shares (CO-4343), income-producing property (CO-4607-CO-4609, CO-4423, CO-4424) and home-use production property (CO-4425); installment_contract: installment_sale_contract_value (CO-4337, part of CO-3393); vehicle: vehicles_equity_value and transportation_vehicle_equity_value (CO-3394, CO-3395); personal_property: no fact (not stated today); investment_personal_property: investment_personal_property_value (CO-4642); life_insurance: CO-3396, CO-3397, CO-3850, CO-3851; burial_fund: irrevocable_burial_funds_value (CO-4603) and revocable_burial_trust_value (CO-3855) with burial_funds_accrued_interest (CO-4604); prepaid_burial_contract: revocable_prepaid_burial_contract_value (CO-3856); burial_space: burial_spaces_value_beyond_family_needs (CO-3857); trust_interest: has_trust_interest (CO-1577), trust_corpus_payable_to_person_value (CO-4432) and ma_trust_annuity_life_estate_value_available (CO-4643); annuity: owns_annuity (CO-1579) and CO-4643; life_estate: CO-4643; loan_receivable: within real_property_other_than_home_equity (CO-3393: \"mortgages and promissory notes the person holds included\"); held_income_tax_refund: federal_tax_refunds_held_value and state_tax_refunds_held_value (CO-4172, CO-4413); held_eitc: snap_eitc_held_while_participating_value (CO-4173); held_retroactive_ssa_benefit: retroactive_ssa_benefits_held_value (CO-4414) and retroactive_benefit_payment_unspent_value with its date (CO-4639, CO-4640); held_excluded_payment: excluded_government_payments_held_value (CO-4932); held_loan_proceeds: no holding fact (Adult Financial reads the loan receipt of the month, receipts CO-5000 kind loan); held_replacement_proceeds: CO-4417-CO-4419; held_prorated_income: prorated_income_held_value (CO-4319); other_resource: no fact), so the table changes no answer when the program's H1 track moves its readers onto it, except where a row's reading is a finding the track fixes as a cited difference. Rows marked for the owner's signature (counted_no_rule_excludes, not_counted_no_rule_found, and the findings not_counted_text_counts and counted_text_excludes, where today's reading differs from the text on file) are listed in docs/reviews/holdings-h0.md. A property of a holding (its share and co-owners, accessible, listed for sale, income producing, used for transportation, a held_ record's source_date, irrevocable, disposed_date) is a field the program's items read beside the row, not a row; a record with a disposed_date is read by the program's transfer rules, not counted as held. Every kind has a row, and the type check refuses a lookup in a table that lacks one, so no kind is counted or left out by default; a new kind is added to every holdings table at once by the integration owner (design 4.3, rule 2), and a track changes only its own table's cells. No rule reads this table in step H0."
