rationale: "Resource records, step H0 (product-owner decision of 2026-11-23, design decisions D3 and D5): Adult Financial's one holdings counting table, kind by kind, read alike for the client, the spouse and each sponsor, so a kind of holding is never counted or exempted by silence; it replaces, from step H1, the parts of liquid_resources_value that af_exempt_liquid_resources (CO-4412) subtracts and the holdings af_person_countable_resources_other_than_life_insurance (CO-4000) adds one by one. Burial assistance (3.570.43.D.3.b) and the Colorado Works death reimbursement keep the SSI method by their cited links (D6)."
