id: CO-2401
name: "Medicaid: start date of the federal payment limit for non-citizens"
identifier: ma_alien_payment_restriction_start_date
kind: parameter
type: calendar date
scope: global
program: Medicaid
meaning: "The first day on which 42 U.S.C. 1396b(v)(5), added by Pub. L. 119-21 sec. 71109(a), limits federal payment for full Medical Assistance to citizens and nationals, lawful permanent residents, Cuban and Haitian entrants and Compact of Free Association migrants: October 1, 2026 (\"beginning on October 1, 2026\"). The same limit reaches CHIP through 42 U.S.C. 1397gg(e)(1)(R)."
value: "2026-10-01"
sources: [S1700, S1701, S1704]
tags: [ma, immigration]
open: [OQ-510]
rationale: "B-1 of the HCPF review: no item read 1396b(v)(5). ma_meets_citizenship_requirement (CO-509) needs the date to apply the limit from the day the statute names and not before; a literal date in the derivation would hide it (governance name.digits and the S-10 finding on hard-coded dates)."
