open: [OQ-1024, OQ-1020]
rationale: "Earned-income records, step E0 (product-owner decision of 2026-11-23, design decisions D1 and D4): Adult Financial's one earnings counting table, kind by kind, so a kind of pay or of business cost is never counted or deducted by silence; it replaces, from step E1, the parts of wages_gross and the cost facts that Adult Financial's items subtract or add one by one."
