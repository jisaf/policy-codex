id: CO-5103
name: "Adult Financial: how each kind of earnings is treated"
identifier: af_earnings_treatment_table
kind: parameter
type: table keyed by option
options: [counted, counted_no_rule_excludes, counted_at_value, counted_net_of_costs, counted_averaged_over_year, counted_less_provision_costs, excluded, excluded_except_combat_zone, not_counted_no_rule_found, deducted, deducted_from_boarder_payments, not_deducted, not_deducted_no_rule_found, counted_unless_foster_care]
scope: global
program: AdultFinancial
meaning: "Adult Financial's counting table for earnings (9 CCR 2503-5 3.520.782-786, the same for the client, the client's spouse and the sponsor(s)), one row per kind of earnings record (earnings, CO-5100). Counted, a paragraph naming it: wages (3.520.782.A (S3211): gross monetary wages received for services performed as an employee); employer_vendor_payment (3.510 \"Earned Income\" (S4790): \"payment in cash or in-kind received ... for services performed as an employee\"; 3.520.782.B (S3211): in-kind earned income is \"non-monetary benefits received for services performed as an employee ... such as shelter as payment for building maintenance\", at \"the value of the item supplied\": an employer's payment of the person's rent or bills as part of the person's pay is that benefit, at the amount paid; coverage pass 4 CA4-6, before not counted for want of a rule). Counted net of costs: self_employment_receipts (3.520.783.B, D (S1156): the net profit, the gross income less the cost of doing business, is earned income; af_self_employment_net_profit, CO-1708). Counted because no rule excludes it (3.520.782.A counts gross monetary wages and profit from self-employment, and no paragraph of 3.520.786 exempts it; the Adult Financial owner signs each of these rows): wioa_on_the_job_training, summer_youth_employment, scsep_employment, subsidized_employment, decennial_census_employment, employer_health_insurance_subsidy. Counted unless foster care (counted_unless_foster_care): difficulty_of_care_payment, counted as pay by silence when it is paid for live-in care of a person on a Home and Community Based Services waiver, and exempt when it is a foster care payment for a person placed in the home (foster_care): 3.520.786.M (S2608), \"Payments received for providing foster care\", and through K, 20 CFR 416.1124(c)(8) (S2609), \"Payments for providing foster care to an ineligible child who was placed in your home\" (coverage pass 4 CA4-7; as a foster boarder's payments, af_boarder_income CO-5131, and a foster_care_payment receipt are exempt). Counted at value: in_kind_pay (3.520.782.B (S3211): the value of the item supplied, or its current market value). Counted averaged over year: farm_self_employment_receipts (3.520.783 (S3505): farm income on a yearly basis, the twelve months' net profit averaged (af_self_employment_net_profit, CO-1708); none after the person ceased to farm). Excluded: work_study (3.520.786.H (S2206): \"Work study income\"). Excluded except combat-zone pay: uniformed_services_special_pay (3.520.786.K (S2608) exempts the unearned income 20 CFR 416.1124 excludes, and 416.1124(c)(19) (S2803) is \"Special pay received from one of the uniformed services pursuant to 37 U.S.C. 310\"; a record stated as pay received because the member is deployed to a combat zone (combat_zone) may hold pay other than 37 U.S.C. 310 pay, which 3.520.782.A counts as gross monetary wages, so it is counted as wages, the reading before earnings records (OQ-1140, narrowing OQ-1024 for Adult Financial)). Counted less provision costs: boarder_payments (3.520.783.C.2.b-d (S4380): board, room, and room and board payments to the client, the client's spouse or sponsor(s) are earned income in the month received, less, for each boarder, the documentable expenses directly related to providing the board, the room, or the room and board (af_boarder_income, CO-5131); a boarder's payment that is a foster care payment is exempt, 3.520.786.M (S2608)). Costs deducted: business_cost_operating (3.520.783.B.1 (S1156)), business_cost_interest (3.520.783.B.1 (S1156): \"interest\"). Costs not deducted, a paragraph saying so: business_cost_capital_principal (3.520.783.B.3 (S4104)), business_cost_depreciation (3.520.783.B.2 (S1156)). Deducted from boarder payments: business_cost_boarder_provision (3.520.783.C.2.b-d (S4380), the boarder rule above, by what the boarders pay for (provides)). Costs not deducted, no rule found either way (not_deducted_no_rule_found: no text on file names the cost; 3.520.783.B.1's list \"include[s], but [is] not limited to\" the costs it names; the Adult Financial owner signs each row, OQ-1294): business_cost_home_space, business_cost_vehicle."
precision: "Earned-income records, step E0 (docs/reviews/earnings-e0.md; docs/design-earned-and-resource-records.md 2.4): every row is today's reading, what the program's items do now with the scalar fact the kind restates (wages: wages_gross, less its parts below; uniformed_services_special_pay: the uniformed_services_special_pay receipt, and combat_zone_pay_received (part of wages_gross); work_study: work_study_earnings; wioa_on_the_job_training: wioa_on_the_job_training_wages; summer_youth_employment: summer_youth_employment_wages; scsep_employment: scsep_wages and scsep_payments_received; subsidized_employment: subsidized_employment_wages; decennial_census_employment: decennial_census_wages_received; difficulty_of_care_payment: difficulty_of_care_payments_received; in_kind_pay: in_kind_compensation_value; employer_vendor_payment: employer_vendor_payments_received; employer_health_insurance_subsidy: employer_health_insurance_subsidy_received; self_employment_receipts: self_employment_gross_receipts; farm_self_employment_receipts: self_employment_gross_receipts of a farm (self_employment_is_farming, self_employment_is_farm_operation); boarder_payments: room_and_board_payments_received, and the board_only_payment and room_only_payment receipts; business_cost_operating: self_employment_operating_costs; business_cost_interest: self_employment_interest_costs; business_cost_capital_principal: self_employment_capital_principal_payments; business_cost_depreciation: no fact (a new kind); business_cost_home_space: self_employment_home_business_space_costs; business_cost_vehicle: self_employment_business_vehicle_costs; business_cost_boarder_provision: room_and_board_provision_costs), so the table changed no answer when the Adult Financial E1 track moved its readers onto it, except the rows that track changed as cited differences. Earned-income records, step E1 Adult Financial (docs/reviews/records-earnings-cash.md): Adult Financial's earned income reads this table (af_earned_pay CO-5130, af_self_employment_net_profit CO-1708, af_boarder_income CO-5131, af_excluded_earned_income CO-2342), for the client, the spouse and the sponsor(s) alike (deeming reads af_gross_earned_income, CO-3830). Rows changed in E1: boarder_payments (not_counted_no_rule_found to counted_less_provision_costs) and business_cost_boarder_provision (not_deducted_no_rule_found to deducted_from_boarder_payments), both by 3.520.783.C.2.b-d (S4380), which E0 missed (\"no Adult Financial text names boarder payments\"); self_employment_receipts (counted to counted_net_of_costs, the same reading named so a reader can tell a business's receipts from pay); uniformed_services_special_pay (excluded to excluded_except_combat_zone, OQ-1140). A record's PASS set-aside (pass_set_aside) is exempt by 3.520.786.I (S2608) and its infrequent or irregular pay (irregular) by O; both are fields read beside the row (af_excluded_earned_income). Every kind has a row, and the type check refuses a lookup in a table that lacks one, so no kind is counted or left out by default; a new kind is added to every earnings table at once by the integration owner (design 4.3, rule 2), and a track changes only its own table's cells. A property of a pay (irregular, temporary_job, the job's dates, combat_zone, annual_contract_pay, pass_set_aside) is a field the program's items read beside the row, not a row. Rows marked for the owner's signature are listed in docs/reviews/earnings-e0.md."
