id: CO-5103
name: "Adult Financial: how each kind of earnings is treated"
identifier: af_earnings_treatment_table
kind: parameter
type: table keyed by option
options: [counted, counted_no_rule_excludes, counted_at_value, counted_averaged_over_year, excluded, not_counted_no_rule_found, deducted, not_deducted, not_deducted_no_rule_found]
scope: global
program: AdultFinancial
meaning: "Adult Financial's counting table for earnings (9 CCR 2503-5 3.520.782-786, the same for the client, the client's spouse and the sponsor(s)), one row per kind of earnings record (earnings, CO-5100). Counted, a paragraph naming it: wages (3.520.782.A (S3211): gross monetary wages received for services performed as an employee), self_employment_receipts (3.520.783.B (S1156): net profit, the gross income less the cost of doing business). Counted because no rule excludes it (3.520.782.A counts gross monetary wages and profit from self-employment, and no paragraph of 3.520.786 exempts it; the Adult Financial owner signs each of these rows): wioa_on_the_job_training, summer_youth_employment, scsep_employment, subsidized_employment, decennial_census_employment, difficulty_of_care_payment, employer_health_insurance_subsidy. Counted at value: in_kind_pay (3.520.782.B (S3211): the value of the item supplied, or its current market value). Counted averaged over year: farm_self_employment_receipts (3.520.783 (S3505): farm income on a yearly basis, the twelve months' net profit averaged (af_self_employment_net_profit, CO-1708); none after the person ceased to farm). Excluded: uniformed_services_special_pay (3.520.786 (S1622), which exempts the SSI exclusions, 20 CFR 416.1124(c)(19), as Adult Financial's receipt row reads it (af_receipt_treatment_table, CO-5016); combat-zone pay stated today as part of wages_gross is counted (OQ-1024)), work_study (3.520.786 (S2206): work-study (af_excluded_earned_income, CO-2342)). Not counted, no rule found either way (not_counted_no_rule_found: today's items do not read the fact the kind restates and no text on file names it; the Adult Financial owner signs each row): employer_vendor_payment (today's items do not read employer_vendor_payments_received; no Adult Financial text names an employer's vendor payment (3.520.785.B counts \"any other payments that could be construed to be a gain or benefit\" as unearned income; the owner signs)), boarder_payments (today's items do not read room_and_board_payments_received; no Adult Financial text names boarder payments (the owner signs)). Costs deducted: business_cost_operating (3.520.783.B.1 (S1156)), business_cost_interest (3.520.783.B.1 (S1156): \"interest\"). Costs not deducted, a paragraph saying so: business_cost_capital_principal (3.520.783.B.3 (S4104)), business_cost_depreciation (3.520.783.B.2 (S1156)). Costs not deducted, no rule found either way (not_deducted_no_rule_found: today's items do not deduct the cost and no text on file names it; the Adult Financial owner signs each row): business_cost_home_space, business_cost_vehicle, business_cost_boarder_provision."
precision: "Earned-income records, step E0 (docs/reviews/earnings-e0.md; docs/design-earned-and-resource-records.md 2.4): every row is today's reading, what the program's items do now with the scalar fact the kind restates (wages: wages_gross, less its parts below; uniformed_services_special_pay: the uniformed_services_special_pay receipt, and combat_zone_pay_received (part of wages_gross); work_study: work_study_earnings; wioa_on_the_job_training: wioa_on_the_job_training_wages; summer_youth_employment: summer_youth_employment_wages; scsep_employment: scsep_wages and scsep_payments_received; subsidized_employment: subsidized_employment_wages; decennial_census_employment: decennial_census_wages_received; difficulty_of_care_payment: difficulty_of_care_payments_received; in_kind_pay: in_kind_compensation_value; employer_vendor_payment: employer_vendor_payments_received; employer_health_insurance_subsidy: employer_health_insurance_subsidy_received; self_employment_receipts: self_employment_gross_receipts; farm_self_employment_receipts: self_employment_gross_receipts of a farm (self_employment_is_farming, self_employment_is_farm_operation); boarder_payments: room_and_board_payments_received, and the board_only_payment and room_only_payment receipts; business_cost_operating: self_employment_operating_costs; business_cost_interest: self_employment_interest_costs; business_cost_capital_principal: self_employment_capital_principal_payments; business_cost_depreciation: no fact (a new kind); business_cost_home_space: self_employment_home_business_space_costs; business_cost_vehicle: self_employment_business_vehicle_costs; business_cost_boarder_provision: room_and_board_provision_costs), so the table changes no answer when the Adult Financial E1 track moves its readers onto it; no rule reads it during E0. Every kind has a row, and the type check refuses a lookup in a table that lacks one, so no kind is counted or left out by default; a new kind is added to every earnings table at once by the integration owner (design 4.3, rule 2), and a track changes only its own table's cells. A property of a pay (irregular, temporary_job, the job's dates, combat_zone, annual_contract_pay, pass_set_aside) is a field the program's items read beside the row, not a row. Rows marked for the owner's signature are listed in docs/reviews/earnings-e0.md."
versions:
  - {from: "2000-01-01", value: {wages: counted, uniformed_services_special_pay: excluded, work_study: excluded, wioa_on_the_job_training: counted_no_rule_excludes, summer_youth_employment: counted_no_rule_excludes, scsep_employment: counted_no_rule_excludes, subsidized_employment: counted_no_rule_excludes, decennial_census_employment: counted_no_rule_excludes, difficulty_of_care_payment: counted_no_rule_excludes, in_kind_pay: counted_at_value, employer_vendor_payment: not_counted_no_rule_found, employer_health_insurance_subsidy: counted_no_rule_excludes, self_employment_receipts: counted, farm_self_employment_receipts: counted_averaged_over_year, boarder_payments: not_counted_no_rule_found, business_cost_operating: deducted, business_cost_interest: deducted, business_cost_capital_principal: not_deducted, business_cost_depreciation: not_deducted, business_cost_home_space: not_deducted_no_rule_found, business_cost_vehicle: not_deducted_no_rule_found, business_cost_boarder_provision: not_deducted_no_rule_found}, source: S3211}
