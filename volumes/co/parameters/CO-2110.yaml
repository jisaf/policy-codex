sources: [S1411]
tags: [household]
rationale: "Review K-5: 3.111.G.3.a and g (S1411) bound job search child care; cccap_caretaker_in_eligible_activity (CO-984) reads it. A county's longer approved period is not modeled (OQ-162)."
