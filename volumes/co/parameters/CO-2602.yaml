rationale: "Engineering follow-up 4 (money and rounding): af_oap_grant (CO-951) and af_and_grant (CO-952) prorated a first-month grant by the days remaining over the days in the month, which 3.532.B.2 does not state; 3.581.D (S1825) states the method, a table of decimal figures by days of eligibility. No existing parameter states the table."
