program: AdultFinancial
meaning: "The decimal figure the monthly Adult Financial grant payment is multiplied by for a partial month, by the number of days for which the client is eligible in the month (1 to 30), per 9 CCR 2503-5 3.581.D.2-4."
precision: "The figures are the rule's table as printed; they are close to, but not exactly, the days times 12/365 (10 days is .32876, 28 days .92054). A client eligible from the first of the month receives the full monthly payment (3.532.B.1, 3.543.B.1, 3.548.B.1), so no row for 31 days is needed."
