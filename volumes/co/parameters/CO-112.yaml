rationale: "10 CCR 2506-1 4.401,A,3,a-b (S50) and 7 CFR 273.9(a)(2) require every SE household to meet a 100% net income standard; D-21's table 1 (S52) is the FY2026 FNS table for the 48 states and D.C. Phase 8 adds the FY2027 version (D-84 Table 1, S734; 10 CCR 2506-1 4.401.2, S740)."
