id: CO-3608
name: "Home Maintenance Allowance: maximum months"
identifier: ma_home_maintenance_allowance_max_months
kind: parameter
type: whole number
scope: global
program: Medicaid
meaning: "The longest temporary period, in months, for which a Home Maintenance Allowance may be reserved from a Long-Term Care institution resident's income (10 CCR 2505-10 § 8.100.7.V.3.g.ii, \"not to exceed 6 months\")."
value: 6
sources: [S2404]
tags: [ma, ltc, income]
rationale: "Final verification F-3 (docs/reviews/final-medicaid-chp.md): ma_patient_payment (CO-658) deducted only the personal needs allowance, the community spouse and family allowances and every health insurance premium, in every month; 10 CCR 2505-10 § 8.100.7.V.3.b-i (S2400-S2405) lists further deductions and adds Long-Term Care insurance payments, and limits the Part B premium to the first two months. The six-month limit as a parameter, not a literal."
