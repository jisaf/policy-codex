id: CO-5106
name: "Medicaid MAGI: how each kind of earnings is treated"
identifier: ma_magi_earnings_treatment_table
kind: parameter
type: table keyed by option
options: [counted, counted_no_rule_excludes, counted_net_for_tax, excluded_live_in_provider, excluded_in_combat_zone, not_taxable_income, not_counted_no_rule_found, not_read_net_for_tax, not_deducted_open_question]
scope: global
program: Medicaid
meaning: "Medicaid MAGI's counting table for earnings (42 CFR 435.603(e) and 10 CCR 2505-10 8.100.4.C, read by CHP+ through Medicaid's MAGI household income (10 CCR 2505-3 150.1, S245)), one row per kind of earnings record (earnings, CO-5100). Counted, a paragraph naming it: wages (8.100.4.C.1.a.i (S166): \"Wages, salaries, tips\"), boarder_payments (8.100.4.C.1.b.ii (S166): \"Rents\", for a room, and a.v, \"Compensation for services\", for meals; at the payments' gross amount, as the MAGI receipt table counts rents (rental_income, CO-5500); before E1 the payments for a room only or meals only were counted in full as receipts and room and board payments not at all; OQ-1121 asks whether the costs of providing them are deducted). Counted because no rule excludes it (8.100.4.C.1.a counts wages, salaries and tips and the gross income derived from business (S166), and no paragraph excludes it; the Medicaid owner signs each of these rows): work_study, wioa_on_the_job_training, summer_youth_employment, scsep_employment, subsidized_employment, decennial_census_employment, employer_health_insurance_subsidy. Counted net for tax: self_employment_receipts (8.100.4.C.1.a.ii (S166) and 42 CFR 435.603(e) (S165): the business's net earnings as the tax return reports them (net_for_tax; self_employment_net_earnings_for_tax today), not its gross receipts), farm_self_employment_receipts (as self_employment_receipts (S166, S165)). Excluded live in provider: difficulty_of_care_payment (8.100.3.K.7 (S3754): excluded for a live-in provider whose care recipient receives HCBS waiver services, within the foster-individual limits (ma_excluded_difficulty_of_care_payments, CO-5214); counted otherwise). Excluded in a combat zone (excluded_in_combat_zone: counted as compensation for services (8.100.4.C.1.a.v (S166)) unless the record states combat_zone, pay for service in a combat zone, which is not gross income (26 U.S.C. 112(a), (b) (S4340); for an officer the excluded maximum enlisted amount includes the officer's own 37 U.S.C. 310 special pay, (c)(5)(B)), so not MAGI income (42 CFR 435.603(e) (S165))): uniformed_services_special_pay (OQ-1024, settled for MAGI). Not counted, no rule found either way (not_counted_no_rule_found: today's items do not read the fact the kind restates and no text on file names it; the Medicaid owner signs each row): in_kind_pay (today's items do not read in_kind_compensation_value (the owner signs; 8.100.3.K.3-4, S4107, call in-kind pay earned income)), employer_vendor_payment (today's items do not read employer_vendor_payments_received (the owner signs)). Costs not read (not_read_net_for_tax): business_cost_operating (the net earnings for tax already reflect the costs (S165)), business_cost_interest (as above), business_cost_capital_principal (as above), business_cost_depreciation (as above (8.100.3.K.9.b.i.1, S4107, allows depreciation for MAGI)), business_cost_home_space (as above), business_cost_vehicle (as above). Not deducted, an open question (not_deducted_open_question): business_cost_boarder_provision (the boarder payments are counted at their gross amount, as rents are; whether the documented costs of providing the room or meals come off them, as a tax return would deduct them, is OQ-1121)."
precision: "Earned-income records, step E0 (docs/reviews/earnings-e0.md; docs/design-earned-and-resource-records.md 2.4): every row is today's reading, what the program's items do now with the scalar fact the kind restates (wages: wages_gross, less its parts below; uniformed_services_special_pay: the uniformed_services_special_pay receipt, and combat_zone_pay_received (part of wages_gross); work_study: work_study_earnings; wioa_on_the_job_training: wioa_on_the_job_training_wages; summer_youth_employment: summer_youth_employment_wages; scsep_employment: scsep_wages and scsep_payments_received; subsidized_employment: subsidized_employment_wages; decennial_census_employment: decennial_census_wages_received; difficulty_of_care_payment: difficulty_of_care_payments_received; in_kind_pay: in_kind_compensation_value; employer_vendor_payment: employer_vendor_payments_received; employer_health_insurance_subsidy: employer_health_insurance_subsidy_received; self_employment_receipts: self_employment_gross_receipts; farm_self_employment_receipts: self_employment_gross_receipts of a farm (self_employment_is_farming, self_employment_is_farm_operation); boarder_payments: room_and_board_payments_received, and the board_only_payment and room_only_payment receipts; business_cost_operating: self_employment_operating_costs; business_cost_interest: self_employment_interest_costs; business_cost_capital_principal: self_employment_capital_principal_payments; business_cost_depreciation: no fact (a new kind); business_cost_home_space: self_employment_home_business_space_costs; business_cost_vehicle: self_employment_business_vehicle_costs; business_cost_boarder_provision: room_and_board_provision_costs), so the table changes no answer when the Medicaid E1 track moves its readers onto it; no rule reads it during E0. Every kind has a row, and the type check refuses a lookup in a table that lacks one, so no kind is counted or left out by default; a new kind is added to every earnings table at once by the integration owner (design 4.3, rule 2), and a track changes only its own table's cells. A property of a pay (irregular, temporary_job, the job's dates, combat_zone, annual_contract_pay, pass_set_aside) is a field the program's items read beside the row, not a row. Rows marked for the owner's signature are listed in docs/reviews/earnings-e0.md."
