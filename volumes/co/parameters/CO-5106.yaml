id: CO-5106
name: "Medicaid MAGI: how each kind of earnings is treated"
identifier: ma_magi_earnings_treatment_table
kind: parameter
type: table keyed by option
options: [counted, counted_no_rule_excludes, counted_unless_employer_convenience, counted_net_for_tax, counted_net_of_provision_costs, excluded_live_in_provider, excluded_in_combat_zone, not_taxable_income, not_read_net_for_tax, deducted_from_boarder_payments]
scope: global
program: Medicaid
meaning: "Medicaid MAGI's counting table for earnings (42 CFR 435.603(e) and 10 CCR 2505-10 8.100.4.C, read by CHP+ through Medicaid's MAGI household income (10 CCR 2505-3 150.1, S245)), one row per kind of earnings record (earnings, CO-5100). Counted, a paragraph naming it: wages (8.100.4.C.1.a.i (S166): \"Wages, salaries, tips\"; less the part a record states as combat zone compensation, combat_zone_exclusion, which 26 U.S.C. 112(a)-(b) (S4340) leaves out of gross income for a month during any part of which a member of the Armed Forces served in a combat zone, basic pay included; coverage pass 4, C4-02, OQ-1123 settled), employer_vendor_payment (8.100.4.C.1.a.v (S166), \"Compensation for services, including fees, commissions, fringe benefits and similar items\", and 26 U.S.C. 61(a)(1) (S4631), which C.1 incorporates: money the employer pays a third party for the person's household from funds it would otherwise pay the person is compensation for the person's services; coverage pass 4, C4-04: before, not counted). Counted because no rule excludes it (8.100.4.C.1.a counts wages, salaries and tips and the gross income derived from business (S166), and no paragraph excludes it; the Medicaid owner signs each of these rows): work_study, wioa_on_the_job_training (8.100.3.K.8.a (S4107) counts a caretaker relative's WIA wages; K.8.c exempts a dependent child's for up to six months a calendar year, which the SSI method applies (ma_ssi_earnings_treatment_table, CO-5107), but for MAGI that exemption is an income disregard, which 42 U.S.C. 1396a(e)(14)(B) (S4630) bars, and 8.100.4.C.1.f.i (S167) already leaves out of household income the income of a child below the tax filing threshold; coverage pass 4, C4-16), summer_youth_employment, scsep_employment, subsidized_employment, decennial_census_employment, employer_health_insurance_subsidy. Counted net for tax: self_employment_receipts (8.100.4.C.1.a.ii (S166) and 42 CFR 435.603(e) (S165): the business's net earnings as the tax return reports them (net_for_tax; self_employment_net_earnings_for_tax today), not its gross receipts), farm_self_employment_receipts (as self_employment_receipts (S166, S165)). Excluded live in provider: difficulty_of_care_payment (8.100.3.K.7 (S3754): excluded for a live-in provider whose care recipient receives HCBS waiver services, within the foster-individual limits (ma_excluded_difficulty_of_care_payments, CO-5214); counted otherwise). Excluded in a combat zone (excluded_in_combat_zone: counted as compensation for services (8.100.4.C.1.a.v (S166)) unless the record states combat_zone, pay for service in a combat zone, which is not gross income (26 U.S.C. 112(a), (b) (S4340); for an officer the excluded maximum enlisted amount includes the officer's own 37 U.S.C. 310 special pay, (c)(5)(B)), so not MAGI income (42 CFR 435.603(e) (S165))): uniformed_services_special_pay (OQ-1024, settled for MAGI). Counted unless furnished for the employer's convenience (counted_unless_employer_convenience): in_kind_pay (8.100.4.C.1.a.v (S166), compensation for services \"including ... fringe benefits and similar items\"; 8.100.3.K.3-4 (S4107): \"Earned income is payment in cash or in kind for services performed\", \"compensated in shelter or other items in lieu of wages\"; 26 U.S.C. 61(a)(1) (S4631); at its stated value, except meals on the employer's business premises or lodging the person must accept there as a condition of employment, furnished for the employer's convenience (the record's employer_convenience_meals_or_lodging), which 26 U.S.C. 119(a) (S4636) excludes from gross income; coverage pass 4, C4-04: before, not counted). Counted net of the costs of providing them (counted_net_of_provision_costs, read by ma_magi_boarder_earnings, CO-6450): boarder_payments (8.100.4.C.1.b.ii (S166), \"Rents\", for a room, and a.v, \"Compensation for services\", for meals; 8.100.3.K.10.c-e (S4107): board, room, and room and board payments are earned income \"to the extent that the payment ... exceeds ... documentable expenses directly related to the provision\" of them; 26 U.S.C. 62(a)(4) (S4632), which C.1.e incorporates, takes the deductions attributable to property held for the production of rents out of adjusted gross income; K.10.c's and e's food stamp allotment per boarder is a disregard, which 42 U.S.C. 1396a(e)(14)(B) (S4630) bars for MAGI, so only the costs come off; coverage pass 4, C4-03, OQ-1121 settled: before, counted at their gross amount). Costs not read (not_read_net_for_tax): business_cost_operating (the net earnings for tax already reflect the costs (S165)), business_cost_interest (as above), business_cost_capital_principal (as above), business_cost_depreciation (as above (8.100.3.K.9.b.i.1, S4107, allows depreciation for MAGI)), business_cost_home_space (as above), business_cost_vehicle (as above). Deducted from the boarder payments (deducted_from_boarder_payments, read by ma_magi_boarder_earnings, CO-6450): business_cost_boarder_provision (the documentable costs of providing the room or meals, 8.100.3.K.10.c-e (S4107), 26 U.S.C. 62(a)(4) (S4632); OQ-1121 settled)."
precision: "Earned-income records, step E0 (docs/reviews/earnings-e0.md; docs/design-earned-and-resource-records.md 2.4): every row is today's reading, what the program's items do now with the scalar fact the kind restates (wages: wages_gross, less its parts below; uniformed_services_special_pay: the uniformed_services_special_pay receipt, and combat_zone_pay_received (part of wages_gross); work_study: work_study_earnings; wioa_on_the_job_training: wioa_on_the_job_training_wages; summer_youth_employment: summer_youth_employment_wages; scsep_employment: scsep_wages and scsep_payments_received; subsidized_employment: subsidized_employment_wages; decennial_census_employment: decennial_census_wages_received; difficulty_of_care_payment: difficulty_of_care_payments_received; in_kind_pay: in_kind_compensation_value; employer_vendor_payment: employer_vendor_payments_received; employer_health_insurance_subsidy: employer_health_insurance_subsidy_received; self_employment_receipts: self_employment_gross_receipts; farm_self_employment_receipts: self_employment_gross_receipts of a farm (self_employment_is_farming, self_employment_is_farm_operation); boarder_payments: room_and_board_payments_received, and the board_only_payment and room_only_payment receipts; business_cost_operating: self_employment_operating_costs; business_cost_interest: self_employment_interest_costs; business_cost_capital_principal: self_employment_capital_principal_payments; business_cost_depreciation: no fact (a new kind); business_cost_home_space: self_employment_home_business_space_costs; business_cost_vehicle: self_employment_business_vehicle_costs; business_cost_boarder_provision: room_and_board_provision_costs), so the table changes no answer when the Medicaid E1 track moves its readers onto it; no rule reads it during E0. Every kind has a row, and the type check refuses a lookup in a table that lacks one, so no kind is counted or left out by default; a new kind is added to every earnings table at once by the integration owner (design 4.3, rule 2), and a track changes only its own table's cells. A property of a pay (irregular, temporary_job, the job's dates, combat_zone, annual_contract_pay, pass_set_aside) is a field the program's items read beside the row, not a row. Rows marked for the owner's signature are listed in docs/reviews/earnings-e0.md. Coverage pass 4 (2026-11-23; docs/reviews/coverage4-medicaid-magi-chp.md): in_kind_pay and employer_vendor_payment, which no MAGI item read, are counted (C4-04); boarder_payments are counted net of the business_cost_boarder_provision records (C4-03, OQ-1121 settled); wages less a stated combat zone exclusion (C4-02, OQ-1123 settled)."
