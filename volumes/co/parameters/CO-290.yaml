id: CO-290
name: AND-SO grant standard
identifier: af_and_so_grant_standard
kind: parameter
type: money
scope: global
program: AdultFinancial
meaning: The total AND-SO grant standard, per 9 CCR 2503-5 3.540.A, before deducting a client's countable income.
precision: See OQ-118 - adjustable within available appropriations per 3.540's general adjustment language; this parameter carries only the stated dollar figure as of its effective date.
versions:
  - from: "2022-04-01"
    value: 248
    source: S458
open: [OQ-118]
sources: [S458]
rationale: No existing item states the AND-SO grant standard. af_grant_standard (CO-949), af_and_grant (CO-952), and af_category's income test (CO-953) need it.
