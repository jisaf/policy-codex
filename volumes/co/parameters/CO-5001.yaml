rationale: "Receipt records, migration phase 1 (product-owner decision of 2026-11-23): LEAP's one counting table, kind by kind, replacing the exclusions spread over unearned_income_prior_thirty_days (CO-3913), leap_excluded_unearned_income (CO-4511), leap_excluded_source_receipts (CO-4961) and leap_excluded_receipts_in_lump_sum (CO-4962)."
