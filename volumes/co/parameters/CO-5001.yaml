id: CO-5001
name: "LEAP: how each kind of receipt is treated"
identifier: leap_receipt_treatment_table
kind: parameter
type: table keyed by option
options: [counted, counted_no_rule_excludes, counted_at_or_above_minimum_wage, counted_in_earnings, excluded, not_counted_open_question]
scope: global
program: LEAP
meaning: "LEAP's counting table (9 CCR 2503-7 3.752.21-23), one row per kind of receipt. Counted, a paragraph naming it as income: social_security (3.752.211.H, cents dropped), ssi (3.752.21.I, cents dropped, in the month received), colorado_works_cash and adult_financial_cash (3.752.21.L), gift and gambling_winnings (3.752.21.A, gifts and prizes), workers_compensation (3.752.211.D, less the award's claim expenses), va_aid_and_attendance (3.752.211.E, S4043: \"Veteran compensation and pension - payments based on service in the armed forces\"; Aid and Attendance is a portion of the VA's pension payments, 10 CCR 2505-10 8.100.5.K, S2900, and no paragraph of 3.752.23 excludes it), pension (3.752.211.B, S4100: \"Pension or retirement payments - payments to an applicant or recipient following retirement from employment\"), unemployment_compensation (3.752.211.F, S4100), child_support and child_support_arrears (3.752.21.N, S4100: \"Income received from child support and spousal maintenance payments\"), adoption_subsidy (3.752.21.M, S4100: \"Income received from adoption assistance or subsidies\"), interest_and_dividends and tax_exempt_interest (3.752.21.B, S4100: \"Dividends and interest paid out or withdrawn on savings bonds, leases, bank accounts\"). Counted because no rule excludes it (3.752.21 counts \"payments from any other source\" and no paragraph of 3.752.23 excludes it; the LEAP owner signs each of these rows): rental_income, workforce_program_payment, vocational_training_allowance, general_assistance, emergency_assistance, in_home_care_allowance, home_care_allowance, state_veteran_annuity, charitable_need_based_cash, charitable_gift_life_threatening_condition, migrant_farmworker_emergency_assistance, other_taxable, other_nontaxable (insurance and injury proceeds among them, counted above the costs they pay, 3.752.21.C-D). Counted only at or above the minimum wage for the hours served: americorps (3.752.23.F). Excluded, with the paragraph of 3.752.23: educational_assistance (P), loan (BB), reimbursement (R, S), energy_assistance_federal and energy_assistance_other (T), income_tax_refund (EE), federally_excluded_payment (F, H, I, K-N), dvsa_title_i_volunteer_payment (F), crime_victim_compensation (G), foster_care_payment and kinship_care_payment (U), colorado_works_diversion (W), reverse_mortgage (X), housing_utility_allowance (Y), gi_bill_housing_food_allowance (Z), refugee_resettlement (AA), colorado_works_supportive_services (FF), resource_liquidation (GG). Not counted pending an answer: sponsor_payment (OQ-885). Receipt records, migration phase 3 (kinds that were parts of other receipts before): military_allotment is counted (3.752.212, S3306: \"A military allotment received on behalf of an applicant or recipient for those individuals included in the budget unit shall be considered as income in the month received\"); school_attendance_conditional_benefit is excluded with the educational assistance it was part of (P); adoption_subsidy is counted (M, above); early_childhood_research_payment, savings_account_distribution, medicare_premium_refund and insurance_cash_value are counted because no rule excludes them (3.752.21 and 3.752.23 name none of them; each was counted before as part of the other unearned income; the LEAP owner signs each). Earned-income records, step E0 (OQ-1020): uniformed_services_special_pay, board_only_payment and room_only_payment are earnings (docs/design-earned-and-resource-records.md 2.3); their rows here were kept, with the reading they had, until LEAP read its earnings table. Earned-income records, step E1 (LEAP; docs/reviews/records-earnings-care-energy.md): LEAP reads its earnings table (leap_earnings_treatment_table, CO-5102), so the three rows read counted_in_earnings (counted there, as earnings records, and not here, so a transition copy stated in both lists is counted once); the kinds leave receipts in E2. Counted in earnings (read through leap_earnings_treatment_table, CO-5102, not here; design 2.3, OQ-1020): uniformed_services_special_pay, board_only_payment, room_only_payment. Coverage pass 4 C4-5: dvsa_title_i_payment_at_or_above_minimum_wage counted, since 3.752.23.F excludes payments under Title I (Vista) only \"when the value of all such payments adjusted to reflect the number of hours such volunteers are serving is not equivalent to or greater than the minimum wage\". Coverage pass 4 X4-2 (docs/reviews/coverage4-care-energy.md): property_or_food_tax_refund is counted under 3.752.21's \"payments from any other source, which is considered to be a gain or benefit\" (S4100): 3.752.23.EE (S2208) excludes \"non-recurring lump sum payments for income tax refunds, rebates, or credits\", and \"income tax\" is read as governing the refunds, rebates and credits alike, so a refund of property or food taxes is not among them (income_tax_refund holds the income tax refunds, rebates and credits, Colorado's Property Tax/Rent/Heat credit included); energy_assistance_other stays excluded under T when it is paid to the supplier, the kind's ordinary form."
precision: Receipt records, migration phase 1 (docs/reviews/receipts-migration-1.md). Every kind has a row, and the type check refuses a lookup in a table that lacks one, so no kind is counted or left out by default. A receipt paid once is counted in the income verification period whatever its kind's row says of recurring money only where the row counts it (leap_one_time_receipts_in_period); a retroactive benefit is excluded whatever its kind (3.752.23.EE). The rows counted because no rule excludes them are the ones the ledger counted before receipt records by silence (the thirty-day unearned income figure, CO-3913, summed them); the excerpts on file name social security, SSI, cash assistance, gifts, prizes, workers' compensation, veterans' compensation and pension, pensions, unemployment compensation, child support, adoption assistance, dividends and interest (the last five cited since earnings step E0, S4100; each was counted by silence before, with the same result) (va_aid_and_attendance, counted since receipts migration phase 3 under 3.752.211.E, S4043; the row was counted by silence before, with the same result), and the LEAP owner confirms, row by row, whether 3.752.21 or 3.752.211 names the others. sponsor_payment was never read by LEAP's income before receipt records (money_received_from_sponsor was stated outside the unearned income facts) and stays uncounted until OQ-885 is answered.
