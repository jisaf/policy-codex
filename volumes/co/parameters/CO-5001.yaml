id: CO-5001
name: "LEAP: how each kind of receipt is treated"
identifier: leap_receipt_treatment_table
kind: parameter
type: table keyed by option
options: [counted, counted_no_rule_excludes, counted_at_or_above_minimum_wage, excluded, not_counted_open_question]
scope: global
program: LEAP
meaning: "LEAP's counting table (9 CCR 2503-7 3.752.21-23), one row per kind of receipt. Counted, a paragraph naming it as income: social_security (3.752.211.H, cents dropped), ssi (3.752.21.I, cents dropped, in the month received), colorado_works_cash and adult_financial_cash (3.752.21.L), gift and gambling_winnings (3.752.21.A, gifts and prizes), workers_compensation (3.752.211.D, less the award's claim expenses). Counted because no rule excludes it (3.752.21 counts \"payments from any other source\" and no paragraph of 3.752.23 excludes it; the LEAP owner signs each of these rows): pension, unemployment_compensation, child_support, child_support_arrears, tax_exempt_interest, interest_and_dividends, rental_income, property_or_food_tax_refund, workforce_program_payment, vocational_training_allowance, general_assistance, emergency_assistance, in_home_care_allowance, va_aid_and_attendance, uniformed_services_special_pay, state_veteran_annuity, charitable_need_based_cash, charitable_gift_life_threatening_condition, migrant_farmworker_emergency_assistance, other_taxable, other_nontaxable (insurance and injury proceeds among them, counted above the costs they pay, 3.752.21.C-D). Counted only at or above the minimum wage for the hours served: americorps (3.752.23.F). Excluded, with the paragraph of 3.752.23: educational_assistance (P), loan (BB), reimbursement (R, S), energy_assistance_federal and energy_assistance_other (T), income_tax_refund (EE), federally_excluded_payment (F, H, I, K-N), dvsa_title_i_volunteer_payment (F), crime_victim_compensation (G), foster_care_payment and kinship_care_payment (U), colorado_works_diversion (W), reverse_mortgage (X), housing_utility_allowance (Y), gi_bill_housing_food_allowance (Z), refugee_resettlement (AA), colorado_works_supportive_services (FF), resource_liquidation (GG). Not counted pending an answer: sponsor_payment (OQ-885)."
precision: Receipt records, migration phase 1 (docs/reviews/receipts-migration-1.md). Every kind has a row, and the type check refuses a lookup in a table that lacks one, so no kind is counted or left out by default. A receipt paid once is counted in the income verification period whatever its kind's row says of recurring money only where the row counts it (leap_one_time_receipts_in_period); a retroactive benefit is excluded whatever its kind (3.752.23.EE). The rows counted because no rule excludes them are the ones the ledger counted before receipt records by silence (the thirty-day unearned income figure, CO-3913, summed them); the excerpts on file name social security, SSI, cash assistance, gifts, prizes and workers' compensation, and the LEAP owner confirms, row by row, whether 3.752.21 or 3.752.211 names the others. sponsor_payment was never read by LEAP's income before receipt records (money_received_from_sponsor was stated outside the unearned income facts) and stays uncounted until OQ-885 is answered.
