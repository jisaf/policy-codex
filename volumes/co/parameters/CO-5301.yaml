id: CO-5301
name: "SNAP: how each kind of holding is treated"
identifier: snap_holding_treatment_table
kind: parameter
type: table keyed by option
options: [counted, counted_no_rule_excludes, counted_less_real_property_exclusions, counted_with_real_property, counted_above_funeral_agreement_exclusion, excluded, excluded_household_goods, excluded_federal_within_twelve_months, excluded_while_participating, excluded_while_prorated, counted_beyond_one_plot_per_member, not_counted_no_rule_found]
scope: global
program: SNAP
meaning: "SNAP's counting table for holdings (7 CFR 273.8; 10 CCR 2506-1 4.408-4.410), one row per kind of holdings record (holdings, CO-5300), read for each member of the SNAP household whose resources count. Counted, a paragraph naming it: cash, bank_account, securities (7 CFR 273.8(c)(1), S1958: \"cash on hand, money in checking and savings accounts, saving certificates, stocks or bonds, and lump sum payments\"), business_cash_and_assets (S1958; 4.410.E.1 (S3477) exempts income-producing property and work equipment, not cash held for the business: coverage pass 2 C2-7), held_retroactive_ssa_benefit (a lump sum still held, S1958), held_loan_proceeds (resource records, step H1 SNAP: money from a loan still held is cash on hand or money in an account, a liquid resource under 4.409.A (S4690); 4.405.F.1 (S4691) excludes loans from income only, and 4.410 names no exclusion). Counted less real property exclusions: real_property (counted as the person's non-liquid resources (snap_countable_nonliquid_resources, CO-074), less property the person is making a good faith effort to sell (4.410.F.1, S2968; listed_for_sale), a lot on which a household without a home intends to build (4.410.B, S3118; lot_for_future_home), farm property within a year of the end of farming (4.410.E.4, S3118; farm_ended_date), and nothing when what remains would return $1,500 or less after the costs of sale (4.410.F.2, G, S3119; costs_of_sale); property producing income consistent with its value is exempt (4.410.E.1, S3477; income_producing), and a jointly owned holding is counted in its entirety where the person can reach it (4.409.C, S2968; 7 CFR 273.8(d), S3129: share, co_owners, accessible)). Counted with real property: loan_receivable (today the mortgages and promissory notes the person holds are part of real_property_other_than_home_equity, CO-3393, and pass its tests; no text on file places them; the SNAP owner signs). Counted above funeral agreement exclusion: prepaid_burial_contract (4.410.D.4, S2967: one funeral agreement per member excluded up to $1,500 of equity, the rest counted; an irrevocable agreement is inaccessible, 4.410.F). Excluded, a paragraph naming it: retirement_account (4.410.D.2, S3473; 7 CFR 273.8(e)(2), S2216), education_savings_account (4.410.D.3, S2967), able_account (4.410.D.2.i, S3473: \"529A funds including funds in a qualified ABLE program\"), home (4.410.B, S3118: \"The home and surrounding property\"), installment_contract (4.410.E.2, S3118), vehicle (4.410.A, S2216: every vehicle \"totally exempt\"), life_insurance (7 CFR 273.8(e)(2), S2216: \"the cash value of life insurance policies\"), held_excluded_payment (4.410.J, S3650). Excluded household goods: personal_property (7 CFR 273.8(e)(2), S2216: \"Household goods, personal effects\"; other personal property no fact states today, such as equipment, is not counted, and 4.410.E.1 exempts the work-related equipment and livestock that produce income: the SNAP owner signs the rest). Excluded federal within twelve months: held_income_tax_refund (4.410.J.17, S2966: a federal income tax refund disregarded for twelve months from receipt, paid_by federal, source_date; a State or local refund is counted, as snap_countable_liquid_resources (CO-4176) counts state_tax_refunds_held_value). Excluded while participating: held_eitc (4.410.J.12, S2966: a federal, state or local EITC exempt for twelve months from receipt if the person was participating in SNAP when it was received and participation continues; received_while_on_snap, source_date). Excluded while prorated: held_prorated_income (4.410.C, S3130: prorated income exempt as a resource while a portion is still counted as income). Counted because no rule excludes it (counted_no_rule_excludes: liquid resources are counted (S1958) and 4.410 names no exclusion; the SNAP owner signs each row): held_replacement_proceeds (insurance settlements are lump sums counted as resources (4.405.E, S4691; 7 CFR 273.9(c)(8), S1957), and 4.409 and 4.410 name no exclusion for home-sale proceeds held for replacement; relocation reimbursements under the Uniform Relocation Assistance Act are excluded (4.410.J.4, S3650) and are stated as held_excluded_payment), other_resource. Not counted, no rule found either way (not_counted_no_rule_found: no SNAP item reads the fact the kind restates and no text on file names it; the SNAP owner signs each row): investment_personal_property, burial_fund (an irrevocable burial trust is inaccessible under 4.410.F.1 and F.3 (S2968); a revocable burial trust is not a funeral agreement under D.4 and no text on file names it), trust_interest (4.410.F.3 (S2968) makes a trust inaccessible when no member can revoke it or a court or institution administers it; a revocable trust is not named), annuity, life_estate. Counted beyond one plot per member: burial_space (resource records, step H1 SNAP, finding H0-F3 fixed: 7 CFR 273.8(e)(2) (S2216) and 4.410.D.1 and D.4 (S4690, S2967) exclude one burial plot per household member, so a space beyond the burial needs of the immediate family (for_immediate_family false) is counted, at its equity, unless that is $1,500 or less (4.410.F.2, S3119); a space for the immediate family is read as a member's excluded plot (OQ-1250); snap_countable_burial_spaces, CO-5313)."
precision: "Resource records, step H0 (docs/reviews/holdings-h0.md; docs/design-earned-and-resource-records.md 3.3): every row is today's reading, what the program's items do now with the scalar resource fact the kind restates (cash, bank_account and securities: liquid_resources_value (CO-3390), less the parts below stated apart (the translator writes the remainder as one bank_account record: the old fact does not tell cash, accounts and securities apart); retirement_account: retirement_accounts_value (CO-3392) with retirement_accounts_taxes_due (CO-4429); education_savings_account: education_savings_accounts_value (CO-4174); able_account: able_account_value (CO-4415); business_cash_and_assets: business_cash_and_convertible_assets_value (CO-4416); home: home_equity (CO-826) with owns_and_lives_in_home, lives_in_owned_home and the home facts (CO-3401, CO-4610, CO-4435, CO-4612-CO-4615); real_property: real_property_other_than_home_equity (CO-3393) and its parts (CO-4335, CO-4336, CO-4346, CO-4606, CO-4431), the joint owners' shares (CO-4343), income-producing property (CO-4607-CO-4609, CO-4423, CO-4424) and home-use production property (CO-4425); installment_contract: installment_sale_contract_value (CO-4337, part of CO-3393); vehicle: vehicles_equity_value and transportation_vehicle_equity_value (CO-3394, CO-3395); personal_property: no fact (not stated today); investment_personal_property: investment_personal_property_value (CO-4642); life_insurance: CO-3396, CO-3397, CO-3850, CO-3851; burial_fund: irrevocable_burial_funds_value (CO-4603) and revocable_burial_trust_value (CO-3855) with burial_funds_accrued_interest (CO-4604); prepaid_burial_contract: revocable_prepaid_burial_contract_value (CO-3856); burial_space: burial_spaces_value_beyond_family_needs (CO-3857); trust_interest: has_trust_interest (CO-1577), trust_corpus_payable_to_person_value (CO-4432) and ma_trust_annuity_life_estate_value_available (CO-4643); annuity: owns_annuity (CO-1579) and CO-4643; life_estate: CO-4643; loan_receivable: within real_property_other_than_home_equity (CO-3393: \"mortgages and promissory notes the person holds included\"); held_income_tax_refund: federal_tax_refunds_held_value and state_tax_refunds_held_value (CO-4172, CO-4413); held_eitc: snap_eitc_held_while_participating_value (CO-4173); held_retroactive_ssa_benefit: retroactive_ssa_benefits_held_value (CO-4414) and retroactive_benefit_payment_unspent_value with its date (CO-4639, CO-4640); held_excluded_payment: excluded_government_payments_held_value (CO-4932); held_loan_proceeds: no holding fact (Adult Financial reads the loan receipt of the month, receipts CO-5000 kind loan); held_replacement_proceeds: CO-4417-CO-4419; held_prorated_income: prorated_income_held_value (CO-4319); other_resource: no fact), so the table changes no answer when the program's H1 track moves its readers onto it, except where a row's reading is a finding the track fixes as a cited difference. Rows marked for the owner's signature (counted_no_rule_excludes, not_counted_no_rule_found, and the findings not_counted_text_counts and counted_text_excludes, where today's reading differs from the text on file) are listed in docs/reviews/holdings-h0.md. A property of a holding (its share and co-owners, accessible, listed for sale, income producing, used for transportation, a held_ record's source_date, irrevocable, disposed_date) is a field the program's items read beside the row, not a row; a record with a disposed_date is read by the program's transfer rules, not counted as held. Every kind has a row, and the type check refuses a lookup in a table that lacks one, so no kind is counted or left out by default; a new kind is added to every holdings table at once by the integration owner (design 4.3, rule 2), and a track changes only its own table's cells. No rule reads this table in step H0. Resource records, step H1 SNAP (docs/reviews/records-holdings-snap-af.md): SNAP's readers read it, kind by kind, with the fields beside it: snap_countable_liquid_resources (CO-4176), snap_real_property_not_exempt and snap_countable_real_property (CO-5310, CO-5311), snap_countable_funeral_agreements (CO-5312), snap_countable_burial_spaces (CO-5313) and the transfer look-back (snap_disqualifying_transfer_value, CO-5314, CO-5315, which leaves out a transferred holding whose row is excluded or excluded_household_goods, 4.408.2.A.1)."
