rationale: "Resource records, step H0 (product-owner decision of 2026-11-23, design decisions D3 and D6): SNAP's one holdings counting table, kind by kind, so a kind of holding is never counted or excluded by silence; it replaces, from step H1, the parts of liquid_resources_value and real_property_other_than_home_equity that SNAP's items subtract one by one (snap_countable_liquid_resources, CO-4176; snap_countable_nonliquid_resources, CO-074)."
