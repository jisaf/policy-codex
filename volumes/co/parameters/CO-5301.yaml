id: CO-5301
name: "SNAP: how each kind of holding is treated"
identifier: snap_holding_treatment_table
kind: parameter
type: table keyed by option
options: [counted, counted_no_rule_excludes, counted_unless_irrevocable, counted_at_equity, counted_less_real_property_exclusions, counted_with_real_property, counted_beyond_one_agreement_per_member, counted_beyond_one_plot_per_member, excluded, excluded_while_home, excluded_if_consistent_return, excluded_household_goods, excluded_federal_within_twelve_months, excluded_while_participating, excluded_while_prorated, not_counted_reading_open, not_counted_no_rule_found]
scope: global
program: SNAP
meaning: "SNAP's counting table for holdings (7 CFR 273.8; 10 CCR 2506-1 4.408-4.410), one row per kind of holdings record (holdings, CO-5300), read for each member of the SNAP household whose resources count, in each month. Counted, a paragraph naming it: cash, bank_account, securities (7 CFR 273.8(c)(1), S1958: \"cash on hand, money in checking and savings accounts, saving certificates, stocks or bonds, and lump sum payments\"), business_cash_and_assets (S1958; 4.410.E.1 (S3477) exempts income-producing property and work equipment, not cash held for the business: coverage pass 2 C2-7), held_retroactive_ssa_benefit (a lump sum still held, S1958), held_loan_proceeds (money from a loan still held is cash on hand or money in an account, 4.409.A (S4690); 4.405.F.1 (S4691) excludes loans from income only), held_replacement_proceeds (a lump sum, 273.8(c)(1), S1958, and 4.405.E, S4691; relocation reimbursements, which 4.410.J.4 (S3650) excludes, are stated as held_excluded_payment), other_resource (273.8(c)(2), S4820: \"any other property, provided that these resources are not specifically excluded under paragraph (e)\"; read at its value, as liquid: SR-13). Counted unless irrevocable: burial_fund (money set aside for burial that can be withdrawn is money in an account, 273.8(c)(1); an irrevocable fund is inaccessible, 4.410.F.1, S2968; D.4's exclusion is for a funeral agreement). Counted at equity: investment_personal_property (273.8(c)(2), S4820: \"personal property\"; 4.408.1.B, S4823: non-liquid resources other than real property at fair market value \"less verified encumbrances\"; inaccessible at $1,500 or less, F.2, S3119; snap_countable_other_nonliquid_resources, CO-6900). Counted less real property exclusions: real_property (snap_real_property_not_exempt and snap_countable_real_property, CO-5310, CO-5311: less property for sale (4.410.F.1, S2968; listed_for_sale), a lot on which a household without a home intends to build (4.410.B, S3118; lot_for_future_home), property essential to farming within a year (4.410.E.4, S3118; farm_ended_date), property used in the person's trade or business (273.8(e)(5), S4822; used_in_trade_or_business), other income-producing property whose return the county has found consistent with its value (4.410.E.1, S3477, 273.8(e)(4), S4822; net_annual_return, snap_return_consistent_with_value; OQ-1308), and nothing for a holding that would return $1,500 or less (4.410.F.2, G, S3119; costs_of_sale), each holding at the household's interest; a joint holding with a separate household counted in its entirety, 4.409.C, S2968, 7 CFR 273.8(d), S3129). Counted with real property: loan_receivable (a mortgage or note the person holds, counted by 273.8(c)(1)-(2), S1958, S4820, at its equity, with the $1,500 tests unless it is a negotiable instrument, 4.410.G, S3119, 273.8(e)(18), S4826: negotiable_instrument; OQ-1202 resolved). Counted beyond one agreement per member: prepaid_burial_contract (7 CFR 273.8(e)(2), S2216, the statute override over 4.410.D.4, S2967: the value of one funeral agreement per household member excluded, the one for each member named by burial_for and for_person; snap_countable_funeral_agreements, CO-5312; an irrevocable agreement is inaccessible, F.1; OQ-1305). Counted beyond one plot per member: burial_space (7 CFR 273.8(e)(2) (S2216) and 4.410.D.1 (S4690): one burial plot per household member excluded, the one for each member named by burial_for and for_person; a space of $1,500 or less is inaccessible, 4.410.F.2, S3119; snap_countable_burial_spaces, CO-5313; OQ-1250 resolved). Excluded, a paragraph naming it: retirement_account (4.410.D.2, S3473; 7 CFR 273.8(e)(2), S2216), education_savings_account (4.410.D.3, S2967), able_account (4.410.D.2.i, S3473: \"529A funds including funds in a qualified ABLE program\"), vehicle (4.410.A, S2216: every vehicle \"totally exempt\"), life_insurance (7 CFR 273.8(e)(2), S2216: \"the cash value of life insurance policies\"), held_excluded_payment (4.410.J, S3650). Excluded while the home: home (4.410.B, S3118: \"The home and surrounding property\", exempt while the person lives in it, lives_in, or while it is \"temporarily unoccupied for reasons of employment, training for future employment, illness, or not habitable as a result of casualty or natural disaster, if the household intends to return\", temporary_absence; otherwise real property, CO-5310). Excluded if its return is consistent with its value: installment_contract (4.410.E.2, S3118; 273.8(e)(6), S4822: \"if the contract or agreement is producing income consistent with its fair market value\"; otherwise counted at equity, CO-6900; OQ-1308). Excluded household goods: personal_property (7 CFR 273.8(e)(2), S2216: \"Household goods, personal effects\"; 4.410.D.1, S4690, livestock; the kind also names equipment and tools, which 273.8(c)(2) counts unless they produce income or are essential to employment (4.410.E.1, 273.8(e)(5)), and the record does not tell them apart: SR-13, the SNAP owner signs the row). Excluded federal within twelve months: held_income_tax_refund (4.410.J.17, S2966: a federal income tax refund disregarded for twelve months from receipt, paid_by federal, source_date; a State or local refund is counted, less the part that is an earned income tax credit, which 4.410.J.12 excludes for twelve months for a participant: eitc_share, received_while_on_snap). Excluded while participating: held_eitc (4.410.J.12, S2966: a state or local EITC received apart from a refund, exempt for twelve months from receipt if the person was participating in SNAP when it was received and participation continues; received_while_on_snap, source_date). Excluded while prorated: held_prorated_income (4.410.C, S3130: prorated income exempt as a resource while a portion is still counted as income). Not counted, the owner's reading open (not_counted_reading_open): trust_interest, annuity (7 CFR 273.8(c)(2), S4820, counts \"any other property\" not excluded; 273.8(e)(8), S4824, makes a trust inaccessible only when all its conditions hold, joined by \"and\", while 4.410.F.3, S2968, joins them by \"or\"; a surrenderable annuity is any other property: OQ-1307). Not counted, no rule found either way (not_counted_no_rule_found: the SNAP owner signs the row): life_estate (whether a life estate or remainder interest can be sold is not settled on file; OQ-1202)."
precision: "Resource records, step H0 (docs/reviews/holdings-h0.md; docs/design-earned-and-resource-records.md 3.3): every row is today's reading, what the program's items do now with the scalar resource fact the kind restates (cash, bank_account and securities: liquid_resources_value (CO-3390), less the parts below stated apart (the translator writes the remainder as one bank_account record: the old fact does not tell cash, accounts and securities apart); retirement_account: retirement_accounts_value (CO-3392) with retirement_accounts_taxes_due (CO-4429); education_savings_account: education_savings_accounts_value (CO-4174); able_account: able_account_value (CO-4415); business_cash_and_assets: business_cash_and_convertible_assets_value (CO-4416); home: home_equity (CO-826) with owns_and_lives_in_home, lives_in_owned_home and the home facts (CO-3401, CO-4610, CO-4435, CO-4612-CO-4615); real_property: real_property_other_than_home_equity (CO-3393) and its parts (CO-4335, CO-4336, CO-4346, CO-4606, CO-4431), the joint owners' shares (CO-4343), income-producing property (CO-4607-CO-4609, CO-4423, CO-4424) and home-use production property (CO-4425); installment_contract: installment_sale_contract_value (CO-4337, part of CO-3393); vehicle: vehicles_equity_value and transportation_vehicle_equity_value (CO-3394, CO-3395); personal_property: no fact (not stated today); investment_personal_property: investment_personal_property_value (CO-4642); life_insurance: CO-3396, CO-3397, CO-3850, CO-3851; burial_fund: irrevocable_burial_funds_value (CO-4603) and revocable_burial_trust_value (CO-3855) with burial_funds_accrued_interest (CO-4604); prepaid_burial_contract: revocable_prepaid_burial_contract_value (CO-3856); burial_space: burial_spaces_value_beyond_family_needs (CO-3857); trust_interest: has_trust_interest (CO-1577), trust_corpus_payable_to_person_value (CO-4432) and ma_trust_annuity_life_estate_value_available (CO-4643); annuity: owns_annuity (CO-1579) and CO-4643; life_estate: CO-4643; loan_receivable: within real_property_other_than_home_equity (CO-3393: \"mortgages and promissory notes the person holds included\"); held_income_tax_refund: federal_tax_refunds_held_value and state_tax_refunds_held_value (CO-4172, CO-4413); held_eitc: snap_eitc_held_while_participating_value (CO-4173); held_retroactive_ssa_benefit: retroactive_ssa_benefits_held_value (CO-4414) and retroactive_benefit_payment_unspent_value with its date (CO-4639, CO-4640); held_excluded_payment: excluded_government_payments_held_value (CO-4932); held_loan_proceeds: no holding fact (Adult Financial reads the loan receipt of the month, receipts CO-5000 kind loan); held_replacement_proceeds: CO-4417-CO-4419; held_prorated_income: prorated_income_held_value (CO-4319); other_resource: no fact), so the table changes no answer when the program's H1 track moves its readers onto it, except where a row's reading is a finding the track fixes as a cited difference. Rows marked for the owner's signature (counted_no_rule_excludes, not_counted_no_rule_found, and the findings not_counted_text_counts and counted_text_excludes, where today's reading differs from the text on file) are listed in docs/reviews/holdings-h0.md. A property of a holding (its share and co-owners, accessible, listed for sale, income producing, used for transportation, a held_ record's source_date, irrevocable, disposed_date) is a field the program's items read beside the row, not a row; a record with a disposed_date is read by the program's transfer rules, not counted as held. Every kind has a row, and the type check refuses a lookup in a table that lacks one, so no kind is counted or left out by default; a new kind is added to every holdings table at once by the integration owner (design 4.3, rule 2), and a track changes only its own table's cells. No rule reads this table in step H0. Resource records, step H1 SNAP (docs/reviews/records-holdings-snap-af.md): SNAP's readers read it, kind by kind, with the fields beside it: snap_countable_liquid_resources (CO-4176), snap_real_property_not_exempt and snap_countable_real_property (CO-5310, CO-5311), snap_countable_funeral_agreements (CO-5312), snap_countable_burial_spaces (CO-5313) and the transfer look-back (snap_disqualifying_transfer_value, CO-5314, CO-5315, which leaves out a transferred holding whose row is excluded or excluded_household_goods, 4.408.2.A.1). Coverage pass 4 for SNAP resources (docs/reviews/coverage4-snap-resources.md; 2026-11-23): rows changed by the text on file, each a cited difference: investment_personal_property (SR-3: counted_at_equity), burial_fund (SR-3: counted_unless_irrevocable), home (SR-4: excluded_while_home), installment_contract (SR-5: excluded_if_consistent_return), prepaid_burial_contract (SR-1: counted_beyond_one_agreement_per_member, was counted_above_funeral_agreement_exclusion), trust_interest and annuity (SR-3, SR-15: not_counted_reading_open, OQ-1307), held_replacement_proceeds and other_resource (counted, was counted_no_rule_excludes: 273.8(c)(1)-(2) settle them, OQ-1202 part 2; no answer changes). OQ-1202's part (2) is resolved by 273.8(c)(2), on file in full in D-12 and D-191, except life_estate. The transfer look-back (CO-5314, CO-5315) reads no row (SR-14: the county's finding states 4.408.2.A's exemptions). Not read by any row, recorded for the integration owner (SR-15): Indian lands held jointly with the Tribe or saleable only with the Bureau of Indian Affairs' approval (273.8(e)(10), S4824), property used to maintain an excluded vehicle ((e)(16)) and security deposits ((e)(8)) have no kind or field; a case states them with accessible false. SR-20: 4.409.A (S4690) defines lump sums \"as specified in Section 4.405, F\", but 4.405.F is loans and 4.405.E nonrecurring lump sums: the rule's cross-reference reads E, as the volume cites it."
