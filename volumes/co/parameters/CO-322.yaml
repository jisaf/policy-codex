id: CO-322
name: CCCAP teen parent age limit
identifier: cccap_teen_parent_age_limit
kind: parameter
type: whole number
scope: global
program: CCCAP
meaning: The upper age limit (exclusive) under which a parent with physical custody of an eligible child can qualify as a CCCAP teen parent.
value: 21
sources: [S481]
tags: [age]
rationale: 8 CCR 1403-1 3.103.ZZZZ (S481) defines "teen parent" as a parent under twenty-one years of age; cccap_is_teen_parent (CO-981) reads it.
