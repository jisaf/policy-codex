id: CO-3828
name: "Adult Financial: a married client's share of the unearned income disregard"
identifier: af_married_couple_disregard_share
kind: parameter
type: rate
scope: global
program: AdultFinancial
meaning: "The share of af_general_income_disregard a married client receives: the disregard \"shall be split equally between the client and the client's spouse so that no more than a $20.00 disregard is applied for the married couple\" (9 CCR 2503-5 3.533.A.2.c.1; 3.544.B.2 and 3.549.A.2.c.1 for AND-SO and AND-CS)."
value: 0.5
sources: [S2610, S2611, S2612]
open: [OQ-661]
tags: [cash, income]
rationale: "Final cash review FC-4: every married client was given the whole $20, so a married couple could have $40. The rule's equal split is a figure of the rule, so it is a parameter, as the one-half of af_earned_income_remainder_rate (CO-3048) is."
