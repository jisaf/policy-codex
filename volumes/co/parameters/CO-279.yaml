id: CO-279
name: "PRWORA qualified-alien entry date cutoff"
identifier: qualified_non_citizen_entry_cutoff_date
kind: parameter
type: calendar date
scope: global
program: All
meaning: "August 22, 1996: a qualified alien who entered the United States before this date is not subject to the five-year bar of 8 U.S.C. 1613(a) as Colorado's public assistance programs apply it (26-2-706(1.5)(b) and 26-2-111.8(2)(a), C.R.S.; 9 CCR 2503-6 3.604.1.B.2-3). The same date, the enactment of PRWORA, bounds 9 CCR 2503-5 3.520.69's sponsorship rules (qualified non-citizens who entered on or after it, S1063) and the lawful residence condition of 10 CCR 2506-1 4.305.B.3.e (S15)."
value: "1996-08-22"
sources: [S402, S407, S1151, S15, S1063]
rationale: "No existing parameter states this date; meets_public_assistance_citizenship_requirement (CO-905) needs it. Vocabulary fix round (R-4): renamed from cw_non_citizen_entry_date_cutoff and made program All, since meets_public_assistance_citizenship_requirement (CO-905) reads the same statutory date (26-2-111.8(2)(a)). Engineering follow-up 3: snap_is_exempt_from_immigrant_waiting_period (CO-306) and af_sponsor_verification_is_pending (CO-1672) read it in place of a literal date."
