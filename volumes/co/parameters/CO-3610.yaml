id: CO-3610
name: "Home Maintenance Allowance: shelter share"
identifier: ma_home_maintenance_shelter_pct
kind: parameter
type: rate
scope: global
program: Medicaid
meaning: "The share of 150% of the poverty guideline for one added back in the Home Maintenance Allowance maximum (10 CCR 2505-10 § 8.100.7.V.3.g.ii.2.b.(2), \"adding 30% of 150% FPL for a household of 1\")."
value: 0.30
sources: [S2404]
tags: [ma, ltc, income]
rationale: "Final verification F-3 (docs/reviews/final-medicaid-chp.md): ma_patient_payment (CO-658) deducted only the personal needs allowance, the community spouse and family allowances and every health insurance premium, in every month; 10 CCR 2505-10 § 8.100.7.V.3.b-i (S2400-S2405) lists further deductions and adds Long-Term Care insurance payments, and limits the Part B premium to the first two months. The 30% figure of the Home Maintenance Allowance maximum as a parameter."
