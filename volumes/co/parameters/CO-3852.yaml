id: CO-3852
name: "Adult Financial: OAP life insurance look-back months"
identifier: af_oap_life_insurance_lookback_months
kind: parameter
type: whole number
scope: global
program: AdultFinancial
meaning: "For OAP, the cash surrender value of policies all bought more than this many months before the eligibility determination date is exempt, except money contributed within those months (9 CCR 2503-5 3.520.75.E-F: \"forty-eight (48) months\")."
value: 48
sources: [S2618]
tags: [cash, oap, resources]
rationale: "Final cash review FC-8: af_person_countable_resources (CO-3400) counted the whole cash surrender value of life insurance over $1,500 face value, though 9 CCR 2503-5 3.520.75.E-F (S2618) exempt it for an OAP client whose policies are more than forty-eight months old, and it never counted revocable burial funds or excess burial spaces, which 3.520.72.B.8-9 (S2619) count. The figure is a parameter."
