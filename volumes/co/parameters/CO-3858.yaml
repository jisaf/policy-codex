id: CO-3858
name: "Adult Financial: revocable burial funds exemption"
identifier: af_revocable_burial_funds_exemption
kind: parameter
type: money
scope: global
program: AdultFinancial
meaning: "A revocable burial trust, an irrevocable one of which the client is both trustor and beneficiary, and a revocable prepaid burial contract are each exempt up to this amount; the amount over it is a countable resource (9 CCR 2503-5 3.520.77.G.2.d, G.3, H.2: \"one thousand five hundred dollars ($1,500)\")."
value: 1500
sources: [S2619]
tags: [cash, resources]
rationale: "Final cash review FC-8: af_person_countable_resources (CO-3400) counted the whole cash surrender value of life insurance over $1,500 face value, though 9 CCR 2503-5 3.520.75.E-F (S2618) exempt it for an OAP client whose policies are more than forty-eight months old, and it never counted revocable burial funds or excess burial spaces, which 3.520.72.B.8-9 (S2619) count. The figure is a parameter."
