id: CO-104
name: "Qualified non-citizen waiting period, years"
identifier: qualified_non_citizen_waiting_period_years
kind: parameter
type: whole number
scope: global
program: All
meaning: "The number of years a qualified non-citizen must have held qualified status before the five-year limitation of 8 U.S.C. 1613(a) stops applying (five years)."
value: 5
sources: [S12, S176]
rationale: "A policy number the cited text states; kept as a parameter so the rule that reads it carries no digit in its identifier (governance name.digits). Vocabulary fix round (U-2): renamed from snap_five_year_bar_years and made program All; SNAP, Medicaid, Colorado Works and Adult Financial all read it through has_held_qualified_status_five_years (CO-508)."
