id: CO-1286
name: CCCAP parent fee per additional child
identifier: cccap_parent_fee_additional_child_amount
kind: parameter
type: money
scope: global
program: CCCAP
meaning: The fifteen-dollar fee added for each child after the first when care is requested for more than one child and household income is above 100% of the federal poverty guideline, per 8 CCR 1403-1 3.124.P.3.
value: 15
sources: [S785]
implemented: engine
tags: [income]
rationale: No existing parameter states it; cccap_parent_fee_formula_amount (CO-1289) needs it.
