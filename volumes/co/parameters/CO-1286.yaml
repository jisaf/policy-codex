id: CO-1286
name: CCCAP parent fee per additional child
identifier: cccap_parent_fee_additional_child_amount
kind: parameter
type: money
scope: global
program: CCCAP
meaning: "The fee added for each child after the first when care is requested for more than one child and household income is above 100% of the federal poverty guideline: fifteen dollars under 8 CCR 1403-1 3.124.P.3 (July 1, 2021 through July 31, 2028); none from August 1, 2028, when 3.124.Q's marginal rates state no per-child fee."
versions:
  - from: "2021-07-01"
    to: "2028-08-01"
    value: 15
    source: S785
  - from: "2028-08-01"
    value: 0
    source: S786
sources: [S785, S786]
tags: [income]
rationale: "No existing parameter states it; cccap_parent_fee_formula_amount (CO-1289) needs it. Engineering follow-up 3: versioned, so 3.124.Q's formula has no per-child term without a literal month in the derivation."
