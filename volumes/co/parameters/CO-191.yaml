rationale: "No existing item carries Colorado's Children's-category income percentage. ma_magi_income_standard_child (CO-540) needs it as a parameter rather than an inline digit (governance name.digits). Fix round: versioned from the HCPF MAGI-Medicaid income guidelines chart (D-68/D-70) the rule text at 8.100.4.G.2 (S201) directs the reader to, per the phase-3 review's OQ-63 finding and this fix round's re-reading of it; the prior bare 133% value is not kept as a version because no fetched document states when that pre-chart figure took effect on its own, so this parameter's history begins with the earliest chart edition fetched (D-70, effective 2025-04-01) rather than an invented earlier date."
