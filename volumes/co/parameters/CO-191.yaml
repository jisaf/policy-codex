id: CO-191
name: MAGI income limit, Children category, percent of FPL
identifier: ma_income_limit_child_pct
kind: parameter
type: rate
scope: global
program: Medicaid
meaning: Colorado's income limit for the Children's MAGI Medical Assistance category, expressed as a decimal fraction of the federal poverty level (MAGI-equivalent), under 10 CCR 2505-10 8.100.4.G.2.
precision: A percentage-of-FPL figure (1.33 = 133%), compared directly against ma_magi_household_income_pct_fpl (CO-504).
value: 1.33
sources: [S201]
open: [OQ-63]
tags: [ma, magi, income, state_election]
rationale: "No existing item carries Colorado's Children's-category income percentage. ma_magi_income_standard_child (CO-540) needs it as a parameter rather than an inline digit (governance name.digits)."
