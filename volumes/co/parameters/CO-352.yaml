rationale: "No existing parameter states the 'No Caretaker' grant-standard row; cw_grant_standard_table (CO-276, the acknowledged nearest same-shape parameter) carries only the 'One Caretaker' row of the same 3.606.1.F chart. Added under the fix-round C-5 finding, the grant-standard companion to cw_need_standard_table_no_caretaker (CO-351). cw_grant_standard (CO-912) needs it."
