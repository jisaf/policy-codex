id: CO-3009
name: CHP+ copayment schedule, band A
identifier: chp_copayment_band_a_table
kind: parameter
type: table keyed by option
scope: global
program: CHP+
meaning: "The CHP+ copayment per use, visit, prescription, trip or date of service that 10 CCR 2505-3 § 320.1.A schedules for each service type (the options of chp_service_type, CO-2223), for a family in copayment band a (chp_copayment_income_band, CO-2228)."
precision: "Paragraph A (less than 101% of the federal poverty level) waives all copayments except emergency care and urgent or after-hours care; it states no effective date, so the table has one value. Every option of chp_service_type (CO-2223) has a row; a service the paragraph lists no copayment for is 0. The exemptions of § 330.3 (preventive services), § 320.1.C.3 and D.3 (COVID-19 laboratory testing) and the waiver for emergency care with a hospital admission are rules, applied by chp_scheduled_copayment (CO-2230) before the table, and their rows are 0."
value: {office_visit: 0, behavioral_health_visit: 0, generic_prescription: 0, brand_name_prescription: 0, therapy_visit: 0, vision_visit: 0, emergency_care: 3, emergency_care_with_admission: 0, urgent_care: 1, laboratory_or_imaging: 0, covid_19_laboratory_testing: 0, emergency_transport: 0, inpatient_hospital: 0, inpatient_physician: 0, outpatient_hospital: 0, preventive: 0}
sources: [S1504, S1505]
tags: [chp]
rationale: "Hard-coded numbers audit H-5: chp_scheduled_copayment (CO-2230) held the whole § 320.1 schedule as literals in a nested case; the band limits were already parameters (CO-2225 to CO-2227) but the amounts were not. One table per band, keyed by service type."
