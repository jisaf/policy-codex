id: CO-4355
name: "Colorado Works: partial month payment factors"
identifier: cw_partial_month_payment_factor_table
kind: parameter
type: table keyed by number of days
scope: global
program: ColoradoWorks
meaning: "The decimal figure the authorized Colorado Works grant for the entire month is multiplied by to give the authorized grant for a partial month, by the number of days for which payment is made in the initial month (1 to 30), per 9 CCR 2503-6 3.609.2.A.1.c-d and the table that follows A.1.e."
precision: "The figures are the rule's table as printed (30 days is printed .9863). A unit whose assistance begins on the first of the month is paid for the entire month, so no row for 31 days is needed (cw_partial_month_payment_factor, CO-4358). The same figures appear in the Adult Financial rule (af_partial_month_payment_factor_table, CO-2602, 9 CCR 2503-5 3.581.D.4); each program's rule states its own table, so each has its own parameter."
