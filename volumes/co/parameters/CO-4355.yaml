rationale: "Coverage review CW-8 (P1): the initial payment includes assistance from the date of application (3.609.2.A.1, S3156), computed with this table, but no item read it, so the application month was paid in full. Versioned from the effective date of the rule version fetched (D-81, 07/01/2025); the table is unchanged from earlier versions as far as the volume holds them."
