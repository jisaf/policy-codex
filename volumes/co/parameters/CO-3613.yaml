id: CO-3613
name: "Patient payment: earned income reserve base"
identifier: ma_ltc_earned_income_reserve_base
kind: parameter
type: money
scope: global
program: Medicaid
meaning: "The amount subtracted from a Long-Term Care institution resident's gross earned income before the remainder is halved, the resident keeping both (10 CCR 2505-10 § 8.100.7.V.3.d.iii, \"$65 per month plus one-half of the remaining gross income\"; V.3.f.ii)."
value: 65
sources: [S2402, S2403]
tags: [ma, ltc, income]
rationale: "Final verification F-3 (docs/reviews/final-medicaid-chp.md): ma_patient_payment (CO-658) deducted only the personal needs allowance, the community spouse and family allowances and every health insurance premium, in every month; 10 CCR 2505-10 § 8.100.7.V.3.b-i (S2400-S2405) lists further deductions and adds Long-Term Care insurance payments, and limits the Part B premium to the first two months. Colorado's own figure: the rule states it, and it is not read from the SSI exclusion (ssi_earned_income_exclusion), which federal law could change apart from this rule."
