id: CO-350
name: Colorado Works earned income disregard rate (payment computation)
identifier: cw_earned_income_disregard_rate
kind: parameter
type: rate
scope: global
program: ColoradoWorks
meaning: The fraction of gross earned income disregarded to determine the payment amount after the unit's first certification period (9 CCR 2503-6 3.606.2.A.1, last sentence) and for a current source of earned income of a unit already receiving basic cash assistance (3.606.2.A.2.b) - sixty-seven percent. The first certification period and a new source take the one hundred percent rate instead (cw_new_earnings_disregard_rate, CO-1503).
versions:
  - from: "2025-07-01"
    value: 0.67
    source: S1000
sources: [S1000]
rationale: "No existing parameter states the 67% payment disregard rate; cw_earned_income_disregard_dollar (CO-273) carries only the flat $90 eligibility-test figure 3.606.2.A.1's first sentence states, acknowledged as the nearest same-shape parameter, but it is a different dollar-versus-rate figure for a different step (the eligibility test, not the payment). cw_payment_countable_earned_income (CO-922) needs this rate. Phase-8 fix round (B-1): re-cited from the Cornell copy (S416, D-61, which carried the pre-June 2023 text applying 67% at application and ongoing) to the current Secretary of State text (S1000, D-81); the figure is unchanged, its scope narrowed to current sources after the first certification period."
nearest: [CO-273]
