id: CO-122
name: SNAP BBCE gross income limit by household size (200% FPL)
identifier: snap_bbce_gross_income_limit_table
kind: parameter
type: table keyed by household size
scope: global
program: SNAP
meaning: The monthly gross income limit (200% of the federal poverty level) a household's combined gross income must be at or below to meet the income prong of Colorado's Expanded Categorical Eligibility, by household size 1 through 8.
precision: "Colorado's codified table (10 CCR 2506-1 4.401.1) states this figure directly, with a caption naming the date it takes effect: the version from 2024-10-01 (S59), the FY2026 version from 2025-10-01 (the rule version effective 12/30/2025, D-133, S1304; the 10/03/2025 emergency version carried the same table) and the current version from 2026-10-01 (S739). OQ-15 resolved."
assumption: Uses the directly quoted 200% column of Colorado's own codified 4.401.1 table rather than computing 200% of the FY2026 HHS poverty guideline (federal_poverty_guideline_annual_table, CO-181), because the codified state text is the more direct citation for a state-elected BBCE figure and each version of Colorado's rule states its own table.
