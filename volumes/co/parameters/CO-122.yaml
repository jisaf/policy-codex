rationale: "10 CCR 2506-1 4.206,C,2,a,1) (S48) is Colorado's Expanded Categorical Eligibility election at 200% of the federal poverty level; snap_bbce_gross_income_limit (CO-339) needs the dollar table snap_meets_ece_eligibility (CO-340) compares household income against, parallel to snap_gross_income_limit_table and snap_net_income_limit_table. Phase 8 adds the 200% column of 10 CCR 2506-1 4.401.1 effective October 1, 2026 (S739), resolving OQ-15 for determinations from that date. The open-question sweep adds the FY2026 column (2025-10-01 to 2026-10-01) from the rule version effective 12/30/2025 (S1304), so determinations in that year no longer use the FY2025 table."
