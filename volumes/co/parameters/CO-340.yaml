id: CO-340
name: CCCAP 85% state median income limit by household size
identifier: cccap_smi_income_limit_table
kind: parameter
type: table keyed by household size
scope: global
program: CCCAP
meaning: The monthly dollar amount of 85% of the state median income (SMI) by household size, the "State and Federal Maximum Income Limit" of 8 CCR 1403-1 3.111.H.1 - the cap 3.111.H.1's opening sentence puts on the entry limit and the exit income eligibility limit of 3.111.H.1.b.
precision: Monthly dollars, sizes 1-8; sizes above 8 add cccap_smi_income_limit_each_additional (CO-341) per additional member. The text states these as the 85% SMI figures effective October 1, 2024, alongside the 100% FPG figures cccap_poverty_guideline_table (CO-323) carries.
versions:
  - from: "2024-10-01"
    value: { "1": 4792.16, "2": 6266.68, "3": 7741.19, "4": 9215.70, "5": 10690.21, "6": 12164.72, "7": 12441.20, "8": 12717.67 }
    source: S485
sources: [S485]
tags: [income]
rationale: "8 CCR 1403-1 3.111.H.2's income table (S485) states this 85% SMI column verbatim alongside the 100% FPG column cccap_poverty_guideline_table (CO-323, the nearest existing item) already carries; the review (docs/reviews/cccap-leap-phase-6.md, C-5) found the 85% SMI figures were stated in the fetched text and dropped from the ledger. cccap_income_within_entry_limit (CO-986) reads it as the cap 3.111.H.1's opening sentence puts on the entry limit, and cccap_income_within_exit_limit (CO-993) reads it as the exit limit."
