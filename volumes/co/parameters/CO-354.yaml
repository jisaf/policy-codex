meaning: The maximum basic cash assistance grant for a zero-income, two-caretaker assistance unit (a two-parent case under 9 CCR 2503-6 3.604.2.B), under 3.606.1.F's Colorado Works Standards of Assistance Chart's "Two Caretakers" row, keyed by the number of dependent children (0-10).
