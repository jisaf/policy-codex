id: CO-3807
name: "Colorado Works: most consecutive days temporarily out of State"
identifier: cw_temporary_out_of_state_max_days
kind: parameter
type: whole number
scope: global
program: ColoradoWorks
meaning: "The most consecutive days a client may be temporarily out of State and still receive Colorado Works on the same basis as a client in the State (9 CCR 2503-6 3.604.2.O.1: \"shall not exceed ninety (90) consecutive days\")."
value: 90
sources: [S2602]
tags: [cash, tanf]
rationale: "Final cash review FC-1: 3.604.2.O.1 (S2602) states the ninety days; cw_meets_residency (CO-904) reads it."
