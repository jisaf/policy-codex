id: CO-3611
name: "Home Maintenance Allowance: household size of the guideline"
identifier: ma_home_maintenance_household_size
kind: parameter
type: whole number
scope: global
program: Medicaid
meaning: "The household size whose poverty guideline the Home Maintenance Allowance maximum reads (10 CCR 2505-10 § 8.100.7.V.3.g.ii.2.b, \"for a household of 1\")."
value: 1
sources: [S2404]
tags: [ma, ltc, income]
rationale: "Final verification F-3 (docs/reviews/final-medicaid-chp.md): ma_patient_payment (CO-658) deducted only the personal needs allowance, the community spouse and family allowances and every health insurance premium, in every month; 10 CCR 2505-10 § 8.100.7.V.3.b-i (S2400-S2405) lists further deductions and adds Long-Term Care insurance payments, and limits the Part B premium to the first two months. The guideline's household size as a parameter, not a literal table key."
