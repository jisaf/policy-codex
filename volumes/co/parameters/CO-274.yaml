id: CO-274
name: Colorado Works need standard by number of children (one caretaker)
identifier: cw_need_standard_table
kind: parameter
type: table keyed by household size
scope: global
program: ColoradoWorks
meaning: The monthly need standard an assistance unit's net countable income is compared against under 9 CCR 2503-6 3.606.1.F's Colorado Works Standards of Assistance Chart, for the "One Caretaker" row, keyed by the number of dependent children in the unit (key 0 is one caretaker with no children, key 1 is one caretaker with one child, and so on, through 10 children).
precision: "The chart states three separate rows (No Caretaker, One Caretaker, Two Caretakers), each keyed by number of children rather than total unit size. This table carries the One Caretaker row; cw_need_standard_table_no_caretaker (CO-351) and cw_need_standard_table_two_caretakers (CO-353) carry the other two, and cw_need_standard (CO-911) selects among the three by cw_unit_caretaker_count (CO-926). Re-keyed from household size (1-11) to number of children (0-10) under the fix-round C-5 finding, so the same key selects the matching row of all three tables; cw_deemed_parent_income_of_minor_parent (CO-909)'s size-1/zero-children lookup was updated from key 1 to key 0 to match. CDHS review B-5: SB 26-181 (D-171, S1800, approved and in effect June 2, 2026, S1801) amended C.R.S. 26-2-709(1)(b) so that no cost-of-living adjustment is applied to basic cash assistance for the State fiscal years beginning July 1, 2026 and July 1, 2027, and the annual increase of at least 2% resumes July 1, 2028; CDHS's proposed SFY 2026-27 increase (eDocket 2026-00094) was terminated as moot (S1804) and the Secretary of State's current version of 9 CCR 2503-6 is still the one effective July 1, 2025 (S1803). The chart therefore carries a version for SFY 2026-27 and 2027-28 with the same figures, ending June 30, 2028; a determination from July 1, 2028 has no figure until the State publishes the SFY 2028-29 chart (OQ-530)."
