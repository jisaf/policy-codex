rationale: "Receipt records, migration phase 2 (product-owner decision of 2026-11-23): CCCAP's one counting table, kind by kind, replacing the exclusions spread over unearned_income_prior_thirty_days (CO-3913, which subtracted a union of two programs' lists) and cccap_excluded_unearned_receipts (CO-4463)."
