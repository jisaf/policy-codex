id: CO-5720
name: "CCCAP: how each kind of receipt is treated"
identifier: cccap_receipt_treatment_table
kind: parameter
type: table keyed by option
options: [counted, counted_no_rule_excludes, counted_less_pass_set_aside, counted_child_support, counted_unless_cash_assistance, excluded, not_counted_open_question]
scope: global
program: CCCAP
meaning: "CCCAP's counting table for unearned income (8 CCR 1403-1 3.111.I, J), one row per kind of receipt. Counted, a paragraph of 3.111.I naming it: pension (I.6 railroad retirement, I.7.a-b, I.8), unemployment_compensation (I.26), tax_exempt_interest (I.10), interest_and_dividends (I.9, I.10, I.14), rental_income (I.12, I.17, net income: the expenses are cccap_excluded_unearned_receipts), workers_compensation (I.27), gambling_winnings (I.20, prizes), gi_bill_housing_food_allowance (I.7.c), refugee_resettlement (I.33, CARES refugee payments), americorps (I.32), va_aid_and_attendance (I.7.b), uniformed_services_special_pay (I.1, hazard duty pay), gift, charitable_need_based_cash and charitable_gift_life_threatening_condition (I.20, gifts). Counted with a rule of their own: social_security less the part set aside under a plan for self-support (counted_less_pass_set_aside: I.25; J.13); child_support and child_support_arrears (counted_child_support: I.29, and H.4.h-i for irregular and lump-sum child support; a protective services household does not count them, 3.119.A); colorado_works_diversion, counted unless it is cash assistance, which J.26 excludes (counted_unless_cash_assistance: 3.103.S makes a state diversion paid over four or more consecutive months cash assistance and a county diversion not; OQ-873). Counted because no rule excludes it (3.111.I does not name it and no paragraph of 3.111.J excludes it; the volume counts such a receipt, OQ-873's reading, and the CCCAP owner signs each of these rows): resource_liquidation, energy_assistance_other, property_or_food_tax_refund, crime_victim_compensation, reverse_mortgage, housing_utility_allowance, vocational_training_allowance, general_assistance, emergency_assistance, in_home_care_allowance, state_veteran_annuity, migrant_farmworker_emergency_assistance, other_taxable, other_nontaxable (inheritances, I.20; estates and trusts, I.11, I.16; maintenance, I.28; insurance and injury proceeds, I.21-22; and the rest no other kind names). Excluded, with its paragraph of 3.111.J: ssi (J.2), colorado_works_cash and adult_financial_cash (J.26), educational_assistance (J.16, J.19, J.20), loan (J.25), reimbursement (J.27), energy_assistance_federal (J.12, LEAP), income_tax_refund (J.14, the EIC), federally_excluded_payment (J.3, J.5-9, J.11, J.15, J.21), dvsa_title_i_volunteer_payment (J.11), foster_care_payment and kinship_care_payment (J.10), colorado_works_supportive_services (J.23), workforce_program_payment (J.17, J.18), home_care_allowance (J.24). Not counted pending an answer: sponsor_payment (OQ-992). Receipt records, migration phase 3 (kinds that were parts of other receipts before): military_allotment is counted (I.30, S4020: \"Military allotments\"); adoption_subsidy is excluded (J.10, S3257: \"Payments received from the county or state for providing foster care, kinship care, or for an adoption subsidy\") and early_childhood_research_payment (J.29), each taken out of the other unearned income by cccap_excluded_unearned_receipts until then; board_only_payment and room_only_payment are counted (I.18, S3256: \"Receipts from boarders or lodgers\"); savings_account_distribution is counted (I.8: 401(k), IRA and \"any other payment from an account meant to provide for a retired person\"; a health, education or development account distribution because no rule excludes it); school_attendance_conditional_benefit is excluded with the educational assistance it was part of (J.16, J.19, J.20); medicare_premium_refund and insurance_cash_value (I.21 names the proceeds of a life insurance policy, not its cash value) are counted because no rule excludes them, as they were before as part of the other unearned income; the CCCAP owner signs each."
precision: "Receipt records, migration phase 2 (docs/reviews/receipts-migration-2-cccap-sunbucks.md). Every kind has a row, and the type check refuses a lookup in a table that lacks one, so no kind is counted or left out by default. How a counted receipt is counted is the readers': a recurring receipt at its amount in the month (cccap_counted_recurring_receipts), a receipt paid once at one twelfth in the month received (cccap_one_time_receipts_averaged, 3.111.H.4.i), an irregular one under J.28's quarterly limit left out (cccap_excluded_irregular_income). Rows a paragraph names only in part or may name are OQ-990: J.12 names LEAP benefits, J.14 the EIC and J.27 reimbursements related to a settlement or lawsuit, and energy_assistance_federal, income_tax_refund and reimbursement are excluded whole, as the ledger excluded them before receipt records; J.20 (Perkins attendance-cost assistance) may reach a vocational training allowance and J.25 (loans) a reverse mortgage, which are counted. general_assistance and emergency_assistance are counted pending OQ-991 (J.26's \"public cash assistance grants including\" the named grants). Three rows the ledger excluded before receipt records are counted because no rule excludes them, since the receipts name their source apart from the excluded one: energy_assistance_other (J.12 names LEAP only), vocational_training_allowance (J.17 names training allowances under WIA only) and in_home_care_allowance (J.24 names the Home Care Allowance under the adult categories, home_care_allowance only). sponsor_payment was never read by CCCAP's income before receipt records (money_received_from_sponsor was stated outside the unearned income facts) and stays uncounted until OQ-992 is answered."
