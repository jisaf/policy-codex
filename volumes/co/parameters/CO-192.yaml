id: CO-192
name: MAGI income limit, Parents and Caretaker Relatives category, percent of FPL
identifier: ma_income_limit_parent_caretaker_pct
kind: parameter
type: rate
scope: global
program: Medicaid
meaning: Colorado's income limit for the Parents and Caretaker Relatives MAGI Medical Assistance category, expressed as a decimal fraction of the federal poverty level (MAGI-equivalent), under 10 CCR 2505-10 8.100.4.G.3.
precision: "A percentage-of-FPL figure (0.68 = 68%), compared directly against ma_magi_household_income_pct_fpl (CO-504). Phase 7: the current Secretary of State text of § 8.100.4.G.3 (D-65, S639) and CMS's eligibility levels table (D-73, S641) both state 68%; the 60% this item held came from the out-of-date Cornell copy (D-40, S203). Versioned in the phase 7 fix round (S-12; OQ-211, resolved): the § 8.100 version effective 04/14/2022 (D-78, S676) states the earlier figure and the version effective 06/30/2022 (D-77, S675) the current one, so the current figure runs from 2022-06-30; no earlier version was fetched, so the volume states no figure before 2022-04-14."
versions:
  - from: "2022-04-14"
    to: "2022-06-30"
    value: 0.60
    source: S676
  - from: "2022-06-30"
    value: 0.68
    source: S675
sources: [S675, S676, S639, S641, S203]
tags: [ma, magi, income, state_election]
rationale: "No existing item carries Colorado's Parents/Caretaker-category income percentage. ma_magi_income_standard_parent_caretaker (CO-541) needs it as a parameter rather than an inline digit (governance name.digits)."
