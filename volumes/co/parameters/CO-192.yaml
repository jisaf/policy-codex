rationale: "No existing item carries Colorado's Parents/Caretaker-category income percentage. ma_magi_income_standard_parent_caretaker (CO-541) needs it as a parameter rather than an inline digit (governance name.digits). Fix round: versioned from the HCPF chart (D-68/D-70) on the same reasoning as ma_income_limit_child_pct (CO-191, nearest same-shape item, acknowledged here), extended from G.2's explicit cross-reference to G.3 because the chart itself is a single document covering all four categories, not one this volume has any basis to read as children-only (see precision). History begins at D-70's effective date (2025-04-01) for the same reason CO-191 does not carry an earlier version."
