id: CO-192
name: MAGI income limit, Parents and Caretaker Relatives category, percent of FPL
identifier: ma_income_limit_parent_caretaker_pct
kind: parameter
type: rate
scope: global
program: Medicaid
meaning: Colorado's income limit for the Parents and Caretaker Relatives MAGI Medical Assistance category, expressed as a decimal fraction of the federal poverty level (MAGI-equivalent), under 10 CCR 2505-10 8.100.4.G.3.
precision: "A percentage-of-FPL figure (0.68 = 68%), compared directly against ma_magi_household_income_pct_fpl (CO-504). 8.100.4.G.3's own text states 60% and, unlike G.2 (S201), does not itself carry a 'Refer to the MAGI-Medicaid income guidelines chart' sentence (verified against the fetched S203 excerpt: it has none). The fix round's OQ-63 finding is nonetheless extended to this parameter, because the chart D-68/D-70 fetch (S564/S566) is not a children-only document - it is HCPF's single 'MAGI Medicaid Monthly Maximum Income Guidelines' chart, with one column per category including 'Parents & Caretaker Relatives 68% Poverty Level,' and G.3's own text already uses the same 'MAGI-equivalent' qualifier G.2 uses for the figure the chart converts. Reading the chart as the operative, MAGI-converted standard here and 60% as the pre-conversion floor is therefore the same inference the Children's category rests on, not a textual cross-reference this paragraph itself states - carried forward as part of OQ-63's rewrite rather than presented as settled by G.3's own text. Whether the 5% income disregard is already inside 68% is not stated by the chart, 8.100.4.D, or 42 CFR 435.603(d)(4) (D-3x); left modeled exactly as before."
