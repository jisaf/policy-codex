id: CO-5730
name: "SUN Bucks: how each kind of receipt is treated"
identifier: sebt_receipt_treatment_table
kind: parameter
type: table keyed by option
options: [tanf_assistance, not_read]
scope: global
program: SunBucks
meaning: "SUN Bucks' table of receipts (7 CFR 292.2, 292.5), one row per kind of receipt. Read as assistance under TANF, which makes a child of the household categorically eligible (292.2: \"one or more children in that household are receiving assistance under SNAP, TANF, or FDPIR\"): colorado_works_cash, Colorado Works basic cash assistance. Not read, every other kind: SUN Bucks counts no receipt, because a child who is not categorically eligible is tested on the household's income as its school meal or Summer EBT application reports it (292.5(a): \"income eligible for free or reduced-price school meals based on the Income Eligibility Guidelines\"; school_meal_household_income), not on the members' receipts. No row is counted because no rule excludes it. colorado_works_diversion and colorado_works_supportive_services are not read as assistance under TANF pending OQ-993 (9 CCR 2503-6 3.606.8.A: a diversion is a \"non-recurring cash payment\", and its receipt \"does not count toward their Federal TANF assistance time limit\")."
precision: "Receipt records, migration phase 2 (docs/reviews/receipts-migration-2-cccap-sunbucks.md). Every kind has a row, and the type check refuses a lookup in a table that lacks one. The categorical row replaces tanf_cash_income (CO-029), the one unearned-income fact SUN Bucks read (sebt_household_child_receives_snap_or_tanf, CO-2708, coverage review 2 N-3): a Colorado Works payment in a month of the period is receipt in that month. FDPIR and the other means-tested programs are read from their own records (sebt_other_categorical_basis), not from receipts."
