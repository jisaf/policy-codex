id: CO-5730
name: "SUN Bucks: how each kind of receipt is treated"
identifier: sebt_receipt_treatment_table
kind: parameter
type: table keyed by option
options: [tanf_assistance, not_read]
scope: global
program: SunBucks
meaning: "SUN Bucks' table of receipts (7 CFR 292.2, 292.5), one row per kind of receipt. Read as assistance under TANF, which makes a child of the household categorically eligible (292.2: \"one or more children in that household are receiving assistance under SNAP, TANF, or FDPIR\"): colorado_works_cash, Colorado Works basic cash assistance. Not read, every other kind: SUN Bucks counts no receipt, because a child who is not categorically eligible is tested on the household's income as its school meal or Summer EBT application reports it (292.5(a): \"income eligible for free or reduced-price school meals based on the Income Eligibility Guidelines\"; school_meal_household_income), not on the members' receipts. No row is counted because no rule excludes it. va_aid_and_attendance is not_read on these grounds: VA Aid and Attendance is not assistance under SNAP, TANF or FDPIR (292.2), and the income test reads the household's reported income, not its receipts (292.5(a)). colorado_works_diversion and colorado_works_supportive_services are not read as assistance under TANF pending OQ-993 (9 CCR 2503-6 3.606.8.A: a diversion is a \"non-recurring cash payment\", and its receipt \"does not count toward their Federal TANF assistance time limit\"). Receipt records, migration phase 3: the kinds that were parts of other receipts before (adoption_subsidy, early_childhood_research_payment, board_only_payment, room_only_payment, savings_account_distribution, medicare_premium_refund, insurance_cash_value, military_allotment, school_attendance_conditional_benefit) are not_read: none is assistance under SNAP, TANF or FDPIR (292.2). Earned-income records, step E0 (OQ-1020): uniformed_services_special_pay, board_only_payment and room_only_payment are earnings (docs/design-earned-and-resource-records.md 2.3); SUN Bucks reads no earnings, so their rows here stay not_read until the kinds leave receipts in E2. Coverage pass 4 S4-1: 45 CFR 260.31(b)(1) (S4603) excludes nonrecurrent, short-term benefits of four months or less from TANF assistance, which supports reading a diversion as not assistance; 260.30 confines that definition to 45 CFR 260-265, and 260.31(a)(3) would count supportive services to families not employed, so the colorado_works_supportive_services row stays the owners' choice (OQ-993). NM-KL-3 and NM-KL-1 (2026-11-24): title_iv_or_bie_student_aid, wioa_adult_or_dislocated_worker_payment and allowance_from_institutionalized_spouse are not read, as every kind but colorado_works_cash."
precision: "Receipt records, migration phase 2 (docs/reviews/receipts-migration-2-cccap-sunbucks.md). Every kind has a row, and the type check refuses a lookup in a table that lacks one. The categorical row replaces tanf_cash_income (CO-029), the one unearned-income fact SUN Bucks read (sebt_household_child_receives_snap_or_tanf, CO-2708, coverage review 2 N-3): a Colorado Works payment in a month of the period is receipt in that month. FDPIR and the other means-tested programs are read from their own records (sebt_other_categorical_basis), not from receipts. Records E2/H2 leftovers (2026-11-24, docs/reviews/records-e2-h2.md, section 5): the three receipt kinds that are earnings (uniformed_services_special_pay, board_only_payment, room_only_payment) left receipts (CO-5000), as design 2.3 planned, once no household or rule test stated a receipt copy of them; their rows went with them. The money is stated once, as an earnings record (CO-5100), and read through the program's earnings table. The text above that names the three rows is their history."
