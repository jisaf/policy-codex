id: CO-3614
name: "Patient payment: earned income reserve rate"
identifier: ma_ltc_earned_income_reserve_rate
kind: parameter
type: rate
scope: global
program: Medicaid
meaning: "The share of a Long-Term Care institution resident's earned income above ma_ltc_earned_income_reserve_base that counts toward the patient payment; the other share is kept (10 CCR 2505-10 § 8.100.7.V.3.f.ii.2, \"The result shall be divided in half\")."
value: 0.5
sources: [S2402, S2403]
tags: [ma, ltc, income]
rationale: "Final verification F-3 (docs/reviews/final-medicaid-chp.md): ma_patient_payment (CO-658) deducted only the personal needs allowance, the community spouse and family allowances and every health insurance premium, in every month; 10 CCR 2505-10 § 8.100.7.V.3.b-i (S2400-S2405) lists further deductions and adds Long-Term Care insurance payments, and limits the Part B premium to the first two months. The one-half figure as a parameter."
