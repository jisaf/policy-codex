id: CO-3848
name: "Adult Financial: positive tests in three months that end AND-SO"
identifier: af_and_so_positive_test_limit
kind: parameter
type: whole number
scope: global
program: AdultFinancial
meaning: "A client who tests positive for alcohol or a controlled substance this many times in any three-month period is terminated from AND-SO (9 CCR 2503-5 3.541.3.F: \"twice in any three-month period\"; C.R.S. 26-2-111(4)(e)(II))."
value: 2
sources: [S2616, S2617]
tags: [cash, and]
rationale: "Final cash review FC-7: 9 CCR 2503-5 3.541.3 (S2616) and C.R.S. 26-2-111(4)(e)-(f) (S2617) limit AND-SO for a client whose primary diagnosis is alcoholism or controlled substance addiction to twelve cumulative months in a lifetime, on condition of treatment and of not testing positive twice in any three-month period, and nothing in the volume stated it. The figure is a parameter."
