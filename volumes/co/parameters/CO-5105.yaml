id: CO-5105
name: "CCCAP: how each kind of earnings is treated"
identifier: cccap_earnings_treatment_table
kind: parameter
type: table keyed by option
options: [counted, counted_no_rule_excludes, counted_at_value, excluded, deducted, deducted_for_farm, not_deducted, not_deducted_no_rule_found]
scope: global
program: CCCAP
meaning: "CCCAP's counting table for earnings (8 CCR 1403-1 3.111.I-J), one row per kind of earnings record (earnings, CO-5100). Counted, a paragraph naming it: wages (3.111.I.1 (S486): gross earnings, salary, armed forces pay, commissions, tips and cash bonuses), uniformed_services_special_pay (3.111.I.1 (S486): armed forces pay, \"hazard duty pay\" among it), employer_vendor_payment (3.111.I.5 (S3255): vendor payments from funds that would otherwise be paid to the caretaker, part of the compensation for employment), self_employment_receipts (3.111.I.2 (S1157): declared gross income less verified business expenses), farm_self_employment_receipts (3.111.I.3 (S3263): gross receipts less operating expenses), boarder_payments (3.111.I.18 (S3256): \"Receipts from boarders or lodgers\", the gross receipts (cccap_other_countable_receipts, CO-4464)). Counted because no rule excludes it (3.111.I.1 counts gross earnings and no paragraph of 3.111.J excludes it; the CCCAP owner signs each of these rows): wioa_on_the_job_training, summer_youth_employment, scsep_employment, subsidized_employment, decennial_census_employment, difficulty_of_care_payment, employer_health_insurance_subsidy. Counted at value: in_kind_pay (3.111.I.4 (S3255): at cost or fair market value). Deducted for farm: business_cost_interest (3.111.I.3 (S3263): a farm's operating expenses, as CO-1709 reads them; I.2.a (S4106) does not name interest for other self-employment (the owner signs that half)). Excluded: work_study (3.111.J.16 (S2207)). Costs deducted: business_cost_operating (3.111.I.2.a (S4106), I.3 (S3263), when verified (cccap_self_employment_business_expenses, CO-1709)), business_cost_vehicle (3.111.I.2.a.5 (S4106): \"Mileage expense for business purposes only\"). Costs not deducted, a paragraph saying so: business_cost_capital_principal (3.111.I.2.b.2 (S4106)), business_cost_depreciation (3.111.I.2.b.1 (S4106)). Costs not deducted, no rule found either way (not_deducted_no_rule_found: today's items do not deduct the cost and no text on file names it; the CCCAP owner signs each row): business_cost_home_space, business_cost_boarder_provision (I.18 counts the receipts from boarders; today's items deduct no provision cost (the owner signs))."
precision: "Earned-income records, step E0 (docs/reviews/earnings-e0.md; docs/design-earned-and-resource-records.md 2.4): every row is today's reading, what the program's items do now with the scalar fact the kind restates (wages: wages_gross, less its parts below; uniformed_services_special_pay: the uniformed_services_special_pay receipt, and combat_zone_pay_received (part of wages_gross); work_study: work_study_earnings; wioa_on_the_job_training: wioa_on_the_job_training_wages; summer_youth_employment: summer_youth_employment_wages; scsep_employment: scsep_wages and scsep_payments_received; subsidized_employment: subsidized_employment_wages; decennial_census_employment: decennial_census_wages_received; difficulty_of_care_payment: difficulty_of_care_payments_received; in_kind_pay: in_kind_compensation_value; employer_vendor_payment: employer_vendor_payments_received; employer_health_insurance_subsidy: employer_health_insurance_subsidy_received; self_employment_receipts: self_employment_gross_receipts; farm_self_employment_receipts: self_employment_gross_receipts of a farm (self_employment_is_farming, self_employment_is_farm_operation); boarder_payments: room_and_board_payments_received, and the board_only_payment and room_only_payment receipts; business_cost_operating: self_employment_operating_costs; business_cost_interest: self_employment_interest_costs; business_cost_capital_principal: self_employment_capital_principal_payments; business_cost_depreciation: no fact (a new kind); business_cost_home_space: self_employment_home_business_space_costs; business_cost_vehicle: self_employment_business_vehicle_costs; business_cost_boarder_provision: room_and_board_provision_costs), so the table changes no answer when the CCCAP E1 track moves its readers onto it; no rule reads it during E0. Every kind has a row, and the type check refuses a lookup in a table that lacks one, so no kind is counted or left out by default; a new kind is added to every earnings table at once by the integration owner (design 4.3, rule 2), and a track changes only its own table's cells. A property of a pay (irregular, temporary_job, the job's dates, combat_zone, annual_contract_pay, pass_set_aside) is a field the program's items read beside the row, not a row. Rows marked for the owner's signature are listed in docs/reviews/earnings-e0.md."
