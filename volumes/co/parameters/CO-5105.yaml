id: CO-5105
name: "CCCAP: how each kind of earnings is treated"
identifier: cccap_earnings_treatment_table
kind: parameter
type: table keyed by option
options: [counted, counted_no_rule_excludes, counted_at_value, counted_other_income, counted_self_employment, excluded, deducted, deducted_for_farm, not_deducted, not_deducted_no_rule_found, counted_unless_foster_care]
scope: global
program: CCCAP
meaning: "CCCAP's counting table for earnings (8 CCR 1403-1 3.111.I-J), one row per kind of earnings record (earnings, CO-5100). Counted as wages, a paragraph naming it: wages (3.111.I.1 (S486): gross earnings, salary, armed forces pay, commissions, tips and cash bonuses), uniformed_services_special_pay (3.111.I.1 (S486): armed forces pay, \"hazard duty pay\" among it), wioa_on_the_job_training (3.111.I.31 (S4020): \"Workforce innovation opportunity act (WIOA) wages earned in work experience or on the-job training\"). Counted as wages because no rule excludes it (3.111.I.1 counts gross earnings and no paragraph of 3.111.J excludes it; the CCCAP owner signs each of these rows): summer_youth_employment, scsep_employment, subsidized_employment, decennial_census_employment, employer_health_insurance_subsidy. Counted at value, as other income: in_kind_pay (3.111.I.4 (S3255): at cost or fair market value, \"counted as other income\"). Counted as other income: employer_vendor_payment (3.111.I.5 (S3255): vendor payments from funds that would otherwise be paid to the caretaker, part of the compensation for employment), boarder_payments (3.111.I.18 (S3256): \"Receipts from boarders or lodgers\", the gross receipts) (cccap_other_countable_receipts, CO-4464). Counted as self-employment: self_employment_receipts (3.111.I.2 (S1157): declared gross income less verified business expenses), farm_self_employment_receipts (3.111.I.3 (S3263): gross receipts less operating expenses) (cccap_self_employment_net_earnings, CO-1710). Deducted for farm: business_cost_interest (3.111.I.3 (S3263): a farm's operating expenses, as CO-1709 reads them; I.2.a (S4106) does not name interest for other self-employment (the owner signs that half)). Excluded: work_study (3.111.J.16 (S2207)). Costs deducted: business_cost_operating (3.111.I.2.a (S4106), I.3 (S3263), when verified (cccap_self_employment_business_expenses, CO-1709)), business_cost_vehicle (3.111.I.2.a.5 (S4106): \"Mileage expense for business purposes only\"). Costs not deducted, a paragraph saying so: business_cost_capital_principal (3.111.I.2.b.2 (S4106)), business_cost_depreciation (3.111.I.2.b.1 (S4106)). Costs not deducted, no rule found either way (not_deducted_no_rule_found: no text on file names the cost; the CCCAP owner signs each row): business_cost_home_space, business_cost_boarder_provision (I.18 counts the receipts from boarders; no paragraph deducts the cost of providing the room or meals (the owner signs)). Coverage pass 4 X4-2 (docs/reviews/coverage4-care-energy.md): difficulty_of_care_payment is counted_unless_foster_care: 3.111.J.10 (S3257) excludes \"Payments received from the county or state for providing foster care, kinship care, or for an adoption subsidy\", which a difficulty of care payment for a person placed in foster care is, and no paragraph excludes one for a person on a Home and Community Based Services waiver; the record's foster_care field says which (cccap_person_earned_income CO-3915, cccap_irregular_earnings CO-6150; cccap_person_gross_wages CO-5152 reads it before exclusions). summer_youth_employment stays counted: J.18 (S3257) names the youth programs \"under the Youth Employment and Demonstration Project Act\", which a summer youth employment program under another act is not, and I.1 counts gross earnings."
precision: "Earned-income records, step E0 (docs/reviews/earnings-e0.md; docs/design-earned-and-resource-records.md 2.4) set every row to the reading of the items before the records; step E1 (CCCAP; docs/reviews/records-earnings-care-energy.md) moved CCCAP's readers onto the table: cccap_person_earned_income (CO-3915) reads the rows counted and counted_no_rule_excludes; cccap_person_gross_wages (CO-5152) those and excluded (the gross wage the minimum-wage test divides, work-study included); cccap_other_countable_receipts (CO-4464) the rows counted_at_value and counted_other_income; cccap_self_employment_gross_receipts (CO-5156) and cccap_self_employment_net_earnings (CO-1710) the rows counted_self_employment; cccap_self_employment_business_expenses (CO-1709) the rows deducted, and deducted_for_farm for a farm's cost; cccap_irregular_earnings (CO-6150) every counted row but self-employment (J.28). E1 changed these rows: wioa_on_the_job_training from counted_no_rule_excludes to counted (3.111.I.31 names it; no change of reading), employer_vendor_payment and boarder_payments from counted to counted_other_income and the business rows from counted to counted_self_employment (a name for the reader; no change of reading). The kinds that left the receipts (uniformed_services_special_pay, and boarder payments for a room only or meals only; design 2.3, OQ-1020) are read here and not in cccap_receipt_treatment_table (CO-5720), whose rows for them read counted_in_earnings. Every kind has a row, and the type check refuses a lookup in a table that lacks one, so no kind is counted or left out by default; a new kind is added to every earnings table at once by the integration owner (design 4.3, rule 2), and a track changes only its own table's cells. A property of a pay (irregular, temporary_job, the job's dates, combat_zone, annual_contract_pay, pass_set_aside, hours) is a field the program's items read beside the row, not a row. Rows marked for the owner's signature are listed in docs/reviews/earnings-e0.md, section 7, and docs/reviews/records-earnings-care-energy.md."
