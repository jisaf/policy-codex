rationale: 8 CCR 1403-1 3.111.H.2 (S485) states the monthly 100% FPG dollar figures directly, effective October 1, 2024, unlike the SNAP and Medicaid poverty guideline tables which are annual; cccap_income_within_entry_limit (CO-986) multiplies this table by the supplied county entry percentage (CO-870) to compute the county's entry income limit. The Colorado SOS current edition (D-76) carries a "Through September 30, 2026" table (S582) immediately before the October 1, 2026 table (S581) this fix round already versions; D-76's own revision history states "Rules 3.111 F, 3.111 H eff. 09/14/2025" (OQ-179), so this now closes the 2024-10-01 version at that stated amendment date and adds the intermediate table as its own version rather than leaving the two-tier gap OQ-179 previously flagged.
