id: CO-323
name: CCCAP monthly federal poverty guideline by household size
identifier: cccap_poverty_guideline_table
kind: parameter
type: table keyed by household size
scope: global
program: CCCAP
meaning: The monthly 100% federal poverty guideline dollar amount by household size, the base the CCCAP county entry income limit percentage is applied to.
precision: Monthly dollars, sizes 1-8; sizes above 8 add cccap_poverty_guideline_each_additional per additional member. The text states these as the 100% FPG figures effective October 1, 2024, then (per D-76's revision history, 3.111.H amended effective 09/14/2025) a middle table effective through September 30, 2026, and the Colorado SOS current edition (D-76, effective 08/14/2026) restates the same table effective October 1, 2026 with higher figures still (3.111.H.2-3).
