rationale: "8 CCR 1403-1 3.111.H.2 (S485) states the monthly 100% FPG dollar figures directly, effective October 1, 2024, unlike the SNAP and Medicaid poverty guideline tables which are annual; cccap_income_within_entry_limit (CO-986) multiplies this table by the supplied county entry percentage (CO-870) to compute the county's entry income limit. Phase 8 adds the two tables of 8 CCR 1403-1 3.111.H.2-3 effective 2026-08-14 (D-87): the one stated 'Through September 30, 2026' (S780), versioned from the start of that federal fiscal year (the rule states only its end), and the one 'Effective October 1, 2026' (S781)."
