id: CO-1515
name: SNAP ABAWD time limit clock start month
identifier: snap_abawd_clock_start_month
kind: parameter
type: month
scope: global
program: SNAP
meaning: The month Colorado's fixed ABAWD (able-bodied adult without dependents) time limit clock started - July 2023 - from which the clock resets accrued countable months and ABAWD disqualifications for all ABAWDs every thirty-six calendar months (July 2023, July 2026, July 2029, ...), per 10 CCR 2506-1 4.311.3.C.2.
versions:
  - from: "2023-07-01"
    value: "2023-07"
    source: S1014
sources: [S1014]
tags: [abawd, state_election]
rationale: "No existing parameter states the start of Colorado's fixed ABAWD clock (phase-8 review K-6); snap_abawd_countable_months_in_period (CO-417) counted a rolling 36 months. 7 CFR 273.24(b)(3) leaves the State to choose a fixed or rolling clock; 4.311.3.C.2 (S1014) chose the fixed clock. The 36-month length stays snap_abawd_period_months (CO-170)."
nearest: [CO-170]
