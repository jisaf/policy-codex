id: CO-5500
name: "Medicaid MAGI: how each kind of receipt is treated"
identifier: ma_magi_receipt_treatment_table
kind: parameter
type: table keyed by option
options: [counted, counted_no_rule_excludes, counted_taxable_amount, counted_winnings, excluded, not_taxable_income, in_earnings]
scope: global
program: Medicaid
meaning: "Medicaid's counting table for MAGI-based income (42 CFR 435.603(e): \"income calculated using the same financial methodologies used to determine modified adjusted gross income as defined in section 36B(d)(2)(B) of the Code\", S165; 10 CCR 2505-10 8.100.4.C.1, S166), one row per kind of receipt. Counted, a paragraph of 8.100.4.C.1 naming it: social_security (b.xi and c.iii, \"whether or not taxable\"), pension (b.vi), tax_exempt_interest (b.i, c.i), interest_and_dividends (b.i, b.iv), rental_income (b.ii, b.iii royalties), other_taxable (b.v alimony under a divorce or separation executed before 2019, b.x an estate or trust). Counted because no rule excludes it (federally taxable, so in adjusted gross income, and no paragraph of 8.100.4.C.1.d excludes it; the Medicaid owner signs the row): unemployment_compensation. Special: gambling_winnings is counted in the month received and, for the winner, spread over months by amount (b.xiv, S669; ma_magi_gambling_receipts, CO-5502). Excluded, with its paragraph of 8.100.4.C.1.d: child_support and child_support_arrears (iii, \"Child support received\"), workers_compensation (iv), ssi (v), va_aid_and_attendance, gi_bill_housing_food_allowance and state_veteran_annuity (vi, \"Veteran's Benefits\"), educational_assistance (ii, \"Scholarships, awards, or fellowship grants used for educational purposes and not for living expenses\"). Not counted because no rule counts it (not in adjusted gross income under the Code and not among the additions of 8.100.4.C.1.c, so not MAGI-based income under 435.603(e); the Medicaid owner signs each row, as for a row counted by silence): colorado_works_cash, adult_financial_cash, resource_liquidation, loan, reimbursement, energy_assistance_federal, energy_assistance_other, income_tax_refund, property_or_food_tax_refund, federally_excluded_payment, dvsa_title_i_volunteer_payment, crime_victim_compensation, foster_care_payment, kinship_care_payment, colorado_works_diversion, colorado_works_supportive_services, reverse_mortgage, housing_utility_allowance, refugee_resettlement, americorps, workforce_program_payment, vocational_training_allowance, general_assistance, emergency_assistance, in_home_care_allowance, home_care_allowance, charitable_need_based_cash, charitable_gift_life_threatening_condition, gift, sponsor_payment, migrant_farmworker_emergency_assistance, other_nontaxable. CHP+ reads this table only through ma_magi_household_income, by the adopted-method link its readers declare (10 CCR 2505-3 150.1, S245: income \"shall be determined as required in 10 CCR 2505-10-8.100.4.C\"); it keeps no table of its own. Receipt records, migration phase 3 (kinds that were parts of other receipts before): school_attendance_conditional_benefit is excluded (d.ii, d.vi, as the educational assistance and veterans' benefits it was part of); early_childhood_research_payment is counted because no rule excludes it (taxable income under the Code that no paragraph of 8.100.4.C.1.d excludes, as the other taxable income it was part of was counted); adoption_subsidy, medicare_premium_refund and military_allotment are not counted because no rule counts them (not in adjusted gross income and not among the additions of 8.100.4.C.1.c, as the other non-taxable income they were part of was not); the Medicaid owner signs each. Counted at the taxable amount (counted_taxable_amount; coverage pass 4, C4-01 and C4-09): savings_account_distribution and insurance_cash_value, at the part of the payment in federal gross income as the record states it (taxable_amount, CO-5000), since 8.100.4.C.1 counts gross income \"pursuant to 26 U.S.C. § 61\" (S166, S4631) and each kind holds money the Code counts and money it does not: a distribution from a traditional retirement account is gross income (b.vi, \"Pensions and annuities\"), and a distribution from a health savings account used only for qualified medical expenses, a qualified Roth IRA distribution and a tuition program distribution within the qualified higher education expenses are not (26 U.S.C. 223(f)(1), S4633; 408A(d)(1), S4634; 529(c)(3)(B), S4635); cash value taken from a life insurance policy is counted as the income from the contract the return includes (b.vii, \"Income from life insurance and endowment contracts\"; 26 U.S.C. 61(a)(9), S4631), where before it was not counted at all. A record of either kind that does not state its taxable amount cannot be counted (required where read; decision 4 of 2026-11-23). Earned-income records, step E0 (OQ-1020): uniformed_services_special_pay, board_only_payment and room_only_payment are earnings (docs/design-earned-and-resource-records.md 2.3); their rows here are kept, with the reading they have, until Medicaid reads its earnings table (ma_magi_earnings_treatment_table, CO-5106, which carries the same reading), and the kinds leave receipts in E2. Earned-income records, step E1 (Medicaid and CHP+): Medicaid reads its earnings table, so uniformed_services_special_pay, board_only_payment and room_only_payment are in_earnings here (read from the earnings records through ma_magi_earnings_treatment_table, CO-5106, and not counted here, so the translator's transition copy is never counted twice)."
precision: "Receipt records, migration phase 2 (docs/reviews/receipts-migration-2-medicaid.md). Every kind has a row, and the type check refuses a lookup in a table that lacks one. A receipt is counted in the month received, a receipt paid once only in that month (435.603(e)(1); 8.100.4.C.1.d.i), so a retroactive Social Security payment counts, in full, in the month it is paid. The gross amount is counted: MAGI follows the federal tax figure, and no earmark of the receipt (a PASS set-aside, a recoupment, a former spouse's share) is a deduction of 8.100.4.C.1.e. The rows not counted because no rule counts them are the kinds the ledger left out before receipt records because their old facts were part of other_unearned_income_nontaxable (CO-030) or named a non-taxable payment; whether AmeriCorps living allowances, workforce or vocational training allowances and uniformed services special pay are federally taxable, and so MAGI income, is OQ-970. Alimony under a divorce or separation executed after 2018 (b.v: \"will not be countable income\") is other_nontaxable."
