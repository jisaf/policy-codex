id: CO-5500
name: "Medicaid MAGI: how each kind of receipt is treated"
identifier: ma_magi_receipt_treatment_table
kind: parameter
type: table keyed by option
options: [counted, counted_no_rule_excludes, counted_net_of_repayments_and_others_benefits, counted_taxable_amount, counted_taxable_amount_where_stated, counted_stated_taxable_amount_only, counted_taxable_living_expense_part, counted_winnings, excluded, not_taxable_income, in_earnings]
scope: global
program: Medicaid
meaning: "Medicaid's counting table for MAGI-based income (42 CFR 435.603(e): \"income calculated using the same financial methodologies used to determine modified adjusted gross income as defined in section 36B(d)(2)(B) of the Code\", S165; 10 CCR 2505-10 8.100.4.C.1, S166), one row per kind of receipt. Counted, a paragraph of 8.100.4.C.1 naming it: social_security (b.xi and c.iii, \"whether or not taxable\"; counted_net_of_repayments_and_others_benefits, below), tax_exempt_interest (b.i, c.i), interest_and_dividends (b.i, b.iv), rental_income (b.ii, b.iii royalties), other_taxable (b.v alimony under a divorce or separation executed before 2019, b.x an estate or trust). Counted because no rule excludes it (federally taxable, so in adjusted gross income, and no paragraph of 8.100.4.C.1.d excludes it; the Medicaid owner signs the row): unemployment_compensation, and americorps (coverage pass 4, C4-11, OQ-970 settled for AmeriCorps: 26 U.S.C. 61(a), S4631, counts all income \"Except as otherwise provided\", compensation for services included, and no Code section on file excludes an AmeriCorps living allowance, stipend or award; 42 U.S.C. 12637(d), S4640, keeps them out of income for need-based programs \"other than as provided under the Social Security Act\", and Medicaid is such a program, whose income rule is MAGI, 42 U.S.C. 1396a(e)(14)(A), S4630; before, not counted). Special: gambling_winnings is counted in the month received and, for the winner, spread over months by amount (b.xiv, S669; ma_magi_gambling_receipts, CO-5502). Excluded, with its paragraph of 8.100.4.C.1.d: child_support and child_support_arrears (iii, \"Child support received\"), workers_compensation (iv), ssi (v), va_aid_and_attendance, gi_bill_housing_food_allowance and state_veteran_annuity (vi, \"Veteran's Benefits\"),. Educational assistance (coverage pass 7, C7-03) is counted_taxable_living_expense_part: d.ii excludes \"Scholarships, awards, or fellowship grants used for educational purposes and not for living expenses\", so the part used for living expenses is not excluded by it, and C.1 counts it as far as it is gross income \"pursuant to 26 U.S.C. § 61\" (S166, S4631): the record states the part used for living expenses (for_living_expenses, CO-5000) and the part in federal gross income (taxable_amount), and the row counts the smaller, the living-expense part that is gross income (an educational loan is not income, its taxable part 0); before, the row was excluded, so a grant that pays room and board was never counted (SCHOLAR-LIVING: November 1,200 + 2,500 = 3,700, 278.2%, was 1,200, 90.2%). Both fields are required where read; 0 for living expenses needs no taxable amount, and a taxable amount of 0 needs no living-expense part (coverage verification 7, V7-3: the reader tests the taxable amount first, so a tuition-only grant or an educational loan stated with taxable_amount 0 counts 0 without for_living_expenses). Not counted because no rule counts it (not in adjusted gross income under the Code and not among the additions of 8.100.4.C.1.c, so not MAGI-based income under 435.603(e); the Medicaid owner signs each row, as for a row counted by silence): colorado_works_cash, adult_financial_cash, resource_liquidation, loan, reimbursement, energy_assistance_federal, energy_assistance_other, property_or_food_tax_refund, federally_excluded_payment, dvsa_title_i_volunteer_payment, crime_victim_compensation, foster_care_payment, kinship_care_payment, colorado_works_diversion, colorado_works_supportive_services, reverse_mortgage, housing_utility_allowance, refugee_resettlement, workforce_program_payment, vocational_training_allowance, general_assistance, emergency_assistance, in_home_care_allowance, home_care_allowance, charitable_need_based_cash, charitable_gift_life_threatening_condition, gift, sponsor_payment, migrant_farmworker_emergency_assistance, other_nontaxable; dvsa_title_i_volunteer_payment is not counted for another reason than the others: a VISTA living allowance is compensation the Code counts (26 U.S.C. 61(a)(1)), but 42 U.S.C. 5044(f)(1) (S4880; coverage pass 5, C5-15) provides that \"Notwithstanding any other provision of law ... payments to volunteers under this chapter shall not in any way reduce or eliminate the level of or eligibility for assistance or services ... under any governmental program\" below the minimum wage, which reaches Medicaid (its treatment not_taxable_income is kept, the answer being the same, and this sentence is its reason; at or above the minimum wage the payment is dvsa_title_i_payment_at_or_above_minimum_wage, counted). CHP+ reads this table only through ma_magi_household_income, by the adopted-method link its readers declare (10 CCR 2505-3 150.1, S245: income \"shall be determined as required in 10 CCR 2505-10-8.100.4.C\"); it keeps no table of its own. Receipt records, migration phase 3 (kinds that were parts of other receipts before): school_attendance_conditional_benefit is excluded (d.ii, d.vi, as the educational assistance and veterans' benefits it was part of); early_childhood_research_payment is counted because no rule excludes it (taxable income under the Code that no paragraph of 8.100.4.C.1.d excludes, as the other taxable income it was part of was counted); adoption_subsidy, medicare_premium_refund and military_allotment are not counted because no rule counts them (not in adjusted gross income and not among the additions of 8.100.4.C.1.c, as the other non-taxable income they were part of was not); the Medicaid owner signs each. Counted at the taxable amount (counted_taxable_amount; coverage pass 4, C4-01 and C4-09): savings_account_distribution and insurance_cash_value, at the part of the payment in federal gross income as the record states it (taxable_amount, CO-5000), since 8.100.4.C.1 counts gross income \"pursuant to 26 U.S.C. § 61\" (S166, S4631) and each kind holds money the Code counts and money it does not: a distribution from a traditional retirement account is gross income (b.vi, \"Pensions and annuities\"), and a distribution from a health savings account used only for qualified medical expenses, a qualified Roth IRA distribution and a tuition program distribution within the qualified higher education expenses are not (26 U.S.C. 223(f)(1), S4633; 408A(d)(1), S4634; 529(c)(3)(B), S4635); cash value taken from a life insurance policy is counted as the income from the contract the return includes (b.vii, \"Income from life insurance and endowment contracts\"; 26 U.S.C. 61(a)(9), S4631), where before it was not counted at all. A record of either kind that does not state its taxable amount cannot be counted (required where read; decision 4 of 2026-11-23). Earned-income records, step E0 (OQ-1020): uniformed_services_special_pay, board_only_payment and room_only_payment are earnings (docs/design-earned-and-resource-records.md 2.3); their rows here are kept, with the reading they have, until Medicaid reads its earnings table (ma_magi_earnings_treatment_table, CO-5106, which carries the same reading), and the kinds leave receipts in E2. Earned-income records, step E1 (Medicaid and CHP+): Medicaid reads its earnings table, so uniformed_services_special_pay, board_only_payment and room_only_payment are in_earnings here (read from the earnings records through ma_magi_earnings_treatment_table, CO-5106, and not counted here, so the translator's transition copy is never counted twice). Coverage pass 4 C4-5: dvsa_title_i_payment_at_or_above_minimum_wage is counted because no MAGI exclusion on file reaches a VISTA living allowance at or above the minimum wage; before the kind existed it was stated as other_taxable, counted (a row for the owner's signature). Coverage pass 5, C5-09 (2026-11-23; OQ-1230 settled by the Code): pension (b.vi, \"Pensions and annuities\") is counted_taxable_amount_where_stated: the part of the payment in federal gross income where the record states it (taxable_amount, CO-5000), else the whole amount, since 26 U.S.C. 61(a)(8) and (10) (S4631) make annuities and pensions gross income and the Code excludes a part only as 72(b)(1) (S4637: the part that returns the investment in the contract) and 104(a)(4) (S4638: a pension for injuries or sickness resulting from active service in the armed forces) provide, which the return, and so the record, states. income_tax_refund is counted_stated_taxable_amount_only: the part the record states is in federal gross income, else nothing, since a refund of tax is gross income only as the recovery of an amount deducted in an earlier year, and only to the extent the deduction reduced the tax (26 U.S.C. 111(a), S4639: \"Gross income does not include income attributable to the recovery ... to the extent such amount did not reduce the amount of tax\"), which only the record can state (a federal income tax refund is never deductible, so never taxable). Neither field is required: an unstated taxable part has the meaning the Code gives the kind. Field sweep (coverage pass 5, docs/reviews/field-sweep-magi.md): social_security is counted_net_of_repayments_and_others_benefits: the amount less the part withheld to recover an earlier overpayment (recouped, CO-5000) and less the part received for a person who does not live with the person (for_person_living_elsewhere), since MAGI counts social security benefits as 26 U.S.C. 86 defines them (36B(d)(2)(B), S165): \"any amount received by the taxpayer by reason of entitlement\" to a Title II benefit (86(d)(1), S4881), so not a benefit received for another person's entitlement, and \"reduced by any repayment made by the taxpayer during the taxable year of a social security benefit previously received\" (86(d)(2)(A)), which a recoupment is."
precision: "Receipt records, migration phase 2 (docs/reviews/receipts-migration-2-medicaid.md). Every kind has a row, and the type check refuses a lookup in a table that lacks one. A receipt is counted in the month received, a receipt paid once only in that month (435.603(e)(1); 8.100.4.C.1.d.i), so a retroactive Social Security payment counts, in full, in the month it is paid. The gross amount is counted: MAGI follows the federal tax figure, and no earmark of the receipt (a PASS set-aside, a recoupment, a former spouse's share) is a deduction of 8.100.4.C.1.e. The rows not counted because no rule counts them are the kinds the ledger left out before receipt records because their old facts were part of other_unearned_income_nontaxable (CO-030) or named a non-taxable payment; whether workforce or vocational training allowances are MAGI income is OQ-970 (AmeriCorps settled, coverage pass 4; uniformed services special pay is earnings, OQ-1024). Alimony under a divorce or separation executed after 2018 (b.v: \"will not be countable income\") is other_nontaxable."
