xcludes, board_only_payment: counted_no_rule_excludes, room_only_payment: counted_no_rule_excludes, savings_account_distribution: counted_no_rule_excludes, medicare_premium_refund: not_taxable_income, insurance_cash_value: not_taxable_income, military_allotment: not_taxable_income, school_attendance_conditional_benefit: excluded, other_taxable: counted, other_nontaxable: not_taxable_income}, source: S166}
