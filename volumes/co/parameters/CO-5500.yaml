tags: [ma, magi, income]
open: [OQ-970, OQ-1020]
rationale: "Receipt records, migration phase 2 (product-owner decision of 2026-11-23): Medicaid's MAGI counting table, kind by kind, replacing the sum of the scalar unearned income facts that ma_person_magi_income (CO-502) read (social_security_income, pension_income, unemployment_income, other_unearned_income_taxable, tax_exempt_interest). The SSI method has its own table (ma_ssi_receipt_treatment_table): the two methods count different money (MAGI follows the federal tax figure; the SSI method 20 CFR 416 Subpart K as 8.100.5.F adopts it)."
