id: CO-5101
name: "SNAP: how each kind of earnings is treated"
identifier: snap_earnings_treatment_table
kind: parameter
type: table keyed by option
options: [counted, counted_no_rule_excludes, counted_loss_offset, counted_above_boarder_allowance, excluded, excluded_in_combat_zone, excluded_under_19_with_parent, not_counted_text_counts, deducted, deducted_from_boarder_payments, not_deducted, not_deducted_no_rule_found]
scope: global
program: SNAP
meaning: "SNAP's counting table for earnings (10 CCR 2506-1 4.403-4.405 and 7 CFR 273.9, 273.11), one row per kind of earnings record (earnings, CO-5100). Counted, a paragraph naming it: wages (7 CFR 273.9(b)(1)(i), S41: \"All wages and salaries of an employee\"), self_employment_receipts (4.403.11 (S1152), less the costs the cost rows deduct (snap_self_employment_income, CO-1702)). Counted because no rule excludes it (7 CFR 273.9(b)(1) counts all wages and salaries and 4.405 excludes only the sources it lists (S1620); the SNAP owner signs each of these rows): subsidized_employment, decennial_census_employment, difficulty_of_care_payment, employer_health_insurance_subsidy. Counted loss offset: farm_self_employment_receipts (4.403.12.E (S2510) and 7 CFR 273.11(a)(2)(ii) (S2511): counted less the costs, a loss offset against other income when the farm's annual gross is at least snap_self_employed_farmer_annual_gross_minimum (snap_farm_self_employment_loss, CO-3722)). Counted above boarder allowance: boarder_payments (4.403.2 (S2963): self-employment income less the cost of doing business, the greater of the maximum allotment for the boarders and the provision costs (snap_boarder_income, CO-4165); foster care boarders' payments are not counted). Excluded in combat zone: uniformed_services_special_pay (4.405.2.A.12 (S3109) excludes combat pay; special pay received outside a combat zone is counted because no rule excludes it, as SNAP's receipt row counts it today (the SNAP owner signs that half)). Excluded under 19 with parent: wioa_on_the_job_training (4.405.2.A.6, 4.403.B.2 (S3108): excluded for a member under snap_wioa_ojt_exclusion_age_limit who lives with a parent or is under an adult member's parental control, counted otherwise). Deducted from boarder payments: business_cost_boarder_provision (4.403.2 (S2963), the boarder rule above). Excluded: work_study (4.403.A.1, 4.405.1 (S2204)), summer_youth_employment (4.405.2.A.6 (S3108), as snap_excluded_earned_income (CO-2338) reads it), scsep_employment (4.405.2.A.9 (S3109)), in_kind_pay (7 CFR 273.9(c)(1) (S4101): in-kind benefits are not money payable to the household, and housing an employer provides in addition to wages is not counted ((c)(1)(vii)(B)); today's items do not read in_kind_compensation_value). Not counted although the text on file counts it (not_counted_text_counts: today's reading, kept so this step changes no answer; a finding for the SNAP track, which fixes it as a cited difference): employer_vendor_payment (7 CFR 273.9(c)(1)(vii)(B) (S4101) counts wages an employer diverts to a third party for a household expense, which is what the kind states; today's items do not read employer_vendor_payments_received (CO-4455), so SNAP counts none of it (OQ-1021)). Costs deducted: business_cost_operating (4.403.11.A (S1152), 7 CFR 273.11(b)(1) (S4102)), business_cost_interest (7 CFR 273.11(b)(1) (S4102): \"interest paid to purchase income-producing property\"), business_cost_capital_principal (7 CFR 273.11(b)(1) (S4102): \"payments on the principal of the purchase price of income-producing real estate and capital assets\"). Costs not deducted, a paragraph saying so: business_cost_depreciation (7 CFR 273.11(b)(2)(iii) (S1153)). Costs not deducted, no rule found either way (not_deducted_no_rule_found: today's items do not deduct the cost and no text on file names it; the SNAP owner signs each row): business_cost_home_space, business_cost_vehicle."
precision: "Earned-income records, step E0 (docs/reviews/earnings-e0.md; docs/design-earned-and-resource-records.md 2.4): every row is today's reading, what the program's items do now with the scalar fact the kind restates (wages: wages_gross, less its parts below; uniformed_services_special_pay: the uniformed_services_special_pay receipt, and combat_zone_pay_received (part of wages_gross); work_study: work_study_earnings; wioa_on_the_job_training: wioa_on_the_job_training_wages; summer_youth_employment: summer_youth_employment_wages; scsep_employment: scsep_wages and scsep_payments_received; subsidized_employment: subsidized_employment_wages; decennial_census_employment: decennial_census_wages_received; difficulty_of_care_payment: difficulty_of_care_payments_received; in_kind_pay: in_kind_compensation_value; employer_vendor_payment: employer_vendor_payments_received; employer_health_insurance_subsidy: employer_health_insurance_subsidy_received; self_employment_receipts: self_employment_gross_receipts; farm_self_employment_receipts: self_employment_gross_receipts of a farm (self_employment_is_farming, self_employment_is_farm_operation); boarder_payments: room_and_board_payments_received, and the board_only_payment and room_only_payment receipts; business_cost_operating: self_employment_operating_costs; business_cost_interest: self_employment_interest_costs; business_cost_capital_principal: self_employment_capital_principal_payments; business_cost_depreciation: no fact (a new kind); business_cost_home_space: self_employment_home_business_space_costs; business_cost_vehicle: self_employment_business_vehicle_costs; business_cost_boarder_provision: room_and_board_provision_costs), so the table changes no answer when the SNAP E1 track moves its readers onto it; no rule reads it during E0. Every kind has a row, and the type check refuses a lookup in a table that lacks one, so no kind is counted or left out by default; a new kind is added to every earnings table at once by the integration owner (design 4.3, rule 2), and a track changes only its own table's cells. A property of a pay (irregular, temporary_job, the job's dates, combat_zone, annual_contract_pay, pass_set_aside) is a field the program's items read beside the row, not a row. Rows marked for the owner's signature are listed in docs/reviews/earnings-e0.md."
