id: CO-5101
name: "SNAP: how each kind of earnings is treated"
identifier: snap_earnings_treatment_table
kind: parameter
type: table keyed by option
options: [counted, counted_no_rule_excludes, counted_less_costs, counted_loss_offset, counted_above_boarder_allowance, excluded, excluded_in_kind, excluded_in_combat_zone, excluded_under_19_with_parent, deducted, deducted_from_boarder_payments, not_deducted, not_deducted_no_rule_found, counted_unless_wioa_funded, counted_unless_foster_care_boarder]
scope: global
program: SNAP
meaning: "SNAP's counting table for earnings (10 CCR 2506-1 4.403-4.405 and 7 CFR 273.9, 273.11), one row per kind of earnings record (earnings, CO-5100). Counted, a paragraph naming it: wages (7 CFR 273.9(b)(1)(i), S41: \"All wages and salaries of an employee\"), employer_vendor_payment (10 CCR 2506-1 4.405.H.4 (S4300): \"Wages earned by a household member that are garnished or diverted by an employer and paid to a third party for a household's expenses, such as rent, shall be considered as income\"; H.2 and 7 CFR 273.9(c)(1)(vii)(B) (S4101) likewise; the kind states money the employer would otherwise pay the person, so it is not the excluded payment an employer makes in addition to the regular wages; OQ-1021, resolved by the text in step E1). Counted less costs: self_employment_receipts (4.403.11 (S1152) and 7 CFR 273.9(b)(1)(ii) (S41): the gross income of a self-employment enterprise less the costs the cost rows deduct (snap_self_employment_gross_receipts, CO-5114; snap_self_employment_income, CO-1702)). Counted because no rule excludes it (7 CFR 273.9(b)(1) counts all wages and salaries and 4.405 excludes only the sources it lists (S1620); the SNAP owner signs each of these rows): decennial_census_employment, employer_health_insurance_subsidy (a candidate reading, for the owner: an employer's payment that is a medical reimbursement for an identified expense is not income, 4.405.I.1 and I.4.c, S4731; the kind is money paid to the person to help buy insurance, so counted while the owner signs; coverage pass 4 S4-15). Counted unless WIOA-funded: subsidized_employment (10 CCR 2506-1 4.405.2.A.6, S3108: \"Payments, allowances and earnings under the Workforce Innovation and Opportunity Act (WIOA) are excluded as income. Earnings paid for on-the-job training are still counted for SNAP\"; 7 CFR 273.9(c)(10)(v), S4727; the record's wioa_funded says which; coverage pass 4 S4-8). Counted unless foster care boarder: difficulty_of_care_payment (counted, 273.9(b)(1)(i); a payment marked foster_care is a foster care payment, counted only when a foster individual placed with the person is a member of the household, 273.9(b)(2)(ii) and (c)(15), S4725, through snap_foster_care_payments_are_counted, CO-6601; coverage pass 4 S4-6, the class fixed for LEAP and CCCAP in X4-2). Counted loss offset: farm_self_employment_receipts (4.403.12.E (S2510) and 7 CFR 273.11(a)(2)(ii) (S2511): counted less the farm's costs (the cost records marked farm), a loss offset against other income when the farm's annual gross is at least snap_self_employed_farmer_annual_gross_minimum (snap_farm_gross_receipts, CO-5115; snap_farm_costs, CO-5116; snap_farm_self_employment_loss, CO-3722)). Counted above boarder allowance: boarder_payments (4.403.2 (S2963): a boarder's payments for room and meals (provides room_and_board) are self-employment income less the cost of doing business, the greater of the maximum allotment for the boarders and the provision costs (snap_room_and_board_payments, CO-5117; snap_room_and_board_payers, CO-5118; snap_boarder_income, CO-4165); foster care boarders' payments are not counted. A payment for meals only (provides board_only) is a boarder's: \"individuals ... paying a reasonable amount for meals or meals and lodging must be considered boarders\" (7 CFR 273.1(c)(3)(ii), S1815), read with room and board under the cost rule of 4.403.2.B; a payment for a room only (provides room_only) is a roomer's (273.1(c)(5), S1815), self-employment income less the actual costs of providing the room (snap_boarder_income, CO-4165), since \"Payments from a roomer or boarder, except foster care boarders, shall also be considered self-employment income\" (273.9(b)(1)(ii), S4728). OQ-996 resolved by the text (coverage pass 4 S4-9); the receipts that state the same payments (board_only_payment, room_only_payment) are read_from_earnings in snap_receipt_treatment_table, so each payment is counted once.) Excluded in combat zone: uniformed_services_special_pay (4.405.2.A.12 (S3109) excludes \"Military combat payments received by a member of the United States Armed Forces deployed to a designated combat zone\" (combat_zone); special pay received outside a combat zone is pay for service, counted as earned income with the member's wages (7 CFR 273.9(b)(1)(i), S41: \"All wages and salaries of an employee\"), because no rule excludes it (the SNAP owner signs that half). SNAP reads the kind from this list only: its receipt row is read_from_earnings (CO-5010), so the translator's transition copy in the receipts is not counted a second time, as unearned income). Excluded under 19 with parent: wioa_on_the_job_training (4.405.2.A.6, 4.403.B.2 (S3108): excluded for a member under snap_wioa_ojt_exclusion_age_limit who lives with a parent or is under an adult member's parental control, counted otherwise). Deducted from boarder payments: business_cost_boarder_provision (4.403.2 (S2963), the boarder rule above). Excluded: work_study (4.403.A.1, 4.405.1 (S2204)), summer_youth_employment (4.405.2.A.6 (S3108), as snap_excluded_earned_income (CO-2338) reads it), scsep_employment (4.405.2.A.9 (S3109)). Excluded in kind: in_kind_pay (7 CFR 273.9(c)(1) (S4101): in-kind benefits are not money payable to the household, and housing an employer provides in addition to wages is not counted ((c)(1)(vii)(B)); the items before step E1 did not read in-kind pay); a row of its own because it is not pay in money, so the readers of the pay (snap_person_wages, CO-4324; snap_person_pay_received, CO-5119) leave it out, as the gross wages before the records did. Costs deducted: business_cost_operating (4.403.11.A (S1152), 7 CFR 273.11(b)(1) (S4102)), business_cost_interest (7 CFR 273.11(b)(1) (S4102): \"interest paid to purchase income-producing property\"), business_cost_capital_principal (7 CFR 273.11(b)(1) (S4102): \"payments on the principal of the purchase price of income-producing real estate and capital assets\"). Costs not deducted, a paragraph saying so: business_cost_depreciation (7 CFR 273.11(b)(2)(iii) (S1153)). Costs deducted, the class named: business_cost_vehicle (10 CCR 2506-1 4.403.11.B, S4729: allowable costs \"include, but are not limited to\" the costs listed \"and, other similar items that are necessary costs of doing business\"; C's closed list of costs not allowed does not include the business use of a vehicle, and 7 CFR 273.11(b)(2)(ii) (S1153) disallows only \"transportation to and from work\", which the kind leaves out: \"mileage for business purposes only\"; coverage pass 4 S4-10). Costs not deducted, no rule found either way (not_deducted_no_rule_found; the SNAP owner signs the row): business_cost_home_space (a candidate reading, for the owner: 4.403.11.B's \"other similar items that are necessary costs of doing business\" may reach the business share of the home's costs, which the shelter deduction (4.407.3) also counts, so deducting it would count the same cost twice; coverage pass 4 S4-10 recorded). Coverage pass 4 S4-15, rows for the owner's signature with the candidate paragraph shown (no answer changed): summer_youth_employment is excluded whatever the program, by 4.405.2.A.6 (S3108: \"On-the-job training payments under the Summer Youth Employment and Training Program are excluded from income\"), which names one program; wages from a summer job no such program pays would be counted by 7 CFR 273.9(b)(1)(i) (S41), and the kind does not say which (the wioa_funded field, added for subsidized employment, can carry the split if the owner chooses it)."
precision: "Earned-income records, step E0 (docs/reviews/earnings-e0.md; docs/design-earned-and-resource-records.md 2.4): every row is today's reading, what the program's items do now with the scalar fact the kind restates (wages: wages_gross, less its parts below; uniformed_services_special_pay: the uniformed_services_special_pay receipt, and combat_zone_pay_received (part of wages_gross); work_study: work_study_earnings; wioa_on_the_job_training: wioa_on_the_job_training_wages; summer_youth_employment: summer_youth_employment_wages; scsep_employment: scsep_wages and scsep_payments_received; subsidized_employment: subsidized_employment_wages; decennial_census_employment: decennial_census_wages_received; difficulty_of_care_payment: difficulty_of_care_payments_received; in_kind_pay: in_kind_compensation_value; employer_vendor_payment: employer_vendor_payments_received; employer_health_insurance_subsidy: employer_health_insurance_subsidy_received; self_employment_receipts: self_employment_gross_receipts; farm_self_employment_receipts: self_employment_gross_receipts of a farm (self_employment_is_farming, self_employment_is_farm_operation); boarder_payments: room_and_board_payments_received, and the board_only_payment and room_only_payment receipts; business_cost_operating: self_employment_operating_costs; business_cost_interest: self_employment_interest_costs; business_cost_capital_principal: self_employment_capital_principal_payments; business_cost_depreciation: no fact (a new kind); business_cost_home_space: self_employment_home_business_space_costs; business_cost_vehicle: self_employment_business_vehicle_costs; business_cost_boarder_provision: room_and_board_provision_costs), so the table changed no answer when the SNAP E1 track moved its readers onto it, except where a row's reading was a finding the track fixed as a cited difference (docs/reviews/records-earnings-snap.md). Earned-income records, step E1 (SNAP): the SNAP items read the earnings through this table (snap_person_wages, CO-4324; snap_person_counted_wages, CO-5113; snap_self_employment_gross_receipts, CO-5114; snap_farm_gross_receipts, CO-5115; snap_self_employment_costs, CO-1701; snap_farm_costs, CO-5116; snap_room_and_board_payments, CO-5117); a pay for work as an employee is a record whose row is counted, counted_no_rule_excludes, excluded, excluded_in_combat_zone or excluded_under_19_with_parent, a business's receipts a record whose row is counted_less_costs or counted_loss_offset, and a cost a record whose row is deducted (on a farm, marked farm). Every kind has a row, and the type check refuses a lookup in a table that lacks one, so no kind is counted or left out by default; a new kind is added to every earnings table at once by the integration owner (design 4.3, rule 2), and a track changes only its own table's cells. A property of a pay (irregular, temporary_job, the job's dates, combat_zone, annual_contract_pay, pass_set_aside) is a field the program's items read beside the row, not a row. Rows marked for the owner's signature are listed in docs/reviews/earnings-e0.md."
