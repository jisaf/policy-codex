rationale: "Receipt records, migration phase 2 (product-owner decision of 2026-11-23): the SSI method's one counting table, kind by kind, replacing ma_ssi_excluded_unearned_income (CO-2470), whose sources each named a part of the gross unearned income facts, and the separate VA Aid and Attendance facts. One table for the applicant, a spouse, a deemed parent and an ineligible child, so the deeming paths cannot drift from the applicant's."
