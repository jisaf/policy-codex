id: CO-5510
name: "Medicaid SSI method: how each kind of receipt is treated"
identifier: ma_ssi_receipt_treatment_table
kind: parameter
type: table keyed by option
options: [counted, counted_no_rule_excludes, counted_net_of_expenses, counted_winnings, child_support, exempt, exempt_public_assistance, not_income, ssi_benefit, not_counted_open_question, in_earnings]
scope: global
program: Medicaid
meaning: "Medicaid's counting table for the SSI-related method (10 CCR 2505-10 8.100.5.F, the income of the aged, blind and disabled groups, the Medicare Savings Programs, the buy-ins and long-term care, with 20 CFR 416 Subpart K where Colorado's rules adopt it), one row per kind of receipt, the same for the applicant, a spouse, a deemed parent and an ineligible child. Counted, a paragraph of 8.100.5.F.5 naming it: social_security (j.ii), pension (j.i), unemployment_compensation (j.v), workers_compensation (j.iii), interest_and_dividends and tax_exempt_interest (e, \"Interest or dividend payments received from any resources\"), gi_bill_housing_food_allowance and state_veteran_annuity (j.vi, \"Veterans benefits other than Aid and Attendance\"), gift and charitable_gift_life_threatening_condition (c, \"Gifts and inheritances\"), other_taxable (j.vii alimony; trust income) and other_nontaxable (a death benefits, c inheritances, j.vi veterans' benefits). Counted because no rule excludes it (8.100.5.F.5 counts unearned income \"including, but not limited to\" its list and no paragraph of F.6 on file exempts it; the Medicaid owner signs each row): resource_liquidation, reimbursement, property_or_food_tax_refund, crime_victim_compensation, kinship_care_payment, colorado_works_diversion, colorado_works_supportive_services, reverse_mortgage, housing_utility_allowance, refugee_resettlement, vocational_training_allowance, in_home_care_allowance, migrant_farmworker_emergency_assistance. Special: rental_income is counted net of the ordinary and necessary expenses of the property (20 CFR 416.1121(d), S3620; 8.100.5.J.1, S3619); gambling_winnings is counted unless the hardship exemption of F.5.i.1 is granted (F.5.i, S3001; ma_ssi_gambling_receipts); child_support and child_support_arrears are support for a child, the child's income, counted for the child less one-third (8.100.5.H.4.c) and in the gross income of long-term care and of an ineligible child (ma_ssi_child_support_receipts); ssi is the benefit the method measures (an SSI recipient qualifies by receipt, 8.100.6.C) and is counted nowhere, except a retroactive payment, which is exempt for nine months (F.6.c) and part of long-term care gross income. Exempt (income, so in long-term care gross income, 8.100.7.A.1, but not counted for eligibility), with its paragraph: colorado_works_cash, adult_financial_cash and home_care_allowance (exempt_public_assistance: F.6.j, \"Assistance from other agencies and organizations\", S3617; cash assistance of another program, which the spousal impoverishment rules leave out of a community spouse's or family member's income, OQ-974), general_assistance, emergency_assistance and charitable_need_based_cash (F.6.j), workforce_program_payment (F.6.o, p), foster_care_payment (F.6.l, S3404), educational_assistance (416.1124(c)(3), S2209), federally_excluded_payment and dvsa_title_i_volunteer_payment (416.1124(b)), energy_assistance_federal and energy_assistance_other (416.1124(b), (c)(5), the reading before receipt records; OQ-971), americorps (416.1112(c)(10), 416.1124(c)(23), S3618); a retroactive Title II or SSI payment of any kind row (F.6.c) and the part of a receipt set aside under a plan for self-support (F.6.q; the receipt's pass_set_aside) are exempt whatever the row. Not income: loan (416.1103(f)), income_tax_refund (416.1103(d)), va_aid_and_attendance (8.100.5.K: the Aid and Attendance and Unusual Medical Expenses portion \"shall not be considered as income when determining eligibility\", S2900). Not counted pending an answer: sponsor_payment (OQ-972). Receipt records, migration phase 3 (kinds that were parts of other receipts before): adoption_subsidy is exempt (8.100.5.F.6.t, S4041: \"A child receiving subsidized adoption funds shall be excluded from the Medical Assistance budget unit and his income shall be exempt\"; the subsidy is the child's income though paid to the adoptive parent, so it is neither the parent's income nor deemed, and ma_ssi_deeming_parents_countable_income, ma_pickle_deeming_parents_countable_income and ma_cbwd_household_unearned_income no longer subtract it); school_attendance_conditional_benefit is exempt with the educational assistance it was part of (416.1124(c)(3)); early_childhood_research_payment, savings_account_distribution, medicare_premium_refund, insurance_cash_value and military_allotment are counted because no rule excludes them (OQ-995 asks whether 20 CFR 416.1103(c), S4042, makes a savings withdrawal or cash value taken not income), as the other unearned income they were part of was; the Medicaid owner signs each. Earned-income records, step E0 (OQ-1020): uniformed_services_special_pay, board_only_payment and room_only_payment are earnings (docs/design-earned-and-resource-records.md 2.3); their rows here are kept, with the reading they have, until Medicaid reads its earnings table (ma_ssi_earnings_treatment_table, CO-5107, which carries the same reading), and the kinds leave receipts in E2. Earned-income records, step E1 (Medicaid and CHP+): Medicaid reads its earnings table, so uniformed_services_special_pay, board_only_payment and room_only_payment are in_earnings here (read from the earnings records through ma_ssi_earnings_treatment_table, CO-5107, and not counted here, so the translator's transition copy is never counted twice)."
precision: "Receipt records, migration phase 2 (docs/reviews/receipts-migration-2-medicaid.md). Every kind has a row, and the type check refuses a lookup in a table that lacks one. A receipt is counted in the month received (8.100.5.F.4-5, S3001). The rows counted because no rule excludes them are the kinds the ledger counted before receipt records by silence (part of the other unearned income facts and not among ma_ssi_excluded_unearned_income's sources, CO-2470); for several of them 20 CFR 416 Subpart K would exclude the payment (property tax refunds 416.1124(c)(1), crime victim compensation (c)(17), uniformed services special pay (c)(19), life-threatening-condition gifts (c)(21), State veterans' annuities (c)(24), reimbursements and resource conversions 416.1103(b) and (c), reverse mortgage proceeds as a loan) or F.6.j might reach it (diversion and supportive services, migrant farmworker emergency assistance), and Colorado's text on file neither adopts nor excludes those paragraphs: OQ-971 asks the owner row by row. MAGI is a different method with its own table (ma_magi_receipt_treatment_table, CO-5500)."
