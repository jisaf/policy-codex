id: CO-5510
name: "Medicaid SSI method: how each kind of receipt is treated"
identifier: ma_ssi_receipt_treatment_table
kind: parameter
type: table keyed by option
options: [counted, counted_no_rule_excludes, counted_net_of_expenses, counted_winnings, child_support, exempt, exempt_public_assistance, not_income, ssi_benefit, not_counted_open_question, in_earnings]
scope: global
program: Medicaid
meaning: "Medicaid's counting table for the SSI-related method (10 CCR 2505-10 8.100.5.F, the income of the aged, blind and disabled groups, the Medicare Savings Programs, the buy-ins and long-term care, with 20 CFR 416 Subpart K where Colorado's rules adopt it or are silent: 42 CFR 435.601(b)(2) (S4754) has the agency \"apply the financial methodologies and requirements of the cash assistance program that is most closely categorically related to the individual's status\", the SSI methodology for these groups, and 435.601(d)(2) allows a methodology less restrictive, but no more restrictive, than SSI's), one row per kind of receipt, the same for the applicant, a spouse, a deemed parent and an ineligible child. Counted, a paragraph of 8.100.5.F.5 naming it: social_security (j.ii), pension (j.i), unemployment_compensation (j.v), workers_compensation (j.iii), interest_and_dividends and tax_exempt_interest (e, \"Interest or dividend payments received from any resources\"), gi_bill_housing_food_allowance and state_veteran_annuity (j.vi, \"Veterans benefits other than Aid and Attendance\"), gift and charitable_gift_life_threatening_condition (c, \"Gifts and inheritances\"), other_taxable (j.vii alimony; trust income) and other_nontaxable (a death benefits, c inheritances, j.vi veterans' benefits), dvsa_title_i_payment_at_or_above_minimum_wage (F.6.m exempts a Title I payment only when its value \"is not equivalent to or greater than the minimum wage\"). Where Colorado's own paragraph counts what Subpart K does not count (interest and dividends on a countable resource, 416.1124(c)(22); a 501(c)(3) organization's gift to a child under 18 with a life-threatening condition, (c)(21); a State's annuity for a blind, disabled or aged veteran, (c)(24)), the row follows the Colorado paragraph and OQ-1280 records the conflict with 435.601(d)(2). Counted because no rule on file excludes it (8.100.5.F.5 counts unearned income \"including, but not limited to\" its list, no paragraph of F.6 names it and no paragraph of Subpart K on file excludes it; the Medicaid owner signs each row, and OQ-971 asks whether F.6.j, \"Assistance from other agencies and organizations\", or F.6.y reaches it): kinship_care_payment (a payment to a certified kinship foster parent for a child placed in the home is a payment for providing foster care, stated as foster_care_payment and exempt under F.6.l; this kind is the rest), colorado_works_supportive_services (F.6.y names TANF \"cash assistance\"; a supportive payment is \"a payment and/or service in addition to basic cash assistance or diversion that is based on an assessed need\", S4753), refugee_resettlement, migrant_farmworker_emergency_assistance, early_childhood_research_payment, military_allotment; and medicare_premium_refund (OQ-995). Special: rental_income is counted net of the ordinary and necessary expenses of the property (20 CFR 416.1121(d), S3620; 8.100.5.J.1, S3619); gambling_winnings is counted unless the hardship exemption of F.5.i.1 is granted (F.5.i, S3001; ma_ssi_gambling_receipts); child_support and child_support_arrears are support for a child, the child's income, stated on the child's list (receipts, CO-5000; docs/conventions.md, \"Receipt records\"), counted for the child less one-third (8.100.5.H.4.c) and in the gross income of long-term care and of an ineligible child (ma_ssi_child_support_receipts); ssi is the benefit the method measures (an SSI recipient qualifies by receipt, 8.100.6.C) and is counted nowhere, except a retroactive payment, which is exempt for nine months (F.6.c) and part of long-term care gross income. Exempt (income, so in long-term care gross income, 8.100.7.A.1, OQ-822, but not counted for eligibility), with its paragraph: colorado_works_cash, adult_financial_cash and home_care_allowance (exempt_public_assistance: F.6.j, S3617; cash assistance of another program, which the spousal impoverishment rules leave out of a community spouse's or family member's income, OQ-974), colorado_works_diversion (exempt_public_assistance: F.6.y, \"cash assistance under the Temporary Assistance to Needy Families (TANF) funds\", S3003; a diversion is a Colorado Works grant payment, \"a short-term cash payment\", and Colorado Works \"is the Temporary Assistance for Needy Families (TANF) program in Colorado\", 9 CCR 2503-6 3.601, S4753), general_assistance, emergency_assistance and charitable_need_based_cash (F.6.j), energy_assistance_other (F.6.j; 20 CFR 416.1124(c)(10) and 416.1157(c), S4758: home energy assistance from a private nonprofit agency or an energy supplier), workforce_program_payment (F.6.o, p), foster_care_payment (F.6.l, S3404), educational_assistance (416.1124(c)(3), S2209), federally_excluded_payment and dvsa_title_i_volunteer_payment (416.1124(b)), energy_assistance_federal (F.6.n; 416.1124(b)), americorps (416.1112(c)(10), 416.1124(c)(23), S3618), housing_utility_allowance (F.6.g, S4751, and 416.1124(c)(14), S4758: \"The value of any assistance paid with respect to a dwelling unit\" under the federal housing Acts they list; the kind, a utility allowance a subsidized housing program pays, is read as paid under them, OQ-1281), and, by the SSI methodology where Colorado's text names nothing (435.601(b)(2), S4754): property_or_food_tax_refund (416.1124(c)(1), S2803) and crime_victim_compensation ((c)(17), S2609). A retroactive Title II or SSI payment of any kind row (F.6.c) and the part of a receipt set aside under a plan for self-support (F.6.q; the receipt's pass_set_aside) are exempt whatever the row. Not income (out of every SSI-method figure and of long-term care gross income): loan (416.1103(f)), income_tax_refund (416.1103(d)), va_aid_and_attendance (8.100.5.K: the Aid and Attendance and Unusual Medical Expenses portion \"shall not be considered as income when determining eligibility\", S2900); reverse_mortgage (8.100.5.L.1, S4750: \"reverse mortgages payments made to a borrower shall not be treated as income for eligibility purposes\"; funds left the next month are a resource, L.2); reimbursement (F.6.w, S4751, \"Reimbursement or restoration of out-of-pocket expenses\"; 416.1103(a)(5), (b)(3), S4757: repayment for what the person already paid for is not income); resource_liquidation, savings_account_distribution and insurance_cash_value (8.100.5.P.1, S4752: \"The net proceeds from the sale of exempt or non-exempt resources are considered available resources\"; 416.1103(c), S4042: \"Receipts from the sale, exchange, or replacement of a resource are not income but are resources that have changed their form\"; a withdrawal from an account the person owns, a resource of the person (8.100.5.N.2), and cash value taken out of a policy the person owns, whose cash surrender value the holdings count (M.2.f-g), are resources that changed their form); in_home_care_allowance (416.1103(b)(1), S4757: assistance in cash under a government program \"whose purpose is to provide social services\"), vocational_training_allowance (416.1103(a)(3), (b)(1), S4757: a government program's assistance, \"including vocational rehabilitation\"; the kind's examples, a JOBS or vocational rehabilitation allowance, are government programs). Not counted pending an answer: sponsor_payment (OQ-972). Receipt records, migration phase 3: adoption_subsidy is exempt (8.100.5.F.6.t, S4041: \"A child receiving subsidized adoption funds shall be excluded from the Medical Assistance budget unit and his income shall be exempt\"; the subsidy is the child's income though paid to the adoptive parent, so it is neither the parent's income nor deemed, and ma_ssi_deeming_parents_countable_income, ma_pickle_deeming_parents_countable_income and ma_cbwd_household_unearned_income no longer subtract it); school_attendance_conditional_benefit is exempt with the educational assistance it was part of (416.1124(c)(3)). Earned-income records: uniformed_services_special_pay, board_only_payment and room_only_payment are earnings (docs/design-earned-and-resource-records.md 2.3), in_earnings here: read from the earnings records through ma_ssi_earnings_treatment_table (CO-5107) and not counted here, so the translator's transition copy is never counted twice."
precision: "Receipt records, migration phase 2 (docs/reviews/receipts-migration-2-medicaid.md). Every kind has a row, and the type check refuses a lookup in a table that lacks one. A receipt is counted in the month received (8.100.5.F.4-5, S3001). Coverage pass 4, non-MAGI (N4-1 to N4-3, N4-12, N4-15; docs/reviews/coverage4-medicaid-nonmagi.md): rows that were counted although text on file decides them are settled by that text: reverse_mortgage (L.1), reimbursement (F.6.w), housing_utility_allowance (F.6.g), colorado_works_diversion (F.6.y), energy_assistance_other (F.6.j, 416.1157(c)); resource_liquidation, savings_account_distribution and insurance_cash_value (P.1, 416.1103(c); OQ-995 keeps only the Medicare premium refund); and, where Colorado's text names nothing, the SSI methodology (435.601(b)(2)): property_or_food_tax_refund (416.1124(c)(1)), crime_victim_compensation ((c)(17)), in_home_care_allowance and vocational_training_allowance (416.1103(a)(3), (b)(1)). The readers also leave out, whatever the row, the parts of a receipt the SSI method does not count as the person's income: what is spent on the deceased's last illness and burial out of a death benefit (8.100.5.F.5.a; 416.1121(e), (g)), what an award includes for the claim's expenses (416.1123(b)(3)), the amount of a veterans benefit paid because of a dependent (416.1123(e)(1)), and the first $60 a calendar quarter of income received infrequently or irregularly (416.1124(c)(6); ma_ssi_excluded_infrequent_unearned_income, CO-6731). MAGI is a different method with its own table (ma_magi_receipt_treatment_table, CO-5500)."
