id: CO-324
name: CCCAP monthly federal poverty guideline, each additional household member
identifier: cccap_poverty_guideline_each_additional
kind: parameter
type: money
scope: global
program: CCCAP
meaning: The monthly dollar amount added to cccap_poverty_guideline_table for each household member above eight.
precision: Monthly dollars added per household member above 8, effective October 1, 2024.
versions:
  - from: "2024-10-01"
    to: "2025-10-01"
    value: 448.33
    source: S485
  - from: "2025-10-01"
    to: "2026-10-01"
    value: 458.33
    source: S780
  - from: "2026-10-01"
    value: 473.33
    source: S781
sources: [S485, S780, S781]
tags: [income]
rationale: "8 CCR 1403-1 3.111.H.2 (S485) states this 'Each Additional person' figure alongside the sizes 1-8 table (cccap_poverty_guideline_table, CO-323); cccap_income_within_entry_limit (CO-986) reads it for households above size 8. Phase 8 adds the FY2026 and FY2027 figures (S780, S781)."
