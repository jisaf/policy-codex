id: CO-324
name: CCCAP monthly federal poverty guideline, each additional household member
identifier: cccap_poverty_guideline_each_additional
kind: parameter
type: money
scope: global
program: CCCAP
meaning: The monthly dollar amount added to cccap_poverty_guideline_table for each household member above eight.
precision: Monthly dollars added per household member above 8, effective October 1, 2024; the Colorado SOS current edition (D-76, effective 08/14/2026) restates it effective October 1, 2026 at $473.33 (3.111.H.3).
versions:
  - from: "2024-10-01"
    to: "2026-10-01"
    value: 448.33
    source: S485
  - from: "2026-10-01"
    value: 473.33
    source: S581
sources: [S485, S581]
tags: [income]
rationale: 8 CCR 1403-1 3.111.H.2 (S485) states this "Each Additional person" figure alongside the sizes 1-8 table (cccap_poverty_guideline_table, CO-323); cccap_income_within_entry_limit (CO-986) reads it for households above size 8. The Colorado SOS current edition (D-76) restates the same figure effective October 1, 2026 (S581), which this item now versions.
