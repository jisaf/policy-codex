rationale: 7 U.S.C. 2014(e)(6)(B) and 7 CFR 273.9(d)(6)(ii) (S93) cap the excess shelter deduction for households without an elderly or disabled member; D-20's Table 3 (S83) is the FY2026 FNS-published dollar figure (48 states and D.C. column), which snap_excess_shelter_deduction (CO-377) needs as a named, dated parameter.
