id: CO-3046
name: "Adult Financial resource limit, married client"
identifier: af_resource_limit_couple
kind: parameter
type: money
scope: global
program: AdultFinancial
meaning: "The countable resources limit for a married Adult Financial client: \"$3,000 for: a. A married client\" (9 CCR 2503-5 3.520.72.A.2); also a married sponsor's limit in sponsor resource deeming."
value: 3000
sources: [S454]
tags: [cash, resources]
rationale: "Hard-coded numbers audit D-4: Adult Financial items read the SSI-method parameter, so a change of the SSI figure would have changed Adult Financial without an amendment of 9 CCR 2503-5. The rule states its own figure, as OQ-391 found for the AND-CS grant standard, so the program reads its own parameter (option (a) of the audit)."
