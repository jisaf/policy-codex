id: CO-3803
name: "Colorado Works: days of a stay that make a client a resident of an institution"
identifier: cw_institution_resident_min_days
kind: parameter
type: whole number
scope: global
program: ColoradoWorks
meaning: "A client is a resident of an institution, and so not considered to be in the home, when the client's stay is at least this many consecutive days (9 CCR 2503-6 3.604.2.O.2: \"at least thirty (30) consecutive days\")."
value: 30
sources: [S2602]
tags: [cash, tanf, household]
rationale: "Final cash review FC-1: 3.604.2.O.2 (S2602) states the thirty days; the figure is a parameter, not a literal in cw_is_institution_resident (CO-3804)."
