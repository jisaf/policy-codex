id: CO-1519
name: Poverty guideline by household size for the school meal guideline year
identifier: sebt_poverty_guideline_table
kind: parameter
type: table keyed by household size
scope: global
program: SunBucks
meaning: The annual HHS poverty guideline, by household size 1 through 8, from which the school meal Income Eligibility Guidelines in effect for a school meal guideline year (July 1 through June 30) are computed - the guideline year's figures, not the calendar year's, since the guidelines "change on July 1" and the ones "in effect on the date of application must be used" (7 CFR 292.5(b)).
precision: The July 1, 2026 - June 30, 2027 guidelines were obtained from the year 2026 poverty guidelines (S798), whose figures are the 2026 HHS guidelines this volume carries in federal_poverty_guideline_annual_table (CO-181, S55); they are restated here dated by the guideline year. No version covers a determination before July 1, 2026 (the 2025 guidelines are not in the volume) or after June 30, 2027 (the 2027 notice has not been published), so such a determination is unknown rather than computed from the wrong year.
versions:
  - from: "2026-07-01"
    to: "2027-07-01"
    value: { "1": 15960, "2": 21640, "3": 27320, "4": 33000, "5": 38680, "6": 44360, "7": 50040, "8": 55720 }
    source: S798
sources: [S55, S791, S798]
tags: [sebt, income]
rationale: "Phase-8 fix round (S-4): sebt_income_eligibility_limit (CO-1297) read federal_poverty_guideline_annual_table (CO-181), which changes on the HHS calendar (versioned from January), so every January-June determination would use the next year's guidelines once they are added. The school meal guideline year needs its own dating; the engine selects a parameter version by the determination date only, so the figures are restated with the guideline year's dates rather than read from CO-181 as of the previous July 1."
