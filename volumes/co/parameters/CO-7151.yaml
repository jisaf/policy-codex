id: CO-7151
name: "SSI method: months cash held to repair or replace a lost, damaged or stolen excluded resource is not a resource"
identifier: ssi_replacement_cash_exclusion_months
kind: parameter
type: whole number
scope: global
program: All
meaning: "The number of months from the date it is received during which cash (and its interest) received from any source to repair or replace an excluded resource that is lost, damaged or stolen is excluded from resources (20 CFR 416.1232(a), S4662: \"This exclusion applies if the cash (and the interest) is used to repair or replace the excluded resource within 9 months of the date the individual received the cash. Any of the cash (and interest) that is not used to repair or replace the excluded resource will be counted as a resource beginning with the month after the 9-month period expires\")."
precision: "Read by ma_ssi_holdings_countable_in_month (CO-5320) for held_replacement_proceeds from insurance or another source that Medicaid finds replaces a lost, damaged or stolen excluded resource (ma_replaces_lost_excluded_resource): cash received on a day of month M is excluded through month M + 9, the month in which the nine months from the day of receipt end, and counted from the month after (resources are held at the first moment of the month, 416.1207(a), S4501). 20 CFR 416.1232(b)-(d) (S4944) extend the period for good cause or a declared disaster; the extension is a finding no field states (OQ-1240). Applied by 42 CFR 435.601(b)(2) (S4754), the SSI methodology where the Medical Assistance text names nothing (field-effect sweep, FS-MA-9)."
value: 9
sources: [S4662, S4944, S4501, S4754]
implemented: engine
open: [OQ-1240]
tags: [resources, non_magi]
rationale: "Field-effect sweep (docs/reviews/field-sweep-snap-cash-nonmagi.md), FS-MA-9: insurance proceeds held to replace a stolen car were counted from the month of receipt; 416.1232(a) excludes them nine months, and a figure the rule states is a parameter (OQ-82)."
