id: CO-341
name: CCCAP 85% state median income limit, each additional person
identifier: cccap_smi_income_limit_each_additional
kind: parameter
type: money
scope: global
program: CCCAP
meaning: The monthly dollar amount 8 CCR 1403-1 3.111.H.2 adds to the 85% state median income limit for each household member above eight.
precision: Effective October 1, 2024, alongside cccap_smi_income_limit_table (CO-340).
versions:
