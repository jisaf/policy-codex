rationale: "The nearest existing item is cccap_poverty_guideline_each_additional (CO-324), the 100% FPG column's each-additional figure from the same table row (S485); the 85% SMI column's own each-additional figure ($276.47) is a separate stated number cccap_income_within_entry_limit's new cap (C-5) and cccap_income_within_exit_limit (CO-993) both need for a household above size 8."
