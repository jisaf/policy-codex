id: CO-181
name: HHS federal poverty guideline by household size, annual (48 states and D.C.)
identifier: federal_poverty_guideline_annual_table
kind: parameter
type: table keyed by household size
scope: global
program: All
meaning: The annual HHS federal poverty guideline for the 48 contiguous states and the District of Columbia, by household size 1 through 8. One federal table for every program that states a limit as a percentage of the poverty guideline (Medicaid, LEAP, SunBucks); each program's own rule says which year's guideline applies and how it is converted to a monthly figure.
precision: Annual dollars; a monthly figure divides by 12. Sizes above 8 add federal_poverty_guideline_annual_each_additional per additional member.
