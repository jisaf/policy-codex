  - {from: "2026-01-01", value: {"1": 15960, "2": 21640, "3": 27320, "4": 33000, "5": 38680, "6": 44360, "7": 50040, "8": 55720}, source: S55}
review_by: "2027-01-31"
open: [OQ-515]
rationale: "One federal figure, stated once (vocabulary review D-1). It was authored as a Medicaid parameter beside an identical SNAP copy (snap_poverty_guideline_table, CO-116, retired in the vocabulary fix round, which nothing read); LEAP and SunBucks already read this table, so it is now program All without a program prefix."
sources: [S55, S1710]
