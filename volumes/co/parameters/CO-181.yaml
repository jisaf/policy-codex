review_by: "2027-01-31"
open: [OQ-515]
rationale: "One federal figure, stated once (vocabulary review D-1). It was authored as a Medicaid parameter beside an identical SNAP copy (snap_poverty_guideline_table, CO-116, retired in the vocabulary fix round, which nothing read); LEAP and SunBucks already read this table, so it is now program All without a program prefix. Coverage pass 6, C6-09 (2026-11-24): the 2024 figures (89 FR 2961, D-5061, S5061, fetched) are added for the premium tax credit test of a retroactive month in 2025, which reads the guideline in force on November 1, 2024 (26 CFR 1.36B-1(h); ma_premium_tax_credit_previous_year_income_pct_fpl, CO-7408); the 2024 version is read on no other date the stored households reach."
sources: [S55, S1710, S5061]
tags: [income]
