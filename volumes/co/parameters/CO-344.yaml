id: CO-344
name: LEAP income limit, 60 percent state median income, each additional person
identifier: leap_income_limit_monthly_each_additional
kind: parameter
type: money
scope: global
program: LEAP
meaning: The monthly dollar amount added to the LEAP 60% state median income ceiling for each household member above the largest size leap_income_limit_monthly (CO-875) states, under 9 CCR 2503-7 3.752.22.D.
precision: "D-67 (S557) states the 2026-27 season's maximum gross monthly income for household sizes 1-15 directly; leap_income_limit_monthly (CO-875) now carries all 15 rows, so this each-additional figure applies only above size 15. D-67's rows 6-15 (9581, 9799, 10017, 10234, 10452, 10670, 10888, 11106, 11323, 11541) step by $218 for every consecutive pair except size 8->9 (+217) and size 13->14 (+217) - not a single constant step. Per this batch's instruction for a non-constant step, the parameter is set to the table's last observed step: 11541 (size 15) - 11323 (size 14) = $218. The prior version (from 2024-10-01, $195.16) was backed out of CCCAP's 85% SMI each-additional figure (8 CCR 1403-1 3.111.H.2, S485, $276.47 / 0.85 x 0.60 = $195.16) and is kept as history rather than discarded, since it was already carried as a dated version rather than a plain value."
versions:
  - from: "2024-10-01"
    to: "2026-11-01"
    value: 195.16
    source: S485
  - from: "2026-11-01"
    value: 218
    source: S557
sources: [S557, S485]
open: [OQ-122]
tags: [income, household]
rationale: "The nearest existing item is cccap_smi_income_limit_each_additional (CO-341), the CCCAP each-additional figure this parameter was originally backed out of; leap_income_limit_monthly (CO-875) needs its own each-additional figure for a household above the largest size it tables, the same shape cccap_income_within_entry_limit (CO-986) already uses for CO-323/CO-324 and CO-340/CO-341. D-67 (S557) now supplies LEAP's own figures for sizes 1-15 directly, so this fix round adds a new dated version - the table's own last observed step, $218 - rather than continuing to back the figure out of CCCAP's each-additional column; the prior CCCAP-derived version stays in the history."
