id: CO-1227
name: Burial services maximum cost limit
identifier: af_burial_cost_limit
kind: parameter
type: money
scope: global
program: AdultFinancial
meaning: "The maximum total cost of all burial services for which a burial benefit may be paid, excluding an exempt burial plot, per 9 CCR 2503-5 3.570.43.A.4 and F.1; combined charges above it bar any payment."
precision: "Dated from March 1, 2020, when the entire rule took effect (S2631); 3.570.43 is not among the sections amended since (final cash review FC-21: it had been dated from the version fetched, effective March 2, 2026, so a death before then had no limit in force). The rule states no effective date of its own for the figure, unlike the burial benefit maximum (CO-1228), and the Colorado Works pair (cw_death_reimbursement_max, _cost_limit) is dated. Hard-coded numbers audit D-5."
versions:
  - {from: "2020-03-01", value: 2500, source: S2631}
sources: [S719, S723, S2631]
tags: [cash]
rationale: "No existing parameter states it; af_burial_eligible (CO-1231) needs it. Hard-coded numbers audit D-5: the one parameter of the burial and death-reimbursement pairs without a version; now dated, and the meaning no longer restates the figure."
