    value: 4066.50
    source: S644
sources: [S644, S651, S359, S372]
tags: [ma, ltc, income]
rationale: "OQ-91: no fetched document stated the 2026 figure, and § 8.100.7.Q.4 restates a stale 2001 figure. CMS's 2026 SSI and Spousal Impoverishment Standards chart (D-72) states the Maximum Monthly Maintenance Needs Allowance, $4,066.50, effective January 1, 2026. ma_mmmna (CO-655) needs it."
