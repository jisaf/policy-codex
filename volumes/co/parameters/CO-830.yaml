id: CO-830
name: MMMNA cap
identifier: mmmna_cap
kind: parameter
type: money
scope: global
program: Medicaid
meaning: The maximum minimum monthly maintenance needs allowance (standard plus excess shelter allowance combined) - the $1,500 base 42 U.S.C. 1396r-5(d)(3)(C) sets, CPI-indexed under subsection (g); 10 CCR 2505-10 § 8.100.7.Q.4 states it as "$2,175.00 for the year 2001" adjusted each January.
precision: Versioned by calendar year from CMS's published Maximum Monthly Maintenance Needs Allowance. Converted from a supplied fact in phase 7 (OQ-91); scope changed from person-month to global, identifier and id unchanged.
versions:
