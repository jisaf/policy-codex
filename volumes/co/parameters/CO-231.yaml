id: CO-231
name: SSI-related earned income exclusion
identifier: ssi_earned_income_exclusion
kind: parameter
type: money
scope: global
program: All
meaning: The amount of a person's (or couple's) earned income in a month disregarded first, before the remainder disregard (ssi_earned_income_disregard_rate), per 20 CFR 416.1112(c)(5) and 10 CCR 2505-10 8.100.5.H.4.b.
value: 65
sources: [S308, S309]
tags: [income]
rationale: "No existing item states the $65 earned income exclusion. ma_ssi_countable_earned_income (CO-605) needs it. Vocabulary fix round (docs/reviews/vocabulary-reuse.md, N-2): renamed from ma_ssi_earned_income_exclusion; a federal SSI figure several programs read; it loses the Medicaid prefix and becomes program All."
