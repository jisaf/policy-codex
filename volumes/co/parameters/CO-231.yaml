id: CO-231
name: SSI-related earned income exclusion
identifier: ma_ssi_earned_income_exclusion
kind: parameter
type: money
scope: global
program: Medicaid
meaning: The first $65 of a person's (or couple's) earned income in a month, disregarded before the one-half remainder disregard, per 20 CFR 416.1112(c)(5) and 10 CCR 2505-10 8.100.5.H.4.b.
value: 65
sources: [S308, S309]
tags: [ma, non_magi, income]
rationale: "No existing item states the $65 earned income exclusion. ma_ssi_countable_earned_income (CO-605) needs it."
