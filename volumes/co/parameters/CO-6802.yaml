id: CO-6802
name: "Adult Financial: months an annual contract's pay is prorated over"
identifier: af_annual_contract_months
kind: parameter
type: whole number
scope: global
program: AdultFinancial
meaning: "The number of months over which 9 CCR 2503-5 3.520.781.G.2.b (S4792) prorates the pay of contract employment whose employees \"derive their annual income in a period shorter than a year\" (\"the income shall be prorated over the term of the contract, provided that the income from the contract is not earned on an hourly or piecework basis\"): twelve, the term of a contract renewed on an annual basis (the earnings record's annual_contract_pay, CO-5100)."
precision: "Read by af_earned_pay (CO-5130), which counts a pay that states annual_contract_pay at one twelfth of the contract in place of its amount, in every month of the year, the months without pay included. Whether \"the term of the contract\" is the contract year or only the months worked under it is OQ-1291."
versions:
  - {from: "2026-03-02", value: 12, source: S4792}
sources: [S4792]
tags: [cash, income]
open: [OQ-1291]
rationale: "Coverage pass 4 CA4-8: G.2.b is a \"shall\", and the earnings record carries the contract's yearly pay, which SNAP (4.403.3) and CCCAP (3.111.H.4.b) already read at one twelfth; the twelve months are a figure of the reading, not a literal in the derivation."
