meaning: "The Bureau of Economic Analysis region, of the four 10 CCR 2505-10 § 8.100.7.G.6.a.i.a) lists, to which each Colorado county belongs (keyed by the options of county_of_residence, CO-1979; each row an option of ma_ltc_private_pay_region, CO-1980): the region whose average private-pay rate for long-term care institution care is the income-trust gross income ceiling."
precision: "Every county has a row. The rule lists the counties by name; the table restates that list, so a change of the regions is a change of this one item."
