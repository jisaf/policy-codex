id: CO-234
name: SSI-related resource limit, couple
identifier: ssi_resource_limit_couple
kind: parameter
type: money
scope: global
program: All
meaning: The countable resource limit for a married SSI-related or OAP applicant living with a spouse, per 42 U.S.C. 1382b, 20 CFR 416.1205(c) and 10 CCR 2505-10 8.100.5.M.1.
value: 3000
sources: [S301, S302]
tags: [resources]
rationale: "No existing item states the $3,000 couple SSI-related resource limit. ma_meets_ssi_resource_standard (CO-610) needs it. Vocabulary fix round (docs/reviews/vocabulary-reuse.md, N-2): renamed from ma_ssi_resource_limit_couple; a federal SSI figure several programs read; it loses the Medicaid prefix and becomes program All."
