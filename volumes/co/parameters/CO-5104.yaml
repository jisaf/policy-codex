id: CO-5104
name: "Colorado Works: how each kind of earnings is treated"
identifier: cw_earnings_treatment_table
kind: parameter
type: table keyed by option
options: [counted, counted_no_rule_excludes, counted_at_value, counted_net_of_costs, counted_above_boarder_allowance, excluded, deducted, deducted_from_boarder_payments, not_deducted, not_deducted_no_rule_found, counted_unless_foster_care]
scope: global
program: ColoradoWorks
meaning: "Colorado Works' counting table for earnings (9 CCR 2503-6 3.605.2 and 3.605.4, for the unit's members and every person whose income is deemed to it), one row per kind of earnings record (earnings, CO-5100). Counted, a paragraph naming it: wages (3.605.2 (S1621, S412), cw_gross_earned_income (CO-1716); a temporary job's pay (temporary_job) is read apart under 3.605.2.C (S2604)), employer_vendor_payment (3.605.2.B.1 (S4381): \"'Earned Income' is still considered when: 1. Money payments obligated to the employee are diverted to a third-party for the employee's household or other expenses\"; the definitions' \"Payments made directly to a vendor are not income\" (3.601) is the general rule B.1 makes the exception to for pay owed to the employee, which is what the kind states). Counted net of costs: self_employment_receipts (3.605.2.E.1.a, c (S1155): the net profit, the gross income less the cost of doing business, is earned income; cw_self_employment_net_profit, CO-1706), farm_self_employment_receipts (as self_employment_receipts (S1155): 3.605.2.E.4.a counts a farm owner's self-employment income in the month received; no Colorado Works text treats a farm's costs apart). Counted because no rule excludes it (3.605.2 counts earned income and no paragraph of 3.605.4 exempts it; the Colorado Works owner signs each of these rows): uniformed_services_special_pay, summer_youth_employment (3.605.4.B.14 (S2606) exempts the YEDPA youth projects' payments, and B.16 WIOA income; whether a summer youth program is either is for the owner), scsep_employment, decennial_census_employment, employer_health_insurance_subsidy. Counted unless foster care (counted_unless_foster_care): difficulty_of_care_payment, counted as pay by silence when it is paid for live-in care of a person on a Home and Community Based Services waiver, and exempt when it is a foster care payment for a child placed in the home (foster_care), as the foster care funds of a child under Title IV are (3.605.4.B.11 (S2606), the reading the receipt table gives foster_care_payment) and as a foster boarder's payments are (cw_boarder_income, CO-4361) (coverage pass 4 CA4-7). Counted at value: in_kind_pay (3.605.2.A and G (S3159): the value of the item supplied, or its current market value). Counted above boarder allowance: boarder_payments (3.605.2.E.4.c-e (S3159): room and board above the one-person Food Assistance allotment per boarder and the provision costs, board above the allotment and the costs, a room above the costs (cw_boarder_income, CO-4361); foster care boarders' payments are not counted). Deducted from boarder payments: business_cost_boarder_provision (3.605.2.E.4.c-e (S3159), the boarder rule above). Excluded: work_study (3.605.4.A.24.a (S2205): \"Income received from a college work-study program grant shall be exempt\"), wioa_on_the_job_training (3.605.4.B.35 (S2606): \"Wages earned through subsidized employment programs including employment, apprenticeships, on-the-job training, and transitional jobs\", and B.16: \"Income received through the Workforce Innovation and Opportunity Act\"; WIOA on-the-job training is training by an employer in a job made available through a program that reimburses the employer part of the participant's wage, 29 U.S.C. 3102(44), so its wages are wages of a subsidized on-the-job training program received through WIOA: OQ-1022 resolved, step E1 Colorado Works), subsidized_employment (3.605.2.C (S2604): income from subsidized employment \"shall not be considered\" and B.35 (S2606) exempts subsidized employment wages with no proviso, so it is excluded whatever the reason the job ended; 3.605.2.C's own-fault proviso is read for a temporary job only, temporary_job and ended_through_own_fault (OQ-1141)). Costs deducted: business_cost_operating (3.605.2.E.1.a.1 (S1155)), business_cost_interest (3.605.2.E.1.a.1 (S1155): \"interest\"), business_cost_home_space (3.605.2.E.1.a.1 (S1155): \"if working out of the home, the cost of the room used when doing business\"). Costs not deducted, a paragraph saying so: business_cost_capital_principal (3.605.2.E.1.a.3 (S4103)), business_cost_depreciation (3.605.2.E.1.a.2 (S1155)). Costs not deducted, no rule found either way (not_deducted_no_rule_found: today's items do not deduct the cost and no text on file names it; the Colorado Works owner signs each row): business_cost_vehicle."
precision: "Earned-income records, step E0 (docs/reviews/earnings-e0.md; docs/design-earned-and-resource-records.md 2.4): every row is today's reading, what the program's items do now with the scalar fact the kind restates (wages: wages_gross, less its parts below; uniformed_services_special_pay: the uniformed_services_special_pay receipt, and combat_zone_pay_received (part of wages_gross); work_study: work_study_earnings; wioa_on_the_job_training: wioa_on_the_job_training_wages; summer_youth_employment: summer_youth_employment_wages; scsep_employment: scsep_wages and scsep_payments_received; subsidized_employment: subsidized_employment_wages; decennial_census_employment: decennial_census_wages_received; difficulty_of_care_payment: difficulty_of_care_payments_received; in_kind_pay: in_kind_compensation_value; employer_vendor_payment: employer_vendor_payments_received; employer_health_insurance_subsidy: employer_health_insurance_subsidy_received; self_employment_receipts: self_employment_gross_receipts; farm_self_employment_receipts: self_employment_gross_receipts of a farm (self_employment_is_farming, self_employment_is_farm_operation); boarder_payments: room_and_board_payments_received, and the board_only_payment and room_only_payment receipts; business_cost_operating: self_employment_operating_costs; business_cost_interest: self_employment_interest_costs; business_cost_capital_principal: self_employment_capital_principal_payments; business_cost_depreciation: no fact (a new kind); business_cost_home_space: self_employment_home_business_space_costs; business_cost_vehicle: self_employment_business_vehicle_costs; business_cost_boarder_provision: room_and_board_provision_costs), so the table changed no answer when the Colorado Works E1 track moved its readers onto it, except the rows that track changed as cited differences. Earned-income records, step E1 Colorado Works (docs/reviews/records-earnings-cash.md): Colorado Works' earned income reads this table (cw_gross_earned_income CO-1716 through cw_earned_pay CO-5140, cw_self_employment_net_profit CO-1706, cw_boarder_income CO-4361), for the unit's members and every person whose income is deemed to it. Rows changed in E1: wioa_on_the_job_training (counted_text_excludes to excluded, 3.605.4.B.35 and B.16; OQ-1022 resolved), employer_vendor_payment (not_counted_no_rule_found to counted, 3.605.2.B.1, S4381, which E0 missed), self_employment_receipts and farm_self_employment_receipts (counted to counted_net_of_costs, the same reading named so a reader can tell a business's receipts from pay). A temporary job's pay (temporary_job, ended_through_own_fault, job_end_date; 3.605.2.C) and a new source (job_start_date; 3.606.2.A.2) are fields read beside the row. Every kind has a row, and the type check refuses a lookup in a table that lacks one, so no kind is counted or left out by default; a new kind is added to every earnings table at once by the integration owner (design 4.3, rule 2), and a track changes only its own table's cells. A property of a pay (irregular, temporary_job, the job's dates, combat_zone, annual_contract_pay, pass_set_aside) is a field the program's items read beside the row, not a row. Rows marked for the owner's signature are listed in docs/reviews/earnings-e0.md."
