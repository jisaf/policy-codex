id: CO-5016
name: "Adult Financial: how each kind of receipt is treated"
identifier: af_receipt_treatment_table
kind: parameter
type: table keyed by option
options: [counted, counted_no_rule_excludes, counted_separately, counted_less_one_third_for_ssi_child, counted_less_child_gift_exclusion, not_income_to_client, not_counted_open_question, excluded, not_income, counted_taxable_amount, counted_beyond_school_expenses]
scope: global
program: AdultFinancial
meaning: "Adult Financial's counting table for unearned income (9 CCR 2503-5 3.520.785, 3.520.786), the same for the client, the client's spouse and the sponsor(s) (3.520.786: \"not countable to the client, client's spouse, or sponsor(s)\"), one row per kind of receipt. Counted, a paragraph of 3.520.785 naming it: social_security, pension, unemployment_compensation, colorado_works_cash, rental_income, workers_compensation, va_aid_and_attendance (B.4, S4044: \"Veteran compensation and pension based on service in the armed forces\", Aid and Attendance being a portion of the VA's pension payments, 10 CCR 2505-10 8.100.5.K, S2900; less the part used for uncovered medical care, 3.520.786.F: \"The remainder is countable\"), gambling_winnings (B.13, prizes). Counted because no rule excludes it (3.520.785 counts gross unearned income and no paragraph of 3.520.786 excludes it; the Adult Financial owner signs each of these rows): kinship_care_payment, colorado_works_diversion, colorado_works_supportive_services, refugee_resettlement, workforce_program_payment, vocational_training_allowance, charitable_need_based_cash, gift, migrant_farmworker_emergency_assistance, other_taxable, other_nontaxable. Special: ssi is counted separately (3.533.A.2.c deducts the $20 from unearned income other than SSI, and the full SSI is added back); child_support is counted less one-third for an SSI-age child (3.520.786.K, 20 CFR 416.1124(c)(11)): it is current support received for the client (3.520.785.B.25, S4793), since a child_support record is stated on the list of the person the support is for (receipts, CO-5000), so a person's own list holds only support for that person and support the client receives for another person (3.520.786.N, S2608), stated on that person's list, is never read as the client's income (coverage pass 4, CA4-5); charitable_gift_life_threatening_condition is counted less what K, (c)(21), excludes for a child (af_excluded_life_threatening_condition_gifts); adult_financial_cash is not income to the client (the grant itself) but is a relative's or sponsor's income (3.534.C). Excluded, with its paragraph of 3.520.786: income_tax_refund (A), energy_assistance_federal and energy_assistance_other (C), general_assistance and emergency_assistance (D), in_home_care_allowance and home_care_allowance (E: \"Personal care or home care allowance grants paid to the client ... shall be exempt as income\", for the client and, through 3.520.786's \"client, client's spouse, or sponsor(s)\", in the 3.534.C, 3.544.F and 3.549.F exemption tests and the deeming of a spouse's or sponsor's income; coverage review 3 H-5), educational_assistance (G), crime_victim_compensation (J), reverse_mortgage (L), foster_care_payment (M), child_support_arrears (P), and through K, 20 CFR 416.1124: federally_excluded_payment and dvsa_title_i_volunteer_payment ((b)), property_or_food_tax_refund ((c)(1)), interest_and_dividends and tax_exempt_interest ((c)(22)), uniformed_services_special_pay ((c)(19); read from the earnings list since step E1, below), americorps ((c)(23)), state_veteran_annuity ((c)(24)). Excluded through K, 20 CFR 416.1124(c)(14) (S2804: \"The value of any assistance paid with respect to a dwelling unit under— (i) The United States Housing Act of 1937; (ii) The National Housing Act\"): housing_utility_allowance, a utility allowance a subsidized housing program pays the tenant (coverage pass 4, CA4-4). Not income (not_income: no financial gain, 3.510 \"Income\", S4790: \"any financial gain by means of money payment or in-kind payment\"; coverage pass 4, CA4-3): loan (a bona fide loan the person must repay; 3.520.77.L, S3206: \"Monies from a bona fide loan are exempt in the month received. Any remaining balance shall be counted as a resource in the following month(s)\"), reimbursement (by its kind's meaning \"not a gain to the person\"), resource_liquidation (the proceeds of selling or converting the person's own resource, which is a resource before and after, 3.520.72.B.4-5, S2213), insurance_cash_value (cash value taken out of the person's own policy, already a resource, 3.520.72.B.7, S2213). Counted at the taxable amount (counted_taxable_amount): savings_account_distribution, of which the part the person's federal return counts (taxable_amount, CO-5000) is income from a retirement account (3.520.73.B.1.a, S3208, counts the account \"regardless of whether the client ... is receiving any monthly income from the account\") and the rest, a withdrawal from the person's own health, education or development account or a Roth IRA for its qualified purpose, is the person's own money and no gain (3.510 \"Income\"; OQ-1290 for the Roth case); the one statement of the split is taxable_amount, as Medicaid MAGI reads it (coverage pass 4, CA4-3). Counted beyond school expenses (counted_beyond_school_expenses): school_attendance_conditional_benefit and gi_bill_housing_food_allowance, \"VA educational assistance (G.I. Bill) payments or other military or veterans benefits, which are conditional upon school attendance, are income to the extent that they exceed expenses necessary for school attendance\" (3.520.785.B.16, S3212), read by af_school_attendance_benefits_counted (CO-6800), not G's educational loans and grants (coverage pass 4, CA4-2). Not counted pending an answer: sponsor_payment (OQ-888). Receipt records, migration phase 3 (kinds that were parts of other receipts before): school_attendance_conditional_benefit was excluded with the educational assistance it was part of (G) until coverage pass 4 (CA4-2, above); adoption_subsidy, early_childhood_research_payment, medicare_premium_refund and military_allotment are counted because no rule excludes them (3.520.785 and 3.520.786 name none of them; each was counted before as part of the other unearned income; the Adult Financial owner signs each; kinship_care_payment, adoption_subsidy and medicare_premium_refund are OQ-1293). Earned-income records, step E0 (OQ-1020): uniformed_services_special_pay, board_only_payment and room_only_payment are earnings (docs/design-earned-and-resource-records.md 2.3); their rows here were kept, with the reading they had, until Adult Financial read its earnings table. Earned-income records, step E1 Adult Financial (docs/reviews/records-earnings-cash.md): Adult Financial reads them from the earnings list (af_earnings_treatment_table, CO-5103), so their rows here are read_as_earnings (read from the earnings records, never counted as unearned income; a transition copy stated in both lists is counted once): board_only_payment and room_only_payment are boarder payments, earned income less the provision costs (3.520.783.C.2.b-c (S4380); they were counted here before as unearned income because no rule excludes them, which 3.520.783.C.2 contradicts), and uniformed_services_special_pay (37 U.S.C. 310 pay) is exempt there as it was here ((c)(19)); the kinds leave receipts in E2. Coverage pass 4 C4-5: dvsa_title_i_payment_at_or_above_minimum_wage is counted because no rule of 3.520.785-786 on file excludes a Title I payment at or above the minimum wage; before the kind existed such a payment was stated as other_taxable, counted the same way (a row for the owner's signature). NM-KL-3 and NM-KL-1 (2026-11-24): title_iv_or_bie_student_aid is excluded (G, as educational_assistance). wioa_adult_or_dislocated_worker_payment is counted because no rule excludes it, as workforce_program_payment, which held it before the kind existed (3.520.785 counts gross unearned income and no paragraph of 3.520.786 names it; the Adult Financial owner signs the row): 20 U.S.C. 1087uu (S5243) reaches a program 'financed in whole or in part with Federal funds' and 29 U.S.C. 3241(a)(2) (S4640) a 'Federal or federally assisted program based on need', and no text on file says whether the Old Age Pension, Aid to the Needy Disabled or Aid to the Blind is such a program (OQ-1520). allowance_from_institutionalized_spouse is counted because no rule excludes it (3.520.785 and 3.520.786 name none of it; the owner signs the row); where the paying spouse is the client's spouse whose income is deemed or counted with the client's, the two hold the same money, OQ-1521."
precision: "Receipt records, migration phase 1 (docs/reviews/receipts-migration-1.md). Every kind has a row, and the type check refuses a lookup in a table that lacks one, so no kind is counted or left out by default. A receipt is counted in the month received, whether it recurs or is paid once (3.520.785.B.1.a). A retroactive lump sum of SSI or of the Adult Financial grant is counted, in the month received, as unearned income other than SSI (OQ-887). The rows counted because no rule excludes them are the kinds the ledger counted before receipt records by silence (they were part of the other unearned income facts and not among af_excluded_unearned_income's sources, CO-2343); coverage pass 4 (CA4-3) settled the bona fide loan, the reimbursement, the proceeds of a resource and cash value taken from a policy by 3.510's definition of income (no financial gain) and 3.520.77.L. sponsor_payment was never read by Adult Financial's income before receipt records (money_received_from_sponsor was stated outside the unearned income facts) and stays uncounted until OQ-888 is answered. The parts of a receipt Adult Financial leaves out are fields of it: income set aside under a PASS (3.520.786.I), VA Aid and Attendance used for uncovered medical care (F), the medical, legal or related expenses of a workers' compensation claim included in the award (claim_expense; 3.520.785.B.9) and the part of life insurance, health insurance or injury proceeds spent or to be spent on the last illness and burial or on medical care (spent_on_covered_costs; B.14-15) (coverage pass 4, CA4-1: before, these were a second statement of the same money, unearned_income_offsetting_expenses, CO-4444, read as 0 when not stated). Records E2/H2 leftovers (2026-11-24, docs/reviews/records-e2-h2.md, section 5): the three receipt kinds that are earnings (uniformed_services_special_pay, board_only_payment, room_only_payment) left receipts (CO-5000), as design 2.3 planned, once no household or rule test stated a receipt copy of them; their rows went with them, and the option they alone used (read_as_earnings) with them. The money is stated once, as an earnings record (CO-5100), and read through the program's earnings table. The text above that names the three rows is their history."
