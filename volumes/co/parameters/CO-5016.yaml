rationale: "Receipt records, migration phase 1 (product-owner decision of 2026-11-23): Adult Financial's one counting table, kind by kind, replacing af_excluded_unearned_income (CO-2343), whose sources each named a part of the gross unearned income facts. One table for the client and a deemed spouse, parent or sponsor, so the deeming path cannot drift from the client's (coverage review 3 H-1, H-2)."
