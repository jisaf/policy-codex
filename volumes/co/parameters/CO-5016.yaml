id: CO-5016
name: "Adult Financial: how each kind of receipt is treated"
identifier: af_receipt_treatment_table
kind: parameter
type: table keyed by option
options: [counted, counted_no_rule_excludes, counted_separately, counted_less_one_third_for_ssi_child, counted_less_child_gift_exclusion, not_income_to_client, not_counted_open_question, excluded]
scope: global
program: AdultFinancial
meaning: "Adult Financial's counting table for unearned income (9 CCR 2503-5 3.520.785, 3.520.786), the same for the client, the client's spouse and the sponsor(s) (3.520.786: \"not countable to the client, client's spouse, or sponsor(s)\"), one row per kind of receipt. Counted, a paragraph of 3.520.785 naming it: social_security, pension, unemployment_compensation, colorado_works_cash, rental_income, workers_compensation, va_aid_and_attendance (less the part used for uncovered medical care, 3.520.786.F), gambling_winnings (B.13, prizes). Counted because no rule excludes it (3.520.785 counts gross unearned income and no paragraph of 3.520.786 excludes it; the Adult Financial owner signs each of these rows): resource_liquidation, loan, reimbursement, kinship_care_payment, colorado_works_diversion, colorado_works_supportive_services, housing_utility_allowance, gi_bill_housing_food_allowance, refugee_resettlement, workforce_program_payment, vocational_training_allowance, charitable_need_based_cash, gift, migrant_farmworker_emergency_assistance, other_taxable, other_nontaxable. Special: ssi is counted separately (3.533.A.2.c deducts the $20 from unearned income other than SSI, and the full SSI is added back); child_support is counted less one-third for an SSI-age child (3.520.786.K, 20 CFR 416.1124(c)(11)); charitable_gift_life_threatening_condition is counted less what K, (c)(21), excludes for a child (af_excluded_life_threatening_condition_gifts); adult_financial_cash is not income to the client (the grant itself) but is a relative's or sponsor's income (3.534.C). Excluded, with its paragraph of 3.520.786: income_tax_refund (A), energy_assistance_federal and energy_assistance_other (C), general_assistance and emergency_assistance (D), in_home_care_allowance (E), educational_assistance (G), crime_victim_compensation (J), reverse_mortgage (L), foster_care_payment (M), child_support_arrears (P), and through K, 20 CFR 416.1124: federally_excluded_payment and dvsa_title_i_volunteer_payment ((b)), property_or_food_tax_refund ((c)(1)), interest_and_dividends and tax_exempt_interest ((c)(22)), uniformed_services_special_pay ((c)(19)), americorps ((c)(23)), state_veteran_annuity ((c)(24)). Not counted pending an answer: sponsor_payment (OQ-888)."
precision: "Receipt records, migration phase 1 (docs/reviews/receipts-migration-1.md). Every kind has a row, and the type check refuses a lookup in a table that lacks one, so no kind is counted or left out by default. A receipt is counted in the month received, whether it recurs or is paid once (3.520.785.B.1.a). A retroactive lump sum of SSI or of the Adult Financial grant is counted, in the month received, as unearned income other than SSI (OQ-887). The rows counted because no rule excludes them are the kinds the ledger counted before receipt records by silence (they were part of the other unearned income facts and not among af_excluded_unearned_income's sources, CO-2343); whether 3.520.785 counts a bona fide loan or a reimbursement is the owner's to confirm. sponsor_payment was never read by Adult Financial's income before receipt records (money_received_from_sponsor was stated outside the unearned income facts) and stays uncounted until OQ-888 is answered. The parts of a receipt Adult Financial leaves out are fields of it: income set aside under a PASS (3.520.786.I) and VA Aid and Attendance used for uncovered medical care (F)."
