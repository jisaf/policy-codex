id: CO-235
name: SSI federal benefit rate, individual
identifier: ma_ssi_federal_benefit_rate_individual
kind: parameter
type: money
scope: global
program: Medicaid
meaning: The maximum monthly SSI federal benefit rate for an eligible individual with no eligible spouse - the income standard 8.100.6.C and the SSI-related income test compare countable income against.
precision: Set annually by SSA's cost-of-living notice; versioned by effective date.
versions:
  - from: "2026-01-01"
    value: 994
    source: S319
sources: [S319]
tags: [ma, non_magi, income]
rationale: "No existing item states the SSI federal benefit rate. ma_meets_ssi_income_standard (CO-609) and the 300%-of-FBR special income group (batch 9) both need it. Versioned because SSA republishes it annually by COLA, matching the phase-4 brief's direction to version it from 2026-01-01."
