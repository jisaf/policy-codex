id: CO-2274
name: SSI-related unemancipated student age limit
identifier: ma_ssi_unemancipated_student_age_limit
kind: parameter
type: whole number
scope: global
program: Medicaid
meaning: "The age before which a child living with a parent who regularly attends school or training is an unemancipated child for the SSI-related income allocations - 10 CCR 2505-10 § 8.100.5.H.2.a.ii (\"a child under age 21\")."
value: 21
sources: [S1506]
tags: [ma, non_magi, age]
rationale: "OQ-83: ma_is_ssi_unemancipated_child (CO-2275) needs the age as a parameter."
