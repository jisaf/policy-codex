id: CO-1200
name: Old Age Pension payment floor standard
identifier: af_oap_payment_floor
kind: parameter
type: money
scope: global
program: AdultFinancial
meaning: The minimum monthly OAP grant payment an eligible OAP client may receive; a State Supplementary Payment raises a computed grant below it to this figure, per 9 CCR 2503-5 3.510 ("Payment Floor Standard"), 3.530.C, 3.531.D.2 and 3.532.B.
precision: The floor is updated annually with the cost-of-living adjustment (3.510); each update is a new version. MOE lump-sum payments (3.531.D.1) are irregular, are not an entitlement and are not modeled.
versions:
  - from: "2026-01-01"
    value: 189
    source: S700
sources: [S700, S702, S703, S704]
tags: [cash, oap, income]
rationale: No existing item states the OAP payment floor, which the version of 9 CCR 2503-5 effective 2026-03-02 (D-80) adds; af_oap_grant (CO-951) needs it to raise a grant below the floor. Versioned because 3.530.C states an effective date and 3.510 says the floor is updated annually.
