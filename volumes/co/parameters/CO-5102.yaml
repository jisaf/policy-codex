id: CO-5102
name: "LEAP: how each kind of earnings is treated"
identifier: leap_earnings_treatment_table
kind: parameter
type: table keyed by option
options: [counted, counted_no_rule_excludes, counted_at_value, counted_self_employment, counted_as_unearned_income, excluded, excluded_age_55_or_older, deducted, not_deducted_no_rule_found, counted_unless_foster_care]
scope: global
program: LEAP
meaning: "LEAP's counting table for earnings (9 CCR 2503-7 3.752.21-23 and 3.755.21.I), one row per kind of earnings record (earnings, CO-5100). Counted, a paragraph naming it: wages (3.752.22.B-C (S2713): earned ongoing income, weekly, bi-weekly and semi-monthly pay converted). Counted because no rule excludes it (3.752.22.B counts the countable gross earned income and no paragraph of 3.752.23 excludes it; the LEAP owner signs each of these rows): uniformed_services_special_pay, wioa_on_the_job_training, summer_youth_employment, subsidized_employment, decennial_census_employment. Counted at value: in_kind_pay (3.752.22.C.4 (S3305): earned income at the declared value of the item or service). Counted as self-employment: self_employment_receipts (3.755.21.I.1 as amended effective November 1, 2026 (S2719): the declared total gross income received in the full month prior to the application date, less the costs the cost rows deduct (leap_self_employment_income, CO-1712)), farm_self_employment_receipts (as self_employment_receipts (S1084, S2719): no LEAP text treats a farm apart). Counted as unearned income: boarder_payments (3.752.21 (S4100): countable unearned income includes \"payments from any other source, which is considered to be a gain or benefit to the applicant or recipient\"; no paragraph of 3.752.23 excludes them; counted at the gross payment (leap_boarder_payments, CO-5124; finding E1-L2: before E1 LEAP counted a payment for a room only or meals only, as receipts, and not one for room and board)). Excluded age 55 or older: scsep_employment (3.752.23.CC (S3301): funds received by persons 55 or older under SCSEP; counted below that age (leap_scsep_exclusion_min_age; leap_scsep_wages, CO-5122)). Excluded: work_study (3.752.23.P (S2208): \"All financial aid monies ... including work study\"), employer_vendor_payment (3.752.23.T (S4105): \"Payments made on behalf of the household directly to others\"), employer_health_insurance_subsidy (3.752.23.HH (S3301)). Costs deducted: business_cost_operating (3.755.21.I.2 (S1084): receipts for business-related expenses are required for a deduction (leap_self_employment_allowable_costs, CO-1711)), business_cost_interest (3.755.21.I.2 (S1084), as CO-1711 reads it), business_cost_vehicle (3.755.21.I.2 (S1084), as CO-1711 reads it). Costs not deducted, no rule found either way (not_deducted_no_rule_found: no text on file names the cost; the LEAP owner signs each row): business_cost_capital_principal, business_cost_depreciation, business_cost_home_space, business_cost_boarder_provision. Coverage pass 4 X4-2 (docs/reviews/coverage4-care-energy.md): difficulty_of_care_payment is counted_unless_foster_care: 3.752.23.U (S3300) excludes \"Payment received as foster care/kinship income\", which a difficulty of care payment for a person placed in foster care is, and no paragraph excludes one for a person on a Home and Community Based Services waiver; the record's foster_care field says which (leap_wages_in_income_verification_period CO-3912, leap_ongoing_wage_streams CO-5120, leap_ongoing_dated_wages CO-5121)."
precision: "Earned-income records, step E0 (docs/reviews/earnings-e0.md; docs/design-earned-and-resource-records.md 2.4) set every row to the reading of the items before the records; step E1 (LEAP; docs/reviews/records-earnings-care-energy.md) moved LEAP's readers onto the table: leap_wages_in_income_verification_period (CO-3912), leap_ongoing_wage_streams (CO-5120) and leap_ongoing_dated_wages (CO-5121) read the rows counted, counted_no_rule_excludes and counted_at_value; leap_scsep_wages (CO-5122) the row excluded_age_55_or_older, applying the age outside the sum; leap_self_employment_gross_receipts (CO-5126) and leap_self_employment_income (CO-1712) the rows counted_self_employment; leap_self_employment_allowable_costs (CO-1711) the rows deducted; leap_boarder_payments (CO-5124) the row counted_as_unearned_income. E1 changed two rows: the business rows from counted to counted_self_employment (a name for the reader, no change of reading), and boarder_payments from not_counted_no_rule_found to counted_as_unearned_income (finding E1-L2, an answer change cited to 3.752.21). The kinds that left the receipts (uniformed_services_special_pay, and boarder payments for a room only or meals only; design 2.3, OQ-1020) are read here and not in leap_receipt_treatment_table (CO-5001), whose rows for them read counted_in_earnings. Every kind has a row, and the type check refuses a lookup in a table that lacks one, so no kind is counted or left out by default; a new kind is added to every earnings table at once by the integration owner (design 4.3, rule 2), and a track changes only its own table's cells. A property of a pay (irregular, temporary_job, the job's dates, combat_zone, annual_contract_pay, pass_set_aside) is a field the program's items read beside the row, not a row. Rows marked for the owner's signature are listed in docs/reviews/earnings-e0.md, section 7, and docs/reviews/records-earnings-care-energy.md."
