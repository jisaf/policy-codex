id: CO-5102
name: "LEAP: how each kind of earnings is treated"
identifier: leap_earnings_treatment_table
kind: parameter
type: table keyed by option
options: [counted, counted_no_rule_excludes, counted_at_value, excluded, excluded_age_55_or_older, not_counted_no_rule_found, deducted, not_deducted_no_rule_found]
scope: global
program: LEAP
meaning: "LEAP's counting table for earnings (9 CCR 2503-7 3.752.22-23 and 3.755.21.I), one row per kind of earnings record (earnings, CO-5100). Counted, a paragraph naming it: wages (3.752.22.B-C (S2713): earned ongoing income, weekly, bi-weekly and semi-monthly pay converted), self_employment_receipts (3.755.21.I (S1084) and 3.752.22 (S2719): the declared gross income of the month before the application, less the costs the cost rows deduct), farm_self_employment_receipts (as self_employment_receipts (S1084, S2719): no LEAP text treats a farm apart). Counted because no rule excludes it (3.752.22.B counts the countable gross earned income and no paragraph of 3.752.23 excludes it; the LEAP owner signs each of these rows): uniformed_services_special_pay, wioa_on_the_job_training, summer_youth_employment, subsidized_employment, decennial_census_employment, difficulty_of_care_payment. Counted at value: in_kind_pay (3.752.22.C.4 (S3305): earned income at the declared value of the item or service). Excluded age 55 or older: scsep_employment (3.752.23.CC (S3301): funds received by persons 55 or older under SCSEP; counted below that age (leap_scsep_exclusion_min_age)). Excluded: work_study (3.752.23.P (S2208): \"All financial aid monies ... including work study\"), employer_vendor_payment (3.752.23.T (S4105): \"Payments made on behalf of the household directly to others\"; today's items do not read employer_vendor_payments_received), employer_health_insurance_subsidy (3.752.23.HH (S3301)). Not counted, no rule found either way (not_counted_no_rule_found: today's items do not read the fact the kind restates and no text on file names it; the LEAP owner signs each row): boarder_payments (today's items do not read room_and_board_payments_received; no LEAP text names boarder payments (the LEAP owner signs; 3.752.21 counts \"payments from any other source\" as unearned income)). Costs deducted: business_cost_operating (3.755.21.I.2 (S1084): receipts for business-related expenses are required for a deduction (leap_self_employment_allowable_costs, CO-1711)), business_cost_interest (3.755.21.I.2 (S1084), as CO-1711 reads it), business_cost_vehicle (3.755.21.I.2 (S1084), as CO-1711 reads it). Costs not deducted, no rule found either way (not_deducted_no_rule_found: today's items do not deduct the cost and no text on file names it; the LEAP owner signs each row): business_cost_capital_principal, business_cost_depreciation, business_cost_home_space, business_cost_boarder_provision."
precision: "Earned-income records, step E0 (docs/reviews/earnings-e0.md; docs/design-earned-and-resource-records.md 2.4): every row is today's reading, what the program's items do now with the scalar fact the kind restates (wages: wages_gross, less its parts below; uniformed_services_special_pay: the uniformed_services_special_pay receipt, and combat_zone_pay_received (part of wages_gross); work_study: work_study_earnings; wioa_on_the_job_training: wioa_on_the_job_training_wages; summer_youth_employment: summer_youth_employment_wages; scsep_employment: scsep_wages and scsep_payments_received; subsidized_employment: subsidized_employment_wages; decennial_census_employment: decennial_census_wages_received; difficulty_of_care_payment: difficulty_of_care_payments_received; in_kind_pay: in_kind_compensation_value; employer_vendor_payment: employer_vendor_payments_received; employer_health_insurance_subsidy: employer_health_insurance_subsidy_received; self_employment_receipts: self_employment_gross_receipts; farm_self_employment_receipts: self_employment_gross_receipts of a farm (self_employment_is_farming, self_employment_is_farm_operation); boarder_payments: room_and_board_payments_received, and the board_only_payment and room_only_payment receipts; business_cost_operating: self_employment_operating_costs; business_cost_interest: self_employment_interest_costs; business_cost_capital_principal: self_employment_capital_principal_payments; business_cost_depreciation: no fact (a new kind); business_cost_home_space: self_employment_home_business_space_costs; business_cost_vehicle: self_employment_business_vehicle_costs; business_cost_boarder_provision: room_and_board_provision_costs), so the table changes no answer when the LEAP E1 track moves its readers onto it; no rule reads it during E0. Every kind has a row, and the type check refuses a lookup in a table that lacks one, so no kind is counted or left out by default; a new kind is added to every earnings table at once by the integration owner (design 4.3, rule 2), and a track changes only its own table's cells. A property of a pay (irregular, temporary_job, the job's dates, combat_zone, annual_contract_pay, pass_set_aside) is a field the program's items read beside the row, not a row. Rows marked for the owner's signature are listed in docs/reviews/earnings-e0.md."
versions:
  - {from: "2000-01-01", value: {wages: counted, uniformed_services_special_pay: counted_no_rule_excludes, work_study: excluded, wioa_on_the_job_training: counted_no_rule_excludes, summer_youth_employment: counted_no_rule_excludes, scsep_employment: excluded_age_55_or_older, subsidized_employment: counted_no_rule_excludes, decennial_census_employment: counted_no_rule_excludes, difficulty_of_care_payment: counted_no_rule_excludes, in_kind_pay: counted_at_value, employer_vendor_payment: excluded, employer_health_insurance_subsidy: excluded, self_employment_receipts: counted, farm_self_employment_receipts: counted, boarder_payments: not_counted_no_rule_found, business_cost_operating: deducted, business_cost_interest: deducted, business_cost_capital_principal: not_deducted_no_rule_found, business_cost_depreciation: not_deducted_no_rule_found, business_cost_home_space: not_deducted_no_rule_found, business_cost_vehicle: deducted, business_cost_boarder_provision: not_deducted_no_rule_found}, source: S2713}
