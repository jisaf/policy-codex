id: CO-5107
name: "Medicaid SSI method: how each kind of earnings is treated"
identifier: ma_ssi_earnings_treatment_table
kind: parameter
type: table keyed by option
options: [counted, counted_no_rule_excludes, counted_text_excludes, excluded, not_counted_text_counts, not_counted_no_rule_found, deducted, not_deducted, not_deducted_no_rule_found]
scope: global
program: Medicaid
meaning: "Medicaid SSI method's counting table for earnings (10 CCR 2505-10 8.100.5.F with 8.100.3.K and 20 CFR 416 Subpart K as the ledger reads them (deeming, the spousal allowances, long-term care, the buy-ins and the Medicare Savings Programs)), one row per kind of earnings record (earnings, CO-5100). Counted, a paragraph naming it: wages (8.100.5.F.4.a (S3001): wages, salaries, commissions, bonuses, severance pay), self_employment_receipts (8.100.5.F.4.b (S3001), 8.100.3.K.9 (S1154): net profit, the gross income less the cost of doing business), farm_self_employment_receipts (as self_employment_receipts (S1154); none after the person ceases to farm (8.100.3.K.10.a)). Counted because no rule excludes it (8.100.5.F.4 counts wages and net earnings from self-employment (S3001) and no paragraph of F.6 exempts it; the Medicaid owner signs each of these rows): uniformed_services_special_pay (as Medicaid's SSI-method receipt row counts it (ma_ssi_receipt_treatment_table, CO-5510)), work_study (counted as wages; the student earned income exclusion (20 CFR 416.1112(c)(3), S2210) is applied outside the table to a student's earnings (ma_ssi_excluded_earned_income, CO-2471)), summer_youth_employment (8.100.5.F.6.p (S3617) exempts the YEDPA youth projects' payments; whether a summer youth program is one is for the owner), scsep_employment, subsidized_employment, difficulty_of_care_payment, employer_health_insurance_subsidy. Excluded: decennial_census_employment (8.100.5.F.6.z (S3617): all wages the Census Bureau paid for temporary decennial Census employment). Not counted, no rule found either way (not_counted_no_rule_found: today's items do not read the fact the kind restates and no text on file names it; the Medicaid owner signs each row): employer_vendor_payment (today's items do not read employer_vendor_payments_received (the owner signs)). Not counted although the text on file counts it (not_counted_text_counts: today's reading, kept so this step changes no answer; a finding for the Medicaid track, which fixes it as a cited difference): in_kind_pay (8.100.3.K.3-4 (S4107) make pay in kind for services earned income; today's SSI-method items do not read in_kind_compensation_value (OQ-1023)), boarder_payments (8.100.3.K.10.c-e (S4107) count board, room, and room and board payments as earned income above the allotment and the costs; today's SSI-method items do not read room_and_board_payments_received (OQ-1023)). Counted although the text on file excludes it in whole or in part (counted_text_excludes: today's reading, kept so this step changes no answer; a finding for the Medicaid track): wioa_on_the_job_training (8.100.3.K.8.c (S4107) exempts WIA wages paid to a dependent child applying for or receiving Medical Assistance, for up to six months a calendar year (K.8.a counts a caretaker relative's); today's items count every WIOA on-the-job training wage as part of wages_gross (OQ-1023)). Costs deducted: business_cost_operating (8.100.3.K.9.a (S1154), as ma_self_employment_business_costs (CO-1703) reads it). Costs not deducted, a paragraph saying so: business_cost_capital_principal (8.100.3.K.9.b.ii (S4107)), business_cost_depreciation (8.100.3.K.9.b.i (S1154, S4107)). Costs not deducted, no rule found either way (not_deducted_no_rule_found: today's items do not deduct the cost and no text on file names it; the Medicaid owner signs each row): business_cost_interest (today's items deduct only the operating costs (CO-1703); K.9.a does not name interest (the owner signs)), business_cost_home_space, business_cost_vehicle, business_cost_boarder_provision."
precision: "Earned-income records, step E0 (docs/reviews/earnings-e0.md; docs/design-earned-and-resource-records.md 2.4): every row is today's reading, what the program's items do now with the scalar fact the kind restates (wages: wages_gross, less its parts below; uniformed_services_special_pay: the uniformed_services_special_pay receipt, and combat_zone_pay_received (part of wages_gross); work_study: work_study_earnings; wioa_on_the_job_training: wioa_on_the_job_training_wages; summer_youth_employment: summer_youth_employment_wages; scsep_employment: scsep_wages and scsep_payments_received; subsidized_employment: subsidized_employment_wages; decennial_census_employment: decennial_census_wages_received; difficulty_of_care_payment: difficulty_of_care_payments_received; in_kind_pay: in_kind_compensation_value; employer_vendor_payment: employer_vendor_payments_received; employer_health_insurance_subsidy: employer_health_insurance_subsidy_received; self_employment_receipts: self_employment_gross_receipts; farm_self_employment_receipts: self_employment_gross_receipts of a farm (self_employment_is_farming, self_employment_is_farm_operation); boarder_payments: room_and_board_payments_received, and the board_only_payment and room_only_payment receipts; business_cost_operating: self_employment_operating_costs; business_cost_interest: self_employment_interest_costs; business_cost_capital_principal: self_employment_capital_principal_payments; business_cost_depreciation: no fact (a new kind); business_cost_home_space: self_employment_home_business_space_costs; business_cost_vehicle: self_employment_business_vehicle_costs; business_cost_boarder_provision: room_and_board_provision_costs), so the table changes no answer when the Medicaid E1 track moves its readers onto it; no rule reads it during E0. Every kind has a row, and the type check refuses a lookup in a table that lacks one, so no kind is counted or left out by default; a new kind is added to every earnings table at once by the integration owner (design 4.3, rule 2), and a track changes only its own table's cells. A property of a pay (irregular, temporary_job, the job's dates, combat_zone, annual_contract_pay, pass_set_aside) is a field the program's items read beside the row, not a row. Rows marked for the owner's signature are listed in docs/reviews/earnings-e0.md."
