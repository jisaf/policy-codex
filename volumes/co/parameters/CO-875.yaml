tags: [income, household]
rationale: "Previously a per-person supplied fact (kind: supplied) with a single illustrative $3,000-3,200 figure not keyed to leap_household_size (CO-1001) at all; the review (docs/reviews/cccap-leap-phase-6.md, C-13, should-fix) found a household's ceiling could silently mismatch its own derived size, and that a text-derived figure (backed out of CCCAP's own 85% SMI table, S485, the only state median income figure this library's fetched text states) is available and an order of magnitude closer to the true LIHEAP figure than the prior $3,000 constant. Modeled as a parameter table keyed by household size, the same shape as cccap_poverty_guideline_table (CO-323, the nearest same-shape item), rather than kept as a per-person supplied fact, so leap_income_within_limit (CO-1003) cannot key two members of the same household to different ceilings. leap_income_within_limit (CO-1003) reads it via lookup on leap_household_size (CO-1001). D-67 (S557) now supplies LEAP's own 2026-27 season figures directly, so this fix round adds a new dated version rather than continuing to back the value out of CCCAP's 85% SMI column; the prior CCCAP-derived version stays in the history."
