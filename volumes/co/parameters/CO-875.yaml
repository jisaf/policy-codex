id: CO-875
name: LEAP income limit, 60 percent state median income, by household size
identifier: leap_income_limit_monthly
kind: parameter
type: table keyed by household size
scope: global
program: LEAP
meaning: The monthly income ceiling for a LEAP household of a given size - sixty percent (60%) of the state median income level, per 9 CCR 2503-7 3.752.22.D.
precision: "3.752.22.D states the 60% figure as a percentage of an HHS state median income table (45 C.F.R. 96.85 and a LIHEAP Information Memorandum) that is not in this volume's document library. D-67 (CDHS's LEAP program page, an Internet Archive capture retrieved 2026-09-18, S557) now states the 2026-27 season's own maximum gross monthly income table by household size, sizes 1-15, and the current version below is keyed to those figures directly rather than backed out of another program's SMI column - see OQ-122 for what D-67 still leaves open (the benefit matrix is not published on the page, the page is an archive capture rather than the primary HHS/45 C.F.R. table, and the dollar figures are a season figure that 3.752.22.D's bare percentage does not itself state). D-67's table applies to the 2026-27 season, which the page states begins November 1, 2026 (S557); the version below is dated from that start. Sizes above 15 add leap_income_limit_monthly_each_additional (CO-344): D-67's rows 6-15 step by $218 seven times and $217 twice (8->9 is +217, 13->14 is +217, every other step is +218; see CO-344's precision for the full row-by-row diffs), so the steps are not a single constant - the each-additional parameter is keyed to the table's last observed step ($218, sizes 14-15), per this batch's instruction to key the table to all 15 rows D-67 states and use the last step above that. The prior version (from 2024-10-01) was CCCAP-derived (backed out of 8 CCR 1403-1 3.111.H.2's 85% SMI column, S485, per docs/reviews/cccap-leap-phase-6.md C-13) and is kept as history rather than discarded, since it was already carried as a dated version rather than a plain value."
