id: CO-875
name: "LEAP income limit, 60 percent state median income, by household size"
identifier: leap_income_limit_monthly
kind: parameter
type: table keyed by household size
scope: global
program: LEAP
meaning: "The maximum gross monthly income for a LEAP household of a given size, 1 through 15 - sixty percent (60%) of the state median income level, per 9 CCR 2503-7 3.752.22.D - as the Department publishes it for each heating season."
precision: "The 2026-2027 season (November 1, 2026 through April 30, 2027) uses the Department's published table (D-144, S1406), computed from the state median income HHS released in April 2026. 3.752.22.D as in force through October 31, 2026 (S773) named the federal fiscal year 2023 table and LIHEAP IM 2025-02; the amendment effective November 1, 2026 (D-173, S1818) names the federal fiscal year 2026 release the season table applies, so the rule and the published figures now agree (OQ-122, resolved; second-pass review P2: the precision quoted the superseded wording as current). Keyed 1 through 15: 3.751.2.C (S1407) allows at most fifteen household members, so no figure beyond fifteen is needed. No version covers a date outside the season; a LEAP determination is made only within it (leap_month_in_eligibility_period). CDHS review S-7: the production page https://cdhs.colorado.gov/leap was tried once and refused (HTTP 403), so D-144 stays the source of the figures (OQ-532). The LEAP rule amendment effective November 1, 2026 (D-173, S1818-S1819) now states the standard as 60% of the state median income HHS released for federal fiscal year 2026 in the LIHEAP memorandum of April 24, 2026 - the release D-144 names - and the figures agree with CCCAP's 85% state median income column for the same release (8 CCR 1403-1 3.111.H.3, D-87) scaled by 60/85 (size 4: $10,283.37 x 60/85 = $7,258.85, published $7,258)."
versions:
  - from: "2026-11-01"
    to: "2027-05-01"
    value: { "1": 3774, "2": 4936, "3": 6097, "4": 7258, "5": 8420, "6": 9581, "7": 9799, "8": 10017, "9": 10234, "10": 10452, "11": 10670, "12": 10888, "13": 11106, "14": 11323, "15": 11541 }
    source: S1406
sources: [S1406, S1407, S773, S491, S1818, S1819]
tags: [income, household]
open: [OQ-532]
rationale: "Previously a per-person supplied fact, then (review docs/reviews/cccap-leap-phase-6.md, C-13) an illustrative table backed out of CCCAP's 85% SMI column (S485) because LEAP's own figures were not fetched. Phase-10 open-question sweep: the Department's 2026-2027 season table (D-144, S1406) replaces the illustrative figures; it is keyed by household size so leap_income_within_limit (CO-1003) reads one ceiling for the whole household through leap_household_size (CO-1001)."
