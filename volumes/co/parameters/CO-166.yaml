id: CO-166
name: SNAP ABAWD maximum age
identifier: snap_abawd_max_age
kind: parameter
type: whole number
scope: global
program: SNAP
meaning: The oldest age subject to the SNAP time limit (the ABAWD (able-bodied adult without dependents) time limit) under 7 U.S.C. 2015(o)(3)(A), as amended by Pub. L. 119-21 sec. 10102, which excepts a person "under 18, or over 65, years of age". A person aged 65 is excepted, so the oldest age subject to the time limit is 64.
precision: Inclusive (docs/conventions.md, rule 8); snap_is_in_abawd_age_range (CO-412) tests age at most this figure.
assumption: "Read from the statute, from its enactment on July 4, 2025: sec. 10102 kept the words of the exception it replaced, \"over ... years of age\" (S127, S128), and the federal regulation has read those words as \"... years of age or older\" since the time limit began: the former statute's \"over 50 years of age\" as \"50 years of age or older\", and the Fiscal Responsibility Act's \"over 55 years of age\" (Pub. L. 118-5 sec. 311, S2113) as \"Under 18 or 55 years of age or older\" (7 CFR 273.24(c)(1), (c)(10), S2112). The same words now read \"over 65\", so a person aged 65 is excepted and the oldest age subject to the time limit is 64. FNS's proposed 7 CFR 273.24(c)(1) (91 FR 72439, Nov. 10, 2026: \"Under 18 or 65 years of age or older\", S1300-S1302), published after some of the determinations this applies to, corroborates the reading and is not its source; no federal or Colorado text reads \"over 65\" as reaching age 65 (Colorado's 10 CCR 2506-1 4.311 still states the pre-2025 age, S749). FNS's implementation memo, which would state an implementation date, is not reachable (www.usda.gov refused it). If the final rule differs, this parameter gains a version."
statute_override: "Federal law overrides the ABAWD definition of 10 CCR 2506-1 4.000, which still ends the age range at 54: Pub. L. 119-21 sec. 10102 (July 4, 2025) excepts persons over 65, words the federal regulation has always read as 65 or older, so the oldest age subject to the time limit is 64 (OQ-31, OQ-533)."
versions:
  - from: "2025-07-04"
    value: 64
    source: S128
sources: [S127, S128, S2112, S2113, S1300, S1301, S1302]
tags: [abawd, age, legal]
open: [OQ-533]
rationale: "7 U.S.C. 2015(o)(3)(A) as amended (S127, S128) is the current-law ceiling for the ABAWD age range; batch 1's snap_elderly_age (60) and this batch's snap_work_registration_max_age (59) are different thresholds for different rules and do not serve this one. The open-question sweep (OQ-31) moved the value from 65 to 64 on FNS's reading in its proposed rule and dated it from enactment. Legal UX walkthrough L9 (audit fix round 4): the July 4, 2025 version rests on the statute's words as the regulation has always read them (S2112, S2113), with FNS's November 2026 proposed rule cited as corroboration, not as the source."
