id: CO-169
name: SNAP ABAWD countable month limit
identifier: snap_abawd_countable_month_limit
kind: parameter
type: whole number
scope: global
program: SNAP
meaning: The number of countable months an individual may accrue within the 36-month period before losing ABAWD eligibility.
value: 3
sources: [S127, S130, S132]
tags: [abawd]
rationale: 7 U.S.C. 2015(o)(2) (S127), 7 CFR 273.24(b) (S130), and 10 CCR 2506-1 4.311.3 (S132) all state the 3-countable-month limit that snap_abawd_time_limit_status compares snap_abawd_countable_months_in_period against.
