rationale: "Final verification pass 3, P2-1 (OQ-516 resolved): the 2025 figure is from CMS's CMCS Informational Bulletin of November 15, 2024 (D-280). OQ-91 asked which base Colorado elected and the 2026 figure. The current § 8.100.5.M.2.a.ii (D-65) states the $500,000 base indexed by CPI, and CMS's 2026 SSI and Spousal Impoverishment Standards chart (D-72) states the minimum home equity limit, $752,000.00, for 2026. ma_home_equity_disqualifies (CO-650) needs it. Vocabulary fix round (docs/reviews/vocabulary-reuse.md, N-1): renamed from home_equity_limit; a Medicaid parameter without the program prefix. Precision history (moved from precision, engineering follow-up pass task 5): Converted from a supplied fact in phase 7 (OQ-91); identifier and id unchanged."
