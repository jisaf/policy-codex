id: CO-831
name: Home equity limit
identifier: ma_home_equity_limit
kind: parameter
type: money
scope: global
program: Medicaid
meaning: The home equity value above which an individual's home disqualifies them from Long-Term Care assistance - Colorado's limit is the $500,000 figure (in effect January 1, 2006 through December 31, 2010) increased year to year by the consumer price index for all urban consumers, rounded to the nearest $1,000 (10 CCR 2505-10 § 8.100.5.M.2.a.ii), which is the federal minimum home equity limit of 42 U.S.C. 1396p(f)(1)(A) and (C).
precision: Colorado's text uses the indexed $500,000 base, not a higher state election up to the $750,000 base, so the figure is CMS's published minimum home equity limit. 
