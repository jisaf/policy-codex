id: CO-2457
name: "Medicaid: Working Adults with Disabilities premium by income band"
identifier: ma_wawd_premium_table
kind: parameter
type: table keyed by income band
scope: global
program: Medicaid
meaning: "The monthly premium for the Working Adults with Disabilities Buy-In by the band of the member's countable income as a share of the poverty guideline, each key the band's inclusive upper bound (10 CCR 2505-10 § 8.100.6.P.1.f.iii); the bands and amounts are the rows of each version, and are re-based at the start of each State fiscal year (P.1.f.iv)."
precision: The version is dated from the start of State fiscal year 2026-27, July 1, 2026, the year of the rule text fetched (version effective 11/14/2026); earlier fiscal years' amounts were not fetched, so a month before July 2026 has no premium figure.
versions:
  - {from: "2026-07-01", value: {"0.40": 0, "1.33": 25, "2.00": 90, "3.00": 130, "4.50": 200}, source: S1727}
review_by: "2027-07-01"
sources: [S1727]
tags: [ma, non_magi, buy_in, income]
rationale: "S-8 of the HCPF review overruled OQ-82: the premiums are re-based each State fiscal year, so they are dated parameters, read with P48, rather than literals in ma_wawd_premium (CO-619)."
