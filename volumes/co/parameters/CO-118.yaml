id: CO-118
name: SNAP resource limit
identifier: snap_resource_limit
kind: parameter
type: money
scope: global
program: SNAP
meaning: The countable resource limit for a Standard Eligibility household that does not include an elderly or disabled member.
versions:
  - from: "2025-10-01"
    to: "2026-10-01"
    value: 3000
    source: S56
  - from: "2026-10-01"
    to: "2027-10-01"
    value: 3000
    source: S732
rationale: "10 CCR 2506-1 4.408,E (S57) and 7 CFR 273.8(b) set a resource limit only SE households are tested against (BCE/ECE households are exempt, S57 paragraph A); D-20's table 5 (S56) is the FY2026 FNS-published figure, and snap_meets_resource_limit (CO-343) needs it as a dated parameter rather than a literal. Change-impact flag from CO-119 (fix round 2026-11-23): the FY2027 FNS table (D-83, S732) keeps the limit for households without an elderly or disabled member at $3,000; the FY2027 version now cites it, as CO-119 cites S732 for its $4,750, so the figure in force from October 1, 2026 has a dated source of its own."
review_by: "2027-10-01"
sources: [S56, S57, S732]
tags: [resources, snap]
