meaning: The QMB/SLMB/QI resource limit for a married individual living with a spouse and no other dependents - $13,020 effective January 1, 2011 under 10 CCR 2505-10 § 8.100.5.M.1, adjusted by CMS each January 1 by the change in the consumer price index as of the previous September.
