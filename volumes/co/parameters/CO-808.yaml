sources: [S301, S569]
tags: [non_magi, msp, resources]
rationale: "Was msp_resource_limit_couple (CO-808, unchanged id), companion figure to msp_resource_limit_individual (CO-807), for the same reason: HCPF OM 25-078 (D-72, S569), fetched this fix round, states the 2025/2026 couple figures directly, resolving OQ-81's 'not fetched' state. ma_qmb_eligible, ma_slmb_eligible and ma_qi_eligible (CO-613-CO-615) need it for an applicant living with a spouse."
