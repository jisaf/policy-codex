id: CO-808
name: Medicare Savings Program resource limit (couple)
identifier: msp_resource_limit_couple
kind: parameter
type: money
scope: global
program: All
meaning: The current-year QMB/SLMB/QI resource limit for a married individual living with a spouse and no other dependents, published annually by CMS as an indexation of the $13,020 base 10 CCR 2505-10 8.100.5.M.1 states effective January 1, 2011, and includes a $3,000 burial-expense allowance.
precision: HCPF OM 25-078 (D-72, S569) states the 2025 and 2026 calendar-year figures directly; earlier years are not in any fetched document.
