id: CO-3932
name: CCCAP counties that provide Colorado Works Child Care for diversion households
identifier: cccap_county_provides_cw_child_care_for_diversion_table
kind: parameter
type: table keyed by option
scope: global
program: CCCAP
meaning: "Whether each county provides Colorado Works Child Care for households approved for a Colorado Works diversion (8 CCR 1403-1 3.116.H: \"Counties that provide Colorado Works Child Care for households approved for Colorado Works state diversions require the same eligibility as outlined in this rule section\"), keyed by the county (the options of cccap_application_county, CO-2106): 1 where the county provides it, 0 where it does not."
precision: "Each county's choice is county policy, not published on any host this volume can reach (cdec.colorado.gov and the counties' sites refuse automated requests), so no version is loaded (OQ-682): the route is unknown, with a no-version warning, for a diversion household until the counties' choices are loaded. A household that does not receive a diversion payment never reads the table. A rule test or household case that needs a county's choice states the row under parameters:."
versions: []
sources: [S2708]
tags: [household]
open: [OQ-682]
rationale: "Final pass F-16: the rule provides a county-elected Colorado Works Child Care route for diversion households, which the volume did not model. The county's election is a figure set outside the rule, a parameter like the county entry limits (CO-3004), not a fact stated on each person."
