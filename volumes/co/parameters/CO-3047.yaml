id: CO-3047
name: "Adult Financial earned income disregard"
identifier: af_earned_income_disregard
kind: parameter
type: money
scope: global
program: AdultFinancial
meaning: "The amount deducted from gross earned income to determine Adult Financial countable earned income, and from a deemed spouse's or parent's earned income: \"Deduct $65 from the gross earned income\" (9 CCR 2503-5 3.533.A.1.a; 3.534.A, 3.544.D, 3.549.C)."
value: 65
sources: [S457, S1632]
tags: [cash, income]
rationale: "Hard-coded numbers audit D-4: Adult Financial items read the SSI-method parameter, so a change of the SSI figure would have changed Adult Financial without an amendment of 9 CCR 2503-5. The rule states its own figure, as OQ-391 found for the AND-CS grant standard, so the program reads its own parameter (option (a) of the audit)."
