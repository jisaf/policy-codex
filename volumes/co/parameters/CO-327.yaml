id: CO-327
name: CCCAP household student age limit
identifier: cccap_household_student_age_limit
kind: parameter
type: whole number
scope: global
program: CCCAP
meaning: The upper age limit (exclusive) under which a child in the home who is still in high school and the responsibility of the adult caretaker is a member of the CCCAP household.
value: 19
sources: [S496]
tags: [age, household]
rationale: 8 CCR 1403-1 3.103.GGG (S496) counts "all children under nineteen (19) years of age who are still in high school and the responsibility of the adult caretaker(s)"; cccap_is_household_child (CO-990) reads it. Nearest is cccap_disabled_child_age_limit (CO-321), also 19, but that is the eligible-child limit of 3.111.F for a child with additional care needs, a different rule.
