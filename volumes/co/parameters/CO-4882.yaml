id: CO-4882
name: "SSI method: infrequent or irregular earned income excluded per calendar quarter"
identifier: ssi_infrequent_earned_income_quarterly_exclusion
kind: parameter
type: money
scope: global
program: Medicaid
meaning: "The earned income received infrequently or irregularly in a calendar quarter that the SSI method does not count: the first $30 (20 CFR 416.1112(c)(2), which 10 CCR 2505-10 § 8.100.5.H.4.e incorporates)."
versions:
  - {from: "2000-01-01", value: 30, source: S3618}
sources: [S3618]
tags: [non_magi, income]
rationale: "Coverage pass 2 (first pass NM-26, deferred): 416.1112(c)(2) (S3618) had no item. The figure is in the regulation and is not indexed; one version covers every date the volume determines."
