    to: "2026-07-01"
    value: 67
    source: S414
  - from: "2026-07-01"
    to: "2028-07-01"
    value: 67
    source: S1800
open: [OQ-530]
rationale: The chart's "Each Additional Child" column for the One Caretaker Need Standard row; no existing item carries it and cw_need_standard_table (CO-274) only tabulates sizes 1-11.
sources: [S414, S1800, S1801, S1803, S1804]
