id: CO-2558
name: "Colorado Works: is an optional member who has not requested assistance"
identifier: cw_is_optional_member_not_requesting
kind: derived
type: yes/no
scope: person
program: ColoradoWorks
meaning: "This person lives in the home as an optional member of a Colorado Works assistance unit (9 CCR 2503-6 3.604.2.C.2: a stepparent, a non-parent caretaker or that caretaker's spouse, a member made optional by custody or child support, or the parent of a minor parent who is requesting assistance for her own child) and has not requested assistance, so is not in the assistance unit."
precision: The parent of a minor parent (C.2.g) is reached through a child of this person who is a dependent child with a dependent child of their own and is requesting assistance for that child. A request left unstated is read as none (cw_requests_inclusion_in_assistance_unit, CO-2346).
derived: [all, [not, [otherwise, cw_requests_inclusion_in_assistance_unit, false]], [any, cw_is_optional_assistance_unit_member, [exists_related, [parent], [all, [of, [P], cw_is_dependent_child], [of, [P], cw_has_dependent_child], [otherwise, [of, [P], is_requesting_assistance_for_own_child], false]]]]]
sources: [S1625]
implemented: engine
tags: [cash, tanf, household]
rationale: "County case worker review S5: a parent of a minor parent who did not ask to join was reported as ineligible_no_dependent_child, which names the wrong reason. cw_is_optional_assistance_unit_member (CO-2349) leaves out the C.2.g parent, so this item adds that arm."
nearest: [CO-2349, CO-2350]
tests:
  - {id: CO-2558-T1, month: "2026-10", as_of: "2026-10-01", given: {date_of_birth: "1985-01-22"}, title: "A grandmother whose 17-year-old daughter asks assistance for her own baby, and who has not asked to join (C.2.g)", others: {p2: {date_of_birth: "2009-04-08", is_full_time_secondary_student_finishing_before_nineteen: true, is_requesting_assistance_for_own_child: true}, p3: {date_of_birth: "2026-02-03"}}, relationships: [[parent, p1, p2], [parent, p2, p3]], expect: true}
  - {id: CO-2558-T2, month: "2026-10", as_of: "2026-10-01", given: {date_of_birth: "1985-01-22", cw_requests_inclusion_in_assistance_unit: true}, title: "The same grandmother asks to join", others: {p2: {date_of_birth: "2009-04-08", is_full_time_secondary_student_finishing_before_nineteen: true, is_requesting_assistance_for_own_child: true}, p3: {date_of_birth: "2026-02-03"}}, relationships: [[parent, p1, p2], [parent, p2, p3]], expect: false}
  - {id: CO-2558-T3, month: "2026-10", as_of: "2026-10-01", given: {cw_is_optional_assistance_unit_member: true}, title: "A stepfather who did not ask (C.2.a)", relationships: [], expect: true}
