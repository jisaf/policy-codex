tags: [cash, oap, and, income]
rationale: "Earned-income records, step E1 Adult Financial: 3.520.783.C.2.b-d (S4380) counts board, room, and room and board payments as earned income less the expenses of providing them; the step E0 table read none of them as Adult Financial earnings (\"no Adult Financial text names boarder payments\"), which the fetched rule contradicts. Colorado Works' boarder rule (cw_boarder_income, CO-4361) differs (it deducts a Food Assistance allotment per boarder), so the program keeps its own item (product-owner decision of 2026-11-23: a program calculation is never shared)."
nearest: [CO-4361]
tests:
  # Hand computations from 3.520.783.C.2.b-d (S4380) and 3.520.786.M (S2608).
  - {id: CO-5131-T1, month: "2026-10", as_of: "2026-10-01", title: "A lodger pays $400 for a room; $50 of documented costs: 400 - 50 = 350 (C.2.c)", given: {earnings: [{kind: boarder_payments, amount: 400, provides: room_only, boarders: 1}, {kind: business_cost_boarder_provision, amount: 50, provides: room_only}]}, expect: 350}
  - {id: CO-5131-T2, month: "2026-10", as_of: "2026-10-01", title: "Two boarders pay $1,200 for room and board with $500 of costs, and one person pays $250 for meals only with $300 of costs: (1,200 - 500) + max(0, 250 - 300) = 700 (C.2.b, d)", given: {earnings: [{kind: boarder_payments, amount: 1200, provides: room_and_board, boarders: 2}, {kind: business_cost_boarder_provision, amount: 500, provides: room_and_board}, {kind: boarder_payments, amount: 250, provides: board_only, boarders: 1}, {kind: business_cost_boarder_provision, amount: 300, provides: board_only}]}, expect: 700}
  - {id: CO-5131-T3, month: "2026-10", as_of: "2026-10-01", title: "A foster child's room and board payment of $900 is exempt (3.520.786.M): 0", given: {earnings: [{kind: boarder_payments, amount: 900, provides: room_and_board, boarders: 1, foster_care: true}]}, expect: 0}
  - {id: CO-5131-T4, month: "2026-10", as_of: "2026-10-01", title: "Wages only: no boarder income", given: {earnings: [{kind: wages, amount: 800}]}, expect: 0}
  - {id: CO-5131-T5, month: "2026-10", as_of: "2026-10-01", title: "Earnings not stated: cannot determine", given: {}, expect: unknown}
