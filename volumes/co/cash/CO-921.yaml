id: CO-921
name: "Colorado Works: eligibility status"
identifier: cw_eligibility_status
kind: derived
type: one of
options: [eligible, ineligible_no_dependent_child, ineligible_income, ineligible_residency, ineligible_status, time_limit_reached, ineligible_resources, ineligible_living_arrangement]
scope: person-month
program: ColoradoWorks
role: outcome
meaning: This person's Colorado Works eligibility determination for the month, checked in order - no dependent child in the unit, residency, citizenship/immigrant status, a minor parent's living arrangement, the sixty-month time limit, then the income test - eligible only if every check passes.
precision: "ineligible_resources is never reached by this item's derivation: 26-2-706(2)(a) expressly forbids an asset test as a condition of Colorado Works eligibility, so this volume does not author cw_countable_resources or cw_meets_resource_limit items. The option is kept in the fixed vocabulary for schema compatibility with the batch-10 interface; see the batch report. Fix round (C-13): adds a branch gated on cw_minor_parent_living_arrangement_met (CO-906), which no item previously read, per 26-2-706(2)(b) ('an unmarried parent under eighteen years of age shall not receive assistance unless' the stated living-arrangement conditions are met) and 3.604.2.N.1 ('grant payments may not be approved unless the minor parent resides with another adult caretaker or ... an appropriate setting'). CO-906's own vacuous-true design (satisfied whenever the person is not both under 18 and a parent) means this branch is a no-op for anyone who is not an unmarried minor parent."
derived: [case, [["=", [count, [filter, cw_assistance_unit_members, [of, [P], cw_is_dependent_child]]], 0], ineligible_no_dependent_child], [[not, cw_meets_residency], ineligible_residency], [[not, cw_meets_citizenship_requirement], ineligible_status], [[not, cw_minor_parent_living_arrangement_met], ineligible_living_arrangement], [cw_time_limit_reached, time_limit_reached], [[not, cw_meets_income_test], ineligible_income], [else, eligible]]
sources: [S403, S406, S407, S415, S417]
implemented: engine
tags: [cash, tanf, household, income, immigration]
rationale: No existing item combines the Colorado Works eligibility checks into one outcome; this is the program's central eligibility outcome (declared under ColoradoWorks' outcomes in the report back), parallel in shape to snap_eligibility_status (CO-3xx) and ma_magi_eligibility_status (CO-5xx).
