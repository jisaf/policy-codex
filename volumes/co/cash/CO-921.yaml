id: CO-921
name: "Colorado Works: eligibility status"
identifier: cw_eligibility_status
kind: derived
type: one of
options: [eligible, not_in_unit_did_not_request, ineligible_no_dependent_child, ineligible_income, ineligible_residency, ineligible_status, time_limit_reached, ineligible_resources, ineligible_living_arrangement, sanction_closure, ineligible_institution, ineligible_strike, ineligible_child_support, ineligible_deceased, ineligible_diversion_period, closed_demonstrable_evidence, closed_ebt_misuse, closed_minor_parent_education, ineligible_disqualified]
scope: person-month
program: ColoradoWorks
role: outcome
meaning: "This person's Colorado Works eligibility determination for the month, checked in order: an optional member who has not requested assistance is not in the unit; a unit with no dependent child and no pregnant member (a parent includes an expectant parent, 9 CCR 2503-6 3.601) cannot be aided; a client who died before the first day of the month has no eligibility for it (3.609.2.C.1-2); then residency (including a temporary stay out of State of no more than ninety days, 3.604.2.O.1), the person's being an institution patient for tuberculosis or mental disease or an inmate (3.604.1.D-E), citizenship/immigrant status, the person's own disqualification (a fugitive or fleeing felon, an intentional program violation disqualification or a failure to apply for a Social Security number, 3.604.2.L.1, M; cw_is_disqualified_member, CO-928: the person is removed from the unit, whose other members are determined without them), a minor parent's living arrangement (the person's own, or any member's, so the unit is barred), an adult of the unit participating in a strike (3.604.2.L.2), the child support assignment and cooperation (3.604.4.A), a member's diversion period of ineligibility (3.606.8.A.4-5), a county closure in effect for a member (not participating before the first Individualized Plan, 3.607.5; continued EBT misuse, 3.609.2.J.3-4; a minor parent's education non-participation without good cause, 3.604.2.N.1.b), the sixty-month time limit, a fourth-level sanction (3.608.4.C.2, the unit is closed for the month), then the income test. Eligible only if every check passes."
precision: "ineligible_resources is never reached by this item's derivation: 26-2-706(2)(a) expressly forbids an asset test as a condition of Colorado Works eligibility, so this volume does not author cw_countable_resources or cw_meets_resource_limit items. The option is kept in the fixed vocabulary for schema compatibility with the batch-10 interface; see the batch report. Fix round (C-13): adds a branch gated on cw_minor_parent_living_arrangement_met (CO-906), which no item previously read, per 26-2-706(2)(b) ('an unmarried parent under eighteen years of age shall not receive assistance unless' the stated living-arrangement conditions are met) and 3.604.2.N.1 ('grant payments may not be approved unless the minor parent resides with another adult caretaker or ... an appropriate setting'). CO-906's own vacuous-true design (satisfied whenever the person is not both under 18 and a parent) means this branch is a no-op for anyone who is not an unmarried minor parent. CDHS review B-3: a pregnant person with no other children is an expectant parent (3.601, S1806); 3.604.3.C.7 verifies pregnancy \"when no children are in the assistance unit\" (S1807) and the 3.606.1.F chart prices a zero-child unit, so the first check now fails only a unit with neither a dependent child nor a pregnant member; a pregnancy left unstated is read as none (is_pregnant). County case worker review S5: an optional member who has not asked to join (cw_is_optional_member_not_requesting, CO-2558) is reported as not_in_unit_did_not_request rather than as having no dependent child. Final cash review FC-1: three checks the current rule states had no item - the institution patient and inmate bar of 3.604.1.D-E (cw_is_institution_patient_or_inmate, CO-3802, a bar on the person, reported as ineligible_institution), the strike bar of 3.604.2.L.2 (cw_unit_has_striking_adult, CO-3808, on the unit, ineligible_strike) and the child support conditions of 3.604.4.A (cw_meets_child_support_requirements, CO-3811, on the unit, ineligible_child_support); the institution-resident rule of 3.604.2.O.2 is read through the unit's membership (cw_is_considered_living_in_home, CO-3354) and the ninety days out of State through cw_meets_residency (CO-904). Coverage review (CW-1, CW-7, CW-13, CW-24): a member within a diversion period of ineligibility bars the unit (ineligible_diversion_period; in_diversion_period_of_ineligibility, CO-1269, read as false when not stated; S3152), since the client agreed not to receive further Colorado Works assistance and only the county can end the POI or grant basic cash assistance before it ends; a minor parent whose living arrangement is not met bars every member of the unit, so her child is not paid while she is barred (S3153); the three county closures are cw_county_closure_type (CO-4353, read as none when not stated; S3161, S3162, S3153); a client whose date_of_death is before the first day of the month is ineligible_deceased (S3165), while one who dies during the month keeps that month (3.609.2.C.3 holds the payment for the personal representative)."
derived: [case, [cw_is_optional_member_not_requesting, not_in_unit_did_not_request], [[all, ["=", [count, [filter, cw_assistance_unit_members, [of, [P], cw_is_dependent_child]]], 0], [not, [exists, cw_assistance_unit_members, [otherwise, [of, [P], is_pregnant], false]]]], ineligible_no_dependent_child], [[all, [not, [unknown, date_of_death]], ["<", date_of_death, [first_day, [month]]]], ineligible_deceased], [[not, cw_meets_residency], ineligible_residency], [cw_is_institution_patient_or_inmate, ineligible_institution], [[not, cw_meets_citizenship_and_immigration_requirement], ineligible_status], [[otherwise, cw_is_disqualified_member, false], ineligible_disqualified], [[any, [not, cw_minor_parent_living_arrangement_met], [exists, cw_assistance_unit_members, [not, [of, [P], cw_minor_parent_living_arrangement_met]]]], ineligible_living_arrangement], [cw_unit_has_striking_adult, ineligible_strike], [[not, cw_meets_child_support_requirements], ineligible_child_support], [[exists, cw_assistance_unit_members, [otherwise, [of, [P], in_diversion_period_of_ineligibility], false]], ineligible_diversion_period], [[exists, cw_assistance_unit_members, ["=", [otherwise, [of, [P], cw_county_closure_type], none], demonstrable_evidence]], closed_demonstrable_evidence], [[exists, cw_assistance_unit_members, ["=", [otherwise, [of, [P], cw_county_closure_type], none], continued_ebt_misuse]], closed_ebt_misuse], [[exists, cw_assistance_unit_members, ["=", [otherwise, [of, [P], cw_county_closure_type], none], minor_parent_education_nonparticipation]], closed_minor_parent_education], [cw_time_limit_reached, time_limit_reached], [["=", cw_unit_sanction_level, fourth], sanction_closure], [[not, cw_meets_income_test], ineligible_income], [else, eligible]]
sources: [S1004, S403, S406, S407, S415, S3154, S760, S1806, S1807, S1625, S2600, S2601, S2603, S3152, S3153, S3161, S3162, S3165]
