id: CO-921
name: "Colorado Works: eligibility status"
identifier: cw_eligibility_status
kind: derived
type: one of
options: [eligible, not_in_unit_did_not_request, ineligible_no_dependent_child, ineligible_income, ineligible_residency, ineligible_status, time_limit_reached, ineligible_resources, ineligible_living_arrangement, sanction_closure]
scope: person-month
program: ColoradoWorks
role: outcome
meaning: "This person's Colorado Works eligibility determination for the month, checked in order: an optional member who has not requested assistance is not in the unit; a unit with no dependent child and no pregnant member (a parent includes an expectant parent, 9 CCR 2503-6 3.601) cannot be aided; then residency, citizenship/immigrant status, a minor parent's living arrangement, the sixty-month time limit, a fourth-level sanction (3.608.4.C.2, the unit is closed for the month), then the income test. Eligible only if every check passes."
precision: "ineligible_resources is never reached by this item's derivation: 26-2-706(2)(a) expressly forbids an asset test as a condition of Colorado Works eligibility, so this volume does not author cw_countable_resources or cw_meets_resource_limit items. The option is kept in the fixed vocabulary for schema compatibility with the batch-10 interface; see the batch report. Fix round (C-13): adds a branch gated on cw_minor_parent_living_arrangement_met (CO-906), which no item previously read, per 26-2-706(2)(b) ('an unmarried parent under eighteen years of age shall not receive assistance unless' the stated living-arrangement conditions are met) and 3.604.2.N.1 ('grant payments may not be approved unless the minor parent resides with another adult caretaker or ... an appropriate setting'). CO-906's own vacuous-true design (satisfied whenever the person is not both under 18 and a parent) means this branch is a no-op for anyone who is not an unmarried minor parent. CDHS review B-3: a pregnant person with no other children is an expectant parent (3.601, S1806); 3.604.3.C.7 verifies pregnancy \"when no children are in the assistance unit\" (S1807) and the 3.606.1.F chart prices a zero-child unit, so the first check now fails only a unit with neither a dependent child nor a pregnant member; a pregnancy left unstated is read as none (is_pregnant). County case worker review S5: an optional member who has not asked to join (cw_is_optional_member_not_requesting, CO-2558) is reported as not_in_unit_did_not_request rather than as having no dependent child."
derived: [case, [cw_is_optional_member_not_requesting, not_in_unit_did_not_request], [[all, ["=", [count, [filter, cw_assistance_unit_members, [of, [P], cw_is_dependent_child]]], 0], [not, [exists, cw_assistance_unit_members, [otherwise, [of, [P], is_pregnant], false]]]], ineligible_no_dependent_child], [[not, cw_meets_residency], ineligible_residency], [[not, meets_public_assistance_citizenship_requirement], ineligible_status], [[not, cw_minor_parent_living_arrangement_met], ineligible_living_arrangement], [cw_time_limit_reached, time_limit_reached], [["=", cw_unit_sanction_level, fourth], sanction_closure], [[not, cw_meets_income_test], ineligible_income], [else, eligible]]
sources: [S403, S406, S407, S415, S417, S760, S1806, S1807, S1625]
implemented: engine
tags: [cash, tanf, household, income, immigration]
rationale: No existing item combines the Colorado Works eligibility checks into one outcome; this is the program's central eligibility outcome (declared under ColoradoWorks' outcomes in the report back), parallel in shape to snap_eligibility_status (CO-3xx) and ma_magi_eligibility_status (CO-5xx).
