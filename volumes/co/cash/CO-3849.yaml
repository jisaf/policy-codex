id: CO-3849
name: "Adult Financial: meets the AND-SO substance abuse conditions"
identifier: af_and_so_meets_substance_abuse_conditions
kind: derived
type: yes/no
scope: person
program: AdultFinancial
meaning: "Whether the person meets the conditions 9 CCR 2503-5 3.541.3 sets when the AND-SO medical certification identifies alcoholism or controlled substance addiction as the primary diagnosis: fewer than af_and_so_substance_abuse_max_months months already received on that basis (A), agreement to treatment and a defined treatment program (B, C), not terminated from treatment for failing to comply (D), and fewer than af_and_so_positive_test_limit positive tests in any three-month period (F). True when the certification does not identify substance abuse."
precision: "The facts are read only for a client whose certification identifies substance abuse. 3.541.3.D and F end AND-SO effective the month after the termination or second positive test; the volume reads the condition as of the determination date."
derived: [any, [not, [otherwise, af_and_so_certification_identifies_substance_abuse, false]], [all, ["<", [otherwise, af_and_so_substance_abuse_months_received, 0], af_and_so_substance_abuse_max_months], has_agreed_to_addiction_treatment, [not, [otherwise, was_terminated_from_addiction_treatment, false]], ["<", [otherwise, positive_substance_tests_in_three_months, 0], af_and_so_positive_test_limit]]]
sources: [S2616, S2617]
implemented: engine
tags: [cash, and, disability]
rationale: "Final cash review FC-7: 9 CCR 2503-5 3.541.3 (S2616) and C.R.S. 26-2-111(4)(e)-(f) (S2617) limit AND-SO for a client whose primary diagnosis is alcoholism or controlled substance addiction to twelve cumulative months in a lifetime, on condition of treatment and of not testing positive twice in any three-month period, and nothing in the volume stated it. af_and_so_eligible (CO-1203) reads this item."
tests:
  - {id: CO-3849-T1, title: "No substance abuse on the certification", as_of: "2026-10-01", given: {}, expect: true}
  - {id: CO-3849-T2, title: "Month 7 of 12, in treatment, one positive test", as_of: "2026-10-01", given: {af_and_so_certification_identifies_substance_abuse: true, af_and_so_substance_abuse_months_received: 6, has_agreed_to_addiction_treatment: true, positive_substance_tests_in_three_months: 1}, expect: true}
  - {id: CO-3849-T3, title: "Twelve months already received (A)", as_of: "2026-10-01", given: {af_and_so_certification_identifies_substance_abuse: true, af_and_so_substance_abuse_months_received: 12, has_agreed_to_addiction_treatment: true}, expect: false}
  - {id: CO-3849-T4, title: "Refuses treatment (B)", as_of: "2026-10-01", given: {af_and_so_certification_identifies_substance_abuse: true, af_and_so_substance_abuse_months_received: 0, has_agreed_to_addiction_treatment: false}, expect: false}
  - {id: CO-3849-T5, title: "Two positive tests in three months (F)", as_of: "2026-10-01", given: {af_and_so_certification_identifies_substance_abuse: true, af_and_so_substance_abuse_months_received: 3, has_agreed_to_addiction_treatment: true, positive_substance_tests_in_three_months: 2}, expect: false}
  - {id: CO-3849-T6, title: "Terminated from treatment (D)", as_of: "2026-10-01", given: {af_and_so_certification_identifies_substance_abuse: true, af_and_so_substance_abuse_months_received: 3, has_agreed_to_addiction_treatment: true, was_terminated_from_addiction_treatment: true}, expect: false}
