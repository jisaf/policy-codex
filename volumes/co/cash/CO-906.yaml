id: CO-906
name: "Colorado Works: minor parent living arrangement met"
identifier: cw_minor_parent_living_arrangement_met
kind: derived
type: yes/no
scope: person-month
program: ColoradoWorks
meaning: "Whether a minor parent's living arrangement satisfies 9 CCR 2503-6 3.604.2.N - not applicable (vacuously satisfied) unless the person is both under cw_minor_parent_age_limit and has a dependent child; if so, satisfied when the minor is emancipated, has a marital status other than single, lives with her own parent, lives with an adult relative (N.2.a) or with another adult caretaker (3.604.2.N.1) who is related to her or is a member of her assistance unit (N.3.a-b), or is in a county-approved setting."
precision: "'Lives with her own parent' is read from lives_with (CO-1925) to a person she is the child of (same-word SW-7; where no dwelling_id is stated, the parent edge is read as living together, convention rule 17); 3.604.2.N.3.c does not require county approval in that case regardless of whether the parent joins the assistance unit. Coverage review CW-7: N.1 (S3153) also accepts residence \"with another adult caretaker\" and N.2.a \"with an adult relative\": a person of the case, 18 or older (not a minor, cw_minor_parent_age_limit), who is related to the minor parent (is_related_to, CO-2845: a grandparent, aunt, uncle, adult sibling and the like) or is her caretaker (she is the child, ward or in the primary care of that person, as cw_caretaker_of, CO-2608, reads it) and a member of her assistance unit (cw_assistance_unit_members, CO-900), living in the same home (lives_with, read as living together where no dwelling is stated) and considered living in the home (cw_is_considered_living_in_home, CO-3354). Coverage pass 2 (CW2-1, S3450): N.3.a requires a county approved setting when the minor parent \"lives with an unrelated non-parent caretaker who chooses not to be a member of the assistance unit\", so an unrelated caretaker who has not joined her unit is not enough without county approval (county_approved_living_arrangement), and neither is an unrelated adult who is not her caretaker. An unrelated caretaker who has joined her unit (N.3.b) is accepted without approval: the county \"may choose\" to require it (OQ-830). cw_eligibility_status (CO-921) reads a failure for every member of the unit. Coverage pass 6 CA6-4 (docs/reviews/coverage6-cash.md, probe W9): per month: the minor parent's age and the other adult's are taken on the month's first day and her dependent child is the month's (cw_has_dependent_child_in_month, CO-7305), so a mother who turns 18 is held to N in the months she is under 18 only (docs/operators.md, \"Ages in a month\"; OQ-951)."
derived: ["any", [">=", ["years_between", "date_of_birth", ["first_day", ["month"]]], "cw_minor_parent_age_limit"], ["not", "cw_has_dependent_child_in_month"], "is_emancipated_minor", ["not", ["=", "marital_status", "single"]], ["exists_related", ["child"], ["otherwise", ["in_group", ["P"], "lives_with"], true]], ["exists", ["persons"], ["all", ["any", ["in_group", ["P"], "is_related_to"], ["all", ["rel", ["child", "ward", "in_primary_care_of"], ["P"]], ["in_group", ["P"], "cw_assistance_unit_members"]]], [">=", ["years_between", ["of", ["P"], "date_of_birth"], ["first_day", ["month"]]], "cw_minor_parent_age_limit"], ["otherwise", ["in_group", ["P"], "lives_with"], true], ["of", ["P"], "cw_is_considered_living_in_home"]]], "county_approved_living_arrangement"]
sources: [S406, S411, S3153, S3450]
open: [OQ-830]
implemented: engine
