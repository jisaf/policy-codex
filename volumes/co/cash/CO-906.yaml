id: CO-906
name: "Colorado Works: minor parent living arrangement met"
identifier: cw_minor_parent_living_arrangement_met
kind: derived
type: yes/no
scope: person
program: ColoradoWorks
meaning: "Whether a minor parent's living arrangement satisfies 9 CCR 2503-6 3.604.2.N - not applicable (vacuously satisfied) unless the person is both under cw_minor_parent_age_limit and has a dependent child; if so, satisfied when the minor is emancipated, has a marital status other than single, lives with her own parent, lives with another adult caretaker (3.604.2.N.1) or an adult relative (N.2.a), or is in a county-approved setting."
precision: "'Lives with her own parent' is read from lives_with (CO-1925) to a person she is the child of (same-word SW-7; where no dwelling_id is stated, the parent edge is read as living together, convention rule 17); 3.604.2.N.3.c does not require county approval in that case regardless of whether the parent joins the assistance unit. Coverage review CW-7: N.1 (S3153) also accepts residence \"with another adult caretaker\" and N.2.a \"with an adult relative\": a person of the case, 18 or older (not a minor, cw_minor_parent_age_limit), who is related to the minor parent (is_related_to, CO-2845: a grandparent, aunt, uncle, adult sibling and the like) or is her caretaker (she is the child, ward or in the primary care of that person, as cw_caretaker_of, CO-2608, reads it), living in the same home (lives_with, read as living together where no dwelling is stated) and considered living in the home (cw_is_considered_living_in_home, CO-3354). An unrelated adult who is not her caretaker is not enough without county approval (N.3.a). cw_eligibility_status (CO-921) reads a failure for every member of the unit."
derived: [any, [">=", age, cw_minor_parent_age_limit], [not, cw_has_dependent_child], is_emancipated_minor, [not, ["=", marital_status, single]], [exists_related, [child], [otherwise, [in_group, [P], lives_with], true]], [exists, [persons], [all, [any, [in_group, [P], is_related_to], [rel, [child, ward, in_primary_care_of], [P]]], [">=", [of, [P], age], cw_minor_parent_age_limit], [otherwise, [in_group, [P], lives_with], true], [of, [P], cw_is_considered_living_in_home]]], county_approved_living_arrangement]
sources: [S406, S411, S3153]
implemented: engine
tags: [cash, tanf, household, age]
rationale: "No existing item states this rule; cw_eligibility_status (CO-920) would need it if a future item gates eligibility on it (not modeled as a gate in this batch's cw_eligibility_status, since 3.604.2.N.2.c lets an unhoused minor parent \"receive assistance as an adult\" rather than being denied outright, which this batch did not model further; coverage review CW-2 models it as cw_minor_parent_is_assisted_as_adult, CO-4352). Same-word SW-7: living with her parent is read from lives_with."
tests:
  - {id: CO-906-T1, as_of: "2026-10-01", given: {date_of_birth: "2009-04-08", is_emancipated_minor: false, marital_status: single, county_approved_living_arrangement: false}, others: {p2: {date_of_birth: "2026-02-03"}, p3: {date_of_birth: "1985-01-22"}}, relationships: [[parent, p1, p2], [parent, p3, p1]], expect: true}
  - {id: CO-906-T2, as_of: "2026-10-01", given: {date_of_birth: "2009-04-08", is_emancipated_minor: false, marital_status: single, county_approved_living_arrangement: false}, others: {p2: {date_of_birth: "2026-02-03"}}, relationships: [[parent, p1, p2]], expect: false}
  - {id: CO-906-T3, as_of: "2026-10-01", given: {date_of_birth: "2009-04-08", is_emancipated_minor: false, marital_status: married, county_approved_living_arrangement: false}, others: {p2: {date_of_birth: "2026-02-03"}}, relationships: [[parent, p1, p2]], expect: true}
  - {id: CO-906-T5, title: "Coverage review CW-7 (probe CWZ-18): an unmarried 16-year-old mother living with her grandmother, who has primary responsibility for her; no county approval", as_of: "2026-10-01", given: {date_of_birth: "2010-03-01", is_emancipated_minor: false, marital_status: single, county_approved_living_arrangement: false, cw_is_considered_living_in_home: true}, others: {p2: {date_of_birth: "2026-06-01"}, p3: {date_of_birth: "1960-01-01", cw_is_considered_living_in_home: true}}, relationships: [[parent, p1, p2], [grandparent, p3, p1], [has_primary_responsibility_for, p3, p1]], expect: true}
  - {id: CO-906-T6, title: "Coverage review CW-7: living with an adult aunt (other relative, N.2.a) who is not her caretaker", as_of: "2026-10-01", given: {date_of_birth: "2010-03-01", is_emancipated_minor: false, marital_status: single, county_approved_living_arrangement: false, cw_is_considered_living_in_home: true}, others: {p2: {date_of_birth: "2026-06-01"}, p3: {date_of_birth: "1990-01-01", cw_is_considered_living_in_home: true}}, relationships: [[parent, p1, p2], [other_relative, p3, p1]], expect: true}
  - {id: CO-906-T7, title: "Coverage review CW-7: the adult aunt lives in another home; no county approval", as_of: "2026-10-01", given: {date_of_birth: "2010-03-01", dwelling_id: h1, is_emancipated_minor: false, marital_status: single, county_approved_living_arrangement: false, cw_is_considered_living_in_home: true}, others: {p2: {date_of_birth: "2026-06-01", dwelling_id: h1}, p3: {date_of_birth: "1990-01-01", dwelling_id: h2, cw_is_considered_living_in_home: true}}, relationships: [[parent, p1, p2], [other_relative, p3, p1]], expect: false}
