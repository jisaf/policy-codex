id: CO-920
name: "Colorado Works: meets work participation requirement"
identifier: cw_meets_work_participation
kind: derived
type: yes/no
scope: person-month
program: ColoradoWorks
meaning: "A work-eligible individual's participation hours for the month meet the 45 CFR 261.31 weekly-hours requirement (cw_work_participation_hours_per_week, with the core-activity minimum not separately modeled here) - or the reduced requirement of 45 CFR 261.35 (cw_work_participation_hours_per_week_young_child) for a single custodial parent or caretaker relative with a child under six. Informational: no rule reads it and it is not a declared outcome; it reports whether a work-eligible individual meets the federal participation hours, which the State's participation rate, not the person's eligibility, turns on (household cases check it)."
precision: "Compares the month's countable work activity hours (cw_work_activity_hours, CO-1745) against the weekly requirement multiplied by cw_weeks_per_month (CO-3044) to approximate a monthly figure; see OQ-104. Vocabulary fix round (docs/reviews/vocabulary-reuse.md, R-12): it had added hours worked for pay and SNAP employment and training hours. Same-word audit SW-3/SW-4 (OQ-396): the caretaker relation is cw_caretaker_of (CO-2608): a parent, or a non-parent caretaker who is the child's legal guardian or has primary responsibility for the child (3.601); the spouse of a parent who is not a parent stays the optional member of 3.604.2.C.2.a, read from the spouse and parent roles as the rule words it. Coverage pass 4 CA4-15: the dependent child is the child of the month evaluated (cw_is_dependent_child_in_month, CO-6807), the age taken in that month. Pattern sweep (cash) PS-T4 (docs/reviews/pattern-sweep-cash.md): the child's age under six is taken on the first day of the month evaluated too (OQ-951); before, the determination date's age was read in every month."
open: [OQ-104, OQ-951]
derived: [case, [[exists, cw_caretaker_of, [all, [of, [P], cw_is_dependent_child_in_month], ["<", [years_between, [of, [P], date_of_birth], [first_day, [month]]], cw_young_child_age_limit]]], [">=", cw_countable_work_activity_hours, ["*", cw_work_participation_hours_per_week_young_child, cw_weeks_per_month]]], [else, [">=", cw_countable_work_activity_hours, ["*", cw_work_participation_hours_per_week, cw_weeks_per_month]]]]
sources: [S419, S420]
implemented: engine
tags: [cash, tanf]
rationale: No existing item states the Colorado Works work-participation hours test; useful to the program administrator for the federal work-participation-rate calculation even though this batch does not gate cw_eligibility_status on it (nonparticipation is a sanction under 26-2-711, C.R.S. and 3.607-3.608, which reduce the grant rather than terminate eligibility outright, and is out of this batch's scope).
tests:
  - {id: CO-920-T1, as_of: "2026-10-01", month: "2026-10", given: {cw_countable_work_activity_hours: 138}, relationships: [], expect: true}
  - {id: CO-920-T2, as_of: "2026-10-01", month: "2026-10", given: {cw_countable_work_activity_hours: 60}, relationships: [], expect: false}
  - {id: "CO-920-T3", as_of: "2026-10-01", month: "2026-10", given: {residence_setting_type: private_dwelling, dwelling_id: h1, cw_countable_work_activity_hours: 90, temporary_absence_reason: none}, others: {p2: {residence_setting_type: private_dwelling, dwelling_id: h1, date_of_birth: "2026-02-03", temporary_absence_reason: none}}, relationships: [[parent, p1, p2]], expect: true}
  # Pattern sweep (cash) PS-T4: 45 CFR 261.35 (S420) "a child under age 6", taken in the month evaluated (first day, OQ-951). The child is born 2020-10-10, the determination is 2026-10-20 (6 that day). September: 5 on September 1, the 20-hour requirement: 90 >= 20 x 4 = 80, met; October: still 5 on October 1, the 20-hour requirement (the engine read 6, the determination date's age, before); November: 6 on November 1, the 30-hour requirement: 90 < 30 x 4 = 120, not met.
  - {id: "CO-920-T4", title: "Pattern sweep PS-T4: September, the child 5 on September 1: 90 hours >= 80 (20 a week x 4), met", as_of: "2026-10-20", month: "2026-09", given: {residence_setting_type: private_dwelling, dwelling_id: h1, cw_countable_work_activity_hours: 90, temporary_absence_reason: none}, others: {p2: {residence_setting_type: private_dwelling, dwelling_id: h1, date_of_birth: "2020-10-10", temporary_absence_reason: none}}, relationships: [[parent, p1, p2]], expect: true}
  - {id: "CO-920-T5", title: "PS-T4: November, the child 6 on November 1: 90 hours < 120 (30 a week x 4), not met", as_of: "2026-10-20", month: "2026-11", given: {residence_setting_type: private_dwelling, dwelling_id: h1, cw_countable_work_activity_hours: 90, temporary_absence_reason: none}, others: {p2: {residence_setting_type: private_dwelling, dwelling_id: h1, date_of_birth: "2020-10-10", temporary_absence_reason: none}}, relationships: [[parent, p1, p2]], expect: false}
  - {id: "CO-920-T6", title: "PS-T4: October, the child still 5 on October 1 (6 on the determination date, October 20): the 20-hour requirement, 90 >= 80, met", as_of: "2026-10-20", month: "2026-10", given: {residence_setting_type: private_dwelling, dwelling_id: h1, cw_countable_work_activity_hours: 90, temporary_absence_reason: none}, others: {p2: {residence_setting_type: private_dwelling, dwelling_id: h1, date_of_birth: "2020-10-10", temporary_absence_reason: none}}, relationships: [[parent, p1, p2]], expect: true}
