id: CO-920
name: "Colorado Works: meets work participation requirement"
identifier: cw_meets_work_participation
kind: derived
type: yes/no
scope: person-month
program: ColoradoWorks
meaning: A work-eligible individual's participation hours for the month meet the 45 CFR 261.31 weekly-hours requirement (30 hours, at least 20 from core activities not separately modeled here) - or the reduced 20-hour requirement of 45 CFR 261.35 for a single custodial parent or caretaker relative with a child under six.
precision: "Compares countable monthly hours (hours_worked plus work_program_hours) against the weekly requirement multiplied by four to approximate a monthly figure; see OQ-104. Fix round (OQ-141 resolved): this item is not an input to a Colorado Works sanction. 9 CCR 2503-6 3.608.3 imposes a sanction only after the county's own re-engagement and good-cause process (a missed appointment, no good cause reported, no rescheduling), not directly from an hours shortfall - 3.608.2.C also defines 'engaged in work program requirements' by participation in listed activities and Individualized Plan activities, not by a bare hours count this item's own P34-style four-week approximation could stand in for. cw_unit_sanction_level (CO-931) accordingly reads a supplied fact (work_sanction_level_this_month, CO-142) carrying the county's own determination, not this item; this item remains read by nothing, as before, useful only for the federal work-participation-rate reporting its own meaning states."
open: [OQ-104]
derived: [case, [[exists_related, [parent, caretaker], [all, [of, [P], cw_is_dependent_child], ["<", [of, [P], age], cw_young_child_age_limit]]], [">=", [+, hours_worked, work_program_hours], ["*", cw_work_participation_hours_per_week_young_child, 4]]], [else, [">=", [+, hours_worked, work_program_hours], ["*", cw_work_participation_hours_per_week, 4]]]]
sources: [S419, S420]
implemented: engine
tags: [cash, tanf]
rationale: No existing item states the Colorado Works work-participation hours test; useful to the program administrator for the federal work-participation-rate calculation even though this batch does not gate cw_eligibility_status on it (nonparticipation is a sanction under 26-2-711, C.R.S. and 3.607-3.608, which reduce the grant rather than terminate eligibility outright, and is out of this batch's scope).
tests:
  - {id: CO-920-T1, as_of: "2026-10-01", month: "2026-10", given: {hours_worked: 138, work_program_hours: 0}, relationships: [], expect: true}
  - {id: CO-920-T2, as_of: "2026-10-01", month: "2026-10", given: {hours_worked: 60, work_program_hours: 0}, relationships: [], expect: false}
  - {id: CO-920-T3, as_of: "2026-10-01", month: "2026-10", given: {hours_worked: 90, work_program_hours: 0}, others: {p2: {date_of_birth: "2026-02-03"}}, relationships: [[parent, p1, p2]], expect: true}
