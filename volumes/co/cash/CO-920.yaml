id: CO-920
name: "Colorado Works: meets work participation requirement"
identifier: cw_meets_work_participation
kind: derived
type: yes/no
scope: person-month
program: ColoradoWorks
meaning: "A work-eligible individual's participation hours for the month meet the 45 CFR 261.31 weekly-hours requirement (cw_work_participation_hours_per_week, with the core-activity minimum not separately modeled here) - or the reduced requirement of 45 CFR 261.35 (cw_work_participation_hours_per_week_young_child) for a single custodial parent or caretaker relative with a child under six. Informational: no rule reads it and it is not a declared outcome; it reports whether a work-eligible individual meets the federal participation hours, which the State's participation rate, not the person's eligibility, turns on (household cases check it)."
precision: "Compares the month's countable work activity hours (cw_work_activity_hours, CO-1745) against the weekly requirement multiplied by cw_weeks_per_month (CO-3044) to approximate a monthly figure; see OQ-104. Vocabulary fix round (docs/reviews/vocabulary-reuse.md, R-12): it had added hours worked for pay and SNAP employment and training hours. Same-word audit SW-3/SW-4 (OQ-396): the caretaker relation is cw_caretaker_of (CO-2608): a parent, or a non-parent caretaker who is the child's legal guardian or has primary responsibility for the child (3.601); the spouse of a parent who is not a parent stays the optional member of 3.604.2.C.2.a, read from the spouse and parent roles as the rule words it."
open: [OQ-104]
derived: [case, [[exists, cw_caretaker_of, [all, [of, [P], cw_is_dependent_child], ["<", [of, [P], age], cw_young_child_age_limit]]], [">=", cw_countable_work_activity_hours, ["*", cw_work_participation_hours_per_week_young_child, cw_weeks_per_month]]], [else, [">=", cw_countable_work_activity_hours, ["*", cw_work_participation_hours_per_week, cw_weeks_per_month]]]]
sources: [S419, S420]
implemented: engine
tags: [cash, tanf]
rationale: No existing item states the Colorado Works work-participation hours test; useful to the program administrator for the federal work-participation-rate calculation even though this batch does not gate cw_eligibility_status on it (nonparticipation is a sanction under 26-2-711, C.R.S. and 3.607-3.608, which reduce the grant rather than terminate eligibility outright, and is out of this batch's scope).
tests:
  - {id: CO-920-T1, as_of: "2026-10-01", month: "2026-10", given: {cw_countable_work_activity_hours: 138}, relationships: [], expect: true}
  - {id: CO-920-T2, as_of: "2026-10-01", month: "2026-10", given: {cw_countable_work_activity_hours: 60}, relationships: [], expect: false}
  - {id: CO-920-T3, as_of: "2026-10-01", month: "2026-10", given: {cw_countable_work_activity_hours: 90}, others: {p2: {date_of_birth: "2026-02-03"}}, relationships: [[parent, p1, p2]], expect: true}
