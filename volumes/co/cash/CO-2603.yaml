id: CO-2603
name: "Adult Financial: partial month payment factor"
identifier: af_partial_month_payment_factor
kind: derived
type: rate
scope: person-month
program: AdultFinancial
meaning: "The figure this month's Adult Financial grant payment is multiplied by: in the month the client is determined eligible on a day other than the first, the decimal figure of 9 CCR 2503-5 3.581.D.4 for the number of days for which the client is eligible in the month (3.581.D.2-3; 3.532.B.2, 3.543.B.2, 3.548.B.2); in a month before the month of the eligibility date, 0, since eligibility begins on that date (3.542.B: \"Eligibility shall begin with the date of application or the date the client meets all eligibility requirements, whichever is later\"; 3.510 \"Effective date of eligibility\"); in a month before the month of the application date (af_application_date), 0, since eligibility begins no earlier than the date of application (3.542.B); otherwise 1, the full monthly payment (3.532.B.1, 3.543.B.1, 3.548.B.1). Where the application date is stated and the eligibility date is not, a month from the month of the application through the determination month cannot be determined: the eligibility date decides it and is required there (decision 4 of 2026-11-23); a month after the determination month is a full month, since eligibility has begun by the determination."
precision: "The days of eligibility run from af_eligibility_date (CO-2391) through the last day of the month, the date itself included: a client eligible from October 10 is eligible for 22 days of October (OQ-491, resolved). A client eligible from the first receives the full payment. Coverage pass 4 CA4-14 (docs/reviews/coverage4-cash.md; the CW3-3 class, fixed for Colorado Works by CO-4358): a client who applied on September 25 and met every requirement on October 3 (af_eligibility_date) is paid nothing for September and 29 days of October (.95342); before, September was paid in full. A redetermination needs no exception: the eligibility date is then before every month it evaluates. Coverage pass 6 CA6-1 (docs/reviews/coverage6-cash.md, probe A1): a case that states neither date is a continuing client, paid the full month; a case that states the application date (af_application_date, CO-3837) and not the eligibility date is paid nothing for a month before the month of the application, and cannot be determined for the months from the month of the application through the determination month, where the eligibility date decides the payment (3.542.B, 3.532.B.2). Before, an unstated eligibility date was read as a full month in every month, so a client who applied on October 12 was paid in full for October and for every month before it ($452 a month for the probe's OAP client, where 3.542.B gives nothing before October 12 and, from the twelfth, 20 days, .65754 x 452 = 297.2, $297)."
derived: [case, [[all, [unknown, af_eligibility_date], [unknown, af_application_date]], 1], [[all, [unknown, af_eligibility_date], ["<", [month], [month_of, af_application_date]]], 0], [[all, [unknown, af_eligibility_date], [">", [month], [det_month]]], 1], [["<", [month], [month_of, af_eligibility_date]], 0], [[all, ["=", [month], [month_of, af_eligibility_date]], [not, ["=", af_eligibility_date, [first_day, [month]]]]], [lookup, af_partial_month_payment_factor_table, [days_between, af_eligibility_date, [first_day, [month_after, [month]]]]]], [else, 1]]
sources: [S1635, S1825, S4794, S4791]
implemented: engine
tags: [cash, income]
rationale: "Engineering follow-up 4: af_oap_grant (CO-951) and af_and_grant (CO-952) each computed a days-remaining ratio the rule does not state; 3.581.D (S1825) states the table both programs' partial months use. One item so the two grants read the same factor."
tests:
  - {id: CO-2603-T1, title: "Eligible from October 10: 22 days of eligibility, .72329", as_of: "2026-10-15", month: "2026-10", given: {af_eligibility_date: "2026-10-10"}, expect: 0.72329}
  - {id: CO-2603-T2, title: "The next month is a full month", as_of: "2026-11-02", month: "2026-11", given: {af_eligibility_date: "2026-10-10"}, expect: 1}
  - {id: CO-2603-T3, title: "Eligible from the first: the full payment, not the 30-day figure", as_of: "2026-11-02", month: "2026-11", given: {af_eligibility_date: "2026-11-01"}, expect: 1}
  - {id: CO-2603-T4, title: "Eligible from September 2: 29 days, .95342", as_of: "2026-09-15", month: "2026-09", given: {af_eligibility_date: "2026-09-02"}, expect: 0.95342}
  - {id: CO-2603-T5, title: "Neither the eligibility date nor the application date stated (a continuing client): the full payment", as_of: "2026-10-01", month: "2026-10", given: {}, expect: 1}
  - {id: "CO-2603-T6", title: "Coverage pass 4 CA4-14 (probe A20): applied September 25, eligible from October 3: nothing for September", as_of: "2026-10-15", month: "2026-09", given: {af_eligibility_date: "2026-10-03"}, expect: 0}
  - {id: "CO-2603-T7", title: "Probe A20: October, 29 days of eligibility (3.581.D.4), .95342", as_of: "2026-10-15", month: "2026-10", given: {af_eligibility_date: "2026-10-03"}, expect: 0.95342}
  # Coverage pass 6 CA6-1 (probe A1): 3.542.B (S4794) "Eligibility shall begin with the date of application or the date the client
  # meets all eligibility requirements, whichever is later": with the application dated October 12, 2026 and the eligibility date not
  # stated, no day of September or August is a day of eligibility (0); October's days run from a date not stated (October 12 at the
  # earliest), so October cannot be determined; November, after the determination month, is a full month.
  - {id: "CO-2603-T8", title: "Coverage pass 6 CA6-1 (probe A1): applied October 12, eligibility date not stated: nothing for September", as_of: "2026-10-15", month: "2026-09", given: {af_application_date: "2026-10-12"}, expect: 0}
  - {id: "CO-2603-T9", title: "Probe A1: August, two months before the application month: 0", as_of: "2026-10-15", month: "2026-08", given: {af_application_date: "2026-10-12"}, expect: 0}
  - {id: "CO-2603-T10", title: "Probe A1: October, the application month, eligibility date not stated: cannot determine (decision 4)", as_of: "2026-10-15", month: "2026-10", given: {af_application_date: "2026-10-12"}, expect: unknown}
  - {id: "CO-2603-T11", title: "Probe A1: November, after the determination month: eligibility has begun, a full month", as_of: "2026-10-15", month: "2026-11", given: {af_application_date: "2026-10-12"}, expect: 1}
  - {id: "CO-2603-T12", title: "Probe A1b: applied and eligible October 12: days 12 to 31, 20 days, .65754 (3.581.D.4)", as_of: "2026-10-15", month: "2026-10", given: {af_application_date: "2026-10-12", af_eligibility_date: "2026-10-12"}, expect: 0.65754}
