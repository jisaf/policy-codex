  - {"id": "CO-5344-T1", "month": "2026-10", "title": "A $2,300 revocable prepaid contract: 2,300 - 1,500 = 800 (H.2); it states no interest accrued (accrued_interest 0, required above $1,500 since the field sweep fix round)", "as_of": "2026-10-01", "given": {"holdings": [{"kind": "prepaid_burial_contract", "value": 2300, "irrevocable": false, "accrued_interest": 0}]}, "expect": 800}
  - {id: "CO-5344-T2", month: "2026-10", title: "Two revocable trusts of $1,000: each under $1,500, 0 (was 500 on the total)", as_of: "2026-10-01", given: {holdings: [{kind: burial_fund, value: 1000, irrevocable: false}, {kind: burial_fund, value: 1000, irrevocable: false}]}, expect: 0}
  - {id: "CO-5344-T3", month: "2026-10", title: "An irrevocable $8,000 contract (H.1) and a $1,200 plot for a friend beyond the family's needs (I): 0 + 1,200 = 1,200", as_of: "2026-10-01", given: {holdings: [{kind: prepaid_burial_contract, value: 8000, irrevocable: true}, {kind: burial_space, value: 1200, amount_owed: 0, for_immediate_family: false}]}, expect: 1200}
  - {id: "CO-5344-T4", month: "2026-10", title: "A family plot (I: for the immediate family) worth $3,000: 0", as_of: "2026-10-01", given: {holdings: [{kind: burial_space, value: 3000, for_immediate_family: true}]}, expect: 0}
  # Field sweep fix round (FS-AF-5): hand-computed from 9 CCR 2503-5 3.520.77.G.3, H.2.b (S2619): interest on the exempt $1,500 is exempt.
  - {"month": "2027-02", "as_of": "2027-02-15", "title": "Probe FS-AF-5: a revocable burial fund of $1,550, $50 of it interest: principal 1,550 - 50 = 1,500, not over $1,500, so the fund and its interest are exempt, 0", "given": {"holdings": [{"kind": "burial_fund", "value": 1550, "amount_owed": 0, "irrevocable": false, "accrued_interest": 50}]}, "expect": 0, "id": "CO-5344-T5"}
  - {"month": "2027-02", "as_of": "2027-02-15", "title": "A revocable prepaid contract worth $1,500 that does not state its interest: not over $1,500, exempt without reading the interest, 0", "given": {"holdings": [{"kind": "prepaid_burial_contract", "value": 1500, "irrevocable": false}]}, "expect": 0, "id": "CO-5344-T6"}
  - {"month": "2027-02", "as_of": "2027-02-15", "title": "A revocable fund of $1,800, $100 of it interest: principal 1,700 over $1,500; the value over $1,500 counts as before (OQ-1253), 1,800 - 1,500 = 300", "given": {"holdings": [{"kind": "burial_fund", "value": 1800, "irrevocable": false, "accrued_interest": 100}]}, "expect": 300, "id": "CO-5344-T7"}
  - {"month": "2027-02", "as_of": "2027-02-15", "title": "A revocable fund of $1,800 that does not state its interest: decision 4, cannot determine", "given": {"holdings": [{"kind": "burial_fund", "value": 1800, "irrevocable": false}]}, "expect": "unknown", "id": "CO-5344-T8"}
