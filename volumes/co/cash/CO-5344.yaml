id: CO-5344
name: "Adult Financial: countable burial holdings"
identifier: af_countable_burial_holdings
kind: derived
type: money
scope: person-month
program: AdultFinancial
meaning: "The person's burial funds, contracts and spaces that Adult Financial counts (9 CCR 2503-5 3.520.72.B.8-9, 3.520.77.G-I): each revocable burial trust or prepaid burial contract (rows counted_above_burial_exemption, not irrevocable) over af_revocable_burial_funds_exemption ($1,500), each on its own (G.3: \"A revocable burial trust is exempt if the value of the trust does not exceed $1,500 ... Any amount over $1,500 is a countable resource\"; H.2), and the value of burial spaces beyond the burial needs of the immediate family (row counted_beyond_family_needs, not for_immediate_family; 3.520.72.B.9, 3.520.77.I), less what is owed on them (3.520.742.A.3: \"first determine the actual value; then subtract encumbrances\"), never below zero, times the person's share."
precision: "Resource records, step H1 Adult Financial (docs/reviews/records-holdings-snap-af.md): each trust and each contract has its own $1,500 exemption, as G.3 and H.2 state it of \"the trust\" and \"the prepaid burial contract\"; before step H1 the trusts were one total and the contracts another, each with one exemption, so two revocable trusts of $1,000 counted 2,000 - 1,500 = 500 and now count 0. An irrevocable contract is exempt (H.1); an irrevocable trust of which the client is both trustor and beneficiary is not irrevocable in the holdings record (its schema), so it is counted over $1,500 (G.2.d). The interest on the exempt $1,500 is exempt (G.3, H.2.b): the interest accrued is not read, as before (OQ-1253). What is owed on a burial space is required where read (decision 4; the fact before step H1, burial_spaces_value_beyond_family_needs, stated a value with no debt). Coverage pass 4 CA4-13 (docs/reviews/coverage4-cash.md): a figure of the month evaluated, from the holdings valued in that month (3.510 \"Resources\", S4791: \"held as of the first day of a calendar month or as of the date of application\"), so an application month before the determination month is judged by its own holdings; before, every month read the determination month's. Field sweep fix round (FS-AF-5): G.3 and H.2.b (S2619): \"Any interest on the exempt $1,500 is also exempt.\" A revocable trust or contract whose principal (its value less the interest accrued in it, accrued_interest) is $1,500 or less is exempt whole, its interest being interest on the exempt $1,500: a $1,550 fund of which $50 is interest counts 0, where before 1,550 - 1,500 = 50 counted. accrued_interest is read only for a record whose value is over $1,500 (required there, decision 4). With a principal over $1,500, how the interest splits between the exempt $1,500 and the rest is still OQ-1253 (narrowed), and the value over $1,500 counts, interest included, as before."
derived: ["+", ["sum_receipts", "holdings", ["all", ["all", ["received_in", ["month"]], ["unknown", ["receipt", "disposed_date"]]], ["=", ["lookup", "af_holding_treatment_table", ["receipt", "kind"]], "counted_above_burial_exemption"], ["not", ["receipt", "irrevocable"]]], ["case", [["<=", ["receipt", "value"], "af_revocable_burial_funds_exemption"], 0], [["<=", ["-", ["receipt", "value"], ["receipt", "accrued_interest"]], "af_revocable_burial_funds_exemption"], 0], ["else", ["-", ["receipt", "value"], "af_revocable_burial_funds_exemption"]]]], ["sum_receipts", "holdings", ["all", ["all", ["received_in", ["month"]], ["unknown", ["receipt", "disposed_date"]]], ["=", ["lookup", "af_holding_treatment_table", ["receipt", "kind"]], "counted_beyond_family_needs"], ["not", ["receipt", "for_immediate_family"]]], ["*", ["max", 0, ["-", ["receipt", "value"], ["receipt", "amount_owed"]]], ["otherwise", ["receipt", "share"], 1]]]]
sources: [S2619, S4692, S4791]
implemented: engine
tags: [cash, resources]
open: [OQ-1253]
rationale: "Resource records, step H1 Adult Financial (docs/reviews/records-holdings-snap-af.md): Adult Financial reads the person's resources from the holdings records (holdings, CO-5300) through its counting table (af_holding_treatment_table, CO-5302), for the client, the spouse and each sponsor alike (3.520.72.A, E), never from the scalar resource facts. The burial part of af_person_countable_resources_other_than_life_insurance (CO-4000), which read revocable_burial_trust_value, revocable_prepaid_burial_contract_value and burial_spaces_value_beyond_family_needs."
tests:
