id: CO-5140
name: "Colorado Works: pay received in the month"
identifier: cw_earned_pay
kind: derived
type: money
scope: person-month
program: ColoradoWorks
meaning: "The pay this person received in the month that Colorado Works counts as earned income (9 CCR 2503-6 3.605.2): the earnings records (earnings, CO-5100) received in the month whose kind Colorado Works' earnings table (cw_earnings_treatment_table, CO-5104) counts as pay: wages, salaries and commissions and the other pay no paragraph of 3.605.4 exempts (3.605.2.D.1: \"Unless otherwise specified, any earned income is countable\"), pay an employer diverts to a third party for the household's expenses (3.605.2.B.1), and in-kind pay at the value of the item supplied (3.605.2.A, G). A business's receipts, boarder payments and costs are counted elsewhere (cw_self_employment_net_profit, CO-1706; cw_boarder_income, CO-4361); exempt pay (work-study, WIOA on-the-job training and other subsidized employment, 3.605.4.B.24.a, B.35, B.16) is not counted."
precision: "Earned-income records, step E1 Colorado Works (docs/reviews/records-earnings-cash.md). The same for a member of the assistance unit and every person whose income is deemed to it. A record that recurs (no month and no date) is received in every month; a pay received once is placed by its month or date (3.605.1.A.2: income is countable when actually available; 3.605.2.B: wages are available when paid). A temporary job's pay and a dependent student's earnings are counted here and taken off by cw_excluded_earned_income (CO-2340). An unstated earnings list is cannot determine (product-owner decision 4 of 2026-11-23); a stated empty list is no pay. Coverage pass 4 CA4-9 (docs/reviews/coverage4-cash.md): a stream (an earnings record with no month and no date) is read only in the months from the month of its job_start_date through the month of its job_end_date, so the pay of a job that ended before the month, or begins after it, is not counted (9 CCR 2503-5 3.520.781.G, 9 CCR 2503-6 3.605.2.B: income counted when received); a record stated with its month or date is read in that month. Coverage pass 4 CA4-7: a difficulty of care payment stated as foster care (foster_care) is not counted pay. Field sweep fix round (FS-CW-4): 3.605.2.B (S4912): wages are \"considered available when paid rather than when earned, except that wages held at the request of the employee are considered income in the month they would otherwise have been paid\". A pay that states its regular_date and that the employer held at the person's request (regular_date_reason held_at_request, a neutral field of the earnings record) is read in the month of its regular_date; a pay that came early or late for any other reason (a holiday or a weekend, changed pay dates) is read in the month it was paid, so regular_date_reason is required where regular_date is stated (decision 4). Before, every pay was read in the month it came in, so held wages fell into the next month. The contract employment the paragraph excepts is OQ-1295."
derived: ["sum_receipts", "earnings", ["all", ["all", ["case", [["all", ["not", ["unknown", ["receipt", "regular_date"]]], ["=", ["receipt", "regular_date_reason"], "held_at_request"]], ["=", ["month_of", ["receipt", "regular_date"]], ["month"]]], ["else", ["received_in", ["month"]]]], ["any", ["in", ["lookup", "cw_earnings_treatment_table", ["receipt", "kind"]], ["counted", "counted_no_rule_excludes", "counted_at_value"]], ["all", ["=", ["lookup", "cw_earnings_treatment_table", ["receipt", "kind"]], "counted_unless_foster_care"], ["not", ["receipt", "foster_care"]]]]], ["any", ["not", ["unknown", ["receipt", "month"]]], ["all", ["any", ["unknown", ["receipt", "job_start_date"]], ["<=", ["month_of", ["receipt", "job_start_date"]], ["month"]]], ["any", ["unknown", ["receipt", "job_end_date"]], [">=", ["month_of", ["receipt", "job_end_date"]], ["month"]]]]]], ["receipt", "amount"]]
open: ["OQ-1295"]
sources: [S1621, S412, S3159, S4381, S2205, S2606, S4912]
implemented: engine
tags: [cash, tanf, income]
rationale: "Earned-income records, step E1 Colorado Works: the pay part of cw_gross_earned_income (CO-1716), which read wages_gross and in_kind_compensation_value and subtracted the parts of wages_gross the rule exempts (cw_excluded_earned_income, CO-2340); the counting table now decides each kind. Adult Financial's pay (af_earned_pay, CO-5130) is the same pattern for that program's own table; programs do not share an income calculation (product-owner decision of 2026-11-23)."
nearest: [CO-5130, CO-5651]
tests:
  # Hand computations from 3.605.2.A, B.1, D.1, G (S3159, S4381) and 3.605.4.A.24.a, B.35 (S2205, S2606).
  - {id: CO-5140-T1, month: "2026-10", as_of: "2026-10-15", title: "$800 of wages and $250 of work-study (exempt, A.24.a): 800", given: {earnings: [{kind: wages, amount: 800}, {kind: work_study, amount: 250}]}, expect: 800}
  - {id: CO-5140-T2, month: "2026-10", as_of: "2026-10-15", title: "$600 of WIOA on-the-job training wages and $400 from a subsidized transitional job are exempt (B.35, B.16): 0", given: {earnings: [{kind: wioa_on_the_job_training, amount: 600}, {kind: subsidized_employment, amount: 400}]}, expect: 0}
  - {id: CO-5140-T3, month: "2026-10", as_of: "2026-10-15", title: "$1,200 of wages, of which the employer pays $300 straight to the landlord: the $300 is still earned income (B.1): 900 + 300 = 1,200", given: {earnings: [{kind: wages, amount: 900}, {kind: employer_vendor_payment, amount: 300}]}, expect: 1200}
  - {id: CO-5140-T4, month: "2026-10", as_of: "2026-10-15", title: "$200 of wages and shelter worth $500 for caretaking work (A, G): 700", given: {earnings: [{kind: wages, amount: 200}, {kind: in_kind_pay, amount: 500}]}, expect: 700}
  - {id: CO-5140-T5, month: "2026-10", as_of: "2026-10-15", title: "Earnings not stated: cannot determine (decision 4)", given: {}, expect: unknown}
  - {id: CO-5140-T6, month: "2026-10", as_of: "2026-10-15", title: "Earnings stated empty: no pay", given: {earnings: []}, expect: 0}
  # Coverage pass 4 (docs/reviews/coverage4-cash.md): the review's repro households, by hand from the rule text.
  - {id: "CO-5140-T10", month: "2026-10", as_of: "2026-10-15", given: {earnings: [{kind: difficulty_of_care_payment, amount: 600, foster_care: true}]}, title: "Coverage pass 4 CA4-7 (probe W4): $600 of difficulty of care for a foster child placed in the home is foster care funds of the child (3.605.4.B.11, as the receipt table reads it): 0", expect: 0}
  - {id: "CO-5140-T11", month: "2026-10", as_of: "2026-10-15", given: {earnings: [{kind: wages, amount: 1000, job_end_date: "2026-09-20"}]}, title: "Coverage pass 4 CA4-9 (probe W1): a $1,000 stream whose job ended September 20: no pay in October (3.605.2.B, available when paid): 0", expect: 0}
  - {id: "CO-5140-T12", month: "2026-10", as_of: "2026-10-15", given: {earnings: [{kind: wages, amount: 1000, job_start_date: "2026-11-02"}]}, title: "Coverage pass 4 CA4-9 (probe W1b): a stream whose job begins November 2: nothing in October", expect: 0}
  - {id: "CO-5140-T13", month: "2026-11", as_of: "2026-10-15", given: {earnings: [{kind: wages, amount: 1000, job_start_date: "2026-11-02"}]}, title: "Coverage pass 4 CA4-9 (probe W1b): the same stream in November, the month the job begins: 1,000", expect: 1000}
  # Field sweep fix round (FS-CW-4): hand-computed from 9 CCR 2503-6 3.605.2.B (S4912): wages held at the employee's request are income in the month they would otherwise have been paid; other wages when paid.
  - {"month": "2027-02", "as_of": "2027-02-15", "title": "Probe FS-CW-4: a $1,200 monthly pay due 2027-02-26, held at the employee's request and paid 2027-03-03: February's income, 1,200", "given": {"earnings": [{"kind": "wages", "amount": 1200, "date": "2027-03-03", "frequency": "monthly", "job": "job_1", "regular_date": "2027-02-26", "regular_date_reason": "held_at_request"}]}, "expect": 1200, "id": "CO-5140-T14"}
  - {"month": "2027-03", "as_of": "2027-03-15", "title": "The same held pay read for March, the month it was paid: not March's, 0", "given": {"earnings": [{"kind": "wages", "amount": 1200, "date": "2027-03-03", "frequency": "monthly", "job": "job_1", "regular_date": "2027-02-26", "regular_date_reason": "held_at_request"}]}, "expect": 0, "id": "CO-5140-T15"}
  - {"month": "2027-03", "as_of": "2027-03-15", "title": "A $1,200 pay due Saturday 2027-02-27 and paid Monday 2027-03-01 (a weekend): available when paid, March's, 1,200", "given": {"earnings": [{"kind": "wages", "amount": 1200, "date": "2027-03-01", "frequency": "monthly", "job": "job_1", "regular_date": "2027-02-27", "regular_date_reason": "holiday_or_weekend"}]}, "expect": 1200, "id": "CO-5140-T16"}
  - {"month": "2027-02", "as_of": "2027-02-15", "title": "A pay that states a regular date but not why it moved: decision 4, cannot determine", "given": {"earnings": [{"kind": "wages", "amount": 1200, "date": "2027-03-03", "frequency": "monthly", "job": "job_1", "regular_date": "2027-02-26"}]}, "expect": "unknown", "id": "CO-5140-T17"}
