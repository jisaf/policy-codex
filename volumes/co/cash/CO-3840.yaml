id: CO-3840
name: "Adult Financial: months of ineligibility for a month's transfer"
identifier: af_twfc_penalty_months
kind: derived
type: whole number
scope: person-month
program: AdultFinancial
meaning: "The number of months of ineligibility for Adult Financial grant payments for the transfer without fair consideration the person made in the month (9 CCR 2503-5 3.520.76.D-E): the uncompensated value divided by the TWFC monthly penalty value (af_twfc_monthly_penalty_value, the current grant standard of the client's program) and rounded down, at most af_twfc_max_penalty_months; 0 when the month's transfer does not count (af_twfc_transfer_is_counted) or the whole resource was returned in the same month (D.6); and, when the whole resource was returned in a later month, no more than the months from the month after the transfer through the month of the return (D.6.a)."
precision: "The divisor is read at the determination month, D.2's current standard. Final cash review 2, N-5: the transfers are stated by month, so each month's transfer is divided and rounded down on its own, and af_is_in_twfc_penalty_period (CO-3841) runs the periods one after another (D.5); two transfers of $1,000 by an OAP client in different months give 0 + 0 months, not floor(2,000 / 1,032) = 1. Several resources transferred in the same calendar month are stated as one value (resource_transfer_uncompensated_value, CO-3835) and so divided together: the per-resource rounding of E is exact for transfers in different months only, a limit of the month-by-month statement (the volume has no list-valued fact). Final cash review 2, P2-4: a resource returned in whole ends that transfer's months with the month of the return (resource_transfer_returned_date, CO-4009)."
derived: [case, [[not, af_twfc_transfer_is_counted], 0], [[all, [not, [unknown, resource_transfer_returned_date]], ["<=", [month_of, resource_transfer_returned_date], [month]]], 0], [[unknown, resource_transfer_returned_date], [min, af_twfc_max_penalty_months, ["-", 0, [ceil, ["-", 0, ["/", resource_transfer_uncompensated_value, [at, af_twfc_monthly_penalty_value, [det_month]]]]]]]], [else, [min, [count_months, [months_from_to, [month_after, [month]], [month_of, resource_transfer_returned_date]], true], [min, af_twfc_max_penalty_months, ["-", 0, [ceil, ["-", 0, ["/", resource_transfer_uncompensated_value, [at, af_twfc_monthly_penalty_value, [det_month]]]]]]]]]]
sources: [S2614, S2615, S2806]
implemented: engine
tags: [cash, resources]
rationale: "Final cash review FC-6: 9 CCR 2503-5 3.520.76 (S2614) and C.R.S. 26-2-111(1)(c) (S2615) make a transfer without fair consideration within thirty-six months before the application, or while receiving, a ground of ineligibility for a period set by the uncompensated value, and nothing in the volume stated it, so a client in a penalty period was found eligible. 3.520.76.D (S2614) states the computation. Final cash review 2, N-5: the item divided the total of several transfers once, though D.3 and E round down the uncompensated value of each resource transferred; it now states the months for each month's transfer."
tests:
  - {id: CO-3840-T1, title: "OAP client gave $5,000 to a nephew in December 2025, application October 2026: 5000 / 1032 = 4.8, rounded down to 4 months", as_of: "2026-10-01", month: "2025-12", given: {af_application_date: "2026-10-01", af_twfc_monthly_penalty_value: {"2026-10": 1032}, resource_transfer_uncompensated_value: {"2025-12": 5000}, resource_transfer_date: {"2025-12": "2025-12-15"}}, expect: 4}
  - {id: CO-3840-T2, title: "A $60,000 transfer: capped at 36 months (E)", as_of: "2026-10-01", month: "2025-12", given: {af_application_date: "2026-10-01", af_twfc_monthly_penalty_value: {"2026-10": 1032}, resource_transfer_uncompensated_value: {"2025-12": 60000}, resource_transfer_date: {"2025-12": "2025-12-15"}}, expect: 36}
  - {id: CO-3840-T3, title: "The transfer was 40 months before the application", as_of: "2026-10-01", month: "2023-06", given: {af_application_date: "2026-10-01", af_twfc_monthly_penalty_value: {"2026-10": 1032}, resource_transfer_uncompensated_value: {"2023-06": 5000}, resource_transfer_date: {"2023-06": "2023-06-15"}}, expect: 0}
  - {id: CO-3840-T4, title: "The county found the transfer involuntary (a foreclosure, C.2)", as_of: "2026-10-01", month: "2025-12", given: {af_application_date: "2026-10-01", af_twfc_monthly_penalty_value: {"2026-10": 1032}, resource_transfer_uncompensated_value: {"2025-12": 5000}, resource_transfer_date: {"2025-12": "2025-12-15"}, af_transfer_found_not_twfc: {"2025-12": true}}, expect: 0}
  - {id: CO-3840-T5, title: "No transfer in the month", as_of: "2026-10-01", month: "2025-12", given: {}, expect: 0}
  - {id: CO-3840-T6, title: "AND-SO client, $1,000 given away in July 2026: 1000 / 248 = 4.03, 4 months", as_of: "2026-10-01", month: "2026-07", given: {af_application_date: "2026-10-01", af_twfc_monthly_penalty_value: {"2026-10": 248}, resource_transfer_uncompensated_value: {"2026-07": 1000}, resource_transfer_date: {"2026-07": "2026-07-20"}}, expect: 4}
  - {id: CO-3840-T7, title: "Transfer on 2023-10-01, application 2026-10-01: exactly thirty-six months, within: 2064 / 1032 = 2", as_of: "2026-10-01", month: "2023-10", given: {af_application_date: "2026-10-01", af_twfc_monthly_penalty_value: {"2026-10": 1032}, resource_transfer_uncompensated_value: {"2023-10": 2064}, resource_transfer_date: {"2023-10": "2023-10-01"}}, expect: 2}
  - {id: CO-3840-T8, title: "Transfer on 2023-09-30: before the thirty-six months", as_of: "2026-10-01", month: "2023-09", given: {af_application_date: "2026-10-01", af_twfc_monthly_penalty_value: {"2026-10": 1032}, resource_transfer_uncompensated_value: {"2023-09": 2064}, resource_transfer_date: {"2023-09": "2023-09-30"}}, expect: 0}
  # Final cash review 2, P2-4: 3.520.76.D.6.
  - {id: CO-3840-T9, title: "P2-4: the whole $5,000 was returned the same month - no period (D.6)", as_of: "2026-10-01", month: "2025-12", given: {af_application_date: "2026-10-01", af_twfc_monthly_penalty_value: {"2026-10": 1032}, resource_transfer_uncompensated_value: {"2025-12": 5000}, resource_transfer_date: {"2025-12": "2025-12-15"}, resource_transfer_returned_date: {"2025-12": "2025-12-28"}}, expect: 0}
  - {id: CO-3840-T10, title: "P2-4: the whole $5,000 was returned on 2026-02-01 - the period runs through February, 2 months, not 4 (D.6.a)", as_of: "2026-10-01", month: "2025-12", given: {af_application_date: "2026-10-01", af_twfc_monthly_penalty_value: {"2026-10": 1032}, resource_transfer_uncompensated_value: {"2025-12": 5000}, resource_transfer_date: {"2025-12": "2025-12-15"}, resource_transfer_returned_date: {"2025-12": "2026-02-01"}}, expect: 2}
