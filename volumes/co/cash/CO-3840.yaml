id: CO-3840
name: "Adult Financial: months of ineligibility for a transfer"
identifier: af_twfc_penalty_months
kind: derived
type: whole number
scope: person-month
program: AdultFinancial
meaning: "The number of months of ineligibility for Adult Financial grant payments for the person's transfer without fair consideration (9 CCR 2503-5 3.520.76.D-E): the uncompensated value divided by the current Adult Financial grant standard of the client's program (the TWFC monthly penalty value) and rounded down, at most af_twfc_max_penalty_months; 0 when no transfer is stated, when the county found the transfer not to be one (af_transfer_found_not_twfc), or when it was made before the af_twfc_lookback_months months before the application."
precision: "The program's standard is read as af_countable_income reads the program, without a cycle through af_category: OAP when af_is_oap_age, AND-CS when af_and_cs_eligible, AND-SO otherwise. The thirty-six months end on the application date: a transfer on the same day of the month thirty-six months before it, or later, is within them; one earlier is not. A transfer after the application is made while receiving, and is within them. Several transfers: the case states the first transfer's date and the total uncompensated value, so the periods of D.5, which follow one another, are read as one period of the total divided by the standard (the sum of the separate periods can be up to one month shorter for each further transfer)."
derived: [case, [[unknown, resource_transfer_date], 0], [[otherwise, af_transfer_found_not_twfc, false], 0], [[any, ["<", [month_of, resource_transfer_date], [months_before, af_twfc_lookback_months, [month_of, af_application_date]]], [all, ["=", [month_of, resource_transfer_date], [months_before, af_twfc_lookback_months, [month_of, af_application_date]]], ["<", [days_between, [first_day, [month_of, resource_transfer_date]], resource_transfer_date], [days_between, [first_day, [month_of, af_application_date]], af_application_date]]]], 0], [else, [min, af_twfc_max_penalty_months, ["-", 0, [ceil, ["-", 0, ["/", resource_transfer_uncompensated_value, [case, [af_is_oap_age, af_oap_grant_standard], [af_and_cs_eligible, af_and_cs_grant_standard], [else, af_and_so_grant_standard]]]]]]]]]
sources: [S2614, S2615]
implemented: engine
tags: [cash, resources]
rationale: "Final cash review FC-6: 9 CCR 2503-5 3.520.76 (S2614) and C.R.S. 26-2-111(1)(c) (S2615) make a transfer without fair consideration within thirty-six months before the application, or while receiving, a ground of ineligibility for a period set by the uncompensated value, and nothing in the volume stated it, so a client in a penalty period was found eligible. 3.520.76.D (S2614) states the computation."
tests:
  - {id: CO-3840-T1, title: "OAP client gave $5,000 to a nephew 10 months before applying: 5000 / 1032 = 4.8, rounded down to 4 months", as_of: "2026-10-01", month: "2026-10", given: {resource_transfer_date: "2025-12-15", resource_transfer_uncompensated_value: 5000, af_application_date: "2026-10-01", af_is_oap_age: true}, expect: 4}
  - {id: CO-3840-T2, title: "A $60,000 transfer: capped at 36 months (E)", as_of: "2026-10-01", month: "2026-10", given: {resource_transfer_date: "2025-12-15", resource_transfer_uncompensated_value: 60000, af_application_date: "2026-10-01", af_is_oap_age: true}, expect: 36}
  - {id: CO-3840-T3, title: "The transfer was 40 months before the application", as_of: "2026-10-01", month: "2026-10", given: {resource_transfer_date: "2023-06-15", resource_transfer_uncompensated_value: 5000, af_application_date: "2026-10-01", af_is_oap_age: true}, expect: 0}
  - {id: CO-3840-T4, title: "The county found the transfer involuntary (a foreclosure, C.2)", as_of: "2026-10-01", month: "2026-10", given: {resource_transfer_date: "2025-12-15", resource_transfer_uncompensated_value: 5000, af_application_date: "2026-10-01", af_transfer_found_not_twfc: true}, expect: 0}
  - {id: CO-3840-T5, title: "No transfer", as_of: "2026-10-01", month: "2026-10", given: {}, expect: 0}
  - {id: CO-3840-T6, title: "AND-SO client, $1,000 given away: 1000 / 248 = 4.03, 4 months", as_of: "2026-10-01", month: "2026-10", given: {resource_transfer_date: "2026-07-20", resource_transfer_uncompensated_value: 1000, af_application_date: "2026-10-01", af_is_oap_age: false, af_and_cs_eligible: false}, expect: 4}
  - {id: CO-3840-T7, title: "Transfer on 2023-10-01, application 2026-10-01: exactly thirty-six months, within", as_of: "2026-10-01", month: "2026-10", given: {resource_transfer_date: "2023-10-01", resource_transfer_uncompensated_value: 2064, af_application_date: "2026-10-01", af_is_oap_age: true}, expect: 2}
  - {id: CO-3840-T8, title: "Transfer on 2023-09-30: before the thirty-six months", as_of: "2026-10-01", month: "2026-10", given: {resource_transfer_date: "2023-09-30", resource_transfer_uncompensated_value: 2064, af_application_date: "2026-10-01", af_is_oap_age: true}, expect: 0}
