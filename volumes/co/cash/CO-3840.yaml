id: CO-3840
name: "Adult Financial: months of ineligibility for a month's transfer"
identifier: af_twfc_penalty_months
kind: derived
type: whole number
scope: person-month
program: AdultFinancial
meaning: "The number of months of ineligibility for Adult Financial grant payments for the transfer without fair consideration the person made in the month (9 CCR 2503-5 3.520.76.D-E): the uncompensated value divided by the TWFC monthly penalty value (af_twfc_monthly_penalty_value, the current grant standard of the client's program) and rounded down, at most af_twfc_max_penalty_months; 0 when the month's transfer does not count (af_twfc_transfer_is_counted) or the whole resource was returned in the same month (D.6); and, when the whole resource was returned in a later month, no more than the months from the month after the transfer through the month of the return (D.6.a)."
precision: "The divisor is read at the determination month, D.2's current standard. Final cash review 2, N-5: each month's transfers are divided and rounded down on their own, and af_is_in_twfc_penalty_period (CO-3841) runs the periods one after another (D.5); two transfers of $1,000 by an OAP client in different months give 0 + 0 months, not floor(2,000 / 1,032) = 1. Resource records, step H1 Adult Financial (docs/reviews/records-holdings-snap-af.md): the month's transfers are the holdings records disposed of in it, counted (af_twfc_transfer_is_counted, CO-4008), at their uncompensated value. A transfer returned in whole in the same month adds nothing (D.6); when every transfer of the month was returned in whole in a later month, the months are no more than those from the month after the transfer through the latest month of return (D.6.a). Several resources transferred in one calendar month and not returned are cannot determine: D.3 and E round down the uncompensated value of each resource transferred, which needs the divisor (af_twfc_monthly_penalty_value, a fact of the person) inside the sum over the records, which the receipt operators do not allow (docs/operators.md P55); before step H1 they were stated as one value and divided together, which overstates the months by up to one per extra resource (OQ-1254; a request to the integration owner). In the month thirty-six months before the application, when the month's transfers fall on both sides of the application's day of the month, the value of those within the thirty-six months cannot be read for the same reason (the application date is a fact of the person), and the months are cannot determine (OQ-1254); with one transfer in that month, or all on one side, the answer is given."
