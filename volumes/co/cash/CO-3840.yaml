id: CO-3840
name: "Adult Financial: months of ineligibility for a month's transfer"
identifier: af_twfc_penalty_months
kind: derived
type: whole number
scope: person-month
program: AdultFinancial
meaning: "The number of months of ineligibility for Adult Financial grant payments for the transfers without fair consideration the person made in the month (9 CCR 2503-5 3.520.76.D-E), for each resource transferred in the month and not returned in whole in the same month (D.6) that counts (af_twfc_transfer_is_counted) and was made within the thirty-six months before the application or after it (A.3): its uncompensated value divided by the TWFC monthly penalty value (af_twfc_monthly_penalty_value, the current grant standard of the client's program) and rounded down, at most af_twfc_max_penalty_months (E: \"up to a maximum of 36 months depending on the amount of the uncompensated value for each resource transferred\"), and, when the whole resource was returned in a later month, no more than the months from the month after the transfer through the month of the return (D.6.a); the months of the month's resources added together, since each transfer's period follows the one before (D.5; af_is_in_twfc_penalty_period, CO-3841). 0 when the month's transfer does not count."
precision: "The divisor is read at the determination month, D.2's current standard. Final cash review 2, N-5: each month's transfers are divided and rounded down on their own, and af_is_in_twfc_penalty_period (CO-3841) runs the periods one after another (D.5); two transfers of $1,000 by an OAP client in different months give 0 + 0 months, not floor(2,000 / 1,032) = 1. Resource records, step H1 Adult Financial (docs/reviews/records-holdings-snap-af.md): the month's transfers are the holdings records disposed of in it, counted (af_twfc_transfer_is_counted, CO-4008), at their uncompensated value. A transfer returned in whole in the same month adds nothing (D.6); when every transfer of the month was returned in whole in a later month, the months are no more than those from the month after the transfer through the latest month of return (D.6.a). Cross-list records round (docs/reviews/cross-list-records.md; OQ-1254 resolved, CA4-19): each resource transferred is counted on its own record, as D.3 and E say (\"Divide the uncompensated value by the TWFC monthly penalty value and round down\"; \"for each resource transferred\", S2614, S2806): the divisor and the application date are facts of the client, read inside the sum over the records as facts of the record's owner (P60, docs/operators.md: [of, [owner], ...]; the holdings read here are the person's own, so the owner is the person). So two resources transferred in one month are each divided and rounded down (OAP, $1,032: $3,000 and $2,200 give 2 + 2 = 4 months, where the month's total would give 5), each is capped at 36 months, each returned in a later month is cut at its own month of return, and in the month thirty-six months before the application month only the resources transferred on or after the application's day of the month are counted (A.3: \"within thirty-six (36) months prior to the application date\"), however many fall on either side. Before, both cases were cannot determine (P55 lets a sum over the records read no fact of a person). Field sweep defaults list (2026-11-23): af_found_not_twfc is read as the holdings record states it, its default false declared once on the schema (CO-5300) with the rule that gives it (9 CCR 2503-5 3.520.76.A.4.a (S2614): the county presumes a transfer in the look-back was made to become eligible); before, this reader gave the default itself (otherwise false), which conventions rule 12 and decision 4 do not allow a reader. No value changes: the tests that leave the finding out read it as false, as before."
derived: [case, [[not, af_twfc_transfer_is_counted], 0], [else, [sum_receipts, holdings, [all, [all, [not, [unknown, [receipt, disposed_date]]], ["=", [month_of, [receipt, disposed_date]], [month]], [not, [receipt, af_found_not_twfc]], [">", [max, 0, ["-", ["*", ["-", [receipt, value], [receipt, amount_owed]], [otherwise, [receipt, share], 1]], [receipt, compensation_received]]], 0]], [any, [unknown, [receipt, returned_date]], [">", [month_of, [receipt, returned_date]], [month]]], [any, [">", [month], [months_before, af_twfc_lookback_months, [month_of, [of, [owner], af_application_date]]]], [all, ["=", [month], [months_before, af_twfc_lookback_months, [month_of, [of, [owner], af_application_date]]]], [">=", [days_between, [first_day, [month]], [receipt, disposed_date]], [days_between, [first_day, [month_of, [of, [owner], af_application_date]]], [of, [owner], af_application_date]]]]]], [case, [[all, [not, [unknown, [receipt, returned_date]]], [">", [month_of, [receipt, returned_date]], [month]]], [min, [count_months, [months_from_to, [month_after, [month]], [month_of, [receipt, returned_date]]], true], [min, af_twfc_max_penalty_months, ["-", 0, [ceil, ["-", 0, ["/", [max, 0, ["-", ["*", ["-", [receipt, value], [receipt, amount_owed]], [otherwise, [receipt, share], 1]], [receipt, compensation_received]]], [at, [of, [owner], af_twfc_monthly_penalty_value], [det_month]]]]]]]]], [else, [min, af_twfc_max_penalty_months, ["-", 0, [ceil, ["-", 0, ["/", [max, 0, ["-", ["*", ["-", [receipt, value], [receipt, amount_owed]], [otherwise, [receipt, share], 1]], [receipt, compensation_received]]], [at, [of, [owner], af_twfc_monthly_penalty_value], [det_month]]]]]]]]]]]]
sources: [S2614, S2615, S2806]
implemented: engine
tags: [cash, resources]
rationale: "Final cash review FC-6: 9 CCR 2503-5 3.520.76 (S2614) and C.R.S. 26-2-111(1)(c) (S2615) make a transfer without fair consideration within thirty-six months before the application, or while receiving, a ground of ineligibility for a period set by the uncompensated value, and nothing in the volume stated it, so a client in a penalty period was found eligible. 3.520.76.D (S2614) states the computation. Final cash review 2, N-5: the item divided the total of several transfers once, though D.3 and E round down the uncompensated value of each resource transferred; it now states the months for each month's transfer."
tests:
  - {id: CO-3840-T1, title: "OAP client gave $5,000 to a nephew in December 2025, application October 2026: 5000 / 1032 = 4.8, rounded down to 4 months", as_of: "2026-10-01", month: "2025-12", given: {af_application_date: "2026-10-01", af_twfc_monthly_penalty_value: {2026-10: 1032}, holdings: [{kind: other_resource, value: 5000, amount_owed: 0, compensation_received: 0, disposed_date: "2025-12-15"}]}, expect: 4}
  - {id: CO-3840-T2, title: "A $60,000 transfer: capped at 36 months (E)", as_of: "2026-10-01", month: "2025-12", given: {af_application_date: "2026-10-01", af_twfc_monthly_penalty_value: {2026-10: 1032}, holdings: [{kind: other_resource, value: 60000, amount_owed: 0, compensation_received: 0, disposed_date: "2025-12-15"}]}, expect: 36}
  - {id: CO-3840-T3, title: "The transfer was 40 months before the application", as_of: "2026-10-01", month: "2023-06", given: {af_application_date: "2026-10-01", af_twfc_monthly_penalty_value: {2026-10: 1032}, holdings: [{kind: other_resource, value: 5000, amount_owed: 0, compensation_received: 0, disposed_date: "2023-06-15"}]}, expect: 0}
  - {id: CO-3840-T4, title: "The county found the transfer involuntary (a foreclosure, C.2)", as_of: "2026-10-01", month: "2025-12", given: {af_application_date: "2026-10-01", af_twfc_monthly_penalty_value: {2026-10: 1032}, holdings: [{kind: other_resource, value: 5000, amount_owed: 0, compensation_received: 0, disposed_date: "2025-12-15", af_found_not_twfc: true}]}, expect: 0}
  - {id: CO-3840-T5, title: "No transfer in the month (holdings stated, none disposed of)", as_of: "2026-10-01", month: "2025-12", given: {af_application_date: "2026-10-01", holdings: []}, expect: 0}
  - {id: CO-3840-T6, title: "AND-SO client, $1,000 given away in July 2026: 1000 / 248 = 4.03, 4 months", as_of: "2026-10-01", month: "2026-07", given: {af_application_date: "2026-10-01", af_twfc_monthly_penalty_value: {2026-10: 248}, holdings: [{kind: other_resource, value: 1000, amount_owed: 0, compensation_received: 0, disposed_date: "2026-07-20"}]}, expect: 4}
  - {id: CO-3840-T7, title: "Transfer on 2023-10-01, application 2026-10-01: exactly thirty-six months, within: 2064 / 1032 = 2", as_of: "2026-10-01", month: "2023-10", given: {af_application_date: "2026-10-01", af_twfc_monthly_penalty_value: {2026-10: 1032}, holdings: [{kind: other_resource, value: 2064, amount_owed: 0, compensation_received: 0, disposed_date: "2023-10-01"}]}, expect: 2}
  - {id: CO-3840-T8, title: "Transfer on 2023-09-30: before the thirty-six months", as_of: "2026-10-01", month: "2023-09", given: {af_application_date: "2026-10-01", af_twfc_monthly_penalty_value: {2026-10: 1032}, holdings: [{kind: other_resource, value: 2064, amount_owed: 0, compensation_received: 0, disposed_date: "2023-09-30"}]}, expect: 0}
  # Final cash review 2, P2-4: 3.520.76.D.6.
  - {id: CO-3840-T9, title: "P2-4: the whole $5,000 was returned the same month - no period (D.6)", as_of: "2026-10-01", month: "2025-12", given: {af_application_date: "2026-10-01", af_twfc_monthly_penalty_value: {2026-10: 1032}, holdings: [{kind: other_resource, value: 5000, amount_owed: 0, compensation_received: 0, disposed_date: "2025-12-15", returned_date: "2025-12-28"}]}, expect: 0}
  - {id: CO-3840-T10, title: "P2-4: the whole $5,000 was returned on 2026-02-01 - the period runs through February, 2 months, not 4 (D.6.a)", as_of: "2026-10-01", month: "2025-12", given: {af_application_date: "2026-10-01", af_twfc_monthly_penalty_value: {2026-10: 1032}, holdings: [{kind: other_resource, value: 5000, amount_owed: 0, compensation_received: 0, disposed_date: "2025-12-15", returned_date: "2026-02-01"}]}, expect: 2}
  # Resource records, step H1 Adult Financial: hand-computed from 9 CCR 2503-5 3.520.76.D-E (S2614, S2806); application 2026-10-15, so the thirty-six months begin 2023-10-15.
  - {id: CO-3840-T11, title: "Two gifts in December 2025 of $3,000 and $2,200: the rule rounds each (3,000 / 1,032 = 2.9 and 2,200 / 1,032 = 2.1: 2 + 2 = 4 months), which the month's total (5,200 / 1,032 = 5.04: 5) would overstate; each is divided and rounded down on its own (D.3, E; OQ-1254 resolved): 4", as_of: "2026-10-15", month: "2025-12", given: {af_application_date: "2026-10-15", af_twfc_monthly_penalty_value: {2026-10: 1032}, holdings: [{kind: bank_account, value: 3000, amount_owed: 0, compensation_received: 0, disposed_date: "2025-12-02"}, {kind: securities, value: 2200, amount_owed: 0, compensation_received: 0, disposed_date: "2025-12-20"}]}, expect: 4}
  - {id: CO-3840-T12, title: "A $6,000 car sold for $1,000 in December 2025 ((6,000 - 1,000) / 1,032 = 4.84): 4 months", as_of: "2026-10-15", month: "2025-12", given: {af_application_date: "2026-10-15", af_twfc_monthly_penalty_value: {2026-10: 1032}, holdings: [{kind: vehicle, value: 6000, amount_owed: 0, compensation_received: 1000, disposed_date: "2025-12-02"}]}, expect: 4}
  - {id: CO-3840-T13, title: "October 2023, the first month of the thirty-six: a $2,064 gift on October 20 (on or after the 15th) counts, 2 months", as_of: "2026-10-15", month: "2023-10", given: {af_application_date: "2026-10-15", af_twfc_monthly_penalty_value: {2026-10: 1032}, holdings: [{kind: other_resource, value: 2064, amount_owed: 0, compensation_received: 0, disposed_date: "2023-10-20"}]}, expect: 2}
  - {id: CO-3840-T14, title: "October 2023: gifts on October 3 (before the 15th) and October 20 - only the gift on or after the application's day of the month is within the thirty-six months (A.3; OQ-1254 resolved): 2,064 / 1,032 = 2", as_of: "2026-10-15", month: "2023-10", given: {af_application_date: "2026-10-15", af_twfc_monthly_penalty_value: {2026-10: 1032}, holdings: [{kind: other_resource, value: 2064, amount_owed: 0, compensation_received: 0, disposed_date: "2023-10-03"}, {kind: other_resource, value: 2064, amount_owed: 0, compensation_received: 0, disposed_date: "2023-10-20"}]}, expect: 2}
  # Cross-list records round (docs/reviews/cross-list-records.md): each resource transferred on its own record (D.3, E, D.6.a, A.3; OQ-1254 resolved); hand-computed from the text quoted in each title.
  - {id: CO-3840-T15, title: "OQ-1254's example on the record: an OAP client ($1,032) gives $3,000 and $2,200 away in December 2025, the $3,000 returned in whole on 2026-02-01: its period runs through February (D.6.a), min(2, 2) = 2, and the $2,200 gives 2: 2 + 2 = 4", as_of: "2026-10-15", month: "2025-12", given: {af_application_date: "2026-10-15", af_twfc_monthly_penalty_value: {"2026-10": 1032}, holdings: [{kind: other_resource, value: 3000, amount_owed: 0, compensation_received: 0, disposed_date: "2025-12-02", returned_date: "2026-02-01"}, {kind: other_resource, value: 2200, amount_owed: 0, compensation_received: 0, disposed_date: "2025-12-20"}]}, expect: 4}
  - {id: CO-3840-T16, title: "Two transfers in December 2025, the $5,000 returned in whole on 2025-12-28 (no period, D.6) and $2,200 kept: 2,200 / 1,032 = 2.1: 2", as_of: "2026-10-15", month: "2025-12", given: {af_application_date: "2026-10-15", af_twfc_monthly_penalty_value: {"2026-10": 1032}, holdings: [{kind: other_resource, value: 5000, amount_owed: 0, compensation_received: 0, disposed_date: "2025-12-02", returned_date: "2025-12-28"}, {kind: other_resource, value: 2200, amount_owed: 0, compensation_received: 0, disposed_date: "2025-12-20"}]}, expect: 2}
  - {id: CO-3840-T17, title: "Two gifts of $40,000 in December 2025: each is 38.8 months rounded down to 38 and capped at 36 (E: \"up to a maximum of 36 months ... for each resource transferred\"), and the second period follows the first (D.5): 36 + 36 = 72", as_of: "2026-10-15", month: "2025-12", given: {af_application_date: "2026-10-15", af_twfc_monthly_penalty_value: {"2026-10": 1032}, holdings: [{kind: other_resource, value: 40000, amount_owed: 0, compensation_received: 0, disposed_date: "2025-12-02"}, {kind: other_resource, value: 40000, amount_owed: 0, compensation_received: 0, disposed_date: "2025-12-20"}]}, expect: 72}
  - {id: CO-3840-T18, title: "An AND-SO client ($248) gives two gifts of $397 in July 2026: 397 / 248 = 1.6, rounded down to 1, for each: 1 + 1 = 2 (the month's total, 794 / 248 = 3.2, would give 3)", as_of: "2026-10-01", month: "2026-07", given: {af_application_date: "2026-10-01", af_twfc_monthly_penalty_value: {"2026-10": 248}, holdings: [{kind: other_resource, value: 397, amount_owed: 0, compensation_received: 0, disposed_date: "2026-07-03"}, {kind: other_resource, value: 397, amount_owed: 0, compensation_received: 0, disposed_date: "2026-07-24"}]}, expect: 2}
  - {id: CO-3840-T19, title: "October 2023, application 2026-10-15: gifts on October 3 ($2,064), October 15 ($3,096) and October 30 ($1,032); the ones on or after the 15th are within the thirty-six months (A.3): 3,096 / 1,032 = 3 and 1,032 / 1,032 = 1: 3 + 1 = 4", as_of: "2026-10-15", month: "2023-10", given: {af_application_date: "2026-10-15", af_twfc_monthly_penalty_value: {"2026-10": 1032}, holdings: [{kind: other_resource, value: 2064, amount_owed: 0, compensation_received: 0, disposed_date: "2023-10-03"}, {kind: other_resource, value: 3096, amount_owed: 0, compensation_received: 0, disposed_date: "2023-10-15"}, {kind: other_resource, value: 1032, amount_owed: 0, compensation_received: 0, disposed_date: "2023-10-30"}]}, expect: 4}
  - {id: CO-3840-T20, title: "Decision 4: two gifts in December 2025 and the client's program, which sets the divisor, not stated (af_is_oap_age): cannot determine", as_of: "2026-10-15", month: "2025-12", given: {af_application_date: "2026-10-15", holdings: [{kind: other_resource, value: 3000, amount_owed: 0, compensation_received: 0, disposed_date: "2025-12-02"}, {kind: other_resource, value: 2200, amount_owed: 0, compensation_received: 0, disposed_date: "2025-12-20"}]}, expect: unknown}
