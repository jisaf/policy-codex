id: CO-1665
name: "Adult Financial: earned income verification is pending"
identifier: af_earned_income_verification_is_pending
kind: derived
type: yes/no
scope: person-month
program: AdultFinancial
role: outcome
meaning: "Whether Adult Financial requires verification of the client's wages (documents: DOLE wage data is not verified upon receipt) and self-employment income (documentation the county accepts unless questionable, or SSA self-employment data) and it has not been provided."
precision: "Self-employment documentation is required, though no specific document is (3.520.783.E, review C-11); earned_income_attestation_is_questionable stands for documentation the county finds questionable. False where Adult Financial verification does not apply to the person (af_verification_is_applicable, CO-2584; case worker review B2). Due by: af_verification_due_date (CO-1437: eleven days)."
derived: [all, af_verification_is_applicable, af_earned_income_is_unverified]
sources: [S880, S889]
implemented: engine
tags: [verification, cash]
rationale: "Review U-1: the count items held this test as an anonymous arm, so no outcome told a worker which document was outstanding and for whom; the count now sums this item."
tests:
  - {id: CO-1665-T1, month: "2026-10", as_of: "2026-10-01", given: {af_verification_is_applicable: true, earned_income_verification_document_received: false, earnings: [{kind: wages, amount: 900}]}, expect: true}
  - {id: CO-1665-T2, month: "2026-10", as_of: "2026-10-01", given: {af_verification_is_applicable: true, self_employment_income_verified_by_electronic_data_source: false, earned_income_verification_document_received: true, earned_income_attestation_is_questionable: true, earnings: [{kind: self_employment_receipts, amount: 400, net_for_tax: 400}]}, expect: true}
  - {id: CO-1665-T3, month: "2026-10", as_of: "2026-10-01", given: {af_verification_is_applicable: true, self_employment_income_verified_by_electronic_data_source: false, earned_income_verification_document_received: true, earned_income_attestation_is_questionable: false, earnings: [{kind: self_employment_receipts, amount: 400, net_for_tax: 400}]}, expect: false}
