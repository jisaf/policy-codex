  - {id: "CO-5342-T2", month: "2026-10", title: "F-8: $5,000 of land the county exempts as unsaleable at two-thirds of value (3.520.741.D.3): 0", as_of: "2026-10-01", given: {holdings: [{kind: real_property, value: 5000, amount_owed: 0, af_found_unsaleable: true}]}, expect: 0}
  - {id: "CO-5342-T3", month: "2026-10", title: "A $40,000 rental (income-producing, CO-4422) and a $30,000 shop used in the client's business (D.1): neither here, 0", as_of: "2026-10-01", given: {holdings: [{kind: real_property, value: 40000, amount_owed: 0, income_producing: true, used_in_trade_or_business: false, net_annual_return: 3000}, {kind: real_property, value: 30000, amount_owed: 0, income_producing: true, used_in_trade_or_business: true}]}, expect: 0}
  - {id: "CO-5342-T4", month: "2026-10", title: "Land the county has not found to produce income or support the client (3.520.72.A, 77.D): its $5,000 of equity counts", as_of: "2026-10-01", given: {holdings: [{kind: real_property, value: 5000, amount_owed: 0}]}, expect: 5000}
  - {id: "CO-5342-T5", month: "2026-10", title: "A $3,000 lot owing $4,500 (equity floored at 0) and a $2,000 lot: 0 + 2,000 = 2,000", as_of: "2026-10-01", given: {holdings: [{kind: real_property, value: 3000, amount_owed: 4500, income_producing: false, produces_for_household_use: false}, {kind: real_property, value: 2000, amount_owed: 0, income_producing: false, produces_for_household_use: false}]}, expect: 2000}
