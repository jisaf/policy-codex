id: CO-5342
name: "Adult Financial: countable real property"
identifier: af_countable_real_property
kind: derived
type: money
scope: person-month
program: AdultFinancial
meaning: "The equity of the person's real property other than the home that Adult Financial counts in full (9 CCR 2503-5 3.520.72.B.1, 3.520.741.B-C): each real_property record (row counted_less_self_support_and_unsaleable) at its value less what is owed on it (\"the actual value less encumbrances\"), times the person's share (741.C.2: \"charged in proportion to the client, client's spouse, or sponsor(s)'s share of ownership\"), leaving out property the county exempts because it cannot be sold for two-thirds of its value despite continuing efforts, its sale would cause a co-owner undue hardship, or legal reasons prevent its sale (af_found_unsaleable; 3.520.741.D), property used to produce income or goods for the household, which the self-support rules count (3.520.77.D; af_self_support_property_countable_value, CO-4422)."
precision: "Resource records, step H1 Adult Financial (docs/reviews/records-holdings-snap-af.md): the self-support exemptions are the county's to establish: 3.520.77.D (S3206) exempts property \"essential to the self-support of the client\" and directs that \"To determine whether property is producing income or being used in a trade or business, the county department shall obtain a copy of the most recent tax returns\", and 3.520.72.A (S1636) counts a resource \"Unless otherwise specified\"; so a parcel whose record does not say it produces income (income_producing), is used in a trade or business (used_in_trade_or_business) or produces goods for the household (produces_for_household_use) is counted, the rule's own reading (design decision D3), as before step H1, when such property was stated apart from real_property_other_than_home_equity. Property used in the person's trade or business is self-support property and not counted (3.520.77.D.1). The county's finding that the property is unsaleable not stated is read as no: 3.520.741.D.3 exempts the property only once the county finds it cannot be sold for two-thirds of its value (the person fact it replaces, af_property_exempt_as_unsaleable_value, was read as 0 when not stated). Each parcel's equity is floored at 0, so a parcel owing more than it is worth does not lower another's. Installment contracts and the notes and mortgages the person holds are cash and convertible assets (3.520.72.B.6; CO-5340). (A request to the integration owner: these defaults belong on the fields, per program, docs/reviews/records-holdings-snap-af.md.) Coverage pass 4 CA4-13 (docs/reviews/coverage4-cash.md): a figure of the month evaluated, from the holdings valued in that month (3.510 \"Resources\", S4791: \"held as of the first day of a calendar month or as of the date of application\"), so an application month before the determination month is judged by its own holdings; before, every month read the determination month's."
derived: [sum_receipts, holdings, [all, [all, [received_in, [month]], [unknown, [receipt, disposed_date]]], ["=", [lookup, af_holding_treatment_table, [receipt, kind]], counted_less_self_support_and_unsaleable], [not, [otherwise, [receipt, af_found_unsaleable], false]], [not, [otherwise, [receipt, income_producing], false]], [not, [otherwise, [receipt, produces_for_household_use], false]]], ["*", [max, 0, ["-", [receipt, value], [receipt, amount_owed]]], [otherwise, [receipt, share], 1]]]
sources: [S1636, S2213, S3206, S3207, S3209, S4693, S4791]
implemented: engine
tags: [cash, resources]
rationale: "Resource records, step H1 Adult Financial (docs/reviews/records-holdings-snap-af.md): Adult Financial reads the person's resources from the holdings records (holdings, CO-5300) through its counting table (af_holding_treatment_table, CO-5302), for the client, the spouse and each sponsor alike (3.520.72.A, E), never from the scalar resource facts. The real property part of af_person_countable_resources_other_than_life_insurance (CO-4000)."
tests:
  # Hand-computed from 9 CCR 2503-5 3.520.741.B-D (S4693, S3209) and 3.520.77.D (S3206, S3207).
