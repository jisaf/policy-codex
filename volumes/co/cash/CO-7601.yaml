id: CO-7601
name: "Adult Financial: the day a month's dated circumstances are read on"
identifier: af_month_reading_date
kind: derived
type: calendar date
scope: person-month
program: AdultFinancial
meaning: "The day on which an Adult Financial circumstance that changes on a stated date (the days a client has been out of the State or the country) is read for the month evaluated: for a month before the determination month, the month's last day, so the month is judged on the absence as it stood in that month; for the determination month and any later month, the determination date, the day the case's facts are stated as of. Each month is judged on its own circumstances: eligibility begins on the date of application or the date the client meets all eligibility requirements, whichever is later (9 CCR 2503-5 3.542.B), and the first month's grant is prorated from that date (3.532.B.2); which day of an earlier month is read is OQ-1435."
precision: "Pattern sweep (cash) PS-T9 (docs/reviews/pattern-sweep-cash.md): af_is_presumed_nonresident_by_absence (CO-4401) counted an absence to the determination date in every month, so a client who left Colorado on August 1, applied on September 10 and was determined on November 5 was presumed a non-resident for September (96 days at the determination), though on September 30 she had been away sixty days, under 3.520.64.E.2's ninety. The determination month keeps the determination date, so no answer for it or a later month changes."
derived: [case, [["<", [month], [det_month]], [days_after, -1, [first_day, [month_after, [month]]]]], [else, [det_date]]]
sources: [S4794, S1635, S3201]
open: [OQ-1435]
implemented: engine
tags: [cash, oap, and]
rationale: "Pattern sweep (cash), PS-T9: the Adult Financial absence reader measured to the determination date in every month; Colorado Works has its own item (CO-7600), the programs being independent."
tests:
  - {id: "CO-7601-T1", title: "September, before the determination month (November 5): September 30", as_of: "2026-11-05", month: "2026-09", given: {}, expect: "2026-09-30"}
  - {id: "CO-7601-T2", title: "The determination month: the determination date", as_of: "2026-11-05", month: "2026-11", given: {}, expect: "2026-11-05"}
