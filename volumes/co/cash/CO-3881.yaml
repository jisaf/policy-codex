id: CO-3881
name: "Colorado Works: members whose income is verified for the unit"
identifier: cw_income_verification_members
kind: derived
type: group of persons
scope: person-month
program: ColoradoWorks
meaning: "The persons whose income is used to determine this person's Colorado Works eligibility and payment, whose income 9 CCR 2503-6 3.604.3.B.2.e requires verified: the members of the budgetary unit (cw_budgetary_unit_members: the assistance unit and the spouse of a parent or caretaker in it) and the parents of an unmarried minor parent in the unit, whose income is deemed to the unit (3.605.1.A.4)."
precision: "The minor parent's parents are read as cw_deemed_parent_income_of_minor_parent (CO-909) reads them. A sponsor outside the case is verified through the sponsor element (cw_sponsor_verification_is_pending, CO-1654). Coverage pass 6 CA6-4: per month, the minor parent's age on the month's first day and her dependent child of the month, as cw_deemed_parent_income_of_minor_parent (CO-909) reads them."
derived: ["filter", ["persons"], ["any", ["in_group", ["P"], "cw_budgetary_unit_members"], ["has_relative_in", ["parent"], ["filter", "cw_assistance_unit_members", ["all", ["<", ["years_between", ["of", ["P"], "date_of_birth"], ["first_day", ["month"]]], "cw_minor_parent_age_limit"], ["of", ["P"], "cw_has_dependent_child_in_month"], ["=", ["of", ["P"], "marital_status"], "single"]]]]]]
sources: [S872, S1808]
implemented: engine
tags: [cash, verification, household]
rationale: "Final cash review FC-12 and final verification review V-2 (and V-9): 3.604.3.B.2.e (S872) requires verification of the income \"of any member of the assistance unit or other household member whose income is used to determine eligibility and payment\"; cw_pending_verification_count (CO-1425) summed the assistance unit only."
tests:
  - {id: CO-3881-T1, month: "2026-10", title: "Mother, child and stepfather: all three", as_of: "2026-10-01", given: {cw_assistance_unit_members: [p1, p2], cw_budgetary_unit_members: [p1, p2, p3], date_of_birth: "1990-01-01"}, others: {p2: {date_of_birth: "2018-01-01"}, p3: {date_of_birth: "1988-01-01"}}, relationships: [[parent, p1, p2], [spouse, p1, p3]], expect: [p1, p2, p3]}
  - {id: "CO-3881-T2", month: "2026-10", title: "A 16-year-old mother and her baby, living with her own mother: the grandmother is added", as_of: "2026-10-01", given: {cw_assistance_unit_members: [p1, p2], cw_budgetary_unit_members: [p1, p2], date_of_birth: "2010-01-01", cw_has_dependent_child: true, marital_status: single, temporary_absence_reason: none}, others: {p2: {date_of_birth: "2026-03-01", cw_has_dependent_child: false, temporary_absence_reason: none}, p3: {date_of_birth: "1985-01-01"}}, relationships: [[parent, p1, p2], [parent, p3, p1]], expect: [p1, p2, p3]}
