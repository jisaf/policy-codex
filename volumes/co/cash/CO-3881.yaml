  - {id: "CO-3881-T4", title: "Probe W9: October: the unit alone", month: "2026-10", as_of: "2026-10-15", given: {cw_budgetary_unit_members: [p1, p2], cw_assistance_unit_members: [p1, p2], date_of_birth: "2008-09-20", cw_has_dependent_child_in_month: true, marital_status: single}, others: {p2: {date_of_birth: "2026-03-01", cw_has_dependent_child_in_month: false, marital_status: single}, p3: {}}, relationships: [[parent, p3, p1], [parent, p1, p2]], expect: [p1, p2]}
