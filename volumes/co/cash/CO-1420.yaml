id: CO-1420
name: "Colorado Works: requires verification of lawful presence"
identifier: cw_requires_verification_of_lawful_presence
kind: derived
type: yes/no
scope: person-month
program: ColoradoWorks
meaning: "Whether the person must establish lawful presence by producing a listed document for Colorado Works: every client eighteen or older, except a pregnant woman and an eighteen-year-old who continues to be eligible for Medical Assistance."
precision: "3.604.3.I.4.b.6 exempts persons \"over the age of eighteen ... and under the age of nineteen\"; the item reads that as age eighteen (cw_lawful_presence_min_age). \"Continue to be eligible for medical assistance programs after their eighteenth birthday\" speaks of coverage that continues past the birthday, so it is read from the Medical Assistance enrollment record (is_enrolled_in_medical_assistance, CO-2435), not from this volume's own MAGI or SSI-related determination: the Colorado Works worker sees the enrollment, and a child held eligible by a continuous eligibility period is enrolled."
derived: [all, [">=", age, cw_lawful_presence_min_age], [not, is_pregnant], [not, [all, ["=", age, cw_lawful_presence_min_age], is_enrolled_in_medical_assistance]]]
sources: [S872, S877, S1065]
implemented: engine
tags: [verification, cash, tanf, immigration]
rationale: "No existing item states this Colorado Works verification requirement; the phase-9 chapter needs it to count the unit's pending verifications. Vocabulary fix round (governance read.cross_program): accepts_from lists the other programs' items this rule reads on purpose. The Colorado Works rule names the other program's result (Medicaid receipt for the lawful-presence verification exemption; the Adult Financial burial computation for the death reimbursement). Heavier-definitions audit H-4 (audit fix round): reads the enrollment record in place of ma_magi_is_fully_eligible and ma_is_ssi_related_eligible, so the Colorado Works answer no longer needs the MAGI household and income facts."
tests:
