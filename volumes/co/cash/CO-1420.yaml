  - {id: CO-1420-T5, month: "2026-10", as_of: "2026-10-01", given: {date_of_birth: "2008-03-01", is_pregnant: false, is_enrolled_in_medical_assistance: false}, expect: true}
  # Pattern sweep (cash) PS-T5: 3.604.3.I.4.b (S877) reaches clients 18 or older; the age and the pregnancy are taken in the month evaluated (first day, OQ-951; cw_is_pregnant_in_month, CO-7301), not on the determination date. Born 2008-10-20, determined 2026-10-25: 17 on October 1, so no lawful presence document is required for October; 18 on November 1.
