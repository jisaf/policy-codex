id: CO-1420
name: "Colorado Works: requires verification of lawful presence"
identifier: cw_requires_verification_of_lawful_presence
kind: derived
type: yes/no
scope: person-month
program: ColoradoWorks
meaning: "Whether the person must establish lawful presence by producing a listed document for Colorado Works: every client eighteen or older, except a pregnant woman and an eighteen-year-old who continues to be eligible for Medical Assistance."
precision: 3.604.3.I.4.b.6 exempts persons "over the age of eighteen ... and under the age of nineteen"; the item reads that as age eighteen (cw_lawful_presence_min_age). Continued Medical Assistance eligibility is read from the MAGI full-coverage and SSI-related eligibility items.
derived: [all, [">=", age, cw_lawful_presence_min_age], [not, is_pregnant], [not, [all, ["=", age, cw_lawful_presence_min_age], [any, ma_magi_is_fully_eligible, ma_is_ssi_related_eligible]]]]
sources: [S872, S877, S1065]
implemented: engine
tags: [verification, cash, tanf, immigration]
rationale: No existing item states this Colorado Works verification requirement; the phase-9 chapter needs it to count the unit's pending verifications.
tests:
  - {id: CO-1420-T1, month: "2026-10", as_of: "2026-10-01", given: {date_of_birth: "1990-01-01", is_pregnant: false}, expect: true}
  - {id: CO-1420-T2, month: "2026-10", as_of: "2026-10-01", given: {date_of_birth: "1990-01-01", is_pregnant: true}, expect: false}
  - {id: CO-1420-T3, month: "2026-10", as_of: "2026-10-01", given: {date_of_birth: "2015-01-01"}, expect: false}
  - {id: CO-1420-T4, month: "2026-10", as_of: "2026-10-01", given: {date_of_birth: "2008-03-01", is_pregnant: false, ma_magi_is_fully_eligible: true}, expect: false}
  - {id: CO-1420-T5, month: "2026-10", as_of: "2026-10-01", given: {date_of_birth: "2008-03-01", is_pregnant: false, ma_magi_is_fully_eligible: false, ma_is_ssi_related_eligible: false}, expect: true}
