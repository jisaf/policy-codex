id: CO-2352
name: "Colorado Works: budgetary unit members"
identifier: cw_budgetary_unit_members
kind: derived
type: group of persons
scope: person
program: ColoradoWorks
meaning: "The persons in this person's Colorado Works budgetary unit who live in the home: every member of the assistance unit (an optional member who requested assistance included), and the spouse of a parent or non-parent caretaker in the assistance unit whether or not the spouse requested assistance, unless the spouse receives SSI or a Title IV payment (9 CCR 2503-6 3.604.2.D)."
precision: "The other members of D.1 enter the income test by their own items: the non-recipient parents of a minor parent (D.1.d) through cw_deemed_parent_income_of_minor_parent (CO-909), and the sponsor of a non-citizen (D.1.e) through cw_sponsor_deemed_income (CO-2365), since the sponsor does not live in the home. The unborn child of a pregnant parent (D.1.c) has no income, and the standards of 3.606.1.F count the assistance unit (\"based upon those included in the assistance unit\"); the pregnancy allowance carries the pregnancy (3.606.1.G)."
derived: [filter, [persons], [any, [in_group, [P], cw_assistance_unit_members], [all, [has_relative_in, [spouse], [filter, cw_assistance_unit_members, [of, [P], cw_has_dependent_child]]], [not, [of, [P], receives_ssi]], [not, [of, [P], cw_receives_title_iv_foster_adoption_kinship_payment]]]]]
sources: [S1626]
implemented: engine
tags: [cash, tanf, household]
rationale: "OQ-140: 3.606.1.J (S528) tests the income of the budgetary unit; no item named it, so the spouse of a requesting caretaker who did not ask to be in the assistance unit was outside every income count."
