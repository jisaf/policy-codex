id: CO-3343
name: "Adult Financial: inmate of a correctional institution"
identifier: af_is_inmate_of_correctional_institution
kind: derived
type: yes/no
scope: person-month
program: AdultFinancial
meaning: "Whether, this month, the person is an inmate of a city, municipal, county, State or Federal correctional institution, whom 9 CCR 2503-5 3.520.61.B makes ineligible for Adult Financial programs: a correctional or holding facility operated by a governmental unit."
precision: "Read from the neutral setting facts (CO-3330, CO-3331). Narrower than Medicaid's inmate of a public institution (CO-1105): 3.520.61.B names correctional institutions only."
derived: [all, ["=", residence_setting_type, correctional_facility], residence_setting_operated_by_government]
sources: [S449]
implemented: engine
tags: [cash]
rationale: "Same-word audit SW-20 and SW-21, dual-entry audit 2.10 and 3.20: where a person lives was stated by thirteen facts, each one program's classification (SNAP's meals institution, Medicaid's medical institution and IMD, the OAP Health Care exclusion, Adult Financial's three facility lists, LEAP's living arrangements, the inmate fact), which could contradict one another. One neutral description of the setting, in the terms of 42 CFR 435.1010 (S2201, S2202), is stated once; each program's test is a derived item. Same-word SW-21: Adult Financial read the Medicaid and CHP+ inmate fact for its own, narrower bar."
tests:
  - {id: CO-3343-T1, month: "2026-10", as_of: "2026-10-01", given: {residence_setting_type: correctional_facility, residence_setting_operated_by_government: true}, expect: true}
  - {id: CO-3343-T2, month: "2026-10", as_of: "2026-10-01", given: {residence_setting_type: other_institution}, expect: false}
