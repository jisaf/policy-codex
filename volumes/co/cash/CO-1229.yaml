id: CO-1229
name: "Burial assistance: legally responsible person's resources over the SSI limit"
identifier: af_burial_responsible_person_excess_resources
kind: derived
type: money
scope: person
program: AdultFinancial
meaning: "The amount by which the legally responsible person(s)' resources exceed the SSI resource limit (ssi_resource_limit_couple for a couple, ssi_resource_limit_individual otherwise, a widow or widower included), which is applied third against the full burial costs; zero at or below the limit, per 9 CCR 2503-5 3.570.43.D.3.b-c, which names the SSI limit."
derived: [max, 0, ["-", af_burial_responsible_person_resources, [case, [af_burial_responsible_persons_are_couple, ssi_resource_limit_couple], [else, ssi_resource_limit_individual]]]]
sources: [S721]
implemented: engine
tags: [cash, resources]
rationale: No existing item computes this; af_burial_unmet_cost (CO-1230) needs it. Reuses the SSI resource limits (CO-233, CO-234), which 3.570.43.D.3.b incorporates by reference to 20 CFR 416.1205.
tests:
  - {id: CO-1229-T1, as_of: "2026-10-01", given: {af_burial_responsible_person_resources: 1500, af_burial_responsible_persons_are_couple: false}, expect: 0}
  - {id: CO-1229-T2, as_of: "2026-10-01", given: {af_burial_responsible_person_resources: 2600, af_burial_responsible_persons_are_couple: false}, expect: 600}
  - {id: CO-1229-T3, as_of: "2026-10-01", given: {af_burial_responsible_person_resources: 2600, af_burial_responsible_persons_are_couple: true}, expect: 0}
