  - {id: CO-2604-T2, month: "2026-10", as_of: "2026-10-01", given: {receives_ssi: false}, expect: false}
  - {id: CO-2604-T3, month: "2026-10", as_of: "2026-10-01", given: {receives_ssi: true, receipts: [{kind: social_security}, {kind: pension}, {kind: unemployment_compensation}, {kind: child_support}, {kind: colorado_works_cash}, {kind: adult_financial_cash}, {kind: tax_exempt_interest}, {kind: other_taxable}, {kind: other_nontaxable}]}, title: "SSI recipient with no SSI paid this month", expect: false}
  - {id: CO-2604-T4, month: "2026-10", as_of: "2026-10-01", given: {receives_ssi: true, receipts: [{kind: social_security}, {kind: pension}, {kind: unemployment_compensation}, {kind: child_support}, {kind: colorado_works_cash}, {kind: adult_financial_cash}, {kind: tax_exempt_interest}, {kind: other_taxable}, {kind: other_nontaxable}]}, title: "T-9: af_ssi_receipts equal to 0 (af_ssi_receipts over 0)", expect: false}
