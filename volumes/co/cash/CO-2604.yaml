  - {id: "CO-2604-T10", title: "Pattern sweep PS-T12: September, no SSI received: not an SSI month", as_of: "2026-10-20", month: "2026-09", given: {receives_ssi: true, receipts: [{kind: ssi, amount: 500, month: "2026-10"}]}, expect: false}
  - {id: "CO-2604-T11", title: "PS-T12: October, $500 of SSI received: an SSI month", as_of: "2026-10-20", month: "2026-10", given: {receives_ssi: true, receipts: [{kind: ssi, amount: 500, month: "2026-10"}]}, expect: true}
  - {id: "CO-2604-T12", title: "A stream of SSI (no month): every month", as_of: "2026-10-20", month: "2026-09", given: {receives_ssi: true, receipts: [{kind: ssi, amount: 500}]}, expect: true}
  - {id: "CO-2604-T13", title: "Not an SSI recipient", as_of: "2026-10-20", month: "2026-10", given: {receives_ssi: false, receipts: []}, expect: false}
