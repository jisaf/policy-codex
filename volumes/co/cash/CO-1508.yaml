id: CO-1508
name: "Colorado Works: death reimbursement amount"
identifier: cw_death_reimbursement_amount
kind: derived
type: money
scope: person
program: ColoradoWorks
role: outcome
meaning: "The Colorado Works death reimbursement benefit for a deceased client - for a client who received Colorado Works while alive, when the total combined charges for the disposition (a prepaid plot of $2,000 or less, or a donated one, not counted) are at most cw_death_reimbursement_cost_limit - the lesser of the cw_death_reimbursement_max maximum and the charges the decedent's estate leaves unpaid, reduced by the insurance proceeds and by the legally responsible persons' resources over the SSI limit, never below zero; zero otherwise. Per 9 CCR 2503-6 3.606.7.A.2, B, E and F.1-2."
precision: "Insurance proceeds (F.2.f, 'used to reduce the maximum Death Reimbursement') and the responsible persons' resources over the SSI limit (F.2.c, 'used to reduce the State Department funded Death Reimbursement payment') reduce the payment; the estate (B.2, F.2.b) reduces the charges the payment can cover. The Adult Financial burial benefit applies all three against the full costs (3.570.43.D); the two orders give different amounts when the charges are well under cw_death_reimbursement_max or the offsets are large (OQ-354). The responsible persons' excess resources are read from af_burial_responsible_person_excess_resources (CO-1229), the same SSI-limit computation 3.606.7.F.2.c states, cross-program rather than duplicated. Voluntary contributions from the responsible party (F.2.c) reduce the payment too (burial_contributions_from_responsible_persons, CO-4373, read as 0 when not stated; coverage review CW-19); contributions from non-responsible parties do not reduce the benefit (F.2.g). A Social Security lump-sum death benefit is not counted (F.2.e), as af_burial_responsible_person_resources (CO-1225) already states. Coverage pass 6 CA6-7: what responsible persons contribute is required where read (a deceased client whose costs are within the limit; decision 4 of 2026-11-23); before, read as 0 when not stated."
derived: ["case", [["all", "cw_is_deceased_client", ["<=", ["-", "burial_services_total_cost", "burial_plot_cost_excluded_from_limit"], "cw_death_reimbursement_cost_limit"]], ["max", 0, ["-", ["-", ["min", "cw_death_reimbursement_max", ["-", "burial_services_total_cost", "decedent_estate_value"]], "burial_insurance_proceeds"], ["+", "af_burial_responsible_person_excess_resources", "burial_contributions_from_responsible_persons"]]]], ["else", 0]]
sources: [S1005, S1006, S1007]
open: [OQ-354]
implemented: engine
tags: [cash, tanf]
accepts_from:
  - {from: af_burial_responsible_person_excess_resources, class: adopted_method, source: S1007}
  - {from: burial_insurance_proceeds, class: primitive, source: S1005}
  - {from: burial_plot_cost_excluded_from_limit, class: primitive, source: S1005}
  - {from: burial_services_total_cost, class: primitive, source: S1005}
  - {from: decedent_estate_value, class: primitive, source: S1005}
rationale: "No existing item computes the Colorado Works death reimbursement (phase-8 review K-1): phase 8 built the Adult Financial burial benefit (CO-1229-CO-1232) and left 3.606.7 out. Reuses the burial cost, plot, insurance, estate and responsible-person facts (CO-1221-CO-1226) - the same quantities 3.606.7 names - and the Adult Financial excess-resource computation (CO-1229). The review said 3.606.7 has no plot exception; F.2.d (S1007) does exempt a prepaid plot of $2,000 or less and a donated one, so the plot is not counted toward the total, as for Adult Financial burial. Vocabulary fix round (governance read.cross_program): accepts_from lists the other programs' items this rule reads on purpose. The Colorado Works rule names the other program's result (Medicaid receipt for the lawful-presence verification exemption; the Adult Financial burial computation for the death reimbursement)."
nearest: [CO-1232]
