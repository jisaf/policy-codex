id: CO-2353
name: "Colorado Works: deemed income of a budgetary-unit member outside the assistance unit"
identifier: cw_budgetary_member_deemed_income
kind: derived
type: money
scope: person-month
program: ColoradoWorks
meaning: "The income of this person, a budgetary-unit member outside the assistance unit, counted toward the unit: for a stepparent (the spouse of a parent of a dependent child in the home), the 3.605.1.A.4.a countable income - gross earned income less the $90 employment disregard, plus unearned income, less court-ordered support paid outside the unit and payments to tax dependents outside the home, less the needs of the stepparent and of the stepparent's children in the home who are outside the assistance unit (the One Caretaker need standard for that number of children), never below zero; for the spouse of a non-parent caretaker, whom A.4.a does not name, the earned income after the disregard plus unearned income of 3.606.1.J."
precision: "The needs deduction mirrors cw_minor_parent_deeming_needs_deduction (CO-2000): \"needs\" read as the need standard (OQ-102). The stepparent's children who are in the assistance unit are not counted, since the unit's own standard meets their needs."
derived: [case, [[exists_related, [spouse], [of, [P], cw_is_parent_of_dependent_child]], [max, 0, ["-", ["-", ["+", [max, 0, ["-", cw_gross_earned_income, cw_earned_income_disregard_dollar]], cw_countable_unearned_income], ["+", child_support_paid_legally_obligated, [otherwise, cw_support_paid_to_tax_dependents_outside_home, 0]]], [lookup, cw_need_standard_table, [count, [filter, [persons], [all, [rel, [parent], [P]], [of, [P], cw_is_excluded_from_assistance_unit]]]]]]]], [else, ["+", cw_countable_earned_income, cw_countable_unearned_income]]]
sources: [S1307, S528, S1626]
implemented: engine
tags: [cash, tanf, income]
rationale: "OQ-140: the budgetary unit's income (3.606.1.J, S528) includes the spouse of a requesting caretaker (3.604.2.D.1.b, S1626); A.4.a (S1307) states how a stepparent's income is made available to the stepchildren. No item computed either."
tests:
  - {id: CO-2353-T1, title: "A stepfather earning $1,500 - 1,500 - 90 - 253 = $1,157 deemed", as_of: "2026-10-01", month: "2026-10", given: {cw_gross_earned_income: 1500, cw_countable_unearned_income: 0, child_support_paid_legally_obligated: 0}, others: {p2: {}, p3: {date_of_birth: "2018-01-01", is_full_time_secondary_student_finishing_before_nineteen: false}}, relationships: [[spouse, p1, p2], [parent, p2, p3], [stepparent, p1, p3]], expect: 1157}
  - {id: CO-2353-T2, title: "Court-ordered support of $400 and $100 to a tax dependent outside the home are deducted", as_of: "2026-10-01", month: "2026-10", given: {cw_gross_earned_income: 1500, cw_countable_unearned_income: 0, child_support_paid_legally_obligated: 400, cw_support_paid_to_tax_dependents_outside_home: 100}, others: {p2: {}, p3: {date_of_birth: "2018-01-01", is_full_time_secondary_student_finishing_before_nineteen: false}}, relationships: [[spouse, p1, p2], [parent, p2, p3]], expect: 657}
  - {id: CO-2353-T3, title: "The spouse of a non-parent caretaker - J's disregarded earnings plus unearned income", as_of: "2026-10-01", month: "2026-10", given: {cw_countable_earned_income: 910, cw_countable_unearned_income: 200}, others: {p2: {}, p3: {date_of_birth: "2018-01-01", is_full_time_secondary_student_finishing_before_nineteen: false}}, relationships: [[spouse, p1, p2], [has_primary_responsibility_for, p2, p3]], expect: 1110}
