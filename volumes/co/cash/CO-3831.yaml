id: CO-3831
name: "Adult Financial: unearned income other than SSI"
identifier: af_unearned_income_other_than_ssi
kind: derived
type: money
scope: person-month
program: AdultFinancial
meaning: "This person's gross unearned income for the month other than SSI, from which 9 CCR 2503-5 3.533.A.2.c, 3.544.B.2 and 3.549.A.2.c deduct the $20 disregard: Social Security, pensions, unemployment, Colorado Works grants, child support, other unearned income and tax-exempt interest; for an OAP or AND-CS client, the in-kind support and maintenance the county determines, up to the ISM maximum (3.520.79); and income the client refused or failed without good cause to secure, counted as if available (3.520.71.G.1, af_refused_potential_income); less the unearned income 3.520.786 exempts (af_excluded_unearned_income), never below zero."
precision: "The Adult Financial grant itself is not income (convention rule 6). Coverage review F-12: prizes (3.520.785.B.13, S3212) include lottery and gambling winnings, which have their own fact outside the unearned income facts (lottery_gambling_winnings_received, CO-1181), counted in the month received and read as 0 when not stated; an inheritance or other lump sum is already part of other_unearned_income_taxable or _nontaxable (lump_sum_received, CO-3367, is part of them, not added). F-11: workers' compensation, insurance and lawsuit proceeds, G.I. Bill benefits and rental income count only beyond their expenses (3.520.785.B.9, B.14-16, B.20), the expenses being unearned_income_offsetting_expenses (CO-4444), read as 0 when not stated. P2-6: the minimum monthly maintenance needs allowance a community-spouse client retains from an institutionalized spouse's income (3.520.785.B.24) is money the client receives from the spouse, stated with the client's other_unearned_income_nontaxable, and counted here. The program for the ISM term is read as af_countable_income reads it: OAP when af_is_oap_age, AND-CS when af_and_cs_eligible (neither reads this item). af_refused_potential_income is read as 0 when not stated."
derived: [max, 0, ["-", ["-", ["+", social_security_income, pension_income, unemployment_income, tanf_cash_income, child_support_received, other_unearned_income_taxable, other_unearned_income_nontaxable, tax_exempt_interest, [otherwise, lottery_gambling_winnings_received, 0], [case, [[any, af_is_oap_age, af_and_cs_eligible], [min, af_in_kind_support_and_maintenance, af_ism_maximum]], [else, 0]], [otherwise, af_refused_potential_income, 0]], [otherwise, af_excluded_unearned_income, 0]], [otherwise, unearned_income_offsetting_expenses, 0]]]
sources: [S1622, S1002, S1012, S2610, S2623, S3212]
implemented: engine
tags: [cash, oap, and, income]
rationale: "Final cash review FC-4, FC-5 and FC-9: af_countable_income (CO-946) computed this figure inline, twice; the split $20 (CO-3832), the rollover (CO-3833) and the spouse's share in deeming (CO-2384) now read it, so it is stated once. The derivation is CO-946's former unearned-income term, with the income counted as available under 3.520.71.G.1 (S2623) added."
