id: CO-3831
name: "Adult Financial: unearned income other than SSI"
identifier: af_unearned_income_other_than_ssi
kind: derived
type: money
scope: person-month
program: AdultFinancial
meaning: "This person's gross unearned income for the month other than SSI, from which 9 CCR 2503-5 3.533.A.2.c, 3.544.B.2 and 3.549.A.2.c deduct the $20 disregard: Social Security, pensions, unemployment, Colorado Works grants, child support, other unearned income and tax-exempt interest; for an OAP or AND-CS client, the in-kind support and maintenance the county determines, up to the ISM maximum (3.520.79); and income the client refused or failed without good cause to secure, counted as if available (3.520.71.G.1, af_refused_potential_income); less the unearned income 3.520.786 exempts (af_excluded_unearned_income), never below zero."
precision: "The Adult Financial grant itself is not income (convention rule 6). The program for the ISM term is read as af_countable_income reads it: OAP when af_is_oap_age, AND-CS when af_and_cs_eligible (neither reads this item). af_refused_potential_income is read as 0 when not stated."
derived: [max, 0, ["-", [+, social_security_income, pension_income, unemployment_income, tanf_cash_income, child_support_received, other_unearned_income_taxable, other_unearned_income_nontaxable, tax_exempt_interest, [case, [[any, af_is_oap_age, af_and_cs_eligible], [min, af_in_kind_support_and_maintenance, af_ism_maximum]], [else, 0]], [otherwise, af_refused_potential_income, 0]], [otherwise, af_excluded_unearned_income, 0]]]
sources: [S1622, S1002, S1012, S2610, S2623]
implemented: engine
tags: [cash, oap, and, income]
rationale: "Final cash review FC-4, FC-5 and FC-9: af_countable_income (CO-946) computed this figure inline, twice; the split $20 (CO-3832), the rollover (CO-3833) and the spouse's share in deeming (CO-2384) now read it, so it is stated once. The derivation is CO-946's former unearned-income term, with the income counted as available under 3.520.71.G.1 (S2623) added."
tests:
  - {id: CO-3831-T1, title: "$500 of Social Security", as_of: "2026-10-01", month: "2026-10", given: {social_security_income: 500, pension_income: 0, unemployment_income: 0, tanf_cash_income: 0, child_support_received: 0, other_unearned_income_taxable: 0, other_unearned_income_nontaxable: 0, tax_exempt_interest: 0, af_is_oap_age: true, af_in_kind_support_and_maintenance: 0}, expect: 500}
  - {id: CO-3831-T2, title: "FC-9: $300 of Social Security and a $400 pension the client refused to claim (3.520.71.G.1)", as_of: "2026-10-01", month: "2026-10", given: {social_security_income: 300, pension_income: 0, unemployment_income: 0, tanf_cash_income: 0, child_support_received: 0, other_unearned_income_taxable: 0, other_unearned_income_nontaxable: 0, tax_exempt_interest: 0, af_is_oap_age: true, af_in_kind_support_and_maintenance: 0, af_refused_potential_income: 400}, expect: 700}
