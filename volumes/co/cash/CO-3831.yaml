  - {id: "CO-3831-T3", month: "2026-10", as_of: "2026-10-01", given: {af_is_oap_age: true, af_in_kind_support_and_maintenance: 0, earnings: [], receipts: [{kind: social_security, amount: 600}, {kind: ssi}, {kind: adult_financial_cash}, {kind: rental_income, amount: 800}], rental_property_expenses_paid: 500}, title: "F-11 (probe PR-RENT): $600 of Social Security and $800 of rent with $500 of allowable expenses: 600 + 300 = 900 (3.520.785.B.20; af_rental_expenses_deducted)", expect: 900}
