id: CO-3831
name: "Adult Financial: unearned income other than SSI"
identifier: af_unearned_income_other_than_ssi
kind: derived
type: money
scope: person-month
program: AdultFinancial
meaning: "This person's gross unearned income for the month other than SSI, from which 9 CCR 2503-5 3.533.A.2.c, 3.544.B.2 and 3.549.A.2.c deduct the $20 disregard: the counted unearned receipts (af_counted_unearned_receipts, through the counting table af_receipt_treatment_table, 3.520.785-786) less the exclusions that turn on the person (one-third of child support for an SSI-age child, K (c)(11); infrequent or irregular income within the quarterly limit, O; life-threatening-condition gifts to a child, K (c)(21)); for an OAP or AND-CS client, the in-kind support and maintenance the county determines, up to the ISM maximum (3.520.79); and income the client refused or failed without good cause to secure, counted as if available (3.520.71.G.1, af_refused_potential_income), never below zero. The expenses of producing workers' compensation, insurance, school-attendance and rental receipts (B.9, B.14-16, B.20) are left out of the counted receipts themselves (af_counted_unearned_receipts)."
precision: "Receipt records, migration phase 1 (docs/reviews/receipts-migration-1.md): read from the receipts (CO-5000), replacing the sum of the unearned income facts less af_excluded_unearned_income (CO-2343). The Adult Financial grant itself is not income (its row is not_income_to_client). Coverage review F-12: prizes (3.520.785.B.13) and an inheritance or other one-time receipt are counted in the month received; before receipt records an inheritance stated only as lump_sum_received, without raising the other unearned income fact it was part of, was not counted (probe PR-LUMP). F-11: the expenses were unearned_income_offsetting_expenses (CO-4444), read as 0 when not stated, until coverage pass 4 CA4-1 read them from the receipts' own fields and the person's rental and school expenses in af_counted_unearned_receipts (CO-5017), so the same money is never stated twice and nothing is subtracted from income the expense is not tied to. P2-6: the minimum monthly maintenance needs allowance a community-spouse client retains from an institutionalized spouse's income (3.520.785.B.24) is a receipt of the client's (other_nontaxable), counted here. The program for the ISM term is read as af_countable_income reads it: OAP when af_is_oap_age, AND-CS when af_and_cs_eligible. af_refused_potential_income is read as 0 when not stated."
derived: [max, 0, ["+", ["-", af_counted_unearned_receipts, ["+", af_child_support_exclusion, af_excluded_infrequent_income, af_excluded_life_threatening_condition_gifts]], [case, [[any, af_is_oap_age, af_and_cs_eligible], [min, af_in_kind_support_and_maintenance, af_ism_maximum]], [else, 0]], [otherwise, af_refused_potential_income, 0]]]
sources: [S1622, S1002, S1012, S2610, S2623, S3212]
implemented: engine
tags: [cash, oap, and, income]
rationale: "Final cash review FC-4, FC-5 and FC-9: af_countable_income (CO-946) computed this figure inline, twice; the split $20 (CO-3832), the rollover (CO-3833) and the spouse's share in deeming (CO-2384) now read it, so it is stated once. The derivation is CO-946's former unearned-income term, with the income counted as available under 3.520.71.G.1 (S2623) added."
