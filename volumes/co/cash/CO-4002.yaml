id: CO-4002
name: "Adult Financial: countable life insurance outside the OAP rule"
identifier: af_life_insurance_countable_value_other_than_oap
kind: derived
type: money
scope: person
program: AdultFinancial
meaning: "The part of this person's life insurance cash surrender value that counts toward the resources of an Adult Financial client who is not an Old Age Pension client (Aid to the Needy Disabled), whether the person is the client or the client's spouse: nothing when the total face value of the person's and the spouse's policies is af_life_insurance_face_value_exemption_limit or less (9 CCR 2503-5 3.520.75.D); otherwise the whole cash surrender value, since 3.520.75.E-F apply to OAP only."
precision: "The total face value adds the spouse wherever the spouse lives, as 3.520.75.D reads the client's and spouse's policies and as af_client_and_spouse_countable_resources (CO-2389) counts the spouse (3.520.63.D; coverage review 2, G-2). A face value not stated is read as 0; a cash value not stated is estimated from the 3.520.75.H chart when the face value and purchase date are stated (af_life_insurance_cash_value, CO-4722; G-7), and is otherwise 0. Resource records, step H1 Adult Financial (docs/reviews/records-holdings-snap-af.md): the face value, the purchase dates and the premiums are read from the person's (and the spouse's) life insurance records (af_life_insurance_face_value, af_life_insurance_bought_within_lookback, af_life_insurance_premiums_in_lookback, CO-5347 to CO-5349) in place of the person facts (CO-3397, CO-3850, CO-3851), each of which was read as 0 or unstated when not given; a face value not stated is now cannot determine (decision 4)."
derived: ["case", [[">", ["+", "af_life_insurance_face_value", ["sum", ["filter", ["persons"], ["otherwise", ["rel", ["spouse"], ["P"]], false]], ["of", ["P"], "af_life_insurance_face_value"]]], "af_life_insurance_face_value_exemption_limit"], "af_life_insurance_cash_value"], ["else", 0]]
sources: [S2213, S2618, S3204, S3504]
implemented: engine
tags: [cash, and, resources]
rationale: "Final cash review 2, N-1: an AND client whose spouse is sixty or older had the spouse's old policy exempted, because the OAP test read the spouse's age. 3.520.75.E-F are \"For OAP only\"; the client's program governs the spouse's policy too."
tests:
  - {id: CO-4002-T1, title: "Face value over $1,500: the whole cash value counts", as_of: "2026-10-01", given: {holdings: [{kind: life_insurance, value: 5000, face_value: 10000}]}, relationships: [], expect: 5000}
  - {id: CO-4002-T2, title: "Face value $1,500 or less: nothing counts (D)", as_of: "2026-10-01", given: {holdings: [{kind: life_insurance, value: 900, face_value: 1200}]}, relationships: [], expect: 0}
  - {id: CO-4002-T3, title: "G-7: AND client, a $5,000 policy bought in 2014 with no cash value available - 45% of face (3.520.75.H)", as_of: "2026-10-01", given: {holdings: [{kind: life_insurance, face_value: 5000, purchase_date: "2014-06-01"}]}, relationships: [], expect: 2250}
  - {id: CO-4002-T4, title: "G-2: the spouse lives elsewhere with a $1,000 policy; the client's own $1,000 policy worth $400 counts (face total $2,000)", as_of: "2026-10-01", given: {dwelling_id: home_a, holdings: [{kind: life_insurance, value: 400, face_value: 1000}]}, others: {p2: {dwelling_id: home_b, holdings: [{kind: life_insurance, face_value: 1000}]}}, relationships: [[spouse, p1, p2]], expect: 400}
