id: CO-2383
name: "Colorado Works: is a parent of a dependent child in the home"
identifier: cw_is_parent_of_dependent_child
kind: derived
type: yes/no
scope: person
program: ColoradoWorks
meaning: "This person is the parent of a dependent child living in the home (9 CCR 2503-6 3.604.2.C.1.b), as distinct from a non-parent caretaker."
derived: [exists_related, [parent], [all, [of, [P], cw_is_dependent_child], [otherwise, [in_group, [P], lives_with], true], [of, [P], cw_is_considered_living_in_home]]]
precision: "Coverage pass 4 CA4-24 (docs/reviews/coverage4-cash.md): the meaning's \"living in the home\" is tested, as the unit's own membership tests it (cw_assistance_unit_members, CO-900): the child lives with the person (lives_with, the household's stated co-residents; a household that names none is read as living together) and is considered living in the home (cw_is_considered_living_in_home, 3.604.1); before, a parent whose own minor child lives elsewhere was a parent of a dependent child, which made the caretaker's husband a stepparent (cw_budgetary_member_deemed_income, CO-2353) rather than the caretaker's spouse of 3.606.1.J."
sources: [S1625]
implemented: engine
tags: [cash, tanf, household]
rationale: "OQ-140: cw_budgetary_member_deemed_income (CO-2353) treats the spouse of a parent (a stepparent, 3.605.1.A.4.a) differently from the spouse of a non-parent caretaker; cw_has_dependent_child (CO-902) joins the two roles."
