id: CO-918
name: "Colorado Works: time limit reached"
identifier: cw_time_limit_reached
kind: derived
type: yes/no
scope: person
program: ColoradoWorks
meaning: This person's assistance unit contains an adult (or minor head-of-household) member who has used sixty or more cumulative months of federal TANF assistance, and the unit is not exempt from (or extended beyond) the time limit - per 9 CCR 2503-6 3.606.6.C ("an assistance unit containing an individual who has received ... assistance ... as an adult for sixty (60) or more cumulative months shall not be eligible") and 45 CFR 264.1(a)(1). Every member of the same unit shares the same value.
precision: "Read at the unit level per the phase-5 review's C-2 finding: 3.606.6.C bars the whole unit, not only the member whose own count reached sixty months, so a unit containing one adult past the limit is time-limit-reached for every member, including a dependent child or a caretaker whose own months are under sixty. Tests cw_is_adult_member (CO-924) so a dependent child's own (zero) months never trigger the unit-level test directly, though cw_months_of_assistance_used (CO-915) already zeroes a non-head, non-spouse member's count."
derived: [all, [exists, cw_assistance_unit_members, [all, [of, [P], cw_is_adult_member], [">=", [of, [P], cw_months_of_assistance_used], cw_time_limit_months]]], [not, cw_unit_time_limit_extended]]
sources: [S404, S417, S421]
implemented: engine
tags: [cash, tanf]
rationale: "No existing item states the unit-level time-limit test; cw_time_limit_exempt (CO-917) is the nearest same-shape item (a time-limit-related disjunction/conjunction over the same facts) but this item combines cw_is_adult_member (CO-924), cw_months_of_assistance_used (CO-915), and cw_unit_time_limit_extended (CO-925) - all new or fixed under this round - into the unit-level test 3.606.6.C states, replacing the prior person-level read of cw_months_of_assistance_used and cw_time_limit_exempt that the phase-5 review's C-2 finding shows gives three different answers for one unit. cw_eligibility_status (CO-921) needs it."
nearest: [CO-917]
tests:
  - {id: CO-918-T1, as_of: "2026-10-01", given: {date_of_birth: "1990-01-01", is_head_of_household: true, receives_ssi: false, receives_title_iv_foster_adoption_kinship_payment: false, months_of_assistance_received: 61, has_domestic_violence_extension_approved: false, has_hardship_extension_approved: false}, others: {p2: {date_of_birth: "2015-06-01", is_head_of_household: false, receives_ssi: false, receives_title_iv_foster_adoption_kinship_payment: false, months_of_assistance_received: 0, has_domestic_violence_extension_approved: false, has_hardship_extension_approved: false}}, relationships: [[parent, p1, p2]], expect: true}
  - {id: CO-918-T2, as_of: "2026-10-01", given: {date_of_birth: "1990-01-01", is_head_of_household: true, receives_ssi: false, receives_title_iv_foster_adoption_kinship_payment: false, months_of_assistance_received: 42, has_domestic_violence_extension_approved: false, has_hardship_extension_approved: false}, others: {p2: {date_of_birth: "2015-06-01", is_head_of_household: false, receives_ssi: false, receives_title_iv_foster_adoption_kinship_payment: false, months_of_assistance_received: 0, has_domestic_violence_extension_approved: false, has_hardship_extension_approved: false}}, relationships: [[parent, p1, p2]], expect: false}
