id: CO-2392
name: "Adult Financial: needs of a spouse's dependent children"
identifier: af_spouse_dependent_children_needs
kind: derived
type: money
scope: person-month
program: AdultFinancial
meaning: "For this person, the spouse of an OAP client, the amount 9 CCR 2503-5 3.534.B.3 deducts for the needs of each dependent child living in the household: for each of the person's children under af_dependent_child_age_limit (CO-3054) in the household, af_dependent_child_needs_rate (CO-3050) of the SSI benefit standard for an individual less the child's own income, never below zero."
precision: "A dependent child is read as the person's child under af_dependent_child_age_limit in the case (the assumption that parameter states); the SSI benefit standard of 3.510 is ssi_federal_benefit_rate_individual. The child's own income is gross earned and unearned income. Earned-income records, step E1 Adult Financial (docs/reviews/records-earnings-cash.md): the child's gross earned income is every earnings record of the child's pay received in the month at its gross amount, whatever Adult Financial's table does with it (the child's own income, not a countable figure), plus the net profit of a business (af_self_employment_net_profit) and boarder income (af_boarder_income); before earnings records it was wages_gross (which held every part of the wages) and the net profit, so in-kind pay was left out, which 3.520.782.B makes income too. Same-word audit SW-7 (convention rule 17): an edge joins persons who live together (lives_with, CO-1925, from dwelling_id); where a case states no dwelling_id the edge is read as living together, as before. A dependent child living in the household is read from lives_with. Receipt records, migration phase 1: the child's gross unearned income is the month's receipts of every kind but gambling winnings and a sponsor's money, as the unearned income facts it summed held them; a receipt of a kind Adult Financial reads from the earnings list (af_receipt_treatment_table, CO-5016: read_as_earnings) is left out, so a transition copy is counted once. An unstated earnings or receipts list is cannot determine."
derived: [sum, [filter, [persons], [all, [rel, [parent], [P]], [otherwise, [in_group, [P], lives_with], true], ["<", [of, [P], age], af_dependent_child_age_limit]]], [max, 0, ["-", ["*", ssi_federal_benefit_rate_individual, af_dependent_child_needs_rate], ["+", ["+", [sum_receipts, [of, [P], earnings], [all, [received_in, [month]], [not, [in, [lookup, af_earnings_treatment_table, [receipt, kind]], [counted_net_of_costs, counted_averaged_over_year, counted_less_provision_costs, deducted, deducted_from_boarder_payments, not_deducted, not_deducted_no_rule_found]]]], [receipt, amount]], [of, [P], af_self_employment_net_profit], [of, [P], af_boarder_income]], [sum_receipts, [of, [P], receipts], [all, [received_in, [month]], [not, [in, [receipt, kind], [gambling_winnings, sponsor_payment]]], [not, ["=", [lookup, af_receipt_treatment_table, [receipt, kind]], read_as_earnings]]], [receipt, amount]]]]]]
sources: [S1632, S3211]
implemented: engine
tags: [cash, income]
rationale: "OQ-114: the OAP unearned-income deeming of 3.534.B (S1632) deducts the children's needs; af_deemed_relative_income (CO-2384) reads this for the spouse. Same-word SW-7: the child in the household is read from lives_with."
