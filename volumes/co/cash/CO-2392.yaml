id: CO-2392
name: "Adult Financial: needs of a spouse's dependent children"
identifier: af_spouse_dependent_children_needs
kind: derived
type: money
scope: person-month
program: AdultFinancial
meaning: "For this person, the spouse of an OAP client, the amount 9 CCR 2503-5 3.534.B.3 deducts for the needs of each dependent child living in the household: for each of the person's children under af_dependent_child_age_limit (CO-3054) in the household, af_dependent_child_needs_rate (CO-3050) of the SSI benefit standard for an individual less the child's own income, never below zero."
precision: "A dependent child is read as the person's child under af_dependent_child_age_limit in the case (the assumption that parameter states); the SSI benefit standard of 3.510 is ssi_federal_benefit_rate_individual. The child's own income is gross earned and unearned income. Same-word audit SW-7 (convention rule 17): an edge joins persons who live together (lives_with, CO-1925, from dwelling_id); where a case states no dwelling_id the edge is read as living together, as before. A dependent child living in the household is read from lives_with. Receipt records, migration phase 1: the child's gross unearned income is the month's receipts of every kind but gambling winnings and a sponsor's money, as the unearned income facts it summed held them."
derived: [sum, [filter, [persons], [all, [rel, [parent], [P]], [otherwise, [in_group, [P], lives_with], true], ["<", [of, [P], age], af_dependent_child_age_limit]]], [max, 0, ["-", ["*", ssi_federal_benefit_rate_individual, af_dependent_child_needs_rate], ["+", ["+", [of, [P], wages_gross], [of, [P], af_self_employment_net_profit]], [sum_receipts, [of, [P], receipts], [all, [received_in, [month]], [not, [in, [receipt, kind], [gambling_winnings, sponsor_payment]]]], [receipt, amount]]]]]]
sources: [S1632]
implemented: engine
tags: [cash, income]
rationale: "OQ-114: the OAP unearned-income deeming of 3.534.B (S1632) deducts the children's needs; af_deemed_relative_income (CO-2384) reads this for the spouse. Same-word SW-7: the child in the household is read from lives_with."
tests:
  - {id: CO-2392-T1, month: "2026-10", as_of: "2026-10-01", given: {}, title: "One child with no income - half of $994", others: {p2: {date_of_birth: "2015-01-01", wages_gross: 0, af_self_employment_net_profit: 0, receipts: [], earnings: [{kind: self_employment_receipts}]}}, relationships: [[parent, p1, p2]], expect: 497}
  - {id: CO-2392-T2, month: "2026-10", as_of: "2026-10-01", given: {}, title: "A child with $200 of survivor benefits", others: {p2: {date_of_birth: "2015-01-01", wages_gross: 0, af_self_employment_net_profit: 0, receipts: [{kind: social_security, amount: 200}], earnings: [{kind: self_employment_receipts}]}}, relationships: [[parent, p1, p2]], expect: 297}
