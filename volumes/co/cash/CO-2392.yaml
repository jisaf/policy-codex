id: CO-2392
name: "Adult Financial: needs of a spouse's dependent children"
identifier: af_spouse_dependent_children_needs
kind: derived
type: money
scope: person-month
program: AdultFinancial
meaning: "For this person, the spouse of an OAP client, the amount 9 CCR 2503-5 3.534.B.3 deducts for the needs of each dependent child living in the household: for each of the person's children under af_dependent_child_age_limit (CO-3054) in the household, af_dependent_child_needs_rate (CO-3050) of the SSI benefit standard for an individual less the child's own income, never below zero."
precision: "A dependent child is read as the person's child under af_dependent_child_age_limit in the case (the assumption that parameter states); the SSI benefit standard of 3.510 is ssi_federal_benefit_rate_individual. The child's own income is gross earned and unearned income. Earned-income records, step E1 Adult Financial (docs/reviews/records-earnings-cash.md): the child's gross earned income is every earnings record of the child's pay received in the month at its gross amount, whatever Adult Financial's table does with it (the child's own income, not a countable figure), plus the net profit of a business (af_self_employment_net_profit) and boarder income (af_boarder_income); before earnings records it was wages_gross (which held every part of the wages) and the net profit, so in-kind pay was left out, which 3.520.782.B makes income too. Same-word audit SW-7 (convention rule 17): an edge joins persons who live together (lives_with, CO-1925, from dwelling_id); where a case states no dwelling_id the edge is read as living together, as before. A dependent child living in the household is read from lives_with. Receipt records, migration phase 1: the child's gross unearned income is the month's receipts of every kind but gambling winnings and a sponsor's money, as the unearned income facts it summed held them; a receipt of a kind Adult Financial reads from the earnings list (af_receipt_treatment_table, CO-5016: read_as_earnings) is left out, so a transition copy is counted once. An unstated earnings or receipts list is cannot determine. Coverage pass 4 CA4-9 (docs/reviews/coverage4-cash.md): a stream (an earnings record with no month and no date) is read only in the months from the month of its job_start_date through the month of its job_end_date, so the pay of a job that ended before the month, or begins after it, is not counted (9 CCR 2503-5 3.520.781.G, 9 CCR 2503-6 3.605.2.B: income counted when received); a record stated with its month or date is read in that month. Coverage pass 4 CA4-17 (docs/reviews/coverage4-cash.md): \"less the dependent child's own income\" (3.534.B.3) is every receipt of the child, a prize and money from a sponsor included; before, gambling winnings and a sponsor's money were left out, a remnant of the scalar facts. Probe A21: the husband's Social Security $1,600 and his son of 10 wins $500 in October: the child's need 994 x .5 - 500 = 0 (not 497), so 1,600 - 1,032 - 0 = 568 is deemed. Field sweep fix round (docs/reviews/field-sweep-snap-cash-nonmagi.md, FS-AF-1): a stream (a receipt with no month and no date) is read only in the months from the month of its start_date through the month of its end_date, as SNAP's readers read it (snap_counted_recurring_receipts, CO-5011), since \"All income shall be countable in the month it is actually received or legally becomes available\" (9 CCR 2503-5 3.520.781.G, S4910): a pension that ended, or one not yet begun, is received in no month outside those dates; a receipt stated with its month or date is read in that month. Before, a stream was read in every month whatever its dates. Coverage pass 6 CA6-4, CA6-12 (docs/reviews/coverage6-cash.md): a child counts in the month evaluated when born by the month's last day and under the limit on its first day (docs/operators.md, \"Ages in a month\"; OQ-951); before, every child under the limit on the determination date was counted in every month, one born after the month included."
