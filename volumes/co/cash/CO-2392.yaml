id: CO-2392
name: "Adult Financial: needs of a spouse's dependent children"
identifier: af_spouse_dependent_children_needs
kind: derived
type: money
scope: person-month
program: AdultFinancial
meaning: "For this person, the spouse of an OAP client, the amount 9 CCR 2503-5 3.534.B.3 deducts for the needs of each dependent child living in the household: for each of the person's children under eighteen in the household, half the SSI benefit standard for an individual less the child's own income, never below zero."
precision: "A dependent child is read as the person's child under eighteen in the case; the SSI benefit standard of 3.510 is ssi_federal_benefit_rate_individual. The child's own income is gross earned and unearned income."
derived: [sum, [filter, [persons], [all, [rel, [parent], [P]], ["<", [of, [P], age], 18]]], [max, 0, ["-", ["/", ssi_federal_benefit_rate_individual, 2], [+, [+, [of, [P], wages_gross], [of, [P], af_self_employment_net_profit]], [+, [of, [P], social_security_income], [of, [P], pension_income], [of, [P], unemployment_income], [of, [P], tanf_cash_income], [of, [P], adult_financial_cash_income], [of, [P], child_support_received], [of, [P], other_unearned_income_taxable], [of, [P], other_unearned_income_nontaxable], [of, [P], tax_exempt_interest], [of, [P], ssi_income]]]]]]
sources: [S1632]
implemented: engine
tags: [cash, income]
rationale: "OQ-114: the OAP unearned-income deeming of 3.534.B (S1632) deducts the children's needs; af_deemed_relative_income (CO-2384) reads this for the spouse."
tests:
  - {id: CO-2392-T1, title: "One child with no income - half of $994", as_of: "2026-10-01", month: "2026-10", given: {}, others: {p2: {date_of_birth: "2015-01-01", wages_gross: 0, af_self_employment_net_profit: 0, social_security_income: 0, pension_income: 0, unemployment_income: 0, tanf_cash_income: 0, adult_financial_cash_income: 0, child_support_received: 0, other_unearned_income_taxable: 0, other_unearned_income_nontaxable: 0, tax_exempt_interest: 0, ssi_income: 0}}, relationships: [[parent, p1, p2]], expect: 497}
  - {id: CO-2392-T2, title: "A child with $200 of survivor benefits", as_of: "2026-10-01", month: "2026-10", given: {}, others: {p2: {date_of_birth: "2015-01-01", wages_gross: 0, af_self_employment_net_profit: 0, social_security_income: 200, pension_income: 0, unemployment_income: 0, tanf_cash_income: 0, adult_financial_cash_income: 0, child_support_received: 0, other_unearned_income_taxable: 0, other_unearned_income_nontaxable: 0, tax_exempt_interest: 0, ssi_income: 0}}, relationships: [[parent, p1, p2]], expect: 297}
