  - {id: CO-2392-T2, month: "2026-10", as_of: "2026-10-01", given: {}, title: "A child with $200 of survivor benefits", others: {p2: {date_of_birth: "2015-01-01", receipts: [{kind: social_security, amount: 200}], earnings: []}}, relationships: [[parent, p1, p2]], expect: 297}
  - {id: CO-2392-T3, month: "2026-10", as_of: "2026-10-01", given: {}, title: "A child with $150 of wages and $50 of in-kind pay for yard work: 994 x 0.5 - (150 + 50) = 297 (3.534.B.3; in-kind pay is income, 3.520.782.B)", others: {p2: {date_of_birth: "2010-01-01", receipts: [], earnings: [{kind: wages, amount: 150}, {kind: in_kind_pay, amount: 50}]}}, relationships: [[parent, p1, p2]], expect: 297}
