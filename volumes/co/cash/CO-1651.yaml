id: CO-1651
name: "Colorado Works: residency verification is pending"
identifier: cw_residency_verification_is_pending
kind: derived
type: yes/no
scope: person-month
program: ColoradoWorks
role: outcome
meaning: Whether Colorado Works requires verification of the person's residency (an adult member) and it has not been provided.
derived: [all, cw_is_adult_member, [not, residency_verification_document_received]]
sources: [S872]
implemented: engine
tags: [verification, cash, tanf]
rationale: "Review U-1: the count items held this test as an anonymous arm, so no outcome told a worker which document was outstanding and for whom; the count now sums this item."
tests:
  - {id: CO-1651-T1, month: "2026-10", as_of: "2026-10-01", given: {cw_is_adult_member: true, residency_verification_document_received: false}, expect: true}
  - {id: CO-1651-T2, month: "2026-10", as_of: "2026-10-01", given: {cw_is_adult_member: false}, expect: false}
