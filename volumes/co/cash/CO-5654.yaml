id: CO-5654
name: "Colorado Works: benefits conditional on school attendance counted above the expenses of attendance"
identifier: cw_school_attendance_benefits_counted
kind: derived
type: money
scope: person-month
program: ColoradoWorks
meaning: "The part of this person's benefits conditional upon school attendance that Colorado Works counts for the month: the U.S. Department of Veterans Affairs educational assistance (G.I. Bill) payments and other benefits paid only while the person attends school, to the extent they exceed the expenses necessary for school attendance (9 CCR 2503-6 3.605.3.A.4). The benefits are the G.I. Bill housing and food allowance received (cw_receipt_treatment_table: counted_beyond_school_expenses) and the part of the educational assistance received that is conditional on attendance (school_attendance_conditional_benefits_received); the rest of the educational assistance (grants, loans, stipends and scholarships) is exempt (3.605.4.B.26). Never more than the educational assistance and allowance received."
precision: "Coverage pass 2 (CW2-4), carried from cw_excluded_unearned_income (CO-2341, removed by receipt records, migration phase 2): school_attendance_conditional_benefits_received (CO-4661) is the part of the educational assistance receipts paid on condition of attendance, which no receipt kind or field restates yet, and school_attendance_expenses_paid (CO-4662) is an expense, not a receipt; each is read as 0 when not stated, as before. The G.I. Bill housing and food allowance is a receipt kind of its own, and is now offset by the expenses of attendance as A.4 says; before receipt records it was counted in full, since it sat in the other unearned income facts."
derived: [min, [sum_receipts, receipts, [all, [in, [lookup, cw_receipt_treatment_table, [receipt, kind]], [excluded_except_school_conditional_part, counted_beyond_school_expenses]], [received_in, [month]]], [receipt, amount]], [max, 0, ["-", ["+", [otherwise, school_attendance_conditional_benefits_received, 0], [sum_receipts, receipts, [all, ["=", [lookup, cw_receipt_treatment_table, [receipt, kind]], counted_beyond_school_expenses], [received_in, [month]]], [receipt, amount]]], [otherwise, school_attendance_expenses_paid, 0]]]]
sources: [S3451, S2205]
implemented: engine
tags: [cash, tanf, income]
rationale: "Receipt records, migration phase 2: the one rule of 3.605.3 that counts a benefit only above an expense, kept apart from the counting table's plain rows because the expenses are a fact of the person, which a receipt sum cannot read (docs/operators.md, Receipt records)."
tests:
  - {id: CO-5654-T1, month: "2026-10", as_of: "2026-10-15", given: {school_attendance_conditional_benefits_received: 1000, school_attendance_expenses_paid: 600, receipts: [{kind: educational_assistance, amount: 1000}]}, title: "Coverage pass 2 CW2-4: $1,000 of G.I. Bill payments against $600 of school expenses - $400 counts", expect: 400}
  - {id: CO-5654-T2, month: "2026-10", as_of: "2026-10-15", given: {school_attendance_conditional_benefits_received: 300, school_attendance_expenses_paid: 500, receipts: [{kind: educational_assistance, amount: 1300}]}, title: "Coverage pass 2 CW2-4: a $1,000 Pell grant and $300 of G.I. Bill payments against $500 of school expenses - nothing counts", expect: 0}
  - {id: CO-5654-T3, month: "2026-10", as_of: "2026-10-15", given: {school_attendance_expenses_paid: 400, receipts: [{kind: gi_bill_housing_food_allowance, amount: 1500}, {kind: educational_assistance, amount: 2000}]}, title: "A $1,500 G.I. Bill housing allowance against $400 of school expenses: $1,100 counts; the $2,000 grant is exempt (B.26)", expect: 1100}
  - {id: CO-5654-T4, month: "2026-10", as_of: "2026-10-15", given: {receipts: [{kind: social_security, amount: 900}]}, title: "No educational benefits", expect: 0}
