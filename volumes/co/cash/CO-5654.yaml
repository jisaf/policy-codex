id: CO-5654
name: "Colorado Works: benefits conditional on school attendance counted above the expenses of attendance"
identifier: cw_school_attendance_benefits_counted
kind: derived
type: money
scope: person-month
program: ColoradoWorks
meaning: "The part of this person's benefits conditional upon school attendance that Colorado Works counts for the month: the U.S. Department of Veterans Affairs educational assistance (G.I. Bill) payments and other benefits paid only while the person attends school, to the extent they exceed the expenses necessary for school attendance (9 CCR 2503-6 3.605.3.A.4). The benefits are the receipts the counting table treats as counted_beyond_school_expenses: the G.I. Bill housing and food allowance and the benefits paid only on condition of attendance (school_attendance_conditional_benefit); other educational assistance (grants, loans, stipends and scholarships) is exempt (3.605.4.B.26)."
precision: "Coverage pass 2 (CW2-4), carried from cw_excluded_unearned_income (CO-2341, removed by receipt records, migration phase 2). Receipt records, migration phase 3: the benefits conditional on attendance are a receipt kind of their own (school_attendance_conditional_benefit), so the part of the educational assistance they were (school_attendance_conditional_benefits_received, CO-4661, retired) is no longer read, nor capped at the educational assistance received. school_attendance_expenses_paid (CO-4662) is an expense, not a receipt: read only when the person has such benefits in the month, and required then (coverage pass 4 CA4-16, decision 4 of 2026-11-23: A.4 gives no reading for expenses not stated; before, it was read as 0 when not stated). The G.I. Bill housing and food allowance is offset by the expenses of attendance as A.4 says; before receipt records it was counted in full, since it sat in the other unearned income facts. Field sweep fix round (docs/reviews/field-sweep-snap-cash-nonmagi.md, FS-CW-1): a stream (a receipt with no month and no date) is read only in the months from the month of its start_date through the month of its end_date, as SNAP's readers read it (snap_counted_recurring_receipts, CO-5011), since income is \"the receipt by a client of a gain or benefit in cash or in-kind during a calendar month\" and the unit's income is what it has \"received, or ... expects to receive in the application month and any month following\" (9 CCR 2503-6 3.605.1.A.2, B, S4911): a pension that ended, or one not yet begun, is received in no month outside those dates; a receipt stated with its month or date is read in that month. Before, a stream was read in every month whatever its dates."
derived: ["case", [["<=", ["sum_receipts", "receipts", ["all", ["=", ["lookup", "cw_receipt_treatment_table", ["receipt", "kind"]], "counted_beyond_school_expenses"], ["all", ["received_in", ["month"]], ["any", ["not", ["unknown", ["receipt", "month"]]], ["all", ["any", ["unknown", ["receipt", "start_date"]], ["<=", ["month_of", ["receipt", "start_date"]], ["month"]]], ["any", ["unknown", ["receipt", "end_date"]], [">=", ["month_of", ["receipt", "end_date"]], ["month"]]]]]]], ["receipt", "amount"]], 0], 0], ["else", ["max", 0, ["-", ["sum_receipts", "receipts", ["all", ["=", ["lookup", "cw_receipt_treatment_table", ["receipt", "kind"]], "counted_beyond_school_expenses"], ["all", ["received_in", ["month"]], ["any", ["not", ["unknown", ["receipt", "month"]]], ["all", ["any", ["unknown", ["receipt", "start_date"]], ["<=", ["month_of", ["receipt", "start_date"]], ["month"]]], ["any", ["unknown", ["receipt", "end_date"]], [">=", ["month_of", ["receipt", "end_date"]], ["month"]]]]]]], ["receipt", "amount"]], "school_attendance_expenses_paid"]]]]
sources: [S3451, S2205, S4911]
implemented: engine
tags: [cash, tanf, income]
nearest: [CO-6800]
rationale: "Receipt records, migration phase 2: the one rule of 3.605.3 that counts a benefit only above an expense, kept apart from the counting table's plain rows because the expenses are a fact of the person, which a receipt sum cannot read (docs/operators.md, Receipt records). Coverage pass 4 CA4-2: Adult Financial's own reading of the same kind of benefit is af_school_attendance_benefits_counted (CO-6800), from its own rule (9 CCR 2503-5 3.520.785.B.16) and table; the two are program calculations, never shared."
tests:
  - {id: CO-5654-T1, month: "2026-10", as_of: "2026-10-15", given: {school_attendance_expenses_paid: 600, receipts: [{kind: school_attendance_conditional_benefit, amount: 1000}]}, title: "Coverage pass 2 CW2-4: $1,000 of G.I. Bill payments against $600 of school expenses - $400 counts", expect: 400}
  - {id: CO-5654-T2, month: "2026-10", as_of: "2026-10-15", given: {school_attendance_expenses_paid: 500, receipts: [{kind: educational_assistance, amount: 1000}, {kind: school_attendance_conditional_benefit, amount: 300}]}, title: "Coverage pass 2 CW2-4: a $1,000 Pell grant and $300 of G.I. Bill payments against $500 of school expenses - nothing counts", expect: 0}
  - {id: CO-5654-T3, month: "2026-10", as_of: "2026-10-15", given: {school_attendance_expenses_paid: 400, receipts: [{kind: gi_bill_housing_food_allowance, amount: 1500}, {kind: educational_assistance, amount: 2000}]}, title: "A $1,500 G.I. Bill housing allowance against $400 of school expenses: $1,100 counts; the $2,000 grant is exempt (B.26)", expect: 1100}
  - {id: CO-5654-T4, month: "2026-10", as_of: "2026-10-15", given: {receipts: [{kind: social_security, amount: 900}]}, title: "No educational benefits", expect: 0}
  - {id: "CO-5654-T5", month: "2026-10", as_of: "2026-10-15", given: {receipts: [{kind: school_attendance_conditional_benefit, amount: 1000}]}, title: "Coverage pass 4 CA4-16: benefits, the expenses of attendance not stated: cannot determine (decision 4)", expect: unknown}
  # Field sweep fix round (FS-CW-1): hand-computed from 9 CCR 2503-6 3.605.1.A.2, B (S4911): a stream is received only from the month of its start_date through the month of its end_date.
  - {"id": "CO-5654-T6", "month": "2026-10", "as_of": "2026-10-15", "title": "$1,000 of G.I. Bill payments that ended 2026-08-31, $600 of expenses: none received in October, 0", "given": {"school_attendance_expenses_paid": 600, "receipts": [{"kind": "school_attendance_conditional_benefit", "amount": 1000, "end_date": "2026-08-31"}]}, "expect": 0}
