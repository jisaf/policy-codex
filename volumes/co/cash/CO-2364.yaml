id: CO-2364
name: "Colorado Works: sponsor deeming applies"
identifier: cw_sponsor_deeming_applies
kind: derived
type: yes/no
scope: person-month
program: ColoradoWorks
meaning: "The net income of this non-citizen's sponsor and the sponsor's spouse is deemed to the assistance unit for the month (9 CCR 2503-6 3.605.1.A.5): the person is a lawful permanent resident sponsored on an affidavit of support (Form I-864, is_sponsored_non_citizen), and none of the exemptions of A.5.c applies - the person did not adjust to permanent residence from refugee or asylee status, is not a victim of battery or extreme cruelty, has fewer than forty qualifying quarters, has not rebutted the availability of the sponsor's income (A.5.b), and the combined monthly income of the person, the person's spouse, the sponsor and a co-sponsor spouse is at least 125% of the monthly federal poverty guideline for the combined household size."
precision: "The monthly guideline is the annual federal_poverty_guideline_annual_table figure for the combined size divided by twelve. The person's and spouse's income are their gross earned income and unearned income after Colorado Works' exclusions (cw_gross_earned_income, cw_countable_unearned_income). A citizen or a non-LPR is out at the first test, so no sponsor fact is needed."
derived: [all, ["=", immigration_status, lawful_permanent_resident], is_sponsored_non_citizen, [not, [in, [otherwise, status_before_lpr_adjustment, none], [refugee, asylee]]], [not, [otherwise, is_victim_of_battery_or_extreme_cruelty, false]], [not, [otherwise, cw_sponsor_income_availability_rebutted, false]], ["<", qualifying_quarters, cw_sponsor_deeming_exempt_quarters], [">=", ["+", cw_gross_earned_income, cw_countable_unearned_income, [sum, [filter, [persons], [rel, [spouse], [P]]], ["+", [of, [P], cw_gross_earned_income], [of, [P], cw_countable_unearned_income]]], sponsor_gross_earned_income, sponsor_unearned_income, [case, [[otherwise, sponsor_spouse_is_cosponsor, false], ["+", [otherwise, sponsor_spouse_gross_earned_income, 0], [otherwise, sponsor_spouse_unearned_income, 0]]], [else, 0]]], ["/", ["*", cw_sponsor_deeming_fpl_pct, [case, [["<=", cw_sponsor_deeming_household_size, 8], [lookup, federal_poverty_guideline_annual_table, cw_sponsor_deeming_household_size]], [else, ["+", [lookup, federal_poverty_guideline_annual_table, 8], ["*", federal_poverty_guideline_annual_each_additional, ["-", cw_sponsor_deeming_household_size, 8]]]]]], 12]]]
sources: [S1627]
implemented: engine
tags: [cash, tanf, immigration, income]
rationale: "OQ-103: no item applied A.5 (S1627). A refugee, asylee, parolee or Cuban or Haitian entrant (A.5.c.1) is not a lawful permanent resident; an older or non-I-864 affidavit (A.5.c.3, 7) is not an affidavit that is_sponsored_non_citizen (CO-1573) states.  OQ-44 fix (product-owner decision of 2026-11-21; docs/reviews/audit-dual-entry.md 3.1; same-word audit SW-18): reads the one immigration_status fact (CO-002), which replaced citizenship_status, lawful_presence_status (CO-084), federal_five_year_bar_exempt_category (CO-1724) and ma_five_year_bar_exempt_category (CO-1170). The refugee-or-asylee exemption (A.5.c) reads status_before_lpr_adjustment (CO-2700), which states refugee and asylee separately."
tests:
  - {id: CO-2364-T1, title: "A sponsored LPR; $4,000 combined income is over 125% of the 2026 guideline for five ($38,680 x 1.25 / 12 = $4,029.17)? No - under it, so exempt (A.5.c.5)", as_of: "2026-10-01", month: "2026-10", given: {immigration_status: lawful_permanent_resident, is_sponsored_non_citizen: true, qualifying_quarters: 0, cw_sponsor_deeming_household_size: 5, cw_gross_earned_income: 0, cw_countable_unearned_income: 0, sponsor_gross_earned_income: 4000, sponsor_unearned_income: 0}, relationships: [], expect: false}
  - {id: CO-2364-T2, title: "Sponsor earns $5,000 - at least 125% for five, so deemed", as_of: "2026-10-01", month: "2026-10", given: {immigration_status: lawful_permanent_resident, is_sponsored_non_citizen: true, qualifying_quarters: 0, cw_sponsor_deeming_household_size: 5, cw_gross_earned_income: 0, cw_countable_unearned_income: 0, sponsor_gross_earned_income: 5000, sponsor_unearned_income: 0}, relationships: [], expect: true}
  - {id: CO-2364-T3, title: "Adjusted from refugee status (A.5.c.2)", as_of: "2026-10-01", month: "2026-10", given: {immigration_status: lawful_permanent_resident, is_sponsored_non_citizen: true, status_before_lpr_adjustment: refugee}, relationships: [], expect: false}
  - {id: CO-2364-T4, title: "A victim of battery (A.5.c.4)", as_of: "2026-10-01", month: "2026-10", given: {immigration_status: lawful_permanent_resident, is_sponsored_non_citizen: true, is_victim_of_battery_or_extreme_cruelty: true}, relationships: [], expect: false}
  - {id: CO-2364-T5, title: "Forty quarters (A.5.c.6)", as_of: "2026-10-01", month: "2026-10", given: {immigration_status: lawful_permanent_resident, is_sponsored_non_citizen: true, qualifying_quarters: 40}, relationships: [], expect: false}
  - {id: CO-2364-T6, title: "A refugee (A.5.c.1)", as_of: "2026-10-01", month: "2026-10", given: {immigration_status: refugee}, relationships: [], expect: false}
  - {id: CO-2364-T7, title: "Rebutted (A.5.b)", as_of: "2026-10-01", month: "2026-10", given: {immigration_status: lawful_permanent_resident, is_sponsored_non_citizen: true, cw_sponsor_income_availability_rebutted: true}, relationships: [], expect: false}
