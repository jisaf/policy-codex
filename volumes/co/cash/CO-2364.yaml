  - {id: CO-2364-T4, title: "A victim of battery (A.5.c.4)", as_of: "2026-10-01", month: "2026-10", given: {citizenship_status: lawful_permanent_resident, is_sponsored_non_citizen: true, federal_five_year_bar_exempt_category: "none", is_victim_of_battery_or_extreme_cruelty: true}, relationships: [], expect: false}
  - {id: CO-2364-T5, title: "Forty quarters (A.5.c.6)", as_of: "2026-10-01", month: "2026-10", given: {citizenship_status: lawful_permanent_resident, is_sponsored_non_citizen: true, federal_five_year_bar_exempt_category: "none", qualifying_quarters: 40}, relationships: [], expect: false}
  - {id: CO-2364-T6, title: "A refugee (A.5.c.1)", as_of: "2026-10-01", month: "2026-10", given: {citizenship_status: refugee}, relationships: [], expect: false}
