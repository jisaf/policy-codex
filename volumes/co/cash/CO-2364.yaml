id: CO-2364
name: "Colorado Works: sponsor deeming applies"
identifier: cw_sponsor_deeming_applies
kind: derived
type: yes/no
scope: person-month
program: ColoradoWorks
meaning: "The net income of this non-citizen's sponsor and the sponsor's spouse is deemed to the assistance unit for the month (9 CCR 2503-6 3.605.1.A.5): the person is a lawful permanent resident sponsored on an affidavit of support (Form I-864, is_sponsored_non_citizen), and none of the exemptions of A.5.c applies - the person did not adjust to permanent residence from refugee or asylee status, is not a victim of battery or extreme cruelty, has fewer than federal_qualifying_quarters_threshold qualifying quarters, has not rebutted the availability of the sponsor's income (A.5.b), and the combined monthly income of the person, the person's spouse, the sponsor and a co-sponsor spouse is at least cw_sponsor_deeming_fpl_pct of the monthly federal poverty guideline for the combined household size."
precision: "The monthly guideline is the annual cw_poverty_guideline_annual_table (CO-4350) figure, the 2021 guideline that 3.601 adopts with no later editions (S3150; coverage review CW-4, which replaced the current federal_poverty_guideline_annual_table), for the combined size (cw_sponsor_deeming_household_size, CO-2360) divided by twelve. Each person's income is gross earned income and unearned income after Colorado Works' exclusions (cw_gross_earned_income, cw_countable_unearned_income), read from the person's own facts: the non-citizen, the non-citizen's spouse, and each sponsor (sponsors, CO-2713, the co-sponsor spouse included, \"the sponsor's spouse (who is also a sponsor)\"). A citizen or a non-LPR is out at the first test, so no sponsor fact is needed. Coverage pass 6 CA6-7 (docs/reviews/coverage6-cash.md): a sponsored lawful permanent resident's status before the adjustment and whether she is a victim of battery or extreme cruelty, each an exemption from sponsor deeming, are required where read (decision 4 of 2026-11-23); before, read as none and false when not stated. The county's finding that the sponsor's income is not available is a finding and keeps its reading."
derived: ["all", ["=", "immigration_status", "lawful_permanent_resident"], "is_sponsored_non_citizen", ["not", ["in", "status_before_lpr_adjustment", ["refugee", "asylee"]]], ["not", "is_victim_of_battery_or_extreme_cruelty"], ["not", ["otherwise", "cw_sponsor_income_availability_rebutted", false]], ["<", "qualifying_quarters", "federal_qualifying_quarters_threshold"], [">=", ["+", "cw_gross_earned_income", "cw_countable_unearned_income", ["sum", ["filter", ["persons"], ["rel", ["spouse"], ["P"]]], ["+", ["of", ["P"], "cw_gross_earned_income"], ["of", ["P"], "cw_countable_unearned_income"]]], ["sum", "sponsors", ["+", ["of", ["P"], "cw_gross_earned_income"], ["of", ["P"], "cw_countable_unearned_income"]]]], ["/", ["*", "cw_sponsor_deeming_fpl_pct", ["lookup_extended", "cw_poverty_guideline_annual_table", "cw_sponsor_deeming_household_size", "cw_poverty_guideline_annual_each_additional"]], 12]]]
sources: [S1627, S3150, S3151]
implemented: engine
tags: [cash, tanf, immigration, income]
rationale: "OQ-103: no item applied A.5 (S1627). A refugee, asylee, parolee or Cuban or Haitian entrant (A.5.c.1) is not a lawful permanent resident; an older or non-I-864 affidavit (A.5.c.3, 7) is not an affidavit that is_sponsored_non_citizen (CO-1573) states.  OQ-44 fix (product-owner decision of 2026-11-21; docs/reviews/audit-dual-entry.md 3.1; same-word audit SW-18): reads the one immigration_status fact (CO-002), which replaced citizenship_status, lawful_presence_status (CO-084), federal_five_year_bar_exempt_category (CO-1724) and ma_five_year_bar_exempt_category (CO-1170). The refugee-or-asylee exemption (A.5.c) reads status_before_lpr_adjustment (CO-2700), which states refugee and asylee separately.  Dual-entry audit 1.5 (audit fix round): the sponsor is a person of the case, joined to the non-citizen by the sponsor / sponsored_by relationship (volume.yaml), and the sponsor's income and resources are read from the sponsor's own facts, so two non-citizens with one sponsor read one set of facts."
