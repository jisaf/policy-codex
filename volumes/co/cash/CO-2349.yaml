id: CO-2349
name: "Colorado Works: is an optional assistance-unit member"
identifier: cw_is_optional_assistance_unit_member
kind: derived
type: yes/no
scope: person
program: ColoradoWorks
meaning: "This person, living in the home, is an optional member of the assistance unit under 9 CCR 2503-6 3.604.2.C.2: a non-parent caretaker of a dependent child who is not also a parent of a dependent child in the home (C.2.b); the spouse of a parent or of a non-parent caretaker of a dependent child, who is not a parent or caretaker of a dependent child in the home and whose spouse is not pregnant (C.2.a, c; the spouse of a pregnant parent is mandatory, C.1.e); or a member made optional by custody or child support (C.2.d-f, cw_is_optional_member_by_custody_or_support)."
precision: "A pregnancy left unstated is read as no pregnancy (is_pregnant, CO-009). The parent of a minor parent requesting assistance for her own child (C.2.g) is optional too; cw_assistance_unit_members (CO-900) reaches that parent only when the parent requests inclusion, so this item need not name it. Same-word audit SW-3/SW-4 (OQ-396): the caretaker relation is cw_caretaker_of (CO-2608): a parent, or a non-parent caretaker who is the child's legal guardian or has primary responsibility for the child (3.601); the spouse of a parent who is not a parent stays the optional member of 3.604.2.C.2.a, read from the spouse and parent roles as the rule words it. Duplicate-paths audit D-W1 (P1, fixed 2026-11-23, docs/reviews/records-earnings-cash.md): the non-parent caretaker of C.2.b is read from Colorado Works' caretaker definition (cw_caretaker_of, CO-2608, as cw_has_dependent_child, CO-902, reads it): a person who is the caretaker of a dependent child in the home who is not the person's own child, and not the parent of any dependent child in the home (a parent who cares only for the parent's own children is never asked whether they are dependent children here); before, it was read from the raw legal_guardian and has_primary_responsibility_for roles, so an unrelated adult with primary responsibility for a child whose parent is in the home (not a caretaker under 3.601 and 3.604.2.H) was made an optional member, and a guardian whose ward lives elsewhere too."
derived: [any, [all, [exists, cw_caretaker_of, [all, [not, [rel, [parent], [P]]], [of, [P], cw_is_dependent_child]]], [not, [exists, cw_caretaker_of, [all, [rel, [parent], [P]], [of, [P], cw_is_dependent_child]]]]], [all, [not, cw_has_dependent_child], [exists_related, [spouse], [all, [of, [P], cw_has_dependent_child], [not, [otherwise, [of, [P], is_pregnant], false]]]]], cw_is_half_sibling_receiving_child_support, [otherwise, cw_is_optional_member_by_custody_or_support, false]]
sources: [S1625]
implemented: engine
tags: [cash, tanf, household]
rationale: "OQ-152, OQ-101: cw_assistance_unit_members (CO-900) treated every caretaker as mandatory and reached no spouse; 3.604.2.C.2 (S1625) makes these persons members only on request."
