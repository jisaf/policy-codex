  - {id: CO-2349-T3, title: "The spouse of a pregnant parent is mandatory (C.1.e)", as_of: "2026-10-01", given: {date_of_birth: "1985-01-01"}, others: {p2: {date_of_birth: "1988-01-01", is_pregnant: true}, p3: {date_of_birth: "2018-01-01", is_full_time_secondary_student_finishing_before_nineteen: false}}, relationships: [[spouse, p1, p2], [parent, p2, p3]], expect: false}
  - {id: CO-2349-T4, title: "A parent of a dependent child is mandatory", as_of: "2026-10-01", given: {date_of_birth: "1985-01-01"}, others: {p2: {date_of_birth: "2018-01-01", is_full_time_secondary_student_finishing_before_nineteen: false}}, relationships: [[parent, p1, p2]], expect: false}
  - {id: CO-2349-T5, title: "A half sibling receiving child support (C.2.d)", as_of: "2026-10-01", given: {date_of_birth: "2016-01-01", cw_is_half_sibling_receiving_child_support: false, cw_is_optional_member_by_custody_or_support: true}, others: {p2: {date_of_birth: "1988-01-01"}}, relationships: [[parent, p2, p1]], expect: true}
