  - {id: "CO-2349-T2", title: "A stepfather - the spouse of a parent, not himself a parent (C.2.a)", as_of: "2026-10-01", given: {dwelling_id: h1, date_of_birth: "1985-01-01"}, others: {p2: {residence_setting_type: private_dwelling, dwelling_id: h1, date_of_birth: "1988-01-01", is_pregnant: false, temporary_absence_reason: none}, p3: {residence_setting_type: private_dwelling, dwelling_id: h1, date_of_birth: "2018-01-01", is_full_time_secondary_student_finishing_before_nineteen: false, temporary_absence_reason: none}}, relationships: [[spouse, p1, p2], [parent, p2, p3], [stepparent, p1, p3]], expect: true}
  - {id: CO-2349-T3, title: "The spouse of a pregnant parent is mandatory (C.1.e)", as_of: "2026-10-01", given: {date_of_birth: "1985-01-01"}, others: {p2: {date_of_birth: "1988-01-01", is_pregnant: true}, p3: {date_of_birth: "2018-01-01", is_full_time_secondary_student_finishing_before_nineteen: false}}, relationships: [[spouse, p1, p2], [parent, p2, p3]], expect: false}
  - {id: "CO-2349-T4", title: "A parent of a dependent child is mandatory", as_of: "2026-10-01", given: {residence_setting_type: private_dwelling, dwelling_id: h1, date_of_birth: "1985-01-01", cw_is_optional_member_by_custody_or_support: false, temporary_absence_reason: none}, others: {p2: {residence_setting_type: private_dwelling, dwelling_id: h1, date_of_birth: "2018-01-01", is_full_time_secondary_student_finishing_before_nineteen: false, temporary_absence_reason: none}}, relationships: [[parent, p1, p2]], expect: false}
