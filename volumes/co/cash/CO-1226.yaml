id: CO-1226
name: "Burial assistance: legally responsible persons are a couple"
identifier: af_burial_responsible_persons_are_couple
kind: derived
type: yes/no
scope: person
program: AdultFinancial
meaning: "The decedent's legally responsible persons are a couple (for example both parents of an unemancipated minor), so the SSI couple resource limit applies; false when there is one legally responsible person, including a widow or widower, to whom the individual limit applies, per 9 CCR 2503-5 3.570.43.D.3.b."
derived: [">=", ["+", ["count", "af_burial_legally_responsible_persons"], "af_burial_responsible_persons_outside_case_count"], 2]
precision: "Coverage pass 6 CA6-7: the number of responsible persons outside the case is required (0 when there are none; decision 4 of 2026-11-23); before, read as 0 when not stated."
sources: [S721, S722]
implemented: engine
tags: [cash, resources]
rationale: "No existing fact distinguished this; af_burial_responsible_person_excess_resources (CO-1229) needs it to pick the limit. Dual-entry audit 1.9: the resources of the decedent's spouse or parents, and whether they are a couple, were entered on the decedent, restating the decedent's spouse and parent relationships. The legally responsible persons are now read from the relationships (3.570.42, S722) and their own countable resources; only responsible persons outside the case are stated. The ID is kept; the identifier takes the af_ prefix."
tests:
  - {id: "CO-1226-T1", as_of: "2026-11-01", given: {af_burial_legally_responsible_persons: [p2], af_burial_responsible_persons_outside_case_count: 0}, expect: false}
  - {id: "CO-1226-T2", as_of: "2026-11-01", given: {af_burial_legally_responsible_persons: [p2, p3], af_burial_responsible_persons_outside_case_count: 0}, expect: true}
  - {id: CO-1226-T3, as_of: "2026-11-01", given: {af_burial_legally_responsible_persons: [p2], af_burial_responsible_persons_outside_case_count: 1}, expect: true}
  # Coverage pass 6 CA6-7: the number of responsible persons outside the case is required (0 when none).
  - {id: "CO-1226-T4", title: "Coverage pass 6 CA6-7: outside count not stated: cannot determine", as_of: "2026-10-01", given: {af_burial_legally_responsible_persons: []}, expect: unknown}
