  - {"id": "CO-1438-T7", "month": "2026-10", "as_of": "2026-10-01", "title": "T-9: af_verification_due_date equal to [\"det_date\"] (det_date at or under af_verification_due_date)", "given": {"determination_date": "2026-10-05", "date_of_birth": "1950-01-01", "af_pending_verification_count": 2, "af_verification_due_date": "2026-10-05"}, "expect": "pending"}
