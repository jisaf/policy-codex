id: CO-1438
name: "Adult Financial: verification status"
identifier: af_verification_status
kind: derived
type: one of
options: [not_applicable, complete, pending, past_due]
scope: person-month
program: AdultFinancial
role: outcome
meaning: "Where this client's Adult Financial verification stands: not applicable (under the Old Age Pension age and without an SSI, blindness or disability basis for Aid to the Needy Disabled or Aid to the Blind); complete; pending before the eleven-day due date, or while the only elements outstanding are the AND-SO medical certification within its thirty days and the proof of an SSA or other benefit application within its own period (eleven days from the SSA application, or the AND-SO sixty days of conditional approval); or past due, after which the county may deny for failure to return verifications."
precision: "The AND-SO certification's thirty days run \"following the interview\" (3.541.1.A.1.b): they are counted from af_interview_date (CO-2005), read as the verification request date when the case does not state it (OQ-375 resolved). Final cash review FC-9: the proof of application of 3.520.71.C has its own period (af_benefit_application_verification_due_date, CO-3870), read as the medical certification's is."
derived: [case, [[not, af_verification_is_applicable], not_applicable], [["=", af_pending_verification_count, 0], complete], [["<=", [det_date], af_verification_due_date], pending], [["=", ["-", ["-", af_pending_verification_count, [case, [[all, af_and_so_disability_verification_is_pending, ["<=", [det_date], af_and_so_disability_certification_due_date]], 1], [else, 0]]], [case, [[all, af_benefit_application_verification_is_pending, ["<=", [det_date], af_benefit_application_verification_due_date]], 1], [else, 0]]], 0], pending], [else, past_due]]
sources: [S879, S1080]
implemented: engine
tags: [verification, cash, oap, and]
rationale: "No existing item reported an Adult Financial client's verification standing. Fix round: not_applicable on categorical reach (review C-4) and the AND-SO certification period (K-6)."
tests:
  - {id: CO-1438-T1, month: "2026-10", as_of: "2026-10-01", given: {date_of_birth: "1990-01-01", receives_ssi: false, is_blind: false, af_and_so_disability_met: false, claims_disability: false}, expect: not_applicable}
  - {id: CO-1438-T2, month: "2026-10", as_of: "2026-10-01", given: {date_of_birth: "1950-01-01", af_pending_verification_count: 0}, expect: complete}
  - {id: CO-1438-T3, month: "2026-10", as_of: "2026-10-01", given: {determination_date: "2026-10-05", date_of_birth: "1950-01-01", af_pending_verification_count: 2, af_verification_due_date: "2026-10-12"}, expect: pending}
  - {id: CO-1438-T4, month: "2026-10", as_of: "2026-10-01", given: {determination_date: "2026-10-20", date_of_birth: "1990-01-01", receives_ssi: false, is_blind: false, af_and_so_disability_met: false, claims_disability: true, af_pending_verification_count: 1, af_verification_due_date: "2026-10-12", af_and_so_disability_verification_is_pending: true, verification_request_date: "2026-10-01"}, expect: pending}
  - {id: CO-1438-T5, month: "2026-10", as_of: "2026-10-01", given: {determination_date: "2026-10-20", date_of_birth: "1950-01-01", af_pending_verification_count: 1, af_verification_due_date: "2026-10-12", af_and_so_disability_verification_is_pending: false, verification_request_date: "2026-10-01"}, expect: past_due}
  - {id: CO-1438-T6, title: "OQ-375: the thirty days for the AND-SO medical examination run from the interview, here before the request", month: "2026-10", as_of: "2026-10-01", given: {determination_date: "2026-10-20", date_of_birth: "1990-01-01", receives_ssi: false, is_blind: false, af_and_so_disability_met: false, claims_disability: true, af_pending_verification_count: 1, af_verification_due_date: "2026-10-12", af_and_so_disability_verification_is_pending: true, verification_request_date: "2026-10-01", af_interview_date: "2026-09-01"}, expect: past_due}
