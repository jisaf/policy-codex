id: CO-4008
name: "Adult Financial: a transfer in the month counts as a transfer without fair consideration"
identifier: af_twfc_transfer_is_counted
kind: derived
type: yes/no
scope: person-month
program: AdultFinancial
meaning: "Whether the person transferred a resource in the month for less than its fair value (resource_transfer_uncompensated_value more than 0) that is a transfer without fair consideration under 9 CCR 2503-5 3.520.76.A: the county has not found it not to be one (af_transfer_found_not_twfc), and it was made within the af_twfc_lookback_months months before the application date (A.3) or after it, while the client applies for or receives grant payments."
precision: "The thirty-six months end on the application date: a transfer in a month after the month thirty-six months before the application month is within them; one in that month is within them when made on the application's day of the month or later (resource_transfer_date), and one in an earlier month is not. A transfer after the application is made while applying or receiving."
derived: [all, [">", [otherwise, resource_transfer_uncompensated_value, 0], 0], [not, [otherwise, af_transfer_found_not_twfc, false]], [any, [">", [month], [months_before, af_twfc_lookback_months, [month_of, af_application_date]]], [all, ["=", [month], [months_before, af_twfc_lookback_months, [month_of, af_application_date]]], [">=", [days_between, [first_day, [month]], resource_transfer_date], [days_between, [first_day, [month_of, af_application_date]], af_application_date]]]]]
sources: [S2614, S2615]
implemented: engine
tags: [cash, resources]
rationale: "Final cash review 2, N-5: the transfers are now stated by month, so whether a month's transfer is within the look-back and not excused is its own item, read by af_twfc_penalty_months (CO-3840) and af_is_in_twfc_penalty_period (CO-3841). The test is the one CO-3840 applied to the single stated transfer."
tests:
  - {id: CO-4008-T1, title: "A $5,000 gift in December 2025, application October 2026", as_of: "2026-10-01", month: "2025-12", given: {af_application_date: "2026-10-01", resource_transfer_uncompensated_value: {"2025-12": 5000}, resource_transfer_date: {"2025-12": "2025-12-15"}}, expect: true}
  - {id: CO-4008-T2, title: "Transfer on 2023-10-01, application 2026-10-01: exactly thirty-six months, within", as_of: "2026-10-01", month: "2023-10", given: {af_application_date: "2026-10-01", resource_transfer_uncompensated_value: {"2023-10": 2064}, resource_transfer_date: {"2023-10": "2023-10-01"}}, expect: true}
  - {id: CO-4008-T3, title: "Transfer on 2023-10-01, application 2026-10-15: before the thirty-six months", as_of: "2026-10-15", month: "2023-10", given: {af_application_date: "2026-10-15", resource_transfer_uncompensated_value: {"2023-10": 2064}, resource_transfer_date: {"2023-10": "2023-10-01"}}, expect: false}
  - {id: CO-4008-T4, title: "The county found the transfer involuntary (a foreclosure, C.2)", as_of: "2026-10-01", month: "2025-12", given: {af_application_date: "2026-10-01", resource_transfer_uncompensated_value: {"2025-12": 5000}, resource_transfer_date: {"2025-12": "2025-12-15"}, af_transfer_found_not_twfc: {"2025-12": true}}, expect: false}
  - {id: CO-4008-T5, title: "No transfer in the month", as_of: "2026-10-01", month: "2025-12", given: {}, expect: false}
