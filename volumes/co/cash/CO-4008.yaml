id: CO-4008
name: "Adult Financial: a transfer in the month counts as a transfer without fair consideration"
identifier: af_twfc_transfer_is_counted
kind: derived
type: yes/no
scope: person-month
program: AdultFinancial
meaning: "Whether the person transferred, in the month, a resource for less than its fair value that is a transfer without fair consideration under 9 CCR 2503-5 3.520.76.A: a holdings record disposed of in the month (disposed_date) whose uncompensated value (its equity times the person's share, less what the person received for it) is more than 0, that the county has not found not to be one (af_found_not_twfc), made within the af_twfc_lookback_months months before the application date (A.3) or after it, while the client applies for or receives grant payments."
precision: "The thirty-six months end on the application date: a transfer in a month after the month thirty-six months before the application month is within them; in that month, a transfer made on the application's day of the month or later is (the latest transfer of the month is read with P58 largest). A transfer after the application is made while applying or receiving. Resource records, step H1 Adult Financial (docs/reviews/records-holdings-snap-af.md): one transfer is one holdings record, in place of the month-scoped facts (resource_transfer_uncompensated_value, resource_transfer_date, af_transfer_found_not_twfc); the county's finding not stated is read as no: 3.520.76.A.4.a makes \"a rebuttable presumption\" that a transfer in the thirty-six months was made to become eligible, which stands until the county finds otherwise (as before). A person whose holdings are not stated is cannot determine (decision 4); before, a month with no transfer facts was read as no transfer. Transfer facts stated without a month were read in every month before step H1; a record is read in the month of its disposed_date only (CO-434). Field sweep defaults list (2026-11-23): af_found_not_twfc is read as the holdings record states it, its default false declared once on the schema (CO-5300) with the rule that gives it (9 CCR 2503-5 3.520.76.A.4.a (S2614): the county presumes a transfer in the look-back was made to become eligible); before, this reader gave the default itself (otherwise false), which conventions rule 12 and decision 4 do not allow a reader. No value changes: the tests that leave the finding out read it as false, as before."
derived: ["all", [">", ["sum_receipts", "holdings", ["all", ["not", ["unknown", ["receipt", "disposed_date"]]], ["=", ["month_of", ["receipt", "disposed_date"]], ["month"]], ["not", ["receipt", "af_found_not_twfc"]], [">", ["max", 0, ["-", ["*", ["-", ["receipt", "value"], ["receipt", "amount_owed"]], ["otherwise", ["receipt", "share"], 1]], ["receipt", "compensation_received"]]], 0]], ["max", 0, ["-", ["*", ["-", ["receipt", "value"], ["receipt", "amount_owed"]], ["otherwise", ["receipt", "share"], 1]], ["receipt", "compensation_received"]]]], 0], ["any", [">", ["month"], ["months_before", "af_twfc_lookback_months", ["month_of", "af_application_date"]]], ["all", ["=", ["month"], ["months_before", "af_twfc_lookback_months", ["month_of", "af_application_date"]]], [">=", ["largest", "holdings", ["all", ["not", ["unknown", ["receipt", "disposed_date"]]], ["=", ["month_of", ["receipt", "disposed_date"]], ["month"]], ["not", ["receipt", "af_found_not_twfc"]], [">", ["max", 0, ["-", ["*", ["-", ["receipt", "value"], ["receipt", "amount_owed"]], ["otherwise", ["receipt", "share"], 1]], ["receipt", "compensation_received"]]], 0]], ["days_between", ["first_day", ["month"]], ["receipt", "disposed_date"]]], ["days_between", ["first_day", ["month_of", "af_application_date"]], "af_application_date"]]]]]
sources: [S2614, S2615]
implemented: engine
tags: [cash, resources]
rationale: "Final cash review 2, N-5: the transfers are now stated by month, so whether a month's transfer is within the look-back and not excused is its own item, read by af_twfc_penalty_months (CO-3840) and af_is_in_twfc_penalty_period (CO-3841). The test is the one CO-3840 applied to the single stated transfer."
tests:
  - {id: CO-4008-T1, title: "A $5,000 gift in December 2025, application October 2026", as_of: "2026-10-01", month: "2025-12", given: {af_application_date: "2026-10-01", holdings: [{kind: other_resource, value: 5000, amount_owed: 0, compensation_received: 0, disposed_date: "2025-12-15"}]}, expect: true}
  - {id: CO-4008-T2, title: "Transfer on 2023-10-01, application 2026-10-01: exactly thirty-six months, within", as_of: "2026-10-01", month: "2023-10", given: {af_application_date: "2026-10-01", holdings: [{kind: other_resource, value: 2064, amount_owed: 0, compensation_received: 0, disposed_date: "2023-10-01"}]}, expect: true}
  - {id: CO-4008-T3, title: "Transfer on 2023-10-01, application 2026-10-15: before the thirty-six months", as_of: "2026-10-15", month: "2023-10", given: {af_application_date: "2026-10-15", holdings: [{kind: other_resource, value: 2064, amount_owed: 0, compensation_received: 0, disposed_date: "2023-10-01"}]}, expect: false}
  - {id: CO-4008-T4, title: "The county found the transfer involuntary (a foreclosure, C.2)", as_of: "2026-10-01", month: "2025-12", given: {af_application_date: "2026-10-01", holdings: [{kind: other_resource, value: 5000, amount_owed: 0, compensation_received: 0, disposed_date: "2025-12-15", af_found_not_twfc: true}]}, expect: false}
  - {id: CO-4008-T5, title: "No transfer in the month (holdings stated, none disposed of)", as_of: "2026-10-01", month: "2025-12", given: {af_application_date: "2026-10-01", holdings: []}, expect: false}
