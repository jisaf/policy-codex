id: CO-5653
name: "Colorado Works: basic cash assistance received in the month"
identifier: cw_basic_cash_assistance_receipts
kind: derived
type: money
scope: person-month
program: ColoradoWorks
meaning: "The Colorado Works basic cash assistance paid to this person in the month, other than a retroactive payment for earlier months (the receipts of kind colorado_works_cash that are not retroactive): what the rules that ask whether the person receives basic cash assistance in a month read (no diversion grant in a month of basic cash assistance, 9 CCR 2503-6 3.606.8.A.7; a deceased client who received Colorado Works, 3.606.7.B.1)."
precision: "Receipt records, migration phase 2 (docs/reviews/receipts-migration-2-cw.md): replaces tanf_cash_income for these two readers, each of which reads a payment not stated as none (cw_diversion_eligible, CO-1270; cw_is_deceased_client, CO-1504), as before receipt records and as Adult Financial's grant tests do (af_grant_receipts, CO-5019; docs/reviews/receipts-migration-1.md section 4). It is not income to the unit (cw_receipt_treatment_table: not_income_to_unit)."
derived: [sum_receipts, receipts, [all, ["=", [receipt, kind], colorado_works_cash], [received_in, [month]], [not, [receipt, retroactive]]], [receipt, amount]]
sources: [S762, S1005]
implemented: engine
tags: [cash, tanf]
rationale: "Receipt records, migration phase 2: the month's basic cash assistance read from the receipts, once, for the two Colorado Works rules that test receipt of the grant. Adult Financial's grant, SSI and Home Care Allowance sums (af_grant_receipts, af_ssi_receipts, af_home_care_allowance_receipts; CO-5019, CO-5018, CO-5023) are the same pattern for that program's own payments; programs do not share a receipt sum (product-owner decision of 2026-11-23)."
nearest: [CO-5018, CO-5019, CO-5023]
tests:
  - {id: CO-5653-T1, month: "2026-10", as_of: "2026-10-15", given: {receipts: [{kind: colorado_works_cash, amount: 488}, {kind: colorado_works_cash, amount: 244, frequency: once, retroactive: true, month: "2026-10"}]}, title: "The month's grant; a retroactive underpayment correction is not the month's assistance", expect: 488}
  - {id: CO-5653-T2, month: "2026-10", as_of: "2026-10-15", given: {receipts: [{kind: social_security, amount: 900}]}, title: "No Colorado Works payment", expect: 0}
