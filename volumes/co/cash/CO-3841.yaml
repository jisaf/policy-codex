id: CO-3841
name: "Adult Financial: in a period of ineligibility for a transfer"
identifier: af_is_in_twfc_penalty_period
kind: derived
type: yes/no
scope: person-month
program: AdultFinancial
meaning: "Whether the month falls in the person's period of ineligibility for transfers without fair consideration (9 CCR 2503-5 3.520.76.D.5): each transfer's months (af_twfc_penalty_months) begin with the month after the month of the transfer or, where an earlier transfer's period is still running, with the month after that period ends, so the month is in the period when, for some month with a counted transfer before it, the months of ineligibility of the transfers from that month through the month before this one are at least the number of months from that month to this one."
precision: "Final cash review 2, N-5: D.5 says the period for further transfers 'would begin the month following the end date of the first transfer's period of ineligibility'; a transfer made after an earlier period has ended starts its own period the month after it, since a period cannot begin before the transfer it is for. The months examined begin af_twfc_lookback_months months before the application month (af_application_date, required where a transfer is stated before the month: af_twfc_transfer_is_counted, CO-4008, reads it too). False when there is no penalty. A month in the period may also be a month of ineligibility for another reason (E). Example: transfers of $2,064 in January 2026 (2 months) and $3,096 in February 2026 (3 months) by an OAP client: February to June 2026. Coverage pass 6 CA6-7 (docs/reviews/coverage6-cash.md): with no holding disposed of before the month there is no transfer and no period, whatever the look-back; otherwise the application date is required (decision 4 of 2026-11-23); before, the determination month stood for an unstated application date, which moved the look-back."
derived: ["case", [["=", ["sum_receipts", "holdings", ["all", ["not", ["unknown", ["receipt", "disposed_date"]]], ["<", ["month_of", ["receipt", "disposed_date"]], ["month"]]], 1], 0], false], ["else", [">", ["sum_months", ["months_from_to", ["months_before", "af_twfc_lookback_months", ["month_of", "af_application_date"]], ["month_before", ["month"]]], ["case", [["all", ["at", "af_twfc_transfer_is_counted", ["that_month"]], [">=", ["sum_months", ["months_from_to", ["that_month"], ["month_before", ["month"]]], ["at", "af_twfc_penalty_months", ["that_month"]]], ["count_months", ["months_from_to", ["month_after", ["that_month"]], ["month"]], true]]], 1], ["else", 0]]], 0]]]
sources: [S2614, S2806]
implemented: engine
tags: [cash, resources]
rationale: "Final cash review FC-6: 9 CCR 2503-5 3.520.76 (S2614) and C.R.S. 26-2-111(1)(c) (S2615) make a transfer without fair consideration within thirty-six months before the application, or while receiving, a ground of ineligibility for a period set by the uncompensated value, and nothing in the volume stated it, so a client in a penalty period was found eligible. af_category (CO-953) and af_and_so_eligible (CO-1203) read this item in every branch. Final cash review 2, N-5: with the transfers stated by month, the periods of several transfers follow one another (D.5)."
tests:
  # Coverage pass 6 CA6-7: the holdings state the transfers the stubbed months stand for, since the look-back reads the application date only when a holding was disposed of before the month.
  - {id: "CO-3841-T1", title: "Transfer in December 2025, 4 months: January to April 2026 - April is in the period", as_of: "2026-04-10", month: "2026-04", given: {af_application_date: "2026-04-01", af_twfc_transfer_is_counted: {2025-12: true}, af_twfc_penalty_months: {2025-12: 4}, holdings: [{kind: other_resource, value: 1000, amount_owed: 0, compensation_received: 0, disposed_date: "2025-12-15"}]}, expect: true}
  - {id: "CO-3841-T2", title: "May 2026 is after the period", as_of: "2026-05-10", month: "2026-05", given: {af_application_date: "2026-04-01", af_twfc_transfer_is_counted: {2025-12: true}, af_twfc_penalty_months: {2025-12: 4}, holdings: [{kind: other_resource, value: 1000, amount_owed: 0, compensation_received: 0, disposed_date: "2025-12-15"}]}, expect: false}
  - {id: "CO-3841-T3", title: "The month of the transfer is not in the period (D.5)", as_of: "2025-12-20", month: "2025-12", given: {af_application_date: "2025-12-20", af_twfc_transfer_is_counted: {2025-12: true}, af_twfc_penalty_months: {2025-12: 4}, holdings: [{kind: other_resource, value: 1000, amount_owed: 0, compensation_received: 0, disposed_date: "2025-12-15"}]}, expect: false}
  - {id: CO-3841-T4, title: "No transfer", as_of: "2026-10-01", month: "2026-10", given: {holdings: []}, expect: false}
  # Final cash review 2, N-5: several transfers.
  - {id: CO-3841-T5, title: "N-5: two $1,000 gifts by an OAP client, in March and May 2026 - 0 + 0 months, so April is not in a period (the total, floor(2000 / 1032) = 1, gave April)", as_of: "2026-07-01", month: "2026-04", given: {af_application_date: "2026-07-01", date_of_birth: "1950-01-01", holdings: [{kind: bank_account}, {kind: other_resource, value: 1000, amount_owed: 0, compensation_received: 0, disposed_date: "2026-03-10"}, {kind: other_resource, value: 1000, amount_owed: 0, compensation_received: 0, disposed_date: "2026-05-10"}]}, expect: false}
  - {id: "CO-3841-T6", title: "N-5: 2 months for January and 3 for February 2026 - the periods run February to June; June is in it", as_of: "2026-07-01", month: "2026-06", given: {af_application_date: "2026-07-01", af_twfc_transfer_is_counted: {2026-01: true, 2026-02: true}, af_twfc_penalty_months: {2026-01: 2, 2026-02: 3}, holdings: [{kind: other_resource, value: 1000, amount_owed: 0, compensation_received: 0, disposed_date: "2026-01-15"}, {kind: other_resource, value: 1000, amount_owed: 0, compensation_received: 0, disposed_date: "2026-02-15"}]}, expect: true}
  - {id: "CO-3841-T7", title: "N-5: the same transfers - July is after the periods", as_of: "2026-07-01", month: "2026-07", given: {af_application_date: "2026-07-01", af_twfc_transfer_is_counted: {2026-01: true, 2026-02: true}, af_twfc_penalty_months: {2026-01: 2, 2026-02: 3}, holdings: [{kind: other_resource, value: 1000, amount_owed: 0, compensation_received: 0, disposed_date: "2026-01-15"}, {kind: other_resource, value: 1000, amount_owed: 0, compensation_received: 0, disposed_date: "2026-02-15"}]}, expect: false}
  - {id: "CO-3841-T8", title: "N-5: 2 months for a January transfer and 3 for one in August - the second period runs September to November; April and December are free, October is in it", as_of: "2026-10-01", month: "2026-10", given: {af_application_date: "2026-10-01", af_twfc_transfer_is_counted: {2026-01: true, 2026-08: true}, af_twfc_penalty_months: {2026-01: 2, 2026-08: 3}, holdings: [{kind: other_resource, value: 1000, amount_owed: 0, compensation_received: 0, disposed_date: "2026-01-15"}, {kind: other_resource, value: 1000, amount_owed: 0, compensation_received: 0, disposed_date: "2026-08-15"}]}, expect: true}

  # Coverage pass 6 CA6-7: no holding disposed of before the month: no period, whatever the application date (3.520.76.A.3, D.5);
  # a holding disposed of in September 2026 with the application date not stated: the look-back cannot be placed (decision 4).
  - {id: "CO-3841-T9", title: "Coverage pass 6 CA6-7: no transfer stated, application date not stated: no period", as_of: "2026-10-01", month: "2026-10", given: {holdings: [{kind: bank_account, value: 500}]}, expect: false}
  - {id: "CO-3841-T10", title: "A holding given away in September 2026, the application date not stated: cannot determine (decision 4)", as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "1950-01-01", holdings: [{kind: other_resource, value: 3000, amount_owed: 0, compensation_received: 0, disposed_date: "2026-09-10"}]}, expect: unknown}