id: CO-942
name: "Adult Financial: meets residency requirement"
identifier: af_meets_residency
kind: derived
type: yes/no
scope: person-month
program: AdultFinancial
meaning: Whether the person is a resident of Colorado and not barred from Adult Financial programs as a fleeing felon or as an inmate of a city, municipal, county, State or Federal correctional institution, per C.R.S. 26-2-111(1)(a) and 9 CCR 2503-5 3.520.61.B, 3.520.64.A-B, 3.532.E.1, 3.543.E.1 and 3.548.E.1.
precision: "Reads state_of_residence directly, the same as ma_meets_residency (CO-505); adds the 3.520.61.B fleeing-felon and inmate exclusions, which the Medicaid residency test does not carry, so this item's derivation is not identical to CO-505's. Incarceration is read from is_inmate_of_public_institution (CO-1105), whose meaning carves out CHP+'s 90-day reentry period; the Adult Financial bar has no such carve-out, so a person in that period is under-barred here until the vocabulary review's R-14 makes the shared fact plain incarceration. Scope changed from person to person-month (phase-8 fix round, K-2) because incarceration is a monthly fact; every reader is person-month. Vocabulary fix round (R-6): the fleeing-felon bar reads is_fleeing_felon (CO-038) alone; 3.520.61.B does not name probation or parole violators."
derived: [all, [=, state_of_residence, colorado_state_code], [not, is_fleeing_felon], [not, is_inmate_of_public_institution]]
sources: [S441, S449, S450, S711, S1008, S1009, S1010]
implemented: engine
tags: [cash, oap, and, ab, household]
rationale: "No existing item states Adult Financial residency. af_category (CO-953) needs it. Reuses colorado_state_code (CO-184) rather than a bare literal, the same as ma_meets_residency (CO-505); acknowledged as a similar-shaped test to CO-505, but not identical to it because 3.520.61.B's fleeing-felon and inmate exclusions have no Medicaid counterpart in this volume. Phase-8 fix round (K-2): adds the inmate bar of 3.520.61.B and 3.532.E.1/3.543.E.1/3.548.E.1 ('Inmates in a penal institution' are not eligible for a PNA or a grant)."
nearest: [CO-505]
tests:
  - {id: CO-942-T1, as_of: "2026-10-01", month: "2026-10", given: {state_of_residence: "CO", is_fleeing_felon: false, is_inmate_of_public_institution: false}, expect: true}
  - {id: CO-942-T2, as_of: "2026-10-01", month: "2026-10", given: {state_of_residence: "WY", is_fleeing_felon: false}, expect: false}
  - {id: CO-942-T3, as_of: "2026-10-01", month: "2026-10", given: {state_of_residence: "CO", is_fleeing_felon: true}, expect: false}
  - {id: CO-942-T4, title: "K-2 - inmate of a correctional institution (3.520.61.B)", as_of: "2026-10-01", month: "2026-10", given: {state_of_residence: "CO", is_fleeing_felon: false, is_inmate_of_public_institution: true}, expect: false}
  - {id: CO-942-T5, title: "Vocabulary fix round (R-6): a probation violator who is not a fleeing felon is not barred (3.520.61.B names fleeing felons)", as_of: "2026-10-01", month: "2026-10", given: {state_of_residence: "CO", is_fleeing_felon: false, is_probation_or_parole_violator: true, is_inmate_of_public_institution: false}, expect: true}
