id: CO-942
name: "Adult Financial: meets residency requirement"
identifier: af_meets_residency
kind: derived
type: yes/no
scope: person-month
program: AdultFinancial
meaning: "Whether the person is a resident of Colorado and not barred from Adult Financial programs as a fleeing felon or as an inmate of a city, municipal, county, State or Federal correctional institution, and does not receive, for the month, a payment of financial assistance from another State (3.520.64.B.2), per C.R.S. 26-2-111(1)(a) and 9 CCR 2503-5 3.520.61.B, 3.520.64.A-B, 3.532.E.1, 3.543.E.1 and 3.548.E.1."
precision: "Reads state_of_residence directly, the same as is_colorado_resident (CO-505); adds the 3.520.61.B fleeing-felon and inmate exclusions, which the Medicaid residency test does not carry, so this item's derivation is not identical to CO-505's. Incarceration is read from af_is_inmate_of_correctional_institution (CO-3343), Adult Financial's own bar on a city, municipal, county, State or Federal correctional institution (same-word audit SW-21; final cash review FC-16 corrected this sentence, which had named is_inmate_of_public_institution, CO-1105); CHP+'s 90-day reentry carve-out is CHP+'s own fact, so the Adult Financial bar has no carve-out, as 3.520.61.B states. Scope changed from person to person-month (phase-8 fix round, K-2) because incarceration is a monthly fact; every reader is person-month. Vocabulary fix round (R-6): the fleeing-felon bar reads is_fleeing_felon (CO-038) alone; 3.520.61.B does not name probation or parole violators. Vocabulary fix round (docs/reviews/vocabulary-reuse.md, U-4): state residence reads is_colorado_resident (CO-505) instead of restating the comparison. Final cash review FC-9: 3.520.64.B.2 (S2620) bars a month in which another State pays the person financial assistance; received_financial_assistance_from_another_state_this_month (CO-3859) states it, read as false when not stated. Coverage review F-1: a client temporarily out of State stays a resident unless the absence creates 3.520.64.E's rebuttable presumption and the client has not rebutted it (af_is_presumed_nonresident_by_absence, CO-4401; S3201). Coverage pass 6 CA6-7 (docs/reviews/coverage6-cash.md): whether the client received financial assistance from another State in the month (3.520.64.B.2) is required (decision 4 of 2026-11-23); before, read as false when not stated."
derived: ["all", "is_colorado_resident", ["not", "af_is_presumed_nonresident_by_absence"], ["not", "is_fleeing_felon"], ["not", "af_is_inmate_of_correctional_institution"], ["not", "received_financial_assistance_from_another_state_this_month"]]
sources: [S441, S449, S450, S711, S1008, S1009, S1010, S2620, S3201]
open: [OQ-1436]
implemented: engine
tags: [cash, oap, and, ab, household]
rationale: "No existing item states Adult Financial residency. af_category (CO-953) needs it. Reuses colorado_state_code (CO-184) rather than a bare literal, the same as is_colorado_resident (CO-505); acknowledged as a similar-shaped test to CO-505, but not identical to it because 3.520.61.B's fleeing-felon and inmate exclusions have no Medicaid counterpart in this volume. Phase-8 fix round (K-2): adds the inmate bar of 3.520.61.B and 3.532.E.1/3.543.E.1/3.548.E.1 ('Inmates in a penal institution' are not eligible for a PNA or a grant). Same-word SW-21: reads Adult Financial's own correctional-institution bar (CO-3343, 3.520.61.B), not 435.1010's inmate of a public institution."
nearest: [CO-505]
