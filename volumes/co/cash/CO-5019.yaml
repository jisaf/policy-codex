id: CO-5019
name: "Adult Financial: a person's grant receipts"
identifier: af_grant_receipts
kind: derived
type: money
scope: person-month
program: AdultFinancial
meaning: "The Adult Financial grant payments (Old Age Pension, Aid to the Needy Disabled, Aid to the Blind; not the Home Care Allowance, af_home_care_allowance_receipts) the person received in the month, other than a retroactive lump sum: the receipt of a grant that 3.532.B.3, 3.534.C, 3.570.43.A.1 and 3.570.52 ask about, and a relative's or sponsor's income (3.534.C)."
precision: "Field sweep fix round (docs/reviews/field-sweep-snap-cash-nonmagi.md, FS-AF-1): a stream (a receipt with no month and no date) is read only in the months from the month of its start_date through the month of its end_date, as SNAP's readers read it (snap_counted_recurring_receipts, CO-5011), since \"All income shall be countable in the month it is actually received or legally becomes available\" (9 CCR 2503-5 3.520.781.G, S4910): a pension that ended, or one not yet begun, is received in no month outside those dates; a receipt stated with its month or date is read in that month. Before, a stream was read in every month whatever its dates."
derived: ["sum_receipts", "receipts", ["all", ["=", ["lookup", "af_receipt_treatment_table", ["receipt", "kind"]], "not_income_to_client"], ["not", ["receipt", "retroactive"]], ["all", ["received_in", ["month"]], ["any", ["not", ["unknown", ["receipt", "month"]]], ["all", ["any", ["unknown", ["receipt", "start_date"]], ["<=", ["month_of", ["receipt", "start_date"]], ["month"]]], ["any", ["unknown", ["receipt", "end_date"]], [">=", ["month_of", ["receipt", "end_date"]], ["month"]]]]]]], ["receipt", "amount"]]
sources: [S2608, S3500, S4910]
implemented: engine
tags: [cash, income]
rationale: "Receipt records, migration phase 1: the grant receipt the Adult Financial rules read, from the receipts, replacing their read of adult_financial_cash_income (CO-1713)."
nearest: [CO-5023]
tests:
  - {id: CO-5019-T1, month: "2026-10", as_of: "2026-10-15", given: {receipts: [{kind: adult_financial_cash, amount: 452}]}, title: "An OAP grant of $452", expect: 452}
  # Field sweep fix round (FS-AF-1): hand-computed from 9 CCR 2503-5 3.520.781.G (S4910): a stream is received only from the month of its start_date through the month of its end_date.
  - {"id": "CO-5019-T2", "month": "2027-02", "as_of": "2027-02-15", "title": "An OAP grant of $452 beginning 2027-03-01, read for February: 0; the month's grant is what is received in the month", "given": {"receipts": [{"kind": "adult_financial_cash", "amount": 452, "start_date": "2027-03-01"}]}, "expect": 0}
