id: CO-7603
name: "Adult Financial: the client's spouse in the month"
identifier: af_spouses_in_month
kind: derived
type: group of persons
scope: person-month
program: AdultFinancial
meaning: "The persons of the case who are this client's spouse in the month evaluated: a spouse (the spouse relationship) or a partner in a civil union (the civil_union_partner relationship), since \"Marriage\" in these rules includes a civil union (9 CCR 2503-5 3.510), who had not died before the month's first day. A client whose spouse died before the month is widowed in it (9 CCR 2503-5 3.520.63.A.3), so the spouse's income is not deemed (3.534, 3.544.D-F, 3.549.C-F) and the spouse's resources are not counted with the client's (3.520.72.A) for that month."
precision: "Pattern sweep (cash) PS-M1 (docs/reviews/pattern-sweep-cash.md): the Adult Financial couple readers took every person with a spouse edge as the client's spouse in every month, so a spouse who died during the months a determination covers still had income deemed and resources counted, and the client kept the couple's resource limit and the split $20, in the months after the death. A spouse who is not a person of the case is read through marital_status (af_is_married, CO-7308). Whether a person is a spouse is read from the client's relationships, stated (an empty list where there is none): a client whose relationships are not stated cannot be determined (decision 4 of 2026-11-23; pattern sweep PS-D4), except in a case of one person, who has no other person to be married to. KL-CASH-3 (docs/reviews/known-limits.md, 2026-11-24): 3.510 (S5321): \"“Marriage” (for the purpose of these rules) means a marriage as defined in Section 14-2-104(1), C.R.S., a common law marriage as defined in Section 14-2-104(2), C.R.S., and a civil union, as defined in Section 14-15-103(1), C.R.S.\" A partner in a civil union who is a person of the case is the client's spouse here, read exactly as a spouse of the case is (deemed, counted with the client, widowed after a death before the month); before, the civil_union_partner edge was read by LEAP alone, and a client in a civil union was read as unmarried. The other programs' readings of a civil union are unchanged (SNAP's 4.000.1, S5320: a civil union is \"without the legal recognition of these individuals as spouses\")."
derived: [case, [["=", [count, [persons]], 1], [filter, [persons], false]], [else, [filter, [persons], [all, [rel, [spouse, civil_union_partner], [P]], [any, [unknown, [of, [P], date_of_death]], [">=", [of, [P], date_of_death], [first_day, [month]]]]]]]]
sources: [S2626, S3204, S1632, S1636, S5321]
implemented: engine
tags: [cash, oap, and, household]
rationale: "Pattern sweep (cash), PS-M1 and PS-D4: eleven Adult Financial items filtered the persons of the case by the spouse edge, each with its own default for unstated relationships and none with the spouse's death; one group per month, read by each."
tests:
  # Pattern sweep (cash) PS-M1: 3.520.63.A (S2626) married or widowed; the husband dies on 2026-09-20, determined 2026-10-15.
  - {id: "CO-7603-T1", title: "Pattern sweep PS-M1: September, the husband alive on its first day: her spouse", as_of: "2026-10-15", month: "2026-09", given: {}, others: {p2: {date_of_death: "2026-09-20"}}, relationships: [[spouse, p1, p2]], expect: [p2]}
  - {id: "CO-7603-T2", title: "PS-M1: October, he died before its first day: widowed, no spouse", as_of: "2026-10-15", month: "2026-10", given: {}, others: {p2: {date_of_death: "2026-09-20"}}, relationships: [[spouse, p1, p2]], expect: []}
  - {id: "CO-7603-T3", title: "A living husband: her spouse in every month", as_of: "2026-10-15", month: "2026-10", given: {}, others: {p2: {}}, relationships: [[spouse, p1, p2]], expect: [p2]}
  - {id: "CO-7603-T4", title: "PS-D4: a case of one person: no spouse among its persons, whether or not relationships are stated", as_of: "2026-10-15", month: "2026-10", given: {}, expect: []}
  - {id: "CO-7603-T5", title: "PS-D4: two persons, the client's relationships not stated: cannot determine (decision 4; was read as no spouse)", as_of: "2026-10-15", month: "2026-10", given: {}, others: {p2: {}}, expect: unknown}
  # KL-CASH-3: 9 CCR 2503-5 3.510 (S5321): "Marriage" includes a civil union; a partner in a civil union who is a person of the case is read as a spouse of the case is.
  - {id: "CO-7603-T6", title: "KL-CASH-3: a living partner in a civil union (civil_union_partner edge): her spouse (was no spouse)", as_of: "2026-10-15", month: "2026-10", given: {}, others: {p2: {}}, relationships: [[civil_union_partner, p1, p2]], expect: [p2]}
  - {id: "CO-7603-T7", title: "KL-CASH-3, PS-M1: the partner in a civil union died on 2026-09-20, before October's first day: no spouse in October", as_of: "2026-10-15", month: "2026-10", given: {}, others: {p2: {date_of_death: "2026-09-20"}}, relationships: [[civil_union_partner, p1, p2]], expect: []}
  - {id: "CO-7603-T8", title: "KL-CASH-3, PS-M1: the same partner in September, alive on its first day: her spouse", as_of: "2026-10-15", month: "2026-09", given: {}, others: {p2: {date_of_death: "2026-09-20"}}, relationships: [[civil_union_partner, p1, p2]], expect: [p2]}
  - {id: "CO-7603-T9", title: "KL-CASH-3: a person who lives with the client as a spouse with neither a marriage nor a civil union (holds_out_as_spouse_with) is not her spouse", as_of: "2026-10-15", month: "2026-10", given: {}, others: {p2: {}}, relationships: [[holds_out_as_spouse_with, p1, p2]], expect: []}
