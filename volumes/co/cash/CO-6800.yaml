id: CO-6800
name: "Adult Financial: benefits conditional on school attendance counted above the expenses of attendance"
identifier: af_school_attendance_benefits_counted
kind: derived
type: money
scope: person-month
program: AdultFinancial
meaning: "The part of this person's benefits conditional upon school attendance that Adult Financial counts for the month: the U.S. Department of Veterans Affairs educational assistance (G.I. Bill) payments and other military or veterans benefits paid only while the person attends school, \"to the extent that they exceed expenses necessary for school attendance\" (9 CCR 2503-5 3.520.785.B.16). The benefits are the receipts Adult Financial's counting table treats as counted_beyond_school_expenses (the G.I. Bill housing and food allowance and the benefits paid only on condition of attendance); educational loans and grants are exempt (3.520.786.G). The expenses are school_attendance_expenses_paid (CO-4662), taken from these benefits only, never below zero."
precision: "Coverage pass 4 CA4-2 (docs/reviews/coverage4-cash.md): the table excluded school_attendance_conditional_benefit under G, which names loans and grants, and counted the G.I. Bill housing allowance in full; and unearned_income_offsetting_expenses (CO-4444) took the school expenses off the client's other income. The expenses are a fact of the person, which a receipt sum cannot read (docs/operators.md, P55), so they are subtracted here, from the benefits' sum; they are read only when the person has such benefits in the month, and required then (decision 4 of 2026-11-23: B.16 gives no reading for expenses not stated). As Colorado Works reads 3.605.3.A.4 (cw_school_attendance_benefits_counted, CO-5654). Field sweep fix round (docs/reviews/field-sweep-snap-cash-nonmagi.md, FS-AF-1): a stream (a receipt with no month and no date) is read only in the months from the month of its start_date through the month of its end_date, as SNAP's readers read it (snap_counted_recurring_receipts, CO-5011), since \"All income shall be countable in the month it is actually received or legally becomes available\" (9 CCR 2503-5 3.520.781.G, S4910): a pension that ended, or one not yet begun, is received in no month outside those dates; a receipt stated with its month or date is read in that month. Before, a stream was read in every month whatever its dates."
derived: ["case", [["<=", ["sum_receipts", "receipts", ["all", ["=", ["lookup", "af_receipt_treatment_table", ["receipt", "kind"]], "counted_beyond_school_expenses"], ["all", ["received_in", ["month"]], ["any", ["not", ["unknown", ["receipt", "month"]]], ["all", ["any", ["unknown", ["receipt", "start_date"]], ["<=", ["month_of", ["receipt", "start_date"]], ["month"]]], ["any", ["unknown", ["receipt", "end_date"]], [">=", ["month_of", ["receipt", "end_date"]], ["month"]]]]]]], ["receipt", "amount"]], 0], 0], ["else", ["max", 0, ["-", ["sum_receipts", "receipts", ["all", ["=", ["lookup", "af_receipt_treatment_table", ["receipt", "kind"]], "counted_beyond_school_expenses"], ["all", ["received_in", ["month"]], ["any", ["not", ["unknown", ["receipt", "month"]]], ["all", ["any", ["unknown", ["receipt", "start_date"]], ["<=", ["month_of", ["receipt", "start_date"]], ["month"]]], ["any", ["unknown", ["receipt", "end_date"]], [">=", ["month_of", ["receipt", "end_date"]], ["month"]]]]]]], ["receipt", "amount"]], "school_attendance_expenses_paid"]]]]
sources: [S3212, S2206, S4910]
implemented: engine
tags: [cash, oap, and, income]
nearest: [CO-5654]
rationale: "Coverage pass 4 CA4-2: the one rule of 3.520.785 that counts a benefit only above an expense of the person, kept apart from the counting table's rows as Colorado Works keeps its own."
tests:
  # Hand computations from 3.520.785.B.16 (S3212).
  - {id: CO-6800-T1, month: "2026-10", as_of: "2026-10-01", given: {school_attendance_expenses_paid: 200, receipts: [{kind: social_security, amount: 600}, {kind: school_attendance_conditional_benefit, amount: 800}]}, title: "Probe A3: $800 of G.I. Bill payments conditional on attendance, $200 of school expenses: 800 - 200 = 600", expect: 600}
  - {id: CO-6800-T2, month: "2026-10", as_of: "2026-10-01", given: {school_attendance_expenses_paid: 400, receipts: [{kind: gi_bill_housing_food_allowance, amount: 1500}, {kind: educational_assistance, amount: 2000}]}, title: "A $1,500 G.I. Bill housing allowance against $400 of school expenses: 1,100; the $2,000 grant is exempt (3.520.786.G)", expect: 1100}
  - {id: CO-6800-T3, month: "2026-10", as_of: "2026-10-01", given: {school_attendance_expenses_paid: 900, receipts: [{kind: school_attendance_conditional_benefit, amount: 300}]}, title: "Expenses above the benefits: nothing counts, never below zero", expect: 0}
  - {id: CO-6800-T4, month: "2026-10", as_of: "2026-10-01", given: {receipts: [{kind: social_security, amount: 600}]}, title: "No such benefits: the expenses are not asked", expect: 0}
  - {id: CO-6800-T5, month: "2026-10", as_of: "2026-10-01", given: {receipts: [{kind: school_attendance_conditional_benefit, amount: 800}]}, title: "Benefits, the expenses of attendance not stated: cannot determine (decision 4)", expect: unknown}
  # Field sweep fix round (FS-AF-1): hand-computed from 9 CCR 2503-5 3.520.781.G (S4910): a stream is received only from the month of its start_date through the month of its end_date.
  - {"id": "CO-6800-T6", "month": "2026-10", "as_of": "2026-10-01", "title": "$800 of G.I. Bill payments that ended 2026-08-31 (the term over), $200 of school expenses: none received in October, 0", "given": {"school_attendance_expenses_paid": 200, "receipts": [{"kind": "school_attendance_conditional_benefit", "amount": 800, "end_date": "2026-08-31"}]}, "expect": 0}
