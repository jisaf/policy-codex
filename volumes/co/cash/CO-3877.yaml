id: CO-3877
name: "Adult Financial: eligible for disaster assistance"
identifier: af_disaster_assistance_eligible
kind: derived
type: yes/no
scope: person-month
program: AdultFinancial
role: outcome
meaning: "Whether the client may receive an Adult Financial disaster assistance payment for the month (9 CCR 2503-5 3.570.52): the client requested it, has an emergent need related to the disaster, a declared disaster is in effect, and the client is approved for or receiving an Adult Financial grant payment (an OAP, AND-SO or AND-CS category, a Home Care Allowance, or a grant received this month)."
precision: "A client who has not requested it is not eligible, and nothing else is asked. The county may also pay through general assistance (3.570.52.D); that is not this payment."
derived: [all, [otherwise, af_has_requested_disaster_assistance, false], has_emergent_need_from_disaster, [otherwise, declared_disaster_in_effect, false], [any, [">", [otherwise, adult_financial_cash_income, 0], 0], [not, ["=", af_category, none]], ["=", af_hca_eligibility_status, eligible]]]
sources: [S2624]
implemented: engine
tags: [cash]
rationale: "Final cash review FC-10: 9 CCR 2503-5 3.570.5 (S2624) provides a disaster assistance payment of up to $2,000 per client per disaster to a client approved for or receiving an Adult Financial grant during a declared disaster, and it had no item, outcome or open question. It is modeled as Colorado Works diversion is: eligibility, and the amount the county approves within the maximum. "
tests:
  - {id: CO-3877-T1, title: "OAP client after a flood, emergent need, requested", as_of: "2026-10-01", month: "2026-10", given: {af_has_requested_disaster_assistance: true, has_emergent_need_from_disaster: true, declared_disaster_in_effect: true, af_category: oap}, expect: true}
  - {id: CO-3877-T2, title: "No declared disaster", as_of: "2026-10-01", month: "2026-10", given: {af_has_requested_disaster_assistance: true, has_emergent_need_from_disaster: true, declared_disaster_in_effect: false}, expect: false}
  - {id: CO-3877-T3, title: "Not an Adult Financial client", as_of: "2026-10-01", month: "2026-10", given: {af_has_requested_disaster_assistance: true, has_emergent_need_from_disaster: true, declared_disaster_in_effect: true, adult_financial_cash_income: 0, af_category: none, af_hca_eligibility_status: ineligible_financial}, expect: false}
  - {id: CO-3877-T4, title: "No request", as_of: "2026-10-01", month: "2026-10", given: {}, expect: false}
