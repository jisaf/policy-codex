  - {id: CO-4400-T3, title: "Every sponsor has died (3.520.69.B.5): the one sponsor died on August 1, before October (pattern sweep PS-M2: read per month from the sponsor's date of death)", as_of: "2026-10-01", month: "2026-10", given: {immigration_status: lawful_permanent_resident, is_sponsored_non_citizen: true, qualifying_quarters: 0, status_before_lpr_adjustment: none}, others: {p2: {date_of_death: "2026-08-01"}}, relationships: [[sponsored_by, p1, p2]], expect: false}
