id: CO-2583
name: "Colorado Works: verification applies to this person"
identifier: cw_verification_is_applicable
kind: derived
type: yes/no
scope: person-month
program: ColoradoWorks
meaning: "Colorado Works verification applies to this person: the person's assistance unit has a dependent child or a pregnant member, so Colorado Works can reach it. For anyone else Colorado Works' verification status is not_applicable and no Colorado Works element is pending."
precision: "The test that cw_verification_status (CO-1427) used for its not_applicable branch, made its own item so that every Colorado Works pending element and count reads it: an element is pending only where verification applies (county case worker review B2)."
derived: [exists, cw_assistance_unit_members, [any, [of, [P], cw_is_dependent_child], [of, [P], is_pregnant]]]
sources: [S871, S872, S1064]
implemented: engine
tags: [cash, tanf, verification]
rationale: "County case worker review B2: Colorado Works pending flags and counts were non-zero for people whose Colorado Works verification status is not_applicable, so a checklist built from the flags asked for documents a program cannot use."
nearest: [CO-1427]
tests:
  - {id: CO-2583-T1, title: "A grandmother alone, no child, not pregnant", as_of: "2026-10-01", month: "2026-10", given: {cw_assistance_unit_members: [p1], cw_is_dependent_child: false, is_pregnant: false}, expect: false}
  - {id: CO-2583-T2, title: "A unit with a dependent child", as_of: "2026-10-01", month: "2026-10", given: {cw_assistance_unit_members: [p1, p2], cw_is_dependent_child: false, is_pregnant: false}, others: {p2: {cw_is_dependent_child: true, is_pregnant: false}}, expect: true}
