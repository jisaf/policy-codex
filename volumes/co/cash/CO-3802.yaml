id: CO-3802
name: "Colorado Works: is an institution patient or inmate"
identifier: cw_is_institution_patient_or_inmate
kind: derived
type: yes/no
scope: person
program: ColoradoWorks
meaning: "Whether 9 CCR 2503-6 3.604.1.D-E bars this person as a Colorado Works client: the person is admitted to an institution as a patient for tuberculosis or mental disease (a tuberculosis or psychiatric hospital, or another institution whose overall character is the care of persons with mental diseases), unless the person is a dependent child receiving \"under 21\" psychiatric care under Medicaid; or the person is in the custody of or confined in a correction facility as an inmate, other than a person on work release or under a court monitoring system."
precision: "Read from the neutral setting facts (residence_setting_type, CO-3330; residence_setting_is_primarily_for_mental_diseases, CO-3332). If residence_setting_type is not stated, Colorado Works reads the person as living in a private dwelling. A dependent child in a psychiatric setting who is enrolled in Medical Assistance (is_enrolled_in_medical_assistance, CO-2435) is read as receiving the \"under 21\" psychiatric benefit; a tuberculosis hospital is not psychiatric care. A patient in a public medical institution is not an inmate (E): the setting is then a hospital, not a correctional facility. Such a person is not counted in the unit's size (cw_assistance_unit_members_for_size, CO-2351) and reads ineligible_institution (cw_eligibility_status, CO-921); whether the person is still in the home is the absence rule's (cw_is_considered_living_in_home, CO-3354; OQ-660)."
derived: [any, [all, [any, [in, [otherwise, residence_setting_type, private_dwelling], [psychiatric_hospital, tuberculosis_hospital]], [all, [in, [otherwise, residence_setting_type, private_dwelling], [hospital, nursing_facility, assisted_living_residence, group_home, other_long_term_care_facility, substance_use_treatment_facility, child_care_institution, other_institution]], residence_setting_is_primarily_for_mental_diseases]], [not, [all, cw_is_dependent_child, [not, ["=", [otherwise, residence_setting_type, private_dwelling], tuberculosis_hospital]], is_enrolled_in_medical_assistance]]], [all, ["=", [otherwise, residence_setting_type, private_dwelling], correctional_facility], [not, [otherwise, is_in_work_release_or_court_monitoring, false]]]]
sources: [S2600]
implemented: engine
open: [OQ-660]
tags: [cash, tanf, household]
rationale: "Final cash review FC-1: 3.604.1.D-E (S2600) state that a Colorado Works client must not be an institution patient for tuberculosis or mental disease or an inmate, and no item read it. Medicaid's institution for mental diseases (is_patient_in_institution_for_mental_diseases, CO-1104) has a bed-count test D does not state, and ma_oap_is_patient_in_tb_or_mental_health_institution (CO-1748) is the OAP Health Care Program's own item, so Colorado Works has its own over the same neutral setting facts. The inmate test differs from 42 CFR 435.1010's (CO-1105) and from Adult Financial's government-operated correctional institution (CO-3343): E names custody in a county, state or federal correction facility and excepts work release and court monitoring."
tests:
  - {id: CO-3802-T1, title: "A parent living at home", as_of: "2026-10-01", given: {residence_setting_type: private_dwelling}, expect: false}
  - {id: CO-3802-T2, title: "A parent in a psychiatric hospital (D)", as_of: "2026-10-01", given: {residence_setting_type: psychiatric_hospital, date_of_birth: "1990-01-01"}, expect: true}
  - {id: CO-3802-T3, title: "A 15-year-old in a psychiatric hospital, enrolled in Medicaid: the under-21 exception (D)", as_of: "2026-10-01", given: {residence_setting_type: psychiatric_hospital, date_of_birth: "2011-01-01", is_enrolled_in_medical_assistance: true}, expect: false}
  - {id: CO-3802-T4, title: "A parent in a nursing facility that is not for mental diseases", as_of: "2026-10-01", given: {residence_setting_type: nursing_facility, residence_setting_is_primarily_for_mental_diseases: false}, expect: false}
  - {id: CO-3802-T5, title: "A parent serving a jail sentence (E)", as_of: "2026-10-01", given: {residence_setting_type: correctional_facility}, expect: true}
  - {id: CO-3802-T6, title: "A parent on work release is not an inmate (E)", as_of: "2026-10-01", given: {residence_setting_type: correctional_facility, is_in_work_release_or_court_monitoring: true}, expect: false}
  - {id: CO-3802-T7, title: "Setting not stated: read as a private dwelling", as_of: "2026-10-01", given: {}, expect: false}
