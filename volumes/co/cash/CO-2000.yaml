id: CO-2000
name: "Colorado Works: needs deducted in minor-parent deeming"
identifier: cw_minor_parent_deeming_needs_deduction
kind: derived
type: money
scope: person
program: ColoradoWorks
meaning: "For an unmarried minor parent, the needs deducted from her non-participant parents' countable income before it is deemed to her assistance unit under 9 CCR 2503-6 3.605.1.A.4.a: the needs of the parent or parents living in the home and of the individuals in the home for whom they are responsible, measured as the Colorado Works need standard for a unit of those parents and the parents' other children in the home - the One Caretaker row for one parent, the Two Caretakers row for two, keyed by the number of other children."
precision: "The parents are the persons of whom this person is a child (a stated parent edge, read as living in the home, as cw_deemed_parent_income_of_minor_parent, CO-909, reads it). The individuals the parents are responsible for are this person's siblings and half siblings in the case (P43, shared parent), excluding this person herself, whose needs her own assistance unit meets; her own child is not her parent's child. No sibling is a member of the minor parent's assistance unit under cw_assistance_unit_members (CO-900), which does not cross the edge to her parent, so none is excluded on that ground. A stepparent of the minor parent, or another person a parent supports, is not counted. Above ten children the chart's each-additional amount is added. Same-word audit SW-2: the siblings are siblings (CO-2609), the persons who share a legal parent."
assumption: "3.605.1.A.4.a deducts \"the needs\" without naming a dollar measure; the need standard of 3.606.1.F for a unit of that composition is read as the measure (OQ-102: the measure is a choice the text leaves; the people counted are what the text states)."
derived: [case, [[">=", [count, [filter, [persons], [rel, [child], [P]]]], 2], [case, [["<=", [count, siblings], 10], [lookup, cw_need_standard_table_two_caretakers, [count, siblings]]], [else, [+, [lookup, cw_need_standard_table_two_caretakers, 10], ["*", cw_need_standard_each_additional, ["-", [count, siblings], 10]]]]]], [else, [case, [["<=", [count, siblings], 10], [lookup, cw_need_standard_table, [count, siblings]]], [else, [+, [lookup, cw_need_standard_table, 10], ["*", cw_need_standard_each_additional, ["-", [count, siblings], 10]]]]]]]
sources: [S413, S1307]
open: [OQ-102]
implemented: engine
tags: [cash, tanf, income, household]
rationale: "cw_deemed_parent_income_of_minor_parent (CO-909) deducted only the need standard for the parent alone (the One Caretaker value for zero children); 3.605.1.A.4.a (S1307) also deducts the needs of the individuals in the home for whom the parent is responsible, and with two parents in the home one joint figure avoids deducting the same children twice. The need-standard tables (CO-274, CO-353) are the figures; no existing item computes the size of the group whose needs are deducted."
tests:
  - {id: CO-2000-T1, title: "One parent with no other child in the home: the parent alone (One Caretaker, zero children)", as_of: "2026-10-01", given: {date_of_birth: "2009-04-08"}, others: {p2: {date_of_birth: "2026-02-03"}, p3: {date_of_birth: "1985-01-22"}}, relationships: [[parent, p1, p2], [parent, p3, p1]], expect: 253}
  - {id: CO-2000-T2, title: "One parent with another child in the home: One Caretaker, one child", as_of: "2026-10-01", given: {date_of_birth: "2009-04-08"}, others: {p2: {date_of_birth: "2026-02-03"}, p3: {date_of_birth: "1985-01-22"}, p4: {date_of_birth: "2016-06-01"}}, relationships: [[parent, p1, p2], [parent, p3, p1], [parent, p3, p4]], expect: 331}
  - {id: CO-2000-T3, title: "Two parents and two other children: Two Caretakers, two children", as_of: "2026-10-01", given: {date_of_birth: "2009-04-08"}, others: {p2: {date_of_birth: "2026-02-03"}, p3: {date_of_birth: "1985-01-22"}, p4: {date_of_birth: "2016-06-01"}, p5: {date_of_birth: "1983-03-03"}, p6: {date_of_birth: "2012-02-02"}}, relationships: [[parent, p1, p2], [parent, p3, p1], [parent, p5, p1], [parent, p3, p4], [parent, p5, p4], [parent, p3, p6], [parent, p5, p6]], expect: 533}
