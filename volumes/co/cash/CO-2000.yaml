id: CO-2000
name: "Colorado Works: needs deducted in minor-parent deeming"
identifier: cw_minor_parent_deeming_needs_deduction
kind: derived
type: money
scope: person
program: ColoradoWorks
meaning: "For an unmarried minor parent, the needs deducted from her non-participant parents' countable income before it is deemed to her assistance unit under 9 CCR 2503-6 3.605.1.A.4.a: the needs of the parent or parents living in the home and of the individuals in the home for whom they are responsible, measured as the Colorado Works need standard for a unit of those parents and the parents' other children in the home - the One Caretaker row for one parent, the Two Caretakers row for two, keyed by the number of other children."
precision: "Coverage pass 2 (CW2-2): the parents are the ones whose income is deemed, cw_minor_parent_deemed_parents (CO-4660): her parents who are not members of her assistance unit and live in the same home (S3155); a parent living elsewhere, or one who joined her unit (3.604.2.C.2.g), is neither deemed nor counted here, so one such parent takes the One Caretaker row. The individuals they are responsible for are this person's siblings and half siblings (P43, shared parent) who are the child of one of those parents (has_relative_in), live in the same home (lives_with, read as living together where no dwelling is stated; cw_is_considered_living_in_home, CO-3354) and are not members of her assistance unit, whose needs it meets; this person herself is excluded, and her own child is not her parent's child. A stepparent of the minor parent, or another person a parent supports, is not counted. Above ten children the chart's each-additional amount is added. Same-word audit SW-2: the siblings are siblings (CO-2609), the persons who share a legal parent."
assumption: "3.605.1.A.4.a deducts \"the needs\" without naming a dollar measure; the need standard of 3.606.1.F for a unit of that composition is read as the measure (OQ-102: the measure is a choice the text leaves; the people counted are what the text states)."
derived: [case, [[">=", [count, cw_minor_parent_deemed_parents], 2], [lookup_extended, cw_need_standard_table_two_caretakers, [count, [filter, siblings, [all, [has_relative_in, [child], cw_minor_parent_deemed_parents], [not, [in_group, [P], cw_assistance_unit_members]], [in_group, [P], lives_with], [of, [P], cw_is_considered_living_in_home]]]], cw_need_standard_each_additional]], [else, [lookup_extended, cw_need_standard_table, [count, [filter, siblings, [all, [has_relative_in, [child], cw_minor_parent_deemed_parents], [not, [in_group, [P], cw_assistance_unit_members]], [in_group, [P], lives_with], [of, [P], cw_is_considered_living_in_home]]]], cw_need_standard_each_additional]]]
sources: [S413, S1307, S3155]
open: [OQ-102]
implemented: engine
tags: [cash, tanf, income, household]
rationale: "cw_deemed_parent_income_of_minor_parent (CO-909) deducted only the need standard for the parent alone (the One Caretaker value for zero children); 3.605.1.A.4.a (S1307) also deducts the needs of the individuals in the home for whom the parent is responsible, and with two parents in the home one joint figure avoids deducting the same children twice. The need-standard tables (CO-274, CO-353) are the figures; no existing item computes the size of the group whose needs are deducted."
