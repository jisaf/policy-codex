id: CO-1203
name: "Adult Financial: meets AND-SO eligibility"
identifier: af_and_so_eligible
kind: derived
type: yes/no
scope: person-month
program: AdultFinancial
meaning: Whether the person meets every eligibility criterion of Aid to the Needy Disabled - State Only for the month - age 18 through 59 (0 through 59 if blind), total disability, not approved for SSI or SSDI, citizenship or qualified non-citizen status with the five-year bar, Colorado residency, the resource limit, and countable income below the AND-SO grant standard, and not barred by Colorado Works (3.520.61.F) - per 9 CCR 2503-5 3.520.61, 3.520.71.A, 3.540 and 3.544.
precision: "The conjuncts are exactly af_category's former and_so branch (CO-953), lifted into an item so the Home Care Allowance's financial test (3.570.13.B.2, 'Meet all eligibility criteria required for Aid to the Needy Disabled - State Only (AND-SO) program') reads the same test af_category does. See OQ-138 (SSDI recipients excluded) and OQ-151 (the SSI application duty of 3.520.71.B is not a conjunct)."
derived: [all, [<=, age, af_and_max_age], [any, [">=", age, af_and_so_min_age], is_blind], af_and_so_disability_met, [not, receives_social_security_disability], [not, receives_ssi], af_meets_citizenship_requirement_and, af_meets_residency, af_meets_resource_limit, [<, af_countable_income, af_and_so_grant_standard], [not, af_barred_by_colorado_works]]
sources: [S705, S709, S711, S714, S1011]
open: [OQ-138, OQ-151, OQ-357]
implemented: engine
tags: [cash, and, disability]
rationale: "Phase-8 fix round (K-3): adds the Colorado Works bar of 3.520.61.F (af_barred_by_colorado_works, CO-1511), so the Home Care Allowance AND-SO route reads it too. No existing item states AND-SO eligibility on its own; af_category (CO-953) tested it inline. The Home Care Allowance's financial test (af_hca_financially_eligible, CO-1215) needs the same test, so it is lifted here and af_category now reads it, rather than restating the conjuncts twice."
nearest: [CO-953]
