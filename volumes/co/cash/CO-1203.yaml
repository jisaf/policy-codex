id: CO-1203
name: "Adult Financial: meets AND-SO eligibility"
identifier: af_and_so_eligible
kind: derived
type: yes/no
scope: person-month
program: AdultFinancial
meaning: Whether the person meets every eligibility criterion of Aid to the Needy Disabled - State Only for the month - age af_and_so_min_age through af_and_max_age (any age through af_and_max_age if blind), total disability, not approved for SSI or SSDI, has applied for SSI (and SSDI with a work history) and appealed any SSI denial (3.520.71.B), citizenship or qualified non-citizen status with the five-year bar, Colorado residency, the resource limit, and countable income below the AND-SO grant standard, the substance-abuse conditions of 3.541.3 where the certification identifies substance abuse, not in a period of ineligibility for a transfer without fair consideration (3.520.76), not found to have failed to apply for other benefits (3.520.61.G), and not barred by Colorado Works (3.520.61.F) - per 9 CCR 2503-5 3.520.61, 3.520.71.A, 3.540 and 3.544.
precision: "The conjuncts are exactly af_category's former and_so branch (CO-953), lifted into an item so the Home Care Allowance's financial test (3.570.13.B.2, 'Meet all eligibility criteria required for Aid to the Needy Disabled - State Only (AND-SO) program') reads the same test af_category does. See OQ-138 (SSDI recipients excluded) and OQ-151 (the SSI application duty of 3.520.71.B is not a conjunct). Vocabulary fix round (R-5): 'not approved for SSDI' reads receives_ssdi (CO-1727), not SNAP's disability-payment fact. Final cash review FC-6, FC-7 and FC-9: adds af_and_so_meets_substance_abuse_conditions (CO-3849; 3.541.3, C.R.S. 26-2-111(4)(e)-(f)), af_is_in_twfc_penalty_period (CO-3841) and af_has_failed_to_apply_for_other_benefits (CO-3860), each read as met when its facts are not stated; the Home Care Allowance's AND-SO route reads them too. Coverage review F-13: a patient in an institution for tuberculosis or mental diseases, or in a medical institution for tuberculosis or psychosis, is barred by C.R.S. 26-2-111(1)(d) (af_and_is_barred_as_institution_patient, CO-4446). F-14: an IPV disqualification (af_is_serving_ipv_disqualification, CO-4447; 3.583.N), an EBT-misuse ineligibility period (af_is_in_ebt_misuse_ineligibility_period, CO-4448; 3.581.I.3) and an unsigned IM-14 (af_im14_signed, CO-4449; 3.545.A.2, 3.520.4.C.5.a) each bar AND-SO; the first two are read as false and the IM-14 as signed when not stated. Coverage review 2, G-4: not for a month that begins after date_of_death (3.581.C.1-2, S3502). Coverage pass 4 CA4-15: the ages are taken in the month evaluated, 59 or younger on its first day  and 18 or older on its last , with eligibility beginning on the day the client meets all requirements (3.542.B, af_partial_month_payment_factor); before, the determination date's age was read in every month (OQ-951). Coverage pass 4 CA4-16: the signed IM-14 (af_im14_signed) is required, never read as signed when not stated (3.545.A.2: \"As a condition of eligibility for AND-SO the client shall be required to sign the IM-14\"; decision 4 of 2026-11-23: missing information is cannot determine unless the rule says otherwise). Pattern sweep (cash) PS-T12 (docs/reviews/pattern-sweep-cash.md): the SSI bar is SSI received in the month (af_receives_ssi_in_month, CO-7605; 3.554.C.6: AND-SO issued in the month SSI is received is recovered), so an applicant whose SSI began after the application month is not barred for the application month. SSDI (receives_ssdi) is still the determination date's: the volume states no date for a title II award (the review lists it)."
derived: [all, ["<=", [years_between, date_of_birth, [first_day, [month]]], af_and_max_age], [any, [">=", [years_between, date_of_birth, [days_after, -1, [first_day, [month_after, [month]]]]], af_and_so_min_age], is_blind], af_and_so_disability_met, [not, receives_ssdi], [not, af_receives_ssi_in_month], af_has_met_and_so_benefit_application_duty, meets_public_assistance_citizenship_requirement, af_meets_residency, af_meets_resource_limit, ["<", af_countable_income, af_and_so_grant_standard], af_and_so_meets_substance_abuse_conditions, [not, af_is_in_twfc_penalty_period], [not, [otherwise, af_has_failed_to_apply_for_other_benefits, false]], [not, af_barred_by_colorado_works], [not, af_and_is_barred_as_institution_patient], [not, [otherwise, af_is_serving_ipv_disqualification, false]], [not, [otherwise, af_is_in_ebt_misuse_ineligibility_period, false]], af_im14_signed, [not, [all, [not, [unknown, date_of_death]], ["<", date_of_death, [first_day, [month]]]]]]
sources: [S705, S709, S710, S711, S2611, S4382, S714, S1011, S1315, S2614, S2616, S2617, S2621, S3213, S3214, S3215, S3216, S3502, S4794]
implemented: engine
tags: [cash, and, disability]
open: [OQ-138, OQ-783, OQ-1436]
rationale: "Phase-8 fix round (K-3): adds the Colorado Works bar of 3.520.61.F (af_barred_by_colorado_works, CO-1511), so the Home Care Allowance AND-SO route reads it too. No existing item states AND-SO eligibility on its own; af_category (CO-953) tested it inline. The Home Care Allowance's financial test (af_hca_financially_eligible, CO-1215) needs the same test, so it is lifted here and af_category now reads it, rather than restating the conjuncts twice."
