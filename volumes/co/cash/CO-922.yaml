id: CO-922
name: "Colorado Works: payment countable earned income"
identifier: cw_payment_countable_earned_income
kind: derived
type: money
scope: person-month
program: ColoradoWorks
meaning: This person's gross earned income for the month less the earned income disregard that determines the payment amount, floored at zero, per 9 CCR 2503-6 3.606.2.A - cw_new_earnings_disregard_rate at application and through the unit's first certification period (A.1) or for a new source of earned income in the first certification period that the income impacts (A.2.a); cw_earned_income_disregard_rate for a current source after the first certification period (A.1, last sentence; A.2.b). The figure the grant payment is computed from; distinct from the cw_earned_income_disregard_dollar eligibility test at application, which cw_countable_earned_income (CO-907) carries.
precision: "Applies the disregard to every person's own earned income, the same assumption cw_countable_earned_income (CO-907) states for cw_earned_income_disregard_dollar, since 3.606.2.A reads 'gross wages for clients' without an adult-only limitation. A unit not yet receiving (receives_tanf_cash false) is at application, whose payment A.1 computes with cw_new_earnings_disregard_rate for the first certification period. For a unit currently receiving, neither cw_in_first_certification_period (CO-1501) nor cw_is_new_earned_income_source (CO-1502) has a default: a case must state which situation a person's earnings fall in; a person with no earned income needs neither, since nothing is disregarded from zero. A person whose month mixes a new and a current source states the new part as cw_new_source_earned_income (CO-2374): that part takes cw_new_earnings_disregard_rate and the rest cw_earned_income_disregard_rate (phase-10 sweep, OQ-350). Vocabulary fix round (R-1): earned income is cw_gross_earned_income (CO-1716): gross wages plus the self-employment net profit 3.605.2.E.1.c treats as earned income; it had read wages only."
derived: [max, 0, ["-", cw_gross_earned_income, [case, [[<=, cw_gross_earned_income, 0], 0], [[not, receives_tanf_cash], ["*", cw_gross_earned_income, cw_new_earnings_disregard_rate]], [cw_in_first_certification_period, ["*", cw_gross_earned_income, cw_new_earnings_disregard_rate]], [[not, [unknown, cw_new_source_earned_income]], ["+", ["*", cw_new_source_earned_income, cw_new_earnings_disregard_rate], ["*", ["-", cw_gross_earned_income, cw_new_source_earned_income], cw_earned_income_disregard_rate]]], [cw_is_new_earned_income_source, ["*", cw_gross_earned_income, cw_new_earnings_disregard_rate]], [else, ["*", cw_gross_earned_income, cw_earned_income_disregard_rate]]]]]
sources: [S1000, S1019]
implemented: engine
tags: [cash, tanf, income]
rationale: "No existing item states the payment-computation earned income disregard; cw_countable_earned_income (CO-907) is the nearest same-shape item (an earned-income disregard derivation) but implements the $90 eligibility-test figure at application, per the phase-5 review's C-1 finding that the payment is computed on a different, larger disregard than the eligibility test. cw_payment_countable_income (CO-923) needs this per-person figure. Phase-8 fix round (B-1): the item applied 67% in every month, which is the Cornell copy's pre-June 2023 text (S416, D-61); the current 3.606.2.A (S1000, D-81, amended effective 2023-06-01 per S1019) disregards 100% in the first certification period and for a new source."
nearest: [CO-907]
tests:
  - {id: CO-922-T1, title: "Current source after the first certification period - 67% disregarded (3.606.2.A.2.b)", as_of: "2026-10-01", month: "2026-10", given: {receipts: [], wages_gross: 400, self_employment_gross_receipts: 0, receives_tanf_cash: true, cw_in_first_certification_period: false, cw_is_new_earned_income_source: false}, expect: 132}
  - {id: CO-922-T2, as_of: "2026-10-01", month: "2026-10", title: "No earnings - neither period fact is read", given: {receipts: [], wages_gross: 0, self_employment_gross_receipts: 0}, expect: 0}
  - {id: CO-922-T3, title: "First certification period - 100% disregarded (3.606.2.A.1)", as_of: "2026-10-01", month: "2026-10", given: {receipts: [], wages_gross: 400, self_employment_gross_receipts: 0, receives_tanf_cash: true, cw_in_first_certification_period: true}, expect: 0}
  - {id: CO-922-T4, title: "New source in an ongoing case - 100% disregarded (3.606.2.A.2.a)", as_of: "2026-10-01", month: "2026-10", given: {receipts: [], wages_gross: 400, self_employment_gross_receipts: 0, receives_tanf_cash: true, cw_in_first_certification_period: false, cw_is_new_earned_income_source: true}, expect: 0}
  - {id: CO-922-T5, title: "At application - the payment for the first certification period disregards 100% (3.606.2.A.1)", as_of: "2026-10-01", month: "2026-10", given: {receipts: [], wages_gross: 400, self_employment_gross_receipts: 0, receives_tanf_cash: false}, expect: 0}
  # Phase-10 sweep (OQ-350): $600 from a continuing job and $400 from a new one - 600 x 0.33 = 198 counts, the new $400 is wholly disregarded.
  - {id: CO-922-T6, as_of: "2026-10-01", month: "2026-10", given: {cw_gross_earned_income: 1000, receives_tanf_cash: true, cw_in_first_certification_period: false, cw_new_source_earned_income: 400}, expect: 198}
