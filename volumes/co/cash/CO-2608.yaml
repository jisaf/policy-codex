id: CO-2608
name: "Colorado Works: persons of whom this person is the caretaker"
identifier: cw_caretaker_of
kind: derived
type: group of persons
scope: person
program: ColoradoWorks
meaning: "The persons of whom this person is the parent or non-parent caretaker of 9 CCR 2503-6 3.601 (a dependent child \"resides with a parent or non-parent caretaker\", S406) and 3.604.2.C (S408): read from the neutral roles parent (natural or adoptive), legal_guardian and has_primary_responsibility_for."
precision: "Same-word audit SW-1/SW-3 (OQ-396 resolved): the spouse of a parent who is not a parent is not a caretaker here; 3.604.2.C.2.a makes that person an optional member (cw_is_optional_assistance_unit_member, CO-2349, reads the spouse and parent roles as the rule words it), so a stepparent is not read from the stepparent role. Whether the person is a dependent child is tested by the reader. Same-word audit SW-7 (convention rule 17): an edge joins persons who live together (lives_with, CO-1925, from dwelling_id); where a case states no dwelling_id the edge is read as living together, as before. A temporary absence keeps the person in the home as Colorado Works's 3.604.2.E, G and I allow (cw_is_considered_living_in_home, CO-3354). Coverage review CW-18 (fix round 2026-11-23): when more than one person exercises responsibility for the child, the one highest in the 3.604.2.H hierarchy is the caretaker: a parent always; a legal guardian or a relative (is_related_to) with primary responsibility only when no parent is in the home (cw_parents_in_home, CO-5207); any other person with primary responsibility only when neither a parent nor such a relative or guardian is in the home (cw_relative_or_guardian_caretakers_in_home, CO-5208). Two persons of the same rank are both caretakers; H names no order within a rank. Pattern sweep (cash) PS-D2 (docs/reviews/pattern-sweep-cash.md): whether persons live together is read from lives_with as stated (dwelling_id), required where read (decision 4 of 2026-11-23; docs/conventions.md rule 17 as amended for Colorado Works and Adult Financial): no text on file says the persons of one application live together (9 CCR 2503-6 3.604.2.A, E, I build the unit from the persons living in the home; 9 CCR 2503-5 3.534.B.3 and 3.549.E name the household of the spouse and the parents in the home). Before, a person whose home was not stated was read as living with every related person of the case."
derived: [filter, [persons], [all, [rel, [parent, legal_guardian, has_primary_responsibility_for], [P]], [in_group, [P], lives_with], cw_is_considered_living_in_home, [of, [P], cw_is_considered_living_in_home], [any, [rel, [parent], [P]], [all, [any, [rel, [legal_guardian], [P]], [all, [rel, [has_primary_responsibility_for], [P]], [in_group, [P], is_related_to]]], ["=", [count, [of, [P], cw_parents_in_home]], 0]], [all, ["=", [count, [of, [P], cw_parents_in_home]], 0], ["=", [count, [of, [P], cw_relative_or_guardian_caretakers_in_home]], 0]]]]]
sources: [S406, S408, S3753]
implemented: engine
tags: [cash, tanf, household]
rationale: "Same-word audit SW-0/SW-3 and OQ-396: Colorado Works's caretaker relation becomes its own derived item over neutral roles, read by cw_has_dependent_child (CO-902), cw_is_work_eligible_individual (CO-919) and cw_meets_work_participation (CO-920). No existing item states it. Close to ma_caretaker_relative_of (CO-2606), which counts a stepparent; Colorado Works counts a legal guardian and not a stepparent. Same-word SW-7: residing with the child is read from lives_with and Colorado Works's temporary-absence rule. Coverage review CW-18 (fix round 2026-11-23): the 3.604.2.H hierarchy, deferred since the first pass, is applied here."
nearest: [CO-2606, CO-2607]
