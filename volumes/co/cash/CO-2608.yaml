  - {id: "CO-2608-T1", title: "A grandmother caring for her grandchild", as_of: "2026-10-01", given: {dwelling_id: h1, temporary_absence_reason: none, residence_setting_type: private_dwelling}, others: {p2: {dwelling_id: h1, temporary_absence_reason: none, residence_setting_type: private_dwelling}}, relationships: [[grandparent, p1, p2], [has_primary_responsibility_for, p1, p2]], expect: [p2]}
