id: CO-952
name: "Adult Financial: AND grant amount"
identifier: af_and_grant
kind: derived
type: money
scope: person-month
program: AdultFinancial
role: outcome
meaning: The monthly Aid to the Needy Disabled (or Aid to the Blind) grant payment - for an AND-SO or AND-CS client resident in a facility listed in 3.543.D or 3.548.D for the full calendar month after thirty consecutive days, only a personal needs allowance of at most $79 less countable income (3.543.D-F, 3.548.D-F); otherwise the applicable AND-SO, AND-CS, or AND-SO-standard (for "ab", per OQ-112) grant standard minus the client's total countable income, floored at zero for AND-SO and AB and raised to the AND-CS payment floor for AND-CS (3.546.C.2, E) - per 9 CCR 2503-5 3.543.B, 3.544, 3.546, 3.548.B, and 3.549.
precision: "See OQ-120 - does not model the equivalent mid-month proration rules 3.543.D.2 and 3.548.B.2 state. K-2 (phase-8 fix round): the personal needs allowance is read as a grant standard of $79 from which countable income is deducted, with no payment floor; a resident of an unlicensed private or uncertified public facility gets neither a PNA nor a grant (3.543.E.2, 3.548.E.2, af_resides_in_unlicensed_or_uncertified_facility, CO-2007; S1318); 3.548.F's rule that an AND-CS grant is not reduced until the month after the first full calendar month in the facility is carried by the supplied fact's full-month meaning, not separately (OQ-352). The Aid to the Blind branch rests on C.R.S. 26-2-111(5) alone: the current rule has no Aid to the Blind program (3.500, S1017; OQ-112 resolved), so no PNA rule reaches it. M-7: Adult Financial grants carry cents (no AF provision states a 'drop the cents' rule, unlike Colorado Works' 3.606.1.K.2, which cw_grant_amount, CO-914, implements by flooring) - deliberate, not an oversight. Phase-10 sweep (OQ-120): in the month containing af_eligibility_date (CO-2391) the grant is prorated by the days from that date through the end of the month over the days in the month (3.532.B.2, 3.543.B.2, 3.548.B.2; the day of eligibility is counted, OQ-491); a client eligible on the first, or with no date stated, gets the full grant. No rounding is stated."
derived: ["*", [case, [[in, af_category, [and_cs, and_so]], [case, [af_resides_in_unlicensed_or_uncertified_facility, 0], [resides_in_care_facility_thirty_consecutive_days, [max, 0, ["-", af_personal_needs_allowance_maximum, af_countable_income]]], [[=, af_category, "and_cs"], ["max", af_and_cs_payment_floor, ["-", af_grant_standard, af_countable_income]]], [else, ["max", 0, ["-", af_grant_standard, af_countable_income]]]]], [[=, af_category, ab], ["max", 0, ["-", af_grant_standard, af_countable_income]]], [else, 0]], [case, [[all, [not, [unknown, af_eligibility_date]], ["=", [month], [month_of, af_eligibility_date]]], ["/", [days_between, af_eligibility_date, [first_day, [month_after, [month]]]], [days_between, [first_day, [month]], [first_day, [month_after, [month]]]]]], [else, 1]]]
sources: [S458, S460, S461, S462, S464, S465, S706, S707, S708, S709, S1009, S1010, S1017, S1318, S1635]
open: [OQ-352, OQ-491]
implemented: engine
tags: [cash, and, ab, income]
rationale: "No existing item computes the AND-SO/AND-CS/AB grant amount. Named directly by the phase-5 brief's interface as an outcome. Not identical to af_oap_grant (CO-951), which tests af_category against the oap_a/oap_b group instead of and_so/and_cs/ab and would otherwise compute an AND-style grant off the OAP standard for an OAP client if this item's condition did not exclude oap_a/oap_b. Fix round (M-3): reads af_grant_standard (CO-949) instead of separately re-selecting among af_and_so_grant_standard/af_and_cs_grant_standard (for and_so/and_cs) and af_and_so_grant_standard again (for ab, per OQ-112) by category a second time, since CO-949 already performs that selection and was otherwise read by nothing - the phase-5 review's M-3 finding."
nearest: [CO-951]
