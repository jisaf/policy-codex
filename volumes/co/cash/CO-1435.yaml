id: CO-1435
name: "Adult Financial: requires verification of disability"
identifier: af_requires_verification_of_disability
kind: derived
type: yes/no
scope: person-month
program: AdultFinancial
meaning: Whether the client's SSI eligibility, the disability basis of Aid to the Needy Disabled Colorado Supplement, must be verified through SVES or SDX.
derived: [all, [not, af_is_oap_age], receives_ssi]
sources: [S533]
implemented: engine
tags: [verification, cash, and, disability]
rationale: No existing item states this Adult Financial verification requirement; the phase-9 chapter needs it to count the client's pending verifications.
tests:
  - {id: CO-1435-T1, month: "2026-10", as_of: "2026-10-01", given: {date_of_birth: "1980-01-01", receives_ssi: true}, expect: true}
  - {id: CO-1435-T2, month: "2026-10", as_of: "2026-10-01", given: {date_of_birth: "1980-01-01", receives_ssi: false}, expect: false}
