id: CO-2390
name: "Adult Financial: countable resources of the sponsor"
identifier: af_sponsor_countable_resources
kind: derived
type: money
scope: person
program: AdultFinancial
meaning: "The countable resources of this non-citizen client's sponsor(s) (9 CCR 2503-5 3.520.72.A, E): each sponsor's own countable resources (and a co-sponsor spouse's, who is a sponsor), plus those of a sponsor's spouse who did not sign, whose resources share the married sponsor's $3,000 limit; each read from that person's own ssi_countable_resources_individual."
precision: "Resources are \"attributed to the sponsor in the same manner as to the client\" (3.520.72.E); the volume's Adult Financial count for a person is the SSI-method individual figure where no Adult Financial figure is stated (af_countable_resources, CO-947)."
derived: ["+", [sum, sponsors, [of, [P], ssi_countable_resources_individual]], [sum, sponsor_spouses_not_cosigning, [of, [P], ssi_countable_resources_individual]]]
sources: [S1636]
implemented: engine
tags: [cash, resources, immigration]
rationale: "OQ-392: 3.520.72.E (S1636) deems a sponsor's countable resources over the sponsor's limit to the non-citizen client; no fact stated them.  Dual-entry audit 1.5 (audit fix round): the sponsor is a person of the case, joined to the non-citizen by the sponsor / sponsored_by relationship (volume.yaml), and the sponsor's income and resources are read from the sponsor's own facts, so two non-citizens with one sponsor read one set of facts."
tests:
  - {id: CO-2390-T1, title: "A married sponsor with $2,500 and his wife (not a co-sponsor) with $1,700", as_of: "2026-10-01", given: {}, others: {p2: {ssi_countable_resources_individual: 2500}, p3: {ssi_countable_resources_individual: 1700}}, relationships: [[sponsored_by, p1, p2], [spouse, p2, p3]], expect: 4200}
