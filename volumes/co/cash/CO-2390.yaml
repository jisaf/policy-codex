id: CO-2390
name: "Adult Financial: countable resources of the sponsor"
identifier: af_sponsor_countable_resources
kind: derived
type: money
scope: person
program: AdultFinancial
meaning: "The countable resources of this non-citizen client's sponsor(s) (9 CCR 2503-5 3.520.72.A, E): each sponsor's own countable resources (and a co-sponsor spouse's, who is a sponsor), plus those of a sponsor's spouse who did not sign, whose resources share the married sponsor's $3,000 limit; each counted \"in the same manner as the non-citizen client\" (3.520.72.E): the person's resources other than life insurance by Adult Financial's own list and exemptions (af_person_countable_resources_other_than_life_insurance), and the person's life insurance under the client's program, with \"the same exemptions\" as the client's (3.520.75.D, E.4, F.4): the OAP rule (af_life_insurance_countable_value_for_oap) for a client of OAP age, the whole cash surrender value over the face-value exemption (af_life_insurance_countable_value_other_than_oap) otherwise."
precision: "Coverage review F-15: each sponsor was counted by the SSI method (ssi_countable_resources_individual, CO-800), whose exclusions differ from Adult Financial's (an old life insurance policy exempt for an OAP client's sponsor under 3.520.75.E.4 was counted in full; revocable burial funds over $1,500 and burial spaces beyond the family's needs were not counted); now each sponsor and non-signing spouse is counted as af_client_and_spouse_countable_resources (CO-2389) counts the client and spouse. The face-value test of a sponsor's policies reads the sponsor and the sponsor's spouse, as the life insurance items read a person and spouse."
derived: ["+", [sum, sponsors, [of, [P], af_person_countable_resources_other_than_life_insurance]], [sum, sponsor_spouses_not_cosigning, [of, [P], af_person_countable_resources_other_than_life_insurance]], [case, [af_is_oap_age, ["+", [sum, sponsors, [of, [P], af_life_insurance_countable_value_for_oap]], [sum, sponsor_spouses_not_cosigning, [of, [P], af_life_insurance_countable_value_for_oap]]]], [else, ["+", [sum, sponsors, [of, [P], af_life_insurance_countable_value_other_than_oap]], [sum, sponsor_spouses_not_cosigning, [of, [P], af_life_insurance_countable_value_other_than_oap]]]]]]
sources: [S1636, S3217]
implemented: engine
tags: [cash, resources, immigration]
rationale: "OQ-392: 3.520.72.E (S1636) deems a sponsor's countable resources over the sponsor's limit to the non-citizen client; no fact stated them.  Dual-entry audit 1.5 (audit fix round): the sponsor is a person of the case, joined to the non-citizen by the sponsor / sponsored_by relationship (volume.yaml), and the sponsor's income and resources are read from the sponsor's own facts, so two non-citizens with one sponsor read one set of facts.  Coverage review F-15: counted by Adult Financial's own rules (3.520.72.E, S1636; 3.520.75.D-F, S3217) instead of the SSI method."
tests:
  - {id: CO-2390-T1, title: "A married sponsor with $2,500 and his wife (not a co-sponsor) with $1,700, no life insurance (coverage review F-15: read from Adult Financial's own count)", as_of: "2026-10-01", given: {af_is_oap_age: false}, others: {p2: {af_person_countable_resources_other_than_life_insurance: 2500, af_life_insurance_countable_value_other_than_oap: 0}, p3: {af_person_countable_resources_other_than_life_insurance: 1700, af_life_insurance_countable_value_other_than_oap: 0}}, relationships: [[sponsored_by, p1, p2], [spouse, p2, p3]], expect: 4200}
  - {id: CO-2390-T2, title: "F-15: an OAP client's unmarried sponsor with $1,000 of savings and a $10,000 policy bought in 2010 (cash value $5,000, no payments in 48 months) - exempt for the sponsor of an OAP client (3.520.75.E.1, E.4): 1,000", as_of: "2026-10-01", given: {af_is_oap_age: true}, others: {p2: {receipts: [], liquid_resources_value: 1000, life_insurance_face_value: 10000, life_insurance_cash_surrender_value: 5000, life_insurance_newest_policy_purchase_date: "2010-03-01", life_insurance_payments_in_lookback: 0, holdings: [{kind: bank_account, value: 1000}, {kind: life_insurance, value: 5000, face_value: 10000, purchase_date: "2010-03-01", premiums_in_lookback: 0}]}}, relationships: [[sponsored_by, p1, p2]], expect: 1000}
  - {id: CO-2390-T3, title: "F-15: the same sponsor of an AND client - the cash value counts (3.520.75.D): 1,000 + 5,000 = 6,000", as_of: "2026-10-01", given: {af_is_oap_age: false}, others: {p2: {receipts: [], liquid_resources_value: 1000, life_insurance_face_value: 10000, life_insurance_cash_surrender_value: 5000, holdings: [{kind: bank_account, value: 1000}, {kind: life_insurance, value: 5000, face_value: 10000}]}}, relationships: [[sponsored_by, p1, p2]], expect: 6000}
  - {id: CO-2390-T4, title: "F-15: a sponsor's $2,300 revocable prepaid burial contract - $800 over the $1,500 counts, as for the client (3.520.77.H.2): 500 + 800 = 1,300", as_of: "2026-10-01", given: {af_is_oap_age: false}, others: {p2: {receipts: [], liquid_resources_value: 500, revocable_prepaid_burial_contract_value: 2300, holdings: [{kind: bank_account, value: 500}, {kind: prepaid_burial_contract, value: 2300, irrevocable: false}]}}, relationships: [[sponsored_by, p1, p2]], expect: 1300}
