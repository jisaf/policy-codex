id: CO-2389
name: "Adult Financial: countable resources of the client and spouse"
identifier: af_client_and_spouse_countable_resources
kind: derived
type: money
scope: person
program: AdultFinancial
meaning: "The countable resources of this Adult Financial client and the client's spouse, counted and exempted under 9 CCR 2503-5 3.520.72 to 3.520.77 (Adult Financial's own list and exemptions): the client's af_person_countable_resources, and the spouse's resources other than life insurance (af_person_countable_resources_other_than_life_insurance) with the spouse's life insurance counted under the client's program: the OAP rule of 3.520.75.E-F (af_life_insurance_countable_value_for_oap) for a client of OAP age, the whole cash surrender value over the face-value exemption (af_life_insurance_countable_value_other_than_oap) otherwise."
precision: "The spouse of the case wherever the spouse lives: 3.520.72.A counts the countable resources of 'the client, spouse, and sponsor(s)' and sets the married client's limit, with no living-together condition. Final cash review 2, N-1 (confirmed with the engine): the spouse's life insurance had been read under the spouse's own age, so an OAP client of 72 whose 55-year-old spouse owned a $10,000 policy bought in 2010 (cash value $5,000, no premiums in 48 months) had $5,000 counted and was over the $3,000 couple limit; 3.520.75.E exempts \"all life insurance policies owned by a client and his or her spouse\" for OAP, so the policy is now exempt whichever spouse owns it, and an AND client's spouse's policy is counted whatever the spouse's age. Resource records, step H1 Adult Financial (docs/reviews/records-holdings-snap-af.md): each person's resources are read from that person's own holdings records through the items above (CO-4000, CO-4001, CO-4002), so the client's, the spouse's and each sponsor's holdings are counted by the same rows (3.520.72.E: \"in the same manner as the non-citizen client\")."
derived: [+, af_person_countable_resources, [sum, [filter, [persons], [otherwise, [rel, [spouse], [P]], false]], [of, [P], af_person_countable_resources_other_than_life_insurance]], [case, [["=", [count, [filter, [persons], [otherwise, [rel, [spouse], [P]], false]]], 0], 0], [af_is_oap_age, [sum, [filter, [persons], [otherwise, [rel, [spouse], [P]], false]], [of, [P], af_life_insurance_countable_value_for_oap]]], [else, [sum, [filter, [persons], [otherwise, [rel, [spouse], [P]], false]], [of, [P], af_life_insurance_countable_value_other_than_oap]]]]]
sources: [S1636, S2213, S2214, S2618]
implemented: engine
tags: [cash, resources]
rationale: "Same-word audit SW-31: every program's countable resources were a supplied, already-counted figure, so each program's resource rules lived outside the ledger, and Adult Financial fell back silently to the SSI figure when its own was unstated (OQ-392). The person's holdings are stated once by asset type; each program derives its countable resources by its own exclusions. The ID and identifier are kept; the amount is now derived from Adult Financial's own count of each spouse's holdings. Final cash review 2, N-1: the spouse's life insurance is counted under the client's program, not the spouse's."
tests:
  - {id: CO-2389-T1, as_of: "2026-10-01", given: {af_person_countable_resources: 900, af_is_oap_age: false}, others: {p2: {af_person_countable_resources_other_than_life_insurance: 500, af_life_insurance_countable_value_other_than_oap: 0}}, relationships: [[spouse, p2]], expect: 1400}
  - {id: CO-2389-T2, title: "N-1: OAP client with $1,000; the 55-year-old spouse has $1,000 and owns an old $10,000 policy worth $5,000 with no premiums in 48 months - exempt for the OAP client (3.520.75.E.1)", as_of: "2026-10-01", given: {af_person_countable_resources: 1000, af_is_oap_age: true, holdings: []}, others: {p2: {receipts: [], date_of_birth: "1971-07-22", holdings: [{kind: bank_account, value: 1000}, {kind: life_insurance, value: 5000, face_value: 10000, purchase_date: "2010-03-01", premiums_in_lookback: 0}]}}, relationships: [[spouse, p2]], expect: 2000}
  - {id: CO-2389-T3, title: "N-1: AND client with $500; the 65-year-old spouse owns the same old policy - counted in full for AND (E-F are OAP only)", as_of: "2026-10-01", given: {af_person_countable_resources: 500, af_is_oap_age: false, holdings: []}, others: {p2: {receipts: [], date_of_birth: "1961-01-10", holdings: [{kind: life_insurance, value: 5000, face_value: 10000, purchase_date: "2010-03-01", premiums_in_lookback: 0}]}}, relationships: [[spouse, p2]], expect: 5500}
