id: CO-2389
name: "Adult Financial: countable resources of the client and spouse"
identifier: af_client_and_spouse_countable_resources
kind: derived
type: money
scope: person-month
program: AdultFinancial
meaning: "The countable resources of this Adult Financial client and the client's spouse, counted and exempted under 9 CCR 2503-5 3.520.72 to 3.520.77 (Adult Financial's own list and exemptions): the client's af_person_countable_resources, and the spouse's resources other than life insurance (af_person_countable_resources_other_than_life_insurance) with the spouse's life insurance counted under the client's program: the OAP rule of 3.520.75.E-F (af_life_insurance_countable_value_for_oap) for a client of OAP age, the whole cash surrender value over the face-value exemption (af_life_insurance_countable_value_other_than_oap) otherwise."
precision: "The spouse of the case wherever the spouse lives: 3.520.72.A counts the countable resources of 'the client, spouse, and sponsor(s)' and sets the married client's limit, with no living-together condition. Final cash review 2, N-1 (confirmed with the engine): the spouse's life insurance had been read under the spouse's own age, so an OAP client of 72 whose 55-year-old spouse owned a $10,000 policy bought in 2010 (cash value $5,000, no premiums in 48 months) had $5,000 counted and was over the $3,000 couple limit; 3.520.75.E exempts \"all life insurance policies owned by a client and his or her spouse\" for OAP, so the policy is now exempt whichever spouse owns it, and an AND client's spouse's policy is counted whatever the spouse's age. Resource records, step H1 Adult Financial (docs/reviews/records-holdings-snap-af.md): each person's resources are read from that person's own holdings records through the items above (CO-4000, CO-4001, CO-4002), so the client's, the spouse's and each sponsor's holdings are counted by the same rows (3.520.72.E: \"in the same manner as the non-citizen client\"). Coverage pass 4 CA4-10 (docs/reviews/coverage4-cash.md): each spouse's own resources leave out that spouse's largest transportation vehicle, so a married couple kept two exempt vehicles; the couple's figure adds back af_vehicle_exemption_shared_with_spouse (CO-6804), the smaller of the two, so one vehicle is exempt for the couple (3.520.77: \"for an individual or married couple\"; 77.A). Coverage pass 4 CA4-13 (docs/reviews/coverage4-cash.md): a figure of the month evaluated, from the holdings valued in that month (3.510 \"Resources\", S4791: \"held as of the first day of a calendar month or as of the date of application\"), so an application month before the determination month is judged by its own holdings; before, every month read the determination month's. Pattern sweep (cash) PS-M1 and PS-D4 (docs/reviews/pattern-sweep-cash.md): the spouse is the spouse of the month (af_spouses_in_month, CO-7603), so a spouse who died before the month is not counted in it (3.520.63.A: widowed), and a client whose relationships are not stated, in a case of more than one person, cannot be determined (decision 4); before, every spouse edge counted in every month and unstated relationships were read as no spouse. Coverage pass 7, F7-2 (docs/reviews/coverage7-cash.md): a married client whose spouse is not a person of the case in the month (af_spouse_is_outside_case_in_month, CO-7690) cannot be determined here: the spouse's resources are not stated (decision 4 of 2026-11-23), as for a sponsor outside the case (PS-M3) and the non-MAGI couple (F6-7, CO-643). Before, they were read as none."
derived: [case, [[not, af_spouse_is_outside_case_in_month], ["+", af_person_countable_resources, [sum, "af_spouses_in_month", [of, [P], af_person_countable_resources_other_than_life_insurance]], [case, [["=", [count, "af_spouses_in_month"], 0], 0], [af_is_oap_age, [sum, "af_spouses_in_month", [of, [P], af_life_insurance_countable_value_for_oap]]], [else, [sum, "af_spouses_in_month", [of, [P], af_life_insurance_countable_value_other_than_oap]]]], af_vehicle_exemption_shared_with_spouse]]]
sources: [S1636, S2213, S2214, S2618, S4791]
implemented: engine
tags: [cash, resources]
rationale: "Same-word audit SW-31: every program's countable resources were a supplied, already-counted figure, so each program's resource rules lived outside the ledger, and Adult Financial fell back silently to the SSI figure when its own was unstated (OQ-392). The person's holdings are stated once by asset type; each program derives its countable resources by its own exclusions. The ID and identifier are kept; the amount is now derived from Adult Financial's own count of each spouse's holdings. Final cash review 2, N-1: the spouse's life insurance is counted under the client's program, not the spouse's."
tests:
  - {id: "CO-2389-T1", month: "2026-10", as_of: "2026-10-01", given: {af_person_countable_resources: 900, af_is_oap_age: false, af_vehicle_exemption_shared_with_spouse: 0}, others: {p2: {af_person_countable_resources_other_than_life_insurance: 500, af_life_insurance_countable_value_other_than_oap: 0}}, relationships: [[spouse, p1, p2]], expect: 1400}
  - {id: "CO-2389-T2", month: "2026-10", title: "N-1: OAP client with $1,000; the 55-year-old spouse has $1,000 and owns an old $10,000 policy worth $5,000 with no premiums in 48 months - exempt for the OAP client (3.520.75.E.1)", as_of: "2026-10-01", given: {af_person_countable_resources: 1000, af_is_oap_age: true, holdings: []}, others: {p2: {receipts: [], date_of_birth: "1971-07-22", holdings: [{kind: bank_account, value: 1000}, {kind: life_insurance, value: 5000, face_value: 10000, purchase_date: "2010-03-01", premiums_in_lookback: 0}]}}, relationships: [[spouse, p1, p2]], expect: 2000}
  - {id: "CO-2389-T3", month: "2026-10", title: "N-1: AND client with $500; the 65-year-old spouse owns the same old policy - counted in full for AND (E-F are OAP only)", as_of: "2026-10-01", given: {af_person_countable_resources: 500, af_is_oap_age: false, holdings: []}, others: {p2: {receipts: [], date_of_birth: "1961-01-10", holdings: [{kind: life_insurance, value: 5000, face_value: 10000, purchase_date: "2010-03-01", premiums_in_lookback: 0}]}}, relationships: [[spouse, p1, p2]], expect: 5500}
  - {id: "CO-2389-T4", month: "2026-10", as_of: "2026-10-01", title: "Coverage pass 4 CA4-10 (probe A8): an OAP client with $500 and a $6,000 car, her husband with $500 and a $4,000 truck, both used for transportation: one vehicle exempt for the couple, 500 + 500 + 4,000 = 5,000", given: {af_is_oap_age: true, holdings: [{kind: bank_account, value: 500}, {kind: vehicle, value: 6000, amount_owed: 0, used_for_transportation: true}], receipts: []}, others: {p2: {receipts: [], date_of_birth: "1958-02-01", holdings: [{kind: bank_account, value: 500}, {kind: vehicle, value: 4000, amount_owed: 0, used_for_transportation: true}]}}, relationships: [[spouse, p1, p2]], expect: 5000}
  # Coverage pass 7 F7-2 (A1): a married client alone in the case: the spouse's resources count with hers (3.520.72.A) and are not stated: cannot determine.
  - {id: CO-2389-T5, month: "2026-10", as_of: "2026-10-01", title: "F7-2 (A1): a married client whose spouse is not a person of the case: the couple's resources cannot be determined", given: {marital_status: married, af_person_countable_resources: 500, af_vehicle_exemption_shared_with_spouse: 0}, relationships: [], expect: unknown}
