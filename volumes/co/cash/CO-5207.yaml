id: CO-5207
name: "Colorado Works: the child's parents in the home"
identifier: cw_parents_in_home
kind: derived
type: group of persons
scope: person
program: ColoradoWorks
meaning: "The persons who are this child's parent (natural or adoptive) and live in the home with the child, counting a temporary absence Colorado Works allows (cw_is_considered_living_in_home): the first rank of the caretaker hierarchy of 9 CCR 2503-6 3.604.2.H.1."
precision: "Read for a dependent child; for anyone else it is the same set and nothing reads it. Where the case states no dwelling_id, a stated parent edge is read as living in the home (convention rule 17)."
derived: [filter, [persons], [all, [rel, [child], [P]], [otherwise, [in_group, [P], lives_with], true], [of, [P], cw_is_considered_living_in_home]]]
sources: [S3753]
implemented: engine
tags: [cash, tanf, household]
rationale: "Coverage review CW-18 (deferred since the first Colorado Works pass, fix round 2026-11-23): 3.604.2.H ranks the persons exercising responsibility for a child and makes the highest the caretaker; cw_caretaker_of (CO-2608) and cw_assistance_unit_members (CO-900) read this group to test whether a parent outranks a non-parent caretaker."
nearest: [CO-2608]
tests:
  - {id: CO-5207-T1, as_of: "2026-10-01", title: "A child living with her mother and her grandmother", given: {}, others: {p2: {cw_is_considered_living_in_home: true}, p3: {cw_is_considered_living_in_home: true}}, relationships: [[child, p2], [grandchild, p3]], expect: [p2]}
