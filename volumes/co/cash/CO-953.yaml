id: CO-953
name: "Adult Financial: category"
identifier: af_category
kind: derived
type: one of
options: [oap_a, oap_b, and_so, and_cs, ab, none]
scope: person-month
program: AdultFinancial
role: outcome
meaning: The single Adult Financial category this person qualifies under for the month - OAP group A or B, AND-SO, AND-CS, Aid to the Blind, or none - tested in that order, per C.R.S. 26-2-111 and 9 CCR 2503-5 3.520, 3.530-3.534, 3.540-3.544, and 3.546-3.549.
precision: OAP (age 60+) and the AND programs (age 0-59) are mutually exclusive by age (3.520.61.A), so the test order among them does not change the result for any one person; AND-CS is tested before AND-SO and AB because an SSI recipient (AND-CS) would otherwise also satisfy AND-SO's or AB's own disability/blindness prongs. Each branch applies its own income (af_countable_income vs. the relevant grant standard) and resource (af_meets_resource_limit) test directly, per 3.533/3.544/3.549's "equals or exceeds the grant standard, denied" rule, rather than through af_grant_standard (CO-949), which is instead derived from this item's result. See OQ-111, OQ-112, OQ-113, OQ-114, OQ-115, OQ-116, OQ-117, OQ-119 for this item's dependencies' assumptions and unmodeled nuances.
derived: [case, [[all, [not, [=, af_oap_group, "none"]], af_meets_residency, af_meets_citizenship_requirement, af_meets_resource_limit, [<, af_countable_income, af_oap_grant_standard]], af_oap_group], [af_and_cs_eligible, "and_cs"], [[all, [<=, age, af_and_max_age], [any, [">=", age, af_and_so_min_age], is_blind], af_and_so_disability_met, af_meets_citizenship_requirement, af_meets_residency, af_meets_resource_limit, [<, af_countable_income, af_and_so_grant_standard]], "and_so"], [[all, [<=, age, af_and_max_age], af_ab_eligible, af_meets_citizenship_requirement, af_meets_residency, af_meets_resource_limit, [<, af_countable_income, af_and_so_grant_standard]], "ab"], [else, "none"]]
sources: [S441, S442, S443, S449, S455, S457, S458, S461, S462, S465]
open: [OQ-111, OQ-112, OQ-113, OQ-114, OQ-115, OQ-116, OQ-117, OQ-119]
implemented: engine
tags: [cash, oap, and, ab]
rationale: "No existing item reports which single Adult Financial category a person qualifies under. Needed as the batch's Adult Financial outcome per the phase-5 brief's interface (role outcome). Same case/outcome shape as ma_ssi_related_category (CO-612) and cw_eligibility_status, acknowledged as a shared pattern (P33) rather than a duplicate: each reads a different program's own category tests."
nearest: [CO-612]
