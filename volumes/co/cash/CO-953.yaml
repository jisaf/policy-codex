id: CO-953
name: "Adult Financial: category"
identifier: af_category
kind: derived
type: one of
options: [oap, and_so, and_cs, ab, none]
scope: person-month
program: AdultFinancial
role: outcome
meaning: The single Adult Financial category this person qualifies under for the month - none for a person receiving or eligible for Colorado Works or closed out of it by a sanction (3.520.61.F, 3.520.71.F); otherwise OAP, AND-CS, AND-SO, Aid to the Blind (statute only), or none - tested in that order, per C.R.S. 26-2-111 and 9 CCR 2503-5 3.520, 3.530-3.534, 3.540-3.544, and 3.546-3.549.
precision: "Phase-8 fix round: K-3 - the Colorado Works bar (af_barred_by_colorado_works, CO-1511) is the last conjunct of every branch (the and_so branch through af_and_so_eligible, CO-1203), since 3.520.61.F makes it a non-financial requirement of every Adult Financial program (OQ-117 resolved); placed last so that a person who fails an earlier test (age, SSI, disability) is not asked the Colorado Works facts. OQ-112 resolved - the current rule has no Aid to the Blind program (3.500, S1017) and a blind client 0-59 is AND-SO (3.520.61.A); the ab branch is kept only as the statute-only route of C.R.S. 26-2-111(5) for a blind person AND-SO does not reach (for example a blind SSDI recipient). OAP (age 60+) and the AND programs (age 0-59) are mutually exclusive by age (3.520.61.A), so the test order among them does not change the result for any one person; AND-CS is tested before AND-SO and AB because an SSI recipient (AND-CS) would otherwise also satisfy AND-SO's or AB's own disability/blindness prongs. Each branch applies its own income (af_countable_income vs. the relevant grant standard), citizenship, and resource (af_meets_resource_limit) test directly, per 3.520.71.A's 'shall' list and 3.533/3.544/3.549's 'equals or exceeds the grant standard, denied' rule, rather than through af_grant_standard (CO-949), which is instead derived from this item's result. The and_so branch also excludes anyone already receiving SSI or SSDI, per 3.540's 'have not been approved for Supplemental Security Income (SSI) or Social Security Disability Insurance (SSDI)' - see OQ-138 for the tension with 26-2-111(4)(a)'s SSDI-determined alternative route. Fix round (C-10): the oap branch now reads af_meets_citizenship_requirement_oap (CO-929, no five-year bar) instead of af_meets_citizenship_requirement_and (CO-943, renamed from af_meets_citizenship_requirement), because 3.520.61.C and 3.520.68.A both scope the citizenship prong and the bar to AND only; the and_cs/and_so/ab branches keep reading the AND version. Fix round (C-9): the ab branch keeps its `[<=, age, af_and_max_age]` cap - see OQ-112's extended body for why the fetched text (3.520.61.A, S530) does not support dropping it, contrary to the review's proposed fix. See OQ-113, OQ-114, OQ-119, OQ-138, OQ-151, OQ-357 for this item's dependencies' assumptions and unmodeled nuances."
derived: [case, [[all, af_is_oap_age, af_meets_residency, af_meets_citizenship_requirement_oap, af_meets_resource_limit, [<, af_countable_income, af_oap_grant_standard], [not, af_barred_by_colorado_works]], "oap"], [[all, af_and_cs_eligible, af_meets_citizenship_requirement_and, af_meets_resource_limit, [<, af_countable_income, af_and_cs_grant_standard], [not, af_barred_by_colorado_works]], "and_cs"], [af_and_so_eligible, "and_so"], [[all, [<=, age, af_and_max_age], af_ab_eligible, af_meets_citizenship_requirement_and, af_meets_residency, af_meets_resource_limit, [<, af_countable_income, af_and_so_grant_standard], [not, af_barred_by_colorado_works]], "ab"], [else, "none"]]
sources: [S441, S442, S443, S449, S455, S457, S458, S461, S462, S465, S530, S700, S701, S711, S1011, S1017]
open: [OQ-113, OQ-114, OQ-119, OQ-138, OQ-151, OQ-357]
implemented: engine
tags: [cash, oap, and, ab]
rationale: "No existing item reports which single Adult Financial category a person qualifies under. Needed as the batch's Adult Financial outcome per the phase-5 brief's interface (role outcome). Same case/outcome shape as ma_ssi_related_category (CO-612) and cw_eligibility_status, acknowledged as a shared pattern (P33) rather than a duplicate: each reads a different program's own category tests. Fix round: the and_cs branch now applies citizenship, af_meets_resource_limit and an income test (C-4), and the and_so branch now excludes an SSI or SSDI recipient (C-7), per the phase-5 review. C-10: split the shared citizenship test into af_meets_citizenship_requirement_and (CO-943) and af_meets_citizenship_requirement_oap (CO-929), the latter without the AND-only five-year bar. C-9: kept the ab branch's age-59 cap - the fetched text (3.520.61.A) states one for blind AND-SO/AB clients, contrary to the review's proposed removal. Phase 8: OQ-111 resolved - the version of 9 CCR 2503-5 effective 2026-03-02 (D-80, S701) defines only OAP and OAP-C (court-committed clients, not modeled), so the OAP branch returns the single oap category and af_oap_group (CO-941) and its age-split parameter (CO-286) are removed; the and_so branch's conjuncts moved unchanged to af_and_so_eligible (CO-1203), which Home Care Allowance also reads."
nearest: [CO-612]
