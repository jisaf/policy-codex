id: CO-953
name: "Adult Financial: category"
identifier: af_category
kind: derived
type: one of
options: [oap, and_so, and_cs, none]
scope: person-month
program: AdultFinancial
role: outcome
meaning: The single Adult Financial category this person qualifies under for the month - none for a person receiving or eligible for Colorado Works or closed out of it by a sanction (3.520.61.F, 3.520.71.F); otherwise OAP, AND-CS, AND-SO, or none - tested in that order, per C.R.S. 26-2-111 and 9 CCR 2503-5 3.520, 3.530-3.534, 3.540-3.544, and 3.546-3.549.
precision: "Phase-8 fix round: K-3 - the Colorado Works bar (af_barred_by_colorado_works, CO-1511) is the last conjunct of every branch (the and_so branch through af_and_so_eligible, CO-1203), since 3.520.61.F makes it a non-financial requirement of every Adult Financial program (OQ-117 resolved); placed last so that a person who fails an earlier test (age, SSI, disability) is not asked the Colorado Works facts. OQ-112 resolved - the current rule has no Aid to the Blind program (3.500, S1017) and a blind client 0-59 is AND-SO (3.520.61.A); CDHS review N-1: the Aid to the Blind branch, kept until this round as the statute-only route of C.R.S. 26-2-111(5), is removed, since no current rule pays Aid to the Blind and a county could not act on an \"ab\" result; af_ab_eligible (CO-945) is retired with it. OAP (age 60+) and the AND programs (age 0-59) are mutually exclusive by age (3.520.61.A), so the test order among them does not change the result for any one person; AND-CS is tested before AND-SO because an SSI recipient (AND-CS) would otherwise also satisfy AND-SO's own disability prong. Each branch applies its own income (af_countable_income vs. the relevant grant standard), citizenship, and resource (af_meets_resource_limit) test directly, per 3.520.71.A's 'shall' list and 3.533/3.544/3.549's 'equals or exceeds the grant standard, denied' rule, rather than through af_grant_standard (CO-949), which is instead derived from this item's result. The and_so branch also excludes anyone already receiving SSI or SSDI, per 3.540's 'have not been approved for Supplemental Security Income (SSI) or Social Security Disability Insurance (SSDI)' - see OQ-138 for the tension with 26-2-111(4)(a)'s SSDI-determined alternative route. Fix round (C-10): the oap branch now reads af_meets_citizenship_requirement_oap (CO-929, no five-year bar) instead of meets_public_assistance_citizenship_requirement (CO-905, renamed from af_meets_citizenship_requirement), because 3.520.61.C and 3.520.68.A both scope the citizenship prong and the bar to AND only; the and_cs/and_so branches keep reading the AND version. See OQ-113, OQ-114, OQ-119, OQ-138, OQ-151, OQ-357 for this item's dependencies' assumptions and unmodeled nuances. Final cash review FC-6 and FC-9: every branch (the and_so branch through af_and_so_eligible, CO-1203) now also requires that the month is not in a period of ineligibility for a transfer without fair consideration (af_is_in_twfc_penalty_period, CO-3841; 3.520.76, C.R.S. 26-2-111(1)(c)) and that the county has not found the client failed without good cause to apply for and accept retirement or public assistance benefits (af_has_failed_to_apply_for_other_benefits, CO-3860; 3.520.61.G, and for OAP 3.520.71.B and D). Receipt of financial assistance from another State is read in af_meets_residency (CO-942). Coverage review F-13: the AND-CS branch, like AND-SO, bars a patient of an institution for tuberculosis or mental diseases (af_and_is_barred_as_institution_patient, CO-4446; C.R.S. 26-2-111(1)(d)), which (2)(a)(III) does not apply to OAP. F-14: every branch bars a client serving an Adult Financial IPV disqualification (CO-4447; 3.583.N) or in an EBT-misuse ineligibility period (CO-4448; 3.581.I.3), each read as false when not stated (the and_so branch through CO-1203). Coverage review 2, G-4: a client who died before the first day of the month has no category for it (3.581.C.1-2, S3502: eligibility ends on the date of death, and a death before the first of a month leaves no eligibility for that month); the month of death keeps its category and payment (C.3). date_of_death (CO-2868) not stated is read as living."
derived: [case, [[all, [not, [unknown, date_of_death]], ["<", date_of_death, [first_day, [month]]]], none], [[all, af_is_oap_age, af_meets_residency, af_meets_citizenship_requirement_oap, af_meets_resource_limit, ["<", af_countable_income, af_oap_grant_standard], [not, af_is_in_twfc_penalty_period], [not, [otherwise, af_has_failed_to_apply_for_other_benefits, false]], [not, af_barred_by_colorado_works], [not, [otherwise, af_is_serving_ipv_disqualification, false]], [not, [otherwise, af_is_in_ebt_misuse_ineligibility_period, false]]], oap], [[all, af_and_cs_eligible, meets_public_assistance_citizenship_requirement, af_meets_resource_limit, ["<", af_countable_income, af_and_cs_grant_standard], [not, af_is_in_twfc_penalty_period], [not, [otherwise, af_has_failed_to_apply_for_other_benefits, false]], [not, af_barred_by_colorado_works], [not, af_and_is_barred_as_institution_patient], [not, [otherwise, af_is_serving_ipv_disqualification, false]], [not, [otherwise, af_is_in_ebt_misuse_ineligibility_period, false]]], and_cs], [af_and_so_eligible, and_so], [else, none]]
sources: [S441, S442, S443, S449, S455, S457, S458, S461, S462, S465, S530, S700, S701, S711, S1011, S1017, S2614, S2615, S2621, S2622, S3213, S3214, S3215, S3502]
implemented: engine
tags: [cash, oap, and, ab]
open: [OQ-138, OQ-845, OQ-901]
rationale: "No existing item reports which single Adult Financial category a person qualifies under. Needed as the batch's Adult Financial outcome per the phase-5 brief's interface (role outcome). Same case/outcome shape as ma_ssi_related_category (CO-612) and cw_eligibility_status, acknowledged as a shared pattern (P33) rather than a duplicate: each reads a different program's own category tests. Fix round: the and_cs branch now applies citizenship, af_meets_resource_limit and an income test (C-4), and the and_so branch now excludes an SSI or SSDI recipient (C-7), per the phase-5 review. C-10: split the shared citizenship test into meets_public_assistance_citizenship_requirement (CO-905) and af_meets_citizenship_requirement_oap (CO-929), the latter without the AND-only five-year bar. C-9: kept the ab branch's age-59 cap - the fetched text (3.520.61.A) states one for blind AND-SO/AB clients, contrary to the review's proposed removal. Phase 8: OQ-111 resolved - the version of 9 CCR 2503-5 effective 2026-03-02 (D-80, S701) defines only OAP and OAP-C (court-committed clients, not modeled), so the OAP branch returns the single oap category and af_oap_group (CO-941) and its age-split parameter (CO-286) are removed; the and_so branch's conjuncts moved unchanged to af_and_so_eligible (CO-1203), which Home Care Allowance also reads."
nearest: [CO-612]
