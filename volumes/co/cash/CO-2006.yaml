id: CO-2006
name: "Adult Financial: resides in a psychiatric facility for thirty consecutive days"
identifier: af_resides_in_psychiatric_facility_thirty_consecutive_days
kind: derived
type: yes/no
scope: person-month
program: AdultFinancial
meaning: "Whether, for the whole of the month, this person is and has been for at least thirty consecutive days a resident of a psychiatric facility - the facility 9 CCR 2503-5 3.532.D.3 adds to the Old Age Pension personal needs allowance list for a client sixty-five or older. False for a month the stay covers only in part."
precision: "Read from residence_setting_type (psychiatric_hospital) and the entry date, as CO-1510. Only OAP's list names a psychiatric facility, and only at 65 and older; the age is af_oap_grant's. Time audit T-6: \"N consecutive days\" is counted as the days elapsed since the day the absence or stay began (days_between), the day of departure or entry itself not counted (OQ-953): \"a resident for at least thirty (30) consecutive days\" (S1008): the days elapsed from the day of entry to the first day of the next month, so an entry on the 1st is thirty days in a 30-day month and thirty-one in a 31-day month."
derived: [all, ["=", residence_setting_type, psychiatric_hospital], [all, ["<=", institution_entry_date, [first_day, [month]]], [">=", [days_between, institution_entry_date, [first_day, [month_after, [month]]]], af_personal_needs_allowance_min_stay_days]]]
sources: [S1008, S1318]
open: [OQ-953]
implemented: engine
tags: [cash, oap]
rationale: "Same-word audit SW-20 and SW-21, dual-entry audit 2.10 and 3.20: where a person lives was stated by thirteen facts, each one program's classification (SNAP's meals institution, Medicaid's medical institution and IMD, the OAP Health Care exclusion, Adult Financial's three facility lists, LEAP's living arrangements, the inmate fact), which could contradict one another. One neutral description of the setting, in the terms of 42 CFR 435.1010 (S2201, S2202), is stated once; each program's test is a derived item. Dual-entry 2.10."
tests:
  - {id: CO-2006-T1, month: "2026-10", as_of: "2026-10-15", given: {residence_setting_type: psychiatric_hospital, institution_entry_date: "2026-07-01"}, expect: true}
  - {id: CO-2006-T2, month: "2026-10", as_of: "2026-10-15", given: {residence_setting_type: nursing_facility, institution_entry_date: "2026-07-01"}, expect: false}
