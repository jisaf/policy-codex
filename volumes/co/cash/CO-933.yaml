id: CO-933
name: "Colorado Works: budgetary unit members"
identifier: cw_budgetary_unit_members
kind: derived
type: group of persons
scope: person
program: ColoradoWorks
meaning: The persons whose income is considered financially responsible for this person's Colorado Works assistance unit, per 9 CCR 2503-6 3.604.2.D.1 - the assistance unit itself (a), the spouse of a parent or non-parent caretaker who requested assistance (b), and the non-recipient parent(s) of a minor parent who is an assistance-unit member (d). Each member's value of this item is the same set. Does not include the unborn child of a pregnant parent (c), who is not a person the case can name (see cw_budgetary_unit_size, CO-934, which counts an unborn child toward size only), or the sponsor of a non-citizen (e), which this volume's engine cannot register - see OQ-140.
precision: "Reads spouse and parent/child relationship edges the same way cw_assistance_unit_members (CO-900) does: a stated edge means living together, with no separate 'requested assistance' fact for whether a spouse's caretaker-spouse actually requested assistance for themselves - 3.604.2.D.1.b includes the spouse 'regardless of whether or not the spouse has requested assistance for themselves,' so any AU caretaker's spouse is included without a further gate. (d)'s non-recipient parent(s) of a minor parent is the same population cw_deemed_parent_income_of_minor_parent (CO-909) sums over (unmarried, under cw_minor_parent_age_limit, has a dependent child of her own) - found here via has_relative_in rather than refactoring CO-909 to read this item, to avoid changing CO-909's own tested derivation in this fix round; a future batch could make this item the single source CO-909 reads, per OQ-140's own note. Does not model 3.604.2.D.2's exclusions (an optional AU member who declined assistance, or a person excluded from the AU under 3.604.2.C.3) as a separate gate, since neither category is ever added by this item's own three branches in the first place."
derived: [filter, [persons], [any, [in_group, [P], cw_assistance_unit_members], [has_relative_in, [spouse], cw_assistance_unit_members], [has_relative_in, [parent], [filter, cw_assistance_unit_members, [all, ["<", [of, [P], age], cw_minor_parent_age_limit], [of, [P], cw_has_dependent_child], ["=", [of, [P], marital_status], single]]]]]]
sources: [S410, S527]
open: [OQ-140]
implemented: engine
tags: [cash, tanf, household, income]
rationale: "No existing item builds the Colorado Works budgetary unit - the review named it in OQ-140 as unmodeled beyond the minor-parent deeming route CO-909 already reaches. Nearest same-shape item is cw_assistance_unit_members (CO-900), the assistance-unit closure this item extends, acknowledged here; unlike CO-900's P36 reachable closure (a single symmetric edge condition), this item is three independent additive categories 3.604.2.D.1 states, so it is built as a [persons] filter with an [any, ...] of has_relative_in/in_group tests rather than a reachable traversal. cw_budgetary_unit_countable_income (CO-935) needs this group; cw_budgetary_unit_size (CO-934) needs its count."
tests:
  - {id: CO-933-T1, title: "Assistance unit alone (no spouse, no minor-parent deeming)", as_of: "2026-10-01", given: {date_of_birth: "1990-01-01", is_head_of_household: true, receives_ssi: false, receives_title_iv_foster_adoption_kinship_payment: false, marital_status: single}, others: {p2: {date_of_birth: "2015-06-01", receives_ssi: false, receives_title_iv_foster_adoption_kinship_payment: false}}, relationships: [[parent, p1, p2]], expect: [p1, p2]}
  - {id: CO-933-T2, title: "S527.b: spouse of a requesting caretaker is a budgetary unit member though not an AU member", as_of: "2026-10-01", given: {date_of_birth: "1990-01-01", is_head_of_household: true, receives_ssi: false, receives_title_iv_foster_adoption_kinship_payment: false, marital_status: married}, others: {p2: {date_of_birth: "2015-06-01", receives_ssi: false, receives_title_iv_foster_adoption_kinship_payment: false}, p3: {date_of_birth: "1988-01-01", receives_ssi: false, receives_title_iv_foster_adoption_kinship_payment: false}}, relationships: [[parent, p1, p2], [spouse, p1, p3]], expect: [p1, p2, p3]}
  - {id: CO-933-T3, title: "S527.d: non-recipient parent of an unmarried minor parent with her own dependent child", as_of: "2026-10-01", given: {date_of_birth: "2009-04-08", marital_status: single, is_requesting_assistance_for_own_child: true, is_enrolled_in_school: true, receives_ssi: false, receives_title_iv_foster_adoption_kinship_payment: false}, others: {p2: {date_of_birth: "2026-02-03", receives_ssi: false, receives_title_iv_foster_adoption_kinship_payment: false}, p3: {date_of_birth: "1985-01-22", receives_ssi: false, receives_title_iv_foster_adoption_kinship_payment: false, marital_status: single}}, relationships: [[parent, p1, p2], [parent, p3, p1]], expect: [p1, p2, p3]}
