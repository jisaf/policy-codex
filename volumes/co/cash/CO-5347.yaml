id: CO-5347
name: "Adult Financial: face value of life insurance"
identifier: af_life_insurance_face_value
kind: derived
type: money
scope: person-month
program: AdultFinancial
meaning: "The total original face value of this person's life insurance policies (9 CCR 2503-5 3.520.75.A, D): the face value of each life_insurance record, valued in the determination month and still held."
precision: "Resource records, step H1 Adult Financial (docs/reviews/records-holdings-snap-af.md): the person's policies are life_insurance records (row counted_life_insurance_rules), each with its cash surrender value (value), face value, purchase date and the premiums paid in the forty-eight months, in place of the person's totals (CO-3396, CO-3397, CO-3850, CO-3851). A policy that does not state the field read is cannot determine (decision 4). Before step H1 a face value not stated was read as 0, which exempts the policies under 3.520.75.D; now the face value is required where read. Coverage pass 4 CA4-13 (docs/reviews/coverage4-cash.md): a figure of the month evaluated, from the holdings valued in that month (3.510 \"Resources\", S4791: \"held as of the first day of a calendar month or as of the date of application\"), so an application month before the determination month is judged by its own holdings; before, every month read the determination month's."
derived: [sum_receipts, holdings, [all, [all, [received_in, [month]], [unknown, [receipt, disposed_date]]], ["=", [lookup, af_holding_treatment_table, [receipt, kind]], counted_life_insurance_rules]], [receipt, face_value]]
sources: [S2618, S3217, S4791]
implemented: engine
tags: [cash, resources]
rationale: "Resource records, step H1 Adult Financial (docs/reviews/records-holdings-snap-af.md): Adult Financial reads the person's resources from the holdings records (holdings, CO-5300) through its counting table (af_holding_treatment_table, CO-5302), for the client, the spouse and each sponsor alike (3.520.72.A, E), never from the scalar resource facts. Read by af_life_insurance_countable_value_for_oap and af_life_insurance_countable_value_other_than_oap (CO-4001, CO-4002) for the person and the spouse, in place of life_insurance_face_value (CO-3397). Not the same figure as af_life_insurance_premiums_in_lookback (CO-5349): both total one field over the person's life insurance records, the original face value here (3.520.75.D), the premiums of the forty-eight months there (E.2)."
nearest: [CO-5349]
tests:
  # Hand-computed from 9 CCR 2503-5 3.520.75.A, D (S2618).
  - {id: "CO-5347-T1", month: "2026-10", title: "Two policies of $1,000 and $10,000 face: 11,000", as_of: "2026-10-01", given: {holdings: [{kind: life_insurance, value: 300, face_value: 1000}, {kind: life_insurance, value: 5000, face_value: 10000}]}, expect: 11000}
  - {id: "CO-5347-T2", month: "2026-10", title: "No policy: 0", as_of: "2026-10-01", given: {holdings: [{kind: bank_account, value: 100}]}, expect: 0}
