  - {id: CO-2343-T2, month: "2026-10", as_of: "2026-10-01", given: {educational_assistance_received: 300, federally_excluded_payments_received: 50}, expect: 350}
  # Final cash review FC-3.
  - {id: CO-2343-T3, title: "FC-3: a $500 reverse mortgage payment and $80 of child support arrears (3.520.786.L, P)", as_of: "2026-10-01", month: "2026-10", given: {reverse_mortgage_payments_received: 500, child_support_arrears_received: 80}, expect: 580}
  - {id: CO-2343-T4, title: "FC-3: $25 of bank interest (416.1124(c)(22)) and a $40 one-time gift in the quarter (O)", as_of: "2026-10-01", month: "2026-10", given: {taxable_interest_and_dividend_income: 25, infrequent_or_irregular_income_received: 40}, expect: 65}
