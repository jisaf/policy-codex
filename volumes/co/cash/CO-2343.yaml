id: CO-2343
name: "Adult Financial: excluded unearned income"
identifier: af_excluded_unearned_income
kind: derived
type: money
scope: person-month
program: AdultFinancial
meaning: "The part of this person's gross unearned income for the month, other than SSI, that 9 CCR 2503-5 3.520.786 exempts: income tax refunds and the PTC rebate in the month received (A), home energy assistance (C), emergency or general assistance (D), personal care or home care allowances (E), VA Aid and Attendance used for uncovered medical care (F), educational loans and grants (G), income set aside under a PASS (I), crime victim compensation (J), reverse mortgage payments (L), foster care payments (M), infrequent or irregular income under $60 in the quarter (O), child support arrears (P), and the SSI unearned income exclusions K incorporates: payments other federal laws exclude (20 CFR 416.1124(b)), a public agency's refund of real property or food taxes ((c)(1)), need-based assistance wholly funded by the State or a county ((c)(2)), one-third of the current child support an absent parent pays for a child ((c)(11)), special pay from a uniformed service under 37 U.S.C. 310 ((c)(19)), gifts from a 501(c)(3) organization to a child with a life-threatening condition up to the yearly limit ((c)(21)), interest and dividends ((c)(22)), AmeriCorps payments ((c)(23)) and a State's annuity for a blind, disabled or aged veteran ((c)(24))."
precision: "The sum of the neutral receipt facts the program's list names (each part of the gross income facts, so the program's countable income subtracts it); an unstated receipt is 0. Final cash review 2, N-4: each 20 CFR 416.1124(c) exclusion K incorporates is carried as follows. (1) property_or_food_tax_refund_received (an income tax refund or the PTC rebate is A's tax_refunds_and_credits_received); (2) general_or_emergency_assistance_received, and the Adult Financial grant itself, which is not in unearned income (adult_financial_cash_income is not read by af_unearned_income_other_than_ssi, CO-3831); (3) educational_assistance_received (G); (4) food raised and eaten at home, (14) housing assistance paid for a dwelling unit and (16) an unconverted travel ticket are in-kind and no unearned income fact states them (in-kind support and maintenance is the county's 3.520.79 figure); (5) and (18) federally_excluded_payments_received (major disaster assistance, Uniform Relocation Act payments and comparable State or local relocation assistance); (6) af_excluded_infrequent_income (O); (7) Alaska Longevity Bonus payments go only to Alaska residents and cannot reach a Colorado resident (3.520.61); (8) foster_care_provider_payments_received (M); (9), (15), (20) and (22) all interest and dividends (taxable_interest_and_dividend_income, tax_exempt_interest); (10) support and maintenance assistance under 416.1157, home energy assistance, energy_assistance_received (C); (11) one-third of child_support_received less the arrears P already exempts, for a child under 416.1856 (af_is_ssi_child, CO-4022), divided by af_child_support_exclusion_divisor (CO-4021); (12) the $20 general disregard, af_general_income_disregard_applied_to_unearned (CO-3832) in af_countable_income; (13) pass_set_aside_income (I); (17) crime_victim_compensation_received (J); (19) uniformed_services_special_pay_received (CO-4014); (21) af_excluded_life_threatening_condition_gifts (CO-4023); (23) americorps_payments_received (CO-4016); (24) state_veteran_annuity_received (CO-4017)."
derived: [+, [otherwise, educational_assistance_received, 0], [otherwise, energy_assistance_received, 0], [otherwise, tax_refunds_and_credits_received, 0], [otherwise, federally_excluded_payments_received, 0], [otherwise, general_or_emergency_assistance_received, 0], [otherwise, in_home_care_allowance_received, 0], [otherwise, va_aid_and_attendance_used_for_uncovered_care, 0], [otherwise, pass_set_aside_income, 0], [otherwise, crime_victim_compensation_received, 0], [otherwise, reverse_mortgage_payments_received, 0], [otherwise, foster_care_provider_payments_received, 0], af_excluded_infrequent_income, [otherwise, child_support_arrears_received, 0], [otherwise, taxable_interest_and_dividend_income, 0], [otherwise, tax_exempt_interest, 0], [otherwise, property_or_food_tax_refund_received, 0], [otherwise, uniformed_services_special_pay_received, 0], af_excluded_life_threatening_condition_gifts, [otherwise, americorps_payments_received, 0], [otherwise, state_veteran_annuity_received, 0], [case, [[all, [">", [otherwise, child_support_received, 0], 0], af_is_ssi_child], ["/", [max, 0, ["-", child_support_received, [otherwise, child_support_arrears_received, 0]]], af_child_support_exclusion_divisor]], [else, 0]]]
sources: [S1622, S2206, S2209, S2608, S2609, S2803, S2804, S2805]
implemented: engine
open: [OQ-782]
tags: [cash, income]
rationale: "Same-word audit SW-28, dual-entry audit 3.24 and 3.25: each program's excluded income and allowable business costs were program-prefixed supplied amounts, so one receipt or one set of business costs was entered once per program. The neutral fact describes the receipt or the cost; each program's exclusion or allowable cost is its own derived item citing its list (product-owner decision, convention rule 13). The ID and identifier are kept; the amount is now derived. Final cash review FC-3: the item summed four receipt facts, so the other sources 3.520.786 lists (S2608) were counted; each is now a neutral receipt fact (CO-3812 to CO-3825) this item adds, and the infrequent income test is af_excluded_infrequent_income (CO-3827). K incorporates 20 CFR 416.1124 (S2609): (c)(2) excludes county General Assistance even when it recurs, and (c)(22) excludes interest and dividends from a countable resource, read here as all interest and dividends (taxable_interest_and_dividend_income, CO-3158; tax_exempt_interest, CO-081), since interest on a resource SSI excludes is also excluded by (c)(9) and (c)(20) in the cases that arise. N, child support paid for another person, is stated on that person (child_support_received, CO-028). OQ-390's remainder is closed for Adult Financial."
