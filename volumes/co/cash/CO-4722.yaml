id: CO-4722
name: "Adult Financial: cash surrender value of life insurance, stated or estimated"
identifier: af_life_insurance_cash_value
kind: derived
type: money
scope: person
program: AdultFinancial
meaning: "The cash surrender value of this person's life insurance policies as Adult Financial counts it: the stated value (life_insurance_cash_surrender_value); when it is not available and the face value and the purchase date are stated, the face value times the share 9 CCR 2503-5 3.520.75.H charts for the years the policy has been in effect (af_life_insurance_estimated_csv_rate_table); otherwise 0."
precision: "The years in effect are the whole years from life_insurance_newest_policy_purchase_date (CO-3850) to the determination date. That fact dates the newest policy, so for a person with policies of different ages the estimate uses the newest one's row, the lowest the chart gives for them; a case that needs more states the cash value. Read by af_life_insurance_countable_value_other_than_oap (CO-4002) and af_life_insurance_countable_cash_value (CO-3854), for the client, the spouse and the sponsor alike (\"if not available from the client, client's spouse, or sponsor(s)\")."
derived: [case, [[not, [unknown, life_insurance_cash_surrender_value]], life_insurance_cash_surrender_value], [[all, [">", [otherwise, life_insurance_face_value, 0], 0], [not, [unknown, life_insurance_newest_policy_purchase_date]]], ["*", life_insurance_face_value, [band, af_life_insurance_estimated_csv_rate_table, [years_between, life_insurance_newest_policy_purchase_date, [det_date]]]]], [else, 0]]
sources: [S3504, S2618]
implemented: engine
tags: [cash, resources]
rationale: "Coverage review 2, G-7: the 3.520.75.H estimate (S3504) had no item; an unstated cash value counted as 0, so an AND client whose face total is over $1,500 counted nothing."
tests:
  - {id: CO-4722-T1, title: "Stated cash value", as_of: "2026-10-01", given: {life_insurance_cash_surrender_value: 900, life_insurance_face_value: 5000, life_insurance_newest_policy_purchase_date: "2010-01-01", holdings: [{kind: bank_account}, {kind: life_insurance, value: 900, face_value: 5000, purchase_date: "2010-01-01"}]}, expect: 900}
  - {id: CO-4722-T2, title: "G-7: not available; a $5,000 policy bought 2014-06-01, 12 years in effect - 45%", as_of: "2026-10-01", given: {life_insurance_face_value: 5000, life_insurance_newest_policy_purchase_date: "2014-06-01", holdings: [{kind: bank_account}, {kind: life_insurance, face_value: 5000, purchase_date: "2014-06-01"}]}, expect: 2250}
  - {id: CO-4722-T3, title: "G-7: in effect 20 years or more - 60%", as_of: "2026-10-01", given: {life_insurance_face_value: 5000, life_insurance_newest_policy_purchase_date: "2000-03-01", holdings: [{kind: bank_account}, {kind: life_insurance, face_value: 5000, purchase_date: "2000-03-01"}]}, expect: 3000}
  - {id: CO-4722-T4, title: "G-7: in effect less than a year - 0%", as_of: "2026-10-01", given: {life_insurance_face_value: 5000, life_insurance_newest_policy_purchase_date: "2026-03-01", holdings: [{kind: bank_account}, {kind: life_insurance, face_value: 5000, purchase_date: "2026-03-01"}]}, expect: 0}
  - {id: CO-4722-T5, title: "No purchase date stated - nothing estimated", as_of: "2026-10-01", given: {life_insurance_face_value: 5000, holdings: [{kind: bank_account}, {kind: life_insurance, face_value: 5000}]}, expect: 0}
