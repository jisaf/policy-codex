id: CO-907
name: "Colorado Works: countable earned income"
identifier: cw_countable_earned_income
kind: derived
type: money
scope: person-month
program: ColoradoWorks
meaning: This person's gross earned income for the month, minus the $90 at-application earned income disregard, floored at zero, per 9 CCR 2503-6 3.606.2.A.1.
precision: Models only the at-application $90 disregard, not the 67% ongoing disregard 3.606.2.A.2 states for a unit already receiving assistance (see OQ-105).
assumption: Applies the disregard to every person's own earned income rather than only to adult clients, since 3.606.1.E's general calculation ("countable earned income minus applicable earned income disregards, plus countable unearned income") is not stated as adult-only, and 3.605.2.D.4 counts a non-student dependent child's own earned income in full; a student dependent child's earned income is separately exempt under 3.605.4.B.24.b, not modeled here.
derived: [max, 0, ["-", earned_income, cw_earned_income_disregard_dollar]]
sources: [S416]
implemented: engine
tags: [cash, tanf, income]
rationale: No existing item states the Colorado Works earned income disregard; cw_countable_income (CO-910) needs each unit member's disregarded earned income.
tests:
  - {id: CO-907-T1, as_of: "2026-10-01", month: "2026-10", given: {earned_income: 2380}, expect: 2290}
  - {id: CO-907-T2, as_of: "2026-10-01", month: "2026-10", given: {earned_income: 0}, expect: 0}
  - {id: CO-907-T3, as_of: "2026-10-01", month: "2026-10", given: {earned_income: 50}, expect: 0}
