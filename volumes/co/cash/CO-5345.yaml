  - {id: "CO-5345-T2", month: "2026-10", title: "A painting appraised at $6,000 with a $1,000 loan against it, held half with a sister: (6,000 - 1,000) x 0.5 = 2,500", as_of: "2026-10-01", given: {holdings: [{kind: investment_personal_property, value: 6000, amount_owed: 1000, share: 0.5, co_owners: outside_case, holding_id: art}]}, expect: 2500}
  - {id: "CO-5345-T3", month: "2026-10", title: "Household goods worth $4,000 the client uses: exempt (3.520.77.B), 0", as_of: "2026-10-01", given: {holdings: [{kind: personal_property, value: 4000, household_goods_or_personal_effects: true}]}, expect: 0}
  - {id: "CO-5345-T4", month: "2026-10", title: "Decision 4: jewelry held as an investment, $2,000, with nothing said of what is owed - cannot determine", as_of: "2026-10-01", given: {holdings: [{kind: investment_personal_property, value: 2000}]}, expect: unknown}
