id: CO-5345
name: "Adult Financial: countable personal property"
identifier: af_countable_personal_property
kind: derived
type: money
scope: person-month
program: AdultFinancial
meaning: "The equity of the personal property the person holds because of its value or as an investment, which Adult Financial counts (9 CCR 2503-5 3.520.77.B: \"This does not include effects that the client holds because of the value or as an investment, which are countable as personal property as outlined in Section 3.520.742\"): each investment_personal_property record (row counted) at its value less what is owed on it (3.520.742.A.3, B: \"the appraised value less liabilities\" of \"art, jewelry or valuable collections\"), times the person's share; and the other personal property the person owns, not household goods or personal effects the person uses in the home (personal_property records that do not state household_goods_or_personal_effects): equipment, livestock, tools, a mobile home or recreational vehicle not lived in (3.520.72.B.3-4, 3.520.742.B: \"the appraised value less liabilities, i.e., vehicles, farm equipment and livestock\"), at its value less what is owed on it times the person's share, unless the county finds it cannot be sold (af_found_unsaleable, 3.520.742.C) or it is used to produce income or goods for the household, which the self-support rules govern (3.520.77.D)."
precision: "Resource records, step H1 Adult Financial (docs/reviews/records-holdings-snap-af.md): finding H0-F2 fixed (OQ-1203): before step H1 no Adult Financial item read investment_personal_property_value (CO-4642), so an OAP or AND client's collectibles were not counted. What is owed on the property is required where read (decision 4). Household goods and personal effects the client uses are exempt (3.520.77.B; row excluded_household_goods) and not read. Coverage pass 4 CA4-11 (docs/reviews/coverage4-cash.md): the holdings kind personal_property holds household goods and other personal property alike, and the table excluded the whole kind, so livestock or equipment was never counted; the record now says which it is (household_goods_or_personal_effects, CO-5300, required where read), and OQ-1203's part on this property is settled by the text. The county's findings (af_found_unsaleable) and the self-support properties (income_producing, produces_for_household_use) are read as not so when not stated, as for real property (CO-5342). Coverage pass 4 CA4-13 (docs/reviews/coverage4-cash.md): a figure of the month evaluated, from the holdings valued in that month (3.510 \"Resources\", S4791: \"held as of the first day of a calendar month or as of the date of application\"), so an application month before the determination month is judged by its own holdings; before, every month read the determination month's. Field sweep defaults list (2026-11-23): af_found_unsaleable is read as the holdings record states it, its default false declared once on the schema (CO-5300) with the rule that gives it (9 CCR 2503-5 3.520.72.A (S1636): \"Unless otherwise specified, a resource is countable\"; the 3.520.741.D and 742.C exemptions are the county's to find (S3209)); before, this reader gave the default itself (otherwise false), which conventions rule 12 and decision 4 do not allow a reader. No value changes: the tests that leave the finding out read it as false, as before."
derived: [sum_receipts, holdings, [all, [all, [received_in, [month]], [unknown, [receipt, disposed_date]]], [any, [all, ["=", [lookup, af_holding_treatment_table, [receipt, kind]], counted], ["=", [receipt, kind], investment_personal_property]], [all, ["=", [lookup, af_holding_treatment_table, [receipt, kind]], counted_unless_household_goods], [not, [receipt, household_goods_or_personal_effects]], [not, [receipt, af_found_unsaleable]], [not, [otherwise, [receipt, income_producing], false]], [not, [otherwise, [receipt, produces_for_household_use], false]]]]], ["*", [max, 0, ["-", [receipt, value], [receipt, amount_owed]]], [otherwise, [receipt, share], 1]]]
sources: [S4507, S4692, S2213, S4791, S1636]
implemented: engine
tags: [cash, resources]
rationale: "Resource records, step H1 Adult Financial (docs/reviews/records-holdings-snap-af.md): Adult Financial reads the person's resources from the holdings records (holdings, CO-5300) through its counting table (af_holding_treatment_table, CO-5302), for the client, the spouse and each sponsor alike (3.520.72.A, E), never from the scalar resource facts. Finding H0-F2 (docs/reviews/holdings-h0.md): 3.520.77.B counts personal effects held as an investment, which no Adult Financial item read."
tests:
