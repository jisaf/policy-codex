  - {id: "CO-5345-T6", month: "2026-10", as_of: "2026-10-01", given: {holdings: [{kind: personal_property, value: 3000, amount_owed: 0}]}, title: "Coverage pass 4 CA4-11: personal property that does not say whether it is household goods: cannot determine (decision 4)", expect: unknown}
  - {id: "CO-5345-T7", month: "2026-10", as_of: "2026-10-01", given: {holdings: [{kind: personal_property, value: 8000, amount_owed: 2000, household_goods_or_personal_effects: false, income_producing: false, produces_for_household_use: false, af_found_unsaleable: true}]}, title: "Coverage pass 4 CA4-11: a camper the county finds cannot be sold (3.520.742.C): 0", expect: 0}
