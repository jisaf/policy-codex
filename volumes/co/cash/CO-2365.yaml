id: CO-2365
name: "Colorado Works: sponsor income deemed"
identifier: cw_sponsor_deemed_income
kind: derived
type: money
scope: person-month
program: ColoradoWorks
meaning: "The sponsor's net income deemed to this sponsored non-citizen as unearned income for the month (9 CCR 2503-6 3.605.1.A.5.b): the gross earned income of the sponsor and of the sponsor's spouse, each less twenty percent or $175, whichever is less, minus support paid to dependents not living in the sponsor's home, plus their unearned income, never below zero; zero when sponsor deeming does not apply."
precision: "The twenty percent or cw_sponsor_earned_income_deduction_cap is taken from each earner's earnings, since A.5.a deems \"the net income of a non-citizen's sponsor and the sponsor's spouse\". The earners are the sponsors (sponsors, CO-2713, a co-sponsor spouse included) and a sponsor's spouse who did not sign (sponsor_spouses_not_cosigning, CO-2714), each read from the person's own facts: Colorado Works' gross earned income (wages and self-employment net profit) and countable unearned income, and the support the person paid to dependents outside the home (support_paid_to_dependents_outside_home, CO-2359). Unlike SNAP (4.305.2.D.2.c), Colorado Works states no division among several sponsored non-citizens: each receives the whole amount."
derived: [case, [cw_sponsor_deeming_applies, [max, 0, ["-", ["+", [sum, sponsors, ["+", ["-", [of, [P], cw_gross_earned_income], [min, ["*", cw_sponsor_earned_income_deduction_rate, [of, [P], cw_gross_earned_income]], cw_sponsor_earned_income_deduction_cap]], [of, [P], cw_countable_unearned_income]]], [sum, sponsor_spouses_not_cosigning, ["+", ["-", [of, [P], cw_gross_earned_income], [min, ["*", cw_sponsor_earned_income_deduction_rate, [of, [P], cw_gross_earned_income]], cw_sponsor_earned_income_deduction_cap]], [of, [P], cw_countable_unearned_income]]]], ["+", [sum, sponsors, [otherwise, [of, [P], support_paid_to_dependents_outside_home], 0]], [sum, sponsor_spouses_not_cosigning, [otherwise, [of, [P], support_paid_to_dependents_outside_home], 0]]]]]], [else, 0]]
sources: [S1627]
implemented: engine
tags: [cash, tanf, immigration, income]
rationale: "OQ-103: no item computed the A.5.b sponsor net income (S1627); cw_countable_income (CO-910) and cw_payment_countable_income (CO-923) add it for each sponsored member of the assistance unit.  Dual-entry audit 1.5 (audit fix round): the sponsor is a person of the case, joined to the non-citizen by the sponsor / sponsored_by relationship (volume.yaml), and the sponsor's income and resources are read from the sponsor's own facts, so two non-citizens with one sponsor read one set of facts."
tests:
  - {id: CO-2365-T1, title: "Sponsor $5,000 earned: 5,000 - 175 = $4,825", as_of: "2026-10-01", month: "2026-10", given: {cw_sponsor_deeming_applies: true, sponsors: [p2], sponsor_spouses_not_cosigning: []}, others: {p2: {cw_gross_earned_income: 5000, cw_countable_unearned_income: 0}}, expect: 4825}
  - {id: CO-2365-T2, title: "Spouse $600 earned (20% = $120 is less than $175), $300 unearned, $250 support paid outside: 4,825 + 480 + 300 - 250 = 5,355", as_of: "2026-10-01", month: "2026-10", given: {cw_sponsor_deeming_applies: true, sponsors: [p2], sponsor_spouses_not_cosigning: [p3]}, others: {p2: {cw_gross_earned_income: 5000, cw_countable_unearned_income: 0}, p3: {cw_gross_earned_income: 600, cw_countable_unearned_income: 300, support_paid_to_dependents_outside_home: 250}}, expect: 5355}
  - {id: CO-2365-T3, as_of: "2026-10-01", month: "2026-10", given: {cw_sponsor_deeming_applies: false}, expect: 0}
