id: CO-1647
name: "Colorado Works: ssn verification is pending"
identifier: cw_ssn_verification_is_pending
kind: derived
type: yes/no
scope: person-month
program: ColoradoWorks
role: outcome
meaning: Whether Colorado Works requires verification of the person's Social Security number (or proof of application) and it has not been provided.
precision: "Only the client without an SSN or proof of application is ineligible, not the unit (3.604.3.B.2.c, K). At application a furnished number or proof of an application satisfies it (ssn_is_verified); at a redetermination the number itself must have been verified (ssn_verified_by_electronic_data_source), since a client who applied for an SSN at the initial determination must have it verified before the next recertification (3.604.3.B.2.c.1, S1630; phase-10 sweep, OQ-373). B.2.c.2's later deadline for a client added within sixty days of the period's end is not separately modeled. False where Colorado Works verification does not apply to the person (cw_verification_is_applicable, CO-2583; case worker review B2). Due by: cw_status_verification_due_date (CO-1656: thirty days; the member, not the unit, is excluded after it)."
derived: [all, cw_verification_is_applicable, [case, [[otherwise, cw_determination_is_redetermination, false], [not, ssn_verified_by_electronic_data_source]], [else, [not, ssn_is_verified]]]]
sources: [S872, S878, S1630]
implemented: engine
tags: [verification, cash, tanf]
rationale: "Review U-1: the count items held this test as an anonymous arm, so no outcome told a worker which document was outstanding and for whom; the count now sums this item."
tests:
  - {id: CO-1647-T1, month: "2026-10", as_of: "2026-10-01", given: {cw_verification_is_applicable: true, ssn_verified_by_electronic_data_source: false, ssn_furnished_or_application_shown: false}, expect: true}
  - {id: CO-1647-T2, month: "2026-10", as_of: "2026-10-01", given: {cw_verification_is_applicable: true, ssn_verified_by_electronic_data_source: true}, expect: false}
  # Phase-10 sweep (OQ-373): proof of an SSN application satisfies the application, not the redetermination (3.604.3.B.2.c.1).
  - {id: CO-1647-T3, month: "2026-10", as_of: "2026-10-01", given: {cw_verification_is_applicable: true, cw_determination_is_redetermination: true, ssn_verified_by_electronic_data_source: false, ssn_furnished_or_application_shown: true}, expect: true}
  - {id: CO-1647-T4, month: "2026-10", as_of: "2026-10-01", given: {cw_verification_is_applicable: true, cw_determination_is_redetermination: false, ssn_verified_by_electronic_data_source: false, ssn_furnished_or_application_shown: true}, expect: false}
