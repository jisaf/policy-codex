id: CO-1647
name: "Colorado Works: ssn verification is pending"
identifier: cw_ssn_verification_is_pending
kind: derived
type: yes/no
scope: person-month
program: ColoradoWorks
role: outcome
meaning: Whether Colorado Works requires verification of the person's Social Security number (or proof of application) and it has not been provided.
precision: "Only the client without an SSN or proof of application is ineligible, not the unit (3.604.3.B.2.c, K). At application a furnished number or proof of an application satisfies it (ssn_is_verified); at a redetermination the number itself must have been verified (ssn_verified_by_electronic_data_source), since a client who applied for an SSN at the initial determination must have it verified before the next recertification (3.604.3.B.2.c.1, S1630; phase-10 sweep, OQ-373). Coverage review CW-25: a proof of application \"is only valid for up to eight (8) months without good cause\" (B.2.c, S872); where the application is dated (ssn_application_date, CO-4838) and SSA has not verified a number, the proof no longer satisfies the requirement from the month after the eighth month from the month of the application (cw_ssn_application_proof_validity_months, CO-4840), unless the county finds good cause (cw_has_good_cause_for_pending_ssn_application, CO-4839, read as false when not stated); an application on January 10 is valid through September and pending from October. B.2.c.2's later deadline for a client added within sixty days of the period's end is not separately modeled. False where Colorado Works verification does not apply to the person (cw_verification_is_applicable, CO-2583; case worker review B2). Coverage pass 6 CA6-2: the kind of determination (cw_determination_is_redetermination, CO-2375) is required where verification applies (decision 4 of 2026-11-23); before, an unstated value was read as an application. Due by: cw_status_verification_due_date (CO-1656: thirty days; the member, not the unit, is excluded after it)."
derived: [all, cw_verification_is_applicable, [case, [cw_determination_is_redetermination, [not, ssn_verified_by_electronic_data_source]], [else, [any, [not, ssn_is_verified], [all, [not, ssn_verified_by_electronic_data_source], [not, [unknown, ssn_application_date]], ["<", [months_after, cw_ssn_application_proof_validity_months, [month_of, ssn_application_date]], [month]], [not, [otherwise, cw_has_good_cause_for_pending_ssn_application, false]]]]]]]
sources: [S872, S878, S1630]
implemented: engine
tags: [verification, cash, tanf]
rationale: "Review U-1: the count items held this test as an anonymous arm, so no outcome told a worker which document was outstanding and for whom; the count now sums this item."
tests:
  # Coverage pass 6 CA6-2: the kind of determination stated (decision 4): these tests are applications, the value the readers gave it when unstated.
  - {id: CO-1647-T1, month: "2026-10", as_of: "2026-10-01", given: {cw_determination_is_redetermination: false, cw_verification_is_applicable: true, ssn_verified_by_electronic_data_source: false, ssn_furnished_or_application_shown: false}, expect: true}
  - {id: CO-1647-T2, month: "2026-10", as_of: "2026-10-01", given: {cw_determination_is_redetermination: false, cw_verification_is_applicable: true, ssn_verified_by_electronic_data_source: true}, expect: false}
  # Phase-10 sweep (OQ-373): proof of an SSN application satisfies the application, not the redetermination (3.604.3.B.2.c.1).
  - {id: CO-1647-T3, month: "2026-10", as_of: "2026-10-01", given: {cw_verification_is_applicable: true, cw_determination_is_redetermination: true, ssn_verified_by_electronic_data_source: false, ssn_furnished_or_application_shown: true}, expect: true}
  - {id: CO-1647-T4, month: "2026-10", as_of: "2026-10-01", given: {cw_verification_is_applicable: true, cw_determination_is_redetermination: false, ssn_verified_by_electronic_data_source: false, ssn_furnished_or_application_shown: true}, expect: false}
  - {id: CO-1647-T5, title: "CW-25: proof of an SSN application made January 10, 2026 - valid through September, pending in October", month: "2026-10", as_of: "2026-10-01", given: {cw_verification_is_applicable: true, cw_determination_is_redetermination: false, ssn_verified_by_electronic_data_source: false, ssn_furnished_or_application_shown: true, ssn_application_date: "2026-01-10"}, expect: true}
  - {id: CO-1647-T6, title: "CW-25: the same proof in September, the eighth month - still valid", month: "2026-09", as_of: "2026-09-01", given: {cw_verification_is_applicable: true, cw_determination_is_redetermination: false, ssn_verified_by_electronic_data_source: false, ssn_furnished_or_application_shown: true, ssn_application_date: "2026-01-10"}, expect: false}
  - {id: CO-1647-T7, title: "CW-25: past eight months, with good cause found by the county", month: "2026-10", as_of: "2026-10-01", given: {cw_verification_is_applicable: true, cw_determination_is_redetermination: false, ssn_verified_by_electronic_data_source: false, ssn_furnished_or_application_shown: true, ssn_application_date: "2026-01-10", cw_has_good_cause_for_pending_ssn_application: true}, expect: false}
