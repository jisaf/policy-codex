id: CO-7602
name: "Colorado Works: considered living in the home in the month"
identifier: cw_is_considered_living_in_home_in_month
kind: derived
type: yes/no
scope: person-month
program: ColoradoWorks
meaning: "Whether, in the month evaluated, Colorado Works considers the person to be living in the home they usually live in despite a temporary absence (9 CCR 2503-6 3.604.2.E, G, I): present (no absence); away for medical treatment (E.1, I.2) or on active duty in the uniformed services (I.1); a dependent child of the month under a court's jurisdiction, in an agency's legal custody without its physical custody, or attending school away from home (E.2-4); a dependent child of the month visiting a noncustodial parent under a parenting plan for no more than six months (G.2) or in a voluntary foster care placement for no more than three months (G.3); or away for less than forty-five days with an established intent to return (I.3). A parent or caretaker who has become a resident of an institution in the month (a stay of at least thirty consecutive days, 3.604.2.O.2; cw_is_institution_resident, CO-3804) is not in the home, unless the person keeps the responsibility of a dependent child who lives in the institution too or is still cared for in the home. The months and days of an absence are counted to cw_month_reading_date (CO-7600): the month's last day for a month before the determination month, the determination date otherwise."
precision: "Pattern sweep (cash) PS-T8 (docs/reviews/pattern-sweep-cash.md): cw_is_considered_living_in_home (CO-3354) was one value per case, measuring every absence to the determination date and the determination month, so a member whose absence passed its limit after the application month was out of the unit in the application month too (a child who left on a visit under a parenting plan on 2026-04-20, determined 2026-10-15: no more than six months through September, G.2, so in the home in September; the seventh month is October). This item is the month's reading; CO-3354 is now whether the person lives in the home in some month of the determination (who may join the unit), as cw_is_dependent_child (CO-901) is for the dependent child, and the month's unit (cw_is_assistance_unit_member_in_month, CO-7303), the minor-parent items (CO-906, CO-4352) and the stepparent's children in the home (CO-2353) read this item. Months of a visit or placement are counted from the month the absence began (OQ-611 for I.3 read for a child; OQ-660 for the institution stay). Whether the person is temporarily absent (temporary_absence_reason) is required where read (coverage pass 6 CA6-7), and so is the residence setting of a person stated present (decision 4 of 2026-11-23; pattern sweep PS-D3: the old reading of an unstated setting as a private dwelling is gone)."
derived: [case, [["=", temporary_absence_reason, none], [any, [not, cw_is_institution_resident], cw_is_dependent_child_in_month, cw_institution_resident_keeps_child_in_care]], [["=", temporary_absence_reason, active_military_duty], true], [["=", temporary_absence_reason, medical_treatment], [any, [not, cw_is_institution_resident], cw_is_dependent_child_in_month, cw_institution_resident_keeps_child_in_care]], [[in, temporary_absence_reason, [school_away_from_home, court_jurisdiction_or_agency_custody]], cw_is_dependent_child_in_month], [["=", temporary_absence_reason, visiting_noncustodial_parent_under_parenting_plan], [all, cw_is_dependent_child_in_month, ["<", [month_of, cw_month_reading_date], [months_after, cw_parenting_plan_visit_max_months, [month_of, temporary_absence_start_date]]]]], [["=", temporary_absence_reason, voluntary_foster_care], [all, cw_is_dependent_child_in_month, ["<", [month_of, cw_month_reading_date], [months_after, cw_voluntary_foster_care_max_months, [month_of, temporary_absence_start_date]]]]], [["=", temporary_absence_reason, other_with_intent_to_return], [all, ["<", [days_between, temporary_absence_start_date, cw_month_reading_date], cw_temporary_absence_max_days], [any, [not, cw_is_institution_resident], cw_institution_resident_keeps_child_in_care]]], [else, false]]
sources: [S2203, S2602]
open: [OQ-611, OQ-660, OQ-1435]
implemented: engine
tags: [cash, household]
nearest: [CO-3354]
rationale: "Pattern sweep (cash), PS-T8: Colorado Works builds each month's unit from the members of that month (coverage pass 6 CA6-4); whether a member is in the home was still the determination's, so an absence that passed its limit after the application month removed the member from the application month too."
tests:
  # Pattern sweep (cash) PS-T8: 3.604.2.G.2 (S2203) "no more than six months"; the visit began 2026-04-20, the determination is 2026-10-15. The months are counted from the month the visit began (April): September is the sixth month (in the home), October the seventh (out).
  - {id: "CO-7602-T1", title: "Pattern sweep PS-T8: a child visiting the other parent since April 20; September is the sixth month: in the home", as_of: "2026-10-15", month: "2026-09", given: {temporary_absence_reason: visiting_noncustodial_parent_under_parenting_plan, temporary_absence_start_date: "2026-04-20", cw_is_dependent_child_in_month: true}, expect: true}
  - {id: "CO-7602-T2", title: "PS-T8: October, the seventh month: not in the home", as_of: "2026-10-15", month: "2026-10", given: {temporary_absence_reason: visiting_noncustodial_parent_under_parenting_plan, temporary_absence_start_date: "2026-04-20", cw_is_dependent_child_in_month: true}, expect: false}
  # 3.604.2.I.3 (S2203) less than forty-five days with an intent to return: away since 2026-08-20, determined 2026-10-15 (56 days). On September 30 the absence was 41 days old (in the home); on the determination date 56 (out).
  - {id: "CO-7602-T3", title: "PS-T8: away since August 20 with intent to return: 41 days on September 30, in the home in September", as_of: "2026-10-15", month: "2026-09", given: {temporary_absence_reason: other_with_intent_to_return, temporary_absence_start_date: "2026-08-20", residence_setting_type: private_dwelling}, expect: true}
  - {id: "CO-7602-T4", title: "PS-T8: October, 56 days on the determination date: not in the home", as_of: "2026-10-15", month: "2026-10", given: {temporary_absence_reason: other_with_intent_to_return, temporary_absence_start_date: "2026-08-20", residence_setting_type: private_dwelling}, expect: false}
  # 3.604.2.O.2 (S2602) a resident of an institution, at least thirty consecutive days: a mother in a nursing facility since 2026-09-10, no child in her care, determined 2026-10-15: 20 days on September 30 (in the home in September), 35 on October 15.
  - {id: "CO-7602-T5", title: "PS-T8: in a nursing facility since September 10, 20 days on September 30: not yet a resident, in the home in September", as_of: "2026-10-15", month: "2026-09", given: {temporary_absence_reason: medical_treatment, date_of_birth: "1980-01-01", residence_setting_type: nursing_facility, institution_entry_date: "2026-09-10", cw_institution_resident_keeps_child_in_care: false}, expect: true}
  - {id: "CO-7602-T6", title: "PS-T8: October, 35 days on the determination date: a resident, not in the home", as_of: "2026-10-15", month: "2026-10", given: {temporary_absence_reason: medical_treatment, date_of_birth: "1980-01-01", residence_setting_type: nursing_facility, institution_entry_date: "2026-09-10", cw_institution_resident_keeps_child_in_care: false}, expect: false}
  - {id: "CO-7602-T7", title: "PS-D3: present, residence setting not stated: cannot determine (decision 4)", as_of: "2026-10-15", month: "2026-10", given: {temporary_absence_reason: none, date_of_birth: "1980-01-01", cw_institution_resident_keeps_child_in_care: false}, expect: unknown}
