  - {id: "CO-4369-T2", month: "2026-10", as_of: "2026-10-15", given: {rental_property_expenses_paid: 350, receipts: [{kind: rental_income, amount: 200}]}, title: "Rental expenses above the rent are taken only up to the rent", expect: 200}
  - {id: "CO-4369-T3", month: "2026-10", as_of: "2026-10-15", given: {receipts: [{kind: other_nontaxable, amount: 5000, frequency: once, month: "2026-10", spent_on_covered_costs: 3200}, {kind: refugee_resettlement, amount: 400}]}, title: "A $5,000 life insurance payout, $3,200 spent on the last illness and burial: the $3,200 is the receipt's spent_on_covered_costs, which cw_counted_unearned_receipts leaves out (A.5), not taken off here; refugee reception and placement money is exempt by its kind (3.605.4.B.28)", expect: 0}
