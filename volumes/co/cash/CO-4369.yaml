rationale: "Coverage review CW-14 (P1), CW-22 and CW-23 (P2): the supplied unearned facts are gross, and Colorado Works subtracted none of these expenses or receipts, so gross rent, gross insurance proceeds, refugee resettlement cash, an SMIB refund and the unit's own retroactive grant were counted against the need standard. A separate item rather than more terms in cw_excluded_unearned_income (CO-2341), which lists the exempt sources other programs' rules share; cw_countable_unearned_income (CO-908) and cw_payment_countable_unearned_income (CO-2554) subtract both. Receipt records, migration phase 2: cw_excluded_unearned_income is removed, its work done by the counting table (cw_receipt_treatment_table, CO-5650), and the readers subtract this item from cw_counted_unearned_receipts (CO-5651)."
