  - {id: "CO-4369-T5", month: "2026-10", as_of: "2026-10-15", given: {receipts: [{kind: social_security, amount: 1000}, {kind: medicare_premium_refund, amount: 120}, {kind: insurance_cash_value, amount: 500}, {kind: colorado_works_cash, amount: 244, frequency: once, retroactive: true, month: "2026-10"}]}, title: "An SMIB refund (3.605.3.B.9) and cash value taken from a policy (3.605.4.B.30) are kinds the counting table excludes, and a retroactive Colorado Works underpayment correction is the unit's own grant (3.609.2.G): nothing is taken off here", expect: 0}
