id: CO-4369
name: "Colorado Works: unearned income deductions"
identifier: cw_unearned_income_deductions
kind: derived
type: money
scope: person-month
program: ColoradoWorks
meaning: "The amounts Colorado Works takes off this person's counted unearned receipts for the month (cw_counted_unearned_receipts, CO-5651) besides the receipts its counting table exempts and the parts of a receipt it leaves out as fields of the receipt (cw_receipt_treatment_table, CO-5650): the allowable expenses paid on rental property (9 CCR 2503-6 3.605.3.A.2); insurance and injury proceeds and lump sums spent or designated for last illness and burial, medical care, legal fees, medical bills, funeral and burial or income taxes (A.5, A.6, 3.605.4.B.33); cash value taken from a life or disability insurance policy (B.30); a lump-sum Medicare premium (SMIB) refund to a buy-in recipient (3.605.3.B.9); distributions from individual development, retirement savings, health savings and educational savings accounts (3.605.4.B.20-22, B.25); board-only and room-only payments, which are counted as earned income instead (3.605.2.E.4.c-d; cw_boarder_income, CO-4361); and, for a spouse, parent or stepparent who is not in the assistance unit, a military allotment received for persons not living in the home up to the need standard for those persons (3.605.3.B.10)."
precision: "Receipt records, migration phase 2 (docs/reviews/receipts-migration-2-cw.md): what is left here is the money the scalar facts stated as a part of a counted receipt and no receipt kind or field restates yet, and the expenses, which are not receipts; each is a neutral fact read as 0 when not stated, as before: rental_property_expenses_paid (CO-4458), lump_sum_amounts_spent_or_designated (CO-4365), insurance_cash_value_withdrawn (CO-4368), medicare_premium_refund_received (CO-4370), savings_account_distributions_received (CO-3816, moved here from cw_excluded_unearned_income, CO-2341, removed), board_only_payments_received (CO-4832) and room_only_payments_received (CO-4830). Refugee resettlement money (3.605.4.B.28-29) and a retroactive Colorado Works payment (3.609.2.G) are receipt kinds the counting table does not count, and the claim expenses of a workers' compensation award (3.605.3.B.4) are a field of the award's receipt (claim_expense), so they are no longer taken off here (before receipt records: refugee_resettlement_payments_received, retroactive_colorado_works_lump_sum_received and workers_compensation_award_expenses, CO-4366, capped at the other unearned income that held the award). Rental expenses reduce only the rent, the month's receipts of kind rental_income or of the other unearned kinds where rent was stated before receipt records (CO-4458's meaning), less the board-only and room-only payments within them, and are taken up to that amount (A.2: \"countable to the extent it exceeds allowable expenses\"); the receipts are read only when expenses are stated. Board-only and room-only payments are part of the other taxable receipts and are taken out whole (coverage pass 3, CW3-1). Coverage pass 3 (CW3-4): the allotment is military_allotment_received_for_persons_outside_home (CO-4836, part of the other nontaxable receipts) and its persons military_allotment_persons_outside_home_count (CO-4837); the person is a non-recipient when outside every unit (cw_is_excluded_from_assistance_unit, CO-2350) or a disqualified member (cw_is_disqualified_member, CO-928); the need standard for those persons is the No Caretaker row for that number of children (cw_need_standard_table_no_caretaker, CO-351, up to ten; OQ-860), and up to that amount of the allotment is taken off. An allotment for persons in the home is counted with the other unearned income; a stepparent's or parent's deeming already deducts the needs of those in the home (3.605.1.A.4.a; OQ-860). The readers subtract this item from the counted receipts and floor the result at zero."
derived: ["+", [case, [["<=", [otherwise, rental_property_expenses_paid, 0], 0], 0], [else, [min, rental_property_expenses_paid, [max, 0, ["-", [sum_receipts, receipts, [all, [in, [receipt, kind], [rental_income, other_taxable, other_nontaxable]], [received_in, [month]]], [receipt, amount]], ["+", [otherwise, board_only_payments_received, 0], [otherwise, room_only_payments_received, 0]]]]]]], ["+", [otherwise, board_only_payments_received, 0], [otherwise, room_only_payments_received, 0]], [otherwise, lump_sum_amounts_spent_or_designated, 0], [otherwise, insurance_cash_value_withdrawn, 0], [otherwise, medicare_premium_refund_received, 0], [otherwise, savings_account_distributions_received, 0], [case, [["<=", [otherwise, military_allotment_received_for_persons_outside_home, 0], 0], 0], [[any, [otherwise, cw_is_excluded_from_assistance_unit, false], [otherwise, cw_is_disqualified_member, false]], [min, military_allotment_received_for_persons_outside_home, [lookup, cw_need_standard_table_no_caretaker, [min, military_allotment_persons_outside_home_count, 10]]]], [else, 0]]]
sources: [S3157, S3163, S3166, S2606, S3159, S3580]
implemented: engine
tags: [cash, tanf, income]
open: [OQ-860]
rationale: "Coverage review CW-14 (P1), CW-22 and CW-23 (P2): the supplied unearned facts are gross, and Colorado Works subtracted none of these expenses or receipts, so gross rent, gross insurance proceeds, refugee resettlement cash, an SMIB refund and the unit's own retroactive grant were counted against the need standard. A separate item rather than more terms in cw_excluded_unearned_income (CO-2341), which lists the exempt sources other programs' rules share; cw_countable_unearned_income (CO-908) and cw_payment_countable_unearned_income (CO-2554) subtract both. Receipt records, migration phase 2: cw_excluded_unearned_income is removed, its work done by the counting table (cw_receipt_treatment_table, CO-5650), and the readers subtract this item from cw_counted_unearned_receipts (CO-5651)."
tests:
  - {id: CO-4369-T1, month: "2026-10", as_of: "2026-10-15", given: {rental_property_expenses_paid: 350, receipts: [{kind: rental_income, amount: 900}]}, title: "Rent of $900 with $350 of maintenance, taxes and mortgage interest: $350 deducted", expect: 350}
  - {id: CO-4369-T2, month: "2026-10", as_of: "2026-10-15", given: {rental_property_expenses_paid: 350, receipts: [{kind: rental_income, amount: 200}]}, title: "Rental expenses above the rent are taken only up to the rent", expect: 200}
  - {id: CO-4369-T3, month: "2026-10", as_of: "2026-10-15", given: {lump_sum_amounts_spent_or_designated: 3200, receipts: [{kind: other_nontaxable, amount: 5000, frequency: once, month: "2026-10"}, {kind: refugee_resettlement, amount: 400}]}, title: "A $5,000 life insurance payout, $3,200 spent on the last illness and burial; refugee reception and placement money is exempt by its kind (3.605.4.B.28), not taken off here", expect: 3200}
  - {id: CO-4369-T4, month: "2026-10", as_of: "2026-10-15", given: {savings_account_distributions_received: 300, receipts: [{kind: pension, amount: 800}]}, title: "$800 of retirement income, $300 of it a distribution from an IRA (3.605.4.B.21)", expect: 300}
  - {id: CO-4369-T5, month: "2026-10", as_of: "2026-10-15", given: {medicare_premium_refund_received: 120, insurance_cash_value_withdrawn: 500, receipts: [{kind: social_security, amount: 1120}, {kind: other_nontaxable, amount: 500}, {kind: colorado_works_cash, amount: 244, frequency: once, retroactive: true, month: "2026-10"}]}, title: "An SMIB refund and cash value taken from a policy; a retroactive Colorado Works underpayment correction is the unit's own grant, not counted by its kind (3.609.2.G)", expect: 620}
  - {id: CO-4369-T6, month: "2026-10", as_of: "2026-10-15", given: {}, title: "Nothing stated", expect: 0}
  - {id: CO-4369-T7, month: "2026-10", as_of: "2026-10-15", given: {room_only_payments_received: 400, rental_property_expenses_paid: 300, receipts: [{kind: other_taxable, amount: 1000}]}, title: "Coverage pass 3 CW3-1: $1,000 of rent including $400 from a lodger for a room only, $300 of rental property expenses: 400 moved to earned income + min(300, 600) = 700", expect: 700}
  - {id: CO-4369-T8, month: "2026-10", as_of: "2026-10-15", given: {board_only_payments_received: 450, rental_property_expenses_paid: 200, receipts: [{kind: other_taxable, amount: 450}]}, title: "Coverage pass 3 CW3-1: $450 for meals only stated in other taxable income, $200 of rental expenses with no other rent: 450 + min(200, 0) = 450", expect: 450}
  - {id: CO-4369-T9, month: "2026-10", as_of: "2026-10-15", given: {military_allotment_received_for_persons_outside_home: 700, military_allotment_persons_outside_home_count: 2, cw_is_excluded_from_assistance_unit: true, receipts: [{kind: other_nontaxable, amount: 700}]}, title: "Coverage pass 3 CW3-4: a stepparent outside the unit receives a $700 allotment for two children living with their mother; No Caretaker need standard for two children taken off: min(700, 245) = 245", expect: 245}
  - {id: CO-4369-T10, month: "2026-10", as_of: "2026-10-15", given: {military_allotment_received_for_persons_outside_home: 700, military_allotment_persons_outside_home_count: 2, cw_is_excluded_from_assistance_unit: false, cw_is_disqualified_member: false, receipts: [{kind: other_nontaxable, amount: 700}]}, title: "Coverage pass 3 CW3-4: the same allotment received by a member of the unit is counted in full", expect: 0}
