id: CO-4369
name: "Colorado Works: unearned income deductions"
identifier: cw_unearned_income_deductions
kind: derived
type: money
scope: person-month
program: ColoradoWorks
meaning: "The amounts Colorado Works takes off this person's gross unearned income for the month besides the exempt sources of cw_excluded_unearned_income (CO-2341): the allowable expenses paid on rental property (9 CCR 2503-6 3.605.3.A.2); insurance and injury proceeds and lump sums spent or designated for last illness and burial, medical care, legal fees, medical bills, funeral and burial or income taxes (A.5, A.6, 3.605.4.B.33); the medical, legal and related expenses included in a workers' compensation award (3.605.3.B.4); refugee resettlement and reception and placement money and the Colorado Refugee Services Program Interim Cash Payment (3.605.4.B.28-29); cash value taken from a life or disability insurance policy (B.30); a lump-sum Medicare premium (SMIB) refund to a buy-in recipient (3.605.3.B.9); and a retroactive Colorado Works payment, which is the unit's own grant (3.609.2.G)."
precision: "Each amount is a neutral fact read as 0 when not stated: rental_property_expenses_paid (CO-4364), lump_sum_amounts_spent_or_designated (CO-4365), workers_compensation_award_expenses (CO-4366), refugee_resettlement_payments_received (CO-4367), insurance_cash_value_withdrawn (CO-4368), medicare_premium_refund_received (CO-4370), retroactive_colorado_works_lump_sum_received (CO-4371). Rental expenses reduce only the rent, which other_unearned_income_taxable states, so they are taken up to that amount (A.2: \"countable to the extent it exceeds allowable expenses\"); workers' compensation expenses up to other_unearned_income_nontaxable, where the award is stated. The readers subtract this item with cw_excluded_unearned_income and floor the result at zero."
derived: ["+", [min, [otherwise, rental_property_expenses_paid, 0], [otherwise, other_unearned_income_taxable, 0]], [otherwise, lump_sum_amounts_spent_or_designated, 0], [min, [otherwise, workers_compensation_award_expenses, 0], [otherwise, other_unearned_income_nontaxable, 0]], [otherwise, refugee_resettlement_payments_received, 0], [otherwise, insurance_cash_value_withdrawn, 0], [otherwise, medicare_premium_refund_received, 0], [otherwise, retroactive_colorado_works_lump_sum_received, 0]]
sources: [S3157, S3158, S3163, S3166, S3167]
implemented: engine
tags: [cash, tanf, income]
rationale: "Coverage review CW-14 (P1), CW-22 and CW-23 (P2): the supplied unearned facts are gross, and Colorado Works subtracted none of these expenses or receipts, so gross rent, gross insurance proceeds, refugee resettlement cash, an SMIB refund and the unit's own retroactive grant were counted against the need standard. A separate item rather than more terms in cw_excluded_unearned_income (CO-2341), which lists the exempt sources other programs' rules share; cw_countable_unearned_income (CO-908) and cw_payment_countable_unearned_income (CO-2554) subtract both."
tests:
  - {id: CO-4369-T1, title: "Rent of $900 with $350 of maintenance, taxes and mortgage interest: $350 deducted", as_of: "2026-10-15", month: "2026-10", given: {other_unearned_income_taxable: 900, rental_property_expenses_paid: 350}, expect: 350}
  - {id: CO-4369-T2, title: "Rental expenses above the rent are taken only up to the rent", as_of: "2026-10-15", month: "2026-10", given: {other_unearned_income_taxable: 200, rental_property_expenses_paid: 350}, expect: 200}
  - {id: CO-4369-T3, title: "A $5,000 life insurance payout, $3,200 spent on the last illness and burial; refugee reception and placement money of $400", as_of: "2026-10-15", month: "2026-10", given: {other_unearned_income_taxable: 0, other_unearned_income_nontaxable: 5400, lump_sum_amounts_spent_or_designated: 3200, refugee_resettlement_payments_received: 400}, expect: 3600}
  - {id: CO-4369-T4, title: "A $2,000 workers' compensation award including $600 of medical and legal expenses", as_of: "2026-10-15", month: "2026-10", given: {other_unearned_income_taxable: 0, other_unearned_income_nontaxable: 2000, workers_compensation_award_expenses: 600}, expect: 600}
  - {id: CO-4369-T5, title: "An SMIB refund, a retroactive Colorado Works underpayment correction and cash value taken from a policy", as_of: "2026-10-15", month: "2026-10", given: {other_unearned_income_taxable: 0, other_unearned_income_nontaxable: 0, medicare_premium_refund_received: 120, retroactive_colorado_works_lump_sum_received: 244, insurance_cash_value_withdrawn: 500}, expect: 864}
  - {id: CO-4369-T6, title: "Nothing stated", as_of: "2026-10-15", month: "2026-10", given: {}, expect: 0}
