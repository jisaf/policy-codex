id: CO-4369
name: "Colorado Works: unearned income deductions"
identifier: cw_unearned_income_deductions
kind: derived
type: money
scope: person-month
program: ColoradoWorks
meaning: "The amounts Colorado Works takes off this person's counted unearned receipts for the month (cw_counted_unearned_receipts, CO-5651) besides the receipts its counting table exempts or treats as earned and the parts of a receipt it leaves out as fields of the receipt (cw_receipt_treatment_table, CO-5650): the allowable expenses paid on rental property (9 CCR 2503-6 3.605.3.A.2), up to the month's rent; and, for a spouse, parent or stepparent who is not in the assistance unit, a military allotment received for persons not living in the home up to the need standard for those persons (3.605.3.B.10)."
precision: "Receipt records, migration phase 3 (docs/reviews/receipts-migration-3.md): what is left here is an expense, which is not a receipt, and the one deduction that turns on the person and a count of other persons. The money the scalar facts stated as a part of a counted receipt is now its own receipt kind or field, so it is no longer taken off here: savings account distributions (3.605.4.B.20-22, B.25), an SMIB refund (3.605.3.B.9) and insurance cash value (B.30) are kinds the counting table excludes; board-only and room-only payments are kinds it treats as earned income (3.605.2.E.4.c-d; cw_boarder_income, CO-4361); the amounts of a one-time receipt spent on the costs it covers or designated for the costs of obtaining it are its spent_on_covered_costs and designated_for_lump_sum_costs, which cw_counted_unearned_receipts leaves out (3.605.3.A.5-6, 3.605.4.B.33). Before phase 3 these were neutral facts read as 0 when not stated (savings_account_distributions_received, CO-3816; medicare_premium_refund_received, CO-4370; insurance_cash_value_withdrawn, CO-4368; board_only_payments_received, CO-4832; room_only_payments_received, CO-4830; lump_sum_amounts_spent_or_designated, CO-4365), all retired. Rental expenses (rental_property_expenses_paid, CO-4458) reduce only the rent, the month's receipts of kind rental_income, and are taken up to that amount (A.2: \"countable to the extent it exceeds allowable expenses\"); they are read only when the person has rental income in the month, and required then (coverage pass 4 CA4-16, decision 4 of 2026-11-23; before, they were read as 0 when not stated, and a rent stated before receipt records in the other unearned kinds was capped with them; a rent is now stated as rental_income). Coverage pass 3 (CW3-4): the allotment for persons outside the home is the for_person_living_elsewhere of the person's military_allotment receipts (it was military_allotment_received_for_persons_outside_home, CO-4836, part of the other nontaxable receipts; when the receipts are not stated the deduction cannot be determined, since B.10 gives no reading for an allotment not reported (decision 4 of 2026-11-23 (docs/plan-colorado.md): missing information is cannot determine unless the rule says otherwise; the default of 0 kept from CO-4836 is removed); a stated empty list is no allotment, 0) and its persons military_allotment_persons_outside_home_count (CO-4837); the person is a non-recipient when outside every unit (cw_is_excluded_from_assistance_unit, CO-2350) or a disqualified member (cw_is_disqualified_member, CO-928); the need standard for those persons is the No Caretaker row for that number of children (cw_need_standard_table_no_caretaker, CO-351, up to ten; OQ-860), and up to that amount of the allotment is taken off. An allotment for persons in the home is counted with the other unearned income; a stepparent's or parent's deeming already deducts the needs of those in the home (3.605.1.A.4.a; OQ-860). The readers subtract this item from the counted receipts and floor the result at zero. Field sweep fix round (docs/reviews/field-sweep-snap-cash-nonmagi.md, FS-CW-1): a stream (a receipt with no month and no date) is read only in the months from the month of its start_date through the month of its end_date, as SNAP's readers read it (snap_counted_recurring_receipts, CO-5011), since income is \"the receipt by a client of a gain or benefit in cash or in-kind during a calendar month\" and the unit's income is what it has \"received, or ... expects to receive in the application month and any month following\" (9 CCR 2503-6 3.605.1.A.2, B, S4911): a pension that ended, or one not yet begun, is received in no month outside those dates; a receipt stated with its month or date is read in that month. Before, a stream was read in every month whatever its dates."
