id: CO-909
name: "Colorado Works: deemed income of a minor parent's non-participant parent"
identifier: cw_deemed_parent_income_of_minor_parent
kind: derived
type: money
scope: person-month
program: ColoradoWorks
meaning: For an unmarried minor (under 18) who has a dependent child of her own, the countable income of her own non-participant parent(s) living in the same home, deemed to her assistance unit under 9 CCR 2503-6 3.605.1.A.4 - zero for anyone who is not an unmarried minor parent.
precision: "Per 3.605.1.A.4.a's formula: each such parent's gross earned income minus the cw_earned_income_disregard_dollar employment disregard (floored at zero), plus their unearned income, summed over the parents in the home, minus the needs of those parents and of the individuals in the home for whom they are responsible (cw_minor_parent_deeming_needs_deduction, CO-2000: the need standard for the parents and their other children; OQ-102). Open-question sweep: the deduction had been the One Caretaker need standard for zero children, deducted once per parent; it now counts the parents' other children (3.605.1.A.4.a, S1307) and is deducted once from the parents' combined income. Does not deduct maintenance or child support the parent pays outside the home, or amounts paid to tax dependents outside the home (3.605.1.A.4.a's other two deductions) - not modeled this batch. Fix round (C-11(a)): the deeming guard now reads marital_status = single, per 3.605.1.A.4's own title and first sentence ('Income of a non-participant stepparent and a non-participant parent of an unmarried minor parent') - a married minor parent's own parent's income was previously deemed too, which the rule's own text excludes. Fix round (C-11(b)): reads [of, [P], cw_countable_unearned_income] (CO-908) for the parent's unearned income instead of re-enumerating four of its six components (social_security_income, pension_income, unemployment_income, other_unearned_income_nontaxable), which had silently dropped tanf_cash_income and child_support_received; 3.605.1.A.4.a's 'plus any unearned income' does not admit a shorter list than the program's own unearned-income definition. Vocabulary fix round (R-1): earned income is cw_gross_earned_income (CO-1716): gross wages plus the self-employment net profit 3.605.2.E.1.c treats as earned income; it had read wages only."
assumption: "'Living in the same home' is read from a stated parent relationship edge to this person, per this volume's convention that a stated edge means living together (see cw_minor_parent_living_arrangement_met, CO-906)."
derived: [case, [[all, ["<", age, cw_minor_parent_age_limit], cw_has_dependent_child, ["=", marital_status, single]], [max, 0, ["-", [sum, [filter, [persons], [rel, [child], [P]]], ["-", [+, [max, 0, ["-", [of, [P], cw_gross_earned_income], cw_earned_income_disregard_dollar]], [of, [P], cw_countable_unearned_income]], ["+", [of, [P], child_support_paid_legally_obligated], [otherwise, [of, [P], cw_support_paid_to_tax_dependents_outside_home], 0]]]], cw_minor_parent_deeming_needs_deduction]]], [else, 0]]
sources: [S413, S1307]
open: [OQ-102]
implemented: engine
tags: [cash, tanf, income, household]
rationale: "No existing item models Colorado Works' minor-parent income deeming; cw_countable_income (CO-910) needs it to correctly attribute a non-participant parent's income to the minor parent's assistance unit as 3.605.1.A.4.b requires. Uses [rel, [child], [P]] over every person in the case (not a reachable closure) because the deeming rule reads only this person's direct parent(s), not a wider household closure. Fix round (C-11): adds the marital_status = single guard (a) and reads cw_countable_unearned_income (CO-908) instead of four of its own six components (b), so the two items cannot drift apart on what 'unearned income' means for the same program."
