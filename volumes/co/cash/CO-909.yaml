id: CO-909
name: "Colorado Works: deemed income of a minor parent's non-participant parent"
identifier: cw_deemed_parent_income_of_minor_parent
kind: derived
type: money
scope: person-month
program: ColoradoWorks
meaning: For an unmarried minor (under 18) who has a dependent child of her own, the countable income of her own non-participant parent(s) living in the same home, deemed to her assistance unit under 9 CCR 2503-6 3.605.1.A.4 - zero for anyone who is not an unmarried minor parent. A parent who is a member of her assistance unit (an optional member who requested assistance, 3.604.2.C.2.g) is a participant, whose income the unit already counts, and a parent living elsewhere is not in the same home; neither is deemed.
precision: "Per 3.605.1.A.4.a's formula: each such parent's gross earned income minus the cw_earned_income_disregard_dollar employment disregard (floored at zero), plus their unearned income, summed over the parents in the home, minus the needs of those parents and of the individuals in the home for whom they are responsible (cw_minor_parent_deeming_needs_deduction, CO-2000: the need standard for the parents and their other children; OQ-102). Open-question sweep: the deduction had been the One Caretaker need standard for zero children, deducted once per parent; it now counts the parents' other children (3.605.1.A.4.a, S1307) and is deducted once from the parents' combined income. The deductions of 3.605.1.A.4.a for support paid outside the unit are made (phase-10 sweep, OQ-140): child support paid (child_support_paid_legally_obligated, CO-033), spousal maintenance paid (spousal_maintenance_paid, CO-4354, coverage review CW-20; read as 0 when not stated) and amounts paid to tax dependents outside the home (cw_support_paid_to_tax_dependents_outside_home). Coverage review CW-5, CW-6 (S3155): only a non-participant parent is deemed (one not in cw_assistance_unit_members: a parent who requested inclusion was counted twice, as a member and as deemed income), and only one living in the same home (lives_with, read as living together where no dwelling is stated, convention rule 17; and cw_is_considered_living_in_home, CO-3354, for both, as cw_caretaker_of reads the home). Coverage pass 2 (CW2-2): that set is now named once, cw_minor_parent_deemed_parents (CO-4660), which the needs deduction (CO-2000) reads too. Fix round (C-11(a)): the deeming guard now reads marital_status = single, per 3.605.1.A.4's own title and first sentence ('Income of a non-participant stepparent and a non-participant parent of an unmarried minor parent') - a married minor parent's own parent's income was previously deemed too, which the rule's own text excludes. Fix round (C-11(b)): reads [of, [P], cw_countable_unearned_income] (CO-908) for the parent's unearned income instead of re-enumerating four of its six components (social_security_income, pension_income, unemployment_income, other_unearned_income_nontaxable), which had silently dropped tanf_cash_income and child_support_received; 3.605.1.A.4.a's 'plus any unearned income' does not admit a shorter list than the program's own unearned-income definition. Vocabulary fix round (R-1): earned income is cw_gross_earned_income (CO-1716): gross wages plus the self-employment net profit 3.605.2.E.1.c treats as earned income; it had read wages only. Coverage pass 3 (P3-2): each parent's income less the support that parent pays is floored at zero before the parents are summed, since A.4.a subtracts \"the maintenance or child support paid to others\" from the income of the parent who pays it; one parent's payments do not offset the other parent's income."
derived: [case, [[all, ["<", age, cw_minor_parent_age_limit], cw_has_dependent_child, ["=", marital_status, single]], [max, 0, ["-", [sum, cw_minor_parent_deemed_parents, [max, 0, ["-", ["+", [max, 0, ["-", [of, [P], cw_gross_earned_income], cw_earned_income_disregard_dollar]], [of, [P], cw_countable_unearned_income]], ["+", [of, [P], child_support_paid_legally_obligated], [otherwise, [of, [P], spousal_maintenance_paid], 0], [otherwise, [of, [P], cw_support_paid_to_tax_dependents_outside_home], 0]]]]], cw_minor_parent_deeming_needs_deduction]]], [else, 0]]
sources: [S413, S1307, S3155]
implemented: engine
tags: [cash, tanf, income, household]
open: [OQ-102]
rationale: "No existing item models Colorado Works' minor-parent income deeming; cw_countable_income (CO-910) needs it to correctly attribute a non-participant parent's income to the minor parent's assistance unit as 3.605.1.A.4.b requires. Uses [rel, [child], [P]] over every person in the case (not a reachable closure) because the deeming rule reads only this person's direct parent(s), not a wider household closure. Fix round (C-11): adds the marital_status = single guard (a) and reads cw_countable_unearned_income (CO-908) instead of four of its own six components (b), so the two items cannot drift apart on what 'unearned income' means for the same program."
