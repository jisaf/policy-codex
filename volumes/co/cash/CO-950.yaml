  - {id: CO-950-T2, month: "2026-10", as_of: "2026-10-01", given: {date_of_birth: "1990-01-01", receives_ssi: false, meets_ssa_disability_criteria: true, af_has_total_disability_six_months: true, is_blind: false, state_of_residence: CO, is_fleeing_felon: false, ssi_income: 0, receipts: [{kind: social_security}, {kind: pension}, {kind: unemployment_compensation}, {kind: child_support}, {kind: colorado_works_cash}, {kind: adult_financial_cash}, {kind: tax_exempt_interest}, {kind: other_taxable}, {kind: other_nontaxable}]}, expect: false}
