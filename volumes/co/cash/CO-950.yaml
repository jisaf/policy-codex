id: CO-950
name: "Adult Financial: AND-CS eligible"
identifier: af_and_cs_eligible
kind: derived
type: yes/no
scope: person-month
program: AdultFinancial
meaning: Whether the person is age zero through fifty-nine, receives SSI due to disability or blindness, and is a Colorado resident, so as to qualify for the AND-CS state supplement, per 9 CCR 2503-5 3.546 and 3.547.A.
precision: "K-6 fix round: 3.546 (S462) limits AND-CS to SSI recipients 'not receiving the full SSI benefit standard.' ssi_income (CO-849) now carries the dollar amount, tested against ssi_federal_benefit_rate_individual (CO-235, the 2026 federal benefit rate from D-58, reused cross-program because 3.546 does not restate a Colorado-specific figure) rather than a state figure of its own. This closes OQ-116. OQ-115's rollover/subtract-and-add-back mechanics for af_countable_income (CO-946) remain unmodeled; this item tests ssi_income directly rather than going through af_countable_income. Scope changed from person to person-month because ssi_income (CO-849) is a per-month fact. Receipt records, migration phase 1: the SSI compared with the benefit rate is af_ssi_receipts is read from the receipts (CO-5000). Coverage pass 4 CA4-15: the age limit is taken in the month evaluated, 59 or younger on its first day ; before, the determination date's age was read in every month (OQ-951). Pattern sweep (cash) PS-T12 (docs/reviews/pattern-sweep-cash.md): SSI received in the month (af_receives_ssi_in_month, CO-7605; 3.554.C.6), not the determination date's award, so a month before SSI began is not an AND-CS month."
derived: [all, ["<=", [years_between, date_of_birth, [first_day, [month]]], af_and_max_age], af_receives_ssi_in_month, [any, meets_ssa_disability_criteria, is_blind], af_meets_residency, ["<", af_ssi_receipts, ssi_federal_benefit_rate_individual]]
sources: [S462, S463, S533, S711, S4794]
implemented: engine
tags: [cash, and, age, disability]
open: [OQ-783]
rationale: "No existing item states the AND-CS eligibility test. af_category (CO-953) needs it. Fix round (K-6): adds the 'not receiving the full SSI benefit standard' test now that ssi_income (CO-849) exists, reusing ssi_federal_benefit_rate_individual (CO-235) cross-program as the comparison figure rather than restating the SSI federal benefit rate under a new AND-CS-prefixed parameter."
