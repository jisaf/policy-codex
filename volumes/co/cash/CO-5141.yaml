id: CO-5141
name: "Colorado Works: pay from a job begun since the application"
identifier: cw_new_source_earnings
kind: derived
type: money
scope: person-month
program: ColoradoWorks
meaning: "The pay this person received in the month, of the kinds Colorado Works counts (cw_earned_pay), from a job that began on or after the unit's Colorado Works application date (cw_application_date): the earnings records whose job_start_date is on or after that date. It is the new source of earned income of 9 CCR 2503-6 3.606.2.A.2.a (\"A new source of earned income shall receive a one hundred percent (100%) earned income disregard for the first certification period that the income impacts\") when the month falls in that certification period (cw_is_new_earned_income_source, CO-1502); cw_payment_countable_earned_income (CO-922) reads it there."
precision: "Earned-income records, step E1 Colorado Works (docs/reviews/records-earnings-cash.md): replaces cw_new_source_earned_income (CO-2374), the part of wages_gross a case stated for a month with both a new and a current source (phase-10 sweep, OQ-350): each job is now its own record, so its start date (job_start_date; a record that states none began before the months the case covers, earnings CO-5100) says which pay is new. A source is new when it began while the unit was receiving basic cash assistance (3.606.2.A.2); the unit cannot have begun receiving before it applied, so a job begun before the application date is a current source, and one begun on or after it is new; a job begun after the application but before the unit was approved is within the first certification period, which A.1 disregards in full whatever the source. Whether the month falls in the first certification period that the new income impacts depends on the certification periods (six months, 3.606.1.E) and on when the change takes effect (3.606.3.A), which no supplied fact states; it stays the county's statement, cw_is_new_earned_income_source (OQ-1142). A business begun since the application is a new source too, but its receipts are counted net of costs (cw_self_employment_net_profit) and are not in this sum; a person whose only new source is a business states cw_is_new_earned_income_source alone, as before. The application date is read only for a record that states its job_start_date. An unstated earnings list is cannot determine. Coverage pass 4 CA4-9 (docs/reviews/coverage4-cash.md): a stream (an earnings record with no month and no date) is read only in the months from the month of its job_start_date through the month of its job_end_date, so the pay of a job that ended before the month, or begins after it, is not counted (9 CCR 2503-5 3.520.781.G, 9 CCR 2503-6 3.605.2.B: income counted when received); a record stated with its month or date is read in that month. Coverage pass 4 CA4-7: a difficulty of care payment stated as foster care (foster_care) is not counted pay. Field sweep fix round (FS-CW-4): 3.605.2.B (S4912): wages are \"considered available when paid rather than when earned, except that wages held at the request of the employee are considered income in the month they would otherwise have been paid\". A pay that states its regular_date and that the employer held at the person's request (regular_date_reason held_at_request, a neutral field of the earnings record) is read in the month of its regular_date; a pay that came early or late for any other reason (a holiday or a weekend, changed pay dates) is read in the month it was paid, so regular_date_reason is required where regular_date is stated (decision 4). Before, every pay was read in the month it came in, so held wages fell into the next month. The contract employment the paragraph excepts is OQ-1295."
derived: ["sum_receipts", "earnings", ["all", ["all", ["case", [["all", ["not", ["unknown", ["receipt", "regular_date"]]], ["=", ["receipt", "regular_date_reason"], "held_at_request"]], ["=", ["month_of", ["receipt", "regular_date"]], ["month"]]], ["else", ["received_in", ["month"]]]], ["any", ["in", ["lookup", "cw_earnings_treatment_table", ["receipt", "kind"]], ["counted", "counted_no_rule_excludes", "counted_at_value"]], ["all", ["=", ["lookup", "cw_earnings_treatment_table", ["receipt", "kind"]], "counted_unless_foster_care"], ["not", ["receipt", "foster_care"]]]], ["not", ["unknown", ["receipt", "job_start_date"]]], [">=", ["receipt", "job_start_date"], "cw_application_date"]], ["any", ["not", ["unknown", ["receipt", "month"]]], ["all", ["any", ["unknown", ["receipt", "job_start_date"]], ["<=", ["month_of", ["receipt", "job_start_date"]], ["month"]]], ["any", ["unknown", ["receipt", "job_end_date"]], [">=", ["month_of", ["receipt", "job_end_date"]], ["month"]]]]]], ["receipt", "amount"]]
