  - {id: CO-2384-T2, title: "The spouse is on Medicaid with income within the OAP standard - nothing deemed (3.534.C)", as_of: "2026-10-01", month: "2026-10", given: {af_is_oap_age: true}, others: {p2: {receives_ssi: false, receives_medicaid: true, wages_gross: 0, af_self_employment_net_profit: 0, social_security_income: 900, pension_income: 0, unemployment_income: 0, tanf_cash_income: 0, adult_financial_cash_income: 0, child_support_received: 0, other_unearned_income_taxable: 0, other_unearned_income_nontaxable: 0, tax_exempt_interest: 0, ssi_income: 0}}, relationships: [[spouse, p1, p2]], expect: 0}
  - {id: CO-2384-T3, title: "AND-SO client with no unearned income - the spouse's $500 pension less $20", as_of: "2026-10-01", month: "2026-10", given: {af_is_oap_age: false, af_and_cs_eligible: false, wages_gross: 0, af_self_employment_net_profit: 0, social_security_income: 0, pension_income: 0, unemployment_income: 0, tanf_cash_income: 0, adult_financial_cash_income: 0, child_support_received: 0, other_unearned_income_taxable: 0, other_unearned_income_nontaxable: 0, tax_exempt_interest: 0, ssi_income: 0}, others: {p2: {receives_ssi: false, receives_medicaid: false, wages_gross: 0, af_self_employment_net_profit: 0, social_security_income: 0, pension_income: 500, unemployment_income: 0, tanf_cash_income: 0, adult_financial_cash_income: 0, child_support_received: 0, other_unearned_income_taxable: 0, other_unearned_income_nontaxable: 0, tax_exempt_interest: 0, ssi_income: 0}}, relationships: [[spouse, p1, p2]], expect: 480}
