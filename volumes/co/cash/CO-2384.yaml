id: CO-2384
name: "Adult Financial: income deemed from a spouse or parent"
identifier: af_deemed_relative_income
kind: derived
type: money
scope: person-month
program: AdultFinancial
meaning: "The income deemed to this Adult Financial client for the month from the client's spouse, wherever the spouse lives, and, for an AND-CS client who is an unemancipated child, from the parents in the home (9 CCR 2503-5 3.534.A-C, 3.544.D-F, 3.549.C-F): for each such relative, nothing if the relative receives Adult Financial grant payments, SSI or Medicaid and has income no greater than the OAP grant standard (for an OAP client) or the SSI benefit standard (otherwise); else af_earned_income_remainder_rate of the relative's gross earned income over af_earned_income_disregard, plus the relative's unearned income less, for an OAP client, the OAP grant standard, the needs of the relative's dependent children, medical payments for dependents and court-ordered support (3.534.B); for an AND-CS or AND-SO client, the part of the couple's $20 (af_general_income_disregard) the client has not used: the $20 less the client's own disregard applied to unearned income and, for AND-CS, rolled to earned income (3.549.D.2: \"A couple shall be allowed a combined $20.00 disregard, which is split between the client and the spouse\"; 3.544.E.2: \"$20.00 unless the client also has unearned income\", split so that no more than $20 is applied)."
precision: "The program is read as af_countable_income reads it, without a cycle through af_category: OAP when af_is_oap_age, AND-CS when af_and_cs_eligible, AND-SO otherwise. A relative's income for the exemption is gross earned and unearned income, SSI included; earned income includes in-kind pay and donated work hours (3.520.782.B, 3.520.784, \"client, client's spouse, or sponsor(s)\"; coverage review F-10). Court-ordered support is child_support_paid_legally_obligated. The MMMNA deduction for an institutionalized spouse (3.534.C, 3.544.F, 3.549.F) is not modeled: an institutionalized spouse in this volume is assessed through the Medicaid post-eligibility items. The allowance the client retains is the client's own unearned income (3.520.785.B.24), stated in the client's other_unearned_income_nontaxable and counted by af_unearned_income_other_than_ssi (CO-3831; coverage review P2-6). Emancipation (3.549.E) is read from is_emancipated_minor (CO-843; same-word audit SW-16); a child under af_and_cs_unemancipated_child_age_limit (CO-3053) is read as unemancipated. The disregards are Adult Financial's own (af_earned_income_disregard, af_earned_income_remainder_rate, af_general_income_disregard; hard-coded numbers audit D-4). Same-word audit SW-7 (convention rule 17): an edge joins persons who live together (lives_with, CO-1925, from dwelling_id); where a case states no dwelling_id the edge is read as living together, as before. Coverage review F-3 (confirmed with the engine on probe PR-APART): the spouse is deemed wherever the spouse lives, as af_client_and_spouse_countable_resources (CO-2389) counts the spouse's resources: 3.534.A-B, 3.544.D-E and 3.549.C-D deem from \"the client's spouse\" with no living-together condition, 3.520.63.D (S3204) makes a client who is not legally separated or divorced married, and 3.534.B.3 speaks of \"each dependent child living in the household of the spouse\"; a legally separated spouse states no spouse edge. Parents are deemed to an AND-CS child only from the child's home (lives_with), as the SSI parent-deeming rule 3.549.E adopts. Final cash review FC-4: the client's own disregard is now the client's share of the $20 (af_client_general_income_disregard, CO-3829), so the relative's deduction is what the client leaves of the couple's $20 (af_general_income_disregard_applied_to_unearned and af_general_income_disregard_rolled_to_earned, CO-3832, CO-3833); before, an AND-CS client with earnings could roll the whole $20 to earnings while the spouse also deducted it, and an AND-SO client with any unearned income left the spouse nothing (OQ-661). Receipt records, migration phase 1: a relative's grant is af_grant_receipts is read from the receipts (CO-5000). Coverage pass 6 CA6-4, CA6-7 (docs/reviews/coverage6-cash.md): the AND-CS client's age for the parents' deeming (3.549.E, under 18) is taken on the first day of the month evaluated, as AND-CS's own upper limit is (docs/operators.md, \"Ages in a month\"; OQ-951), and the client's emancipation (is_emancipated_minor) is required where read (decision 4 of 2026-11-23); before, the determination date's age, and an unstated emancipation read as none."
