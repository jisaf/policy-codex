id: CO-2384
name: "Adult Financial: income deemed from a spouse or parent"
identifier: af_deemed_relative_income
kind: derived
type: money
scope: person-month
program: AdultFinancial
meaning: "The income deemed to this Adult Financial client for the month from a spouse in the home and, for an AND-CS client who is an unemancipated child, from the parents in the home (9 CCR 2503-5 3.534.A-C, 3.544.D-F, 3.549.C-F): for each such relative, nothing if the relative receives Adult Financial grant payments, SSI or Medicaid and has income no greater than the OAP grant standard (for an OAP client) or the SSI benefit standard (otherwise); else af_earned_income_remainder_rate of the relative's gross earned income over af_earned_income_disregard, plus the relative's unearned income less, for an OAP client, the OAP grant standard, the needs of the relative's dependent children, medical payments for dependents and court-ordered support (3.534.B); for an AND-CS client, the part of af_general_income_disregard the client's own unearned income leaves unused (3.549.D); for an AND-SO client, af_general_income_disregard unless the client has unearned income (3.544.E)."
precision: "The program is read as af_countable_income reads it, without a cycle through af_category: OAP when af_is_oap_age, AND-CS when af_and_cs_eligible, AND-SO otherwise. A relative's income for the exemption is gross earned and unearned income, SSI included. Court-ordered support is child_support_paid_legally_obligated. The MMMNA deduction for an institutionalized spouse (3.534.C, 3.544.F, 3.549.F) is not modeled: an institutionalized spouse in this volume is assessed through the Medicaid post-eligibility items. Emancipation (3.549.E) is read from is_emancipated_minor (CO-843; same-word audit SW-16); a child under af_and_cs_unemancipated_child_age_limit (CO-3053) is read as unemancipated. The disregards are Adult Financial's own (af_earned_income_disregard, af_earned_income_remainder_rate, af_general_income_disregard; hard-coded numbers audit D-4)."
derived: [sum, [filter, [persons], [any, [rel, [spouse], [P]], [all, [not, af_is_oap_age], af_and_cs_eligible, ["<", age, af_and_cs_unemancipated_child_age_limit], [not, [otherwise, is_emancipated_minor, false]], [rel, [child], [P]]]]], [case, [[all, [any, [of, [P], receives_ssi], [">", [of, [P], adult_financial_cash_income], 0], [otherwise, [of, [P], receives_medicaid], false]], ["<=", [+, [+, [of, [P], wages_gross], [of, [P], af_self_employment_net_profit]], [+, [of, [P], social_security_income], [of, [P], pension_income], [of, [P], unemployment_income], [of, [P], tanf_cash_income], [of, [P], adult_financial_cash_income], [of, [P], child_support_received], [of, [P], other_unearned_income_taxable], [of, [P], other_unearned_income_nontaxable], [of, [P], tax_exempt_interest], [of, [P], ssi_income]]], [case, [af_is_oap_age, af_oap_grant_standard], [else, ssi_federal_benefit_rate_individual]]]], 0], [else, [+, ["*", [max, 0, ["-", [+, [of, [P], wages_gross], [of, [P], af_self_employment_net_profit]], af_earned_income_disregard]], af_earned_income_remainder_rate], [case, [af_is_oap_age, [max, 0, ["-", [+, [of, [P], social_security_income], [of, [P], pension_income], [of, [P], unemployment_income], [of, [P], tanf_cash_income], [of, [P], adult_financial_cash_income], [of, [P], child_support_received], [of, [P], other_unearned_income_taxable], [of, [P], other_unearned_income_nontaxable], [of, [P], tax_exempt_interest], [of, [P], ssi_income]], [+, af_oap_grant_standard, [of, [P], af_spouse_dependent_children_needs], [otherwise, [of, [P], af_medical_payments_for_dependents], 0], [of, [P], child_support_paid_legally_obligated]]]]], [af_and_cs_eligible, [max, 0, ["-", [+, [of, [P], social_security_income], [of, [P], pension_income], [of, [P], unemployment_income], [of, [P], tanf_cash_income], [of, [P], adult_financial_cash_income], [of, [P], child_support_received], [of, [P], other_unearned_income_taxable], [of, [P], other_unearned_income_nontaxable], [of, [P], tax_exempt_interest], [of, [P], ssi_income]], [max, 0, ["-", af_general_income_disregard, [+, social_security_income, pension_income, unemployment_income, tanf_cash_income, child_support_received, other_unearned_income_taxable, other_unearned_income_nontaxable, tax_exempt_interest]]]]]], [else, [max, 0, ["-", [+, [of, [P], social_security_income], [of, [P], pension_income], [of, [P], unemployment_income], [of, [P], tanf_cash_income], [of, [P], adult_financial_cash_income], [of, [P], child_support_received], [of, [P], other_unearned_income_taxable], [of, [P], other_unearned_income_nontaxable], [of, [P], tax_exempt_interest], [of, [P], ssi_income]], [case, [[">", [+, social_security_income, pension_income, unemployment_income, tanf_cash_income, child_support_received, other_unearned_income_taxable, other_unearned_income_nontaxable, tax_exempt_interest], 0], 0], [else, af_general_income_disregard]]]]]]]]]]
sources: [S1632, S1633, S1634]
implemented: engine
tags: [cash, income]
rationale: "OQ-114: af_countable_income (CO-946) read only the client's own income; 3.534, 3.544.D-F and 3.549.C-F (S1632-S1634) deem a spouse's income, and an AND-CS child's parents' income, to the client."
tests:
