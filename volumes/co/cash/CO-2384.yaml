rationale: "OQ-114: af_countable_income (CO-946) read only the client's own income; 3.534, 3.544.D-F and 3.549.C-F (S1632-S1634) deem a spouse's income, and an AND-CS child's parents' income, to the client. Dual-entry audit 3.16 (audit fix round): Medicaid receipt reads is_enrolled_in_medical_assistance (CO-2435), the one enrollment record, which replaced receives_medicaid (CO-2393). Same-word SW-7: the relative in the home is read from lives_with."
