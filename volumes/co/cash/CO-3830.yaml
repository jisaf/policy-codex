id: CO-3830
name: "Adult Financial: gross earned income"
identifier: af_gross_earned_income
kind: derived
type: money
scope: person-month
program: AdultFinancial
meaning: "This person's gross earned income for the month for Adult Financial: the pay the earnings table counts (af_earned_pay: gross monetary wages and in-kind earned income at the value of the item supplied, 9 CCR 2503-5 3.520.782.A-B), plus the self-employment net profit of 3.520.783.B (af_self_employment_net_profit), the board, room, and room and board payments less the expenses of providing them (3.520.783.C.2.b-d, af_boarder_income) and donated work hours that count (3.520.784, af_donated_work_income), less the earned income 3.520.786 exempts by a field of the pay (af_excluded_earned_income: a PASS set-aside, I; infrequent or irregular pay, O), never below zero."
precision: "Earned-income records, step E1 Adult Financial (docs/reviews/records-earnings-cash.md): read from the earnings records (earnings, CO-5100) through af_earnings_treatment_table (CO-5103), replacing wages_gross, in_kind_compensation_value and the parts of wages_gross af_excluded_earned_income subtracted (work_study_earnings): a kind the table excludes (work-study, 3.520.786.H; 37 U.S.C. 310 special pay, K) is never counted, so it is not subtracted either. The same for the client, the client's spouse and the sponsor(s): the deeming items (af_deemed_relative_income CO-2384, af_deemed_sponsor_income CO-2386) read it for each relative. An unstated earnings list is cannot determine (product-owner decision 4 of 2026-11-23); a stated empty list is no earned income."
derived: [max, 0, ["-", [+, af_earned_pay, af_self_employment_net_profit, af_boarder_income, af_donated_work_income], af_excluded_earned_income]]
sources: [S1622, S1002, S2610, S3211, S4380]
implemented: engine
tags: [cash, oap, and, income]
rationale: "Final cash review FC-4 and FC-5: af_countable_income (CO-946) computed this figure inline; the split $20 and the rollover now read it in their own items (CO-3832, CO-3833), so it is stated once. The derivation is CO-946's former earned-income term. Earned-income records, step E1 Adult Financial: the pay, business and boarder parts are read from the earnings records through the program's counting table (af_earned_pay CO-5130, af_self_employment_net_profit CO-1708, af_boarder_income CO-5131)."
tests:
  # Hand computations from 3.520.782 (S3211), 3.520.783.C.2 (S4380), 3.520.786.H, I (S2206, S2608).
  - {id: CO-3830-T1, title: "$365 of wages and $100 of work-study (exempt, H): 365", as_of: "2026-10-01", month: "2026-10", given: {receipts: [], earnings: [{kind: wages, amount: 365}, {kind: work_study, amount: 100}]}, expect: 365}
  - {id: CO-3830-T3, title: "F-10: an apartment manager paid $365 in wages and $100 of work-study, housed rent-free worth $700 for building maintenance (3.520.782.B): 365 + 700 = 1,065", as_of: "2026-10-01", month: "2026-10", given: {receipts: [], earnings: [{kind: wages, amount: 365}, {kind: work_study, amount: 100}, {kind: in_kind_pay, amount: 700}]}, expect: 1065}
  - {id: CO-3830-T2, title: "No earnings", as_of: "2026-10-01", month: "2026-10", given: {receipts: [], earnings: []}, expect: 0}
  - {id: CO-3830-T4, title: "$500 of wages and a lodger's $400 for a room with $50 of costs (C.2.c): 500 + 350 = 850", as_of: "2026-10-01", month: "2026-10", given: {receipts: [], earnings: [{kind: wages, amount: 500}, {kind: boarder_payments, amount: 400, provides: room_only, boarders: 1}, {kind: business_cost_boarder_provision, amount: 50, provides: room_only}]}, expect: 850}
  - {id: CO-3830-T5, title: "$800 of wages, $200 of it set aside under an SSA-approved PASS (3.520.786.I): 800 - 200 = 600", as_of: "2026-10-01", month: "2026-10", given: {receipts: [], earnings: [{kind: wages, amount: 800, pass_set_aside: 200}]}, expect: 600}
  - {id: CO-3830-T6, title: "Earnings not stated: cannot determine (decision 4)", as_of: "2026-10-01", month: "2026-10", given: {receipts: []}, expect: unknown}
