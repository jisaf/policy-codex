id: CO-2554
name: "Colorado Works: countable unearned income for the grant"
identifier: cw_payment_countable_unearned_income
kind: derived
type: money
scope: person-month
program: ColoradoWorks
meaning: "This person's countable unearned income for the Colorado Works grant calculation: the unearned income cw_countable_unearned_income (CO-908) counts, without any child support, which 9 CCR 2503-6 3.605.5.B and C.3 and C.R.S. 26-2-709(1)(a)(IV) exclude from the basic cash assistance grant calculation once the unit is found eligible."
precision: "The same sources and exclusion as CO-908 (Social Security, pension, unemployment, Adult Financial grants, other unearned income taxable or not and tax-exempt interest, less cw_excluded_unearned_income), floored at zero. Colorado Works' own grant is not income to the unit. Coverage review (CW-9, CW-11, CW-14, CW-22, CW-23): lottery and gambling winnings, which are not part of the unearned income facts (lottery_gambling_winnings_received, CO-1181), are a prize (3.605.3.A.14, S3157) and are added; so is potential income the client refuses to make a reasonable effort to secure (cw_refused_potential_income, CO-4362, 3.605.1.A.3.c, S3160); both are read as 0 when not stated. Besides the exempt sources (CO-2341), cw_unearned_income_deductions (CO-4369) is subtracted: allowable rental expenses, insurance and lump-sum amounts spent or designated for the costs the rule names, workers' compensation award expenses, refugee resettlement money, insurance cash value taken, an SMIB refund and a retroactive Colorado Works payment (S3157, S3158, S3163, S3166, S3167)."
derived: [max, 0, ["-", ["+", social_security_income, pension_income, unemployment_income, adult_financial_cash_income, other_unearned_income_taxable, other_unearned_income_nontaxable, tax_exempt_interest, [otherwise, lottery_gambling_winnings_received, 0], [otherwise, cw_refused_potential_income, 0]], ["+", [otherwise, cw_excluded_unearned_income, 0], cw_unearned_income_deductions]]]
sources: [S1805, S1802, S1621, S412, S3157, S3158, S3160, S3163, S3166, S3167]
implemented: engine
tags: [cash, tanf, income]
rationale: "CDHS review B-2: cw_payment_countable_income (CO-923) summed CO-908, which includes child support, so every grant with child support was underpaid by the support. CO-908 keeps the eligibility figure; this item is the grant figure."
nearest: [CO-908]
tests:
  - {id: CO-2554-T1, month: "2026-10", as_of: "2026-10-01", given: {social_security_income: 100, pension_income: 0, unemployment_income: 0, adult_financial_cash_income: 0, child_support_received: 200, other_unearned_income_nontaxable: 0, other_unearned_income_taxable: 0, tax_exempt_interest: 0, receipts: [{kind: social_security, amount: 100}, {kind: ssi}, {kind: child_support, amount: 200}, {kind: colorado_works_cash}]}, title: "$200 of child support and $100 of Social Security: only the $100 counts in the grant", expect: 100}
  - {id: CO-2554-T2, month: "2026-10", as_of: "2026-10-01", given: {social_security_income: 400, pension_income: 0, unemployment_income: 0, adult_financial_cash_income: 0, child_support_received: 0, other_unearned_income_nontaxable: 250, other_unearned_income_taxable: 0, tax_exempt_interest: 0, cw_excluded_unearned_income: 250, receipts: [{kind: social_security, amount: 400}, {kind: ssi}, {kind: colorado_works_cash}, {kind: other_nontaxable, amount: 250}]}, title: "Excluded income comes off", expect: 400}
