id: CO-2554
name: "Colorado Works: countable unearned income for the grant"
identifier: cw_payment_countable_unearned_income
kind: derived
type: money
scope: person-month
program: ColoradoWorks
meaning: "This person's countable unearned income for the Colorado Works grant calculation: the unearned income cw_countable_unearned_income (CO-908) counts, without any child support, which 9 CCR 2503-6 3.605.5.B and C.3 and C.R.S. 26-2-709(1)(a)(IV) exclude from the basic cash assistance grant calculation once the unit is found eligible."
precision: "The same receipts and deductions as CO-908 (cw_counted_unearned_receipts, CO-5651, through the counting table cw_receipt_treatment_table, CO-5650; cw_unearned_income_deductions, CO-4369), floored at zero, without child support. Colorado Works' own grant is not income to the unit. Receipt records, migration phase 2 (docs/reviews/receipts-migration-2-cw.md): read from the receipts, replacing the sum of the scalar unearned income facts less cw_excluded_unearned_income (CO-2341, removed). Coverage review (CW-9, CW-11, CW-14, CW-22, CW-23): a lottery or gambling prize is counted (3.605.3.A.14) as a receipt of its own; potential income the client refuses to make a reasonable effort to secure (cw_refused_potential_income, CO-4362, 3.605.1.A.3.c, S3160), a county finding rather than a receipt, is read as 0 when not stated."
derived: [max, 0, ["-", ["+", cw_counted_unearned_receipts, [otherwise, cw_refused_potential_income, 0]], cw_unearned_income_deductions]]
sources: [S1805, S1802, S1621, S412, S3157, S3160, S3163, S3166, S4000]
implemented: engine
tags: [cash, tanf, income]
rationale: "CDHS review B-2: cw_payment_countable_income (CO-923) summed CO-908, which includes child support, so every grant with child support was underpaid by the support. CO-908 keeps the eligibility figure; this item is the grant figure."
nearest: [CO-908]
tests:
  - {id: CO-2554-T1, month: "2026-10", as_of: "2026-10-01", given: {receipts: [{kind: social_security, amount: 100}, {kind: child_support, amount: 200}, {kind: colorado_works_cash, amount: 488}]}, title: "$200 of child support and $100 of Social Security: only the $100 counts in the grant", expect: 100}
  - {id: CO-2554-T2, month: "2026-10", as_of: "2026-10-01", given: {receipts: [{kind: social_security, amount: 400}, {kind: crime_victim_compensation, amount: 250}]}, title: "Excluded income (crime victim compensation, 3.605.4.A.8) is not counted", expect: 400}
