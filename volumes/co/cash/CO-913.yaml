id: CO-913
name: "Colorado Works: meets income test"
identifier: cw_meets_income_test
kind: derived
type: yes/no
scope: person-month
program: ColoradoWorks
meaning: Whether this person's assistance unit's net countable income is strictly below the need standard for its size, per 9 CCR 2503-6 3.606.1.H and 3.606.1.J.4 (income equal to or exceeding the need standard is ineligible).
derived: ["<", cw_countable_income, cw_need_standard]
sources: [S415]
open: [OQ-153]
implemented: engine
tags: [cash, tanf, income]
rationale: "No existing item states the Colorado Works income test; cw_eligibility_status (CO-920) needs it. Fix round (M-2): the fetched text states this boundary two ways - 3.606.1.H's 'shall not exceed' (equal passes) and 3.606.1.J.4's 'equals or exceeds ... not eligible' (equal fails) - see the new OQ-153; this item keeps J.4's strict-less-than reading, unchanged from before."
tests:
  - {id: CO-913-T1, as_of: "2026-10-01", month: "2026-10", given: {cw_countable_income: 100, cw_need_standard: 331}, expect: true}
  - {id: CO-913-T2, as_of: "2026-10-01", month: "2026-10", given: {cw_countable_income: 331, cw_need_standard: 331}, expect: false}
  - {id: CO-913-T3, as_of: "2026-10-01", month: "2026-10", given: {cw_countable_income: 2037, cw_need_standard: 331}, expect: false}
