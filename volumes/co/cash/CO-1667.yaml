id: CO-1667
name: "Adult Financial: disability verification is pending"
identifier: af_disability_verification_is_pending
kind: derived
type: yes/no
scope: person-month
program: AdultFinancial
role: outcome
meaning: Whether Adult Financial requires verification of the client's SSI eligibility, the disability basis of AND-CS, through SVES or SDX and it has not been provided.
derived: [all, af_requires_verification_of_disability, [not, disability_verified_by_electronic_data_source]]
sources: [S533]
implemented: engine
tags: [verification, cash]
rationale: "Review U-1: the count items held this test as an anonymous arm, so no outcome told a worker which document was outstanding and for whom; the count now sums this item."
tests:
  - {id: CO-1667-T1, month: "2026-10", as_of: "2026-10-01", given: {af_requires_verification_of_disability: true, disability_verified_by_electronic_data_source: false}, expect: true}
  - {id: CO-1667-T2, month: "2026-10", as_of: "2026-10-01", given: {af_requires_verification_of_disability: false}, expect: false}
