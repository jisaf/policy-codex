id: CO-1219
name: "Home Care Allowance: grant amount"
identifier: af_hca_grant
kind: derived
type: money
scope: person-month
program: AdultFinancial
role: outcome
meaning: The monthly Home Care Allowance payment for an eligible client - the CMA-authorized amount, raised by a State Supplementary Payment to the HCA payment floor when below it - or zero for a client who is not eligible, per 9 CCR 2503-5 3.570.11.B, 3.570.11.E.2 and 3.570.13.D.
precision: "The tier maximums are not stated in the rule (OQ-250); the authorized amount is supplied. Coverage review 2 (first-pass P2-4): payment begins on the first of the month after the approval month or with the month of the CMA's payment effective date, whichever is later, and nothing is paid for an earlier month (3.570.13.F, S3503: \"There shall be no retroactive HCA payments\"); an unstated approval date or payment effective date sets no later start. Pattern sweep (cash) PS-D1 (docs/reviews/pattern-sweep-cash.md): the payment begins the month after approval (3.570.13.F); for a client not approved before this determination (af_hca_approval_date not stated, its declared meaning) the approval is this determination, so nothing is paid for the determination month or a month before it. Before, an unstated approval date was read as no limit, and every month was paid."
derived: [case, [["=", af_hca_eligibility_status, eligible], [case, [[any, [all, [unknown, af_hca_approval_date], ["<=", [month], [det_month]]], [all, [not, [unknown, af_hca_approval_date]], ["<=", [month], [month_of, af_hca_approval_date]]], [all, [not, [unknown, af_hca_payment_effective_date]], ["<", [month], [month_of, af_hca_payment_effective_date]]]], 0], [else, [max, af_hca_payment_floor, hca_authorized_amount]]]], [else, 0]]
sources: [S713, S714, S3503]
open: [OQ-250]
implemented: engine
tags: [cash, income]
rationale: No existing item computes the HCA payment; it is the program's benefit outcome.
tests:
  - {id: CO-1219-T1, as_of: "2026-10-01", month: "2026-10", given: {af_hca_approval_date: "2026-06-15", af_hca_eligibility_status: eligible, hca_authorized_amount: 1100}, expect: 1100}
  - {id: CO-1219-T2, as_of: "2026-10-01", month: "2026-10", given: {af_hca_approval_date: "2026-06-15", af_hca_eligibility_status: eligible, hca_authorized_amount: 600}, expect: 977}
  - {id: CO-1219-T3, as_of: "2026-10-01", month: "2026-10", given: {af_hca_eligibility_status: ineligible_functional, hca_authorized_amount: 600}, expect: 0}
  - {id: CO-1219-T4, title: "P2-4: approved on October 6 - no payment for October (3.570.13.F)", as_of: "2026-10-01", month: "2026-10", given: {af_hca_eligibility_status: eligible, hca_authorized_amount: 1100, af_hca_approval_date: "2026-10-06"}, expect: 0}
  - {id: CO-1219-T5, title: "P2-4: approved in September - November paid", as_of: "2026-11-01", month: "2026-11", given: {af_hca_eligibility_status: eligible, hca_authorized_amount: 1100, af_hca_approval_date: "2026-09-20"}, expect: 1100}
  - {id: CO-1219-T6, title: "P2-4: approved in September, the CMA form's payment effective date December 1 - nothing for November", as_of: "2026-11-01", month: "2026-11", given: {af_hca_eligibility_status: eligible, hca_authorized_amount: 1100, af_hca_approval_date: "2026-09-20", af_hca_payment_effective_date: "2026-12-01"}, expect: 0}
  # Pattern sweep (cash) PS-D1: 3.570.13.F (S3503) payment begins the first day of the month following the month in which HCA is approved; no retroactive payments. A client not approved before this determination (no af_hca_approval_date) is approved at it: determined 2026-10-15.
  - {id: "CO-1219-T7", title: "Pattern sweep PS-D1: not approved before, eligible, determined October 15: nothing for October, the approval month (was the authorized amount)", as_of: "2026-10-15", month: "2026-10", given: {af_hca_eligibility_status: eligible, hca_authorized_amount: 1100}, expect: 0}
  - {id: "CO-1219-T8", title: "PS-D1: November, the month after the approval: 1,100", as_of: "2026-10-15", month: "2026-11", given: {af_hca_eligibility_status: eligible, hca_authorized_amount: 1100}, expect: 1100}
