id: CO-1219
name: "Home Care Allowance: grant amount"
identifier: af_hca_grant
kind: derived
type: money
scope: person-month
program: AdultFinancial
role: outcome
meaning: The monthly Home Care Allowance payment for an eligible client - the CMA-authorized amount, raised by a State Supplementary Payment to the HCA payment floor when below it - or zero for a client who is not eligible, per 9 CCR 2503-5 3.570.11.B, 3.570.11.E.2 and 3.570.13.D.
precision: "The tier maximums are not stated in the rule (OQ-250); the authorized amount is supplied. No retroactive payment and the first-of-the-following-month start (3.570.13.F) are not modeled."
derived: [case, [[=, af_hca_eligibility_status, eligible], [max, af_hca_payment_floor, hca_authorized_amount]], [else, 0]]
sources: [S713, S714]
open: [OQ-250]
implemented: engine
tags: [cash, income]
rationale: No existing item computes the HCA payment; it is the program's benefit outcome.
tests:
  - {id: CO-1219-T1, as_of: "2026-10-01", month: "2026-10", given: {af_hca_eligibility_status: eligible, hca_authorized_amount: 1100}, expect: 1100}
  - {id: CO-1219-T2, as_of: "2026-10-01", month: "2026-10", given: {af_hca_eligibility_status: eligible, hca_authorized_amount: 600}, expect: 977}
  - {id: CO-1219-T3, as_of: "2026-10-01", month: "2026-10", given: {af_hca_eligibility_status: ineligible_functional, hca_authorized_amount: 600}, expect: 0}
