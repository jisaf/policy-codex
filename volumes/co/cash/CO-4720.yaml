  - {id: CO-4720-T2, month: "2026-10", as_of: "2026-10-01", given: {social_security_income: 0, pension_income: 700, unemployment_income: 0, tanf_cash_income: 0, adult_financial_cash_income: 0, child_support_received: 0, other_unearned_income_taxable: 0, other_unearned_income_nontaxable: 0, tax_exempt_interest: 0, ssi_income: 0, af_excluded_unearned_income: 0, receipts: [{kind: pension, amount: 700}]}, title: "No exempt income - the whole $700 pension", expect: 700}
