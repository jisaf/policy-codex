id: CO-4720
name: "Adult Financial: a deemed relative's or sponsor's unearned income after exemptions"
identifier: af_relative_deemable_unearned_income
kind: derived
type: money
scope: person-month
program: AdultFinancial
meaning: "This person's unearned income for the month as Adult Financial deems it from a client's spouse, an AND-CS child's parent or a sponsor: the counted unearned receipts and the exclusions the client's own income takes (af_counted_unearned_receipts and the person's exclusions, as in af_unearned_income_other_than_ssi; 9 CCR 2503-5 3.520.786: \"Certain earned and unearned income that is not countable to the client, client's spouse, or sponsor(s) in whole or in part is exempt\"), plus the person's SSI and Adult Financial grant receipts (3.534.C, 3.544.F, 3.549.F test the relative's income against the standard), less the expenses of producing workers' compensation, rental, insurance and similar receipts, never below zero."
precision: "Receipt records, migration phase 1: the same counted receipts as the client's own income (one counting table, coverage review 3 H-1, H-2), so a spouse's or sponsor's income tax refund, energy assistance, educational grant or interest is not deemed (coverage review 2, G-1). The sponsor paragraphs' \"total gross earned and unearned income\" (3.534.D.1, 3.544.G.1, 3.549.G.1) is read after these exemptions, since 3.520.786 names the sponsor(s) and 3.510 defines countable income for the sponsor(s) \"after the application of valid exemptions\". The earned side is af_gross_earned_income (CO-3830)."
derived: [max, 0, ["-", ["+", ["-", af_counted_unearned_receipts, ["+", af_child_support_exclusion, af_excluded_infrequent_income, af_excluded_life_threatening_condition_gifts]], af_ssi_receipts, af_grant_receipts], [otherwise, unearned_income_offsetting_expenses, 0]]]
sources: [S2608, S3500, S1632]
implemented: engine
tags: [cash, income]
rationale: "Coverage review 2, G-1: af_deemed_relative_income (CO-2384) and af_deemed_sponsor_income (CO-2386) deemed a spouse's, parent's or sponsor's gross unearned income without the 3.520.786 exemptions, which name the spouse and sponsors (S2608) and which 3.510's \"Countable income\" applies to all three (S3500). One item states the deemable unearned income so both deeming items read the same figure."
tests:
  - {id: CO-4720-T1, month: "2026-10", as_of: "2026-10-01", given: {receipts: [{kind: social_security, amount: 1000}, {kind: income_tax_refund, amount: 500}]}, title: "G-1 (probe PZ-1): $1,000 of Social Security and a $500 income tax refund in the month received (3.520.786.A) - 1,000", expect: 1000}
  - {id: CO-4720-T2, month: "2026-10", as_of: "2026-10-01", given: {receipts: [{kind: pension, amount: 700}]}, title: "No exempt income - the whole $700 pension", expect: 700}
  - {id: CO-4720-T3, month: "2026-10", as_of: "2026-10-01", given: {unearned_income_offsetting_expenses: 0, receipts: [{kind: social_security, amount: 1000}, {kind: gambling_winnings, amount: 2000, frequency: once, month: "2025-08"}, {kind: gambling_winnings, amount: 2000, frequency: once, month: "2025-09"}, {kind: gambling_winnings, amount: 2000, frequency: once, month: "2025-10"}, {kind: gambling_winnings, amount: 2000, frequency: once, month: "2025-11"}, {kind: gambling_winnings, amount: 2000, frequency: once, month: "2025-12"}, {kind: gambling_winnings, amount: 2000, frequency: once, month: "2026-01"}, {kind: gambling_winnings, amount: 2000, frequency: once, month: "2026-02"}, {kind: gambling_winnings, amount: 2000, frequency: once, month: "2026-03"}, {kind: gambling_winnings, amount: 2000, frequency: once, month: "2026-04"}, {kind: gambling_winnings, amount: 2000, frequency: once, month: "2026-05"}, {kind: gambling_winnings, amount: 2000, frequency: once, month: "2026-06"}, {kind: gambling_winnings, amount: 2000, frequency: once, month: "2026-07"}, {kind: gambling_winnings, amount: 2000, frequency: once, month: "2026-08"}, {kind: gambling_winnings, amount: 2000, frequency: once, month: "2026-09"}, {kind: gambling_winnings, amount: 2000, frequency: once, month: "2026-10"}, {kind: gambling_winnings, amount: 2000, frequency: once, month: "2026-11"}, {kind: gambling_winnings, amount: 2000, frequency: once, month: "2026-12"}, {kind: gambling_winnings, amount: 2000, frequency: once, month: "2027-01"}]}, title: "H-1 (probe QZ-1): a husband's $1,000 of Social Security and a $2,000 prize - 3,000 deemable (3.520.785.B.13)", expect: 3000}
  - {id: CO-4720-T4, month: "2026-10", as_of: "2026-10-01", given: {unearned_income_offsetting_expenses: 1500, receipts: [{kind: other_taxable, amount: 2000}]}, title: "H-2 (probe QZ-2): $2,000 of workers' compensation with $1,500 of claim expenses - 500 (3.520.785.B.9)", expect: 500}
  - {id: CO-4720-T5, month: "2026-10", as_of: "2026-10-01", given: {unearned_income_offsetting_expenses: 500, receipts: [{kind: other_taxable, amount: 300}]}, title: "Expenses above the receipts never make it negative", expect: 0}
