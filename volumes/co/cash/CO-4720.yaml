id: CO-4720
name: "Adult Financial: a deemed relative's or sponsor's unearned income after exemptions"
identifier: af_relative_deemable_unearned_income
kind: derived
type: money
scope: person-month
program: AdultFinancial
meaning: "This person's unearned income for the month as Adult Financial deems it from a client's spouse, an AND-CS child's parent or a sponsor: Social Security, pensions, unemployment, Colorado Works and Adult Financial grants, child support, other unearned income, tax-exempt interest and SSI, less the unearned income 9 CCR 2503-5 3.520.786 exempts (af_excluded_unearned_income), never below zero. 3.520.786: \"Certain earned and unearned income that is not countable to the client, client's spouse, or sponsor(s) in whole or in part is exempt.\""
precision: "The exemptions are the ones the client's own income takes (af_excluded_unearned_income, CO-2343, evaluated on this person), so a spouse's or sponsor's income tax refund, energy assistance, educational grant or interest is not deemed (coverage review 2, G-1). The earned side is af_gross_earned_income (CO-3830), which already subtracts af_excluded_earned_income. SSI and Adult Financial grants stay in the sum: 3.534.C, 3.544.F and 3.549.F test the relative's income against the standard, and 3.520.786 does not exempt them. The sponsor paragraphs' \"total gross earned and unearned income\" (3.534.D.1, 3.544.G.1, 3.549.G.1) is read after these exemptions, since 3.520.786 names the sponsor(s) and 3.510 defines countable income for the sponsor(s) \"after the application of valid exemptions\". Coverage review 3, H-1 and H-2: like the client's own income (af_countable_unearned_income, CO-3831), a relative's lottery and gambling winnings are added (3.520.785.B intro and B.13 name the \"client, client's spouse, or sponsor(s)\") and the expenses of producing workers' compensation, rental, insurance and similar receipts are taken off (B.9, B.14-16, B.20)."
derived: [max, 0, ["-", ["-", ["+", social_security_income, pension_income, unemployment_income, tanf_cash_income, adult_financial_cash_income, child_support_received, other_unearned_income_taxable, other_unearned_income_nontaxable, tax_exempt_interest, ssi_income, [otherwise, lottery_gambling_winnings_received, 0]], [otherwise, af_excluded_unearned_income, 0]], [otherwise, unearned_income_offsetting_expenses, 0]]]
sources: [S2608, S3500, S1632]
implemented: engine
tags: [cash, income]
rationale: "Coverage review 2, G-1: af_deemed_relative_income (CO-2384) and af_deemed_sponsor_income (CO-2386) deemed a spouse's, parent's or sponsor's gross unearned income without the 3.520.786 exemptions, which name the spouse and sponsors (S2608) and which 3.510's \"Countable income\" applies to all three (S3500). One item states the deemable unearned income so both deeming items read the same figure."
tests:
