id: CO-2561
name: "Colorado Works: this person's participation"
identifier: cw_person_participation_status
kind: derived
type: one of
options: [eligible_member, ineligible_member_status, ineligible_member_ssn, ineligible_member_ipv_or_fleeing_felon, ineligible_member_verification, ineligible_member_institution_or_absence, not_in_unit_ssi_or_title_iv, not_in_unit_did_not_request, not_in_unit_no_dependent_child]
scope: person
program: ColoradoWorks
role: outcome
meaning: "Whether this person is a participating member of a Colorado Works assistance unit, and if not, why: an SSI or Title IV foster care, adoption subsidy or kinship recipient is excluded from every unit (9 CCR 2503-6 3.604.2.C.3); an optional member who has not asked to join is not in the unit (C.2); a person whose unit has no dependent child and no pregnant member is in no unit Colorado Works can aid; a required member disqualified for citizenship, non-citizen status or lawful presence, for failing to apply for an SSN, or for an intentional program violation or as a fleeing felon is an ineligible member, removed from the unit's size while the member's income still counts (3.604.2.M, 3.605.1.A.6); so is a member who has not provided a status, identity or SSN verification within the thirty days of 3.604.3.K, and a member who is an institution patient or inmate (3.604.1.D-E) or out of State for more than ninety days (3.604.2.O.1); anyone else is an eligible member. Whether the unit itself is paid is cw_eligibility_status (CO-921) and cw_grant_amount (CO-914), which are household results reported on every member."
precision: "A member's own status is reported first so that a household result shown on an excluded person is not read as that person's. Citizenship is tested before the SSN, and both before an IPV or fleeing-felon disqualification, when more than one applies. Coverage review CW-12, CW-26: the other members cw_assistance_unit_members_for_size (CO-2351) leaves out of the unit's size are reported too, so this item and the size agree: a member who has not provided a status, identity or SSN verification within the thirty days of 3.604.3.K (cw_is_excluded_for_unprovided_status_verification, CO-4372; S1064) is ineligible_member_verification; an institution patient for tuberculosis or mental disease or an inmate (3.604.1.D-E, CO-3802) or a member out of State for more than cw_temporary_out_of_state_max_days days (3.604.2.O.1) is ineligible_member_institution_or_absence. Coverage pass 6 CA6-3, CA6-7 (docs/reviews/coverage6-cash.md): a unit with no dependent child is reached through a pregnancy in some month the determination covers (cw_is_pregnant_in_determination, CO-7302), required where read (decision 4 of 2026-11-23); before, an unstated pregnancy was read as none."
derived: ["case", [["any", "receives_ssi", "cw_receives_title_iv_foster_adoption_kinship_payment"], "not_in_unit_ssi_or_title_iv"], ["cw_is_optional_member_not_requesting", "not_in_unit_did_not_request"], [["not", ["exists", "cw_assistance_unit_members", ["any", ["of", ["P"], "cw_is_dependent_child"], ["of", ["P"], "cw_is_pregnant_in_determination"]]]], "not_in_unit_no_dependent_child"], [["not", "cw_meets_citizenship_and_immigration_requirement"], "ineligible_member_status"], [["otherwise", "cw_has_failed_to_apply_for_ssn", false], "ineligible_member_ssn"], ["cw_is_disqualified_member", "ineligible_member_ipv_or_fleeing_felon"], ["cw_is_excluded_for_unprovided_status_verification", "ineligible_member_verification"], [["any", "cw_is_institution_patient_or_inmate", ["all", ["not", ["unknown", "temporarily_out_of_state_start_date"]], [">", ["days_between", "temporarily_out_of_state_start_date", ["det_date"]], "cw_temporary_out_of_state_max_days"]]], "ineligible_member_institution_or_absence"], ["else", "eligible_member"]]
sources: [S1625, S1004, S1628, S1064, S2600, S2602]
implemented: engine
tags: [cash, tanf, household]
rationale: "County case worker review B1: cw_eligibility_status and cw_grant_amount are the unit's results, reported on each member, so an excluded member read as eligible. No existing item states each person's own participation."
nearest: [CO-2350, CO-928]
