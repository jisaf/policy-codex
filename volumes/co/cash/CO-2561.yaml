id: CO-2561
name: "Colorado Works: this person's participation"
identifier: cw_person_participation_status
kind: derived
type: one of
options: [eligible_member, ineligible_member_status, ineligible_member_ssn, ineligible_member_ipv_or_fleeing_felon, not_in_unit_ssi_or_title_iv, not_in_unit_did_not_request, not_in_unit_no_dependent_child]
scope: person
program: ColoradoWorks
role: outcome
meaning: "Whether this person is a participating member of a Colorado Works assistance unit, and if not, why: an SSI or Title IV foster care, adoption subsidy or kinship recipient is excluded from every unit (9 CCR 2503-6 3.604.2.C.3); an optional member who has not asked to join is not in the unit (C.2); a person whose unit has no dependent child and no pregnant member is in no unit Colorado Works can aid; a required member disqualified for citizenship, non-citizen status or lawful presence, for failing to apply for an SSN, or for an intentional program violation or as a fleeing felon is an ineligible member, removed from the unit's size while the member's income still counts (3.604.2.M, 3.605.1.A.6); anyone else is an eligible member. Whether the unit itself is paid is cw_eligibility_status (CO-921) and cw_grant_amount (CO-914), which are household results reported on every member."
precision: A member's own status is reported first so that a household result shown on an excluded person is not read as that person's. Citizenship is tested before the SSN, and both before an IPV or fleeing-felon disqualification, when more than one applies.
derived: [case, [[any, receives_ssi, receives_title_iv_foster_adoption_kinship_payment], not_in_unit_ssi_or_title_iv], [cw_is_optional_member_not_requesting, not_in_unit_did_not_request], [[not, [exists, cw_assistance_unit_members, [any, [of, [P], cw_is_dependent_child], [otherwise, [of, [P], is_pregnant], false]]]], not_in_unit_no_dependent_child], [[not, meets_public_assistance_citizenship_requirement], ineligible_member_status], [[otherwise, cw_has_failed_to_apply_for_ssn, false], ineligible_member_ssn], [cw_is_disqualified_member, ineligible_member_ipv_or_fleeing_felon], [else, eligible_member]]
sources: [S1625, S1004, S1628]
implemented: engine
tags: [cash, tanf, household]
rationale: "County case worker review B1: cw_eligibility_status and cw_grant_amount are the unit's results, reported on each member, so an excluded member read as eligible. No existing item states each person's own participation."
nearest: [CO-2350, CO-928]
tests:
  - {id: CO-2561-T1, month: "2026-10", as_of: "2026-10-01", given: {receives_ssi: true, receives_title_iv_foster_adoption_kinship_payment: false}, expect: not_in_unit_ssi_or_title_iv}
  - {id: CO-2561-T2, month: "2026-10", as_of: "2026-10-01", given: {receives_ssi: false, receives_title_iv_foster_adoption_kinship_payment: false, cw_is_optional_member_not_requesting: true}, expect: not_in_unit_did_not_request}
  - {id: CO-2561-T3, month: "2026-10", as_of: "2026-10-01", given: {receives_ssi: false, receives_title_iv_foster_adoption_kinship_payment: false, cw_is_optional_member_not_requesting: false, cw_assistance_unit_members: [p1], cw_is_dependent_child: false, is_pregnant: false}, expect: not_in_unit_no_dependent_child}
  - {id: CO-2561-T4, month: "2026-10", as_of: "2026-10-01", given: {receives_ssi: false, receives_title_iv_foster_adoption_kinship_payment: false, cw_is_optional_member_not_requesting: false, cw_assistance_unit_members: [p1, p2], cw_is_dependent_child: false, meets_public_assistance_citizenship_requirement: false}, others: {p2: {cw_is_dependent_child: true}}, expect: ineligible_member_status}
  - {id: CO-2561-T5, month: "2026-10", as_of: "2026-10-01", given: {receives_ssi: false, receives_title_iv_foster_adoption_kinship_payment: false, cw_is_optional_member_not_requesting: false, cw_assistance_unit_members: [p1, p2], cw_is_dependent_child: false, meets_public_assistance_citizenship_requirement: true, cw_is_disqualified_member: true}, others: {p2: {cw_is_dependent_child: true}}, expect: ineligible_member_ipv_or_fleeing_felon}
  - {id: CO-2561-T6, month: "2026-10", as_of: "2026-10-01", given: {receives_ssi: false, receives_title_iv_foster_adoption_kinship_payment: false, cw_is_optional_member_not_requesting: false, cw_assistance_unit_members: [p1, p2], cw_is_dependent_child: false, meets_public_assistance_citizenship_requirement: true, cw_is_disqualified_member: false}, others: {p2: {cw_is_dependent_child: true}}, expect: eligible_member}
