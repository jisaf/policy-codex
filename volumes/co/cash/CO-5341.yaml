id: CO-5341
name: "Adult Financial: countable retirement accounts"
identifier: af_countable_retirement_accounts
kind: derived
type: money
scope: person
program: AdultFinancial
meaning: "The person's retirement and pension accounts as Adult Financial counts them (9 CCR 2503-5 3.520.72.B.5, 3.520.73.B.1): each retirement_account record at its gross value less the taxes due on withdrawing it (taxes_on_withdrawal), or less af_retirement_account_default_tax_rate (20%) of the gross value when the client cannot give the taxes (B.1.b), never below zero, times the person's share."
precision: "Resource records, step H1 Adult Financial (docs/reviews/records-holdings-snap-af.md): the taxes are read from each account's own record, so two accounts with different taxes are each counted net of their own; an account whose record states no taxes is taken at 80% (the rule's own reading when the taxes are not given, B.1.b), as before step H1 (CO-4000, F-8)."
derived: ["sum_receipts", "holdings", ["all", ["all", ["received_in", ["det_month"]], ["unknown", ["receipt", "disposed_date"]]], ["=", ["lookup", "af_holding_treatment_table", ["receipt", "kind"]], "counted_less_taxes"]], ["*", ["max", 0, ["-", ["receipt", "value"], ["case", [["unknown", ["receipt", "taxes_on_withdrawal"]], ["*", ["receipt", "value"], "af_retirement_account_default_tax_rate"]], ["else", ["receipt", "taxes_on_withdrawal"]]]]], ["otherwise", ["receipt", "share"], 1]]]
sources: [S2213, S3208]
implemented: engine
tags: [cash, resources]
rationale: "Resource records, step H1 Adult Financial (docs/reviews/records-holdings-snap-af.md): Adult Financial reads the person's resources from the holdings records (holdings, CO-5300) through its counting table (af_holding_treatment_table, CO-5302), for the client, the spouse and each sponsor alike (3.520.72.A, E), never from the scalar resource facts. The retirement part of af_person_countable_resources_other_than_life_insurance (CO-4000), which read retirement_accounts_value and retirement_accounts_taxes_due for all the person's accounts together."
tests:
  # Hand-computed from 9 CCR 2503-5 3.520.73.B.1 (S3208).
  - {id: CO-5341-T1, title: "F-8: a $1,000 IRA with no tax figure: 1,000 - 0.2 x 1,000 = 800", as_of: "2026-10-01", given: {holdings: [{kind: retirement_account, value: 1000}]}, expect: 800}
  - {id: CO-5341-T2, title: "A $2,400 IRA with $300 of taxes due and a $1,000 401(k) with no tax figure: 2,100 + 800 = 2,900", as_of: "2026-10-01", given: {holdings: [{kind: retirement_account, value: 2400, taxes_on_withdrawal: 300}, {kind: retirement_account, value: 1000}]}, expect: 2900}
