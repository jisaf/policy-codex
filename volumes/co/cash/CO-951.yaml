  - {id: CO-951-T3, as_of: "2026-10-01", month: "2026-10", given: {af_grant_is_reduced_by_ssi_income: false, af_resides_in_unlicensed_or_uncertified_facility: false, af_resides_in_psychiatric_facility_thirty_consecutive_days: false, af_category: none, af_countable_income: 400, af_grant_standard: 0}, expect: 0}
