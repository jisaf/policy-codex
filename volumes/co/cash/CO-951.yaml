id: CO-951
name: "Adult Financial: OAP grant amount"
identifier: af_oap_grant
kind: derived
type: money
scope: person-month
program: AdultFinancial
role: outcome
meaning: "The monthly Old Age Pension grant payment - for a client resident in a facility listed in 3.532.D for the full calendar month after thirty consecutive days, only a personal needs allowance of at most af_personal_needs_allowance_maximum less countable income (3.532.D, F); otherwise the OAP grant standard minus the client's total countable income, raised to the OAP payment floor by a State Supplementary Payment when it falls below the floor, for a client in the oap category - per 9 CCR 2503-5 3.531.D.2, 3.532.B, D-F and 3.533."
precision: "See OQ-120 - does not model 3.532.B.2's mid-month proration for a client determined eligible on a day other than the first of the month, or 3.532.B.3's same-month program-transition rule. K-2 (phase-8 fix round): the personal needs allowance is read as a grant standard of af_personal_needs_allowance_maximum from which countable income is deducted, with no payment floor (OQ-352); a psychiatric facility stay counts for a client at or above af_oap_psychiatric_facility_min_age (CO-3052; 3.532.D.3, af_resides_in_psychiatric_facility_thirty_consecutive_days, CO-2006), and a resident of an unlicensed private or uncertified public facility gets neither a PNA nor a grant (3.532.E.2, af_resides_in_unlicensed_or_uncertified_facility, CO-2007; S1318); inmates are barred through af_meets_residency (CO-942). Engineering follow-up 4: 9 CCR 2503-5 3.581.E (S1825) drops the cents from every payment, partial payments included, except where SSI income reduces the grant (af_grant_is_reduced_by_ssi_income, CO-2604); this replaces the phase-5 M-7 reading that Adult Financial grants carry cents, which had not found 3.581.E. Phase-10 sweep (OQ-120), engineering follow-up 4: in the month containing af_eligibility_date (CO-2391) the monthly payment is multiplied by af_partial_month_payment_factor (CO-2603), the 3.581.D table figure for the days of eligibility (the day of eligibility counted, OQ-491 resolved); a client eligible on the first, or with no date stated, gets the full grant. The payment floor is applied to the monthly amount before the factor (3.581.D.1)."
derived: [case, [[not, ["=", af_category, "oap"]], 0], [af_grant_is_reduced_by_ssi_income, ["*", [case, [af_resides_in_unlicensed_or_uncertified_facility, 0], [[any, resides_in_care_facility_thirty_consecutive_days, [all, [">=", age, af_oap_psychiatric_facility_min_age], af_resides_in_psychiatric_facility_thirty_consecutive_days]], [max, 0, ["-", af_personal_needs_allowance_maximum, af_countable_income]]], [else, ["max", af_oap_payment_floor, ["-", af_grant_standard, af_countable_income]]]], af_partial_month_payment_factor]], [else, ["-", 0, [ceil, ["-", 0, ["*", [case, [af_resides_in_unlicensed_or_uncertified_facility, 0], [[any, resides_in_care_facility_thirty_consecutive_days, [all, [">=", age, af_oap_psychiatric_facility_min_age], af_resides_in_psychiatric_facility_thirty_consecutive_days]], [max, 0, ["-", af_personal_needs_allowance_maximum, af_countable_income]]], [else, ["max", af_oap_payment_floor, ["-", af_grant_standard, af_countable_income]]]], af_partial_month_payment_factor]]]]]]
sources: [S1825, S455, S456, S457, S700, S702, S703, S1008, S1318, S1635]
open: [OQ-352]
implemented: engine
tags: [cash, oap, income]
rationale: "No existing item computes the OAP grant amount. Named directly by the phase-5 brief's interface as an outcome. Fix round (M-3): reads af_grant_standard (CO-949) instead of af_oap_grant_standard (CO-289) directly, since CO-949 already selects the right standard for af_category and was otherwise read by nothing - the phase-5 review's M-3 finding. Phase 8: the oap_a/oap_b split is gone (OQ-111 resolved, S701) and the payment floor of the 2026-03-02 rule (af_oap_payment_floor, CO-1200) is applied."
tests:
