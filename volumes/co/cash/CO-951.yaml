  - {id: CO-951-T4, title: "K-2 - nursing home resident for the full month - personal needs allowance only, $79 less $50 of countable income (3.532.D, F)", as_of: "2026-10-01", month: "2026-10", given: {af_resides_in_unlicensed_or_uncertified_facility: false, af_resides_in_psychiatric_facility_thirty_consecutive_days: false, af_category: oap, resides_in_care_facility_thirty_consecutive_days: true, af_countable_income: 50, af_grant_standard: 1032}, expect: 29}
