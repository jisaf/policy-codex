id: CO-951
name: "Adult Financial: OAP grant amount"
identifier: af_oap_grant
kind: derived
type: money
scope: person-month
program: AdultFinancial
role: outcome
meaning: The monthly Old Age Pension grant payment - for a client resident in a facility listed in 3.532.D for the full calendar month after thirty consecutive days, only a personal needs allowance of at most $79 less countable income (3.532.D, F); otherwise the OAP grant standard minus the client's total countable income, raised to the OAP payment floor by a State Supplementary Payment when it falls below the floor, for a client in the oap category - per 9 CCR 2503-5 3.531.D.2, 3.532.B, D-F and 3.533.
precision: "See OQ-120 - does not model 3.532.B.2's mid-month proration for a client determined eligible on a day other than the first of the month, or 3.532.B.3's same-month program-transition rule. K-2 (phase-8 fix round): the personal needs allowance is read as a grant standard of $79 from which countable income is deducted, with no payment floor (OQ-352); a psychiatric facility stay counts for a client 65 or older (3.532.D.3, af_resides_in_psychiatric_facility_thirty_consecutive_days, CO-2006), and a resident of an unlicensed private or uncertified public facility gets neither a PNA nor a grant (3.532.E.2, af_resides_in_unlicensed_or_uncertified_facility, CO-2007; S1318); inmates are barred through af_meets_residency (CO-942). M-7: Adult Financial grants carry cents (no AF provision states a 'drop the cents' rule, unlike Colorado Works' 3.606.1.K.2, which cw_grant_amount, CO-914, implements by flooring) - deliberate, not an oversight. Phase-10 sweep (OQ-120): in the month containing af_eligibility_date (CO-2391) the grant is prorated by the days from that date through the end of the month over the days in the month (3.532.B.2, 3.543.B.2, 3.548.B.2; the day of eligibility is counted, OQ-491); a client eligible on the first, or with no date stated, gets the full grant. No rounding is stated."
derived: ["*", [case, [["=", af_category, "oap"], [case, [af_resides_in_unlicensed_or_uncertified_facility, 0], [[any, resides_in_care_facility_thirty_consecutive_days, [all, [">=", age, 65], af_resides_in_psychiatric_facility_thirty_consecutive_days]], [max, 0, ["-", af_personal_needs_allowance_maximum, af_countable_income]]], [else, ["max", af_oap_payment_floor, ["-", af_grant_standard, af_countable_income]]]]], [else, 0]], [case, [[all, [not, [unknown, af_eligibility_date]], ["=", [month], [month_of, af_eligibility_date]]], ["/", [days_between, af_eligibility_date, [first_day, [month_after, [month]]]], [days_between, [first_day, [month]], [first_day, [month_after, [month]]]]]], [else, 1]]]
sources: [S455, S456, S457, S700, S702, S703, S1008, S1318, S1635]
open: [OQ-352, OQ-491]
implemented: engine
tags: [cash, oap, income]
rationale: "No existing item computes the OAP grant amount. Named directly by the phase-5 brief's interface as an outcome. Fix round (M-3): reads af_grant_standard (CO-949) instead of af_oap_grant_standard (CO-289) directly, since CO-949 already selects the right standard for af_category and was otherwise read by nothing - the phase-5 review's M-3 finding. Phase 8: the oap_a/oap_b split is gone (OQ-111 resolved, S701) and the payment floor of the 2026-03-02 rule (af_oap_payment_floor, CO-1200) is applied."
