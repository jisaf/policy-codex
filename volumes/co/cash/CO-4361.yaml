id: CO-4361
name: "Colorado Works: room, board, and room and board income"
identifier: cw_boarder_income
kind: derived
type: money
scope: person-month
program: ColoradoWorks
meaning: "The payments this person received in the month from boarders and lodgers that Colorado Works counts as earned income (9 CCR 2503-6 3.605.2.E.4.c-e): room and board payments less, for each boarder, the maximum Food Assistance allotment for a one-person household and the other documented expenses directly related to providing the room and board (E.4.e); board-only payments less the same allotment for each person paying and the documented expenses of providing the board (E.4.c); and room-only (lodging) payments less the documented expenses directly related to providing the room (E.4.d). Each part is never below zero."
precision: "Room and board: room_and_board_payments_received (CO-4161), room_and_board_payers_count (CO-4162) and room_and_board_provision_costs (CO-4163, read as 0 when not stated). Board only: board_only_payments_received (CO-4832), board_only_payers_count (CO-4833) and board_only_provision_costs (CO-4834). Room only: room_only_payments_received (CO-4830) and room_only_provision_costs (CO-4831), with no allotment deducted, since E.4.d names none. Payments and costs not stated are read as 0; a payer count is read only where its payments are more than 0. The allotment is the SNAP maximum allotment for one person (snap_maximum_allotment_table, CO-130, read for 1) in force in the month the payments are received (read in the month evaluated, docs/operators.md, Resolution; time audit T-3). Room and board payments that are foster care payments (room_and_board_payments_are_foster_care, CO-4164, read as false when not stated) are not counted: 3.605.4.B.11 exempts the income of a Title IV foster child and the volume reads foster care provider payments as exempt (CO-2341). Board-only and room-only payments are part of other_unearned_income_taxable (CO-1714), so cw_unearned_income_deductions (CO-4369) takes them out of unearned income; coverage pass 3 (CW3-1) withdrew the earlier reading that a lodger's payment is rent counted as unearned income."
derived: ["+", [case, [["<=", [otherwise, room_and_board_payments_received, 0], 0], 0], [[otherwise, room_and_board_payments_are_foster_care, false], 0], [else, [max, 0, ["-", room_and_board_payments_received, ["+", ["*", room_and_board_payers_count, [lookup, snap_maximum_allotment_table, 1]], [otherwise, room_and_board_provision_costs, 0]]]]]], [case, [["<=", [otherwise, board_only_payments_received, 0], 0], 0], [else, [max, 0, ["-", board_only_payments_received, ["+", ["*", board_only_payers_count, [lookup, snap_maximum_allotment_table, 1]], [otherwise, board_only_provision_costs, 0]]]]]], [max, 0, ["-", [otherwise, room_only_payments_received, 0], [otherwise, room_only_provision_costs, 0]]]]
accepts_from:
  - {from: snap_maximum_allotment_table, class: adopted_method, source: S3159}
sources: [S3159]
implemented: engine
tags: [cash, tanf, income]
rationale: "Coverage pass 3 CW3-1 (P1): E.4.c and E.4.d (S3159) had no fact, and a lodger's room-only payment was read as rent, so a $400 lodger payment was counted as unearned income without the earned income disregards (ineligible, where the rule gives $400 - $90 = $310 < $331 and eligibility); board-only and room-only payments are now added from their own facts (CO-4830 to CO-4834). Coverage review CW-10 (P1): room_and_board_payments_received (CO-4161) was read only by SNAP (snap_boarder_income, CO-4165), so Colorado Works counted no boarder income: $1,500 from two boarders gave countable income 0 and $488, where E.4.e (S3159) counts $1,500 less two one-person allotments ($306 each in FY 2027) = $888 as earned income. The Colorado Works rule names the Food Assistance allotment, so this item reads SNAP's parameter (accepts_from). cw_gross_earned_income (CO-1716) adds it."
tests:
  - {id: CO-4361-T1, title: "Probe CWZ-10: $1,500 from two boarders, no documented costs: 1,500 - 2 x 306 = 888", as_of: "2026-10-15", month: "2026-10", given: {room_and_board_payments_received: 1500, room_and_board_payers_count: 2}, expect: 888}
  - {id: CO-4361-T2, title: "One boarder paying $700 with $100 of documented meal costs: 700 - 306 - 100 = 294", as_of: "2026-10-15", month: "2026-10", given: {room_and_board_payments_received: 700, room_and_board_payers_count: 1, room_and_board_provision_costs: 100}, expect: 294}
  - {id: CO-4361-T3, title: "A boarder paying $250, less than the allotment: nothing counted", as_of: "2026-10-15", month: "2026-10", given: {room_and_board_payments_received: 250, room_and_board_payers_count: 1}, expect: 0}
  - {id: CO-4361-T4, title: "Foster care payments for a foster child placed in the home are not counted", as_of: "2026-10-15", month: "2026-10", given: {room_and_board_payments_received: 900, room_and_board_payers_count: 1, room_and_board_payments_are_foster_care: true}, expect: 0}
  - {id: CO-4361-T5, title: "No boarders stated", as_of: "2026-10-15", month: "2026-10", given: {}, expect: 0}
  # Coverage pass 3 (CW3-1): board-only (E.4.c) and room-only (E.4.d) payments.
  - {id: CO-4361-T6, title: "Probe ZT-1: a lodger paying $400 for a room only, no documented costs: all $400 is earned income (E.4.d)", as_of: "2026-10-15", month: "2026-10", given: {room_only_payments_received: 400}, expect: 400}
  - {id: CO-4361-T7, title: "A lodger paying $600 with $75 of documented costs of the room: 600 - 75 = 525, no allotment deducted", as_of: "2026-10-15", month: "2026-10", given: {room_only_payments_received: 600, room_only_provision_costs: 75}, expect: 525}
  - {id: CO-4361-T8, title: "Two persons paying $500 for meals only, $50 of documented food costs: 500 - 2 x 306 = -112, nothing counted (E.4.c)", as_of: "2026-10-15", month: "2026-10", given: {board_only_payments_received: 500, board_only_payers_count: 2, board_only_provision_costs: 50}, expect: 0}
  - {id: CO-4361-T9, title: "One person paying $450 for meals only, $40 of documented food costs: 450 - 306 - 40 = 104", as_of: "2026-10-15", month: "2026-10", given: {board_only_payments_received: 450, board_only_payers_count: 1, board_only_provision_costs: 40}, expect: 104}
  - {id: CO-4361-T10, title: "One boarder paying $700 for room and meals and one lodger paying $300 for the room: (700 - 306) + 300 = 694", as_of: "2026-10-15", month: "2026-10", given: {room_and_board_payments_received: 700, room_and_board_payers_count: 1, room_only_payments_received: 300}, expect: 694}
