rationale: "Coverage pass 3 CW3-1 (P1): E.4.c and E.4.d (S3159) had no fact, and a lodger's room-only payment was read as rent, so a $400 lodger payment was counted as unearned income without the earned income disregards (ineligible, where the rule gives $400 - $90 = $310 < $331 and eligibility); board-only and room-only payments are now added from their own facts (CO-4830 to CO-4834). Coverage review CW-10 (P1): room_and_board_payments_received (CO-4161) was read only by SNAP (snap_boarder_income, CO-4165), so Colorado Works counted no boarder income: $1,500 from two boarders gave countable income 0 and $488, where E.4.e (S3159) counts $1,500 less two one-person allotments ($306 each in FY 2027) = $888 as earned income. The Colorado Works rule names the Food Assistance allotment, so this item reads SNAP's parameter (accepts_from). cw_gross_earned_income (CO-1716) adds it. Earned-income records, step E1 Colorado Works: the three kinds of payment are boarder payments in the earnings records, by what the boarders pay for."
tests:
  # Hand computations from 3.605.2.E.4.c-e (S3159); the one-person allotment is $306 in October 2026 (FY 2027).
  - {id: CO-4361-T1, title: "Probe CWZ-10: $1,500 from two boarders, no documented costs: 1,500 - 2 x 306 = 888", as_of: "2026-10-15", month: "2026-10", given: {earnings: [{kind: boarder_payments, amount: 1500, provides: room_and_board, boarders: 2}]}, expect: 888}
  - {id: CO-4361-T2, title: "One boarder paying $700 with $100 of documented meal costs: 700 - 306 - 100 = 294", as_of: "2026-10-15", month: "2026-10", given: {earnings: [{kind: boarder_payments, amount: 700, provides: room_and_board, boarders: 1}, {kind: business_cost_boarder_provision, amount: 100, provides: room_and_board}]}, expect: 294}
  - {id: CO-4361-T3, title: "A boarder paying $250, less than the allotment: nothing counted", as_of: "2026-10-15", month: "2026-10", given: {earnings: [{kind: boarder_payments, amount: 250, provides: room_and_board, boarders: 1}]}, expect: 0}
  - {id: CO-4361-T4, title: "Foster care payments for a foster child placed in the home are not counted", as_of: "2026-10-15", month: "2026-10", given: {earnings: [{kind: boarder_payments, amount: 900, provides: room_and_board, boarders: 1, foster_care: true}]}, expect: 0}
  - {id: CO-4361-T5, title: "Earnings stated empty: nothing", as_of: "2026-10-15", month: "2026-10", given: {earnings: []}, expect: 0}
  # Coverage pass 3 (CW3-1): board-only (E.4.c) and room-only (E.4.d) payments.
  - {id: CO-4361-T6, title: "Probe ZT-1: a lodger paying $400 for a room only, no documented costs: all $400 is earned income (E.4.d)", as_of: "2026-10-15", month: "2026-10", given: {earnings: [{kind: boarder_payments, amount: 400, provides: room_only, boarders: 1}]}, expect: 400}
  - {id: CO-4361-T7, title: "A lodger paying $600 with $75 of documented costs of the room: 600 - 75 = 525, no allotment deducted", as_of: "2026-10-15", month: "2026-10", given: {earnings: [{kind: boarder_payments, provides: room_only, amount: 600}, {kind: business_cost_boarder_provision, amount: 75, provides: room_only}]}, expect: 525}
  - {id: CO-4361-T8, title: "Two persons paying $500 for meals only, $50 of documented food costs: 500 - 2 x 306 - 50 = -162, nothing counted (E.4.c)", as_of: "2026-10-15", month: "2026-10", given: {earnings: [{kind: boarder_payments, provides: board_only, amount: 500, boarders: 2}, {kind: business_cost_boarder_provision, amount: 50, provides: board_only}]}, expect: 0}
  - {id: CO-4361-T9, title: "One person paying $450 for meals only, $40 of documented food costs: 450 - 306 - 40 = 104", as_of: "2026-10-15", month: "2026-10", given: {earnings: [{kind: boarder_payments, provides: board_only, amount: 450, boarders: 1}, {kind: business_cost_boarder_provision, amount: 40, provides: board_only}]}, expect: 104}
  - {id: CO-4361-T10, title: "One boarder paying $700 for room and meals and one lodger paying $300 for the room: (700 - 306) + 300 = 694", as_of: "2026-10-15", month: "2026-10", given: {earnings: [{kind: boarder_payments, amount: 700, provides: room_and_board, boarders: 1}, {kind: boarder_payments, provides: room_only, amount: 300}]}, expect: 694}
  # Decision 4 of 2026-11-23: earnings not stated are cannot determine.
  - {id: CO-4361-T12, title: "Earnings not stated: cannot determine", as_of: "2026-10-15", month: "2026-10", given: {receipts: []}, expect: unknown}
  - {id: CO-4361-T13, title: "Two boarders on two records, $800 and $700, one with $100 of costs: 1,500 - (1 + 1) x 306 - 100 = 788", as_of: "2026-10-15", month: "2026-10", given: {earnings: [{kind: boarder_payments, amount: 800, provides: room_and_board, boarders: 1}, {kind: boarder_payments, amount: 700, provides: room_and_board, boarders: 1}, {kind: business_cost_boarder_provision, amount: 100, provides: room_and_board}]}, expect: 788}
