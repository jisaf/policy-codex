id: CO-904
name: "Colorado Works: meets residency requirement"
identifier: cw_meets_residency
kind: derived
type: yes/no
scope: person-month
program: ColoradoWorks
meaning: The person is a Colorado resident for Colorado Works purposes under 26-2-706(1.5)(a), C.R.S. and 9 CCR 2503-6 3.604.1.A - living in Colorado with no durational requirement - and is not, for the month at issue, a person another state already paid TANF benefits to (3.604.1.A.3), nor temporarily out of State for more than ninety consecutive days (3.604.2.O.1).
precision: "Does not model the 3.604.1.A.1-2 intent-to-remain and retained-until-abandoned tests beyond reading the stated state_of_residence fact, consistent with is_colorado_resident's (CO-505) treatment of the parallel Medicaid rule. Vocabulary fix round (docs/reviews/vocabulary-reuse.md, U-4): state residence reads is_colorado_resident (CO-505) instead of restating the comparison. Final cash review FC-1: 3.604.2.O.1 (S2602) limits a temporary stay out of State to ninety consecutive days (cw_temporary_out_of_state_max_days, CO-3807), counted from temporarily_out_of_state_start_date (CO-3806) to the determination date; a person with no such date stated is read as in Colorado. Time audit T-6: \"N consecutive days\" is counted as the days elapsed since the day the absence or stay began (days_between), the day of departure or entry itself not counted (OQ-953): \"shall not exceed ninety (90) consecutive days\" (3.604.2.O, S2602): within while the days elapsed since the day of departure are at most cw_temporary_out_of_state_max_days, so a client who left on August 1 is within through October 30 and out from October 31. Pattern sweep (cash) PS-T8 (docs/reviews/pattern-sweep-cash.md): per month: the days out of State are counted to cw_month_reading_date (CO-7600), the month's last day for a month before the determination month, the determination date otherwise; before, every month counted them to the determination date, so an application month was judged on days not yet away."
derived: [all, is_colorado_resident, [not, received_tanf_from_another_state_this_month], [any, [unknown, temporarily_out_of_state_start_date], ["<=", [days_between, temporarily_out_of_state_start_date, cw_month_reading_date], cw_temporary_out_of_state_max_days]]]
sources: [S407, S2602]
open: [OQ-953]
implemented: engine
tags: [cash, tanf, household]
rationale: "No existing item states Colorado Works residency; cw_eligibility_status (CO-920) needs it. Not a dup.compact of is_colorado_resident (CO-505, state_of_residence equals colorado_state_code) because 3.604.1.A.3's interstate-TANF-payment bar (S407) is a genuine additional Colorado Works-specific prong is_colorado_resident does not carry, so the derivation is not identical."
tests:
  - {id: CO-904-T1, as_of: "2026-10-01", month: "2026-10", given: {state_of_residence: "CO", received_tanf_from_another_state_this_month: false}, expect: true}
  - {id: CO-904-T2, as_of: "2026-10-01", month: "2026-10", given: {state_of_residence: "WY", received_tanf_from_another_state_this_month: false}, expect: false}
  - {id: CO-904-T3, as_of: "2026-10-01", month: "2026-10", given: {state_of_residence: "CO", received_tanf_from_another_state_this_month: true}, expect: false}
  - {id: CO-904-T4, title: "FC-1: out of State for 60 days with intent to return (3.604.2.O.1)", as_of: "2026-10-01", month: "2026-10", given: {state_of_residence: "CO", received_tanf_from_another_state_this_month: false, temporarily_out_of_state_start_date: "2026-08-02"}, expect: true}
  - {id: CO-904-T5, title: "FC-1: out of State for 100 days", as_of: "2026-10-01", month: "2026-10", given: {state_of_residence: "CO", received_tanf_from_another_state_this_month: false, temporarily_out_of_state_start_date: "2026-06-23"}, expect: false}
  # Pattern sweep (cash) PS-T8: 3.604.2.O.1 (S2602) ninety consecutive days out of State, counted to the month (cw_month_reading_date): left 2026-07-15, determined 2026-10-15. September 30: 77 days, in Colorado for the program; October 15: 92 days, not.
  - {id: "CO-904-T6", title: "Pattern sweep PS-T8: September, 77 days out of State on its last day: within ninety", as_of: "2026-10-15", month: "2026-09", given: {state_of_residence: "CO", received_tanf_from_another_state_this_month: false, temporarily_out_of_state_start_date: "2026-07-15"}, expect: true}
  - {id: "CO-904-T7", title: "PS-T8: October, 92 days on the determination date: over ninety", as_of: "2026-10-15", month: "2026-10", given: {state_of_residence: "CO", received_tanf_from_another_state_this_month: false, temporarily_out_of_state_start_date: "2026-07-15"}, expect: false}
