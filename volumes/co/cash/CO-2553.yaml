id: CO-2553
name: "Colorado Works: child support counted for eligibility"
identifier: cw_counted_child_support
kind: derived
type: money
scope: person-month
program: ColoradoWorks
meaning: "The current child support received for this person that Colorado Works counts against the need standard for the month: at application, the month's current support (9 CCR 2503-6 3.605.5.A); at a redetermination, the person's six-month average when the support was received in all six previous months and the unit's averaged consistent support is over $500, and nothing otherwise (3.605.5.C). Child support is never counted in the grant calculation (3.605.5.B, C.3; C.R.S. 26-2-709(1)(a)(IV)); cw_payment_countable_unearned_income (CO-2554) leaves it out."
precision: "Current support is the month's child support receipts (cw_child_support_receipts, CO-5652); arrears are their own receipt kind, which 3.605.5.D exempts (receipt records, migration phase 2: before them, arrears were stated within child_support_received and subtracted here, final cash review FC-2). Coverage pass 6 CA6-2 (docs/reviews/coverage6-cash.md, probe W8): the kind of determination (cw_determination_is_redetermination, CO-2375) is required (decision 4 of 2026-11-23); before, a determination not stated to be a redetermination was read as an application, so a recipient at redetermination whose daughter's support was received in all six months and averaged $400 (not over $500, 3.605.5.C.2) had $400 counted against the $331 need standard and was ineligible, where the rule disregards it and the unit is eligible for $488. Months after approval and before the next redetermination are not distinguished; the codex determines at application or redetermination. A person with no current support in the month and none in the six previous months has none counted under either reading (3.605.5.A and C), so the kind of determination is read only for a person with support. Pattern sweep (cash) PS-D12 (docs/reviews/pattern-sweep-cash.md): the months received and the six-month average are read with no default (decision 4); both come from the same receipts as the month's support, so the old reading of an unknown as 0 changed no answer the receipts state."
derived: ["case", [["all", ["=", "cw_child_support_receipts", 0], ["=", "cw_child_support_months_received_of_last_six", 0]], 0], [["not", "cw_determination_is_redetermination"], "cw_child_support_receipts"], [["all", [">=", "cw_child_support_months_received_of_last_six", "cw_child_support_consistency_months"], [">", "cw_unit_consistent_child_support_average", "cw_child_support_redetermination_threshold"]], "cw_child_support_six_month_average"], ["else", 0]]
sources: [S2607, S1805, S1802]
implemented: engine
tags: [cash, tanf, income]
rationale: "CDHS review B-2: cw_countable_unearned_income (CO-908) counted the month's child support in every determination and so in the grant, against 3.605.5.B and C.R.S. 26-2-709(1)(a)(IV); the redetermination test of 3.605.5.C was missing. This item is the eligibility figure CO-908 now reads."
tests:
  # Coverage pass 6 CA6-2: the kind of determination stated (decision 4): these tests are applications, the value the readers gave it when unstated.
  - {id: CO-2553-T1, month: "2026-10", as_of: "2026-10-01", given: {cw_determination_is_redetermination: false, receipts: [{kind: child_support, amount: 200}]}, title: "Application: the month's $200 of support counts for eligibility (3.605.5.A)", expect: 200}
  - {id: CO-2553-T2, month: "2026-10", as_of: "2026-10-01", given: {cw_determination_is_redetermination: true, cw_child_support_months_received_of_last_six: 6, cw_child_support_six_month_average: 550, cw_unit_consistent_child_support_average: 550, receipts: [{kind: child_support, amount: 600}]}, title: "Redetermination: support received six of six months averaging $550 for the unit is counted", expect: 550}
  - {id: CO-2553-T3, month: "2026-10", as_of: "2026-10-01", given: {cw_determination_is_redetermination: true, cw_child_support_months_received_of_last_six: 6, cw_child_support_six_month_average: 500, cw_unit_consistent_child_support_average: 500, receipts: [{kind: child_support, amount: 500}]}, title: "Redetermination: consistent support averaging $500 or less is disregarded (3.605.5.C.2)", expect: 0}
  - {id: CO-2553-T4, month: "2026-10", as_of: "2026-10-01", given: {cw_determination_is_redetermination: true, cw_child_support_months_received_of_last_six: 5, cw_child_support_six_month_average: 600, cw_unit_consistent_child_support_average: 0, receipts: [{kind: child_support, amount: 700}]}, title: "Redetermination: support missed in one of the six months is inconsistent and not countable (3.605.5.C.1)", expect: 0}
  - {id: CO-2553-T5, month: "2026-10", as_of: "2026-10-01", given: {cw_determination_is_redetermination: false, receipts: [{kind: child_support, amount: 300}, {kind: child_support_arrears, amount: 100}]}, title: "FC-2: $400 of support, $100 of it arrears, at application - $300 counted (3.605.5.D)", expect: 300}
  # Coverage pass 6 CA6-2 (probe W8): 3.605.5.A (S1805) counts the month's current support at application; C.1-2 at a redetermination
  # counts it only when received in all six previous months and the household's average is over $500.
  - {id: "CO-2553-T6", title: "Coverage pass 6 CA6-2: the kind of determination not stated: cannot determine (decision 4)", month: "2026-10", as_of: "2026-10-15", given: {cw_child_support_receipts: 400}, expect: unknown}
  - {id: "CO-2553-T7", title: "Probe W8r: a redetermination, $400 received in all six months, the household average $400, not over $500: nothing counted (3.605.5.C.2)", month: "2026-10", as_of: "2026-10-15", given: {cw_determination_is_redetermination: true, cw_child_support_receipts: 400, cw_child_support_months_received_of_last_six: 6, cw_unit_consistent_child_support_average: 400, cw_child_support_six_month_average: 400}, expect: 0}
  - {id: "CO-2553-T8", title: "An application: the month's $400 is counted (3.605.5.A)", month: "2026-10", as_of: "2026-10-15", given: {cw_determination_is_redetermination: false, cw_child_support_receipts: 400}, expect: 400}
  - {id: "CO-2553-T9", title: "Coverage pass 6 CA6-2: no support in the month or the six before it: 0 under either reading, the kind of determination not read", month: "2026-10", as_of: "2026-10-15", given: {cw_child_support_receipts: 0, cw_child_support_months_received_of_last_six: 0}, expect: 0}
