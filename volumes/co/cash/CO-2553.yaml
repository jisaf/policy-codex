id: CO-2553
name: "Colorado Works: child support counted for eligibility"
identifier: cw_counted_child_support
kind: derived
type: money
scope: person-month
program: ColoradoWorks
meaning: "The current child support received for this person that Colorado Works counts against the need standard for the month: at application, the month's current support (9 CCR 2503-6 3.605.5.A); at a redetermination, the person's six-month average when the support was received in all six previous months and the unit's averaged consistent support is over $500, and nothing otherwise (3.605.5.C). Child support is never counted in the grant calculation (3.605.5.B, C.3; C.R.S. 26-2-709(1)(a)(IV)); cw_payment_countable_unearned_income (CO-2554) leaves it out."
precision: "Current support is the month's child support receipts (cw_child_support_receipts, CO-5652); arrears are their own receipt kind, which 3.605.5.D exempts (receipt records, migration phase 2: before them, arrears were stated within child_support_received and subtracted here, final cash review FC-2). A determination not stated to be a redetermination is read as an application (cw_determination_is_redetermination, CO-2375). Months after approval and before the next redetermination are not distinguished; the codex determines at application or redetermination."
derived: [case, [[not, [otherwise, cw_determination_is_redetermination, false]], cw_child_support_receipts], [[all, [">=", [otherwise, cw_child_support_months_received_of_last_six, 0], cw_child_support_consistency_months], [">", cw_unit_consistent_child_support_average, cw_child_support_redetermination_threshold]], [otherwise, cw_child_support_six_month_average, 0]], [else, 0]]
sources: [S2607, S1805, S1802]
implemented: engine
tags: [cash, tanf, income]
rationale: "CDHS review B-2: cw_countable_unearned_income (CO-908) counted the month's child support in every determination and so in the grant, against 3.605.5.B and C.R.S. 26-2-709(1)(a)(IV); the redetermination test of 3.605.5.C was missing. This item is the eligibility figure CO-908 now reads."
tests:
  - {id: CO-2553-T1, month: "2026-10", as_of: "2026-10-01", given: {receipts: [{kind: child_support, amount: 200}]}, title: "Application: the month's $200 of support counts for eligibility (3.605.5.A)", expect: 200}
  - {id: CO-2553-T2, month: "2026-10", as_of: "2026-10-01", given: {cw_determination_is_redetermination: true, cw_child_support_months_received_of_last_six: 6, cw_child_support_six_month_average: 550, cw_unit_consistent_child_support_average: 550, receipts: [{kind: child_support, amount: 600}]}, title: "Redetermination: support received six of six months averaging $550 for the unit is counted", expect: 550}
  - {id: CO-2553-T3, month: "2026-10", as_of: "2026-10-01", given: {cw_determination_is_redetermination: true, cw_child_support_months_received_of_last_six: 6, cw_child_support_six_month_average: 500, cw_unit_consistent_child_support_average: 500, receipts: [{kind: child_support, amount: 500}]}, title: "Redetermination: consistent support averaging $500 or less is disregarded (3.605.5.C.2)", expect: 0}
  - {id: CO-2553-T4, month: "2026-10", as_of: "2026-10-01", given: {cw_determination_is_redetermination: true, cw_child_support_months_received_of_last_six: 5, cw_child_support_six_month_average: 600, cw_unit_consistent_child_support_average: 0, receipts: [{kind: child_support, amount: 700}]}, title: "Redetermination: support missed in one of the six months is inconsistent and not countable (3.605.5.C.1)", expect: 0}
  - {id: CO-2553-T5, month: "2026-10", as_of: "2026-10-01", given: {cw_determination_is_redetermination: false, receipts: [{kind: child_support, amount: 300}, {kind: child_support_arrears, amount: 100}]}, title: "FC-2: $400 of support, $100 of it arrears, at application - $300 counted (3.605.5.D)", expect: 300}
