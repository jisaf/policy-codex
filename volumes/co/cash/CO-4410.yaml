id: CO-4410
name: "Adult Financial: homeless"
identifier: af_is_homeless
kind: derived
type: yes/no
scope: person
program: AdultFinancial
meaning: "Whether the person is homeless as 9 CCR 2503-5 3.510 defines it: no permanent living arrangement, neither a member of a household nor a resident of an institution - sleeping in a supervised shelter, a halfway house or similar facility giving temporary residence, a place not designed for or ordinarily used as regular sleeping accommodations, or a motel, hotel, trailer park or campground for lack of an alternative, or abandoned in a hospital; or staying with a succession of friends or relatives with no permanent living arrangement."
precision: "Read from nighttime_residence_type (CO-2810, the primary nighttime residence on the determination date). A stay in another person's home (shared_housing_due_to_loss_or_hardship or shared_housing_other_temporary) is homeless only when the person moves among a succession of friends or relatives with no permanent arrangement (stays_with_succession_of_others_without_permanent_arrangement, CO-4411, read as false when not stated): a client living rent-free in one relative's home after losing her own is a member of that household, the usual case for in-kind support and maintenance. The 3.510 list is illustrative (\"This can mean\"); the motel, campground and hospital options are read as homeless because each is the absence of a permanent living arrangement."
derived: [any, [in, nighttime_residence_type, [emergency_or_transitional_shelter, place_not_designed_for_sleeping, motel_or_hotel_for_lack_of_alternative, trailer_park_or_campground_for_lack_of_alternative, halfway_house, abandoned_in_hospital]], [all, [in, nighttime_residence_type, [shared_housing_due_to_loss_or_hardship, shared_housing_other_temporary]], [otherwise, stays_with_succession_of_others_without_permanent_arrangement, false]]]
sources: [S3205]
implemented: engine
tags: [cash, oap, and, household]
rationale: "Coverage review F-5 (confirmed with the engine on probe PR-ISM): af_in_kind_support_and_maintenance (CO-1512) treated shared_housing_due_to_loss_or_hardship as homeless (3.520.79.B.3), so an OAP client living rent-free in her daughter's home had no ISM; 3.510 (S3205) defines a homeless person as one with no permanent living arrangement, who is \"neither a member of a household nor a resident of an institution\". Each program's homelessness is its own item over the neutral fact (same-word audit SW-11); none of the others (SNAP's, SUN Bucks', CCCAP's, LEAP's, Home Care Allowance's) is 3.510's."
nearest: [CO-037, CO-2010]
tests:
  - {id: CO-4410-T1, title: "F-5 (probe PR-ISM): living rent-free in her daughter's home after losing her apartment - not homeless", as_of: "2026-10-01", given: {nighttime_residence_type: shared_housing_due_to_loss_or_hardship}, expect: false}
  - {id: CO-4410-T2, title: "Moving among friends' homes with no permanent arrangement", as_of: "2026-10-01", given: {nighttime_residence_type: shared_housing_due_to_loss_or_hardship, stays_with_succession_of_others_without_permanent_arrangement: true}, expect: true}
  - {id: CO-4410-T3, title: "A supervised shelter", as_of: "2026-10-01", given: {nighttime_residence_type: emergency_or_transitional_shelter}, expect: true}
  - {id: CO-4410-T4, title: "A fixed, regular and adequate home", as_of: "2026-10-01", given: {nighttime_residence_type: fixed_regular_adequate}, expect: false}
