id: CO-915
name: "Colorado Works: months of assistance used"
identifier: cw_months_of_assistance_used
kind: derived
type: whole number
scope: person
program: ColoradoWorks
meaning: "The number of months already counted toward this person's sixty-month federal TANF lifetime limit, per 26-2-706.5, C.R.S. and 9 CCR 2503-6 3.606.6.A and F - the statewide automated system's running count less the months received while living in exempt Indian Country, zeroed out for anyone who is not the head of the assistance unit or the head's spouse, per 45 CFR 264.1(b)(1)(i)'s bar on counting a non-head, non-spouse member's months toward the limit."
precision: "45 CFR 264.1(b)(1)(i) (S421): 'States must not count toward the five-year limit: (i) Any month of receipt of assistance by an individual who is not the head-of-household or married to the head-of-household.' A dependent child's or a non-head adult's own months_of_assistance_received are therefore read as 0 here regardless of the supplied count, so cw_time_limit_reached (CO-918)'s unit-level test only ever sums a head-of-household's or spouse's months. Vocabulary fix round (R-3, R-7): the head is the Colorado Works head of the assistance unit (cw_is_head_of_assistance_unit, CO-1733), not the SNAP head of household; and 3.606.6.F's Indian Country months are subtracted (cw_months_received_in_exempt_indian_country, CO-1723) instead of zeroing every month for a tribal member. Phase-10 sweep (OQ-143): 9 CCR 2503-6 3.604.2.M (S1004) counts the month of a disqualified or ineligible member (cw_is_disqualified_member, CO-928) toward that member's own sixty-month maximum when a grant is paid for others in the unit, so such a member's count is read as stated even when the member is neither the head nor the head's spouse; Colorado's rule counts more than 45 CFR 264.1(b)(1)(i) requires, and the volume follows the rule."
derived: [case, [[any, cw_is_head_of_assistance_unit, [exists_related, [spouse], [of, [P], cw_is_head_of_assistance_unit]], cw_is_disqualified_member], [max, 0, ["-", months_of_assistance_received, cw_months_received_in_exempt_indian_country]]], [else, 0]]
sources: [S404, S417, S421, S525, S1004]
implemented: engine
tags: [cash, tanf]
rationale: "The fixed interface names this identifier as a Colorado Works-owned item reading 'a supplied count of months'; because a program-prefixed identifier must be program-neutral to be a supplied fact (governance convention, brief.md), the count itself is carried by the program-neutral supplied fact months_of_assistance_received (CO-840) and this item is the program-owned rule cw_time_limit_reached (CO-918) reads. Gated on head-of-household/spouse status per the phase-5 review's C-2 finding (second half): a bare pass-through counted a child's or non-head adult's months, which 264.1(b)(1)(i) forbids. Fix round (K-5): also gated on snap_is_indian_or_urban_indian (CO-050, already a supplied fact in this volume), per 3.606.6.F's exemption for 'any month of receipt of assistance by an adult while living in Indian Country, or a Native Alaskan village' - such months are not counted toward the sixty-month limit."
tests:
  - {id: CO-915-T1, as_of: "2026-10-01", given: {months_of_assistance_received: 42, cw_months_received_in_exempt_indian_country: 0, cw_is_head_of_assistance_unit: true}, relationships: [], expect: 42}
  - {id: CO-915-T2, as_of: "2026-10-01", given: {months_of_assistance_received: 0, cw_months_received_in_exempt_indian_country: 0, cw_is_head_of_assistance_unit: true}, relationships: [], expect: 0}
  - {id: CO-915-T3, as_of: "2026-10-01", given: {cw_is_disqualified_member: false, months_of_assistance_received: 42, cw_months_received_in_exempt_indian_country: 0, cw_is_head_of_assistance_unit: false}, relationships: [], expect: 0}
  - {id: CO-915-T4, as_of: "2026-10-01", given: {months_of_assistance_received: 42, cw_months_received_in_exempt_indian_country: 0, cw_is_head_of_assistance_unit: false}, others: {p2: {cw_is_head_of_assistance_unit: true}}, relationships: [[spouse, p2]], expect: 42}
  - {id: CO-915-T5, title: "Vocabulary fix round (R-3): all 42 months received while living in exempt Indian Country (3.606.6.F) - none counted", as_of: "2026-10-01", given: {months_of_assistance_received: 42, cw_months_received_in_exempt_indian_country: 42, cw_is_head_of_assistance_unit: true}, relationships: [], expect: 0}
  # Phase-10 sweep (OQ-143): a disqualified member who is not the head still has the month counted (3.604.2.M).
  - {id: CO-915-T6, as_of: "2026-10-01", given: {cw_is_head_of_assistance_unit: false, cw_is_disqualified_member: true, months_of_assistance_received: 14, cw_months_received_in_exempt_indian_country: 0}, relationships: [], expect: 14}
