id: CO-915
name: "Colorado Works: months of assistance used"
identifier: cw_months_of_assistance_used
kind: derived
type: whole number
scope: person
program: ColoradoWorks
meaning: The number of months already counted toward this person's sixty-month federal TANF lifetime limit, per 26-2-706.5, C.R.S. and 9 CCR 2503-6 3.606.6.A - reads the statewide automated system's running count, zeroed out for anyone who is not the head of household or the head's spouse, per 45 CFR 264.1(b)(1)(i)'s bar on counting a non-head, non-spouse member's months toward the limit.
precision: "45 CFR 264.1(b)(1)(i) (S421): 'States must not count toward the five-year limit: (i) Any month of receipt of assistance by an individual who is not the head-of-household or married to the head-of-household.' A dependent child's or a non-head adult's own months_of_assistance_received are therefore read as 0 here regardless of the supplied count, so cw_time_limit_reached (CO-918)'s unit-level test only ever sums a head-of-household's or spouse's months."
derived: [case, [[all, [any, is_head_of_household, [exists_related, [spouse], [of, [P], is_head_of_household]]], [not, is_indian_or_urban_indian]], [+, months_of_assistance_received, 0]], [else, 0]]
sources: [S404, S417, S421, S525]
implemented: engine
tags: [cash, tanf]
rationale: "The fixed interface names this identifier as a Colorado Works-owned item reading 'a supplied count of months'; because a program-prefixed identifier must be program-neutral to be a supplied fact (governance convention, brief.md), the count itself is carried by the program-neutral supplied fact months_of_assistance_received (CO-840) and this item is the program-owned rule cw_time_limit_reached (CO-918) reads. Gated on head-of-household/spouse status per the phase-5 review's C-2 finding (second half): a bare pass-through counted a child's or non-head adult's months, which 264.1(b)(1)(i) forbids. Fix round (K-5): also gated on is_indian_or_urban_indian (CO-050, already a supplied fact in this volume), per 3.606.6.F's exemption for 'any month of receipt of assistance by an adult while living in Indian Country, or a Native Alaskan village' - such months are not counted toward the sixty-month limit."
tests:
  - {id: CO-915-T1, as_of: "2026-10-01", given: {months_of_assistance_received: 42, is_head_of_household: true, is_indian_or_urban_indian: false}, relationships: [], expect: 42}
  - {id: CO-915-T2, as_of: "2026-10-01", given: {months_of_assistance_received: 0, is_head_of_household: true, is_indian_or_urban_indian: false}, relationships: [], expect: 0}
  - {id: CO-915-T3, as_of: "2026-10-01", given: {months_of_assistance_received: 42, is_head_of_household: false, is_indian_or_urban_indian: false}, relationships: [], expect: 0}
  - {id: CO-915-T4, as_of: "2026-10-01", given: {months_of_assistance_received: 42, is_head_of_household: false, is_indian_or_urban_indian: false}, others: {p2: {is_head_of_household: true}}, relationships: [[spouse, p2]], expect: 42}
  - {id: CO-915-T5, title: "K-5: head of household living in Indian Country - months not counted", as_of: "2026-10-01", given: {months_of_assistance_received: 42, is_head_of_household: true, is_indian_or_urban_indian: true}, relationships: [], expect: 0}
