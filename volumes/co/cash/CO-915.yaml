id: CO-915
name: "Colorado Works: months of assistance used"
identifier: cw_months_of_assistance_used
kind: derived
type: whole number
scope: person
program: ColoradoWorks
meaning: "The number of months already counted toward this person's sixty-month federal TANF lifetime limit, per 26-2-706.5, C.R.S. and 9 CCR 2503-6 3.606.6.A and F - the statewide automated system's running count (months_of_assistance_received, CO-840) less the months received while living in exempt Indian Country, for every member: 3.606.6.C bars a unit containing any individual who has received federal TANF assistance as an adult for sixty or more cumulative months, whatever that individual's place in the unit is now."
precision: "Coverage review CW-3: 45 CFR 264.1(b)(1)(i) (S421) says which months are not added to a person's count ('Any month of receipt of assistance by an individual who is not the head-of-household or married to the head-of-household'), and 3.606.6.A (S3154) which months are; the supplied count (CO-840, the count 'already counted toward this person's sixty-month lifetime limit ... as tracked by the statewide automated system') has already applied both, so this item reads it as stated for every member. The item formerly read 0 for anyone who is not now the head or the head's spouse, which erased months a person accrued earlier as a head: unmarried parents whose non-head father had sixty counted months were eligible, where 3.606.6.C makes the unit ineligible. cw_time_limit_reached (CO-918) still reads only the unit's adult members (cw_is_adult_member, CO-924). Vocabulary fix round (R-3, R-7): the head is the Colorado Works head of the assistance unit (cw_is_head_of_assistance_unit, CO-1733), not the SNAP head of household; and 3.606.6.F's Indian Country months are subtracted (cw_months_received_in_exempt_indian_country, CO-1723) instead of zeroing every month for a tribal member. Phase-10 sweep (OQ-143): 9 CCR 2503-6 3.604.2.M (S1004) counts the month of a disqualified or ineligible member (cw_is_disqualified_member, CO-928) toward that member's own sixty-month maximum when a grant is paid for others in the unit, so such a member's count is read as stated even when the member is neither the head nor the head's spouse; Colorado's rule counts more than 45 CFR 264.1(b)(1)(i) requires, and the volume follows the rule."
derived: [max, 0, ["-", months_of_assistance_received, cw_months_received_in_exempt_indian_country]]
sources: [S404, S3154, S421, S1004]
implemented: engine
tags: [cash, tanf]
rationale: "The fixed interface names this identifier as a Colorado Works-owned item reading 'a supplied count of months'; because a program-prefixed identifier must be program-neutral to be a supplied fact (governance convention, brief.md), the count itself is carried by the program-neutral supplied fact months_of_assistance_received (CO-840) and this item is the program-owned rule cw_time_limit_reached (CO-918) reads. Gated on head-of-household/spouse status per the phase-5 review's C-2 finding (second half); coverage review CW-3 removed the gate, since the supplied count is already the count the statewide system keeps toward the person's limit and a person's months as a former head are not erased by a later place in a unit. Fix round (K-5): also gated on snap_is_indian_or_urban_indian (CO-050, already a supplied fact in this volume), per 3.606.6.F's exemption for 'any month of receipt of assistance by an adult while living in Indian Country, or a Native Alaskan village' - such months are not counted toward the sixty-month limit."
tests:
  - {id: CO-915-T1, as_of: "2026-10-01", given: {months_of_assistance_received: 42, cw_months_received_in_exempt_indian_country: 0, cw_is_head_of_assistance_unit: true}, relationships: [], expect: 42}
  - {id: CO-915-T2, as_of: "2026-10-01", given: {months_of_assistance_received: 0, cw_months_received_in_exempt_indian_country: 0, cw_is_head_of_assistance_unit: true}, relationships: [], expect: 0}
  - {id: CO-915-T3, title: "Coverage review CW-3 (probe ZZ-3): a member who is not now the head keeps the 42 months already counted for him (was 0)", as_of: "2026-10-01", given: {cw_is_disqualified_member: false, months_of_assistance_received: 42, cw_months_received_in_exempt_indian_country: 0, cw_is_head_of_assistance_unit: false}, relationships: [], expect: 42}
  - {id: CO-915-T4, as_of: "2026-10-01", given: {months_of_assistance_received: 42, cw_months_received_in_exempt_indian_country: 0, cw_is_head_of_assistance_unit: false}, others: {p2: {cw_is_head_of_assistance_unit: true}}, relationships: [[spouse, p2]], expect: 42}
  - {id: CO-915-T5, title: "Vocabulary fix round (R-3): all 42 months received while living in exempt Indian Country (3.606.6.F) - none counted", as_of: "2026-10-01", given: {months_of_assistance_received: 42, cw_months_received_in_exempt_indian_country: 42, cw_is_head_of_assistance_unit: true}, relationships: [], expect: 0}
  # Phase-10 sweep (OQ-143): a disqualified member who is not the head still has the month counted (3.604.2.M).
  - {id: CO-915-T6, as_of: "2026-10-01", given: {cw_is_head_of_assistance_unit: false, cw_is_disqualified_member: true, months_of_assistance_received: 14, cw_months_received_in_exempt_indian_country: 0}, relationships: [], expect: 14}
