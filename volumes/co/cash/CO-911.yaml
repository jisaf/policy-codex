id: CO-911
name: "Colorado Works: need standard"
identifier: cw_need_standard
kind: derived
type: money
scope: person
program: ColoradoWorks
meaning: The monthly need standard for this person's assistance unit, per 9 CCR 2503-6 3.606.1.F and 3.606.1.H - the figure countable income is compared against to determine eligibility - selecting the chart's No Caretaker, One Caretaker, or Two Caretakers row by cw_unit_caretaker_count (CO-926) and its Number of Children column by cw_unit_child_count (CO-927), with the Each Additional Child amount (cw_need_standard_each_additional, CO-275) added for each child beyond ten.
precision: A person outside every assistance unit (cw_unit_size 0, e.g. an SSI-excluded child) has cw_unit_caretaker_count 0 and cw_unit_child_count 0, which reads cw_need_standard_table_no_caretaker's zero-children value ($0) - the chart's own "no one in the unit" figure, not a not-applicable marker; see M-1 in the phase-5 review, not fixed this round.
derived: [case, [["=", cw_unit_caretaker_count, 0], [case, [["<=", cw_unit_child_count, 10], [lookup, cw_need_standard_table_no_caretaker, cw_unit_child_count]], [else, [+, [lookup, cw_need_standard_table_no_caretaker, 10], ["*", cw_need_standard_each_additional, ["-", cw_unit_child_count, 10]]]]]], [["=", cw_unit_caretaker_count, 1], [case, [["<=", cw_unit_child_count, 10], [lookup, cw_need_standard_table, cw_unit_child_count]], [else, [+, [lookup, cw_need_standard_table, 10], ["*", cw_need_standard_each_additional, ["-", cw_unit_child_count, 10]]]]]], [else, [case, [["<=", cw_unit_child_count, 10], [lookup, cw_need_standard_table_two_caretakers, cw_unit_child_count]], [else, [+, [lookup, cw_need_standard_table_two_caretakers, 10], ["*", cw_need_standard_each_additional, ["-", cw_unit_child_count, 10]]]]]]]
sources: [S414, S415]
implemented: engine
tags: [cash, tanf, household]
rationale: "No existing item looks up the Colorado Works need standard; cw_meets_income_test (CO-913) needs it. Same shape as cw_grant_standard (CO-912): 3.606.1.F states two figures per caretaker-count/child-count cell, the need standard for the income test and the grant standard for the payment, so both lookups exist and each category rule reads its own. Fix round (C-5): re-keyed to select among all three of 3.606.1.F's rows (cw_need_standard_table, CO-274, cw_need_standard_table_no_caretaker, CO-351, cw_need_standard_table_two_caretakers, CO-353) by cw_unit_caretaker_count (CO-926), keyed within each by cw_unit_child_count (CO-927), and now applies cw_need_standard_each_additional (CO-275) above ten children instead of returning null (closing the gap the phase-5 review's M-4 finding named alongside C-5); OQ-101 is rewritten to reflect that all three rows are now modeled."
nearest: [CO-912]
tests:
  - {id: CO-911-T1, title: "One caretaker, one child", as_of: "2026-10-01", given: {date_of_birth: "1990-01-01", is_head_of_household: true, receives_ssi: false, receives_title_iv_foster_adoption_kinship_payment: false}, others: {p2: {date_of_birth: "2015-06-01", receives_ssi: false, receives_title_iv_foster_adoption_kinship_payment: false}}, relationships: [[parent, p1, p2]], expect: 331}
  - {id: CO-911-T2, title: "One caretaker, no children", as_of: "2026-10-01", given: {date_of_birth: "1990-01-01", is_head_of_household: true, receives_ssi: false, receives_title_iv_foster_adoption_kinship_payment: false}, relationships: [], expect: 253}
  - {id: CO-911-T3, title: "C-5: two caretakers, one child", as_of: "2026-10-01", given: {cw_unit_caretaker_count: 2, cw_unit_child_count: 1}, expect: 439}
  - {id: CO-911-T4, title: "C-5: no caretaker, two children", as_of: "2026-10-01", given: {cw_unit_caretaker_count: 0, cw_unit_child_count: 2}, expect: 245}
  - {id: CO-911-T5, title: "M-4: one caretaker, twelve children - each additional child amount applied instead of returning null", as_of: "2026-10-01", given: {cw_unit_caretaker_count: 1, cw_unit_child_count: 12}, expect: 1199}
