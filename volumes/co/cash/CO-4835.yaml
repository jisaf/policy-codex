id: CO-4835
name: "Colorado Works: otherwise eligible apart from a disqualification, demonstrable evidence or sanction closure"
identifier: cw_unit_otherwise_eligible
kind: derived
type: yes/no
scope: person-month
program: ColoradoWorks
meaning: "Whether this person's Colorado Works assistance unit passes, for the month, every check that cw_eligibility_status (CO-921) makes after the person's own disqualification other than a closure for demonstrable evidence and a fourth-level sanction: a minor parent's living arrangement (the person's own and every member's), no adult of the unit in a strike, the child support requirements, no member in a diversion period of ineligibility, no county closure for continued EBT misuse or a minor parent's education non-participation, the sixty-month time limit not reached, and the income test (9 CCR 2503-6 3.604.2.L.2, N.1, 3.604.4.A, 3.606.6, 3.606.8.A.4-5, 3.609.2.J, 3.606.1.H). That is, whether the client would not be found ineligible for Colorado Works for another reason, which ends the Adult Financial bar (9 CCR 2503-5 3.520.71.F.2.c)."
precision: "Read only with a cw_eligibility_status of ineligible_disqualified, closed_demonstrable_evidence or sanction_closure: CO-921 reaches those options only after the unit has passed the earlier checks (a dependent child or pregnant member, the client's death, residency, the institution bar and citizenship or immigration status), so they are not repeated here. Each test is the one CO-921 reads, on the same items; for a disqualified client the income test is the unit's, with the client removed from its size and her income counted without disregards (3.604.2.M), as CO-921 reads it for the rest of the unit."
derived: [all, cw_minor_parent_living_arrangement_met, [not, [exists, cw_assistance_unit_members, [not, [of, [P], cw_minor_parent_living_arrangement_met]]]], [not, cw_unit_has_striking_adult], cw_meets_child_support_requirements, [not, [exists, cw_assistance_unit_members, [otherwise, [of, [P], in_diversion_period_of_ineligibility], false]]], [not, [exists, cw_assistance_unit_members, [in, [otherwise, [of, [P], cw_county_closure_type], none], [continued_ebt_misuse, minor_parent_education_nonparticipation]]]], [not, cw_time_limit_reached], cw_meets_income_test]
sources: [S1011, S2600, S2601, S2603, S3152, S3153, S3161, S3162]
implemented: engine
tags: [cash, tanf]
rationale: "Coverage pass 3 CW3-2 (P1, docs/reviews/coverage3-colorado-works.md): af_barred_by_colorado_works (CO-1511) barred Adult Financial on the client's own ineligible_disqualified, closed_demonstrable_evidence or sanction_closure status, which CO-921 reports before its later checks, so a disqualified mother whose unit was over income anyway (probe ZT-4, stored as CO-207) was barred, where 3.520.71.F.2.c (S1011) ends the bar once the client \"is found otherwise ineligible for TANF/Colorado Works benefits\". No item states the later checks apart from the outcome; CO-1511 reads this one with the status."
tests:
  - {id: CO-4835-T1, title: "Probe ZT-8: a disqualified mother with no income, her child aided - otherwise eligible, so the bar holds", as_of: "2026-10-15", month: "2026-10", given: {cw_assistance_unit_members: [p1, p2], cw_minor_parent_living_arrangement_met: true, cw_unit_has_striking_adult: false, cw_meets_child_support_requirements: true, cw_time_limit_reached: false, cw_meets_income_test: true}, others: {p2: {cw_minor_parent_living_arrangement_met: true}}, expect: true}
  - {id: CO-4835-T2, title: "Probe ZT-4: the unit is over income anyway - otherwise ineligible (3.520.71.F.2.c)", as_of: "2026-10-15", month: "2026-10", given: {cw_assistance_unit_members: [p1, p2], cw_minor_parent_living_arrangement_met: true, cw_unit_has_striking_adult: false, cw_meets_child_support_requirements: true, cw_time_limit_reached: false, cw_meets_income_test: false}, others: {p2: {cw_minor_parent_living_arrangement_met: true}}, expect: false}
  - {id: CO-4835-T3, title: "The sixty-month limit is reached", as_of: "2026-10-15", month: "2026-10", given: {cw_assistance_unit_members: [p1, p2], cw_minor_parent_living_arrangement_met: true, cw_unit_has_striking_adult: false, cw_meets_child_support_requirements: true, cw_time_limit_reached: true, cw_meets_income_test: true}, others: {p2: {cw_minor_parent_living_arrangement_met: true}}, expect: false}
  - {id: CO-4835-T4, title: "A member's continued EBT misuse closure", as_of: "2026-10-15", month: "2026-10", given: {cw_assistance_unit_members: [p1, p2], cw_minor_parent_living_arrangement_met: true, cw_unit_has_striking_adult: false, cw_meets_child_support_requirements: true, cw_time_limit_reached: false, cw_meets_income_test: true}, others: {p2: {cw_minor_parent_living_arrangement_met: true, cw_county_closure_type: continued_ebt_misuse}}, expect: false}
