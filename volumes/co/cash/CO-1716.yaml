id: CO-1716
name: "Colorado Works: gross earned income"
identifier: cw_gross_earned_income
kind: derived
type: money
scope: person-month
program: ColoradoWorks
meaning: "This person's gross earned income for the month for Colorado Works: gross wages plus the net profit from self-employment, which 9 CCR 2503-6 3.605.2.E.1.c treats as earned income (3.605.2.D), plus earned in-kind income (the value of shelter or other items received in lieu of wages, donated in-kind services, in-kind income for employment, 3.605.2.A, F, G; in_kind_earned_compensation_value, CO-4360, read as 0 when not stated) and room and board, board-only and room-only payments beyond the one-person Food Assistance allotment per boarder (none for a room only) and the documented costs (3.605.2.E.4.c-e; cw_boarder_income, CO-4361). Coverage review CW-9(c), CW-10, coverage pass 3 CW3-1 (S3159)."
derived: [max, 0, ["-", [+, wages_gross, cw_self_employment_net_profit, [otherwise, in_kind_earned_compensation_value, 0], cw_boarder_income], [otherwise, cw_excluded_earned_income, 0]]]
sources: [S1621, S412, S1155, S3159]
implemented: engine
tags: [cash, tanf, income]
rationale: "Vocabulary fix round (docs/reviews/vocabulary-reuse.md, R-1): the Colorado Works need test, payment and minor-parent deeming read wages only, so a self-employed applicant's earnings were left out; one item now states the earned income the three of them disregard from."
tests:
  - {id: CO-1716-T1, as_of: "2026-10-01", month: "2026-10", given: {wages_gross: 800, self_employment_gross_receipts: 1500, cw_self_employment_business_costs: 400}, expect: 1900}
  - {id: CO-1716-T2, as_of: "2026-10-01", month: "2026-10", given: {wages_gross: 2380, self_employment_gross_receipts: 0}, expect: 2380}
  # Phase-10 sweep (OQ-390): a full-time student dependent child's $800 of wages is disregarded (3.605.4.B.24.b).
  - {id: CO-1716-T3, as_of: "2026-10-01", month: "2026-10", given: {wages_gross: 800, self_employment_gross_receipts: 0, cw_self_employment_business_costs: 0, cw_excluded_earned_income: 800}, expect: 0}
