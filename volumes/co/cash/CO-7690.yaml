id: CO-7690
name: "Adult Financial: the client's spouse is not a person of the case in the month"
identifier: af_spouse_is_outside_case_in_month
kind: derived
type: yes/no
scope: person-month
program: AdultFinancial
meaning: "Whether, in the month evaluated, this Adult Financial client is married (af_is_married, CO-7308) and no spouse of the client is a person of the case in the month (af_spouses_in_month, CO-7603, is empty): the client has a spouse whose income 9 CCR 2503-5 3.534, 3.544.D-F and 3.549.C-F deem to the client and whose resources 3.520.72.A counts with the client's, and whose income and resources the case does not state."
precision: "Coverage pass 7 for the cash programs, F7-2 (docs/reviews/coverage7-cash.md): the spouse's deemed income (af_deemed_relative_income, CO-2384), the couple's countable resources (af_client_and_spouse_countable_resources, CO-2389, read by af_meets_resource_limit CO-948 under the couple limit) and the spouse's verification counts (CO-3884, CO-4004) cannot be determined for such a client (decision 4 of 2026-11-23), as a sponsor who is not a person of the case (pattern sweep PS-M3, CO-2386) and the non-MAGI couple with no spouse in the case (coverage pass 6 F6-7, CO-643) cannot. The split $20 disregard (CO-3829) needs only the marriage and is read as before. A client whose marital status is not stated, with no spouse in the case, is unknown here (decision 4), as af_is_married is."
derived: [all, ["=", [count, af_spouses_in_month], 0], af_is_married]
sources: [S1632, S1633, S1634, S1636]
implemented: engine
tags: [cash, oap, and, household]
rationale: "Coverage pass 7, F7-2: a married client whose spouse is not a person of the case (marital_status married, the volume's own reading of a spouse outside the case) had no spouse income deemed and no spouse resources counted, the spouse's income and resources being read as 0, where decision 4 makes them cannot determine (probe A1: oap, $442)."
nearest: [CO-7308, CO-7603]
tests:
  # A1 (docs/reviews/coverage7-cash.md): an OAP client, marital_status married, alone in the case: true.
  - {id: CO-7690-T1, month: "2026-10", as_of: "2026-10-01", title: "F7-2 (A1): a married client alone in the case: the spouse is outside the case", given: {marital_status: married}, relationships: [], expect: true}
  # A2: the husband is a person of the case (living apart): false.
  - {id: CO-7690-T2, month: "2026-10", as_of: "2026-10-01", title: "F7-2 (A2): a married client whose husband is a person of the case", given: {marital_status: married}, others: {p2: {marital_status: married}}, relationships: [[spouse, p2]], expect: false}
  # Never married, alone: false.
  - {id: CO-7690-T3, month: "2026-10", as_of: "2026-10-01", title: "F7-2: a single client alone in the case", given: {marital_status: single}, relationships: [], expect: false}
