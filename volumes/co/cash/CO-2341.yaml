id: CO-2341
name: "Colorado Works: excluded unearned income"
identifier: cw_excluded_unearned_income
kind: derived
type: money
scope: person-month
program: ColoradoWorks
meaning: "The part of this person's gross unearned income for the month that 9 CCR 2503-6 3.605.4 exempts: home energy assistance and LEAP (A.4, A.31), reimbursement of out-of-pocket expenses (A.18), educational grants, loans, stipends and scholarships (A.26), income tax refunds and the EITC (B.1), a bona fide loan, and payments federal law excludes."
precision: "The sum of the neutral receipt facts the program's list names (each part of the gross income facts, so the program's countable income subtracts it); an unstated receipt is 0."
derived: [+, [+, [+, [+, [+, [otherwise, educational_assistance_received, 0], [otherwise, loan_proceeds_received, 0]], [otherwise, expense_reimbursements_received, 0]], [otherwise, energy_assistance_received, 0]], [otherwise, tax_refunds_and_credits_received, 0]], [otherwise, federally_excluded_payments_received, 0]]
sources: [S1621, S2205]
implemented: engine
tags: [cash, income]
rationale: "Same-word audit SW-28, dual-entry audit 3.24 and 3.25: each program's excluded income and allowable business costs were program-prefixed supplied amounts, so one receipt or one set of business costs was entered once per program. The neutral fact describes the receipt or the cost; each program's exclusion or allowable cost is its own derived item citing its list (product-owner decision, convention rule 13). The ID and identifier are kept; the amount is now derived."
tests:
