id: CO-2341
name: "Colorado Works: excluded unearned income"
identifier: cw_excluded_unearned_income
kind: derived
type: money
scope: person-month
program: ColoradoWorks
meaning: "The part of this person's gross unearned income for the month that 9 CCR 2503-6 3.605.4 exempts: home energy assistance and LEAP (A.4, A.31), reimbursement of out-of-pocket expenses (A.18), educational grants, loans, stipends and scholarships (A.26), income tax refunds and the EITC (B.1), a bona fide loan, and payments federal law excludes; one-time emergency assistance and county General Assistance (A.3, A.7), personal care and home care allowances (A.5), VA Aid and Attendance used for uncovered medical care (A.6), crime victim compensation (A.8), a reverse mortgage as a bona fide loan (B.1), a foster child's Title IV funds paid to the provider (B.11), WIOA and youth employment program payments and training allowances (B.13, B.14, B.16), Social Security set aside under a plan for self-support (B.15), and distributions from individual development, retirement savings, health savings and educational savings accounts (B.20-22, B.25). Child support arrears (3.605.5.D) are left out of the counted child support (cw_counted_child_support, CO-2553)."
precision: "The sum of the neutral receipt facts the program's list names (each part of the gross income facts, so the program's countable income subtracts it); an unstated receipt is 0. A.5's personal care and home care allowance is exempt for every member, not only in deeming (OQ-700; final cash review 2, P2-2). Coverage pass 2 (CW2-4): 3.605.3.A.4 (S3451) counts VA educational assistance (G.I. Bill) and other benefits conditional upon school attendance to the extent they exceed the expenses necessary for school attendance; the specific rule governs those benefits, so the educational assistance excluded is educational_assistance_received less that excess (school_attendance_conditional_benefits_received, CO-4661, less school_attendance_expenses_paid, CO-4662, floored at zero), and the grants, loans, stipends and scholarships of B.26 stay exempt."
derived: ["+", [max, 0, ["-", [otherwise, educational_assistance_received, 0], [max, 0, ["-", [otherwise, school_attendance_conditional_benefits_received, 0], [otherwise, school_attendance_expenses_paid, 0]]]]], [otherwise, loan_proceeds_received, 0], [otherwise, expense_reimbursements_received, 0], [otherwise, energy_assistance_received, 0], [otherwise, tax_refunds_and_credits_received, 0], [otherwise, federally_excluded_payments_received, 0], [otherwise, general_or_emergency_assistance_received, 0], [otherwise, in_home_care_allowance_received, 0], [otherwise, va_aid_and_attendance_used_for_uncovered_care, 0], [otherwise, crime_victim_compensation_received, 0], [otherwise, reverse_mortgage_payments_received, 0], [otherwise, foster_care_provider_payments_received, 0], [otherwise, workforce_program_payments_received, 0], [otherwise, pass_set_aside_income, 0], [otherwise, savings_account_distributions_received, 0]]
sources: [S1621, S2205, S2605, S2606, S3451]
implemented: engine
tags: [cash, income]
open: [OQ-700]
rationale: "Same-word audit SW-28, dual-entry audit 3.24 and 3.25: each program's excluded income and allowable business costs were program-prefixed supplied amounts, so one receipt or one set of business costs was entered once per program. The neutral fact describes the receipt or the cost; each program's exclusion or allowable cost is its own derived item citing its list (product-owner decision, convention rule 13). The ID and identifier are kept; the amount is now derived. Final cash review FC-2: the item summed six receipt facts, so general assistance, crime victim compensation, WIOA payments and the other sources 3.605.4.A-B list (S2605, S2606) were counted against the need standard; each is now a neutral receipt fact (CO-3812 to CO-3825) this item adds. OQ-390's remainder is closed for Colorado Works."
