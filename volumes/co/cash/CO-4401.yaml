id: CO-4401
name: "Adult Financial: presumed not a resident because of an absence from Colorado"
identifier: af_is_presumed_nonresident_by_absence
kind: derived
type: yes/no
scope: person
program: AdultFinancial
meaning: "Whether this client's absence from Colorado creates the rebuttable presumption of 9 CCR 2503-5 3.520.64.E that the client is no longer a resident and is ineligible for Adult Financial programs, and the client has not rebutted it: the client has been out of the country af_out_of_country_presumption_days (30) or more consecutive days (E.1); has been out of the State af_out_of_state_presumption_days (90) or more consecutive days, other than to receive medical treatment (E.2) or to care for an immediate family member injured in the line of military duty (E.4); has been out of the State af_out_of_state_extended_presumption_days (180) or more consecutive days to care for such a family member (E.4); or has been out of the State more than af_out_of_state_extended_presumption_days days in the calendar year, consecutive or not (E.3)."
precision: "The consecutive days are counted from the date the client left Colorado (temporarily_out_of_state_start_date, CO-3806) to the determination date (days_between); a client in Colorado states no date and is read as not absent. Out of the country is temporary_absence_is_outside_united_states (CO-4402); the medical exception of E.2 is temporary_absence_reason (CO-3351) medical_treatment, documented as E.2 requires; the E.4 absence is is_out_of_state_caring_for_family_member_injured_in_military_duty (CO-4404), read in place of E.2's ninety days (OQ-780); the calendar-year count is days_out_of_state_in_calendar_year (CO-4403). Each is read as false or 0 when not stated. The client's rebuttal (\"unless the client comes forward with enough information to prove otherwise\") is the county's finding af_nonresidence_presumption_rebutted (CO-4405), read as false when not stated. Read by af_meets_residency (CO-942), so every Adult Financial program, Home Care Allowance included, applies it; Home Care Allowance's own thirty days (3.570.17.C.8.b) are in af_hca_eligibility_status (CO-1217). Time audit T-6: \"N consecutive days\" is counted as the days elapsed since the day the absence or stay began (days_between), the day of departure or entry itself not counted (OQ-953): \"a period of thirty (30) or more consecutive days\", \"ninety (90) or more\" and \"one hundred eighty (180)\" (3.520.64.E, S3201): the days elapsed since the day of departure, so a client who left on August 1 reaches thirty days on August 31. Coverage pass 4 CA4-16: the days spent outside Colorado in the calendar year (E.3) are required where read (a client who has not left Colorado states 0), never read as 0 when not stated (decision 4 of 2026-11-23: missing information is cannot determine unless the rule says otherwise). Coverage pass 6 CA6-7 (docs/reviews/coverage6-cash.md, probe A5): for a client stated to be out of Colorado, where the absence is (another country, 3.520.64.E.1, 30 days), its reason (medical treatment, E.2) and whether the client is caring for a family member injured on military duty (F, 180 days) are required (decision 4 of 2026-11-23); before, read as another State, none and false, so a client away 45 days whose absence abroad was not stated was paid ($452) where abroad she is presumed a nonresident (none)."
derived: ["all", ["not", ["otherwise", "af_nonresidence_presumption_rebutted", false]], ["any", ["all", ["not", ["unknown", "temporarily_out_of_state_start_date"]], ["any", ["all", "temporary_absence_is_outside_united_states", [">=", ["days_between", "temporarily_out_of_state_start_date", ["det_date"]], "af_out_of_country_presumption_days"]], ["all", "is_out_of_state_caring_for_family_member_injured_in_military_duty", [">=", ["days_between", "temporarily_out_of_state_start_date", ["det_date"]], "af_out_of_state_extended_presumption_days"]], ["all", ["not", "is_out_of_state_caring_for_family_member_injured_in_military_duty"], ["not", ["=", "temporary_absence_reason", "medical_treatment"]], [">=", ["days_between", "temporarily_out_of_state_start_date", ["det_date"]], "af_out_of_state_presumption_days"]]]], [">", "days_out_of_state_in_calendar_year", "af_out_of_state_extended_presumption_days"]]]
sources: [S3201]
implemented: engine
open: [OQ-780, OQ-953]
tags: [cash, oap, and, household]
rationale: "Coverage review (docs/reviews/coverage-adult-financial.md, F-1, confirmed with the engine on probe PR-ABS): af_meets_residency (CO-942) read only state_of_residence, so a client who left Colorado 122 days before the determination, not for medical treatment, stayed a resident and was paid; 3.520.64.E (S3201) presumes such a client is no longer a resident. Colorado Works' 90-day temporary absence (cw_meets_residency_requirement, CO-904) is its own rule (9 CCR 2503-6 3.604.2.O) with no presumption, out-of-country period or calendar-year count."
nearest: [CO-904]
