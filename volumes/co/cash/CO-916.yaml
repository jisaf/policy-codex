id: CO-916
name: "Colorado Works: child-only unit"
identifier: cw_child_only_unit
kind: derived
type: yes/no
scope: person
program: ColoradoWorks
meaning: This person's assistance unit consists entirely of dependent children, with no member who is not themselves a dependent child - a "child-only case" for the 26-2-706.5(4)(a)(I) hardship-extension good-cause category and the parallel 45 CFR 264.1(b)(1)(i) exemption's practical effect (no head-of-household adult whose own clock is ticking).
derived: ["at", ["=", ["count", ["filter", "cw_assistance_unit_members_in_month", ["any", ["not", ["of", ["P"], "cw_is_dependent_child_in_month"]], ["of", ["P"], "cw_minor_parent_is_assisted_as_adult"]]]], 0], ["det_month"]]
precision: "Coverage pass 6 CA6-4 (docs/reviews/coverage6-cash.md): read in the determination month, from the month's members (cw_assistance_unit_members_in_month, CO-7304) and each one's dependent child test of the month, as the unit's counts are (CO-926, CO-927)."
sources: [S404, S408, S3153]
implemented: engine
tags: [cash, tanf, household]
rationale: "No existing item states this; cw_time_limit_exempt (CO-917) reads it. A minor parent and her own child are both dependent children under 3.601's definition, so a minor-parent-only unit (this batch's target household) correctly reads as child-only. Coverage review CW-2: a minor parent who does not live in the home of a caretaker receives assistance as an adult (3.604.2.N.2.c, S3153; cw_minor_parent_is_assisted_as_adult, CO-4352), so her unit is not child-only."
tests:
  - {id: "CO-916-T3", title: "The same mother living in her own mother's home, which her mother does not join: a dependent child, so the unit of mother and baby is child-only", as_of: "2026-10-01", given: {cw_assistance_unit_members: [p1, p2], cw_is_dependent_child: true, cw_minor_parent_is_assisted_as_adult: false, cw_assistance_unit_members_in_month: [p1, p2], cw_is_dependent_child_in_month: true}, others: {p2: {cw_is_dependent_child: true, cw_minor_parent_is_assisted_as_adult: false, cw_is_dependent_child_in_month: true}}, relationships: [[parent, p1, p2]], expect: true}
  - {id: "CO-916-T1", title: "Coverage review CW-2: a 17-year-old mother living alone with her baby does not live in the home of a caretaker and receives assistance as an adult (3.604.2.N.2.c), so the unit is not child-only (was true)", as_of: "2026-10-01", given: {date_of_birth: "2009-04-08", is_full_time_secondary_student_finishing_before_nineteen: true, receives_ssi: false, cw_receives_title_iv_foster_adoption_kinship_payment: false, temporary_absence_reason: none, cw_is_optional_member_by_custody_or_support: false, residence_setting_type: private_dwelling}, others: {p2: {date_of_birth: "2026-02-03", receives_ssi: false, cw_receives_title_iv_foster_adoption_kinship_payment: false, temporary_absence_reason: none, residence_setting_type: private_dwelling, cw_is_optional_member_by_custody_or_support: false}}, relationships: [[parent, p1, p2]], expect: false}
  - {id: "CO-916-T2", as_of: "2026-10-01", given: {date_of_birth: "1990-01-01", is_full_time_secondary_student_finishing_before_nineteen: false, receives_ssi: false, cw_receives_title_iv_foster_adoption_kinship_payment: false, temporary_absence_reason: none, cw_is_optional_member_by_custody_or_support: false, residence_setting_type: private_dwelling}, others: {p2: {date_of_birth: "2015-06-01", is_full_time_secondary_student_finishing_before_nineteen: false, receives_ssi: false, cw_receives_title_iv_foster_adoption_kinship_payment: false, temporary_absence_reason: none, residence_setting_type: private_dwelling, cw_is_optional_member_by_custody_or_support: false}}, relationships: [[parent, p1, p2]], expect: false}
  # Coverage pass 6 CA6-4 (probe W9): read in the determination month; in October the mother (18) is no dependent child of the month.
  - {id: "CO-916-T4", title: "Probe W9: October: the mother is a caretaker, not a child-only unit", as_of: "2026-10-15", given: {cw_assistance_unit_members_in_month: [p1, p2], cw_is_dependent_child_in_month: false, cw_minor_parent_is_assisted_as_adult: false}, others: {p2: {cw_is_dependent_child_in_month: true, cw_minor_parent_is_assisted_as_adult: false}}, expect: false}
