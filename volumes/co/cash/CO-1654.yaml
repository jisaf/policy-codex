id: CO-1654
name: "Colorado Works: sponsor verification is pending"
identifier: cw_sponsor_verification_is_pending
kind: derived
type: yes/no
scope: person-month
program: ColoradoWorks
role: outcome
meaning: Whether Colorado Works requires verification of the person's sponsor income information of a sponsored non-citizen and it has not been provided.
precision: "False where Colorado Works verification does not apply to the person (cw_verification_is_applicable, CO-2583; case worker review B2). Due by: cw_verification_due_date (CO-1426: eleven days), or cw_verification_extended_due_date when the county extended it."
derived: [all, cw_verification_is_applicable, [all, is_sponsored_non_citizen, [not, sponsor_information_verified]]]
sources: [S1062]
implemented: engine
tags: [verification, cash, tanf]
rationale: "Review U-1: the count items held this test as an anonymous arm, so no outcome told a worker which document was outstanding and for whom; the count now sums this item."
tests:
  - {id: CO-1654-T1, month: "2026-10", as_of: "2026-10-01", given: {cw_verification_is_applicable: true, is_sponsored_non_citizen: true, sponsor_information_verified: false}, expect: true}
  - {id: CO-1654-T2, month: "2026-10", as_of: "2026-10-01", given: {cw_verification_is_applicable: true, is_sponsored_non_citizen: false}, expect: false}
