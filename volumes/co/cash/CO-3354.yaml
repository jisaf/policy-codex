id: CO-3354
name: "Colorado Works: considered living in the home"
identifier: cw_is_considered_living_in_home
kind: derived
type: yes/no
scope: person
program: ColoradoWorks
meaning: "Whether Colorado Works considers the person to be living in the home they usually live in despite a temporary absence (9 CCR 2503-6 3.604.2.E, G, I): present (no absence); away for medical treatment (E.1, I.2) or on active duty in the uniformed services (I.1); a dependent child under a court's jurisdiction, in an agency's legal custody without its physical custody, or attending school away from home (E.2-4); a dependent child visiting a noncustodial parent under a parenting plan for no more than six months (G.2) or in a voluntary foster care placement for no more than three months (G.3); or away for less than forty-five days with an established intent to return (I.3). A parent or caretaker who has become a resident of an institution (a stay of at least thirty consecutive days, 3.604.2.O.2) is not in the home, unless the person keeps the responsibility of a dependent child who lives in the institution too or is still cared for in the home."
precision: "Months of a visit or placement are counted from the month the absence began. I.3's forty-five days, stated for a parent or caretaker, is also read for a child absent for a reason E and G do not list (OQ-611). If temporary_absence_reason is not stated, Colorado Works reads the person as present. Final cash review FC-1: the medical-treatment absence had kept a parent in the home however long the stay; 3.604.2.O.2 (S2602) now bounds it (cw_is_institution_resident, CO-3804, with the exception of cw_institution_resident_keeps_child_in_care, CO-3805). A dependent child receiving medical care away from home stays in the home under G.1 however long the stay. OQ-660 records the reading of O.2's last words. Final cash review 2, P2-6: a person stated with no temporary absence whose residence_setting_type is an institution entered at least thirty days before (cw_is_institution_resident) is not in the home either, unless a dependent child (G.1) or keeping a child in care (CO-3805), as in the medical-treatment branch; a setting not stated is read as a private dwelling."
derived: [case, [["=", [otherwise, temporary_absence_reason, none], none], [any, [not, [otherwise, cw_is_institution_resident, false]], cw_is_dependent_child, cw_institution_resident_keeps_child_in_care]], [["=", temporary_absence_reason, active_military_duty], true], [["=", temporary_absence_reason, medical_treatment], [any, [not, cw_is_institution_resident], cw_is_dependent_child, cw_institution_resident_keeps_child_in_care]],[[in, temporary_absence_reason, [school_away_from_home, court_jurisdiction_or_agency_custody]], cw_is_dependent_child], [["=", temporary_absence_reason, visiting_noncustodial_parent_under_parenting_plan], [all, cw_is_dependent_child, ["<", [det_month], [months_after, cw_parenting_plan_visit_max_months, [month_of, temporary_absence_start_date]]]]], [["=", temporary_absence_reason, voluntary_foster_care], [all, cw_is_dependent_child, ["<", [det_month], [months_after, cw_voluntary_foster_care_max_months, [month_of, temporary_absence_start_date]]]]], [["=", temporary_absence_reason, other_with_intent_to_return], [all, ["<", [days_between, temporary_absence_start_date, [det_date]], cw_temporary_absence_max_days], [any, [not, cw_is_institution_resident], cw_institution_resident_keeps_child_in_care]]], [else, false]]
sources: [S2203, S2602]
implemented: engine
open: [OQ-611, OQ-660]
tags: [cash, household]
rationale: "Same-word audit SW-7 and dual-entry audit 3.6: living together was read from relationship edges by every household, caretaker and custody item, while Medicaid read a separate lives_with list stated on one person; the two disagreed in CO-04, and lives_with could be stated on p1 and not on p2. Each person states the home they live in once; lives_with is derived, symmetric, and every item that asks whether persons live together reads it (convention rule 17). Colorado Works's own temporary-absence rule (3.604.2.E, G, I, S2203) over the neutral absence facts; the assistance unit (CO-900) and the caretaker relation (CO-2608) read it."
tests:
  - {id: CO-3354-T1, as_of: "2026-10-01", given: {}, expect: true}
  - {id: CO-3354-T2, title: "Caretaker in the hospital", as_of: "2026-10-01", given: {temporary_absence_reason: medical_treatment}, expect: true}
  - {id: CO-3354-T3, title: "Child at boarding school", as_of: "2026-10-01", given: {temporary_absence_reason: school_away_from_home, cw_is_dependent_child: true}, expect: true}
  - {id: CO-3354-T4, title: "Child visiting the other parent for four months", as_of: "2026-10-01", given: {temporary_absence_reason: visiting_noncustodial_parent_under_parenting_plan, temporary_absence_start_date: "2026-06-10", cw_is_dependent_child: true}, expect: true}
  - {id: CO-3354-T5, title: "Visit past six months", as_of: "2026-10-01", given: {temporary_absence_reason: visiting_noncustodial_parent_under_parenting_plan, temporary_absence_start_date: "2026-03-10", cw_is_dependent_child: true}, expect: false}
  - {id: CO-3354-T6, title: "Away 30 days, intends to return", as_of: "2026-10-01", given: {temporary_absence_reason: other_with_intent_to_return, temporary_absence_start_date: "2026-09-01"}, expect: true}
  - {id: CO-3354-T7, title: "Away 60 days", as_of: "2026-10-01", given: {temporary_absence_reason: other_with_intent_to_return, temporary_absence_start_date: "2026-08-02"}, expect: false}
  - {id: CO-3354-T8, as_of: "2026-10-01", given: {temporary_absence_reason: other}, expect: false}
  # Final cash review FC-1: 3.604.2.O.2, a resident of an institution.
  - {id: CO-3354-T9, title: "Parent in a nursing home for 60 days, no child cared for at home (O.2)", as_of: "2026-10-01", given: {temporary_absence_reason: medical_treatment, date_of_birth: "1980-01-01", residence_setting_type: nursing_facility, institution_entry_date: "2026-08-02"}, relationships: [], expect: false}
  - {id: CO-3354-T10, title: "Parent in a nursing home for 60 days whose child is cared for at home (O.2 exception)", as_of: "2026-10-01", given: {temporary_absence_reason: medical_treatment, date_of_birth: "1980-01-01", residence_setting_type: nursing_facility, institution_entry_date: "2026-08-02"}, others: {p2: {date_of_birth: "2018-01-01"}}, relationships: [[parent, p1, p2]], expect: true}
  - {id: CO-3354-T11, title: "Parent in a hospital for 10 days", as_of: "2026-10-01", given: {temporary_absence_reason: medical_treatment, date_of_birth: "1980-01-01", residence_setting_type: hospital, institution_entry_date: "2026-09-21"}, expect: true}
  - {id: CO-3354-T12, title: "A child in a hospital for 90 days stays in the home (G.1)", as_of: "2026-10-01", given: {temporary_absence_reason: medical_treatment, date_of_birth: "2015-01-01", residence_setting_type: hospital, institution_entry_date: "2026-07-03"}, expect: true}
  # Final cash review 2, P2-6: an institutional setting with no absence reason stated.
  - {id: CO-3354-T13, title: "P2-6: a mother living in a nursing facility since August 1, no absence reason stated, no child in her care - not in the home (O.2)", as_of: "2026-10-01", given: {residence_setting_type: nursing_facility, institution_entry_date: "2026-08-01", cw_is_dependent_child: false, cw_institution_resident_keeps_child_in_care: false}, expect: false}
  - {id: CO-3354-T14, title: "P2-6: the same mother keeping the care of her child at home - in the home (O.2's exception)", as_of: "2026-10-01", given: {residence_setting_type: nursing_facility, institution_entry_date: "2026-08-01", cw_is_dependent_child: false, cw_institution_resident_keeps_child_in_care: true}, expect: true}
