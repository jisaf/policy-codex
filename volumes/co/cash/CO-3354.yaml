id: CO-3354
name: "Colorado Works: considered living in the home"
identifier: cw_is_considered_living_in_home
kind: derived
type: yes/no
scope: person
program: ColoradoWorks
meaning: "Whether, in some month the Colorado Works determination covers (cw_determination_months, CO-7300), Colorado Works considers the person to be living in the home they usually live in despite a temporary absence: the reading of who may join the assistance unit (cw_assistance_unit_members, CO-900). The test of each month (9 CCR 2503-6 3.604.2.E, G, I: present; away for medical treatment or on active duty; a dependent child under a court's jurisdiction, in an agency's custody without its physical custody, at school away from home, visiting a noncustodial parent under a parenting plan for no more than six months, or in a voluntary foster care placement for no more than three months; away for less than forty-five days with an established intent to return; not a parent or caretaker who has become a resident of an institution, with its exceptions) is cw_is_considered_living_in_home_in_month (CO-7602)."
precision: "Months of a visit or placement are counted from the month the absence began. I.3's forty-five days, stated for a parent or caretaker, is also read for a child absent for a reason E and G do not list (OQ-611). If temporary_absence_reason is not stated, Colorado Works reads the person as present. Final cash review FC-1: the medical-treatment absence had kept a parent in the home however long the stay; 3.604.2.O.2 (S2602) now bounds it (cw_is_institution_resident, CO-3804, with the exception of cw_institution_resident_keeps_child_in_care, CO-3805). A dependent child receiving medical care away from home stays in the home under G.1 however long the stay. OQ-660 records the reading of O.2's last words. Final cash review 2, P2-6: a person stated with no temporary absence whose residence_setting_type is an institution entered at least thirty days before (cw_is_institution_resident) is not in the home either, unless a dependent child (G.1) or keeping a child in care (CO-3805), as in the medical-treatment branch; a setting not stated is read as a private dwelling. Coverage pass 6 CA6-7 (docs/reviews/coverage6-cash.md): whether the person is temporarily absent (temporary_absence_reason, none for a person in the home) is required where read (decision 4 of 2026-11-23); before, an unstated absence was read as none. Pattern sweep (cash) PS-T8 (docs/reviews/pattern-sweep-cash.md): whether the person lives in the home in some month the determination covers (cw_determination_months, CO-7300), each month read by cw_is_considered_living_in_home_in_month (CO-7602), which holds the rule above and counts each absence to that month (cw_month_reading_date, CO-7600). This item answers who may join the unit and the caretaker and parent relations, as cw_is_dependent_child (CO-901) answers for the dependent child; the month's unit (CO-7303) and the per-month minor-parent and stepparent items read CO-7602. Before, every absence was counted to the determination date and month, so a member whose absence passed its limit after the application month was no member in the application month either. The earlier sentence that an unstated absence reason reads as present is superseded by coverage pass 6 CA6-7 (required). Coverage pass 7, F7-7 (docs/reviews/coverage7-cash.md): the meaning is restated as the derivation reads since the pattern sweep's PS-T8 (some month of the determination); it described the month's test, which is CO-7602's."
derived: [">", [sum_months, cw_determination_months, [case, [[at, cw_is_considered_living_in_home_in_month, [that_month]], 1], [else, 0]]], 0]
sources: [S2203, S2602]
implemented: engine
open: [OQ-611, OQ-660]
tags: [cash, household]
rationale: "Same-word audit SW-7 and dual-entry audit 3.6: living together was read from relationship edges by every household, caretaker and custody item, while Medicaid read a separate lives_with list stated on one person; the two disagreed in CO-04, and lives_with could be stated on p1 and not on p2. Each person states the home they live in once; lives_with is derived, symmetric, and every item that asks whether persons live together reads it (convention rule 17). Colorado Works's own temporary-absence rule (3.604.2.E, G, I, S2203) over the neutral absence facts; the assistance unit (CO-900) and the caretaker relation (CO-2608) read it."
tests:
  - {id: "CO-3354-T1", as_of: "2026-10-01", given: {temporary_absence_reason: none, residence_setting_type: private_dwelling}, expect: true}
  - {id: "CO-3354-T2", title: "Caretaker in the hospital", as_of: "2026-10-01", given: {temporary_absence_reason: medical_treatment, residence_setting_type: private_dwelling}, expect: true}
  - {id: CO-3354-T3, title: "Child at boarding school", as_of: "2026-10-01", given: {temporary_absence_reason: school_away_from_home, cw_is_dependent_child_in_month: true}, expect: true}
  - {id: CO-3354-T4, title: "Child visiting the other parent for four months", as_of: "2026-10-01", given: {temporary_absence_reason: visiting_noncustodial_parent_under_parenting_plan, temporary_absence_start_date: "2026-06-10", cw_is_dependent_child_in_month: true}, expect: true}
  - {id: CO-3354-T5, title: "Visit past six months", as_of: "2026-10-01", given: {temporary_absence_reason: visiting_noncustodial_parent_under_parenting_plan, temporary_absence_start_date: "2026-03-10", cw_is_dependent_child_in_month: true}, expect: false}
  - {id: "CO-3354-T6", title: "Away 30 days, intends to return", as_of: "2026-10-01", given: {temporary_absence_reason: other_with_intent_to_return, temporary_absence_start_date: "2026-09-01", residence_setting_type: private_dwelling}, expect: true}
  - {id: CO-3354-T7, title: "Away 60 days", as_of: "2026-10-01", given: {temporary_absence_reason: other_with_intent_to_return, temporary_absence_start_date: "2026-08-02"}, expect: false}
  - {id: CO-3354-T8, as_of: "2026-10-01", given: {temporary_absence_reason: other}, expect: false}
  # Final cash review FC-1: 3.604.2.O.2, a resident of an institution.
  - {id: CO-3354-T9, title: "Parent in a nursing home for 60 days, no child cared for at home (O.2)", as_of: "2026-10-01", given: {temporary_absence_reason: medical_treatment, date_of_birth: "1980-01-01", residence_setting_type: nursing_facility, institution_entry_date: "2026-08-02"}, relationships: [], expect: false}
  - {id: "CO-3354-T10", title: "Parent in a nursing home for 60 days whose child is cared for at home (O.2 exception)", as_of: "2026-10-01", given: {temporary_absence_reason: medical_treatment, date_of_birth: "1980-01-01", residence_setting_type: nursing_facility, institution_entry_date: "2026-08-02"}, others: {p2: {date_of_birth: "2018-01-01", temporary_absence_reason: none, residence_setting_type: private_dwelling}}, relationships: [[parent, p1, p2]], expect: true}
  - {id: CO-3354-T11, title: "Parent in a hospital for 10 days", as_of: "2026-10-01", given: {temporary_absence_reason: medical_treatment, date_of_birth: "1980-01-01", residence_setting_type: hospital, institution_entry_date: "2026-09-21"}, expect: true}
  - {id: CO-3354-T12, title: "A child in a hospital for 90 days stays in the home (G.1)", as_of: "2026-10-01", given: {temporary_absence_reason: medical_treatment, date_of_birth: "2015-01-01", residence_setting_type: hospital, institution_entry_date: "2026-07-03"}, expect: true}
  # Final cash review 2, P2-6: an institutional setting with no absence reason stated.
  - {id: "CO-3354-T13", title: "P2-6: a mother living in a nursing facility since August 1, no absence reason stated, no child in her care - not in the home (O.2)", as_of: "2026-10-01", given: {residence_setting_type: nursing_facility, institution_entry_date: "2026-08-01", cw_is_dependent_child_in_month: false, cw_institution_resident_keeps_child_in_care: false, temporary_absence_reason: none}, expect: false}
  - {id: "CO-3354-T14", title: "P2-6: the same mother keeping the care of her child at home - in the home (O.2's exception)", as_of: "2026-10-01", given: {residence_setting_type: nursing_facility, institution_entry_date: "2026-08-01", cw_is_dependent_child_in_month: false, cw_institution_resident_keeps_child_in_care: true, temporary_absence_reason: none}, expect: true}
  # Coverage pass 6 CA6-7: 3.604.2.E, G, I; whether the person is temporarily absent is required (none for a person in the home).
  - {id: "CO-3354-T15", title: "Coverage pass 6 CA6-7: absence not stated: cannot determine", as_of: "2026-10-01", given: {}, expect: unknown}
  - {id: "CO-3354-T16", title: "In the home (none), not an institution resident: living in the home", as_of: "2026-10-01", given: {temporary_absence_reason: none, cw_is_institution_resident: false}, expect: true}
