id: CO-1662
name: "Adult Financial: citizenship verification is pending"
identifier: af_citizenship_verification_is_pending
kind: derived
type: yes/no
scope: person-month
program: AdultFinancial
role: outcome
meaning: Whether Adult Financial requires verification of the client's questionable citizenship (Aid to the Needy Disabled) and it has not been provided.
derived: [all, af_requires_verification_of_citizenship, [not, [any, citizenship_verified_by_electronic_data_source, [all, citizenship_verification_document_received, af_citizenship_document_is_acceptable]]]]
sources: [S886, S1076, S1077]
implemented: engine
tags: [verification, cash]
rationale: "Review U-1: the count items held this test as an anonymous arm, so no outcome told a worker which document was outstanding and for whom; the count now sums this item."
tests:
  - {id: CO-1662-T1, month: "2026-10", as_of: "2026-10-01", given: {af_requires_verification_of_citizenship: true, citizenship_verified_by_electronic_data_source: false, citizenship_verification_document_received: false}, expect: true}
  - {id: CO-1662-T2, month: "2026-10", as_of: "2026-10-01", given: {af_requires_verification_of_citizenship: false}, expect: false}
