id: CO-2872
name: af has countable unearned income
identifier: af_has_countable_unearned_income
kind: derived
type: yes/no
scope: person-month
program: AdultFinancial
meaning: "Whether the person has unearned income in the month that Adult Financial counts (af_countable_income, CO-946, reads these sources): every unearned source but the Adult Financial grant itself. A receipt of a kind Adult Financial's counting table reads as earnings (af_receipt_treatment_table, CO-5016: read_as_earnings) is earned income, verified with the earnings records (af_earned_income_is_unverified, CO-3882), and is not read here."
precision: "Receipt records, migration phase 1: the month's receipts of every kind but SSI and the grant (other than a retroactive lump sum of either), gambling winnings and a sponsor's money, as the unearned income facts it summed held them. Field sweep fix round (docs/reviews/field-sweep-snap-cash-nonmagi.md, FS-AF-1): a stream (a receipt with no month and no date) is read only in the months from the month of its start_date through the month of its end_date, as SNAP's readers read it (snap_counted_recurring_receipts, CO-5011), since \"All income shall be countable in the month it is actually received or legally becomes available\" (9 CCR 2503-5 3.520.781.G, S4910): a pension that ended, or one not yet begun, is received in no month outside those dates; a receipt stated with its month or date is read in that month. Before, a stream was read in every month whatever its dates. Records E2/H2 leftovers (docs/reviews/records-e2-h2.md, section 5): a receipt whose kind Adult Financial's table reads as earnings (read_as_earnings: special pay, a payment for meals only or a room only) is left out, as the other Adult Financial readers of every receipt leave it out (af_infrequent_income_quarter_total CO-4011, af_spouse_dependent_children_needs CO-2392). The test is the unearned half of the interface verification of 9 CCR 2503-5 3.520.5.A (S880; volumes/co/documents/D-105.md): \"Source agency records shall be matched on a regular basis to identify potential earned and unearned income, and resources\", and A.3: \"Prior to approval of grant payments, the county department shall, at a minimum, verify potential income or unemployment benefits for the client, client's spouse, and sponsor(s).\" The rule verifies earned and unearned income each as what it is (A.2: DOLE wage data \"shall not be considered verified upon receipt\"); 3.520.783.C.2.b-d counts board, room, and room and board payments as earned income (S4380; c: \"Room (to provide a person with lodging only) payments to the client, client's spouse, or sponsor(s) shall be considered earned income in the month received\"), and the earnings records state them (boarder_payments, which af_earned_income_is_unverified, CO-3882, reads for verification); a receipt copy of them is not unearned income to verify. Before, every kind but gambling winnings and a sponsor's money was summed, so the copies the E0 translator wrote in receipts were read as unearned income (CO-206, CO-362: true, now false). The rows of the table that exclude a kind (excluded, not_income) are not left out: A.3 verifies potential income, not only the income counted, and leaving them out would move 17 stored households; that is the Adult Financial owner's question, not this fix."
