id: CO-1707
name: "Adult Financial: self-employment business costs"
identifier: af_self_employment_business_costs
kind: derived
type: money
scope: person-month
program: AdultFinancial
meaning: "The person's cost of doing business for the month, other than a farm's, that 9 CCR 2503-5 3.520.783.B allows (rent of business premises, wholesale cost of merchandise, utilities, interest, taxes, labor, upkeep of necessary equipment): the cost records the earnings table deducts (operating costs and interest); not depreciation, payments on the principal of loans for capital assets, or personal expenses."
precision: "Earned-income records, step E1 Adult Financial (docs/reviews/records-earnings-cash.md): the earnings records (earnings, CO-5100) of a cost kind that af_earnings_treatment_table (CO-5103) deducts, paid in the month, that are not a farm's (farm: a farm's costs are read by af_self_employment_net_profit, CO-1708, with the farm's receipts over the prior year); before earnings records each cost fact was read as 0 when not stated, and now an unstated earnings list is cannot determine (decision 4 of 2026-11-23). Coverage review 2 (first-pass P2-2): for a licensed child care provider (licensed_child_care_children_in_care_count above 0) the cost is af_child_care_provider_cost_first_child for the first child and af_child_care_provider_cost_each_additional_child for each other child, or the documented costs when they are greater (3.520.783.C.3.a-d, S3505). Coverage pass 4 CA4-9 (docs/reviews/coverage4-cash.md): a stream (an earnings record with no month and no date) is read only in the months from the month of its job_start_date through the month of its job_end_date, so the pay of a job that ended before the month, or begins after it, is not counted (9 CCR 2503-5 3.520.781.G, 9 CCR 2503-6 3.605.2.B: income counted when received); a record stated with its month or date is read in that month. Coverage pass 4 CA4-16: the count of children a licensed child care provider cares for is required of a person with business receipts in the month (a self-employed person who is not a child care provider states 0); a person with none has only the cost records' own sum, never read as 0 when not stated (decision 4 of 2026-11-23: missing information is cannot determine unless the rule says otherwise)."
derived: [case, [["<=", [sum_receipts, earnings, [all, [all, ["=", [lookup, af_earnings_treatment_table, [receipt, kind]], counted_net_of_costs], [not, [receipt, farm]], [received_in, [month]]], [any, [not, [unknown, [receipt, month]]], [all, [any, [unknown, [receipt, job_start_date]], ["<=", [month_of, [receipt, job_start_date]], [month]]], [any, [unknown, [receipt, job_end_date]], [">=", [month_of, [receipt, job_end_date]], [month]]]]]], [receipt, amount]], 0], [sum_receipts, earnings, [all, [all, ["=", [lookup, af_earnings_treatment_table, [receipt, kind]], deducted], [not, [receipt, farm]], [received_in, [month]]], [any, [not, [unknown, [receipt, month]]], [all, [any, [unknown, [receipt, job_start_date]], ["<=", [month_of, [receipt, job_start_date]], [month]]], [any, [unknown, [receipt, job_end_date]], [">=", [month_of, [receipt, job_end_date]], [month]]]]]], [receipt, amount]]], [[">", licensed_child_care_children_in_care_count, 0], [max, [sum_receipts, earnings, [all, [all, ["=", [lookup, af_earnings_treatment_table, [receipt, kind]], deducted], [not, [receipt, farm]], [received_in, [month]]], [any, [not, [unknown, [receipt, month]]], [all, [any, [unknown, [receipt, job_start_date]], ["<=", [month_of, [receipt, job_start_date]], [month]]], [any, [unknown, [receipt, job_end_date]], [">=", [month_of, [receipt, job_end_date]], [month]]]]]], [receipt, amount]], ["+", af_child_care_provider_cost_first_child, ["*", af_child_care_provider_cost_each_additional_child, ["-", licensed_child_care_children_in_care_count, 1]]]]], [else, [sum_receipts, earnings, [all, [all, ["=", [lookup, af_earnings_treatment_table, [receipt, kind]], deducted], [not, [receipt, farm]], [received_in, [month]]], [any, [not, [unknown, [receipt, month]]], [all, [any, [unknown, [receipt, job_start_date]], ["<=", [month_of, [receipt, job_start_date]], [month]]], [any, [unknown, [receipt, job_end_date]], [">=", [month_of, [receipt, job_end_date]], [month]]]]]], [receipt, amount]]]]
open: ["OQ-1294"]
sources: [S1156, S3505, S4104]
implemented: engine
tags: [cash, income]
rationale: "Same-word audit SW-28, dual-entry audit 3.24 and 3.25: each program's excluded income and allowable business costs were program-prefixed supplied amounts, so one receipt or one set of business costs was entered once per program. The neutral fact describes the receipt or the cost; each program's exclusion or allowable cost is its own derived item citing its list (product-owner decision, convention rule 13). The ID and identifier are kept; the amount is now derived. Earned-income records, step E1 Adult Financial: each cost is a record of its own kind, deducted or not by the program's counting table, so no cost is deducted or left out by silence (design decision D4)."
tests:
  # Hand computations from 3.520.783.B.1-3 (S1156, S4104) and C.3 (S3505).
  - {id: "CO-1707-T1", month: "2026-10", as_of: "2026-10-01", title: "Operating 400, interest 20, capital principal 100, home space 50, vehicle 30: 400 + 20 = 420 (B.1 names interest; B.3 excludes principal; the home space and vehicle rows are for the owner's signature)", given: {earnings: [{kind: self_employment_receipts, amount: 2000}, {kind: business_cost_operating, amount: 400}, {kind: business_cost_interest, amount: 20}, {kind: business_cost_capital_principal, amount: 100}, {kind: business_cost_home_space, amount: 50}, {kind: business_cost_vehicle, amount: 30}], licensed_child_care_children_in_care_count: 0}, expect: 420}
  - {id: CO-1707-T2, title: "P2-2: a licensed day care provider caring for three children with $60 of documented costs - 55 + 2 x 22 = 99 (3.520.783.C.3)", month: "2026-10", as_of: "2026-10-01", given: {licensed_child_care_children_in_care_count: 3, earnings: [{kind: self_employment_receipts, amount: 1500}, {kind: business_cost_operating, amount: 60}]}, expect: 99}
  - {id: CO-1707-T3, title: "P2-2: documented costs of $300 are greater than the allowance (C.3.d)", month: "2026-10", as_of: "2026-10-01", given: {licensed_child_care_children_in_care_count: 3, earnings: [{kind: self_employment_receipts, amount: 1500}, {kind: business_cost_operating, amount: 300}]}, expect: 300}
  - {id: "CO-1707-T4", title: "A farm's $500 of operating costs are not this business's: 80 of shop costs only", month: "2026-10", as_of: "2026-10-01", given: {earnings: [{kind: business_cost_operating, amount: 500, farm: true}, {kind: business_cost_operating, amount: 80}], licensed_child_care_children_in_care_count: 0}, expect: 80}
  - {id: CO-1707-T5, title: "Earnings not stated: cannot determine (decision 4)", month: "2026-10", as_of: "2026-10-01", given: {}, expect: unknown}
