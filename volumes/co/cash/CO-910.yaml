id: CO-910
name: "Colorado Works: countable income"
identifier: cw_countable_income
kind: derived
type: money
scope: person-month
program: ColoradoWorks
meaning: "The total net countable income of this person's assistance unit for the month - the sum of each member's countable earned and unearned income (CO-907, CO-908), plus any income deemed under 3.605.1.A.4 from a minor-parent member's non-participant parent (CO-909) - the figure 3.606.1.H compares against the need standard and 3.606.1.I-K use to compute the grant. A required member disqualified for an intentional program violation or as a fleeing felon has gross earnings counted without disregards (3.604.2.M), and one disqualified for citizenship, status, lawful presence or SSN reasons has earnings net of the cw_earned_income_disregard_dollar employment disregard (3.605.1.A.6); the sponsor's deemed net income (cw_sponsor_deemed_income, 3.605.1.A.5) is added for each sponsored member; and the income of a budgetary-unit member outside the assistance unit (cw_budgetary_member_deemed_income: a stepparent under 3.605.1.A.4.a, a non-parent caretaker's spouse under 3.606.1.J) is added."
precision: "Coverage review CW-9(b): money a member received from a sponsor (cw_sponsor_contributions_counted, CO-4363) is added when sponsor deeming does not apply, a gift under 3.605.3.A.14 (S3157). OQ-490 resolved (CDHS review S-5): a member disqualified for citizenship, non-citizen status, lawful presence or SSN reasons (cw_is_disqualified_for_status_or_ssn, CO-2557) has net income deemed under 3.605.1.A.6, gross earnings less the cw_earned_income_disregard_dollar employment disregard of 3.605.1.A.4.a (S1808); a member disqualified for an IPV or as a fleeing felon counts gross earnings without disregards (3.604.2.M). This eligibility figure applies the same deeming in both computations, since A.6 deems net income to the unit rather than giving the member the unit's payment disregard (3.606.2 excludes disqualified individuals). Coverage pass 6 CA6-4, CA6-5 (docs/reviews/coverage6-cash.md): the members whose income is summed are the month's (cw_assistance_unit_members_in_month, CO-7304), so a child who is no member in the month (no dependent child of it, not yet born, or dead before it) brings no income to it. Pattern sweep (cash) PS-M4 (docs/reviews/pattern-sweep-cash.md): a member of the budgetary unit outside the assistance unit (a stepparent) has income deemed only in a month he was alive on the first day of (3.609.2.C.1-2); before, a stepparent who died went on having his stated income deemed in the months after."
derived: ["+", ["sum", "cw_assistance_unit_members_in_month", ["+", ["case", [["of", ["P"], "cw_is_disqualified_member"], ["case", [["of", ["P"], "cw_is_disqualified_for_status_or_ssn"], ["max", 0, ["-", ["of", ["P"], "cw_gross_earned_income"], "cw_earned_income_disregard_dollar"]]], ["else", ["of", ["P"], "cw_gross_earned_income"]]]], ["else", ["of", ["P"], "cw_countable_earned_income"]]], ["of", ["P"], "cw_countable_unearned_income"], ["of", ["P"], "cw_deemed_parent_income_of_minor_parent"], ["of", ["P"], "cw_sponsor_deemed_income"], ["of", ["P"], "cw_sponsor_contributions_counted"]]], ["sum", ["filter", "cw_budgetary_unit_members", ["all", ["not", ["in_group", ["P"], "cw_assistance_unit_members"]], ["any", ["unknown", ["of", ["P"], "date_of_death"]], [">=", ["of", ["P"], "date_of_death"], ["first_day", ["month"]]]]]], ["of", ["P"], "cw_budgetary_member_deemed_income"]]]
sources: [S412, S413, S415, S1004, S1626, S1627, S1628, S1808, S3157]
implemented: engine
tags: [cash, tanf, income]
open: [OQ-771]
rationale: "No existing item aggregates Colorado Works countable income at the unit level; cw_meets_income_test (CO-913) and cw_grant_amount (CO-914) both need it. Sponsor deeming (3.605.1.A.5) and the disqualified member (3.604.2.M, 3.605.1.A.6) are modeled since the phase-10 sweep. Case worker review S11: the authoring note \"Phase-10 sweep (OQ-103, OQ-140, OQ-143)\" moved out of the meaning, which states only what the fact is."
