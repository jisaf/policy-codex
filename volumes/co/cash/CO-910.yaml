id: CO-910
name: "Colorado Works: countable income"
identifier: cw_countable_income
kind: derived
type: money
scope: person-month
program: ColoradoWorks
meaning: "The total net countable income of this person's assistance unit for the month - the sum of each member's countable earned and unearned income (CO-907, CO-908), plus any income deemed under 3.605.1.A.4 from a minor-parent member's non-participant parent (CO-909) - the figure 3.606.1.H compares against the need standard and 3.606.1.I-K use to compute the grant. Phase-10 sweep (OQ-103, OQ-140, OQ-143): a disqualified or ineligible required member's earnings count gross, without disregards (3.604.2.M); the sponsor's deemed net income (cw_sponsor_deemed_income, 3.605.1.A.5) is added for each sponsored member; and the income of a budgetary-unit member outside the assistance unit (cw_budgetary_member_deemed_income: a stepparent under 3.605.1.A.4.a, a non-parent caretaker's spouse under 3.606.1.J) is added."
open: [OQ-490]
derived: [+, [sum, cw_assistance_unit_members, [+, [case, [[of, [P], cw_is_disqualified_member], [of, [P], cw_gross_earned_income]], [else, [of, [P], cw_countable_earned_income]]], [of, [P], cw_countable_unearned_income], [of, [P], cw_deemed_parent_income_of_minor_parent], [of, [P], cw_sponsor_deemed_income]]], [sum, [filter, cw_budgetary_unit_members, [not, [in_group, [P], cw_assistance_unit_members]]], [of, [P], cw_budgetary_member_deemed_income]]]
sources: [S412, S413, S415, S1004, S1626, S1627, S1628]
implemented: engine
tags: [cash, tanf, income]
rationale: No existing item aggregates Colorado Works countable income at the unit level; cw_meets_income_test (CO-913) and cw_grant_amount (CO-914) both need it. Sponsor deeming (3.605.1.A.5) and the disqualified member (3.604.2.M, 3.605.1.A.6) are modeled since the phase-10 sweep.
