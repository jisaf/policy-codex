id: CO-910
name: "Colorado Works: countable income"
identifier: cw_countable_income
kind: derived
type: money
scope: person-month
program: ColoradoWorks
meaning: The total net countable income of this person's assistance unit for the month - the sum of each member's countable earned and unearned income (CO-907, CO-908), plus any income deemed under 3.605.1.A.4 from a minor-parent member's non-participant parent (CO-909) - the figure 3.606.1.H compares against the need standard and 3.606.1.I-K use to compute the grant. A disqualified or ineligible required member's (cw_is_disqualified_member, CO-928) own income is counted in full, without the earned income disregard, per 3.604.2.M's second sentence.
precision: "Fix round (OQ-143): a disqualified member's earned income is read directly (earned_income) rather than through cw_countable_earned_income (CO-907), which applies the $90 disregard; their unearned income (cw_countable_unearned_income, CO-908) is unaffected, since 3.604.2.M's 'without applying income disregards' targets the earned income disregards of 3.606.2, and this volume has no unearned-income disregard for CO-908 to withhold."
open: [OQ-103]
derived: [+, [sum, cw_assistance_unit_members, [+, [case, [[of, [P], cw_is_disqualified_member], [of, [P], earned_income]], [else, [of, [P], cw_countable_earned_income]]], [of, [P], cw_countable_unearned_income]]], [sum, cw_assistance_unit_members, [of, [P], cw_deemed_parent_income_of_minor_parent]]]
sources: [S412, S413, S415, S523]
implemented: engine
tags: [cash, tanf, income]
rationale: "No existing item aggregates Colorado Works countable income at the unit level; cw_meets_income_test (CO-913) and cw_grant_amount (CO-914) both need it. Does not model sponsor deeming (3.605.1.A.5) - see OQ-103. Fix round (OQ-143): now counts a disqualified member's earned income undisregarded (3.604.2.M's second sentence), which the phase-5 review's C-3(c) finding on CO-928 first named as unmodeled."
