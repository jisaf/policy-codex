rationale: "Vocabulary fix round (docs/reviews/vocabulary-reuse.md, R-1): gives self-employment this program's own reading; before, the program read one shared net figure, or none. Earned-income records, step E1 Colorado Works: the receipts and costs are earnings records read through the program's counting table."
tests:
  # Hand computations from 3.605.2.E.1 (S1155).
  - {id: "CO-1706-T1", title: "$1,500 of receipts and $400 of operating costs: 1,100", as_of: "2026-10-01", month: "2026-10", given: {earnings: [{kind: self_employment_receipts, amount: 1500}, {kind: business_cost_operating, amount: 400}], licensed_child_care_children_in_care_count: 0}, expect: 1100}
  - {id: CO-1706-T2, as_of: "2026-10-01", month: "2026-10", title: "No self-employment - $200 of costs recorded, no receipts: 0", given: {earnings: [{kind: wages, amount: 900}, {kind: business_cost_operating, amount: 200}]}, expect: 0}
  - {id: "CO-1706-T3", as_of: "2026-10-01", month: "2026-10", title: "Costs above receipts: max(0, 300 - 450) = 0", given: {earnings: [{kind: self_employment_receipts, amount: 300}, {kind: business_cost_operating, amount: 450}], licensed_child_care_children_in_care_count: 0}, expect: 0}
  - {id: "CO-1706-T4", as_of: "2026-10-01", month: "2026-10", title: "A farm's $1,000 of October sales with $300 of costs: counted in the month received (E.4.a): 700", given: {earnings: [{kind: farm_self_employment_receipts, amount: 1000, month: "2026-10"}, {kind: business_cost_operating, amount: 300, farm: true, month: "2026-10"}], licensed_child_care_children_in_care_count: 0}, expect: 700}
  # Field sweep fix round (FS-CW-5): hand-computed from 9 CCR 2503-6 3.605.2.E.2-3 (S4913): irregular self-employment income averaged over twelve months (the twelve ending with the month, OQ-1335).
  - {"month": "2027-02", "as_of": "2027-02-15", "title": "Probe FS-CW-5: $2,400 of business receipts in February 2027 marked irregular, no costs: 2,400 / 12 = 200", "given": {"earnings": [{"kind": "self_employment_receipts", "amount": 2400, "month": "2027-02", "irregular": true}]}, "month_defaults": {"licensed_child_care_children_in_care_count": 0}, "expect": 200, "id": "CO-1706-T5"}
  - {"month": "2028-01", "as_of": "2028-01-15", "title": "The same read for January 2028, the last month whose twelve include February 2027: 200", "given": {"earnings": [{"kind": "self_employment_receipts", "amount": 2400, "month": "2027-02", "irregular": true}]}, "month_defaults": {"licensed_child_care_children_in_care_count": 0}, "expect": 200, "id": "CO-1706-T6"}
  - {"month": "2028-02", "as_of": "2028-02-15", "title": "The same read for February 2028: no irregular receipt in March 2027 to February 2028, the month's own receipts, none, 0", "given": {"earnings": [{"kind": "self_employment_receipts", "amount": 2400, "month": "2027-02", "irregular": true}]}, "month_defaults": {"licensed_child_care_children_in_care_count": 0}, "expect": 0, "id": "CO-1706-T7"}
  - {"month": "2026-10", "as_of": "2026-10-15", "title": "$3,000 of irregular receipts in June 2026 with $600 of operating costs that month: (3,000 - 600) / 12 = 200", "given": {"earnings": [{"kind": "self_employment_receipts", "amount": 3000, "month": "2026-06", "irregular": true}, {"kind": "business_cost_operating", "amount": 600, "month": "2026-06"}]}, "month_defaults": {"licensed_child_care_children_in_care_count": 0}, "expect": 200, "id": "CO-1706-T8"}
