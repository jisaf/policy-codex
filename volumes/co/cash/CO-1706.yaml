id: CO-1706
name: "Colorado Works: net profit from self-employment"
identifier: cw_self_employment_net_profit
kind: derived
type: money
scope: person-month
program: ColoradoWorks
meaning: "The person's net profit from self-employment for the month under 9 CCR 2503-6 3.605.2.E.1: gross receipts less the cost of doing business, not below zero; 3.605.2.E.1.c treats it as earned income."
precision: "Irregular self-employment income averaged over twelve months (3.605.2.E.3) is stated already averaged. A person with no gross receipts has none, whatever the cost fact says."
derived: [case, [["<=", self_employment_gross_receipts, 0], 0], [else, [max, 0, ["-", self_employment_gross_receipts, cw_self_employment_business_costs]]]]
sources: [S1155]
implemented: engine
tags: [cash, tanf, income]
rationale: "Vocabulary fix round (docs/reviews/vocabulary-reuse.md, R-1): gives self-employment this program's own reading; before, the program read one shared net figure, or none."
tests:
  - {id: CO-1706-T1, as_of: "2026-10-01", month: "2026-10", given: {self_employment_gross_receipts: 1500, cw_self_employment_business_costs: 400}, expect: 1100}
  - {id: CO-1706-T2, as_of: "2026-10-01", month: "2026-10", title: "No self-employment - costs not read", given: {self_employment_gross_receipts: 0}, expect: 0}
  - {id: CO-1706-T3, as_of: "2026-10-01", month: "2026-10", title: "Costs above receipts", given: {self_employment_gross_receipts: 300, cw_self_employment_business_costs: 450}, expect: 0}
