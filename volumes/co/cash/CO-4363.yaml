id: CO-4363
name: "Colorado Works: money from a sponsor counted as a gift"
identifier: cw_sponsor_contributions_counted
kind: derived
type: money
scope: person-month
program: ColoradoWorks
meaning: "The money this non-citizen received in the month from a sponsor or a sponsor's spouse living elsewhere (the receipts Colorado Works' counting table treats as a sponsor's contribution, cw_receipt_treatment_table: sponsor_contribution) that Colorado Works counts as unearned income, a gift (9 CCR 2503-6 3.605.3.A.14): all of it when sponsor deeming does not apply; none when it does, since the sponsor's net income is then deemed to the unit (cw_sponsor_deemed_income, CO-2365) and the money is part of that income."
precision: "Receipt records, migration phase 2 (docs/reviews/receipts-migration-2-cw.md): the money is the month's receipts of the kind sponsor_payment. When deeming does not apply and the receipts are not stated, the amount cannot be determined: 3.605.3.A.14 counts gifts received and gives no reading for gifts not reported (decision 4 of 2026-11-23 (docs/plan-colorado.md): missing information is cannot determine unless the rule says otherwise; the default of 0 kept from money_received_from_sponsor, CO-3707, is removed, as it is from SNAP's sponsor money, CO-3701); a stated empty list is no money from a sponsor, 0. Kept apart from cw_countable_unearned_income (CO-908) because cw_sponsor_deeming_applies (CO-2364) reads CO-908 for the combined-income test. Field sweep fix round (docs/reviews/field-sweep-snap-cash-nonmagi.md, FS-CW-1): a stream (a receipt with no month and no date) is read only in the months from the month of its start_date through the month of its end_date, as SNAP's readers read it (snap_counted_recurring_receipts, CO-5011), since income is \"the receipt by a client of a gain or benefit in cash or in-kind during a calendar month\" and the unit's income is what it has \"received, or ... expects to receive in the application month and any month following\" (9 CCR 2503-6 3.605.1.A.2, B, S4911): a pension that ended, or one not yet begun, is received in no month outside those dates; a receipt stated with its month or date is read in that month. Before, a stream was read in every month whatever its dates."
derived: ["case", ["cw_sponsor_deeming_applies", 0], ["else", ["sum_receipts", "receipts", ["all", ["=", ["lookup", "cw_receipt_treatment_table", ["receipt", "kind"]], "sponsor_contribution"], ["all", ["received_in", ["month"]], ["any", ["not", ["unknown", ["receipt", "month"]]], ["all", ["any", ["unknown", ["receipt", "start_date"]], ["<=", ["month_of", ["receipt", "start_date"]], ["month"]]], ["any", ["unknown", ["receipt", "end_date"]], [">=", ["month_of", ["receipt", "end_date"]], ["month"]]]]]]], ["receipt", "amount"]]]]
sources: [S3157, S1627, S4911]
implemented: engine
tags: [cash, tanf, income, immigration]
rationale: "Coverage review CW-9(b) (P1): money_received_from_sponsor (CO-3707) is \"not also stated in the person's other unearned income facts\", and Colorado Works never read it, so a sponsor's cash was not counted when deeming does not apply. cw_countable_income (CO-910) and cw_payment_countable_income (CO-923) add it for each member."
tests:
  - {id: CO-4363-T1, month: "2026-10", as_of: "2026-10-15", given: {cw_sponsor_deeming_applies: false, receipts: [{kind: sponsor_payment, amount: 300}, {kind: social_security, amount: 500}]}, title: "Deeming does not apply (the sponsor's income is under 125% of the guideline): $300 from the sponsor is a gift, counted", expect: 300}
  - {id: CO-4363-T2, month: "2026-10", as_of: "2026-10-15", given: {cw_sponsor_deeming_applies: true, receipts: [{kind: sponsor_payment, amount: 300}]}, title: "Deeming applies: the money is part of the deemed income, not counted again", expect: 0}
  - {id: CO-4363-T3, month: "2026-10", as_of: "2026-10-15", given: {cw_sponsor_deeming_applies: false}, title: "Deeming does not apply, receipts not stated: the money from a sponsor cannot be determined (decision 4 of 2026-11-23)", expect: unknown}
  - {id: CO-4363-T4, month: "2026-10", as_of: "2026-10-15", given: {cw_sponsor_deeming_applies: false, receipts: []}, title: "Receipts stated empty: no money from a sponsor, nothing counted", expect: 0}
  - {id: CO-4363-T5, month: "2026-10", as_of: "2026-10-15", given: {cw_sponsor_deeming_applies: true}, title: "Deeming applies, receipts not stated: nothing is counted here whatever was paid, so the receipts are not asked", expect: 0}
  # Field sweep fix round (FS-CW-1): hand-computed from 9 CCR 2503-6 3.605.1.A.2, B (S4911): a stream is received only from the month of its start_date through the month of its end_date.
  - {"id": "CO-4363-T6", "month": "2026-10", "as_of": "2026-10-15", "title": "Deeming does not apply; $300 from the sponsor that ended 2026-09-30: none received in October, 0", "given": {"cw_sponsor_deeming_applies": false, "receipts": [{"kind": "sponsor_payment", "amount": 300, "end_date": "2026-09-30"}]}, "expect": 0}
