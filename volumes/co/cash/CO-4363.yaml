id: CO-4363
name: "Colorado Works: money from a sponsor counted as a gift"
identifier: cw_sponsor_contributions_counted
kind: derived
type: money
scope: person-month
program: ColoradoWorks
meaning: "The money this non-citizen received in the month from a sponsor or a sponsor's spouse living elsewhere (money_received_from_sponsor) that Colorado Works counts as unearned income, a gift (9 CCR 2503-6 3.605.3.A.14): all of it when sponsor deeming does not apply; none when it does, since the sponsor's net income is then deemed to the unit (cw_sponsor_deemed_income, CO-2365) and the money is part of that income."
precision: "money_received_from_sponsor (CO-3707) is not part of the person's other unearned income facts; if not stated, Colorado Works reads it as 0. Kept apart from cw_countable_unearned_income (CO-908) because cw_sponsor_deeming_applies (CO-2364) reads CO-908 for the combined-income test."
derived: [case, [cw_sponsor_deeming_applies, 0], [else, [otherwise, money_received_from_sponsor, 0]]]
sources: [S3157, S1627]
implemented: engine
tags: [cash, tanf, income, immigration]
rationale: "Coverage review CW-9(b) (P1): money_received_from_sponsor (CO-3707) is \"not also stated in the person's other unearned income facts\", and Colorado Works never read it, so a sponsor's cash was not counted when deeming does not apply. cw_countable_income (CO-910) and cw_payment_countable_income (CO-923) add it for each member."
tests:
  - {id: CO-4363-T1, title: "Deeming does not apply (the sponsor's income is under 125% of the guideline): $300 from the sponsor is a gift, counted", as_of: "2026-10-15", month: "2026-10", given: {cw_sponsor_deeming_applies: false, money_received_from_sponsor: 300}, expect: 300}
  - {id: CO-4363-T2, title: "Deeming applies: the money is part of the deemed income, not counted again", as_of: "2026-10-15", month: "2026-10", given: {cw_sponsor_deeming_applies: true, money_received_from_sponsor: 300}, expect: 0}
  - {id: CO-4363-T3, title: "Nothing stated", as_of: "2026-10-15", month: "2026-10", given: {cw_sponsor_deeming_applies: false}, expect: 0}
