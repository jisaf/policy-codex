id: CO-4363
name: "Colorado Works: money from a sponsor counted as a gift"
identifier: cw_sponsor_contributions_counted
kind: derived
type: money
scope: person-month
program: ColoradoWorks
meaning: "The money this non-citizen received in the month from a sponsor or a sponsor's spouse living elsewhere (the receipts Colorado Works' counting table treats as a sponsor's contribution, cw_receipt_treatment_table: sponsor_contribution) that Colorado Works counts as unearned income, a gift (9 CCR 2503-6 3.605.3.A.14): all of it when sponsor deeming does not apply; none when it does, since the sponsor's net income is then deemed to the unit (cw_sponsor_deemed_income, CO-2365) and the money is part of that income."
precision: "Receipt records, migration phase 2 (docs/reviews/receipts-migration-2-cw.md): the money is the month's receipts of the kind sponsor_payment, read as 0 when the receipts are not stated (as before receipt records, when money_received_from_sponsor, CO-3707, was read as 0 when not stated; the default phase 1 kept for SNAP's sponsor money, CO-3701, docs/reviews/receipts-migration-1.md section 4). Kept apart from cw_countable_unearned_income (CO-908) because cw_sponsor_deeming_applies (CO-2364) reads CO-908 for the combined-income test."
derived: [case, [cw_sponsor_deeming_applies, 0], [else, [otherwise, [sum_receipts, receipts, [all, ["=", [lookup, cw_receipt_treatment_table, [receipt, kind]], sponsor_contribution], [received_in, [month]]], [receipt, amount]], 0]]]
sources: [S3157, S1627]
implemented: engine
tags: [cash, tanf, income, immigration]
rationale: "Coverage review CW-9(b) (P1): money_received_from_sponsor (CO-3707) is \"not also stated in the person's other unearned income facts\", and Colorado Works never read it, so a sponsor's cash was not counted when deeming does not apply. cw_countable_income (CO-910) and cw_payment_countable_income (CO-923) add it for each member."
tests:
  - {id: CO-4363-T1, month: "2026-10", as_of: "2026-10-15", given: {cw_sponsor_deeming_applies: false, receipts: [{kind: sponsor_payment, amount: 300}, {kind: social_security, amount: 500}]}, title: "Deeming does not apply (the sponsor's income is under 125% of the guideline): $300 from the sponsor is a gift, counted", expect: 300}
  - {id: CO-4363-T2, month: "2026-10", as_of: "2026-10-15", given: {cw_sponsor_deeming_applies: true, receipts: [{kind: sponsor_payment, amount: 300}]}, title: "Deeming applies: the money is part of the deemed income, not counted again", expect: 0}
  - {id: CO-4363-T3, month: "2026-10", as_of: "2026-10-15", given: {cw_sponsor_deeming_applies: false}, title: "Nothing stated", expect: 0}
