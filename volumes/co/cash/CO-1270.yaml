  - {id: CO-1270-T8, month: "2026-10", as_of: "2026-10-01", given: {cw_eligibility_status: eligible, needs_long_term_cash_assistance: false, has_specific_crisis_need: true, in_diversion_period_of_ineligibility: false, receipts: [{kind: social_security}, {kind: ssi}, {kind: pension}, {kind: unemployment_compensation}, {kind: child_support}, {kind: colorado_works_cash, amount: 400}, {kind: adult_financial_cash}, {kind: tax_exempt_interest}, {kind: other_taxable}, {kind: other_nontaxable}]}, title: "FC-18: no diversion grant in a month the client receives basic cash assistance (3.606.8.A.7)", expect: false}
