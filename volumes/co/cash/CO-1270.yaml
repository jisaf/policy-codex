  - {id: CO-1270-T4, month: "2026-10", as_of: "2026-10-01", given: {cw_eligibility_status: eligible, needs_long_term_cash_assistance: true, has_specific_crisis_need: true, in_diversion_period_of_ineligibility: false}, title: "Needs ongoing basic cash assistance", expect: false}
