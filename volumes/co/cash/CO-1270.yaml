id: CO-1270
name: "Colorado Works: eligible for a diversion payment"
identifier: cw_diversion_eligible
kind: derived
type: yes/no
scope: person-month
program: ColoradoWorks
role: outcome
meaning: Whether the person's assistance unit may receive a Colorado Works diversion payment for the month - it is eligible for basic cash assistance, or fails only the basic cash assistance income test and is within the county's higher diversion income limit; the assessment finds it does not need long-term or basic cash assistance; it demonstrates a specific crisis need under a diversion agreement; and it is not within an earlier diversion's period of ineligibility - per 9 CCR 2503-6 3.601 ("Diversion") and 3.606.8.A.
precision: "The rule has a single diversion program with a county income option (3.606.8.A.6), which relaxes only the income test (phase-8 fix round, S-1): a unit ineligible for any other reason (no dependent child, residency, status, living arrangement, time limit, sanction closure) is not diversion-eligible whatever the county limit; it states no separate state and county diversion programs. A client cannot receive diversion in a month it receives basic cash assistance (A.7); the unit that needs no basic cash assistance does not take it, so the conjunct needs_long_term_cash_assistance = false covers it. The payment amount is needs-based and not modeled; the period of ineligibility cannot exceed the maximum grant for the household size over the same period (A.4), which is the county's computation. Diversion payments do not count toward the time limit (A.6). Final cash review FC-18: 3.606.8.A.7 (no diversion grant in a month of basic cash assistance) is a conjunct, read from the month's basic cash assistance (cw_basic_cash_assistance_receipts, CO-5653; receipt records, migration phase 2: before them, tanf_cash_income), not only through needs_long_term_cash_assistance. Decision 4 of 2026-11-23 (docs/plan-colorado.md: missing information is cannot determine unless the rule says otherwise), applied as for the receipts readers (b49a7f2; earned-income records E1 for the cash programs, docs/reviews/records-earnings-cash.md): 3.606.8.A.7 gives no reading for a payment not reported, so with the receipts not stated whether the unit receives basic cash assistance in the month cannot be determined (a stated empty list is none); before, a payment not stated was read as none."
derived: [all, [any, ["=", cw_eligibility_status, eligible], [all, ["=", cw_eligibility_status, ineligible_income], cw_meets_county_diversion_income_limit]], [not, needs_long_term_cash_assistance], has_specific_crisis_need, [not, in_diversion_period_of_ineligibility], [not, [">", cw_basic_cash_assistance_receipts, 0]]]
sources: [S762, S763]
implemented: engine
tags: [cash, tanf]
open: [OQ-252]
rationale: Phase-8 fix round (S-1) - the county income limit now replaces only the income test, per 3.606.8.A.6's "eligible for basic cash assistance, or, at county option ... a higher income limit". No existing item determines diversion; it is a Colorado Works benefit outcome distinct from the basic cash grant.
