program: AdultFinancial
meaning: Whether the person is married, per 9 CCR 2503-5 3.520.72.A's plain-marriage test (not SSI's living-together test) - read from the existence of a stated spouse relationship edge.
precision: "Reads marital status by the existence of a spouse relationship, regardless of whether the spouse is institutionalized, unlike ma_ssi_household_size's living-together test, because 3.520.72.A's own text splits on 'married'/'unmarried' alone, with no living-together carve-out stated."
