rationale: "No existing item states Adult Financial's own plain-marriage test as a standalone fact; af_countable_resources (CO-947) and af_meets_resource_limit (CO-948) both recomputed the identical [exists_related, [spouse], true] test independently (the phase-5 review's M-6 finding), so a future change to the married test (e.g. resolving CO-947's own precision note on the divergence from CO-608's living-together rule) would have to be made in two places. Factored out here and read by both."
