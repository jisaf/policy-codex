id: CO-4443
name: "Adult Financial: income from donated work hours"
identifier: af_donated_work_income
kind: derived
type: money
scope: person-month
program: AdultFinancial
meaning: "The earned income Adult Financial counts for the person's donated work hours in the month (9 CCR 2503-5 3.520.784.A-B): when the work is regular and scheduled, a necessary service and work someone would have to be hired for, and averages more than af_donated_work_min_weekly_hours a week, the month's donated hours times the greater of the going community rate for similar work and the minimum wage; otherwise nothing."
precision: "The minimum wage is the federal minimum wage (federal_minimum_wage, CO-160), the one minimum wage figure this volume carries; 3.520.784.B.2's \"current minimum wage standard\" may mean Colorado's, which only the Colorado Department of Labor and Employment publishes (OQ-781). The facts are read as 0 or false when not stated, so a person with no donated work has none. Volunteer work for the betterment of the community (3.520.784.C) is not stated as donated work."
derived: [case, [[all, [otherwise, donated_work_meets_paid_work_tests, false], [">", [otherwise, donated_work_hours_per_week, 0], af_donated_work_min_weekly_hours]], ["*", [otherwise, donated_work_hours_in_month, 0], [max, [otherwise, donated_work_community_hourly_rate, 0], federal_minimum_wage]]], [else, 0]]
sources: [S3211, S122]
implemented: engine
open: [OQ-781]
tags: [cash, income]
rationale: "Coverage review F-10: no item counted donated work hours, which 3.520.784.A (S3211) makes countable earned income of the client, spouse or sponsor."
tests:
  - {id: CO-4443-T1, title: "Ten hours a week at a relative's shop, 43 hours in the month, going rate $14: 43 x 14 = 602", as_of: "2026-10-01", month: "2026-10", given: {donated_work_meets_paid_work_tests: true, donated_work_hours_per_week: 10, donated_work_hours_in_month: 43, donated_work_community_hourly_rate: 14}, expect: 602}
  - {id: CO-4443-T2, title: "Going rate below the minimum wage: the minimum wage applies (3.520.784.B)", as_of: "2026-10-01", month: "2026-10", given: {donated_work_meets_paid_work_tests: true, donated_work_hours_per_week: 10, donated_work_hours_in_month: 40, donated_work_community_hourly_rate: 5}, expect: 290}
  - {id: CO-4443-T3, title: "Five hours a week is not greater than five (A.4)", as_of: "2026-10-01", month: "2026-10", given: {donated_work_meets_paid_work_tests: true, donated_work_hours_per_week: 5, donated_work_hours_in_month: 22, donated_work_community_hourly_rate: 14}, expect: 0}
  - {id: CO-4443-T4, title: "No donated work", as_of: "2026-10-01", month: "2026-10", given: {}, expect: 0}
