id: CO-2386
name: "Adult Financial: income deemed from a sponsor"
identifier: af_deemed_sponsor_income
kind: derived
type: money
scope: person-month
program: AdultFinancial
meaning: "The sponsor's income deemed to this non-citizen Adult Financial client as unearned income for the month (9 CCR 2503-5 3.534.D, 3.544.G, 3.549.G): the sponsor's gross earned and unearned income less the SSI benefit standard for an individual for the sponsor, the standard (for a co-sponsor spouse) or half of it (for another spouse in the sponsor's household), and half of it for each of the sponsor's other dependents, never below zero; all of it is deemed to each non-citizen client the sponsor sponsors, without division."
precision: "A citizen or national has no sponsor deemed. is_sponsored_non_citizen (CO-1573) is a binding affidavit of support, which exists only for entries after the August 22, 1996 date 3.520.69 names. The SSI benefit standard of 3.510 is ssi_federal_benefit_rate_individual."
derived: [case, [[all, [not, [in, citizenship_status, [citizen, us_national]]], is_sponsored_non_citizen], [max, 0, ["-", [+, sponsor_gross_earned_income, sponsor_unearned_income], [+, ssi_federal_benefit_rate_individual, [case, [[otherwise, sponsor_spouse_is_cosponsor, false], ssi_federal_benefit_rate_individual], [[otherwise, sponsor_has_spouse_in_household, false], ["/", ssi_federal_benefit_rate_individual, 2]], [else, 0]], ["*", ["/", ssi_federal_benefit_rate_individual, 2], [otherwise, sponsor_dependent_count, 0]]]]]], [else, 0]]
sources: [S1632, S1633, S1634]
implemented: engine
tags: [cash, income, immigration]
rationale: "OQ-114: no item applied the Adult Financial sponsor deeming of 3.534.D (S1632) and its AND-SO and AND-CS repetitions."
tests:
  - {id: CO-2386-T1, title: "Sponsor with $3,000 earned and a non-sponsor wife and two children: 3,000 - 994 - 497 - 994 = 515", as_of: "2026-10-01", month: "2026-10", parameters: {ssi_federal_benefit_rate_individual: 994}, given: {citizenship_status: lawful_permanent_resident, is_sponsored_non_citizen: true, sponsor_gross_earned_income: 3000, sponsor_unearned_income: 0, sponsor_has_spouse_in_household: true, sponsor_dependent_count: 2}, expect: 515}
  - {id: CO-2386-T2, title: "A co-sponsor wife takes the full standard: 3,000 - 994 - 994 = 1,012", as_of: "2026-10-01", month: "2026-10", parameters: {ssi_federal_benefit_rate_individual: 994}, given: {citizenship_status: lawful_permanent_resident, is_sponsored_non_citizen: true, sponsor_gross_earned_income: 3000, sponsor_unearned_income: 0, sponsor_spouse_is_cosponsor: true}, expect: 1012}
  - {id: CO-2386-T3, as_of: "2026-10-01", month: "2026-10", given: {citizenship_status: citizen}, expect: 0}
