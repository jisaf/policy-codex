id: CO-2386
name: "Adult Financial: income deemed from a sponsor"
identifier: af_deemed_sponsor_income
kind: derived
type: money
scope: person-month
program: AdultFinancial
meaning: "The sponsor's income deemed to this non-citizen Adult Financial client as unearned income for the month (9 CCR 2503-5 3.534.D, 3.544.G, 3.549.G): the total gross earned and unearned income of the sponsor(s) less the SSI benefit standard for an individual for the sponsor, the standard (for a co-sponsor spouse) or af_sponsor_dependent_allowance_rate (CO-3051) of it (for another spouse in the sponsor's household), and that share for each of the sponsor's other dependents, never below zero; all of it is deemed to each non-citizen client the sponsor sponsors, without division."
precision: "A citizen or national has no sponsor deemed. is_sponsored_non_citizen (CO-1573) is a binding affidavit of support, which exists only for entries after the August 22, 1996 date 3.520.69 names. The SSI benefit standard of 3.510 is ssi_federal_benefit_rate_individual. The sponsors (sponsors, CO-2713, a co-sponsor spouse included, as \"sponsor(s)\" in D says) are persons of the case and their income is read from their own facts. The sponsor's other dependents are the count stated on the sponsor (sponsor_dependent_count, CO-2387) plus the other non-citizens the same sponsors sponsor, other than the client's spouse, read as the sponsor's dependents (OQ-553)."
derived: [case, [[all, [not, is_us_citizen_or_national], is_sponsored_non_citizen], [max, 0, ["-", [sum, sponsors, ["+", [of, [P], wages_gross], [of, [P], af_self_employment_net_profit], [of, [P], social_security_income], [of, [P], pension_income], [of, [P], unemployment_income], [of, [P], tanf_cash_income], [of, [P], adult_financial_cash_income], [of, [P], child_support_received], [of, [P], other_unearned_income_taxable], [of, [P], other_unearned_income_nontaxable], [of, [P], tax_exempt_interest], [of, [P], ssi_income]]], [+, ssi_federal_benefit_rate_individual, [case, [[otherwise, sponsor_spouse_is_cosponsor, false], ssi_federal_benefit_rate_individual], [[otherwise, sponsor_has_spouse_in_household, false], ["*", ssi_federal_benefit_rate_individual, af_sponsor_dependent_allowance_rate]], [else, 0]], ["*", ["*", ssi_federal_benefit_rate_individual, af_sponsor_dependent_allowance_rate], ["+", [sum, sponsors, [otherwise, [of, [P], sponsor_dependent_count], 0]], ["-", ["-", [count, [filter, [persons], [has_relative_in, [sponsored_by], sponsors]]], 1], [count, [filter, [persons], [all, [has_relative_in, [sponsored_by], sponsors], [rel, [spouse], [P]]]]]]]]]]]], [else, 0]]
sources: [S1632, S1633, S1634]
implemented: engine
tags: [cash, income, immigration]
rationale: "OQ-114: no item applied the Adult Financial sponsor deeming of 3.534.D (S1632) and its AND-SO and AND-CS repetitions.  OQ-44 fix (product-owner decision of 2026-11-21; docs/reviews/audit-dual-entry.md 3.1; same-word audit SW-18): reads the one immigration_status fact (CO-002), which replaced citizenship_status, lawful_presence_status (CO-084), federal_five_year_bar_exempt_category (CO-1724) and ma_five_year_bar_exempt_category (CO-1170). The citizen-or-national test reads is_us_citizen_or_national (CO-1358).  Dual-entry audit 1.5 (audit fix round): the sponsor is a person of the case, joined to the non-citizen by the sponsor / sponsored_by relationship (volume.yaml), and the sponsor's income and resources are read from the sponsor's own facts, so two non-citizens with one sponsor read one set of facts."
tests:
