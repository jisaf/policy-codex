id: CO-2386
name: "Adult Financial: income deemed from a sponsor"
identifier: af_deemed_sponsor_income
kind: derived
type: money
scope: person-month
program: AdultFinancial
meaning: "The sponsor's income deemed to this non-citizen Adult Financial client as unearned income for the month (9 CCR 2503-5 3.534.D, 3.544.G, 3.549.G): the total gross earned and unearned income of the sponsor(s) less the SSI benefit standard for an individual for the sponsor, the standard (for a co-sponsor spouse) or af_sponsor_dependent_allowance_rate (CO-3051) of it (for another spouse in the sponsor's household), and that share for each of the sponsor's dependents, the children the sponsor(s) claim on income tax other than the client and the client's spouse (3.520.68.B.2.b.1, which D.2.C cross-refers to), never below zero; all of it is deemed to each non-citizen client the sponsor sponsors, without division; nothing is deemed once the sponsor's obligation has ended (af_sponsor_deeming_applies, 3.520.69.B-C)."
precision: "A citizen or national has no sponsor deemed. is_sponsored_non_citizen (CO-1573) is a binding affidavit of support, which exists only for entries after the August 22, 1996 date 3.520.69 names. The SSI benefit standard of 3.510 is ssi_federal_benefit_rate_individual. The sponsors (sponsors, CO-2713, a co-sponsor spouse included, as \"sponsor(s)\" in D says) are persons of the case and their income is read from their own facts. The sponsor's dependents are the count stated on the sponsor (sponsor_dependent_count, CO-2387: the children the sponsor claims on income tax other than the persons the sponsor sponsors) plus the other non-citizens of the case the same sponsors sponsor who are a sponsor's tax dependent (tax_dependent edge), other than the client and the client's spouse. OQ-553 resolved (coverage review F-16): the current rule (D-80) cross-refers to 3.520.68.B.2.b.1, which it no longer has; the archived version 10320 (D-300, S3200), the text the cross-reference was written for, defines the sponsor's dependent children as \"the children the sponsor(s) claim on his or her income tax\", so another non-citizen the sponsor sponsors is a dependent only when the sponsor claims that person."
derived: [case, [af_sponsor_deeming_applies, [max, 0, ["-", [sum, sponsors, ["+", [of, [P], wages_gross], [of, [P], af_self_employment_net_profit], [of, [P], social_security_income], [of, [P], pension_income], [of, [P], unemployment_income], [of, [P], tanf_cash_income], [of, [P], adult_financial_cash_income], [of, [P], child_support_received], [of, [P], other_unearned_income_taxable], [of, [P], other_unearned_income_nontaxable], [of, [P], tax_exempt_interest], [of, [P], ssi_income]]], [+, ssi_federal_benefit_rate_individual, [case, [[otherwise, sponsor_spouse_is_cosponsor, false], ssi_federal_benefit_rate_individual], [[otherwise, sponsor_has_spouse_in_household, false], ["*", ssi_federal_benefit_rate_individual, af_sponsor_dependent_allowance_rate]], [else, 0]], ["*", ["*", ssi_federal_benefit_rate_individual, af_sponsor_dependent_allowance_rate], ["+", [sum, sponsors, [otherwise, [of, [P], sponsor_dependent_count], 0]], ["-", [count, [filter, [persons], [all, [has_relative_in, [sponsored_by], sponsors], [otherwise, [has_relative_in, [tax_dependent], sponsors], false], [not, [otherwise, [rel, [spouse], [P]], false]]]]], [case, [[otherwise, [exists_related, [tax_dependent], [in_group, [P], sponsors]], false], 1], [else, 0]]]]]]]]], [else, 0]]
sources: [S1632, S1633, S1634, S3200, S3203]
implemented: engine
tags: [cash, income, immigration]
rationale: "OQ-114: no item applied the Adult Financial sponsor deeming of 3.534.D (S1632) and its AND-SO and AND-CS repetitions.  OQ-44 fix (product-owner decision of 2026-11-21; docs/reviews/audit-dual-entry.md 3.1; same-word audit SW-18): reads the one immigration_status fact (CO-002), which replaced citizenship_status, lawful_presence_status (CO-084), federal_five_year_bar_exempt_category (CO-1724) and ma_five_year_bar_exempt_category (CO-1170). The citizen-or-national test reads is_us_citizen_or_national (CO-1358).  Dual-entry audit 1.5 (audit fix round): the sponsor is a person of the case, joined to the non-citizen by the sponsor / sponsored_by relationship (volume.yaml), and the sponsor's income and resources are read from the sponsor's own facts, so two non-citizens with one sponsor read one set of facts.  Coverage review F-2: deeming stops when the sponsor's obligation has ended or the client was a refugee or asylee (af_sponsor_deeming_applies, CO-4400, S3203). F-16: the dependents are the archived 3.520.68.B.2.b.1's children claimed for tax (S3200), not every other non-citizen the sponsor sponsors."
