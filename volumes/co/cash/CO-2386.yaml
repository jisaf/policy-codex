id: CO-2386
name: "Adult Financial: income deemed from a sponsor"
identifier: af_deemed_sponsor_income
kind: derived
type: money
scope: person-month
program: AdultFinancial
meaning: "The sponsor's income deemed to this non-citizen Adult Financial client as unearned income for the month (9 CCR 2503-5 3.534.D, 3.544.G, 3.549.G): the total gross earned and unearned income of the sponsor(s) less the SSI benefit standard for an individual for the sponsor, the standard (for a co-sponsor spouse) or af_sponsor_dependent_allowance_rate (CO-3051) of it (for another spouse in the sponsor's household), and that share for each of the sponsor's dependents, the children the sponsor(s) claim on income tax other than the client and the client's spouse (3.520.68.B.2.b.1, which D.2.C cross-refers to), never below zero; all of it is deemed to each non-citizen client the sponsor sponsors, without division; nothing is deemed once the sponsor's obligation has ended (af_sponsor_deeming_applies, 3.520.69.B-C)."
precision: "A citizen or national has no sponsor deemed. is_sponsored_non_citizen (CO-1573) is a binding affidavit of support, which exists only for entries after the August 22, 1996 date 3.520.69 names. The SSI benefit standard of 3.510 is ssi_federal_benefit_rate_individual. The sponsor's earned income includes in-kind pay and donated work hours, as for the client (3.520.782.B, 3.520.784; coverage review F-10). The sponsors (sponsors, CO-2713, a co-sponsor spouse included, as \"sponsor(s)\" in D says) are persons of the case and their income is read from their own facts. The sponsor's dependents are the count stated on the sponsor (sponsor_dependent_count, CO-2387: the children the sponsor claims on income tax other than the persons the sponsor sponsors) plus the other non-citizens of the case the same sponsors sponsor who are a sponsor's tax dependent (tax_dependent edge), other than the client and the client's spouse. OQ-553 resolved (coverage review F-16): the current rule (D-80) cross-refers to 3.520.68.B.2.b.1, which it no longer has; the archived version 10320 (D-300, S3200), the text the cross-reference was written for, defines the sponsor's dependent children as \"the children the sponsor(s) claim on his or her income tax\", so another non-citizen the sponsor sponsors is a dependent only when the sponsor claims that person. Coverage pass 6 CA6-7 (docs/reviews/coverage6-cash.md): the sponsor's dependents, spouse in the household and co-sponsoring spouse (3.534.D.2) are required where read (decision 4 of 2026-11-23); before, read as 0, false and false when not stated. Pattern sweep (cash) PS-M2 and PS-M3 (docs/reviews/pattern-sweep-cash.md): the sponsors deemed are those living on the month's first day (af_sponsors_in_month, CO-7604; 3.520.69.B.5: the death of one sponsor does not end a joint sponsor's obligation), and a client to whom deeming applies whose sponsor is not a person of the case cannot be determined, the sponsor's income not being stated (decision 4; the volume's sponsor role is declared as a person of the case whether or not the sponsor lives in the home); before, a sponsor outside the case deemed nothing and a deceased sponsor's income went on being deemed. Pattern sweep (cash) PS-D11 (docs/reviews/pattern-sweep-cash.md): the sponsor's tax dependents and the client's spouse among them are read from the relationships stated, with no default (decision 4); before, unstated relationships were read as none."
