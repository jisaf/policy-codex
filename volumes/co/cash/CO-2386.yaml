rationale: "OQ-114: no item applied the Adult Financial sponsor deeming of 3.534.D (S1632) and its AND-SO and AND-CS repetitions.  OQ-44 fix (product-owner decision of 2026-11-21; docs/reviews/audit-dual-entry.md 3.1; same-word audit SW-18): reads the one immigration_status fact (CO-002), which replaced citizenship_status, lawful_presence_status (CO-084), federal_five_year_bar_exempt_category (CO-1724) and ma_five_year_bar_exempt_category (CO-1170). The citizen-or-national test reads is_us_citizen_or_national (CO-1358).  Dual-entry audit 1.5 (audit fix round): the sponsor is a person of the case, joined to the non-citizen by the sponsor / sponsored_by relationship (volume.yaml), and the sponsor's income and resources are read from the sponsor's own facts, so two non-citizens with one sponsor read one set of facts.  Coverage review F-2: deeming stops when the sponsor's obligation has ended or the client was a refugee or asylee (af_sponsor_deeming_applies, CO-4400, S3203). F-16: the dependents are the archived 3.520.68.B.2.b.1's children claimed for tax (S3200), not every other non-citizen the sponsor sponsors."
