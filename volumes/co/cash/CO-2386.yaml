  - {id: CO-2386-T2, title: "A co-sponsor wife with no income takes the full standard: 3,000 - 994 - 994 = 1,012", as_of: "2026-10-01", month: "2026-10", given: {immigration_status: lawful_permanent_resident, is_sponsored_non_citizen: true}, others: {p2: {wages_gross: 3000, af_self_employment_net_profit: 0, social_security_income: 0, pension_income: 0, unemployment_income: 0, tanf_cash_income: 0, adult_financial_cash_income: 0, child_support_received: 0, other_unearned_income_taxable: 0, other_unearned_income_nontaxable: 0, tax_exempt_interest: 0, ssi_income: 0}, p3: {wages_gross: 0, af_self_employment_net_profit: 0, social_security_income: 0, pension_income: 0, unemployment_income: 0, tanf_cash_income: 0, adult_financial_cash_income: 0, child_support_received: 0, other_unearned_income_taxable: 0, other_unearned_income_nontaxable: 0, tax_exempt_interest: 0, ssi_income: 0}}, relationships: [[sponsored_by, p1, p2], [sponsored_by, p1, p3], [spouse, p2, p3]], expect: 1012}
  - {id: CO-2386-T3, as_of: "2026-10-01", month: "2026-10", given: {immigration_status: us_citizen}, expect: 0}
  - {id: CO-2386-T4, title: "Two siblings sponsored by one unmarried sponsor with $3,000: the other sibling is a dependent, 3,000 - 994 - 497 = 1,509 (OQ-553)", as_of: "2026-10-01", month: "2026-10", given: {immigration_status: lawful_permanent_resident, is_sponsored_non_citizen: true}, others: {p2: {wages_gross: 3000, af_self_employment_net_profit: 0, social_security_income: 0, pension_income: 0, unemployment_income: 0, tanf_cash_income: 0, adult_financial_cash_income: 0, child_support_received: 0, other_unearned_income_taxable: 0, other_unearned_income_nontaxable: 0, tax_exempt_interest: 0, ssi_income: 0}, p3: {}}, relationships: [[sponsored_by, p1, p2], [sponsored_by, p3, p2]], expect: 1509}
