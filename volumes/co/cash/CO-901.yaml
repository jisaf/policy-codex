id: CO-901
name: "Colorado Works: is a dependent child"
identifier: cw_is_dependent_child
kind: derived
type: yes/no
scope: person
program: ColoradoWorks
meaning: "The person is a \"dependent child\" under 26-2-703(9), C.R.S. and 9 CCR 2503-6 3.601 in some month the determination covers (cw_determination_months, CO-7300) - under 18, or cw_dependent_child_age_limit and a full-time secondary (or vocational/technical equivalent) student reasonably expected to complete before turning 19 (cw_is_dependent_child_in_month): the months from the month of the application (cw_application_date) through the determination month, or the determination month alone at a redetermination or when no application date is stated. The month-scoped tests read cw_is_dependent_child_in_month for their own month."
precision: "Reads is_full_time_secondary_student_finishing_before_nineteen (CO-1720) for the 18-year-old prong (vocabulary fix round R-2; it had read half-time secondary enrollment), which includes vocational or technical training and high school equivalency as 3.601 states. Coverage pass 4 CA4-15 (docs/reviews/coverage4-cash.md): the age is taken in each month the determination covers (cw_is_dependent_child_in_month), so a child who turns 18 between the application and the determination is a dependent child for the application month (probe W5: born 2008-10-05, application 2026-09-25, determined 2026-10-15: eligible from September 25, .19726 x 488 = $96); before, the determination date's age was read in every month (OQ-951). The unit's composition is one per case, so a child dependent in any of those months is a member, and the eligibility test asks whether the unit has a dependent child in the month (cw_eligibility_status, CO-921). Coverage pass 6 CA6-2: the months are cw_determination_months (CO-7300), which reads the kind of determination with no default when an application date is stated."
derived: [">", ["sum_months", "cw_determination_months", ["case", [["at", "cw_is_dependent_child_in_month", ["that_month"]], 1], ["else", 0]]], 0]
sources: [S401, S406]
open: [OQ-951]
implemented: engine
tags: [cash, tanf, household, age]
rationale: No existing item in this volume states the Colorado Works dependent-child test; cw_assistance_unit_members (CO-900), cw_has_dependent_child (CO-902), and cw_child_only_unit (CO-921) all read it.
tests:
  - {id: CO-901-T1, as_of: "2026-10-01", given: {date_of_birth: "2009-04-08", is_full_time_secondary_student_finishing_before_nineteen: true}, expect: true}
  - {id: CO-901-T2, as_of: "2026-10-01", given: {date_of_birth: "2008-01-01", is_full_time_secondary_student_finishing_before_nineteen: false}, expect: false}
  - {id: CO-901-T3, as_of: "2026-10-01", given: {date_of_birth: "2008-01-01", is_full_time_secondary_student_finishing_before_nineteen: true}, expect: true}
  - {id: CO-901-T4, as_of: "2026-10-01", given: {date_of_birth: "1990-01-01", is_full_time_secondary_student_finishing_before_nineteen: false}, expect: false}
  # Coverage pass 6 CA6-2: the months the determination covers are cw_determination_months (CO-7300).
  - {id: "CO-901-T5", title: "Coverage pass 6 CA6-2: an application date stated, the kind of determination not: cannot determine", as_of: "2026-10-15", given: {cw_application_date: "2026-09-10", date_of_birth: "2008-09-20", is_full_time_secondary_student_finishing_before_nineteen: false}, expect: unknown}
  - {id: "CO-901-T6", title: "Probe W3: an application of September 10: 17 on September 1, a dependent child in some month", as_of: "2026-10-15", given: {cw_application_date: "2026-09-10", cw_determination_is_redetermination: false, date_of_birth: "2008-09-20", is_full_time_secondary_student_finishing_before_nineteen: false}, expect: true}
