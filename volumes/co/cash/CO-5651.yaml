id: CO-5651
name: "Colorado Works: a person's counted unearned receipts"
identifier: cw_counted_unearned_receipts
kind: derived
type: money
scope: person-month
program: ColoradoWorks
meaning: "The person's receipts of the month that Colorado Works' counting table counts (cw_receipt_treatment_table: counted, or counted because no rule excludes it), a receipt paid once in the month received, each less the parts of it the rule leaves out: income set aside under a plan for self-support (9 CCR 2503-6 3.605.4.B.15), the medical, legal and related expenses included in a workers' compensation award (3.605.3.B.4), VA Aid and Attendance used for medical supplies or medical or attendant care no insurance covers, for a person who lives in the person's own home (3.605.4.A.6; lives_in_own_home, CO-5940), the part of insurance or injury proceeds spent or to be spent on the last illness and burial or medical care (3.605.3.A.5-6, spent_on_covered_costs) and the part of a lump sum designated or legally obligated for legal fees of obtaining it, medical bills, funeral and burial or income taxes (3.605.4.B.33, designated_for_lump_sum_costs); and the benefits conditional on school attendance to the extent they exceed the expenses of attendance (3.605.3.A.4, cw_school_attendance_benefits_counted). Child support (3.605.5) and money from a sponsor (A.11, A.14) are counted by their own items. The one figure the eligibility test (cw_countable_unearned_income, CO-908), the grant (cw_payment_countable_unearned_income, CO-2554) and the income to verify (cw_has_countable_unearned_income, CO-2871) read, for a member of the unit and for every person whose income is deemed to it."
precision: "Receipt records, migration phase 2 (docs/reviews/receipts-migration-2-cw.md): replaces the sum of the scalar unearned income facts less cw_excluded_unearned_income (CO-2341). A receipt is counted in each month it is stated for, or in every month when it states no month (P57); one paid once states its month or date, and a counted one-time receipt that states neither cannot determine. An amount withheld by garnishment or recoupment stays counted (3.605.3.A.12), so the recouped field is not read. Receipt records, migration phase 3: the parts the scalar facts stated of a counted receipt are now kinds of their own (board-only and room-only payments, treated as earned income; savings account distributions, an SMIB refund and insurance cash value, excluded; an adoption subsidy, excluded under 3.605.4.B.32; a military allotment, counted) or fields of it (spent_on_covered_costs and designated_for_lump_sum_costs, left out here, which cw_unearned_income_deductions took off as lump_sum_amounts_spent_or_designated before); only an allotment for persons outside the home is still taken off by cw_unearned_income_deductions (CO-4369), since it turns on the person and a count of other persons. VA Aid and Attendance (2026-11-23 follow-up): 3.605.4.A.6 (S2605) exempts the part \"used for medical supplies and medical or attendant care not covered by Medicare or Medicaid, or other health insurance programs\" as income \"to determine eligibility for public assistance in the applicant's or recipient's own home\", so the receipts' used_for_uncovered_medical_care is left out only when lives_in_own_home (CO-5940) is true; for a person who does not live in the person's own home (a care facility, another household's home as a guest, a shelter) the whole receipt is counted, A.6 giving no exemption there. Since a person fact cannot be read inside a receipt sum (docs/operators.md, P55), the part is summed over the same counted receipts and subtracted outside it; lives_in_own_home is asked only when that sum is more than 0, and when it is not stated the figure cannot be determined. Before, the part was left out in every setting. Whether a person living as a member of a relative's household, or as a guest in another's home, is in \"own home\" is OQ-1051."
derived: ["+", ["-", [sum_receipts, receipts, [all, [in, [lookup, cw_receipt_treatment_table, [receipt, kind]], [counted, counted_no_rule_excludes]], [received_in, [month]]], ["-", [receipt, amount], ["+", [receipt, pass_set_aside], [receipt, claim_expense], [receipt, spent_on_covered_costs], [receipt, designated_for_lump_sum_costs]]]], [case, [["<=", [sum_receipts, receipts, [all, [in, [lookup, cw_receipt_treatment_table, [receipt, kind]], [counted, counted_no_rule_excludes]], [received_in, [month]]], [receipt, used_for_uncovered_medical_care]], 0], 0], [lives_in_own_home, [sum_receipts, receipts, [all, [in, [lookup, cw_receipt_treatment_table, [receipt, kind]], [counted, counted_no_rule_excludes]], [received_in, [month]]], [receipt, used_for_uncovered_medical_care]]], [else, 0]]], cw_school_attendance_benefits_counted]
sources: [S3157, S4000, S4001, S3158, S2605, S2606, S1621]
implemented: engine
open: [OQ-1051]
tags: [cash, tanf, income]
rationale: "Receipt records, migration phase 2 (product-owner decision of 2026-11-23): Colorado Works' unearned income read from the receipts through its counting table (cw_receipt_treatment_table, CO-5650), with the earmarks of each receipt, instead of gross facts with their exempt parts subtracted again."
tests:
  - {id: CO-5651-T1, month: "2026-10", as_of: "2026-10-15", given: {receipts: [{kind: social_security, amount: 600}, {kind: ssi, amount: 300}, {kind: general_assistance, amount: 200}, {kind: loan, amount: 500}]}, title: "Social Security counted (3.605.3.A.20); SSI (3.605.4.B.27), county General Assistance (A.7) and a bona fide loan (B.1) are not", expect: 600}
  - {id: CO-5651-T2, month: "2026-10", as_of: "2026-10-15", given: {lives_in_own_home: true, receipts: [{kind: social_security, amount: 900, pass_set_aside: 100}, {kind: va_aid_and_attendance, amount: 400, used_for_uncovered_medical_care: 150}, {kind: workers_compensation, amount: 2000, claim_expense: 600}]}, title: "A PASS set-aside (B.15), VA Aid and Attendance used for uncovered care by a veteran in his own home (A.6) and a workers' compensation award's claim expenses (3.605.3.B.4) left out: 800 + 250 + 1,400", expect: 2450}
  - {id: CO-5651-T3, month: "2026-10", as_of: "2026-10-15", given: {receipts: [{kind: other_nontaxable, amount: 5000, frequency: once, month: "2026-10"}, {kind: other_nontaxable, amount: 3000, frequency: once, month: "2026-09"}, {kind: pension, amount: 600}]}, title: "An inheritance is counted in the month received (3.605.3.A.13), not in another month", expect: 5600}
  - {id: CO-5651-T4, month: "2026-10", as_of: "2026-10-15", given: {receipts: [{kind: colorado_works_cash, amount: 488}, {kind: child_support, amount: 300}, {kind: sponsor_payment, amount: 200}, {kind: ssi, amount: 1200, frequency: once, retroactive: true, month: "2026-10"}]}, title: "The unit's own grant is not its income; child support and sponsor money are counted by their own items; a retroactive SSI award is SSI (B.27)", expect: 0}
  - {id: CO-5651-T5, month: "2026-10", as_of: "2026-10-15", given: {receipts: [{kind: gambling_winnings, amount: 2000, frequency: once}]}, title: "A prize paid once with neither month nor date cannot be placed in a month: cannot determine", expect: unknown}
  - {id: CO-5651-T6, month: "2026-10", as_of: "2026-10-15", given: {}, title: "Receipts not stated: cannot determine", expect: unknown}
  - {id: CO-5651-T7, month: "2026-10", as_of: "2026-10-15", given: {receipts: []}, title: "A stated empty list: no unearned income", expect: 0}
  - {id: CO-5651-T8, month: "2026-10", as_of: "2026-10-15", given: {receipts: [{kind: other_nontaxable, amount: 5000, frequency: once, month: "2026-10", spent_on_covered_costs: 3200}, {kind: other_nontaxable, amount: 2000, frequency: once, month: "2026-10", designated_for_lump_sum_costs: 500}]}, title: "Receipts migration 3: a $5,000 life insurance payout with $3,200 spent on the last illness and burial (3.605.3.A.5) and a $2,000 inheritance with $500 legally obligated for the income taxes on it (3.605.4.B.33): 1,800 + 1,500 = 3,300", expect: 3300}
  - {id: CO-5651-T9, month: "2026-10", as_of: "2026-10-15", given: {receipts: [{kind: adoption_subsidy, amount: 600}, {kind: savings_account_distribution, amount: 300}, {kind: medicare_premium_refund, amount: 120}, {kind: insurance_cash_value, amount: 500}, {kind: board_only_payment, amount: 450}, {kind: room_only_payment, amount: 400}, {kind: military_allotment, amount: 200}, {kind: early_childhood_research_payment, amount: 50}]}, title: "Receipts migration 3: the kinds that were parts of other receipts. Excluded: the adoption subsidy (3.605.4.B.32), the distribution (B.21), the SMIB refund (3.605.3.B.9), the cash value (B.30); earned income, not unearned: board-only and room-only payments (3.605.2.E.4.c-d). Counted: the allotment (3.605.3.B.10) and the research payment (no rule excludes it): 250", expect: 250}
  # 3.605.4.A.6: the part used for uncovered care is exempt only for a person in the person's own home (lives_in_own_home, CO-5940).
  - {id: CO-5651-T10, month: "2026-10", as_of: "2026-10-15", given: {lives_in_own_home: true, receipts: [{kind: va_aid_and_attendance, amount: 400, used_for_uncovered_medical_care: 150}, {kind: social_security, amount: 700}]}, title: "A veteran at home: $400 Aid and Attendance, $150 of it paid for attendant care no insurance covers, beside $700 Social Security: 700 + (400 - 150) = 950", expect: 950}
  - {id: CO-5651-T11, month: "2026-10", as_of: "2026-10-15", given: {lives_in_own_home: false, receipts: [{kind: va_aid_and_attendance, amount: 400, used_for_uncovered_medical_care: 150}, {kind: social_security, amount: 700}]}, title: "The same veteran in an assisted living residence, not his own home: A.6 exempts nothing, 700 + 400 = 1,100", expect: 1100}
  - {id: CO-5651-T12, month: "2026-10", as_of: "2026-10-15", given: {receipts: [{kind: va_aid_and_attendance, amount: 400, used_for_uncovered_medical_care: 150}, {kind: social_security, amount: 700}]}, title: "Part used for uncovered care, whether the person lives in his own home not stated: cannot determine", expect: unknown}
  - {id: CO-5651-T13, month: "2026-10", as_of: "2026-10-15", given: {receipts: [{kind: va_aid_and_attendance, amount: 400}, {kind: social_security, amount: 700}]}, title: "No part used for uncovered care: the home is not asked, 700 + 400 = 1,100", expect: 1100}
