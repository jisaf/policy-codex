id: CO-5651
name: "Colorado Works: a person's counted unearned receipts"
identifier: cw_counted_unearned_receipts
kind: derived
type: money
scope: person-month
program: ColoradoWorks
meaning: "The person's receipts of the month that Colorado Works' counting table counts (cw_receipt_treatment_table: counted, or counted because no rule excludes it), a receipt paid once in the month received, each less the parts of it the rule leaves out: income set aside under a plan for self-support (9 CCR 2503-6 3.605.4.B.15), the medical, legal and related expenses included in a workers' compensation award (3.605.3.B.4) and VA Aid and Attendance used for medical supplies or care no insurance covers (3.605.4.A.6); and the benefits conditional on school attendance to the extent they exceed the expenses of attendance (3.605.3.A.4, cw_school_attendance_benefits_counted). Child support (3.605.5) and money from a sponsor (A.11, A.14) are counted by their own items. The one figure the eligibility test (cw_countable_unearned_income, CO-908), the grant (cw_payment_countable_unearned_income, CO-2554) and the income to verify (cw_has_countable_unearned_income, CO-2871) read, for a member of the unit and for every person whose income is deemed to it."
precision: "Receipt records, migration phase 2 (docs/reviews/receipts-migration-2-cw.md): replaces the sum of the scalar unearned income facts less cw_excluded_unearned_income (CO-2341). A receipt is counted in each month it is stated for, or in every month when it states no month (P57); one paid once states its month or date, and a counted one-time receipt that states neither cannot determine. An amount withheld by garnishment or recoupment stays counted (3.605.3.A.12), so the recouped field is not read. The parts the scalar facts stated as parts of a counted receipt and no kind restates yet (board-only and room-only payments, savings account distributions, an SMIB refund, insurance cash value, an allotment for persons outside the home) are taken off by cw_unearned_income_deductions (CO-4369)."
derived: ["+", [sum_receipts, receipts, [all, [in, [lookup, cw_receipt_treatment_table, [receipt, kind]], [counted, counted_no_rule_excludes]], [received_in, [month]]], ["-", [receipt, amount], ["+", [receipt, pass_set_aside], [receipt, claim_expense], [receipt, used_for_uncovered_medical_care]]]], cw_school_attendance_benefits_counted]
sources: [S3157, S4000, S4001, S3158, S2605, S2606, S1621]
implemented: engine
tags: [cash, tanf, income]
rationale: "Receipt records, migration phase 2 (product-owner decision of 2026-11-23): Colorado Works' unearned income read from the receipts through its counting table (cw_receipt_treatment_table, CO-5650), with the earmarks of each receipt, instead of gross facts with their exempt parts subtracted again."
tests:
  - {id: CO-5651-T1, month: "2026-10", as_of: "2026-10-15", given: {receipts: [{kind: social_security, amount: 600}, {kind: ssi, amount: 300}, {kind: general_assistance, amount: 200}, {kind: loan, amount: 500}]}, title: "Social Security counted (3.605.3.A.20); SSI (3.605.4.B.27), county General Assistance (A.7) and a bona fide loan (B.1) are not", expect: 600}
  - {id: CO-5651-T2, month: "2026-10", as_of: "2026-10-15", given: {receipts: [{kind: social_security, amount: 900, pass_set_aside: 100}, {kind: va_aid_and_attendance, amount: 400, used_for_uncovered_medical_care: 150}, {kind: workers_compensation, amount: 2000, claim_expense: 600}]}, title: "A PASS set-aside (B.15), VA Aid and Attendance used for uncovered care (A.6) and a workers' compensation award's claim expenses (3.605.3.B.4) left out: 800 + 250 + 1,400", expect: 2450}
  - {id: CO-5651-T3, month: "2026-10", as_of: "2026-10-15", given: {receipts: [{kind: other_nontaxable, amount: 5000, frequency: once, month: "2026-10"}, {kind: other_nontaxable, amount: 3000, frequency: once, month: "2026-09"}, {kind: pension, amount: 600}]}, title: "An inheritance is counted in the month received (3.605.3.A.13), not in another month", expect: 5600}
  - {id: CO-5651-T4, month: "2026-10", as_of: "2026-10-15", given: {receipts: [{kind: colorado_works_cash, amount: 488}, {kind: child_support, amount: 300}, {kind: sponsor_payment, amount: 200}, {kind: ssi, amount: 1200, frequency: once, retroactive: true, month: "2026-10"}]}, title: "The unit's own grant is not its income; child support and sponsor money are counted by their own items; a retroactive SSI award is SSI (B.27)", expect: 0}
  - {id: CO-5651-T5, month: "2026-10", as_of: "2026-10-15", given: {receipts: [{kind: gambling_winnings, amount: 2000, frequency: once}]}, title: "A prize paid once with neither month nor date cannot be placed in a month: cannot determine", expect: unknown}
  - {id: CO-5651-T6, month: "2026-10", as_of: "2026-10-15", given: {}, title: "Receipts not stated: cannot determine", expect: unknown}
  - {id: CO-5651-T7, month: "2026-10", as_of: "2026-10-15", given: {receipts: []}, title: "A stated empty list: no unearned income", expect: 0}
