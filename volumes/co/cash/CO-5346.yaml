id: CO-5346
name: "Adult Financial: countable home equity"
identifier: af_countable_home_equity
kind: derived
type: money
scope: person-month
program: AdultFinancial
meaning: "The equity of a home Adult Financial no longer exempts (9 CCR 2503-5 3.520.77.C): nothing for an OAP-C client during the commitment (C.4, receives_oap_c); otherwise each home record (row excluded_home_rules) that is not the person's principal place of residence (lives_in) and that the person does not intend to return to (intends_to_return; C.2, C.3), at its value less what is owed on it, times the person's share (C.5: \"If a client's home can no longer be excluded due to a change in his or her principal place of residence, the equity value of the property shall count as a resource\"). A home the person left to live in a long-term care facility (residence_setting_type a nursing facility, assisted living residence, intermediate care facility, group home, host home or other long-term care facility) stays exempt only when the intent to return is documented in writing (C.3.a; intent_in_writing); a home left for long-term medical care elsewhere needs the intent alone (C.2)."
precision: "Resource records, step H1 Adult Financial (docs/reviews/records-holdings-snap-af.md): the home's own record says whether the person lives in it, in place of the person's residence setting (residence_setting_type), so a client living in a rented apartment who still owns a home she left without intent to return has its equity counted (C.5), where before only a client in a facility did. Whether the person lives in the home, and if not whether she intends to return, are required where read (decision 4); before step H1 an intent not stated was read as an intent to return (coverage review P2-5). Coverage pass 4 CA4-13 (docs/reviews/coverage4-cash.md): a figure of the month evaluated, from the holdings valued in that month (3.510 \"Resources\", S4791: \"held as of the first day of a calendar month or as of the date of application\"), so an application month before the determination month is judged by its own holdings; before, every month read the determination month's. Field sweep fix round (FS-AF-4): C.3 (S3218): \"When a client requires care in a long-term care facility, the home continues to be exempt so long as there is intent for the client to return to the home. a. ... Such intent is documented by the following: 1) A written statement from the client ...; or, 2) A written statement from the client's spouse, legal fiduciary, doctor, or authorized representative\". C.2 (long-term medical care outside the county) asks the intent only. Before, the intent was read alone in every setting, so a home left for a nursing facility with an unwritten intent stayed exempt. The setting is the person's residence_setting_type (the facilities 3.532.D.1-2 list as long-term care, the hospital left out), read only when a home the person intends to return to has no written statement. intent_in_writing defaults to false, the rule's: C.3.a requires the statement, so an intent not shown in writing is not documented."
derived: ["case", [["otherwise", "receives_oap_c", false], 0], ["else", ["+", ["sum_receipts", "holdings", ["all", ["all", ["received_in", ["month"]], ["unknown", ["receipt", "disposed_date"]]], ["=", ["lookup", "af_holding_treatment_table", ["receipt", "kind"]], "excluded_home_rules"], ["not", ["receipt", "lives_in"]], ["not", ["receipt", "intends_to_return"]]], ["*", ["max", 0, ["-", ["receipt", "value"], ["receipt", "amount_owed"]]], ["otherwise", ["receipt", "share"], 1]]], ["case", [["=", ["sum_receipts", "holdings", ["all", ["all", ["received_in", ["month"]], ["unknown", ["receipt", "disposed_date"]]], ["=", ["lookup", "af_holding_treatment_table", ["receipt", "kind"]], "excluded_home_rules"], ["not", ["receipt", "lives_in"]], ["receipt", "intends_to_return"], ["not", ["receipt", "intent_in_writing"]]], 1], 0], 0], [["in", "residence_setting_type", ["nursing_facility", "assisted_living_residence", "icf_iid", "group_home", "host_home", "other_long_term_care_facility"]], ["sum_receipts", "holdings", ["all", ["all", ["received_in", ["month"]], ["unknown", ["receipt", "disposed_date"]]], ["=", ["lookup", "af_holding_treatment_table", ["receipt", "kind"]], "excluded_home_rules"], ["not", ["receipt", "lives_in"]], ["receipt", "intends_to_return"], ["not", ["receipt", "intent_in_writing"]]], ["*", ["max", 0, ["-", ["receipt", "value"], ["receipt", "amount_owed"]]], ["otherwise", ["receipt", "share"], 1]]]], ["else", 0]]]]]
sources: [S3218, S4791]
implemented: engine
tags: [cash, resources]
rationale: "Resource records, step H1 Adult Financial (docs/reviews/records-holdings-snap-af.md): Adult Financial reads the person's resources from the holdings records (holdings, CO-5300) through its counting table (af_holding_treatment_table, CO-5302), for the client, the spouse and each sponsor alike (3.520.72.A, E), never from the scalar resource facts. The home part of af_person_countable_resources_other_than_life_insurance (CO-4000)."
