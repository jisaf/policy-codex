id: CO-5346
name: "Adult Financial: countable home equity"
identifier: af_countable_home_equity
kind: derived
type: money
scope: person
program: AdultFinancial
meaning: "The equity of a home Adult Financial no longer exempts (9 CCR 2503-5 3.520.77.C): nothing for an OAP-C client during the commitment (C.4, receives_oap_c); otherwise each home record (row excluded_home_rules) that is not the person's principal place of residence (lives_in) and that the person does not intend to return to (intends_to_return; C.2, C.3), at its value less what is owed on it, times the person's share (C.5: \"If a client's home can no longer be excluded due to a change in his or her principal place of residence, the equity value of the property shall count as a resource\")."
precision: "Resource records, step H1 Adult Financial (docs/reviews/records-holdings-snap-af.md): the home's own record says whether the person lives in it, in place of the person's residence setting (residence_setting_type), so a client living in a rented apartment who still owns a home she left without intent to return has its equity counted (C.5), where before only a client in a facility did. Whether the person lives in the home, and if not whether she intends to return, are required where read (decision 4); before step H1 an intent not stated was read as an intent to return (coverage review P2-5)."
derived: ["case", [["otherwise", "receives_oap_c", false], 0], ["else", ["sum_receipts", "holdings", ["all", ["all", ["received_in", ["det_month"]], ["unknown", ["receipt", "disposed_date"]]], ["=", ["lookup", "af_holding_treatment_table", ["receipt", "kind"]], "excluded_home_rules"], ["not", ["receipt", "lives_in"]], ["not", ["receipt", "intends_to_return"]]], ["*", ["max", 0, ["-", ["receipt", "value"], ["receipt", "amount_owed"]]], ["otherwise", ["receipt", "share"], 1]]]]]
sources: [S3218]
implemented: engine
tags: [cash, resources]
rationale: "Resource records, step H1 Adult Financial (docs/reviews/records-holdings-snap-af.md): Adult Financial reads the person's resources from the holdings records (holdings, CO-5300) through its counting table (af_holding_treatment_table, CO-5302), for the client, the spouse and each sponsor alike (3.520.72.A, E), never from the scalar resource facts. The home part of af_person_countable_resources_other_than_life_insurance (CO-4000)."
tests:
  # Hand-computed from 9 CCR 2503-5 3.520.77.C (S3218).
  - {id: CO-5346-T1, title: "P2-5: in a nursing facility, no intent to return; the home's equity is $60,000: 60,000 (C.5)", as_of: "2026-10-01", given: {holdings: [{kind: home, value: 60000, amount_owed: 0, lives_in: false, intends_to_return: false}]}, expect: 60000}
  - {id: CO-5346-T2, title: "In a facility with a written intent to return: exempt, 0 (C.3)", as_of: "2026-10-01", given: {holdings: [{kind: home, value: 60000, amount_owed: 0, lives_in: false, intends_to_return: true, intent_in_writing: true}]}, expect: 0}
  - {id: CO-5346-T3, title: "Living in it: exempt regardless of value, 0 (C.1)", as_of: "2026-10-01", given: {holdings: [{kind: home, value: 250000, amount_owed: 40000, lives_in: true}]}, expect: 0}
  - {id: CO-5346-T4, title: "G-8 (1): an OAP-C client, home not lived in and no intent to return: exempt during the commitment, 0 (C.4)", as_of: "2026-10-01", given: {adult_financial_program_received: oap_c, holdings: [{kind: home, value: 60000, amount_owed: 0, lives_in: false, intends_to_return: false}]}, expect: 0}
  - {id: CO-5346-T5, title: "Decision 4: a home that does not say whether the person lives in it - cannot determine", as_of: "2026-10-01", given: {holdings: [{kind: home, value: 60000, amount_owed: 0}]}, expect: unknown}
