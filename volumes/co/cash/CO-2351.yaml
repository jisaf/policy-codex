id: CO-2351
name: "Colorado Works: assistance unit members counted for size"
identifier: cw_assistance_unit_members_for_size
kind: derived
type: group of persons
scope: person-month
program: ColoradoWorks
meaning: "The members of this person's assistance unit in the month (cw_assistance_unit_members_in_month, CO-7304) counted for its size: every member except one who is disqualified from or ineligible for basic cash assistance (cw_is_disqualified_member), whom 9 CCR 2503-6 3.604.2.M removes \"from the assistance unit for the purposes of determining the assistance unit size\", one who is an institution patient for tuberculosis or mental disease or an inmate (cw_is_institution_patient_or_inmate, CO-3802), whom 3.604.1.D-E bar as a client, one who has been temporarily out of State for more than ninety consecutive days (3.604.2.O.1), and one who has not provided a verification of citizenship, qualified non-citizen status, lawful presence, identity or SSN within the thirty days of 3.604.3.K (cw_is_excluded_for_unprovided_status_verification, CO-4372), who \"will not receive payment for themselves\"."
precision: "Final cash review FC-1: a member barred by 3.604.1.D-E while still in the home under the absence rules is not paid for; the member's income still counts as a member's (OQ-660). Final cash review 2, P2-7: a member temporarily out of State for more than cw_temporary_out_of_state_max_days consecutive days (3.604.2.O.1; the same test as cw_meets_residency, CO-904) is an ineligible member and is removed from the size as M requires; a member with no out-of-State date stated stays in it. Coverage review CW-12: cw_verification_status (CO-1427) reported members_excluded once status or SSN verification was past the thirty days, but the size still counted those members; they are now left out, and their income still counts as a member's, as 3.604.3.K's last paragraph (S1064) says. Time audit T-6: \"N consecutive days\" is counted as the days elapsed since the day the absence or stay began (days_between), the day of departure or entry itself not counted (OQ-953): \"shall not exceed ninety (90) consecutive days\" (3.604.2.O, S2602), as cw_meets_residency (CO-904) reads it: out of the unit's size once the days elapsed since the day of departure are more than cw_temporary_out_of_state_max_days. Coverage pass 6 CA6-4, CA6-5 (docs/reviews/coverage6-cash.md, probes W3, W7): per month, from the month's members, so a child who is no dependent child of the month, one not yet born and one who died before the month are not counted (the size was one per case, from a dependent child in some month)."
derived: ["filter", "cw_assistance_unit_members_in_month", ["not", ["any", ["of", ["P"], "cw_is_disqualified_member"], ["of", ["P"], "cw_is_institution_patient_or_inmate"], ["of", ["P"], "cw_is_excluded_for_unprovided_status_verification"], ["all", ["not", ["unknown", ["of", ["P"], "temporarily_out_of_state_start_date"]]], [">", ["days_between", ["of", ["P"], "temporarily_out_of_state_start_date"], ["det_date"]], "cw_temporary_out_of_state_max_days"]]]]]
sources: [S1004, S2600, S2602, S1064]
implemented: engine
open: [OQ-660, OQ-953]
tags: [cash, tanf, household]
rationale: "OQ-143: the need and grant standards are read by the number of caretakers and children in the unit (S414); 3.604.2.M (S1004) leaves a disqualified or ineligible required member out of that count while the member's income still counts."
tests:
  - {id: "CO-2351-T6", month: "2026-10", title: "Coverage review CW-12: a mother who has not provided her SSN within the thirty days is not paid for; her child stays", as_of: "2026-10-15", given: {cw_assistance_unit_members: [p1, p2], cw_is_disqualified_member: false, cw_is_institution_patient_or_inmate: false, cw_is_excluded_for_unprovided_status_verification: true, cw_assistance_unit_members_in_month: [p1, p2]}, others: {p2: {cw_is_disqualified_member: false, cw_is_institution_patient_or_inmate: false, cw_is_excluded_for_unprovided_status_verification: false}}, expect: [p2]}
  - {id: "CO-2351-T1", month: "2026-10", title: "An undocumented parent is removed from the size", as_of: "2026-10-01", given: {cw_assistance_unit_members: [p1, p2, p3], cw_is_disqualified_member: true, cw_assistance_unit_members_in_month: [p1, p2, p3]}, others: {p2: {cw_is_disqualified_member: false}, p3: {cw_is_disqualified_member: false}}, expect: [p2, p3]}
  - {id: "CO-2351-T2", month: "2026-10", as_of: "2026-10-01", given: {cw_assistance_unit_members: [p1, p2], cw_is_disqualified_member: false, cw_assistance_unit_members_in_month: [p1, p2]}, others: {p2: {cw_is_disqualified_member: false}}, expect: [p1, p2]}
  - {id: "CO-2351-T3", month: "2026-10", title: "FC-1: a parent in a psychiatric hospital who is still in the home is not paid for (3.604.1.D)", as_of: "2026-10-01", given: {cw_assistance_unit_members: [p1, p2], cw_is_disqualified_member: false, cw_is_institution_patient_or_inmate: true, cw_assistance_unit_members_in_month: [p1, p2]}, others: {p2: {cw_is_disqualified_member: false, cw_is_institution_patient_or_inmate: false}}, expect: [p2]}
  # Final cash review 2, P2-7: 3.604.2.O.1.
  - {id: "CO-2351-T4", month: "2026-10", title: "P2-7: a mother out of State since June 1 (122 days on October 1) is removed from the size; her child stays", as_of: "2026-10-01", given: {cw_assistance_unit_members: [p1, p2], cw_is_disqualified_member: false, cw_is_institution_patient_or_inmate: false, temporarily_out_of_state_start_date: "2026-06-01", cw_assistance_unit_members_in_month: [p1, p2]}, others: {p2: {cw_is_disqualified_member: false, cw_is_institution_patient_or_inmate: false}}, expect: [p2]}
  - {id: "CO-2351-T5", month: "2026-10", title: "P2-7: out of State since August 1 (61 days) - still counted", as_of: "2026-10-01", given: {cw_assistance_unit_members: [p1, p2], cw_is_disqualified_member: false, cw_is_institution_patient_or_inmate: false, temporarily_out_of_state_start_date: "2026-08-01", cw_assistance_unit_members_in_month: [p1, p2]}, others: {p2: {cw_is_disqualified_member: false, cw_is_institution_patient_or_inmate: false}}, expect: [p1, p2]}
