id: CO-2351
name: "Colorado Works: assistance unit members counted for size"
identifier: cw_assistance_unit_members_for_size
kind: derived
type: group of persons
scope: person
program: ColoradoWorks
meaning: "The members of this person's assistance unit counted for its size: every member except one who is disqualified from or ineligible for basic cash assistance (cw_is_disqualified_member), whom 9 CCR 2503-6 3.604.2.M removes \"from the assistance unit for the purposes of determining the assistance unit size\", and one who is an institution patient for tuberculosis or mental disease or an inmate (cw_is_institution_patient_or_inmate, CO-3802), whom 3.604.1.D-E bar as a client."
precision: "Final cash review FC-1: a member barred by 3.604.1.D-E while still in the home under the absence rules is not paid for; the member's income still counts as a member's (OQ-660)."
derived: [filter, cw_assistance_unit_members, [not, [any, [of, [P], cw_is_disqualified_member], [of, [P], cw_is_institution_patient_or_inmate]]]]
sources: [S1004, S2600]
implemented: engine
open: [OQ-660]
tags: [cash, tanf, household]
rationale: "OQ-143: the need and grant standards are read by the number of caretakers and children in the unit (S414); 3.604.2.M (S1004) leaves a disqualified or ineligible required member out of that count while the member's income still counts."
tests:
  - {id: CO-2351-T1, title: "An undocumented parent is removed from the size", as_of: "2026-10-01", given: {cw_assistance_unit_members: [p1, p2, p3], cw_is_disqualified_member: true}, others: {p2: {cw_is_disqualified_member: false}, p3: {cw_is_disqualified_member: false}}, expect: [p2, p3]}
  - {id: CO-2351-T2, as_of: "2026-10-01", given: {cw_assistance_unit_members: [p1, p2], cw_is_disqualified_member: false}, others: {p2: {cw_is_disqualified_member: false}}, expect: [p1, p2]}
  - {id: CO-2351-T3, title: "FC-1: a parent in a psychiatric hospital who is still in the home is not paid for (3.604.1.D)", as_of: "2026-10-01", given: {cw_assistance_unit_members: [p1, p2], cw_is_disqualified_member: false, cw_is_institution_patient_or_inmate: true}, others: {p2: {cw_is_disqualified_member: false, cw_is_institution_patient_or_inmate: false}}, expect: [p2]}
