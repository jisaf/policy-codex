id: CO-900
name: "Colorado Works: assistance unit members"
identifier: cw_assistance_unit_members
kind: derived
type: group of persons
scope: person
program: ColoradoWorks
meaning: The persons who make up this person's Colorado Works assistance unit under 9 CCR 2503-6 3.604.2.A-C and 26-2-703(2.5), C.R.S. - a dependent child living with a caretaker, and that caretaker (the child's parent, or a non-parent caretaker who requests assistance), crossed reciprocally, with the spouse of a pregnant parent and, when they request assistance, a stepparent, a non-parent caretaker's spouse and the other optional members of 3.604.2.C.2, except that the edge between a dependent child who is themselves a minor parent and that minor parent's own parent is not crossed, because 3.604.2.C.1.b excludes a minor parent's own parent from mandatory inclusion when the minor parent is requesting assistance for their own child. Excludes anyone receiving SSI or a Title IV foster care, adoption subsidy, or kinship payment (3.604.2.C.3) and an optional member who has not requested assistance (C.2). Each member's value of this item is the same set (their own unit); an excluded person's own value is empty or a singleton of themselves.
precision: "As with snap_household_members (CO-305) and ma_magi_household_members (CO-500), a stated parent/child relationship edge is read as 'living in the home' - this volume does not model the 3.604.2.E-G temporary-absence exceptions or the 3.604.2.H multiple-caretaker hierarchy. Phase-10 sweep (OQ-152, OQ-101): a spouse edge is crossed when either spouse is a parent or caretaker of a dependent child in the home or is pregnant, so the spouse of a pregnant parent (C.1.e, mandatory), a stepparent (C.2.a) and a non-parent caretaker's spouse (C.2.c) are reached; the edge between a minor parent requesting assistance for her own child and her parent is crossed when that parent requests inclusion (C.2.g); and the final filter leaves out cw_is_excluded_from_assistance_unit (CO-2350): SSI and Title IV recipients (C.3) and an optional member (cw_is_optional_assistance_unit_member, CO-2349) who has not requested assistance. Siblings and half siblings are reached through their parent or caretaker as dependent children (C.1.c-d); those made optional by custody or child support (C.2.d-f) are stated by cw_is_optional_member_by_custody_or_support (CO-2347). A pregnancy left unstated is read as none for the spouse edge. Same-word audit SW-3/SW-4 (OQ-396): the caretaker relation is cw_caretaker_of (CO-2608): a parent, or a non-parent caretaker who is the child's legal guardian or has primary responsibility for the child (3.601); the spouse of a parent who is not a parent stays the optional member of 3.604.2.C.2.a, read from the spouse and parent roles as the rule words it."
derived: [filter, [reachable, [parent, child, legal_guardian, ward, has_primary_responsibility_for, in_primary_care_of, spouse], [any, [all, [rel, [parent, legal_guardian, has_primary_responsibility_for], [P]], [of, [P], cw_is_dependent_child], [any, [not, [of, [P], cw_has_dependent_child]], [not, [of, [P], is_requesting_assistance_for_own_child]], [otherwise, cw_requests_inclusion_in_assistance_unit, false]]], [all, [rel, [child, ward, in_primary_care_of], [P]], cw_is_dependent_child, [any, [not, cw_has_dependent_child], [not, is_requesting_assistance_for_own_child], [otherwise, [of, [P], cw_requests_inclusion_in_assistance_unit], false]]], [all, [rel, [spouse], [P]], [any, cw_has_dependent_child, [of, [P], cw_has_dependent_child], [otherwise, is_pregnant, false], [otherwise, [of, [P], is_pregnant], false]]]]], [all, [not, cw_is_excluded_from_assistance_unit], [not, [of, [P], cw_is_excluded_from_assistance_unit]]]]
sources: [S406, S408, S409, S411, S1625]
implemented: engine
tags: [cash, tanf, household]
rationale: "No existing item in this volume builds the Colorado Works assistance-unit closure; every other batch-10 rule (unit size, income aggregation, need/grant standard, eligibility status) reads it. Modeled with the P36 reachable closure and P37 filter exactly as snap_household_members (CO-305) and ma_magi_household_members (CO-500) are, with a symmetric edge condition (cw_is_dependent_child and (not cw_has_dependent_child or not is_requesting_assistance_for_own_child), tested from either end of the edge) reproducing 3.604.2.C.1.b's minor-parent exception. Fix round (C-12): the edge is crossed (the minor parent joins her own parent's unit as a dependent child, per 3.604.2.N.3.d) not only when she has no dependent child of her own, but also when she has one and is not requesting assistance for that child (is_requesting_assistance_for_own_child, CO-850, new) - the prior derivation severed the edge whenever cw_has_dependent_child was true regardless of whether assistance was being requested for that child, which gave the wrong unit composition once the child is itself excluded from every assistance unit (e.g., an SSI-receiving infant)."
