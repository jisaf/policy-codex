  - {id: CO-900-T2, as_of: "2026-10-01", given: {date_of_birth: "1985-01-22", citizenship_status: undocumented, receives_ssi: false, receives_title_iv_foster_adoption_kinship_payment: false}, others: {p4: {date_of_birth: "2009-04-08", citizenship_status: citizen, is_enrolled_in_school: true, receives_ssi: false, receives_title_iv_foster_adoption_kinship_payment: false, is_requesting_assistance_for_own_child: true}, p5: {date_of_birth: "2026-02-03", citizenship_status: citizen, receives_ssi: false, receives_title_iv_foster_adoption_kinship_payment: false}}, relationships: [[parent, p1, p4], [parent, p4, p5]], expect: [p1]}
