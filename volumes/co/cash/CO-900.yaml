id: CO-900
name: "Colorado Works: assistance unit members"
identifier: cw_assistance_unit_members
kind: derived
type: group of persons
scope: person
program: ColoradoWorks
meaning: The persons who make up this person's Colorado Works assistance unit under 9 CCR 2503-6 3.604.2.A-C and 26-2-703(2.5), C.R.S. - a dependent child living with a caretaker, and that caretaker (the child's parent), crossed reciprocally, except that the edge between a dependent child who is themselves a minor parent and that minor parent's own parent is not crossed, because 3.604.2.C.1.b excludes a minor parent's own parent from mandatory inclusion when the minor parent is requesting assistance for their own child. Excludes anyone receiving SSI or a Title IV foster care, adoption subsidy, or kinship payment (3.604.2.C.3). Each member's value of this item is the same set (their own unit); an excluded person's own value is empty or a singleton of themselves.
precision: "As with snap_household_members (CO-305) and ma_magi_household_members (CO-500), a stated parent/child relationship edge is read as 'living in the home' - this volume does not model the 3.604.2.E-G temporary-absence exceptions or the 3.604.2.H multiple-caretaker hierarchy. Siblings, half siblings, the spouse of a pregnant parent, and the optional parent(s)-of-a-minor-parent member (3.604.2.C.1.c-e, C.2.g) are not modeled this batch; only the parent/dependent-child mandatory combination (C.1.a-b) is."
derived: [filter, [reachable, [parent, child, caretaker, dependent], [any, [all, [rel, [parent, caretaker], [P]], [of, [P], cw_is_dependent_child], [any, [not, [of, [P], cw_has_dependent_child]], [not, [of, [P], is_requesting_assistance_for_own_child]]]], [all, [rel, [child, dependent], [P]], cw_is_dependent_child, [any, [not, cw_has_dependent_child], [not, is_requesting_assistance_for_own_child]]]]], [all, [not, receives_ssi], [not, receives_title_iv_foster_adoption_kinship_payment], [not, [of, [P], receives_ssi]], [not, [of, [P], receives_title_iv_foster_adoption_kinship_payment]]]]
sources: [S406, S408, S409, S411]
implemented: engine
tags: [cash, tanf, household]
rationale: "No existing item in this volume builds the Colorado Works assistance-unit closure; every other batch-10 rule (unit size, income aggregation, need/grant standard, eligibility status) reads it. Modeled with the P36 reachable closure and P37 filter exactly as snap_household_members (CO-305) and ma_magi_household_members (CO-500) are, with a symmetric edge condition (cw_is_dependent_child and (not cw_has_dependent_child or not is_requesting_assistance_for_own_child), tested from either end of the edge) reproducing 3.604.2.C.1.b's minor-parent exception. Fix round (C-12): the edge is crossed (the minor parent joins her own parent's unit as a dependent child, per 3.604.2.N.3.d) not only when she has no dependent child of her own, but also when she has one and is not requesting assistance for that child (is_requesting_assistance_for_own_child, CO-850, new) - the prior derivation severed the edge whenever cw_has_dependent_child was true regardless of whether assistance was being requested for that child, which gave the wrong unit composition once the child is itself excluded from every assistance unit (e.g., an SSI-receiving infant)."
