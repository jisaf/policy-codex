id: CO-900
name: "Colorado Works: assistance unit members"
identifier: cw_assistance_unit_members
kind: derived
type: group of persons
scope: person
program: ColoradoWorks
meaning: The persons who make up this person's Colorado Works assistance unit under 9 CCR 2503-6 3.604.2.A-C and 26-2-703(2.5), C.R.S. - a dependent child living with a caretaker, and that caretaker (the child's parent, or a non-parent caretaker who requests assistance), crossed reciprocally, with the spouse of a pregnant parent and, when they request assistance, a stepparent, a non-parent caretaker's spouse and the other optional members of 3.604.2.C.2, except that the edge between a dependent child who is themselves a minor parent and that minor parent's own parent is not crossed, because 3.604.2.C.1.b excludes a minor parent's own parent from mandatory inclusion when the minor parent is requesting assistance for their own child. Excludes anyone receiving SSI or a Title IV foster care, adoption subsidy, or kinship payment (3.604.2.C.3) and an optional member who has not requested assistance (C.2). Each member's value of this item is the same set (their own unit); an excluded person's own value is empty or a singleton of themselves.
precision: "Living in the home is read from lives_with (CO-1925) and Colorado Works's temporary-absence rule, 3.604.2.E, G and I (cw_is_considered_living_in_home, CO-3354); where a case states no dwelling_id a stated edge is read as living in the home (same-word SW-7, convention rule 17). The 3.604.2.H multiple-caretaker hierarchy is applied to both caretaker edges, as cw_caretaker_of (CO-2608) applies it (coverage review CW-18, fix round 2026-11-23): a non-parent's edge to a child is crossed only when no higher-ranked caretaker of the child is in the home (cw_parents_in_home, CO-5207; cw_relative_or_guardian_caretakers_in_home, CO-5208). Phase-10 sweep (OQ-152, OQ-101): a spouse edge is crossed when either spouse is a parent or caretaker of a dependent child in the home or is pregnant, so the spouse of a pregnant parent (C.1.e, mandatory), a stepparent (C.2.a) and a non-parent caretaker's spouse (C.2.c) are reached; the edge between a minor parent requesting assistance for her own child and her parent is crossed when that parent requests inclusion (C.2.g); and the final filter leaves out cw_is_excluded_from_assistance_unit (CO-2350): SSI and Title IV recipients (C.3) and an optional member (cw_is_optional_assistance_unit_member, CO-2349) who has not requested assistance. Siblings and half siblings are reached through their parent or caretaker as dependent children (C.1.c-d); those made optional by custody or child support (C.2.d-f) are stated by cw_is_optional_member_by_custody_or_support (CO-2347). A pregnancy left unstated is read as none for the spouse edge. Same-word audit SW-3/SW-4 (OQ-396): the caretaker relation is cw_caretaker_of (CO-2608): a parent, or a non-parent caretaker who is the child's legal guardian or has primary responsibility for the child (3.601); the spouse of a parent who is not a parent stays the optional member of 3.604.2.C.2.a, read from the spouse and parent roles as the rule words it. Coverage pass 4 CA4-16: whether a spouse with no dependent child is pregnant is required where read, never read as no when not stated (decision 4 of 2026-11-23: missing information is cannot determine unless the rule says otherwise). Coverage pass 6 CA6-3, CA6-4 (docs/reviews/coverage6-cash.md): the spouse edge reads a pregnancy in some month the determination covers (cw_is_pregnant_in_determination, CO-7302), as the dependent child is one in some month (CO-901); the persons here are those who may join in some month, and the month's members are cw_assistance_unit_members_in_month (CO-7304), which every month-scoped figure reads. Pattern sweep (cash) PS-D2 (docs/reviews/pattern-sweep-cash.md): whether persons live together is read from lives_with as stated (dwelling_id), required where read (decision 4 of 2026-11-23; docs/conventions.md rule 17 as amended for Colorado Works and Adult Financial): no text on file says the persons of one application live together (9 CCR 2503-6 3.604.2.A, E, I build the unit from the persons living in the home; 9 CCR 2503-5 3.534.B.3 and 3.549.E name the household of the spouse and the parents in the home). Before, a person whose home was not stated was read as living with every related person of the case."
