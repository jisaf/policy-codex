rationale: "No existing item in this volume builds the Colorado Works assistance-unit closure; every other batch-10 rule (unit size, income aggregation, need/grant standard, eligibility status) reads it. Modeled with the P36 reachable closure and P37 filter exactly as snap_household_members (CO-305) and ma_magi_household_members (CO-500) are, with a symmetric edge condition (cw_is_dependent_child and (not cw_has_dependent_child or not is_requesting_assistance_for_own_child), tested from either end of the edge) reproducing 3.604.2.C.1.b's minor-parent exception. Fix round (C-12): the edge is crossed (the minor parent joins her own parent's unit as a dependent child, per 3.604.2.N.3.d) not only when she has no dependent child of her own, but also when she has one and is not requesting assistance for that child (is_requesting_assistance_for_own_child, CO-850, new) - the prior derivation severed the edge whenever cw_has_dependent_child was true regardless of whether assistance was being requested for that child, which gave the wrong unit composition once the child is itself excluded from every assistance unit (e.g., an SSI-receiving infant). Same-word SW-7: living in the home is read from lives_with and the temporary-absence rule. Coverage review CW-18 (fix round 2026-11-23): the hierarchy of 3.604.2.H (S3753), deferred since the first pass, now gates the caretaker edges."
