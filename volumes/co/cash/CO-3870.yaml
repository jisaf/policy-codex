id: CO-3870
name: "Adult Financial: proof of benefit application due date"
identifier: af_benefit_application_verification_due_date
kind: derived
type: calendar date
scope: person-month
program: AdultFinancial
role: outcome
meaning: "The date by which a client referred to apply for SSA benefits or other income must provide verification of the application (9 CCR 2503-5 3.520.71.C): for OAP and AND-CS, af_benefit_application_verification_days after the application (benefit_application_date); for AND-SO, af_and_so_benefit_application_verification_days after the initial interview, or af_and_so_subsequent_benefit_application_verification_days on a subsequent AND-SO application."
precision: "The program is read as af_countable_income reads it: OAP when af_is_oap_age, AND-CS when af_and_cs_eligible, AND-SO otherwise. The interview date is af_interview_date, else the verification request date, as for the AND-SO medical certification (CO-2592). The subsequent application's thirty days are counted from the interview too; the rule names no start."
derived: [case, [[any, af_is_oap_age, af_and_cs_eligible], [days_after, af_benefit_application_verification_days, benefit_application_date]], [af_is_subsequent_and_so_application, [days_after, af_and_so_subsequent_benefit_application_verification_days, af_interview_date]], [else, [days_after, af_and_so_benefit_application_verification_days, af_interview_date]]]
sources: [S2622]
implemented: engine
tags: [cash, verification]
rationale: "Final cash review FC-9: 3.520.71.C (S2622) sets the periods; af_verification_status (CO-1438) keeps the client pending until this date when the proof is the only element outstanding after the general eleven days."
tests:
  - {id: CO-3870-T1, title: "OAP: SSA application on 2026-10-05, due 2026-10-16", as_of: "2026-10-01", month: "2026-10", given: {af_is_oap_age: true, benefit_application_date: "2026-10-05"}, expect: "2026-10-16"}
  - {id: CO-3870-T2, title: "AND-SO: interview 2026-10-01, sixty days of conditional approval", as_of: "2026-10-01", month: "2026-10", given: {af_is_subsequent_and_so_application: false, af_is_oap_age: false, af_and_cs_eligible: false, af_interview_date: "2026-10-01"}, expect: "2026-11-30"}
  - {id: CO-3870-T3, title: "Subsequent AND-SO application: thirty days", as_of: "2026-10-01", month: "2026-10", given: {af_is_oap_age: false, af_and_cs_eligible: false, af_is_subsequent_and_so_application: true, af_interview_date: "2026-10-01"}, expect: "2026-10-31"}
