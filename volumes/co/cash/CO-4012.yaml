id: CO-4012
name: "Adult Financial: excluded infrequent or irregular earned income"
identifier: af_excluded_infrequent_earned_income
kind: derived
type: money
scope: person-month
program: AdultFinancial
meaning: The person's infrequent or irregular pay for the month that Adult Financial counts (the earnings records received in the month marked irregular whose kind af_earnings_treatment_table counts as pay, at their amount less any PASS set-aside) when the infrequent or irregular income of the calendar quarter containing the month, earned and unearned together (af_infrequent_income_quarter_total), is less than af_infrequent_income_quarterly_limit, which 9 CCR 2503-5 3.520.786.O exempts; otherwise 0.
precision: "Read by af_excluded_earned_income (CO-2342), so the exempt earnings come off gross earned income before the $65 and one-half disregards. Earned-income records, step E1 Adult Financial (docs/reviews/records-earnings-cash.md): before earnings records the pay was infrequent_or_irregular_earned_income_received (part of wages_gross); it is now the irregular records of the kinds af_earned_pay (CO-5130) counts, so pay the table never counts (work-study) is not taken off again. A business's irregular receipts count toward the quarter's total (CO-4011) but are not taken off here: they enter gross earned income only through the business's net profit (af_self_employment_net_profit, CO-1708; 3.520.783.F averages irregular self-employment income over twelve months, as the case states it). The PASS set-aside of an irregular pay is taken off by CO-2342, so it is not taken off twice. An unstated earnings list is cannot determine. Coverage pass 4 CA4-9 (docs/reviews/coverage4-cash.md): a stream (an earnings record with no month and no date) is read only in the months from the month of its job_start_date through the month of its job_end_date, so the pay of a job that ended before the month, or begins after it, is not counted (9 CCR 2503-5 3.520.781.G, 9 CCR 2503-6 3.605.2.B: income counted when received); a record stated with its month or date is read in that month. Coverage pass 4 CA4-7: a difficulty of care payment stated as foster care (foster_care) is not counted pay."
derived: [case, [["<", af_infrequent_income_quarter_total, af_infrequent_income_quarterly_limit], [sum_receipts, earnings, [all, [all, [receipt, irregular], [received_in, [month]], [any, [any, [in, [lookup, af_earnings_treatment_table, [receipt, kind]], [counted, counted_no_rule_excludes, counted_at_value]], [all, ["=", [lookup, af_earnings_treatment_table, [receipt, kind]], counted_unless_foster_care], [not, [receipt, foster_care]]]], [all, ["=", [lookup, af_earnings_treatment_table, [receipt, kind]], excluded_except_combat_zone], [receipt, combat_zone]]]], [any, [not, [unknown, [receipt, month]]], [all, [any, [unknown, [receipt, job_start_date]], ["<=", [month_of, [receipt, job_start_date]], [month]]], [any, [unknown, [receipt, job_end_date]], [">=", [month_of, [receipt, job_end_date]], [month]]]]]], ["-", [receipt, amount], [receipt, pass_set_aside]]]], [else, 0]]
sources: [S2608]
implemented: engine
tags: [cash, income]
rationale: "Final cash review 2, P2-3: 3.520.786.O exempts infrequent or irregular income of less than $60 in a calendar quarter without limiting it to unearned income; the earned part had no exclusion. Earned-income records, step E1 Adult Financial: read from the earnings records."
tests:
  # Hand computations from 3.520.786.O (S2608).
  - {id: CO-4012-T1, month: "2026-05", as_of: "2026-05-15", given: {receipts: [], earnings: [{kind: wages, amount: 600}, {kind: wages, irregular: true, amount: 35, month: "2026-05"}]}, title: "$35 for a single odd job in May, nothing else irregular in the quarter: 35 < 60, exempt: 35", expect: 35}
  - {id: CO-4012-T2, month: "2026-05", as_of: "2026-05-15", given: {receipts: [{kind: other_nontaxable, amount: 40, irregular: true, month: "2026-04"}], earnings: [{kind: wages, amount: 600}, {kind: wages, irregular: true, amount: 35, month: "2026-05"}]}, title: "$35 of odd-job pay and a $40 gift in the same quarter: 35 + 40 = 75, not less than 60, counted: 0", expect: 0}
  - {id: CO-4012-T3, month: "2026-05", as_of: "2026-05-15", given: {receipts: [], earnings: [{kind: wages, irregular: true, amount: 59.99, month: "2026-05"}]}, title: "$59.99 in the quarter: less than $60, exempt: 59.99", expect: 59.99}
  - {id: CO-4012-T4, month: "2026-05", as_of: "2026-05-15", given: {receipts: [], earnings: [{kind: wages, irregular: true, amount: 60, month: "2026-05"}]}, title: "$60 in the quarter: not less than $60 (O: \"less than $60\"), counted: 0", expect: 0}
