id: CO-4023
name: "Adult Financial: excluded gifts to a child with a life-threatening condition"
identifier: af_excluded_life_threatening_condition_gifts
kind: derived
type: money
scope: person-month
program: AdultFinancial
meaning: "The part of the cash gifts this person received in the month from a 501(c)(3) organization because of a life-threatening condition (charitable_gifts_for_life_threatening_condition_received) that 20 CFR 416.1124(c)(21), incorporated by 9 CCR 2503-5 3.520.786.K, excludes: for a person under af_ssi_child_age_limit, the gifts of the month as far as the gifts of the calendar year through the month do not exceed af_life_threatening_condition_gift_annual_exclusion; otherwise 0."
precision: "The month's exclusion is the year's running total through the month, capped at the yearly exclusion, less the same total through the month before, as the SSI student earned income exclusion is counted (P54). A month of the year not stated is read as 0."
derived: [case, [[not, [">", [otherwise, charitable_gifts_for_life_threatening_condition_received, 0], 0]], 0], [[not, ["<", age, af_ssi_child_age_limit]], 0], [else, ["-", [min, af_life_threatening_condition_gift_annual_exclusion, [sum_months, [months_from_to, [latest_month_of_year, 1, [month]], [month]], [at, [otherwise, charitable_gifts_for_life_threatening_condition_received, 0], [that_month]]]], [min, af_life_threatening_condition_gift_annual_exclusion, [sum_months, [months_from_to, [latest_month_of_year, 1, [month]], [month_before, [month]]], [at, [otherwise, charitable_gifts_for_life_threatening_condition_received, 0], [that_month]]]]]]]
sources: [S2803]
implemented: engine
tags: [cash, income]
rationale: "Final cash review 2, N-4: 3.520.786.K incorporates 20 CFR 416.1124, whose (c)(21) Adult Financial did not model; af_excluded_unearned_income (CO-2343) adds this item."
tests:
  - {id: CO-4023-T1, title: "A child of 9 receives a $1,500 gift in October, the first of the year: all excluded", as_of: "2026-10-01", month: "2026-10", given: {}, persons: {p1: {facts: {date_of_birth: "2017-05-09"}, months: {"2026-10": {charitable_gifts_for_life_threatening_condition_received: 1500}}}}, expect: 1500}
  - {id: CO-4023-T2, title: "A child of 9 received $1,500 in March and $1,000 in October: $500 of October's is excluded", as_of: "2026-10-01", month: "2026-10", given: {}, persons: {p1: {facts: {date_of_birth: "2017-05-09"}, months: {"2026-03": {charitable_gifts_for_life_threatening_condition_received: 1500}, "2026-10": {charitable_gifts_for_life_threatening_condition_received: 1000}}}}, expect: 500}
  - {id: CO-4023-T3, title: "An adult: not excluded", as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "1990-05-09", charitable_gifts_for_life_threatening_condition_received: 1500}, expect: 0}
