id: CO-2340
name: "Colorado Works: excluded earned income"
identifier: cw_excluded_earned_income
kind: derived
type: money
scope: person-month
program: ColoradoWorks
meaning: "The part of this person's counted earned income for the month that 9 CCR 2503-6 does not consider by a property of the person or of the pay rather than by its kind: all of a dependent child student's earned income (3.605.4.B.24.b, cw_student_earnings_are_disregarded: the counted pay, the net profit from self-employment and boarder income); otherwise the pay from short-term employment of ninety days or less (temporary_job) unless the client was terminated or terminated the employment through the client's own fault (3.605.2.C). College work-study (B.24.a) and wages from subsidized employment, WIOA on-the-job training included (B.35, B.16, 3.605.2.C), are exempt by kind: cw_earnings_treatment_table (CO-5104) never counts them."
precision: "Earned-income records, step E1 Colorado Works (docs/reviews/records-earnings-cash.md): before earnings records this item summed the parts of wages_gross the rule leaves out (work_study_earnings, subsidized_employment_wages, short_term_employment_wages, each read as 0 when not stated) so cw_gross_earned_income (CO-1716) could subtract them; the kinds are now never counted, and what is left here is the temporary job and the student. A temporary job's pay is the earnings records received in the month that the table counts as pay and that state temporary_job: it is not considered when the record states that the job did not end through the client's fault (ended_through_own_fault false), or states neither that fault nor a job_end_date (the job has not ended, so the client has not been terminated); a record that states the job ended (job_end_date) and not whether through the client's fault cannot determine, since 3.605.2.C turns on it. A student's earnings include in-kind pay and boarder income (B.24.b: \"All earned income\"; coverage review CW-9(c) read in-kind pay; boarder income, which E.4 makes earned income, is added in step E1). A person with no counted earned income has nothing excluded, and whether the person is a disregarded student is not read; for a person with earned income it is read with no default (before earnings records cw_gross_earned_income read this item as 0 when it was unknown, so a child whose student status was not stated had all earnings counted; 3.605.4.B.24.b turns on it, decision 4 of 2026-11-23). An unstated earnings list is cannot determine. Coverage pass 4 CA4-9 (docs/reviews/coverage4-cash.md): a stream (an earnings record with no month and no date) is read only in the months from the month of its job_start_date through the month of its job_end_date, so the pay of a job that ended before the month, or begins after it, is not counted (9 CCR 2503-5 3.520.781.G, 9 CCR 2503-6 3.605.2.B: income counted when received); a record stated with its month or date is read in that month. Coverage pass 4 CA4-7: a difficulty of care payment stated as foster care (foster_care) is not counted pay. Field sweep fix round (FS-CW-4): 3.605.2.B (S4912): wages are \"considered available when paid rather than when earned, except that wages held at the request of the employee are considered income in the month they would otherwise have been paid\". A pay that states its regular_date and that the employer held at the person's request (regular_date_reason held_at_request, a neutral field of the earnings record) is read in the month of its regular_date; a pay that came early or late for any other reason (a holiday or a weekend, changed pay dates) is read in the month it was paid, so regular_date_reason is required where regular_date is stated (decision 4). Before, every pay was read in the month it came in, so held wages fell into the next month. The contract employment the paragraph excepts is OQ-1295."
derived: ["case", [["<=", ["+", "cw_earned_pay", "cw_self_employment_net_profit", "cw_boarder_income"], 0], 0], ["cw_student_earnings_are_disregarded", ["+", "cw_earned_pay", "cw_self_employment_net_profit", "cw_boarder_income"]], ["else", ["sum_receipts", "earnings", ["all", ["all", ["case", [["all", ["not", ["unknown", ["receipt", "regular_date"]]], ["=", ["receipt", "regular_date_reason"], "held_at_request"]], ["=", ["month_of", ["receipt", "regular_date"]], ["month"]]], ["else", ["received_in", ["month"]]]], ["any", ["in", ["lookup", "cw_earnings_treatment_table", ["receipt", "kind"]], ["counted", "counted_no_rule_excludes", "counted_at_value"]], ["all", ["=", ["lookup", "cw_earnings_treatment_table", ["receipt", "kind"]], "counted_unless_foster_care"], ["not", ["receipt", "foster_care"]]]], ["receipt", "temporary_job"], ["case", [["not", ["unknown", ["receipt", "ended_through_own_fault"]]], ["not", ["receipt", "ended_through_own_fault"]]], [["unknown", ["receipt", "job_end_date"]], true], ["else", ["not", ["receipt", "ended_through_own_fault"]]]]], ["any", ["not", ["unknown", ["receipt", "month"]]], ["all", ["any", ["unknown", ["receipt", "job_start_date"]], ["<=", ["month_of", ["receipt", "job_start_date"]], ["month"]]], ["any", ["unknown", ["receipt", "job_end_date"]], [">=", ["month_of", ["receipt", "job_end_date"]], ["month"]]]]]], ["receipt", "amount"]]]]
sources: [S1621, S2205, S2604, S2606, S4912]
implemented: engine
tags: [cash, income]
rationale: "Same-word audit SW-28, dual-entry audit 3.24 and 3.25: each program's excluded income and allowable business costs were program-prefixed supplied amounts, so one receipt or one set of business costs was entered once per program. The neutral fact describes the receipt or the cost; each program's exclusion or allowable cost is its own derived item citing its list (product-owner decision, convention rule 13). The ID and identifier are kept; the amount is now derived. Final cash review FC-2: the item read student and work-study earnings only; 3.605.2.C and 3.605.4.B.35 (S2604, S2606) also leave out subsidized and short-term wages. Earned-income records, step E1 Colorado Works: the exemptions by kind moved into the counting table."
tests:
  # Hand computations from 3.605.2.C (S2604) and 3.605.4.B.24 (S2205, S2606).
  - {id: CO-2340-T1, title: "A full-time student dependent child's $400 of wages: all disregarded (B.24.b): 400", month: "2026-10", as_of: "2026-10-01", given: {receipts: [], cw_student_earnings_are_disregarded: true, earnings: [{kind: wages, amount: 400}]}, expect: 400}
  - {id: CO-2340-T2, title: "$250 of work-study is exempt by its kind, not here: 0", month: "2026-10", as_of: "2026-10-01", given: {receipts: [], cw_student_earnings_are_disregarded: false, earnings: [{kind: wages, amount: 900}, {kind: work_study, amount: 250}]}, expect: 0}
  # Final cash review FC-2.
  - {id: CO-2340-T3, title: "FC-2: $600 of on-the-job training wages are exempt by their kind (3.605.4.B.35): nothing here", as_of: "2026-10-01", month: "2026-10", given: {cw_student_earnings_are_disregarded: false, earnings: [{kind: subsidized_employment, amount: 600}]}, expect: 0}
  - {id: CO-2340-T4, title: "FC-2: $500 from a 60-day temporary job that has not ended (3.605.2.C): 500", as_of: "2026-10-01", month: "2026-10", given: {cw_student_earnings_are_disregarded: false, earnings: [{kind: wages, amount: 800}, {kind: wages, temporary_job: true, amount: 500}]}, expect: 500}
  - {id: CO-2340-T5, title: "FC-2: the temporary job ended through the client's own fault - counted: 0", as_of: "2026-10-01", month: "2026-10", given: {cw_student_earnings_are_disregarded: false, earnings: [{kind: wages, temporary_job: true, amount: 500, ended_through_own_fault: true, job_end_date: "2026-10-20"}]}, expect: 0}
  - {id: CO-2340-T6, title: "A temporary job that ended on October 20, not through the client's fault: 500 not considered", as_of: "2026-10-01", month: "2026-10", given: {cw_student_earnings_are_disregarded: false, earnings: [{kind: wages, temporary_job: true, amount: 500, ended_through_own_fault: false, job_end_date: "2026-10-20"}]}, expect: 500}
  - {id: CO-2340-T7, title: "A temporary job that ended, fault not stated: cannot determine (3.605.2.C turns on it)", as_of: "2026-10-01", month: "2026-10", given: {cw_student_earnings_are_disregarded: false, earnings: [{kind: wages, temporary_job: true, amount: 500, job_end_date: "2026-10-20"}]}, expect: unknown}
  - {id: CO-2340-T8, title: "A dependent student's $300 of wages and a $400 room-only payment: all disregarded: 700", month: "2026-10", as_of: "2026-10-15", given: {receipts: [], cw_student_earnings_are_disregarded: true, earnings: [{kind: wages, amount: 300}, {kind: boarder_payments, amount: 400, provides: room_only, boarders: 1}]}, expect: 700}
  # Field sweep fix round (FS-CW-4): hand-computed from 9 CCR 2503-6 3.605.2.B (S4912): wages held at the employee's request are income in the month they would otherwise have been paid; other wages when paid.
  - {"month": "2027-02", "as_of": "2027-02-15", "title": "A temporary job's $1,200 pay held at the employee's request from 2027-02-26 to 2027-03-03, the job not ended: February's pay, all of it exempt (3.605.2.C), 1,200", "given": {"receipts": [], "cw_student_earnings_are_disregarded": false, "earnings": [{"kind": "wages", "amount": 1200, "date": "2027-03-03", "frequency": "monthly", "job": "job_1", "regular_date": "2027-02-26", "regular_date_reason": "held_at_request", "temporary_job": true}]}, "expect": 1200, "id": "CO-2340-T9"}
