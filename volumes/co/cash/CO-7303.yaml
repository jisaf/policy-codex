id: CO-7303
name: "Colorado Works: a member of the unit in the month"
identifier: cw_is_assistance_unit_member_in_month
kind: derived
type: yes/no
scope: person-month
program: ColoradoWorks
meaning: "For a person of a Colorado Works assistance unit (cw_assistance_unit_members, CO-900, the persons who may join it in some month the determination covers), whether the person is a member of the unit in the month evaluated: born on or before the month's last day; not dead before the month's first day (9 CCR 2503-6 3.609.2.C.1-2: \"A client's eligibility shall end on the date of his or her death. If a client dies before 12:00 a.m. on the first day of a month, no eligibility for a grant payment for the following month exists\"); and either a member who is not in the unit as a dependent child (cw_is_dependent_child false: a parent, a caretaker, a spouse or another optional member) or, for one who is a dependent child in some month, in this month a dependent child (cw_is_dependent_child_in_month, 3.601), a parent or caretaker of one (cw_has_dependent_child_in_month), or an expectant parent (cw_is_pregnant_in_month; 3.601 \"Parent ... including an expectant parent\")."
precision: "Coverage pass 6 CA6-4 and CA6-5 (docs/reviews/coverage6-cash.md, probes W3, W7, W9): the unit is one per case (CO-900), built from a dependent child in some month, so a month on the other side of a birthday, a birth or a death was built with the other month's members: a daughter who turned 18 before October 1 was still counted as a child in October (W3: $620 for two children where the rule gives one caretaker and one child, $488); a minor parent who turned 18 was a dependent child in the month she was an adult (W9); a child who died in September kept the unit eligible in October (W7). A person who joins only as a dependent child and is none in the month is not a member that month, unless she is then a parent or caretaker of a dependent child of the month or pregnant (an 18-year-old mother with her own baby is a caretaker). A member who dies during a month keeps that month (3.609.2.C.3 holds the payment for the personal representative). Every month-scoped figure of the unit reads the month's members (cw_assistance_unit_members_in_month, CO-7304). Pattern sweep (cash) PS-T8 (docs/reviews/pattern-sweep-cash.md): and living in the home in the month (cw_is_considered_living_in_home_in_month, CO-7602), each absence counted to the month (cw_month_reading_date, CO-7600), so a member whose absence passed its limit after the application month is a member of the application month and not of the later month."
derived: [all, ["<", date_of_birth, [first_day, [month_after, [month]]]], [any, [unknown, date_of_death], [">=", date_of_death, [first_day, [month]]]], cw_is_considered_living_in_home_in_month, [any, [not, cw_is_dependent_child], cw_is_dependent_child_in_month, cw_has_dependent_child_in_month, cw_is_pregnant_in_month]]
sources: [S401, S406, S1806, S3165, S1625]
implemented: engine
tags: [cash, tanf, household, age]
nearest: [CO-6807]
rationale: "Coverage pass 6 CA6-4, CA6-5: the membership of a month, so the unit's size, standards, income and basis are the month's (3.605.1.A.1: the month of application's facts decide eligibility; 3.609.2.C: no eligibility after death). CO-900 stays the persons who may join in some month (who is reached through whom), which no month changes."
