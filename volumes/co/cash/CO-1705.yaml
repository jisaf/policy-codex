id: CO-1705
name: "Colorado Works: self-employment business costs"
identifier: cw_self_employment_business_costs
kind: derived
type: money
scope: person-month
program: ColoradoWorks
meaning: "The person's cost of doing business for the month that 9 CCR 2503-6 3.605.2.E.1 allows (rent of business premises or the room used at home, wholesale cost of merchandise, utilities, interest, taxes, labor, upkeep of necessary equipment): the cost records the earnings table deducts (operating costs, interest and the home business space); for a licensed, certified or approved day care provider, $55 for the first child and $22 for each additional child unless documented costs are higher (E.1.b); not depreciation, payments on the principal of loans for capital assets, or personal expenses."
precision: "Earned-income records, step E1 Colorado Works (docs/reviews/records-earnings-cash.md): the earnings records (earnings, CO-5100) of a cost kind that cw_earnings_treatment_table (CO-5104) deducts, paid in the month, a farm's included (Colorado Works treats a farm as any other self-employment, 3.605.2.E.4.a); before earnings records each cost fact was read as 0 when not stated, and now an unstated earnings list is cannot determine (decision 4 of 2026-11-23). The costs of providing room or board are not these: they are deducted from the boarder payments (cw_boarder_income, CO-4361)."
derived: [case, [[">", [otherwise, licensed_child_care_children_in_care_count, 0], 0], [max, [sum_receipts, earnings, [all, ["=", [lookup, cw_earnings_treatment_table, [receipt, kind]], deducted], [received_in, [month]]], [receipt, amount]], [+, cw_child_care_provider_cost_first_child, ["*", cw_child_care_provider_cost_each_additional_child, ["-", licensed_child_care_children_in_care_count, 1]]]]], [else, [sum_receipts, earnings, [all, ["=", [lookup, cw_earnings_treatment_table, [receipt, kind]], deducted], [received_in, [month]]], [receipt, amount]]]]
sources: [S1155, S4103]
implemented: engine
tags: [cash, income]
rationale: "Same-word audit SW-28, dual-entry audit 3.24 and 3.25: each program's excluded income and allowable business costs were program-prefixed supplied amounts, so one receipt or one set of business costs was entered once per program. The neutral fact describes the receipt or the cost; each program's exclusion or allowable cost is its own derived item citing its list (product-owner decision, convention rule 13). The ID and identifier are kept; the amount is now derived. Earned-income records, step E1 Colorado Works: each cost is a record of its own kind, deducted or not by the program's counting table (design decision D4)."
tests:
  # Hand computations from 3.605.2.E.1.a-b (S1155, S4103).
  - {id: CO-1705-T1, title: "Operating 400, interest 20, capital principal 100, home space 50, vehicle 30: 400 + 20 + 50 = 470 (E.1.a.1 names interest and the room used at home; a.3 excludes principal; the vehicle row is for the owner's signature)", month: "2026-10", as_of: "2026-10-01", given: {earnings: [{kind: self_employment_receipts, amount: 2000}, {kind: business_cost_operating, amount: 400}, {kind: business_cost_interest, amount: 20}, {kind: business_cost_capital_principal, amount: 100}, {kind: business_cost_home_space, amount: 50}, {kind: business_cost_vehicle, amount: 30}]}, expect: 470}
  - {id: CO-1705-T2, title: "Day care provider with three children: 55 + 2 x 22 = 99 over 60 documented", month: "2026-10", as_of: "2026-10-01", given: {licensed_child_care_children_in_care_count: 3, earnings: [{kind: self_employment_receipts, amount: 1500}, {kind: business_cost_operating, amount: 60}]}, expect: 99}
  - {id: CO-1705-T3, title: "A boarder's $100 of meal costs are not a business cost here: 0", month: "2026-10", as_of: "2026-10-01", given: {earnings: [{kind: boarder_payments, amount: 700, provides: room_and_board, boarders: 1}, {kind: business_cost_boarder_provision, amount: 100, provides: room_and_board}]}, expect: 0}
  - {id: CO-1705-T4, title: "Earnings not stated: cannot determine (decision 4)", month: "2026-10", as_of: "2026-10-01", given: {}, expect: unknown}
