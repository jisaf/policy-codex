id: CO-1512
name: "Adult Financial: in-kind support and maintenance"
identifier: af_in_kind_support_and_maintenance
kind: derived
type: money
scope: person-month
program: AdultFinancial
meaning: "The In-Kind Support and Maintenance (ISM) amount for this person for the month under 9 CCR 2503-5 3.520.79: the ISM the Social Security Administration charges an SSI client (B.6); none for a client who pays a full share of the home's shelter costs (B.4-5), owns and lives in the residence (B.1), receives subsidized housing (B.2), is homeless (B.3), or pays shelter costs at least the maximum ISM (B.5); otherwise the full maximum when all shelter is provided (C.3), the maximum less what the client pays when the costs are below market value (C.1), or the lesser of the fair share and the maximum less what the client pays (C.2)."
precision: "The client's payment is shelter_cost_monthly; the fair share is home_total_shelter_costs divided by the persons living in the home (lives_with). Homeless is 3.510's definition (af_is_homeless, CO-4410; coverage review F-5): a stay in a relative's home after losing housing is not homelessness unless the person moves among a succession of friends or relatives with no permanent arrangement, so that client's ISM is computed. af_countable_income (CO-946) caps it at af_ism_maximum (CO-1513) and counts it only for an OAP-age or AND-CS client. Not the same figure as ssi_in_kind_support_and_maintenance (CO-802). Coverage review P3: a client with an established life estate whose shelter costs are provided in full has ISM calculated (3.520.79.D); the life estate is not ownership, so the case states owns_and_lives_in_home false for that client. Resource records, step H1 Adult Financial (docs/reviews/records-holdings-snap-af.md): the client owns and lives in the residence (B.1) when a home record of the client's holdings states that the client lives in it (lives_in), in place of owns_and_lives_in_home (CO-3401), which was read as no when not stated; holdings not stated, or a home that does not say, is cannot determine (decision 4) where the earlier tests of B do not settle it. Coverage pass 4 CA4-16: the ISM the Social Security Administration charges (B.6) is read for an SSI recipient (receives_ssi) and required then, and the client's shelter payment (shelter_cost_monthly) is required where the computation reaches it; neither is read as 0 when not stated (decision 4 of 2026-11-23: missing information is cannot determine unless the rule says otherwise)."
derived: [case, [[all, receives_ssi, [">", ssa_in_kind_support_and_maintenance_charged, 0]], ssa_in_kind_support_and_maintenance_charged], [["=", shelter_costs_paid_by_others, 0], 0], [[any, [">", [sum_receipts, holdings, [all, [all, [received_in, [month]], [unknown, [receipt, disposed_date]]], ["=", [receipt, kind], home], [receipt, lives_in]], 1], 0], lives_in_subsidized_housing, af_is_homeless], 0], [[">=", shelter_cost_monthly, af_ism_maximum], 0], [["<=", shelter_cost_monthly, 0], af_ism_maximum], [[not, home_shelter_costs_are_market_value], ["-", af_ism_maximum, shelter_cost_monthly]], [else, [max, 0, ["-", [min, ["/", home_total_shelter_costs, [count, lives_with]], af_ism_maximum], shelter_cost_monthly]]]]
sources: [S1012, S3205]
implemented: engine
tags: [cash, income]
rationale: "Same-word audit SW-30 and dual-entry audit 2.7: in-kind support and maintenance was two supplied, already-computed amounts, one per method, whose formula the meaning spelled out. The shelter arrangement is stated in neutral facts; the SSI method's and Adult Financial's ISM are each derived by its own rule."
