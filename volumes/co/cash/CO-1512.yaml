id: CO-1512
name: "Adult Financial: in-kind support and maintenance"
identifier: af_in_kind_support_and_maintenance
kind: derived
type: money
scope: person-month
program: AdultFinancial
meaning: "The In-Kind Support and Maintenance (ISM) amount for this person for the month under 9 CCR 2503-5 3.520.79: the ISM the Social Security Administration charges an SSI client (B.6); none for a client who pays a full share of the home's shelter costs (B.4-5), owns and lives in the residence (B.1), receives subsidized housing (B.2), is homeless (B.3), or pays shelter costs at least the maximum ISM (B.5); otherwise the full maximum when all shelter is provided (C.3), the maximum less what the client pays when the costs are below market value (C.1), or the lesser of the fair share and the maximum less what the client pays (C.2)."
precision: "The client's payment is shelter_cost_monthly; the fair share is home_total_shelter_costs divided by the persons living in the home (lives_with). Homeless is read from nighttime_residence_type (no fixed, regular and adequate residence). af_countable_income (CO-946) caps it at af_ism_maximum (CO-1513) and counts it only for an OAP-age or AND-CS client. Not the same figure as ssi_in_kind_support_and_maintenance (CO-802)."
derived: [case, [[">", [otherwise, ssa_in_kind_support_and_maintenance_charged, 0], 0], ssa_in_kind_support_and_maintenance_charged], [["=", shelter_costs_paid_by_others, 0], 0], [[any, [otherwise, owns_and_lives_in_home, false], lives_in_subsidized_housing, [in, nighttime_residence_type, [emergency_or_transitional_shelter, place_not_designed_for_sleeping, motel_or_hotel_for_lack_of_alternative, trailer_park_for_lack_of_alternative, campground_for_lack_of_alternative, halfway_house, abandoned_in_hospital, shared_housing_due_to_loss_or_hardship]]], 0], [[">=", [otherwise, shelter_cost_monthly, 0], af_ism_maximum], 0], [["<=", [otherwise, shelter_cost_monthly, 0], 0], af_ism_maximum], [[not, home_shelter_costs_are_market_value], ["-", af_ism_maximum, shelter_cost_monthly]], [else, [max, 0, ["-", [min, ["/", home_total_shelter_costs, [count, lives_with]], af_ism_maximum], shelter_cost_monthly]]]]
sources: [S1012]
implemented: engine
tags: [cash, income]
rationale: "Same-word audit SW-30 and dual-entry audit 2.7: in-kind support and maintenance was two supplied, already-computed amounts, one per method, whose formula the meaning spelled out. The shelter arrangement is stated in neutral facts; the SSI method's and Adult Financial's ISM are each derived by its own rule."
tests:
  - {id: CO-1512-T1, month: "2026-10", as_of: "2026-10-01", given: {shelter_costs_paid_by_others: 0}, expect: 0}
  - {id: CO-1512-T2, title: "C.3: all shelter provided", month: "2026-10", as_of: "2026-10-01", given: {shelter_costs_paid_by_others: 400, owns_and_lives_in_home: false, lives_in_subsidized_housing: false, nighttime_residence_type: fixed_regular_adequate, shelter_cost_monthly: 0}, expect: 351}
  - {id: CO-1512-T3, title: "B.6: SSA's ISM is matched", month: "2026-10", as_of: "2026-10-01", given: {ssa_in_kind_support_and_maintenance_charged: 150}, expect: 150}
  - {id: CO-1512-T4, title: "C.2: market value, pays 100 of a 300 fair share", month: "2026-10", as_of: "2026-10-01", given: {shelter_costs_paid_by_others: 200, owns_and_lives_in_home: false, lives_in_subsidized_housing: false, nighttime_residence_type: fixed_regular_adequate, shelter_cost_monthly: 100, home_shelter_costs_are_market_value: true, home_total_shelter_costs: 900, dwelling_id: h1}, others: {p2: {dwelling_id: h1}, p3: {dwelling_id: h1}}, expect: 200}
