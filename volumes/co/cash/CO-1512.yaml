  - {id: "CO-1512-T4", title: "C.2: market value, pays 100 of a 300 fair share", month: "2026-10", as_of: "2026-10-01", given: {shelter_costs_paid_by_others: 200, lives_in_subsidized_housing: false, nighttime_residence_type: fixed_regular_adequate, shelter_cost_monthly: 100, home_shelter_costs_are_market_value: true, home_total_shelter_costs: 900, dwelling_id: h1, holdings: [], ssa_in_kind_support_and_maintenance_charged: 0}, others: {p2: {dwelling_id: h1}, p3: {dwelling_id: h1}}, expect: 200}
