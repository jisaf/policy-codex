  - {id: "CO-1512-T2", title: "C.3: all shelter provided", month: "2026-10", as_of: "2026-10-01", given: {shelter_costs_paid_by_others: 400, lives_in_subsidized_housing: false, nighttime_residence_type: fixed_regular_adequate, shelter_cost_monthly: 0, holdings: [], ssa_in_kind_support_and_maintenance_charged: 0}, expect: 351}
