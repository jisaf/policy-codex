id: CO-1512
name: "Adult Financial: in-kind support and maintenance"
identifier: af_in_kind_support_and_maintenance
kind: derived
type: money
scope: person-month
program: AdultFinancial
meaning: "The In-Kind Support and Maintenance (ISM) amount for this person for the month under 9 CCR 2503-5 3.520.79: the ISM the Social Security Administration charges an SSI client (B.6); none for a client who pays a full share of the home's shelter costs (B.4-5), owns and lives in the residence (B.1), receives subsidized housing (B.2), is homeless (B.3), or pays shelter costs at least the maximum ISM (B.5); otherwise the full maximum when all shelter is provided (C.3), the maximum less what the client pays when the costs are below market value (C.1), or the lesser of the fair share and the maximum less what the client pays (C.2)."
precision: "The client's payment is shelter_cost_monthly; the fair share is home_total_shelter_costs divided by the number of people living in the home (persons_living_in_home_count, CO-7911; KL-CASH-1, below). Homeless is 3.510's definition (af_is_homeless, CO-4410; coverage review F-5): a stay in a relative's home after losing housing is not homelessness unless the person moves among a succession of friends or relatives with no permanent arrangement, so that client's ISM is computed. af_countable_income (CO-946) caps it at af_ism_maximum (CO-1513) and counts it only for an OAP-age or AND-CS client. Not the same figure as ssi_in_kind_support_and_maintenance (CO-802). Coverage review P3: a client with an established life estate whose shelter costs are provided in full has ISM calculated (3.520.79.D); the life estate is not ownership, so the case states owns_and_lives_in_home false for that client. Resource records, step H1 Adult Financial (docs/reviews/records-holdings-snap-af.md): the client owns and lives in the residence (B.1) when a home record of the client's holdings states that the client lives in it (lives_in), in place of owns_and_lives_in_home (CO-3401), which was read as no when not stated; holdings not stated, or a home that does not say, is cannot determine (decision 4) where the earlier tests of B do not settle it. Coverage pass 4 CA4-16: the ISM the Social Security Administration charges (B.6) is read for an SSI recipient (receives_ssi) and required then, and the client's shelter payment (shelter_cost_monthly) is required where the computation reaches it; neither is read as 0 when not stated (decision 4 of 2026-11-23: missing information is cannot determine unless the rule says otherwise). Coverage pass 7, F7-4 (docs/reviews/coverage7-cash.md): the fair share divides the home's shelter costs \"by the number of people living in the household\" (3.520.79.B.4, C.2), counted as the persons of the case who live in the home (lives_with, CO-1925), so a case evaluated for Adult Financial's in-kind support and maintenance lists every person who lives in the client's home as a person of the case, whether or not that person applies (docs/conventions.md rule 17, the case contract); a case that leaves a housemate out overstates the fair share. KL-CASH-1 (docs/reviews/known-limits.md, 2026-11-24): the divisor is now the neutral case fact persons_living_in_home_count (CO-7911), the number of people living in the home whether or not each is a person of the case, required where the computation reaches the fair share (decision 4 of 2026-11-23) and read nowhere else in this item; the case contract above is withdrawn for this item, and lives_with is no longer read here. A client who pays $200 of a $1,000 market-value home shared with three people who do not apply, $50 of her share paid by others, has a fair share of 1,000 / 4 = 250 and ISM min(250, 351) - 200 = $50; counted over the persons of the case alone (one), the fair share was $1,000 and the ISM min(1,000, 351) - 200 = $151."
derived: [case, [[all, receives_ssi, [">", ssa_in_kind_support_and_maintenance_charged, 0]], ssa_in_kind_support_and_maintenance_charged], [["=", shelter_costs_paid_by_others, 0], 0], [[any, [">", [sum_receipts, holdings, [all, [all, [received_in, [month]], [unknown, [receipt, disposed_date]]], ["=", [receipt, kind], home], [receipt, lives_in]], 1], 0], lives_in_subsidized_housing, af_is_homeless], 0], [[">=", shelter_cost_monthly, af_ism_maximum], 0], [["<=", shelter_cost_monthly, 0], af_ism_maximum], [[not, home_shelter_costs_are_market_value], ["-", af_ism_maximum, shelter_cost_monthly]], [else, [max, 0, ["-", [min, ["/", home_total_shelter_costs, persons_living_in_home_count], af_ism_maximum], shelter_cost_monthly]]]]
sources: [S1012, S3205]
open: [OQ-1436]
implemented: engine
tags: [cash, income]
rationale: "Same-word audit SW-30 and dual-entry audit 2.7: in-kind support and maintenance was two supplied, already-computed amounts, one per method, whose formula the meaning spelled out. The shelter arrangement is stated in neutral facts; the SSI method's and Adult Financial's ISM are each derived by its own rule."
tests:
  - {id: "CO-1512-T1", month: "2026-10", as_of: "2026-10-01", given: {shelter_costs_paid_by_others: 0, ssa_in_kind_support_and_maintenance_charged: 0}, expect: 0}
  - {id: "CO-1512-T2", title: "C.3: all shelter provided", month: "2026-10", as_of: "2026-10-01", given: {shelter_costs_paid_by_others: 400, lives_in_subsidized_housing: false, nighttime_residence_type: fixed_regular_adequate, shelter_cost_monthly: 0, holdings: [], ssa_in_kind_support_and_maintenance_charged: 0}, expect: 351}
  - {id: "CO-1512-T5", title: "F-5 (probe PR-ISM): living rent-free in her daughter's home after losing her apartment, $1,200 of household shelter costs at market value - all shelter provided, the full ISM (C.3)", month: "2026-10", as_of: "2026-10-01", given: {shelter_costs_paid_by_others: 1200, lives_in_subsidized_housing: false, nighttime_residence_type: shared_housing_due_to_loss_or_hardship, shelter_cost_monthly: 0, holdings: [], ssa_in_kind_support_and_maintenance_charged: 0, stays_with_succession_of_others_without_permanent_arrangement: false}, expect: 351}
  - {id: "CO-1512-T3", title: "B.6: SSA's ISM is matched", month: "2026-10", as_of: "2026-10-01", given: {receives_ssi: true, ssa_in_kind_support_and_maintenance_charged: 150}, expect: 150}
  # KL-CASH-1: T4 restated. The three people living in the home are stated by the case fact persons_living_in_home_count (CO-7911),
  # no longer counted from lives_with: 900 / 3 = 300; min(300, 351) = 300; 300 - 100 = 200.
  - {id: "CO-1512-T4", title: "C.2: market value, pays 100 of a 300 fair share (900 / 3 people living in the home)", month: "2026-10", as_of: "2026-10-01", given: {shelter_costs_paid_by_others: 200, lives_in_subsidized_housing: false, nighttime_residence_type: fixed_regular_adequate, shelter_cost_monthly: 100, home_shelter_costs_are_market_value: true, home_total_shelter_costs: 900, persons_living_in_home_count: 3, dwelling_id: h1, holdings: [], ssa_in_kind_support_and_maintenance_charged: 0}, others: {p2: {dwelling_id: h1}, p3: {dwelling_id: h1}}, expect: 200}
  # Resource records, step H1 Adult Financial: 3.520.79.B.1 read from the home record (S3205).
  - {id: "CO-1512-T6", title: "B.1: owns and lives in the home, others pay $400 of its costs: no ISM", month: "2026-10", as_of: "2026-10-01", given: {shelter_costs_paid_by_others: 400, lives_in_subsidized_housing: false, nighttime_residence_type: fixed_regular_adequate, shelter_cost_monthly: 0, holdings: [{kind: home, value: 90000, amount_owed: 0, lives_in: true}], ssa_in_kind_support_and_maintenance_charged: 0}, expect: 0}
  # KL-CASH-1 (9 CCR 2503-5 3.520.79.B.4.a, S1012: "Fair share is calculated by totaling shelter costs and dividing by the number of
  # people living in the household"; C.2: "the amount the client is actually paying is subtracted from the client's fair share amount
  # or the current maximum ISM amount, whichever is less"). The client is the only person of the case; four people live in the home.
  # Fair share 1,000 / 4 = 250; min(250, 351) = 250; 250 - 200 = $50. Counted over the persons of the case alone, as before:
  # min(1,000 / 1, 351) - 200 = 351 - 200 = $151.
  - {id: "CO-1512-T7", title: "KL-CASH-1: a $1,000 market-value home of four people, three of whom do not apply; she pays $200, others $50 of her share: fair share 250, ISM $50", month: "2026-10", as_of: "2026-10-01", given: {receives_ssi: false, shelter_costs_paid_by_others: 50, lives_in_subsidized_housing: false, nighttime_residence_type: fixed_regular_adequate, shelter_cost_monthly: 200, home_shelter_costs_are_market_value: true, home_total_shelter_costs: 1000, persons_living_in_home_count: 4, dwelling_id: h1, holdings: [], ssa_in_kind_support_and_maintenance_charged: 0}, expect: 50}
  # The same home of four, the client paying $240 and others $10 of her share: fair share 250; min(250, 351) - 240 = $10.
  - {id: "CO-1512-T8", title: "KL-CASH-1: she pays $240 of a 250 fair share (a $1,000 home of four): ISM $10", month: "2026-10", as_of: "2026-10-01", given: {receives_ssi: false, shelter_costs_paid_by_others: 10, lives_in_subsidized_housing: false, nighttime_residence_type: fixed_regular_adequate, shelter_cost_monthly: 240, home_shelter_costs_are_market_value: true, home_total_shelter_costs: 1000, persons_living_in_home_count: 4, dwelling_id: h1, holdings: [], ssa_in_kind_support_and_maintenance_charged: 0}, expect: 10}
  # Decision 4: the number of people living in the home not stated, where the computation reaches the fair share: cannot determine.
  - {id: "CO-1512-T9", title: "KL-CASH-1, decision 4: the number of people in the home not stated, the fair share reached: cannot determine", month: "2026-10", as_of: "2026-10-01", given: {receives_ssi: false, shelter_costs_paid_by_others: 50, lives_in_subsidized_housing: false, nighttime_residence_type: fixed_regular_adequate, shelter_cost_monthly: 200, home_shelter_costs_are_market_value: true, home_total_shelter_costs: 1000, dwelling_id: h1, holdings: [], ssa_in_kind_support_and_maintenance_charged: 0}, expect: unknown}
  # Not read where the fair share is not reached: below market value (C.1), 351 - 200 = $151 with the number unstated.
  - {id: "CO-1512-T10", title: "KL-CASH-1: below market value (C.1) the number of people is not read: 351 - 200 = 151", month: "2026-10", as_of: "2026-10-01", given: {receives_ssi: false, shelter_costs_paid_by_others: 50, lives_in_subsidized_housing: false, nighttime_residence_type: fixed_regular_adequate, shelter_cost_monthly: 200, home_shelter_costs_are_market_value: false, home_total_shelter_costs: 1000, dwelling_id: h1, holdings: [], ssa_in_kind_support_and_maintenance_charged: 0}, expect: 151}
