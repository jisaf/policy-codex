id: CO-1217
name: "Home Care Allowance: eligibility status"
identifier: af_hca_eligibility_status
kind: derived
type: one of
options: [eligible, ineligible_deceased, ineligible_age, ineligible_residency, ineligible_setting, ineligible_hcbs, ineligible_functional, ineligible_sanction, ineligible_financial]
scope: person-month
program: AdultFinancial
role: outcome
meaning: The person's Home Care Allowance eligibility for the month, checked in order - age five or older, Colorado residency, living in a home rather than a facility, not receiving and not functionally eligible for HCBS, an HCA tier, then the financial routes - eligible only if every check passes, per 9 CCR 2503-5 3.520.61.B, 3.570.11.A, 3.570.12 ("Home"), 3.570.13 and 3.570.14.D.
precision: "'\"Home\" (3.570.12) is a non-facility residence and \"cannot include a homeless shelter or other temporary setting\"; this item reads snap_resides_in_institution_providing_meals for a facility stay and af_hca_lives_in_shelter_or_temporary_setting (CO-037) for a shelter (phase-8 fix round, S-5); another temporary setting is af_hca_lives_in_shelter_or_temporary_setting (CO-2010). Functional eligibility for HCBS bars HCA at application and at reassessment, except during the stay of up to three months while a transition delayed outside the client's control is completed (3.570.11.A.2.b, af_hca_is_in_hcbs_transition_period, CO-2009); both facts are read as false when a case does not state them.' Vocabulary fix round (docs/reviews/vocabulary-reuse.md, R-8): reads resides_in_medical_institution (CO-1742), not SNAP's majority-of-meals institution fact. Coverage review F-1: a client out of State on a temporary basis is discontinued on day thirty-one (3.570.17.C.8.b): more than af_hca_absence_max_days days from temporarily_out_of_state_start_date (CO-3806) to the determination date; the general presumptions of 3.520.64.E are in af_meets_residency. P2-4: a stay in a hospital or other long-term care facility ends HCA when it continues thirty days or more (C.4.b): from institution_entry_date, or sooner when the stay is expected to last that long (expects_institutional_stay_of_thirty_days, read as false when not stated); with no entry date stated the stay is read as ending HCA, as before. Coverage review 2, G-3: \"Home\" is a non-facility residence (3.570.12), and 3.510 makes a facility any residence whose intent is care or treatment (\"hospitals, nursing homes, regional centers, group and host homes, and mental health institutions\"); C.7 discontinues a client \"residing anywhere other than his OR her home\". So every residence_setting_type other than private_dwelling, room_and_board and commercial_property (the person's own non-facility residence) is ineligible_setting at once (C.4.a, C.7), assisted living, group and host homes and treatment centres included; the thirty-day reading of C.4.b, with C.7.a's medical leave, is kept only for a stay in a medical institution or a stay away from a home the client keeps for medical treatment (temporary_absence_reason medical_treatment). An unstated setting is read as the home. The forty-two days of combined medical and non-medical leave in the twelve months from approval (C.7.b) are af_hca_combined_leave_days_in_approval_year (CO-4728) against af_hca_combined_leave_max_days (CO-4729), read as 0 when not stated; the start of payment after the approval month (3.570.13.F) is in af_hca_grant (CO-1219). G-4: a client who died before the month is ineligible_deceased (3.570.17.C.10, \"effective the day after the client's date of death\"; 3.581.C.1-2); the month of death keeps its payment. F-14: an Adult Financial IPV disqualification or EBT-misuse ineligibility period (CO-4447, CO-4448) is ineligible_sanction. Time audit T-6: \"N consecutive days\" is counted as the days elapsed since the day the absence or stay began (days_between), the day of departure or entry itself not counted (OQ-953): the Home Care Allowance's absence and expected institutional stay of af_hca_absence_max_days: the days elapsed since the day of departure or entry."
derived: [case, [[all, [not, [unknown, date_of_death]], ["<", date_of_death, [first_day, [month]]]], ineligible_deceased], [[<, age, af_hca_min_age], ineligible_age], [[any, [not, af_meets_residency], [all, [not, [unknown, temporarily_out_of_state_start_date]], [">", [days_between, temporarily_out_of_state_start_date, [det_date]], af_hca_absence_max_days]]], ineligible_residency], [[any, [all, [any, [otherwise, resides_in_medical_institution, false], [otherwise, [not, [in, residence_setting_type, [private_dwelling, room_and_board, commercial_property]]], false]], [not, [all, [any, [otherwise, resides_in_medical_institution, false], ["=", [otherwise, temporary_absence_reason, none], medical_treatment]], [not, [otherwise, [any, [otherwise, expects_institutional_stay_of_thirty_days, false], [">=", [days_between, institution_entry_date, [det_date]], af_hca_absence_max_days]], true]]]]], af_hca_lives_in_shelter_or_temporary_setting, [">", [otherwise, af_hca_combined_leave_days_in_approval_year, 0], af_hca_combined_leave_max_days]], ineligible_setting], [[any, receives_hcbs_services, [all, af_hca_functionally_eligible_for_hcbs, [not, [otherwise, af_hca_is_in_hcbs_transition_period, false]]]], ineligible_hcbs], [["=", af_hca_tier, none], ineligible_functional], [[any, [otherwise, af_is_serving_ipv_disqualification, false], [otherwise, af_is_in_ebt_misuse_ineligibility_period, false]], ineligible_sanction], [[not, af_hca_financially_eligible], ineligible_financial], [else, eligible]]
sources: [S711, S712, S714, S716, S717, S718, S3202, S3214, S3215, S3501, S3502, S3503]
open: [OQ-953]
implemented: engine
tags: [cash, disability, hcbs]
rationale: Phase-8 fix round (S-5) - the setting test also reads af_hca_lives_in_shelter_or_temporary_setting, since 3.570.12 excludes a homeless shelter from "home" and the volume already carries the fact. No existing item determines Home Care Allowance eligibility; the program is new to the volume with the current 9 CCR 2503-5 (D-80). Declared as an outcome; same case shape as cw_eligibility_status (CO-921), for a different program.
nearest: [CO-921]
