id: CO-1217
name: "Home Care Allowance: eligibility status"
identifier: af_hca_eligibility_status
kind: derived
type: one of
options: [eligible, ineligible_age, ineligible_residency, ineligible_setting, ineligible_hcbs, ineligible_functional, ineligible_financial]
scope: person-month
program: AdultFinancial
role: outcome
meaning: The person's Home Care Allowance eligibility for the month, checked in order - age five or older, Colorado residency, living in a home rather than a facility, not receiving and not functionally eligible for HCBS, an HCA tier, then the financial routes - eligible only if every check passes, per 9 CCR 2503-5 3.520.61.B, 3.570.11.A, 3.570.12 ("Home"), 3.570.13 and 3.570.14.D.
precision: '"Home" (3.570.12) is a non-facility residence; this item reads in_medical_institution for a facility stay and does not separately test a homeless shelter or other temporary setting (OQ-250). Functional eligibility for HCBS bars HCA at application and at reassessment; the three-month transition at reassessment is not modeled (OQ-250).'
derived: [case, [[<, age, af_hca_min_age], ineligible_age], [[not, af_meets_residency], ineligible_residency], [in_medical_institution, ineligible_setting], [[any, receives_hcbs_services, af_hca_functionally_eligible_for_hcbs], ineligible_hcbs], [[=, af_hca_tier, none], ineligible_functional], [[not, af_hca_financially_eligible], ineligible_financial], [else, eligible]]
sources: [S711, S712, S714, S716, S717, S718]
open: [OQ-250]
implemented: engine
tags: [cash, disability, hcbs]
rationale: No existing item determines Home Care Allowance eligibility; the program is new to the volume with the current 9 CCR 2503-5 (D-80). Declared as an outcome; same case shape as cw_eligibility_status (CO-921), for a different program.
nearest: [CO-921]
tests:
  - {id: CO-1217-T1, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "2023-01-01"}, expect: ineligible_age}
  - {id: CO-1217-T2, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "1960-01-01", state_of_residence: "CO", is_fleeing_felon_or_probation_violator: false, in_medical_institution: true}, expect: ineligible_setting}
  - {id: CO-1217-T3, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "1960-01-01", state_of_residence: "CO", is_fleeing_felon_or_probation_violator: false, in_medical_institution: false, receives_hcbs_services: false, meets_nursing_facility_level_of_care: true, meets_hcbs_waiver_target_group: ebd}, expect: ineligible_hcbs}
  - {id: CO-1217-T4, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "1960-01-01", state_of_residence: "CO", is_fleeing_felon_or_probation_violator: false, in_medical_institution: false, receives_hcbs_services: false, meets_nursing_facility_level_of_care: false, meets_hcbs_waiver_target_group: none, hca_functional_capacity_score: 15, hca_need_for_paid_care_score: 10}, expect: ineligible_functional}
  - {id: CO-1217-T5, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "1960-01-01", state_of_residence: "CO", is_fleeing_felon_or_probation_violator: false, in_medical_institution: false, receives_hcbs_services: false, meets_nursing_facility_level_of_care: false, meets_hcbs_waiver_target_group: none, hca_functional_capacity_score: 24, hca_need_for_paid_care_score: 30, af_hca_financially_eligible: false}, expect: ineligible_financial}
  - {id: CO-1217-T6, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "1960-01-01", state_of_residence: "CO", is_fleeing_felon_or_probation_violator: false, in_medical_institution: false, receives_hcbs_services: false, meets_nursing_facility_level_of_care: false, meets_hcbs_waiver_target_group: none, hca_functional_capacity_score: 24, hca_need_for_paid_care_score: 30, receives_ssi: true}, expect: eligible}
  - {id: CO-1217-T7, as_of: "2026-10-01", month: "2026-10", given: {date_of_birth: "1960-01-01", state_of_residence: "WY", is_fleeing_felon_or_probation_violator: false}, expect: ineligible_residency}
