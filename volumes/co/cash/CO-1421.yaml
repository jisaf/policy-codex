id: CO-1421
name: "Colorado Works: requires verification of household composition"
identifier: cw_requires_verification_of_household_composition
kind: derived
type: yes/no
scope: person-month
program: ColoradoWorks
meaning: "Whether the person's relationship to the unit's children must be verified for Colorado Works: a caretaker of a dependent child who is not the child's parent must verify the caretaker responsibility, and any relationship is verified when questionable."
precision: "Same-word audit SW-3/SW-4 (OQ-396): the caretaker relation is cw_caretaker_of (CO-2608): a parent, or a non-parent caretaker who is the child's legal guardian or has primary responsibility for the child (3.601); the spouse of a parent who is not a parent stays the optional member of 3.604.2.C.2.a, read from the spouse and parent roles as the rule words it. Duplicate-paths audit D-W1 (P1, fixed 2026-11-23, docs/reviews/records-earnings-cash.md): the caretaker who is not the child's parent is read from Colorado Works' caretaker definition (cw_caretaker_of, CO-2608, as cw_has_dependent_child, CO-902, reads it): a person who is the caretaker of a dependent child in the home who is not the person's own child, and not the parent of any dependent child in the home (a parent who cares only for the parent's own children is never asked whether they are dependent children here), as cw_is_optional_assistance_unit_member (CO-2349) reads it; before, both read the raw legal_guardian and has_primary_responsibility_for roles, so an unrelated adult with primary responsibility for a child whose parent is in the home, who is not a caretaker (3.601, 3.604.2.H), had to verify a caretaker responsibility the eligibility rules do not give."
derived: [any, [all, [exists, cw_caretaker_of, [all, [not, [rel, [parent], [P]]], [of, [P], cw_is_dependent_child]]], [not, [exists, cw_caretaker_of, [all, [rel, [parent], [P]], [of, [P], cw_is_dependent_child]]]]], household_composition_attestation_is_questionable]
sources: [S872, S874]
implemented: engine
tags: [verification, cash, tanf, household]
rationale: No existing item states this Colorado Works verification requirement; the phase-9 chapter needs it to count the unit's pending verifications.
tests:
  - {id: CO-1421-T1, month: "2026-10", as_of: "2026-10-01", given: {household_composition_attestation_is_questionable: false}, others: {p2: {date_of_birth: "2015-01-01"}}, relationships: [[has_primary_responsibility_for, p1, p2]], expect: true}
  - {id: CO-1421-T2, month: "2026-10", as_of: "2026-10-01", given: {household_composition_attestation_is_questionable: false}, others: {p2: {date_of_birth: "2015-01-01"}}, relationships: [[parent, p1, p2]], expect: false}
  - {id: CO-1421-T3, month: "2026-10", as_of: "2026-10-01", given: {household_composition_attestation_is_questionable: true}, relationships: [], expect: true}
  # Duplicate-paths audit D-W1 (scripts/audit/duplicate-paths-households.yaml, CW-caretaker-parent-home).
