id: CO-1421
name: "Colorado Works: requires verification of household composition"
identifier: cw_requires_verification_of_household_composition
kind: derived
type: yes/no
scope: person-month
program: ColoradoWorks
meaning: "Whether the person's relationship to the unit's children must be verified for Colorado Works: a caretaker of a dependent child who is not the child's parent must verify the caretaker responsibility, and any relationship is verified when questionable."
derived: [any, [all, [exists_related, [caretaker], [of, [P], cw_is_dependent_child]], [not, [exists_related, [parent], [of, [P], cw_is_dependent_child]]]], household_composition_attestation_is_questionable]
sources: [S872, S874]
implemented: engine
tags: [verification, cash, tanf, household]
rationale: No existing item states this Colorado Works verification requirement; the phase-9 chapter needs it to count the unit's pending verifications.
