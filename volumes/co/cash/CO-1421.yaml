  - {id: CO-1421-T2, month: "2026-10", as_of: "2026-10-01", given: {household_composition_attestation_is_questionable: false}, others: {p2: {date_of_birth: "2015-01-01"}}, relationships: [[parent, p1, p2]], expect: false}
