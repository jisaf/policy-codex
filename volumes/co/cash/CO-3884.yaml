id: CO-3884
name: "Adult Financial: spouse's income verifications pending"
identifier: af_spouse_income_pending_verification_count
kind: derived
type: whole number
scope: person-month
program: AdultFinancial
meaning: "The number of income verification elements still pending for the spouse in the home of this Adult Financial client: for each such spouse, one for unverified earned income and one for unverified unearned income (9 CCR 2503-5 3.520.5.A.3: \"Prior to approval of grant payments, the county department shall, at a minimum, verify potential income or unemployment benefits for the client, client's spouse, and sponsor(s)\")."
precision: "A spouse is in the home as af_deemed_relative_income (CO-2384) reads it: a spouse edge, and living together where dwelling_id is stated. The spouse's income is verified whether or not 3.534.C, 3.544.F or 3.549.F then exempt it from deeming, since the exemption turns on that income. A sponsor's income is the sponsor element (CO-1672). Pattern sweep (cash) PS-M1 and PS-D7 (docs/reviews/pattern-sweep-cash.md): the spouse of the month (af_spouses_in_month, CO-7603), wherever the spouse lives: the spouse's income is deemed wherever the spouse lives (3.534; af_deemed_relative_income, CO-2384), so it is verified wherever the spouse lives too (3.520.5); before, a spouse living elsewhere was left out by a lives_with test, read as living together when unstated. Coverage pass 7, F7-2 (docs/reviews/coverage7-cash.md): a married client whose spouse is not a person of the case in the month (af_spouse_is_outside_case_in_month, CO-7690) cannot be determined here: the spouse's income and its verification are not stated (decision 4 of 2026-11-23), as for a sponsor outside the case (PS-M3) and the non-MAGI couple (F6-7, CO-643). Before, they were read as none."
derived: [case, [[not, af_spouse_is_outside_case_in_month], [sum, af_spouses_in_month, [+, [case, [[of, [P], af_earned_income_is_unverified], 1], [else, 0]], [case, [[of, [P], af_unearned_income_is_unverified], 1], [else, 0]]]]]]
sources: [S880, S1632]
implemented: engine
tags: [cash, verification]
rationale: "Final cash review FC-12 and final verification review V-2 (and V-9): af_pending_verification_count (CO-1436) read only the client's own elements, so a deemed spouse's income was pending only if the spouse was also of OAP age or disabled; it now adds this count."
tests:
  - {id: CO-3884-T1, title: "Wife of an OAP client earns $900 with no pay stubs", as_of: "2026-10-01", month: "2026-10", given: {}, others: {p2: {af_earned_income_is_unverified: true, af_unearned_income_is_unverified: false}}, relationships: [[spouse, p1, p2]], expect: 1}
  - {id: CO-3884-T2, title: "Unmarried client", as_of: "2026-10-01", month: "2026-10", given: {marital_status: single}, relationships: [], expect: 0}
  - {id: CO-3884-T3, title: "F7-2: a married client whose spouse is not a person of the case: cannot determine", as_of: "2026-10-01", month: "2026-10", given: {marital_status: married}, relationships: [], expect: unknown}
