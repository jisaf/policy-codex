id: CO-5130
name: "Adult Financial: pay received in the month"
identifier: af_earned_pay
kind: derived
type: money
scope: person-month
program: AdultFinancial
meaning: "The pay this person received in the month for services performed as an employee, as 9 CCR 2503-5 3.520.782 counts it: the earnings records (earnings, CO-5100) received in the month whose kind Adult Financial's earnings table (af_earnings_treatment_table, CO-5103) counts as pay, gross monetary wages (3.520.782.A) at their amount, in-kind pay and an employer's payment of a household expense as part of the person's pay at the value of the item supplied (3.510 \"Earned Income\", 3.520.782.B), a difficulty of care payment that is not a foster care payment (3.520.786.M), and special pay stated as combat-zone pay (combat_zone, OQ-1140); pay under contract employment at one twelfth of the contract's yearly pay (annual_contract_pay; 3.520.781.G.2.b, af_annual_contract_months); and a pay stated as a stream (no month, no date) only in the months from the month its job began through the month it ended (job_start_date, job_end_date; 3.520.781.G: income \"countable in the month it is actually received\"). A business's receipts, boarder payments and costs are counted elsewhere (af_self_employment_net_profit, CO-1708; af_boarder_income, CO-5131); exempt pay (work-study, 37 U.S.C. 310 special pay) is not counted (3.520.786)."
precision: "Earned-income records, step E1 Adult Financial (docs/reviews/records-earnings-cash.md). The same for the client, the client's spouse and the sponsor(s) (3.520.782.B.2 names all three). A record that recurs (no month and no date) is received in every month; a pay received once is placed by its month or date. The exemptions that turn on a field of the pay (a PASS set-aside, 3.520.786.I; infrequent or irregular pay, O) are taken off by af_excluded_earned_income (CO-2342). An unstated earnings list is cannot determine (product-owner decision 4 of 2026-11-23); a stated empty list is no pay. Coverage pass 4 (docs/reviews/coverage4-cash.md): CA4-6, the employer's vendor payment is counted by the table (it was not counted for want of a rule); CA4-7, a difficulty of care payment stated as foster care (foster_care) is exempt, as LEAP and CCCAP read it; CA4-8, a record that states annual_contract_pay is read at one twelfth of it in place of its amount, as SNAP (CO-5113) and CCCAP (CO-5152) read it, so the months of the year without contract pay count the twelfth too; CA4-9, a stream is counted only in the months its job's dates cover (a stream with no job dates began before and continues through the months the case covers, CO-5100), so the pay of a job that ended before the month, or begins after it, is not counted; a pay stated with its month or date is counted in that month, a final pay after the job ended included."
derived: [sum_receipts, earnings, [all, [received_in, [month]], [any, [in, [lookup, af_earnings_treatment_table, [receipt, kind]], [counted, counted_no_rule_excludes, counted_at_value]], [all, ["=", [lookup, af_earnings_treatment_table, [receipt, kind]], counted_unless_foster_care], [not, [receipt, foster_care]]], [all, ["=", [lookup, af_earnings_treatment_table, [receipt, kind]], excluded_except_combat_zone], [receipt, combat_zone]]], [any, [not, [unknown, [receipt, month]]], [all, [any, [unknown, [receipt, job_start_date]], ["<=", [month_of, [receipt, job_start_date]], [month]]], [any, [unknown, [receipt, job_end_date]], [">=", [month_of, [receipt, job_end_date]], [month]]]]]], [case, [[not, [unknown, [receipt, annual_contract_pay]]], ["/", [receipt, annual_contract_pay], af_annual_contract_months]], [else, [receipt, amount]]]]
sources: [S3211, S2206, S2608, S2803, S4790, S4792, S2609]
implemented: engine
tags: [cash, oap, and, income]
rationale: "Earned-income records, step E1 Adult Financial: the pay part of af_gross_earned_income (CO-3830), which read wages_gross and in_kind_compensation_value and subtracted the parts of wages_gross the rule exempts; the counting table now decides each kind, so no part is stated twice and none is counted by silence."
nearest: [CO-5017]
tests:
  # Hand computations from 3.520.782.A-B (S3211) and 3.520.786.H (S2206), K with 20 CFR 416.1124(c)(19) (S2803).
  - {id: CO-5130-T1, month: "2026-10", as_of: "2026-10-01", title: "$465 of wages, $100 of work-study and $200 of free rent for building maintenance: 465 + 200 = 665 (work-study is exempt, H)", given: {earnings: [{kind: wages, amount: 465}, {kind: work_study, amount: 100}, {kind: in_kind_pay, amount: 200}]}, expect: 665}
  - {id: CO-5130-T2, month: "2026-10", as_of: "2026-10-01", title: "$150 of hostile fire pay (37 U.S.C. 310) is exempt; $300 stated as combat-zone pay is counted as wages (OQ-1140): 300", given: {earnings: [{kind: uniformed_services_special_pay, amount: 150}, {kind: uniformed_services_special_pay, amount: 300, combat_zone: true}]}, expect: 300}
  - {id: CO-5130-T3, month: "2026-10", as_of: "2026-10-01", title: "A business's receipts and its costs are not pay; a $300 bonus paid in September is not October's: 0", given: {earnings: [{kind: self_employment_receipts, amount: 1500}, {kind: business_cost_operating, amount: 400}, {kind: wages, amount: 300, frequency: once, month: "2026-09"}]}, expect: 0}
  - {id: CO-5130-T4, month: "2026-10", as_of: "2026-10-01", title: "Earnings not stated: cannot determine (decision 4)", given: {}, expect: unknown}
  - {id: CO-5130-T5, month: "2026-10", as_of: "2026-10-01", title: "Earnings stated empty: no pay", given: {earnings: []}, expect: 0}
  - {id: CO-5130-T6, month: "2026-10", as_of: "2026-10-01", title: "Wages from a WIOA on-the-job training job and Census wages, counted because no Adult Financial rule exempts them (3.520.782.A): 400 + 250 = 650", given: {earnings: [{kind: wioa_on_the_job_training, amount: 400}, {kind: decennial_census_employment, amount: 250}]}, expect: 650}
