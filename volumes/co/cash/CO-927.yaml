id: CO-927
name: "Colorado Works: unit child count"
identifier: cw_unit_child_count
kind: derived
type: whole number
scope: person-month
program: ColoradoWorks
meaning: The number of dependent children of the month (cw_is_dependent_child_in_month, CO-6807) in this person's assistance unit in the month, other than a minor parent assisted as an adult (9 CCR 2503-6 3.604.2.N.2.c, cw_minor_parent_is_assisted_as_adult, CO-4352; coverage review CW-2), for selecting the column of 9 CCR 2503-6 3.606.1.F's Standards of Assistance Chart (Number of Children 0 through 10, plus "Each Additional Child").
derived: ["count", ["filter", "cw_assistance_unit_members_for_size", ["all", ["of", ["P"], "cw_is_dependent_child_in_month"], ["not", ["of", ["P"], "cw_minor_parent_is_assisted_as_adult"]]]]]
precision: "Coverage pass 6 CA6-4 (docs/reviews/coverage6-cash.md, probe W3): per month, from the month's members and each one's dependent child test of the month; before, a person-scope count read a dependent child in some month, so a daughter who turned 18 before October 1 was a second child in October (one caretaker and two children, $620, where 3.606.1.F gives one caretaker and one child, $488)."
sources: [S414, S1004, S3153]
implemented: engine
tags: [cash, tanf, household]
rationale: "Phase-10 sweep (OQ-143): counts cw_assistance_unit_members_for_size (CO-2351), which leaves out a disqualified or ineligible member as 3.604.2.M requires (S1004). No existing item counts a Colorado Works unit's dependent children alone (cw_unit_size, CO-903, the acknowledged nearest same-shape item, counts every member); cw_need_standard (CO-911) and cw_grant_standard (CO-912) need this narrower count to key 3.606.1.F's 'Number of Children' columns under the fix-round C-5 finding, since unit size (children plus caretakers) is not the chart's key."
nearest: [CO-903]
