id: CO-927
name: "Colorado Works: unit child count"
identifier: cw_unit_child_count
kind: derived
type: whole number
scope: person
program: ColoradoWorks
meaning: The number of dependent children in this person's assistance unit, other than a minor parent assisted as an adult (9 CCR 2503-6 3.604.2.N.2.c, cw_minor_parent_is_assisted_as_adult, CO-4352; coverage review CW-2), for selecting the column of 9 CCR 2503-6 3.606.1.F's Standards of Assistance Chart (Number of Children 0 through 10, plus "Each Additional Child").
derived: [count, [filter, cw_assistance_unit_members_for_size, [all, [of, [P], cw_is_dependent_child], [not, [of, [P], cw_minor_parent_is_assisted_as_adult]]]]]
sources: [S414, S1004, S3153]
implemented: engine
tags: [cash, tanf, household]
rationale: "Phase-10 sweep (OQ-143): counts cw_assistance_unit_members_for_size (CO-2351), which leaves out a disqualified or ineligible member as 3.604.2.M requires (S1004). No existing item counts a Colorado Works unit's dependent children alone (cw_unit_size, CO-903, the acknowledged nearest same-shape item, counts every member); cw_need_standard (CO-911) and cw_grant_standard (CO-912) need this narrower count to key 3.606.1.F's 'Number of Children' columns under the fix-round C-5 finding, since unit size (children plus caretakers) is not the chart's key."
nearest: [CO-903]
tests:
  - {id: CO-927-T1, as_of: "2026-10-01", given: {cw_is_disqualified_member: false, meets_public_assistance_citizenship_requirement: true, date_of_birth: "1990-01-01", cw_is_head_of_assistance_unit: true, receives_ssi: false, cw_receives_title_iv_foster_adoption_kinship_payment: false}, others: {p2: {cw_is_disqualified_member: false, meets_public_assistance_citizenship_requirement: true, date_of_birth: "1992-01-01", cw_is_head_of_assistance_unit: false, receives_ssi: false, cw_receives_title_iv_foster_adoption_kinship_payment: false}, p3: {cw_is_disqualified_member: false, meets_public_assistance_citizenship_requirement: true, date_of_birth: "2015-06-01", receives_ssi: false, cw_receives_title_iv_foster_adoption_kinship_payment: false}}, relationships: [[parent, p1, p3], [parent, p2, p3]], expect: 1}
  - {id: CO-927-T2, as_of: "2026-10-01", given: {cw_is_disqualified_member: false, meets_public_assistance_citizenship_requirement: true, date_of_birth: "1990-01-01", cw_is_head_of_assistance_unit: true, receives_ssi: false, cw_receives_title_iv_foster_adoption_kinship_payment: false}, relationships: [], expect: 0}
