id: CO-3854
name: "Adult Financial: countable cash value of life insurance"
identifier: af_life_insurance_countable_cash_value
kind: derived
type: money
scope: person
program: AdultFinancial
meaning: "The part of this person's life insurance cash surrender value that Adult Financial counts when the total face value of the client's and spouse's policies is more than $1,500 (9 CCR 2503-5 3.520.75): for a client who is not of OAP age, the whole cash surrender value; for OAP (E-F), the whole cash surrender value if any policy of the client or spouse was bought within the last af_oap_life_insurance_lookback_months months; otherwise only the money contributed within those months, plus this person's share of the combined cash surrender value over af_oap_life_insurance_cash_value_cap, never more than the cash surrender value."
precision: "The look-back is counted in calendar months from the determination month (a policy bought in the month forty-eight months before it is within the look-back). The combined cash value adds the spouse's in the home; the excess over the cap is divided between the spouses in proportion to their cash values, so the couple's countable excess is the excess. A spouse who owns no policy with a cash value states no purchase date."
derived: [case, [[not, af_is_oap_age], [otherwise, life_insurance_cash_surrender_value, 0]], [["=", [otherwise, life_insurance_cash_surrender_value, 0], 0], 0], [[any, [">=", [month_of, life_insurance_newest_policy_purchase_date], [months_before, af_oap_life_insurance_lookback_months, [det_month]]], [exists, [filter, [persons], [all, [otherwise, [rel, [spouse], [P]], false], [otherwise, [in_group, [P], lives_with], true]]], [all, [">", [otherwise, [of, [P], life_insurance_cash_surrender_value], 0], 0], [">=", [month_of, [of, [P], life_insurance_newest_policy_purchase_date]], [months_before, af_oap_life_insurance_lookback_months, [det_month]]]]]], life_insurance_cash_surrender_value], [else, [min, life_insurance_cash_surrender_value, [+, life_insurance_payments_in_lookback, [case, [[">", [+, life_insurance_cash_surrender_value, [sum, [filter, [persons], [all, [otherwise, [rel, [spouse], [P]], false], [otherwise, [in_group, [P], lives_with], true]]], [otherwise, [of, [P], life_insurance_cash_surrender_value], 0]]], af_oap_life_insurance_cash_value_cap], ["*", ["-", [+, life_insurance_cash_surrender_value, [sum, [filter, [persons], [all, [otherwise, [rel, [spouse], [P]], false], [otherwise, [in_group, [P], lives_with], true]]], [otherwise, [of, [P], life_insurance_cash_surrender_value], 0]]], af_oap_life_insurance_cash_value_cap], ["/", life_insurance_cash_surrender_value, [+, life_insurance_cash_surrender_value, [sum, [filter, [persons], [all, [otherwise, [rel, [spouse], [P]], false], [otherwise, [in_group, [P], lives_with], true]]], [otherwise, [of, [P], life_insurance_cash_surrender_value], 0]]]]]], [else, 0]]]]]]
sources: [S2618]
implemented: engine
tags: [cash, oap, resources]
rationale: "Final cash review FC-8: af_person_countable_resources (CO-3400) counted the whole cash surrender value of life insurance over $1,500 face value, though 9 CCR 2503-5 3.520.75.E-F (S2618) exempt it for an OAP client whose policies are more than forty-eight months old, and it never counted revocable burial funds or excess burial spaces, which 3.520.72.B.8-9 (S2619) count. The reviewer's case: an OAP client with an old $10,000 policy worth $5,000 was denied on resources, though E.1 exempts it."
tests:
  - {id: CO-3854-T1, title: "OAP client, a $10,000 policy bought in 2010 worth $5,000, no payments in 48 months: exempt (E.1)", as_of: "2026-10-01", given: {af_is_oap_age: true, life_insurance_cash_surrender_value: 5000, life_insurance_newest_policy_purchase_date: "2010-03-01", life_insurance_payments_in_lookback: 0}, relationships: [], expect: 0}
  - {id: CO-3854-T2, title: "The same policy with $1,200 of premiums paid in 48 months: $1,200 counted (E.2)", as_of: "2026-10-01", given: {af_is_oap_age: true, life_insurance_cash_surrender_value: 5000, life_insurance_newest_policy_purchase_date: "2010-03-01", life_insurance_payments_in_lookback: 1200}, relationships: [], expect: 1200}
  - {id: CO-3854-T3, title: "A policy bought in 2024: the whole cash value counts (E.3)", as_of: "2026-10-01", given: {af_is_oap_age: true, life_insurance_cash_surrender_value: 5000, life_insurance_newest_policy_purchase_date: "2024-01-15"}, relationships: [], expect: 5000}
  - {id: CO-3854-T4, title: "AND-SO client: the whole cash value counts (E-F are OAP only)", as_of: "2026-10-01", given: {af_is_oap_age: false, life_insurance_cash_surrender_value: 5000}, relationships: [], expect: 5000}
  - {id: CO-3854-T5, title: "OAP client, old policies worth $260,000: $10,000 over the cap counts (F.1)", as_of: "2026-10-01", given: {af_is_oap_age: true, life_insurance_cash_surrender_value: 260000, life_insurance_newest_policy_purchase_date: "2000-01-01", life_insurance_payments_in_lookback: 0}, relationships: [], expect: 10000}
