id: CO-1215
name: "Home Care Allowance: financially eligible"
identifier: af_hca_financially_eligible
kind: derived
type: yes/no
scope: person-month
program: AdultFinancial
meaning: Whether the person meets one of the three Home Care Allowance financial routes - approved for SSI, meets every AND-SO criterion, or has received both OAP and HCA continuously since December 31, 2013 - per 9 CCR 2503-5 3.570.13.B.
precision: "\"Approved for SSI\" is read as receives_ssi. The grandfathered route (3.570.13.B.3, receiving both OAP and HCA as of December 31, 2013) also requires the person to have been of OAP age (60, af_oap_age) on that date, so a supplied grandfather flag cannot contradict the person's date of birth (phase-8 fix round, C-1). The date is af_hca_grandfathering_date (CO-2600). Coverage pass 7, F7-5 (docs/reviews/coverage7-cash.md): B.3's \"remain continuously eligible for both benefits\" is read, for the month evaluated, from the month's own OAP determination (af_category, CO-953, oap), not from the grandfathering flag alone, which states the history (receiving both on December 31, 2013 and continuously eligible for both up to the months evaluated); continuity of HCA is the HCA determination itself. Before, a grandfathered client whose income had risen above the OAP standard kept the route on the flag (probe H1: af_category none, af_hca_grant $977, where the text gives $0)."
derived: [any, receives_ssi, af_and_so_eligible, [all, received_oap_and_hca_grandfathered, [">=", [years_between, date_of_birth, af_hca_grandfathering_date], af_oap_age], ["=", af_category, oap]]]
sources: [S700, S714]
implemented: engine
tags: [cash, and, income]
rationale: Phase-8 fix round (C-1) - the grandfathered route is guarded by age on 2013-12-31. No existing item states the HCA financial test; af_hca_eligibility_status (CO-1217) needs it.
tests:
  - {id: CO-1215-T1, as_of: "2026-10-01", month: "2026-10", given: {receives_ssi: true}, expect: true}
  - {id: CO-1215-T2, as_of: "2026-10-01", month: "2026-10", given: {receives_ssi: false, af_and_so_eligible: true}, expect: true}
  - {id: CO-1215-T3, as_of: "2026-10-01", month: "2026-10", given: {receives_ssi: false, af_and_so_eligible: false, received_oap_and_hca_grandfathered: true, date_of_birth: "1950-03-02", af_category: oap}, expect: true}
  - {id: CO-1215-T4, as_of: "2026-10-01", month: "2026-10", given: {receives_ssi: false, af_and_so_eligible: false, received_oap_and_hca_grandfathered: false}, expect: false}
  - {id: CO-1215-T5, title: "C-1 - grandfather flag stated for a person who was 53 on 2013-12-31, too young for OAP then", as_of: "2026-10-01", month: "2026-10", given: {receives_ssi: false, af_and_so_eligible: false, received_oap_and_hca_grandfathered: true, date_of_birth: "1960-03-02"}, expect: false}
  # Coverage pass 7 F7-5 (H1): the same grandfathered client, 63 on 2013-12-31, whose October OAP determination is none (countable income 1,480 >= the OAP standard 1,032): the third route fails in October.
  - {id: CO-1215-T6, title: "F7-5 (H1): a grandfathered client not eligible for OAP in the month does not meet B.3", as_of: "2026-10-01", month: "2026-10", given: {receives_ssi: false, af_and_so_eligible: false, received_oap_and_hca_grandfathered: true, date_of_birth: "1950-03-02", af_category: none}, expect: false}
