id: CO-1215
name: "Home Care Allowance: financially eligible"
identifier: af_hca_financially_eligible
kind: derived
type: yes/no
scope: person-month
program: AdultFinancial
meaning: Whether the person meets one of the three Home Care Allowance financial routes - approved for SSI, meets every AND-SO criterion, or has received both OAP and HCA continuously since December 31, 2013 - per 9 CCR 2503-5 3.570.13.B.
precision: '"Approved for SSI" is read as receives_ssi.'
derived: [any, receives_ssi, af_and_so_eligible, received_oap_and_hca_grandfathered]
sources: [S714]
implemented: engine
tags: [cash, and, income]
rationale: No existing item states the HCA financial test; af_hca_eligibility_status (CO-1217) needs it.
tests:
  - {id: CO-1215-T1, as_of: "2026-10-01", month: "2026-10", given: {receives_ssi: true}, expect: true}
  - {id: CO-1215-T2, as_of: "2026-10-01", month: "2026-10", given: {receives_ssi: false, af_and_so_eligible: true}, expect: true}
  - {id: CO-1215-T3, as_of: "2026-10-01", month: "2026-10", given: {receives_ssi: false, af_and_so_eligible: false, received_oap_and_hca_grandfathered: true}, expect: true}
  - {id: CO-1215-T4, as_of: "2026-10-01", month: "2026-10", given: {receives_ssi: false, af_and_so_eligible: false, received_oap_and_hca_grandfathered: false}, expect: false}
