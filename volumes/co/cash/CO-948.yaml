id: CO-948
name: "Adult Financial: meets resource limit"
identifier: af_meets_resource_limit
kind: derived
type: yes/no
scope: person
program: AdultFinancial
meaning: "Whether the person's af_countable_resources is at or below the Adult Financial resource limit - af_resource_limit_couple (CO-3046) for a married client, af_resource_limit_individual (CO-3045) otherwise - per 9 CCR 2503-5 3.520.72.A and C.R.S. 26-2-111(1)(b), (2)(a)(I)."
precision: "Hard-coded numbers audit D-4: the item read the SSI-method limits (ssi_resource_limit_individual, _couple) on the ground that 3.520.72.A's figures are the same dollar amounts; the rule states its own figures and an SSI change would not change them without an amendment, so it reads Adult Financial's own parameters. Final cash review FC-14: resources equal to the limit meet it (at most), following C.R.S. 26-2-111(2)(a) and the SSI rule, against 3.520.71.A.1's \"below the resource limit\" (OQ-662). Resource records, step H1 Adult Financial (docs/reviews/records-holdings-snap-af.md): where the client's and the spouse's countable resources cannot be determined (a holding that does not state a field the rule reads), the limit is still not met when the parts that are known already exceed it (af_resources_known_lower_bound, CO-5350: every part only adds), as a household with $172,500 in the bank and a home it does not say it lives in."
derived: ["case", [[">", ["+", "af_resources_known_lower_bound", ["sum", ["filter", ["persons"], ["otherwise", ["rel", ["spouse"], ["P"]], false]], ["of", ["P"], "af_resources_known_lower_bound"]]], ["case", ["is_married", "af_resource_limit_couple"], ["else", "af_resource_limit_individual"]]], false], ["else", ["<=", "af_countable_resources", ["case", ["is_married", "af_resource_limit_couple"], ["else", "af_resource_limit_individual"]]]]]
sources: [S441, S442, S443, S453, S454]
implemented: engine
open: [OQ-662]
tags: [cash, oap, and, ab, resources]
rationale: "No existing item compares Adult Financial countable resources to the $2,000/$3,000 limit. af_category (CO-953) needs it. Not identical to ma_meets_ssi_resource_standard (CO-610), which compares against ma_ssi_household_size's living-together test rather than af_countable_resources's plain-marriage test; acknowledged as reusing CO-610's two resource-limit parameters directly (CO-233/CO-234), per the phase-5 brief's cross-program reuse instruction, rather than restating $2,000/$3,000 a second time. Fix round (M-6): reads is_married (CO-930) instead of re-deriving [exists_related, [spouse], true] a second time, matching af_countable_resources (CO-947)."
nearest: [CO-610]
