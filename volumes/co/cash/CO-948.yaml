id: CO-948
name: "Adult Financial: meets resource limit"
identifier: af_meets_resource_limit
kind: derived
type: yes/no
scope: person-month
program: AdultFinancial
meaning: "Whether the person's af_countable_resources is at or below the Adult Financial resource limit - af_resource_limit_couple (CO-3046) for a married client, af_resource_limit_individual (CO-3045) otherwise - per 9 CCR 2503-5 3.520.72.A and C.R.S. 26-2-111(1)(b), (2)(a)(I)."
precision: "Hard-coded numbers audit D-4: the item read the SSI-method limits (ssi_resource_limit_individual, _couple) on the ground that 3.520.72.A's figures are the same dollar amounts; the rule states its own figures and an SSI change would not change them without an amendment, so it reads Adult Financial's own parameters. Final cash review FC-14: resources equal to the limit meet it (at most), following C.R.S. 26-2-111(2)(a) and the SSI rule, against 3.520.71.A.1's \"below the resource limit\" (OQ-662). Resource records, step H1 Adult Financial (docs/reviews/records-holdings-snap-af.md): where the client's and the spouse's countable resources cannot be determined (a holding that does not state a field the rule reads), the limit is still not met when the parts that are known already exceed it (af_resources_known_lower_bound, CO-5350: every part only adds), as a household with $172,500 in the bank and a home it does not say it lives in. Coverage pass 4 CA4-13 (docs/reviews/coverage4-cash.md): a figure of the month evaluated, from the holdings valued in that month (3.510 \"Resources\", S4791: \"held as of the first day of a calendar month or as of the date of application\"), so an application month before the determination month is judged by its own holdings; before, every month read the determination month's. Coverage pass 6 CA6-7: reads af_is_married (CO-7308), which asks for the client's marital status (3.520.63.A), not the shared is_married's reading of an unstated status as not married (decision 4 of 2026-11-23). Pattern sweep (cash) PS-M1 and PS-D4 (docs/reviews/pattern-sweep-cash.md): the spouse is the spouse of the month (af_spouses_in_month, CO-7603), so a spouse who died before the month is not counted in it (3.520.63.A: widowed), and a client whose relationships are not stated, in a case of more than one person, cannot be determined (decision 4); before, every spouse edge counted in every month and unstated relationships were read as no spouse."
derived: ["case", [[">", ["+", "af_resources_known_lower_bound", ["sum", "af_spouses_in_month", ["of", ["P"], "af_resources_known_lower_bound"]]], ["case", ["af_is_married", "af_resource_limit_couple"], ["else", "af_resource_limit_individual"]]], false], ["else", ["<=", "af_countable_resources", ["case", ["af_is_married", "af_resource_limit_couple"], ["else", "af_resource_limit_individual"]]]]]
sources: [S441, S442, S443, S453, S454, S4791]
implemented: engine
open: [OQ-662]
tags: [cash, oap, and, ab, resources]
rationale: "No existing item compares Adult Financial countable resources to the $2,000/$3,000 limit. af_category (CO-953) needs it. Not identical to ma_meets_ssi_resource_standard (CO-610), which compares against ma_ssi_household_size's living-together test rather than af_countable_resources's plain-marriage test; acknowledged as reusing CO-610's two resource-limit parameters directly (CO-233/CO-234), per the phase-5 brief's cross-program reuse instruction, rather than restating $2,000/$3,000 a second time. Fix round (M-6): reads is_married (CO-930) instead of re-deriving [exists_related, [spouse], true] a second time, matching af_countable_resources (CO-947)."
nearest: [CO-610]
tests:
  - {id: "CO-948-T1", month: "2026-10", as_of: "2026-10-01", given: {immigration_status: us_citizen, af_person_countable_resources: 1900, af_vehicle_exemption_shared_with_spouse: 0, marital_status: single}, others: {}, relationships: [], expect: true}
  - {id: "CO-948-T2", month: "2026-10", as_of: "2026-10-01", given: {immigration_status: us_citizen, af_person_countable_resources: 1900, af_is_oap_age: true, af_vehicle_exemption_shared_with_spouse: 0}, others: {p2: {af_person_countable_resources_other_than_life_insurance: 44100, af_life_insurance_countable_value_for_oap: 0}}, relationships: [[spouse, p2]], expect: false}
  # Time audit T-9: each comparison tested at its limit, with the two sides equal (the strict/inclusive flip of the comparison fails it).
  # T-9 hand-check (docs/reviews/t9-threshold-handcheck.md, givens that contradicted themselves): rebuilt from the underlying facts, no override; the client's own countable resources are $2,000 and the client is unmarried, so the client's countable resources are 2,000, equal to the individual limit 2,000; resources equal to the limit meet it (OQ-662: C.R.S. 26-2-111(2)(a) and the SSI rule against 3.520.71.A.1's "below", S453).
  # Resource records, step H1 Adult Financial: an inference from known parts, not a default (CO-5350).
  - {id: "CO-948-T4", month: "2026-10", title: "Unmarried, $172,500 in the bank and a home that does not say whether she lives in it: over $2,000 whatever the home - not met", as_of: "2026-10-01", given: {immigration_status: us_citizen, holdings: [{kind: bank_account, value: 172500}, {kind: home, value: 240000, amount_owed: 0}], marital_status: single}, others: {}, relationships: [], expect: false}
  - {id: "CO-948-T5", month: "2026-10", title: "Unmarried, $1,200 in the bank and the same home: cannot determine (the home decides it)", as_of: "2026-10-01", given: {immigration_status: us_citizen, holdings: [{kind: bank_account, value: 1200}, {kind: home, value: 240000, amount_owed: 0}]}, others: {}, relationships: [], expect: unknown}
  - {id: "CO-948-T3", month: "2026-10", as_of: "2026-10-01", title: "T-9: af_countable_resources equal to [\"case\",[\"is_married\",\"af_resource_limit_couple\"],[\"else\",\"af_resource_limit_individual\"]] (af_countable_resources at or under [\"case\",[\"is_married\",\"af_resource_limit_couple\"],[\"else\",\"af_resource_limit_individual\"]])", given: {immigration_status: us_citizen, af_person_countable_resources: 2000, af_vehicle_exemption_shared_with_spouse: 0, marital_status: single}, others: {}, relationships: [], expect: true}
  # Coverage pass 6 CA6-7: af_is_married (CO-7308) asks for the marital status (3.520.63.A).
  - {id: "CO-948-T6", title: "Coverage pass 6 CA6-7: $1,900 against a limit that depends on an unstated marital status: cannot determine", month: "2026-10", as_of: "2026-10-01", given: {af_resources_known_lower_bound: 1900, af_countable_resources: 1900}, relationships: [], expect: unknown}
  # KL-CASH-3: 3.510 (S5321): "Marriage" includes a civil union; 3.520.72.A (S1636): $3,000 for a married client, the spouse's resources counted with the client's.
  # The client has $1,800 of countable resources, her partner in a civil union, a person of the case, $900: 1,800 + 900 = 2,700 <= 3,000 (was 1,800 alone against the individual limit, also met).
  - {id: "CO-948-T7", month: "2026-10", as_of: "2026-10-01", title: "KL-CASH-3: a civil union couple of the case, 1,800 + 900 = 2,700 against the couple's $3,000: met", given: {immigration_status: us_citizen, marital_status: other, af_person_countable_resources: 1800, af_is_oap_age: false, af_vehicle_exemption_shared_with_spouse: 0}, others: {p2: {marital_status: other, af_person_countable_resources_other_than_life_insurance: 900, af_life_insurance_countable_value_other_than_oap: 0}}, relationships: [[civil_union_partner, p1, p2]], expect: true}
  # The client has $2,100, her partner $1,000: 3,100 > 3,000, not met (was 2,100 alone against $2,000, also not met); with the partner's $500, 2,600 <= 3,000, met (was 2,100 > 2,000, not met).
  - {id: "CO-948-T8", month: "2026-10", as_of: "2026-10-01", title: "KL-CASH-3: 2,100 + 1,000 = 3,100 over the couple's $3,000: not met", given: {immigration_status: us_citizen, marital_status: other, af_person_countable_resources: 2100, af_is_oap_age: false, af_vehicle_exemption_shared_with_spouse: 0}, others: {p2: {marital_status: other, af_person_countable_resources_other_than_life_insurance: 1000, af_life_insurance_countable_value_other_than_oap: 0}}, relationships: [[civil_union_partner, p1, p2]], expect: false}
  - {id: "CO-948-T9", month: "2026-10", as_of: "2026-10-01", title: "KL-CASH-3: 2,100 + 500 = 2,600 within the couple's $3,000: met (was not met: 2,100 over the individual $2,000)", given: {immigration_status: us_citizen, marital_status: other, af_person_countable_resources: 2100, af_is_oap_age: false, af_vehicle_exemption_shared_with_spouse: 0}, others: {p2: {marital_status: other, af_person_countable_resources_other_than_life_insurance: 500, af_life_insurance_countable_value_other_than_oap: 0}}, relationships: [[civil_union_partner, p1, p2]], expect: true}
