id: CO-3805
name: "Colorado Works: institution resident keeps responsibility for a child in care"
identifier: cw_institution_resident_keeps_child_in_care
kind: derived
type: yes/no
scope: person
program: ColoradoWorks
meaning: "Whether this person, a resident of an institution, continues to have the responsibility of a dependent child who also resides in the institution or continues to be cared for in the home, so that the person may still receive Colorado Works (9 CCR 2503-6 3.604.2.O.2): there is a dependent child of whom the person is the parent, legal guardian or the person with primary responsibility, and the child is not away from the home, or lives in the same kind of setting as the person."
precision: "A child with no temporary_absence_reason stated is read as in the home. The same kind of setting (residence_setting_type) stands for the same institution; no fact names the institution itself. If residence_setting_type is not stated, Colorado Works reads the person as living in a private dwelling. The trailing words of O.2, \"unless individual needs are provided for through other state\", are not modeled (OQ-660)."
derived: [exists, [persons], [all, [rel, [parent, legal_guardian, has_primary_responsibility_for], [P]], [of, [P], cw_is_dependent_child], [any, ["=", [otherwise, [of, [P], temporary_absence_reason], none], none], [all, [not, ["=", [otherwise, residence_setting_type, private_dwelling], private_dwelling]], ["=", [otherwise, [of, [P], residence_setting_type], private_dwelling], [otherwise, residence_setting_type, private_dwelling]]]]]]
sources: [S2602]
implemented: engine
open: [OQ-660]
tags: [cash, tanf, household]
rationale: "Final cash review FC-1: 3.604.2.O.2 (S2602) keeps an institution resident who \"continue[s] to have the responsibility of a dependent child\" eligible when the child resides in the institution or is cared for in the home; cw_is_considered_living_in_home (CO-3354) needs that exception, and no item states it. It reads the relationship facts directly, not cw_caretaker_of (CO-2608), which itself reads CO-3354."
tests:
  - {id: CO-3805-T1, title: "A mother in a nursing home whose child is still at home", as_of: "2026-10-01", given: {residence_setting_type: nursing_facility}, others: {p2: {date_of_birth: "2018-01-01"}}, relationships: [[parent, p1, p2]], expect: true}
  - {id: CO-3805-T2, title: "A mother in a nursing home whose child has gone to live elsewhere", as_of: "2026-10-01", given: {residence_setting_type: nursing_facility}, others: {p2: {date_of_birth: "2018-01-01", temporary_absence_reason: other}}, relationships: [[parent, p1, p2]], expect: false}
  - {id: CO-3805-T3, title: "No dependent child", as_of: "2026-10-01", given: {residence_setting_type: nursing_facility}, relationships: [], expect: false}
