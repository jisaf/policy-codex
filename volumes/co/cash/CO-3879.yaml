id: CO-3879
name: "Colorado Works: earned income is unverified"
identifier: cw_earned_income_is_unverified
kind: derived
type: yes/no
scope: person-month
program: ColoradoWorks
meaning: "Whether this person has earned income for the month that Colorado Works requires verified and that is not: wages with no income document (DOLE wage data is not verified on receipt), or self-employment income with neither a document nor SSA self-employment data (9 CCR 2503-6 3.604.3.B.2.e, D)."
precision: "Whoever's income it is: a member of the assistance unit or another household member whose income is used (cw_income_verification_members, CO-3881). Earned-income records, step E1 Colorado Works (docs/reviews/records-earnings-cash.md): wages are the person's earnings records of pay received in the month that the table counts or exempts by kind (as wages_gross held every part of the wages, work-study and subsidized wages included), in-kind pay and pay diverted to a third party for the household too, which 3.605.2.A, B.1 and G make earned income; self-employment income is the receipts of a business, a farm and boarders (3.605.2.E), each read in the month. An unstated earnings list is cannot determine. Coverage pass 6 CA6-10 (docs/reviews/coverage6-cash.md, probe V1): 3.604.3.B.2.e asks verification of the income \"used to determine eligibility and payment\", so the wages read are those the pay readers count (cw_earned_pay, CO-5140: the kinds the table counts, a difficulty of care payment unless foster care), and a stream is read only from the month of its job_start_date through the month of its job_end_date, as every Colorado Works earnings reader reads it since CA4-9; before, a $300 stream from a job that ended in August asked for verification in October of pay not counted."
derived: ["any", ["all", [">", ["sum_receipts", "earnings", ["all", ["received_in", ["month"]], ["any", ["in", ["lookup", "cw_earnings_treatment_table", ["receipt", "kind"]], ["counted", "counted_no_rule_excludes", "counted_at_value"]], ["all", ["=", ["lookup", "cw_earnings_treatment_table", ["receipt", "kind"]], "counted_unless_foster_care"], ["not", ["receipt", "foster_care"]]]], ["any", ["not", ["unknown", ["receipt", "month"]]], ["all", ["any", ["unknown", ["receipt", "job_start_date"]], ["<=", ["month_of", ["receipt", "job_start_date"]], ["month"]]], ["any", ["unknown", ["receipt", "job_end_date"]], [">=", ["month_of", ["receipt", "job_end_date"]], ["month"]]]]]], ["receipt", "amount"]], 0], ["not", "earned_income_verification_document_received"]], ["all", [">", ["sum_receipts", "earnings", ["all", ["received_in", ["month"]], ["in", ["lookup", "cw_earnings_treatment_table", ["receipt", "kind"]], ["counted_net_of_costs", "counted_above_boarder_allowance"]], ["any", ["not", ["unknown", ["receipt", "month"]]], ["all", ["any", ["unknown", ["receipt", "job_start_date"]], ["<=", ["month_of", ["receipt", "job_start_date"]], ["month"]]], ["any", ["unknown", ["receipt", "job_end_date"]], [">=", ["month_of", ["receipt", "job_end_date"]], ["month"]]]]]], ["receipt", "amount"]], 0], ["not", ["any", "earned_income_verification_document_received", "self_employment_income_verified_by_electronic_data_source"]]]]
sources: [S872, S875]
implemented: engine
tags: [cash, verification]
rationale: "Final cash review FC-12 and final verification review V-2 (and V-9): the earned-income element (CO-1649) was gated on the person's own Colorado Works unit, so the income of a stepparent or a minor parent's parent, counted for the unit, was never pending. The ungated condition is stated once, here; CO-1649 reads it for a unit member and cw_pending_verification_count (CO-1425) for the other members whose income is used."
tests:
  - {id: CO-3879-T1, title: "Wages with no pay stubs", as_of: "2026-10-01", month: "2026-10", given: {earned_income_verification_document_received: false, earnings: [{kind: wages, amount: 2000}]}, expect: true}
  - {id: CO-3879-T2, title: "Wages documented", as_of: "2026-10-01", month: "2026-10", given: {earned_income_verification_document_received: true, earnings: [{kind: wages, amount: 2000}]}, expect: false}
  - {id: CO-3879-T3, title: "No earnings", as_of: "2026-10-01", month: "2026-10", given: {earnings: []}, expect: false}
  - {id: CO-3879-T4, title: "$1,500 from two boarders, no document and no SSA data: unverified (3.604.3.B.2.e, D)", as_of: "2026-10-01", month: "2026-10", given: {earned_income_verification_document_received: false, self_employment_income_verified_by_electronic_data_source: false, earnings: [{kind: boarder_payments, amount: 1500, provides: room_and_board, boarders: 2}]}, expect: true}
  - {id: CO-3879-T5, title: "Earnings not stated: cannot determine", as_of: "2026-10-01", month: "2026-10", given: {earned_income_verification_document_received: false}, expect: unknown}
  # Coverage pass 6 CA6-10 (probe V1): a $300 wage stream from a job that ended 2026-08-31 is not October's pay (3.605.2, CA4-9), so nothing to verify.
  - {id: "CO-3879-T6", title: "Probe V1: a stream from a job that ended in August: no October wages to verify", as_of: "2026-10-15", month: "2026-10", given: {earned_income_verification_document_received: false, earnings: [{kind: wages, amount: 300, job_end_date: "2026-08-31"}]}, expect: false}
  - {id: "CO-3879-T7", title: "The same stream in August, the month the job ended: unverified", as_of: "2026-10-15", month: "2026-08", given: {earned_income_verification_document_received: false, earnings: [{kind: wages, amount: 300, job_end_date: "2026-08-31"}]}, expect: true}
