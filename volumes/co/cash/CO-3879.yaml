id: CO-3879
name: "Colorado Works: earned income is unverified"
identifier: cw_earned_income_is_unverified
kind: derived
type: yes/no
scope: person-month
program: ColoradoWorks
meaning: "Whether this person has earned income for the month that Colorado Works requires verified and that is not: wages with no income document (DOLE wage data is not verified on receipt), or self-employment income with neither a document nor SSA self-employment data (9 CCR 2503-6 3.604.3.B.2.e, D)."
precision: "Whoever's income it is: a member of the assistance unit or another household member whose income is used (cw_income_verification_members, CO-3881)."
derived: [any, [all, [">", wages_gross, 0], [not, earned_income_verification_document_received]], [all, [">", self_employment_gross_receipts, 0], [not, [any, earned_income_verification_document_received, self_employment_income_verified_by_electronic_data_source]]]]
sources: [S872, S875]
implemented: engine
tags: [cash, verification]
rationale: "Final cash review FC-12 and final verification review V-2 (and V-9): the earned-income element (CO-1649) was gated on the person's own Colorado Works unit, so the income of a stepparent or a minor parent's parent, counted for the unit, was never pending. The ungated condition is stated once, here; CO-1649 reads it for a unit member and cw_pending_verification_count (CO-1425) for the other members whose income is used."
tests:
  - {id: CO-3879-T1, title: "Wages with no pay stubs", as_of: "2026-10-01", month: "2026-10", given: {wages_gross: 2000, self_employment_gross_receipts: 0, earned_income_verification_document_received: false}, expect: true}
  - {id: CO-3879-T2, title: "Wages documented", as_of: "2026-10-01", month: "2026-10", given: {wages_gross: 2000, self_employment_gross_receipts: 0, earned_income_verification_document_received: true}, expect: false}
  - {id: CO-3879-T3, title: "No earnings", as_of: "2026-10-01", month: "2026-10", given: {wages_gross: 0, self_employment_gross_receipts: 0}, expect: false}
