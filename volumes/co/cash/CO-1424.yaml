id: CO-1424
name: "Colorado Works: person's pending verification count"
identifier: cw_person_pending_verification_count
kind: derived
type: whole number
scope: person-month
program: ColoradoWorks
meaning: "The number of Colorado Works verification elements for this person not yet verified: lawful presence, citizenship (by a listed document or an SSA match), declared immigration status (SAVE, or documentation submitted), SSN, caretaker relationship, earned income (documents: wage data is not verified upon receipt), unearned income, residency for an adult member, school enrollment and pregnancy."
derived: ["+", [case, [[all, cw_requires_verification_of_lawful_presence, [not, [any, identity_verified_by_electronic_data_source, [all, identity_verification_document_received, identity_document_is_lawful_presence_document]]]], 1], [else, 0]], [case, [[all, claims_citizenship, [not, [any, citizenship_verified_by_electronic_data_source, [all, citizenship_verification_document_received, citizenship_document_is_primary_evidence]]]], 1], [else, 0]], [case, [[all, claims_lawful_immigration_status, [not, immigration_status_is_verified_or_submitted]], 1], [else, 0]], [case, [[not, ssn_is_verified], 1], [else, 0]], [case, [[all, cw_requires_verification_of_household_composition, [not, household_composition_verification_document_received]], 1], [else, 0]], [case, [[all, has_earned_income, [not, earned_income_verification_document_received]], 1], [else, 0]], [case, [[all, has_unearned_income, [not, unearned_income_is_verified]], 1], [else, 0]], [case, [[all, cw_is_adult_member, [not, residency_verification_document_received]], 1], [else, 0]], [case, [[all, cw_requires_verification_of_school_enrollment, [not, school_enrollment_verification_document_received]], 1], [else, 0]], [case, [[all, cw_requires_verification_of_pregnancy, [not, pregnancy_verification_document_received]], 1], [else, 0]]]
sources: [S872, S873, S874, S875, S876, S877, S878]
implemented: engine
tags: [verification, cash, tanf]
open: [OQ-314, OQ-315]
rationale: No existing item counts a Colorado Works client's outstanding verifications. 3.604.3.B.2 (S872) requires citizenship, SSN, income and residency verification of every participating client, so those elements count on the shared declaration and presence facts directly rather than through a program requirement item that would only restate them.
tests:
  - {id: CO-1424-T1, month: "2026-10", as_of: "2026-10-01", given: {cw_requires_verification_of_lawful_presence: true, identity_verified_by_electronic_data_source: true, citizenship_status: citizen, citizenship_verified_by_electronic_data_source: false, citizenship_verification_document_received: false, ssn_verified_by_electronic_data_source: true, cw_requires_verification_of_household_composition: false, has_earned_income: true, earned_income_verification_document_received: false, has_unearned_income: false, cw_is_adult_member: true, residency_verification_document_received: true, cw_requires_verification_of_school_enrollment: false, cw_requires_verification_of_pregnancy: false}, expect: 2}
  - {id: CO-1424-T2, month: "2026-10", as_of: "2026-10-01", given: {cw_requires_verification_of_lawful_presence: false, citizenship_status: lawful_permanent_resident, immigration_status_verified_by_electronic_data_source: false, immigration_status_verification_document_received: true, ssn_verified_by_electronic_data_source: false, ssn_verification_document_received: true, cw_requires_verification_of_household_composition: false, has_earned_income: false, has_unearned_income: false, cw_is_adult_member: false, cw_requires_verification_of_school_enrollment: false, cw_requires_verification_of_pregnancy: false}, expect: 0}
