id: CO-1424
name: "Colorado Works: person's pending verification count"
identifier: cw_person_pending_verification_count
kind: derived
type: whole number
scope: person-month
program: ColoradoWorks
role: outcome
meaning: "The number of Colorado Works verification elements for this person not yet verified: the status elements (lawful presence, citizenship, immigration status, SSN) and caretaker relationship, earned income, unearned income, residency of an adult member, school enrollment, pregnancy and sponsor information."
precision: Zero where Colorado Works verification does not apply to the person (cw_verification_is_applicable, CO-2583; case worker review B2).
derived: [case, [cw_verification_is_applicable, ["+", cw_person_pending_status_verification_count, [case, [cw_household_composition_verification_is_pending, 1], [else, 0]], [case, [cw_earned_income_verification_is_pending, 1], [else, 0]], [case, [cw_unearned_income_verification_is_pending, 1], [else, 0]], [case, [cw_residency_verification_is_pending, 1], [else, 0]], [case, [cw_school_enrollment_verification_is_pending, 1], [else, 0]], [case, [cw_pregnancy_verification_is_pending, 1], [else, 0]], [case, [cw_sponsor_verification_is_pending, 1], [else, 0]]]], [else, 0]]
sources: [S872, S873, S874, S875, S1062, S1064]
implemented: engine
tags: [verification, cash, tanf]
rationale: "The per-person count a worker reads off the checklist. Fix round (review U-1, C-8, C-9, C-11, K-2): the count sums the named per-element items, with the status elements in their own count for the thirty days of 3.604.3.K. Same-word audit SW-27: counts the program's own unearned-income element (cw_unearned_income_verification_is_pending)."
tests:
  - {id: CO-1424-T1, month: "2026-10", as_of: "2026-10-01", given: {cw_verification_is_applicable: true, cw_household_composition_verification_is_pending: false, cw_earned_income_verification_is_pending: true, cw_residency_verification_is_pending: false, cw_school_enrollment_verification_is_pending: false, cw_pregnancy_verification_is_pending: false, cw_sponsor_verification_is_pending: false, cw_unearned_income_verification_is_pending: false, cw_person_pending_status_verification_count: 2}, expect: 3}
  - {id: CO-1424-T2, month: "2026-10", as_of: "2026-10-01", given: {cw_verification_is_applicable: true, cw_household_composition_verification_is_pending: false, cw_earned_income_verification_is_pending: false, cw_residency_verification_is_pending: false, cw_school_enrollment_verification_is_pending: false, cw_pregnancy_verification_is_pending: false, cw_sponsor_verification_is_pending: false, cw_unearned_income_verification_is_pending: false, cw_person_pending_status_verification_count: 0}, expect: 0}
