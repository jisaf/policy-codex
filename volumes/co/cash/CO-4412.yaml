sources: [S3206, S1636]
implemented: engine
tags: [cash, resources]
rationale: "Coverage review F-6 (confirmed with the engine on probe PR-PTC): af_person_countable_resources_other_than_life_insurance (CO-4000) counted all of liquid_resources_value, including the refunds, retroactive benefits, loans, ABLE funds, business cash and replacement proceeds 3.520.77.D.1.b, E, F and J-M (S3206) exempt. SNAP's exclusions from the same holding (snap_countable_liquid_resources) are SNAP's list."
nearest: [CO-4000]
tests:
  - {id: CO-4412-T1, as_of: "2026-10-01", given: {receipts: [], holdings: [{kind: bank_account, value: 1700}, {kind: held_income_tax_refund, paid_by: state, value: 500, source_date: "2026-08-14"}]}, title: "F-6 (probe PR-PTC): $2,200 of savings, $500 of it a State refund received on August 14 (K: twelve months)", expect: 500}
  - {id: CO-4412-T2, as_of: "2026-10-01", given: {receipts: [], holdings: [{kind: bank_account, value: 4000}, {kind: able_account, value: 3000}, {kind: business_cash_and_assets, value: 800}, {kind: held_retroactive_ssa_benefit, value: 1200, source_date: "2026-06-05"}]}, title: "Retroactive SSI received on June 5 and still held (J: nine months after June, through March 2027), an ABLE account and business cash: 1,200 + 3,000 + 800", expect: 5000}
  - {id: CO-4412-T3, as_of: "2026-10-01", given: {receipts: [], holdings: [{kind: bank_account, value: 1000}, {kind: held_replacement_proceeds, replacement_property: personal_property, source_date: "2026-05-20", value: 3000}]}, title: "Insurance proceeds for a car received in May: three months end in August, counted in October (E.3)", expect: 0}
  - {id: CO-4412-T4, as_of: "2026-10-01", given: {receipts: [], holdings: [{kind: bank_account, value: 2000}, {kind: held_replacement_proceeds, replacement_property: real_property, source_date: "2026-05-20", value: 38000}]}, title: "Home-sale proceeds received in May: six months, still exempt in October (F)", expect: 38000}
  - {id: CO-4412-T5, as_of: "2026-10-01", given: {holdings: [{kind: bank_account, value: 500}, {kind: held_loan_proceeds, value: 1000, source_date: "2026-10-01"}]}, title: "A bona fide loan of $1,000 received on October 1, the month of the determination, still held (L): 1,000", expect: 1000}
  - {id: CO-4412-T6, as_of: "2026-10-01", given: {receipts: [], holdings: [{kind: held_income_tax_refund, paid_by: state, value: 300, source_date: "2026-08-14"}]}, title: "The State refund received on August 14 is all the person holds: 300 exempt", expect: 300}
  # Decision 4 of 2026-11-23: receipts not stated are cannot determine; a stated empty list is no loan.
  - {id: CO-4412-T7, as_of: "2026-10-01", given: {holdings: [{kind: bank_account, value: 1500}]}, title: "Receipts not stated: the loan is read from the holdings (held_loan_proceeds), not the month's receipts - a bank account alone, nothing exempt", expect: 0}
  - {id: CO-4412-T8, as_of: "2026-10-01", given: {receipts: [], holdings: [{kind: bank_account, value: 1500}]}, title: "Receipts stated empty and no other exempt part: nothing exempt", expect: 0}
