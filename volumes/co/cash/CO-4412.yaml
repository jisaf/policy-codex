id: CO-4412
name: "Adult Financial: exempt part of liquid resources"
identifier: af_exempt_liquid_resources
kind: derived
type: money
scope: person
program: AdultFinancial
meaning: "The part of this person's cash and convertible assets (af_cash_and_convertible_holdings, CO-5340) that 9 CCR 2503-5 3.520.77 exempts now, from the person's holdings records: an ABLE account (M) and the cash and convertible assets necessary for the person's trade or business (D.1.b) (row excluded); an income tax refund, the PTC rebate included, until twelve months after the date it was received (K); retroactive SSI or Social Security retirement or disability benefits through the ninth month after the month received (J); money from a bona fide loan in the month received (L); and proceeds held to restore or replace property, for three months (personal property) or six (real property, a replacement home included) after the month received, or longer with the county's good-cause extension (E, F); each at its value times the person's share."
precision: "Resource records, step H1 Adult Financial (docs/reviews/records-holdings-snap-af.md): each exempt holding is its own record dated by source_date (held_income_tax_refund, held_retroactive_ssa_benefit, held_loan_proceeds, held_replacement_proceeds), so the windows are applied to the date the money came in, where before the facts (CO-4172, CO-4413, CO-4414) said only that it came within the window and each part was read as 0 when not stated: a refund, retroactive payment or loan held with no date is cannot determine (decision 4 of 2026-11-23). K's twelve months run from the date received to the same day twelve months later (a day the later month lacks runs into the next month); J's nine months follow the month received (received in June 2026: exempt through March 2027); L's month is the month of the determination date. The loan exempt is the money from the loan still held (held_loan_proceeds), no longer the loan receipt of the determination month (receipts, kind loan), which says nothing of what is left of it. Replacement proceeds are exempt while the determination month is no later than af_replacement_proceeds_exemption_months_table months after the month received (E.3, F.3: counted \"in the month following the month in which the time period expired\") or the county has granted an extension (af_replacement_proceeds_extension_granted, read as no when not stated: an extension the county has not determined is not granted). A retroactive payment stated for the SSI method (CO-4639, with its date) and for Adult Financial (CO-4414) is one record, so Adult Financial now exempts the payment the SSI-method fact stated."
