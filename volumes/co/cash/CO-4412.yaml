id: CO-4412
name: "Adult Financial: exempt part of liquid resources"
identifier: af_exempt_liquid_resources
kind: derived
type: money
scope: person
program: AdultFinancial
meaning: "The part of this person's liquid resources (liquid_resources_value) that 9 CCR 2503-5 3.520.77 exempts: federal and State income tax refunds and the PTC rebate held within twelve months of receipt (K); retroactive SSI or Social Security retirement or disability benefits held within nine months after the month received (J); bona fide loan proceeds received in the month of the determination (L); an ABLE account (M); cash and convertible assets necessary for the person's trade or business (D.1.b); and proceeds held to restore or replace property, for three months (personal property) or six (real property, a replacement home included) after the month received, or longer with the county's good-cause extension (E, F); never more than liquid_resources_value."
precision: "Each part is read as 0 when not stated. A loan is exempt in the month received (L), read as the receipt stated for the month of the determination date (loan_proceeds_received, CO-3362). The month of receipt of refunds and retroactive benefits is in the fact's meaning (CO-4172, CO-4413, CO-4414). Replacement proceeds are exempt while the month of the determination date is no later than af_replacement_proceeds_exemption_months_table months after the month received (E.3, F.3: counted \"in the month following the month in which the time period expired\")."
derived: [min, liquid_resources_value, [+, [otherwise, federal_tax_refunds_held_value, 0], [otherwise, state_tax_refunds_held_value, 0], [otherwise, retroactive_ssa_benefits_held_value, 0], [otherwise, [at, loan_proceeds_received, [det_month]], 0], [otherwise, able_account_value, 0], [otherwise, business_cash_and_convertible_assets_value, 0], [case, [[all, [">", [otherwise, replacement_proceeds_held_value, 0], 0], [any, [otherwise, af_replacement_proceeds_extension_granted, false], ["<=", [det_month], [months_after, [lookup, af_replacement_proceeds_exemption_months_table, replacement_proceeds_property_type], [month_of, replacement_proceeds_received_date]]]]], replacement_proceeds_held_value], [else, 0]]]]
sources: [S3206]
implemented: engine
tags: [cash, resources]
rationale: "Coverage review F-6 (confirmed with the engine on probe PR-PTC): af_person_countable_resources_other_than_life_insurance (CO-4000) counted all of liquid_resources_value, including the refunds, retroactive benefits, loans, ABLE funds, business cash and replacement proceeds 3.520.77.D.1.b, E, F and J-M (S3206) exempt. SNAP's exclusions from the same holding (snap_countable_liquid_resources) are SNAP's list."
nearest: [CO-4000]
tests:
  - {id: CO-4412-T1, title: "F-6 (probe PR-PTC): $2,200 of savings, $500 of it a State refund received in August (K)", as_of: "2026-10-01", given: {liquid_resources_value: 2200, state_tax_refunds_held_value: 500}, expect: 500}
  - {id: CO-4412-T2, title: "Retroactive SSI held, an ABLE account and business cash", as_of: "2026-10-01", given: {liquid_resources_value: 9000, retroactive_ssa_benefits_held_value: 1200, able_account_value: 3000, business_cash_and_convertible_assets_value: 800}, expect: 5000}
  - {id: CO-4412-T3, title: "Insurance proceeds for a car received in May: three months end in August, counted in October (E.3)", as_of: "2026-10-01", given: {liquid_resources_value: 4000, replacement_proceeds_held_value: 3000, replacement_proceeds_property_type: personal_property, replacement_proceeds_received_date: "2026-05-20"}, expect: 0}
  - {id: CO-4412-T4, title: "Home-sale proceeds received in May: six months, still exempt in October (F)", as_of: "2026-10-01", given: {liquid_resources_value: 40000, replacement_proceeds_held_value: 38000, replacement_proceeds_property_type: real_property, replacement_proceeds_received_date: "2026-05-20"}, expect: 38000}
  - {id: CO-4412-T5, title: "A bona fide loan received in the month of the determination (L)", as_of: "2026-10-01", given: {liquid_resources_value: 1500, loan_proceeds_received: {"2026-10": 1000}}, expect: 1000}
  - {id: CO-4412-T6, title: "Never more than the liquid resources", as_of: "2026-10-01", given: {liquid_resources_value: 300, state_tax_refunds_held_value: 500}, expect: 300}
