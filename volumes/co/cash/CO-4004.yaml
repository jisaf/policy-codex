id: CO-4004
name: "Adult Financial: spouse's resource verifications pending"
identifier: af_spouse_resources_pending_verification_count
kind: derived
type: whole number
scope: person-month
program: AdultFinancial
meaning: "The number of resource verification elements still pending for the spouse of this Adult Financial client: one for each spouse whose resources other than cash must be verified and are not (af_resources_are_unverified). 9 CCR 2503-5 3.520.72.A counts a resource \"together with all other countable resources of the client, spouse, and sponsor(s)\", and D requires the county to \"obtain verification of all resources and associated values\"."
precision: "The spouse of the case wherever the spouse lives, as af_client_and_spouse_countable_resources (CO-2389) counts the spouse's resources. A spouse who is also an Adult Financial client has the spouse's own element too; this count belongs to the client whose limit the spouse's resources are counted against. Pattern sweep (cash) PS-M1 and PS-D4 (docs/reviews/pattern-sweep-cash.md): the spouse is the spouse of the month (af_spouses_in_month, CO-7603), so a spouse who died before the month is not counted in it (3.520.63.A: widowed), and a client whose relationships are not stated, in a case of more than one person, cannot be determined (decision 4); before, every spouse edge counted in every month and unstated relationships were read as no spouse. Coverage pass 7, F7-2 (docs/reviews/coverage7-cash.md): a married client whose spouse is not a person of the case in the month (af_spouse_is_outside_case_in_month, CO-7690) cannot be determined here: the spouse's resources and their verification are not stated (decision 4 of 2026-11-23), as for a sponsor outside the case (PS-M3) and the non-MAGI couple (F6-7, CO-643). Before, they were read as none."
derived: [case, [[not, af_spouse_is_outside_case_in_month], [sum, "af_spouses_in_month", [case, [[of, [P], af_resources_are_unverified], 1], [else, 0]]]]]
sources: [S454, S888]
implemented: engine
tags: [cash, verification, resources]
rationale: "Final cash review 2, N-2 (engine-confirmed): an OAP client of 72 with every element verified, whose 55-year-old spouse had a $1,500 retirement account and no resource document, had af_countable_resources 2,500 but af_pending_verification_count 0 and af_verification_status complete. af_pending_verification_count (CO-1436) now adds this count, as it adds the spouse's income (CO-3884)."
tests:
  - {id: CO-4004-T1, title: "N-2: the spouse's retirement account has no statement", as_of: "2026-10-01", month: "2026-10", given: {}, others: {p2: {af_resources_are_unverified: true}}, relationships: [[spouse, p1, p2]], expect: 1}
  - {id: CO-4004-T2, title: "The spouse's resources are verified", as_of: "2026-10-01", month: "2026-10", given: {}, others: {p2: {af_resources_are_unverified: false}}, relationships: [[spouse, p1, p2]], expect: 0}
  - {id: CO-4004-T3, title: "Unmarried client", as_of: "2026-10-01", month: "2026-10", given: {marital_status: single}, relationships: [], expect: 0}
  - {id: CO-4004-T4, title: "F7-2: a married client whose spouse is not a person of the case: cannot determine", as_of: "2026-10-01", month: "2026-10", given: {marital_status: married}, relationships: [], expect: unknown}
