id: CO-2588
name: "Colorado Works: unearned income verification is pending"
identifier: cw_unearned_income_verification_is_pending
kind: derived
type: yes/no
scope: person-month
program: ColoradoWorks
role: outcome
meaning: "Whether Colorado Works still needs verification of this person's unearned income: the shared unearned_income_verification_is_pending (CO-1650), where Colorado Works verification applies to the person."
precision: "Due by: cw_verification_due_date (CO-1426: eleven days), or cw_verification_extended_due_date when the county extended it."
derived: [all, cw_verification_is_applicable, cw_unearned_income_is_unverified]
sources: [S872, S875, S880, S891, S898]
implemented: engine
tags: [verification, income]
rationale: "County case worker review B2: the shared unearned-income pending flag is one of Colorado Works's outcomes but cannot read Colorado Works's applicability; this item is the program's own flag, gated like its other elements. Same-word audit SW-27: reads the program's own countable unearned income (cw_has_countable_unearned_income), not the shared sum that counted the program's own grant."
nearest: [CO-1650]
tests:
  - {id: CO-2588-T1, month: "2026-10", as_of: "2026-10-01", given: {cw_verification_is_applicable: true, cw_has_countable_unearned_income: true, unearned_income_is_verified: false}, expect: true}
  - {id: CO-2588-T2, month: "2026-10", as_of: "2026-10-01", given: {cw_verification_is_applicable: false, cw_has_countable_unearned_income: true, unearned_income_is_verified: false}, expect: false}
  # Coverage pass 7 fix round: the same as T1 with the verification stated as its two supplied facts (no electronic data source match, no document received), so the conformance suite can build this outcome's cannot-determine case from a supplied fact: verified = false or false = false; unverified = true and not false = true; pending = true and true = true.
  - {id: CO-2588-T3, month: "2026-10", as_of: "2026-10-01", title: "Countable unearned income with neither an electronic match nor a document: pending", given: {cw_verification_is_applicable: true, cw_has_countable_unearned_income: true, unearned_income_verified_by_electronic_data_source: false, unearned_income_verification_document_received: false}, expect: true}
