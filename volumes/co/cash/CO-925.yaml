id: CO-925
name: "Colorado Works: unit time limit extended or exempt"
identifier: cw_unit_time_limit_extended
kind: derived
type: yes/no
scope: person
program: ColoradoWorks
meaning: Whether this person's assistance unit is exempt from (or has an approved extension beyond) the sixty-month time limit, read at the unit level - a child-only unit, or any unit member with a county-approved domestic violence or hardship extension - per 26-2-706.5(4) and 9 CCR 2503-6 3.606.6.C. Every member of the same unit shares the same value. The current 3.606.6.C conditions an extension on the household demonstrating "good cause as defined in section 3.601 and outlined in 3.608.3", decided with the state prescribed extension determination form, and 3.606.6.D.4.e adds "other hardship reasons listed on the state prescribed extension determination form" (S1021); the approval itself stays a supplied county decision.
precision: "Fix round (C-3(c)/K-3): now reads the 3.606.6.C last-sentence bar on granting an extension to a unit containing a disqualified member, via cw_is_disqualified_member (CO-928), which now exists (see K-3, OQ-143 for what remains unmodeled about disqualified members generally)."
derived: [all, [any, cw_child_only_unit, [exists, cw_assistance_unit_members, [any, [of, [P], has_domestic_violence_extension_approved], [of, [P], has_hardship_extension_approved]]]], [not, [exists, cw_assistance_unit_members, [of, [P], cw_is_disqualified_member]]]]
sources: [S417, S1004, S1021]
implemented: engine
tags: [cash, tanf]
rationale: "No existing item states the Colorado Works time-limit extension at the unit level; cw_time_limit_exempt (CO-917) is the nearest same-shape item (the same three-term disjunction) but reads each of the domestic-violence and hardship facts off the person asked rather than any member of the unit, which the phase-5 review's C-3(a) finding shows gives three different answers for one unit. cw_time_limit_reached (CO-918) needs this unit-level figure; cw_time_limit_exempt (CO-917) is kept as the person-level, non-time-limit sense of 'exempt' other items may still read. Fix round (C-3(c)): adds the disqualified-member bar via cw_is_disqualified_member (CO-928), a new item - see K-3."
nearest: [CO-917]
