id: CO-4352
name: "Colorado Works: minor parent assisted as an adult"
identifier: cw_minor_parent_is_assisted_as_adult
kind: derived
type: yes/no
scope: person-month
program: ColoradoWorks
meaning: "This person is a minor parent who does not live in the home of a caretaker and so receives Colorado Works assistance as an adult, not as a dependent child (9 CCR 2503-6 3.604.2.N.2.c): in the month evaluated, under cw_minor_parent_age_limit on its first day, with a dependent child of her or his own in the month (cw_has_dependent_child_in_month, CO-7305), and either emancipated, of a marital status other than single (who are \"not considered to be living in the home of a caretaker even if they are living in the home of their parent\", N.2.b), or living with no person who is her or his caretaker (a parent, legal guardian or person with primary responsibility, in the home under Colorado Works' absence rule, as cw_caretaker_of reads it). The unit's standards then count the minor parent as a caretaker (cw_unit_caretaker_count, CO-926) and not as a child (cw_unit_child_count, CO-927)."
precision: "\"If approved\" (N.2.c) is the living-arrangement condition of N.1-N.2.a (cw_minor_parent_living_arrangement_met, CO-906, read by cw_eligibility_status, CO-921): a minor parent who is not approved is ineligible, so this item only prices the unit of one who is. The caretaker test is the inverse of cw_caretaker_of (CO-2608): a person the minor parent is the child, ward or in the primary care of, living in the same home (lives_with; an edge with no dwelling stated is read as living together, convention rule 17) and considered living in the home (cw_is_considered_living_in_home, CO-3354). Coverage pass 6 CA6-7 (docs/reviews/coverage6-cash.md): whether the minor parent is emancipated (is_emancipated_minor) is required where read (decision 4 of 2026-11-23); before, an unstated emancipation was read as not emancipated. Coverage pass 6 CA6-4: per month, the age taken on the month's first day (docs/operators.md, \"Ages in a month\"; OQ-951), as the dependent child of the month is (CO-6807); the per-person readers (cw_child_only_unit CO-916, cw_unit_has_striking_adult CO-3808) read the determination month. The 3.601 definition of a dependent child (\"a person who resides with a parent or non-parent caretaker\") is otherwise carried by the unit closure (CO-900), which joins a child to a unit only through a caretaker in the home."
derived: ["all", ["<", ["years_between", "date_of_birth", ["first_day", ["month"]]], "cw_minor_parent_age_limit"], "cw_has_dependent_child_in_month", ["any", "is_emancipated_minor", ["not", ["=", "marital_status", "single"]], ["not", ["exists", ["persons"], ["all", ["rel", ["child", "ward", "in_primary_care_of"], ["P"]], ["otherwise", ["in_group", ["P"], "lives_with"], true], "cw_is_considered_living_in_home", ["of", ["P"], "cw_is_considered_living_in_home"]]]]]]
sources: [S3153]
implemented: engine
tags: [cash, tanf, household, age]
rationale: "Coverage review CW-2 (P1): cw_is_dependent_child (CO-901) is an age test, so a minor parent living on her own (emancipated, married or in an approved setting) was counted as a child and her unit priced on the No Caretaker row: an emancipated 16-year-old alone with her baby got caretaker count 0, child count 2 and $362, where N.2.c (S3153) gives the One Caretaker row with one child, $488. CO-906's rationale named N.2.c as not modeled. No existing item states the condition; changing CO-901 itself would make the dependent-child test read cw_has_dependent_child, which reads CO-901 (a cycle), so the counts read this item instead."
