id: CO-903
name: "Colorado Works: assistance unit size"
identifier: cw_unit_size
kind: derived
type: whole number
scope: person
program: ColoradoWorks
meaning: The number of persons in this person's Colorado Works assistance unit (cw_assistance_unit_members, CO-900) who are not a disqualified or ineligible required member, the key 3.606.1.F's need and grant standard chart is read by. A disqualified member (9 CCR 2503-6 3.604.2.M) is removed "for the purposes of determining the assistance unit size" while remaining an assistance-unit member for income purposes.
precision: "Fix round (OQ-143): filters cw_is_disqualified_member (CO-928) out of the count, per 3.604.2.M's first sentence, rather than out of cw_assistance_unit_members (CO-900) itself - a disqualified member stays in cw_assistance_unit_members (and so in cw_unit_caretaker_count, CO-926, and cw_unit_child_count, CO-927, which key the need/grant standard chart's rows and columns by a different composition test than this raw count) so that their undisregarded income still counts in cw_countable_income (CO-910) and cw_payment_countable_income (CO-923); only this headcount, not unit composition or income, is affected. This item and cw_unit_caretaker_count/cw_unit_child_count can therefore diverge for a unit with a disqualified caretaker or child - not resolved this round, since 3.606.1.F's chart itself is not restated to remove a disqualified member from its caretaker/child composition."
derived: [count, [filter, cw_assistance_unit_members, [not, [of, [P], cw_is_disqualified_member]]]]
sources: [S408, S414, S523]
implemented: engine
tags: [cash, tanf, household]
rationale: "No existing item counts the Colorado Works assistance unit; cw_need_standard (CO-911) and cw_grant_standard (CO-912) both look up this size in the standards-of-assistance tables. Fix round (OQ-143): a disqualified or ineligible required member (cw_is_disqualified_member, CO-928) is removed from this count per 3.604.2.M's unit-size sentence - the fix round's own finding that CO-928 existed but was wired only into cw_unit_time_limit_extended (CO-925)'s extension bar, not into unit size itself."
tests:
  - {id: CO-903-T1, as_of: "2026-10-01", given: {date_of_birth: "2009-04-08", is_enrolled_in_school: true, receives_ssi: false, receives_title_iv_foster_adoption_kinship_payment: false, is_disqualified_for_intentional_program_violation: false, is_disqualified_drug_felony: false, is_fleeing_felon_or_probation_violator: false}, others: {p2: {date_of_birth: "2026-02-03", receives_ssi: false, receives_title_iv_foster_adoption_kinship_payment: false, is_disqualified_for_intentional_program_violation: false, is_disqualified_drug_felony: false, is_fleeing_felon_or_probation_violator: false}}, relationships: [[parent, p1, p2]], expect: 2}
  - {id: CO-903-T2, as_of: "2026-10-01", given: {date_of_birth: "1990-01-01", receives_ssi: false, receives_title_iv_foster_adoption_kinship_payment: false, is_disqualified_for_intentional_program_violation: false, is_disqualified_drug_felony: false, is_fleeing_felon_or_probation_violator: false}, relationships: [], expect: 1}
  - {id: CO-903-T3, title: "OQ-143: a disqualified caretaker is removed from the unit-size count but stays a unit member", as_of: "2026-10-01", given: {date_of_birth: "1990-01-01", receives_ssi: false, receives_title_iv_foster_adoption_kinship_payment: false, is_disqualified_for_intentional_program_violation: true, is_disqualified_drug_felony: false, is_fleeing_felon_or_probation_violator: false}, others: {p2: {date_of_birth: "2015-06-01", receives_ssi: false, receives_title_iv_foster_adoption_kinship_payment: false, is_disqualified_for_intentional_program_violation: false, is_disqualified_drug_felony: false, is_fleeing_felon_or_probation_violator: false}}, relationships: [[parent, p1, p2]], expect: 1}
