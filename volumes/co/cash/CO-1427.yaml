id: CO-1427
name: "Colorado Works: verification status"
identifier: cw_verification_status
kind: derived
type: one of
options: [not_applicable, complete, pending, members_excluded, past_due]
scope: person-month
program: ColoradoWorks
role: outcome
meaning: "Where this person's Colorado Works unit stands on verification: not applicable (no dependent child and no pregnant member in the unit, so Colorado Works cannot reach it); complete; pending (other verifications within eleven days, status verifications within thirty); members excluded (only citizenship, status, lawful presence, identity or SSN verifications are outstanding after thirty days, so the members concerned receive no payment and their income still counts); or past due (another verification is outstanding after eleven days, and the county processes the application without it)."
derived: [case, [[not, cw_verification_is_applicable], not_applicable], [["=", cw_pending_verification_count, 0], complete], [[all, [">", ["-", cw_pending_verification_count, [sum, cw_assistance_unit_members, [of, [P], cw_person_pending_status_verification_count]]], 0], [">", [det_date], cw_verification_due_date]], past_due], [[all, [">", [sum, cw_assistance_unit_members, [of, [P], cw_person_pending_status_verification_count]], 0], [">", [det_date], cw_status_verification_due_date]], members_excluded], [else, pending]]
sources: [S871, S872, S1064]
implemented: engine
tags: [verification, cash, tanf]
rationale: "No existing item reports a Colorado Works unit's verification standing. Fix round: not_applicable (review C-4) and the thirty days and individual exclusion of 3.604.3.K (C-9)."
tests:
  - {id: CO-1427-T1, month: "2026-10", as_of: "2026-10-01", given: {cw_assistance_unit_members: [p1], cw_is_dependent_child: false, is_pregnant: false}, expect: not_applicable}
  - {id: CO-1427-T2, month: "2026-10", as_of: "2026-10-01", given: {cw_assistance_unit_members: [p1, p2], cw_is_dependent_child: false, is_pregnant: false, cw_pending_verification_count: 0}, others: {p2: {cw_is_dependent_child: true}}, expect: complete}
  - {id: CO-1427-T3, month: "2026-10", as_of: "2026-10-01", given: {determination_date: "2026-10-05", cw_assistance_unit_members: [p1, p2], cw_is_dependent_child: false, is_pregnant: false, cw_pending_verification_count: 2, cw_person_pending_status_verification_count: 1, cw_verification_due_date: "2026-10-12", cw_status_verification_due_date: "2026-10-31"}, others: {p2: {cw_is_dependent_child: true, cw_person_pending_status_verification_count: 0}}, expect: pending}
  - {id: CO-1427-T4, month: "2026-10", as_of: "2026-10-01", given: {determination_date: "2026-10-20", cw_assistance_unit_members: [p1, p2], cw_is_dependent_child: false, is_pregnant: false, cw_pending_verification_count: 1, cw_person_pending_status_verification_count: 1, cw_verification_due_date: "2026-10-12", cw_status_verification_due_date: "2026-10-31"}, others: {p2: {cw_is_dependent_child: true, cw_person_pending_status_verification_count: 0}}, expect: pending}
  - {id: CO-1427-T5, month: "2026-10", as_of: "2026-10-01", given: {determination_date: "2026-11-05", cw_assistance_unit_members: [p1, p2], cw_is_dependent_child: false, is_pregnant: false, cw_pending_verification_count: 1, cw_person_pending_status_verification_count: 1, cw_verification_due_date: "2026-10-12", cw_status_verification_due_date: "2026-10-31"}, others: {p2: {cw_is_dependent_child: true, cw_person_pending_status_verification_count: 0}}, expect: members_excluded}
  - {id: CO-1427-T6, month: "2026-10", as_of: "2026-10-01", given: {determination_date: "2026-10-20", cw_assistance_unit_members: [p1, p2], cw_is_dependent_child: false, is_pregnant: false, cw_pending_verification_count: 2, cw_person_pending_status_verification_count: 1, cw_verification_due_date: "2026-10-12", cw_status_verification_due_date: "2026-10-31"}, others: {p2: {cw_is_dependent_child: true, cw_person_pending_status_verification_count: 0}}, expect: past_due}
