id: CO-940
name: "Adult Financial: is Old Age Pension age"
identifier: af_is_oap_age
kind: derived
type: yes/no
scope: person
program: AdultFinancial
meaning: "Whether the person has attained the minimum age for the Old Age Pension program - sixty years or more - per C.R.S. 26-2-111(2)(a)(I) and 9 CCR 2503-5 3.530 and 3.520.61.A; or the person turns that age during the determination month while receiving another Adult Financial grant, since such a client transitions to OAP from the first day of the birth month (9 CCR 2503-5 3.532.B.3)."
precision: "Uses the shared age (CO-300) fact, evaluated as of the determination date, and the birth month of the determination month, in every month a determination evaluates (OQ-951, time audit T-1: no Adult Financial text found states another date for a prorated first month)."
derived: [any, [">=", age, af_oap_age], [all, [">=", [years_between, date_of_birth, [days_after, -1, [first_day, [month_after, [det_month]]]]], af_oap_age], [at, [">", adult_financial_cash_income, 0], [det_month]]]]
sources: [S441, S449, S455, S1635]
open: [OQ-951]
implemented: engine
tags: [cash, oap, age]
rationale: "No existing item states the OAP age test. af_oap_group (CO-941) and af_category (CO-953) need it. Same shape as ma_is_aged (CO-600, age >= a parameter) and snap_is_elderly (CO-301, age >= a parameter), acknowledged: SNAP's elderly age is 60 (7 CFR 271.2), Medicaid's SSI-related aged category floor is 65 (42 CFR 435.520), and OAP's age floor is 60 (26-2-111(2)(a)(I)) - three distinct policy thresholds, each owned by a different program (OAP's coinciding numerically with SNAP's, but stated by its own statute)."
nearest: [CO-600, CO-301]
tests:
  - {id: CO-940-T1, as_of: "2026-10-01", given: {date_of_birth: "1947-03-12"}, expect: true}
  - {id: CO-940-T2, as_of: "2026-10-01", given: {date_of_birth: "1980-01-01"}, expect: false}
  # Phase-10 sweep (OQ-120): an AND client turning 60 on October 20 is OAP age for all of October (3.532.B.3).
  - {id: CO-940-T3, as_of: "2026-10-05", given: {date_of_birth: "1966-10-20", adult_financial_cash_income: {"2026-10": 300}}, expect: true}
  - {id: CO-940-T4, title: "Not receiving another Adult Financial grant - not until the birthday", as_of: "2026-10-05", given: {date_of_birth: "1966-10-20", adult_financial_cash_income: {"2026-10": 0}}, expect: false}
