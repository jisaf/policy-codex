id: CO-940
name: "Adult Financial: is Old Age Pension age"
identifier: af_is_oap_age
kind: derived
type: yes/no
scope: person-month
program: AdultFinancial
meaning: "Whether the person is of the minimum age for the Old Age Pension program, sixty years or more (C.R.S. 26-2-111(2)(a)(I); 9 CCR 2503-5 3.530 and 3.520.61.A), in the month evaluated: sixty or older on the last day of the month , so a client who turns sixty in the month is of OAP age for it, from the day the client meets all eligibility requirements (3.542.B; af_partial_month_payment_factor), and a client receiving another Adult Financial program transitions to OAP in the birth month (3.532.B.3)."
precision: "Coverage pass 4 CA4-15 (docs/reviews/coverage4-cash.md): measured in the month evaluated; before, the age on the determination date was read in every month (OQ-951), so an applicant who turned sixty after applying was of OAP age in the application month (probe A17: born 1966-10-05, applying 2026-09-20 and determined 2026-10-15, was paid for September). The birth-month transition of 3.532.B.3, read before only for a client receiving another grant in the determination month, is met by the last day's age for every client; a new applicant's grant still begins on the eligibility date. Receipt records, migration phase 1: the grant received was af_grant_receipts."
derived: [">=", [years_between, date_of_birth, [days_after, -1, [first_day, [month_after, [month]]]]], af_oap_age]
sources: [S441, S449, S455, S1635, S4794]
implemented: engine
tags: [cash, oap, age]
open: [OQ-951]
rationale: "No existing item states the OAP age test. af_oap_group (CO-941) and af_category (CO-953) need it. Same shape as ma_is_aged (CO-600, age >= a parameter) and snap_is_elderly (CO-301, age >= a parameter), acknowledged: SNAP's elderly age is 60 (7 CFR 271.2), Medicaid's SSI-related aged category floor is 65 (42 CFR 435.520), and OAP's age floor is 60 (26-2-111(2)(a)(I)) - three distinct policy thresholds, each owned by a different program (OAP's coinciding numerically with SNAP's, but stated by its own statute)."
nearest: [CO-600, CO-301]
