id: CO-4001
name: "Adult Financial: countable life insurance under the OAP rule"
identifier: af_life_insurance_countable_value_for_oap
kind: derived
type: money
scope: person-month
program: AdultFinancial
meaning: "The part of this person's life insurance cash surrender value that counts toward the resources of an Old Age Pension client, whether the person is the client or the client's spouse: nothing when the total face value of the person's and the spouse's policies is af_life_insurance_face_value_exemption_limit or less (9 CCR 2503-5 3.520.75.D); otherwise the part 3.520.75.E-F count (af_life_insurance_countable_cash_value)."
precision: "The total face value adds the spouse wherever the spouse lives, as 3.520.75.D-F read \"a client and his or her spouse\" and as af_client_and_spouse_countable_resources (CO-2389) counts the spouse (3.520.63.D; coverage review 2, G-2). A face value not stated is read as 0. Coverage review P3: the face value is the original face value at purchase, not a face value increased by dividends or their reinvestment (3.520.75.A, G); a case states life_insurance_face_value so for an Adult Financial client. Resource records, step H1 Adult Financial (docs/reviews/records-holdings-snap-af.md): the face value, the purchase dates and the premiums are read from the person's (and the spouse's) life insurance records (af_life_insurance_face_value, af_life_insurance_bought_within_lookback, af_life_insurance_premiums_in_lookback, CO-5347 to CO-5349) in place of the person facts (CO-3397, CO-3850, CO-3851), each of which was read as 0 or unstated when not given; a face value not stated is now cannot determine (decision 4). Coverage pass 4 CA4-13 (docs/reviews/coverage4-cash.md): a figure of the month evaluated, from the holdings valued in that month (3.510 \"Resources\", S4791: \"held as of the first day of a calendar month or as of the date of application\"), so an application month before the determination month is judged by its own holdings; before, every month read the determination month's. Pattern sweep (cash) PS-M1 and PS-D4 (docs/reviews/pattern-sweep-cash.md): the spouse is the spouse of the month (af_spouses_in_month, CO-7603), so a spouse who died before the month is not counted in it (3.520.63.A: widowed), and a client whose relationships are not stated, in a case of more than one person, cannot be determined (decision 4); before, every spouse edge counted in every month and unstated relationships were read as no spouse."
derived: ["case", [[">", ["+", "af_life_insurance_face_value", ["sum", "af_spouses_in_month", ["of", ["P"], "af_life_insurance_face_value"]]], "af_life_insurance_face_value_exemption_limit"], "af_life_insurance_countable_cash_value"], ["else", 0]]
sources: [S2213, S2618, S3217, S3204, S4791]
implemented: engine
tags: [cash, oap, resources]
rationale: "Final cash review 2, N-1: 3.520.75.E-F apply \"For OAP only\" to \"all life insurance policies owned by a client and his or her spouse\", so the rule follows the client's program, not the age of the spouse who owns a policy. This item states the OAP count for whichever spouse owns the policy; af_person_countable_resources (CO-3400) reads it for an OAP-age person's own policies and af_client_and_spouse_countable_resources (CO-2389) for the spouse of an OAP-age client."
tests:
  - {id: "CO-4001-T1", month: "2026-10", title: "A $10,000 policy bought in 2010, worth $5,000, no premiums in 48 months: exempt (E.1)", as_of: "2026-10-01", given: {holdings: [{kind: life_insurance, value: 5000, face_value: 10000, purchase_date: "2010-03-01", premiums_in_lookback: 0}]}, relationships: [], expect: 0}
  - {id: "CO-4001-T2", month: "2026-10", title: "Face value $1,500 or less: nothing counts (D)", as_of: "2026-10-01", given: {holdings: [{kind: life_insurance, value: 900, face_value: 1500}]}, relationships: [], expect: 0}
  - {id: "CO-4001-T3", month: "2026-10", title: "A policy bought in 2024: the whole cash value counts (E.3)", as_of: "2026-10-01", given: {holdings: [{kind: life_insurance, value: 5000, face_value: 10000, purchase_date: "2024-01-15"}]}, relationships: [], expect: 5000}
  - {id: "CO-4001-T4", month: "2026-10", title: "G-2 (probe PZ-2): the husband lives in another home; each owns a $1,000 policy - the face total is $2,000, over $1,500, and her 2024 policy is within 48 months: its $900 counts (3.520.75.D-E)", as_of: "2026-10-01", given: {dwelling_id: home_a, af_is_oap_age: true, holdings: [{kind: life_insurance, value: 900, face_value: 1000, purchase_date: "2024-03-01", premiums_in_lookback: 0}]}, others: {p2: {dwelling_id: home_b, holdings: [{kind: life_insurance, value: 900, face_value: 1000, purchase_date: "2024-03-01"}]}}, relationships: [[spouse, p1, p2]], expect: 900}
