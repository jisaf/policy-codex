id: CO-4001
name: "Adult Financial: countable life insurance under the OAP rule"
identifier: af_life_insurance_countable_value_for_oap
kind: derived
type: money
scope: person
program: AdultFinancial
meaning: "The part of this person's life insurance cash surrender value that counts toward the resources of an Old Age Pension client, whether the person is the client or the client's spouse: nothing when the total face value of the person's and the spouse's policies is af_life_insurance_face_value_exemption_limit or less (9 CCR 2503-5 3.520.75.D); otherwise the part 3.520.75.E-F count (af_life_insurance_countable_cash_value)."
precision: "The total face value adds the spouse in the home, as 3.520.75.D-F read \"a client and his or her spouse\". A face value not stated is read as 0. Coverage review P3: the face value is the original face value at purchase, not a face value increased by dividends or their reinvestment (3.520.75.A, G); a case states life_insurance_face_value so for an Adult Financial client."
derived: [case, [[">", [+, [otherwise, life_insurance_face_value, 0], [sum, [filter, [persons], [all, [otherwise, [rel, [spouse], [P]], false], [otherwise, [in_group, [P], lives_with], true]]], [otherwise, [of, [P], life_insurance_face_value], 0]]], af_life_insurance_face_value_exemption_limit], af_life_insurance_countable_cash_value], [else, 0]]
sources: [S2213, S2618, S3217]
implemented: engine
tags: [cash, oap, resources]
rationale: "Final cash review 2, N-1: 3.520.75.E-F apply \"For OAP only\" to \"all life insurance policies owned by a client and his or her spouse\", so the rule follows the client's program, not the age of the spouse who owns a policy. This item states the OAP count for whichever spouse owns the policy; af_person_countable_resources (CO-3400) reads it for an OAP-age person's own policies and af_client_and_spouse_countable_resources (CO-2389) for the spouse of an OAP-age client."
tests:
  - {id: CO-4001-T1, title: "A $10,000 policy bought in 2010, worth $5,000, no premiums in 48 months: exempt (E.1)", as_of: "2026-10-01", given: {life_insurance_face_value: 10000, life_insurance_cash_surrender_value: 5000, life_insurance_newest_policy_purchase_date: "2010-03-01", life_insurance_payments_in_lookback: 0}, relationships: [], expect: 0}
  - {id: CO-4001-T2, title: "Face value $1,500 or less: nothing counts (D)", as_of: "2026-10-01", given: {life_insurance_face_value: 1500, life_insurance_cash_surrender_value: 900}, relationships: [], expect: 0}
  - {id: CO-4001-T3, title: "A policy bought in 2024: the whole cash value counts (E.3)", as_of: "2026-10-01", given: {life_insurance_face_value: 10000, life_insurance_cash_surrender_value: 5000, life_insurance_newest_policy_purchase_date: "2024-01-15"}, relationships: [], expect: 5000}
