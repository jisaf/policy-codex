id: CO-4358
name: "Colorado Works: partial month payment factor"
identifier: cw_partial_month_payment_factor
kind: derived
type: rate
scope: person-month
program: ColoradoWorks
meaning: "The figure the authorized Colorado Works grant for the entire month is multiplied by for the month: in the month of the initial payment, when assistance begins on a day other than the first, the decimal figure of 9 CCR 2503-6 3.609.2.A.1 for the number of days for which payment is made, from the date assistance begins (the date of application, or the later date on which a unit ineligible on the date of application became eligible) through the last day of the month; in a month before the month in which assistance begins, 0, since the initial payment includes assistance only from that date; otherwise 1, the entire month."
precision: "The days run from the date assistance begins through the last day of the month, that date included: an application on October 12 is paid for 20 days of October (.65754). Assistance beginning on the first of the month is the entire month. The date of application is cw_application_date (CO-2372); the later eligibility date is cw_unit_eligible_from_date (CO-4359), read as the application date when not stated. A redetermination (cw_determination_is_redetermination, CO-2375) is not an initial payment, and a case that states no application date is read as a full month. Coverage pass 6 CA6-2: a case that states an application date states whether the determination is a redetermination (required, decision 4 of 2026-11-23); before, an unstated value was read as an application. Coverage pass 3 (CW3-3): a unit that applied on September 25 and became eligible on October 3 is paid nothing for September (factor 0) and 29 days of October (.95342); before, September was paid as an entire month."
derived: [case, [[all, [not, [unknown, cw_application_date]], [not, cw_determination_is_redetermination], ["<", [month], [month_of, [otherwise, cw_unit_eligible_from_date, cw_application_date]]]], 0], [[all, [not, [unknown, cw_application_date]], [not, cw_determination_is_redetermination], ["=", [month], [month_of, [otherwise, cw_unit_eligible_from_date, cw_application_date]]], [not, ["=", [otherwise, cw_unit_eligible_from_date, cw_application_date], [first_day, [month]]]]], [lookup, cw_partial_month_payment_factor_table, [days_between, [otherwise, cw_unit_eligible_from_date, cw_application_date], [first_day, [month_after, [month]]]]]], [else, 1]]
sources: [S3156]
implemented: engine
tags: [cash, tanf]
rationale: "Coverage pass 3 CW3-3 (P1, docs/reviews/coverage3-colorado-works.md): the factor was 1 in every month but the one containing the date assistance begins, so the application month of a unit that became eligible in the next month was paid in full (probe ZT-7, stored as CO-208: $488 for September where 3.609.2.A.1, S3156, begins assistance on October 3). Coverage review CW-8 (P1): nothing read cw_application_date for the payment, so the application month was paid in full ($488 for an October 12 application where the rule gives 20 days x .65754 x $488 = $320) and no proration was recorded as out of scope; SNAP and Adult Financial both prorate (af_partial_month_payment_factor, CO-2603, is the same shape). cw_grant_amount (CO-914) reads this factor."
tests:
  # Coverage pass 6 CA6-2: the kind of determination stated (decision 4): these tests are applications, the value the readers gave it when unstated.
  - {id: CO-4358-T1, title: "Probe CWZ-11: an application on October 12 - 20 days of October, .65754", as_of: "2026-10-15", month: "2026-10", given: {cw_determination_is_redetermination: false, cw_application_date: "2026-10-12"}, expect: 0.65754}
  - {id: CO-4358-T2, title: "The month after the application month is an entire month", as_of: "2026-11-02", month: "2026-11", given: {cw_application_date: "2026-10-12"}, expect: 1}
  - {id: CO-4358-T3, title: "An application on the first of the month: the entire month, not the 30-day figure", as_of: "2026-11-05", month: "2026-11", given: {cw_application_date: "2026-11-01"}, expect: 1}
  - {id: CO-4358-T4, title: "Ineligible on the date of application (October 12), eligible from October 22: 10 days, .32876", as_of: "2026-10-28", month: "2026-10", given: {cw_determination_is_redetermination: false, cw_application_date: "2026-10-12", cw_unit_eligible_from_date: "2026-10-22"}, expect: 0.32876}
  - {id: CO-4358-T5, title: "A redetermination is not an initial payment", as_of: "2026-10-15", month: "2026-10", given: {cw_application_date: "2026-10-12", cw_determination_is_redetermination: true}, expect: 1}
  - {id: CO-4358-T6, title: "No application date stated: the entire month", as_of: "2026-10-15", month: "2026-10", given: {}, expect: 1}
  - {id: CO-4358-T7, title: "An application on February 2, 2027: 27 days, .88768", as_of: "2027-02-10", month: "2027-02", given: {cw_determination_is_redetermination: false, cw_application_date: "2027-02-02"}, expect: 0.88768}
  - {id: CO-4358-T8, title: "Coverage pass 3 CW3-3 (probe ZT-7): applied September 25, eligible from October 3 - nothing for September", as_of: "2026-10-15", month: "2026-09", given: {cw_determination_is_redetermination: false, cw_application_date: "2026-09-25", cw_unit_eligible_from_date: "2026-10-03"}, expect: 0}
  - {id: CO-4358-T9, title: "Coverage pass 3 CW3-3 (probe ZT-7): the same unit's October - 29 days, .95342", as_of: "2026-10-15", month: "2026-10", given: {cw_determination_is_redetermination: false, cw_application_date: "2026-09-25", cw_unit_eligible_from_date: "2026-10-03"}, expect: 0.95342}
  - {id: CO-4358-T10, title: "A month before the application month is not paid", as_of: "2026-10-15", month: "2026-09", given: {cw_determination_is_redetermination: false, cw_application_date: "2026-10-12"}, expect: 0}
  - {id: "CO-4358-T11", title: "Coverage pass 6 CA6-2: an application date stated, the kind of determination not: cannot determine (decision 4)", month: "2026-10", as_of: "2026-10-15", given: {cw_application_date: "2026-10-12"}, expect: unknown}
