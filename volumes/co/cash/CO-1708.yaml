tags: [cash, income]
rationale: "Vocabulary fix round (docs/reviews/vocabulary-reuse.md, R-1): gives self-employment this program's own reading; before, the program read one shared net figure, or none. Earned-income records, step E1 Adult Financial: the receipts and costs are earnings records read through the program's counting table, a farm's apart from another business's."
tests:
  # Hand computations from 3.520.783.B (S1156) and C.1 (S3505).
  - {id: "CO-1708-T1", as_of: "2026-10-01", month: "2026-10", title: "$1,500 of receipts and $400 of operating costs: 1,500 - 400 = 1,100", given: {earnings: [{kind: self_employment_receipts, amount: 1500}, {kind: business_cost_operating, amount: 400}], licensed_child_care_children_in_care_count: 0}, expect: 1100}
  - {id: CO-1708-T2, as_of: "2026-10-01", month: "2026-10", title: "No self-employment - $200 of costs recorded, no receipts: 0", given: {earnings: [{kind: wages, amount: 900}, {kind: business_cost_operating, amount: 200}]}, expect: 0}
  - {id: "CO-1708-T3", as_of: "2026-10-01", month: "2026-10", title: "Costs above receipts: max(0, 300 - 450) = 0", given: {earnings: [{kind: self_employment_receipts, amount: 300}, {kind: business_cost_operating, amount: 450}], licensed_child_care_children_in_care_count: 0}, expect: 0}
  - {id: CO-1708-T4, title: "P2-2: a farmer with $2,000 of receipts and $1,000 of costs every month: 2025's net (2,000 - 1,000) x 12 = 12,000, averaged: 12,000 / 12 = 1,000 (3.520.783.C.1)", as_of: "2026-10-01", month: "2026-10", given: {earnings: [{kind: farm_self_employment_receipts, amount: 2000}, {kind: business_cost_operating, amount: 1000, farm: true}]}, expect: 1000}
  - {id: CO-1708-T5, title: "P2-2: stopped farming in June 2026 - no farm income (3.520.783.C.1)", as_of: "2026-10-01", month: "2026-10", given: {earnings: [{kind: farm_self_employment_receipts, amount: 2000, job_end_date: "2026-06-30"}, {kind: business_cost_operating, amount: 1000, farm: true}]}, expect: 0}
