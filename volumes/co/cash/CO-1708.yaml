id: CO-1708
name: "Adult Financial: net profit from self-employment"
identifier: af_self_employment_net_profit
kind: derived
type: money
scope: person-month
program: AdultFinancial
meaning: "The person's net profit from self-employment for the month under 9 CCR 2503-5 3.520.783: for a business other than a farm, its gross receipts in the month less the cost of doing business (af_self_employment_business_costs), not below zero (B, D); plus, for a farm, the net income of the prior calendar year averaged over af_farm_income_averaging_months (C.1), not below zero, and nothing once the person has ceased to farm."
precision: "Earned-income records, step E1 Adult Financial (docs/reviews/records-earnings-cash.md): the business's receipts are the earnings records the table counts net of costs (self_employment_receipts, af_earnings_treatment_table CO-5103: counted_net_of_costs) received in the month; a person with no such receipts has none, whatever the cost records say. A farm's receipts are the records the table averages over the year (farm_self_employment_receipts: counted_averaged_over_year) and its costs the deducted cost records marked farm, each month of the prior calendar year (January to December before the month's year) netted and the twelve summed, the same for every month of the year (C.1, S3505); the person has ceased to farm when a farm receipts record states a job_end_date before the month. Before earnings records a person was either farming (self_employment_is_farming, CO-3720) or not, and a farmer's other business was read as the farm; each business is now its own record, so a farmer with a shop has both. Rental and board income (C.2): rent from property the person manages is stated as the business's receipts as the case figures it; board, room, and room and board payments are af_boarder_income (CO-5131). The three-month proration of 3.520.781.G.2.c is stated in the supplied amounts. An unstated earnings list is cannot determine (decision 4 of 2026-11-23). Coverage pass 4 CA4-9 (docs/reviews/coverage4-cash.md): a stream (an earnings record with no month and no date) is read only in the months from the month of its job_start_date through the month of its job_end_date, so the pay of a job that ended before the month, or begins after it, is not counted (9 CCR 2503-5 3.520.781.G, 9 CCR 2503-6 3.605.2.B: income counted when received); a record stated with its month or date is read in that month."
