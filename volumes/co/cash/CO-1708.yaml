id: CO-1708
name: "Adult Financial: net profit from self-employment"
identifier: af_self_employment_net_profit
kind: derived
type: money
scope: person-month
program: AdultFinancial
meaning: "The person's net profit from self-employment for the month under 9 CCR 2503-5 3.520.783.B: gross receipts less the cost of doing business, not below zero."
precision: "Coverage review 2 (first-pass P2-2): farm income (self_employment_is_farming, CO-3720) is the net income of the prior calendar year (receipts less af_self_employment_business_costs, January to December before the month's year) averaged over af_farm_income_averaging_months, the same for every month of the year, never below zero, and nothing once the person has stopped farming (farming_self_employment_end_date before the month; 3.520.783.C.1, S3505); the day care allowance of C.3 is in af_self_employment_business_costs (CO-1707). Rental and board income (C.2) are stated by month in the receipts as the case figures them; the three-month proration of 3.520.78 is stated in the supplied amounts. A person with no gross receipts has none, whatever the cost fact says."
derived: [case, [[otherwise, self_employment_is_farming, false], [case, [[all, [not, [unknown, farming_self_employment_end_date]], ["<", farming_self_employment_end_date, [first_day, [month]]]], 0], [else, [max, 0, ["/", [sum_months, [months_from_to, [months_before, 12, [latest_month_of_year, 1, [month]]], [month_before, [latest_month_of_year, 1, [month]]]], [at, ["-", self_employment_gross_receipts, af_self_employment_business_costs], [that_month]]], af_farm_income_averaging_months]]]]], [["<=", self_employment_gross_receipts, 0], 0], [else, [max, 0, ["-", self_employment_gross_receipts, af_self_employment_business_costs]]]]
sources: [S1156, S3505]
implemented: engine
tags: [cash, income]
rationale: "Vocabulary fix round (docs/reviews/vocabulary-reuse.md, R-1): gives self-employment this program's own reading; before, the program read one shared net figure, or none."
tests:
  - {id: CO-1708-T1, as_of: "2026-10-01", month: "2026-10", given: {self_employment_gross_receipts: 1500, af_self_employment_business_costs: 400}, expect: 1100}
  - {id: CO-1708-T2, as_of: "2026-10-01", month: "2026-10", title: "No self-employment - costs not read", given: {self_employment_gross_receipts: 0}, expect: 0}
  - {id: CO-1708-T3, as_of: "2026-10-01", month: "2026-10", title: "Costs above receipts", given: {self_employment_gross_receipts: 300, af_self_employment_business_costs: 450}, expect: 0}
  - {id: CO-1708-T4, title: "P2-2: a farmer with $24,000 of receipts and $12,000 of costs in 2025 (2,000 and 1,000 a month) and none in October 2026 - 12,000 / 12 = 1,000 (3.520.783.C.1)", as_of: "2026-10-01", month: "2026-10", given: {self_employment_is_farming: true, self_employment_gross_receipts: {"2025-01": 2000, "2025-02": 2000, "2025-03": 2000, "2025-04": 2000, "2025-05": 2000, "2025-06": 2000, "2025-07": 2000, "2025-08": 2000, "2025-09": 2000, "2025-10": 2000, "2025-11": 2000, "2025-12": 2000, "2026-10": 0}, self_employment_operating_costs: {"2025-01": 1000, "2025-02": 1000, "2025-03": 1000, "2025-04": 1000, "2025-05": 1000, "2025-06": 1000, "2025-07": 1000, "2025-08": 1000, "2025-09": 1000, "2025-10": 1000, "2025-11": 1000, "2025-12": 1000}}, expect: 1000}
  - {id: CO-1708-T5, title: "P2-2: stopped farming in June 2026 - no farm income (3.520.783.C.1)", as_of: "2026-10-01", month: "2026-10", given: {self_employment_is_farming: true, farming_self_employment_end_date: "2026-06-30"}, expect: 0}
