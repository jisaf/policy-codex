nd]], deducted], [receipt, farm], [received_in, [month]]], [any, [not, [unknown, [receipt, month]]], [all, [any, [unknown, [receipt, job_start_date]], ["<=", [month_of, [receipt, job_start_date]], [month]]], [any, [unknown, [receipt, job_end_date]], [">=", [month_of, [receipt, job_end_date]], [month]]]]]], [receipt, amount]]], [that_month]]], af_farm_income_averaging_months]]]]]
