id: CO-5340
name: "Adult Financial: cash and convertible holdings"
identifier: af_cash_and_convertible_holdings
kind: derived
type: money
scope: person
program: AdultFinancial
meaning: "The person's cash and convertible assets (9 CCR 2503-5 3.520.72.B.5-6, 3.520.73): the person's holdings records (holdings, CO-5300) valued in the determination month and still held whose row in af_holding_treatment_table (CO-5302) is a cash row - counted (cash, accounts, securities, installment contracts, mortgages and notes the person holds; personal property held as an investment, also counted, is af_countable_personal_property, CO-5345), counted because no rule excludes it, excluded (an ABLE account, business cash) or excluded for a time (refunds, retroactive benefits, loan proceeds and replacement proceeds still held) - each at its value times the person's share (3.520.73.A.2: a joint account \"in proportion to the number of persons on the account\"). The part exempt now is af_exempt_liquid_resources (CO-4412)."
precision: "Resource records, step H1 Adult Financial (docs/reviews/records-holdings-snap-af.md): the money a rule exempts by its source is its own record (held_income_tax_refund, held_retroactive_ssa_benefit, held_loan_proceeds, held_replacement_proceeds), never a part of one liquid figure, so it is counted here once and exempted by CO-4412 while its window runs. An account the person cannot reach (accessible) is counted, as before: 3.520.72.A counts every resource \"unless otherwise specified\" and 3.520.741.D.1 does not treat a co-owner's refusal as a restriction; Adult Financial reads no accessible field. The value of an account is read as stated (no encumbrance, as before step H1); an installment contract and a mortgage or note the person holds are counted at their value less what is owed against them, never below zero (3.520.741.B.1, the equity, as the real property they were part of before step H1)."
derived: ["sum_receipts", "holdings", ["all", ["all", ["received_in", ["det_month"]], ["unknown", ["receipt", "disposed_date"]]], ["in", ["lookup", "af_holding_treatment_table", ["receipt", "kind"]], ["counted", "counted_no_rule_excludes", "excluded", "excluded_within_twelve_months", "excluded_within_nine_months", "excluded_in_month_received", "excluded_three_or_six_months"]], ["not", ["=", ["receipt", "kind"], "investment_personal_property"]]], ["*", ["case", [["in", ["receipt", "kind"], ["installment_contract", "loan_receivable"]], ["max", 0, ["-", ["receipt", "value"], ["receipt", "amount_owed"]]]], ["else", ["receipt", "value"]]], ["otherwise", ["receipt", "share"], 1]]]
sources: [S1636, S2213, S3206, S4693]
implemented: engine
tags: [cash, resources]
rationale: "Resource records, step H1 Adult Financial (docs/reviews/records-holdings-snap-af.md): Adult Financial reads the person's resources from the holdings records (holdings, CO-5300) through its counting table (af_holding_treatment_table, CO-5302), for the client, the spouse and each sponsor alike (3.520.72.A, E), never from the scalar resource facts. Replaces the liquid_resources_value that af_person_countable_resources_other_than_life_insurance (CO-4000) read with its parts subtracted."
tests:
  # Hand-computed from 9 CCR 2503-5 3.520.72.B.5-6 (S2213) and 3.520.73.A.2 (S4693).
  - {id: CO-5340-T1, title: "$700 in savings, $500 of a refund held and a $3,000 ABLE account: 700 + 500 + 3,000 = 4,200 (CO-4412 takes off what is exempt)", as_of: "2026-10-01", given: {holdings: [{kind: bank_account, value: 700}, {kind: held_income_tax_refund, value: 500, paid_by: state, source_date: "2026-08-14"}, {kind: able_account, value: 3000}]}, expect: 4200}
  - {id: CO-5340-T2, title: "A $4,000 account held with a daughter (share 0.5): 4,000 x 0.5 = 2,000 (3.520.73.A.2)", as_of: "2026-10-01", given: {holdings: [{kind: bank_account, value: 4000, share: 0.5, co_owners: outside_case, holding_id: acct}]}, expect: 2000}
  - {id: CO-5340-T3, title: "A $2,500 promissory note the client holds counts (3.520.72.B.6); a vehicle and the home are not cash: 2,500", as_of: "2026-10-01", given: {holdings: [{kind: loan_receivable, value: 2500, amount_owed: 0}, {kind: vehicle, value: 4000, amount_owed: 0, used_for_transportation: true}, {kind: home, value: 90000, amount_owed: 0, lives_in: true}]}, expect: 2500}
  - {id: CO-5340-T4, title: "Decision 4: holdings not stated - cannot determine", as_of: "2026-10-01", given: {}, expect: unknown}
