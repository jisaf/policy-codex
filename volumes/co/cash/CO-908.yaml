id: CO-908
name: "Colorado Works: countable unearned income"
identifier: cw_countable_unearned_income
kind: derived
type: money
scope: person-month
program: ColoradoWorks
meaning: "This person's countable unearned income for the month for the Colorado Works eligibility test under 9 CCR 2503-6 3.605.3: Social Security, pension, unemployment, Adult Financial grants, other unearned income (taxable or not), plus the child support counted against the need standard (cw_counted_child_support, CO-2553: the month's current support at application, consistent support averaging over $500 at redetermination, 3.605.5.A and C). The unit's own Colorado Works grant is not income to it. The grant calculation reads cw_payment_countable_unearned_income (CO-2554), which leaves child support out (3.605.5.B)."
precision: "Vocabulary fix round (R-1): Colorado Works' own grant (tanf_cash_income) is no longer counted against the unit; Adult Financial grants are, since 3.605.4 does not exempt them. SSI is not counted: 3.605.4.B.27 exempts an SSI recipient's income. Child support arrears are exempt (3.605.5.D): cw_counted_child_support (CO-2553) leaves out the arrears stated within child_support_received (child_support_arrears_received, CO-3814; final cash review FC-2). Coverage review (CW-9, CW-11, CW-14, CW-22, CW-23): lottery and gambling winnings, which are not part of the unearned income facts (lottery_gambling_winnings_received, CO-1181), are a prize (3.605.3.A.14, S3157) and are added; so is potential income the client refuses to make a reasonable effort to secure (cw_refused_potential_income, CO-4362, 3.605.1.A.3.c, S3160); both are read as 0 when not stated. Besides the exempt sources (CO-2341), cw_unearned_income_deductions (CO-4369) is subtracted: allowable rental expenses, insurance and lump-sum amounts spent or designated for the costs the rule names, workers' compensation award expenses, refugee resettlement money, insurance cash value taken, an SMIB refund and a retroactive Colorado Works payment (S3157, S3158, S3163, S3166, S3167)."
derived: [max, 0, ["-", [+, social_security_income, pension_income, unemployment_income, adult_financial_cash_income, cw_counted_child_support, other_unearned_income_taxable, other_unearned_income_nontaxable, tax_exempt_interest, [otherwise, lottery_gambling_winnings_received, 0], [otherwise, cw_refused_potential_income, 0]], ["+", [otherwise, cw_excluded_unearned_income, 0], cw_unearned_income_deductions]]]
sources: [S1621, S412, S1805, S3157, S3158, S3160, S3163, S3166, S3167]
implemented: engine
tags: [cash, tanf, income]
rationale: No existing item sums Colorado Works countable unearned income; cw_countable_income (CO-910) needs it.
