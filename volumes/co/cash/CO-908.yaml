id: CO-908
name: "Colorado Works: countable unearned income"
identifier: cw_countable_unearned_income
kind: derived
type: money
scope: person-month
program: ColoradoWorks
meaning: "This person's countable unearned income for the month for the Colorado Works eligibility test under 9 CCR 2503-6 3.605.3: Social Security, pension, unemployment, Adult Financial grants, other unearned income (taxable or not), plus the child support counted against the need standard (cw_counted_child_support, CO-2553: the month's current support at application, consistent support averaging over $500 at redetermination, 3.605.5.A and C). The unit's own Colorado Works grant is not income to it. The grant calculation reads cw_payment_countable_unearned_income (CO-2554), which leaves child support out (3.605.5.B)."
precision: "Vocabulary fix round (R-1): Colorado Works' own grant (tanf_cash_income) is no longer counted against the unit; Adult Financial grants are, since 3.605.4 does not exempt them. SSI is not counted: 3.605.4.B.27 exempts an SSI recipient's income. Child support arrears are exempt (3.605.5.D): cw_counted_child_support (CO-2553) leaves out the arrears stated within child_support_received (child_support_arrears_received, CO-3814; final cash review FC-2)."
derived: [max, 0, ["-", [+, social_security_income, pension_income, unemployment_income, adult_financial_cash_income, cw_counted_child_support, other_unearned_income_taxable, other_unearned_income_nontaxable, tax_exempt_interest], [otherwise, cw_excluded_unearned_income, 0]]]
sources: [S1621, S412, S1805]
implemented: engine
tags: [cash, tanf, income]
rationale: No existing item sums Colorado Works countable unearned income; cw_countable_income (CO-910) needs it.
tests:
  - {id: CO-908-T1, as_of: "2026-10-01", month: "2026-10", given: {social_security_income: 0, pension_income: 0, unemployment_income: 0, tanf_cash_income: 0, adult_financial_cash_income: 0, ssi_income: 0, child_support_received: 0, other_unearned_income_nontaxable: 0, other_unearned_income_taxable: 0, tax_exempt_interest: 0}, expect: 0}
  - {id: CO-908-T2, as_of: "2026-10-01", month: "2026-10", given: {social_security_income: 200, pension_income: 0, unemployment_income: 0, tanf_cash_income: 0, adult_financial_cash_income: 0, ssi_income: 0, child_support_received: 100, other_unearned_income_nontaxable: 0, other_unearned_income_taxable: 0, tax_exempt_interest: 0}, expect: 300}
  - {id: CO-908-T3, title: "Vocabulary fix round (R-1): the unit's own Colorado Works grant is not counted; an Adult Financial grant is", as_of: "2026-10-01", month: "2026-10", given: {social_security_income: 0, pension_income: 0, unemployment_income: 0, tanf_cash_income: 500, adult_financial_cash_income: 300, child_support_received: 0, other_unearned_income_nontaxable: 0, other_unearned_income_taxable: 0, tax_exempt_interest: 0}, expect: 300}
  # Phase-10 sweep (OQ-390): $250 of other nontaxable income is exempt under 3.605.4.A.
  - {id: CO-908-T4, as_of: "2026-10-01", month: "2026-10", given: {social_security_income: 400, pension_income: 0, unemployment_income: 0, tanf_cash_income: 0, adult_financial_cash_income: 0, ssi_income: 0, child_support_received: 0, other_unearned_income_nontaxable: 250, other_unearned_income_taxable: 0, tax_exempt_interest: 0, cw_excluded_unearned_income: 250}, expect: 400}
  - {id: CO-908-T5, title: "CDHS review B-2: at redetermination, inconsistent support is not counted", as_of: "2026-10-01", month: "2026-10", given: {social_security_income: 0, pension_income: 0, unemployment_income: 0, adult_financial_cash_income: 0, child_support_received: 300, other_unearned_income_nontaxable: 0, other_unearned_income_taxable: 0, tax_exempt_interest: 0, cw_determination_is_redetermination: true, cw_child_support_months_received_of_last_six: 4, cw_unit_consistent_child_support_average: 0}, expect: 0}
