  - {id: CO-908-T3, month: "2026-10", as_of: "2026-10-01", given: {receipts: [{kind: colorado_works_cash, amount: 500}, {kind: adult_financial_cash, amount: 300}]}, title: "Vocabulary fix round (R-1): the unit's own Colorado Works grant is not counted; an Adult Financial grant is", expect: 300}
  - {id: CO-908-T4, month: "2026-10", as_of: "2026-10-01", given: {receipts: [{kind: social_security, amount: 400}, {kind: general_assistance, amount: 250}]}, title: "Exempt income (county General Assistance, 3.605.4.A.7) is not counted", expect: 400}
  - {id: CO-908-T5, month: "2026-10", as_of: "2026-10-01", given: {cw_determination_is_redetermination: true, cw_child_support_months_received_of_last_six: 4, cw_unit_consistent_child_support_average: 0, receipts: [{kind: child_support, amount: 300}]}, title: "CDHS review B-2: at redetermination, inconsistent support is not counted", expect: 0}
  - {id: CO-908-T6, month: "2026-10", as_of: "2026-10-01", given: {cw_refused_potential_income: 200, receipts: [{kind: gambling_winnings, amount: 1000, frequency: once, month: "2026-10"}, {kind: ssi, amount: 900}]}, title: "Coverage review CW-9, CW-11: a $1,000 prize (3.605.3.A.14) and $200 of potential income the client refuses to secure (3.605.1.A.3.c); SSI is exempt (B.27)", expect: 1200}
  - {id: CO-908-T7, month: "2026-10", as_of: "2026-10-01", given: {}, title: "Receipts not stated: cannot determine", expect: unknown}
