open: ["OQ-1292"]
sources: [S2608, S4910]
implemented: engine
tags: [cash, income]
rationale: "Final cash review 2, P2-3: af_excluded_infrequent_income (CO-3827) summed only unearned infrequent income, so infrequent earnings were never exempt though O is not limited to unearned income. The quarter total is stated once and read by the unearned (CO-3827) and earned (CO-4012) exclusions. Earned-income records, step E1 Adult Financial: the earned part is read from the earnings records."
tests:
  # Hand computations from 3.520.786.O (S2608).
  - {id: CO-4011-T1, month: "2026-05", as_of: "2026-05-15", given: {receipts: [{kind: social_security, amount: 700}, {kind: other_nontaxable, amount: 40, irregular: true, month: "2026-05"}], earnings: [{kind: wages, amount: 500}, {kind: wages, irregular: true, amount: 30, month: "2026-06"}]}, title: "$40 of unearned income in May and $30 of odd-job pay in June: 40 + 30 = $70 in the quarter", expect: 70}
  - {id: CO-4011-T2, month: "2026-05", as_of: "2026-05-15", given: {receipts: [{kind: social_security, amount: 700}, {kind: other_nontaxable, amount: 40, irregular: true, month: "2026-05"}], earnings: [{kind: wages, amount: 500}, {kind: wages, irregular: true, amount: 30, month: "2026-07"}]}, title: "$40 in May and $30 in July (the next quarter): $40", expect: 40}
  - {id: CO-4011-T3, month: "2026-11", as_of: "2026-11-15", given: {receipts: [], earnings: [{kind: work_study, irregular: true, amount: 25, month: "2026-10"}, {kind: self_employment_receipts, irregular: true, amount: 50, month: "2026-12"}, {kind: business_cost_operating, irregular: true, amount: 20, month: "2026-12"}]}, title: "An odd work-study job of $25 in October and a one-off $50 sale in December, with $20 of costs: 25 + 50 = $75 (income of every kind counts toward O's limit; a cost is not income)", expect: 75}
  - {id: CO-4011-T4, month: "2026-05", as_of: "2026-05-15", given: {receipts: []}, title: "Earnings not stated: the quarter's earned part cannot be determined (decision 4)", expect: unknown}
  # Decision 4 of 2026-11-23: receipts not stated are cannot determine; a stated empty list is no payment.
  - {id: CO-4011-T5, month: "2026-05", as_of: "2026-05-15", given: {earnings: [{kind: wages, irregular: true, amount: 30, month: "2026-05"}]}, title: "Receipts not stated: the quarter's unearned part cannot be determined (decision 4)", expect: unknown}
  - {id: CO-4011-T6, month: "2026-05", as_of: "2026-05-15", given: {receipts: [], earnings: [{kind: wages, irregular: true, amount: 30, month: "2026-05"}]}, title: "Receipts stated empty: $30 of odd-job pay in the quarter: 30", expect: 30}
  # Field sweep fix round (FS-AF-1): hand-computed from 9 CCR 2503-5 3.520.781.G (S4910): a stream is received only from the month of its start_date through the month of its end_date.
  - {"id": "CO-4011-T7", "month": "2026-05", "as_of": "2026-05-15", "title": "$40 of irregular income stated without a month, ending 2026-04-30, in the April-June quarter: April's only, 40 (not 40 x 3 = 120)", "given": {"receipts": [{"kind": "other_nontaxable", "amount": 40, "irregular": true, "end_date": "2026-04-30"}], "earnings": []}, "expect": 40}
