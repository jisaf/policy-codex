id: CO-3827
name: "Adult Financial: excluded infrequent or irregular income"
identifier: af_excluded_infrequent_income
kind: derived
type: money
scope: person-month
program: AdultFinancial
meaning: The person's infrequent or irregular income for the month (infrequent_or_irregular_income_received) when the infrequent or irregular income of the calendar quarter containing the month is less than af_infrequent_income_quarterly_limit, which 9 CCR 2503-5 3.520.786.O exempts; otherwise 0.
precision: "The quarter is the calendar quarter (January-March, April-June, July-September, October-December) containing the month, found from the month's calendar number (its place in the quarter is that number less one, less three times the whole quarters before it); its total adds the fact for each of its three months, a month not stated being 0. The fact is unearned income. Final cash review 2, P2-3: the quarter's total is af_infrequent_income_quarter_total (CO-4011), which adds infrequent earned income, so the two share O's one limit; the earned part is excluded by af_excluded_infrequent_earned_income (CO-4012). Receipt records, migration phase 1: the month's infrequent or irregular income is its counted receipts marked irregular. When the quarter's total is under the limit and the receipts are not stated, the amount excluded cannot be determined: 3.520.786.O exempts income received and gives no reading for income not reported (decision 4 of 2026-11-23 (docs/plan-colorado.md): missing information is cannot determine unless the rule says otherwise; the phase-1 default of 0 is removed); a stated empty list excludes 0."
derived: [case, [["<", af_infrequent_income_quarter_total, af_infrequent_income_quarterly_limit], [sum_receipts, receipts, [all, [receipt, irregular], [received_in, [month]], [in, [lookup, af_receipt_treatment_table, [receipt, kind]], [counted, counted_no_rule_excludes, counted_less_one_third_for_ssi_child, counted_less_child_gift_exclusion]]], [receipt, amount]]], [else, 0]]
sources: [S2608, S2609]
implemented: engine
tags: [cash, income]
rationale: "Final cash review FC-3: 3.520.786.O (S2608) exempts infrequent or irregular income of less than $60 in a calendar quarter, and af_excluded_unearned_income (CO-2343) could not exclude it. The quarter total is a sum over the quarter's months, so the case states each month's receipt once."
tests:
  - {id: CO-3827-T1, month: "2026-05", as_of: "2026-05-15", given: {}, title: "A $40 gift in May, nothing else in the quarter: exempt", persons: {p1: {months: {"2026-05": {}}, facts: {receipts: [{kind: social_security}, {kind: ssi}, {kind: pension}, {kind: unemployment_compensation}, {kind: child_support}, {kind: colorado_works_cash}, {kind: adult_financial_cash}, {kind: tax_exempt_interest}, {kind: other_taxable}, {kind: other_nontaxable}, {kind: other_nontaxable, amount: 40, irregular: true, month: "2026-05"}]}}}, expect: 40}
  - {id: CO-3827-T2, month: "2026-05", as_of: "2026-05-15", given: {}, title: "$40 in May and $30 in June: $70 in the quarter, counted", persons: {p1: {months: {"2026-05": {}, "2026-06": {}}, facts: {receipts: [{kind: social_security}, {kind: ssi}, {kind: pension}, {kind: unemployment_compensation}, {kind: child_support}, {kind: colorado_works_cash}, {kind: adult_financial_cash}, {kind: tax_exempt_interest}, {kind: other_taxable}, {kind: other_nontaxable}, {kind: other_nontaxable, amount: 40, irregular: true, month: "2026-05"}, {kind: other_nontaxable, amount: 30, irregular: true, month: "2026-06"}]}}}, expect: 0}
  - {id: CO-3827-T3, month: "2026-05", as_of: "2026-05-15", given: {}, title: "$40 in May, $30 in July (the next quarter): exempt", persons: {p1: {months: {"2026-05": {}, "2026-07": {}}, facts: {receipts: [{kind: social_security}, {kind: ssi}, {kind: pension}, {kind: unemployment_compensation}, {kind: child_support}, {kind: colorado_works_cash}, {kind: adult_financial_cash}, {kind: tax_exempt_interest}, {kind: other_taxable}, {kind: other_nontaxable}, {kind: other_nontaxable, amount: 40, irregular: true, month: "2026-05"}, {kind: other_nontaxable, amount: 30, irregular: true, month: "2026-07"}]}}}, expect: 40}
  - {id: CO-3827-T4, month: "2026-10", as_of: "2026-10-01", given: {receipts: []}, title: "Receipts stated empty: no infrequent income, nothing excluded", expect: 0}
  - {id: CO-3827-T5, month: "2026-10", as_of: "2026-10-01", given: {}, title: "Receipts not stated: the infrequent income excluded cannot be determined (decision 4 of 2026-11-23)", expect: unknown}
