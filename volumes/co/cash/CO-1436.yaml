id: CO-1436
name: "Adult Financial: pending verification count"
identifier: af_pending_verification_count
kind: derived
type: whole number
scope: person-month
program: AdultFinancial
role: outcome
meaning: "The number of Adult Financial verification elements for this client not yet verified: age, residency and identity (always required), SSN, citizenship and immigration status (Aid to the Needy Disabled), resources other than cash, earned and unearned income, SSI disability, the AND-SO disability certification, a questionable marital status and sponsor information."
precision: Zero where Adult Financial verification does not apply to the person (af_verification_is_applicable, CO-2584; case worker review B2).
derived: [case, [af_verification_is_applicable, ["+", [case, [af_age_verification_is_pending, 1], [else, 0]], [case, [af_residency_verification_is_pending, 1], [else, 0]], [case, [af_identity_verification_is_pending, 1], [else, 0]], [case, [af_ssn_verification_is_pending, 1], [else, 0]], [case, [af_citizenship_verification_is_pending, 1], [else, 0]], [case, [af_immigration_status_verification_is_pending, 1], [else, 0]], [case, [af_resources_verification_is_pending, 1], [else, 0]], [case, [af_earned_income_verification_is_pending, 1], [else, 0]], [case, [unearned_income_verification_is_pending, 1], [else, 0]], [case, [af_disability_verification_is_pending, 1], [else, 0]], [case, [af_and_so_disability_verification_is_pending, 1], [else, 0]], [case, [af_marital_status_verification_is_pending, 1], [else, 0]], [case, [af_sponsor_verification_is_pending, 1], [else, 0]]]], [else, 0]]
sources: [S879, S880, S882, S883, S885, S1063, S1078, S1080]
implemented: engine
tags: [verification, cash, oap, and]
rationale: "The client-level count. Fix round (review U-1, C-7, C-10, C-11, K-2, K-6): the count sums the named per-element items."
tests:
  - {id: CO-1436-T1, month: "2026-10", as_of: "2026-10-01", given: {af_verification_is_applicable: true, af_age_verification_is_pending: false, af_residency_verification_is_pending: true, af_identity_verification_is_pending: false, af_ssn_verification_is_pending: false, af_citizenship_verification_is_pending: false, af_immigration_status_verification_is_pending: false, af_resources_verification_is_pending: true, af_earned_income_verification_is_pending: false, af_disability_verification_is_pending: false, af_and_so_disability_verification_is_pending: false, af_marital_status_verification_is_pending: false, af_sponsor_verification_is_pending: false, unearned_income_verification_is_pending: false}, expect: 2}
  - {id: CO-1436-T2, month: "2026-10", as_of: "2026-10-01", given: {af_verification_is_applicable: true, af_age_verification_is_pending: false, af_residency_verification_is_pending: false, af_identity_verification_is_pending: false, af_ssn_verification_is_pending: false, af_citizenship_verification_is_pending: false, af_immigration_status_verification_is_pending: false, af_resources_verification_is_pending: false, af_earned_income_verification_is_pending: false, af_disability_verification_is_pending: false, af_and_so_disability_verification_is_pending: false, af_marital_status_verification_is_pending: false, af_sponsor_verification_is_pending: false, unearned_income_verification_is_pending: false}, expect: 0}
