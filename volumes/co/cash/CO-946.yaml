id: CO-946
name: "Adult Financial: countable income"
identifier: af_countable_income
kind: derived
type: money
scope: person-month
program: AdultFinancial
meaning: "The person's total countable income for the month for Adult Financial purposes, per 9 CCR 2503-5 3.533 (OAP), 3.544 (AND-SO) and 3.549 (AND-CS) - countable unearned income is gross unearned income less any SSI, less the client's unearned income disregard (af_general_income_disregard_applied_to_unearned, CO-3832: the $20 of af_general_income_disregard, or a married client's equal share of it, A.2.c.1; never more than that income, so an SSI-only client gets none), with the full SSI added back (A.2.a-e); for OAP and AND-CS clients, unearned income includes the in-kind support and maintenance the county determines, up to the ISM maximum (3.520.79); for OAP and AND-CS clients only, when unearned income is under that disregard its unused part goes to the earned income calculation (3.533.A.2.f, 3.549.A.2.f; af_general_income_disregard_rolled_to_earned, CO-3833); countable earned income is gross earned income less that unused amount and af_earned_income_disregard (CO-3047), times af_earned_income_remainder_rate (CO-3048) (A.1)."
precision: "SSI is read as ssi_income (CO-849) when receives_ssi is true and as zero otherwise, so a non-SSI client needs no ssi_income statement. OQ-351 resolved (CDHS review S-5): the unused part of the ssi_general_income_exclusion that A.2.f rolls to earned income is measured on the unearned income other than SSI, because A.2.b sets SSI aside before A.2.c deducts the ssi_general_income_exclusion 'from the remainder' and SSI, income based on need, cannot absorb the exclusion (20 CFR 416.1124(c)(12), S310, the SSI program's own order); an SSI recipient whose other unearned income is under ssi_general_income_exclusion rolls the rest to earnings. The unused amount is subtracted before the $65, the SSI order of 20 CFR 416.1112(c). The ISM term is limited to an OAP-age person or an AND-CS-eligible person (af_is_oap_age, af_and_cs_eligible, neither of which reads this item) because 3.520.79 applies to OAP and AND-CS only. Final cash review FC-4 and FC-5, both confirmed with the engine: the $20 is split equally for a married client (af_client_general_income_disregard, CO-3829; OQ-661), so two OAP spouses with $500 of Social Security each have 490 countable each, not 480; and the unused $20 rolls to earnings for OAP and AND-CS only, since 3.544 (AND-SO, S2611) states no rollover, so an AND-SO client with $465 of wages has (465 - 65) / 2 = 200 countable, not 190. The gross earned income, the unearned income other than SSI, the disregard applied and the amount rolled are their own items (CO-3830 to CO-3833), which the spouse deeming of CO-2384 also reads. Income the client refused to secure is counted as available (3.520.71.G.1, af_refused_potential_income, through CO-3831). Reads Adult Financial's own disregards (af_earned_income_disregard CO-3047, af_earned_income_remainder_rate CO-3048, af_general_income_disregard CO-3049): hard-coded numbers audit D-4 found that it read the SSI-method parameters (CO-230 to CO-232) because 3.533/3.544/3.549 state the same dollar figures, but the rule states its own figures and an SSI change would not change them without an amendment. Vocabulary fix round (R-1): gross earned income includes the self-employment net profit of 3.520.783.B (af_self_employment_net_profit, CO-1708); unearned income no longer includes the Adult Financial grant itself (the shared cash assistance fact was split, and tanf_cash_income is Colorado Works only). Receipt records, migration phase 1: the SSI added back is af_ssi_receipts is read from the receipts (CO-5000)."
derived: ["+", af_deemed_relative_income, af_deemed_sponsor_income, ["*", [max, 0, ["-", ["-", af_gross_earned_income, af_general_income_disregard_rolled_to_earned], af_earned_income_disregard]], af_earned_income_remainder_rate], ["-", af_unearned_income_other_than_ssi, af_general_income_disregard_applied_to_unearned], [case, [receives_ssi, af_ssi_receipts], [else, 0]]]
sources: [S1622, S457, S461, S465, S1002, S1003, S1012, S1632, S1633, S1634, S2610, S2611, S2612, S2623]
implemented: engine
tags: [cash, oap, and, income]
rationale: "No existing item states the Adult Financial income-disregard formula. af_category (CO-953), af_oap_grant (CO-951), and af_and_grant (CO-952) need it. Not identical to ma_ssi_countable_earned_income/ma_ssi_countable_unearned_income (CO-605/CO-606), which combine a living-together spouse's income into one couple-level disregard per SSI's 'mutually available' rule (8.100.5.H.1.a); Adult Financial instead deems a spouse's income separately (3.534, 3.544.D-G, 3.549.C-G; af_deemed_relative_income, CO-2384, since OQ-114's resolution), so this item adds the deemed amount to the person's own income. Phase-8 fix round (B-2): the item never counted SSI, so an AND-CS client (who must receive SSI) was paid the whole standard; the current 3.533.A.2 and 3.549.A.2 (S1002, S1003) subtract SSI, apply the $20 to the rest and add the SSI back, which ssi_income (CO-849) now allows (OQ-115 resolved). The $20 rollover (A.2.f) and the OAP/AND-CS in-kind support and maintenance (K-4, 3.520.79, S1012) are added."
nearest: [CO-605, CO-606]
