id: CO-946
name: "Adult Financial: countable income"
identifier: af_countable_income
kind: derived
type: money
scope: person-month
program: AdultFinancial
meaning: The person's total countable income for the month for Adult Financial purposes, per 9 CCR 2503-5 3.533 (OAP), 3.544 (AND-SO) and 3.549 (AND-CS) - countable unearned income is gross unearned income less any SSI, less the $20 disregard (never below zero, so an SSI-only client gets none), with the full SSI added back (A.2.a-e); for OAP and AND-CS clients, unearned income includes the in-kind support and maintenance the county determines, up to the ISM maximum (3.520.79); when gross unearned income is under $20 the unused part of the $20 goes to the earned income calculation (A.2.f); countable earned income is gross earned income less that unused amount and $65, divided by two (A.1).
precision: "SSI is read as ssi_income (CO-849) when receives_ssi is true and as zero otherwise, so a non-SSI client needs no ssi_income statement. 'Gross unearned income' in A.2.f is read literally as A.2.a's 'gross unearned income from all sources', SSI included, so an SSI recipient whose other unearned income is under $20 has no unused disregard to roll to earnings (OQ-351); the unused amount is subtracted before the $65, the SSI order of 20 CFR 416.1112(c). The ISM term is limited to an OAP-age person or an AND-CS-eligible person (af_is_oap_age, af_and_cs_eligible, neither of which reads this item) because 3.520.79 applies to OAP and AND-CS only. See OQ-114 - does not add a deemed amount from a non-recipient spouse or a sponsor, and does not split the $20 between married clients (A.2.c.1). Reuses ma_ssi_earned_income_exclusion (CO-231, $65), ma_ssi_earned_income_disregard_rate (CO-232, one-half), and ma_ssi_general_income_exclusion (CO-230, $20) cross-program, because 3.533/3.544/3.549's disregard amounts are the identical dollar figures the SSI-related Medicaid chapter's own $65 and $20 disregards carry (20 CFR 416.1112(c), 416.1124(c)(12)), so an Adult-Financial-prefixed duplicate parameter of the same value is not created."
derived: [+, ["*", [max, 0, ["-", ["-", earned_income, [max, 0, ["-", ma_ssi_general_income_exclusion, [+, [+, social_security_income, pension_income, unemployment_income, cash_assistance_income, child_support_received, other_unearned_income, [case, [[any, af_is_oap_age, af_and_cs_eligible], [min, af_in_kind_support_and_maintenance, af_ism_maximum]], [else, 0]]], [case, [receives_ssi, ssi_income], [else, 0]]]]]], ma_ssi_earned_income_exclusion]], ma_ssi_earned_income_disregard_rate], [max, 0, ["-", [+, social_security_income, pension_income, unemployment_income, cash_assistance_income, child_support_received, other_unearned_income, [case, [[any, af_is_oap_age, af_and_cs_eligible], [min, af_in_kind_support_and_maintenance, af_ism_maximum]], [else, 0]]], ma_ssi_general_income_exclusion]], [case, [receives_ssi, ssi_income], [else, 0]]]
sources: [S457, S461, S465, S1002, S1003, S1012]
open: [OQ-114, OQ-351]
implemented: engine
tags: [cash, oap, and, income]
rationale: "No existing item states the Adult Financial income-disregard formula. af_category (CO-953), af_oap_grant (CO-951), and af_and_grant (CO-952) need it. Not identical to ma_ssi_countable_earned_income/ma_ssi_countable_unearned_income (CO-605/CO-606), which combine a living-together spouse's income into one couple-level disregard per SSI's 'mutually available' rule (8.100.5.H.1.a); Adult Financial instead deems a spouse's income separately (3.534, 3.544.D-G, 3.549.C-G, not modeled per OQ-114), so this item reads only the person's own income. Phase-8 fix round (B-2): the item never counted SSI, so an AND-CS client (who must receive SSI) was paid the whole standard; the current 3.533.A.2 and 3.549.A.2 (S1002, S1003) subtract SSI, apply the $20 to the rest and add the SSI back, which ssi_income (CO-849) now allows (OQ-115 resolved). The $20 rollover (A.2.f) and the OAP/AND-CS in-kind support and maintenance (K-4, 3.520.79, S1012) are added."
nearest: [CO-605, CO-606]
