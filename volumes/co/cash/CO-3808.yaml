id: CO-3808
name: "Colorado Works: unit has an adult participating in a strike"
identifier: cw_unit_has_striking_adult
kind: derived
type: yes/no
scope: person-month
program: ColoradoWorks
meaning: "Whether this person's Colorado Works assistance unit has an adult (a member who is not a dependent child) participating in a strike, which makes the unit ineligible (9 CCR 2503-6 3.604.2.L.2)."
precision: "A member whose participation is not stated is read as not on strike (is_participating_in_strike, CO-3800). Coverage review CW-2: a minor parent assisted as an adult (3.604.2.N.2.c, cw_minor_parent_is_assisted_as_adult, CO-4352) is an adult of the unit here. Coverage pass 6 CA6-7 (docs/reviews/coverage6-cash.md): whether an adult member is participating in a strike (is_participating_in_strike) is required where read (decision 4 of 2026-11-23); before, an unstated strike was read as none. A minor parent assisted as an adult is read in the determination month (CO-4352, per month). Pattern sweep (cash) PS-T11 (docs/reviews/pattern-sweep-cash.md): per month: a member of the month (CO-7304) who is not a dependent child of the month (CO-6807), or a minor parent assisted as an adult in it (CO-4352); before, the person-scope dependent child (a child in some month) and the determination month's minor-parent status were read in every month. The strike itself is stated once, on the determination date (is_participating_in_strike has no date): see the review's section on undated statuses."
derived: ["exists", "cw_assistance_unit_members_in_month", ["all", ["any", ["not", ["of", ["P"], "cw_is_dependent_child_in_month"]], ["of", ["P"], "cw_minor_parent_is_assisted_as_adult"]], ["of", ["P"], "is_participating_in_strike"]]]
sources: [S2601]
open: [OQ-1436]
implemented: engine
tags: [cash, tanf, household]
rationale: "Final cash review FC-1: 3.604.2.L.2 (S2601) makes \"Assistance units with an adult participating in a strike\" ineligible, and the phase-8 review's note that strikers stay unmodeled \"with their existing questions\" had no question behind it. cw_eligibility_status (CO-921) reads this item."
tests:
  - {id: CO-3808-T1, title: "The father of the unit is on strike", as_of: "2026-10-01", month: "2026-10", given: {cw_assistance_unit_members_in_month: [p1, p2], cw_is_dependent_child_in_month: false, is_participating_in_strike: true}, others: {p2: {cw_is_dependent_child_in_month: true}}, expect: true}
  - {id: "CO-3808-T2", title: "No one on strike", as_of: "2026-10-01", month: "2026-10", given: {cw_assistance_unit_members_in_month: [p1, p2], cw_is_dependent_child_in_month: false, is_participating_in_strike: false}, others: {p2: {cw_is_dependent_child_in_month: true, is_participating_in_strike: false}}, expect: false}
  - {id: CO-3808-T3, title: "A 17-year-old dependent child on a student strike is not an adult", as_of: "2026-10-01", month: "2026-10", given: {cw_assistance_unit_members_in_month: [p1, p2], cw_is_dependent_child_in_month: false, is_participating_in_strike: false}, others: {p2: {cw_is_dependent_child_in_month: true, cw_minor_parent_is_assisted_as_adult: false, is_participating_in_strike: true}}, expect: false}
  # Coverage pass 6 CA6-7: 3.604.2.L.2; an adult member's strike is required.
  - {id: "CO-3808-T4", title: "Coverage pass 6 CA6-7: an adult member whose strike is not stated: cannot determine", as_of: "2026-10-01", month: "2026-10", given: {cw_assistance_unit_members_in_month: [p1], cw_is_dependent_child_in_month: false}, expect: unknown}
  # Pattern sweep (cash) PS-T11: 3.604.2.L.2 (S2601) "Assistance units with an adult participating in a strike": the adult of the month. The daughter, born 2008-10-20 and not a student, is on strike; determined 2026-11-10. October: 17 on its first day, a dependent child (3.601), so the unit has no striking adult; November: 18, an adult on strike.
  - {id: "CO-3808-T5", title: "Pattern sweep PS-T11: October, the striking daughter is 17 on its first day, a dependent child: no striking adult", as_of: "2026-11-10", month: "2026-10", given: {cw_assistance_unit_members_in_month: [p1, p2], cw_is_dependent_child_in_month: false, is_participating_in_strike: false}, others: {p2: {date_of_birth: "2008-10-20", is_full_time_secondary_student_finishing_before_nineteen: false, cw_minor_parent_is_assisted_as_adult: false, is_participating_in_strike: true}}, expect: false}
  - {id: "CO-3808-T6", title: "PS-T11: November, 18 on its first day and no student: an adult on strike", as_of: "2026-11-10", month: "2026-11", given: {cw_assistance_unit_members_in_month: [p1, p2], cw_is_dependent_child_in_month: false, is_participating_in_strike: false}, others: {p2: {date_of_birth: "2008-10-20", is_full_time_secondary_student_finishing_before_nineteen: false, cw_minor_parent_is_assisted_as_adult: false, is_participating_in_strike: true}}, expect: true}
