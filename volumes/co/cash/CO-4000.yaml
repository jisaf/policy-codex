id: CO-4000
name: "Adult Financial: countable resources of the person other than life insurance"
identifier: af_person_countable_resources_other_than_life_insurance
kind: derived
type: money
scope: person
program: AdultFinancial
meaning: "This person's own countable resources by Adult Financial's own rules (9 CCR 2503-5 3.520.72-3.520.77) other than the cash surrender value of life insurance: cash and convertible assets, retirement and pension accounts (3.520.72.B.5), real and personal property other than the home (B.1, B.3-4), vehicles other than the highest-valued one used for transportation (3.520.77.A), revocable burial trusts and prepaid burial contracts over af_revocable_burial_funds_exemption each (3.520.72.B.8, 3.520.77.G-H), and burial spaces beyond the needs of the immediate family (3.520.72.B.9, 3.520.77.I)."
precision: "Each holding not stated other than liquid_resources_value is read as 0. Life insurance is counted apart because 3.520.75.E-F apply \"For OAP only\" to the policies of \"a client and his or her spouse\": the client's program governs a spouse's policy, so af_client_and_spouse_countable_resources (CO-2389) adds the spouse's other resources from this item and the spouse's life insurance under the client's program (final cash review 2, N-1). Coverage review round: F-6, liquid resources less the parts 3.520.77.D.1.b, E, F and J-M exempt (af_exempt_liquid_resources, CO-4412); F-8, retirement accounts at their gross value less the taxes due, or less af_retirement_account_default_tax_rate (20%) when retirement_accounts_taxes_due is not stated (3.520.73.B.1), and less the property the county exempts as unsaleable or legally restricted (af_property_exempt_as_unsaleable_value, 3.520.741.D, 3.520.742.C); F-7, non-business self-support property over $6,000 (af_self_support_property_countable_value, CO-4422; 3.520.77.D.3-4); F-9, the trust corpus that can be paid to or for the person (3.520.72.B.13) and potential resources refused (3.520.71.H.1); P2-5, the home's equity when the person lives in a facility and does not intend to return (3.520.77.C.3, C.5; intends_to_return_home read as true when not stated). The estate of a client adjudicated incapacitated (3.520.72.B.12) is the client's own holding and is stated in the holdings facts. Each new holding is read as 0 when not stated. This item also counts a spouse's and each sponsor's resources (CO-2389, CO-2390), as 3.520.72.E and 3.520.73.B.1.a direct. Coverage review P3: the holdings are stated as of the determination date, which for Adult Financial is the first day of the month or the date of application (3.510 \"Resources\"); a joint account is the person's proportional share, or all of it where the client is a co-owner as another's fiduciary (3.520.73.A.2), as the holdings facts' \"person's share\" states."
derived: [max, 0, ["-", [+, ["-", liquid_resources_value, af_exempt_liquid_resources], [max, 0, ["-", [otherwise, retirement_accounts_value, 0], [case, [[unknown, retirement_accounts_taxes_due], ["*", [otherwise, retirement_accounts_value, 0], af_retirement_account_default_tax_rate]], [else, retirement_accounts_taxes_due]]]], [otherwise, real_property_other_than_home_equity, 0], [max, 0, ["-", [otherwise, vehicles_equity_value, 0], [otherwise, transportation_vehicle_equity_value, 0]]], [max, 0, ["-", [otherwise, revocable_burial_trust_value, 0], af_revocable_burial_funds_exemption]], [max, 0, ["-", [otherwise, revocable_prepaid_burial_contract_value, 0], af_revocable_burial_funds_exemption]], [otherwise, burial_spaces_value_beyond_family_needs, 0], af_self_support_property_countable_value, [otherwise, trust_corpus_payable_to_person_value, 0], [otherwise, af_refused_potential_resources_value, 0], [case, [[all, [not, ["=", [otherwise, residence_setting_type, private_dwelling], private_dwelling]], [not, [otherwise, intends_to_return_home, true]]], [otherwise, home_equity, 0]], [else, 0]]], [otherwise, af_property_exempt_as_unsaleable_value, 0]]]
sources: [S1636, S2213, S2214, S2619, S3206, S3207, S3208, S3209, S3210, S3218]
implemented: engine
tags: [cash, resources]
rationale: "Final cash review 2, N-1 (confirmed with the engine): af_person_countable_resources (CO-3400) applied 3.520.75.E-F's OAP-only life insurance rule by the age of the person who owns the policy, so when af_client_and_spouse_countable_resources (CO-2389) added a spouse's resources, a younger spouse's old policy was counted against an OAP client (and an older spouse's policy was exempted for an AND client). The resources other than life insurance are split out so the spouse's life insurance can be read under the client's program. Coverage review F-6 to F-9 and P2-5: the exemptions and holdings 3.520.71.H, 3.520.72.B.13, 3.520.73.B.1, 3.520.741.D, 3.520.742.C and 3.520.77.C-F, J-M state were not carried; each is now a neutral holding fact (or the county's finding) this item reads."
tests:
  - {id: CO-4000-T1, title: "Coverage review F-8: the $1,000 retirement account counts at 80% when no tax figure is given: 700 + 800 = 1,500 (was 1,700)", as_of: "2026-10-01", given: {liquid_resources_value: 700, retirement_accounts_value: 1000, vehicles_equity_value: 4000, transportation_vehicle_equity_value: 4000}, relationships: [], expect: 1500}
  - {id: CO-4000-T4, title: "F-8: a $2,400 IRA with $300 of taxes due: 2,100", as_of: "2026-10-01", given: {liquid_resources_value: 0, retirement_accounts_value: 2400, retirement_accounts_taxes_due: 300}, relationships: [], expect: 2100}
  - {id: CO-4000-T5, title: "F-6 (probe PR-PTC): $2,200 of savings, $500 of it a refund received in August: 1,700", as_of: "2026-10-01", given: {liquid_resources_value: 2200, af_exempt_liquid_resources: 500}, relationships: [], expect: 1700}
  - {id: CO-4000-T6, title: "F-7, F-9: a rental house over $6,000 by $34,000 and a $10,000 revocable trust", as_of: "2026-10-01", given: {liquid_resources_value: 100, af_self_support_property_countable_value: 34000, trust_corpus_payable_to_person_value: 10000}, relationships: [], expect: 44100}
  - {id: CO-4000-T7, title: "F-8: $5,000 of land the county exempts as unsaleable at two-thirds of value (3.520.741.D.3)", as_of: "2026-10-01", given: {liquid_resources_value: 400, real_property_other_than_home_equity: 5000, af_property_exempt_as_unsaleable_value: 5000}, relationships: [], expect: 400}
  - {id: CO-4000-T8, title: "P2-5: in a nursing facility with no intent to return home - the home's $60,000 equity counts (3.520.77.C.5)", as_of: "2026-10-01", given: {liquid_resources_value: 400, residence_setting_type: nursing_facility, intends_to_return_home: false, home_equity: 60000}, relationships: [], expect: 60400}
  - {id: CO-4000-T9, title: "F-9: potential resources the client refused to secure count as available (3.520.71.H.1)", as_of: "2026-10-01", given: {liquid_resources_value: 400, af_refused_potential_resources_value: 3000}, relationships: [], expect: 3400}
  - {id: CO-4000-T2, title: "A $2,300 revocable prepaid burial contract - $800 over the $1,500 counts (3.520.77.H.2)", as_of: "2026-10-01", given: {liquid_resources_value: 500, revocable_prepaid_burial_contract_value: 2300}, relationships: [], expect: 1300}
  - {id: CO-4000-T3, title: "Life insurance is not in this item", as_of: "2026-10-01", given: {liquid_resources_value: 100, life_insurance_face_value: 2000, life_insurance_cash_surrender_value: 600}, relationships: [], expect: 100}
