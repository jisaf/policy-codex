id: CO-4000
name: "Adult Financial: countable resources of the person other than life insurance"
identifier: af_person_countable_resources_other_than_life_insurance
kind: derived
type: money
scope: person-month
program: AdultFinancial
meaning: "This person's own countable resources by Adult Financial's own rules (9 CCR 2503-5 3.520.72-3.520.77) other than the cash surrender value of life insurance, read from the person's holdings records (holdings, CO-5300) through af_holding_treatment_table (CO-5302): cash and convertible assets less the part exempt now (af_cash_and_convertible_holdings less af_exempt_liquid_resources, CO-5340, CO-4412), retirement accounts less the taxes on withdrawing them (CO-5341), real property other than the home (CO-5342), self-support property over its exemption (CO-4422), vehicles other than the one with the highest equity used for transportation (CO-5343), burial funds, contracts and spaces over their exemptions (CO-5344), personal property held as an investment (CO-5345), a home no longer exempt (CO-5346), the trust corpus that can be paid to or for the person (3.520.72.B.13; corpus_available_value) and potential resources the person refused to secure (3.520.71.H.1), never below zero."
precision: "Resource records, step H1 Adult Financial (docs/reviews/records-holdings-snap-af.md): each holding is stated once, as its own record, and counted by its kind's row and the fields beside it, never as a part of one figure subtracted from another; the old reader defaults (each holding read as 0 when not stated; intends_to_return_home read as true) are gone: a person whose holdings are not stated, or whose home, vehicle or held money does not state a field the rule reads, is cannot determine (decision 4 of 2026-11-23), and af_meets_resource_limit (CO-948) still answers where the parts that are known already exceed the limit (af_resources_known_lower_bound, CO-5350). Life insurance is counted apart because 3.520.75.E-F apply \"For OAP only\" to the policies of \"a client and his or her spouse\": the client's program governs a spouse's policy, so af_client_and_spouse_countable_resources (CO-2389) adds the spouse's other resources from this item and the spouse's life insurance under the client's program (final cash review 2, N-1). Findings fixed in step H1: personal property held as an investment is counted (3.520.77.B; H0-F2, OQ-1203); the vehicle exempt is the one with the highest equity used for transportation, chosen from the records (3.520.77.A; P58, OQ-1205 assumption A) rather than stated by the household; a retroactive SSI or Social Security payment stated for the SSI method is the same record Adult Financial exempts for nine months (3.520.77.J); each burial trust and contract has its own $1,500 exemption (3.520.77.G.3, H.2). This item also counts a spouse's and each sponsor's resources (CO-2389, CO-2390), as 3.520.72.E and 3.520.73.B.1.a direct. The estate of a client adjudicated incapacitated (3.520.72.B.12) is the client's own holding. Coverage review P3: the holdings are stated as of the determination date, which for Adult Financial is the first day of the month or the date of application (3.510 \"Resources\"). Coverage pass 4 CA4-13 (docs/reviews/coverage4-cash.md): a figure of the month evaluated, from the holdings valued in that month (3.510 \"Resources\", S4791: \"held as of the first day of a calendar month or as of the date of application\"), so an application month before the determination month is judged by its own holdings; before, every month read the determination month's."
derived: [max, 0, ["+", ["-", af_cash_and_convertible_holdings, af_exempt_liquid_resources], ["+", af_countable_retirement_accounts, ["+", af_countable_real_property, ["+", af_self_support_property_countable_value, ["+", af_countable_vehicles, ["+", af_countable_burial_holdings, ["+", af_countable_personal_property, ["+", af_countable_home_equity, ["+", [sum_receipts, holdings, [all, [all, [received_in, [month]], [unknown, [receipt, disposed_date]]], ["=", [lookup, af_holding_treatment_table, [receipt, kind]], counted_corpus_available]], [receipt, corpus_available_value]], [otherwise, af_refused_potential_resources_value, 0]]]]]]]]]]]
sources: [S1636, S2213, S2214, S2619, S3206, S3207, S3208, S3209, S3210, S3218, S4507, S4692, S4693, S4791]
implemented: engine
tags: [cash, resources]
rationale: "Final cash review 2, N-1 (confirmed with the engine): af_person_countable_resources (CO-3400) applied 3.520.75.E-F's OAP-only life insurance rule by the age of the person who owns the policy, so when af_client_and_spouse_countable_resources (CO-2389) added a spouse's resources, a younger spouse's old policy was counted against an OAP client (and an older spouse's policy was exempted for an AND client). The resources other than life insurance are split out so the spouse's life insurance can be read under the client's program. Coverage review F-6 to F-9 and P2-5: the exemptions and holdings 3.520.71.H, 3.520.72.B.13, 3.520.73.B.1, 3.520.741.D, 3.520.742.C and 3.520.77.C-F, J-M state were not carried; each is now a neutral holding fact (or the county's finding) this item reads."
