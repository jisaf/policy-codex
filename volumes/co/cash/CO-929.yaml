id: CO-929
name: "Adult Financial: meets citizenship requirement (OAP)"
identifier: af_meets_citizenship_requirement_oap
kind: derived
type: yes/no
scope: person
program: AdultFinancial
meaning: "Whether the person meets the Old Age Pension's citizenship and immigration test under C.R.S. 26-2-111(2)(a)(I) and (2)(c): a U.S. citizen or national, or a qualified non-citizen who entered the United States before August 22, 1996, who is in a federal exempt category or who has held qualified status for five years (the 26-2-111.8(2) test, meets_public_assistance_citizenship_requirement, CO-905), or a qualified non-citizen who also receives SSI (2)(c)(III) or for whom the county has found a sponsor-related or significant financial hardship (2)(c)(II)."
precision: "OQ-430 resolved (CDHS review S-4): 9 CCR 2503-5 3.520.68.A states the five-year bar for AND only, but C.R.S. 26-2-111(2)(c)(I) says a qualified alien 'shall not be granted the old age pension' unless 26-2-111.8(2)(a) or (b) is met, and a rule cannot narrow a statutory bar; the item follows the statute, as the volume follows the amended federal statute over 10 CCR 2506-1 for SNAP. Receipt of SSI (receives_ssi) stands for 'eligible for federal financial benefits pursuant to Title XVI'; the hardship exceptions are one county finding (af_oap_qualified_alien_hardship_exception, CO-2572). The sponsor-deeming condition of (2)(c)(I)(C) is applied in the income computation (af_deemed_sponsor_income). Vocabulary fix round (U-3): the citizen-or-national arm reads is_us_citizen_or_national (CO-1358) through CO-905."
statute_override: "Colorado statute overrides 9 CCR 2503-5 3.520.68.A, which states the five-year bar for AND only: C.R.S. 26-2-111(2)(c) bars a qualified non-citizen from the Old Age Pension unless they entered before August 22, 1996, have held qualified status five years or are in an exempt category, receive SSI, or have a county-found hardship."
derived: [any, meets_public_assistance_citizenship_requirement, [all, is_qualified_non_citizen, [any, receives_ssi, [otherwise, af_oap_qualified_alien_hardship_exception, false]]]]
sources: [S441, S451, S1316, S1317]
implemented: engine
tags: [cash, oap, immigration, legal]
rationale: "No existing item states OAP's own citizenship test without the AND programs' five-year bar; af_meets_citizenship_requirement_and (CO-943, retired in the vocabulary fix round into meets_public_assistance_citizenship_requirement, CO-905; the acknowledged nearest same-shape item, and the item this one replaces the shared use of on af_category, CO-953) carries the bar 3.520.68.A confines to AND. Added under the phase-5 review's C-10 finding: 3.520.61.C ('For AND only, be a citizen...') and 3.520.68.A ('barred from receiving AND for five years') both scope the bar to AND, so applying meets_public_assistance_citizenship_requirement's bar to the OAP branch of af_category denied OAP to a qualified non-citizen within the bar period on a provision that, by its own text, does not reach OAP. CDHS review S-4 (OQ-430 resolved): the statute's bar now applies; the earlier reading followed the rule's 'for AND only'."
nearest: [CO-905]
