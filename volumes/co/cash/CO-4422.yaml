sources: [S3207]
implemented: engine
tags: [cash, resources]
rationale: "Coverage review F-7: the neutral holdings facts leave out property used to produce income, and no Adult Financial item counted it, so a rental house or a large subsistence property counted nothing where 3.520.77.D.3-4 (S3207) count the equity over $6,000, or all of it when the return is under 6%."
tests:
  - {id: CO-4422-T1, title: "A rental house with $40,000 of equity netting $3,000 a year (over 6% of $6,000): 34,000 counts", as_of: "2026-10-01", given: {holdings: [{kind: real_property, value: 40000, amount_owed: 0, income_producing: true, used_in_trade_or_business: false, net_annual_return: 3000}]}, expect: 34000}
  - {id: CO-4422-T2, title: "Rented land with $5,000 of equity netting $100 (under 6% of $5,000 = $300): the whole equity counts (D.4.c)", as_of: "2026-10-01", given: {holdings: [{kind: real_property, value: 5000, amount_owed: 0, income_producing: true, used_in_trade_or_business: false, net_annual_return: 100}]}, expect: 5000}
  - {id: CO-4422-T3, title: "The same land, the shortfall excused by the county (crop failure): exempt", as_of: "2026-10-01", given: {af_income_property_return_shortfall_excused: true, holdings: [{kind: real_property, value: 5000, amount_owed: 0, income_producing: true, used_in_trade_or_business: false, net_annual_return: 100}]}, expect: 0}
  - {id: CO-4422-T4, title: "A subsistence garden plot and tractor worth $7,500: 1,500 counts (D.3.a)", as_of: "2026-10-01", given: {holdings: [{kind: real_property, value: 7500, amount_owed: 0, income_producing: false, produces_for_household_use: true}]}, expect: 1500}
  - {id: CO-4422-T5, title: "Decision 4: holdings not stated - cannot determine (before: 0)", as_of: "2026-10-01", given: {}, expect: unknown}
  # Resource records, step H1 Adult Financial: D.4.a applied to each property (S3207).
  - {id: CO-4422-T6, title: "Two rentals: $10,000 netting $600 (6% of 6,000 = 360: passes) and $4,000 netting $100 (6% of 4,000 = 240: fails); combined exemption min(6,000, 6,000) = 6,000: 14,000 - 6,000 = 8,000", as_of: "2026-10-01", given: {holdings: [{kind: real_property, value: 10000, amount_owed: 0, income_producing: true, used_in_trade_or_business: false, net_annual_return: 600}, {kind: real_property, value: 4000, amount_owed: 0, income_producing: true, used_in_trade_or_business: false, net_annual_return: 100}]}, expect: 8000}
  - {id: CO-4422-T7, title: "Two rentals of $4,000 each, both passing: exemptions 4,000 + 4,000 capped at 6,000 combined: 8,000 - 6,000 = 2,000", as_of: "2026-10-01", given: {holdings: [{kind: real_property, value: 4000, amount_owed: 0, income_producing: true, used_in_trade_or_business: false, net_annual_return: 300}, {kind: real_property, value: 4000, amount_owed: 0, income_producing: true, used_in_trade_or_business: false, net_annual_return: 300}]}, expect: 2000}
  - {id: CO-4422-T8, title: "A stated empty list: nothing", as_of: "2026-10-01", given: {holdings: []}, expect: 0}
