id: CO-4422
name: "Adult Financial: countable value of self-support property"
identifier: af_self_support_property_countable_value
kind: derived
type: money
scope: person
program: AdultFinancial
meaning: "The countable value of this person's non-business self-support property (9 CCR 2503-5 3.520.77.D.3-4): for non-business income-producing property, the equity over af_self_support_property_equity_exemption when its net annual income is at least af_income_producing_property_min_return_rate of the excluded equity (or the county excuses a shortfall beyond the client's control, D.4.c), and the whole equity otherwise; plus the equity of property producing goods for the household's own consumption over af_self_support_property_equity_exemption."
precision: "Property used in a trade or business, tools for a job and licenses are exempt and stated in no holdings fact (D.1-2, D.5). Where the person has more than one income-producing property, the facts state them together and the return test is applied to the total (D.4.a applies it to each; a case where one property passes and another fails states only the one that passes the test in these facts and the other in real_property_other_than_home_equity, with its whole equity). The twelve- or twenty-four-month continuation of the exemption for property not now in use (D.1.c, D.3.c) is the county's statement of the property as still used."
derived: [+, [case, [[">", [otherwise, nonbusiness_income_producing_property_equity_value, 0], 0], [case, [[any, [">=", [otherwise, nonbusiness_income_producing_property_net_annual_income, 0], ["*", af_income_producing_property_min_return_rate, [min, nonbusiness_income_producing_property_equity_value, af_self_support_property_equity_exemption]]], [otherwise, af_income_property_return_shortfall_excused, false]], [max, 0, ["-", nonbusiness_income_producing_property_equity_value, af_self_support_property_equity_exemption]]], [else, nonbusiness_income_producing_property_equity_value]]], [else, 0]], [max, 0, ["-", [otherwise, home_use_production_property_equity_value, 0], af_self_support_property_equity_exemption]]]
sources: [S3207]
implemented: engine
tags: [cash, resources]
rationale: "Coverage review F-7: the neutral holdings facts leave out property used to produce income, and no Adult Financial item counted it, so a rental house or a large subsistence property counted nothing where 3.520.77.D.3-4 (S3207) count the equity over $6,000, or all of it when the return is under 6%."
tests:
  - {id: CO-4422-T1, title: "A rental house with $40,000 of equity netting $3,000 a year (over 6% of $6,000): 34,000 counts", as_of: "2026-10-01", given: {nonbusiness_income_producing_property_equity_value: 40000, nonbusiness_income_producing_property_net_annual_income: 3000}, expect: 34000}
  - {id: CO-4422-T2, title: "Rented land with $5,000 of equity netting $100 (under 6% of $5,000 = $300): the whole equity counts (D.4.c)", as_of: "2026-10-01", given: {nonbusiness_income_producing_property_equity_value: 5000, nonbusiness_income_producing_property_net_annual_income: 100}, expect: 5000}
  - {id: CO-4422-T3, title: "The same land, the shortfall excused by the county (crop failure): exempt", as_of: "2026-10-01", given: {nonbusiness_income_producing_property_equity_value: 5000, nonbusiness_income_producing_property_net_annual_income: 100, af_income_property_return_shortfall_excused: true}, expect: 0}
  - {id: CO-4422-T4, title: "A subsistence garden plot and tractor worth $7,500: 1,500 counts (D.3.a)", as_of: "2026-10-01", given: {home_use_production_property_equity_value: 7500}, expect: 1500}
  - {id: CO-4422-T5, title: "None", as_of: "2026-10-01", given: {}, expect: 0}
