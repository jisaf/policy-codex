id: CO-4422
name: "Adult Financial: countable value of self-support property"
identifier: af_self_support_property_countable_value
kind: derived
type: money
scope: person
program: AdultFinancial
meaning: "The countable value of this person's non-business self-support property (9 CCR 2503-5 3.520.77.D.3-4), from the person's real property holdings records: for non-business income-producing property (income_producing, not used_in_trade_or_business), the equity of all such property less a combined exemption of at most af_self_support_property_equity_exemption ($6,000), to which each property adds its equity up to $6,000 only when its net annual return (net_annual_return) is at least af_income_producing_property_min_return_rate (6%) of its excluded equity, or the county excuses a shortfall beyond the client's control (D.4.c); plus the equity of property producing goods only for the household's own use (produces_for_household_use) over af_self_support_property_equity_exemption."
precision: "Resource records, step H1 Adult Financial (docs/reviews/records-holdings-snap-af.md): each property is its own record, so D.4.a's \"the rate-of-return requirement applies individually to each. However, the total combined exemption for all such properties shall not exceed $6,000\" is applied as written: before step H1 the properties were one figure and the test was applied to their total. A property's income_producing and used_in_trade_or_business are the county's to establish from the tax returns (D); not stated, the property is not self-support property and is counted in full as real property (af_countable_real_property, CO-5342). The net annual return is required where read (decision 4). Property used in a trade or business, tools for a job and licenses are exempt (D.1-2, D.5) and not read. The twelve- or twenty-four-month continuation of the exemption for property not now in use (D.1.c, D.3.c) is the county's statement of the property as still used."
