id: CO-919
name: "Colorado Works: is a work-eligible individual"
identifier: cw_is_work_eligible_individual
kind: derived
type: yes/no
scope: person-month
program: ColoradoWorks
meaning: The person is a "work-eligible individual" under 45 CFR 261.2(n) - an adult (or minor child head-of-household) receiving Colorado Works assistance, or a non-recipient parent living with a child receiving it - unless the person is a minor parent who is not the head of household, a non-citizen ineligible for assistance due to immigration status, or an SSI recipient (Colorado's state-option exclusion, read as elected because it tracks the same SSI exclusion 3.604.2.C.3.a states for assistance unit membership).
precision: "Fix round (C-6): three defects the phase-5 review found. (a) No assistance test at all: added the last conjunct below, reading cw_eligibility_status (CO-921) directly rather than a bare literal-18 age test - this person's own unit is eligible, or this person is a non-recipient parent living with a child whose own unit is eligible (261.2(n)(1)'s 'non-recipient parent living with a child receiving such assistance'). No circularity with CO-921, which does not read this item. (b) The prior second conjunct, [not, [all, [<, age, 18], [not, is_head_of_household]]], was by De Morgan's law identical to the first conjunct and never read cw_has_dependent_child, so it excluded every non-head minor rather than 261.2(n)(1)(i)'s minor-parent-who-is-not-head-of-household; rewritten below to read cw_has_dependent_child. (c) The bare literal 18 in the first conjunct is replaced with cw_dependent_child_age_limit (CO-270), per governance's name.digits rule, since 261.2(n)'s 'adult' is the complement of the minor child the same title defines. Scope changed from person to person-month because the new assistance-test conjunct reads cw_eligibility_status (CO-921), which is person-month."
derived: [all, [any, [">=", age, cw_dependent_child_age_limit], is_head_of_household], [not, [all, cw_has_dependent_child, ["<", age, cw_minor_parent_age_limit], [not, is_head_of_household]]], cw_meets_citizenship_requirement, [not, receives_ssi], [any, [=, cw_eligibility_status, "eligible"], [exists_related, [parent, caretaker], [=, [of, [P], cw_eligibility_status], "eligible"]]]]
sources: [S418]
implemented: engine
tags: [cash, tanf]
rationale: "No existing item states this federal work-participation gateway definition; cw_meets_work_participation (CO-920) is meaningful only for a work-eligible individual, though this batch does not gate cw_eligibility_status on it (Colorado Works eligibility and the work-participation-rate calculation are governed by different sections of the text). Fix round (C-6) adds the assistance test 261.2(n)(1) states and corrects the minor-parent exclusion and the bare age literal; see precision."
