id: CO-919
name: "Colorado Works: is a work-eligible individual"
identifier: cw_is_work_eligible_individual
kind: derived
type: yes/no
scope: person-month
program: ColoradoWorks
meaning: The person is a "work-eligible individual" under 45 CFR 261.2(n) - an adult, minor child head-of-household, or spouse of a minor child head-of-household (9 CCR 2503-6 3.607.1.A.1; coverage review P3-4) receiving Colorado Works assistance, or a non-recipient parent living with a child receiving it - unless the person is a minor parent who is not the head of household or a head's spouse (3.607.1.B.1), a non-citizen ineligible for assistance due to immigration status, or an SSI recipient (Colorado's state-option exclusion, read as elected because it tracks the same SSI exclusion 3.604.2.C.3.a states for assistance unit membership).
precision: "Fix round (C-6): three defects the phase-5 review found. (a) No assistance test at all: added the last conjunct below, reading cw_eligibility_status (CO-921) directly rather than a bare literal-18 age test - this person's own unit is eligible, or this person is a non-recipient parent living with a child whose own unit is eligible (261.2(n)(1)'s 'non-recipient parent living with a child receiving such assistance'). No circularity with CO-921, which does not read this item. (b) The prior second conjunct, [not, [all, [<, age, 18], [not, snap_is_head_of_household]]], was by De Morgan's law identical to the first conjunct and never read cw_has_dependent_child, so it excluded every non-head minor rather than 261.2(n)(1)(i)'s minor-parent-who-is-not-head-of-household; rewritten below to read cw_has_dependent_child. (c) The bare literal 18 in the first conjunct is replaced with cw_dependent_child_age_limit (CO-270), per governance's name.digits rule, since 261.2(n)'s 'adult' is the complement of the minor child the same title defines. Scope changed from person to person-month because the new assistance-test conjunct reads cw_eligibility_status (CO-921), which is person-month. Vocabulary fix round (R-7): reads cw_is_head_of_assistance_unit (CO-1733), not the SNAP head of household. Same-word audit SW-3/SW-4 (OQ-396): the caretaker relation is cw_caretaker_of (CO-2608): a parent, or a non-parent caretaker who is the child's legal guardian or has primary responsibility for the child (3.601); the spouse of a parent who is not a parent stays the optional member of 3.604.2.C.2.a, read from the spouse and parent roles as the rule words it. Pattern sweep (cash) PS-T3 (docs/reviews/pattern-sweep-cash.md): the adult and minor-parent ages (this person's and a spouse's) are taken on the first day of the month evaluated (OQ-951), as cw_is_adult_member (CO-924) takes them, not on the determination date."
derived: [all, [any, [">=", [years_between, date_of_birth, [first_day, [month]]], cw_dependent_child_age_limit], cw_is_head_of_assistance_unit, [exists_related, [spouse], [all, [of, [P], cw_is_head_of_assistance_unit], ["<", [years_between, [of, [P], date_of_birth], [first_day, [month]]], cw_minor_parent_age_limit]]]], [not, [all, cw_has_dependent_child, ["<", [years_between, date_of_birth, [first_day, [month]]], cw_minor_parent_age_limit], [not, cw_is_head_of_assistance_unit], [not, [exists_related, [spouse], [all, [of, [P], cw_is_head_of_assistance_unit], ["<", [years_between, [of, [P], date_of_birth], [first_day, [month]]], cw_minor_parent_age_limit]]]]]], cw_meets_citizenship_and_immigration_requirement, [not, receives_ssi], [any, ["=", cw_eligibility_status, eligible], [exists, cw_caretaker_of, ["=", [of, [P], cw_eligibility_status], eligible]]]]
sources: [S418, S3168]
implemented: engine
tags: [cash, tanf]
rationale: No existing item states this federal work-participation gateway definition; cw_meets_work_participation (CO-920) is meaningful only for a work-eligible individual, though this batch does not gate cw_eligibility_status on it (Colorado Works eligibility and the work-participation-rate calculation are governed by different sections of the text). Fix round (C-6) adds the assistance test 261.2(n)(1) states and corrects the minor-parent exclusion and the bare age literal; see precision.
