id: CO-1671
name: "Adult Financial: marital status verification is pending"
identifier: af_marital_status_verification_is_pending
kind: derived
type: yes/no
scope: person-month
program: AdultFinancial
role: outcome
meaning: Whether Adult Financial requires verification of the client's questionable divorce, legal separation or widowhood and it has not been provided.
precision: "False where Adult Financial verification does not apply to the person (af_verification_is_applicable, CO-2584; case worker review B2). Due by: af_verification_due_date (CO-1437: eleven days)."
derived: [all, af_verification_is_applicable, [all, af_requires_verification_of_marital_status, [not, marital_status_verification_document_received]]]
sources: [S1078]
implemented: engine
tags: [verification, cash]
rationale: "Review U-1: the count items held this test as an anonymous arm, so no outcome told a worker which document was outstanding and for whom; the count now sums this item."
tests:
  - {id: CO-1671-T1, month: "2026-10", as_of: "2026-10-01", given: {af_verification_is_applicable: true, af_requires_verification_of_marital_status: true, marital_status_verification_document_received: false}, expect: true}
  - {id: CO-1671-T2, month: "2026-10", as_of: "2026-10-01", given: {af_verification_is_applicable: true, af_requires_verification_of_marital_status: false}, expect: false}
