id: CO-2350
name: "Colorado Works: is excluded from the assistance unit"
identifier: cw_is_excluded_from_assistance_unit
kind: derived
type: yes/no
scope: person
program: ColoradoWorks
meaning: "This person is not in any Colorado Works assistance unit: the person receives SSI or a Title IV foster care, adoption subsidy or kinship payment (9 CCR 2503-6 3.604.2.C.3), or is an optional member (C.2) who has not requested assistance."
derived: [any, receives_ssi, receives_title_iv_foster_adoption_kinship_payment, [all, cw_is_optional_assistance_unit_member, [not, [otherwise, cw_requests_inclusion_in_assistance_unit, false]]]]
sources: [S1625, S411]
implemented: engine
tags: [cash, tanf, household]
rationale: "OQ-152: cw_assistance_unit_members (CO-900) filtered on the C.3 exclusions alone; one item now states every reason a person in the home is left out, the optional member who did not ask included."
tests:
  - {id: CO-2350-T1, as_of: "2026-10-01", given: {receives_ssi: true}, expect: true}
  - {id: CO-2350-T2, title: "An optional member who asked", as_of: "2026-10-01", given: {receives_ssi: false, receives_title_iv_foster_adoption_kinship_payment: false, cw_is_optional_assistance_unit_member: true, cw_requests_inclusion_in_assistance_unit: true}, expect: false}
  - {id: CO-2350-T3, title: "An optional member who did not ask", as_of: "2026-10-01", given: {receives_ssi: false, receives_title_iv_foster_adoption_kinship_payment: false, cw_is_optional_assistance_unit_member: true}, expect: true}
  - {id: CO-2350-T4, title: "A mandatory member", as_of: "2026-10-01", given: {receives_ssi: false, receives_title_iv_foster_adoption_kinship_payment: false, cw_is_optional_assistance_unit_member: false}, expect: false}
