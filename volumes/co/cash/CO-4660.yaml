  - {id: CO-4660-T2, title: "CW2-2 (probe ZQ-2): the mother in the home is deemed; the father in another home is not", as_of: "2026-10-01", given: {date_of_birth: "2009-04-08", dwelling_id: h1, cw_assistance_unit_members: [p1, p2], cw_is_considered_living_in_home: true}, others: {p2: {date_of_birth: "2026-02-03", dwelling_id: h1}, p3: {date_of_birth: "1985-01-22", dwelling_id: h1, cw_is_considered_living_in_home: true}, p4: {date_of_birth: "1984-05-05", dwelling_id: h2, cw_is_considered_living_in_home: true}}, relationships: [[parent, p1, p2], [parent, p3, p1], [parent, p4, p1]], expect: [p3]}
  - {id: CO-4660-T3, title: "The mother joined the minor's unit (3.604.2.C.2.g): a participant, not deemed; the father in the home is", as_of: "2026-10-01", given: {date_of_birth: "2009-04-08", cw_assistance_unit_members: [p1, p2, p3], cw_is_considered_living_in_home: true}, others: {p2: {date_of_birth: "2026-02-03"}, p3: {date_of_birth: "1985-01-22", cw_is_considered_living_in_home: true}, p4: {date_of_birth: "1984-05-05", cw_is_considered_living_in_home: true}}, relationships: [[parent, p1, p2], [parent, p3, p1], [parent, p4, p1]], expect: [p4]}
