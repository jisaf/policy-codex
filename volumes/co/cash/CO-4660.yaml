id: CO-4660
name: "Colorado Works: a minor parent's non-participant parents in the home"
identifier: cw_minor_parent_deemed_parents
kind: derived
type: group of persons
scope: person
program: ColoradoWorks
meaning: "The parents of this person whose income 9 CCR 2503-6 3.605.1.A.4.a deems to her assistance unit: each person she is the child of (a stated parent edge) who is not a member of her assistance unit (a non-participant; a parent who requested inclusion under 3.604.2.C.2.g is a participant) and who lives in the same home as she does. Empty for a person with no such parent."
precision: "Living in the same home is read from lives_with (CO-1925; where no dwelling is stated the parent edge is read as living together, convention rule 17) and cw_is_considered_living_in_home (CO-3354) for both, as cw_caretaker_of reads the home. Whether the person is an unmarried minor parent is not tested here: cw_deemed_parent_income_of_minor_parent (CO-909) gates the deeming on it. Coverage pass 3 (P3-1): \"non-participant\" (3.605.1.A.4.a) is read as not a member of the minor parent's own assistance unit; a parent who receives Colorado Works in a separate unit (with the minor parent's siblings, the minor parent having applied apart under 3.604.2.C.1.b) is still deemed. Excluding that parent would make this item read the parent's own unit's eligibility, which reads this item through the minor parent's income; the parent's countable income in that unit is below the same need standard that cw_minor_parent_deeming_needs_deduction (CO-2000) deducts, so the deemed amount is $0 except where the two counts differ (redetermination child support averaging, for example)."
derived: [filter, [persons], [all, [rel, [child], [P]], [not, [in_group, [P], cw_assistance_unit_members]], [otherwise, [in_group, [P], lives_with], true], cw_is_considered_living_in_home, [of, [P], cw_is_considered_living_in_home]]]
sources: [S1307, S3155]
implemented: engine
tags: [cash, tanf, income, household]
rationale: "Coverage pass 2 (CW2-2): CO-909 named the deemed parents inline, while the needs deduction (cw_minor_parent_deeming_needs_deduction, CO-2000) counted every parent in the case, wherever the parent lived and whether or not the parent was in her unit. 3.605.1.A.4.a (S1307) deducts \"the needs of the stepparent or parent of the minor parent\", the parent whose income it deems: \"a non-participant parent(s) of an unmarried minor parent who is living in the same home\" (S3155). One item now names that set for both readers."
