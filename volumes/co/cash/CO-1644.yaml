id: CO-1644
name: "Colorado Works: lawful presence verification is pending"
identifier: cw_lawful_presence_verification_is_pending
kind: derived
type: yes/no
scope: person-month
program: ColoradoWorks
role: outcome
meaning: Whether Colorado Works requires verification of the person's lawful presence, by producing a listed document (a Colorado license or identification card other than one issued under the Road and Community Safety Act, a military, merchant mariner or tribal document, a Rule 5 Appendix A citizenship document, or an immigration document verified through SAVE) and it has not been provided.
precision: An identity match through an electronic data source is not a produced document and is not evidence of lawful presence (review C-8); a DMV lawful-presence check under 3.604.3.H.4 is not modeled separately (OQ-376).
derived: [all, cw_requires_verification_of_lawful_presence, [not, [any, [all, identity_verification_document_received, identity_document_is_lawful_presence_document], [all, citizenship_verification_document_received, citizenship_document_is_on_revenue_appendix_a], immigration_status_verified_by_electronic_data_source]]]
sources: [S877, S1066, S1067, S1068, S1069, S1071, S1073]
implemented: engine
tags: [verification, cash, tanf]
open: [OQ-376]
rationale: "Review U-1: the count items held this test as an anonymous arm, so no outcome told a worker which document was outstanding and for whom; the count now sums this item."
tests:
  - {id: CO-1644-T1, month: "2026-10", as_of: "2026-10-01", given: {cw_requires_verification_of_lawful_presence: true, identity_verification_document_received: false, citizenship_verification_document_received: false, immigration_status_verified_by_electronic_data_source: false}, expect: true}
  - {id: CO-1644-T2, month: "2026-10", as_of: "2026-10-01", given: {cw_requires_verification_of_lawful_presence: true, identity_verification_document_received: true, identity_verification_document_type: colorado_drivers_license_or_id}, expect: false}
  - {id: CO-1644-T3, month: "2026-10", as_of: "2026-10-01", given: {cw_requires_verification_of_lawful_presence: true, identity_verification_document_received: true, identity_verification_document_type: colorado_road_and_community_safety_act_license_or_id, citizenship_verification_document_received: false, immigration_status_verified_by_electronic_data_source: false}, expect: true}
  - {id: CO-1644-T4, month: "2026-10", as_of: "2026-10-01", given: {cw_requires_verification_of_lawful_presence: true, identity_verification_document_received: false, citizenship_verification_document_received: true, citizenship_verification_document_type: us_public_birth_certificate}, expect: false}
