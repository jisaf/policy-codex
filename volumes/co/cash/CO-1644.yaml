id: CO-1644
name: "Colorado Works: lawful presence verification is pending"
identifier: cw_lawful_presence_verification_is_pending
kind: derived
type: yes/no
scope: person-month
program: ColoradoWorks
role: outcome
meaning: Whether Colorado Works requires verification of the person's lawful presence, by producing a listed document (a Colorado license or identification card other than one issued under the Road and Community Safety Act, a military, merchant mariner or tribal document, a Rule 5 Appendix A citizenship document, or an immigration document verified through SAVE) and it has not been provided.
precision: "An identity match through an electronic data source is not a produced document and is not evidence of lawful presence (review C-8); a DMV lawful-presence check under 3.604.3.H.4 is not modeled separately (OQ-376). False where Colorado Works verification does not apply to the person (cw_verification_is_applicable, CO-2583; case worker review B2). Due by: cw_status_verification_due_date (CO-1656: thirty days; the member, not the unit, is excluded after it)."
derived: [all, cw_verification_is_applicable, [all, cw_requires_verification_of_lawful_presence, [not, [any, [all, identity_verification_document_received, cw_lawful_presence_identity_document_is_acceptable], [all, citizenship_verification_document_received, citizenship_document_is_on_revenue_appendix_a], immigration_status_verified_by_electronic_data_source]]]]
sources: [S877, S1066, S1067, S1068, S1069, S1071, S1073]
implemented: engine
tags: [verification, cash, tanf]
open: [OQ-376]
rationale: "Review U-1: the count items held this test as an anonymous arm, so no outcome told a worker which document was outstanding and for whom; the count now sums this item."
tests:
  - {id: CO-1644-T1, month: "2026-10", as_of: "2026-10-01", given: {cw_verification_is_applicable: true, cw_requires_verification_of_lawful_presence: true, identity_verification_document_received: false, citizenship_verification_document_received: false, immigration_status_verified_by_electronic_data_source: false}, expect: true}
  - {id: CO-1644-T2, month: "2026-10", as_of: "2026-10-01", given: {cw_verification_is_applicable: true, cw_requires_verification_of_lawful_presence: true, identity_verification_document_received: true, identity_verification_document_type: colorado_drivers_license_or_id}, expect: false}
  - {id: CO-1644-T3, month: "2026-10", as_of: "2026-10-01", given: {cw_verification_is_applicable: true, cw_requires_verification_of_lawful_presence: true, identity_verification_document_received: true, identity_verification_document_type: colorado_road_and_community_safety_act_license_or_id, citizenship_verification_document_received: false, immigration_status_verified_by_electronic_data_source: false}, expect: true}
  - {id: CO-1644-T4, month: "2026-10", as_of: "2026-10-01", given: {cw_verification_is_applicable: true, cw_requires_verification_of_lawful_presence: true, identity_verification_document_received: false, citizenship_verification_document_received: true, citizenship_verification_document_type: us_public_birth_certificate}, expect: false}
  - {id: CO-1644-TNA, title: "B2: not pending where Colorado Works verification does not apply", as_of: "2026-10-01", month: "2026-10", given: {cw_verification_is_applicable: false}, expect: false}
