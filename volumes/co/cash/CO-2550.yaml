id: CO-2550
name: "Colorado Works: months of the last six in which child support was received"
identifier: cw_child_support_months_received_of_last_six
kind: derived
type: whole number
scope: person-month
program: ColoradoWorks
meaning: At a Colorado Works redetermination, the number of the six months before the redetermination (0 to 6) in which the assistance unit received current child support for this person. 9 CCR 2503-6 3.605.5.C.1 treats child support as consistent only when it was received in all six of the six previous months; inconsistent support is not countable.
precision: "The six months before the determination month (cw_child_support_history_months); each month's current support is cw_child_support_receipts (CO-5652) in that month (receipt records, migration phase 2: before them, the months of child_support_received). A month whose receipts are not stated, or whose child support is stated with no amount, is unknown, so the count is unknown until every month is known."
derived: [count_months, [months_ending, cw_child_support_history_months, [month_before, [det_month]]], [">", [at, cw_child_support_receipts, [month]], 0]]
sources: [S1805]
implemented: engine
tags: [cash, tanf, income]
rationale: "CDHS review B-2: no fact stated the child support history 3.605.5.C reads at redetermination; cw_counted_child_support (CO-2553) needs it. child_support_received (CO-847) states one month's amount only. Dual-entry audit 2.2: derived from the months of child_support_received (CO-028) the case states, so the history is not entered beside the months."
tests:
  - {id: CO-2550-T1, month: "2026-11", as_of: "2026-11-01", given: {receipts: [{kind: child_support, amount: 500, month: "2026-05"}, {kind: child_support, amount: 500, month: "2026-06"}, {kind: child_support, amount: 500, month: "2026-08"}, {kind: child_support, amount: 500, month: "2026-09"}, {kind: child_support, amount: 500, month: "2026-10"}]}, title: "Received in five of the six months", expect: 5}
  - {id: CO-2550-T2, month: "2026-11", as_of: "2026-11-01", given: {receipts: [{kind: child_support, amount: 500, month: "2026-05"}, {kind: child_support, month: "2026-06"}]}, title: "A month's support stated with no amount: cannot determine", expect: unknown}
