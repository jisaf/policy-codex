id: CO-923
name: "Colorado Works: payment countable income"
identifier: cw_payment_countable_income
kind: derived
type: money
scope: person-month
program: ColoradoWorks
meaning: "The total net countable income of this person's assistance unit for the month, computed with the payment-computation earned income disregard of 3.606.2.A (CO-922 - 100% in the first certification period or for a new source, 67% for a current source after it) rather than the eligibility-test figure (CO-907) - the sum of each member's payment countable earned income and countable unearned income (CO-908), plus any income deemed under 3.605.1.A.4 from a minor-parent member's non-participant parent (CO-909) - the figure 3.606.1.I.3 and 3.606.1.K.1 subtract from the grant standard to compute the authorized grant. Phase-10 sweep (OQ-103, OQ-140, OQ-143): a disqualified or ineligible required member's earnings count gross, without disregards (3.604.2.M); the sponsor's deemed net income (cw_sponsor_deemed_income, 3.605.1.A.5) is added for each sponsored member; and the income of a budgetary-unit member outside the assistance unit (cw_budgetary_member_deemed_income: a stepparent under 3.605.1.A.4.a, a non-parent caretaker's spouse under 3.606.1.J) is added."
open: [OQ-490]
derived: [+, [sum, cw_assistance_unit_members, [+, [case, [[of, [P], cw_is_disqualified_member], [of, [P], cw_gross_earned_income]], [else, [of, [P], cw_payment_countable_earned_income]]], [of, [P], cw_countable_unearned_income], [of, [P], cw_deemed_parent_income_of_minor_parent], [of, [P], cw_sponsor_deemed_income]]], [sum, [filter, cw_budgetary_unit_members, [not, [in_group, [P], cw_assistance_unit_members]]], [of, [P], cw_budgetary_member_deemed_income]]]
sources: [S415, S1000, S1004, S1626, S1627, S1628]
implemented: engine
tags: [cash, tanf, income]
rationale: "No existing item aggregates Colorado Works countable income at the unit level using the payment disregard; cw_countable_income (CO-910) is the nearest same-shape item (unit-level income aggregation) but sums cw_countable_earned_income (CO-907), the eligibility-test figure, which 3.606.1.I.3/.K.1's payment computation does not read - the phase-5 review's C-1 finding. cw_grant_amount (CO-914) needs this figure; cw_meets_income_test (CO-913) and cw_eligibility_status (CO-921) keep reading cw_countable_income (CO-910) unchanged, since the eligibility test uses the $90 figure."
nearest: [CO-910]
