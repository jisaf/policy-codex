id: CO-923
name: "Colorado Works: payment countable income"
identifier: cw_payment_countable_income
kind: derived
type: money
scope: person-month
program: ColoradoWorks
meaning: "The total net countable income of this person's assistance unit for the month, computed with the payment-computation earned income disregard of 3.606.2.A (CO-922 - 100% in the first certification period or for a new source, 67% for a current source after it) rather than the eligibility-test figure (CO-907) - the sum of each member's payment countable earned income and countable unearned income (CO-908), plus any income deemed under 3.605.1.A.4 from a minor-parent member's non-participant parent (CO-909) - the figure 3.606.1.I.3 and 3.606.1.K.1 subtract from the grant standard to compute the authorized grant. A required member disqualified for an intentional program violation or as a fleeing felon has gross earnings counted without disregards (3.604.2.M), and one disqualified for citizenship, status, lawful presence or SSN reasons has earnings net of the cw_earned_income_disregard_dollar employment disregard (3.605.1.A.6); the sponsor's deemed net income (cw_sponsor_deemed_income, 3.605.1.A.5) is added for each sponsored member; and the income of a budgetary-unit member outside the assistance unit (cw_budgetary_member_deemed_income: a stepparent under 3.605.1.A.4.a, a non-parent caretaker's spouse under 3.606.1.J) is added."
precision: "Coverage review CW-9(b): money a member received from a sponsor (cw_sponsor_contributions_counted, CO-4363) is added when sponsor deeming does not apply, a gift under 3.605.3.A.14 (S3157). OQ-490 resolved (CDHS review S-5): a member disqualified for citizenship, non-citizen status, lawful presence or SSN reasons (cw_is_disqualified_for_status_or_ssn, CO-2557) has net income deemed under 3.605.1.A.6, gross earnings less the cw_earned_income_disregard_dollar employment disregard of 3.605.1.A.4.a (S1808); a member disqualified for an IPV or as a fleeing felon counts gross earnings without disregards (3.604.2.M). This payment figure applies the same deeming in both computations, since A.6 deems net income to the unit rather than giving the member the unit's payment disregard (3.606.2 excludes disqualified individuals). Coverage pass 6 CA6-4, CA6-5 (docs/reviews/coverage6-cash.md): the members whose income is summed are the month's (cw_assistance_unit_members_in_month, CO-7304), so a child who is no member in the month (no dependent child of it, not yet born, or dead before it) brings no income to it."
derived: ["+", ["sum", "cw_assistance_unit_members_in_month", ["+", ["case", [["of", ["P"], "cw_is_disqualified_member"], ["case", [["of", ["P"], "cw_is_disqualified_for_status_or_ssn"], ["max", 0, ["-", ["of", ["P"], "cw_gross_earned_income"], "cw_earned_income_disregard_dollar"]]], ["else", ["of", ["P"], "cw_gross_earned_income"]]]], ["else", ["of", ["P"], "cw_payment_countable_earned_income"]]], ["of", ["P"], "cw_payment_countable_unearned_income"], ["of", ["P"], "cw_deemed_parent_income_of_minor_parent"], ["of", ["P"], "cw_sponsor_deemed_income"], ["of", ["P"], "cw_sponsor_contributions_counted"]]], ["sum", ["filter", "cw_budgetary_unit_members", ["not", ["in_group", ["P"], "cw_assistance_unit_members"]]], ["of", ["P"], "cw_budgetary_member_deemed_income"]]]
sources: [S415, S1000, S1004, S1626, S1627, S1628, S1808, S3157]
implemented: engine
tags: [cash, tanf, income]
rationale: "No existing item aggregates Colorado Works countable income at the unit level using the payment disregard; cw_countable_income (CO-910) is the nearest same-shape item (unit-level income aggregation) but sums cw_countable_earned_income (CO-907), the eligibility-test figure, which 3.606.1.I.3/.K.1's payment computation does not read - the phase-5 review's C-1 finding. cw_grant_amount (CO-914) needs this figure; cw_meets_income_test (CO-913) and cw_eligibility_status (CO-921) keep reading cw_countable_income (CO-910) unchanged, since the eligibility test uses the $90 figure. Case worker review S11: the authoring note \"Phase-10 sweep (OQ-103, OQ-140, OQ-143)\" moved out of the meaning, which states only what the fact is."
nearest: [CO-910]
