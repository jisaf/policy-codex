id: CO-1434
name: "Adult Financial: requires verification of earned income"
identifier: af_requires_verification_of_earned_income
kind: derived
type: yes/no
scope: person-month
program: AdultFinancial
meaning: "Whether the client's earned income must be verified for Adult Financial: wages (wage data from the Department of Labor is not verified upon receipt), and self-employment income only when its documentation is questionable."
derived: [any, [">", earned_income, 0], [all, [">", self_employment_net_income, 0], earned_income_attestation_is_questionable]]
sources: [S879, S880, S889]
implemented: engine
tags: [verification, cash, income]
open: [OQ-317]
rationale: No existing item states this Adult Financial verification requirement; the phase-9 chapter needs it to count the client's pending verifications.
