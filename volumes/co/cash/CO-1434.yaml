  - {id: CO-1434-T2, month: "2026-10", as_of: "2026-10-01", given: {earned_income: 0, self_employment_net_income: 200, earned_income_attestation_is_questionable: false}, expect: false}
  - {id: CO-1434-T3, month: "2026-10", as_of: "2026-10-01", given: {earned_income: 0, self_employment_net_income: 200, earned_income_attestation_is_questionable: true}, expect: true}
