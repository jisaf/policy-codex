id: CO-914
name: "Colorado Works: basic cash assistance grant amount"
identifier: cw_grant_amount
kind: derived
type: money
scope: person-month
program: ColoradoWorks
role: outcome
meaning: "The authorized Colorado Works basic cash assistance grant for this person's assistance unit for the month: zero unless the unit's eligibility status (cw_eligibility_status, CO-921) is eligible; for an eligible unit, the grant before any sanction (cw_grant_before_sanction, CO-1260: the grant standard for the unit's size plus any pregnancy allowance, minus net countable income computed with the payment disregard, floored at zero, with cents dropped, 9 CCR 2503-6 3.606.1.I and K) less the sanction reduction of 3.608.4.C (cw_sanction_reduction, CO-1265), with the cents dropped. In the month of the initial payment, when assistance begins after the first of the month, the grant for the entire month is multiplied by the partial month figure of 3.609.2.A.1 (cw_partial_month_payment_factor, CO-4358); a partial month grant under $10 is not paid, and one that the deductions bring under $10 is paid unless it is under $1 (A.1.e), with the cents dropped (3.609.2.D)."
precision: "Drops cents by flooring rather than rounding (3.606.1.K.2's 'drop the cents'); the engine has a round-up (ceil) operator but no floor, so this item computes floor(x) as -ceil(-x), which is exact for any real x. The pre-sanction grant (cw_grant_before_sanction, CO-1260) subtracts cw_payment_countable_income (CO-923), computed with the payment disregards of the current 3.606.2.A (S1000) - 100% in the first certification period and for a new source, 67% for a current source after it (phase-8 fix round, B-1) - not cw_countable_income (CO-910), which carries the eligibility-test figure. The $10 pregnancy allowance (3.606.1.G) is added in CO-1260. Phase 8 (OQ-141 resolved): the sanction reduction of 3.608.4.C (cw_sanction_reduction, CO-1265) is subtracted here. CDHS review B-1: the payment is gated on cw_eligibility_status being eligible, as af_oap_grant, snap_allotment, leap_benefit_amount and cccap_parent_fee are; an applicant whose earnings fail the $90 eligibility test (3.606.1.H, J.4) but pass the 100% payment disregard, a unit past the time limit, or a non-resident unit is paid nothing (3.606.1.I: grant payments are computed for an eligible assistance unit). Coverage review CW-8 (S3156): the authorized grant for the entire month (A.1.a-b) is cw_grant_before_sanction (the grant standard and pregnancy allowance less net countable income); the partial month grant is that times the factor (A.1.c-d), compared with cw_partial_month_minimum_grant (CO-4356) before any deduction; the deductions of A.1.e are the sanction reduction (overpayment recovery is outside the volume, notes); the result is compared with cw_partial_month_minimum_payment_after_deductions (CO-4357) and its cents dropped. A full month (factor 1) is computed as before."
derived: [case, [["=", cw_eligibility_status, eligible], [case, [[">=", cw_partial_month_payment_factor, 1], [max, 0, ["*", -1, [ceil, ["*", -1, ["-", cw_grant_before_sanction, cw_sanction_reduction]]]]]], [["<", ["*", cw_grant_before_sanction, cw_partial_month_payment_factor], cw_partial_month_minimum_grant], 0], [["<", ["-", ["*", cw_grant_before_sanction, cw_partial_month_payment_factor], cw_sanction_reduction], cw_partial_month_minimum_payment_after_deductions], 0], [else, ["*", -1, [ceil, ["*", -1, ["-", ["*", cw_grant_before_sanction, cw_partial_month_payment_factor], cw_sanction_reduction]]]]]]], [else, 0]]
sources: [S415, S1000, S3164, S760, S764, S3154, S3156]
implemented: engine
tags: [cash, tanf]
rationale: "No existing item computes the Colorado Works grant amount; this is the program's central payment outcome (declared under ColoradoWorks' outcomes in the report back). Reads cw_payment_countable_income (CO-923) rather than cw_countable_income (CO-910) per the fix-round C-1 finding. Fix round (K-4) adds the pregnancy allowance 3.606.1.G states, which no item previously read. Phase 8 (OQ-141 resolved): the pre-sanction computation moved to cw_grant_before_sanction (CO-1260) and this item subtracts the sanction reduction (S760); with no sanction stated the result is unchanged."
