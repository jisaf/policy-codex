id: CO-914
name: "Colorado Works: basic cash assistance grant amount"
identifier: cw_grant_amount
kind: derived
type: money
scope: person-month
program: ColoradoWorks
role: outcome
meaning: The authorized Colorado Works basic cash assistance grant for this person's assistance unit for the month - the grant standard for the unit's size minus net countable income computed with the payment disregard, floored at zero, with cents dropped, per 9 CCR 2503-6 3.606.1.I and 3.606.1.K. Phase 8 - less the sanction reduction of 9 CCR 2503-6 3.608.4.C (cw_sanction_reduction, CO-1265), with the cents dropped.
precision: "Drops cents by flooring rather than rounding (3.606.1.K.2's 'drop the cents'); the engine has a round-up (ceil) operator but no floor, so this item computes floor(x) as -ceil(-x), which is exact for any real x. The pre-sanction grant (cw_grant_before_sanction, CO-1260) subtracts cw_payment_countable_income (CO-923), computed with the payment disregards of the current 3.606.2.A (S1000) - 100% in the first certification period and for a new source, 67% for a current source after it (phase-8 fix round, B-1) - not cw_countable_income (CO-910), which carries the eligibility-test figure. The $10 pregnancy allowance (3.606.1.G) is added in CO-1260. Phase 8 (OQ-141 resolved): the sanction reduction of 3.608.4.C (cw_sanction_reduction, CO-1265) is subtracted here."
derived: [max, 0, ["*", -1, [ceil, ["*", -1, ["-", cw_grant_before_sanction, cw_sanction_reduction]]]]]
sources: [S415, S1000, S524, S760, S764]
implemented: engine
tags: [cash, tanf]
rationale: "No existing item computes the Colorado Works grant amount; this is the program's central payment outcome (declared under ColoradoWorks' outcomes in the report back). Reads cw_payment_countable_income (CO-923) rather than cw_countable_income (CO-910) per the fix-round C-1 finding. Fix round (K-4) adds the pregnancy allowance 3.606.1.G states, which no item previously read. Phase 8 (OQ-141 resolved): the pre-sanction computation moved to cw_grant_before_sanction (CO-1260) and this item subtracts the sanction reduction (S760); with no sanction stated the result is unchanged."
