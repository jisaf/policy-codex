id: CO-926
name: "Colorado Works: unit caretaker count"
identifier: cw_unit_caretaker_count
kind: derived
type: whole number
scope: person-month
program: ColoradoWorks
meaning: The number of members of this person's assistance unit in the month who are not themselves dependent children of the month (cw_is_dependent_child_in_month, CO-6807), or who are minor parents assisted as adults (9 CCR 2503-6 3.604.2.N.2.c, cw_minor_parent_is_assisted_as_adult, CO-4352), capped at two, for selecting the "No Caretaker" (0), "One Caretaker" (1), or "Two Caretakers" (2) row of 9 CCR 2503-6 3.606.1.F's Standards of Assistance Chart.
precision: "3.606.1.F's chart states only three caretaker rows (0, 1, 2); a unit with more than two non-dependent-child members (cw_assistance_unit_members, CO-900, reaches the optional members of 3.604.2.C.2 who request assistance, such as a non-parent caretaker's spouse beside two parents) is capped at 2 rather than looked up in a row the chart does not have (OQ-101). Coverage review CW-2: a minor parent who does not live in the home of a caretaker receives assistance as an adult (N.2.c, S3153) and is counted here, not as a child. Coverage pass 6 CA6-4 (docs/reviews/coverage6-cash.md, probes W3, W9): per month, from the month's members and each one's dependent child test of the month; before, a person-scope count read a dependent child in some month, so a minor parent who turned 18 was counted as a child in the month she was an adult (W9: no caretaker and two children in October, $362, where one caretaker and one child give $488)."
derived: ["min", 2, ["count", ["filter", "cw_assistance_unit_members_for_size", ["any", ["not", ["of", ["P"], "cw_is_dependent_child_in_month"]], ["of", ["P"], "cw_minor_parent_is_assisted_as_adult"]]]]]
open: [OQ-101]
sources: [S414, S1004, S3153]
implemented: engine
tags: [cash, tanf, household]
rationale: "Phase-10 sweep (OQ-143): counts cw_assistance_unit_members_for_size (CO-2351), which leaves out a disqualified or ineligible member as 3.604.2.M requires (S1004). No existing item counts a Colorado Works unit's caretakers; cw_need_standard (CO-911) and cw_grant_standard (CO-912) need it to select among the three per-caretaker-count tables under the fix-round C-5 finding that 3.606.1.F's chart is keyed by caretaker count as well as child count. Same shape as cw_unit_size (CO-903, a count over cw_assistance_unit_members), acknowledged as the nearest same-shape item, but counts only the non-dependent-child subset and caps it at 2 rather than counting every member."
nearest: [CO-903]
