id: CO-926
name: "Colorado Works: unit caretaker count"
identifier: cw_unit_caretaker_count
kind: derived
type: whole number
scope: person
program: ColoradoWorks
meaning: The number of members of this person's assistance unit who are not themselves dependent children, or who are minor parents assisted as adults (9 CCR 2503-6 3.604.2.N.2.c, cw_minor_parent_is_assisted_as_adult, CO-4352), capped at two, for selecting the "No Caretaker" (0), "One Caretaker" (1), or "Two Caretakers" (2) row of 9 CCR 2503-6 3.606.1.F's Standards of Assistance Chart.
precision: "3.606.1.F's chart states only three caretaker rows (0, 1, 2); a unit with more than two non-dependent-child members (cw_assistance_unit_members, CO-900, reaches the optional members of 3.604.2.C.2 who request assistance, such as a non-parent caretaker's spouse beside two parents) is capped at 2 rather than looked up in a row the chart does not have (OQ-101). Coverage review CW-2: a minor parent who does not live in the home of a caretaker receives assistance as an adult (N.2.c, S3153) and is counted here, not as a child."
derived: [min, 2, [count, [filter, cw_assistance_unit_members_for_size, [any, [not, [of, [P], cw_is_dependent_child]], [of, [P], cw_minor_parent_is_assisted_as_adult]]]]]
open: [OQ-101]
sources: [S414, S1004, S3153]
implemented: engine
tags: [cash, tanf, household]
rationale: "Phase-10 sweep (OQ-143): counts cw_assistance_unit_members_for_size (CO-2351), which leaves out a disqualified or ineligible member as 3.604.2.M requires (S1004). No existing item counts a Colorado Works unit's caretakers; cw_need_standard (CO-911) and cw_grant_standard (CO-912) need it to select among the three per-caretaker-count tables under the fix-round C-5 finding that 3.606.1.F's chart is keyed by caretaker count as well as child count. Same shape as cw_unit_size (CO-903, a count over cw_assistance_unit_members), acknowledged as the nearest same-shape item, but counts only the non-dependent-child subset and caps it at 2 rather than counting every member."
nearest: [CO-903]
tests:
  - {id: CO-926-T1, as_of: "2026-10-01", given: {cw_is_disqualified_member: false, meets_public_assistance_citizenship_requirement: true, date_of_birth: "1990-01-01", cw_is_head_of_assistance_unit: true, receives_ssi: false, cw_receives_title_iv_foster_adoption_kinship_payment: false}, others: {p2: {cw_is_disqualified_member: false, meets_public_assistance_citizenship_requirement: true, date_of_birth: "1992-01-01", cw_is_head_of_assistance_unit: false, receives_ssi: false, cw_receives_title_iv_foster_adoption_kinship_payment: false}, p3: {cw_is_disqualified_member: false, meets_public_assistance_citizenship_requirement: true, date_of_birth: "2015-06-01", receives_ssi: false, cw_receives_title_iv_foster_adoption_kinship_payment: false}}, relationships: [[parent, p1, p3], [parent, p2, p3]], expect: 2}
  - {id: CO-926-T2, as_of: "2026-10-01", given: {cw_is_disqualified_member: false, meets_public_assistance_citizenship_requirement: true, date_of_birth: "1990-01-01", cw_is_head_of_assistance_unit: true, receives_ssi: false, cw_receives_title_iv_foster_adoption_kinship_payment: false}, others: {p2: {cw_is_disqualified_member: false, meets_public_assistance_citizenship_requirement: true, date_of_birth: "2015-06-01", receives_ssi: false, cw_receives_title_iv_foster_adoption_kinship_payment: false}}, relationships: [[parent, p1, p2]], expect: 1}
  - {id: CO-926-T4, title: "A minor mother in her own mother's home, which her mother does not join, is a child of the unit: No Caretaker row", as_of: "2026-10-01", given: {cw_assistance_unit_members_for_size: [p1, p2], cw_is_dependent_child: true, cw_minor_parent_is_assisted_as_adult: false}, others: {p2: {cw_is_dependent_child: true, cw_minor_parent_is_assisted_as_adult: false}}, relationships: [[parent, p1, p2]], expect: 0}
  - {id: CO-926-T3, title: "Coverage review CW-2 (probe ZZ-1): a 17-year-old mother living alone with her baby is assisted as an adult (3.604.2.N.2.c): One Caretaker row (was 0, the No Caretaker row)", as_of: "2026-10-01", given: {cw_is_disqualified_member: false, meets_public_assistance_citizenship_requirement: true, date_of_birth: "2009-04-08", cw_is_head_of_assistance_unit: true, receives_ssi: false, cw_receives_title_iv_foster_adoption_kinship_payment: false}, others: {p2: {cw_is_disqualified_member: false, meets_public_assistance_citizenship_requirement: true, date_of_birth: "2026-02-03", receives_ssi: false, cw_receives_title_iv_foster_adoption_kinship_payment: false}}, relationships: [[parent, p1, p2]], expect: 1}
