id: CO-1422
name: "Colorado Works: requires verification of school enrollment"
identifier: cw_requires_verification_of_school_enrollment
kind: derived
type: yes/no
scope: person-month
program: ColoradoWorks
meaning: "Whether the person's school attendance must be verified for Colorado Works: a dependent child at or over the dependent-child age limit, whose status as a dependent child rests on school enrollment."
precision: "3.604.3.C.4 lists school attendance of all school-aged children as a secondary verification 'when applicable'; this item applies it where attendance decides eligibility. Pattern sweep (cash) PS-T6 (docs/reviews/pattern-sweep-cash.md): read for the month evaluated: a dependent child of the month (cw_is_dependent_child_in_month, CO-6807) who is 18 on its first day (OQ-951), not the person-scope child of some month with the determination date's age."
derived: [all, cw_is_dependent_child_in_month, [">=", [years_between, date_of_birth, [first_day, [month]]], cw_dependent_child_age_limit]]
sources: [S874]
implemented: engine
tags: [verification, cash, tanf, age]
rationale: No existing item states this Colorado Works verification requirement; the phase-9 chapter needs it to count the unit's pending verifications.
tests:
  - {id: CO-1422-T1, month: "2026-10", as_of: "2026-10-01", given: {date_of_birth: "2008-03-01", is_full_time_secondary_student_finishing_before_nineteen: true}, expect: true}
  - {id: CO-1422-T2, month: "2026-10", as_of: "2026-10-01", given: {date_of_birth: "2015-03-01"}, expect: false}
  # Pattern sweep (cash) PS-T6: the attendance decides eligibility only for a dependent child of the month who is 18 on its first day (3.601, S401; OQ-951). Born 2008-09-15, a full-time secondary student, determined 2026-10-15: September (17 on September 1) needs no school verification; October (18 on October 1) does.
  - {id: "CO-1422-T3", title: "Pattern sweep PS-T6: September, 17 on its first day: not required", month: "2026-09", as_of: "2026-10-15", given: {date_of_birth: "2008-09-15", cw_is_dependent_child_in_month: true}, expect: false}
  - {id: "CO-1422-T4", title: "PS-T6: October, 18 on its first day and a dependent child of the month as a student: required", month: "2026-10", as_of: "2026-10-15", given: {date_of_birth: "2008-09-15", cw_is_dependent_child_in_month: true}, expect: true}
