id: CO-947
name: "Adult Financial: countable resources"
identifier: af_countable_resources
kind: derived
type: money
scope: person
program: AdultFinancial
meaning: The person's countable resources for Adult Financial purposes - countable_resources_couple if married, otherwise countable_resources_individual - per 9 CCR 2503-5 3.520.72.A's married/unmarried resource-limit split.
precision: Reads marital status by the existence of a spouse relationship, regardless of whether the spouse is institutionalized, unlike ma_ssi_countable_resources (CO-608), because 3.520.72.A's own text splits on "married"/"unmarried" alone, with no living-together carve-out stated.
derived: [case, [[exists_related, [spouse], true], countable_resources_couple], [else, countable_resources_individual]]
sources: [S454]
implemented: engine
tags: [cash, oap, and, ab, resources]
rationale: No existing item selects between the individual and couple countable-resources figures for Adult Financial. af_meets_resource_limit (CO-948) needs it. Not identical to ma_ssi_countable_resources (CO-608), which selects the couple figure only when the spouse is also not institutionalized (per SSI's "mutually available" living-together rule); acknowledged as the same shape (a case on marital status choosing between the same two supplied facts) but with a materially different condition (plain marriage vs. living-together marriage), since 3.520.72.A states no living-together carve-out.
nearest: [CO-608]
tests:
