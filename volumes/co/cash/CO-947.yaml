  - {id: CO-947-T2, as_of: "2026-10-01", given: {immigration_status: us_citizen, af_person_countable_resources: 1900, af_is_oap_age: true}, others: {p2: {af_person_countable_resources_other_than_life_insurance: 44100, af_life_insurance_countable_value_for_oap: 0}}, relationships: [[spouse, p2]], expect: 46000}
  # Phase-10 sweep (OQ-392): Adult Financial's own count, and a sponsor's resources over the sponsor's limit.
