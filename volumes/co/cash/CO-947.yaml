id: CO-947
name: "Adult Financial: countable resources"
identifier: af_countable_resources
kind: derived
type: money
scope: person-month
program: AdultFinancial
meaning: "The countable resources considered against this Adult Financial client's resource limit (9 CCR 2503-5 3.520.72.A, E): the client's and spouse's countable resources under Adult Financial's own rules, plus, for a sponsored non-citizen, the sponsor's countable resources over the sponsor's limit - af_resource_limit_individual (CO-3045) for an unmarried sponsor, af_resource_limit_couple (CO-3046) for a married sponsor whose spouse is not a co-sponsor, and the individual limit for each of a sponsor and co-sponsor spouse."
precision: "The client's and spouse's figure is af_client_and_spouse_countable_resources (CO-2389), Adult Financial's own count of their holdings; the SSI-method figure no longer stands in (same-word SW-31, OQ-392). The limits are Adult Financial's own (af_resource_limit_individual, _couple; hard-coded numbers audit D-4), which af_meets_resource_limit (CO-948) also reads; a sponsor with a spouse who is not a co-sponsor is married wherever the spouse lives (3.520.72.A.2.b, \"a married sponsor whose spouse is not a co-sponsor\"; coverage review 2, G-5: read from sponsor_spouses_not_cosigning, CO-2714, not from the same-household test sponsor_has_spouse_in_household, CO-2388, which the income deduction of 3.534.D.2.B reads). Coverage review F-15: the stale assumption that Adult Financial's figures equal the SSI-method figures and that a sponsor's resources are not modeled (R-11, OQ-392) is removed; the client's, spouse's and sponsor's resources are all Adult Financial's own count (CO-2389, CO-2390). F-2: the sponsor's resources are deemed only while the sponsor's obligation lasts (af_sponsor_deeming_applies, CO-4400; 3.520.69.B-C). Coverage pass 4 CA4-13 (docs/reviews/coverage4-cash.md): a figure of the month evaluated, from the holdings valued in that month (3.510 \"Resources\", S4791: \"held as of the first day of a calendar month or as of the date of application\"), so an application month before the determination month is judged by its own holdings; before, every month read the determination month's. Coverage pass 6 CA6-7: whether the sponsor's spouse co-sponsored is required where the sponsor's resources are deemed (decision 4 of 2026-11-23); before, read as false when not stated."
derived: ["+", "af_client_and_spouse_countable_resources", ["case", ["af_sponsor_deeming_applies", ["max", 0, ["-", "af_sponsor_countable_resources", ["case", ["sponsor_spouse_is_cosponsor", ["*", 2, "af_resource_limit_individual"]], [[">", ["count", "sponsor_spouses_not_cosigning"], 0], "af_resource_limit_couple"], ["else", "af_resource_limit_individual"]]]]], ["else", 0]]]
sources: [S454, S1636, S3203, S4791]
implemented: engine
tags: [cash, oap, and, ab, resources]
rationale: "No existing item selects between the individual and couple countable-resources figures for Adult Financial. af_meets_resource_limit (CO-948) needs it. Not identical to ma_ssi_countable_resources (CO-608), which selects the couple figure only when the spouse is also not institutionalized (per SSI's 'mutually available' living-together rule); acknowledged as the same shape (a case on marital status choosing between the same two supplied facts) but with a materially different condition (plain marriage vs. living-together marriage), since 3.520.72.A states no living-together carve-out. Fix round (M-6): reads is_married (CO-930) instead of re-deriving [exists_related, [spouse], true] a second time, per the phase-5 review's finding that this item and af_meets_resource_limit (CO-948) had each recomputed the identical married test.  OQ-44 fix (product-owner decision of 2026-11-21; docs/reviews/audit-dual-entry.md 3.1; same-word audit SW-18): reads the one immigration_status fact (CO-002), which replaced citizenship_status, lawful_presence_status (CO-084), federal_five_year_bar_exempt_category (CO-1724) and ma_five_year_bar_exempt_category (CO-1170). The citizen-or-national test reads is_us_citizen_or_national (CO-1358).  Dual-entry audit 1.5 (audit fix round): the sponsor is a person of the case, joined to the non-citizen by the sponsor / sponsored_by relationship (volume.yaml), and the sponsor's income and resources are read from the sponsor's own facts, so two non-citizens with one sponsor read one set of facts. The sponsor's resources and spouse facts are derived from the sponsor persons (CO-2390, CO-2362, CO-2388). Dual-entry audit 2.6: reads the couple's resources through ssi_countable_resources_of_couple (CO-2861), so the figure is stated on one spouse. Same-word SW-31: the silent fallback to the SSI figure is removed; the client's and spouse's resources are derived from their holdings by Adult Financial's own rules."
nearest: [CO-608]
