  - {id: CO-947-T5, title: "A sponsor and co-sponsor spouse share $4,000 - nothing over", as_of: "2026-10-01", given: {immigration_status: lawful_permanent_resident, is_sponsored_non_citizen: true, af_client_and_spouse_countable_resources: 500, af_sponsor_countable_resources: 4000, sponsor_spouse_is_cosponsor: true}, expect: 500}
