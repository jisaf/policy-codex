id: CO-947
name: "Adult Financial: countable resources"
identifier: af_countable_resources
kind: derived
type: money
scope: person
program: AdultFinancial
meaning: "The countable resources considered against this Adult Financial client's resource limit (9 CCR 2503-5 3.520.72.A, E): the client's and spouse's countable resources under Adult Financial's own rules, plus, for a sponsored non-citizen, the sponsor's countable resources over the sponsor's limit - af_resource_limit_individual (CO-3045) for an unmarried sponsor, af_resource_limit_couple (CO-3046) for a married sponsor whose spouse is not a co-sponsor, and the individual limit for each of a sponsor and co-sponsor spouse."
assumption: "Vocabulary fix round (docs/reviews/vocabulary-reuse.md, R-11): Adult Financial's countable resources (3.520.72, counting the client, spouse and sponsors) are taken to equal the SSI-method figures ssi_countable_resources_individual and _couple (CO-800, CO-801, 20 CFR 416.1210), split on plain marriage; a sponsor's resources and any difference between the two exclusion lists are not modeled (OQ-392)."
precision: "The client's and spouse's figure is af_client_and_spouse_countable_resources (CO-2389); when it is not stated, the SSI-method figure stands in, as before the phase-10 sweep (OQ-392). The limits are Adult Financial's own (af_resource_limit_individual, _couple; hard-coded numbers audit D-4), which af_meets_resource_limit (CO-948) also reads; a sponsor whose spouse lives in the household is read as married."
derived: [+, [otherwise, af_client_and_spouse_countable_resources, [case, [is_married, ssi_countable_resources_of_couple], [else, ssi_countable_resources_individual]]], [case, [[all, [not, [in, citizenship_status, [citizen, us_national]]], is_sponsored_non_citizen], [max, 0, ["-", af_sponsor_countable_resources, [case, [[otherwise, sponsor_spouse_is_cosponsor, false], ["*", 2, af_resource_limit_individual]], [[otherwise, sponsor_has_spouse_in_household, false], af_resource_limit_couple], [else, af_resource_limit_individual]]]]], [else, 0]]]
sources: [S454, S1636]
implemented: engine
tags: [cash, oap, and, ab, resources]
rationale: "No existing item selects between the individual and couple countable-resources figures for Adult Financial. af_meets_resource_limit (CO-948) needs it. Not identical to ma_ssi_countable_resources (CO-608), which selects the couple figure only when the spouse is also not institutionalized (per SSI's 'mutually available' living-together rule); acknowledged as the same shape (a case on marital status choosing between the same two supplied facts) but with a materially different condition (plain marriage vs. living-together marriage), since 3.520.72.A states no living-together carve-out. Fix round (M-6): reads is_married (CO-930) instead of re-deriving [exists_related, [spouse], true] a second time, per the phase-5 review's finding that this item and af_meets_resource_limit (CO-948) had each recomputed the identical married test. Dual-entry audit 2.6: reads the couple's resources through ssi_countable_resources_of_couple (CO-2861), so the figure is stated on one spouse."
nearest: [CO-608]
tests:
  - {id: CO-947-T1, as_of: "2026-10-01", given: {citizenship_status: citizen, ssi_countable_resources_individual: 1900, ssi_countable_resources_of_couple: 46000}, others: {}, relationships: [], expect: 1900}
  - {id: CO-947-T2, as_of: "2026-10-01", given: {citizenship_status: citizen, ssi_countable_resources_individual: 1900, ssi_countable_resources_of_couple: 46000}, others: {p2: {}}, relationships: [[spouse, p2]], expect: 46000}
  # Phase-10 sweep (OQ-392): Adult Financial's own count, and a sponsor's resources over the sponsor's limit.
  - {id: CO-947-T3, as_of: "2026-10-01", given: {citizenship_status: citizen, af_client_and_spouse_countable_resources: 1500}, expect: 1500}
  - {id: CO-947-T4, title: "Sponsored LPR with $500 of her own; her married sponsor has $4,200 - $1,200 over his $3,000 limit is deemed", as_of: "2026-10-01", given: {citizenship_status: lawful_permanent_resident, is_sponsored_non_citizen: true, af_client_and_spouse_countable_resources: 500, af_sponsor_countable_resources: 4200, sponsor_has_spouse_in_household: true}, expect: 1700}
  - {id: CO-947-T5, title: "A sponsor and co-sponsor spouse share $4,000 - nothing over", as_of: "2026-10-01", given: {citizenship_status: lawful_permanent_resident, is_sponsored_non_citizen: true, af_client_and_spouse_countable_resources: 500, af_sponsor_countable_resources: 4000, sponsor_spouse_is_cosponsor: true}, expect: 500}
