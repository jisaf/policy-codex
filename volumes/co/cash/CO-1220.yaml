id: CO-1220
name: Died while receiving Adult Financial or Medicaid assistance
identifier: af_died_while_receiving_af_or_medicaid
kind: derived
type: yes/no
scope: person
program: AdultFinancial
meaning: The person has died and, at the time of death, was receiving Old Age Pension, Aid to the Needy Disabled (AND-SO or AND-CS), Home Care Allowance, or Colorado Medicaid assistance, per 9 CCR 2503-5 3.570.43.A.1. False for a living person.
precision: "Receipt at death is read from the month of death: a Medicaid enrollment (is_enrolled_in_medical_assistance, the enrollment record, which for a decedent is the record at death) or an Adult Financial payment (adult_financial_cash_income, which includes the Home Care Allowance). Decision 4 of 2026-11-23 (docs/plan-colorado.md: missing information is cannot determine unless the rule says otherwise), applied as for the receipts readers (b49a7f2; earned-income records E1 for the cash programs, docs/reviews/records-earnings-cash.md): 3.570.43.A.1 asks whether the person was receiving at death and gives no reading for payments not reported, so with the receipts not stated an Adult Financial payment in the month of death cannot be determined (a stated empty list is none); a Medicaid enrollment at death still answers on its own. Receipt records, migration phase 1: the grant received in the month of death is af_grant_receipts is read from the receipts (CO-5000). The Home Care Allowance is its own receipt kind (af_home_care_allowance_receipts; coverage review 3 H-5)."
derived: [all, [not, [unknown, date_of_death]], [any, [at, [any, [">", af_grant_receipts, 0], [">", af_home_care_allowance_receipts, 0]], [month_of, date_of_death]], [otherwise, is_enrolled_in_medical_assistance, false]]]
sources: [S719]
implemented: engine
tags: [cash]
rationale: "No existing fact records death or the programs a decedent was receiving; af_burial_eligible (CO-1231) needs it. Dual-entry audit 3.14: derived from the date of death and the Medicaid and Adult Financial receipt records of the month of death."
tests:
  - {id: CO-1220-T5, as_of: "2026-12-01", given: {date_of_death: "2026-11-20", is_enrolled_in_medical_assistance: false, receipts: [{kind: social_security}, {kind: ssi}, {kind: pension}, {kind: unemployment_compensation}, {kind: child_support}, {kind: colorado_works_cash}, {kind: adult_financial_cash, amount: 800}, {kind: tax_exempt_interest}, {kind: other_taxable}, {kind: other_nontaxable}]}, title: "On OAP in the month of death", expect: true}
  - {id: CO-1220-T6, as_of: "2026-12-01", given: {}, title: Living, expect: false}
  - {id: CO-1220-T7, as_of: "2026-12-01", given: {date_of_death: "2026-11-20", is_enrolled_in_medical_assistance: false, receipts: [{kind: home_care_allowance, amount: 300}]}, title: "Died while receiving the Home Care Allowance (3.570.43.A.1)", expect: true}
  # Decision 4 of 2026-11-23: receipts not stated are cannot determine; a stated empty list is no payment.
  - {id: CO-1220-T8, as_of: "2026-12-01", given: {date_of_death: "2026-11-20", is_enrolled_in_medical_assistance: false}, title: "Died in November, not on Medicaid, receipts not stated: whether a grant was received at death is not known, cannot determine", expect: unknown}
  - {id: CO-1220-T9, as_of: "2026-12-01", given: {date_of_death: "2026-11-20", is_enrolled_in_medical_assistance: false, receipts: []}, title: "Died in November, not on Medicaid, receipts stated empty: not receiving at death", expect: false}
  - {id: CO-1220-T10, as_of: "2026-12-01", given: {date_of_death: "2026-11-20", is_enrolled_in_medical_assistance: true}, title: "Died in November while enrolled in Medicaid: receiving at death whatever the receipts (3.570.43.A.1)", expect: true}
