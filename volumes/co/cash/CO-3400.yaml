id: CO-3400
name: "Adult Financial: countable resources of the person"
identifier: af_person_countable_resources
kind: derived
type: money
scope: person
program: AdultFinancial
meaning: "This person's own countable resources by Adult Financial's own rules (9 CCR 2503-5 3.520.72-3.520.77): cash and convertible assets, retirement and pension accounts (3.520.72.B.5), real and personal property other than the home (B.1, B.3-4), vehicles other than the highest-valued one used for transportation (3.520.77.A), the cash surrender value of life insurance unless the total face value of the client's and spouse's policies is $1,500 or less (3.520.75.D), and for an OAP client only the part 3.520.75.E-F count (af_life_insurance_countable_cash_value); revocable burial trusts and prepaid burial contracts over $1,500 each (3.520.72.B.8, 3.520.77.G-H); and burial spaces beyond the needs of the immediate family (3.520.72.B.9, 3.520.77.I)."
precision: "Final cash review FC-8: 3.520.75.E-F's OAP rule for policies above $1,500 is af_life_insurance_countable_cash_value (CO-3854); revocable burial funds (revocable_burial_trust_value, CO-3855; revocable_prepaid_burial_contract_value, CO-3856) are counted over af_revocable_burial_funds_exemption (CO-3858) each, and burial spaces beyond the family's needs (burial_spaces_value_beyond_family_needs, CO-3857) in full; each is read as 0 when not stated. The other 3.520.77 exemptions not stated by the holdings facts are not counted. Final cash review 2, N-1: the holdings other than life insurance are af_person_countable_resources_other_than_life_insurance (CO-4000), and the person's own life insurance is counted under the OAP rule (CO-4001) when the person is of OAP age and under the AND rule (CO-4002) otherwise; a spouse's life insurance follows the client's program in af_client_and_spouse_countable_resources (CO-2389), which reads this item for the client only."
derived: [+, af_person_countable_resources_other_than_life_insurance, [case, [af_is_oap_age, af_life_insurance_countable_value_for_oap], [else, af_life_insurance_countable_value_other_than_oap]]]
sources: [S1636, S2213, S2214, S2618, S2619]
implemented: engine
tags: [cash, resources]
rationale: "Same-word audit SW-31: every program's countable resources were a supplied, already-counted figure, so each program's resource rules lived outside the ledger, and Adult Financial fell back silently to the SSI figure when its own was unstated (OQ-392). The person's holdings are stated once by asset type; each program derives its countable resources by its own exclusions. Final cash review 2, N-1: the sum is split into the holdings other than life insurance (CO-4000) and the life insurance under each program's rule (CO-4001, CO-4002), so the spouse's policies can be counted under the client's program."
tests:
  - {id: CO-3400-T1, title: "Coverage review F-8: the $1,000 retirement account with no tax figure counts at 80% (3.520.73.B.1.b): 700 + 800 = 1,500 (was 1,700)", as_of: "2026-10-01", given: {receipts: [], liquid_resources_value: 700, retirement_accounts_value: 1000, vehicles_equity_value: 4000, transportation_vehicle_equity_value: 4000, af_is_oap_age: false}, relationships: [], expect: 1500}
  - {id: CO-3400-T2, title: "Face value over 1,500: cash value counted", as_of: "2026-10-01", given: {receipts: [], liquid_resources_value: 100, life_insurance_face_value: 2000, life_insurance_cash_surrender_value: 600, af_is_oap_age: false}, relationships: [], expect: 700}
  # Final cash review FC-8.
  - {id: CO-3400-T3, title: "FC-8: OAP client with $1,000 in the bank and an old $10,000 policy worth $5,000 - the cash value is exempt (3.520.75.E.1)", as_of: "2026-10-01", given: {receipts: [], liquid_resources_value: 1000, life_insurance_face_value: 10000, af_life_insurance_countable_cash_value: 0, af_is_oap_age: true}, relationships: [], expect: 1000}
  - {id: CO-3400-T4, title: "FC-8: a $2,300 revocable prepaid burial contract - $800 over the $1,500 counts (3.520.77.H.2)", as_of: "2026-10-01", given: {receipts: [], liquid_resources_value: 500, revocable_prepaid_burial_contract_value: 2300, af_is_oap_age: false}, relationships: [], expect: 1300}
