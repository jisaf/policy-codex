id: CO-935
name: "Colorado Works: budgetary unit countable income"
identifier: cw_budgetary_unit_countable_income
kind: derived
type: money
scope: person-month
program: ColoradoWorks
meaning: The net countable income of this person's Colorado Works budgetary unit for the month - the sum, over cw_budgetary_unit_members (CO-933), of each member's countable earned income (with the $90 disregard, CO-907) and countable unearned income (CO-908) - per 9 CCR 2503-6 3.606.1.J.1-2's "apply the appropriate earned income disregards to the gross earned income of each employed member of the budgetary unit ... [and] add the unearned income received by each member of the budgetary unit."
precision: "Does not separately add cw_deemed_parent_income_of_minor_parent (CO-909), unlike cw_countable_income (CO-910): a minor parent's non-participant parent is now a budgetary unit member in their own right (S527.d, CO-933), so their income is already counted once through cw_budgetary_unit_members's sum rather than deemed a second time through CO-909's own route - the two figures reach the same population by different means for the two different purposes (this item for J.1-2's income test; CO-910 for the assistance unit's own I.1-2 grant computation, which does not extend to the budgetary unit and so still needs CO-909's deeming to reach that parent's income at all)."
derived: [sum, cw_budgetary_unit_members, [+, [of, [P], cw_countable_earned_income], [of, [P], cw_countable_unearned_income]]]
sources: [S528]
implemented: engine
tags: [cash, tanf, income]
rationale: "No existing item aggregates income at the budgetary-unit level; cw_meets_income_test (CO-913) needs it under this fix round's OQ-140 finding that 3.606.1.J.1-2 computes the reported-income eligibility test over the budgetary unit, not the assistance unit alone. Nearest same-shape item is cw_countable_income (CO-910), the assistance-unit-level income aggregation this item parallels, acknowledged here; differs by summing over cw_budgetary_unit_members (CO-933) instead of cw_assistance_unit_members (CO-900) and, as this item's own precision explains, by not separately adding the minor-parent deeming term CO-910 needs."
nearest: [CO-910]
