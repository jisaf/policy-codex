id: CO-2842
name: "Colorado Works: half sibling of a dependent child who receives child support"
identifier: cw_is_half_sibling_receiving_child_support
kind: derived
type: yes/no
scope: person
program: ColoradoWorks
meaning: Whether the person is a half sibling of a dependent child and receives child support, an optional member of the assistance unit whom the caretaker decides whether to include (9 CCR 2503-6 3.604.2.C.2.d, S1625). A half sibling who receives no child support is a mandatory member (C.1.d).
precision: "Child support received for the person in the determination month above zero: the receipts of kind child_support or child_support_arrears (receipts, CO-5000; receipt records, migration phase 2: before them, child_support_received, CO-028, which stated arrears within the support). 3.604.2.C.2.d asks whether the half sibling receives child support, not how Colorado Works counts it, so arrears are support here too."
derived: [all, [exists, half_siblings, [of, [P], cw_is_dependent_child]], [at, [">", [sum_receipts, receipts, [all, [in, [receipt, kind], [child_support, child_support_arrears]], [received_in, [month]]], [receipt, amount]], 0], [det_month]]]
sources: [S1625]
implemented: engine
tags: [cash, tanf, household]
rationale: "Same-word audit SW-2: the half-sibling arm of cw_is_optional_member_by_custody_or_support (CO-2347) was entered by hand; it follows from the parent edges and the child support the half sibling receives."
tests:
  - {id: CO-2842-T1, month: "2026-11", as_of: "2026-11-01", given: {receipts: [{kind: child_support, amount: 300}]}, title: "Half brother of the dependent child, child support 300", others: {p2: {}, p3: {cw_is_dependent_child: true}, p4: {}}, relationships: [[parent, p2, p1], [parent, p2, p3], [parent, p4, p3]], expect: true}
  - {id: CO-2842-T2, month: "2026-11", as_of: "2026-11-01", given: {receipts: [{kind: social_security, amount: 300}]}, title: "Half brother with no child support", others: {p2: {}, p3: {cw_is_dependent_child: true}, p4: {}}, relationships: [[parent, p2, p1], [parent, p2, p3], [parent, p4, p3]], expect: false}
