  - {id: CO-2842-T2, month: "2026-11", as_of: "2026-11-01", given: {receipts: [{kind: social_security, amount: 300}]}, title: "Half brother with no child support", others: {p2: {}, p3: {cw_is_dependent_child: true}, p4: {}}, relationships: [[parent, p2, p1], [parent, p2, p3], [parent, p4, p3]], expect: false}
