id: CO-2342
name: "Adult Financial: excluded earned income"
identifier: af_excluded_earned_income
kind: derived
type: money
scope: person-month
program: AdultFinancial
meaning: "The part of this person's gross earned income for the month that 9 CCR 2503-5 3.520.786.H exempts, work-study income, and the infrequent or irregular earnings O exempts (af_excluded_infrequent_earned_income, final cash review 2, P2-3)."
precision: "The sum of the neutral receipt facts the program's list names (each part of the gross income facts, so the program's countable income subtracts it); an unstated receipt is 0."
derived: [+, [otherwise, work_study_earnings, 0], af_excluded_infrequent_earned_income]
sources: [S1622, S2206, S2608]
implemented: engine
tags: [cash, income]
rationale: "Same-word audit SW-28, dual-entry audit 3.24 and 3.25: each program's excluded income and allowable business costs were program-prefixed supplied amounts, so one receipt or one set of business costs was entered once per program. The neutral fact describes the receipt or the cost; each program's exclusion or allowable cost is its own derived item citing its list (product-owner decision, convention rule 13). The ID and identifier are kept; the amount is now derived."
