id: CO-2342
name: "Adult Financial: excluded earned income"
identifier: af_excluded_earned_income
kind: derived
type: money
scope: person-month
program: AdultFinancial
meaning: "The part of this person's counted earned income for the month that 9 CCR 2503-5 3.520.786 exempts by a field of the pay rather than by its kind: the part of a counted pay, business or boarder payment set aside under a Plan to Achieve Self Support the SSA approved (I), and infrequent or irregular pay O exempts (af_excluded_infrequent_earned_income, final cash review 2, P2-3). Work-study (H) and 37 U.S.C. 310 special pay (K) are exempt by kind: af_earnings_treatment_table (CO-5103) never counts them."
precision: "Earned-income records, step E1 Adult Financial (docs/reviews/records-earnings-cash.md): the PASS set-aside is the earnings records' pass_set_aside (default 0) on the records received in the month that the table counts (pay, a business's receipts, a farm's, boarder payments); before earnings records Adult Financial did not read pass_set_aside_earned_income, so a PASS of wages was counted although I exempts \"Income and resources set aside as part of a PASS\", earned or unearned (3.520.786: \"Certain earned and unearned income ... is exempt\"). Work-study is no longer summed here: the table excludes it, so af_gross_earned_income (CO-3830) never adds it. An irregular pay with a PASS set-aside is exempt once (af_excluded_infrequent_earned_income takes the pay less its set-aside). An unstated earnings list is cannot determine. Coverage pass 4 CA4-9 (docs/reviews/coverage4-cash.md): a stream (an earnings record with no month and no date) is read only in the months from the month of its job_start_date through the month of its job_end_date, so the pay of a job that ended before the month, or begins after it, is not counted (9 CCR 2503-5 3.520.781.G, 9 CCR 2503-6 3.605.2.B: income counted when received); a record stated with its month or date is read in that month. Coverage pass 4 CA4-7: a difficulty of care payment stated as foster care (foster_care) is not counted pay."
derived: ["+", af_excluded_infrequent_earned_income, [sum_receipts, earnings, [all, [all, [received_in, [month]], [any, [any, [in, [lookup, af_earnings_treatment_table, [receipt, kind]], [counted, counted_no_rule_excludes, counted_at_value, counted_net_of_costs, counted_averaged_over_year, counted_less_provision_costs]], [all, ["=", [lookup, af_earnings_treatment_table, [receipt, kind]], counted_unless_foster_care], [not, [receipt, foster_care]]]], [all, ["=", [lookup, af_earnings_treatment_table, [receipt, kind]], excluded_except_combat_zone], [receipt, combat_zone]]]], [any, [not, [unknown, [receipt, month]]], [all, [any, [unknown, [receipt, job_start_date]], ["<=", [month_of, [receipt, job_start_date]], [month]]], [any, [unknown, [receipt, job_end_date]], [">=", [month_of, [receipt, job_end_date]], [month]]]]]], [receipt, pass_set_aside]]]
sources: [S1622, S2206, S2608]
implemented: engine
tags: [cash, income]
rationale: "Same-word audit SW-28, dual-entry audit 3.24 and 3.25: each program's excluded income and allowable business costs were program-prefixed supplied amounts, so one receipt or one set of business costs was entered once per program. The neutral fact describes the receipt or the cost; each program's exclusion or allowable cost is its own derived item citing its list (product-owner decision, convention rule 13). The ID and identifier are kept; the amount is now derived. Earned-income records, step E1 Adult Financial: the exemptions by kind moved into the counting table; what is left here is the exemptions by a field of the pay."
tests:
  # Hand computations from 3.520.786.I and O (S2608).
  - {id: CO-2342-T1, month: "2026-10", as_of: "2026-10-01", title: "No earnings: nothing exempt", given: {receipts: [], earnings: []}, expect: 0}
  - {id: CO-2342-T2, month: "2026-10", as_of: "2026-10-01", title: "$50 of work-study is exempt by its kind, not here: 0", given: {receipts: [], earnings: [{kind: wages, amount: 400}, {kind: work_study, amount: 50}]}, expect: 0}
  - {id: CO-2342-T3, month: "2026-10", as_of: "2026-10-01", title: "$800 of wages with $200 set aside under a PASS and a business with $100 set aside: 200 + 100 = 300 (I)", given: {receipts: [], earnings: [{kind: wages, amount: 800, pass_set_aside: 200}, {kind: self_employment_receipts, amount: 600, pass_set_aside: 100}]}, expect: 300}
  - {id: CO-2342-T4, month: "2026-10", as_of: "2026-10-01", title: "A $35 odd job in October, nothing else irregular in the quarter: exempt (O): 35", given: {receipts: [], earnings: [{kind: wages, amount: 600}, {kind: wages, amount: 35, irregular: true, month: "2026-10"}]}, expect: 35}
  - {id: CO-2342-T5, month: "2026-10", as_of: "2026-10-01", title: "Earnings not stated: cannot determine", given: {receipts: []}, expect: unknown}
