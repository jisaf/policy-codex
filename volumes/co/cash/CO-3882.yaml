id: CO-3882
name: "Adult Financial: earned income is unverified"
identifier: af_earned_income_is_unverified
kind: derived
type: yes/no
scope: person-month
program: AdultFinancial
meaning: "Whether this person has earned income for the month that Adult Financial requires verified and that is not: wages with no income document (DOLE wage data is not verified on receipt), or self-employment income with neither SSA data nor an unquestioned document (9 CCR 2503-5 3.520.5.A, 3.520.783.E)."
precision: "Whoever's income it is: the client, or the client's spouse whose potential income 3.520.5.A.3 requires verified (af_spouse_income_pending_verification_count, CO-3884). Earned-income records, step E1 Adult Financial (docs/reviews/records-earnings-cash.md): wages are the person's earnings records of pay received in the month, of any kind Adult Financial counts or exempts (as wages_gross held every part of the wages, work-study included), and in-kind pay too, which 3.520.782.B counts as earned income; not an employer's vendor payment, which Adult Financial does not count (af_earnings_treatment_table: not_counted_no_rule_found); self-employment income is the receipts of a business, of a farm and from boarders (3.520.783), each read in the month. An unstated earnings list is cannot determine. Coverage pass 6 CA6-10 (docs/reviews/coverage6-cash.md): the wages read are those Adult Financial's pay reader counts (af_earned_pay, CO-5130), and a stream is read only from the month of its job_start_date through the month of its job_end_date, as every Adult Financial earnings reader reads it since CA4-9; before, pay that is not counted (a stream from a job that ended, an exempt kind) was asked to be verified."
derived: ["any", ["all", [">", ["sum_receipts", "earnings", ["all", ["received_in", ["month"]], ["any", ["in", ["lookup", "af_earnings_treatment_table", ["receipt", "kind"]], ["counted", "counted_no_rule_excludes", "counted_at_value"]], ["all", ["=", ["lookup", "af_earnings_treatment_table", ["receipt", "kind"]], "counted_unless_foster_care"], ["not", ["receipt", "foster_care"]]], ["all", ["=", ["lookup", "af_earnings_treatment_table", ["receipt", "kind"]], "excluded_except_combat_zone"], ["receipt", "combat_zone"]]], ["any", ["not", ["unknown", ["receipt", "month"]]], ["all", ["any", ["unknown", ["receipt", "job_start_date"]], ["<=", ["month_of", ["receipt", "job_start_date"]], ["month"]]], ["any", ["unknown", ["receipt", "job_end_date"]], [">=", ["month_of", ["receipt", "job_end_date"]], ["month"]]]]]], ["receipt", "amount"]], 0], ["not", "earned_income_verification_document_received"]], ["all", [">", ["sum_receipts", "earnings", ["all", ["received_in", ["month"]], ["in", ["lookup", "af_earnings_treatment_table", ["receipt", "kind"]], ["counted_net_of_costs", "counted_averaged_over_year", "counted_less_provision_costs"]], ["any", ["not", ["unknown", ["receipt", "month"]]], ["all", ["any", ["unknown", ["receipt", "job_start_date"]], ["<=", ["month_of", ["receipt", "job_start_date"]], ["month"]]], ["any", ["unknown", ["receipt", "job_end_date"]], [">=", ["month_of", ["receipt", "job_end_date"]], ["month"]]]]]], ["receipt", "amount"]], 0], ["not", ["any", "self_employment_income_verified_by_electronic_data_source", ["all", "earned_income_verification_document_received", ["not", "earned_income_attestation_is_questionable"]]]]]]
sources: [S880, S889]
implemented: engine
tags: [cash, verification]
rationale: "Final cash review FC-12 and final verification review V-2 (and V-9): the earned-income element (CO-1665) was gated on the person's own Adult Financial applicability, so a spouse under OAP age with no disability was never asked. The ungated condition is stated once, here."
tests:
  - {id: CO-3882-T1, title: "Wages with no pay stubs", as_of: "2026-10-01", month: "2026-10", given: {earned_income_verification_document_received: false, earnings: [{kind: wages, amount: 900}]}, expect: true}
  - {id: CO-3882-T2, title: "No earnings", as_of: "2026-10-01", month: "2026-10", given: {earnings: []}, expect: false}
  - {id: CO-3882-T3, title: "$400 a month from a lodger, no document and no SSA data: unverified (3.520.783.E)", as_of: "2026-10-01", month: "2026-10", given: {earned_income_verification_document_received: false, self_employment_income_verified_by_electronic_data_source: false, earnings: [{kind: boarder_payments, amount: 400, provides: room_only, boarders: 1}]}, expect: true}
  - {id: CO-3882-T4, title: "Earnings not stated: cannot determine", as_of: "2026-10-01", month: "2026-10", given: {earned_income_verification_document_received: false}, expect: unknown}
  # Coverage pass 6 CA6-10: a $900 wage stream from a job that began 2026-11-01 is not October's pay (CA4-9).
  - {id: "CO-3882-T5", title: "Coverage pass 6 CA6-10: a job that begins in November: no October wages to verify", as_of: "2026-10-15", month: "2026-10", given: {earned_income_verification_document_received: false, earnings: [{kind: wages, amount: 900, job_start_date: "2026-11-01"}]}, expect: false}
