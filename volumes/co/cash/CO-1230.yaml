id: CO-1230
name: "Burial assistance: burial costs remaining after other monies"
identifier: af_burial_unmet_cost
kind: derived
type: money
scope: person
program: AdultFinancial
meaning: The full burial costs that remain after applying, in order, insurance proceeds, the decedent's available estate, and the legally responsible person(s)' resources over the SSI limit; never below zero, per 9 CCR 2503-5 3.570.43.D.1-3.
precision: Voluntary contributions from the legally responsible person or others (3.570.43.D.3.b.2, G) reduce what the providers bill the county but are not a required offset; they are not modeled.
derived: [max, 0, ["-", burial_services_total_cost, ["+", burial_insurance_proceeds, decedent_estate_value, af_burial_responsible_person_excess_resources]]]
sources: [S721]
implemented: engine
tags: [cash, resources]
rationale: No existing item computes this; af_burial_eligible (CO-1231) and af_burial_benefit (CO-1232) need it.
tests:
  - {id: CO-1230-T1, as_of: "2026-10-01", given: {burial_services_total_cost: 2400, burial_insurance_proceeds: 500, decedent_estate_value: 300, af_burial_responsible_person_excess_resources: 0}, expect: 1600}
  - {id: CO-1230-T2, as_of: "2026-10-01", given: {burial_services_total_cost: 2400, burial_insurance_proceeds: 2000, decedent_estate_value: 600, af_burial_responsible_person_excess_resources: 0}, expect: 0}
