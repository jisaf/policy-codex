id: CO-1423
name: "Colorado Works: requires verification of pregnancy"
identifier: cw_requires_verification_of_pregnancy
kind: derived
type: yes/no
scope: person-month
program: ColoradoWorks
meaning: "Whether the person's pregnancy must be verified for Colorado Works: when no child is in the assistance unit, so the pregnancy is the basis of the unit."
derived: [all, is_pregnant, [not, cw_has_dependent_child]]
sources: [S874]
implemented: engine
tags: [verification, cash, tanf]
rationale: No existing item states this Colorado Works verification requirement; the phase-9 chapter needs it to count the unit's pending verifications.
tests:
  - {id: CO-1423-T1, month: "2026-10", as_of: "2026-10-01", given: {is_pregnant: true, cw_has_dependent_child: false}, expect: true}
  - {id: CO-1423-T2, month: "2026-10", as_of: "2026-10-01", given: {is_pregnant: true, cw_has_dependent_child: true}, expect: false}
  - {id: CO-1423-T3, month: "2026-10", as_of: "2026-10-01", given: {is_pregnant: false}, expect: false}
