id: CO-1646
name: "Colorado Works: immigration status verification is pending"
identifier: cw_immigration_status_verification_is_pending
kind: derived
type: yes/no
scope: person-month
program: ColoradoWorks
role: outcome
meaning: Whether Colorado Works requires verification of the person's declared immigration status (SAVE, or documentation submitted) and it has not been provided.
precision: "False where Colorado Works verification does not apply to the person (cw_verification_is_applicable, CO-2583; case worker review B2). Due by: cw_status_verification_due_date (CO-1656: thirty days; the member, not the unit, is excluded after it)."
derived: [all, cw_verification_is_applicable, [all, claims_lawful_immigration_status, [not, immigration_status_is_verified_or_submitted]]]
sources: [S873, S1071]
implemented: engine
tags: [verification, cash, tanf]
rationale: "Review U-1: the count items held this test as an anonymous arm, so no outcome told a worker which document was outstanding and for whom; the count now sums this item."
tests:
  - {id: CO-1646-T1, month: "2026-10", as_of: "2026-10-01", given: {cw_verification_is_applicable: true, immigration_status: refugee, immigration_status_verified_by_electronic_data_source: false, immigration_status_verification_document_received: false}, expect: true}
  - {id: CO-1646-T2, month: "2026-10", as_of: "2026-10-01", given: {cw_verification_is_applicable: true, immigration_status: refugee, immigration_status_verified_by_electronic_data_source: true}, expect: false}
