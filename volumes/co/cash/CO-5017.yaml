id: CO-5017
name: "Adult Financial: a person's counted unearned receipts other than SSI"
identifier: af_counted_unearned_receipts
kind: derived
type: money
scope: person-month
program: AdultFinancial
meaning: "The person's receipts of the month that Adult Financial's counting table counts, other than SSI and the Adult Financial grant, a receipt paid once in the month received (9 CCR 2503-5 3.520.785.B.1.a), each less the parts of it the rule leaves out: the part set aside under a PASS (3.520.786.I), the part of VA Aid and Attendance used for uncovered medical care (F), the medical, legal or related expenses of a workers' compensation claim that the award includes (claim_expense; 3.520.785.B.9: \"deducted prior to determining the amount of countable unearned income\"), and the part of life insurance proceeds spent on the insured's last illness and burial or of health insurance or injury proceeds spent or to be spent on medical care (spent_on_covered_costs; B.14-15); a savings account distribution at the part the person's federal return counts (taxable_amount); rental income less its allowable expenses (af_rental_expenses_deducted, B.20); and the benefits conditional on school attendance above the expenses of attendance (af_school_attendance_benefits_counted, B.16). A retroactive lump sum of SSI or of the grant is counted here, in the month received (OQ-887). The one figure the client's own income (af_unearned_income_other_than_ssi, CO-3831) and a deemed spouse's, parent's or sponsor's (af_relative_deemable_unearned_income, CO-4720) both read, before the exclusions that turn on the person (child support for an SSI-age child, life-threatening-condition gifts to a child, infrequent income)."
derived: ["+", ["-", [sum_receipts, receipts, [all, [received_in, [month]], [any, [in, [lookup, af_receipt_treatment_table, [receipt, kind]], [counted, counted_no_rule_excludes, counted_less_one_third_for_ssi_child, counted_less_child_gift_exclusion, counted_taxable_amount]], [all, [receipt, retroactive], [in, [lookup, af_receipt_treatment_table, [receipt, kind]], [counted_separately, not_income_to_client]]]]], [case, [["=", [lookup, af_receipt_treatment_table, [receipt, kind]], counted_taxable_amount], [receipt, taxable_amount]], [else, ["-", [receipt, amount], ["+", [receipt, pass_set_aside], [receipt, used_for_uncovered_medical_care], [receipt, claim_expense], [receipt, spent_on_covered_costs]]]]]], af_rental_expenses_deducted], af_school_attendance_benefits_counted]
precision: "Coverage pass 4 (docs/reviews/coverage4-cash.md): CA4-1, the parts of a receipt B.9, B.14 and B.15 deduct are its fields claim_expense and spent_on_covered_costs (receipts, CO-5000), as Colorado Works reads them (cw_counted_unearned_receipts, CO-5651); before, Adult Financial left the fields unread and subtracted a second statement of the same money (unearned_income_offsetting_expenses, CO-4444, read as 0 when not stated), so a household stated per the record schema was counted gross. The rental expenses and the expenses of school attendance are facts of the person, not parts of a receipt, so they are read outside the sum by their own items, each only when the person has such a receipt (decision 4: required where read). CA4-3: a loan, a reimbursement, the proceeds of a resource and cash value taken from a policy are not income (their rows are not_income); a savings account distribution counts at its taxable_amount, which a record must state where this item reads it."
sources: [S1622, S2608, S2609, S3212, S3212, S4790, S2804]
implemented: engine
tags: [cash, income]
rationale: "Receipt records, migration phase 1: Adult Financial's unearned income read from the receipts through its counting table, replacing the sum of the unearned income facts less af_excluded_unearned_income (CO-2343)."
tests:
  - {id: "CO-5017-T1", month: "2026-10", as_of: "2026-10-15", given: {receipts: [{kind: social_security, amount: 600}, {kind: ssi, amount: 300}, {kind: interest_and_dividends, amount: 40}, {kind: loan, amount: 200}]}, title: "Social Security counted; a bona fide loan is no gain (3.510 \"Income\"; 3.520.77.L exempts it in the month received); SSI counted separately; interest excluded ((c)(22)): 600", expect: 600}
  - {id: "CO-5017-T2", month: "2026-10", as_of: "2026-10-15", given: {receipts: [{kind: other_nontaxable, amount: 5000, frequency: once, month: "2026-10"}, {kind: pension, amount: 600}]}, title: "An inheritance is counted in the month received (probe PR-LUMP, coverage F-12)", expect: 5600}
  - {id: "CO-5017-T3", month: "2026-10", as_of: "2026-10-15", given: {receipts: [{kind: social_security, amount: 900, pass_set_aside: 100}, {kind: va_aid_and_attendance, amount: 400, used_for_uncovered_medical_care: 150}]}, title: "PASS set-aside (I) and VA Aid and Attendance used for uncovered care (F) left out", expect: 1050}
  - {id: "CO-5017-T4", month: "2026-10", as_of: "2026-10-15", given: {receipts: [{kind: ssi, amount: 1500, frequency: once, retroactive: true, month: "2026-10"}]}, title: "A retroactive SSI award is counted as unearned income other than SSI in the month received (OQ-887)", expect: 1500}
  - {id: "CO-5017-T5", month: "2026-10", as_of: "2026-10-15", given: {}, title: "Receipts not stated: cannot determine", expect: unknown}
  # Coverage pass 4 (docs/reviews/coverage4-cash.md): hand computations from 3.520.785.B.9, B.14-16, B.20 (S3212), 3.510 "Income" (S4790), 3.520.786.K with 416.1124(c)(14) (S2804).
  - {id: "CO-5017-T6", month: "2026-10", as_of: "2026-10-01", given: {receipts: [{kind: social_security, amount: 600}, {kind: workers_compensation, amount: 1000, claim_expense: 700}]}, title: "Coverage pass 4 CA4-1 (probe A1): $1,000 of workers' compensation of which $700 is for the claim's medical and legal expenses (B.9): 600 + (1,000 - 700) = 900", expect: 900}
  - {id: "CO-5017-T7", month: "2026-10", as_of: "2026-10-01", given: {receipts: [{kind: social_security, amount: 600}, {kind: other_nontaxable, amount: 5000, frequency: once, month: "2026-10", spent_on_covered_costs: 4800}]}, title: "Coverage pass 4 CA4-1 (probe A2b): $5,000 of life insurance proceeds, $4,800 spent on the insured's last illness and burial (B.14): 600 + (5,000 - 4,800) = 800", expect: 800}
  - {id: "CO-5017-T8", month: "2026-10", as_of: "2026-10-01", given: {receipts: [{kind: social_security, amount: 600}, {kind: loan, amount: 1500, frequency: once, month: "2026-10"}, {kind: reimbursement, amount: 600, frequency: once, month: "2026-10"}, {kind: resource_liquidation, amount: 1200, frequency: once, month: "2026-10"}, {kind: insurance_cash_value, amount: 1200, frequency: once, month: "2026-10"}]}, title: "Coverage pass 4 CA4-3 (probes A4 to A7): a bona fide loan, a reimbursement, the price of her own car and cash value taken from her own policy are no financial gain (3.510 \"Income\"): 600", expect: 600}
  - {id: "CO-5017-T9", month: "2026-10", as_of: "2026-10-01", given: {receipts: [{kind: social_security, amount: 600}, {kind: housing_utility_allowance, amount: 120}]}, title: "Coverage pass 4 CA4-4 (probe A14): a public housing utility allowance is assistance paid with respect to a dwelling unit under the Housing Act (K, 416.1124(c)(14)): 600", expect: 600}
  - {id: "CO-5017-T10", month: "2026-10", as_of: "2026-10-01", given: {receipts: [{kind: social_security, amount: 600}, {kind: savings_account_distribution, amount: 1000, taxable_amount: 1000}, {kind: savings_account_distribution, amount: 400, frequency: once, month: "2026-10", taxable_amount: 0}]}, title: "Coverage pass 4 CA4-3: $1,000 a month from a traditional IRA (taxable 1,000) and $400 from a health savings account for medical bills (taxable 0): 600 + 1,000 = 1,600", expect: 1600}
  - {id: "CO-5017-T11", month: "2026-10", as_of: "2026-10-01", given: {receipts: [{kind: social_security, amount: 600}, {kind: savings_account_distribution, amount: 1000}]}, title: "Coverage pass 4 CA4-3: a distribution whose taxable amount is not stated: cannot determine", expect: unknown}
  - {id: "CO-5017-T12", month: "2026-10", as_of: "2026-10-01", given: {school_attendance_expenses_paid: 200, receipts: [{kind: social_security, amount: 600}, {kind: school_attendance_conditional_benefit, amount: 800}]}, title: "Coverage pass 4 CA4-2 (probe A3): $800 of G.I. Bill payments conditional on attendance, $200 of school expenses (B.16): 600 + (800 - 200) = 1,200", expect: 1200}
  - {id: "CO-5017-T13", month: "2026-10", as_of: "2026-10-01", given: {rental_property_expenses_paid: 500, receipts: [{kind: social_security, amount: 600}, {kind: rental_income, amount: 800}]}, title: "F-11 (probe PR-RENT): $800 of rent with $500 of allowable expenses (B.20): 600 + (800 - 500) = 900", expect: 900}
