id: CO-5343
name: "Adult Financial: countable vehicles"
identifier: af_countable_vehicles
kind: derived
type: money
scope: person
program: AdultFinancial
meaning: "The equity of the person's vehicles that Adult Financial counts (9 CCR 2503-5 3.520.72.B.4, 3.520.77.A): the equity of every vehicle record (row counted_less_highest_transportation_vehicle), each its value less what is owed on it times the person's share, never below zero, less the largest such equity of a vehicle used for the transportation of the client or a member of the household (used_for_transportation; P58 largest): \"The vehicle with the highest value is exempt if it is used for the transportation of the client or a member of the household\"."
precision: "Resource records, step H1 Adult Financial (docs/reviews/records-holdings-snap-af.md): \"highest value\" is read as the highest equity (OQ-1205, assumption A), which is what P58 returns over the equities; each vehicle's equity is floored at 0 before the sum and before the largest (P58 returns the true largest, negative when every vehicle owes more than it is worth, docs/operators.md), so a vehicle owing more than it is worth neither adds nor exempts anything and never lowers what another vehicle counts. Before step H1 the household stated which vehicle was exempt (transportation_vehicle_equity_value, CO-3395) as a part of the vehicles' total. A vehicle that does not say whether it is used for transportation is cannot determine (decision 4; used_for_transportation is required where read)."
derived: ["-", ["sum_receipts", "holdings", ["all", ["all", ["received_in", ["det_month"]], ["unknown", ["receipt", "disposed_date"]]], ["=", ["lookup", "af_holding_treatment_table", ["receipt", "kind"]], "counted_less_highest_transportation_vehicle"]], ["max", 0, ["*", ["-", ["receipt", "value"], ["receipt", "amount_owed"]], ["otherwise", ["receipt", "share"], 1]]]], ["largest", "holdings", ["all", ["all", ["received_in", ["det_month"]], ["unknown", ["receipt", "disposed_date"]]], ["=", ["lookup", "af_holding_treatment_table", ["receipt", "kind"]], "counted_less_highest_transportation_vehicle"], ["receipt", "used_for_transportation"]], ["max", 0, ["*", ["-", ["receipt", "value"], ["receipt", "amount_owed"]], ["otherwise", ["receipt", "share"], 1]]]]]
sources: [S2213, S2214, S4692]
implemented: engine
tags: [cash, resources]
open: [OQ-1205]
rationale: "Resource records, step H1 Adult Financial (docs/reviews/records-holdings-snap-af.md): Adult Financial reads the person's resources from the holdings records (holdings, CO-5300) through its counting table (af_holding_treatment_table, CO-5302), for the client, the spouse and each sponsor alike (3.520.72.A, E), never from the scalar resource facts. Design decision D5 (P58 largest, 3.520.77.A): the vehicle exempt is chosen by the rule from the records, not stated by the household."
tests:
  # Hand-computed from 9 CCR 2503-5 3.520.77.A (S2214) with P58 over equity floored at 0 (OQ-1205, assumption A).
  - {id: CO-5343-T1, title: "H7: a $6,000 car and a $3,000 truck, both used for transportation: 6,000 + 3,000 - 6,000 = 3,000", as_of: "2026-10-01", given: {holdings: [{kind: vehicle, value: 6000, amount_owed: 0, used_for_transportation: true}, {kind: vehicle, value: 3000, amount_owed: 0, used_for_transportation: true}]}, expect: 3000}
  - {id: CO-5343-T2, title: "OQ-1205's example: car X worth $9,000 owing $8,000 (equity 1,000) and car Y worth $6,000 owing nothing, both used: 1,000 + 6,000 - 6,000 = 1,000", as_of: "2026-10-01", given: {holdings: [{kind: vehicle, value: 9000, amount_owed: 8000, used_for_transportation: true}, {kind: vehicle, value: 6000, amount_owed: 0, used_for_transportation: true}]}, expect: 1000}
  - {id: CO-5343-T3, title: "A car owing $2,000 more than it is worth (equity floored at 0) and a $4,000 boat not used for transportation: 0 + 4,000 - 0 = 4,000", as_of: "2026-10-01", given: {holdings: [{kind: vehicle, value: 3000, amount_owed: 5000, used_for_transportation: true}, {kind: vehicle, value: 4000, amount_owed: 0, used_for_transportation: false}]}, expect: 4000}
  - {id: CO-5343-T4, title: "A $5,000 camper not used for transportation and a $2,500 car that is: 5,000 + 2,500 - 2,500 = 5,000", as_of: "2026-10-01", given: {holdings: [{kind: vehicle, value: 5000, amount_owed: 0, used_for_transportation: false}, {kind: vehicle, value: 2500, amount_owed: 0, used_for_transportation: true}]}, expect: 5000}
  - {id: CO-5343-T5, title: "Decision 4: a vehicle that does not say whether it is used for transportation - cannot determine", as_of: "2026-10-01", given: {holdings: [{kind: vehicle, value: 8000, amount_owed: 0}]}, expect: unknown}
