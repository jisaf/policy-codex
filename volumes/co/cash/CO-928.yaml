id: CO-928
name: "Colorado Works: is a disqualified or ineligible member"
identifier: cw_is_disqualified_member
kind: derived
type: yes/no
scope: person
program: ColoradoWorks
meaning: "Whether this person is a disqualified or ineligible required assistance-unit member under 9 CCR 2503-6 3.604.2.L-M - serving a Colorado Works intentional program violation disqualification (including a two-state-residence misrepresentation and a fraud determination) or a fugitive or fleeing felon. The current 3.604.2.L and M (amended effective June 1, 2023) no longer list a drug felony conviction."
precision: "Vocabulary fix round (R-6): reads Colorado Works' own IPV disqualification (cw_is_serving_ipv_disqualification, CO-1730) and is_fleeing_felon (CO-038; 3.604.2.L.1, 'Fugitives or fleeing felons'); it had read the SNAP IPV fact and a fact that joined probation and parole violators, whom the current 3.604.2.L-M do not name. Does not model 3.604.2.M.4 (failure to apply for an SSN unless a federally allowable reason under 20 CFR 422.107 exists) - no supplied fact states it - or M.6 (a non-qualified non-citizen), which meets_public_assistance_citizenship_requirement (CO-905) already denies at the person's own status (OQ-143). Phase-10 sweep (OQ-143): M.4 is cw_has_failed_to_apply_for_ssn (CO-2348, false when unstated) and M.6 and L.3 are a member who does not meet meets_public_assistance_citizenship_requirement (CO-905); 3.604.2.M then removes the member from the unit size (cw_assistance_unit_members_for_size, CO-2351), counts the member's income without disregards (cw_countable_income, CO-910) and counts the month toward the member's own sixty (cw_months_of_assistance_used, CO-915)."
derived: [any, cw_is_serving_ipv_disqualification, is_fleeing_felon, [not, meets_public_assistance_citizenship_requirement], [otherwise, cw_has_failed_to_apply_for_ssn, false]]
sources: [S1004, S1019]
implemented: engine
tags: [cash, tanf, household]
rationale: "Phase-8 fix round (S-2): the drug-felony disqualification (snap_is_disqualified_drug_felony, CO-039) is dropped - the Cornell copy (S523, D-61) carried the pre-June 2023 3.604.2.L.2 and M.4, and the current text (S1004, D-81; S1019) has no drug-felony category; the fact stays a SNAP fact. No existing item in this volume states which persons are disqualified or ineligible members for Colorado Works purposes; cw_unit_time_limit_extended (CO-925) needs it for 3.604.2.M's last-sentence bar on granting a time-limit extension to a unit containing a disqualified member (the phase-5 review's C-3(c) finding). Reuses three existing SNAP-chapter supplied facts cross-program rather than restating the same IPV/drug-felony/fleeing-felon categories under new Colorado-Works-prefixed facts, since 3.604.2.M.1-3 and this volume's SNAP disqualification rules read the identical underlying determinations. K-3: does not model 3.604.2.M's other two consequences (removal from the assistance unit for unit-size purposes while still counting undisregarded income, and counting the disqualified member's own month toward their sixty-month maximum) - see OQ-143."
nearest: [CO-038]
open: [OQ-490]
tests:
  - {id: CO-928-T1, as_of: "2026-10-01", given: {cw_is_serving_ipv_disqualification: true, is_fleeing_felon: false}, expect: true}
  - {id: CO-928-T2, as_of: "2026-10-01", given: {cw_is_serving_ipv_disqualification: false, is_fleeing_felon: true}, expect: true}
  - {id: CO-928-T3, as_of: "2026-10-01", given: {meets_public_assistance_citizenship_requirement: true, cw_is_serving_ipv_disqualification: false, is_fleeing_felon: false}, expect: false}
  - {id: CO-928-T4, title: "S-2 - a drug felony conviction alone no longer disqualifies (current 3.604.2.L-M)", as_of: "2026-10-01", given: {meets_public_assistance_citizenship_requirement: true, cw_is_serving_ipv_disqualification: false, is_fleeing_felon: false}, expect: false}
  - {id: CO-928-T5, title: "Vocabulary fix round (R-6): a SNAP IPV is not a Colorado Works disqualification", as_of: "2026-10-01", given: {meets_public_assistance_citizenship_requirement: true, snap_is_serving_ipv_disqualification: true, cw_is_serving_ipv_disqualification: false, is_fleeing_felon: false, is_probation_or_parole_violator: true}, expect: false}
  # Phase-10 sweep (OQ-143): M.6 and M.4.
  - {id: CO-928-T6, title: "An undocumented parent is an ineligible required member (M.6)", as_of: "2026-10-01", given: {cw_is_serving_ipv_disqualification: false, is_fleeing_felon: false, meets_public_assistance_citizenship_requirement: false}, expect: true}
  - {id: CO-928-T7, title: "Failed to apply for an SSN (M.4)", as_of: "2026-10-01", given: {cw_is_serving_ipv_disqualification: false, is_fleeing_felon: false, meets_public_assistance_citizenship_requirement: true, cw_has_failed_to_apply_for_ssn: true}, expect: true}
