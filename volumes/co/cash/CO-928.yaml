id: CO-928
name: "Colorado Works: is a disqualified or ineligible member"
identifier: cw_is_disqualified_member
kind: derived
type: yes/no
scope: person
program: ColoradoWorks
meaning: Whether this person is a disqualified or ineligible required assistance-unit member under 9 CCR 2503-6 3.604.2.M - an intentional program violation (including a two-state-residence misrepresentation and a fraud determination) or a fleeing felon or probation/parole violator. The current 3.604.2.L and M (amended effective June 1, 2023) no longer list a drug felony conviction.
precision: "Reads two shared supplied facts this volume's SNAP chapter already carries (is_disqualified_for_intentional_program_violation, CO-038; is_fleeing_felon_or_probation_violator, CO-041), since 3.604.2.M.1-3's IPV and fleeing-felon categories are the same underlying facts SNAP's own disqualification rules read; the vocabulary review may split them into program-specific facts, which this fix leaves to that round. Does not model 3.604.2.M.4 (failure to apply for an SSN unless a federally allowable reason under 20 CFR 422.107 exists) - no supplied fact states it - or M.6 (a non-qualified non-citizen), which cw_meets_citizenship_requirement (CO-905) already denies at the person's own status (OQ-143)."
derived: [any, is_disqualified_for_intentional_program_violation, is_fleeing_felon_or_probation_violator]
sources: [S1004, S1019]
implemented: engine
tags: [cash, tanf, household]
rationale: "Phase-8 fix round (S-2): the drug-felony disqualification (is_disqualified_drug_felony, CO-039) is dropped - the Cornell copy (S523, D-61) carried the pre-June 2023 3.604.2.L.2 and M.4, and the current text (S1004, D-81; S1019) has no drug-felony category; the fact stays a SNAP fact. No existing item in this volume states which persons are disqualified or ineligible members for Colorado Works purposes; cw_unit_time_limit_extended (CO-925) needs it for 3.604.2.M's last-sentence bar on granting a time-limit extension to a unit containing a disqualified member (the phase-5 review's C-3(c) finding). Reuses three existing SNAP-chapter supplied facts cross-program rather than restating the same IPV/drug-felony/fleeing-felon categories under new Colorado-Works-prefixed facts, since 3.604.2.M.1-3 and this volume's SNAP disqualification rules read the identical underlying determinations. K-3: does not model 3.604.2.M's other two consequences (removal from the assistance unit for unit-size purposes while still counting undisregarded income, and counting the disqualified member's own month toward their sixty-month maximum) - see OQ-143."
nearest: [CO-038]
open: [OQ-143]
tests:
  - {id: CO-928-T1, as_of: "2026-10-01", given: {is_disqualified_for_intentional_program_violation: true, is_fleeing_felon_or_probation_violator: false}, expect: true}
  - {id: CO-928-T2, as_of: "2026-10-01", given: {is_disqualified_for_intentional_program_violation: false, is_fleeing_felon_or_probation_violator: true}, expect: true}
  - {id: CO-928-T3, as_of: "2026-10-01", given: {is_disqualified_for_intentional_program_violation: false, is_fleeing_felon_or_probation_violator: false}, expect: false}
  - {id: CO-928-T4, title: "S-2 - a drug felony conviction alone no longer disqualifies (current 3.604.2.L-M)", as_of: "2026-10-01", given: {is_disqualified_for_intentional_program_violation: false, is_disqualified_drug_felony: true, is_fleeing_felon_or_probation_violator: false}, expect: false}
