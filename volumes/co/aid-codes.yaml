      ineligible_income: "Not eligible: income."
      ineligible_activity: "Not eligible: no eligible activity."
      ineligible_child: "Not eligible: no eligible child."
      ineligible: "Not eligible."

  # ------------------------------------------------------------------- LEAP
  - outcome: leap_is_eligible
    codes:
      "yes": {code: PH-LEAP, label: "LEAP heating assistance household member"}
    no_code:
      "no": "Not eligible this month (including months outside the heating season)."

  # -------------------------------------------------------------- SUN Bucks
  - outcome: sebt_eligibility_status
    codes:
      eligible_categorical: {code: PH-SEBT-CAT, label: "SUN Bucks: categorically eligible"}
      eligible_income: {code: PH-SEBT-INC, label: "SUN Bucks: eligible on income"}
    no_code:
      ineligible: "Not eligible."
