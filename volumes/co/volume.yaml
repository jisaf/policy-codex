volume: colorado
title: Colorado eligibility rules for the programs served by PEAK and CBMS
version: "0.1"
status: Draft. Skeleton only; program chapters are authored one phase at a time from cited sources. Nothing in this volume is approved.
default_as_of: "2026-10-01"

approval_policy:
  roles:
    - Medicaid policy owner
    - CHP+ policy owner
    - SNAP policy owner
    - Cash programs policy owner
    - Energy assistance (LEAP) policy owner
    - Child care policy owner (CDEC)
    - School meals (CDE) co-approver
    - Legal
    - Data steward
    - LTSS policy owner
    - Premium and finance owner
    - Eligibility operations owner
    - State plan coordinator
  # HCPF review S-13: an item any program's declared outcome reads, directly or
  # through other items, also requires that program's by_program roles (so the
  # CHP+ owner signs the shared and Medicaid items CHP+ reads).
  upstream_of_outcomes: true
  by_program:
    All: ["Medicaid policy owner", "CHP+ policy owner", "SNAP policy owner", "Cash programs policy owner"]
    Medicaid: ["Medicaid policy owner"]
    CHP+: ["CHP+ policy owner"]
    SNAP: ["SNAP policy owner"]
    ColoradoWorks: ["Cash programs policy owner"]
    AdultFinancial: ["Cash programs policy owner"]
    CCCAP: ["Child care policy owner (CDEC)"]
    LEAP: ["Energy assistance (LEAP) policy owner"]
    SunBucks: ["SNAP policy owner", "School meals (CDE) co-approver"]
  by_kind:
    supplied: ["Data steward"]
  by_tag:
    legal: [Legal]
    state_election: [Legal, "State plan coordinator"]
    immigration: [Legal]
    ltc: ["LTSS policy owner"]
    hcbs: ["LTSS policy owner"]
    buy_in: ["Premium and finance owner"]
    verification: ["Eligibility operations owner"]

