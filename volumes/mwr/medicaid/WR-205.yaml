id: WR-205
name: "Medicaid: is in stable recovery"
identifier: medicaid_in_stable_recovery
kind: derived
type: yes/no
scope: person
program: Medicaid
meaning: The person has been in recovery from a substance use disorder for 5 or more years as of the Determination Date. A person with no recovery start date is not in stable recovery.
