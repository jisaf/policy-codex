id: WR-226
name: "Medicaid: community engagement status at application"
identifier: medicaid_ce_status_at_application
kind: derived
type: one of
options: ["not yet in effect", "not subject", met, "not met"]
scope: person
program: Medicaid
role: outcome
meaning: Not yet in effect when the Determination Date is before the implementation date; not subject when the person is not an applicable individual; met when community engagement is satisfied at application; otherwise not met.
derived: [case, [["<", [det_date], medicaid_ce_implementation_date], "not yet in effect"], [[not, medicaid_is_applicable_individual], "not subject"], [medicaid_satisfies_ce_at_application, met], [else, "not met"]]
sources: [S8, S9, S11]
implemented: engine
tags: [legal]
tests:
  - {id: WR-226-T1, as_of: "2026-12-15", given: {}, expect: "not yet in effect"}
  - {id: WR-226-T2, given: {medicaid_is_applicable_individual: false}, expect: "not subject"}
  - {id: WR-226-T3, given: {medicaid_is_applicable_individual: true, medicaid_satisfies_ce_at_application: true}, expect: met}
  - {id: WR-226-T4, given: {medicaid_is_applicable_individual: true, medicaid_satisfies_ce_at_application: false}, expect: "not met"}
  - {id: WR-226-T5, given: {medicaid_is_applicable_individual: true}, expect: unknown}
