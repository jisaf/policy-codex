  - {id: WR-206-T2, given: {condition_impairs_ce_compliance: true, is_blind_or_disabled_ssa: false, has_substance_use_disorder: true, recovery_start_date: "2021-01-01", has_disabling_mental_disorder: false, has_adl_impairing_disability: false, has_serious_or_complex_medical_condition: false}, expect: false}
