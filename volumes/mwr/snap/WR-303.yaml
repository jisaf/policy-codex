id: WR-303
name: "SNAP: has responsibility for a dependent child under 6"
identifier: snap_has_responsibility_for_child_under_6
kind: derived
type: yes/no
scope: person-month
program: SNAP
meaning: There is a member of the person's SNAP household who is under 6 at the month and of whom this person is a parent or whom this person cares for.
derived: [exists, snap_household_members, [all, ["<", [of, [P], age_at_month], snap_general_exemption_child_age], [any, [rel, [parent], [P]], [in_group, [P], persons_cared_for]]]]
sources: [S30]
implemented: assembly
open: [OQ-21]
