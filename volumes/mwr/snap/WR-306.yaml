id: WR-306
name: "SNAP: meets the employment exemption"
identifier: snap_meets_employment_exemption
kind: derived
type: yes/no
scope: person-month
program: SNAP
meaning: Weekly average hours worked are at least 30, or weekly earnings are at least the Federal minimum wage times 30.
derived: [any, [">=", snap_weekly_average_hours_worked, snap_employment_exemption_weekly_hours], [">=", snap_weekly_earnings, ["*", federal_minimum_wage, snap_employment_exemption_weekly_hours]]]
sources: [S30]
implemented: engine
tests:
