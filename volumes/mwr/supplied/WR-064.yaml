id: WR-064
name: Traveled outside the community for extended care in month
identifier: traveled_for_extended_care
kind: supplied
type: yes/no
scope: person-month
program: Medicaid
meaning: For part or all of the month the person or their dependent had to travel outside their community for an extended period to receive medical services necessary to treat a serious or complex medical condition that are not available within their community of residence.
supplied_by: Statement with medical verification.
sources: [S10]
