# Household-level cases. Each describes a whole case and the expected value of every outcome for every person.
# These exercise the fact-assembly layer and the determination engine together. Shared by both approaches.
#
# Conventions: dates are quoted ISO strings; per-month facts are under months/<YYYY-MM>; month_defaults gives the
# value of a per-month fact for any month not listed, so that a 36-month SNAP window can be stated without
# 36 entries. Anything not stated is unknown.

