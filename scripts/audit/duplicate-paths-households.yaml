# Hand households for docs/reviews/duplicate-paths-audit.md: npx vite-node scripts/audit/probe.ts -- scripts/audit/duplicate-paths-households.yaml
- id: CW-caretaker-parent-home
  title: child living with a parent; an unrelated adult in the home has primary responsibility for the child
  as_of: "2026-10-01"
  persons:
    p: {facts: {date_of_birth: "1990-01-01", dwelling_id: h1, temporary_absence_reason: none, residence_setting_type: private_home}}
    a: {facts: {date_of_birth: "1986-01-01", dwelling_id: h1, temporary_absence_reason: none, residence_setting_type: private_home}}
    c: {facts: {date_of_birth: "2018-01-01", dwelling_id: h1, temporary_absence_reason: none, residence_setting_type: private_home}}
  relationships:
    - [parent, p, c]
    - [has_primary_responsibility_for, a, c]
  evaluate:
    - {person: a, identifier: cw_caretaker_of}
    - {person: a, identifier: cw_has_dependent_child}
    - {person: a, identifier: cw_is_optional_assistance_unit_member}
    - {person: a, identifier: cw_requires_verification_of_household_composition}
    - {person: c, identifier: cw_assistance_unit_members}
- id: SNAP-unpaid-work
  title: ABAWD meeting the work requirement with unpaid work only
  as_of: "2026-10-01"
  persons:
    p1: {facts: {date_of_birth: "1996-01-01", hours_worked: 0, unpaid_or_in_kind_work_hours: 85, work_program_hours: 0, community_service_hours: 0, snap_abawd_work_hours_missed_for_good_cause: 0, participates_in_workfare: false, snap_is_household_member: true, snap_is_exempt_from_abawd_time_limit: false}}
  evaluate:
    - {person: p1, identifier: snap_meets_abawd_work_requirement}
    - {person: p1, identifier: snap_requires_verification_of_work_hours}
