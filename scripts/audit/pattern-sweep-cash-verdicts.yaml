  - {cls: "*", match: "^(CO-2351|CO-921|CO-910|CO-923|CO-4369|CO-2561|CO-925) .*(cw_is_disqualified_member|cw_is_institution_patient_or_inmate) \\(", verdict: RES-UNDATED}
  - {cls: "*", match: "(county_approved_living_arrangement|cw_is_optional_member_not_requesting|cw_requests_inclusion)", verdict: R-COUNTY}
