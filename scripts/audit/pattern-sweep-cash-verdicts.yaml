  - {cls: "*", match: "^CO-5346 .*receives_oap_c", verdict: F-D6}
  - {cls: "*", match: "^CO-3884 ", verdict: F-D7}
  - {cls: "*", match: "^(CO-2592|CO-3870) .*(af_interview_date|af_is_subsequent)", verdict: F-D8}
  - {cls: "*", match: "^CO-1433 .*(af_determination_is_redetermination|af_redetermination_is_twenty_four_month|af_has_newly_reported_resources)", verdict: F-D9}
  - {cls: "*", match: "^CO-3877 .*declared_disaster", verdict: F-D10}
  - {cls: "*", match: "^(CO-2386|CO-3312) .*(tax_dependent|deceased_spouse_of|\\[\"child\"\\])", verdict: F-D11}
