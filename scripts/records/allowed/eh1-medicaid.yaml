# Earned-income records harness: the differences the resource records' Medicaid H1 track makes, as the earnings harness
# sees them against EARNINGS_BASELINE (the holdings harness loads allowed/h1-*.yaml only, the earnings harness every other
# file but boundary.yaml and joint.yaml). Each entry is a class of allowed/h1-medicaid.yaml, cited there and in
# docs/reviews/records-holdings-medicaid.md (section 4); the generated households here are the earnings harness's (GE-),
# built from the stored bases with their holdings. To be removed with the earnings harness's baseline re-pointed past H1.

# H1-M1 (decision 4): holdings not stated, whether the home is countable cannot be determined (CO-214 p2 states none).
- {case: CO-214, person: p2, identifier: ma_home_is_countable_resource, class: "H1-M1 (decision 4): holdings not stated, whether the home is countable cannot be determined", old: false, new: unknown}

# H1-M2 (design 2.2, 3.1): a stated holdings list with no annuity, trust or home record holds none.
- {case: "/^(CO-\\d+|GE-.*)$/", identifier: "/^(ma_annuity_verification_is_pending|ma_trust_verification_is_pending)$/", class: "H1-M2 (design 2.2): holdings stated with no annuity or trust record, no annuity or trust documents owed", old: unknown, new: false}
- {case: "/^(CO-01|CO-02)$/", person: p5, identifier: ma_home_equity_disqualifies, class: "H1-M2 (design 2.2): holdings stated with no home record, no home equity over the limit", old: unknown, new: false}

# H1-M3 (D8; 8.100.7.L, M.1): the snapshot derived from the couple's holdings at the application month; the old ledger read
# the supplied figure, which no household states any more (the CSRA couples and the LTC and community-spouse earnings bases
# built from CO-112).
- {case: "/^(CO-01|CO-02|CO-06|CO-112|CO-152|CO-153|CO-154|CO-188|CO-213|CO-388|CO-395|CO-481|GE-MALTC-.*|GE-MAcommunityspouse-.*)$/", identifier: "/^(ma_csra|ma_institutionalized_spouse_countable_resources|ma_ssi_countable_resources|ma_msp_countable_resources|ma_meets_ltc_resource_standard|ma_ltc_eligibility_status|ma_patient_payment|ma_family_planning_status|ma_ssi_related_category|ma_msp_category|ma_protected_group_category)$/", class: "H1-M3 (D8): the CSRA from the derived snapshot (the old ledger read the supplied figure, no longer stated)", old: unknown}

# H1-M8 (decision 4; 26 U.S.C. 6409): CO-300's federal refund held has no date of receipt (the Adult Financial track dates it).
- {case: CO-300, person: p1, identifier: ma_ssi_related_category, class: "H1-M8 (decision 4; 6409, F.6.u): a refund or credit held with no date of receipt cannot be placed in its window", new: unknown}

# H1-M9 (8.100.5.N.5): CO-189 p2's 40,000 IRA counted less 20% (32,000), the couple's figure on p2 41,000 to 33,000.
- {case: CO-189, person: p2, identifier: ma_ssi_countable_resources, class: "H1-M9 (N.5.a-b): a retirement account counted at its gross value less the taxes due, or less 20%", old: 41000, new: 33000}
