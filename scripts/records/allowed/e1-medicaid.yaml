# Earned-income records harness: allowed differences of the medicaid E1 track (design 4.3, rule 3).
# Owned by the track; each entry is a cited fix or a product-owner decision, with its class named in
# docs/reviews/records-earnings-medicaid.md: {case, person?, identifier?, month?, class, old?, new?}.

# Not this track: a SNAP figure a stored household's expectation names, changed by the receipts-readers merge
# (bb4b8ee, "unstated receipts are cannot determine", decision 4), which landed after EARNINGS_BASELINE (20004af).
# The integration owner re-points the baseline at the merge wave (design 4.3, rule 5); listed so the track's
# gate measures the track.
- {case: CO-141, person: p3, identifier: snap_sponsor_deemed_income, class: "E1-M0 (baseline drift, not this track): bb4b8ee merged after EARNINGS_BASELINE", old: 0, new: unknown}

# E1-M1 (decision 4 of 2026-11-23): a person whose earnings are not stated has exclusions of earnings that cannot be
# determined; the old readers read each unstated part as none (difficulty_of_care_payments_received otherwise 0,
# decennial_census_wages_received otherwise 0, infrequent_or_irregular_earned_income_received otherwise 0). Only the
# figures change: every reader also reads the person's earned income, which was and is unknown for that person.
- {case: "/^CO-\\d+$/", identifier: ma_excluded_difficulty_of_care_payments, class: "E1-M1 (decision 4): earnings not stated, the Difficulty of Care exclusion cannot be determined", old: 0, new: unknown}
- {case: "/^CO-\\d+$/", identifier: ma_ssi_excluded_earned_income, class: "E1-M1 (decision 4): earnings not stated, the SSI earned income exclusions cannot be determined", old: 0, new: unknown}

# E1-M2 (design 2.2; decision 4: a stated list is the whole statement): a person whose earnings are stated with no
# business record has no self-employment income for MAGI. The generated bases state self_employment_gross_receipts 0
# and leave self_employment_net_earnings_for_tax unstated, so the old MAGI income (CO-502 read the tax figure with no
# default) could not be determined; the records state no business, so CO-5161 is 0 and the MAGI figures and outcomes
# follow. Stored households state the tax figure and are unchanged.
- {case: "/^GE-/", identifier: "/^(ma_person_magi_income|ma_magi_household_income|ma_magi_category|ma_magi_eligibility_status|ma_family_planning_status|chp_eligibility_status|ma_msp_category)$/", class: "E1-M2 (design 2.2, decision 4): earnings with no business, no MAGI self-employment income (the old tax figure was unstated)", old: unknown}

# E1-M3 (OQ-1023, settled; 10 CCR 2505-10 8.100.3.K.3-4, S4107; 20 CFR 416.1110(a)(3), S4342): the SSI method counts pay in
# kind as earned income at its stated value. Before E1 no SSI-method item read in_kind_compensation_value.
- {case: "/^(GE-.*-in_kind_compensation_value_300|CO-341)$/", identifier: "/^(ma_ssi_countable_income|ma_dac_countable_income|ma_wawd_countable_income|ma_ltc_gross_income|ma_patient_payment|ma_community_spouse_income|ma_cbwd_household_earned_income|ma_ssi_ineligible_child_allocation)$/", class: "E1-M3 (OQ-1023 settled, K.3-4): pay in kind is earned income for the SSI method"}

# E1-M4 (OQ-1023, settled; 8.100.3.K.10.c-e, S4107): boarder payments are earned income above the one-person food stamp
# allotment per boarder (meals, room and board) and the documentable costs. Before E1 the SSI method read no room and
# board payments (CO-4161) and counted payments for a room or meals only in full as unearned receipts. A boarder record
# that does not state how many boarders it is for cannot be counted (per boarder; required where read, decision 4):
# CO-171 and CO-320 state room_and_board_payments_received without room_and_board_payers_count.
- {case: "/^(GE-.*-boarders_900_from_two_payers|CO-171|CO-320|CO-354|CO-425)$/", identifier: "/^(ma_ssi_countable_income|ma_dac_countable_income|ma_wawd_countable_income|ma_ltc_gross_income|ma_patient_payment|ma_community_spouse_income|ma_cbwd_household_earned_income|ma_ssi_ineligible_child_allocation)$/", class: "E1-M4 (OQ-1023 settled, K.10.c-e): boarder payments are earned income above the allotment per boarder and the costs"}

# E1-M5 (OQ-1023, settled; 8.100.3.K.8.c, S4107): a dependent child's WIOA program wages are exempt for up to six months a
# calendar year; whether the child is a dependent child (8.100.1, S4341: lives with a parent, guardian, caretaker relative
# or foster parent) cannot be determined where the household states no home (dwelling_id) for the child and the parents.
- {case: "/^GE-.*-wages_1200_of_which_wioa_on_the_job_training_wages_300$/", identifier: ma_ssi_excluded_earned_income, class: "E1-M5 (OQ-1023 settled, K.8.c): a dependent child's WIOA wages exempt six months a year; the child's home not stated", old: 0, new: unknown}

# E1-M6 (duplicate-paths audit D-M2, fixed; 10 CCR 2505-10 8.100.6.J.1.c, S626; 8.100.5.H.3-4, S3405, S3002): the Disabled
# Adult Child countable income is the SSI-related countable income with the current OASDI taken out of the unearned income:
# the Ineligible Child Allocation, the one-third child support reduction and a child's deemed parental income are now in
# it (it copied the SSI formula without them). A figure only: CO-5516's second arm and CO-1161, CO-1162 read it; no
# outcome of a stored or generated household changes. Where the deemed parental income cannot be determined (a person
# whose earnings are not stated, a month with no figures in force) the figure cannot be determined either.
- {case: "/^(CO|GE)-/", identifier: ma_dac_countable_income, class: "E1-M6 (D-M2 fixed): the Disabled Adult Child income is the SSI-related income with the OASDI taken out (allocation, child support, deeming)"}

# E1-M7 (duplicate-paths audit D-M4, fixed; 8.100.5.H.3.a.i, S3405: "each ineligible child in the home"; 20 CFR 416.1167(a)):
# the Ineligible Child Allocation is taken only for a child who lives with the person (lives_with, CO-1925; where the
# household states no homes, a child not residing in a medical institution). CO-04's p5, CO-191's p4 and CO-352's p3 are
# parents who live in another home than the child: no allocation (it was 497); CO-218, CO-406, CO-407 state the homes, so
# the allocation is known (0) where it was not.
- {case: "/^(CO-04|CO-191|CO-218|CO-352|CO-406|CO-407)$/", identifier: ma_ssi_ineligible_child_allocation, class: "E1-M7 (D-M4 fixed): the allocation is for an ineligible child in the home only", new: 0}

# E1-M8 (8.100.3.K.10, S4107: board, room, and room and board payments are self-employment income): payments from boarders
# are verified as self-employment income (ma_self_employment_receipts_for_verification, CO-5164), when the earned-income
# attestation is questionable; before E1 payments for a room or meals only were verified as unearned receipts. Where the
# household does not state whether the earned-income attestation is questionable, the element cannot be determined
# (decision 4); CO-425's verification status, which was unknown on the unearned side, is now determined.
- {case: "/^(CO-206|CO-362|CO-425|GE-.*-boarders_900_from_two_payers)$/", identifier: "/^(ma_earned_income_verification_is_pending|chp_earned_income_verification_is_pending|ma_verification_status)$/", class: "E1-M8 (K.10): boarder payments are verified as self-employment income"}
