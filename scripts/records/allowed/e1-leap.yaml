# Earned-income records harness: allowed differences of the leap E1 track (design 4.3, rule 3).
# Owned by the track; each entry is a cited fix or a product-owner decision, with its class named in
# docs/reviews/records-earnings-care-energy.md: {case, person?, identifier?, month?, class, old?, new?}.

# L-F1 (a figure redefined, no answer): leap_wages_in_income_verification_period (CO-3912) was the thirty-day wages, or the month's
# wages less work-study when the thirty days were not stated, read by leap_person_wages only for a job that began or ended. It is now
# what 3.752.22.C.3 reads, the pay received in the period from a job that began in it or ended on or before the application date,
# by the records' dates; for ongoing pay it is 0 and leap_person_wages reads CO-5120 and CO-5121 instead. Every difference is the
# figure going to 0; leap_person_wages and the outcomes are compared beside it.
- {case: "/.*/", identifier: leap_wages_in_income_verification_period, class: "L-F1 the period's wages are only a new or ended job's (3.752.22.C.3)", new: 0}

# L-F2 (a figure moved, no answer): a PASS set-aside of earned income (3.752.23.DD) is taken off the pay it is part of, in
# leap_person_wages, instead of off wages and self-employment together in leap_household_income; the household figure is unchanged.
# CO-210 (coverage review 2 N-2): $4,000 of wages, $500 set aside: leap_person_wages 3,500, leap_household_income 3,500 on both ledgers.
- {case: CO-210, person: p1, identifier: leap_person_wages, class: "L-F2 a PASS set-aside is taken off its own pay (3.752.23.DD)", old: 4000, new: 3500}
- {case: GE-LEAP-PASS_100_of_wages_1200, person: p1, identifier: leap_person_wages, class: "L-F2 a PASS set-aside is taken off its own pay (3.752.23.DD)", old: 1200, new: 1100}

# E1-L2 (fixed): payments from boarders. 9 CCR 2503-7 3.752.21 (S4100) counts "payments from any other source, which is considered
# to be a gain or benefit to the applicant or recipient"; 3.752.23 excludes none of a boarder's payments. LEAP counted a payment for
# a room only or meals only (the receipt rows, counted because no rule excludes them) and did not read one for room and board
# (room_and_board_payments_received). The records state all three as boarder_payments, counted once (leap_boarder_payments, CO-5124).
# GE-LEAP boarders: $900 of room and board: 1,600 + 900 = 2,500.
- {case: GE-LEAP-boarders_900_from_two_payers, person: p1, identifier: leap_household_income, class: "E1-L2 LEAP counts room and board from boarders (3.752.21)", old: 1600, new: 2500}
# CO-425 (probe C3-7; finding E0-F1): the household states its $600 of room and board twice, as room_and_board_payments_received and
# as an other_taxable receipt. LEAP read the receipt only (600); it now reads both (1,200) until the SNAP track restates the household
# without the other_taxable receipt (scripts/records/allowed/boundary.yaml), after which it reads 600 once. Its one expectation
# (SNAP earned-income verification) does not turn on it.
- {case: CO-425, identifier: leap_household_income, class: "E1-L2 LEAP counts room and board from boarders (3.752.21); CO-425 states it twice until restated (E0-F1)", old: 600, new: 1200}

# E1-L3 (the records state it): CO-194 (coverage pass 2 C2-1) states weekly pay of $250 and a $20 odd job in February 2027, beside it.
# LEAP converted the one pay schedule (4 x 250 = 1,000) and so never read the odd job; 3.752.22.B counts "the countable gross income"
# of the weeks and no paragraph of 3.752.23 excludes irregular earnings, so with each pay a record of its own the $20 is counted in its
# month (OQ-1160): 1,020.
- {case: CO-194, identifier: "/^leap_(person_wages|household_income)$/", month: "2027-02", class: "E1-L3 an odd job beside a converted pay schedule is counted (3.752.22.B)", old: 1000, new: 1020}

# D4-E (decision 4 of 2026-11-23): a person whose earnings are not stated may receive payments from boarders, which LEAP counts as
# unearned income (E1-L2), so the person's unearned income, and whether it waits on verification, cannot be determined; the stated
# receipts alone no longer settle it. CO-94's sponsored children state no earnings; the household's LEAP income and verification
# status were already cannot determine (another member's wages are not stated), so no outcome changes.
- {case: CO-94, identifier: leap_unearned_income_verification_is_pending, class: "D4-E earnings not stated: unearned income (boarders) cannot be determined", old: false, new: unknown}
# E1-L2, its verification: CO-320 and CO-354 state $1,500 of room and board, which LEAP now counts as unearned income; 3.755.11
# requires income to be verified, and neither household states whether the unearned-income verification came in, so the pending
# flag cannot be determined. Their LEAP household income was already cannot determine on both ledgers.
- {case: "/^CO-(320|354)$/", identifier: leap_unearned_income_verification_is_pending, class: "E1-L2 LEAP counts room and board from boarders (3.752.21); its verification is not stated", old: false, new: unknown}

