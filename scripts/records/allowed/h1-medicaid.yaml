# Resource records harness: allowed differences of the medicaid H1 track (design 4.3, rule 3).
# Owned by the track; each entry is a cited fix or a product-owner decision, with its class named in
# docs/reviews/records-holdings-medicaid.md: {case, person?, identifier?, month?, class, old?, new?}.

# H1-M1 (decision 4 of 2026-11-23: missing information is "cannot determine"): a person who states no holdings
# (no resource fact, so no holdings list) has a home whose countability cannot be determined; the scalar readers
# read home_equity not stated as no home (otherwise 0). Figures only: the person's countable resources were and
# are unknown (liquid resources not stated), so no outcome moves.
- {case: "/^(CO-\\d+|GH-.*-liquid_not_stated)$/", identifier: "/^(ma_home_is_countable_resource|ma_home_is_countable_resource_without_beneficiary_deed)$/", class: "H1-M1 (decision 4): holdings not stated, whether the home is countable cannot be determined", old: false, new: unknown}
- {case: "/^(CO-\\d+|GH-.*-liquid_not_stated)$/", identifier: ma_home_equity_counted_only_by_beneficiary_deed, class: "H1-M1 (decision 4): holdings not stated, the beneficiary-deed home cannot be determined", old: 0, new: unknown}

# H1-M2 (design 2.2 and 3.1, decision 4: a stated list is the whole statement): a person whose holdings are stated with
# no annuity, trust or home record holds none, and one with no transfer record made none. The old readers read
# owns_annuity (CO-1579), has_trust_interest (CO-1577), home_equity (CO-826) and uncompensated_transfer_value_in_lookback
# (CO-824), each unknown where not stated (the generated bases remove them; stored households that state holdings
# leave them out). New: ma_holds_annuity_in_month (CO-5330), ma_holds_trust_interest_in_month (CO-5329),
# ma_home_equity_interest_in_month (CO-5327), ma_uncompensated_transfers_in_lookback (CO-5325).
- {case: "/^(CO-\\d+|GH-.*)$/", identifier: "/^(ma_annuity_verification_is_pending|ma_trust_verification_is_pending)$/", class: "H1-M2 (design 2.2): holdings stated with no annuity or trust record, no annuity or trust documents owed", old: unknown, new: false}
- {case: "/^(CO-\\d+|GH-.*)$/", identifier: ma_home_equity_disqualifies, class: "H1-M2 (design 2.2): holdings stated with no home record, no home equity over the limit", old: unknown, new: false}
- {case: "/^GH-MALTCresources-/", identifier: "/^(ma_transfer_penalty_months|ma_transfer_penalty_days)$/", class: "H1-M2 (design 3.1, D9): holdings stated with no transfer record, no penalty (8.100.7.F.2)", old: unknown, new: 0}
- {case: "/^GH-MALTCresources-/", identifier: ma_transfer_penalty_applies, class: "H1-M2 (design 3.1, D9): holdings stated with no transfer record, no penalty period", old: unknown, new: false}
# The H6 variant (one transfer of 3,000 two months before): the old sum added the spouse's look-back total, which the
# variant does not state; the spouse's stated holdings have no transfer record. 3,000 / 10,814.64 (the 2026 divisor,
# CO-832) = 0.2774 month: 0 whole months, ceil(30 x 0.2774) = ceil(8.32) = 9 days (8.100.7.F.2.c.i, F.2.d).
- {case: GH-MALTCresources-one_transfer_of_3000_two_months_before_H6_, person: p1, identifier: ma_transfer_penalty_days, class: "H1-M2 (design 3.1, D9): the spouse's stated holdings have no transfer record; 3,000 / 10,814.64 gives 9 days", old: unknown, new: 9}

# H1-M3 (decision D8; 10 CCR 2505-10 8.100.7.L, M.1, S3419, S652; 8.100.5.M.2.b.vi, S4666): the couple's resources at the
# snapshot are derived from the holdings valued in the application month (ma_spousal_resources_at_snapshot, CO-888, no
# longer supplied). No household states the supplied figure any more (the 24 statements in the twelve couples were
# removed; each was the couple's holdings total but CO-112, CO-188, CO-213 and CO-388 p2, the community spouse, who
# stated 180,000 against a couple total of 60,000, and CO-395, which stated 0 against 1,000), so the old ledger cannot
# read it: unknown before, the derived figure and everything downstream of the CSRA now (every household expectation
# passes: npm run check). The generated LTC base never stated it.
- {case: "/^(CO-\\d+|GH-.*)$/", identifier: ma_spousal_resources_at_snapshot, class: "H1-M3 (D8): the snapshot derived from the couple's holdings at the application month", old: unknown}
- {case: "/^(CO-01|CO-02|CO-06|CO-112|CO-152|CO-153|CO-154|CO-188|CO-213|CO-388|CO-395|CO-481|GH-MALTCresources-.*)$/", identifier: "/^(ma_csra|ma_institutionalized_spouse_countable_resources|ma_ssi_countable_resources|ma_msp_countable_resources|ma_meets_ltc_resource_standard|ma_ltc_eligibility_status|ma_patient_payment|ma_family_planning_status|ma_ssi_related_category|ma_msp_category|ma_protected_group_category)$/", class: "H1-M3 (D8): the CSRA from the derived snapshot (the old ledger read the supplied figure, no longer stated)", old: unknown}

# H1-M4 (decision D6; 10 CCR 2505-10 8.100.5.M.2.k, M.3.j, S3421): the SSI method's figure (ssi_countable_resources_individual,
# CO-800, and the couple's, CO-801) is read through the holdings counting table, whose rows leave an ABLE account out and
# count personal property held as an investment; before, CO-800 counted the ABLE account inside liquid resources and left
# the investment property out, and only Medicaid's own figure (CO-4623) corrected both. Medicaid's figures do not move.
- {case: "/^(CO-422|GH-.*-liquid_2500_of_which_able_account_value_800|GH-.*-investment_jewelry_2000)$/", identifier: "/^(ssi_countable_resources_individual|ssi_countable_resources_couple|af_burial_responsible_person_resources)$/", class: "H1-M4 (D6; M.2.k, M.3.j): the SSI-method figure by the table's rows (ABLE excluded, investment property counted)"}

# H1-M5 (one statement, design 3.1; 10 CCR 2505-10 8.100.5.J.2, S3402): property producing goods for the household's own
# use and non-business income-producing property stated for Adult Financial (home_use_production_property_equity_value,
# CO-4425; nonbusiness_income_producing_property_equity_value, CO-4423) are holdings Medicaid reads: J.2 property
# essential to self-support, excluded up to 6,000 (7,000 - 6,000 = 1,000). Before, no Medicaid item read either fact.
- {case: "/^GH-.*-(non_business_rental_7000_net_300|home_use_production_land_7000)$/", identifier: "/^(ma_ssi_countable_resources_individual|ma_ssi_countable_resources|ma_msp_countable_resources|ma_institutionalized_spouse_countable_resources|ma_ssi_parental_resources_deemed|ma_countable_income_producing_property_value)$/", class: "H1-M5 (J.2, one statement): self-support property stated for Adult Financial is Medicaid's J.2 property"}

# H1-M6 (decision 4; 10 CCR 2505-10 8.100.5.F.6.c, S3404): a retroactive SSI or Social Security payment held whose date of
# receipt is not stated (retroactive_ssa_benefits_held_value, CO-4414, Adult Financial's fact, restated as a
# held_retroactive_ssa_benefit record with no source_date) cannot be placed in the nine months following receipt, so the
# SSI method's figures and the outcomes that read them cannot be determined. Before, the SSI method read only its own
# fact (CO-4639, with its date), not stated, and counted the payment inside liquid resources.
- {case: "/^GH-.*-liquid_2500_of_which_retroactive_ssa_benefits_held_value_800$/", identifier: "/^(ssi_countable_resources_individual|ssi_countable_resources_couple|af_burial_responsible_person_resources|ma_ssi_countable_resources_individual|ma_ssi_countable_resources|ma_msp_countable_resources|ma_institutionalized_spouse_countable_resources|ma_ssi_parental_resources_deemed|ma_ssi_related_category|ma_msp_category|ma_protected_group_category|ma_family_planning_status)$/", class: "H1-M6 (decision 4; F.6.c): a retroactive payment held with no date of receipt cannot be placed in the nine months", new: unknown}
