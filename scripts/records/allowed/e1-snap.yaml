# Earned-income records harness: allowed differences of the snap E1 track (design 4.3, rule 3).
# Owned by the track; each entry is a cited fix or a product-owner decision, with its class named in
# docs/reviews/records-earnings-snap.md: {case, person?, identifier?, month?, class, old?, new?}.

# ---------------------------------------------------------------------------------------------------
# (Records E1 integration: the entry for the receipts readers' decision-4 round merged after 20004af is removed;
# EARNINGS_BASELINE is the E1 wave's baseline, 9650b0c, which includes it. docs/reviews/records-earnings-e1-integration.md.)
# ---------------------------------------------------------------------------------------------------
# SE-D4-1, decision 4 of 2026-11-23 and design decision D3: SNAP reads the business's own records, whose
# annual_support is required where read (CO-5100: no rule text gives it a value; 10 CCR 2506-1 4.403.12.A-B,
# S3114, average annual support over twelve months and part-year support over the period it covers). Before,
# snap_self_employment_is_averaged (CO-4329) read self_employment_is_annual_support as no when not stated. A
# person whose business record does not say is cannot determine for SNAP's self-employment income and what
# it reaches. Stored: CO-136, CO-182, CO-322, CO-382, CO-383, CO-387 (CCCAP and MAGI probes; none expects a
# SNAP figure); generated: the business and farm variants of the SNAP base.
- case: /^(CO-136|CO-182|CO-322|CO-382|CO-383|CO-387)$/
  person: p1
  identifier: /^snap_(self_employment_income|person_earned_income|abawd_time_limit_status|work_hours_verification_is_pending)$/
  new: unknown
  class: "SE-D4-1 a business that does not state whether it is the household's annual support is cannot determine (decision 4, D3; 4.403.12.A-B)"
- case: /^GE-SNAP-(business_1500.*|farm_1500_operating_400)$/
  new: unknown
  class: "SE-D4-1 a business that does not state whether it is the household's annual support is cannot determine (decision 4, D3; 4.403.12.A-B)"

# ---------------------------------------------------------------------------------------------------
# EU-D4-1, decision 4 of 2026-11-23: a person who states no earned income at all states no earnings list,
# which is unknown. Three SNAP figures read such a person's earned facts with a reader default before step E1:
# the excluded earnings (CO-2338: each part `otherwise 0`), the business costs (CO-1701: each cost `otherwise 0`), the farm loss (CO-3722: not farming unless
# self_employment_is_farming said so) and the boarder income (CO-4165: `otherwise 0`). They now read the list
# and are cannot determine. Each such person's earned income (snap_person_wages read wages_gross, which was
# not stated) was already cannot determine on the baseline, so no outcome changes. Checked: each of the 38
# persons in these households (in CO-447 p2 and p3, never p1, whose class is E1-R1 below) states no earnings.
- case: /^(CO-13|CO-94|CO-95|CO-141|CO-175|CO-176|CO-177|CO-178|CO-209|CO-210|CO-211|CO-214|CO-224|CO-225|CO-367|CO-368|CO-369|CO-370|CO-371|CO-372|CO-373|CO-374|CO-438|CO-439|CO-440|CO-441|CO-442|CO-447|CO-448|CO-449|CO-450|CO-458|CO-459|GE-SNAP-wages_not_stated|GE-SNAPfarm-wages_not_stated)$/
  identifier: /^snap_(excluded_earned_income|farm_self_employment_loss|boarder_income|self_employment_costs)$/
  old: 0
  new: unknown
  class: "EU-D4-1 earnings not stated: the excluded earnings, farm loss and boarder income read as 0 before are cannot determine; the person's earned income already was (decision 4)"

# ---------------------------------------------------------------------------------------------------
# E1-1 (cited fix): one SCSEP pay is stated for LEAP as scsep_wages and for SNAP as scsep_payments_received
# (both "part of wages_gross"); SNAP's exclusion read only the second, so SCSEP pay stated as scsep_wages
# was counted as wages. The translator writes one record of kind scsep_employment (the larger of the two),
# which snap_earnings_treatment_table excludes: 10 CCR 2506-1 4.405.2.A.9 (S3109), "Funds received by
# persons fifty-five (55) years of age and older under the Senior Community Service Employment Program
# under Title V of the Older Americans Act are excluded from income". Generated: wages 1,200 of which
# SCSEP 300: excluded 0 -> 300, earned income 1,200 -> 900, and what follows from it.
- case: /^GE-SNAP(farm)?-wages_1200_of_which_scsep_wages_300$/
  class: "E1-1 SCSEP pay stated as scsep_wages is excluded (4.405.2.A.9): SNAP read only scsep_payments_received"

# ---------------------------------------------------------------------------------------------------
# E1-R1 (the figure's meaning, no answer changes): a farm's costs are the farm's own figure, snap_farm_costs
# (CO-5116; cost records marked farm), read against the farm's receipts (snap_farm_gross_receipts, CO-5115);
# snap_self_employment_costs (CO-1701) is now the costs of a business other than a farm. A farmer's
# snap_self_employment_costs is 0 where it held the farm's costs; snap_self_employment_income and the farm loss
# are unchanged (no difference shows for them). Stored: CO-447 p1; generated: the farm variants.
- case: /^(CO-447|GE-SNAP-farm_1500_operating_400|GE-SNAPfarm-.*)$/
  person: p1
  identifier: snap_self_employment_costs
  new: 0
  class: "E1-R1 a farm's costs are snap_farm_costs; snap_self_employment_costs is the other business's"

# ---------------------------------------------------------------------------------------------------
# E1-2 (cited fix, OQ-1021 resolved): wages an employer diverts to a third party for a household expense are
# income: 10 CCR 2506-1 4.405.H.4 (S4300), "Wages earned by a household member that are garnished or diverted by
# an employer and paid to a third party for a household's expenses, such as rent, shall be considered as income";
# H.2 and 7 CFR 273.9(c)(1)(vii)(B) (S4101). No SNAP item read employer_vendor_payments_received (CO-4455), so
# none of it was counted (finding E0-F2). Generated: the vendor-payment variant of each SNAP base: the $300 is
# pay and earned income, and what follows (gross and net income, allotment; on the farm base the earned income
# now counted asks for its verification, which the household does not state).
- case: /^GE-SNAP(farm)?-employer_vendor_payments_received_300$/
  class: "E1-2 wages an employer diverts to a third party for a household expense are counted (4.405.H.4; OQ-1021)"
