# ---------------------------------------------------------------------------------------------------
# H1A-D4-2, decision 4: the home is exempt while it is the client's principal place of residence or the client
# intends to return to it (9 CCR 2503-5 3.520.77.C, S3218); the home record's lives_in and intends_to_return are
# required where read (CO-5300). Before step H1 the item read the person's residence setting and an intent not
# stated as an intent to return (coverage review P2-5), so a home was never counted unless no intent was stated
# for a client in a facility. Each household named states a home with no lives_in (the couples' homes stated on
# each spouse, which the Medicaid H1 track restates as one joint home); the person's resources other than life
# insurance, and the couple's, are cannot determine. No outcome changes: where the parts known already exceed
# the limit, af_meets_resource_limit (CO-948) answers no as before (af_resources_known_lower_bound, CO-5350);
# CO-395's couple (1,000 known) is cannot determine for the limit, and its Adult Financial outcomes were already.
- case: /^(CO-01|CO-02|CO-06|CO-112|CO-114|CO-152|CO-153|CO-154|CO-188|CO-213|CO-388|CO-395|CO-481)$/
  identifier: /^af_(person_countable_resources_other_than_life_insurance|client_and_spouse_countable_resources|meets_resource_limit)$/
  new: unknown
  class: "H1A-D4-2 a home that does not say whether the client lives in it or intends to return (3.520.77.C; decision 4)"

# ---------------------------------------------------------------------------------------------------
# H1A-D4-3, decision 4: a refund is exempt until twelve months after it was received (3.520.77.K, S3206) and a
# retroactive SSI or Social Security payment through the ninth month after the month received (J): Adult Financial
# reads the record's source_date. The facts CO-4172, CO-4413 and CO-4414 said only that the money came within the
# window, so the translator writes no date and the figures and outcomes are cannot determine (before: exempt in
# full). Stored households and tests that hold such money are dated (CO-300; CO-4412-T1, T2, T6).
# The same for personal property held as an investment (finding H0-F2 fixed, 3.520.77.B, S4507): it is counted at
# its appraised value less liabilities (3.520.742.A.3, B, S4692), and the variant states no amount owed; stated,
# it counts (rule tests CO-5345-T1, T2; CO-4000-T21: 2,800, over the $2,000 limit). The same for a burial space
# beyond the family's needs, counted at its value less what is owed on it (3.520.72.B.9, 3.520.742.A.3); the
# variant states no amount owed (rule tests CO-5344-T3: 1,200 with nothing owed).
- case: /^(GH-AFclientresources-investment_jewelry_2000|GH-AFspouseresources-investment_jewelry_2000|GH-AFclientresources-burial_spaces_beyond_the_family_800|GH-AFspouseresources-burial_spaces_beyond_the_family_800|GH-AFclientresources-liquid_2500_of_which_state_tax_refunds_held_value_800|GH-AFspouseresources-liquid_2500_of_which_state_tax_refunds_held_value_800|GH-AFclientresources-liquid_2500_of_which_federal_tax_refunds_held_value_800|GH-AFspouseresources-liquid_2500_of_which_federal_tax_refunds_held_value_800|GH-AFclientresources-liquid_2500_of_which_retroactive_ssa_benefits_held_value_800|GH-AFspouseresources-liquid_2500_of_which_retroactive_ssa_benefits_held_value_800)$/
  identifier: /^af_(exempt_liquid_resources|person_countable_resources_other_than_life_insurance|client_and_spouse_countable_resources|meets_resource_limit|category|oap_grant|and_grant)$/
  new: unknown
  class: "H1A-D4-3 a held refund or retroactive payment with no date of receipt, or investment property or a burial space with no amount owed: cannot determine (decision 4)"

# ---------------------------------------------------------------------------------------------------
# H1A-1 (cited fix): one retroactive SSI or Social Security payment was stated twice, for the SSI method
# (retroactive_benefit_payment_unspent_value, CO-4639, with its date) and for Adult Financial (CO-4414); Adult
# Financial read only the second, so a payment stated for the SSI method was counted. It is one record now, and
# 3.520.77.J (S3206) exempts it "for nine months following the month they are received": received four months
# before, 800 of 2,500 exempt (2,500 -> 1,700). Generated: the variant stating the SSI-method fact.
- case: /^(GH-AFclientresources-retroactive_SSI_800_of_liquid_2500_received_four_months_before|GH-AFspouseresources-retroactive_SSI_800_of_liquid_2500_received_four_months_before)$/
  identifier: /^af_(exempt_liquid_resources|person_countable_resources_other_than_life_insurance|client_and_spouse_countable_resources)$/
  class: "H1A-1 a retroactive SSI payment stated for the SSI method is exempt for Adult Financial too (3.520.77.J)"

# ---------------------------------------------------------------------------------------------------
# H1A-2 (the rule's reading): 3.520.77.L (S3206) exempts "Monies from a bona fide loan ... in the month received":
# money from the loan still held, which the holdings state as held_loan_proceeds. Before step H1 the item exempted
# the month's loan receipt (receipts, kind loan) from liquid_resources_value, whether or not the money was still
# held. CO-485 states a $600 loan received in November and $1,200 in one account, with no part of it traced as
# the loan's: 1,200 counted (was 600). No Adult Financial outcome of CO-485 changes (a Medicaid long-term care case).
- case: CO-485
  person: p1
  identifier: /^af_(exempt_liquid_resources|person_countable_resources_other_than_life_insurance|client_and_spouse_countable_resources)$/
  class: "H1A-2 the loan exempt is the loan money still held (held_loan_proceeds), not the month's loan receipt (3.520.77.L)"

# ---------------------------------------------------------------------------------------------------
# H1A-3 (the statement's meaning): CO-434 stated its June 10 transfer in facts with no month, which a person-month
# fact reads as every month, so October was read as a month with a $5,000 transfer (4 months). The transfer is
# one record with its disposed_date and is read in June only (3.520.76.D.5: the period begins the month after the
# transfer); af_is_in_twfc_penalty_period and the household's expectation (af_category none in October) are
# unchanged.
- case: CO-434
  person: p1
  identifier: /^af_twfc_(transfer_is_counted|penalty_months)$/
  class: "H1A-3 a transfer is read in the month of its disposed_date only (3.520.76.D.5)"

# ---------------------------------------------------------------------------------------------------
# H1A-R (restated): CO-300 (probe PR-PTC) states its savings in the holdings records alone, the refund dated
# 2026-08-14 (3.520.77.K's twelve months); liquid_resources_value and federal_tax_refunds_held_value are no
# longer stated, so the ledger before step H1, which reads them, cannot determine it. Its expectations (1,700,
# oap) are the review's and hold on the ledger on disk.
- case: CO-300
  person: p1
  identifier: /^af_/
  old: unknown
  class: "H1A-R restated in holdings alone (the refund dated): the ledger before H1 does not read it"
