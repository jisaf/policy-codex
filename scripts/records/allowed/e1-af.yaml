# Earned-income records harness: allowed differences of the af E1 track (design 4.3, rule 3).
# Owned by the track; each entry is a cited fix or a product-owner decision, with its class named in
# docs/reviews/records-earnings-cash.md: {case, person?, identifier?, month?, class, old?, new?}.

# (Records E1 integration: the entry for the receipts readers' decision-4 round merged after 20004af is removed;
# EARNINGS_BASELINE is the E1 wave's baseline, 9650b0c, which includes it. docs/reviews/records-earnings-e1-integration.md.)
# AF-1: board, room, and room and board payments are Adult Financial earned income in the month received, less the
# documentable expenses of providing them (9 CCR 2503-5 3.520.783.C.2.b-d, S4380). Before, Adult Financial read no room and
# board payment and counted a payment for a room or for meals only as unearned income (af_receipt_treatment_table, counted
# because no rule excludes it). Now af_boarder_income (CO-5131) adds them to af_gross_earned_income, so the earned income
# disregards apply ($65 and one half); e.g. CO-206 p1, a $400 room-only payment with no costs, read under the AND-SO
# disregards (no rollover of the unused $20, 3.544, S2611): countable income 400 - 20 = 380 before, (400 - 65) / 2 = 167.5
# now; the generated client with $900 from two boarders: countable 590 to 1,007.5 and the OAP grant 442 to 189. Self-employment
# income is verified (3.520.5.A, 3.520.783.E), so a household that states no self-employment verification facts cannot
# determine its earned-income verification; a spouse's deemed income now passes the 3.534.C exemption test's limit, so
# its deductions (3.534.B: court-ordered support) are read, and a household that does not state them cannot determine.
- case: /^(CO-171|CO-206|CO-320|CO-354|CO-362|CO-425)$/
  identifier: /^af_(gross_earned_income|countable_income|earned_income_is_unverified|earned_income_verification_is_pending)$/
  class: AF-1 boarder payments are earned income less provision costs (3.520.783.C.2.b-d)
- case: /^GE-[A-Za-z0-9+]+-boarders_/
  class: AF-1 boarder payments are earned income less provision costs (3.520.783.C.2.b-d)

# AF-2: a pay's PASS set-aside is exempt (3.520.786.I, S2608: "Income and resources set aside as part of a Plan to Achieve
# Self Support (PASS) approved by the SSA"; 3.520.786: "Certain earned and unearned income ... is exempt"). Before,
# Adult Financial did not read pass_set_aside_earned_income, so a PASS of wages was counted. CO-210 p1: $4,000 of wages,
# $500 set aside: gross earned income 4,000 to 3,500.
- case: CO-210
  person: p1
  identifier: /^af_(excluded_earned_income|gross_earned_income)$/
  class: AF-2 a PASS set-aside of earnings is exempt (3.520.786.I)
- case: /^GE-[A-Za-z0-9+]+-PASS_/
  class: AF-2 a PASS set-aside of earnings is exempt (3.520.786.I)

# AF-3 (a figure only): work-study is exempt by its kind (3.520.786.H; af_earnings_treatment_table: excluded), so it is
# never counted and no longer subtracted by af_excluded_earned_income; gross earned income is unchanged.
- case: /^GE-[A-Za-z0-9+]+-wages_1200_of_which_work_study_earnings_300$/
  identifier: af_excluded_earned_income
  old: 300
  new: 0
  class: AF-3 work-study is excluded by the counting table, not subtracted (figure only)

# AF-4 (a figure only): a farm's costs are read with the farm's receipts over the prior year (3.520.783.C.1;
# af_self_employment_net_profit), not in af_self_employment_business_costs, which is now the other business's costs; the
# net profit is unchanged.
- case: /^(CO-447|GE-[A-Za-z0-9+]+-farm_1500_operating_400)$/
  identifier: af_self_employment_business_costs
  new: 0
  class: AF-4 a farm's costs are read apart from another business's (figure only)

# AF-5: in-kind pay is earned income Adult Financial counts (3.520.782.B) and so verifies (3.520.5.A, S880); before,
# af_earned_income_is_unverified read wages_gross only. A generated household that states no verification document
# for its in-kind pay cannot determine whether it is verified.
- case: /^GE-[A-Za-z0-9+]+-in_kind_compensation_value_300$/
  identifier: /^af_earned_income_(is_unverified|verification_is_pending)$/
  old: false
  new: unknown
  class: AF-5 in-kind pay is earned income to verify (3.520.782.B, 3.520.5.A)

# AF-D4: a person who states no earnings at all (no earned fact, so no earnings list): the business costs and the exempt
# earned income, read before as 0 under each cost fact's or part's `otherwise 0`, are now cannot determine, as the
# person's gross earned income already was on both ledgers (wages_gross not stated); no outcome changes (product-owner
# decision 4 of 2026-11-23: missing information is cannot determine unless the rule says otherwise).
- case: /^(CO-13|CO-94|CO-95|CO-141|CO-175|CO-176|CO-177|CO-178|CO-209|CO-210|CO-211|CO-214|CO-224|CO-225|CO-367|CO-368|CO-369|CO-370|CO-371|CO-372|CO-373|CO-374|CO-438|CO-439|CO-440|CO-441|CO-442|CO-448|CO-449|CO-450|CO-458|CO-459)$/
  identifier: /^af_(excluded_earned_income|self_employment_business_costs)$/
  old: 0
  new: unknown
  class: AF-D4 earnings not stated, the cost and exemption figures are cannot determine as gross earned income was

# AF-D4 (continued): a person who states earnings but no receipts. 3.520.786.O tests infrequent or irregular income,
# earned and unearned together, over the calendar quarter (af_infrequent_income_quarter_total, CO-4011), and each month's
# unearned part is no longer read as 0 when the receipts are not stated (step 4 of this track; decision 4), so the
# exempt infrequent pay, and with it gross earned income, is cannot determine. The generated LEAP households' p2.
- case: /^GE-LEAP-/
  person: p2
  identifier: /^af_(excluded_earned_income|gross_earned_income)$/
  old: 0
  new: unknown
  class: AF-D4 receipts not stated, the infrequent-income quarter and so gross earned income are cannot determine
