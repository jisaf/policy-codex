# Earned-income records harness: allowed differences of the cccap E1 track (design 4.3, rule 3).
# Owned by the track; each entry is a cited fix or a product-owner decision, with its class named in
# docs/reviews/records-earnings-care-energy.md: {case, person?, identifier?, month?, class, old?, new?}.

# R-30 (the restatement E0 left to the CCCAP and LEAP tracks, docs/reviews/earnings-e0.md, section 5): the seven thirty-day
# households state their earner's pays with dates in earnings alone (the thirty-day total CO-3910, the pay schedule CO-3921/3922 and
# the month's wages_gross are no longer stated for her), so the baseline, whose CCCAP and LEAP read those scalar facts, cannot
# determine; CCCAP's thirty days (8 CCR 1403-1 3.111.H.4-5) and LEAP's eight weeks and period (9 CCR 2503-7 3.751.1, 3.752.22.B-C)
# are computed from the dates and give the households' expectations, each hand-computed in tests/cases.yaml. The scalar
# statement cannot stand beside the dated records (the translator rewrites a person's records from her scalar facts; request R-1).
- {case: "/^CO-(125|133|134|135|454|455|456)$/", identifier: "/^(cccap|leap)_/", class: "R-30 thirty-day household restated in dated earnings (3.111.H.4-5; 3.752.22.B-C)", old: unknown}

# D4-C1 (decision 4 of 2026-11-23): cccap_other_countable_receipts (CO-4464) read in-kind pay, an employer's vendor payments and
# room and board as 0 when not stated; it reads the earnings records, and a person whose earnings are not stated has other income
# that cannot be determined. 3.111.I.4, I.5 and I.18 give no reading for income not reported. In CO-94 (the decision-4 round's D4-2
# household) the two sponsored children state no earnings, so their CCCAP household income and its verification follow; their
# eligibility was already cannot determine on both ledgers.
- {case: "/.*/", identifier: cccap_other_countable_receipts, class: "D4-C1 earnings not stated: other countable receipts cannot be determined (decision 4)", old: 0, new: unknown}
- {case: CO-94, identifier: "/^cccap_(household_income|unearned_income_verification_is_pending)$/", class: "D4-C1 earnings not stated: other countable receipts cannot be determined (decision 4)", new: unknown}

# C-F1 (a figure moved, no answer): a lodger's payment for a room only was a receipt (room_only_payment) CCCAP counted under I.18 in
# its recurring receipts; it is a boarder_payments record counted in cccap_other_countable_receipts (CO-4464), and the receipt row
# reads counted_in_earnings, so the household income is unchanged. CO-206 ($400), CO-362 ($600): coverage 3 CW3-1 probes.
- {case: "/^CO-(206|362)$/", person: p1, identifier: cccap_other_countable_receipts, class: "C-F1 room-only payment read as a boarder's earnings record (3.111.I.18)", old: 0}

# E1-C3 (fixed): 8 CCR 1403-1 3.111.J.28 (S2858) excludes "Irregular income in the certification period that totals less than ninety
# dollars ($90) in any calendar quarter ... that which is received too infrequently or irregularly to be reasonably anticipated":
# irregular income, earned and unearned. CCCAP pooled only the irregular receipts; an irregular pay was part of wages_gross and
# counted whole. With each pay a record, an irregular one is left out when the quarter's irregular income is under $90.
# CO-194 (a $20 odd job in February 2027): 1,020 to 1,000. CO-483 (a $30 irregular payment in November 2026): 4,900 to 4,870.
- {case: CO-194, identifier: "/^cccap_(person_earned_income|household_income)$/", month: "2027-02", class: "E1-C3 J.28 excludes irregular earnings under $90 a quarter", old: 1020, new: 1000}
- {case: CO-483, identifier: "/^cccap_(person_earned_income|household_income)$/", month: "2026-11", class: "E1-C3 J.28 excludes irregular earnings under $90 a quarter", old: 4900, new: 4870}
