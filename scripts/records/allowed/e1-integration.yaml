# Earned-income records harness: allowed differences of the E1 integration (design 4.3, rules 1 and 5; owned by the
# integration owner; docs/reviews/records-earnings-e1-integration.md, section 3, names each class with its counts).
# Measured with every track's bases and every program's outcomes (--all-programs) against EARNINGS_BASELINE (9650b0c,
# the E1 wave's baseline). Each entry names its cases, person, figure and both values: no pattern stands for a case,
# person or figure it was not checked on. {case, person, identifier, month?, old, new, class}.

# I-1 (classification b: a household one track restated, which every program now reads). The thirty-day households the
# CCCAP and LEAP track restated in dated earnings alone (R-30 of e1-cccap.yaml; request R-1 of
# docs/reviews/records-earnings-care-energy.md). The baseline ledger reads the scalar wages they no longer state, so it
# cannot determine (old unknown). The new values were checked against the baseline ledger evaluated on each household's
# text before the restatement (9650b0c), every program's outcomes and every track's figures: CO-125, CO-133, CO-134,
# CO-135 and CO-456, which now also state their four November pays (the month's wages_gross of $2,000 before; 4 x 500),
# read the same in every program (AF and CW gross earned income 2,000; SNAP 4.3 x 500 = 2,150, 4.402.A.2; the SSI
# method's community spouse income 2,000 plus CO-125's and CO-135's $600 of unemployment), but for L-F1 and E1-M6, the
# tracks' classes. CO-454 (maternity leave, no pay in November) and CO-455 (no earnings: a stated empty list) read 0
# earned income, as their wages_gross of 0 said; the baseline's SNAP and LEAP read 2,150 and 2,000 for them from a pay
# schedule they stated with no wages (CO-3921, CO-3922), a schedule that anticipated no pay (4.402.A.2; 3.752.22.C).
# Their Medicaid buy-in category is "none" again through ma_has_earned_income (CO-6200, a fix of this integration).
