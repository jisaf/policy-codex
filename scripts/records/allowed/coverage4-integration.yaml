- {"case": "/^(CO\\-311)$/", "person": "p1", "identifier": "ma_ssi_countable_income", "month": "2026-10", "old": 2580, "new": 1080, "class": "coverage pass 4 integration I4-1 (b): non-MAGI N4-4 (20 CFR 416.1123(b)(3), S4755: the expenses of getting a payment are not income; CO-5511, CO-5514) read on the households the cash round restated for CA4-1: CO-311 p2 and CO-313 p1 state their workers' compensation as one workers_compensation receipt of 2,000 with claim_expense 1,500, so the SSI method counts 500: the couple's countable income CO-311 600 + 500 - 20 = 1,080, CO-313 500 + 1,000 - 20 = 1,480, within the couple standard 1,491 (aged; family planning full coverage; the baseline could not determine the category on the other paths it tries when the income test fails); the long-term care gross 500 and the WAwD income 500 - 20 = 480; the MSP category, which a gross income above every MSP limit settled as none, now turns on Medicare Part A entitlement (medicare_part_a_entitled, CO-803) and, if entitled, the Medicaid application date (ma_qmb_is_in_effect, CO-3623), which the probes' story (coverage3-adult-financial QZ-2, QZ-2K) does not state (decision 4; CO-312, QZ-2C with the net 500 stated directly, reads the same)"}
