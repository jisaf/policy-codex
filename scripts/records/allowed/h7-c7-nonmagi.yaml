# Holdings records harness: coverage pass 7, non-MAGI Medicaid fix round (docs/reviews/coverage7-medicaid-nonmagi.md, sections 7 and 9): one entry per
# (person, identifier, month, old value, new value), naming the exact households it covers (anchored alternation of case ids),
# each with the finding and the rule text it rests on. F7-3: a community spouse figure of a person who is not an
# institutionalized spouse with a community spouse in the month (checked on every stored household: ma_ltc_couple false or
# not determined for each value listed), read by no rule; F7-1: the family allowance of a month before July 2026; F7-2: CO-113's
# April 2027 month, whose personal needs allowance is not loaded; F7-6: the generated households that state a LEAP, federally
# excluded or VISTA receipt. The acceptance logic is unchanged.
- {"case":"/^(CO\\-01)$/","person":"p2","identifier":"ma_mmmna","month":"2026-10","old":3909.5,"new":2705,"class":"coverage pass 7 non-MAGI F7-3 (docs/reviews/coverage7-medicaid-nonmagi.md; 10 CCR 2505-10 8.100.7.K.1, S1754: \"A community spouse is defined as the spouse of an institutionalized spouse\"): the community spouse's income, shelter costs and medical needs (CO-2467, CO-2802, CO-3619) are read from the person's spouse who is not in a medical institution in the month (CO-7500), never from the person evaluated; this person is not an institutionalized spouse with a community spouse in the month (ma_ltc_couple false or not determined), so the old value counted the person's own figures and the new one only a spouse's at home (the MMMNA and income allowance follow), a figure no rule reads for this person (the allowance and family allowance are deducted only for an institutionalized spouse in the institution, CO-5200, CO-658); no outcome moves"}
