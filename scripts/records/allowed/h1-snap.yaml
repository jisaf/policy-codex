# ---------------------------------------------------------------------------------------------------
# H1S-D4-2, decision 4: a federal income tax refund is excluded for twelve months from the date of receipt
# (10 CCR 2506-1 4.410.J.17, S2966) and an earned income tax credit for twelve months when received while
# participating, a federal one for the month of receipt and the next (J.12): SNAP reads the record's source_date.
# The old facts (CO-4172, CO-4173) said only that the money came within the twelve months, so the translator
# writes no date and the liquid resources are cannot determine (before: excluded in full whatever the date).
# Generated: the refund and credit variants (800 of 2500, so 1700 counted before). Stored households and tests
# that hold such money are dated (CO-300, CO-343-T6, CO-4176-T1, T3, CO-1740-T3).
- case: /^(GH-SNAPmember-liquid_2500_of_which_federal_tax_refunds_held_value_800|GH-SNAPresources-liquid_2500_of_which_federal_tax_refunds_held_value_800|GH-SNAPmember-liquid_2500_of_which_snap_eitc_held_while_participating_value_800|GH-SNAPresources-liquid_2500_of_which_snap_eitc_held_while_participating_value_800)$/
  identifier: /^snap_(countable_liquid_resources|household_countable_resources|household_liquid_resources)$/
  old: 1700
  new: unknown
  class: "H1S-D4-2 a held refund or credit with no date of receipt: the twelve months of 4.410.J.12, J.17 cannot be applied (decision 4)"

# ---------------------------------------------------------------------------------------------------
# H1S-D4-3, decision 4 and design decision D3: whether real property is for sale (4.410.F.1), a lot for a
# future home (B) or producing income (E.1), and the estimated costs of selling it (F.2, G), are required where
# read (CO-5300); before step H1 a part not stated was read as 0 (not for sale, no lot, no costs). A real
# property record that states them is counted as before (rule tests CO-5310-T1 to T6, CO-5311-T1 to T5,
# CO-074-T1 to T14). Land used only to grow food for the household (home-use production) was not read by SNAP
# and is now real property like any other (CO-074-T13: counted when stated not for sale, no exemption in 4.410);
# the variant states no SNAP field, so it is cannot determine. Generated: every variant stating real property
# over $1,500 (property of $1,500 or less is inaccessible without reading them, as CO-418 is).
