# Coverage pass 4, MAGI Medicaid and CHP+ (docs/reviews/coverage4-medicaid-magi-chp.md, dispositions).
# C4-01 (decision 4 of 2026-11-23): 10 CCR 2505-10 8.100.4.C.1 (S166) counts gross income "pursuant to 26 U.S.C. § 61"
# (S4631), and a savings account distribution is gross income only in part where it is a health savings account, Roth IRA or
# tuition program distribution for its qualified purpose (26 U.S.C. 223(f)(1), 408A(d)(1), 529(c)(3)(B); S4633-S4635); cash
# value taken from an insurance policy only as the income from the contract (8.100.4.C.1.b.vii; 61(a)(9)). MAGI counts both
# kinds at the record's taxable_amount (CO-5000, required where read; ma_magi_receipt_treatment_table, CO-5500). The two
# generated variants state each part with no taxable amount (the old facts did not say), so MAGI's figures, the outcomes they
# reach and the unearned-income verification element of a MAGI applicant cannot be determined. Only these two variants
# state either kind; no stored household does.
- {case: "/^G-[A-Za-z]+-P3_(pension_300_of_which_savings_distribution_300|insurance_cash_value_300_part_of_nontaxable_)$/", identifier: "/^(ma_person_magi_income|ma_magi_household_income|ma_magi_household_income_pct_fpl|ma_magi_category|ma_magi_eligibility_status|ma_family_planning_status|chp_eligibility_status|ma_has_unearned_income_for_verification|ma_requires_verification_of_unearned_income|ma_unearned_income_verification_is_pending|ma_verification_status|chp_verification_status|ma_pending_verification_count|chp_pending_verification_count)$/", new: unknown, class: "C4-01 (decision 4; 26 U.S.C. 61(a), 223(f)(1)): a savings distribution or insurance cash value with no taxable amount stated cannot be counted for MAGI"}
# C4-CPB (CO-387; coverage pass 3 C3-08, formerly a known failure under OQ-810): 10 CCR 2505-3 320.1 (D-66) sets the CHP+
# copayment band by "income, at the time of eligibility determination", and 10 CCR 2505-10 8.100.4.C.4.a (S3356) annualizes
# only for "Applicants who are found financially ineligible based on current or previous monthly household income". CO-387's
# p2 is CHP+ eligible on the month's 4,328 / 1,803.33 = 240.0%: band_d (above 200%); before, the annualized 160.0%: band_c.
# p1, the parent, reads the same family figure.
- {case: CO-387, identifier: chp_copayment_income_band, old: band_c, new: band_d, class: "C4-CPB (2505-3 320.1, 8.100.4.C.4.a): the copayment band of the income CHP+ eligibility was determined on"}
# C4-13: MAGI income is no longer rounded to the whole dollar (10 CCR 2505-10 8.100.4.C-D and 42 CFR 435.603(e) state no
# rounding; docs/conventions.md P41: a value no rule rounds is not rounded). Figures only; no outcome of these households
# moves. CO-182: annualized 11,998 / 12 = 999.83 (was 1,000), 999.83 / 1,330 = 75.18% (was 75.19%). CO-387: annualized
# 34,624 / 12 = 2,885.33, 2,885.33 / 1,803.33 = 160.0% (was 2,885 / 1,803.33 = 159.98%). CO-535: a month's half-dollar
# receipts kept (91,849.50, was 91,850; the household figures follow).
- {case: CO-182, identifier: "/^(ma_annualized_household_income|ma_magi_household_income_pct_fpl)$/", class: "C4-13 (8.100.4.C-D state no rounding): MAGI income not rounded to the dollar"}
- {case: CO-387, identifier: ma_magi_household_income_pct_fpl, class: "C4-13 (8.100.4.C-D state no rounding): MAGI income not rounded to the dollar"}
- {case: CO-535, identifier: "/^(ma_person_magi_income|ma_magi_household_income|ma_magi_household_income_pct_fpl)$/", class: "C4-13 (8.100.4.C-D state no rounding): MAGI income not rounded to the dollar"}
# C4-11 (OQ-970 settled for AmeriCorps): 26 U.S.C. 61(a) (S4631) counts all income "Except as otherwise provided", and
# 42 U.S.C. 12637(d) (S4640) keeps AmeriCorps allowances out of income for need-based programs "other than as provided under
# the Social Security Act", which leaves Medicaid to MAGI (42 U.S.C. 1396a(e)(14)(A), S4630): the MAGI receipt table counts
# americorps (was not_taxable_income). In the three AmeriCorps variants the 300 is now MAGI income (the MAGI figures rise by
# 300 and the unearned-income verification element of a MAGI applicant is asked for). In the MAGI parent base (CO-202) the
# parent's 1,262 + 300 = 1,562 / 1,803.33 = 86.6% is over the Parents and Caretaker Relatives' 68% + 5: ineligible_income
