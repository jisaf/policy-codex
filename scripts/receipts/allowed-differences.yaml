# Resource records, Medicaid track H1 (2026-11-23; docs/reviews/records-holdings-medicaid.md, sections 4 and 6): the SSI
# method's resource readers read the holdings records (CO-5300). Measured against c29d326. Stored households: the classes
# of scripts/records/allowed/h1-medicaid.yaml, each cited there.
# H1-M2 (design 2.2): a stated holdings list with no annuity, trust or home record holds none.
- {case: "/^CO-\\d+$/", identifier: "/^(ma_annuity_verification_is_pending|ma_trust_verification_is_pending)$/", old: unknown, new: false, class: "H1-M2 (design 2.2) holdings stated with no annuity or trust record, no annuity or trust documents owed"}
- {case: "/^(CO-01|CO-02)$/", person: p5, identifier: ma_home_equity_disqualifies, old: unknown, new: false, class: "H1-M2 (design 2.2) holdings stated with no home record, no home equity over the limit"}
# H1-M3 (D8; 10 CCR 2505-10 8.100.7.L, M.1): the CSRA snapshot derived from the couple's holdings at the application month;
# the baseline reads the supplied figure, which the twelve couples no longer state (every expectation passes).
- {case: "/^(CO-01|CO-02|CO-06|CO-112|CO-152|CO-153|CO-154|CO-188|CO-213|CO-388|CO-395|CO-481)$/", identifier: "/^(ma_csra|ma_institutionalized_spouse_countable_resources|ma_ssi_countable_resources|ma_msp_countable_resources|ma_meets_ltc_resource_standard|ma_ltc_eligibility_status|ma_patient_payment|ma_family_planning_status|ma_ssi_related_category|ma_msp_category|ma_protected_group_category)$/", old: unknown, class: "H1-M3 (D8) the CSRA from the derived snapshot (the baseline read the supplied figure, no longer stated)"}
# H1-M1 (decision 4): CO-214 p2 states no holdings; whether the home is countable cannot be determined.
- {case: CO-214, person: p2, identifier: ma_home_is_countable_resource, old: false, new: unknown, class: "H1-M1 (decision 4) holdings not stated, whether the home is countable cannot be determined"}
# H1-M8 (decision 4; 26 U.S.C. 6409): CO-300's federal refund held has no date of receipt (the Adult Financial track dates it).
- {case: CO-300, person: p1, identifier: ma_ssi_related_category, month: "2026-10", old: none, new: unknown, class: "H1-M8 (decision 4; 6409) a refund held with no date of receipt cannot be placed in its twelve months"}
# H1-M9 (8.100.5.N.5): CO-189 p2's 40,000 IRA counted less 20%.
- {case: CO-189, person: p2, identifier: ma_ssi_countable_resources, old: 41000, new: 33000, class: "H1-M9 (N.5.a-b) a retirement account counted at its gross value less the taxes due, or less 20%"}

# H1-M2 on the generated households (holdings translated on the new side, 2026-11-23, as the product owner approved for
# earned income): a stated holdings list with no annuity or trust record states that the person has none (decision 4: an
# empty list is a statement, as for receipts), so Medicaid's annuity and trust verification items, unknown at the baseline
# (no fact said whether an annuity or trust existed), are now false. docs/reviews/records-holdings-medicaid.md.
- {case: "/^G-/", identifier: ma_annuity_verification_is_pending, old: unknown, new: false, class: "H1-M2 (decision 4) a stated holdings list with no annuity record means no annuity to verify"}
- {case: "/^G-/", identifier: ma_trust_verification_is_pending, old: unknown, new: false, class: "H1-M2 (decision 4) a stated holdings list with no trust record means no trust to verify"}

# H1A-R1 (H1 SNAP and Adult Financial; docs/reviews/records-holdings-snap-af.md section 9.1): CO-300 states its held refund
# in holdings alone, dated 2026-08-14, because the translator cannot write a date the old facts lack (decision 4: a held
# refund needs its date of receipt to be placed in its window). The baseline reads the facts it no longer states, so the
# old values are unknown; the new values are the household's expectations (af_category oap, countable resources 1,700).
- {case: CO-300, person: p1, identifier: "/^(ma_ssi_related_category|ma_family_planning_status|af_category|af_oap_grant|af_and_grant|af_client_and_spouse_countable_resources)$/", old: unknown, class: "H1A-R1 CO-300 states its dated refund in holdings alone; the baseline reads facts it no longer states"}

# Holdings H1 integration (docs/reviews/records-holdings-h1-integration.md, I-2): the SSI method reads CO-300's records
# (1,700 counted; the 500 federal refund left out for twelve months from receipt, 26 U.S.C. 6409, CO-6500), and the
# figure is now one of the household's expectations, so this harness compares it; the baseline reads facts it no longer states.
- {case: CO-300, person: p1, identifier: ma_ssi_countable_resources_individual, old: unknown, new: 1700, class: "I-2 (holdings H1 integration) CO-300 restated in holdings alone, its refund dated: the SSI method's resources 1,700; the baseline reads facts it no longer states"}
