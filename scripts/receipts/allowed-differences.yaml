# EI-SP1 to EI-SP4 (classification b): uniformed services special pay is earnings (docs/design-earned-and-resource-records.md
# 2.3 and D2; OQ-1020): the translator copies the receipt into the earnings records, and every program's receipt table reads
# the row from earnings (read_as_earnings, counted_in_earnings, in_earnings), its earnings table deciding it, as the E1 track
# reviews record (docs/reviews/records-earnings-snap.md section 2: pay outside a combat zone, 7 CFR 273.9(b)(1)(i);
# records-earnings-cash.md sections 2 and 3: Adult Financial excludes 37 U.S.C. 310 pay, 3.520.786.K with 20 CFR
# 416.1124(c)(19), Colorado Works counts it as earned income, no paragraph excludes it, 3.605.2.D.1; records-earnings-care-energy.md
# sections 2 and 3: CCCAP counts armed forces pay as wages, 3.111.I.1, LEAP as wages, 3.752.22; Medicaid's twin is EM-R2 above).
# The records harness's own generated households state no special pay, so no records class names these values; the integration
# review, section 8, counted them among the moved receipt kinds. The variant states the pay without combat_zone, which defaults
# to false (CO-5100, D3).
# EI-SP1: the pay leaves unearned income and is earned income: SNAP earned +300, unearned -300; Colorado Works, CCCAP and LEAP
# unearned 300 to 0 (household totals unchanged); CCCAP leaves out a household child's earnings (3.111.J.1), so the CBWD
# base's child p3 no longer adds $300 (household 5,900 to 5,600).
- {case: "/^G-(AFclient|AFsponsordeemed|CWapplicant|MAWAWD|MAaged)-uniformed_services_special_pay_received_300_part_of_nontaxable_$/", person: p1, identifier: cccap_has_countable_unearned_income, month: "2026-10", old: true, new: false, class: "EI-SP1 (design 2.3, D2; OQ-1020) special pay is earnings, read from the earnings records by each program's table, not as unearned income"}
