# ---------------------------------------------------------------------------------------------------
# Receipts harness after the generated households state earnings (2026-11-23; docs/reviews/records-earnings-e1-integration.md,
# the section of that name). The product owner approved, on 2026-11-23, that the generated households' earned facts are also
# translated into earnings records on the new side (a3ffd86), and EM-R1 and E1-G were removed. What remained is classified
# here entry by entry: the generated base (G-<base>-), the variant, the person and the figure, and both values where they
# are one; no entry stands for a base, person or figure it was not checked on. Measured against c29d326.

# EI-DAC (classification b: E1-M6 of scripts/records/allowed/e1-medicaid.yaml, EM-R4 above; duplicate-paths audit D-M2,
# fixed; 10 CCR 2505-10 8.100.6.J.1.c, S626; 8.100.5.H.3-4, S3405): the Disabled Adult Child countable income (CO-1160) is
# the SSI-related countable income with the current OASDI taken out, so the Ineligible Child Allocation and the parental
# income deemed to a child are now in it; on the baseline it left them out. Checked for each of
# the 312 values: the new figure equals ma_ssi_countable_income where the person has no OASDI (310), and is that income less
# the counted OASDI where there is (2: the CBWD child's $300, 2,043.50 - 300 = 1,743.50; with $100 of it under a PASS,
# 1,943.50 - 200 = 1,743.50, which the fix of CO-1160 and CO-6250 in this round makes so; it was 1,643.50). Where the SSI-
# related income cannot be determined (the variant that leaves the other non-taxable income unstated; the CCCAP base's
# child, whose SSI-method income was cannot determine on both ledgers) the figure cannot be determined either. Before the
# generated households stated earnings, EM-R1 hid these: the deemed parental income could not be determined.
- {case: "/^G-SNAP-(P3_lump_sum_3000_of_which_1000_spent_or_designated|lottery_5000|other_nontaxable_not_stated)$/", person: p2, identifier: ma_dac_countable_income, month: "2027-02", old: 0, class: "EI-DAC (E1-M6 of the Medicaid track, D-M2 fixed; EM-R4) the Disabled Adult Child income is the SSI-related income with the current OASDI taken out (8.100.6.J.1.c; 8.100.5.H.3-4)"}
- {case: "/^G-CWapplicant-(P3_lump_sum_3000_of_which_1000_spent_or_designated|lottery_5000|other_nontaxable_not_stated)$/", person: p2, identifier: ma_dac_countable_income, month: "2026-10", old: 0, class: "EI-DAC (E1-M6 of the Medicaid track, D-M2 fixed; EM-R4) the Disabled Adult Child income is the SSI-related income with the current OASDI taken out (8.100.6.J.1.c; 8.100.5.H.3-4)"}
