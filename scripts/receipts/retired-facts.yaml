# Old facts retired by the receipts migration (scripts/receipts/translate.ts, RETIRED), as each
# stored household stated them: case -> person -> fact -> value. Written by npm run receipts:translate;
# read only by the translation. No rule reads these facts.
# Coverage pass 4 (CA4-1, docs/reviews/coverage4-cash.md): CO-311 p2 and CO-313 p1 are restated by hand in receipts
# alone (their workers' compensation as one workers_compensation receipt with its claim_expense, which their old facts
# could not say), so their retired facts are dropped and the stated receipts stand.
# Coverage pass 4 integration (docs/reviews/coverage4-integration.md): CO-133 and CO-456 state their child support on the
# list of the child it is paid for (p3; N4-11, CA4-5), so its retired child_support_received is the child's (600) and the
# mother's 0; the translation writes the receipt the household states.
