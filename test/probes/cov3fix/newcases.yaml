- id: CO-226
  title: 'Single adult at 150% of the poverty guideline: over the Adult limit, limited Family Planning (coverage pass 3 C3-01)'
  # Coverage pass 3 (2026-11-22), promoted from the reviewer's probe RV3-FPH. Determination 2026-11-10; application 2026-11-02.
  # p1, 40, single filer, wages $1,995 a month, no other income; the data source reports the same $1,995.
  # MAGI household 1: 1,995 / (15,960 / 12 = 1,330.00) = 150.0%; less the 5-point disregard 145.0% > 133% (Adults): ineligible_income.
  # Family Planning household 1 + 2 - 1 = 2 (E.3): 1,995 / (21,640 / 12 = 1,803.33) = 110.6%; less the disregard 105.6% <= 260%: in the band.
  # G.8's floor ("greater than 133%") is not tested: the approved state plan page S59 sets no floor (statute_override on CO-1155),
  # so p1, not pregnant and not fully covered, is limited_family_planning (was ineligible_income: 110.6% is not over 133%).
  # Compatibility: the data equals the attestation, compatible at both standards; no earned income documentation.
  as_of: '2026-11-10'
  persons:
    p1:
      facts:
        residence_setting_type: private_dwelling
        is_member_of_federally_recognized_tribe: false
