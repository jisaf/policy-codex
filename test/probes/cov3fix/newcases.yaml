- id: CO-227
  title: Family Planning attestation not reasonably compatible with the data source (coverage pass 3 C3-03)
  # Coverage pass 3 (2026-11-22), promoted from the reviewer's probe RV3-FPRC. Determination 2026-11-10; application 2026-11-02.
  # p1, 40, single filer, attests wages of $3,000 a month; the electronic data source (matched) reports $8,000.
  # MAGI household 1: 3,000 / 1,330.00 = 225.6%, above 133% + 5 (Adults): ineligible_income; at the full-coverage standard the
  # attestation is above it, so compatible there (C.2.a.iii / F-12).
  # Family Planning household 2: attested 3,000 / 1,803.33 = 166.4%, within 260% + 5: limited_family_planning on the attestation.
  # At that standard (C.2.a.ii): data 8,000 / 1,803.33 = 443.6% is above 265%, and above 166.4% x 1.2 = 199.6%: not reasonably
  # compatible (was compatible: only the full-coverage standard was compared). C.2.b: p1 gives a reasonable explanation or
  # documents; ma_requires_verification_of_earned_income true, and the earned income element is pending (no document received).
