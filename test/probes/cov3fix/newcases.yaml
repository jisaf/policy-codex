- id: CO-228
  title: 'Stepfather claims his stepchild of 16, whose legal parent is not in the case: the child''s income below the filing threshold is excluded (coverage pass 3 C3-04)'
  # Coverage pass 3 (2026-11-22), promoted from the reviewer's probe RV3-STEP. Determination 2026-11-10; application 2026-11-02.
  # p1, 46, files and claims his stepchild p2 (16); p2's legal parent is not in the case. p1 earns $2,300; p2 earns $600 and
  # is not required to file. Both MAGI households are p1 and p2 (E.1.a filer; E.1.b claimed dependent): size 2.
  # C.1.f.i excludes the income of a child "included in the household of their natural, adopted, or step parent" unless the child
  # is over the filing threshold: p2's $600 is left out. Household income 2,300 / (21,640 / 12 = 1,803.33) = 127.5%.
  # p1: 127.5% > 68% + 5 (Parent and Caretaker Relative), <= 133% + 5 (Adults): adult, eligible.
  # p2: 127.5% <= 142% (Children): child, eligible; CHP+ ineligible_medicaid_eligible.
  # Before the fix the stepchild's $600 counted: 2,900 / 1,803.33 = 160.8%, p1 ineligible_income and p2 CHP+ eligible_child.
  as_of: '2026-11-10'
  persons:
    p1:
      facts:
