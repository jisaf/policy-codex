  # standard deduction (size 3) 217; 1,500 - 300 - 217 = 983. Shelter: the $1,200 rent billed to p2, an eligible
  # member, counts in full (CO-2300), plus the $616 heating and cooling allowance = 1,816; 1,816 - 491.50 = 1,324.50,
  # capped at the $769 shelter cap (no elderly or disabled member); net 983 - 769 = 214; 808 - 64.20 = 743.80,
  # rounded down to 743 for a full month. October is prorated: 743 x 20 / 31 = 479.35, rounded down to 479, over
  # the $25 minimum (4.207.2.C, 4.207.3.B). November is a full month: 743.
  # Colorado Works: the stepfather does not request assistance, so the unit is [p1, p3] and he is outside it
  # (his own unit is empty); he is in the budgetary unit, and 3.605.1.A.4.a deems 1,500 - 90 - 253 (his own needs,
  # One Caretaker, no children) = 1,157, which is over the 331 need standard for one caretaker and one child.
