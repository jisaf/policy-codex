- id: CO-122
  title: "Final verification review V-2 / final cash review FC-12: a stepfather's undocumented wages are pending for the Colorado Works unit"
  # Built for V-2. p1 Ana, 30, applies for Colorado Works for herself and her son p2, 6, on October 1; her husband p3
  # Luis, 33, the boy's stepfather, has not asked to be in the unit. All are citizens and Colorado residents.
  # Unit (3.604.2.C): Ana and her son; Luis, a stepparent who did not request assistance, is outside it, but as the
  # spouse of the parent he is in the budgetary unit (3.604.2.D, cw_budgetary_unit_members), and his income is
  # deemed (3.605.1.A.4.a): wages 2,000 - the $90 disregard = 1,910, plus no unearned income, less no support paid,
  # less the needs of his own children outside the unit (none: the One Caretaker 0-children need standard, 253)
  # = 1,657. Unit countable income 1,657 >= the need standard 331 (one caretaker, one child): ineligible_income.
  # Verification (3.604.3.B.2.e: "income of any member of the assistance unit or other household member whose income
  # is used"): Ana and her son have provided every document; Luis has given no pay stubs
  # (earned_income_verification_document_received false). His wages are used, so the unit's count is 1 (was 0
  # before the V-2 fix, which summed the assistance unit only), and on October 5, within the eleven days, the
  # status is pending. Luis's own Colorado Works status stays not_applicable (he is in no unit Colorado Works aids).
