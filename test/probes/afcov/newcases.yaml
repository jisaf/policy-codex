- id: CO-168
  title: "Coverage round (Adult Financial F-4): an AND-CS client who entered a nursing facility in mid-September"
  # p1, 30, receives SSI of $500 for a disability and entered a licensed nursing facility on September 15, 2026.
  # Determination on October 1, 2026.
  # AND-CS (3.546-3.549): an SSI recipient under 60, a citizen, $500 of resources; countable income is the gross SSI, 500
  # (3.549.A, 3.548.G) < 994: and_cs.
  # PNA (3.548.D, F, S1010): from October 15 she has been in an approved facility thirty consecutive days, and October is
  # the whole of the month (af_resides_in_care_facility_thirty_consecutive_days true for October). But "The AND-CS grant
  # shall not be reduced until the month following the first full calendar month that the client is a resident":
  # October is the first full calendar month, so the October grant is unreduced, 994 - 500 = 494; from November (entry
  # on or before October 1, the first day of the month before) only the PNA, 79 - 500, nothing. Before the coverage round
  # October paid 0. Probe PR-PNA.
  as_of: "2026-10-01"
  case_facts:
    cw_meets_county_diversion_income_limit: false
  relationships: []
  persons:
    p1:
      relationships: []
      facts:
        residence_setting_type: nursing_facility
        date_of_birth: "1996-03-01"
        immigration_status: us_citizen
        state_of_residence: CO
        is_fleeing_felon: false
        marital_status: single
        receives_ssi: true
        title_ii_benefit_type: none
        is_blind: false
        meets_ssa_disability_criteria: true
        af_has_total_disability_six_months: false
        claims_disability: true
        is_enrolled_in_medical_assistance: true
        liquid_resources_value: 500
        receives_tanf_cash: false
        is_sponsored_non_citizen: false
        child_welfare_payment_type: none
        is_pregnant: false
        institution_entry_date: "2026-09-15"
        residence_setting_is_licensed_or_certified: true
      month_defaults:
        wages_gross: 0
        self_employment_gross_receipts: 0
        social_security_income: 0
        pension_income: 0
        unemployment_income: 0
        tanf_cash_income: 0
        adult_financial_cash_income: 0
        ssi_income: 500
        child_support_received: 0
        other_unearned_income_nontaxable: 0
        other_unearned_income_taxable: 0
        tax_exempt_interest: 0
        shelter_costs_paid_by_others: 0
  expect:
    p1:
      af_category: {"2026-10": and_cs, "2026-11": and_cs}
      af_resides_in_care_facility_thirty_consecutive_days: {"2026-10": true}
      af_and_grant: {"2026-10": 494, "2026-11": 0}

