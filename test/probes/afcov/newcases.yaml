        liquid_resources_value: 500
        receives_tanf_cash: false
        is_sponsored_non_citizen: false
        child_welfare_payment_type: none
        is_pregnant: false
        dwelling_id: d1
      month_defaults:
        wages_gross: 0
        self_employment_gross_receipts: 0
        social_security_income: 600
        pension_income: 0
