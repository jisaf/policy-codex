- id: RV2-L2
  title: 'Coverage round (LEAP): $1,000 of wages and $3,000 of Colorado crime victim compensation; the compensation is not income'
  # Coverage review C-1 (probe RV-L1). 9 CCR 2503-7 3.752.23.G (S3300). One adult applies for LEAP on November 10, 2026,
  # paying a vendor for the primary heating source. Wages $1,000 a month (no pay schedule stated, so the month's wages are the
  # thirty days', CO-3925, CO-3912). Other unearned income of $3,000 is all crime victim compensation.
  # Hand derivation (November 2026):
  #   unearned_income_prior_thirty_days (CO-3913, monthly fallback) = 3,000 (no part has its own fact in CO-3913's list)
  #   leap_excluded_unearned_income (CO-4511) = 3,000 (crime_victim_compensation_received)
  #   leap_person_unearned_income (CO-3926) = max(0, 3,000 - 3,000) + 0 = 0
  #   leap_person_wages (CO-3925) = 1,000; leap_household_income (CO-1002) = 1,000
  #   leap_income_limit_monthly for 1 (CO-875) = 3,774, so leap_income_within_limit is true and leap_is_eligible is true.
  # Before the fix: leap_household_income 4,000 > 3,774, leap_is_eligible false.
  as_of: '2026-11-10'
  case_facts:
    home_heating_cost_arrangement: pays_vendor_directly
    leap_application_date: '2026-11-10'
    has_primary_heating_source: true
  relationships:
  - - other_relative
    - p1
    - p2
  persons:
    p1:
      facts:
        date_of_birth: '1980-01-01'
        immigration_status: us_citizen
        ssn_furnished_or_application_shown: true
        state_of_residence: CO
        residence_setting_type: private_dwelling
        nighttime_residence_type: fixed_regular_adequate
        leap_is_in_another_approved_household: false
        is_emancipated_minor: false
        dwelling_id: d1
      month_defaults:
        wages_gross: 3500
        self_employment_gross_receipts: 0
        self_employment_net_earnings_for_tax: 0
        social_security_income: 0
        pension_income: 0
        unemployment_income: 0
        child_support_received: 0
        tanf_cash_income: 0
        adult_financial_cash_income: 0
        ssi_income: 0
        other_unearned_income_nontaxable: 400
        tanf_supportive_service_payments_received: 400
        other_unearned_income_taxable: 0
        tax_exempt_interest: 0
        lottery_gambling_winnings_received: 0
        lump_sum_received: 0
    p2:
      # A relative who lives elsewhere (another dwelling): stated so p1's relationships are known.
      facts:
        date_of_birth: '1950-01-01'
        dwelling_id: d2
  expect: {}
