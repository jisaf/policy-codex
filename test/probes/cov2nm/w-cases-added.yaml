        # 8.100.7.F.2.c.ii: the later of the month after the transfer (2025-07-01) and the date
        # p1 would otherwise become eligible (2026-11-01, this determination) - see S3.2.
        is_tax_filer: true
        is_required_to_file_tax_return: true
        expected_number_of_children: 0
        dependent_child_has_minimum_essential_coverage: false
        was_enrolled_in_medicaid_at_foster_care_exit: false
        mother_coverage_at_birth: none
        chp_has_other_health_coverage: true
        chp_is_eligible_for_public_agency_state_health_benefits_plan: false
        ma_application_date: "2026-11-02"
      month_defaults:
        lottery_gambling_winnings_received: 0
        social_security_income: 1900
        pension_income: 700
        wages_gross: 0
        self_employment_net_earnings_for_tax: 0
