
- id: CO-212
  title: An aged veteran at home whose VA pension includes Aid and Attendance
  # Coverage pass 2, N2-1 (docs/reviews/coverage2-medicaid-nonmagi.md; scratch Y-VAAA). p1, 76, single, at home;
  # Social Security 400; a VA pension of 900, of which 400 is Aid and Attendance (the VA award letter); savings 1,000;
  # Medicare Part A. Applied 2026-10-05.
  # Hand derivation, October 2026:
  # - 8.100.5.K: the A&A portion "shall not be considered as income when determining eligibility" (F.5.j.vi counts
  #   veterans benefits other than A&A and UME): unearned 400 + 900 - 400 = 900; less the 20 general exclusion: 880.
  # - 880 at or under the individual FBR (994): aged; resources 1,000 at or under 2,000.
  # - QMB: 880 at or under 100% of the poverty level for one (1,330): eligible in October, in effect from November
  #   (the month after the determination): ma_msp_category none in October, qmb in November.
  # New case. Before the fix the A&A portion was counted: 1,280, over the FBR: ma_ssi_related_category none.
  as_of: '2026-10-12'
  relationships: []
  persons:
    p1:
      relationships: []
      facts:
        date_of_birth: '1950-03-01'
        immigration_status: us_citizen
        state_of_residence: CO
        residence_setting_type: private_dwelling
        is_blind: false
        meets_ssa_disability_criteria: false
        receives_ssi: false
        medicare_part_a_entitled: true
        ma_application_date: '2026-10-05'
        liquid_resources_value: 1000
        revocable_burial_trust_value: 0
        marital_status: single
        retirement_accounts_value: 0
        real_property_other_than_home_equity: 0
        vehicles_equity_value: 0
        transportation_vehicle_equity_value: 0
        life_insurance_face_value: 0
        ma_is_incapable_of_indicating_intent: false
        is_emancipated_minor: false
        ma_prior_msp_category: none
        home_equity: 0
        ma_lottery_winnings_hardship_exemption_granted: false
        receives_va_aid_and_attendance: true
        va_aid_and_attendance_amount: 400
      month_defaults:
        social_security_income: 400
        shelter_costs_paid_by_others: 0
        educational_assistance_received: 0
        loan_proceeds_received: 0
        energy_assistance_received: 0
        tax_refunds_and_credits_received: 0
        federally_excluded_payments_received: 0
        wages_gross: 0
        pension_income: 900
        unemployment_income: 0
        other_unearned_income_taxable: 0
        other_unearned_income_nontaxable: 0
        tax_exempt_interest: 0
        child_support_received: 0
        lottery_gambling_winnings_received: 0
        self_employment_gross_receipts: 0
        self_employment_net_earnings_for_tax: 0
  expect:
    p1:
      ma_ssi_countable_income:
        2026-10: 880
      ma_ssi_related_category:
        2026-10: aged
      ma_msp_category:
        2026-10: none
        2026-11: qmb

