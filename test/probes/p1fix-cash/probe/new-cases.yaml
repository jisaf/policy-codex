- id: CO-130
  title: "Final cash review 2, N-1 and N-2: an OAP client whose younger wife owns an old life insurance policy and an unverified retirement account"
  # Built for the second final cash review's N-1 and N-2 probes, which the reviewer confirmed with the engine.
  # p1 Walter, 72, and p2 Rosa, 55, are married and live together; each receives $500 of Social Security and is
  # enrolled in Medicaid. Walter has $1,000 in the bank and every Adult Financial element verified. Rosa has no
  # cash, a $1,500 retirement account with no statement, and a $10,000 whole-life policy bought in March 2010
  # with a cash surrender value of $5,000, no premiums paid in the last 48 months.
  # Countable income (3.533.A.2): 500 less the married client's half of the $20 = 490; nothing deemed from Rosa
  # (3.534.C: on Medicaid, income 500 <= 1,032).
  # Resources (3.520.72.A; 3.520.75.E.1, "For OAP only ... all life insurance policies owned by a client and his or
  # her spouse"): Walter 1,000; Rosa's retirement account 1,500; Rosa's policy, face value over $1,500, all bought
  # more than 48 months ago with nothing paid in: exempt for an OAP client, whoever owns it. 1,000 + 1,500 + 0 =
  # 2,500 <= the $3,000 couple limit. Before N-1 Rosa's policy was read by her own age (55): 7,500, over the limit.
  # Verification (3.520.72.D): Rosa's retirement account is a resource other than cash, not verified; she is not
  # on SSI, and this is an application: one element pending for Walter's case. Requested 2026-10-01, due eleven
  # days later (October 12); October 5 is before it: pending. Before N-2 the count was 0, complete.
  as_of: "2026-10-05"
