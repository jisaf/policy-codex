- id: CO-131
  title: "Final cash review 2, N-4 and N-5: an OAP grandmother who made two small gifts, and her grandson on AND-CS who receives child support"
  # Built for the second final cash review's N-4 and N-5 probes.
  # p1 Lucia, 72, widowed, receives $700 of Social Security and has $500 in the bank. She applied for the Old Age
  # Pension on 2026-10-01. She gave her grandson's father $1,000 on 2026-09-02 and $1,000 more on 2026-10-02 (cash,
  # nothing received, not found to be for another purpose).
  # p2 Mateo, 9, lives with her; he is disabled and receives SSI of $500, and his absent father pays $300 of
  # current child support a month. He has $200 in the bank.
  # Lucia, income (3.533.A.2): 700 - 20 = 680. Resources 500 <= 2,000.
  # Transfers (3.520.76.D.3, E): each gift is divided by the OAP grant standard on its own and rounded down:
  # floor(1,000 / 1,032) = 0 for September and 0 for October, so no period. Before N-5 the total, 2,000, was
  # divided once: floor(2,000 / 1,032) = 1 month beginning the month after the first transfer, October, and
  # October's category was none.
  # Lucia's grant (3.533.B): 1,032 - 680 = 352.
  # Mateo, AND-CS (3.549.A.2): unearned income other than SSI is the support of 300; 20 CFR 416.1124(c)(11),
  # which 3.520.786.K incorporates, excludes one-third of support from an absent parent for a child (416.1856:
  # under 18, not married): 300 / 3 = 100, so 200 counted; less the $20 general disregard = 180; plus SSI 500 =
  # 680. AND-CS standard 994, so the grant is 994 - 680 = 314. Before N-4 all 300 counted: 780, grant 214.
  as_of: "2026-10-05"
  case_facts:
    cw_meets_county_diversion_income_limit: false
  relationships: []
  persons:
    p1:
      relationships: []
      facts:
        residence_setting_type: private_dwelling
        date_of_birth: "1954-04-10"
        immigration_status: us_citizen
        state_of_residence: CO
        is_fleeing_felon: false
        marital_status: widowed
        receives_ssi: false
        title_ii_benefit_type: retirement_or_survivor
        is_blind: false
        meets_ssa_disability_criteria: false
        af_has_total_disability_six_months: false
        claims_disability: false
        is_enrolled_in_medical_assistance: true
        liquid_resources_value: 500
        receives_tanf_cash: false
        is_sponsored_non_citizen: false
        child_welfare_payment_type: none
        is_pregnant: false
        af_application_date: "2026-10-01"
      month_defaults:
        wages_gross: 0
        self_employment_gross_receipts: 0
        social_security_income: 700
        pension_income: 0
        unemployment_income: 0
        tanf_cash_income: 0
        adult_financial_cash_income: 0
        ssi_income: 0
        child_support_received: 0
        other_unearned_income_nontaxable: 0
        other_unearned_income_taxable: 0
        tax_exempt_interest: 0
        shelter_costs_paid_by_others: 0
      months:
