- id: CO-111
  title: Hospital presumptive eligibility, with and without the status declaration
  # Final verification F-2 (docs/reviews/final-medicaid-chp.md; the reviewer's scratch household X-HPE,
  # built from CO-78). Six applicants at a qualified hospital site (10 CCR 2505-10 § 8.100.3.R), November
  # 2026, none enrolled in Medical Assistance and none with presumptive eligibility in the last year.
  # Hand derivation (2026 guideline: 1 person 15,960 / 12 = 1,330; 2 persons 21,640 / 12 = 1,803.33):
  # p1, 45, citizen, alone, declares 1,596 = 120%: adult (R.2.d, at or under 133%).
  # p2, 25, citizen, employed, declares a disability, own income 3,990 = 300%: over 133% for adults,
  #   so employed_disabled (R.2.f, at or under 450%).
  # p3, 22, citizen, pregnant, household of two declaring 3,426 = 190%: pregnant (R.2.a, 195%).
  # p4, 39, undocumented, pregnant, alone, declares 1,197 = 90%: pregnant. R.2.a asks the declaration
  #   of status "unless they meet the exceptions outlined under 8.100.3.G.1.g.viii", read as ix.1
  #   (OQ-56), which every pregnant woman meets. Was none before the fix.
  # p5, 36, undocumented, not pregnant, alone, declares 1,197 = 90%: none; R.2.d has no exception.
  # p6, 8, undocumented, household of two declaring 2,732 = 151.5%: over the 142% child standard, so
  #   not child; no other group reaches a child, so none. (At or under 142% he would be child
  #   without a declaration, CO-2439-T12.)
