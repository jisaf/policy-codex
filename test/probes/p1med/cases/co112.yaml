- id: CO-112
  title: Nursing facility resident with a community spouse who pays Medicare premiums; the patient payment's full deductions
  # Final verification F-3 and F-4 (docs/reviews/final-medicaid-chp.md). Built from CO-06's couple without the
  # transfer: Robert (p1, 74) entered a nursing facility on 2026-10-05; Linda (p2, 69) stays at home. Couple's
  # resources at the snapshot 60,000 (52,500 his, 7,500 hers). Determined 2026-11-01.
  # Hand derivation, November 2026:
  # - p1 gross income 1,900 + 700 = 2,600 (at or under 300% x 994 = 2,982: special income group).
  # - Community spouse's needs (8.100.7.Q): MMMNA standard 150% x 21,640 / 12 = 2,705; shelter 634 + 616
  #   (the heating and cooling allowance) = 1,250, less 30% x 2,705 = 811.50: excess 438.50; 2,705 + 438.50 =
  #   3,143.50, under the 4,066.50 maximum (Q.4). Q.2 adds her documented medical expenses (75) and premiums
  #   (Part B 202.90 and a supplement 150: 352.90) above the cap: 3,143.50 + 427.90 = 3,571.40 (F-4; was 3,143.50).
  # - Monthly income allowance (R.2): 3,571.40 - her income 1,900 = 1,671.40 (was 1,243.50).
  # - Patient payment (8.100.7.V.3.b-c, F-3): 2,600 - 110.36 (personal needs allowance; no earnings, so no
  #   earned income reserve) = 2,489.64; less the allowance 1,671.40, the mandatory tax withheld from his
  #   pension 60, his Part B premium 202.90 (November is his second month in the facility, V.3.b.ii.8.a; the
  #   State does not yet pay it) and his Part D premium 40: 2,489.64 - 1,974.30 = 515.34; plus his long-term
  #   care insurance benefit 300 (V.3.c): 815.34. His own resources: the CSRA (CO-646) covers the couple's 60,000,
  #   so none are attributed to him and he meets the 2,000 standard; eligible_institutional. In December (third month) the Part B premium is no longer
  #   deducted: 2,489.64 - 1,771.40 = 718.24, plus 300 = 1,018.24. His other premiums are not deducted (NF PETI).
  #   Before the fix the payment was 2,600 - (110.36 + 1,243.50 + 242.90, every premium in every month) =
  #   1,003.24 in both months.
