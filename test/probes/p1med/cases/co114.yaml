- id: CO-114
  title: QMB member whose January cost-of-living increase would take her over the limit
  # Final verification F-5 and F-6 (docs/reviews/final-medicaid-chp.md). Linda (p1, 70), single, Medicare
  # Part A, enrolled as a Qualified Medicare Beneficiary through December 2026. Her Social Security rises from
  # 1,320 (paid in December 2026) to 1,358 (paid in January 2027) with the annual cost-of-living adjustment.
  # Resources 3,000. Her renewal is determined 2027-01-20. The volume has no 2027 poverty guidelines yet, so
  # 2027 months read the 2026 table (OQ-515): QMB limit 100% x 15,960 / 12 = 1,330.
  # Hand derivation, January 2027:
  # - Countable income 1,358 - 20 (general exclusion) = 1,338, over 1,330: without the disregard she would
  #   lose QMB (and, at or under 120% = 1,596, be reported SLMB, which is what the volume gave before the fix).
  # - She was a QMB member in December 2026 (ma_prior_msp_category), so 8.100.6.L.12 keeps the COLA
  #   disregarded "until the next year's federal poverty guidelines are published": the publication date in
  #   force on 2027-01-01 is still 2026-01-15 (no 2027 version loaded), earlier than 2027, so January is inside
  #   the disregard (OQ-622). COLA increase 1,358 - 1,320 = 38; 1,338 - 38 = 1,300, at or under 1,330: QMB.
  # - QMB effective date (F-5): she is a continuing member (QMB in the month before the determination month),
  #   so her coverage continues in January without the month-after-determination rule of L.10.
  #   ma_msp_category January 2027: qmb. (A new applicant determined in January would start in February.)
  # - Her resources 3,000 are liquid (an MSP-only renewal), at or under 9,950.
