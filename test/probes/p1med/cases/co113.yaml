- id: CO-113
  title: Single nursing facility resident who works in the facility and keeps her home for a planned return
  # Final verification F-3 (docs/reviews/final-medicaid-chp.md). Ruth (p1, 68), unmarried, no one else at
  # home, entered a nursing facility on 2026-10-05 after a stroke; her physician certifies she is likely to
  # return home within six months. Social Security 1,400; 200 a month from crafts work in the facility
  # (an income-producing activity, V.3.e.v); Part B premium 202.90 still withheld (no Medicare Buy-In yet);
  # her home costs a mortgage, tax and insurance of 800 and 90 of utilities to keep it from freezing.
  # Resources 1,500. Determined 2026-11-01.
  # Hand derivation:
  # - Gross income 1,400 + 200 = 1,600, at or under 2,982: special income group; resources 1,500 at or under
  #   2,000: eligible_institutional.
  # - Income for the patient payment (V.3.d.iii, V.3.f): unearned 1,400 meets the personal needs allowance
  #   (110.36), leaving 1,289.64; the earned income reserve keeps 65 and half of the rest of the 200:
  #   (200 - 65) x 0.5 = 67.50 counts. 1,289.64 + 67.50 = 1,357.14.
  # - Home Maintenance Allowance (V.3.g.ii): no family at home, a physician's certification, and November is
  #   within six months of the October entry: 800 + the lesser of 90 and the standard utility allowance (616)
  #   = 890, under the 2026 maximum 1,672 (4,066.50 / 2,643.75 x 1,995 = 3,068.62, less 1,995, plus 598.50 =
  #   1,672.12, rounded).
  # - November (her second month in the facility): 1,357.14 - 890 - 202.90 (Part B, V.3.b.ii.8.a) = 264.24.
  #   December: the Part B premium is no longer deducted: 1,357.14 - 890 = 467.14. April 2027 (the seventh
  #   month) would end the allowance.
  #   Before the fix the payment was 1,600 - 110.36 - 202.90 = 1,286.74 in every month.
