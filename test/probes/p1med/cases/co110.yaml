- id: CO-110
  title: A mother who applies five weeks after the birth, for herself and the newborn
  # Final verification F-1 (docs/reviews/final-medicaid-chp.md; the reviewer's scratch household X-PP).
  # p1, 30, citizen, delivered p3 on 2026-08-10 (pregnancy dated from 2025-11-05) and applied on
  # 2026-09-15 for herself and the newborn, asking for retroactive coverage of the birth. She earns
  # $2,700 a month; her MAGI household is p1 and p3, size 2 (21,640 / 12 = 1,803.33): 2,700 / 1,803.33
  # = 149.7% of the poverty level in every month, within the Pregnant Women standard (195%) and over
  # the Adults standard (133%). The enrollment record does not yet show the retroactive coverage
  # (public_health_coverage_enrolled none in August).
  # Hand derivation: the retroactive window of a 2026 application is the three months before
  # September: June, July and August (CO-557, CO-2472). She was pregnant in each (pregnancy from
  # 2025-11, ended 2026-08-10; the month of the birth counts, CO-3601), so she meets the Pregnant
  # Women category in June (8.100.4.G.5; 8.100.3.E.2: she need not be eligible in the application
  # month). Her pay stubs are in, so no income verification is pending in June. The coverage period
  # opens in June (CO-565) and runs through the 12th month after the month the pregnancy ended:
  # August 2027 (CO-560; 42 U.S.C. 1396a(e)(16)(A), "including during a period of retroactive
  # eligibility"). So p1 is pregnant / eligible from June 2026 through August 2027, and in September
  # 2027, at 149.7% and no longer pregnant or postpartum, none / ineligible_income. Before the fix
  # she was none / ineligible_income in every month.
  # p3: his mother received Medical Assistance covering his birth through her retroactive coverage
  # (8.100.4.G.7, "This coverage also applies in instances where the mother received Medical
  # Assistance to cover the child's birth through retroactive Medical Assistance"), so he is an
  # eligible needy newborn from August 2026 (CO-087 reads her coverage period in the birth month).
  # Before the fix he was none (child category 142%, and 149.7% is over it with the 5% disregard).
