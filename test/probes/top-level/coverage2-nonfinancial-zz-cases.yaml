- id: ZZ-F1
  title: "CDHS review B-4: a 58-year-old who has used his three ABAWD months stays in the SNAP household as an ineligible member, his income prorated"
  # Built for the CDHS stakeholder review's B-4. Two brothers buy and prepare food together and apply on October 1, 2026.
  # p1, 58, has no dependents, is not exempt and did not work in July, August or September 2026, the first three months
  # of Colorado's fixed clock period that began July 1, 2026 (4.311.3.C.2), and received SNAP in each: three countable
  # months, so in October his ABAWD (able-bodied adult without dependents) status is limit_reached (H.R.1 sec. 10102
  # extends the time limit to age 64). He is an ineligible member (4.304.4.A.5): out of the household size, his $600
  # pension prorated (4.411.1.B.2, 7 CFR 273.11(c)(2)): 600 x 1/2 = 300 counted. p2, 50, works 130 hours ($1,500), so
  # he meets the work requirement and is within the limit.
  # Eligible household size 1 (it was 2 before the review). Gross 1500 + 300 = 1800 (ECE: at or below 200% FPL
  # for one, 2660); earned income deduction 20% x 1500 = 300; standard deduction 217; adjusted 1283. Shelter: rent
  # 900 + HCUA 616 = 1516, less half of 1283 (641.50) = 874.50, capped at 769 (no elderly or disabled member);
  # net 514. Maximum allotment for one 306 less 30% of 514 (154.20) = 151.80, rounded down to 151. Before the
  # review p1 stayed eligible: size 2, gross 2100, adjusted 1583, excess shelter 724.50, net 859, 562 - 257.70 = 304.
  as_of: "2026-10-01"
  case_facts:  # dual-entry audit 1.13-1.17, 5.9 (OQ-541): facts of the application and the home, once for the case, each formerly repeated on members
    home_heating_cost_arrangement: pays_vendor_directly  # dual-entry 1.13-1.14, SW-33: the neutral heating arrangement (was incurs_heating_cooling_cost p1 false, p2 true; non_heating_utility_cost_count 0; incurs_telephone_cost false on members)
    home_incurs_telephone_cost: false
    received_energy_assistance_within_twelve_months: false
    snap_application_date: "2026-10-01"
    snap_determination_is_recertification: false
  relationships:
    - [buys_prepares_with, p1, p2]
  persons:
