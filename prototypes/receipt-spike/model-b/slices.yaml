# Receipt spike, Model B: the three slices over the scalar partition.
- id: CO-3926
  name: "LEAP: a person's countable unearned income"
  identifier: leap_person_unearned_income
  kind: derived
  type: money
  scope: person-month
  program: LEAP
  meaning: "This person's countable unearned income for LEAP (9 CCR 2503-7 3.752.21-23): (1) the month's receipts of the sources LEAP counts, one month's income (3.752.22.A): pensions, unemployment, child support, Colorado Works and Adult Financial cash assistance (L), interest and dividends, rents, workforce payments, general assistance, in-home care allowances, uniformed services special pay, State veterans' annuities, charitable cash, migrant emergency assistance, State tax refunds and the unearned income no other fact names, AmeriCorps payments only at or above the minimum wage for the hours served (F), and Social Security without its cents (3.752.211.H), less income set aside under a PASS (DD) and the claim expenses of a workers' compensation award (3.752.211.D), not below zero; plus (2) the month's SSI without its cents (3.752.21.I); plus (3) lottery and gambling winnings and one-time payments not otherwise named received in the income verification period (3.752.21.A, C, D), less money from liquidating personal resources (GG) and insurance or injury proceeds spent on the costs they cover."
  precision: "Receipt spike, Model B. The excluded leaves (excludes) are never added, so no subtraction of a part is needed: educational assistance P, loans BB, reimbursements R-S, energy assistance T, income tax refunds EE, federally excluded payments F-N, crime victim compensation G, foster care and kinship payments U, diversion W, reverse mortgages X, housing utility allowances Y, G.I. Bill allowances Z, refugee resettlement AA, supportive services FF, retroactive Social Security, SSI and public assistance lump sums EE. A one-time payment of a named source is stated in that source's leaf, so a one-time payment of a counted source (a child support arrears payment) is read in the month received, not by the income verification period: the partition has no one-time dimension for named sources."
  excludes: [educational_assistance_received, loan_proceeds_received, expense_reimbursements_received, energy_assistance_received, tax_refunds_and_credits_received, federally_excluded_payments_received, crime_victim_compensation_received, foster_care_provider_payments_received, kinship_care_payments_received, tanf_diversion_payment_received, reverse_mortgage_payments_received, housing_utility_allowance_received, gi_bill_housing_and_food_allowances_received, refugee_resettlement_payments_received, tanf_supportive_service_payments_received, retroactive_social_security_lump_sum_received, retroactive_ssi_or_public_assistance_lump_sum_received]
  derived: [+, [max, 0, ["-", [+, pension_income, unemployment_income, child_support_received, tanf_cash_income, adult_financial_cash_income, tax_exempt_interest, [otherwise, taxable_interest_and_dividend_income, 0], [otherwise, rental_income_received, 0], [otherwise, workforce_program_payments_received, 0], [otherwise, general_or_emergency_assistance_received, 0], [otherwise, in_home_care_allowance_received, 0], [otherwise, uniformed_services_special_pay_received, 0], [otherwise, state_veteran_annuity_received, 0], [otherwise, charitable_need_based_cash_received, 0], [otherwise, migrant_farmworker_emergency_assistance_received, 0], [otherwise, property_or_food_tax_refund_received, 0], unearned_income_not_otherwise_named_taxable, unearned_income_not_otherwise_named_nontaxable, [case, [["<=", [otherwise, americorps_payments_received, 0], 0], 0], [[">=", ["/", americorps_payments_received, americorps_service_hours], colorado_minimum_wage], americorps_payments_received], [else, 0]], ["-", 0, [ceil, ["-", 0, social_security_income]]]], [+, [otherwise, pass_set_aside_income, 0], [otherwise, workers_compensation_claim_expense_amounts_received, 0]]]], ["-", 0, [ceil, ["-", 0, ssi_income]]], [otherwise, lottery_gambling_winnings_received_prior_thirty_days, [case, [[all, ["=", [otherwise, lottery_gambling_winnings_received, 0], 0], ["=", [at, [otherwise, lottery_gambling_winnings_received, 0], [month_before, [month]]], 0]], 0]]], [max, 0, ["-", [otherwise, one_time_payment_not_otherwise_named_prior_thirty_days, [case, [[all, ["=", [otherwise, one_time_payment_not_otherwise_named, 0], 0], ["=", [at, [otherwise, one_time_payment_not_otherwise_named, 0], [month_before, [month]]], 0]], 0]]], [+, [otherwise, resource_liquidation_proceeds_received_prior_thirty_days, 0], [otherwise, insurance_proceeds_spent_on_covered_costs_prior_thirty_days, 0]]]]]
  sources: [S2712, S2713, S2714, S2208, S1624, S3300, S3302, S3303]
  implemented: engine
  tags: [income]

- id: CO-331
  name: "SNAP: person unearned income"
  identifier: snap_person_unearned_income
  kind: derived
  type: money
  scope: person-month
  program: SNAP
  meaning: "The person's unearned income for the month for SNAP (7 CFR 273.9(b)(2)): the month's receipts of the sources SNAP counts (Social Security, SSI, pensions, unemployment, child support, Colorado Works and Adult Financial cash, interest and dividends, foster care and kinship payments, diversion and supportive services, housing utility allowances, G.I. Bill allowances, refugee resettlement payments, general assistance, in-home care allowances, uniformed services special pay, State veterans' annuities, State tax refunds, need-based charitable cash, energy assistance from a nonprofit or supplier and the unearned income no other fact names), plus substantial lottery winnings (4.403.I), rent net of its costs (4.404.D) and an income paid other than monthly at its payment times the 4.402.A.2 multiplier in place of what was received; less an overpayment recouped (D.1), child support turned over to the IV-D agency (D.2), a former spouse's share of military retirement (A.11), money for a person living elsewhere (B), PASS amounts (A.22), infrequent or irregular income within the quarterly limit (A), charitable cash within the quarterly limit (A.10) and, in a destitute household's application month, income received after the application date; not below zero."
  precision: "Receipt spike, Model B. Excluded leaves are not added (excludes). Rent is rental_income_received, a leaf, so the gross is not added and subtracted again. The periodic-income facts (CO-4330 to CO-4332) remain one such income per person: the partition has no per-receipt frequency."
  excludes: [educational_assistance_received, loan_proceeds_received, expense_reimbursements_received, energy_assistance_received, tax_refunds_and_credits_received, federally_excluded_payments_received, crime_victim_compensation_received, workforce_program_payments_received, reverse_mortgage_payments_received, americorps_payments_received, migrant_farmworker_emergency_assistance_received, one_time_payment_not_otherwise_named, retroactive_social_security_lump_sum_received, retroactive_ssi_or_public_assistance_lump_sum_received, rental_income_received]
  derived: [max, 0, ["-", ["-", [+, social_security_income, ssi_income, pension_income, unemployment_income, child_support_received, tanf_cash_income, adult_financial_cash_income, tax_exempt_interest, [otherwise, taxable_interest_and_dividend_income, 0], [otherwise, foster_care_provider_payments_received, 0], [otherwise, kinship_care_payments_received, 0], [otherwise, tanf_diversion_payment_received, 0], [otherwise, tanf_supportive_service_payments_received, 0], [otherwise, housing_utility_allowance_received, 0], [otherwise, gi_bill_housing_and_food_allowances_received, 0], [otherwise, refugee_resettlement_payments_received, 0], [otherwise, general_or_emergency_assistance_received, 0], [otherwise, in_home_care_allowance_received, 0], [otherwise, uniformed_services_special_pay_received, 0], [otherwise, state_veteran_annuity_received, 0], [otherwise, property_or_food_tax_refund_received, 0], [otherwise, charitable_need_based_cash_received, 0], [otherwise, energy_assistance_from_nonprofit_or_supplier_received, 0], unearned_income_not_otherwise_named_taxable, unearned_income_not_otherwise_named_nontaxable, [case, [snap_has_substantial_lottery_winnings, [otherwise, lottery_gambling_largest_single_game_winnings_received, [otherwise, lottery_gambling_winnings_received, 0]]], [else, 0]], snap_rental_income, [case, [[">", [otherwise, periodic_unearned_income_per_payment, 0], 0], ["-", ["*", periodic_unearned_income_per_payment, [lookup, snap_income_conversion_rate_table, periodic_unearned_income_frequency]], [otherwise, periodic_unearned_income_received, 0]]], [else, 0]]], [+, [otherwise, pass_set_aside_income, 0], ["-", [otherwise, overpayment_recoupment_withheld, 0], [otherwise, overpayment_recoupment_for_intentional_violation_withheld, 0]], [otherwise, child_support_received_transferred_to_child_support_agency, 0], [otherwise, military_retirement_paid_to_former_spouse, 0], [otherwise, income_received_for_person_living_elsewhere, 0], [case, [["<=", [+, infrequent_or_irregular_income_in_quarter, [sum_months, [months_from_to, [months_before, ["-", ["-", [month_of_year, [month]], 1], ["*", 3, ["-", 0, [ceil, ["-", 0, ["/", ["-", [month_of_year, [month]], 1], 3]]]]]], [month]], [months_after, ["-", 2, ["-", ["-", [month_of_year, [month]], 1], ["*", 3, ["-", 0, [ceil, ["-", 0, ["/", ["-", [month_of_year, [month]], 1], 3]]]]]]], [month]]], [at, [otherwise, infrequent_or_irregular_earned_income_received, 0], [that_month]]]], snap_irregular_income_quarterly_limit], [otherwise, infrequent_or_irregular_income_received, 0]], [else, 0]], [min, [otherwise, charitable_need_based_cash_received, 0], [max, 0, ["-", snap_charitable_cash_quarterly_limit, [sum_months, [months_from_to, [months_before, ["-", ["-", [month_of_year, [month]], 1], ["*", 3, ["-", 0, [ceil, ["-", 0, ["/", ["-", [month_of_year, [month]], 1], 3]]]]]], [month]], [month_before, [month]]], [at, [otherwise, charitable_need_based_cash_received, 0], [that_month]]]]]]]], [case, [snap_is_destitute_application_month, [otherwise, snap_unearned_income_received_after_application_date, 0]], [else, 0]]]]
  sources: [S1620, S42, S2951, S2964, S3111, S3112, S3100]
  implemented: engine
  tags: [income]

- id: CO-9940
  name: "Adult Financial: a person's counted unearned income other than SSI"
  identifier: af_counted_unearned_income
  kind: derived
  type: money
  scope: person-month
  program: AdultFinancial
  meaning: "The person's unearned income of the month that Adult Financial counts (9 CCR 2503-5 3.520.785, 3.520.786), other than SSI and the Adult Financial grant: Social Security, pensions, unemployment, Colorado Works grants, child support less arrears (P) and less one-third for an SSI-age child (K, (c)(11)), rents, lottery winnings (B.13), one-time payments, retroactive benefit lump sums, loans, reimbursements, kinship, diversion and supportive service payments, housing utility and G.I. Bill allowances, refugee payments, workforce payments, charitable cash, migrant assistance and the unearned income no other fact names; less PASS income (I), VA Aid and Attendance used for uncovered care (F), infrequent income (O) and life-threatening-condition gifts ((c)(21)). The one figure the client's income (CO-3831) and a relative's or sponsor's (CO-4720) read."
  precision: "Receipt spike, Model B."
  excludes: [educational_assistance_received, energy_assistance_received, tax_refunds_and_credits_received, federally_excluded_payments_received, general_or_emergency_assistance_received, in_home_care_allowance_received, crime_victim_compensation_received, reverse_mortgage_payments_received, foster_care_provider_payments_received, taxable_interest_and_dividend_income, tax_exempt_interest, property_or_food_tax_refund_received, uniformed_services_special_pay_received, americorps_payments_received, state_veteran_annuity_received, ssi_income, adult_financial_cash_income]
  derived: ["-", [+, social_security_income, pension_income, unemployment_income, tanf_cash_income, ["-", child_support_received, [otherwise, child_support_arrears_received, 0]], [case, [[all, [">", child_support_received, 0], af_is_ssi_child], ["-", 0, ["/", [max, 0, ["-", child_support_received, [otherwise, child_support_arrears_received, 0]]], af_child_support_exclusion_divisor]]], [else, 0]], [otherwise, rental_income_received, 0], [otherwise, lottery_gambling_winnings_received, 0], [otherwise, one_time_payment_not_otherwise_named, 0], [otherwise, retroactive_social_security_lump_sum_received, 0], [otherwise, retroactive_ssi_or_public_assistance_lump_sum_received, 0], [otherwise, loan_proceeds_received, 0], [otherwise, expense_reimbursements_received, 0], [otherwise, kinship_care_payments_received, 0], [otherwise, tanf_diversion_payment_received, 0], [otherwise, tanf_supportive_service_payments_received, 0], [otherwise, housing_utility_allowance_received, 0], [otherwise, gi_bill_housing_and_food_allowances_received, 0], [otherwise, refugee_resettlement_payments_received, 0], [otherwise, workforce_program_payments_received, 0], [otherwise, charitable_need_based_cash_received, 0], [otherwise, migrant_farmworker_emergency_assistance_received, 0], unearned_income_not_otherwise_named_taxable, unearned_income_not_otherwise_named_nontaxable], [+, [otherwise, pass_set_aside_income, 0], [otherwise, va_aid_and_attendance_used_for_uncovered_care, 0], af_excluded_infrequent_income, af_excluded_life_threatening_condition_gifts]]
  sources: [S1622, S2608, S2609, S3212]
  implemented: engine
  tags: [cash, income]

- id: CO-3831
  name: "Adult Financial: unearned income other than SSI"
  identifier: af_unearned_income_other_than_ssi
  kind: derived
  type: money
  scope: person-month
  program: AdultFinancial
  meaning: "As Model A's CO-3831: the counted unearned income (af_counted_unearned_income) plus ISM for an OAP or AND-CS client and refused income, less the expenses of producing the receipts, never below zero."
  derived: [max, 0, ["-", [+, af_counted_unearned_income, [case, [[any, af_is_oap_age, af_and_cs_eligible], [min, af_in_kind_support_and_maintenance, af_ism_maximum]], [else, 0]], [otherwise, af_refused_potential_income, 0]], [otherwise, unearned_income_offsetting_expenses, 0]]]
  sources: [S1622, S1002, S1012, S2610, S2623, S3212]
  implemented: engine
  tags: [cash, income]

- id: CO-4720
  name: "Adult Financial: a deemed relative's or sponsor's unearned income after exemptions"
  identifier: af_relative_deemable_unearned_income
  kind: derived
  type: money
  scope: person-month
  program: AdultFinancial
  meaning: "As Model A's CO-4720: the counted unearned income (af_counted_unearned_income) plus SSI and the Adult Financial grant, less the expenses of producing the receipts, never below zero."
  derived: [max, 0, ["-", [+, af_counted_unearned_income, ssi_income, adult_financial_cash_income], [otherwise, unearned_income_offsetting_expenses, 0]]]
  sources: [S2608, S3500, S1632]
  implemented: engine
  tags: [cash, income]
