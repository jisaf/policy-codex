- id: CO-9915
  name: "LEAP: a person's income set aside"
  identifier: leap_receipts_set_aside
  kind: derived
  type: money
  scope: person-month
  program: LEAP
  meaning: "The parts of the person's recurring receipts of the month set aside under a Plan for Achieving Self-Support (9 CCR 2503-7 3.752.23.DD) or paid in a workers' compensation award for the claim's medical, legal or related expenses (3.752.211.D)."
  derived: [sum_receipts, receipts, [all, [received_in, [month]], [not, ["=", [receipt, frequency], once]]], [+, [receipt, pass_set_aside], [receipt, claim_expense]]]
  sources: [S3300, S3595]
  implemented: engine
  tags: [income]

- id: CO-9916
  name: "LEAP: a person's one-time receipts in the income verification period"
  identifier: leap_one_time_receipts_in_period
  kind: derived
  type: money
  scope: person-month
  program: LEAP
  meaning: "The person's receipts paid once that LEAP's counting table counts (inheritances, gifts, prizes, insurance and injury proceeds, lottery winnings: 9 CCR 2503-7 3.752.21.A, C, D) and that were received in the income verification period, from the same date of the month before the application date through the application date (3.751.1, 3.752.22.A), other than a retroactive lump-sum benefit (3.752.23.EE), less the part of insurance or injury proceeds spent on the costs they cover (3.752.21.C-D) and the claim expenses a one-time workers' compensation award includes (3.752.211.D)."
  precision: "A receipt stated by month only is outside the period when its month is before the month the period starts in or after the application month; otherwise its date is needed, and the result is unknown (cannot determine)."
  derived: [sum_receipts, receipts, [all, ["=", [receipt, frequency], once], ["=", [lookup, leap_receipt_treatment_table, [receipt, kind]], counted], [not, [receipt, retroactive]], [case, [[unknown, [receipt, date]], [case, [[any, ["<", [receipt, month], [month_of, leap_income_verification_period_start]], [">", [receipt, month], [month_of, leap_application_date]]], false]]], [else, [all, [">=", [receipt, date], leap_income_verification_period_start], ["<=", [receipt, date], leap_application_date]]]]], ["-", [receipt, amount], [+, [receipt, spent_on_covered_costs], [receipt, claim_expense]]]]
  sources: [S2712, S2713, S2714, S3303, S2208]
  implemented: engine
  tags: [income]

- id: CO-3926
  name: "LEAP: a person's countable unearned income"
  identifier: leap_person_unearned_income
  kind: derived
  type: money
  scope: person-month
  program: LEAP
  meaning: "This person's countable unearned income for LEAP (9 CCR 2503-7 3.752.21-23): the counted recurring receipts and Social Security without its cents, less the income set aside, not below zero; plus SSI without its cents; plus the counted one-time receipts of the income verification period."
  precision: "Receipt spike, Model A. Replaces CO-3926's former tree and CO-3913 (for LEAP), CO-4511, CO-4961, CO-4962 and CO-4069, and their facts CO-3911, CO-4065 to CO-4068, CO-4507 to CO-4509 and CO-4960. What is excluded is the counting table's (leap_receipt_treatment_table), one row per kind of receipt with its paragraph of 3.752.23."
  derived: [+, [max, 0, ["-", [+, leap_counted_recurring_receipts, leap_social_security_whole_dollars], leap_receipts_set_aside]], leap_ssi_whole_dollars, leap_one_time_receipts_in_period]
  sources: [S2712, S2713, S2714, S2208, S1624, S3300, S3302, S3303, S3304, S3306, S3307]
  implemented: engine
  tags: [income]
  open: [OQ-681]
