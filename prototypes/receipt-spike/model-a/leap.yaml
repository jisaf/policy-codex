- id: CO-9910
  name: "LEAP: how each kind of receipt is treated"
  identifier: leap_receipt_treatment_table
  kind: parameter
  type: table keyed by option
  scope: global
  program: LEAP
  meaning: "LEAP's counting table (9 CCR 2503-7 3.752.21-23): for each kind of receipt, counted (3.752.21 counts \"payments from any other source\") or excluded, with the paragraph that excludes it: educational_assistance P; loan BB; reimbursement R, S; energy_assistance and energy_assistance_nonprofit_or_supplier T (and LEAP's own benefit); tax_refund_or_credit EE; federally_excluded_payment F, H, I, K-N; crime_victim_compensation G; foster_care_payment and kinship_care_payment U; colorado_works_diversion W; reverse_mortgage X; housing_utility_allowance Y; gi_bill_housing_food_allowance Z; refugee_resettlement AA; colorado_works_supportive_services FF; resource_liquidation GG. americorps is excluded only when its payments for the hours served are below the minimum wage (F): counted_at_or_above_minimum_wage."
  precision: "Every kind of the receipts list has a row; a kind with no row is unknown, reported as a lookup miss, never counted by default. The kinds LEAP counts by silence in the current ledger (pension through migrant_farmworker_emergency_assistance) are listed as counted so the LEAP owner sees each one."
  versions:
    - from: "2000-01-01"
      value: {social_security: counted, ssi: counted, pension: counted, unemployment_compensation: counted, child_support: counted, child_support_arrears: counted, colorado_works_cash: counted, adult_financial_cash: counted, tax_exempt_interest: counted, interest_and_dividends: counted, rental_income: counted, workers_compensation: counted, lottery_gambling: counted, other_one_time: counted, resource_liquidation: excluded, educational_assistance: excluded, loan: excluded, reimbursement: excluded, energy_assistance: excluded, energy_assistance_nonprofit_or_supplier: excluded, tax_refund_or_credit: excluded, property_or_food_tax_refund: counted, federally_excluded_payment: excluded, crime_victim_compensation: excluded, foster_care_payment: excluded, kinship_care_payment: excluded, colorado_works_diversion: excluded, colorado_works_supportive_services: excluded, reverse_mortgage: excluded, housing_utility_allowance: excluded, gi_bill_housing_food_allowance: excluded, refugee_resettlement: excluded, americorps: counted_at_or_above_minimum_wage, workforce_program_payment: counted, general_or_emergency_assistance: counted, in_home_care_allowance: counted, va_aid_and_attendance: counted, uniformed_services_special_pay: counted, state_veteran_annuity: counted, charitable_need_based_cash: counted, migrant_farmworker_emergency_assistance: counted, other_taxable: counted, other_nontaxable: counted}
      source: S1624
  sources: [S1624, S2208, S3300, S3302, S2714]
  tags: [income]

- id: CO-9911
  name: "LEAP: the first day of the income verification period"
  identifier: leap_income_verification_period_start
  kind: derived
  type: calendar date
  scope: case
  program: LEAP
  meaning: "The first day of the income verification period (9 CCR 2503-7 3.751.1): the same date of the month before the application date, found as the application date less the number of days in the month before it."
  precision: "For an application on the 29th to 31st of a month whose preceding month is shorter, the result is early in the application month; the rule's \"same date of the prior month\" does not exist then (open)."
  derived: [days_after, ["-", 0, [days_between, [first_day, [month_before, [month_of, leap_application_date]]], [first_day, [month_of, leap_application_date]]]], leap_application_date]
  sources: [S2712]
  implemented: engine
  tags: [income]


- id: CO-9912
  name: "LEAP: a person's counted recurring receipts"
  identifier: leap_counted_recurring_receipts
  kind: derived
  type: money
  scope: person-month
  program: LEAP
  meaning: "The person's recurring receipts of the month that LEAP's counting table counts, other than Social Security and SSI (each without its cents, below), at the amount received in the month, one month's income (9 CCR 2503-7 3.752.22.A); and AmeriCorps payments at or above the minimum wage for the hours served (3.752.23.F)."
  derived: [+, [sum_receipts, receipts, [all, [received_in, [month]], [not, ["=", [receipt, frequency], once]], ["=", [lookup, leap_receipt_treatment_table, [receipt, kind]], counted], [not, [in, [receipt, kind], [social_security, ssi]]]], [receipt, amount]], [sum_receipts, receipts, [all, [received_in, [month]], [not, ["=", [receipt, frequency], once]], ["=", [lookup, leap_receipt_treatment_table, [receipt, kind]], counted_at_or_above_minimum_wage]], [case, [[">=", ["/", [receipt, amount], [receipt, hours_served]], colorado_minimum_wage], [receipt, amount]], [else, 0]]]]
  sources: [S2713, S2208]
  implemented: engine
  tags: [income]

