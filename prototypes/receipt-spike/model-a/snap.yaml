- id: CO-9920
  name: "SNAP: how each kind of receipt is treated"
  identifier: snap_receipt_treatment_table
  kind: parameter
  type: table keyed by option
  scope: global
  program: SNAP
  meaning: "SNAP's counting table (7 CFR 273.9(b)(2), (c); 10 CCR 2506-1 4.403, 4.405): for each kind of receipt, counted, excluded with the paragraph that excludes it, or a named special rule. Excluded: educational_assistance 4.405.1; loan F (reverse_mortgage F); reimbursement I; energy_assistance A.7 (energy_assistance_nonprofit_or_supplier is counted, H.7); tax_refund_or_credit A.20; federally_excluded_payment A.2-A.4, A.14, A.18, A.23, A.26, A.28; americorps A.4; workforce_program_payment A.6, A.8; migrant_farmworker_emergency_assistance A.15; crime_victim_compensation A.27. Special: rental_income is counted net of its costs (4.404.D, snap_rental_income); charitable_need_based_cash is counted beyond snap_charitable_cash_quarterly_limit a quarter (A.10); lottery_gambling is counted only as substantial winnings in the month received (4.403.I). A receipt paid once is a nonrecurring lump sum, excluded whatever its kind (E), except substantial lottery winnings."
  precision: "Every kind has a row; a kind with no row is unknown and reported, never counted by default."
  versions:
    - from: "2000-01-01"
      value: {social_security: counted, ssi: counted, pension: counted, unemployment_compensation: counted, child_support: counted, child_support_arrears: counted, colorado_works_cash: counted, adult_financial_cash: counted, tax_exempt_interest: counted, interest_and_dividends: counted, rental_income: net_of_costs, workers_compensation: counted, lottery_gambling: counted_if_substantial, other_one_time: counted, resource_liquidation: counted, educational_assistance: excluded, loan: excluded, reimbursement: excluded, energy_assistance: excluded, energy_assistance_nonprofit_or_supplier: counted, tax_refund_or_credit: excluded, property_or_food_tax_refund: counted, federally_excluded_payment: excluded, crime_victim_compensation: excluded, foster_care_payment: counted, kinship_care_payment: counted, colorado_works_diversion: counted, colorado_works_supportive_services: counted, reverse_mortgage: excluded, housing_utility_allowance: counted, gi_bill_housing_food_allowance: counted, refugee_resettlement: counted, americorps: excluded, workforce_program_payment: excluded, general_or_emergency_assistance: counted, in_home_care_allowance: counted, va_aid_and_attendance: counted, uniformed_services_special_pay: counted, state_veteran_annuity: counted, charitable_need_based_cash: counted_beyond_quarterly_limit, migrant_farmworker_emergency_assistance: excluded, other_taxable: counted, other_nontaxable: counted}
      source: S3100
  sources: [S1620, S42, S2204, S3100, S3102, S3103, S3104, S3105, S3107, S3108, S3109, S3110, S2951, S3111]
  tags: [snap, income]

- id: CO-9921
  name: "SNAP: a person's counted recurring receipts"
  identifier: snap_counted_recurring_receipts
  kind: derived
  type: money
  scope: person-month
  program: SNAP
  meaning: "The person's recurring receipts for the month that SNAP's counting table counts (counted or counted beyond the quarterly limit), each at its monthly amount: a receipt paid weekly, every two weeks, twice a month or less often than monthly at its payment times the 4.402.A.2 multiplier (snap_income_conversion_rate_table; 7 CFR 273.10(c)(2)(i)), counted in every month when paid less often than monthly, and any other receipt at the amount received in the month; less the parts of those receipts 4.405 excludes: an overpayment recouped from the same source other than for an intentional failure to comply (D.1), child support turned over to the IV-D agency (D.2), a former spouse's share of military retirement (A.11), money received for a person living elsewhere (B) and income set aside under a PASS (A.22)."
  precision: "Receipt spike, Model A. A receipt paid once is not here (4.405.E). Replaces the periodic-income facts (CO-4330 to CO-4332: one such income per person), which a record's frequency and per_payment state for each receipt."
  derived: [sum_receipts, receipts, [all, [not, ["=", [receipt, frequency], once]], [in, [lookup, snap_receipt_treatment_table, [receipt, kind]], [counted, counted_beyond_quarterly_limit]], [any, [received_in, [month]], [in, [receipt, frequency], [every_other_month, quarterly, twice_a_year, annual]]]], ["-", [case, [[in, [receipt, frequency], [weekly, biweekly, semimonthly, every_other_month, quarterly, twice_a_year, annual]], ["*", [receipt, per_payment], [lookup, snap_income_conversion_rate_table, [receipt, frequency]]]], [else, [receipt, amount]]], [case, [[received_in, [month]], [+, ["-", [receipt, recouped], [receipt, recouped_for_intentional_violation]], [receipt, transferred_to_child_support_agency], [receipt, paid_to_former_spouse], [receipt, for_person_living_elsewhere], [receipt, pass_set_aside]]], [else, 0]]]]
  sources: [S1620, S42, S3112, S2050, S3100, S3102]
  implemented: engine
  tags: [snap, income]

- id: CO-9924
  name: "SNAP: infrequent or irregular unearned receipts in the calendar quarter"
  identifier: snap_irregular_unearned_receipts_in_quarter
  kind: derived
  type: money
  scope: person-month
  program: SNAP
  meaning: "The person's receipts marked infrequent or irregular in the months of the calendar quarter containing the month (4.405.A; 7 CFR 273.9(c)(2) \"in a quarter\"), whatever their kind."
  derived: [sum_months, [months_from_to, [months_before, ["-", ["-", [month_of_year, [month]], 1], ["*", 3, ["-", 0, [ceil, ["-", 0, ["/", ["-", [month_of_year, [month]], 1], 3]]]]]], [month]], [months_after, ["-", 2, ["-", ["-", [month_of_year, [month]], 1], ["*", 3, ["-", 0, [ceil, ["-", 0, ["/", ["-", [month_of_year, [month]], 1], 3]]]]]]], [month]]], [sum_receipts, receipts, [all, [receipt, irregular], [received_in, [that_month]]], [receipt, amount]]]
  sources: [S3128]
  implemented: engine
  tags: [snap, income]

- id: CO-9922
  name: "SNAP: excluded infrequent or irregular unearned receipts"
  identifier: snap_excluded_irregular_receipts
  kind: derived
  type: money
  scope: person-month
  program: SNAP
  meaning: "The month's counted receipts marked infrequent or irregular, when the calendar quarter's infrequent or irregular income, unearned (snap_irregular_unearned_receipts_in_quarter) and earned (infrequent_or_irregular_earned_income_received over the quarter), is no more than snap_irregular_income_quarterly_limit (4.405.A); otherwise 0."
  derived: [case, [["<=", [+, snap_irregular_unearned_receipts_in_quarter, [sum_months, [months_from_to, [months_before, ["-", ["-", [month_of_year, [month]], 1], ["*", 3, ["-", 0, [ceil, ["-", 0, ["/", ["-", [month_of_year, [month]], 1], 3]]]]]], [month]], [months_after, ["-", 2, ["-", ["-", [month_of_year, [month]], 1], ["*", 3, ["-", 0, [ceil, ["-", 0, ["/", ["-", [month_of_year, [month]], 1], 3]]]]]]], [month]]], [at, [otherwise, infrequent_or_irregular_earned_income_received, 0], [that_month]]]], snap_irregular_income_quarterly_limit], [sum_receipts, receipts, [all, [receipt, irregular], [received_in, [month]], [not, ["=", [receipt, frequency], once]], [in, [lookup, snap_receipt_treatment_table, [receipt, kind]], [counted, counted_beyond_quarterly_limit]]], [receipt, amount]]], [else, 0]]
  sources: [S3128]
  implemented: engine
  tags: [snap, income]

- id: CO-9923
  name: "SNAP: excluded need-based charitable cash"
  identifier: snap_excluded_charitable_receipts
  kind: derived
  type: money
  scope: person-month
  program: SNAP
  meaning: "The month's need-based charitable cash receipts up to what the earlier months of the calendar quarter left of snap_charitable_cash_quarterly_limit (4.405.A.10)."
  derived: [min, [sum_receipts, receipts, [all, ["=", [receipt, kind], charitable_need_based_cash], [received_in, [month]]], [receipt, amount]], [max, 0, ["-", snap_charitable_cash_quarterly_limit, [sum_months, [months_from_to, [months_before, ["-", ["-", [month_of_year, [month]], 1], ["*", 3, ["-", 0, [ceil, ["-", 0, ["/", ["-", [month_of_year, [month]], 1], 3]]]]]], [month]], [month_before, [month]]], [sum_receipts, receipts, [all, ["=", [receipt, kind], charitable_need_based_cash], [received_in, [that_month]]], [receipt, amount]]]]]]
  sources: [S3109]
  implemented: engine
  tags: [snap, income]

- id: CO-331
  name: "SNAP: person unearned income"
  identifier: snap_person_unearned_income
  kind: derived
  type: money
  scope: person-month
  program: SNAP
  meaning: "The person's unearned income for the month for SNAP (7 CFR 273.9(b)(2)): the counted recurring receipts (snap_counted_recurring_receipts), plus substantial lottery or gambling winnings received in the month (4.403.I: a single game's prize at least snap_resource_limit_elderly_disabled), plus rental income net of its costs (4.404.D), less the excluded infrequent or irregular receipts (4.405.A) and need-based charitable cash within the quarterly limit (A.10), less, in a destitute household's month of application, the unearned income received after the application date (4.406.1.A); not below zero."
  precision: "Receipt spike, Model A. Replaces CO-331's former tree and snap_excluded_unearned_income (CO-2339): the exclusions are rows of snap_receipt_treatment_table, the nonrecurring lump sum is a receipt paid once, and the recoupment, IV-D, former-spouse, elsewhere and PASS parts are fields of the receipt they come out of."
  derived: [max, 0, ["-", ["-", [+, snap_counted_recurring_receipts, [sum_receipts, receipts, [all, ["=", [receipt, kind], lottery_gambling], [received_in, [month]], [">=", [receipt, amount], snap_resource_limit_elderly_disabled]], [receipt, amount]], snap_rental_income], [+, snap_excluded_irregular_receipts, snap_excluded_charitable_receipts]], [case, [snap_is_destitute_application_month, [otherwise, snap_unearned_income_received_after_application_date, 0]], [else, 0]]]]
  sources: [S1620, S42, S2951, S2964, S3111, S3112]
  implemented: engine
  tags: [income]

- id: CO-2338
  name: "SNAP: excluded earned income"
  identifier: snap_excluded_earned_income
  kind: derived
  type: money
  scope: person-month
  program: SNAP
  meaning: "As CO-2338 (unchanged), with the quarter's infrequent or irregular unearned income read from the receipts (snap_irregular_unearned_receipts_in_quarter)."
  precision: "Receipt spike, Model A: only the quarter term changes."
  derived: [case, [snap_student_earnings_are_excluded, [+, snap_person_wages, snap_self_employment_income]], [else, [+, [otherwise, work_study_earnings, 0], ["*", snap_regular_wages_conversion_factor, [+, [case, [[">", [otherwise, wioa_on_the_job_training_wages, 0], 0], [case, [[all, ["<", [years_between, date_of_birth, [first_day, [month]]], snap_wioa_ojt_exclusion_age_limit], [any, [exists_related, [child, stepchild], [otherwise, [in_group, [P], lives_with], true]], [otherwise, snap_is_under_parental_control_of_household_member, false]]], wioa_on_the_job_training_wages], [else, 0]]], [else, 0]], [otherwise, summer_youth_employment_wages, 0], [otherwise, scsep_payments_received, 0], [otherwise, combat_zone_pay_received, 0], [otherwise, military_pay_education_deductions, 0]]], [case, [["<=", [+, snap_irregular_unearned_receipts_in_quarter, [sum_months, [months_from_to, [months_before, ["-", ["-", [month_of_year, [month]], 1], ["*", 3, ["-", 0, [ceil, ["-", 0, ["/", ["-", [month_of_year, [month]], 1], 3]]]]]], [month]], [months_after, ["-", 2, ["-", ["-", [month_of_year, [month]], 1], ["*", 3, ["-", 0, [ceil, ["-", 0, ["/", ["-", [month_of_year, [month]], 1], 3]]]]]]], [month]]], [at, [otherwise, infrequent_or_irregular_earned_income_received, 0], [that_month]]]], snap_irregular_income_quarterly_limit], [otherwise, infrequent_or_irregular_earned_income_received, 0]], [else, 0]]]]]
  sources: [S1620, S2204, S3100, S3101, S3108, S3109, S3128]
  implemented: engine
  tags: [snap, income]
